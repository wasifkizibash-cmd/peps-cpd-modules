#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"hod-sef-attainment","code":"SEA","passMark":80,"hours":"2 hours","accent":"#1F6FB2","accentSoft":"#E3EEF9","eyebrow":{"en":"Staff CPD · Heads of Department · SEF Writing","ar":"Staff CPD · Heads of Department · SEF Writing"},"title":{"en":"Writing the SEF for Attainment (KPI 1.1)","ar":"Writing the SEF for Attainment (KPI 1.1)"},"subtitle":{"en":"A self-paced guide for Heads of English, Mathematics and Science: what KPI 1.1 asks, how to read the PEPS assessment data, how to write a clear judgement for each of the four phases, and how to set steps for improvement that follow from the evidence.","ar":"A self-paced guide for Heads of English, Mathematics and Science: what KPI 1.1 asks, how to read the PEPS assessment data, how to write a clear judgement for each of the four phases, and how to set steps for improvement that follow from the evidence."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"About 2 hours, fully self-paced"},"standard":{"en":"KPI 1.1 Attainment · UAE School Inspection Framework (SPEA)","ar":"KPI 1.1 Attainment · UAE School Inspection Framework (SPEA)"},"source":{"en":"The UAE School Inspection Framework (SPEA), Cambridge and GL Assessment reporting guidance, and the PEPS SEF template (check the current documents; this CPD supports, and does not replace, them)","ar":"The UAE School Inspection Framework (SPEA), Cambridge and GL Assessment reporting guidance, and the PEPS SEF template (check the current documents; this CPD supports, and does not replace, them)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"What KPI 1.1 Asks, and the PEPS SEF Format","ar":"What KPI 1.1 Asks, and the PEPS SEF Format"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD helps you write the Attainment section of your department SEF so that every statement is a claim backed by evidence and linked to impact on students. By the end you will be able to: explain what KPI 1.1 is judging; choose and analyse the right data for your subject in each of the four phases; use the PEPS proportion terms correctly; write a \"PHASE X: JUDGEMENT\" narrative that is honest and specific; and set steps for improvement that follow from your findings. \u003cstrong>This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance.\u003c/strong>","ar":"This CPD helps you write the Attainment section of your department SEF so that every statement is a claim backed by evidence and linked to impact on students. By the end you will be able to: explain what KPI 1.1 is judging; choose and analyse the right data for your subject in each of the four phases; use the PEPS proportion terms correctly; write a \"PHASE X: JUDGEMENT\" narrative that is honest and specific; and set steps for improvement that follow from your findings. \u003cstrong>This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"A SEF is not a description of what the department does. It is an argument: \"this is how well our students reach the standard, this is the proof, and this is what we will do about the gaps.\" Inspectors and school leaders read dozens of SEFs. The ones that are trusted are short on adjectives and long on specific, checkable facts.","ar":"A SEF is not a description of what the department does. It is an argument: \"this is how well our students reach the standard, this is the proof, and this is what we will do about the gaps.\" Inspectors and school leaders read dozens of SEFs. The ones that are trusted are short on adjectives and long on specific, checkable facts."}},{"t":"h","c":{"en":"What KPI 1.1 Attainment is about","ar":"What KPI 1.1 Attainment is about"}},{"t":"p","c":{"en":"Attainment is about \u003cstrong>where students are now\u003c/strong> compared with a standard: the curriculum standard (what Cambridge, or the early-years curriculum, expects at that point) and external or international benchmarks. It is not the same as progress (KPI 1.2), which is about how far students have moved from their starting points. A strong SEF keeps the two apart: a department can have high attainment with little progress, or low attainment with strong progress, and the two judgements must not be mixed together.","ar":"Attainment is about \u003cstrong>where students are now\u003c/strong> compared with a standard: the curriculum standard (what Cambridge, or the early-years curriculum, expects at that point) and external or international benchmarks. It is not the same as progress (KPI 1.2), which is about how far students have moved from their starting points. A strong SEF keeps the two apart: a department can have high attainment with little progress, or low attainment with strong progress, and the two judgements must not be mixed together."}},{"t":"list","c":{"en":["\u003cstrong>Standard:\u003c/strong> how many students reach or exceed the expected curriculum standard, shown as a proportion with a figure.","\u003cstrong>Benchmarks:\u003c/strong> how results compare with external measures, such as Cambridge Checkpoint reports, GL Progress Test norm-group comparisons and, where you use them, international benchmark-style assessments.","\u003cstrong>Trends:\u003c/strong> whether results have risen, fallen or stayed flat over time, ideally over three years.","\u003cstrong>Strands and skills:\u003c/strong> where within the subject students are stronger or weaker (for example reading and writing, number and geometry, biology, chemistry and physics).","\u003cstrong>Groups:\u003c/strong> how boys and girls, Emirati students, students of determination (SEND), gifted and talented students and ESL language-level groups perform.","\u003cstrong>Validity:\u003c/strong> whether internal grades agree with external results, so that a reader can trust the figures."],"ar":["\u003cstrong>Standard:\u003c/strong> how many students reach or exceed the expected curriculum standard, shown as a proportion with a figure.","\u003cstrong>Benchmarks:\u003c/strong> how results compare with external measures, such as Cambridge Checkpoint reports, GL Progress Test norm-group comparisons and, where you use them, international benchmark-style assessments.","\u003cstrong>Trends:\u003c/strong> whether results have risen, fallen or stayed flat over time, ideally over three years.","\u003cstrong>Strands and skills:\u003c/strong> where within the subject students are stronger or weaker (for example reading and writing, number and geometry, biology, chemistry and physics).","\u003cstrong>Groups:\u003c/strong> how boys and girls, Emirati students, students of determination (SEND), gifted and talented students and ESL language-level groups perform.","\u003cstrong>Validity:\u003c/strong> whether internal grades agree with external results, so that a reader can trust the figures."]}},{"t":"h","c":{"en":"How the PEPS SEF is laid out","ar":"How the PEPS SEF is laid out"}},{"t":"p","c":{"en":"All Heads of Department write in the same format. Use it exactly, so that the SEF reads as one document and reviewers can compare departments.","ar":"All Heads of Department write in the same format. Use it exactly, so that the SEF reads as one document and reviewers can compare departments."}},{"t":"table","head":{"en":["Part of the SEF","What it contains","Your job"],"ar":["Part of the SEF","What it contains","Your job"]},"rows":[{"en":["Judgement table by phase","One row per KPI, with a judgement for Phase 1 (FS2), Phase 2 (Y1-Y6), Phase 3 (Y7-Y9) and Phase 4 (Y10-Y13)","Choose each grade from the scale and descriptors in the school's SEF template, after writing the narrative, not before"],"ar":["Judgement table by phase","One row per KPI, with a judgement for Phase 1 (FS2), Phase 2 (Y1-Y6), Phase 3 (Y7-Y9) and Phase 4 (Y10-Y13)","Choose each grade from the scale and descriptors in the school's SEF template, after writing the narrative, not before"]},{"en":["Narrative per phase","A paragraph headed \"PHASE X: JUDGEMENT\" for each phase, under each KPI or indicator","Write claim, evidence and impact, using proportion terms with figures"],"ar":["Narrative per phase","A paragraph headed \"PHASE X: JUDGEMENT\" for each phase, under each KPI or indicator","Write claim, evidence and impact, using proportion terms with figures"]},{"en":["Steps for improvement","A short list of actions that respond to the weaknesses you identified","Make each step SMART: action, owner, timescale and measure"],"ar":["Steps for improvement","A short list of actions that respond to the weaknesses you identified","Make each step SMART: action, owner, timescale and measure"]},{"en":["Evidence source column","The named documents behind each statement","List real documents (for example \"Y9 Cambridge Checkpoint Mathematics report, 2025\"), never \"various\""],"ar":["Evidence source column","The named documents behind each statement","List real documents (for example \"Y9 Cambridge Checkpoint Mathematics report, 2025\"), never \"various\""]}]},{"t":"h","c":{"en":"How a judgement is made","ar":"How a judgement is made"}},{"t":"p","c":{"en":"A judgement is a conclusion from the weight of evidence, not an average and not a feeling. Inspectors look at the whole picture for a phase: what proportion of students meet the standard, how that compares with benchmarks, whether it is improving, whether groups are doing equally well, and whether internal grades can be trusted. Use the grade scale and descriptors in the school's SEF template, and paraphrase their themes in your own words rather than copying wording from memory. Grade names such as Good, Acceptable or Very good are only examples here.","ar":"A judgement is a conclusion from the weight of evidence, not an average and not a feeling. Inspectors look at the whole picture for a phase: what proportion of students meet the standard, how that compares with benchmarks, whether it is improving, whether groups are doing equally well, and whether internal grades can be trusted. Use the grade scale and descriptors in the school's SEF template, and paraphrase their themes in your own words rather than copying wording from memory. Grade names such as Good, Acceptable or Very good are only examples here."}},{"t":"callout","k":"tip","title":{"en":"A PEPS example","ar":"A PEPS example"},"c":{"en":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. A past rating is a reminder of the standard of proof needed; it is never evidence in itself.","ar":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. A past rating is a reminder of the standard of proof needed; it is never evidence in itself."}},{"t":"h","c":{"en":"The writing habit: claim, evidence, impact","ar":"The writing habit: claim, evidence, impact"}},{"t":"steps","c":{"en":["\u003cstrong>Claim:\u003c/strong> state what is true, in one plain sentence. \"Attainment in Year 8 Mathematics is a strength.\"","\u003cstrong>Evidence:\u003c/strong> give the proportion and figure, the source, the comparison and the time. \"A large majority (71%) met the expected standard in the term 2 assessment, compared with 64% last year.\"","\u003cstrong>Impact:\u003c/strong> say what this means for students. \"So most students are ready for the Year 9 Checkpoint, but the remaining students need targeted support in algebra.\"","\u003cstrong>Check:\u003c/strong> remove vague words (good, strong, effective, improving) unless a figure follows."],"ar":["\u003cstrong>Claim:\u003c/strong> state what is true, in one plain sentence. \"Attainment in Year 8 Mathematics is a strength.\"","\u003cstrong>Evidence:\u003c/strong> give the proportion and figure, the source, the comparison and the time. \"A large majority (71%) met the expected standard in the term 2 assessment, compared with 64% last year.\"","\u003cstrong>Impact:\u003c/strong> say what this means for students. \"So most students are ready for the Year 9 Checkpoint, but the remaining students need targeted support in algebra.\"","\u003cstrong>Check:\u003c/strong> remove vague words (good, strong, effective, improving) unless a figure follows."]}},{"t":"callout","k":"warn","title":{"en":"Do not copy across phases","ar":"Do not copy across phases"},"c":{"en":"Phase 2 and Phase 3 results almost never look the same. If two phase narratives could be swapped without anyone noticing, one of them is not based on its own evidence. Each phase needs its own figures, its own comparison and its own weaknesses.","ar":"Phase 2 and Phase 3 results almost never look the same. If two phase narratives could be swapped without anyone noticing, one of them is not based on its own evidence. Each phase needs its own figures, its own comparison and its own weaknesses."}},{"t":"scenario","title":{"en":"Scenario: the confident sentence","ar":"Scenario: the confident sentence"},"c":{"en":"A draft says: \"Attainment in Science is good across the school because students work hard and teachers have high expectations.\" \u003cstrong>What is wrong?\u003c/strong> There is no figure, no source, no comparison, no group and no phase. Effort and expectations are possible causes, not evidence of attainment. A better version names the phase, states a proportion with a number (for example \"a large majority (68%) of Year 6 students reached the expected standard\"), cites the source and compares it with a benchmark or last year.","ar":"A draft says: \"Attainment in Science is good across the school because students work hard and teachers have high expectations.\" \u003cstrong>What is wrong?\u003c/strong> There is no figure, no source, no comparison, no group and no phase. Effort and expectations are possible causes, not evidence of attainment. A better version names the phase, states a proportion with a number (for example \"a large majority (68%) of Year 6 students reached the expected standard\"), cites the source and compares it with a benchmark or last year."}}],"checks":[{"id":"m1q1","q":{"en":"Which statement best describes the difference between attainment (KPI 1.1) and progress (KPI 1.2)?","ar":"Which statement best describes the difference between attainment (KPI 1.1) and progress (KPI 1.2)?"},"opts":[{"en":"Attainment is where students are against a standard now; progress is movement from their starting points","ar":"Attainment is where students are against a standard now; progress is movement from their starting points"},{"en":"Attainment is the grade on the end-of-year report; progress is the effort grade the teacher gives each student","ar":"Attainment is the grade on the end-of-year report; progress is the effort grade the teacher gives each student"},{"en":"Attainment looks at whole-school results only; progress looks at individual lessons and the work in students' books","ar":"Attainment looks at whole-school results only; progress looks at individual lessons and the work in students' books"},{"en":"Attainment is measured by external tests only; progress is measured by internal assessments only","ar":"Attainment is measured by external tests only; progress is measured by internal assessments only"}],"correct":0,"expl":{"en":"Attainment compares current outcomes with a standard, such as the curriculum expectation or an external benchmark. Progress compares outcomes with earlier starting points. The two must be kept separate in the SEF, because one can be high while the other is low.","ar":"Attainment compares current outcomes with a standard, such as the curriculum expectation or an external benchmark. Progress compares outcomes with earlier starting points. The two must be kept separate in the SEF, because one can be high while the other is low."}},{"id":"m1q2","q":{"en":"In the PEPS SEF format, what heads each phase narrative?","ar":"In the PEPS SEF format, what heads each phase narrative?"},"opts":[{"en":"A single whole-school summary paragraph that covers every phase together in one place","ar":"A single whole-school summary paragraph that covers every phase together in one place"},{"en":"\"PHASE X: JUDGEMENT\", written separately for each of the four phases under the KPI","ar":"\"PHASE X: JUDGEMENT\", written separately for each of the four phases under the KPI"},{"en":"A table of grades only, with the narrative kept in the appendix for inspectors to request later","ar":"A table of grades only, with the narrative kept in the appendix for inspectors to request later"},{"en":"The department's action plan, followed by the evidence and then the judgement at the end","ar":"The department's action plan, followed by the evidence and then the judgement at the end"}],"correct":1,"expl":{"en":"The PEPS format has a judgement table by phase, then a narrative headed \"PHASE X: JUDGEMENT\" for each phase, then steps for improvement and an evidence source column.","ar":"The PEPS format has a judgement table by phase, then a narrative headed \"PHASE X: JUDGEMENT\" for each phase, then steps for improvement and an evidence source column."}},{"id":"m1q3","q":{"en":"Which sentence follows the claim, evidence, impact pattern most completely?","ar":"Which sentence follows the claim, evidence, impact pattern most completely?"},"opts":[{"en":"Year 5 students are doing well in Mathematics and teachers are pleased with the standards reached by most of the class","ar":"Year 5 students are doing well in Mathematics and teachers are pleased with the standards reached by most of the class"},{"en":"Year 5 results are strong this year, and there has been a clear improvement in fractions work compared with earlier terms","ar":"Year 5 results are strong this year, and there has been a clear improvement in fractions work compared with earlier terms"},{"en":"Most (79%) of Year 5 students met the expected standard in the term 3 test, up from 70%, but fractions remain a gap","ar":"Most (79%) of Year 5 students met the expected standard in the term 3 test, up from 70%, but fractions remain a gap"},{"en":"A majority of Year 5 students met the expected standard, which shows that the department's teaching is highly effective","ar":"A majority of Year 5 students met the expected standard, which shows that the department's teaching is highly effective"}],"correct":2,"expl":{"en":"The correct option has a claim (most met the standard), a figure and source (79%, term 3 test), a comparison (up from 70%), and an impact with a weakness (fractions remain a gap). The others use vague adjectives or skip the evidence.","ar":"The correct option has a claim (most met the standard), a figure and source (79%, term 3 test), a comparison (up from 70%), and an impact with a weakness (fractions remain a gap). The others use vague adjectives or skip the evidence."}}]},{"id":"m2","title":{"en":"The Evidence Base: PEPS Assessment Data and How to Analyse It","ar":"The Evidence Base: PEPS Assessment Data and How to Analyse It"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before you write a single sentence, collect and read your data. Good SEF writing is mostly good analysis. This module sets out the assessments available at PEPS and how to use them for attainment. Facts about assessments in this module follow current school understanding; where details matter, check the current Cambridge, GL or SPEA document.","ar":"Before you write a single sentence, collect and read your data. Good SEF writing is mostly good analysis. This module sets out the assessments available at PEPS and how to use them for attainment. Facts about assessments in this module follow current school understanding; where details matter, check the current Cambridge, GL or SPEA document."}},{"t":"h","c":{"en":"The PEPS assessment landscape","ar":"The PEPS assessment landscape"}},{"t":"table","head":{"en":["Source","Years and subjects","What it gives you for attainment"],"ar":["Source","Years and subjects","What it gives you for attainment"]},"rows":[{"en":["Cambridge Primary Checkpoint","End of Year 6; English as a Second Language (0057), Mathematics (0096), Science (0097)","Scores on Cambridge's 0.0 to 6.0 scale and Cambridge's analysis reports showing strengths and weaknesses by topic or skill. Use the descriptions in the Cambridge report; do not invent your own mapping to levels or grades"],"ar":["Cambridge Primary Checkpoint","End of Year 6; English as a Second Language (0057), Mathematics (0096), Science (0097)","Scores on Cambridge's 0.0 to 6.0 scale and Cambridge's analysis reports showing strengths and weaknesses by topic or skill. Use the descriptions in the Cambridge report; do not invent your own mapping to levels or grades"]},{"en":["Cambridge Lower Secondary Checkpoint","End of Year 9; ESL (0876), Mathematics (0862), Science (0893)","The same 0.0 to 6.0 scale and analysis reports, for Phase 3"],"ar":["Cambridge Lower Secondary Checkpoint","End of Year 9; ESL (0876), Mathematics (0862), Science (0893)","The same 0.0 to 6.0 scale and analysis reports, for Phase 3"]},{"en":["GL Progress Tests","English, Mathematics and Science in Years 4, 6, 8 and 10, every year","Age-standardised scores (average 100, standard deviation 15 in GL's standard reporting), stanines (1 to 9), percentile-type comparisons with a norm group, and item or strand analysis. Check which norm group your report uses"],"ar":["GL Progress Tests","English, Mathematics and Science in Years 4, 6, 8 and 10, every year","Age-standardised scores (average 100, standard deviation 15 in GL's standard reporting), stanines (1 to 9), percentile-type comparisons with a norm group, and item or strand analysis. Check which norm group your report uses"]},{"en":["International benchmarks","PISA (OECD; 15-year-olds); TIMSS (IEA; Grade 4 and Grade 8; mathematics and science); PIRLS (IEA; Grade 4 reading)","A check on international comparison. TIMSS and PIRLS Grade 4 usually map to Year 5, TIMSS Grade 8 to Year 9, PISA age 15 to Year 10 or 11"],"ar":["International benchmarks","PISA (OECD; 15-year-olds); TIMSS (IEA; Grade 4 and Grade 8; mathematics and science); PIRLS (IEA; Grade 4 reading)","A check on international comparison. TIMSS and PIRLS Grade 4 usually map to Year 5, TIMSS Grade 8 to Year 9, PISA age 15 to Year 10 or 11"]},{"en":["Cambridge IGCSE and AS/A level or Edexcel IAL","Years 10-13, for example Mathematics 0580 Extended and sciences 0610, 0620, 0625","External examination outcomes for Phase 4, usually the strongest single source there"],"ar":["Cambridge IGCSE and AS/A level or Edexcel IAL","Years 10-13, for example Mathematics 0580 Extended and sciences 0610, 0620, 0625","External examination outcomes for Phase 4, usually the strongest single source there"]},{"en":["Internal sources","End-of-term and unit assessments, teacher assessment, work scrutiny, moderation, CAT4 or other baseline data","Evidence for years without external tests, and the strand detail that external reports may lack"],"ar":["Internal sources","End-of-term and unit assessments, teacher assessment, work scrutiny, moderation, CAT4 or other baseline data","Evidence for years without external tests, and the strand detail that external reports may lack"]},{"en":["FS2 observation","Foundation Stage 2","Observation and teacher assessment against the early-years curriculum"],"ar":["FS2 observation","Foundation Stage 2","Observation and teacher assessment against the early-years curriculum"]}]},{"t":"callout","k":"warn","title":{"en":"Years without external data","ar":"Years without external data"},"c":{"en":"Checkpoint is taken in Years 6 and 9 only, and GL in Years 4, 6, 8 and 10 only. For Years 1-3, 5, 7 and 12-13 your attainment evidence is internal, so moderation and the link to external benchmarks matter even more. Say clearly which years the external check covers and which it does not.","ar":"Checkpoint is taken in Years 6 and 9 only, and GL in Years 4, 6, 8 and 10 only. For Years 1-3, 5, 7 and 12-13 your attainment evidence is internal, so moderation and the link to external benchmarks matter even more. Say clearly which years the external check covers and which it does not."}},{"t":"h","c":{"en":"Internal versus external: the validity check","ar":"Internal versus external: the validity check"}},{"t":"p","c":{"en":"Internal grades are only trustworthy if they agree with external results. Put them side by side. If 84% of Year 9 students are \"at or above expected\" in your own assessments but the Checkpoint report shows far weaker performance in the same strands, the SEF cannot rely on the internal figure. Report the difference honestly and say what you will do (for example, moderate marking against Cambridge-style mark schemes).","ar":"Internal grades are only trustworthy if they agree with external results. Put them side by side. If 84% of Year 9 students are \"at or above expected\" in your own assessments but the Checkpoint report shows far weaker performance in the same strands, the SEF cannot rely on the internal figure. Report the difference honestly and say what you will do (for example, moderate marking against Cambridge-style mark schemes)."}},{"t":"steps","c":{"en":["List the internal measure and the external measure for the same cohort and subject.","Compare proportions meeting the standard on each. Note any large gap in either direction.","Look at strands: does the external report show a weak topic that internal tests did not reveal?","Decide the cause (assessment too easy, marking generous, different content, different cohort conditions) and record it.","Write the finding in the SEF, including where internal data is less reliable than external data."],"ar":["List the internal measure and the external measure for the same cohort and subject.","Compare proportions meeting the standard on each. Note any large gap in either direction.","Look at strands: does the external report show a weak topic that internal tests did not reveal?","Decide the cause (assessment too easy, marking generous, different content, different cohort conditions) and record it.","Write the finding in the SEF, including where internal data is less reliable than external data."]}},{"t":"h","c":{"en":"Trends, strands and groups","ar":"Trends, strands and groups"}},{"t":"list","c":{"en":["\u003cstrong>Trends:\u003c/strong> use three years where you have them. One year can be a different cohort, not a change in quality. Name the cohort size if it is small.","\u003cstrong>Strands:\u003c/strong> report the strongest and weakest strands from the Checkpoint or GL analysis, not just the overall figure.","\u003cstrong>Groups:\u003c/strong> compare boys and girls, Emirati students, students of determination (SEND), gifted and talented students and ESL language-level groups with the whole cohort. Use the same measure for each group.","\u003cstrong>Small numbers:\u003c/strong> if a group has very few students, avoid percentages that look dramatic; give the number of students and keep identities confidential."],"ar":["\u003cstrong>Trends:\u003c/strong> use three years where you have them. One year can be a different cohort, not a change in quality. Name the cohort size if it is small.","\u003cstrong>Strands:\u003c/strong> report the strongest and weakest strands from the Checkpoint or GL analysis, not just the overall figure.","\u003cstrong>Groups:\u003c/strong> compare boys and girls, Emirati students, students of determination (SEND), gifted and talented students and ESL language-level groups with the whole cohort. Use the same measure for each group.","\u003cstrong>Small numbers:\u003c/strong> if a group has very few students, avoid percentages that look dramatic; give the number of students and keep identities confidential."]}},{"t":"table","head":{"en":["Question you want to answer","Best source","Caution"],"ar":["Question you want to answer","Best source","Caution"]},"rows":[{"en":["Do Year 9 students reach the expected standard compared with Cambridge's expectations?","Cambridge Lower Secondary Checkpoint report","Only the Year 9 cohort; one year of data"],"ar":["Do Year 9 students reach the expected standard compared with Cambridge's expectations?","Cambridge Lower Secondary Checkpoint report","Only the Year 9 cohort; one year of data"]},{"en":["How do Year 8 students compare with the norm group in Mathematics?","GL Progress Test (Year 8) stanines and standardised scores","Check which norm group the report uses"],"ar":["How do Year 8 students compare with the norm group in Mathematics?","GL Progress Test (Year 8) stanines and standardised scores","Check which norm group the report uses"]},{"en":["Are Year 3 students on track in English?","Internal assessment, moderated work and scrutiny","No external test in Year 3; state the moderation you did"],"ar":["Are Year 3 students on track in English?","Internal assessment, moderated work and scrutiny","No external test in Year 3; state the moderation you did"]},{"en":["How do our students compare internationally?","Benchmark-style assessments (PISA, TIMSS, PIRLS)","Report the sample, year group and limits; one strand among several"],"ar":["How do our students compare internationally?","Benchmark-style assessments (PISA, TIMSS, PIRLS)","Report the sample, year group and limits; one strand among several"]}]},{"t":"callout","k":"warn","title":{"en":"Say what the data does not show","ar":"Say what the data does not show"},"c":{"en":"Every analysis has limits: a small group, a missing year, a norm group that may not match our students, a test that covers only part of the curriculum. A SEF that names its own limits is more convincing than one that hides them. Never invent PEPS results to fill a gap; write \"no external data is available for this year group\" and explain what you used instead.","ar":"Every analysis has limits: a small group, a missing year, a norm group that may not match our students, a test that covers only part of the curriculum. A SEF that names its own limits is more convincing than one that hides them. Never invent PEPS results to fill a gap; write \"no external data is available for this year group\" and explain what you used instead."}},{"t":"scenario","title":{"en":"Scenario: international benchmarks","ar":"Scenario: international benchmarks"},"c":{"en":"A Head of Department wants to add a line saying \"our students perform above the international average in TIMSS-style tasks.\" \u003cstrong>What should they check first?\u003c/strong> Whether this was a real sample or practice with released items; which year group took it; how many students; and whether the comparison is valid. Where you use released items, practice papers or sample participation, report the sample, year group and limits honestly. Treat them as one strand of evidence that checks international comparison, not the only one.","ar":"A Head of Department wants to add a line saying \"our students perform above the international average in TIMSS-style tasks.\" \u003cstrong>What should they check first?\u003c/strong> Whether this was a real sample or practice with released items; which year group took it; how many students; and whether the comparison is valid. Where you use released items, practice papers or sample participation, report the sample, year group and limits honestly. Treat them as one strand of evidence that checks international comparison, not the only one."}}],"checks":[{"id":"m2q1","q":{"en":"A Head of Mathematics wants external evidence for Year 7 attainment. Which statement is correct?","ar":"A Head of Mathematics wants external evidence for Year 7 attainment. Which statement is correct?"},"opts":[{"en":"The Cambridge Lower Secondary Checkpoint is taken in Year 7, so its report can be used for the current cohort","ar":"The Cambridge Lower Secondary Checkpoint is taken in Year 7, so its report can be used for the current cohort"},{"en":"GL Progress Tests are taken every year in every year group, so the Year 7 score is available to cite","ar":"GL Progress Tests are taken every year in every year group, so the Year 7 score is available to cite"},{"en":"Year 7 attainment cannot be judged at all, so the SEF should leave the Phase 3 narrative blank for that year","ar":"Year 7 attainment cannot be judged at all, so the SEF should leave the Phase 3 narrative blank for that year"},{"en":"There is no Checkpoint or GL test in Year 7, so evidence is internal and the SEF should state its moderation","ar":"There is no Checkpoint or GL test in Year 7, so evidence is internal and the SEF should state its moderation"}],"correct":3,"expl":{"en":"Checkpoint is taken in Years 6 and 9 only and GL tests in Years 4, 6, 8 and 10. Year 7 evidence is therefore internal (assessments, scrutiny, moderation) and the SEF should state the moderation that supports it.","ar":"Checkpoint is taken in Years 6 and 9 only and GL tests in Years 4, 6, 8 and 10. Year 7 evidence is therefore internal (assessments, scrutiny, moderation) and the SEF should state the moderation that supports it."}},{"id":"m2q2","q":{"en":"Internal assessments show 84% of Year 9 students at or above the expected standard, but the Checkpoint report shows weaker results in the same strands. What is the best SEF response?","ar":"Internal assessments show 84% of Year 9 students at or above the expected standard, but the Checkpoint report shows weaker results in the same strands. What is the best SEF response?"},"opts":[{"en":"Report the difference, explain the likely cause and set a step to moderate marking against external standards","ar":"Report the difference, explain the likely cause and set a step to moderate marking against external standards"},{"en":"Use the 84% figure because it is the department's own data and the teachers know the students best","ar":"Use the 84% figure because it is the department's own data and the teachers know the students best"},{"en":"Remove the internal figure and quote the Checkpoint score alone, with no comment on the difference","ar":"Remove the internal figure and quote the Checkpoint score alone, with no comment on the difference"},{"en":"Average the two figures and report the result as the attainment proportion for the phase","ar":"Average the two figures and report the result as the attainment proportion for the phase"}],"correct":0,"expl":{"en":"A validity gap must be reported honestly. The SEF should show both figures, give the probable cause and set an improvement step, such as moderation against external mark schemes.","ar":"A validity gap must be reported honestly. The SEF should show both figures, give the probable cause and set an improvement step, such as moderation against external mark schemes."}},{"id":"m2q3","q":{"en":"What is the safest way to use a GL Progress Test standardised score of 104 in the SEF?","ar":"What is the safest way to use a GL Progress Test standardised score of 104 in the SEF?"},"opts":[{"en":"Say the score is above 100, so the cohort is in the top band, without naming the norm group","ar":"Say the score is above 100, so the cohort is in the top band, without naming the norm group"},{"en":"State the score, say 100 is the average in GL's standard reporting and name the norm group in your report","ar":"State the score, say 100 is the average in GL's standard reporting and name the norm group in your report"},{"en":"Convert 104 into a Cambridge Checkpoint score on the 0.0 to 6.0 scale so it matches other evidence","ar":"Convert 104 into a Cambridge Checkpoint score on the 0.0 to 6.0 scale so it matches other evidence"},{"en":"Quote the score on its own because the reader will know how to interpret it","ar":"Quote the score on its own because the reader will know how to interpret it"}],"correct":1,"expl":{"en":"GL standard reporting uses an average of 100 and a standard deviation of 15, but the norm group must be checked in the report. Do not convert GL scores into Cambridge scores or levels.","ar":"GL standard reporting uses an average of 100 and a standard deviation of 15, but the norm group must be checked in the report. Do not convert GL scores into Cambridge scores or levels."}}]},{"id":"m3","title":{"en":"English (ESL) Department: Attainment Across the Four Phases","ar":"English (ESL) Department: Attainment Across the Four Phases"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Every PEPS student learns English as a second language, so English attainment shapes access to every other subject. Your SEF should treat reading, writing, speaking and listening, grammar and vocabulary as separate strands, because a single \"English\" figure hides the pattern that matters most: students are often stronger at receptive skills (reading and listening) than productive skills (writing and speaking).","ar":"Every PEPS student learns English as a second language, so English attainment shapes access to every other subject. Your SEF should treat reading, writing, speaking and listening, grammar and vocabulary as separate strands, because a single \"English\" figure hides the pattern that matters most: students are often stronger at receptive skills (reading and listening) than productive skills (writing and speaking)."}},{"t":"h","c":{"en":"Data sources and typical analyses by phase","ar":"Data sources and typical analyses by phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Observation and teacher assessment against the early-years curriculum; phonics and early language checks; samples of children's talk and early mark-making","Proportion of children at the expected stage in listening and speaking, early reading and early writing; comparison with the previous cohort; boys and girls","Judging by activities offered rather than what children can do; one-off observations; no comparison to a standard"],"ar":["Phase 1: FS2","Observation and teacher assessment against the early-years curriculum; phonics and early language checks; samples of children's talk and early mark-making","Proportion of children at the expected stage in listening and speaking, early reading and early writing; comparison with the previous cohort; boys and girls","Judging by activities offered rather than what children can do; one-off observations; no comparison to a standard"]},{"en":["Phase 2: Y1-Y6","Termly reading and writing assessments; moderated writing samples; GL English (Years 4 and 6); Cambridge Primary Checkpoint ESL 0057 (Year 6); PIRLS-style reading tasks (Year 5, usually Grade 4)","Proportion meeting the year-group standard by strand; Year 6 Checkpoint strands compared with GL and internal data; reading versus writing gap; trend over three years","Treating Years 1-3 as if externally tested; ignoring the reading and writing gap; reporting one overall percentage"],"ar":["Phase 2: Y1-Y6","Termly reading and writing assessments; moderated writing samples; GL English (Years 4 and 6); Cambridge Primary Checkpoint ESL 0057 (Year 6); PIRLS-style reading tasks (Year 5, usually Grade 4)","Proportion meeting the year-group standard by strand; Year 6 Checkpoint strands compared with GL and internal data; reading versus writing gap; trend over three years","Treating Years 1-3 as if externally tested; ignoring the reading and writing gap; reporting one overall percentage"]},{"en":["Phase 3: Y7-Y9","Unit assessments and moderated writing; GL English (Year 8); Cambridge Lower Secondary Checkpoint ESL 0876 (Year 9)","Year 9 Checkpoint strands (reading, writing, use of English, listening where reported); Year 8 GL stanines; internal versus external agreement","Assuming Year 7 is judged by Checkpoint; internal grades much higher than the Checkpoint picture"],"ar":["Phase 3: Y7-Y9","Unit assessments and moderated writing; GL English (Year 8); Cambridge Lower Secondary Checkpoint ESL 0876 (Year 9)","Year 9 Checkpoint strands (reading, writing, use of English, listening where reported); Year 8 GL stanines; internal versus external agreement","Assuming Year 7 is judged by Checkpoint; internal grades much higher than the Checkpoint picture"]},{"en":["Phase 4: Y10-Y13","GL English (Year 10); IGCSE English as a Second Language or the English course followed, and AS/A level or IAL English where relevant; mock examinations","Proportion reaching the grades the school expects, compared with prior years; component or skill breakdown; mock-to-final accuracy","Quoting only the best grades; leaving out entry decisions that affected who sat the exam; confusing mocks with final results"],"ar":["Phase 4: Y10-Y13","GL English (Year 10); IGCSE English as a Second Language or the English course followed, and AS/A level or IAL English where relevant; mock examinations","Proportion reaching the grades the school expects, compared with prior years; component or skill breakdown; mock-to-final accuracy","Quoting only the best grades; leaving out entry decisions that affected who sat the exam; confusing mocks with final results"]}]},{"t":"callout","k":"warn","title":{"en":"Do not map scores to levels yourself","ar":"Do not map scores to levels yourself"},"c":{"en":"Cambridge Checkpoint scores are on a 0.0 to 6.0 scale and come with analysis reports. Use the descriptions in the Cambridge report rather than your own mapping to levels or grades. For GL, check the norm group before you compare.","ar":"Cambridge Checkpoint scores are on a 0.0 to 6.0 scale and come with analysis reports. Use the descriptions in the Cambridge report rather than your own mapping to levels or grades. For GL, check the norm group before you compare."}},{"t":"h","c":{"en":"Questions an English attainment analysis should answer","ar":"Questions an English attainment analysis should answer"}},{"t":"list","c":{"en":["Which strand is weakest in each phase, and is it the same strand over three years?","Do ESL language-level groups reach the standard at the same rate as the whole cohort? Name the group and the number of students.","How do boys and girls compare in writing and reading? In many schools writing is the larger gap.","Do Emirati students, students of determination and gifted and talented students show a different pattern? Say what the data does not show if numbers are small.","Do internal reading and writing grades agree with Checkpoint or GL strand reports?"],"ar":["Which strand is weakest in each phase, and is it the same strand over three years?","Do ESL language-level groups reach the standard at the same rate as the whole cohort? Name the group and the number of students.","How do boys and girls compare in writing and reading? In many schools writing is the larger gap.","Do Emirati students, students of determination and gifted and talented students show a different pattern? Say what the data does not show if numbers are small.","Do internal reading and writing grades agree with Checkpoint or GL strand reports?"]}},{"t":"table","head":{"en":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"],"ar":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"]},"rows":[{"en":["English results are good and students enjoy reading.","No phase, figure, source or comparison. Enjoyment is not attainment","Illustrative figures (not PEPS data): A large majority (68%) of Year 6 students reached the expected reading standard in the moderated assessment, compared with a majority (55%) in writing, so writing is the priority for Phase 2"],"ar":["English results are good and students enjoy reading.","No phase, figure, source or comparison. Enjoyment is not attainment","Illustrative figures (not PEPS data): A large majority (68%) of Year 6 students reached the expected reading standard in the moderated assessment, compared with a majority (55%) in writing, so writing is the priority for Phase 2"]},{"en":["Students are fluent speakers by the end of Year 9.","Unsupported; speaking is rarely measured on the same basis as reading","State the evidence used (speaking assessment, moderated recordings) and the proportion meeting the standard, or say that speaking is not yet assessed against a common standard"],"ar":["Students are fluent speakers by the end of Year 9.","Unsupported; speaking is rarely measured on the same basis as reading","State the evidence used (speaking assessment, moderated recordings) and the proportion meeting the standard, or say that speaking is not yet assessed against a common standard"]}]},{"t":"scenario","title":{"en":"Worked mini-example: Phase 3 English (illustrative)","ar":"Worked mini-example: Phase 3 English (illustrative)"},"c":{"en":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> in the Year 9 Cambridge Lower Secondary Checkpoint ESL report, the Head of English finds that reading is the strongest strand and writing the weakest. Internal assessment shows most (80%) students at or above the expected standard, but the writing strand in the Checkpoint report shows weaker performance than the internal figure suggests. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 3, most students (80% in the internal term 3 assessment) reach the expected standard in English. The Year 9 Checkpoint report confirms reading as a relative strength but shows writing as the weakest strand, and internal writing grades are higher than the external picture. Boys' writing is lower than girls' by 9 percentage points. So students are better prepared for reading tasks than for extended writing, and internal marking of writing needs moderation against Cambridge standards.\" \u003cbr>\u003cbr>Replace every figure with your own data. Notice that the paragraph names the source, compares internal with external, names a group, and states a consequence.","ar":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> in the Year 9 Cambridge Lower Secondary Checkpoint ESL report, the Head of English finds that reading is the strongest strand and writing the weakest. Internal assessment shows most (80%) students at or above the expected standard, but the writing strand in the Checkpoint report shows weaker performance than the internal figure suggests. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 3, most students (80% in the internal term 3 assessment) reach the expected standard in English. The Year 9 Checkpoint report confirms reading as a relative strength but shows writing as the weakest strand, and internal writing grades are higher than the external picture. Boys' writing is lower than girls' by 9 percentage points. So students are better prepared for reading tasks than for extended writing, and internal marking of writing needs moderation against Cambridge standards.\" \u003cbr>\u003cbr>Replace every figure with your own data. Notice that the paragraph names the source, compares internal with external, names a group, and states a consequence."}},{"t":"callout","k":"tip","title":{"en":"Language-level groups","ar":"Language-level groups"},"c":{"en":"Because all PEPS students are ESL learners, record the language-level groups used in your department and report them consistently. A reader should be able to tell whether students who joined recently, or who are at an earlier stage of English, are reaching the standard at a lower rate, and what the department does about it.","ar":"Because all PEPS students are ESL learners, record the language-level groups used in your department and report them consistently. A reader should be able to tell whether students who joined recently, or who are at an earlier stage of English, are reaching the standard at a lower rate, and what the department does about it."}},{"t":"callout","k":"warn","title":{"en":"Mixing English subject and English as a medium","ar":"Mixing English subject and English as a medium"},"c":{"en":"Do not use English results as evidence of attainment in Mathematics or Science, and do not use other departments' results as evidence for English. Each department reports its own subject. You may note where language is a barrier to attainment elsewhere, as a link, in the \"impact\" part of your narrative.","ar":"Do not use English results as evidence of attainment in Mathematics or Science, and do not use other departments' results as evidence for English. Each department reports its own subject. You may note where language is a barrier to attainment elsewhere, as a link, in the \"impact\" part of your narrative."}}],"checks":[{"id":"m3q1","q":{"en":"Which Phase 2 data source gives an external check for English in Year 6?","ar":"Which Phase 2 data source gives an external check for English in Year 6?"},"opts":[{"en":"Cambridge Lower Secondary Checkpoint ESL 0876, because it covers all of the primary years as well","ar":"Cambridge Lower Secondary Checkpoint ESL 0876, because it covers all of the primary years as well"},{"en":"GL English tests, which are taken in every year from Year 1 to Year 6 without exception","ar":"GL English tests, which are taken in every year from Year 1 to Year 6 without exception"},{"en":"Cambridge Primary Checkpoint ESL 0057, taken at the end of Year 6, and GL English in Year 6","ar":"Cambridge Primary Checkpoint ESL 0057, taken at the end of Year 6, and GL English in Year 6"},{"en":"PISA results for 15-year-olds, since they show where primary pupils will be later on","ar":"PISA results for 15-year-olds, since they show where primary pupils will be later on"}],"correct":2,"expl":{"en":"ESL 0057 is the Primary Checkpoint code and is taken at the end of Year 6; GL tests are taken in Years 4, 6, 8 and 10. 0876 is the Lower Secondary Checkpoint and PISA is for 15-year-olds.","ar":"ESL 0057 is the Primary Checkpoint code and is taken at the end of Year 6; GL tests are taken in Years 4, 6, 8 and 10. 0876 is the Lower Secondary Checkpoint and PISA is for 15-year-olds."}},{"id":"m3q2","q":{"en":"A Phase 3 draft says \"English attainment is high because most students are confident speakers.\" What is the main weakness?","ar":"A Phase 3 draft says \"English attainment is high because most students are confident speakers.\" What is the main weakness?"},"opts":[{"en":"It uses the term \"most\", which cannot be used in the SEF for any percentage figure at all","ar":"It uses the term \"most\", which cannot be used in the SEF for any percentage figure at all"},{"en":"It mentions speaking, which cannot be assessed in an ESL department as it is not tested externally","ar":"It mentions speaking, which cannot be assessed in an ESL department as it is not tested externally"},{"en":"It is too short, and the only change needed is to add more positive adjectives about the students","ar":"It is too short, and the only change needed is to add more positive adjectives about the students"},{"en":"It offers confidence as evidence, with no figure, source or comparison, and no strand breakdown","ar":"It offers confidence as evidence, with no figure, source or comparison, and no strand breakdown"}],"correct":3,"expl":{"en":"Confidence is a possible cause of attainment but is not evidence of it. The narrative needs a proportion with a figure, a named source, a comparison and the strand breakdown.","ar":"Confidence is a possible cause of attainment but is not evidence of it. The narrative needs a proportion with a figure, a named source, a comparison and the strand breakdown."}},{"id":"m3q3","q":{"en":"In an English department, Year 6 reading is at 68% meeting the expected standard and writing at 55%. Which wording uses the PEPS proportion terms correctly?","ar":"In an English department, Year 6 reading is at 68% meeting the expected standard and writing at 55%. Which wording uses the PEPS proportion terms correctly?"},"opts":[{"en":"A large majority (68%) met the standard in reading, and a majority (55%) in writing","ar":"A large majority (68%) met the standard in reading, and a majority (55%) in writing"},{"en":"Most (68%) met the standard in reading, and a large majority (55%) in writing","ar":"Most (68%) met the standard in reading, and a large majority (55%) in writing"},{"en":"A majority (68%) met the standard in reading, and a large minority (55%) in writing","ar":"A majority (68%) met the standard in reading, and a large minority (55%) in writing"},{"en":"Almost all (68%) met the standard in reading, and most (55%) in writing","ar":"Almost all (68%) met the standard in reading, and most (55%) in writing"}],"correct":0,"expl":{"en":"The PEPS bands are: almost all above 90%; most 75-90%; large majority 61-74%; majority 50-60%; large minority 31-49%; minority 16-30%; few up to 15%. So 68% is a large majority and 55% is a majority.","ar":"The PEPS bands are: almost all above 90%; most 75-90%; large majority 61-74%; majority 50-60%; large minority 31-49%; minority 16-30%; few up to 15%. So 68% is a large majority and 55% is a majority."}}]},{"id":"m4","title":{"en":"Mathematics Department: Attainment Across the Four Phases","ar":"Mathematics Department: Attainment Across the Four Phases"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Mathematics offers the richest external data at PEPS: Cambridge Checkpoint in Years 6 and 9, GL tests in Years 4, 6, 8 and 10, IGCSE Mathematics 0580 in Years 10-11 and Pearson Edexcel International AS/A level Mathematics in Years 12-13. That makes it easier to compare internal and external judgements, and harder to hide a gap. A strong Mathematics SEF reports by strand (number, algebra, geometry and measure, statistics and probability) rather than a single percentage.","ar":"Mathematics offers the richest external data at PEPS: Cambridge Checkpoint in Years 6 and 9, GL tests in Years 4, 6, 8 and 10, IGCSE Mathematics 0580 in Years 10-11 and Pearson Edexcel International AS/A level Mathematics in Years 12-13. That makes it easier to compare internal and external judgements, and harder to hide a gap. A strong Mathematics SEF reports by strand (number, algebra, geometry and measure, statistics and probability) rather than a single percentage."}},{"t":"h","c":{"en":"Data sources and typical analyses by phase","ar":"Data sources and typical analyses by phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Observation and teacher assessment of early number, shape, space and measure; samples of practical work","Proportion at the expected stage for counting, number recognition and early calculation; comparison with the previous cohort; groups","Counting that is rote only; no evidence of understanding; no comparison"],"ar":["Phase 1: FS2","Observation and teacher assessment of early number, shape, space and measure; samples of practical work","Proportion at the expected stage for counting, number recognition and early calculation; comparison with the previous cohort; groups","Counting that is rote only; no evidence of understanding; no comparison"]},{"en":["Phase 2: Y1-Y6","Termly assessments by strand; GL Mathematics (Years 4 and 6); Cambridge Primary Checkpoint Mathematics 0096 (Year 6); TIMSS-style tasks (Year 5, usually Grade 4)","Strand analysis (number, geometry and measure, statistics); Year 4 to Year 6 comparison of the same cohort; Year 6 Checkpoint versus internal; fluency versus problem solving","Reporting speed of recall as if it were reasoning; no strand detail; assuming Years 1-3 are externally checked"],"ar":["Phase 2: Y1-Y6","Termly assessments by strand; GL Mathematics (Years 4 and 6); Cambridge Primary Checkpoint Mathematics 0096 (Year 6); TIMSS-style tasks (Year 5, usually Grade 4)","Strand analysis (number, geometry and measure, statistics); Year 4 to Year 6 comparison of the same cohort; Year 6 Checkpoint versus internal; fluency versus problem solving","Reporting speed of recall as if it were reasoning; no strand detail; assuming Years 1-3 are externally checked"]},{"en":["Phase 3: Y7-Y9","Unit assessments; GL Mathematics (Year 8); Cambridge Lower Secondary Checkpoint Mathematics 0862 (Year 9); TIMSS-style tasks (Grade 8, usually Year 9)","Checkpoint strand analysis (for example algebra and geometry); stanines for Year 8; internal versus external; readiness for IGCSE","Teaching to the test; ignoring weak strands because the overall figure looks good"],"ar":["Phase 3: Y7-Y9","Unit assessments; GL Mathematics (Year 8); Cambridge Lower Secondary Checkpoint Mathematics 0862 (Year 9); TIMSS-style tasks (Grade 8, usually Year 9)","Checkpoint strand analysis (for example algebra and geometry); stanines for Year 8; internal versus external; readiness for IGCSE","Teaching to the test; ignoring weak strands because the overall figure looks good"]},{"en":["Phase 4: Y10-Y13","GL Mathematics (Year 10); IGCSE Mathematics 0580 (Extended tier by default) mocks and final results; Edexcel IAL AS/A level results (Years 12-13); CAT4 baseline where available; PISA-style tasks (Year 10 or 11)","Proportion reaching the grades the school expects; Extended tier entry; component analysis (paper by paper or unit by unit); mock-to-final accuracy; three-year trend","Reporting only the highest grades; not saying who was entered for which tier; mocks marked generously"],"ar":["Phase 4: Y10-Y13","GL Mathematics (Year 10); IGCSE Mathematics 0580 (Extended tier by default) mocks and final results; Edexcel IAL AS/A level results (Years 12-13); CAT4 baseline where available; PISA-style tasks (Year 10 or 11)","Proportion reaching the grades the school expects; Extended tier entry; component analysis (paper by paper or unit by unit); mock-to-final accuracy; three-year trend","Reporting only the highest grades; not saying who was entered for which tier; mocks marked generously"]}]},{"t":"callout","k":"tip","title":{"en":"Fluency and reasoning","ar":"Fluency and reasoning"},"c":{"en":"Separate procedural fluency (calculating accurately) from reasoning and problem solving (explaining, justifying, applying). A department can have high fluency and low reasoning. Item or strand analysis from Checkpoint and GL reports will often show this; say so in the SEF and link to the improvement step.","ar":"Separate procedural fluency (calculating accurately) from reasoning and problem solving (explaining, justifying, applying). A department can have high fluency and low reasoning. Item or strand analysis from Checkpoint and GL reports will often show this; say so in the SEF and link to the improvement step."}},{"t":"h","c":{"en":"Questions a Mathematics attainment analysis should answer","ar":"Questions a Mathematics attainment analysis should answer"}},{"t":"list","c":{"en":["Which strand (number, algebra, geometry and measure, statistics and probability) is weakest in each phase, and for how many years has this been so?","Do Year 9 Checkpoint results agree with the internal Year 9 end-of-year figure?","In Years 10-11, do the proportions reaching the school's expected IGCSE grades match the mock results? What does the Extended tier entry mean for the cohort?","In Years 12-13, how do AS/A level results compare with earlier years and with the target grades? State the cohort size, as it is small.","Are boys, girls, Emirati students, students of determination and gifted and talented students performing at similar rates in each strand?"],"ar":["Which strand (number, algebra, geometry and measure, statistics and probability) is weakest in each phase, and for how many years has this been so?","Do Year 9 Checkpoint results agree with the internal Year 9 end-of-year figure?","In Years 10-11, do the proportions reaching the school's expected IGCSE grades match the mock results? What does the Extended tier entry mean for the cohort?","In Years 12-13, how do AS/A level results compare with earlier years and with the target grades? State the cohort size, as it is small.","Are boys, girls, Emirati students, students of determination and gifted and talented students performing at similar rates in each strand?"]}},{"t":"table","head":{"en":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"],"ar":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"]},"rows":[{"en":["Mathematics results are excellent at IGCSE.","No cohort, grade or comparison; \"excellent\" is a judgement, not evidence","Illustrative figures (not PEPS data): Most (78%) of the 62 Year 11 students entered for Extended Mathematics 0580 achieved the grades the school expects, compared with a large majority (72%) last year"],"ar":["Mathematics results are excellent at IGCSE.","No cohort, grade or comparison; \"excellent\" is a judgement, not evidence","Illustrative figures (not PEPS data): Most (78%) of the 62 Year 11 students entered for Extended Mathematics 0580 achieved the grades the school expects, compared with a large majority (72%) last year"]},{"en":["Students are ready for the Year 9 Checkpoint.","Readiness is a claim without a source","State the internal assessment result, the strands it covers, and what the previous year's Checkpoint report showed for the same strands"],"ar":["Students are ready for the Year 9 Checkpoint.","Readiness is a claim without a source","State the internal assessment result, the strands it covers, and what the previous year's Checkpoint report showed for the same strands"]}]},{"t":"scenario","title":{"en":"Worked mini-example: Phase 2 Mathematics (illustrative)","ar":"Worked mini-example: Phase 2 Mathematics (illustrative)"},"c":{"en":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> the Head of Mathematics compares Year 4 GL standardised scores for the cohort now in Year 6 with their Year 6 GL scores, and with the Primary Checkpoint strand report. Internal assessment shows a large majority (70%) at the expected standard overall, but the Checkpoint report shows geometry and measure as the weakest strand. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 2, a large majority (70%) of Year 6 students reached the expected standard in the internal term 3 assessment. The Cambridge Primary Checkpoint report is consistent with this overall, but shows geometry and measure as the weakest strand, with 12 percentage points fewer students succeeding on these items than on number. A minority (24%) of students identified as gifted and talented did not reach the highest bands in problem solving. So students are secure in number but less secure in applying measurement, which will affect readiness for Year 7 algebra and geometry.\" \u003cbr>\u003cbr>Replace all figures with your own. Note how the strand, the group and the consequence are named.","ar":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> the Head of Mathematics compares Year 4 GL standardised scores for the cohort now in Year 6 with their Year 6 GL scores, and with the Primary Checkpoint strand report. Internal assessment shows a large majority (70%) at the expected standard overall, but the Checkpoint report shows geometry and measure as the weakest strand. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 2, a large majority (70%) of Year 6 students reached the expected standard in the internal term 3 assessment. The Cambridge Primary Checkpoint report is consistent with this overall, but shows geometry and measure as the weakest strand, with 12 percentage points fewer students succeeding on these items than on number. A minority (24%) of students identified as gifted and talented did not reach the highest bands in problem solving. So students are secure in number but less secure in applying measurement, which will affect readiness for Year 7 algebra and geometry.\" \u003cbr>\u003cbr>Replace all figures with your own. Note how the strand, the group and the consequence are named."}},{"t":"callout","k":"warn","title":{"en":"Be careful with tier and entry statements","ar":"Be careful with tier and entry statements"},"c":{"en":"At IGCSE, results depend on who was entered and for which tier. If Extended is the default, say so, and say how many students (if any) were entered for a different tier and why. A high percentage of top grades from a small, selected group tells a different story from the same percentage across the whole cohort.","ar":"At IGCSE, results depend on who was entered and for which tier. If Extended is the default, say so, and say how many students (if any) were entered for a different tier and why. A high percentage of top grades from a small, selected group tells a different story from the same percentage across the whole cohort."}}],"checks":[{"id":"m4q1","q":{"en":"Which pair of sources gives the best external check for Mathematics in Phase 3?","ar":"Which pair of sources gives the best external check for Mathematics in Phase 3?"},"opts":[{"en":"Cambridge Primary Checkpoint Mathematics 0096 in Year 9, and GL Mathematics in Year 7, both taken school-wide","ar":"Cambridge Primary Checkpoint Mathematics 0096 in Year 9, and GL Mathematics in Year 7, both taken school-wide"},{"en":"Cambridge Lower Secondary Checkpoint Mathematics 0862 in Year 9, and GL Mathematics in Year 8","ar":"Cambridge Lower Secondary Checkpoint Mathematics 0862 in Year 9, and GL Mathematics in Year 8"},{"en":"IGCSE Mathematics 0580 in Year 9, and GL Mathematics in Years 7 to 9 every term","ar":"IGCSE Mathematics 0580 in Year 9, and GL Mathematics in Years 7 to 9 every term"},{"en":"TIMSS Grade 4 results in Year 7, and GL Mathematics in Year 9 only, since the primary benchmark covers Year 7","ar":"TIMSS Grade 4 results in Year 7, and GL Mathematics in Year 9 only, since the primary benchmark covers Year 7"}],"correct":1,"expl":{"en":"Lower Secondary Checkpoint Mathematics 0862 is taken at the end of Year 9 and GL tests run in Year 8. 0096 is the primary code, IGCSE starts in Year 10, and TIMSS Grade 4 is a primary benchmark.","ar":"Lower Secondary Checkpoint Mathematics 0862 is taken at the end of Year 9 and GL tests run in Year 8. 0096 is the primary code, IGCSE starts in Year 10, and TIMSS Grade 4 is a primary benchmark."}},{"id":"m4q2","q":{"en":"A Year 11 IGCSE narrative says \"Mathematics results are excellent.\" What should the Head of Mathematics add first?","ar":"A Year 11 IGCSE narrative says \"Mathematics results are excellent.\" What should the Head of Mathematics add first?"},"opts":[{"en":"A list of all the awards won by the department's top students in the last few years","ar":"A list of all the awards won by the department's top students in the last few years"},{"en":"A description of how hard students work and the revision sessions the department runs","ar":"A description of how hard students work and the revision sessions the department runs"},{"en":"The cohort size, tier, proportion reaching the expected grades and a comparison","ar":"The cohort size, tier, proportion reaching the expected grades and a comparison"},{"en":"A statement that the department is confident the grades will rise next year","ar":"A statement that the department is confident the grades will rise next year"}],"correct":2,"expl":{"en":"A judgement is credible only when it is tied to a defined cohort, a proportion with a figure and a comparison. Effort and confidence are not evidence of attainment.","ar":"A judgement is credible only when it is tied to a defined cohort, a proportion with a figure and a comparison. Effort and confidence are not evidence of attainment."}},{"id":"m4q3","q":{"en":"A Checkpoint report shows geometry and measure as the weakest strand for the third year running, yet the overall internal figure is strong. What is the best SEF statement?","ar":"A Checkpoint report shows geometry and measure as the weakest strand for the third year running, yet the
