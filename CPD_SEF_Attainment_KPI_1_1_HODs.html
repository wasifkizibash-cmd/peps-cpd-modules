overall internal figure is strong. What is the best SEF statement?"},"opts":[{"en":"Leave the strand detail out of the SEF and report only the strong overall internal figure","ar":"Leave the strand detail out of the SEF and report only the strong overall internal figure"},{"en":"Describe geometry and measure as an area the department is already working on with no further detail","ar":"Describe geometry and measure as an area the department is already working on with no further detail"},{"en":"Say that the weak strand is caused by weak teaching and ask for staff changes","ar":"Say that the weak strand is caused by weak teaching and ask for staff changes"},{"en":"State the persistent strand weakness with the data, and make it a SMART step for improvement","ar":"State the persistent strand weakness with the data, and make it a SMART step for improvement"}],"correct":3,"expl":{"en":"A weakness that appears three years running is a priority and should be named with evidence and linked to a SMART step. Hiding it is not honest, and blaming individuals is not supported by attainment data alone.","ar":"A weakness that appears three years running is a priority and should be named with evidence and linked to a SMART step. Hiding it is not honest, and blaming individuals is not supported by attainment data alone."}}]},{"id":"m5","title":{"en":"Science Department: Attainment Across the Four Phases","ar":"Science Department: Attainment Across the Four Phases"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Science attainment has two parts that must be reported separately: \u003cstrong>scientific knowledge\u003c/strong> (biology, chemistry, physics) and \u003cstrong>working scientifically\u003c/strong> (planning, observing, handling data, drawing conclusions). A student can recall facts and still struggle to interpret a graph. Checkpoint and GL strand analysis, and examination papers that assess practical skills or data handling, make this visible.","ar":"Science attainment has two parts that must be reported separately: \u003cstrong>scientific knowledge\u003c/strong> (biology, chemistry, physics) and \u003cstrong>working scientifically\u003c/strong> (planning, observing, handling data, drawing conclusions). A student can recall facts and still struggle to interpret a graph. Checkpoint and GL strand analysis, and examination papers that assess practical skills or data handling, make this visible."}},{"t":"callout","k":"tip","title":{"en":"A PEPS example","ar":"A PEPS example"},"c":{"en":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. Use the same sources an inspector would: Year 6 Cambridge Primary Checkpoint Science 0097, GL Science in Years 4 and 6, and moderated internal assessment.","ar":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. Use the same sources an inspector would: Year 6 Cambridge Primary Checkpoint Science 0097, GL Science in Years 4 and 6, and moderated internal assessment."}},{"t":"h","c":{"en":"Data sources and typical analyses by phase","ar":"Data sources and typical analyses by phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Observation and teacher assessment of understanding of the world; children's talk about living things, materials and changes; photographs and notes of exploration","Proportion at the expected stage in knowledge and in curiosity and exploring; comparison with the previous cohort; groups","Describing activities rather than outcomes; no standard for comparison"],"ar":["Phase 1: FS2","Observation and teacher assessment of understanding of the world; children's talk about living things, materials and changes; photographs and notes of exploration","Proportion at the expected stage in knowledge and in curiosity and exploring; comparison with the previous cohort; groups","Describing activities rather than outcomes; no standard for comparison"]},{"en":["Phase 2: Y1-Y6","Termly assessments by strand; GL Science (Years 4 and 6); Cambridge Primary Checkpoint Science 0097 (Year 6); TIMSS-style tasks (Year 5, usually Grade 4)","Biology, chemistry, physics and working-scientifically strands; Year 4 to Year 6 comparison for the same cohort; Year 6 Checkpoint versus internal; vocabulary and language demands","Language barriers mistaken for knowledge gaps; no strand detail; Years 1-3 treated as externally tested"],"ar":["Phase 2: Y1-Y6","Termly assessments by strand; GL Science (Years 4 and 6); Cambridge Primary Checkpoint Science 0097 (Year 6); TIMSS-style tasks (Year 5, usually Grade 4)","Biology, chemistry, physics and working-scientifically strands; Year 4 to Year 6 comparison for the same cohort; Year 6 Checkpoint versus internal; vocabulary and language demands","Language barriers mistaken for knowledge gaps; no strand detail; Years 1-3 treated as externally tested"]},{"en":["Phase 3: Y7-Y9","Unit assessments and practical tasks; GL Science (Year 8); Cambridge Lower Secondary Checkpoint Science 0893 (Year 9); TIMSS-style tasks (Grade 8, usually Year 9)","Checkpoint strands (biology, chemistry, physics, working scientifically); Year 8 stanines; internal versus external; readiness for IGCSE sciences","Reporting only content tests; practical and data-handling skills unreported"],"ar":["Phase 3: Y7-Y9","Unit assessments and practical tasks; GL Science (Year 8); Cambridge Lower Secondary Checkpoint Science 0893 (Year 9); TIMSS-style tasks (Grade 8, usually Year 9)","Checkpoint strands (biology, chemistry, physics, working scientifically); Year 8 stanines; internal versus external; readiness for IGCSE sciences","Reporting only content tests; practical and data-handling skills unreported"]},{"en":["Phase 4: Y10-Y13","GL Science (Year 10); IGCSE Biology 0610, Chemistry 0620, Physics 0625 mocks and final results; AS/A level or IAL where relevant; PISA-style tasks (Year 10 or 11)","Proportion reaching the school's expected grades by subject; paper or component analysis (theory, practical or alternative to practical); mock-to-final accuracy; three-year trend","Combining all three sciences into one figure; not stating who sat which exam; mocks marked generously"],"ar":["Phase 4: Y10-Y13","GL Science (Year 10); IGCSE Biology 0610, Chemistry 0620, Physics 0625 mocks and final results; AS/A level or IAL where relevant; PISA-style tasks (Year 10 or 11)","Proportion reaching the school's expected grades by subject; paper or component analysis (theory, practical or alternative to practical); mock-to-final accuracy; three-year trend","Combining all three sciences into one figure; not stating who sat which exam; mocks marked generously"]}]},{"t":"h","c":{"en":"Questions a Science attainment analysis should answer","ar":"Questions a Science attainment analysis should answer"}},{"t":"list","c":{"en":["Which science (biology, chemistry or physics) is strongest and weakest in each phase, and has this changed over three years?","How do students perform on working-scientifically items compared with recall items?","How much does the language of science (key terms, command words, extended answers) affect results for ESL language-level groups?","Do internal practical grades agree with externally marked items on investigation and data?","What do boys, girls, Emirati students, students of determination and gifted and talented students show in each phase?"],"ar":["Which science (biology, chemistry or physics) is strongest and weakest in each phase, and has this changed over three years?","How do students perform on working-scientifically items compared with recall items?","How much does the language of science (key terms, command words, extended answers) affect results for ESL language-level groups?","Do internal practical grades agree with externally marked items on investigation and data?","What do boys, girls, Emirati students, students of determination and gifted and talented students show in each phase?"]}},{"t":"table","head":{"en":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"],"ar":["Weak SEF sentence","Why it is weak","Stronger version (replace figures with your own)"]},"rows":[{"en":["Science is a strength of the school.","No phase, figure, source or comparison","Illustrative figures (not PEPS data): Most (77%) of Year 6 students reached the expected standard in the internal assessment, and the Checkpoint report shows biology as the strongest strand and working scientifically as the weakest"],"ar":["Science is a strength of the school.","No phase, figure, source or comparison","Illustrative figures (not PEPS data): Most (77%) of Year 6 students reached the expected standard in the internal assessment, and the Checkpoint report shows biology as the strongest strand and working scientifically as the weakest"]},{"en":["Practical work is outstanding so attainment is high.","Links practical work to results without showing either","Show the proportion of students meeting the working-scientifically standard, how it was assessed and how it compares with the knowledge results"],"ar":["Practical work is outstanding so attainment is high.","Links practical work to results without showing either","Show the proportion of students meeting the working-scientifically standard, how it was assessed and how it compares with the knowledge results"]}]},{"t":"scenario","title":{"en":"Worked mini-example: Phase 4 Science (illustrative)","ar":"Worked mini-example: Phase 4 Science (illustrative)"},"c":{"en":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> in IGCSE Chemistry 0620, 54 Year 11 students sat the final examination. The Head of Science compares mock and final results by paper and finds that the alternative-to-practical or practical-based paper is the weakest. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 4, a large majority (70%) of Year 11 students achieved the grades the school expects in IGCSE Chemistry 0620, compared with a large majority (66%) last year. Physics (0625) results were lower, at a majority (58%). In all three sciences the practical-skills paper was the weakest component, and mock results were on average higher than final results. So the department should moderate mock marking more closely and teach planning and evaluation of experiments explicitly.\" \u003cbr>\u003cbr>Replace figures with your own. Notice how each science is reported separately, and how the mock-versus-final comparison is used as a validity check.","ar":"\u003cstrong>Illustrative figures (not PEPS data):\u003c/strong> in IGCSE Chemistry 0620, 54 Year 11 students sat the final examination. The Head of Science compares mock and final results by paper and finds that the alternative-to-practical or practical-based paper is the weakest. \u003cbr>\u003cbr>\u003cstrong>Draft narrative:\u003c/strong> \"In Phase 4, a large majority (70%) of Year 11 students achieved the grades the school expects in IGCSE Chemistry 0620, compared with a large majority (66%) last year. Physics (0625) results were lower, at a majority (58%). In all three sciences the practical-skills paper was the weakest component, and mock results were on average higher than final results. So the department should moderate mock marking more closely and teach planning and evaluation of experiments explicitly.\" \u003cbr>\u003cbr>Replace figures with your own. Notice how each science is reported separately, and how the mock-versus-final comparison is used as a validity check."}},{"t":"callout","k":"warn","title":{"en":"Do not generalise from one science to all","ar":"Do not generalise from one science to all"},"c":{"en":"Strong biology results do not show strong physics. Report each science separately in Phase 4 and give the strands for Phases 2 and 3. If the cohort for one subject is small, state the number and avoid dramatic percentages.","ar":"Strong biology results do not show strong physics. Report each science separately in Phase 4 and give the strands for Phases 2 and 3. If the cohort for one subject is small, state the number and avoid dramatic percentages."}},{"t":"callout","k":"warn","title":{"en":"Safety and ethics of data","ar":"Safety and ethics of data"},"c":{"en":"Use no names of students in the SEF, and keep group data confidential. Write \"a student of determination\" or \"a group of seven students\", not an identifiable description.","ar":"Use no names of students in the SEF, and keep group data confidential. Write \"a student of determination\" or \"a group of seven students\", not an identifiable description."}}],"checks":[{"id":"m5q1","q":{"en":"Which statement about Science strands is the most useful in a Phase 3 SEF narrative?","ar":"Which statement about Science strands is the most useful in a Phase 3 SEF narrative?"},"opts":[{"en":"Checkpoint 0893 shows chemistry strongest and working scientifically weakest, with figures for each","ar":"Checkpoint 0893 shows chemistry strongest and working scientifically weakest, with figures for each"},{"en":"Students enjoy science lessons and practical work, which supports high attainment generally","ar":"Students enjoy science lessons and practical work, which supports high attainment generally"},{"en":"Science results are good overall, with all strands performing at a similar level in each year group","ar":"Science results are good overall, with all strands performing at a similar level in each year group"},{"en":"Students achieve well in science because the laboratory is well equipped for experiments","ar":"Students achieve well in science because the laboratory is well equipped for experiments"}],"correct":0,"expl":{"en":"Strand-level findings with figures and a named source tell the reader where students are strong or weak. The others describe enjoyment, resources or a general result without evidence.","ar":"Strand-level findings with figures and a named source tell the reader where students are strong or weak. The others describe enjoyment, resources or a general result without evidence."}},{"id":"m5q2","q":{"en":"In IGCSE Science reporting for Phase 4, what is the best way to present results?","ar":"In IGCSE Science reporting for Phase 4, what is the best way to present results?"},"opts":[{"en":"Combine all three sciences into one percentage because the cohort sits them at the same time","ar":"Combine all three sciences into one percentage because the cohort sits them at the same time"},{"en":"Report Biology 0610, Chemistry 0620 and Physics 0625 separately, with cohort sizes","ar":"Report Biology 0610, Chemistry 0620 and Physics 0625 separately, with cohort sizes"},{"en":"Report only the highest grade achieved in any of the three sciences by each student","ar":"Report only the highest grade achieved in any of the three sciences by each student"},{"en":"Quote only the subject with the best results to show the strongest evidence","ar":"Quote only the subject with the best results to show the strongest evidence"}],"correct":1,"expl":{"en":"The sciences have different syllabuses and cohorts. Reporting them separately, with cohort sizes and trends, avoids hiding weaker subjects and gives a more accurate judgement.","ar":"The sciences have different syllabuses and cohorts. Reporting them separately, with cohort sizes and trends, avoids hiding weaker subjects and gives a more accurate judgement."}},{"id":"m5q3","q":{"en":"A Year 6 Science narrative states that \"Science attainment is Good because the school was rated Good in January 2025.\" What is wrong?","ar":"A Year 6 Science narrative states that \"Science attainment is Good because the school was rated Good in January 2025.\" What is wrong?"},"opts":[{"en":"The January 2025 inspection cannot be mentioned in a SEF under any circumstances at all","ar":"The January 2025 inspection cannot be mentioned in a SEF under any circumstances at all"},{"en":"The inspection rating applies to Phase 3 only, so it cannot be used for Phase 2","ar":"The inspection rating applies to Phase 3 only, so it cannot be used for Phase 2"},{"en":"A past inspection rating is not evidence of current attainment; the SEF must cite current data","ar":"A past inspection rating is not evidence of current attainment; the SEF must cite current data"},{"en":"Nothing is wrong, because an inspection judgement is the strongest evidence a school can quote","ar":"Nothing is wrong, because an inspection judgement is the strongest evidence a school can quote"}],"correct":2,"expl":{"en":"A past rating is a reminder of the standard needed, but the SEF must evidence the judgement again with current data such as Checkpoint, GL and moderated internal results.","ar":"A past rating is a reminder of the standard needed, but the SEF must evidence the judgement again with current data such as Checkpoint, GL and moderated internal results."}}]},{"id":"m6","title":{"en":"Writing the Judgement: PHASE X Narratives and Honest Grading","ar":"Writing the Judgement: PHASE X Narratives and Honest Grading"},"minutes":17,"blocks":[{"t":"p","c":{"en":"You have the data and have analysed it. Now you write. The narrative under each \"PHASE X: JUDGEMENT\" heading is the most-read part of your SEF, so it must be self-contained: a reader who sees only this paragraph should understand the judgement, the evidence and the main weakness.","ar":"You have the data and have analysed it. Now you write. The narrative under each \"PHASE X: JUDGEMENT\" heading is the most-read part of your SEF, so it must be self-contained: a reader who sees only this paragraph should understand the judgement, the evidence and the main weakness."}},{"t":"h","c":{"en":"Proportion language: use the PEPS bands exactly","ar":"Proportion language: use the PEPS bands exactly"}},{"t":"table","head":{"en":["Term","Range","Example (illustrative)"],"ar":["Term","Range","Example (illustrative)"]},"rows":[{"en":["almost all","more than 90%","Almost all (93%) of Phase 1 children reached the expected stage in listening"],"ar":["almost all","more than 90%","Almost all (93%) of Phase 1 children reached the expected stage in listening"]},{"en":["most","75-90%","Most (82%) of Year 5 students met the term 3 standard"],"ar":["most","75-90%","Most (82%) of Year 5 students met the term 3 standard"]},{"en":["large majority","61-74%","A large majority (68%) of Year 9 students..."],"ar":["large majority","61-74%","A large majority (68%) of Year 9 students..."]},{"en":["majority","50-60%","A majority (55%) of Year 12 students..."],"ar":["majority","50-60%","A majority (55%) of Year 12 students..."]},{"en":["large minority","31-49%","A large minority (38%) of boys..."],"ar":["large minority","31-49%","A large minority (38%) of boys..."]},{"en":["minority","16-30%","A minority (22%) of students of determination..."],"ar":["minority","16-30%","A minority (22%) of students of determination..."]},{"en":["few","up to 15%","Few (12%) of Year 8 students..."],"ar":["few","up to 15%","Few (12%) of Year 8 students..."]}]},{"t":"callout","k":"tip","title":{"en":"Always put the number in brackets","ar":"Always put the number in brackets"},"c":{"en":"The term gives the reader the shape; the figure proves it. Write \"most (82%)\", not just \"most\". If you use a term, check that the figure falls inside its band, and use the same term for the same range in every phase and every department.","ar":"The term gives the reader the shape; the figure proves it. Write \"most (82%)\", not just \"most\". If you use a term, check that the figure falls inside its band, and use the same term for the same range in every phase and every department."}},{"t":"h","c":{"en":"A model paragraph and what makes it work","ar":"A model paragraph and what makes it work"}},{"t":"p","c":{"en":"\u003cstrong>Illustrative figures (not PEPS data).\u003c/strong> Replace everything with your own evidence.","ar":"\u003cstrong>Illustrative figures (not PEPS data).\u003c/strong> Replace everything with your own evidence."}},{"t":"scenario","title":{"en":"Model: PHASE 3: JUDGEMENT (Mathematics)","ar":"Model: PHASE 3: JUDGEMENT (Mathematics)"},"c":{"en":"\"\u003cstrong>PHASE 3: JUDGEMENT.\u003c/strong> A large majority (71%) of Year 9 students met the expected standard in the end-of-year assessment, compared with a large majority (64%) last year. The Cambridge Lower Secondary Checkpoint report is consistent with this overall, but shows algebra as the strongest strand and geometry and measure as the weakest. A minority (27%) of boys did not reach the standard in geometry, compared with a minority (19%) of girls. Internal and external results agree within 5 percentage points in number and algebra, but internal geometry results are 14 percentage points higher than the Checkpoint strand. So most students are well prepared for IGCSE algebra, but geometry is a risk, and internal geometry marking needs moderating.\" \u003cbr>\u003cbr>Why it works: it opens with a proportion and a figure; compares with last year; uses external data; names strands and a group; checks validity; and ends with a consequence.","ar":"\"\u003cstrong>PHASE 3: JUDGEMENT.\u003c/strong> A large majority (71%) of Year 9 students met the expected standard in the end-of-year assessment, compared with a large majority (64%) last year. The Cambridge Lower Secondary Checkpoint report is consistent with this overall, but shows algebra as the strongest strand and geometry and measure as the weakest. A minority (27%) of boys did not reach the standard in geometry, compared with a minority (19%) of girls. Internal and external results agree within 5 percentage points in number and algebra, but internal geometry results are 14 percentage points higher than the Checkpoint strand. So most students are well prepared for IGCSE algebra, but geometry is a risk, and internal geometry marking needs moderating.\" \u003cbr>\u003cbr>Why it works: it opens with a proportion and a figure; compares with last year; uses external data; names strands and a group; checks validity; and ends with a consequence."}},{"t":"h","c":{"en":"Common weaknesses in judgement narratives","ar":"Common weaknesses in judgement narratives"}},{"t":"list","c":{"en":["\u003cstrong>Adjective without evidence:\u003c/strong> \"strong\", \"good\", \"improving\", with no number.","\u003cstrong>Wrong proportion term:\u003c/strong> \"most\" for 64%, or \"majority\" for 70%.","\u003cstrong>Source not named:\u003c/strong> \"assessments show\" instead of \"the Year 9 Checkpoint report shows\".","\u003cstrong>No comparison:\u003c/strong> a figure with nothing to compare it with (last year, a benchmark, another strand).","\u003cstrong>Copy-paste across phases:\u003c/strong> identical sentences in Phases 2 and 3.","\u003cstrong>Groups hidden:\u003c/strong> \"all groups do well\" with no group figures.","\u003cstrong>Cause assumed:\u003c/strong> \"because teaching is good\" without lesson observation evidence (that belongs to KPI 3.1).","\u003cstrong>No weakness named:\u003c/strong> a narrative with no area for development is rarely credible."],"ar":["\u003cstrong>Adjective without evidence:\u003c/strong> \"strong\", \"good\", \"improving\", with no number.","\u003cstrong>Wrong proportion term:\u003c/strong> \"most\" for 64%, or \"majority\" for 70%.","\u003cstrong>Source not named:\u003c/strong> \"assessments show\" instead of \"the Year 9 Checkpoint report shows\".","\u003cstrong>No comparison:\u003c/strong> a figure with nothing to compare it with (last year, a benchmark, another strand).","\u003cstrong>Copy-paste across phases:\u003c/strong> identical sentences in Phases 2 and 3.","\u003cstrong>Groups hidden:\u003c/strong> \"all groups do well\" with no group figures.","\u003cstrong>Cause assumed:\u003c/strong> \"because teaching is good\" without lesson observation evidence (that belongs to KPI 3.1).","\u003cstrong>No weakness named:\u003c/strong> a narrative with no area for development is rarely credible."]}},{"t":"h","c":{"en":"Grading the judgement honestly","ar":"Grading the judgement honestly"}},{"t":"p","c":{"en":"Choose the grade after the narrative is written. Read your narrative as a sceptical reader would, then check that the grade you choose is the one the evidence supports when matched to the grade scale and descriptors in the school's SEF template. Paraphrase themes, such as how many students reach the standard, how results compare with benchmarks, whether groups do equally well, and whether results are stable over time. Do not quote descriptor wording from memory.","ar":"Choose the grade after the narrative is written. Read your narrative as a sceptical reader would, then check that the grade you choose is the one the evidence supports when matched to the grade scale and descriptors in the school's SEF template. Paraphrase themes, such as how many students reach the standard, how results compare with benchmarks, whether groups do equally well, and whether results are stable over time. Do not quote descriptor wording from memory."}},{"t":"table","head":{"en":["If the evidence shows...","Be cautious about..."],"ar":["If the evidence shows...","Be cautious about..."]},"rows":[{"en":["Strong proportions in one assessment but no external check","A high grade; the figure may be inflated by internal marking"],"ar":["Strong proportions in one assessment but no external check","A high grade; the figure may be inflated by internal marking"]},{"en":["External results weaker than internal grades","Relying on internal data; record the gap and set a moderation step"],"ar":["External results weaker than internal grades","Relying on internal data; record the gap and set a moderation step"]},{"en":["One strong year after two weak ones","Calling it a trend; say it is one year of improvement"],"ar":["One strong year after two weak ones","Calling it a trend; say it is one year of improvement"]},{"en":["Good overall results with a persistent weak group","Writing \"all groups\"; name the group and the plan"],"ar":["Good overall results with a persistent weak group","Writing \"all groups\"; name the group and the plan"]},{"en":["Only a small cohort in Phase 4","Strong percentages; state the number of students"],"ar":["Only a small cohort in Phase 4","Strong percentages; state the number of students"]}]},{"t":"callout","k":"warn","title":{"en":"Evidence versus claim","ar":"Evidence versus claim"},"c":{"en":"If you cannot point to a document for a statement, it is a claim, not evidence. Take it out, or find the document. If a grade requires you to leave out a weakness, the grade is too high.","ar":"If you cannot point to a document for a statement, it is a claim, not evidence. Take it out, or find the document. If a grade requires you to leave out a weakness, the grade is too high."}}],"checks":[{"id":"m6q1","q":{"en":"What is the correct proportion term for 64% of Year 7 students meeting the expected standard?","ar":"What is the correct proportion term for 64% of Year 7 students meeting the expected standard?"},"opts":[{"en":"Most","ar":"Most"},{"en":"A majority","ar":"A majority"},{"en":"A large minority","ar":"A large minority"},{"en":"A large majority","ar":"A large majority"}],"correct":3,"expl":{"en":"The bands are: most 75-90%; large majority 61-74%; majority 50-60%; large minority 31-49%. So 64% is a large majority.","ar":"The bands are: most 75-90%; large majority 61-74%; majority 50-60%; large minority 31-49%. So 64% is a large majority."}},{"id":"m6q2","q":{"en":"Which phrase most weakens a PHASE X: JUDGEMENT narrative?","ar":"Which phrase most weakens a PHASE X: JUDGEMENT narrative?"},"opts":[{"en":"\"Results are strong and improving\" with no figure, source or comparison","ar":"\"Results are strong and improving\" with no figure, source or comparison"},{"en":"\"A large majority (68%) met the standard, compared with 61% last year\"","ar":"\"A large majority (68%) met the standard, compared with 61% last year\""},{"en":"\"Writing is the weakest strand in the Checkpoint report for the second year\"","ar":"\"Writing is the weakest strand in the Checkpoint report for the second year\""},{"en":"\"Internal and external results differ by 12 percentage points in geometry\"","ar":"\"Internal and external results differ by 12 percentage points in geometry\""}],"correct":0,"expl":{"en":"The weakest phrase uses vague adjectives with no number, source or comparison. The others each give a figure, a source or a comparison and a specific finding.","ar":"The weakest phrase uses vague adjectives with no number, source or comparison. The others each give a figure, a source or a comparison and a specific finding."}},{"id":"m6q3","q":{"en":"When should the Head of Department choose the grade for the judgement table?","ar":"When should the Head of Department choose the grade for the judgement table?"},"opts":[{"en":"Before writing the narrative, so that the paragraph can then be written to match the grade chosen","ar":"Before writing the narrative, so that the paragraph can then be written to match the grade chosen"},{"en":"After writing and testing the narrative, using the grade scale and descriptors in the school's SEF template","ar":"After writing and testing the narrative, using the grade scale and descriptors in the school's SEF template"},{"en":"At the start of the term, based on last year's grade and the department's general feeling","ar":"At the start of the term, based on last year's grade and the department's general feeling"},{"en":"After agreeing a grade with the other departments so that grades across the SEF look similar and consistent","ar":"After agreeing a grade with the other departments so that grades across the SEF look similar and consistent"}],"correct":1,"expl":{"en":"A judgement follows from the evidence. The narrative is written and tested first, then the grade is chosen against the school's SEF template descriptors.","ar":"A judgement follows from the evidence. The narrative is written and tested first, then the grade is chosen against the school's SEF template descriptors."}}]},{"id":"m7","title":{"en":"Steps for Improvement, Evidence Sources and the Final Quality Check","ar":"Steps for Improvement, Evidence Sources and the Final Quality Check"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The SEF is only useful if it leads to action. After each KPI, the PEPS format asks for steps for improvement, and an evidence source column that lets a reader check every statement. This module covers how to write both, and how to check your SEF before it is submitted.","ar":"The SEF is only useful if it leads to action. After each KPI, the PEPS format asks for steps for improvement, and an evidence source column that lets a reader check every statement. This module covers how to write both, and how to check your SEF before it is submitted."}},{"t":"h","c":{"en":"Steps for improvement: make them SMART and linked","ar":"Steps for improvement: make them SMART and linked"}},{"t":"p","c":{"en":"A step is useful only if it answers a weakness you have already shown in the data. Each step needs four parts: the \u003cstrong>action\u003c/strong>, the \u003cstrong>owner\u003c/strong>, the \u003cstrong>timescale\u003c/strong> and the \u003cstrong>measure\u003c/strong> of success.","ar":"A step is useful only if it answers a weakness you have already shown in the data. Each step needs four parts: the \u003cstrong>action\u003c/strong>, the \u003cstrong>owner\u003c/strong>, the \u003cstrong>timescale\u003c/strong> and the \u003cstrong>measure\u003c/strong> of success."}},{"t":"table","head":{"en":["Weakness identified","Weak step","SMART step (illustrative)"],"ar":["Weakness identified","Weak step","SMART step (illustrative)"]},"rows":[{"en":["Geometry and measure is the weakest Checkpoint strand for three years","Improve geometry teaching","Head of Mathematics and Year 8-9 teachers to introduce a half-termly geometry assessment and reteach plan from January 2027; measure: a rise from a large minority (45%) to a large majority (65%) at the expected standard in the Year 9 term 3 assessment"],"ar":["Geometry and measure is the weakest Checkpoint strand for three years","Improve geometry teaching","Head of Mathematics and Year 8-9 teachers to introduce a half-termly geometry assessment and reteach plan from January 2027; measure: a rise from a large minority (45%) to a large majority (65%) at the expected standard in the Year 9 term 3 assessment"]},{"en":["Internal writing grades are higher than the external picture","Do more moderation","Head of English to run two cross-phase moderation sessions against Cambridge-style criteria in term 2; measure: internal and external writing results within 5 percentage points"],"ar":["Internal writing grades are higher than the external picture","Do more moderation","Head of English to run two cross-phase moderation sessions against Cambridge-style criteria in term 2; measure: internal and external writing results within 5 percentage points"]},{"en":["Practical-skills paper is the weakest IGCSE component","Teach practical skills better","Head of Science and Year 10-11 teachers to timetable one planning-and-evaluation task per fortnight from term 1; measure: a rise in the practical paper component in the next mock series"],"ar":["Practical-skills paper is the weakest IGCSE component","Teach practical skills better","Head of Science and Year 10-11 teachers to timetable one planning-and-evaluation task per fortnight from term 1; measure: a rise in the practical paper component in the next mock series"]}]},{"t":"callout","k":"tip","title":{"en":"A test for a good step","ar":"A test for a good step"},"c":{"en":"Ask: could someone else check, in a year's time, whether this was done and whether it worked? If not, add an owner, a date or a measure. Keep to a small number of steps per phase, so that each is realistic.","ar":"Ask: could someone else check, in a year's time, whether this was done and whether it worked? If not, add an owner, a date or a measure. Keep to a small number of steps per phase, so that each is realistic."}},{"t":"h","c":{"en":"The evidence source column","ar":"The evidence source column"}},{"t":"list","c":{"en":["List documents, with year and title: \"Y9 Cambridge Lower Secondary Checkpoint Mathematics report, 2026\", \"GL Progress Test Year 8 Science report, October 2026\", \"term 3 moderation record for Y5 writing\".","Never write \"various\", \"data\" or \"assessment records\".","Make sure every figure in the narrative can be found in a listed document.","Keep documents in a shared, organised folder, so that anyone can find them on request.","Keep student data confidential; refer to documents, not names."],"ar":["List documents, with year and title: \"Y9 Cambridge Lower Secondary Checkpoint Mathematics report, 2026\", \"GL Progress Test Year 8 Science report, October 2026\", \"term 3 moderation record for Y5 writing\".","Never write \"various\", \"data\" or \"assessment records\".","Make sure every figure in the narrative can be found in a listed document.","Keep documents in a shared, organised folder, so that anyone can find them on request.","Keep student data confidential; refer to documents, not names."]}},{"t":"h","c":{"en":"Quality-check list before submission","ar":"Quality-check list before submission"}},{"t":"steps","c":{"en":["Is there one narrative for each of the four phases, headed \"PHASE X: JUDGEMENT\", with no copying between phases?","Does every claim have a figure, a source and a comparison?","Do proportion terms match the PEPS bands for the figure shown?","Are the strongest and weakest strands named from external or moderated data?","Are groups named (boys and girls, Emirati students, students of determination, gifted and talented students, ESL language-level groups), with numbers where groups are small?","Have internal results been checked against external results, and any gap reported?","Does the narrative say what the data does not show?","Is the grade supported by the narrative when read against the descriptors in the SEF template?","Does every weakness lead to a SMART step, and is every source a named document?","Are all student names removed and data kept confidential?"],"ar":["Is there one narrative for each of the four phases, headed \"PHASE X: JUDGEMENT\", with no copying between phases?","Does every claim have a figure, a source and a comparison?","Do proportion terms match the PEPS bands for the figure shown?","Are the strongest and weakest strands named from external or moderated data?","Are groups named (boys and girls, Emirati students, students of determination, gifted and talented students, ESL language-level groups), with numbers where groups are small?","Have internal results been checked against external results, and any gap reported?","Does the narrative say what the data does not show?","Is the grade supported by the narrative when read against the descriptors in the SEF template?","Does every weakness lead to a SMART step, and is every source a named document?","Are all student names removed and data kept confidential?"]}},{"t":"h","c":{"en":"Common mistakes","ar":"Common mistakes"}},{"t":"list","c":{"en":["Mixing attainment with progress or teaching quality in the same paragraph.","Quoting examination results without the cohort size or the tier of entry.","Treating one good year as a trend.","Using last year's inspection rating as current evidence.","Writing steps for improvement that are activities (more training, more practice) with no measure.","Inventing or estimating figures. If data is missing, say so and say what you used instead."],"ar":["Mixing attainment with progress or teaching quality in the same paragraph.","Quoting examination results without the cohort size or the tier of entry.","Treating one good year as a trend.","Using last year's inspection rating as current evidence.","Writing steps for improvement that are activities (more training, more practice) with no measure.","Inventing or estimating figures. If data is missing, say so and say what you used instead."]}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Attainment is where students are now against a standard and benchmarks; keep it apart from progress. \u003cstrong>2.\u003c/strong> Claim, evidence, impact: every statement needs a figure, a named source and a comparison. \u003cstrong>3.\u003c/strong> Use the PEPS proportion bands exactly, and write a separate, honest narrative for each phase. \u003cstrong>4.\u003c/strong> Check internal results against external data, report the gaps, and say what the data does not show. \u003cstrong>5.\u003c/strong> Make every step for improvement SMART and link it to a weakness in your evidence, with every source named. \u003cstrong>This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance.\u003c/strong>","ar":"\u003cstrong>1.\u003c/strong> Attainment is where students are now against a standard and benchmarks; keep it apart from progress. \u003cstrong>2.\u003c/strong> Claim, evidence, impact: every statement needs a figure, a named source and a comparison. \u003cstrong>3.\u003c/strong> Use the PEPS proportion bands exactly, and write a separate, honest narrative for each phase. \u003cstrong>4.\u003c/strong> Check internal results against external data, report the gaps, and say what the data does not show. \u003cstrong>5.\u003c/strong> Make every step for improvement SMART and link it to a weakness in your evidence, with every source named. \u003cstrong>This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m7q1","q":{"en":"Which is the best step for improvement for a persistent weakness in Year 8 algebra?","ar":"Which is the best step for improvement for a persistent weakness in Year 8 algebra?"},"opts":[{"en":"Improve algebra teaching in Year 8 over the coming year with the support of all staff in the department","ar":"Improve algebra teaching in Year 8 over the coming year with the support of all staff in the department"},{"en":"Provide additional training for teachers in the department when time allows during the next academic year","ar":"Provide additional training for teachers in the department when time allows during the next academic year"},{"en":"Head of Mathematics to run a fortnightly algebra reteach from term 1, measured by the term 3 assessment","ar":"Head of Mathematics to run a fortnightly algebra reteach from term 1, measured by the term 3 assessment"},{"en":"Ask students to practise more algebra at home and check progress informally in lessons","ar":"Ask students to practise more algebra at home and check progress informally in lessons"}],"correct":2,"expl":{"en":"A SMART step has an action, an owner, a timescale and a measure, and it answers the weakness identified. The other options are vague about the owner, the date or the way success will be measured.","ar":"A SMART step has an action, an owner, a timescale and a measure, and it answers the weakness identified. The other options are vague about the owner, the date or the way success will be measured."}},{"id":"m7q2","q":{"en":"Which entry is acceptable in the evidence source column?","ar":"Which entry is acceptable in the evidence source column?"},"opts":[{"en":"Various assessment data collected from across the year by teachers","ar":"Various assessment data collected from across the year by teachers"},{"en":"Department records and teacher judgement about each student","ar":"Department records and teacher judgement about each student"},{"en":"Data held on the school management system for every year","ar":"Data held on the school management system for every year"},{"en":"Year 9 Cambridge Lower Secondary Checkpoint Science report, 2026","ar":"Year 9 Cambridge Lower Secondary Checkpoint Science report, 2026"}],"correct":3,"expl":{"en":"The evidence source column lists named documents with a year or title. Phrases such as \"various\" or \"data\" do not let a reader check anything.","ar":"The evidence source column lists named documents with a year or title. Phrases such as \"various\" or \"data\" do not let a reader check anything."}},{"id":"m7q3","q":{"en":"Before submitting the SEF, you find a Phase 2 and a Phase 3 narrative with the same sentences. What should you do?","ar":"Before submitting the SEF, you find a Phase 2 and a Phase 3 narrative with the same sentences. What should you do?"},"opts":[{"en":"Rewrite each from its own phase data, with its own figures, comparison and weaknesses","ar":"Rewrite each from its own phase data, with its own figures, comparison and weaknesses"},{"en":"Keep both, because the same department leads both phases and the findings will be similar","ar":"Keep both, because the same department leads both phases and the findings will be similar"},{"en":"Delete the Phase 3 narrative and refer the reader to Phase 2 for the same information","ar":"Delete the Phase 3 narrative and refer the reader to Phase 2 for the same information"},{"en":"Change a few words in Phase 3 so that the sentences are not identical","ar":"Change a few words in Phase 3 so that the sentences are not identical"}],"correct":0,"expl":{"en":"Each phase needs its own evidence and judgement. Copying across phases suggests the narrative is not based on the phase's own data.","ar":"Each phase needs its own evidence and judgement. Copying across phases suggests the narrative is not based on the phase's own data."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A Head of Science drafts: \"Phase 2 Science is Good because students achieved well last year.\" Which revision best fits the PEPS SEF approach?","ar":"A Head of Science drafts: \"Phase 2 Science is Good because students achieved well last year.\" Which revision best fits the PEPS SEF approach?"},"opts":[{"en":"Replace \"Good\" with \"Very good\" because the first grade does not recognise how hard the staff work","ar":"Replace \"Good\" with \"Very good\" because the first grade does not recognise how hard the staff work"},{"en":"Name the cohort, give the proportion with a figure, cite the source and compare with last year","ar":"Name the cohort, give the proportion with a figure, cite the source and compare with last year"},{"en":"Add a line about the January 2025 inspection and leave the rest of the sentence as it stands","ar":"Add a line about the January 2025 inspection and leave the rest of the sentence as it stands"},{"en":"Remove the sentence completely, since Phase 2 cannot be judged until the Checkpoint results arrive","ar":"Remove the sentence completely, since Phase 2 cannot be judged until the Checkpoint results arrive"}],"correct":1},{"id":"e2","mod":1,"q":{"en":"A department has high Year 9 results, but most students started the key stage already well above the standard. Which KPI does the \"little movement\" point belong to?","ar":"A department has high Year 9 results, but most students started the key stage already well above the standard. Which KPI does the \"little movement\" point belong to?"},"opts":[{"en":"KPI 1.1 Attainment, because any statement about Year 9 results belongs under attainment","ar":"KPI 1.1 Attainment, because any statement about Year 9 results belongs under attainment"},{"en":"KPI 3.1 Teaching for Effective Learning, because starting points are decided in lessons by teachers","ar":"KPI 3.1 Teaching for Effective Learning, because starting points are decided in lessons by teachers"},{"en":"KPI 1.2 Progress, because it is about movement from starting points rather than the level reached","ar":"KPI 1.2 Progress, because it is about movement from starting points rather than the level reached"},{"en":"KPI 1.3 Learning Skills, because high starting points are a feature of how students learn","ar":"KPI 1.3 Learning Skills, because high starting points are a feature of how students learn"}],"correct":2},{"id":"e3","mod":1,"q":{"en":"Which SEF layout matches the PEPS format?","ar":"Which SEF layout matches the PEPS format?"},"opts":[{"en":"One whole-school narrative covering every phase together, a table of all assessment results by year group, and a list of department achievements for the year","ar":"One whole-school narrative covering every phase together, a table of all assessment results by year group, and a list of department achievements for the year"},{"en":"A narrative for each individual teacher, a table of lesson observation grades by department, and a plan for next year's timetable and staffing","ar":"A narrative for each individual teacher, a table of lesson observation grades by department, and a plan for next year's timetable and staffing"},{"en":"A single grade for each year group, an appendix of student scores with the names of those concerned, and a short list of awards","ar":"A single grade for each year group, an appendix of student scores with the names of those concerned, and a short list of awards"},{"en":"A judgement table by phase, a \"PHASE X: JUDGEMENT\" narrative for each phase, steps for improvement and an evidence source column","ar":"A judgement table by phase, a \"PHASE X: JUDGEMENT\" narrative for each phase, steps for improvement and an evidence source column"}],"correct":3},{"id":"e4","mod":2,"q":{"en":"A Head of English wants to compare how Year 8 students perform against a norm group. Which source is the most direct?","ar":"A Head of English wants to compare how Year 8 students perform against a norm group. Which source is the most direct?"},"opts":[{"en":"The Year 8 GL English Progress Test, checking which norm group the report uses","ar":"The Year 8 GL English Progress Test, checking which norm group the report uses"},{"en":"The Cambridge Primary Checkpoint ESL 0057 report for the cohort when they were in Year 6","ar":"The Cambridge Primary Checkpoint ESL 0057 report for the cohort when they were in Year 6"},{"en":"The Year 8 end-of-term internal assessment, because it follows the school's own curriculum","ar":"The Year 8 end-of-term internal assessment, because it follows the school's own curriculum"},{"en":"A TIMSS Grade 8 sample, since it measures reading in Year 8 internationally","ar":"A TIMSS Grade 8 sample, since it measures reading in Year 8 internationally"}],"correct":0},{"id":"e5","mod":2,"q":{"en":"In Year 10, the GL Mathematics report shows an average standardised score of 98, while 80% of students are rated \"at expected\" in internal tests. What is the best reading?","ar":"In Year 10, the GL Mathematics report shows an average standardised score of 98, while 80% of students are rated \"at expected\" in internal tests. What is the best reading?"},"opts":[{"en":"The cohort is performing above the average, because most students are rated at expected internally","ar":"The cohort is performing above the average, because most students are rated at expected internally"},{"en":"The measures are not obviously consistent, so investigate the cause and report the difference","ar":"The measures are not obviously consistent, so investigate the cause and report the difference"},{"en":"The GL score should be dropped from the SEF, since internal tests are the school's own source of evidence","ar":"The GL score should be dropped from the SEF, since internal tests are the school's own source of evidence"},{"en":"The cohort is far below average, and the internal figure should be lowered to match the GL score","ar":"The cohort is far below average, and the internal figure should be lowered to match the GL score"}],"correct":1},{"id":"e6","mod":2,"q":{"en":"The department used released TIMSS items with one Year 9 class of 24 students. How should this be reported?","ar":"The department used released TIMSS items with one Year 9 class of 24 students. How should this be reported?"},"opts":[{"en":"Report it as the school's TIMSS result, since the items came from the official programme","ar":"Report it as the school's TIMSS result, since the items came from the official programme"},{"en":"Leave it out, because nothing from released items can ever be used in a SEF","ar":"Leave it out, because nothing from released items can ever be used in a SEF"},{"en":"State the sample, year group and limits, and present it as one strand of evidence among several","ar":"State the sample, year group and limits, and present it as one strand of evidence among several"},{"en":"Use it as the main evidence for Phase 3, since international comparison is the strongest source","ar":"Use it as the main evidence for Phase 3, since international comparison is the strongest source"}],"correct":2},{"id":"e7","mod":3,"q":{"en":"Year 6 ESL data shows 78% meeting the expected standard in reading and 52% in writing. Which wording is correct?","ar":"Year 6 ESL data shows 78% meeting the expected standard in reading and 52% in writing. Which wording is correct?"},"opts":[{"en":"A large majority (78%) met the standard in reading, and a large majority (52%) in writing","ar":"A large majority (78%) met the standard in reading, and a large majority (52%) in writing"},{"en":"Most (78%) met the standard in reading, and a large majority (52%) in writing","ar":"Most (78%) met the standard in reading, and a large majority (52%) in writing"},{"en":"Almost all (78%) met the standard in reading, and a majority (52%) in writing","ar":"Almost all (78%) met the standard in reading, and a majority (52%) in writing"},{"en":"Most (78%) met the standard in reading, and a majority (52%) in writing","ar":"Most (78%) met the standard in reading, and a majority (52%) in writing"}],"correct":3},{"id":"e8","mod":3,"q":{"en":"An FS2 English narrative says \"Children are enthusiastic about stories and songs.\" What is the main gap?","ar":"An FS2 English narrative says \"Children are enthusiastic about stories and songs.\" What is the main gap?"},"opts":[{"en":"It describes engagement, not what children can do against the expected stage in the early-years curriculum","ar":"It describes engagement, not what children can do against the expected stage in the early-years curriculum"},{"en":"It mentions FS2, which has no English attainment to report and so should not appear in the SEF at all","ar":"It mentions FS2, which has no English attainment to report and so should not appear in the SEF at all"},{"en":"It uses the word \"enthusiastic\", and positive words must never appear anywhere in a SEF narrative","ar":"It uses the word \"enthusiastic\", and positive words must never appear anywhere in a SEF narrative"},{"en":"It should list every story and song used during the year, with dates, to prove that engagement was high","ar":"It should list every story and song used during the year, with dates, to prove that engagement was high"}],"correct":0},{"id":"e9","mod":3,"q":{"en":"Year 9 Checkpoint ESL (0876) shows writing as the weakest strand, while internal writing grades are higher. What is the best SEF step?","ar":"Year 9 Checkpoint ESL (0876) shows writing as the weakest strand, while internal writing grades are higher. What is the best SEF step?"},"opts":[{"en":"Reduce the number of writing tasks set, so that fewer weak pieces of work are recorded in each term","ar":"Reduce the number of writing tasks set, so that fewer weak pieces of work are recorded in each term"},{"en":"Moderate internal writing marking against Cambridge-style criteria and measure the gap to the external strand","ar":"Moderate internal writing marking against Cambridge-style criteria and measure the gap to the external strand"},{"en":"Replace internal writing grades with the Checkpoint score for every student in the year group","ar":"Replace internal writing grades with the Checkpoint /* ---------- state + storage ---------- */

const KEY = 'peps_cpd_' + META.id + '_v1';

function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });

if(CPD.meta.englishOnly) S.lang = 'en';

const ARR_N = () => S.lang==='ar' ? '←' : '→';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>

    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
