<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS CPD Module — Teaching Understanding the World/Science in KG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#12213C;
    --bg-alt:#1B2E52;
    --bg-card:#1F335C;
    --ink:#F4EFE6;
    --ink-dim:#AEB9D1;
    --gold:#D8A857;
    --gold-soft:rgba(216,168,87,0.14);
    --teal:#59B3AA;
    --teal-soft:rgba(89,179,170,0.14);
    --coral:#E2725B;
    --coral-soft:rgba(226,114,91,0.14);
    --line:rgba(244,239,230,0.14);
    --serif:'Lora', Georgia, serif;
    --sans:'Inter', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(18,33,60,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .topbar .brand{
    display:flex; flex-direction:column; gap:2px;
  }
  .brand .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold);
  }
  .brand h1{
    font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  }
  .brand-row{
    display:flex; align-items:center; gap:14px;
  }
  .brand-logo{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    box-shadow:0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,0.35);
  }
  .cert-logo{
    width:56px; height:56px; border-radius:50%; margin:0 auto 14px auto; display:block;
    box-shadow:0 0 0 1px var(--gold);
  }
  .progress-wrap{
    flex:1; max-width:340px; min-width:180px;
  }
  .progress-track{
    height:6px; border-radius:4px; background:var(--bg-alt); overflow:hidden; border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--gold),var(--teal)); width:0%;
    transition:width .4s ease;
  }
  .progress-label{
    font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:5px; letter-spacing:.04em;
  }
  .newtab-link{
    display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px;
    color:var(--gold); text-decoration:none; letter-spacing:.04em; white-space:nowrap; margin-top:2px;
    cursor:pointer; border:none; background:none; padding:0;
  }
  .newtab-link:hover{ text-decoration:underline; }
  .dl-help{
    font-family:var(--sans); font-size:12px; color:var(--ink-dim); margin-top:10px;
  }
  .dl-help a{ color:var(--gold); cursor:pointer; text-decoration:underline; }

  /* ---------- Layout ---------- */
  .layout{
    display:flex; max-width:1180px; margin:0 auto; align-items:flex-start;
  }
  .sidebar{
    width:270px; flex-shrink:0; padding:26px 14px 60px 24px; position:sticky; top:64px;
    max-height:calc(100vh - 64px); overflow-y:auto;
  }
  .thread{
    position:relative; padding-left:6px;
  }
  .thread::before{
    content:""; position:absolute; left:17px; top:8px; bottom:8px; width:1px; background:var(--line);
  }
  .thread-item{
    position:relative; display:flex; gap:12px; padding:9px 8px 9px 0; cursor:pointer; border-radius:8px;
    align-items:flex-start;
  }
  .thread-item:hover{ background:rgba(244,239,230,0.04); }
  .thread-item.active{ background:var(--gold-soft); }
  .node{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; font-weight:500; z-index:1;
    background:var(--bg-alt); border:1px solid var(--line); color:var(--ink-dim);
  }
  .thread-item.locked .node{ opacity:0.4; }
  .thread-item.done .node{ background:var(--teal); border-color:var(--teal); color:#0d211f; }
  .thread-item.active .node{ background:var(--gold); border-color:var(--gold); color:#241705; }
  .node-meta{ padding-top:5px; }
  .node-title{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .thread-item.locked .node-title{ color:var(--ink-dim); }
  .node-time{ font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:2px; }

  .main{
    flex:1; min-width:0; padding:36px 28px 90px 28px;
  }
  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:34px 38px; margin-bottom:24px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold);
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); }
  h2.mod-title{
    font-family:var(--serif); font-size:30px; font-weight:600; margin-bottom:18px; line-height:1.25;
  }
  .content p{ margin-bottom:14px; color:var(--ink); font-size:15.5px; }
  .content ul, .content ol{ margin:0 0 16px 22px; color:var(--ink); font-size:15.5px; }
  .content li{ margin-bottom:8px; }
  .content strong{ color:var(--gold); font-weight:600; }

  .callout{
    border-left:3px solid var(--gold); background:var(--gold-soft); border-radius:0 10px 10px 0;
    padding:16px 20px; margin:20px 0; position:relative;
  }
  .callout .tag{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; display:block;}
  .callout p{ font-family:var(--serif); font-style:italic; font-size:16px; margin:0; color:var(--ink); }

  .video-wrap{
    position:relative; padding-bottom:56.25%; height:0; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); margin:14px 0 6px 0; background:#000;
  }
  .video-wrap iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .video-caption{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); margin-bottom:22px; }

  /* ---------- Quiz ---------- */
  .quiz-block{ margin-top:8px; }
  .qcard{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:16px;
  }
  .qcard .qtext{ font-weight:600; font-size:15px; margin-bottom:12px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-radius:8px; margin-bottom:8px;
    border:1px solid var(--line); cursor:pointer; font-size:14.5px; transition:border-color .15s, background .15s;
  }
  .opt:hover{ border-color:var(--gold); }
  .opt.selected{ border-color:var(--gold); background:var(--gold-soft); }
  .opt.correct{ border-color:var(--teal); background:var(--teal-soft); }
  .opt.incorrect{ border-color:var(--coral); background:var(--coral-soft); }
  .opt input{ margin-top:3px; accent-color:var(--gold); }
  .opt.disabled{ cursor:default; }
  .qbtns{ display:flex; gap:10px; align-items:center; margin-top:10px; }
  .feedback{ margin-top:10px; font-size:13.5px; padding:10px 12px; border-radius:8px; display:none; }
  .feedback.show{ display:block; }
  .feedback.right{ background:var(--teal-soft); color:var(--teal); }
  .feedback.wrong{ background:var(--coral-soft); color:var(--coral); }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--sans); font-weight:600; font-size:13.5px; padding:11px 22px; border-radius:8px; border:1px solid transparent;
    cursor:pointer; transition:opacity .15s, transform .1s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--gold); color:#241705; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-small{ padding:7px 14px; font-size:12.5px; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }

  /* ---------- Welcome / objectives ---------- */
  .obj-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:18px 0 6px 0;
  }
  .obj-item{
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:14px; background:var(--bg-alt);
  }
  .obj-item .num{ font-family:var(--mono); color:var(--gold); font-size:11px; margin-bottom:6px; display:block; }

  /* ---------- Final score / certificate ---------- */
  .score-hero{ text-align:center; padding:20px 0 6px 0; }
  .score-hero .big{
    font-family:var(--serif); font-size:52px; font-weight:700; color:var(--gold);
  }
  .score-hero .sub{ color:var(--ink-dim); font-size:13.5px; margin-top:4px; }

  .cert{
    border:2px solid #B8860B; border-radius:14px; padding:44px 40px; text-align:center; position:relative;
    background:#fffdf7; color:#2b2b2b;
  }
  .cert .eyebrow{ justify-content:center; color:#B8860B; }
  .cert .eyebrow .dot{ background:#B8860B; }
  .cert h3{ font-family:var(--serif); font-size:15px; letter-spacing:.05em; color:#6b5b3e; text-transform:uppercase; margin-top:6px;}
  .cert .name{
    font-family:var(--serif); font-size:34px; font-weight:700; margin:18px 0; color:#1F3355;
    border-bottom:1px solid #B8860B; display:inline-block; padding-bottom:8px; min-width:280px;
  }
  .cert .desc{ color:#3a3a3a; font-size:14px; max-width:480px; margin:0 auto 6px auto; text-align:justify; }
  .cert .desc strong{ color:#1F3355; }
  .cert .meta{ display:flex; flex-wrap:wrap; justify-content:center; gap:24px 32px; margin-top:26px; font-family:var(--mono); font-size:11px; color:#555555; }
  .name-input-row{ display:flex; gap:10px; justify-content:center; margin:20px 0; flex-wrap:wrap; }
  .name-input-row input{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:8px; padding:11px 16px; color:var(--ink);
    font-family:var(--sans); font-size:14px; min-width:240px;
  }
  .name-input-row input:focus{ outline:none; border-color:var(--gold); }

  @media print{
    .topbar,.sidebar,.no-print{ display:none !important; }
    body{ background:#fff; color:#111; visibility:hidden; }
    #certificate-print-area{ visibility:visible; position:absolute; top:0; left:0; width:100%; margin:0; }
    #certificate-print-area *{ visibility:visible; }
  }

  @media (max-width:900px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; position:relative; top:0; max-height:none; padding:16px; }
    .thread{ display:flex; overflow-x:auto; gap:4px; padding-bottom:6px; }
    .thread::before{ display:none; }
    .thread-item{ flex-direction:column; align-items:center; min-width:76px; text-align:center; }
    .obj-grid{ grid-template-columns:1fr; }
    .card{ padding:24px 20px; }
    h2.mod-title{ font-size:24px; }
  }

    "body": "\n      <p>Alongside knowledge, Understanding the World builds a set of transferable <strong>process skills</strong>: observing, comparing, predicting, testing, and recording. A simple, well-known investigation like sink or float is genuinely valuable not for the \"fact\" it teaches, but for the thinking process it builds when done properly.</p>\n      <ul>\n        <li><strong>Observe:</strong> what do you notice about this object before we test it?</li>\n        <li><strong>Predict:</strong> do you think it will sink or float, and why do you think that?</li>\n        <li><strong>Test:</strong> carry out the investigation and watch closely.</li>\n        <li><strong>Record:</strong> even simple recording — a tally, a sorting chart, a drawing — builds the habit of capturing evidence.</li>\n        <li><strong>Discuss:</strong> what did we notice? Did it match our prediction? Why might that be?</li>\n      </ul>\n      <div class=\"callout\"><span class=\"tag\">Key idea</span><p>\"The word 'why do you think that?' after a prediction is doing most of the real scientific thinking work — it's the difference between guessing and reasoning.\"</p></div>\n      <p>This structure is essentially a simplified version of the scientific method covered in our Math/Science Tier 2 CPDs, and a simplified version of Claim-Evidence-Reasoning: even a 4-year-old can manage \"I think it will sink (claim), because it feels heavy (evidence/reasoning)\" — in their own words, at their own level, but with the same underlying structure.</p>\n    ",

    "body": "\n      <p>Young children absorb scientific vocabulary far more readily through rich, modelled talk during real exploration than through direct vocabulary teaching alone. A few practical techniques make this modelling effective:</p>\n      <ul>\n        <li><strong>Explain complex words in context, as you use them:</strong> \"When we make an <em>observation</em>, we carefully look at the details of something, using our senses\" — said naturally while actually observing something together.</li>\n        <li><strong>Use precise, descriptive vocabulary during exploration:</strong> instead of \"the seed is different,\" try \"this seed is flat, with pointed ends, and rough on the outside\" — modelling exactly the kind of specific language you want children to use themselves.</li>\n        <li><strong>Connect new vocabulary to something children can directly sense:</strong> touching, smelling, and comparing objects while naming their properties builds much stronger word associations than vocabulary presented only visually or verbally.</li>\n      </ul>\n      <div class=\"callout\"><span class=\"tag\">Key idea</span><p>\"Don't just use the word 'observation' — narrate what making an observation actually looks and feels like, in the moment, while it's happening.\"</p></div>\n      <p>This connects directly to the self-talk and parallel talk techniques from our Sustained Shared Thinking module — the same real-time narration technique, now deliberately carrying scientific vocabulary and concepts rather than general commentary. Over time, hearing this rich, precise language modelled consistently is what builds children's own scientific vocabulary and their ability to explain their thinking.</p>\n    ",

/* ============ STATE ============ */
let state = {
  currentIndex: 0,
  maxUnlocked: 0,
  quizState: {}, // moduleId -> { answered: [bool], correct: [bool] }
  finalScore: null,
};

modules.forEach(m => { state.quizState[m.id] = { answered:[], correct:[] }; if(m.quiz){ m.quiz.forEach(()=>{ state.quizState[m.id].answered.push(false); state.quizState[m.id].correct.push(false); }); } });


const STORAGE_KEY = "cpd-peps-ey-understanding-the-world-cpd-progress";
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  } catch(e){}
}
loadState();

const mainContent = document.getElementById('mainContent');
const threadNav = document.getElementById('threadNav');

function renderSidebar(){
  threadNav.innerHTML = '';
  modules.forEach((m,i)=>{
    const locked = i > state.maxUnlocked;
    const done = i < state.maxUnlocked || (i===state.maxUnlocked && i===modules.length-1 && isModuleSatisfied(i) && i!==state.currentIndex);
    const div = document.createElement('div');
    div.className = 'thread-item' + (locked?' locked':'') + (i===state.currentIndex?' active':'') + (i<state.maxUnlocked?' done':'');
    div.innerHTML = `
      <div class="node">${i<state.maxUnlocked ? '&#10003;' : m.code}</div>
      <div class="node-meta">
        <div class="node-title">${m.title}</div>
        <div class="node-time">${m.time}</div>
      </div>`;
    if(!locked){
      div.addEventListener('click', ()=>{ state.currentIndex = i; render(); window.scrollTo({top:0, behavior:'smooth'}); });
    }
    threadNav.appendChild(div);
  });
}

function isModuleSatisfied(i){
  const m = modules[i];
  if(!m.quiz) return true;
  const qs = state.quizState[m.id];
  return qs.answered.every(a=>a);
}

function updateProgress(){
  const pct = Math.round((state.maxUnlocked / (modules.length-1)) * 100);
  document.getElementById('progressFill').style.width = Math.min(pct,100)+'%';
  document.getElementById('progressLabel').textContent = Math.min(pct,100)+'% complete \u00b7 ~120 minutes total';
}

function renderQuiz(m){
  if(!m.quiz) return '';
  let html = `<div class="quiz-block"><div class="eyebrow"><span class="dot"></span>Check your understanding</div>`;
  m.quiz.forEach((q,qi)=>{
    html += `<div class="qcard" id="${m.id}-q${qi}">
      <div class="qtext">${qi+1}. ${q.q}</div>
      <div class="opts">`;
    q.options.forEach((opt,oi)=>{
      html += `<label class="opt" data-mid="${m.id}" data-qi="${qi}" data-oi="${oi}">
        <input type="radio" name="${m.id}-q${qi}" value="${oi}">
        <span>${opt}</span>
      </label>`;
    });
    html += `</div>
      <div class="qbtns">
        <button class="btn btn-primary btn-small" onclick="checkAnswer('${m.id}',${qi})">Check answer</button>
        <button class="btn btn-ghost btn-small" onclick="resetQuestion('${m.id}',${qi})">Try again</button>
      </div>
      <div class="feedback" id="${m.id}-fb${qi}"></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function render(){
  saveState();
  const i = state.currentIndex;
  const m = modules[i];
  let html = `<div class="card">`;

  if(m.type === 'welcome'){
    html += `<div class="eyebrow"><span class="dot"></span>Start here</div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="content">${m.body}</div>
      <div class="nav-row" style="justify-content:flex-end;">
        <button class="btn btn-primary" onclick="advance()">Begin Module 1 &rarr;</button>
      </div>`;
  } else if(m.type === 'module'){
    html += `<div class="eyebrow"><span class="dot"></span>Module ${m.code} &middot; ${m.time}</div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="content">${m.body}</div>`;
    if(m.video){
      html += `<div class="eyebrow" style="margin-top:26px;"><span class="dot"></span>Watch</div>
        <div class="video-wrap"><iframe src="https://www.youtube.com/embed/${m.video}" title="video" allowfullscreen></iframe></div>
        <div class="video-caption">${m.videoCaption}</div>`;
    }
    html += renderQuiz(m);
    html += `<div class="nav-row">
      <button class="btn btn-ghost" onclick="goPrev()">&larr; Back</button>
      <button class="btn btn-primary" id="continueBtn" onclick="advance()">Mark complete &amp; continue &rarr;</button>
    </div>`;
  } else if(m.type === 'final'){
    html += `<div class="eyebrow"><span class="dot"></span>Final Assessment &middot; ${m.time}</div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="content">${m.body}</div>`;
    html += renderQuiz(m);
    html += `<div id="finalResult"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goPrev()">&larr; Back</button>
        <button class="btn btn-primary" onclick="submitFinal()">Submit assessment</button>
      </div>`;
  } else if(m.type === 'certificate'){
    html += `<div class="eyebrow"><span class="dot"></span>${m.time}</div>
      <h2 class="mod-title">${m.title}</h2>
      <div class="content">${m.body}</div>`;
    if(state.finalScore !== null && state.finalScore >= 80){
      html += `
        <div class="name-input-row no-print">
          ${state.certName ? '' : '<input type="text" id="certName" placeholder="Type your full name" value=""><button class="btn btn-primary" onclick="generateCert()">Generate certificate</button>'}
          <button class="btn btn-ghost" onclick="downloadCertPDF(this)">Download Certificate (PDF)</button>
          <button class="btn btn-ghost" onclick="window.print()">Print Certificate</button>
        </div>
        <div id="certArea"></div>`;
    } else {
      html += `<div class="callout"><span class="tag">Certificate locked</span><p>Score 80% or higher on the Final Assessment to unlock your certificate.</p></div>
        <button class="btn btn-ghost" onclick="state.currentIndex = ${modules.length-2}; render();">Go to Final Assessment</button>`;
    }
    html += `<div class="nav-row" style="margin-top:20px;"><button class="btn btn-ghost" onclick="goPrev()">&larr; Back</button></div>`;
  }

  html += `</div>`;
  mainContent.innerHTML = html;
  renderSidebar();
  updateProgress();
  restoreQuizUI(m);
  if(m.type === 'certificate' && state.certName){ renderCertificateHTML(state.certName); }
}

function editCertName(){
  state.certName = null;
  saveState();
  render();
}

function restoreQuizUI(m){
  if(m.quiz){
    m.quiz.forEach((q,qi)=>{
      if(state.quizState[m.id].answered[qi]){
        lockQuestion(m.id, qi, true);
      }
    });
    attachOptionListeners();
  }
  maybeEnableContinue(m.id);
}

function attachOptionListeners(){
  document.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', function(){
      if(this.classList.contains('disabled')) return;
      const mid=this.dataset.mid, qi=this.dataset.qi;
      document.querySelectorAll(`.opt[data-mid="${mid}"][data-qi="${qi}"]`).forEach(o=>{ o.classList.remove('selected'); o.classList.remove('incorrect'); });
      this.classList.add('selected');
      this.querySelector('input').checked = true;
      const fb = document.getElementById(`${mid}-fb${qi}`);
      if(fb){ fb.className = 'feedback'; fb.innerHTML = ''; }
    });
  });
}

function checkAnswer(mid, qi){
  const m = modules.find(x=>x.id===mid);
  const q = m.quiz[qi];
  const selected = document.querySelector(`input[name="${mid}-q${qi}"]:checked`);
  if(!selected){ alert('Please select an answer first.'); return; }
  const oi = parseInt(selected.value);
  const isCorrect = oi === q.correct;
  if(isCorrect){
    state.quizState[mid].answered[qi] = true;
    state.quizState[mid].correct[qi] = true;
    lockQuestion(mid, qi, false, oi, true);
    maybeEnableContinue(mid);
    saveState();
  } else {
    // wrong: mark the chosen option and give feedback, but do not lock, disable, or reveal
    // the correct answer -- the question stays open for a genuine retry
    document.querySelectorAll(`.opt[data-mid="${mid}"][data-qi="${qi}"]`).forEach(el=>{
      const eoi = parseInt(el.dataset.oi);
      el.classList.toggle('incorrect', eoi === oi);
    });
    const fb = document.getElementById(`${mid}-fb${qi}`);
    if(fb){
      fb.className = 'feedback show wrong';
      fb.innerHTML = '<strong>Not quite.</strong> Choose another option and check again.';
    }
  }
}

function lockQuestion(mid, qi, silent, chosenOi, isCorrectNow){
  const m = modules.find(x=>x.id===mid);
  const q = m.quiz[qi];
  const wasCorrect = state.quizState[mid].correct[qi];
  document.querySelectorAll(`.opt[data-mid="${mid}"][data-qi="${qi}"]`).forEach(el=>{
    const oi = parseInt(el.dataset.oi);
    el.classList.add('disabled');
    el.querySelector('input').disabled = true;
    if(oi === q.correct){ el.classList.add('correct'); }
    else if(!silent && oi === chosenOi && !isCorrectNow){ el.classList.add('incorrect'); }
  });
  const fb = document.getElementById(`${mid}-fb${qi}`);
  if(fb){
    const correctNow = silent ? wasCorrect : isCorrectNow;
    fb.className = 'feedback show ' + (correctNow ? 'right' : 'wrong');
    fb.innerHTML = (correctNow ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + q.explain;
  }
}

function resetQuestion(mid, qi){
  state.quizState[mid].answered[qi] = false;
  state.quizState[mid].correct[qi] = false;
  document.querySelectorAll(`.opt[data-mid="${mid}"][data-qi="${qi}"]`).forEach(el=>{
    el.classList.remove('disabled','correct','incorrect','selected');
    el.querySelector('input').disabled = false;
    el.querySelector('input').checked = false;
  });
  const fb = document.getElementById(`${mid}-fb${qi}`);
  if(fb){ fb.className = 'feedback'; fb.innerHTML=''; }
  maybeEnableContinue(mid);
  saveState();
}

function maybeEnableContinue(mid){
  const btn = document.getElementById('continueBtn');
  if(!btn) return;
  const idx = modules.findIndex(x => x.id === mid);
  const ok = idx === -1 || isModuleSatisfied(idx);
  btn.disabled = !ok;
  btn.title = ok ? '' : 'Please answer every question above before continuing.';
}

function goPrev(){
  if(state.currentIndex > 0){ state.currentIndex--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function advance(){
  const current = modules[state.currentIndex];
  if(current && current.quiz && !isModuleSatisfied(state.currentIndex)){
    alert('Please answer every question in this section before continuing.');
    return;
  }
  if(state.currentIndex < modules.length-1){
    state.currentIndex++;
    if(state.currentIndex > state.maxUnlocked) state.maxUnlocked = state.currentIndex;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function submitFinal(){
  const m = modules.find(x=>x.type==='final');
  const total = m.quiz.length;
  let answeredCount = 0, correctCount = 0;
  let missing = false;
  m.quiz.forEach((q,qi)=>{
    const selected = document.querySelector(`input[name="${m.id}-q${qi}"]:checked`);
    if(!selected){ missing = true; return; }
    answeredCount++;
    const oi = parseInt(selected.value);
    const isCorrect = oi === q.correct;
    state.quizState[m.id].answered[qi] = true;
    state.quizState[m.id].correct[qi] = isCorrect;
    lockQuestion(m.id, qi, false, oi, isCorrect);
    if(isCorrect) correctCount++;
  });
  if(missing){
    alert('Please answer every question before submitting.');
    return;
  }
  const pct = Math.round((correctCount/total)*100);
  state.finalScore = pct;
  const resultDiv = document.getElementById('finalResult');
  const pass = pct >= 80;
  resultDiv.innerHTML = `
    <div class="score-hero">
      <div class="big">${pct}%</div>
      <div class="sub">${correctCount} of ${total} correct &middot; ${pass ? 'Passed — certificate unlocked' : 'Below 80% — review the modules and try again'}</div>
    </div>
    ${pass ? `<div class="nav-row" style="margin-top:18px;"><button class="btn btn-primary" onclick="state.currentIndex = ${modules.length-1}; render();">Continue to Certificate &rarr;</button></div>` : ''}`;
  if(pass && state.currentIndex+1 > state.maxUnlocked){ state.maxUnlocked = state.currentIndex+1; }
  renderSidebar();
  updateProgress();
  saveState();
}


function downloadCertPDF(btn){
  const certEl = document.getElementById('certificate-print-area');
  if(!certEl){ alert('Please generate your certificate first.'); return; }
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    alert('The PDF download tool could not load (this can happen with no internet connection, or a strict network/embed setting). Please try the Print Certificate option instead, or check your internet connection and try again.');
    return;
  }
  const originalText = btn.textContent;
  btn.textContent = 'Preparing PDF...';
  btn.disabled = true;
  try {
  html2canvas(certEl, { scale:2, backgroundColor:'#ffffff', useCORS:true }).then(function(canvas){
    const imgData = canvas.toDataURL('image/png');
    const jsPDFCtor = window.jspdf.jsPDF;
    const pdf = new jsPDFCtor({
      orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save('CPD_Certificate.pdf');
    btn.textContent = originalText;
    btn.disabled = false;
  }).catch(function(err){
    console.error('PDF generation failed:', err);
    alert('Sorry, something went wrong generating the PDF. Please try the Print Certificate option instead.');
    btn.textContent = originalText;
    btn.disabled = false;
  });
  } catch(err){
    console.error('PDF generation failed:', err);
    alert('Sorry, something went wrong generating the PDF. Please try the Print Certificate option instead.');
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function generateCert(){
  const nameInput = document.getElementById('certName');
  const name = nameInput.value.trim();
  if(!name){ alert('Please enter your name.'); return; }
  state.certName = name;
  render();
}
