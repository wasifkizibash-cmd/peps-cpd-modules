<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Simple Circuit Builder Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; --on: #2E8B57; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .circuit-stage { background: #F3F8F7; border-radius: 12px; padding: 30px; display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; }
    .comp { font-size: 44px; }
    .wire-gap { width: 70px; height: 6px; border-radius: 3px; background: #D64545; cursor: pointer; margin: 0 8px; position: relative; transition: background .25s; }
    .wire-gap.connected { background: var(--on); }
    .wire-gap .tip { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #667; white-space: nowrap; }
    .bulb { font-size: 50px; filter: grayscale(1) brightness(0.7); transition: filter .3s; }
    .bulb.lit { filter: grayscale(0) brightness(1.3) drop-shadow(0 0 12px #FFD700); }

    .status-row { text-align: center; margin-top: 20px; }
    .status-msg { font-size: 16px; font-weight: 800; }
    .status-msg.on { color: var(--on); }
    .status-msg.off { color: #D64545; }
    .status-desc { font-size: 13px; color: #667; margin-top: 4px; }

    .btn-reset { display: block; margin: 18px auto 0; padding: 10px 20px; font-size: 13.5px; font-weight: 700; background: #fff; color: var(--primary); border: 2px solid var(--primary); border-radius: 8px; cursor: pointer; }
    .btn-reset:hover { background: #F3F8F7; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Simple Circuit Builder</h1>
        <p>Year 4 Science &mdash; Complete the Loop to Light the Bulb</p>
    </div>

    <div class="circuit-stage">
        <span class="comp">&#128267;</span>
        <div class="wire-gap" id="wire1" onclick="toggleWire(1)"><span class="tip">click to connect</span></div>
        <span class="comp bulb" id="bulb">&#128161;</span>
        <div class="wire-gap" id="wire2" onclick="toggleWire(2)"><span class="tip">click to connect</span></div>
    </div>

    <div class="status-row">
        <div class="status-msg" id="statusMsg"></div>
        <div class="status-desc" id="statusDesc"></div>
    </div>

    <button class="btn-reset" onclick="resetCircuit()">Reset Circuit</button>
</div>

<script>
let wires = { 1: false, 2: false };

function toggleWire(n){
    wires[n] = !wires[n];
    document.getElementById('wire' + n).classList.toggle('connected', wires[n]);
    updateCircuit();
}

function updateCircuit(){
    const complete = wires[1] && wires[2];
    const bulb = document.getElementById('bulb');
    bulb.classList.toggle('lit', complete);

    const msg = document.getElementById('statusMsg');
    const desc = document.getElementById('statusDesc');

    if(complete){
        msg.textContent = 'The bulb is lit!';
        msg.className = 'status-msg on';
        desc.textContent = 'Both wires are connected, so electricity can flow all the way around the loop.';
    } else {
        const missing = [];
        if(!wires[1]) missing.push('wire 1');
        if(!wires[2]) missing.push('wire 2');
        msg.textContent = 'The bulb is off';
        msg.className = 'status-msg off';
        desc.textContent = 'The circuit is broken \u2014 ' + missing.join(' and ') + ' still need to be connected. Electricity needs an unbroken loop to flow.';
    }
    return { complete, wires: { ...wires } };
}

function resetCircuit(){
    wires = { 1: false, 2: false };
    document.getElementById('wire1').classList.remove('connected');
    document.getElementById('wire2').classList.remove('connected');
    updateCircuit();
}

updateCircuit();
</script>
</body>
</html>
