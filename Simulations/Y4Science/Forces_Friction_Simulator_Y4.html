<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Forces &amp; Friction Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .stage { background: #F3F8F7; border-radius: 12px; padding: 24px; }
    .track { position: relative; height: 90px; background: #fff; border: 2px solid #D0DEDC; border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
    .surface-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 14px; }
    .surface-fill.ice { background: repeating-linear-gradient(45deg, #D6F0F5, #D6F0F5 8px, #C3E7EE 8px, #C3E7EE 16px); }
    .surface-fill.floor { background: #E8DCC5; }
    .surface-fill.carpet { background: repeating-linear-gradient(90deg, #E0A899, #E0A899 4px, #CE9384 4px, #CE9384 8px); }
    .box { position: absolute; bottom: 14px; left: 10px; font-size: 40px; transition: left 1s cubic-bezier(.2,.7,.3,1); }

    .surface-picker { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
    .surf-btn { background: #fff; border: 2px solid var(--primary); color: var(--primary-dark); padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .surf-btn.active { background: var(--primary); color: #fff; }

    .slider-row { margin: 0 0 16px; }
    .slider-row .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: #667; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .btn-row { display: flex; gap: 14px; justify-content: center; }
    button.action { padding: 11px 22px; font-size: 14.5px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .btn-push { background-color: var(--primary); color: #fff; }
    .btn-push:hover { background-color: var(--primary-dark); }
    .btn-reset { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); }
    .btn-reset:hover { background-color: #F3F8F7; }

    .readout { text-align: center; margin-top: 16px; font-size: 15px; font-weight: 700; color: var(--primary-dark); }
    .context-note { margin-top: 12px; background: #FFF6E9; border-radius: 8px; padding: 12px 16px; font-size: 13.5px; line-height: 1.55; color: #6b5a3f; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Forces &amp; Friction Simulator</h1>
        <p>Year 4 Science &mdash; Same Push, Different Surface</p>
    </div>

    <div class="stage">
        <div class="track" id="track">
            <div class="surface-fill floor" id="surfaceFill"></div>
            <div class="box" id="box">&#128230;</div>
        </div>

        <div class="surface-picker" id="surfacePicker"></div>

        <div class="slider-row">
            <div class="labels"><span>Gentle push</span><span>Hard push</span></div>
            <input type="range" min="10" max="100" value="50" id="forceSlider">
        </div>

        <div class="btn-row">
            <button class="action btn-push" onclick="applyPush()">Apply Push</button>
            <button class="action btn-reset" onclick="resetBox()">Reset Box</button>
        </div>

        <div class="readout" id="readout"></div>
        <div class="context-note" id="contextNote"></div>
    </div>
</div>

<script>
const SURFACES = {
    ice:    { name: "Smooth Ice",   friction: 0.2, note: "Ice has very little friction, so the box slides a long way with barely any force needed." },
    floor:  { name: "Normal Floor", friction: 0.5, note: "A normal floor has medium friction \u2014 the box slides a fair distance, but not as far as on ice." },
    carpet: { name: "Rough Carpet", friction: 0.9, note: "Carpet has high friction, which resists movement \u2014 the same push moves the box a much shorter distance." }
};

let currentSurface = 'floor';

function renderPicker(){
    const picker = document.getElementById('surfacePicker');
    picker.innerHTML = Object.keys(SURFACES).map(key => {
        const active = currentSurface === key;
        return `<button class="surf-btn${active ? ' active' : ''}" onclick="selectSurface('${key}')">${SURFACES[key].name}</button>`;
    }).join('');
}

function selectSurface(key){
    currentSurface = key;
    const fill = document.getElementById('surfaceFill');
    fill.className = 'surface-fill ' + key;
    renderPicker();
}

function applyPush(){
    const force = parseInt(document.getElementById('forceSlider').value);
    const friction = SURFACES[currentSurface].friction;
    const distance = Math.round((force / friction) * 0.6); // px, simplified physics: more force = further, more friction = less far
    const cappedDistance = Math.min(distance, 640); // keep the box within the visible track

    const box = document.getElementById('box');
    box.style.left = (10 + cappedDistance) + 'px';

    document.getElementById('readout').textContent = 'The box travelled about ' + cappedDistance + 'px on ' + SURFACES[currentSurface].name + '.';
    document.getElementById('contextNote').textContent = SURFACES[currentSurface].note;

    return { force, friction, distance: cappedDistance, surface: currentSurface };
}

function resetBox(){
    document.getElementById('box').style.left = '10px';
    document.getElementById('readout').textContent = '';
    document.getElementById('contextNote').textContent = '';
}

renderPicker();
</script>
</body>
</html>
