<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Shadow &amp; Light Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .stage-wrap { background: linear-gradient(180deg, #FFF6E9 0%, #F3F8F7 65%); border-radius: 12px; padding: 20px; }
    .stage { position: relative; width: 100%; height: 260px; background: #FDFEFE; border: 2px solid #D0DEDC; border-radius: 8px; overflow: hidden; }
    .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #D0DEDC; }
    .sun { position: absolute; top: 16px; font-size: 30px; transition: left .2s; }
    .object { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 46px; z-index: 2; }
    .shadow { position: absolute; bottom: 6px; height: 8px; background: rgba(40,40,40,0.5); border-radius: 50%; transform-origin: left center; transition: width .2s, opacity .2s, left .2s; z-index: 1; }

    .slider-row { margin-top: 18px; }
    .slider-row .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: #667; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .readout { display: flex; justify-content: space-between; font-size: 13px; color: var(--primary-dark); font-weight: 700; margin-top: 6px; }
    .context-note { margin-top: 18px; background: #FFF6E9; border-radius: 8px; padding: 12px 16px; font-size: 13.5px; line-height: 1.55; color: #6b5a3f; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Shadow &amp; Light Simulator</h1>
        <p>Year 4 Science &mdash; How Does the Sun's Position Change a Shadow?</p>
    </div>

    <div class="stage-wrap">
        <div class="stage" id="stage">
            <div class="sun" id="sun">&#9728;&#65039;</div>
            <div class="shadow" id="shadow"></div>
            <div class="object">&#127795;</div>
            <div class="ground"></div>
        </div>
        <div class="slider-row">
            <div class="labels"><span>Sun low, left</span><span>Sun overhead</span><span>Sun low, right</span></div>
            <input type="range" min="0" max="100" value="10" id="sunSlider" oninput="updateShadow()">
        </div>
        <div class="readout">
            <span id="angleReadout">Sun angle: low</span>
            <span id="lengthReadout">Shadow: long</span>
        </div>
        <div class="context-note" id="contextNote"></div>
    </div>
</div>

<script>
function updateShadow(){
    const pos = parseInt(document.getElementById('sunSlider').value); // 0-100
    const stageWidth = 700; // logical width used for placement math

    // Sun horizontal position follows the slider directly
    const sunX = 20 + (pos / 100) * (stageWidth - 60);
    document.getElementById('sun').style.left = sunX + 'px';

    // "Height" of the sun is modeled as highest at pos=50 (overhead), lowest at the edges
    const distanceFromCenter = Math.abs(pos - 50); // 0 (overhead) to 50 (low, at either edge)
    const sunHeightFactor = 1 - (distanceFromCenter / 50); // 1 = overhead, 0 = low on horizon

    // Shadow length: long when sun is low (near horizon), short when sun is overhead
    const maxShadowLen = 260;
    const minShadowLen = 20;
    const shadowLen = Math.round(maxShadowLen - (sunHeightFactor * (maxShadowLen - minShadowLen)));

    // Shadow falls opposite the sun's horizontal side: sun on the left -> shadow points right, and vice versa
    const centerX = stageWidth / 2;
    const shadowDirection = sunX < centerX ? 1 : -1; // 1 = shadow extends right, -1 = extends left

    const shadow = document.getElementById('shadow');
    shadow.style.width = shadowLen + 'px';
    if(shadowDirection === 1){
        shadow.style.left = '50%';
        shadow.style.transform = 'translateX(0) scaleX(1)';
    } else {
        shadow.style.left = (50 - (shadowLen / stageWidth * 100)) + '%';
        shadow.style.transform = 'translateX(0) scaleX(1)';
    }
    shadow.style.opacity = 0.35 + (sunHeightFactor * 0.35); // sharper/darker when sun is higher, softer when very low (simplified)

    // Readouts
    let angleLabel;
    if(distanceFromCenter < 10) angleLabel = 'Sun angle: high overhead';
    else if(distanceFromCenter < 30) angleLabel = 'Sun angle: mid-sky';
    else angleLabel = 'Sun angle: low, near horizon';
    document.getElementById('angleReadout').textContent = angleLabel;

    let lengthLabel;
    if(shadowLen < 80) lengthLabel = 'Shadow: short';
    else if(shadowLen < 180) lengthLabel = 'Shadow: medium';
    else lengthLabel = 'Shadow: long';
    document.getElementById('lengthReadout').textContent = lengthLabel;

    let note;
    if(distanceFromCenter < 10){
        note = "When the sun is high overhead (like Sharjah at midday), shadows are at their shortest.";
    } else if(distanceFromCenter < 30){
        note = "As the sun moves lower in the sky, the shadow starts to stretch out longer.";
    } else {
        note = "When the sun is low near the horizon (early morning or evening), shadows stretch out to their longest.";
    }
    document.getElementById('contextNote').textContent = note;

    return { shadowLen, angleLabel, lengthLabel, sunHeightFactor };
}

updateShadow();
</script>
</body>
</html>
