<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Sound Vibration Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .stage { background: #F3F8F7; border-radius: 12px; padding: 24px; }
    .drum-area { display: flex; align-items: center; justify-content: center; height: 140px; }
    .drum { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #FFD98A, var(--accent)); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 34px; transition: transform .15s; }
    .drum:hover { transform: scale(1.05); }
    .drum.strike { animation: strikePulse .3s ease-out; }
    @keyframes strikePulse { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    .wave-box { height: 70px; background: #fff; border: 2px solid #D0DEDC; border-radius: 8px; margin-top: 16px; display: flex; align-items: center; padding: 0 12px; overflow: hidden; }
    .wave-svg { width: 100%; height: 100%; }
    .wave-path { fill: none; stroke: var(--primary); stroke-width: 3; }

    .slider-row { margin-top: 18px; }
    .slider-row .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: #667; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .readout { text-align: center; margin-top: 16px; font-size: 15px; font-weight: 700; color: var(--primary-dark); }
    .context-note { margin-top: 14px; background: #FFF6E9; border-radius: 8px; padding: 12px 16px; font-size: 13.5px; line-height: 1.55; color: #6b5a3f; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Sound Vibration Simulator</h1>
        <p>Year 4 Science &mdash; How Vibrations Make Volume and Pitch</p>
    </div>

    <div class="stage">
        <div class="drum-area">
            <div class="drum" id="drum" onclick="strikeDrum()">&#129358;</div>
        </div>
        <div class="wave-box">
            <svg class="wave-svg" id="waveSvg" viewBox="0 0 300 60" preserveAspectRatio="none">
                <path class="wave-path" id="wavePath" d=""></path>
            </svg>
        </div>

        <div class="slider-row">
            <div class="labels"><span>Soft tap</span><span>Hard hit</span></div>
            <input type="range" min="1" max="10" value="5" id="volumeSlider" oninput="updateWave()">
        </div>
        <div class="slider-row">
            <div class="labels"><span>Low pitch (loose)</span><span>High pitch (tight)</span></div>
            <input type="range" min="1" max="10" value="5" id="pitchSlider" oninput="updateWave()">
        </div>

        <div class="readout" id="readout"></div>
        <div class="context-note" id="contextNote"></div>
    </div>
</div>

<script>
function buildWavePath(amplitude, frequency){
    // amplitude: 1-10 -> vertical size of the wave. frequency: 1-10 -> how many wiggles across the box.
    const width = 300, midY = 30;
    const amp = (amplitude / 10) * 25;
    const cycles = frequency; // more cycles = higher pitch
    let d = 'M 0 ' + midY;
    const steps = 120;
    for(let i = 0; i <= steps; i++){
        const x = (i / steps) * width;
        const y = midY + amp * Math.sin((i / steps) * cycles * Math.PI * 2);
        d += ' L ' + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
}

function updateWave(){
    const volume = parseInt(document.getElementById('volumeSlider').value);
    const pitch = parseInt(document.getElementById('pitchSlider').value);
    document.getElementById('wavePath').setAttribute('d', buildWavePath(volume, pitch));

    const volLabel = volume <= 3 ? 'quiet' : (volume <= 7 ? 'medium volume' : 'loud');
    const pitchLabel = pitch <= 3 ? 'low-pitched' : (pitch <= 7 ? 'medium-pitched' : 'high-pitched');
    document.getElementById('readout').textContent = 'This sound would be ' + volLabel + ' and ' + pitchLabel + '.';

    let note;
    if(volume > 7 && pitch > 7) note = "A hard hit on a tight drum skin: big, fast vibrations make a loud, high sound.";
    else if(volume <= 3 && pitch <= 3) note = "A soft tap on a loose drum skin: small, slow vibrations make a quiet, low sound.";
    else note = "The size of the vibration (how far it moves) controls volume. The speed of the vibration controls pitch.";
    document.getElementById('contextNote').textContent = note;

    return { volume, pitch, volLabel, pitchLabel };
}

function strikeDrum(){
    const drum = document.getElementById('drum');
    drum.classList.remove('strike');
    void drum.offsetWidth; // restart animation
    drum.classList.add('strike');
    updateWave();
}

updateWave();
</script>
</body>
</html>
