<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FS2 Learning Together 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one playground screen — big game tiles on a sky-and-grass ground; each game takes over the same card. Single bright look by choice. */
:root{
  --sky:#DDF1FF; --grass:#7FD36B; --ink:#23305A; --card:#FFFFFF;
  --sun:#FFC83D; --berry:#FF5D8F; --sea:#2FA7F5; --leaf:#3DBB6B; --grape:#8B5CF6; --tang:#FF8A3D;
  --soft:#EEF6FF; --line:#C9DDF2;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
  --read:"Andika","Verdana",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(var(--sky) 0 78%, var(--grass) 78% 100%) fixed;color:var(--ink);font-family:var(--read);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:clamp(72px,16vw,96px);height:auto;aspect-ratio:351/331;border-radius:50%;background:#fff;border:3px solid var(--ink);flex:none;object-fit:cover}
.school{margin:0 0 2px;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#4B2E83}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--berry)}
.sub{margin:4px 0 0;font-size:16px;opacity:.8}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:800;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:18px;display:inline-flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
.soundbtn{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:18px}
.name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:20px;padding:12px 16px;border:3px solid var(--ink)}
.name label{font-family:var(--display);font-weight:800;font-size:20px}
.name input{font:inherit;font-size:20px;border:3px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0;flex:1 1 160px;color:var(--ink);background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.tile{border:4px solid var(--ink);border-radius:26px;padding:16px 12px 14px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile .pic{font-size:52px;line-height:1.1}
.tile .t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .s{font-size:13px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:2px 10px}
.tile .got{font-size:18px;min-height:22px;letter-spacing:2px}
.note{background:var(--card);border-radius:20px;padding:14px 18px;border:3px dashed var(--ink);font-size:15px;line-height:1.5}
.note h2{font-family:var(--display);font-size:20px;margin:0 0 4px}
.note ul{margin:4px 0 0;padding-left:20px}
/* game */
.game{background:var(--card);border:4px solid var(--ink);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 0 var(--ink);position:relative}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--soft);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:18px}
.dots{display:flex;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:var(--soft)}
.dot.on{background:var(--sun)}.dot.miss{background:var(--line)}.dot.now{transform:scale(1.25)}
.ask{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.ask p{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);margin:0;line-height:1.1;text-wrap:balance}
.listen{background:var(--sun);border:3px solid var(--ink);border-radius:999px;width:56px;height:56px;font-size:28px;flex:none;box-shadow:0 4px 0 var(--ink)}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.visual{min-height:90px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;background:var(--soft);border-radius:22px;padding:14px}
.visual:empty{display:none}
.obj{font-size:clamp(34px,8vw,46px);line-height:1;animation:pop .35s both}
.bigletter{font-family:var(--read);font-weight:700;font-size:110px;line-height:1;color:var(--berry);display:flex;gap:16px;align-items:baseline}
.bigletter small{font-size:70px;color:var(--sea)}
.bigpic{font-size:96px;line-height:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.opt{background:var(--card);border:4px solid var(--ink);border-radius:22px;min-height:120px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt .em{font-size:54px;line-height:1}
.opt .num{font-family:var(--display);font-weight:800;font-size:60px;line-height:1}
.opt .lb{font-size:17px;font-weight:700}
.opt .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:30px;max-width:180px}
.opt svg{width:84px;height:84px}
.opt.right{background:#D7F7DF;border-color:var(--leaf);animation:bounce .5s}
.opt.wrong{background:#FFE1E8;animation:shake .4s}
.opt:disabled{cursor:default}
.cheer{text-align:center;font-family:var(--display);font-weight:800;font-size:26px;min-height:36px;color:var(--leaf)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .stars{font-size:52px;letter-spacing:4px}
.done h2{font-family:var(--display);font-size:36px;margin:0;line-height:1.1}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{font-family:var(--display);font-weight:800;font-size:22px;border:4px solid var(--ink);border-radius:999px;padding:8px 24px;box-shadow:0 5px 0 var(--ink);background:var(--sun)}
.big.alt{background:var(--soft)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.graph{display:flex;gap:clamp(14px,5vw,34px);align-items:flex-end;justify-content:center;padding:6px 4px 0}
.gcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;font-size:clamp(28px,7vw,36px);line-height:1;min-height:40px;padding:4px 8px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);border-top:none}
.gbase{font-size:28px;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:2px 10px}
.tank{width:min(100%,260px);height:180px;border:4px solid var(--ink);border-top:none;border-radius:0 0 26px 26px;background:linear-gradient(transparent 0 32%,#9AD7FF 32%,#5CB8F2 100%);position:relative;overflow:hidden}
.floater{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:58px;line-height:1;transition:top 1.1s ease-in}
.floater.float{top:18%;animation:bob 1.4s 1.1s ease-in-out infinite}
.floater.sink{top:calc(100% - 64px)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.dn{display:flex;flex-direction:column;align-items:center;gap:8px}
.dn .cap{font-size:20px;font-weight:700;text-align:center}
.tracewrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.tbox{position:relative;width:min(100%,320px);aspect-ratio:1;max-width:100%;background:var(--card);border:4px dashed var(--line);border-radius:24px}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%}
.ink{touch-action:none;cursor:crosshair}
.big.ok{background:var(--leaf);color:#fff}
.big:disabled{opacity:.5}
.seq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.car{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:6px;font-size:clamp(28px,7vw,38px)}
.qbox{border:4px dashed var(--berry);border-radius:12px;width:60px;height:60px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;color:var(--berry);background:var(--card)}
.qbox.filled{border-style:solid;border-color:var(--leaf);font-size:38px;animation:bounce .5s}
.mix{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-weight:800;font-size:36px}
.blob{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:52% 48% 55% 45%/48% 55% 45% 52%;border:4px solid var(--ink)}
.blob.big{width:clamp(56px,15vw,76px);height:clamp(56px,15vw,76px)}
.qblob{background:var(--card);border-style:dashed;color:var(--berry);font-size:34px}
.opt .blob{width:64px;height:64px}
.ghost{opacity:0;transform:scale(0);transition:all .5s;animation:none}.ghost.in{opacity:1;transform:scale(1.15)}
.obj.out{opacity:.15;transform:scale(.6);transition:all .5s;filter:grayscale(1)}
.tiles{display:flex;gap:10px;justify-content:center}
.tileL{font-family:var(--read);font-weight:700;font-size:clamp(48px,13vw,70px);line-height:1;background:var(--card);border:4px solid var(--ink);border-radius:16px;padding:6px 18px 12px;color:var(--berry);animation:pop .4s both}
.tileL:nth-child(2){color:var(--sea)}.tileL:nth-child(3){color:var(--leaf)}
.opts.wide{grid-template-columns:1fr}
.opts.wide .opt{min-height:70px;align-items:flex-start}
.rib{display:block;height:26px;border-radius:13px;border:3px solid var(--ink)}
.scene{position:relative;display:block;width:110px;height:96px}
.scene .table{position:absolute;left:12px;top:42px;width:62px;height:9px;background:#9B6A3C;border:3px solid var(--ink);border-radius:4px}
.scene .table::before,.scene .table::after{content:"";position:absolute;top:6px;width:7px;height:40px;background:#9B6A3C;border:3px solid var(--ink);border-top:none}
.scene .table::before{left:2px}.scene .table::after{right:2px}
.pet{position:absolute;font-size:30px;line-height:1}
.pet.on{left:28px;top:8px}.pet.under{left:28px;top:58px}.pet.next{left:78px;top:58px}
.grp2{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:42%;padding:8px;border:3px dashed var(--line);border-radius:16px;background:var(--card)}
.plus{font-family:var(--display);font-weight:800;font-size:44px;color:var(--berry)}
.wave{animation:bounce 1.2s ease-in-out infinite}
.ask p::first-letter{text-transform:uppercase}
.tile .code{font-size:13px;font-weight:700;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 10px}
.gcode{font-size:14px;font-weight:700;opacity:.75;order:3;flex-basis:100%;text-align:center}
.opt svg{width:80px;height:80px}
.optlogo{width:92px;height:auto;border-radius:50%}
.wordcard{font-family:var(--read);font-weight:700;font-size:clamp(40px,11vw,60px);background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:0 22px}
.bug{display:flex;align-items:center;gap:8px}
.wing{width:clamp(100px,30vw,130px);min-height:110px;background:#E8333A;border:4px solid var(--ink);border-radius:60px 14px 14px 60px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:12px}
.wing:last-child{border-radius:14px 60px 60px 14px}
.wing .pip{width:20px;height:20px;border-radius:50%;background:#23305A}
.ghostw{background:#fff;border-style:dashed}.ghostw .pip{opacity:0;transition:opacity .4s}
.ghostw.show{background:#E8333A;border-style:solid}.ghostw.show .pip{opacity:1}
.bug .head{font-size:40px}
.studio{display:flex;flex-direction:column;align-items:center;gap:12px}
.paint{width:min(100%,460px);height:auto;background:#fff;border:4px solid var(--ink);border-radius:18px;touch-action:manipulation}
.paint [data-p]{cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink)}
.sw.sel{outline:4px solid var(--ink);outline-offset:3px;transform:scale(1.1)}
.together{background:#FFF7DD;border:3px dashed var(--ink);border-radius:20px;padding:12px 16px;text-align:left;max-width:560px;display:flex;flex-direction:column;gap:6px}
.together h3{margin:0;font-family:var(--display);font-size:22px}
.together p{margin:0;line-height:1.55}
.tick{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer}
.tick input{width:28px;height:28px;accent-color:#3DBB6B}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.opts{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.scene{position:relative;display:block;width:clamp(96px,26vw,124px);aspect-ratio:120/110}
.scene svg,.stage svg{position:absolute;inset:0;width:100%;height:100%}
.L1{z-index:1}.L3{z-index:3;pointer-events:none}
.scene .o{position:absolute;left:50%;transform:translateX(-50%);line-height:1;z-index:2}
.visual .scene{width:clamp(140px,40vw,180px)}.visual .scene .o{font-size:52px!important}
.atsc{display:flex;align-items:flex-end;gap:2px;font-size:64px;line-height:1}.atsc .act{font-size:42px}
.bigpic.sm{font-size:64px}
.wbtn{font-family:var(--display);font-weight:800;font-size:clamp(28px,7.5vw,42px);line-height:1}
.stage{position:relative;width:100%;max-width:520px;aspect-ratio:340/150;margin:0 auto;background:var(--soft);border-radius:18px}
.mover{position:absolute;transform:translateX(-50%);font-size:clamp(30px,8vw,46px);line-height:1;z-index:2;transition:left .35s,bottom .35s}
.spot{position:absolute;transform:translate(-50%,0);width:clamp(40px,11vw,58px);aspect-ratio:1;border-radius:50%;border:4px dashed var(--berry);background:rgba(255,255,255,.55);z-index:4;animation:pulse 1.4s ease-in-out infinite}
.spot.ok{border-color:var(--leaf);border-style:solid;background:transparent;animation:none}
.spot.no{border-color:#E8333A;animation:shake .4s}
@keyframes pulse{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,0) scale(1.08)}}
.tray{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:17px}
.trayobj{font-size:52px;line-height:1;background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:4px 10px}
.model{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,34px);background:#FFF7DD;border:3px solid var(--sun);border-radius:16px;padding:6px 12px}
.gu{text-align:center;margin:0;font-size:17px}
.tf{display:grid;grid-template-columns:repeat(5,clamp(40px,11vw,54px));gap:4px;background:var(--ink);padding:4px;border-radius:10px}
.tf .cell{aspect-ratio:1;background:#fff;border-radius:6px;display:grid;place-items:center}
.ctr{width:70%;aspect-ratio:1;border-radius:50%;background:#FF5D8F;border:3px solid var(--ink)}
.nline{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center}
.nb{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,40px);width:clamp(36px,10.5vw,60px);aspect-ratio:1;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px}
.nb.q{border:4px dashed var(--berry);color:var(--berry)}.nb.fill{border-style:solid;border-color:var(--leaf);color:var(--leaf);animation:bounce .5s}
.cstage{position:relative;width:100%;height:150px;display:grid;place-items:center;overflow:hidden}
.cobj{font-size:76px;line-height:1}
.cobj.hit.drum,.cobj.hit.bell{animation:bounce .35s}
.cobj.hit.frog{animation:jump .55s}
.cobj.hit.light{animation:flash .5s}
.cobj.light{filter:grayscale(.2)}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-60px)}}
@keyframes flash{0%,100%{filter:brightness(1) drop-shadow(0 0 0 #FFD21F)}40%{filter:brightness(1.6) drop-shadow(0 0 24px #FFD21F)}}
.bub{position:absolute;bottom:0;font-size:44px;animation:rise .85s linear forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-100px)}}
.again{font-size:18px!important;align-self:center}
.lsvg{width:min(100%,420px);height:auto}
.bsvg{width:min(100%,360px);height:auto}
.chipc{width:60px;height:22px;border-radius:6px;border:3px solid var(--ink)}
.pour{display:flex;align-items:center;gap:10px;font-size:62px;line-height:1}.pour .arr{font-size:36px;color:var(--sea)}
.spill{font-size:32px;vertical-align:top}
.story{flex-basis:100%;text-align:center;margin:0;font-size:17px}
.sent{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,22px);line-height:1.2}
.xyl{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:var(--soft);border-radius:20px}
.xbar{width:clamp(36px,11vw,58px);background:var(--b);border:4px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);position:relative}
.xbar::before,.xbar::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.xbar::before{top:8px}.bar::after{bottom:8px}
.xbar.lit{animation:litup .45s}
@keyframes litup{0%{transform:translateY(0);filter:brightness(1)}30%{transform:translateY(6px);filter:brightness(1.5)}100%{transform:translateY(0);filter:brightness(1)}}
.chip,.soundbtn{white-space:nowrap}
header .bar{flex:1 1 280px}
.dom{display:inline-flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px}
.dh{display:grid;grid-template-columns:repeat(3,clamp(18px,5vw,24px));gap:4px}.dp{aspect-ratio:1;display:grid;place-items:center}.dp i{width:90%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.dl{width:4px;align-self:stretch;background:var(--ink);border-radius:2px}
.bigshape svg{width:130px;height:130px}
.rows{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:4px}
.cc{width:clamp(30px,9vw,42px);height:clamp(30px,9vw,42px);display:grid;place-items:center;font-size:clamp(22px,6.5vw,32px);border-bottom:3px dotted var(--line)}
.friend{display:flex;align-items:flex-start;gap:8px;font-size:60px;line-height:1;max-width:100%}
.bubble{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,22px);line-height:1.25;background:#fff;border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 12px;min-width:0}
.seqs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.stp{display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 6px;min-width:70px}
.stp .em{font-size:34px}.stp .lb{font-size:13px;font-weight:700}
.stp.q{border:4px dashed var(--berry);font-family:var(--display);font-weight:800;font-size:34px;color:var(--berry);min-height:62px;justify-content:center}
.sarr{color:var(--sea);font-size:20px}
.pcan{width:min(100%,560px);height:auto;aspect-ratio:640/440;background:#fff;border:4px solid var(--ink);border-radius:18px;touch-action:none;cursor:crosshair}
.stamp{width:44px;height:44px;border-radius:12px;border:3px solid var(--line);background:#fff;font-size:24px;line-height:1;display:grid;place-items:center}
.stamp.sel{border-color:var(--ink);transform:scale(1.12)}

<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ROUNDS=5;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let soundOn=store.get('fs2-sound',true);

/* ---------- sound & voice ---------- */
let actx=null;
function tone(f,d,t0=0,type='sine',vol=.18){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const yay=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.09,'triangle'))};
const oops=()=>{tone(260,.18,0,'square',.08);tone(200,.25,.15,'square',.08)};
const splash=()=>{tone(180,.4,0,'sine',.15);tone(120,.5,.1,'sine',.12)};
/* say(text, done): done() runs once the voice has finished (or after a safe fallback time) */
function say(text,done){let fired=false;const fin=()=>{if(fired)return;fired=true;if(done)done()};
  const s=window.speechSynthesis;
  if(!soundOn||!s){if(done)setTimeout(fin,1600);return}
  try{s.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.85;u.pitch=1.15;const v=s.getVoices().find(v=>/en-GB/i.test(v.lang))||s.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang=v?v.lang:'en-GB';
    if(done){u.onend=()=>setTimeout(fin,500);u.onerror=()=>setTimeout(fin,500);setTimeout(fin,Math.max(4000,text.length*140))}
    window._utt=u;s.speak(u)}catch(e){if(done)setTimeout(fin,1600)}}

const cv=$('#fx'),cx=cv.getContext('2d');let bits=[];
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}fit();addEventListener('resize',fit);
function burst(n=70){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#FFC83D','#FF5D8F','#2FA7F5','#3DBB6B','#8B5CF6','#FF8A3D'];const start=!bits.length;for(let i=0;i<n;i++)bits.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*22*devicePixelRatio,vy:(-Math.random()*18-6)*devicePixelRatio,r:(4+Math.random()*6)*devicePixelRatio,c:pick(cols),a:Math.random()*6,life:90});if(start)requestAnimationFrame(loop)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.6*devicePixelRatio;b.vx*=.98;b.a+=.2;b.life--;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;cx.fillRect(-b.r,-b.r/2,b.r*2,b.r);cx.restore()});bits=bits.filter(b=>b.life>0);if(bits.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height)}

const domino=n=>{const a=Math.min(n,5),b=n-a;const P={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8]};const half=k=>`<span class="dh">${Array.from({length:9},(_,i)=>`<span class="dp">${P[k].includes(i)?'<i></i>':''}</span>`).join('')}</span>`;return `<span class="dom">${half(a)}<span class="dl"></span>${half(b)}</span>`};
function numOpts(n,lo=0,hi=10){const set=new Set([n]);if(n===6||n===9)set.add(n===6?9:6);while(set.size<4){const m=n+rnd(-3,3);if(m>=lo&&m<=hi)set.add(m)}return shuffle([...set]).map(v=>({v,html:`<span class="num">${v}</span>`}))}
function twoRows(A,a,B,b){const row=(e,n)=>`<div class="crow">${Array.from({length:Math.max(a,b)},(_,i)=>`<span class="cc">${i<n?e:''}</span>`).join('')}</div>`;return `<div class="rows">${row(A,a)}${row(B,b)}</div>`}

let G,round,results,q,tries,lock,timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const clearT=()=>{timers.forEach(clearTimeout);timers=[]};
function start(g){G=g;round=0;results=[];if(g.start)g.start();if(g.single)return paintRound();next()}
function shell(inner){return `<div class="game">
    <div class="gtop"><button class="back" id="bk">← All games</button><span class="gcode">${G.area} · ${G.code}</span>
      <div class="dots">${Array.from({length:ROUNDS},(_,i)=>`<span class="dot ${i<round?(results[i]?'on':'miss'):''} ${i===round?'now':''}"></span>`).join('')}</div></div>
    <div class="ask"><button class="listen" id="ls" aria-label="Say it again">🔊</button><p>${q.prompt}</p></div>
    ${inner}<div class="cheer" id="ch" aria-live="polite"></div></div>`}
function wire(){$('#bk').onclick=()=>{clearT();home()};$('#ls').onclick=()=>say(q.speak,q.play);setTimeout(()=>say(q.speak,q.play),250)}
function next(){
  clearT();
  if(round>=ROUNDS)return finish();
  q=G.make(round);tries=0;lock=false;
  if(q.kind==='trace')return traceRound();
  if(q.kind==='say')return sayRound();
  if(q.kind==='music')return musicRound();
  $('#app').innerHTML=shell(`<div class="visual">${q.visual}</div>
    <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.html}</button>`).join('')}</div>`);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b));
  if($('#rp'))$('#rp').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}q.play()};
  wire();
}
function win(delay){
  lock=true;results[round]=tries===0;
  $('#ch').textContent=(tries===0?'⭐ ':'')+pick(CHEERS);yay();burst(tries===0?70:30);
  if(q.onRight)q.onRight();
  const here=q;setTimeout(()=>say(q.good,()=>{if(q===here){round++;next()}}),delay||(q.onRight?1000:700));
}
function choose(b){
  if(lock)return;const o=q.options[+b.dataset.i];
  if(o.v===q.answer){b.classList.add('right');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);win()}
  else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');oops();$('#ch').textContent='Try again!';say('Try again!')}
}

const STAMPS=['⭐','🌸','❤️','🌈','🐟','🦋','☀️','🌳'];

    <div class="pal">${STAMPS.map(s=>`<button class="stamp" data-s="${s}">${s}</button>`).join('')}<button class="stamp" id="thick" aria-label="brush size">⬤</button></div>
    <div class="btnrow"><button class="big alt" id="pclr">↺ Start again</button><button class="big ok" id="fin" disabled>✓ I finished!</button></div></div>`);

  const cv2=$('#pc'),c=cv2.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,640,440);c.lineCap=c.lineJoin='round';
  let col=PAL[0],stamp=null,size=14,down=false,last=null,marks=0;
  const pt=e=>{const r=cv2.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*440/r.height]};
  const mark=()=>{marks++;if(marks>25)$('#fin').disabled=false};
  cv2.onpointerdown=e=>{down=true;cv2.setPointerCapture(e.pointerId);last=pt(e);
    if(stamp){c.font='64px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(stamp,last[0],last[1]);tone(600+rnd(0,400),.12,0,'triangle');marks+=8;mark();down=false;return}
    c.beginPath();c.fillStyle=col;c.arc(last[0],last[1],size/2,0,7);c.fill();mark()};
  cv2.onpointermove=e=>{if(!down)return;const p=pt(e);c.strokeStyle=col;c.lineWidth=size;c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p;mark()};
  cv2.onpointerup=cv2.onpointercancel=()=>{down=false};
  const sel=b=>document.querySelectorAll('.sw,.stamp').forEach(x=>x.classList.toggle('sel',x===b));
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{col=b.dataset.c;stamp=null;sel(b);tone(660,.08)});

  $('#pclr').onclick=()=>{c.fillStyle='#fff';c.fillRect(0,0,640,440);marks=0;$('#fin').disabled=true};
  $('#fin').onclick=()=>{results=Array(ROUNDS).fill(true);burst(100);yay();say('What a beautiful picture! Tell your grown-up about your picture.',()=>finish())};

/* ---------- count what you cannot touch ---------- */
function countPlay(k,n,P){
  clearT();const cs=$('#cs');if(!cs)return;const gap=k==='bubbles'?750:800;
  if(k==='bubbles')cs.innerHTML='';
  for(let i=0;i<n;i++)later(()=>{
    P.snd();
    if(k==='bubbles'){const b=document.createElement('span');b.className='bub';b.textContent='🫧';b.style.left=(10+Math.random()*75)+'%';cs.appendChild(b);later(()=>{b.textContent='💥';later(()=>b.remove(),200)},650)}
    else{const o=$('#co');if(!o)return;o.classList.remove('hit');void o.offsetWidth;o.classList.add('hit',k)}
  },400+i*gap);
}

/* ---------- music maker ---------- */
function musicRound(){
  $('#app').innerHTML=shell(`<div class="xyl">${XYL.map(([c],i)=>`<button class="xbar" data-i="${i}" style="--b:${c};height:${150-i*14}px" aria-label="note ${i+1}"></button>`).join('')}</div>
    <div class="btnrow"><button class="big alt" id="rp">▶ Play the tune again</button></div>`);
  let input=[],playing=false;
  const hit=(i,t0=0)=>later(()=>{tone(XYL[i][1],.45,0,'triangle',.25);const b=document.querySelector(`.xbar[data-i="${i}"]`);if(b){b.classList.remove('lit');void b.offsetWidth;b.classList.add('lit')}},t0);
  q.play=()=>{clearT();playing=true;input=[];q.seq.forEach((i,k)=>hit(i,300+k*650));later(()=>{playing=false;$('#ch').textContent='Your turn!'},300+q.seq.length*650)};
  document.querySelectorAll('.xbar').forEach(b=>b.onclick=()=>{
    if(lock||playing)return;const i=+b.dataset.i;hit(i);input.push(i);
    const k=input.length-1;
    if(input[k]!==q.seq[k]){tries++;input=[];later(()=>{oops();$('#ch').textContent='Listen again!';later(()=>q.play(),900)},300)}
    else if(input.length===q.seq.length)later(()=>win(400),400);
  });
  $('#rp').onclick=()=>{if(!lock)q.play()};
  wire();
}

  $('#yes').onclick=()=>{if(lock)return;$('#md').hidden=false;q.good=`Well done! ${q.model}`;win(500)};

/* ---------- tracing ---------- */
function traceRound(){
  $('#app').innerHTML=shell(`<div class="tracewrap"><div class="tbox"><canvas id="guide" width="300" height="300"></canvas><canvas id="ink" class="ink" width="300" height="300"></canvas></div>
    <div class="btnrow"><button class="big alt" id="clr">↺ Clear</button><button class="big ok" id="chk">✓ Done</button></div></div>`);
  wire();
  const W=300,g=$('#guide').getContext('2d'),ink=$('#ink'),k=ink.getContext('2d');
  const font=`700 ${q.text.length>1?170:230}px Andika, Verdana, sans-serif`;
  const mask=document.createElement('canvas');mask.width=mask.height=W;const m=mask.getContext('2d');
  const draw=()=>{g.clearRect(0,0,W,W);
    g.strokeStyle='#C9DDF2';g.lineWidth=2;g.setLineDash([8,8]);[60,235].forEach(y=>{g.beginPath();g.moveTo(10,y);g.lineTo(W-10,y);g.stroke()});g.setLineDash([]);
    g.font=font;g.textAlign='center';g.textBaseline='alphabetic';g.fillStyle='#E4E9F2';g.fillText(q.text,W/2,235);
    g.setLineDash([3,7]);g.lineWidth=3;g.strokeStyle='#8A97B8';g.strokeText(q.text,W/2,235);g.setLineDash([]);
    m.clearRect(0,0,W,W);m.font=font;m.textAlign='center';m.fillStyle='#000';m.fillText(q.text,W/2,235)};
  (document.fonts&&document.fonts.load?document.fonts.load(font):Promise.resolve()).then(draw,draw);
  k.lineCap=k.lineJoin='round';k.lineWidth=22;k.strokeStyle='#2FA7F5';
  let down=false,last=null;
  const pt=e=>{const r=ink.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
  ink.onpointerdown=e=>{if(lock)return;down=true;ink.setPointerCapture(e.pointerId);last=pt(e);k.beginPath();k.arc(last[0],last[1],11,0,7);k.fillStyle='#2FA7F5';k.fill()};
  ink.onpointermove=e=>{if(!down)return;const p=pt(e);k.beginPath();k.moveTo(last[0],last[1]);k.lineTo(p[0],p[1]);k.stroke();last=p};
  ink.onpointerup=ink.onpointercancel=()=>{down=false};
  $('#clr').onclick=()=>{if(!lock)k.clearRect(0,0,W,W)};
  $('#chk').onclick=()=>{
    if(lock)return;
    const md=m.getImageData(0,0,W,W).data,id=k.getImageData(0,0,W,W).data;
    let inL=0,cov=0,drawn=0,stray=0;
    for(let y=0;y<W;y+=4)for(let x=0;x<W;x+=4){const i=(y*W+x)*4,isL=md[i+3]>100,isD=id[i+3]>100;
      if(isL){inL++;if(isD)cov++}
      if(isD){drawn++;let near=false;for(let dy=-16;dy<=16&&!near;dy+=8)for(let dx=-16;dx<=16;dx+=8){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<W&&md[(yy*W+xx)*4+3]>100){near=true;break}}if(!near)stray++}}
    const c=inL?cov/inL:0,s=drawn?stray/drawn:1;
    if(drawn&&c>=.55&&s<=.3){$('#chk').disabled=true;win()}
    else{tries++;oops();const msg=!drawn?'Use your finger to write the number.':c<.55?'Keep going! Cover more of the grey number.':'Try to stay on the grey number.';$('#ch').textContent=msg;say(msg)}
  };
}

function finish(){
  const s=results.filter(Boolean).length;best[G.id]=Math.max(best[G.id]||0,s);store.set('fs2t3-best',best);
  const who=name?`, ${name}`:'';
  const msg=s===5?`Wow${who}! All 5 stars!`:s>=3?`Great work${who}!`:`Good try${who}! Play again for more stars.`;
  $('#app').innerHTML=`<div class="game"><div class="done">
    <div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(ROUNDS-s)}</div>
    <h2>${msg}</h2><p style="margin:0">You got ${s} out of ${ROUNDS} stars in <b>${G.title}</b>.</p>
    <div class="together"><h3>🤝 Do it together</h3><p>${G.together}</p>
      <label class="tick"><input type="checkbox" id="tk" ${done[G.id]?'checked':''}> We did it together</label></div>
    <div class="btnrow"><button class="big" id="again">Play again</button><button class="big alt" id="hm">All games</button></div></div></div>`;
  $('#tk').onchange=e=>{done[G.id]=e.target.checked;store.set('fs2t3-done',done);if(e.target.checked){yay();burst(40)}};
  $('#again').onclick=()=>start(G);$('#hm').onclick=home;
  burst(140);yay();say(msg);
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
home();
</script>
