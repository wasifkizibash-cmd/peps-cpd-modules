#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"preventing-bullying-cyberbullying","code":"PBC","passMark":80,"hours":"2 hours","accent":"#B03A48","accentSoft":"#F8E6E8","eyebrow":{"en":"Staff CPD · Safeguarding · Level 2 content · Performance Standard 5","ar":"تطوير مهني للموظفين · الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> · محتوى المستوى الثاني · المعيار الخامس"},"title":{"en":"Preventing Bullying and Cyberbullying","ar":"الوقاية من التنمّر والتنمّر الإلكتروني"},"subtitle":{"en":"A self-paced module on how to recognise bullying and cyberbullying, respond when you see it or are told about it, support both children involved, and help build a school culture where bullying does not take hold.","ar":"وحدة ذاتية الوتيرة عن كيفية التعرّف إلى التنمّر والتنمّر الإلكتروني، والاستجابة عندما تراه أو تُخبَر به، ودعم الطفلين المعنيين، والمساهمة في بناء ثقافة مدرسية لا يترسخ فيها التنمّر."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"نحو ساعتين، بوتيرة ذاتية بالكامل"},"standard":{"en":"UAE School Inspection Framework · Performance Standard 5 (Protection, Care, Guidance & Support)","ar":"إطار الإشراف على المدارس في الإمارات · المعيار الخامس (الحماية والرعاية والتوجيه والدعم)"},"source":{"en":"PEPS Child Protection & Safeguarding Policy (Sections 3.2, 3.3, 6), Social Media Policy (Sections 10, 11, 15, 18), Staff Code of Conduct","ar":"سياسة حماية الطفل وصونه (الأقسام 3-2 و3-3 و6)، وسياسة وسائل التواصل الاجتماعي (الأقسام 10 و11 و15 و18)، وميثاق سلوك الموظفين"}},"modules":[{"id":"m1","title":{"en":"What Bullying Is, and Why It Is a Safeguarding Matter","ar":"ما هو التنمّر ولماذا هو مسألة صون شامل"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"How PEPS treats bullying","ar":"كيف تتعامل المدرسة مع التنمّر"},"c":{"en":"The PEPS safeguarding policy lists \u003cstrong>bullying (including online/cyberbullying)\u003c/strong> among the forms of peer-on-peer abuse. Abusive behaviour between children is never dismissed as “banter” or “part of growing up”. The policy's definition of emotional abuse also includes \u003cstrong>exposing a child to serious bullying, isolation or humiliation\u003c/strong>. Bullying is therefore not only a behaviour matter: it can be a safeguarding concern.","ar":"تدرج سياسة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المدرسة \u003cstrong>التنمّر (بما فيه التنمّر الإلكتروني)\u003c/strong> ضمن أشكال الإساءة بين الأقران. ولا يُستهان بالسلوك المسيء بين الأطفال باعتباره «مزاحًا» أو «جزءًا من النمو». كما يشمل تعريف السياسة للإساءة العاطفية \u003cstrong>تعريض الطفل للتنمّر الجسيم أو العزلة أو الإذلال\u003c/strong>. ولذلك فالتنمّر ليس مسألة سلوك فحسب، بل قد يكون قلقًا يتعلق بالصون الشامل."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: a working definition","ar":"ممارسة مهنية جيدة: تعريف عملي"},"c":{"en":"Bullying is usually described as behaviour that is \u003cstrong>intended to hurt, repeated over time, and involves an imbalance of power\u003c/strong>, whether through size, age, status, numbers, popularity, or technology. The school's detailed definition and procedure are in the Anti-Bullying Policy. Follow that policy for the school's exact wording. In practice you do not need to prove all three features before reporting.","ar":"يُوصف التنمّر عادةً بأنه سلوك \u003cstrong>يقصد الإيذاء ويتكرر مع الوقت وينطوي على اختلال في القوة\u003c/strong>، سواء بالحجم أو العمر أو المكانة أو العدد أو الشعبية أو التقنية. والتعريف التفصيلي للمدرسة وإجراءاتها في سياسة مكافحة التنمّر، فاتبع تلك السياسة للصياغة الدقيقة. وعمليًا لا يلزمك أن تثبت السمات الثلاث كلها قبل الإبلاغ."}},{"t":"h","c":{"en":"Bullying or not?","ar":"تنمّر أم لا؟"}},{"t":"table","head":{"en":["More likely ordinary conflict","More likely bullying"],"ar":["أقرب إلى خلاف عادي","أقرب إلى التنمّر"]},"rows":[{"en":["A one-off argument between equals","Repeated targeting of the same child"],"ar":["جدال لمرة واحدة بين متكافئين","استهداف متكرر للطفل نفسه"]},{"en":["Both children are upset and want it to end","One child is clearly hurt and cannot easily stop it"],"ar":["كلا الطفلين منزعج ويريد إنهاء الأمر","طفل واحد متأذٍ بوضوح ولا يستطيع إيقاف الأمر بسهولة"]},{"en":["Similar size, status or friendship group","A group against one, or an older against a younger child"],"ar":["تقارب في الحجم أو المكانة أو مجموعة الأصدقاء","مجموعة ضد طفل واحد، أو طفل أكبر ضد أصغر"]},{"en":["Children resolve it with a little help","It continues, or moves online, after adults step in"],"ar":["يحلّه الطفلان بقليل من المساعدة","يستمر أو ينتقل إلى الإنترنت بعد تدخل البالغين"]}]},{"t":"callout","k":"warn","title":{"en":"When in doubt, report","ar":"عند الشك، أبلغ"},"c":{"en":"Do not wait to decide whether something “counts” as bullying. If you are worried, record it and raise it with the DSL or a deputy. The DSL decides how it is handled, including how it links with the Anti-Bullying Policy and the Behaviour & Discipline Policy.","ar":"لا تنتظر لتقرر هل يُعدّ أمر ما تنمّرًا. إذا كنت قلقًا فسجّله وارفعه إلى مسؤول الحماية أو أحد نوابه. فهو من يقرر كيفية التعامل معه، بما في ذلك ارتباطه بسياسة مكافحة التنمّر وسياسة السلوك والانضباط."}}],"checks":[{"id":"m1q1","q":{"en":"How does the PEPS safeguarding policy classify bullying, including cyberbullying?","ar":"كيف تصنّف سياسة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المدرسة التنمّر، بما فيه التنمّر الإلكتروني؟"},"opts":[{"en":"As a form of peer-on-peer abuse, which can also be emotional abuse when serious","ar":"بوصفه شكلًا من أشكال الإساءة بين الأقران، وقد يكون أيضًا إساءة عاطفية عندما يكون جسيمًا"},{"en":"As a minor discipline matter only","ar":"بوصفه مسألة انضباط بسيطة فقط"},{"en":"As a normal part of growing up that children should learn to handle","ar":"بوصفه جزءًا طبيعيًا من النمو ينبغي أن يتعلم الأطفال التعامل معه"},{"en":"As a matter for parents rather than the school","ar":"بوصفه مسألة تخص أولياء الأمور لا المدرسة"}],"correct":0,"expl":{"en":"The policy lists bullying among forms of peer-on-peer abuse and includes serious bullying in its definition of emotional abuse.","ar":"تدرج السياسة التنمّر ضمن أشكال الإساءة بين الأقران وتُدخل التنمّر الجسيم في تعريفها للإساءة العاطفية."}},{"id":"m1q2","q":{"en":"Which situation is most likely to be bullying?","ar":"أي موقف أقرب إلى أن يكون تنمّرًا؟"},"opts":[{"en":"Two friends of equal standing disagree over a game and then make up","ar":"صديقان متكافئان يختلفان حول لعبة ثم يتصالحان"},{"en":"A group of students repeatedly leave one classmate out and mock him online, and he has stopped eating lunch in the canteen","ar":"مجموعة من الطلبة تستبعد زميلًا لهم مرارًا وتسخر منه عبر الإنترنت، وقد توقف عن تناول الغداء في المقصف"},{"en":"A student accidentally trips over another's bag","ar":"طالب يتعثر عن غير قصد بحقيبة آخر"},{"en":"Two students argue once about who is first in the queue","ar":"طالبان يتجادلان مرة واحدة حول من يتقدم في الطابور"}],"correct":1,"expl":{"en":"Repetition, a group against one, online involvement and a visible effect on the child all point to bullying.","ar":"التكرار ومجموعة ضد فرد والبعد الرقمي والأثر الظاهر على الطفل كلها تشير إلى التنمّر."}}]},{"id":"m2","title":{"en":"Forms of Bullying and Signs to Look For","ar":"أشكال التنمّر والعلامات التي ينبغي ملاحظتها"},"minutes":20,"blocks":[{"t":"h","c":{"en":"Forms of bullying","ar":"أشكال التنمّر"}},{"t":"table","head":{"en":["Form","What it can look like"],"ar":["الشكل","كيف قد يبدو"]},"rows":[{"en":["Verbal","Name-calling, insults, threats, mocking accents, teasing about appearance, family or ability"],"ar":["اللفظي","التنابز بالألقاب والإهانات والتهديدات والسخرية من اللهجة والتعليقات على المظهر أو الأسرة أو القدرات"]},{"en":["Social / relational","Leaving someone out, spreading rumours, turning friends against someone, “silent treatment”"],"ar":["الاجتماعي / العلائقي","استبعاد شخص ونشر الشائعات وتأليب الأصدقاء عليه ومقاطعته بالصمت"]},{"en":["Physical","Hitting, pushing, tripping, taking or damaging belongings"],"ar":["الجسدي","الضرب والدفع والتعثير وأخذ الممتلكات أو إتلافها"]},{"en":["Prejudice-based","Targeting a child's religion, nationality, race, disability, gender or family background"],"ar":["القائم على التحيز","استهداف دين الطفل أو جنسيته أو عرقه أو إعاقته أو نوعه الاجتماعي أو خلفيته الأسرية"]},{"en":["Cyberbullying","Hurtful messages, group chats that target someone, humiliating images or videos, fake accounts, exclusion from online groups"],"ar":["التنمّر الإلكتروني","رسائل مؤذية، ومجموعات محادثة تستهدف شخصًا، وصور أو مقاطع مُهينة، وحسابات مزيفة، والاستبعاد من المجموعات الرقمية"]}]},{"t":"h","c":{"en":"Signs a child may be being bullied","ar":"علامات قد تدل على أن الطفل يتعرض للتنمّر"}},{"t":"list","c":{"en":["Reluctance to come to school, or to go to certain places such as the playground, toilets or bus","Becomes quiet, tearful, anxious or angry, or loses interest in things they used to enjoy","Lost, damaged or “missing” belongings, or money; unexplained injuries","Is on their own at break, or has lost their friends","Stomach aches, headaches or sleep problems, especially on school mornings","A drop in attendance or in attainment","Upset after using a phone or computer, or suddenly stops using it"],"ar":["التردد في الحضور إلى المدرسة أو في الذهاب إلى أماكن معينة كالملعب أو دورات المياه أو الحافلة","يصبح هادئًا أو باكيًا أو قلقًا أو غاضبًا، أو يفقد الاهتمام بما كان يستمتع به","ممتلكات أو أموال مفقودة أو تالفة أو «ناقصة»؛ أو إصابات غير مفسَّرة","يكون وحده في الاستراحة أو فقد أصدقاءه","آلام معدة أو صداع أو مشكلات في النوم، خصوصًا في صباحات المدرسة","تراجع في الحضور أو التحصيل","انزعاج بعد استخدام الهاتف أو الحاسوب، أو التوقف المفاجئ عن استخدامه"]}},{"t":"h","c":{"en":"Signs a child may be bullying others","ar":"علامات قد تدل على أن الطفل يتنمّر على الآخرين"}},{"t":"list","c":{"en":["Unexplained new possessions, or others' belongings in their bag","Is part of a group that laughs at or excludes one child","Is aggressive, needs to be in control, or is very worried about status","May themselves have been harmed, or have unmet needs: see CPD 4"],"ar":["ممتلكات جديدة غير مفسَّرة أو أغراض الآخرين في حقيبته","يكون ضمن مجموعة تضحك على طفل أو تستبعده","عدواني أو يحتاج إلى السيطرة أو شديد القلق على مكانته","قد يكون هو نفسه تعرّض للأذى أو لديه احتياجات غير ملباة: انظر الوحدة 4"]}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: hidden places and quiet times","ar":"ممارسة مهنية جيدة: الأماكن المخفية والأوقات الهادئة"},"c":{"en":"Bullying often takes place where adults are not looking: queues, toilets, changing rooms, back of the bus, corridors between lessons, and online. Notice which children are always last, always alone, or always the “joke”.","ar":"يحدث التنمّر غالبًا حيث لا ينظر البالغون: الطوابير ودورات المياه وغرف تبديل الملابس ومؤخرة الحافلة والممرات بين الحصص وعبر الإنترنت. لاحظ من هم الأطفال الذين يكونون دائمًا الأخيرين أو دائمًا وحدهم أو دائمًا موضوع «النكتة»."}}],"checks":[{"id":"m2q1","q":{"en":"A usually confident student now avoids the canteen, has lost his friends and says he has a stomach ache every morning. What is the best response?","ar":"طالب واثق عادةً أصبح يتجنب المقصف وفقد أصدقاءه ويقول إنه يعاني من ألم في المعدة كل صباح. ما أفضل استجابة؟"},"opts":[{"en":"Tell him to toughen up and ignore the other students","ar":"قل له أن يتصلب ويتجاهل الطلبة الآخرين"},{"en":"Wait until he tells you what is wrong","ar":"انتظر حتى يخبرك بما يزعجه"},{"en":"Record what you have noticed, with dates, and raise it with the DSL or a deputy the same day","ar":"سجّل ما لاحظته مع التواريخ وارفعه إلى مسؤول الحماية أو أحد نوابه في اليوم نفسه"},{"en":"Ask his friends to explain why they dropped him","ar":"اطلب من أصدقائه أن يشرحوا لماذا تخلوا عنه"}],"correct":2,"expl":{"en":"Avoidance of places, loss of friends and recurring physical complaints are classic signs. Record and report. Do not wait for a disclosure.","ar":"تجنب الأماكن وفقدان الأصدقاء والشكاوى الجسدية المتكررة علامات كلاسيكية. سجّل وأبلغ. ولا تنتظر الإفصاح."}},{"id":"m2q2","q":{"en":"Which of the following is an example of prejudice-based bullying?","ar":"أي مما يلي مثال على التنمّر القائم على التحيز؟"},"opts":[{"en":"Disagreeing with a student about a football score","ar":"الاختلاف مع طالب حول نتيجة مباراة كرة قدم"},{"en":"Asking a student to repeat an answer in class","ar":"أن يُطلب من طالب إعادة إجابة في الصف"},{"en":"Choosing a student last for a team after a fair selection","ar":"اختيار طالب أخيرًا في فريق بعد انتقاء عادل"},{"en":"Repeatedly mocking a student's religion or nationality","ar":"السخرية المتكررة من دين طالب أو جنسيته"}],"correct":3,"expl":{"en":"Prejudice-based bullying targets a child's identity or background. It is raised with the DSL like any other concern.","ar":"يستهدف التنمّر القائم على التحيز هوية الطفل أو خلفيته. ويُرفع إلى مسؤول الحماية كأي قلق آخر."}}]},{"id":"m3","title":{"en":"Cyberbullying: What Is Different Online","ar":"التنمّر الإلكتروني: ما الذي يختلف عبر الإنترنت"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"What the PEPS Social Media Policy says","ar":"ما تقوله سياسة المدرسة لوسائل التواصل الاجتماعي"},"c":{"en":"Cyberbullying is \u003cstrong>treated as seriously as any other form of bullying\u003c/strong>. Students are taught to never send or forward hurtful, threatening or embarrassing messages or images; to understand that being in a group chat that targets someone is \u003cstrong>participation, not neutral bystanding\u003c/strong>; to \u003cstrong>save evidence\u003c/strong> (screenshots) and report to a trusted adult; and \u003cstrong>not to retaliate\u003c/strong>.","ar":"يُعامَل التنمّر الإلكتروني \u003cstrong>بالجدية نفسها كأي شكل آخر من أشكال التنمّر\u003c/strong>. ويُعلَّم الطلبة ألا يرسلوا أو يعيدوا إرسال رسائل أو صور مؤذية أو مهدِّدة أو محرجة؛ وأن يفهموا أن وجودهم في مجموعة محادثة تستهدف شخصًا ما \u003cstrong>مشاركة وليس وقوفًا محايدًا\u003c/strong>؛ وأن \u003cstrong>يحتفظوا بالأدلة\u003c/strong> (لقطات الشاشة) ويبلغوا بالغًا موثوقًا؛ وأن \u003cstrong>لا ينتقموا\u003c/strong>."}},{"t":"h","c":{"en":"Why it can feel worse","ar":"لماذا قد يبدو أسوأ"}},{"t":"list","c":{"en":["\u003cstrong>It follows the child home.\u003c/strong> There is no safe place or time, and it can happen late at night.","\u003cstrong>It spreads and lasts.\u003c/strong> Content can be shared with many people and can be difficult or impossible to fully remove.","\u003cstrong>It can be anonymous\u003c/strong>, which makes it feel more threatening and harder to address.","\u003cstrong>Adults often cannot see it\u003c/strong>, so children carry it alone unless they tell someone."],"ar":["\u003cstrong>يلاحق الطفل إلى المنزل.\u003c/strong> فلا يوجد مكان أو وقت آمن، وقد يحدث في وقت متأخر من الليل.","\u003cstrong>ينتشر ويدوم.\u003c/strong> إذ يمكن مشاركة المحتوى مع كثيرين وقد يصعب أو يستحيل إزالته بالكامل.","\u003cstrong>قد يكون مجهول المصدر\u003c/strong> مما يجعله أشد تهديدًا وأصعب في المعالجة.","\u003cstrong>غالبًا لا يراه البالغون،\u003c/strong> فيحمله الأطفال وحدهم ما لم يخبروا أحدًا."]}},{"t":"h","c":{"en":"Different roles in cyberbullying","ar":"الأدوار المختلفة في التنمّر الإلكتروني"}},{"t":"table","head":{"en":["Role","What it looks like"],"ar":["الدور","كيف يبدو"]},"rows":[{"en":["Starts it","Writes or posts the hurtful content"],"ar":["من يبدأه","يكتب المحتوى المؤذي أو ينشره"]},{"en":["Joins in","Likes, shares, comments, or forwards the content"],"ar":["من ينضم","يعجب أو يشارك أو يعلّق أو يعيد إرسال المحتوى"]},{"en":["Watches","Stays in the group chat and says nothing. The policy does not treat this as neutral"],"ar":["من يشاهد","يبقى في مجموعة المحادثة ولا يقول شيئًا. ولا تعدّ السياسة ذلك حيادًا"]},{"en":["Speaks up","Saves evidence, supports the child and tells a trusted adult. This is what we want to encourage"],"ar":["من يتحدث","يحتفظ بالأدلة ويدعم الطفل ويخبر بالغًا موثوقًا. وهذا ما نريد تشجيعه"]}]},{"t":"callout","k":"warn","title":{"en":"The law, and the limits of the school's reach","ar":"القانون وحدود نطاق المدرسة"},"c":{"en":"The policies refer to Federal Decree-Law No. 34 of 2021 on Combating Rumours and Cybercrimes, which addresses online harassment and the misuse of technology to harm a child. The Social Media Policy applies \u003cstrong>on and off school premises\u003c/strong>, and says that where conduct may constitute a criminal offence under UAE law, the school may also involve the relevant authorities. \u003cstrong>That decision belongs to the DSL and the Principal, not to you.\u003c/strong>","ar":"تشير السياسات إلى المرسوم بقانون اتحادي رقم 34 لسنة 2021 في شأن مكافحة الشائعات والجرائم الإلكترونية، الذي يعالج التحرش الإلكتروني وإساءة استخدام التقنية لإيذاء طفل. وتنطبق سياسة وسائل التواصل الاجتماعي \u003cstrong>داخل المدرسة وخارجها\u003c/strong>، وتنص على أنه إذا كان السلوك قد يشكّل جريمة بموجب قانون الإمارات فقد تُشرك المدرسة الجهات المختصة. \u003cstrong>وهذا القرار يعود إلى مسؤول الحماية والمدير وليس إليك.\u003c/strong>"}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: evidence","ar":"ممارسة مهنية جيدة: الأدلة"},"c":{"en":"Encourage students not to reply or retaliate, and to save screenshots showing the content, sender and date. If they show you, look only at what they show you, note it in your record, and pass it to the DSL. Do not forward or copy it, and never view intimate images of a child.","ar":"شجّع الطلبة على عدم الرد أو الانتقام، وعلى حفظ لقطات الشاشة التي تُظهر المحتوى والمرسل والتاريخ. وإذا أروك فانظر فقط إلى ما يُعرض عليك، ودوّنه في سجلّك وسلّمه إلى مسؤول الحماية. ولا ترسله أو تنسخه، ولا تشاهد أبدًا صورًا حميمة لطفل."}}],"checks":[{"id":"m3q1","q":{"en":"Which advice is consistent with the Social Media Policy for a student who is being cyberbullied?","ar":"أي نصيحة تتسق مع سياسة وسائل التواصل الاجتماعي لطالب يتعرض لتنمّر إلكتروني؟"},"opts":[{"en":"Do not retaliate, save screenshots as evidence, and tell a trusted adult","ar":"لا تنتقم، واحفظ لقطات الشاشة دليلًا، وأخبر بالغًا موثوقًا"},{"en":"Reply with equally hurtful messages so they stop","ar":"ردّ برسائل مؤذية بالقدر نفسه ليتوقفوا"},{"en":"Delete everything straight away and tell nobody","ar":"احذف كل شيء فورًا ولا تخبر أحدًا"},{"en":"Wait a few weeks to see whether it stops","ar":"انتظر بضعة أسابيع لترى هل يتوقف"}],"correct":0,"expl":{"en":"These are the steps the policy teaches: don't retaliate, save evidence, report to a trusted adult.","ar":"هذه هي الخطوات التي تعلّمها السياسة: لا تنتقم، واحتفظ بالأدلة، وأبلغ بالغًا موثوقًا."}},{"id":"m3q2","q":{"en":"A student says, “I never posted anything. I only liked the posts about her.” According to the policy, what is the position?","ar":"يقول طالب: «لم أنشر شيئًا، بل وضعت إعجابًا فقط على المنشورات عنها». بحسب السياسة، ما الموقف؟"},"opts":[{"en":"Liking a post is harmless and cannot be bullying","ar":"الإعجاب بمنشور غير ضار ولا يمكن أن يكون تنمّرًا"},{"en":"Joining in, even by liking or staying in a group that targets someone, is participation in bullying, not neutral bystanding","ar":"الانضمام، ولو بالإعجاب أو بالبقاء في مجموعة تستهدف شخصًا، مشاركة في التنمّر وليس وقوفًا محايدًا"},{"en":"Only the person who wrote the posts can be involved","ar":"الشخص الذي كتب المنشورات وحده يمكن أن يكون ضالعًا"},{"en":"The school has no role in anything posted outside school hours","ar":"لا دور للمدرسة في أي شيء يُنشر خارج ساعات الدوام"}],"correct":1,"expl":{"en":"The Social Media Policy treats participation in group targeting as part of the bullying. The policy also applies on and off school premises.","ar":"تعدّ سياسة وسائل التواصل الاجتماعي المشاركة في استهداف الجماعة جزءًا من التنمّر. وتنطبق السياسة أيضًا داخل المدرسة وخارجها."}},{"id":"m3q3","q":{"en":"A student shows you an embarrassing video of a classmate being shared online. What should you do?","ar":"يريك طالب مقطعًا محرجًا لزميل يُتداول عبر الإنترنت. ماذا عليك أن تفعل؟"},"opts":[{"en":"Forward it to colleagues to ask their opinion","ar":"أرسله إلى الزملاء لتسألهم رأيهم"},{"en":"Comment under the video to tell people to stop","ar":"علّق تحت المقطع لتطلب من الناس التوقف"},{"en":"Look only at what you are shown, do not forward or copy it, note what you saw and report to the DSL the same day","ar":"انظر فقط إلى ما يُعرض عليك، ولا ترسله ولا تنسخه، ودوّن ما رأيته وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Tell the student you will deal with it yourself and say nothing to others","ar":"قل للطالب إنك ستتولى الأمر بنفسك ولا تقل شيئًا لغيره"}],"correct":2,"expl":{"en":"Forwarding or copying spreads harm. Your role is to record and report so the DSL can co-ordinate the response.","ar":"الإرسال أو النسخ ينشر الأذى. ودورك أن تسجّل وتبلّغ ليتولى مسؤول الحماية تنسيق الاستجابة."}}]},{"id":"m4","title":{"en":"Responding: When You See It or Are Told","ar":"الاستجابة: عندما تراه أو تُخبَر به"},"minutes":20,"blocks":[{"t":"p","c":{"en":"Children can raise a concern with a parent, a teacher, their Section Supervisor or the Student Counsellor, and the Social Media Policy says no student will be penalised for reporting a genuine concern in good faith. Whoever they tell, the next steps are the same.","ar":"يستطيع الأطفال رفع قلق إلى أحد الوالدين أو معلم أو مشرف القسم أو مرشد الطلبة، وتنص سياسة وسائل التواصل الاجتماعي على أن أي طالب لن يُعاقَب لإبلاغه عن قلق حقيقي بحسن نية. ومهما كان الشخص الذي يخبرونه، فإن الخطوات التالية واحدة."}},{"t":"steps","c":{"en":["\u003cstrong>Stop it and make the child safe.\u003c/strong> If you see bullying, step in calmly and firmly. If anyone is hurt or in danger, take immediate action.","\u003cstrong>Listen to the child\u003c/strong> who has been targeted. Do not promise secrecy. Reassure: “It's not your fault. You did the right thing.”","\u003cstrong>Do not investigate\u003c/strong> or question witnesses. Avoid asking the children to “sort it out” or shake hands.","\u003cstrong>Record the facts\u003c/strong> on the Recording a Concern form: who, what, when, where, the child's words, and any online platform.","\u003cstrong>Report to the DSL or a deputy the same day.\u003c/strong> They decide the response, with the Anti-Bullying and Behaviour & Discipline Policies.","\u003cstrong>Keep watching\u003c/strong> and keep recording. Report any new incident or any sign of retaliation straight away."],"ar":["\u003cstrong>أوقفه واجعل الطفل في أمان.\u003c/strong> إذا رأيت تنمّرًا فتدخّل بهدوء وحزم. وإذا كان أحد متأذيًا أو في خطر فاتخذ إجراءً فوريًا.","\u003cstrong>أصغِ إلى الطفل\u003c/strong> الذي استُهدف. ولا تَعِد بالسرية. وطمئنه: «ليس ذنبك. وقد أحسنت.»","\u003cstrong>لا تحقّق\u003c/strong> ولا تستجوب الشهود. وتجنب أن تطلب من الطفلين «حل الأمر» أو المصافحة.","\u003cstrong>سجّل الوقائع\u003c/strong> في نموذج تسجيل القلق: من وماذا ومتى وأين وكلمات الطفل وأي منصة رقمية.","\u003cstrong>أبلغ مسؤول الحماية أو أحد نوابه في اليوم نفسه.\u003c/strong> فهم من يقررون الاستجابة بالتنسيق مع سياستي مكافحة التنمّر والسلوك والانضباط.","\u003cstrong>واصل المراقبة\u003c/strong> وواصل التسجيل. وأبلغ عن أي حادثة جديدة أو أي علامة على الانتقام فورًا."]}},{"t":"callout","k":"warn","title":{"en":"Responses that do harm","ar":"استجابات تضرّ"},"c":{"en":"“Just ignore them.” “Stand up for yourself.” “You must have done something to provoke it.” “They're only teasing because they like you.” “Don't be a snitch.” Each tells a child that telling an adult does not help.","ar":"«تجاهلهم فحسب.» «دافع عن نفسك.» «لا بد أنك فعلت شيئًا استفزّهم.» «هم يمازحونك لأنهم يحبونك.» «لا تكن واشيًا.» وكل عبارة منها تخبر الطفل بأن إخبار البالغ لا يفيد."}},{"t":"callout","k":"key","title":{"en":"If it may be more than bullying","ar":"إذا كان قد يكون أكثر من تنمّر"},"c":{"en":"If a bullying incident involves sexual comments or images, serious physical harm, threats to harm someone, self-harm talk or a child in immediate danger, follow the specific guidance in earlier CPDs (\u003cem>Child-on-Child Abuse\u003c/em>, \u003cem>Online Safety\u003c/em>, \u003cem>Recognising Signs of Abuse and Neglect\u003c/em>). If there is immediate danger, contact the Police (999) without waiting for the DSL.","ar":"إذا انطوت حادثة التنمّر على تعليقات أو صور جنسية أو أذى جسدي جسيم أو تهديد بإيذاء شخص أو حديث عن إيذاء النفس أو طفل في خطر داهم، فاتبع الإرشادات المحددة في الوحدات السابقة (\u003cem>الإساءة بين الأطفال\u003c/em> و\u003cem>السلامة الرقمية\u003c/em> و\u003cem>التعرّف إلى علامات الإساءة والإهمال\u003c/em>). وإذا وُجد خطر داهم فاتصل بالشرطة (999) دون انتظار مسؤول الحماية."}}],"checks":[{"id":"m4q1","q":{"en":"A Year 7 student tells you, “Three girls keep leaving me out and spreading rumours about me.” What is the best response?","ar":"تقول لك طالبة في الصف السابع: «ثلاث طالبات يستبعدنني باستمرار وينشرن شائعات عني». ما أفضل استجابة؟"},"opts":[{"en":"Call the three girls in together to hear their side","ar":"استدعِ الطالبات الثلاث معًا لتسمع روايتهن"},{"en":"Tell her to ignore them because they will lose interest","ar":"قل لها أن تتجاهلهن لأنهن سيفقدن الاهتمام"},{"en":"Tell her parents to deal with it directly","ar":"اطلب من والديها أن يتعاملا مع الأمر مباشرةً"},{"en":"Listen, reassure her, do not promise secrecy, record her words and report to the DSL the same day","ar":"أصغِ وطمئنها ولا تَعِد بالسرية وسجّل كلماتها وأبلغ مسؤول الحماية في اليوم نفسه"}],"correct":3,"expl":{"en":"Listen, reassure, record and report. Do not investigate or confront the others yourself, and do not minimise the problem.","ar":"أصغِ وطمئن وسجّل وأبلغ. ولا تحقّق ولا تواجه الأخريات بنفسك، ولا تقلّل من شأن المشكلة."}},{"id":"m4q2","q":{"en":"Which response should staff avoid?","ar":"أي استجابة ينبغي أن يتجنبها الموظفون؟"},"opts":[{"en":"“Just ignore them and they'll stop.”","ar":"«تجاهلهم فحسب وسيتوقفون.»"},{"en":"“Thank you for telling me. That's not okay.”","ar":"«شكرًا لأنك أخبرتني. هذا غير مقبول.»"},{"en":"“I'm going to pass this to someone whose job is to help.”","ar":"«سأسلّم هذا الأمر إلى شخص وظيفته المساعدة.»"},{"en":"“It's not your fault.”","ar":"«ليس ذنبك.»"}],"correct":0,"expl":{"en":"“Just ignore it” dismisses the child's experience and tells them adults will not act.","ar":"«تجاهل الأمر» تقلل من تجربة الطفل وتخبره بأن البالغين لن يتصرفوا."}},{"id":"m4q3","q":{"en":"A week after reporting, you see the same student sitting alone and a classmate whispers “snitch” at him. What should you do?","ar":"بعد أسبوع من الإبلاغ ترى الطالب نفسه جالسًا وحده ويهمس له زميل بكلمة «واشي». ماذا عليك أن تفعل؟"},"opts":[{"en":"Do nothing, since the original report has already been made","ar":"لا شيء، فقد تم الإبلاغ الأول"},{"en":"Step in calmly, then record it and report it to the DSL the same day as a new concern","ar":"تدخّل بهدوء ثم سجّله وأبلغ مسؤول الحماية به في اليوم نفسه بوصفه قلقًا جديدًا"},{"en":"Ask the boys to shake hands in front of the class","ar":"اطلب من الطالبين المصافحة أمام الصف"},{"en":"Tell the student to stay away from the classmate","ar":"قل للطالب أن يبتعد عن زميله"}],"correct":1,"expl":{"en":"Retaliation is a new concern. The DSL needs to know so protection can be adjusted.","ar":"الانتقام قلق جديد. ويحتاج مسؤول الحماية إلى معرفته ليعدّل الحماية."}}]},{"id":"m5","title":{"en":"Supporting Both Children","ar":"دعم الطفلين معًا"},"minutes":15,"blocks":[{"t":"h","c":{"en":"The child who was targeted","ar":"الطفل الذي استُهدف"}},{"t":"list","c":{"en":["Is believed, reassured, and told what will happen next, as far as is appropriate.","Has one trusted adult to go to, and knows how to reach the Student Counsellor.","Has the places and times of risk covered by supervision.","Is checked on quietly and regularly, after the report and after the situation seems to have settled."],"ar":["يُصدَّق ويُطمأن ويُخبَر بما سيحدث لاحقًا بالقدر المناسب.","لديه بالغ موثوق يلجأ إليه ويعرف كيف يصل إلى مرشد الطلبة.","وتغطي الإشرافُ الأماكنَ والأوقات المعرّضة للخطر.","ويُتفقَّد بهدوء وانتظام بعد الإبلاغ وبعد أن تبدو الحالة قد استقرت."]}},{"t":"h","c":{"en":"The child who bullied","ar":"الطفل الذي تنمّر"}},{"t":"list","c":{"en":["The behaviour is \u003cstrong>not acceptable and must stop\u003c/strong>.","The child is still a child. Harmful behaviour can signal unmet needs, pressure from others, or harm the child has experienced. The DSL decides what support and consequences are needed.","The Social Media Policy says the school's response is \u003cstrong>proportionate\u003c/strong>, and takes account of the student's \u003cstrong>age, intent, and whether it was a one-off or a pattern\u003c/strong>.","Consequences are applied under the Behaviour & Discipline Policy and the Anti-Bullying Policy. \u003cstrong>Staff do not set their own sanctions for bullying.\u003c/strong> Refer to the DSL and section supervisor."],"ar":["السلوك \u003cstrong>غير مقبول ويجب أن يتوقف\u003c/strong>.","والطفل ما يزال طفلًا. فقد يدل السلوك الضار على احتياجات غير ملباة أو ضغط من الآخرين أو أذى تعرض له الطفل. ومسؤول الحماية هو من يقرر الدعم والعواقب اللازمة.","وتنص سياسة وسائل التواصل الاجتماعي على أن استجابة المدرسة \u003cstrong>متناسبة\u003c/strong> وتراعي \u003cstrong>عمر الطالب ونيّته وما إذا كان الأمر حادثة معزولة أو نمطًا\u003c/strong>.","وتُطبَّق العواقب بموجب سياسة السلوك والانضباط وسياسة مكافحة التنمّر. و\u003cstrong>لا يضع الموظفون عقوباتهم الخاصة على التنمّر.\u003c/strong> أحِل الأمر إلى مسؤول الحماية ومشرف القسم."]}},{"t":"h","c":{"en":"Working with families","ar":"العمل مع الأسر"}},{"t":"p","c":{"en":"Communication with families about safeguarding and wellbeing concerns is handled by the right people. Under the Parent–School Communication Policy, the Student Counsellor and Social Worker are responsible for sensitive, wellbeing and safeguarding-related communication with families. \u003cstrong>Do not contact either family yourself about a bullying incident.\u003c/strong> The DSL decides whether and how parents are informed, and the Social Media Policy asks parents to talk openly with their child about online life and to contact the school promptly if they become aware of a concern.","ar":"يتولى الأشخاص المناسبون التواصل مع الأسر بشأن مخاوف الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> والرفاه. فبموجب سياسة التواصل بين المدرسة وأولياء الأمور، يتولى مرشد الطلبة والأخصائي الاجتماعي التواصل الحساس مع الأسر المتعلق بالرفاه والصون الشامل. \u003cstrong>لا تتصل بأي من الأسرتين بنفسك بشأن حادثة تنمّر.\u003c/strong> فمسؤول الحماية هو من يقرر هل يُبلَّغ الأهل وكيف، وتطلب سياسة وسائل التواصل الاجتماعي من أولياء الأمور التحدث بصراحة مع أبنائهم عن حياتهم الرقمية والاتصال بالمدرسة سريعًا إذا علموا بقلق."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: be cautious with “mediation”","ar":"ممارسة مهنية جيدة: احذر من «الوساطة»"},"c":{"en":"Bringing the child who was targeted face-to-face with the child who bullied can re-traumatise them, especially where there is a power imbalance. Restorative approaches may be used in some cases, but only when the DSL and the relevant leaders judge it safe and the child who was targeted is willing. It is not a step staff take on their own.","ar":"قد يؤدي جمع الطفل المستهدَف وجهًا لوجه مع الطفل الذي تنمّر إلى إعادة إيذائه نفسيًا، خصوصًا مع وجود اختلال في القوة. وقد تُستخدم المقاربات التصالحية في بعض الحالات، ولكن فقط حين يرى مسؤول الحماية والقيادات المعنية أن ذلك آمن ويكون الطفل المستهدَف راغبًا فيه. وهي ليست خطوة يتخذها الموظفون من تلقاء أنفسهم."}}],"checks":[{"id":"m5q1","q":{"en":"Who decides what support and consequences are appropriate for a child who has bullied?","ar":"من يقرر الدعم والعواقب المناسبة لطفل تنمّر؟"},"opts":[{"en":"Each teacher, according to their own judgement","ar":"كل معلم بحسب تقديره الخاص"},{"en":"The student who was targeted","ar":"الطالب الذي استُهدف"},{"en":"The DSL, working with the section supervisor and under the Behaviour & Discipline and Anti-Bullying Policies","ar":"مسؤول الحماية بالتعاون مع مشرف القسم وبموجب سياستي السلوك والانضباط ومكافحة التنمّر"},{"en":"The other students in the class","ar":"باقي طلبة الصف"}],"correct":2,"expl":{"en":"Staff report. Consequences follow the school's policies and are coordinated, so the response is consistent and fair.","ar":"يبلّغ الموظفون. وتتبع العواقب سياسات المدرسة وتُنسَّق ليكون الرد متسقًا وعادلًا."}},{"id":"m5q2","q":{"en":"You have reported a bullying incident. The targeted student's mother stops you in the corridor to ask what happened. What should you say?","ar":"أبلغت عن حادثة تنمّر. توقفك والدة الطالب المستهدَف في الممر لتسأل عمّا حدث. ماذا تقول؟"},"opts":[{"en":"Tell her everything you know so she is not worried","ar":"أخبرها بكل ما تعرفه حتى لا تقلق"},{"en":"Tell her it was only a small disagreement","ar":"أخبرها بأنه مجرد خلاف صغير"},{"en":"Tell her which students were responsible","ar":"أخبرها بأسماء الطلبة المسؤولين"},{"en":"Be kind, say the school takes it seriously and that the appropriate person will be in touch, and do not discuss details yourself","ar":"كن لطيفًا وقل إن المدرسة تأخذ الأمر بجدية وإن الشخص المناسب سيتواصل معها، ولا تناقش التفاصيل بنفسك"}],"correct":3,"expl":{"en":"Sensitive communication with families is handled by the right people, and details about other children are never shared.","ar":"يتولى الأشخاص المناسبون التواصل الحساس مع الأسر، ولا تُشارَك تفاصيل عن الأطفال الآخرين أبدًا."}}]},{"id":"m6","title":{"en":"Prevention: Building a Culture Where Bullying Does Not Take Hold","ar":"الوقاية: بناء ثقافة لا يترسخ فيها التنمّر"},"minutes":15,"blocks":[{"t":"p","c":{"en":"The Social Media Policy says that \u003cstrong>education, not just restriction\u003c/strong> is the most effective protection, and that safe use is a partnership between school, parents and students. PEPS also teaches awareness through the pastoral/PSHE curriculum, assemblies and awareness campaigns such as Safer Internet Day.","ar":"تنص سياسة وسائل التواصل الاجتماعي على أن \u003cstrong>التثقيف، لا التقييد وحده،\u003c/strong> هو أنجع وسائل الحماية، وأن الاستخدام الآمن شراكة بين المدرسة وأولياء الأمور والطلبة. وتنشر المدرسة الوعي أيضًا عبر منهج التربية الرعوية والشخصية والاجتماعية والصحية والاجتماعات الصباحية وحملات التوعية مثل يوم الإنترنت الأكثر أمانًا."}},{"t":"table","head":{"en":["What staff can do every day","Why it helps"],"ar":["ما يستطيع الموظفون فعله كل يوم","لماذا يساعد"]},"rows":[{"en":["Supervise visibly, especially at transitions, break, toilets, buses and trips","Bullying thrives where adults are absent"],"ar":["الإشراف الظاهر، خصوصًا أثناء الانتقال والاستراحة ودورات المياه والحافلات والرحلات","يزدهر التنمّر حيث يغيب البالغون"]},{"en":["Challenge unkind remarks every time, calmly and clearly","Silence tells children that it is acceptable"],"ar":["تحدَّ التعليقات غير اللطيفة في كل مرة بهدوء ووضوح","الصمت يخبر الأطفال بأنه مقبول"]},{"en":["Notice and include children who are on their own","Isolated children are most at risk"],"ar":["لاحظ الأطفال الوحيدين وأشركهم","الأطفال المعزولون هم الأكثر عرضة للخطر"]},{"en":["Celebrate kindness, difference and tolerance, in line with the school's values and the Global Citizenship Policy","Respect for difference is the best protection against prejudice-based bullying"],"ar":["احتفِ باللطف والاختلاف والتسامح، بما يتفق مع قيم المدرسة وسياسة المواطنة العالمية","احترام الاختلاف هو أفضل حماية من التنمّر القائم على التحيز"]},{"en":["Teach and rehearse what to do: who to tell, how to be an “upstander”","Students who know how to act are more likely to act"],"ar":["علّم وتدرّب على ما ينبغي فعله: لمن يُبلَّغ وكيف تكون «مناصرًا»","الطلبة الذين يعرفون كيف يتصرفون أكثر ميلًا إلى التصرف"]},{"en":["Model respect in how you speak to students and colleagues (Staff Code of Conduct)","Children copy what adults do"],"ar":["كن قدوة في الاحترام في طريقة حديثك إلى الطلبة والزملاء (ميثاق سلوك الموظفين)","يقلّد الأطفال ما يفعله البالغون"]}]},{"t":"callout","k":"key","title":{"en":"Staff are not exempt","ar":"الموظفون ليسوا مستثنين"},"c":{"en":"The Staff Code of Conduct states that discrimination, harassment or bullying of a colleague is not tolerated. Staff conduct is also part of the culture students see. If you notice bullying between adults, raise it under the Code of Conduct and the relevant procedure.","ar":"ينص ميثاق سلوك الموظفين على أن التمييز أو التحرش أو التنمّر ضد زميل غير مقبول. وسلوك الموظفين جزء من الثقافة التي يراها الطلبة. وإذا لاحظت تنمّرًا بين البالغين فارفعه بموجب ميثاق السلوك والإجراء المعتمد."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: teach children to be “upstanders”","ar":"ممارسة مهنية جيدة: علّم الأطفال أن يكونوا «مناصرين»"},"c":{"en":"Help students see that they have options when they witness bullying: say something kind to the child afterwards, refuse to join in or share, save evidence and tell a trusted adult. Praise students who report. Remind them that telling an adult is not “snitching”. It is looking after someone.","ar":"ساعد الطلبة على أن يروا أن أمامهم خيارات عندما يشهدون تنمّرًا: أن يقولوا كلمة لطيفة للطفل بعد ذلك، وأن يرفضوا الانضمام أو المشاركة، وأن يحتفظوا بالأدلة ويخبروا بالغًا موثوقًا. أثنِ على الطلبة الذين يبلّغون. وذكّرهم بأن إخبار بالغ ليس «وشاية» بل هو رعاية لشخص ما."}}],"checks":[{"id":"m6q1","q":{"en":"Which approach does the Social Media Policy describe as the most effective protection?","ar":"أي نهج تصفه سياسة وسائل التواصل الاجتماعي بأنه أنجع وسائل الحماية؟"},"opts":[{"en":"Education, not just restriction, as a partnership between school, parents and students","ar":"التثقيف، لا التقييد وحده، كشراكة بين المدرسة وأولياء الأمور والطلبة"},{"en":"Banning all devices and social media in every circumstance","ar":"حظر جميع الأجهزة ووسائل التواصل في كل الأحوال"},{"en":"Leaving the issue to parents entirely","ar":"ترك المسألة لأولياء الأمور بالكامل"},{"en":"Relying on punishment as a deterrent","ar":"الاعتماد على العقوبة بوصفها رادعًا"}],"correct":0,"expl":{"en":"The policy states this principle directly: education, not just restriction, and shared responsibility.","ar":"تنص السياسة على هذا المبدأ مباشرة: التثقيف لا التقييد وحده، والمسؤولية المشتركة."}},{"id":"m6q2","q":{"en":"A student in your class makes a cruel remark about another student's accent. What should you do?","ar":"يطلق طالب في صفك تعليقًا قاسيًا على لهجة طالب آخر. ماذا عليك أن تفعل؟"},"opts":[{"en":"Ignore it, as it is only one remark","ar":"تجاهله لأنه تعليق واحد فقط"},{"en":"Challenge it calmly and clearly straight away, note it, and report it if it is part of a pattern or concerns you","ar":"تحدَّه بهدوء ووضوح فورًا، ودوّنه، وأبلغ عنه إذا كان جزءًا من نمط أو أقلقك"},{"en":"Laugh along so that you do not seem too strict","ar":"اضحك معهم حتى لا تبدو صارمًا"},{"en":"Wait until the end of term to mention it to the section supervisor","ar":"انتظر حتى نهاية الفصل لتذكره لمشرف القسم"}],"correct":1,"expl":{"en":"Silence tells students such remarks are acceptable. Challenge it every time and report patterns.","ar":"الصمت يخبر الطلبة بأن مثل هذه التعليقات مقبولة. تحدَّها في كل مرة وأبلغ عن الأنماط."}}]},{"id":"m7","title":{"en":"Putting It Together: Case Practice","ar":"الجمع بين كل ما سبق: تطبيق على حالات"},"minutes":15,"blocks":[{"t":"steps","c":{"en":["\u003cstrong>Stop it\u003c/strong> calmly and make the child safe.","\u003cstrong>Listen and reassure.\u003c/strong> No blame, no promise of secrecy.","\u003cstrong>Record\u003c/strong> the facts, in the child's words, with date, time, place and platform.","\u003cstrong>Report\u003c/strong> to the DSL or a deputy the same day. Do not contact families yourself.","\u003cstrong>Support both children\u003c/strong> as the DSL directs. Watch for retaliation."],"ar":["\u003cstrong>أوقفه\u003c/strong> بهدوء واجعل الطفل في أمان.","\u003cstrong>أصغِ وطمئن.\u003c/strong> بلا لوم ولا وعد بالسرية.","\u003cstrong>سجّل\u003c/strong> الوقائع بكلمات الطفل مع التاريخ والوقت والمكان والمنصة.","\u003cstrong>أبلغ\u003c/strong> مسؤول الحماية أو أحد نوابه في اليوم نفسه. ولا تتصل بالأسر بنفسك.","\u003cstrong>ادعم الطفلين\u003c/strong> وفق توجيهات مسؤول الحماية. وراقب الانتقام."]}},{"t":"scenario","title":{"en":"Case A","ar":"الحالة أ"},"c":{"en":"A Year 3 student says, “Nobody will play with me, and a boy keeps calling me smelly in front of everyone.” You have noticed this twice this week.","ar":"يقول طالب في الصف الثالث: «لا أحد يريد اللعب معي، وولد يناديني بالكريه الرائحة أمام الجميع». وقد لاحظت ذلك مرتين هذا الأسبوع."}},{"t":"scenario","title":{"en":"Case B","ar":"الحالة ب"},"c":{"en":"In Year 9, a screenshot of a group chat shows a girl being called names and told to “disappear”. A student you trust gives it to you and asks you not to say who gave it.","ar":"في الصف التاسع تُظهر لقطة شاشة لمحادثة جماعية فتاةً تُنعَت بألقاب ويُقال لها «اختفي». ويعطيك إياها طالب تثق به ويطلب منك ألا تذكر من أعطاك إياها."}},{"t":"scenario","title":{"en":"Case C","ar":"الحالة ج"},"c":{"en":"A Year 6 student has been teasing a smaller boy for weeks. When you stop it, he says, “It's only a joke. Everyone does it.” He is usually well behaved.","ar":"يضايق طالب في الصف السادس ولدًا أصغر منه منذ أسابيع. وعندما توقف الأمر يقول: «إنها مجرد مزحة. الجميع يفعل ذلك». وهو عادةً حسن السلوك."}}],"checks":[{"id":"m7q1","q":{"en":"In Case A, what is the best course of action?","ar":"في الحالة أ، ما أفضل مسار عمل؟"},"opts":[{"en":"Tell him to ignore the boy because name-calling is common at his age","ar":"قل له أن يتجاهل الولد لأن التنابز شائع في عمره"},{"en":"Ask the boy to apologise in front of the class","ar":"اطلب من الولد أن يعتذر أمام الصف"},{"en":"Reassure him, record his words and your own observations with dates, and report to the DSL the same day","ar":"طمئنه وسجّل كلماته وملاحظاتك مع التواريخ وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Wait to see if it happens a third time","ar":"انتظر لترى هل يحدث للمرة الثالثة"}],"correct":2,"expl":{"en":"Repeated name-calling and social exclusion is bullying, and it is a pattern the DSL needs to see.","ar":"التنابز المتكرر والاستبعاد الاجتماعي تنمّر، وهو نمط يحتاج مسؤول الحماية إلى رؤيته."}},{"id":"m7q2","q":{"en":"In Case B, what should you do with the screenshot and the student's request?","ar":"في الحالة ب، ماذا عليك أن تفعل باللقطة وبطلب الطالب؟"},"opts":[{"en":"Promise secrecy, so that he feels safe to help again","ar":"عِده بالسرية ليشعر بالأمان في المساعدة مرة أخرى"},{"en":"Forward the screenshot to the girl's parents","ar":"أرسل اللقطة إلى والدي الفتاة"},{"en":"Post a warning in the group chat","ar":"انشر تحذيرًا في مجموعة المحادثة"},{"en":"Say you cannot promise to keep it secret, thank him for telling you, note what you were shown and pass it to the DSL the same day","ar":"قل إنك لا تستطيع الوعد بإبقائه سرًّا، واشكره على إخبارك، ودوّن ما عُرض عليك وسلّمه إلى مسؤول الحماية في اليوم نفسه"}],"correct":3,"expl":{"en":"Secrecy cannot be promised, but information is shared on a need-to-know basis, so the DSL can protect the student who came forward.","ar":"لا يمكن الوعد بالسرية، لكن المعلومات تُشارَك على أساس الحاجة إلى المعرفة، ليتمكن مسؤول الحماية من حماية الطالب الذي تقدّم."}},{"id":"m7q3","q":{"en":"In Case C, how should you respond to “It's only a joke”?","ar":"في الحالة ج، كيف ينبغي أن تردّ على عبارة «إنها مجرد مزحة»؟"},"opts":[{"en":"Be clear that the behaviour is not acceptable, do not accept the “joke” explanation, record it and report the pattern to the DSL","ar":"كن واضحًا بأن السلوك غير مقبول، ولا تقبل تفسير «المزحة»، وسجّله وأبلغ مسؤول الحماية بالنمط"},{"en":"Accept the explanation, since he is usually well behaved","ar":"اقبل التفسير لأنه حسن السلوك عادةً"},{"en":"Ask the smaller boy whether he thinks it is a joke","ar":"اسأل الولد الأصغر هل يعتقد أنه مزحة"},{"en":"Give him a detention and consider the matter closed","ar":"امنحه احتجازًا واعتبر الأمر منتهيًا"}],"correct":0,"expl":{"en":"Bullying is never dismissed as “banter”. Weeks of repeated teasing is a pattern. Consequences are decided through the DSL and the school's policies.","ar":"لا يُستهان بالتنمّر باعتباره «مزاحًا» أبدًا. والمضايقة المتكررة لأسابيع نمط. وتُقرَّر العواقب عبر مسؤول الحماية وسياسات المدرسة."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"Which description fits bullying most closely?","ar":"أي وصف يناسب التنمّر أكثر؟"},"opts":[{"en":"A single argument between two friends","ar":"جدال واحد بين صديقين"},{"en":"Behaviour intended to hurt, repeated over time, with an imbalance of power","ar":"سلوك يقصد الإيذاء ويتكرر مع الوقت وينطوي على اختلال في القوة"},{"en":"Any disagreement between students","ar":"أي خلاف بين الطلبة"},{"en":"A teacher correcting a student's behaviour","ar":"تصحيح معلم لسلوك طالب"}],"correct":1},{"id":"e2","mod":1,"q":{"en":"Which part of the PEPS definition of emotional abuse links it to bullying?","ar":"أي جزء من تعريف المدرسة للإساءة العاطفية يربطها بالتنمّر؟"},"opts":[{"en":"Failing to provide adequate food","ar":"عدم توفير الغذاء الكافي"},{"en":"Causing physical harm","ar":"إلحاق أذى جسدي"},{"en":"Exposing a child to serious bullying, isolation or humiliation","ar":"تعريض الطفل للتنمّر الجسيم أو العزلة أو الإذلال"},{"en":"Forcing a child to take part in sexual activity","ar":"إجبار الطفل على المشاركة في نشاط جنسي"}],"correct":2},{"id":"e3","mod":1,"q":{"en":"Under the PEPS policy, bullying between children is:","ar":"بموجب سياسة المدرسة، يُعدّ التنمّر بين الأطفال:"},"opts":[{"en":"Always a matter for the children to resolve","ar":"دائمًا مسألة يحلّها الأطفال أنفسهم"},{"en":"Only serious if it involves physical harm","ar":"خطيرًا فقط إذا انطوى على أذى جسدي"},{"en":"Only a concern for parents","ar":"قلقًا يخص أولياء الأمور فقط"},{"en":"Never dismissed as banter or part of growing up","ar":"أمرًا لا يُستهان به أبدًا باعتباره مزاحًا أو جزءًا من النمو"}],"correct":3},{"id":"e4","mod":2,"q":{"en":"Which of the following is a typical sign that a child may be being bullied?","ar":"أي مما يلي علامة نموذجية على أن الطفل قد يتعرض للتنمّر؟"},"opts":[{"en":"Reluctance to go to school or certain places, with recurring stomach aches","ar":"التردد في الذهاب إلى المدرسة أو إلى أماكن معينة مع آلام معدة متكررة"},{"en":"Eating lunch with friends","ar":"تناول الغداء مع الأصدقاء"},{"en":"Answering questions in class","ar":"الإجابة عن الأسئلة في الصف"},{"en":"Arriving early to school","ar":"الحضور مبكرًا إلى المدرسة"}],"correct":0},{"id":"e5","mod":2,"q":{"en":"Which is an example of social or relational bullying?","ar":"أي مما يلي مثال على التنمّر الاجتماعي أو العلائقي؟"},"opts":[{"en":"Telling a joke that everyone laughs at, including the subject","ar":"إلقاء نكتة يضحك لها الجميع بمن فيهم موضوعها"},{"en":"Spreading rumours and persistently leaving someone out","ar":"نشر الشائعات واستبعاد شخص باستمرار"},{"en":"Losing a game fairly","ar":"الخسارة في لعبة بإنصاف"},{"en":"Sitting on a different table at lunch one day","ar":"الجلوس على طاولة أخرى في الغداء يومًا واحدًا"}],"correct":1},{"id":"e6","mod":2,"q":{"en":"Where is bullying most likely to occur?","ar":"أين يُرجَّح أن يحدث التنمّر أكثر؟"},"opts":[{"en":"Only in the classroom while the teacher is present","ar":"في الصف فقط أثناء وجود المعلم"},{"en":"Only in the school office","ar":"في مكتب المدرسة فقط"},{"en":"Where adults are not looking, such as toilets, queues, the back of the bus, corridors and online","ar":"حيث لا ينظر البالغون، كدورات المياه والطوابير ومؤخرة الحافلة والممرات وعبر الإنترنت"},{"en":"Only outside school","ar":"خارج المدرسة فقط"}],"correct":2},{"id":"e7","mod":3,"q":{"en":"According to the Social Media Policy, what is the status of cyberbullying?","ar":"بحسب سياسة وسائل التواصل الاجتماعي، ما مكانة التنمّر الإلكتروني؟"},"opts":[{"en":"It is less serious because it happens on a screen","ar":"هو أقل خطورة لأنه يحدث على شاشة"},{"en":"It is outside the school's concern","ar":"هو خارج اهتمام المدرسة"},{"en":"It is only a matter for the police","ar":"هو مسألة تخص الشرطة فقط"},{"en":"It is treated as seriously as any other form of bullying","ar":"يُعامَل بالجدية نفسها كأي شكل آخر من أشكال التنمّر"}],"correct":3},{"id":"e8","mod":3,"q":{"en":"A student who only reacts with a \"like\" to hurtful posts about a classmate is:","ar":"الطالب الذي يكتفي بالإعجاب بمنشورات مؤذية عن زميل:"},"opts":[{"en":"Taking part in the bullying; being in a group that targets someone is not neutral","ar":"يشارك في التنمّر؛ فالانتماء إلى مجموعة تستهدف شخصًا ليس حيادًا"},{"en":"Not involved at all","ar":"غير معني إطلاقًا"},{"en":"The victim","ar":"هو الضحية"},{"en":"Acting within the school's rules","ar":"يتصرف ضمن قواعد المدرسة"}],"correct":0},{"id":"e9","mod":3,"q":{"en":"Which advice for a student being cyberbullied is in line with the policy?","ar":"أي نصيحة لطالب يتعرض لتنمّر إلكتروني تتفق مع السياسة؟"},"opts":[{"en":"Delete the evidence so it can't be shared","ar":"احذف الأدلة حتى لا تُشارَك"},{"en":"Save screenshots, do not retaliate, and tell a trusted adult","ar":"احفظ لقطات الشاشة، ولا تنتقم، وأخبر بالغًا موثوقًا"},{"en":"Reply in kind","ar":"ردّ بالمثل"},{"en":"Say nothing to anyone","ar":"لا تقل شيئًا لأحد"}],"correct":1},{"id":"e10","mod":3,"q":{"en":"Who decides if online conduct is referred to the authorities as a possible offence?","ar":"من يقرر إحالة السلوك الرقمي إلى الجهات المختصة بوصفه جريمة محتملة؟"},"opts":[{"en":"The teacher who found out first","ar":"المعلم الذي اكتشفه أولًا"},{"en":"The student who was bullied","ar":"الطالب الذي تعرض للتنمّر"},{"en":"The DSL and the Principal, not individual staff members","ar":"مسؤول الحماية والمدير، وليس الموظفون فرادى"},{"en":"Any member of the class","ar":"أي فرد في الصف"}],"correct":2},{"id":"e11","mod":4,"q":{"en":"You see a student being bullied. What is your first step?","ar":"رأيت طالبًا يتعرض للتنمّر. ما خطوتك الأولى؟"},"opts":[{"en":"Take notes from a distance and wait","ar":"دوّن ملاحظات من بعيد وانتظر"},{"en":"Phone both sets of parents","ar":"اتصل بأسرتي الطفلين"},{"en":"Call the children together to apologise","ar":"اجمع الطفلين ليعتذرا"},{"en":"Step in calmly and firmly and make sure the child is safe","ar":"تدخّل بهدوء وحزم وتأكد من أن الطفل في أمان"}],"correct":3},{"id":"e12","mod":4,"q":{"en":"Which comment should staff NOT make to a child who reports bullying?","ar":"أي تعليق لا ينبغي أن يقوله الموظفون لطفل يبلّغ عن تنمّر؟"},"opts":[{"en":"“You must have done something to provoke it.”","ar":"«لا بد أنك فعلت شيئًا استفزّهم.»"},{"en":"“Thank you for telling me.”","ar":"«شكرًا لأنك أخبرتني.»"},{"en":"“It's not your fault.”","ar":"«ليس ذنبك.»"},{"en":"“I'll pass this to someone whose job is to help.”","ar":"«سأسلّم هذا إلى شخص وظيفته المساعدة.»"}],"correct":0},{"id":"e13","mod":4,"q":{"en":"When should you report a bullying concern to the DSL or a deputy?","ar":"متى ينبغي أن تبلّغ عن قلق يتعلق بالتنمّر إلى مسؤول الحماية أو أحد نوابه؟"},"opts":[{"en":"Only if it happens at least three times","ar":"فقط إذا حدث ثلاث مرات على الأقل"},{"en":"The same day, in writing on the Recording a Concern form","ar":"في اليوم نفسه كتابةً على نموذج تسجيل القلق"},{"en":"At the end of the term","ar":"في نهاية الفصل"},{"en":"Only when a parent complains","ar":"فقط عندما يشتكي ولي أمر"}],"correct":1},{"id":"e14","mod":4,"q":{"en":"After you report a bullying incident, the targeted child is mocked as a \"snitch\". What should you do?","ar":"بعد أن تبلّغ عن حادثة تنمّر يُسخَر من الطفل المستهدَف بوصفه «واشيًا». ماذا عليك أن تفعل؟"},"opts":[{"en":"Nothing, as the first report covers it","ar":"لا شيء، فالبلاغ الأول يغطيه"},{"en":"Tell the child to ignore it","ar":"قل للطفل أن يتجاهله"},{"en":"Step in, record it and report it as a new concern the same day","ar":"تدخّل وسجّله وأبلغ عنه بوصفه قلقًا جديدًا في اليوم نفسه"},{"en":"Discuss it with the whole class","ar":"ناقشه مع الصف كله"}],"correct":2},{"id":"e15","mod":5,"q":{"en":"According to the Social Media Policy, what shapes the school's response to a student who has behaved harmfully online?","ar":"بحسب سياسة وسائل التواصل الاجتماعي، ما الذي يحدد استجابة المدرسة لطالب تصرف تصرفًا ضارًا عبر الإنترنت؟"},"opts":[{"en":"The same sanction for every student","ar":"العقوبة نفسها لكل طالب"},{"en":"Whatever the reporting teacher decides","ar":"ما يقرره المعلم الذي أبلغ"},{"en":"The opinion of the other students","ar":"رأي الطلبة الآخرين"},{"en":"A proportionate approach that considers the student's age, intent and whether it was a one-off or a pattern","ar":"نهج متناسب يراعي عمر الطالب ونيّته وما إذا كان الأمر حادثة معزولة أو نمطًا"}],"correct":3},{"id":"e16","mod":5,"q":{"en":"Who is responsible for sensitive, wellbeing and safeguarding-related communication with families?","ar":"من المسؤول عن التواصل الحساس مع الأسر المتعلق بالرفاه والصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>؟"},"opts":[{"en":"The Student Counsellor and Social Worker, coordinated through the DSL","ar":"مرشد الطلبة والأخصائي الاجتماعي بالتنسيق مع مسؤول الحماية"},{"en":"Any teacher who knows the family","ar":"أي معلم يعرف الأسرة"},{"en":"Other parents","ar":"أولياء الأمور الآخرون"},{"en":"The students involved","ar":"الطلبة المعنيون"}],"correct":0},{"id":"e17","mod":5,"q":{"en":"Why should staff be cautious about bringing a bullied child face to face with the child who bullied?","ar":"لماذا ينبغي أن يحذر الموظفون من جمع الطفل الذي تعرض للتنمّر مع الطفل الذي تنمّر وجهًا لوجه؟"},"opts":[{"en":"It is against the law","ar":"هو مخالف للقانون"},{"en":"It can re-traumatise the child, especially with an imbalance of power, and should only be considered when the DSL judges it safe","ar":"قد يعيد إيذاء الطفل نفسيًا، خصوصًا مع اختلال القوة، ولا ينبغي النظر فيه إلا عندما يرى مسؤول الحماية أنه آمن"},{"en":"It takes too long","ar":"يستغرق وقتًا طويلًا"},{"en":"It always makes the bullying worse","ar":"يجعل التنمّر دائمًا أسوأ"}],"correct":1},{"id":"e18","mod":5,"q":{"en":"A child who has bullied others should be:","ar":"الطفل الذي تنمّر على الآخرين ينبغي:"},"opts":[{"en":"Labelled a \"bully\" in all records","ar":"وصمه بـ«المتنمّر» في جميع السجلات"},{"en":"Ignored, as the problem will pass","ar":"تجاهله لأن المشكلة ستزول"},{"en":"Told the behaviour must stop, and also treated as a child who may have unmet needs, with the DSL deciding on support and consequences","ar":"إخباره بأن السلوك يجب أن يتوقف، ومعاملته أيضًا كطفل قد تكون لديه احتياجات غير ملباة، مع قرار مسؤول الحماية بشأن الدعم والعواقب"},{"en":"Sanctioned by each teacher in their own way","ar":"معاقبته من كل معلم بطريقته"}],"correct":2},{"id":"e19","mod":6,"q":{"en":"Which everyday action best helps prevent bullying?","ar":"أي إجراء يومي يساعد على منع التنمّر أكثر؟"},"opts":[{"en":"Ignoring minor teasing","ar":"تجاهل المضايقات البسيطة"},{"en":"Only reacting to complaints","ar":"الاكتفاء بالرد على الشكاوى"},{"en":"Avoiding talking to students about it","ar":"تجنب التحدث إلى الطلبة عنه"},{"en":"Visible supervision and challenging unkind remarks every time","ar":"إشراف ظاهر وتحدي التعليقات غير اللطيفة في كل مرة"}],"correct":3},{"id":"e20","mod":6,"q":{"en":"According to the Staff Code of Conduct, what about bullying or harassment of colleagues?","ar":"بحسب ميثاق سلوك الموظفين، ماذا عن التنمّر أو التحرش بالزملاء؟"},"opts":[{"en":"It is not tolerated and is addressed under the relevant procedure","ar":"غير مقبول ويُعالَج بموجب الإجراء المعتمد"},{"en":"It is a private matter between colleagues","ar":"مسألة خاصة بين الزملاء"},{"en":"It is acceptable if meant humorously","ar":"مقبول إذا كان على سبيل الدعابة"},{"en":"It is only a concern if students see it","ar":"لا يهم إلا إذا رآه الطلبة"}],"correct":0},{"id":"e21","mod":6,"q":{"en":"A student reports that classmates exclude him. Which message best encourages students to report in future?","ar":"يبلّغ طالب بأن زملاءه يستبعدونه. أي رسالة تشجّع الطلبة أكثر على الإبلاغ مستقبلًا؟"},"opts":[{"en":"“Try to sort it out yourselves first.”","ar":"«حاولوا حلّها فيما بينكم أولًا.»"},{"en":"“Thank you for telling me. It's not snitching. It's looking after someone.”","ar":"«شكرًا لأنك أخبرتني. هذه ليست وشاية، بل رعاية لشخص ما.»"},{"en":"“You'll make more enemies by telling.”","ar":"«ستكسب أعداء أكثر بالإخبار.»"},{"en":"“Come back if it gets really bad.”","ar":"«عد إلي إذا ساء الأمر حقًا.»"}],"correct":1},{"id":"e22","mod":7,"q":{"en":"A Year 3 student says nobody will play with him and a boy calls him \"smelly\". You have seen it twice. What do you do?","ar":"يقول طالب في الصف الثالث إن لا أحد يريد اللعب معه وإن ولدًا يناديه بالكريه الرائحة. وقد رأيت ذلك مرتين. ماذا تفعل؟"},"opts":[{"en":"Tell him to ignore the boy","ar":"قل له أن يتجاهل الولد"},{"en":"Make the boy apologise and close the matter","ar":"اجعل الولد يعتذر وأغلق الأمر"},{"en":"Reassure him, record the words and your observations with dates, and report to the DSL the same day","ar":"طمئنه وسجّل الكلمات وملاحظاتك مع التواريخ وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Wait to see whether it happens again","ar":"انتظر لترى هل يتكرر"}],"correct":2},{"id":"e23","mod":7,"q":{"en":"A trusted student gives you a screenshot of a group chat bullying a girl, and asks you to keep it secret. What do you say?","ar":"يعطيك طالب موثوق لقطة شاشة لمحادثة جماعية تتنمر على فتاة ويطلب منك إبقاء الأمر سرًّا. ماذا تقول؟"},"opts":[{"en":"That you promise to keep it secret","ar":"إنك تعده بإبقائه سرًّا"},{"en":"That you will post it in the staff WhatsApp group","ar":"إنك ستنشرها في مجموعة واتساب الموظفين"},{"en":"That you will not take it any further","ar":"إنك لن تتابع الأمر"},{"en":"That you cannot promise secrecy but will share only with those who need to know, and you thank him for telling you","ar":"إنك لا تستطيع الوعد بالسرية لكنك ستشارك المعلومات فقط مع من يحتاج إلى معرفتها، وتشكره على إخبارك"}],"correct":3},{"id":"e24","mod":7,"q":{"en":"A Year 6 student who has teased a smaller boy for weeks says it is \"only a joke\". What is the right approach?","ar":"يقول طالب في الصف السادس ضايق ولدًا أصغر منه لأسابيع إنها «مجرد مزحة». ما النهج الصحيح؟"},"opts":[{"en":"Say clearly that it is not acceptable, record it and report the pattern to the DSL","ar":"قل بوضوح إنه غير مقبول، وسجّله وأبلغ مسؤول الحماية بالنمط"},{"en":"Accept the explanation because he is usually well behaved","ar":"اقبل التفسير لأنه حسن السلوك عادةً"},{"en":"Ask the smaller boy to join in the joke","ar":"اطلب من الولد الأصغر أن يشارك في المزحة"},{"en":"Do nothing unless the smaller boy complains","ar":"لا تفعل شيئًا ما لم يشتكِ الولد الأصغر"}],"correct":0}]};

/* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const ARR_N = () => S.lang==='ar' ? '←' : '→';
const ARR_P = () => S.lang==='ar' ? '→' : '←';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li><li>${fill(t.how5)}</li></ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}
