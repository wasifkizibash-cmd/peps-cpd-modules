#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"reporting-recording-concerns","code":"RRC","passMark":80,"hours":"2 hours","accent":"#9A4A12","accentSoft":"#F8EBDD","eyebrow":{"en":"Staff CPD · Safeguarding · Level 2 content · Performance Standard 5","ar":"تطوير مهني للموظفين · الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> · محتوى المستوى الثاني · المعيار الخامس"},"title":{"en":"Reporting and Recording Safeguarding Concerns","ar":"الإبلاغ عن مخاوف الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وتسجيلها"},"subtitle":{"en":"A self-paced module that walks through exactly what to do at PEPS when a child tells you something, or when you are worried: how to respond, how to write it down, who to tell, what happens next, and how to protect confidentiality.","ar":"وحدة ذاتية الوتيرة تشرح بالتفصيل ما يجب فعله في مدرسة PEPS عندما يخبرك طفل بشيء ما أو عندما تشعر بالقلق: كيف تستجيب وكيف تدوّن وإلى من تبلّغ وماذا يحدث بعد ذلك وكيف تحمي السرية."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"نحو ساعتين، بوتيرة ذاتية بالكامل"},"standard":{"en":"UAE School Inspection Framework · Performance Standard 5 (Protection, Care, Guidance & Support)","ar":"إطار الإشراف على المدارس في الإمارات · المعيار الخامس (الحماية والرعاية والتوجيه والدعم)"},"source":{"en":"PEPS Child Protection & Safeguarding Policy (Level 3) 2026–2027, Sections 6, 8 and 10, Appendices C and E","ar":"سياسة حماية الطفل وصونه في مدرسة PEPS (المستوى الثالث) 2026–2027، الأقسام 6 و8 و10 والملحقان ج وهـ"}},"modules":[{"id":"m1","title":{"en":"Your Duty to Report","ar":"واجبك في الإبلاغ"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"A legal duty, not only a school rule","ar":"واجب قانوني وليس مجرد قاعدة مدرسية"},"c":{"en":"Wadeema's Law (Federal Law No. 3 of 2016) places a legal obligation on school staff, as persons in regular contact with children, to report suspected abuse or neglect to the relevant authority. The policy states that this duty \u003cstrong>cannot be delegated away or ignored\u003c/strong>, and applies regardless of a staff member's role or seniority.","ar":"يُلزم قانون وديمة (القانون الاتحادي رقم 3 لسنة 2016) العاملين في المدارس، بصفتهم أشخاصًا على اتصال منتظم بالأطفال، بالإبلاغ عن الاشتباه في الإساءة أو الإهمال إلى الجهة المختصة. وتنص السياسة على أن هذا الواجب \u003cstrong>لا يجوز التنصل منه أو تجاهله\u003c/strong>، وأنه ينطبق أيًّا كان دور الموظف أو مستواه الوظيفي."}},{"t":"h","c":{"en":"The rules every member of staff follows","ar":"القواعد التي يتبعها كل موظف"}},{"t":"list","c":{"en":["Report \u003cstrong>any concern\u003c/strong> to the DSL or a deputy, however minor it may seem.","Report \u003cstrong>as soon as possible, and always on the same day\u003c/strong> the concern arises.","\u003cstrong>Never investigate\u003c/strong> a concern yourself.","\u003cstrong>Never promise a child confidentiality.\u003c/strong>","Never take action on your own, such as confronting a parent or the person you are worried about."],"ar":["بلّغ عن \u003cstrong>أي قلق\u003c/strong> إلى مسؤول الحماية أو أحد نوابه مهما بدا بسيطًا.","بلّغ \u003cstrong>في أسرع وقت ممكن، وفي اليوم نفسه دائمًا\u003c/strong> الذي ينشأ فيه القلق.","\u003cstrong>لا تحقّق أبدًا\u003c/strong> في أي قلق بنفسك.","\u003cstrong>لا تَعِد الطفل أبدًا بالسرية.\u003c/strong>","لا تتخذ إجراءً من تلقاء نفسك، كمواجهة ولي أمر أو الشخص الذي يقلقك."]}},{"t":"h","c":{"en":"Who is who","ar":"من هو من"}},{"t":"table","head":{"en":["Role","What they do"],"ar":["الدور","ما يفعلونه"]},"rows":[{"en":["Designated Safeguarding Lead (DSL)","Receives concerns, assesses them, decides on internal action or external referral, manages referrals and keeps the records"],"ar":["مسؤول حماية الطفل المعيّن (DSL)","يتلقى المخاوف ويقيّمها ويقرر الإجراء الداخلي أو الإحالة الخارجية ويدير الإحالات ويحتفظ بالسجلات"]},{"en":["Deputy DSLs","Trained to the same Level 3 standard; at least one is available whenever the school is in session"],"ar":["نواب مسؤول الحماية","مدرَّبون على المستوى الثالث نفسه؛ ويتوافر واحد منهم على الأقل طوال وقت الدوام المدرسي"]},{"en":["Principal","Acts as case manager if an allegation is made against a member of staff"],"ar":["المدير","يتولى إدارة الحالة إذا قُدّم ادعاء ضد أحد الموظفين"]},{"en":["Every member of staff","Notices, listens, records, reports the same day, and keeps information confidential"],"ar":["كل موظف","يلاحظ ويصغي ويسجّل ويبلّغ في اليوم نفسه ويحافظ على سرية المعلومات"]}]},{"t":"callout","k":"tip","title":{"en":"Professional good practice: why “same day” matters","ar":"ممارسة مهنية جيدة: لماذا يهمّ «اليوم نفسه»؟"},"c":{"en":"A concern that waits until tomorrow may mean a child goes home to the very place of risk tonight. Memory also fades quickly, so your record is most accurate when it is written the same day.","ar":"قد يعني تأجيل القلق إلى الغد أن يعود الطفل الليلة إلى المكان ذاته الذي يشكل الخطر عليه. كما تتلاشى الذاكرة بسرعة، فيكون سجلّك أدق ما يكون إذا كُتب في اليوم نفسه."}}],"checks":[{"id":"m1q1","q":{"en":"A colleague says, “I'm a senior teacher, so I'll handle this myself without involving the DSL.” What does the policy say?","ar":"يقول زميل: «أنا معلم أول، لذا سأتولى الأمر بنفسي دون إشراك مسؤول الحماية». ماذا تقول السياسة؟"},"opts":[{"en":"The reporting duty applies regardless of role or seniority and cannot be delegated away or ignored: the concern goes to the DSL","ar":"يسري واجب الإبلاغ أيًّا كان الدور أو المستوى الوظيفي ولا يجوز التنصل منه أو تجاهله: يُرفع القلق إلى مسؤول الحماية"},{"en":"Senior staff may decide for themselves whether a concern needs reporting","ar":"يجوز للموظفين الكبار أن يقرروا بأنفسهم هل يحتاج القلق إلى إبلاغ"},{"en":"Only the Principal may decide whether a concern is reported","ar":"المدير وحده من يقرر هل يُبلَّغ عن القلق"},{"en":"Seniority matters only for the final decision on a referral to the Police","ar":"المستوى الوظيفي لا يهمّ إلا في القرار النهائي بالإحالة إلى الشرطة"}],"correct":0,"expl":{"en":"The duty comes from Wadeema's Law and from the PEPS policy. It applies to every member of staff in the same way.","ar":"ينبع الواجب من قانون وديمة ومن سياسة المدرسة، ويسري على كل موظف بالطريقة نفسها."}},{"id":"m1q2","q":{"en":"By when must a safeguarding concern be passed to the DSL or a deputy?","ar":"بحلول متى يجب تمرير القلق المتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> إلى مسؤول الحماية أو أحد نوابه؟"},"opts":[{"en":"Within one week, once you have gathered more evidence","ar":"خلال أسبوع، بعد أن تجمع مزيدًا من الأدلة"},{"en":"As soon as possible, and always on the same day the concern arises","ar":"في أسرع وقت ممكن، وفي اليوم نفسه دائمًا الذي ينشأ فيه القلق"},{"en":"At the next scheduled staff meeting","ar":"في اجتماع الموظفين المقرر التالي"},{"en":"At the end of the term, in a summary","ar":"في نهاية الفصل في ملخص"}],"correct":1,"expl":{"en":"The policy is clear: as soon as possible and always on the same day. Delay can leave a child at risk.","ar":"السياسة واضحة: في أسرع وقت ممكن وفي اليوم نفسه دائمًا. فالتأخير قد يترك الطفل معرّضًا للخطر."}}]},{"id":"m2","title":{"en":"If a Child Tells You: The Six Steps","ar":"إذا أخبرك طفل: الخطوات الست"},"minutes":20,"blocks":[{"t":"p","c":{"en":"Any member of staff may be the person a child chooses to talk to. It might be a teacher, a learning support assistant, a bus supervisor or an activity leader. A child who tells you is trusting you with something very difficult. How you respond matters.","ar":"قد يكون أي موظف هو الشخص الذي يختار الطفل أن يتحدث إليه: معلمًا أو مساعد دعم تعلّم أو مشرف حافلة أو قائد نشاط. والطفل الذي يخبرك يأتمنك على أمر شديد الصعوبة. وطريقة استجابتك مهمة."}},{"t":"steps","c":{"en":["\u003cstrong>Stay calm and listen carefully\u003c/strong>, without expressing shock or disbelief.","\u003cstrong>Do not promise confidentiality.\u003c/strong> Explain, gently and in a way that suits the child's age, that you will need to tell someone whose job it is to help.","\u003cstrong>Do not ask leading questions or investigate.\u003c/strong> Your role is to listen, not to interview the child.","\u003cstrong>Reassure the child\u003c/strong> that they have done the right thing in telling you, and that it is not their fault.","\u003cstrong>Write down what was said\u003c/strong> as soon as possible afterwards, in the child's own words as far as possible, with the date, time and any names mentioned.","\u003cstrong>Pass it to the DSL the same day.\u003c/strong>"],"ar":["\u003cstrong>حافظ على هدوئك وأصغِ بانتباه\u003c/strong>، دون إظهار الصدمة أو عدم التصديق.","\u003cstrong>لا تَعِد بالسرية.\u003c/strong> اشرح بلطف وبما يناسب عمر الطفل أنك ستحتاج إلى إخبار شخص وظيفته المساعدة.","\u003cstrong>لا تطرح أسئلة إيحائية ولا تحقّق.\u003c/strong> دورك أن تصغي لا أن تستجوب الطفل.","\u003cstrong>طمئن الطفل\u003c/strong> بأنه أحسن بإخبارك، وأن الأمر ليس ذنبه.","\u003cstrong>دوّن ما قيل\u003c/strong> في أقرب وقت ممكن بعد ذلك، بكلمات الطفل نفسها قدر الإمكان، مع التاريخ والوقت وأي أسماء وردت.","\u003cstrong>سلّمه إلى مسؤول الحماية في اليوم نفسه.\u003c/strong>"]}},{"t":"h","c":{"en":"Leading and non-leading: what it sounds like","ar":"الأسئلة الإيحائية وغير الإيحائية: كيف تبدو"}},{"t":"table","head":{"en":["Leading (avoid)","Neutral (use if needed)"],"ar":["إيحائي (تجنّبه)","محايد (استخدمه عند الحاجة)"]},"rows":[{"en":["“Did your dad hit you?”","“Can you tell me more?”"],"ar":["«هل ضربك أبوك؟»","«هل تستطيع أن تخبرني بالمزيد؟»"]},{"en":["“Is somebody hurting you at home?”","“I'm listening.”"],"ar":["«هل يؤذيك أحد في المنزل؟»","«أنا أصغي إليك.»"]},{"en":["“It was your uncle, wasn't it?”","“Thank you for telling me.”"],"ar":["«كان عمّك، أليس كذلك؟»","«شكرًا لأنك أخبرتني.»"]}]},{"t":"callout","k":"tip","title":{"en":"Professional good practice: useful phrases","ar":"ممارسة مهنية جيدة: عبارات مفيدة"},"c":{"en":"“I'm glad you told me.” “It's not your fault.” “I can't keep this a secret, because I need to tell someone whose job it is to keep children safe.” Avoid “I'm sure it's nothing”, “Why didn't you tell me earlier?” and anything that sounds like blame. If you need to clarify, ask only open, non-leading prompts such as “Can you tell me more?”, and avoid repeating the question.","ar":"«يسعدني أنك أخبرتني.» «ليس ذنبك.» «لا أستطيع إبقاء هذا سرًّا، لأنني أحتاج إلى إخبار شخص وظيفته الحفاظ على سلامة الأطفال.» تجنّب «أنا متأكد أنه لا شيء» و«لماذا لم تخبرني من قبل؟» وأي عبارة توحي باللوم. وإذا احتجت إلى التوضيح فاستخدم فقط عبارات مفتوحة غير إيحائية مثل «هل تستطيع أن تخبرني بالمزيد؟»، ولا تكرر السؤال."}},{"t":"callout","k":"warn","title":{"en":"If the child is in immediate danger","ar":"إذا كان الطفل في خطر داهم"},"c":{"en":"If at any point there is a risk of immediate serious harm to a child, contact the Police or the relevant emergency service directly, without waiting for the DSL, and inform the DSL as soon as possible afterwards.","ar":"إذا وُجد في أي لحظة خطر ضرر جسيم وشيك على الطفل، فاتصل بالشرطة أو بخدمة الطوارئ المعنية مباشرةً، دون انتظار مسؤول الحماية، ثم أبلغه في أقرب وقت ممكن بعد ذلك."}}],"checks":[{"id":"m2q1","q":{"en":"A student starts to tell you something upsetting and says, “Promise you won't tell anyone.” What do you say?","ar":"يبدأ طالب بإخبارك بشيء مؤلم ثم يقول: «عِدني ألا تخبر أحدًا». ماذا تقول؟"},"opts":[{"en":"“I promise. Tell me everything and I'll keep it between us.”","ar":"«أعدك. أخبرني بكل شيء وسيبقى بيننا.»"},{"en":"“Only if you agree not to tell anyone else either.”","ar":"«فقط إذا وافقت ألا تخبر أحدًا غيري أيضًا.»"},{"en":"Explain gently that you cannot keep it secret, because you need to tell someone whose job it is to help","ar":"اشرح بلطف أنك لا تستطيع إبقاءه سرًّا، لأنك تحتاج إلى إخبار شخص وظيفته المساعدة"},{"en":"“I can't promise anything, so please don't tell me.”","ar":"«لا أستطيع أن أعد بشيء، لذا من فضلك لا تخبرني.»"}],"correct":2,"expl":{"en":"Promising secrecy would be breaking the rule and a promise you cannot keep. Being honest, gently and in an age-appropriate way, helps the child to trust you.","ar":"الوعد بالسرية خرق للقاعدة ووعد لا تستطيع الوفاء به. والصدق بلطف وبما يناسب العمر يساعد الطفل على الوثوق بك."}},{"id":"m2q2","q":{"en":"Which of these is a leading question?","ar":"أي مما يلي سؤال إيحائي؟"},"opts":[{"en":"“Can you tell me more about that?”","ar":"«هل تستطيع أن تخبرني بالمزيد عن ذلك؟»"},{"en":"“I'm listening, take your time.”","ar":"«أنا أصغي إليك، خذ وقتك.»"},{"en":"“Thank you for telling me.”","ar":"«شكرًا لأنك أخبرتني.»"},{"en":"“Did your stepdad do this to you?”","ar":"«هل فعل زوج أمك هذا بك؟»"}],"correct":3,"expl":{"en":"A leading question suggests an answer or a person. It can distort what the child says and harm any later enquiry. Staff listen and record, they do not interview.","ar":"السؤال الإيحائي يوحي بإجابة أو بشخص. وقد يشوّه ما يقوله الطفل ويضر بأي تحقيق لاحق. فالموظفون يصغون ويسجّلون ولا يستجوبون."}},{"id":"m2q3","q":{"en":"When should you write down what a child told you?","ar":"متى ينبغي أن تدوّن ما أخبرك به الطفل؟"},"opts":[{"en":"As soon as possible afterwards, in the child's own words as far as possible, with the date and time","ar":"في أقرب وقت ممكن بعد ذلك، بكلمات الطفل نفسها قدر الإمكان، مع التاريخ والوقت"},{"en":"At the end of the week, once you have thought about what it means","ar":"في نهاية الأسبوع بعد أن تفكر فيما يعنيه"},{"en":"Only if the child asks you to","ar":"فقط إذا طلب الطفل منك ذلك"},{"en":"Only after you have checked the facts with the parents","ar":"فقط بعد أن تتحقق من الوقائع مع الوالدين"}],"correct":0,"expl":{"en":"Notes written soon afterwards are the most accurate. Use the child's words rather than your interpretation.","ar":"الملاحظات المكتوبة بعد الواقعة بوقت قصير هي الأدق. استخدم كلمات الطفل بدلًا من تفسيرك."}}]},{"id":"m3","title":{"en":"Recording a Concern: The Form and the Facts","ar":"تسجيل القلق: النموذج والوقائع"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"What the policy requires","ar":"ما تشترطه السياسة"},"c":{"en":"Every concern, \u003cstrong>however small it may seem\u003c/strong>, is recorded in writing using the Recording a Concern form (Appendix C) and passed to the DSL or a deputy without delay. Records are \u003cstrong>factual, timely, and kept securely and confidentially\u003c/strong>.","ar":"يُسجَّل كل قلق، \u003cstrong>مهما بدا صغيرًا\u003c/strong>، كتابةً باستخدام نموذج تسجيل القلق (الملحق ج) ويُسلَّم إلى مسؤول الحماية أو أحد نوابه دون تأخير. وتكون السجلات \u003cstrong>واقعية وفي وقتها ومحفوظة بأمان وسرية\u003c/strong>."}},{"t":"h","c":{"en":"The Recording a Concern form","ar":"نموذج تسجيل القلق"}},{"t":"table","head":{"en":["Section of the form","What to write"],"ar":["قسم النموذج","ما يُكتب"]},"rows":[{"en":["Student's name and class","Full name and class of the student"],"ar":["اسم الطالب وصفه","الاسم الكامل للطالب وصفه"]},{"en":["Date and time of concern","When it happened or when you noticed it"],"ar":["تاريخ القلق ووقته","متى حدث أو متى لاحظته"]},{"en":["Your name and role","Who you are, so the DSL can follow up with you"],"ar":["اسمك ودورك","من أنت، ليتمكن مسؤول الحماية من المتابعة معك"]},{"en":["What was observed, said or reported","The facts, using the child's own words where possible"],"ar":["ما لوحظ أو قيل أو أُبلغ عنه","الوقائع بكلمات الطفل نفسها حيثما أمكن"]},{"en":["Any immediate action taken","For example: took the student to the clinic; informed the DSL by phone"],"ar":["أي إجراء فوري اتُّخذ","مثلًا: اصطحاب الطالب إلى العيادة؛ إبلاغ مسؤول الحماية هاتفيًا"]},{"en":["Date passed to DSL; received by","Date you handed it over; the DSL or deputy completes receipt"],"ar":["تاريخ التسليم إلى مسؤول الحماية؛ المستلِم","تاريخ تسليمك للنموذج؛ ويكمل مسؤول الحماية أو نائبه بيانات الاستلام"]}]},{"t":"h","c":{"en":"Separate what you saw, what was said, and your opinion","ar":"افصل بين ما رأيته وما قيل ورأيك"}},{"t":"p","c":{"en":"The policy says records must distinguish clearly between \u003cstrong>what was observed\u003c/strong>, \u003cstrong>what was said (in the words used)\u003c/strong>, and \u003cstrong>any opinion or professional judgement\u003c/strong>. Your professional judgement is valuable, but it should be labelled as such.","ar":"تنص السياسة على أن السجلات يجب أن تميّز بوضوح بين \u003cstrong>ما لوحظ\u003c/strong> و\u003cstrong>ما قيل (بالكلمات المستخدمة)\u003c/strong> و\u003cstrong>أي رأي أو تقدير مهني\u003c/strong>. وتقديرك المهني قيّم، لكن ينبغي الإشارة إليه بوصفه كذلك."}},{"t":"table","head":{"en":["Weak entry","Stronger entry"],"ar":["إدخال ضعيف","إدخال أقوى"]},"rows":[{"en":["Ahmed is obviously being hit at home.","Observed: 5 cm red mark on left upper arm, Monday 9:10. Said: “My dad was really angry.” Opinion: concerned because Ahmed flinched when I raised my hand to point at the board."],"ar":["من الواضح أن أحمد يتعرض للضرب في المنزل.","لوحظ: علامة حمراء بطول 5 سم على أعلى الذراع اليسرى، الإثنين 9:10. قال: «كان أبي غاضبًا جدًا». الرأي: قلق لأن أحمد جفل عندما رفعتُ يدي لأشير إلى السبورة."]},{"en":["Sara was upset again.","Sara cried during maths on Tue and Thu. Said: “I don't want to go home.” No explanation given."],"ar":["سارة كانت منزعجة مرة أخرى.","بكت سارة في حصة الرياضيات يومي الثلاثاء والخميس. قالت: «لا أريد العودة إلى المنزل». ولم تقدّم أي تفسير."]}]},{"t":"callout","k":"warn","title":{"en":"Keep it secure","ar":"احفظه بأمان"},"c":{"en":"Do not keep your own copies on personal devices, in your bag or in a shared folder. Hand the form to the DSL or a deputy, and keep nothing that others could see.","ar":"لا تحتفظ بنسخ خاصة بك على أجهزة شخصية أو في حقيبتك أو في مجلد مشترك. سلّم النموذج إلى مسؤول الحماية أو أحد نوابه، ولا تحتفظ بشيء يمكن للآخرين رؤيته."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: when you are unsure","ar":"ممارسة مهنية جيدة: عند الشك"},"c":{"en":"If you are not sure whether something is “worth” recording, record it. A small detail that seems unimportant to you may be the missing piece when put beside others the DSL holds.","ar":"إذا لم تكن متأكدًا من أن أمرًا ما «يستحق» التسجيل فسجّله. فقد يكون تفصيل صغير يبدو لك غير مهم هو القطعة الناقصة عند وضعه إلى جانب تفاصيل أخرى لدى مسؤول الحماية."}}],"checks":[{"id":"m3q1","q":{"en":"Which entry best fits the policy requirement for a factual record?","ar":"أي إدخال يناسب شرط السياسة لسجلّ واقعي على أفضل وجه؟"},"opts":[{"en":"“Sara's family situation is clearly awful and something must be done.”","ar":"«وضع أسرة سارة سيئ بوضوح ويجب فعل شيء.»"},{"en":"“Thursday 11:20. Sara said, ‘I don't want to go home.’ She has cried in two lessons this week. Opinion: I'm worried about her.”","ar":"«الخميس 11:20. قالت سارة: ‹لا أريد العودة إلى المنزل›. وقد بكت في حصتين هذا الأسبوع. الرأي: أنا قلقة عليها.»"},{"en":"“Sara is a difficult child who cries for attention.”","ar":"«سارة طفلة صعبة تبكي لجذب الانتباه.»"},{"en":"“Sara had a bad week.”","ar":"«مرّ على سارة أسبوع سيئ.»"}],"correct":1,"expl":{"en":"A good record gives the date and time, the child's own words and what you observed, with opinion labelled as opinion.","ar":"يتضمن السجل الجيد التاريخ والوقت وكلمات الطفل نفسها وما لاحظته، مع الإشارة إلى الرأي بوصفه رأيًا."}},{"id":"m3q2","q":{"en":"A concern seems very small, and you are not sure it is worth writing a form. What should you do?","ar":"يبدو القلق صغيرًا جدًا ولست متأكدًا من أنه يستحق ملء نموذج. ماذا عليك أن تفعل؟"},"opts":[{"en":"Keep it in your own notebook until you see something more serious","ar":"احتفظ به في دفترك الخاص حتى ترى شيئًا أخطر"},{"en":"Mention it informally to a colleague over lunch","ar":"اذكره بصورة غير رسمية لزميل أثناء الغداء"},{"en":"Record it and pass it to the DSL, because every concern is recorded however small it may seem","ar":"سجّله وسلّمه إلى مسؤول الحماية، لأن كل قلق يُسجَّل مهما بدا صغيرًا"},{"en":"Ignore it, because small things are not safeguarding","ar":"تجاهله، لأن الأمور الصغيرة لا تتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"}],"correct":2,"expl":{"en":"The policy says every concern, however small, is recorded in writing. The DSL sees the whole picture and can join up small pieces.","ar":"تنص السياسة على أن كل قلق، مهما بدا صغيرًا، يُسجَّل كتابةً. ومسؤول الحماية يرى الصورة كاملة ويستطيع ربط القطع الصغيرة معًا."}},{"id":"m3q3","q":{"en":"What must a safeguarding record distinguish between, according to the policy?","ar":"بين أي أمور يجب أن يميّز السجل المتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> بحسب السياسة؟"},"opts":[{"en":"What happened in school and what happened in the holidays","ar":"ما حدث في المدرسة وما حدث في العطلات"},{"en":"What the parents said and what the child said","ar":"ما قاله الوالدان وما قاله الطفل"},{"en":"What was urgent and what was not urgent","ar":"ما كان عاجلًا وما لم يكن عاجلًا"},{"en":"What was observed, what was said (in the words used), and any opinion or professional judgement","ar":"ما لوحظ، وما قيل (بالكلمات المستخدمة)، وأي رأي أو تقدير مهني"}],"correct":3,"expl":{"en":"This is a direct requirement of the policy's record-keeping section. It keeps the record fair and useful if an agency needs it.","ar":"هذا شرط مباشر في قسم حفظ السجلات من السياسة. فهو يُبقي السجل عادلًا ومفيدًا إذا احتاجته جهة خارجية."}}]},{"id":"m4","title":{"en":"After You Report: Assessment, Referral and Follow-up","ar":"بعد الإبلاغ: التقييم والإحالة والمتابعة"},"minutes":20,"blocks":[{"t":"p","c":{"en":"You do not have to carry the concern alone after you report it. The policy sets out a six-step procedure that the DSL follows once a concern has been raised.","ar":"لا يلزمك أن تحمل القلق وحدك بعد الإبلاغ عنه. فالسياسة تحدد إجراءً من ست خطوات يتبعه مسؤول الحماية بعد رفع القلق."}},{"t":"table","head":{"en":["Step","What happens"],"ar":["الخطوة","ما يحدث"]},"rows":[{"en":["1. Concern raised","Any member of staff, student, parent or visitor raises a concern with the DSL or a deputy, using the Recording a Concern form where applicable"],"ar":["1. رفع القلق","يرفع أي موظف أو طالب أو ولي أمر أو زائر القلق إلى مسؤول الحماية أو أحد نوابه باستخدام نموذج تسجيل القلق حيثما أمكن"]},{"en":["2. Initial assessment","The DSL assesses the concern, gathers any further relevant information and decides on the next step, from in-school monitoring and pastoral support to immediate referral"],"ar":["2. التقييم الأولي","يقيّم مسؤول الحماية القلق ويجمع أي معلومات إضافية ذات صلة ويقرر الخطوة التالية، من المتابعة داخل المدرسة والدعم الرعوي إلى الإحالة الفورية"]},{"en":["3. Internal action","Where school-based support is enough (pastoral care, a wellbeing plan, a conversation with parents), the DSL coordinates it with relevant staff"],"ar":["3. الإجراء الداخلي","حيث يكفي الدعم داخل المدرسة (الرعاية الرعوية أو خطة رفاه أو حديث مع الوالدين) ينسّقه مسؤول الحماية مع الموظفين المعنيين"]},{"en":["4. External referral","Where a child may be suffering, or likely to suffer, significant harm, a referral is made without delay to the relevant agencies"],"ar":["4. الإحالة الخارجية","حيث قد يعاني الطفل من ضرر جسيم أو يُرجَّح أن يعاني منه، تُجرى الإحالة دون تأخير إلى الجهات المعنية"]},{"en":["5. Immediate danger","The DSL, or any member of staff if the DSL is not immediately available, contacts the Police without delay and informs the DSL as soon as possible afterwards"],"ar":["5. الخطر الداهم","يتصل مسؤول الحماية، أو أي موظف إن لم يكن متاحًا فورًا، بالشرطة دون تأخير ثم يبلغ مسؤول الحماية في أقرب وقت ممكن"]},{"en":["6. Follow-up","The DSL monitors the outcome of any referral, keeps records up to date, and ensures the child continues to receive support at school throughout and after"],"ar":["6. المتابعة","يتابع مسؤول الحماية نتيجة أي إحالة ويُبقي السجلات محدّثة ويضمن استمرار حصول الطفل على الدعم في المدرسة أثناء العملية وبعدها"]}]},{"t":"h","c":{"en":"Key contacts (Appendix E of the policy)","ar":"جهات الاتصال الرئيسة (الملحق هـ من السياسة)"}},{"t":"table","head":{"en":["Agency","Contact"],"ar":["الجهة","وسيلة الاتصال"]},"rows":[{"en":["Sharjah Child Protection Centre","800 700 (toll-free, 24 hours)"],"ar":["مركز الشارقة لحماية الطفل","800 700 (رقم مجاني، على مدار 24 ساعة)"]},{"en":["Ministry of Interior, Child Protection Centre","116111, moi-cpc.ae, or the “Hemayati” app"],"ar":["وزارة الداخلية، مركز حماية الطفل","116111، أو moi-cpc.ae، أو تطبيق «حمايتي»"]},{"en":["Ministry of Education, Child Protection Unit","80085, cpu@moe.gov.ae"],"ar":["وزارة التربية والتعليم، وحدة حماية الطفل","80085، cpu@moe.gov.ae"]},{"en":["Police (emergency)","999"],"ar":["الشرطة (الطوارئ)","999"]}]},{"t":"callout","k":"key","title":{"en":"Anybody can, and should, make a referral","ar":"يستطيع أي شخص أن يحيل الحالة، وعليه ذلك"},"c":{"en":"The policy states that anybody can, and should, make a referral. If there is a risk of immediate serious harm, contact the Police or relevant emergency service directly, \u003cstrong>without waiting for the DSL\u003c/strong>. The policy also notes that external numbers should be verified periodically against official sources, as they may change.","ar":"تنص السياسة على أن بإمكان أي شخص أن يجري الإحالة، وعليه ذلك. وإذا وُجد خطر ضرر جسيم وشيك فاتصل بالشرطة أو بخدمة الطوارئ المعنية مباشرةً، \u003cstrong>دون انتظار مسؤول الحماية\u003c/strong>. وتشير السياسة أيضًا إلى ضرورة التحقق دوريًا من الأرقام الخارجية من المصادر الرسمية لأنها قد تتغيّر."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: feedback and “need to know”","ar":"ممارسة مهنية جيدة: التغذية الراجعة و«الحاجة إلى المعرفة»"},"c":{"en":"After you report, you may not hear every detail of what happens next, and that is normal: information is shared only with those who need to know. If you see new signs, record and report again. A new concern is a new record.","ar":"بعد الإبلاغ قد لا تسمع كل تفاصيل ما يحدث لاحقًا، وهذا طبيعي: فالمعلومات لا تُشارَك إلا مع من يحتاج إلى معرفتها. وإذا رأيت علامات جديدة فسجّل وأبلغ مرة أخرى. فالقلق الجديد سجلّ جديد."}}],"checks":[{"id":"m4q1","q":{"en":"Who decides whether a concern is dealt with by school-based support or referred to an external agency?","ar":"من يقرر هل يُعالَج القلق بدعم داخل المدرسة أم يُحال إلى جهة خارجية؟"},"opts":[{"en":"The DSL, following an initial assessment","ar":"مسؤول الحماية بعد تقييم أولي"},{"en":"The member of staff who raised the concern","ar":"الموظف الذي رفع القلق"},{"en":"The parents of the child concerned","ar":"والدا الطفل المعني"},{"en":"The head of the child's year group","ar":"رئيس مرحلة الطفل الدراسية"}],"correct":0,"expl":{"en":"Step 2 of the procedure gives the DSL the role of assessing and deciding. Your role is to raise the concern accurately and on time.","ar":"الخطوة 2 من الإجراء تعطي مسؤول الحماية دور التقييم واتخاذ القرار. ودورك أن ترفع القلق بدقة وفي وقته."}},{"id":"m4q2","q":{"en":"A child tells you that someone is going to hurt them tonight, and neither the DSL nor a deputy can be reached for the next few minutes. What should you do?","ar":"يخبرك طفل بأن شخصًا سيؤذيه الليلة، ولا يمكن الوصول إلى مسؤول الحماية ولا إلى نائبه خلال الدقائق القادمة. ماذا عليك أن تفعل؟"},"opts":[{"en":"Wait until the DSL is available, however long it takes","ar":"انتظر حتى يتوافر مسؤول الحماية مهما طال الوقت"},{"en":"Contact the Police without delay, stay with the child, and inform the DSL as soon as possible afterwards","ar":"اتصل بالشرطة دون تأخير، وابقَ مع الطفل، وأبلغ مسؤول الحماية في أقرب وقت ممكن بعد ذلك"},{"en":"Send the child home and phone the parents later","ar":"أرسل الطفل إلى المنزل واتصل بالوالدين لاحقًا"},{"en":"Write a note for the DSL and finish the lesson first","ar":"اكتب ملاحظة لمسؤول الحماية وأنهِ الحصة أولًا"}],"correct":1,"expl":{"en":"In immediate danger, any member of staff contacts the Police without delay if the DSL is not immediately available, then informs the DSL as soon as possible.","ar":"في حال الخطر الداهم يتصل أي موظف بالشرطة دون تأخير إذا لم يكن مسؤول الحماية متاحًا فورًا، ثم يبلغه في أقرب وقت ممكن."}},{"id":"m4q3","q":{"en":"A week after you report a concern you notice new bruising on the same child. What should you do?","ar":"بعد أسبوع من إبلاغك عن قلق لاحظت كدمات جديدة على الطفل نفسه. ماذا عليك أن تفعل؟"},"opts":[{"en":"Do nothing, because the DSL already knows about this child","ar":"لا شيء، فمسؤول الحماية يعرف بأمر هذا الطفل أصلًا"},{"en":"Ask the DSL what happened with your first report before doing anything","ar":"اسأل مسؤول الحماية عمّا جرى بشأن بلاغك الأول قبل أن تفعل أي شيء"},{"en":"Record the new signs and report them to the DSL the same day, as a new concern","ar":"سجّل العلامات الجديدة وأبلغ مسؤول الحماية بها في اليوم نفسه بوصفها قلقًا جديدًا"},{"en":"Ask the child how they got the bruises","ar":"اسأل الطفل كيف حصل على الكدمات"}],"correct":2,"expl":{"en":"New signs are new information. The DSL keeps records up to date and monitors the child, but only if staff keep reporting.","ar":"العلامات الجديدة معلومات جديدة. ويُبقي مسؤول الحماية السجلات محدّثة ويتابع الطفل، ولكن ذلك يتوقف على استمرار الموظفين في الإبلاغ."}}]},{"id":"m5","title":{"en":"Confidentiality and Information Sharing","ar":"السرية وتبادل المعلومات"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Safeguarding information is some of the most sensitive information the school holds. The policy balances two things: keeping information private, and sharing what is needed to keep a child safe.","ar":"معلومات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> من أكثر المعلومات حساسية لدى المدرسة. وتوازن السياسة بين أمرين: إبقاء المعلومات خاصة، ومشاركة ما يلزم لحماية الطفل."}},{"t":"h","c":{"en":"What staff must always do","ar":"ما يجب على الموظفين فعله دائمًا"}},{"t":"list","c":{"en":["Share information about a concern \u003cstrong>only with those who need to know\u003c/strong>, on a strict need-to-know basis.","\u003cstrong>Never discuss a safeguarding case\u003c/strong> with colleagues who are not involved, with the wider school community, or on social media or other public platforms.","Never promise a child confidentiality."],"ar":["شارك المعلومات عن القلق \u003cstrong>مع من يحتاج إلى معرفتها فقط\u003c/strong>، على أساس صارم من الحاجة إلى المعرفة.","\u003cstrong>لا تناقش أي حالة صون شامل\u003c/strong> مع زملاء غير معنيين أو مع المجتمع المدرسي الأوسع أو على وسائل التواصل الاجتماعي أو أي منصات عامة.","لا تَعِد الطفل بالسرية أبدًا."]}},{"t":"h","c":{"en":"How records are protected","ar":"كيف تُحمى السجلات"}},{"t":"list","c":{"en":["Safeguarding records are stored securely, \u003cstrong>separately from the student's general school file\u003c/strong>.","Access is restricted to the \u003cstrong>DSL, deputy DSLs and the Principal\u003c/strong>.","They are kept in line with UAE data protection requirements, and transferred securely to a student's next school if they leave PEPS, where doing so is in the child's best interests.","Personal data goes to external agencies only as necessary to protect the child, and is never disclosed to unauthorised third parties."],"ar":["تُخزَّن سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> بأمان، \u003cstrong>منفصلة عن الملف المدرسي العام للطالب\u003c/strong>.","يقتصر الوصول إليها على \u003cstrong>مسؤول الحماية ونوابه والمدير\u003c/strong>.","وتُحفظ وفق متطلبات حماية البيانات في دولة الإمارات، وتُنقل بأمان إلى المدرسة التالية للطالب إذا غادر PEPS، متى كان ذلك في مصلحة الطفل الفضلى.","ولا تُشارَك البيانات الشخصية مع الجهات الخارجية إلا بالقدر اللازم لحماية الطفل، ولا يُفصح عنها أبدًا لأطراف ثالثة غير مصرّح لها."]}},{"t":"h","c":{"en":"What about the parents?","ar":"ماذا عن الوالدين؟"}},{"t":"callout","k":"warn","title":{"en":"Do not contact the family yourself","ar":"لا تتصل بالأسرة بنفسك"},"c":{"en":"Where sharing information with parents could increase risk to the child (for example, where a parent is the subject of the concern), the \u003cstrong>DSL decides\u003c/strong>, in consultation with the relevant authority where necessary, whether and how parents are informed. A member of staff who phones a parent “just to check” could put the child in greater danger.","ar":"حيث قد تزيد مشاركة المعلومات مع الوالدين من الخطر على الطفل (كأن يكون أحد الوالدين هو موضوع القلق)، \u003cstrong>يقرر مسؤول الحماية\u003c/strong>، بالتشاور مع الجهة المختصة عند الحاجة، هل يُبلَّغ الوالدان وكيف. وقد يعرّض الموظف الطفل لخطر أكبر إذا اتصل بأحد الوالدين «للاطمئنان فقط»."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: everyday slips to avoid","ar":"ممارسة مهنية جيدة: زلات يومية يجب تجنّبها"},"c":{"en":"Talking about a case in the staff room, in a corridor, in a group chat or by email that is not secure; leaving a form on a desk; mentioning a child's name in a WhatsApp group; answering another parent's question about “what happened to that child”. If you are asked, say politely that you cannot discuss it.","ar":"الحديث عن حالة في غرفة المعلمين أو في الممر أو في مجموعة محادثة أو عبر بريد إلكتروني غير آمن؛ وترك نموذج على المكتب؛ وذكر اسم طفل في مجموعة واتساب؛ والإجابة عن سؤال ولي أمر آخر عمّا «حدث لذلك الطفل». وإذا سُئلت فقل بلطف إنك لا تستطيع مناقشة الأمر."}}],"checks":[{"id":"m5q1","q":{"en":"A parent of another child asks you in the car park, “I heard something happened to that boy. What was it?” What should you do?","ar":"يسألك ولي أمر طفل آخر في موقف السيارات: «سمعت أن شيئًا حدث لذلك الولد. ماذا كان؟» ماذا عليك أن تفعل؟"},"opts":[{"en":"Give a brief summary, since the parent clearly already knows something","ar":"قدّم ملخصًا موجزًا، فمن الواضح أن ولي الأمر يعرف شيئًا"},{"en":"Tell them it is nothing serious","ar":"أخبره أن الأمر ليس خطيرًا"},{"en":"Ask them what they heard and who told them","ar":"اسأله عمّا سمعه ومن أخبره"},{"en":"Politely say that you cannot discuss any student, and that any concern is for the DSL to handle","ar":"قل بلطف إنك لا تستطيع مناقشة أي طالب، وإن أي قلق يتولاه مسؤول الحماية"}],"correct":3,"expl":{"en":"Safeguarding information is shared only on a need-to-know basis, and staff never discuss a case with people who are not involved.","ar":"لا تُشارَك معلومات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> إلا على أساس الحاجة إلى المعرفة، ولا يناقش الموظفون أي حالة مع أشخاص غير معنيين."}},{"id":"m5q2","q":{"en":"Who has access to safeguarding records at PEPS?","ar":"من يحق له الوصول إلى سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في PEPS؟"},"opts":[{"en":"The DSL, deputy DSLs and the Principal","ar":"مسؤول الحماية ونوابه والمدير"},{"en":"All teachers, so that they can support the child","ar":"جميع المعلمين ليتمكنوا من دعم الطفل"},{"en":"Any member of staff who asks","ar":"أي موظف يطلب ذلك"},{"en":"The child's class teacher and the child's parents","ar":"معلم صف الطفل ووالدا الطفل"}],"correct":0,"expl":{"en":"Access is restricted. Records are held separately from the student's general file.","ar":"الوصول مقيَّد. وتُحفظ السجلات منفصلة عن الملف العام للطالب."}},{"id":"m5q3","q":{"en":"A student has told you that a parent is hurting them. May you phone the parents to say you are concerned?","ar":"أخبرك طالب بأن أحد والديه يؤذيه. هل يجوز لك الاتصال بالوالدين لإخبارهما بقلقك؟"},"opts":[{"en":"Yes, because parents always have a right to know immediately","ar":"نعم، لأن للوالدين دائمًا الحق في أن يعرفا فورًا"},{"en":"No. The DSL decides whether and how parents are informed, because telling them could increase the risk to the child","ar":"لا. فمسؤول الحماية هو من يقرر هل يُبلَّغ الوالدان وكيف، لأن إخبارهما قد يزيد الخطر على الطفل"},{"en":"Yes, but only if you do it in writing","ar":"نعم، ولكن فقط إذا كان ذلك كتابةً"},{"en":"Yes, as long as you are polite and calm","ar":"نعم، ما دمت مهذبًا وهادئًا"}],"correct":1,"expl":{"en":"The policy specifically covers the case where a parent is the subject of the concern. The DSL, in consultation with the relevant authority where needed, makes this decision.","ar":"تتناول السياسة تحديدًا حالة أن يكون أحد الوالدين هو موضوع القلق. ويتخذ مسؤول الحماية هذا القرار بالتشاور مع الجهة المختصة عند الحاجة."}}]},{"id":"m6","title":{"en":"Concerns About Adults: Allegations Against Staff","ar":"المخاوف المتعلقة بالبالغين: الادعاءات ضد الموظفين"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"A different route","ar":"مسار مختلف"},"c":{"en":"PEPS takes any allegation that a member of staff, volunteer, contractor or agency worker may have behaved in a way that has harmed, or may harm, a child \u003cstrong>extremely seriously\u003c/strong>. These are handled under Section 8 of the policy, separately from the general referral procedure, so that both the child and the adult are treated fairly.","ar":"تأخذ المدرسة \u003cstrong>بمنتهى الجدية\u003c/strong> أي ادعاء بأن موظفًا أو متطوعًا أو متعاقدًا أو عاملًا من وكالة قد تصرّف بطريقة أضرّت بطفل أو قد تضرّ به. وتُعالَج هذه الادعاءات بموجب القسم 8 من السياسة، منفصلةً عن إجراء الإحالة العام، ليُعامَل الطفل والبالغ بإنصاف."}},{"t":"h","c":{"en":"Who do you tell?","ar":"لمن تبلّغ؟"}},{"t":"table","head":{"en":["If the concern is about…","Report immediately to…"],"ar":["إذا كان القلق بشأن…","بلّغ فورًا إلى…"]},"rows":[{"en":["A member of staff, volunteer, contractor or agency worker","The Principal, who acts as case manager"],"ar":["موظف أو متطوع أو متعاقد أو عامل من وكالة","المدير، الذي يتولى إدارة الحالة"]},{"en":["The Principal","The Chair of the Governing Body"],"ar":["المدير","رئيس مجلس الإدارة"]}]},{"t":"h","c":{"en":"What the case manager does","ar":"ما يفعله مدير الحالة"}},{"t":"list","c":{"en":["Considers without delay whether a child may be suffering, or likely to suffer, significant harm. If so, a referral is made immediately to the relevant authority and/or the Police, \u003cstrong>in parallel with any internal process\u003c/strong>.","Considers interim measures to protect students, such as adjusting duties or, in serious cases, suspension. \u003cstrong>Suspension is not an indication of guilt.\u003c/strong>","Informs the person concerned of the nature of the allegation as far as this does not compromise the child's safety or any investigation, and treats them fairly and supportively.","Keeps a confidential record, distinguishing between substantiated, unsubstantiated, unfounded and malicious allegations."],"ar":["ينظر دون تأخير فيما إذا كان الطفل قد يعاني أو يُرجَّح أن يعاني من ضرر جسيم. وإذا كان الأمر كذلك تُجرى الإحالة فورًا إلى الجهة المختصة و/أو الشرطة، \u003cstrong>بالتوازي مع أي إجراء داخلي\u003c/strong>.","ينظر في تدابير مؤقتة لحماية الطلبة، كتعديل المهام أو الإيقاف في الحالات الخطيرة. \u003cstrong>والإيقاف ليس دليلًا على الإدانة.\u003c/strong>","يُعلم الشخص المعني بطبيعة الادعاء بقدر ما لا يضر ذلك بسلامة الطفل أو بأي تحقيق، ويعامله بإنصاف ودعم.","يحتفظ بسجل سري يميّز بين الادعاءات المثبتة وغير المثبتة وغير الصحيحة والكيدية."]}},{"t":"callout","k":"warn","title":{"en":"What you must not do","ar":"ما لا يجوز لك فعله"},"c":{"en":"Do not confront the colleague, do not investigate, do not discuss it with other staff, and do not warn the person. Report immediately to the Principal. If the concern is about the Principal, report to the Chair of the Governing Body.","ar":"لا تواجه الزميل ولا تحقّق ولا تناقش الأمر مع موظفين آخرين ولا تحذّر الشخص. بلّغ المدير فورًا. وإذا كان القلق بشأن المدير فبلّغ رئيس مجلس الإدارة."}},{"t":"callout","k":"key","title":{"en":"Good faith is protected","ar":"النية الحسنة محمية"},"c":{"en":"A genuine concern raised in good faith, which later proves unfounded, is \u003cstrong>never treated as malicious\u003c/strong>. The Staff Code of Conduct also states that no staff member will be penalised for raising a genuine concern in good faith. So if you are worried about a colleague's behaviour with a child, speak up.","ar":"القلق الحقيقي الذي يُرفع بحسن نية ثم يتبيّن أنه غير صحيح \u003cstrong>لا يُعامَل أبدًا على أنه كيدي\u003c/strong>. كما ينص ميثاق سلوك الموظفين على أن أي موظف لن يُعاقَب لرفعه قلقًا حقيقيًا بحسن نية. فإذا كنت قلقًا من سلوك زميل مع طفل فتحدث."}}],"checks":[{"id":"m6q1","q":{"en":"You see a colleague behave in a way that worries you about a child's safety. To whom do you report it?","ar":"رأيت زميلًا يتصرف بطريقة تقلقك على سلامة طفل. إلى من تبلّغ؟"},"opts":[{"en":"To the colleague, so they can explain what happened","ar":"إلى الزميل ليشرح ما حدث"},{"en":"To other teachers, to see if they have noticed the same","ar":"إلى معلمين آخرين لمعرفة هل لاحظوا الأمر نفسه"},{"en":"Immediately to the Principal, who acts as case manager","ar":"فورًا إلى المدير، الذي يتولى إدارة الحالة"},{"en":"To nobody, until you have collected more evidence","ar":"إلى لا أحد، حتى تجمع مزيدًا من الأدلة"}],"correct":2,"expl":{"en":"Allegations against staff go directly to the Principal under Section 8. Do not confront the person or discuss it with others.","ar":"تُرفع الادعاءات ضد الموظفين مباشرةً إلى المدير بموجب القسم 8. ولا تواجه الشخص ولا تناقش الأمر مع الآخرين."}},{"id":"m6q2","q":{"en":"The concern is about the Principal. To whom do you report it?","ar":"القلق بشأن المدير. إلى من تبلّغ؟"},"opts":[{"en":"The Principal, so that they can respond","ar":"المدير ليتمكن من الرد"},{"en":"The Parent Council","ar":"مجلس أولياء الأمور"},{"en":"The student's parents","ar":"والدي الطالب"},{"en":"The Chair of the Governing Body","ar":"رئيس مجلس الإدارة"}],"correct":3,"expl":{"en":"The policy says that where the allegation concerns the Principal, it is reported to the Chair of the Governing Body.","ar":"تنص السياسة على أنه إذا كان الادعاء يخص المدير فإنه يُرفع إلى رئيس مجلس الإدارة."}},{"id":"m6q3","q":{"en":"A member of staff is suspended while an allegation is looked into. What does the policy say about this?","ar":"أُوقف موظف عن العمل أثناء النظر في ادعاء. ماذا تقول السياسة عن ذلك؟"},"opts":[{"en":"Suspension is not, in itself, an indication of guilt","ar":"الإيقاف ليس في حد ذاته دليلًا على الإدانة"},{"en":"Suspension confirms that the allegation is true","ar":"الإيقاف يؤكد أن الادعاء صحيح"},{"en":"Colleagues should be told the reason so that they can be careful","ar":"ينبغي إخبار الزملاء بالسبب ليتوخوا الحذر"},{"en":"The person must never return to work","ar":"يجب ألا يعود الشخص إلى العمل أبدًا"}],"correct":0,"expl":{"en":"Interim measures protect students while the matter is looked into. Everyone is treated fairly, and information is kept confidential.","ar":"تحمي التدابير المؤقتة الطلبة أثناء النظر في الأمر. ويُعامَل الجميع بإنصاف وتُحفظ المعلومات بسرية."}}]},{"id":"m7","title":{"en":"Putting It Together: Case Practice","ar":"الجمع بين كل ما سبق: تطبيق على حالات"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Use this checklist, then try the cases. Each one is a realistic situation. There is a strong reason behind every right answer in the policy.","ar":"استخدم قائمة التحقق هذه ثم جرّب الحالات. كل حالة منها موقف واقعي. ووراء كل إجابة صحيحة سبب قوي في السياسة."}},{"t":"steps","c":{"en":["\u003cstrong>Listen\u003c/strong> calmly. No leading questions. No promise of secrecy.","\u003cstrong>Reassure\u003c/strong>: “You did the right thing. It's not your fault.”","\u003cstrong>Record\u003c/strong> on the Recording a Concern form: observed, said, opinion; dated and timed.","\u003cstrong>Report\u003c/strong> to the DSL or a deputy the same day (the Principal if it concerns staff). Police first if there is immediate danger.","\u003cstrong>Keep it confidential.\u003c/strong> Need to know only."],"ar":["\u003cstrong>أصغِ\u003c/strong> بهدوء. لا أسئلة إيحائية. ولا وعد بالسرية.","\u003cstrong>طمئن\u003c/strong>: «أحسنت بإخبارنا. ليس ذنبك.»","\u003cstrong>سجّل\u003c/strong> في نموذج تسجيل القلق: ما لوحظ وما قيل والرأي؛ مع التاريخ والوقت.","\u003cstrong>أبلغ\u003c/strong> مسؤول الحماية أو أحد نوابه في اليوم نفسه (والمدير إذا كان الأمر يتعلق بموظف). والشرطة أولًا إذا وُجد خطر داهم.","\u003cstrong>حافظ على السرية.\u003c/strong> الحاجة إلى المعرفة فقط."]}},{"t":"scenario","title":{"en":"Case A","ar":"الحالة أ"},"c":{"en":"At break, 11-year-old Omar says quietly, “My cousin makes me do things I don't like when I stay at his house.” Then he adds, “Please don't tell anyone, I'll get in trouble.”","ar":"في وقت الاستراحة يقول عمر، وعمره 11 عامًا، بصوت منخفض: «ابن عمي يجعلني أفعل أشياء لا أحبها عندما أبيت في منزله». ثم يضيف: «من فضلك لا تخبر أحدًا، سأقع في مشكلة»."}},{"t":"scenario","title":{"en":"Case B","ar":"الحالة ب"},"c":{"en":"A parent whom you know well tells you that her sister has been hitting her son. She asks you not to tell the school “because it is family business”.","ar":"تخبرك ولية أمر تعرفها جيدًا بأن أختها تضرب ابنها. وتطلب منك ألا تخبر المدرسة «لأن هذا شأن عائلي»."}},{"t":"scenario","title":{"en":"Case C","ar":"الحالة ج"},"c":{"en":"You overhear a student telling a friend that a teacher “always makes her sit on his lap” in after-school activities.","ar":"سمعت طالبة تقول لصديقتها إن معلمًا «يجلسها دائمًا على حجره» في أنشطة ما بعد الدوام."}}],"checks":[{"id":"m7q1","q":{"en":"In Case A (Omar), what is the best course of action?","ar":"في الحالة أ (عمر)، ما أفضل مسار عمل؟"},"opts":[{"en":"Promise secrecy so that he continues to trust you, then decide later what to do","ar":"عِده بالسرية ليستمر في الوثوق بك ثم قرّر لاحقًا ما تفعله"},{"en":"Thank him, explain you cannot keep it secret, ask no leading questions, write down his words and pass them to the DSL the same day","ar":"اشكره، واشرح أنك لا تستطيع إبقاءه سرًّا، ولا تطرح أسئلة إيحائية، ودوّن كلماته وسلّمها إلى مسؤول الحماية في اليوم نفسه"},{"en":"Ask him exactly what the cousin did, so you can give full details to the DSL","ar":"اسأله بالضبط ماذا فعل ابن عمه لتقدّم التفاصيل كاملة لمسؤول الحماية"},{"en":"Phone his parents to ask about the cousin","ar":"اتصل بوالديه واسأل عن ابن العم"}],"correct":1,"expl":{"en":"This follows the six steps exactly. Pressing for details is investigating, and contacting the family could put him at risk.","ar":"هذا يتبع الخطوات الست تمامًا. فالإلحاح في طلب التفاصيل تحقيق، والاتصال بالأسرة قد يعرّضه للخطر."}},{"id":"m7q2","q":{"en":"In Case B (the parent), what should you do?","ar":"في الحالة ب (ولية الأمر)، ماذا عليك أن تفعل؟"},"opts":[{"en":"Respect her request and say nothing","ar":"احترم طلبها ولا تقل شيئًا"},{"en":"Confront the aunt yourself","ar":"واجه الخالة بنفسك"},{"en":"Explain kindly that you cannot keep this confidential, and report to the DSL the same day, whatever the parent asks","ar":"اشرحي بلطف أنك لا تستطيع الحفاظ على سرية هذا الأمر، وبلّغ مسؤول الحماية في اليوم نفسه مهما طلب ولي الأمر"},{"en":"Tell her to go to the Police and take no further action yourself","ar":"اطلب منها الذهاب إلى الشرطة ولا تتخذ أي إجراء آخر بنفسك"}],"correct":2,"expl":{"en":"The reporting duty applies to any concern that reaches you, including one from a parent. A request to keep it quiet does not change this.","ar":"يسري واجب الإبلاغ على أي قلق يصل إليك، بما في ذلك القلق الذي يأتي من ولي أمر. وطلب كتمانه لا يغيّر ذلك."}},{"id":"m7q3","q":{"en":"In Case C (the teacher), to whom do you report?","ar":"في الحالة ج (المعلم)، إلى من تبلّغ؟"},"opts":[{"en":"To the teacher, to hear their side first","ar":"إلى المعلم لتسمع روايته أولًا"},{"en":"To the DSL only, who will tell the teacher","ar":"إلى مسؤول الحماية فقط ليخبر المعلم"},{"en":"To nobody, because the student said it only to a friend","ar":"إلى لا أحد، لأن الطالبة قالته لصديقتها فقط"},{"en":"Immediately to the Principal, as an allegation against a member of staff. Do not confront the teacher or discuss it with others","ar":"فورًا إلى المدير بوصفه ادعاءً ضد أحد الموظفين. ولا تواجه المعلم ولا تناقش الأمر مع الآخرين"}],"correct":3,"expl":{"en":"Allegations against staff are reported immediately to the Principal (or the Chair of the Governing Body if it concerns the Principal). Any concern is reported, even overheard.","ar":"تُرفع الادعاءات ضد الموظفين فورًا إلى المدير (أو إلى رئيس مجلس الإدارة إذا تعلّق الأمر بالمدير). ويُبلَّغ عن أي قلق حتى لو سُمع عرضًا."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"What legal basis underpins the staff duty to report suspected abuse in the UAE?","ar":"ما الأساس القانوني الذي يستند إليه واجب الموظفين في الإبلاغ عن الاشتباه في الإساءة في دولة الإمارات؟"},"opts":[{"en":"Wadeema's Law (Federal Law No. 3 of 2016 concerning Child Rights)","ar":"قانون وديمة (القانون الاتحادي رقم 3 لسنة 2016 بشأن حقوق الطفل)"},{"en":"Only the PEPS school rules, with no basis in national law","ar":"قواعد مدرسة PEPS فقط، دون أساس في القانون الوطني"},{"en":"Only a recommendation of the Parent Council","ar":"توصية من مجلس أولياء الأمور فقط"},{"en":"A voluntary guideline for senior staff","ar":"إرشاد طوعي لكبار الموظفين"}],"correct":0},{"id":"e2","mod":1,"q":{"en":"A teacher says, “Reporting is the DSL's job, not mine.” What does the policy say?","ar":"يقول معلم: «الإبلاغ مهمة مسؤول الحماية وليس مهمتي». ماذا تقول السياسة؟"},"opts":[{"en":"Only teachers with Level 3 training must report","ar":"يجب على المعلمين الحاصلين على تدريب المستوى الثالث فقط أن يبلّغوا"},{"en":"The duty to report applies to every member of staff regardless of role or seniority","ar":"يسري واجب الإبلاغ على كل موظف أيًّا كان دوره أو مستواه الوظيفي"},{"en":"Only the Principal has a duty to report","ar":"المدير وحده عليه واجب الإبلاغ"},{"en":"Support staff must report but teachers decide for themselves","ar":"على الموظفين المساندين الإبلاغ لكن المعلمين يقررون بأنفسهم"}],"correct":1},{"id":"e3","mod":1,"q":{"en":"By when should a concern reach the DSL or a deputy?","ar":"بحلول متى ينبغي أن يصل القلق إلى مسؤول الحماية أو نائبه؟"},"opts":[{"en":"Within three working days","ar":"خلال ثلاثة أيام عمل"},{"en":"By the end of the week","ar":"بحلول نهاية الأسبوع"},{"en":"As soon as possible, and always on the same day","ar":"في أسرع وقت ممكن وفي اليوم نفسه دائمًا"},{"en":"At the next safeguarding meeting","ar":"في اجتماع الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> القادم"}],"correct":2},{"id":"e4","mod":2,"q":{"en":"Which is the correct first response when a child begins to disclose?","ar":"ما الاستجابة الأولى الصحيحة عندما يبدأ الطفل بالإفصاح؟"},"opts":[{"en":"Ask detailed questions to establish exactly what happened","ar":"اطرح أسئلة تفصيلية لتحديد ما حدث بالضبط"},{"en":"Take the child to the Principal at once","ar":"خذ الطفل إلى المدير فورًا"},{"en":"Tell the child you will deal with the person responsible","ar":"أخبر الطفل بأنك ستتعامل مع المسؤول عن الأمر"},{"en":"Stay calm and listen carefully without expressing shock or disbelief","ar":"حافظ على هدوئك وأصغِ بانتباه دون إظهار الصدمة أو عدم التصديق"}],"correct":3},{"id":"e5","mod":2,"q":{"en":"Which statement should you NOT make to a child who is disclosing?","ar":"أي عبارة لا ينبغي أن تقولها لطفل يُفصح؟"},"opts":[{"en":"“I promise I won't tell anyone.”","ar":"«أعدك ألا أخبر أحدًا.»"},{"en":"“You have done the right thing in telling me.”","ar":"«لقد أحسنت بإخباري.»"},{"en":"“It is not your fault.”","ar":"«ليس ذنبك.»"},{"en":"“I need to tell someone whose job it is to help.”","ar":"«أحتاج إلى إخبار شخص وظيفته المساعدة.»"}],"correct":0},{"id":"e6","mod":2,"q":{"en":"Which of the following questions is acceptable during a disclosure, if you need to clarify?","ar":"أي الأسئلة التالية مقبول أثناء الإفصاح إذا احتجت إلى التوضيح؟"},"opts":[{"en":"“Was it your uncle who did this?”","ar":"«هل عمّك هو من فعل هذا؟»"},{"en":"“Can you tell me more?”","ar":"«هل تستطيع أن تخبرني بالمزيد؟»"},{"en":"“Did he touch you?”","ar":"«هل لمسك؟»"},{"en":"“Are you sure that's what happened?”","ar":"«هل أنت متأكد أن هذا ما حدث؟»"}],"correct":1},{"id":"e7","mod":3,"q":{"en":"What should you do immediately after a disclosure, once the child is safe and supported?","ar":"ماذا عليك أن تفعل مباشرةً بعد الإفصاح، بعد أن يصبح الطفل آمنًا ومدعومًا؟"},"opts":[{"en":"Wait a few days to be sure you remember it correctly","ar":"انتظر بضعة أيام لتتأكد من أنك تتذكره بدقة"},{"en":"Discuss it with the child's class teacher and friends","ar":"ناقشه مع معلم صف الطفل وأصدقائه"},{"en":"Write down what was said in the child's words, with date, time and names, and pass it to the DSL the same day","ar":"دوّن ما قيل بكلمات الطفل مع التاريخ والوقت والأسماء، وسلّمه إلى مسؤول الحماية في اليوم نفسه"},{"en":"Write a summary in your own words that leaves out the child's wording","ar":"اكتب ملخصًا بكلماتك الخاصة يُغفل كلمات الطفل"}],"correct":2},{"id":"e8","mod":3,"q":{"en":"Which form do staff use to record a concern?","ar":"أي نموذج يستخدمه الموظفون لتسجيل القلق؟"},"opts":[{"en":"An incident form from the behaviour system","ar":"نموذج حادثة من نظام السلوك"},{"en":"A personal email to the DSL","ar":"رسالة بريد إلكتروني شخصية إلى مسؤول الحماية"},{"en":"A note in the student's general school file","ar":"ملاحظة في الملف المدرسي العام للطالب"},{"en":"The Recording a Concern form (Appendix C of the policy)","ar":"نموذج تسجيل القلق (الملحق ج من السياسة)"}],"correct":3},{"id":"e9","mod":3,"q":{"en":"Which entry reflects the policy's requirement to separate observation, speech and opinion?","ar":"أي إدخال يعكس شرط السياسة في الفصل بين الملاحظة والكلام والرأي؟"},"opts":[{"en":"“Observed: red mark on left cheek. Said: ‘I fell’. Opinion: the mark seems unusual for a fall.”","ar":"«لوحظ: علامة حمراء على الخد الأيسر. قال: ‹سقطت›. الرأي: تبدو العلامة غير معتادة لسقطة.»"},{"en":"“His mum clearly slapped him and he is lying about it.”","ar":"«من الواضح أن أمه صفعته وهو يكذب بشأن ذلك.»"},{"en":"“Something is going on at home, I just know it.”","ar":"«شيء ما يجري في المنزل، أنا متأكد من ذلك.»"},{"en":"“Bad day for him today.”","ar":"«يوم سيئ بالنسبة له اليوم.»"}],"correct":0},{"id":"e10","mod":3,"q":{"en":"Where are safeguarding records stored, and who can access them?","ar":"أين تُخزَّن سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> ومن يمكنه الوصول إليها؟"},"opts":[{"en":"In the student's general file, accessible to all teachers","ar":"في الملف العام للطالب، ويصل إليها جميع المعلمين"},{"en":"Securely and separately from the general school file, accessible only to the DSL, deputy DSLs and the Principal","ar":"بأمان ومنفصلة عن الملف المدرسي العام، ولا يصل إليها إلا مسؤول الحماية ونوابه والمدير"},{"en":"With the class teacher, who keeps them for the year","ar":"لدى معلم الصف الذي يحتفظ بها طوال العام"},{"en":"In a shared drive that every member of staff can see","ar":"في مجلد مشترك يراه كل موظف"}],"correct":1},{"id":"e11","mod":4,"q":{"en":"Who assesses a concern after it is raised and decides the next step?","ar":"من يقيّم القلق بعد رفعه ويقرر الخطوة التالية؟"},"opts":[{"en":"The member of staff who raised it","ar":"الموظف الذي رفعه"},{"en":"The student's parents","ar":"والدا الطالب"},{"en":"The DSL","ar":"مسؤول الحماية"},{"en":"The class teacher","ar":"معلم الصف"}],"correct":2},{"id":"e12","mod":4,"q":{"en":"Which of the following is an example of \"internal action\" under the referral procedure?","ar":"أي مما يلي مثال على «الإجراء الداخلي» بموجب إجراء الإحالة؟"},"opts":[{"en":"Referral to the Police","ar":"الإحالة إلى الشرطة"},{"en":"Contacting the Ministry of Education's Child Protection Unit","ar":"الاتصال بوحدة حماية الطفل في وزارة التربية والتعليم"},{"en":"Telling the whole staff about the concern","ar":"إخبار جميع الموظفين بالقلق"},{"en":"Pastoral care or a wellbeing plan coordinated by the DSL","ar":"رعاية رعوية أو خطة رفاه ينسّقها مسؤول الحماية"}],"correct":3},{"id":"e13","mod":4,"q":{"en":"If a child is in immediate danger and the DSL is not immediately available, who contacts the Police?","ar":"إذا كان الطفل في خطر داهم ولم يكن مسؤول الحماية متاحًا فورًا، من يتصل بالشرطة؟"},"opts":[{"en":"Any member of staff, without delay, informing the DSL as soon as possible afterwards","ar":"أي موظف دون تأخير، ثم يبلغ مسؤول الحماية في أقرب وقت ممكن"},{"en":"Nobody, until the DSL is available","ar":"لا أحد حتى يتوافر مسؤول الحماية"},{"en":"Only the Principal","ar":"المدير فقط"},{"en":"Only the child's parents","ar":"والدا الطفل فقط"}],"correct":0},{"id":"e14","mod":4,"q":{"en":"What is the Police emergency number listed in the policy?","ar":"ما رقم طوارئ الشرطة المذكور في السياسة؟"},"opts":[{"en":"800 700","ar":"800 700"},{"en":"999","ar":"999"},{"en":"80085","ar":"80085"},{"en":"116111","ar":"116111"}],"correct":1},{"id":"e15","mod":4,"q":{"en":"What is the role of the DSL after a referral has been made?","ar":"ما دور مسؤول الحماية بعد إجراء الإحالة؟"},"opts":[{"en":"To close the case and take no further interest","ar":"إغلاق الحالة وعدم الاهتمام بها بعد ذلك"},{"en":"To tell every teacher what happened","ar":"إخبار كل معلم بما حدث"},{"en":"To monitor the outcome, keep records up to date and ensure the child continues to be supported at school","ar":"متابعة النتيجة وإبقاء السجلات محدّثة وضمان استمرار دعم الطفل في المدرسة"},{"en":"To ask the child to describe it again for the file","ar":"أن يطلب من الطفل وصفه مرة أخرى للملف"}],"correct":2},{"id":"e16","mod":5,"q":{"en":"Which of these is a breach of confidentiality?","ar":"أي مما يلي يُعدّ خرقًا للسرية؟"},"opts":[{"en":"Passing a Recording a Concern form to the DSL","ar":"تسليم نموذج تسجيل القلق إلى مسؤول الحماية"},{"en":"The DSL sharing necessary information with the Police to protect the child","ar":"مشاركة مسؤول الحماية المعلومات اللازمة مع الشرطة لحماية الطفل"},{"en":"Declining to discuss a case with another parent","ar":"رفض مناقشة حالة مع ولي أمر آخر"},{"en":"Mentioning a child's safeguarding case in a staff group chat","ar":"ذكر حالة صون شامل لطفل في مجموعة محادثة للموظفين"}],"correct":3},{"id":"e17","mod":5,"q":{"en":"When may a safeguarding concern be shared with a colleague?","ar":"متى يجوز مشاركة قلق يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> مع زميل؟"},"opts":[{"en":"Only if that colleague needs to know in order to protect the child","ar":"فقط إذا كان الزميل يحتاج إلى معرفته لحماية الطفل"},{"en":"Whenever the colleague also teaches the child","ar":"كلما كان الزميل يعلّم الطفل أيضًا"},{"en":"If the colleague promises to keep it quiet","ar":"إذا وعد الزميل بكتمانه"},{"en":"Whenever you want advice on how to feel about it","ar":"كلما أردت نصيحة حول كيفية التعامل مع مشاعرك تجاهه"}],"correct":0},{"id":"e18","mod":5,"q":{"en":"A parent is the subject of a concern. Who decides whether and how the parents are informed?","ar":"أحد الوالدين هو موضوع قلق. من يقرر هل يُبلَّغ الوالدان وكيف؟"},"opts":[{"en":"The member of staff who raised the concern","ar":"الموظف الذي رفع القلق"},{"en":"The DSL, consulting the relevant authority where necessary","ar":"مسؤول الحماية بالتشاور مع الجهة المختصة عند الحاجة"},{"en":"The child","ar":"الطفل"},{"en":"The class teacher","ar":"معلم الصف"}],"correct":1},{"id":"e19","mod":6,"q":{"en":"To whom is an allegation against a member of staff reported?","ar":"إلى من يُرفع الادعاء ضد أحد الموظفين؟"},"opts":[{"en":"To the DSL, who then informs the member of staff","ar":"إلى مسؤول الحماية الذي يخبر الموظف بعد ذلك"},{"en":"To the member of staff concerned, for an explanation","ar":"إلى الموظف المعني ليقدّم تفسيرًا"},{"en":"Immediately to the Principal, who acts as case manager","ar":"فورًا إلى المدير الذي يتولى إدارة الحالة"},{"en":"To the Parent Council","ar":"إلى مجلس أولياء الأمور"}],"correct":2},{"id":"e20","mod":6,"q":{"en":"The allegation concerns the Principal. What is the correct route?","ar":"الادعاء يخص المدير. ما المسار الصحيح؟"},"opts":[{"en":"Report it to the Principal as normal","ar":"ارفعه إلى المدير كالمعتاد"},{"en":"Raise it with the staff meeting","ar":"اطرحه في اجتماع الموظفين"},{"en":"Ask the student's parents to complain","ar":"اطلب من والدي الطالب تقديم شكوى"},{"en":"Report it to the Chair of the Governing Body","ar":"ارفعه إلى رئيس مجلس الإدارة"}],"correct":3},{"id":"e21","mod":6,"q":{"en":"A colleague raised a concern about another member of staff in good faith, but it was found to be unfounded. What does the policy say?","ar":"رفع زميل بحسن نية قلقًا بشأن موظف آخر لكن تبيّن أنه غير صحيح. ماذا تقول السياسة؟"},"opts":[{"en":"A genuine concern raised in good faith is never treated as malicious","ar":"القلق الحقيقي المرفوع بحسن نية لا يُعامَل أبدًا على أنه كيدي"},{"en":"The colleague should face disciplinary action","ar":"ينبغي أن يواجه الزميل إجراءً تأديبيًا"},{"en":"The concern should be removed from all records","ar":"ينبغي حذف القلق من جميع السجلات"},{"en":"The colleague should apologise to the member of staff in person","ar":"ينبغي أن يعتذر الزميل شخصيًا للموظف"}],"correct":0},{"id":"e22","mod":7,"q":{"en":"A student says a classmate's older cousin has been touching her, and then says, “Please don't tell, I'll be in trouble.” What is the best response?","ar":"تقول طالبة إن ابن عم زميلتها الأكبر يلمسها، ثم تقول: «من فضلك لا تخبر أحدًا، سأقع في مشكلة». ما أفضل استجابة؟"},"opts":[{"en":"Promise to say nothing, so she keeps talking to you","ar":"عِدها بألا تقول شيئًا لتستمر في الحديث معك"},{"en":"Reassure her, explain you cann const KEY = 'peps_cpd_' + META.id + '_v1';

function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}
