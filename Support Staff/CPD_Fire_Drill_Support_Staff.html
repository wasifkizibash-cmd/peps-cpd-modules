#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"support-fire-drill","code":"SFD","passMark":80,"hours":"1.25 hours","accent":"#C0392B","accentSoft":"#FBE9E7","eyebrow":{"en":"Staff CPD · Support Staff · Fire Safety","ar":"Staff CPD · Support Staff · Fire Safety"},"title":{"en":"Fire Drill and Evacuation Training","ar":"Fire Drill and Evacuation Training"},"subtitle":{"en":"A plain-English course for support staff: why drills matter, how fires start and spread, what to do when the alarm sounds, how to help everyone get out, when (and when not) to use an extinguisher, and what happens after the drill.","ar":"A plain-English course for support staff: why drills matter, how fires start and spread, what to do when the alarm sounds, how to help everyone get out, when (and when not) to use an extinguisher, and what happens after the drill."},"durationLabel":{"en":"About 1 hour 15 minutes, fully self-paced","ar":"About 1 hour 15 minutes, fully self-paced"},"standard":{"en":"Fire safety and evacuation · Support staff in schools","ar":"Fire safety and evacuation · Support staff in schools"},"source":{"en":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)","ar":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why Drills Matter and How Fires Start","ar":"Why Drills Matter and How Fires Start"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose of this course","ar":"Purpose of this course"},"c":{"en":"This course helps you act quickly and calmly if there is a fire at school. By the end you will be able to explain why we practise, name the common causes of fire in a school, spot fire risks in your own work area, and know the first things to do. \u003cstrong>This CPD supports, and does not replace, the school's own policies, the school's fire evacuation plan and your line manager's instructions.\u003c/strong>","ar":"This course helps you act quickly and calmly if there is a fire at school. By the end you will be able to explain why we practise, name the common causes of fire in a school, spot fire risks in your own work area, and know the first things to do. \u003cstrong>This CPD supports, and does not replace, the school's own policies, the school's fire evacuation plan and your line manager's instructions.\u003c/strong>"}},{"t":"p","c":{"en":"A school is a busy place. Hundreds of children, staff and visitors are in the building at the same time. Many are small children who need help. If a real fire starts, there is no time to stop and think. That is why we hold fire drills. A drill is a practice. It is not a game and it is not a waste of time. Practice turns a plan on paper into a habit your body already knows.","ar":"A school is a busy place. Hundreds of children, staff and visitors are in the building at the same time. Many are small children who need help. If a real fire starts, there is no time to stop and think. That is why we hold fire drills. A drill is a practice. It is not a game and it is not a waste of time. Practice turns a plan on paper into a habit your body already knows."}},{"t":"h","c":{"en":"Why drills matter","ar":"Why drills matter"}},{"t":"list","c":{"en":["Smoke can fill a corridor in just a few minutes. People who know the way out leave faster.","Children copy adults. If you are calm and clear, they stay calm too.","A drill shows us problems before a real fire does: a blocked door, a broken alarm, a corridor that is too crowded.","Drills also help new staff, visitors and part-time staff who do not know the building well.","Fire safety is a legal and safety duty of the school. Every adult on site has a part to play, not only the teachers."],"ar":["Smoke can fill a corridor in just a few minutes. People who know the way out leave faster.","Children copy adults. If you are calm and clear, they stay calm too.","A drill shows us problems before a real fire does: a blocked door, a broken alarm, a corridor that is too crowded.","Drills also help new staff, visitors and part-time staff who do not know the building well.","Fire safety is a legal and safety duty of the school. Every adult on site has a part to play, not only the teachers."]}},{"t":"h","c":{"en":"How fires start","ar":"How fires start"}},{"t":"p","c":{"en":"A fire needs three things: \u003cstrong>heat\u003c/strong>, \u003cstrong>fuel\u003c/strong> (something that burns) and \u003cstrong>oxygen\u003c/strong> (air). Take away any one of the three and the fire cannot continue. This is why a fire blanket on a pan fire works: it cuts off the air.","ar":"A fire needs three things: \u003cstrong>heat\u003c/strong>, \u003cstrong>fuel\u003c/strong> (something that burns) and \u003cstrong>oxygen\u003c/strong> (air). Take away any one of the three and the fire cannot continue. This is why a fire blanket on a pan fire works: it cuts off the air."}},{"t":"table","head":{"en":["Common cause","Where it can happen in school","Simple prevention"],"ar":["Common cause","Where it can happen in school","Simple prevention"]},"rows":[{"en":["Cooking and hot oil","Canteen and kitchen","Never leave hot oil or hot equipment alone. Clean grease from cookers and filters."],"ar":["Cooking and hot oil","Canteen and kitchen","Never leave hot oil or hot equipment alone. Clean grease from cookers and filters."]},{"en":["Electrical faults","Offices, labs, IT rooms, stores","Report damaged plugs and cables. Do not overload sockets or join extension leads together."],"ar":["Electrical faults","Offices, labs, IT rooms, stores","Report damaged plugs and cables. Do not overload sockets or join extension leads together."]},{"en":["Flames and chemicals","Science labs","Keep flammable liquids in the correct cupboard. Lab assistants must follow lab rules."],"ar":["Flames and chemicals","Science labs","Keep flammable liquids in the correct cupboard. Lab assistants must follow lab rules."]},{"en":["Stored materials","Stores, cupboards, plant rooms","Keep stock away from heaters and lights. Do not stack boxes against electrical panels."],"ar":["Stored materials","Stores, cupboards, plant rooms","Keep stock away from heaters and lights. Do not stack boxes against electrical panels."]},{"en":["Rubbish and paper","Cleaning areas, offices, bins","Empty bins often. Do not let paper pile up near heat."],"ar":["Rubbish and paper","Cleaning areas, offices, bins","Empty bins often. Do not let paper pile up near heat."]},{"en":["Heaters and equipment left on","Staff room, offices, workshops","Switch off and unplug at the end of the day, if the school allows it."],"ar":["Heaters and equipment left on","Staff room, offices, workshops","Switch off and unplug at the end of the day, if the school allows it."]}]},{"t":"h","c":{"en":"How a fire spreads","ar":"How a fire spreads"}},{"t":"p","c":{"en":"Fire spreads in three main ways. It can \u003cstrong>climb\u003c/strong> on things that burn, such as curtains, boxes and paper. Hot air and smoke \u003cstrong>rise\u003c/strong> and move along ceilings and up stairs. Fire can also pass through \u003cstrong>open doors\u003c/strong> and gaps. Fire doors are designed to slow this down. A fire door that is propped open is not doing its job.","ar":"Fire spreads in three main ways. It can \u003cstrong>climb\u003c/strong> on things that burn, such as curtains, boxes and paper. Hot air and smoke \u003cstrong>rise\u003c/strong> and move along ceilings and up stairs. Fire can also pass through \u003cstrong>open doors\u003c/strong> and gaps. Fire doors are designed to slow this down. A fire door that is propped open is not doing its job."}},{"t":"callout","k":"warn","title":{"en":"Smoke is the biggest danger","ar":"Smoke is the biggest danger"},"c":{"en":"Most people hurt in a fire are harmed by smoke, not by flames. Smoke is hot, thick and poisonous. It makes people dizzy and confused very quickly. Never go into a smoky room to look for belongings. If you must pass through smoke, stay low where the air is cleaner and get out.","ar":"Most people hurt in a fire are harmed by smoke, not by flames. Smoke is hot, thick and poisonous. It makes people dizzy and confused very quickly. Never go into a smoky room to look for belongings. If you must pass through smoke, stay low where the air is cleaner and get out."}},{"t":"h","c":{"en":"Prevention in your work area","ar":"Prevention in your work area"}},{"t":"list","c":{"en":["\u003cstrong>Kitchens and canteen:\u003c/strong> watch cooking at all times, keep tea towels and packaging away from the cooker, and know where the fire blanket is.","\u003cstrong>Labs:\u003c/strong> store chemicals correctly, keep exits clear of bags and stools, and tell the teacher about any damaged equipment.","\u003cstrong>Stores:\u003c/strong> keep a clear walkway, keep stock off the floor near doors, and never block a fire door or extinguisher.","\u003cstrong>Electrical:\u003c/strong> do not use damaged equipment, do not cover heaters or chargers, and report any burning smell straight away."],"ar":["\u003cstrong>Kitchens and canteen:\u003c/strong> watch cooking at all times, keep tea towels and packaging away from the cooker, and know where the fire blanket is.","\u003cstrong>Labs:\u003c/strong> store chemicals correctly, keep exits clear of bags and stools, and tell the teacher about any damaged equipment.","\u003cstrong>Stores:\u003c/strong> keep a clear walkway, keep stock off the floor near doors, and never block a fire door or extinguisher.","\u003cstrong>Electrical:\u003c/strong> do not use damaged equipment, do not cover heaters or chargers, and report any burning smell straight away."]}},{"t":"scenario","title":{"en":"Scenario: the propped door","ar":"Scenario: the propped door"},"c":{"en":"A cleaner is carrying heavy boxes along the Year 5 corridor. To make the work easier, she props the fire door open with a bucket. She plans to remove it in ten minutes. \u003cstrong>Is this a problem?\u003c/strong> Yes. Fire doors only protect people when they are closed. If a fire started in a nearby room, smoke could spread down the corridor through the open door. The better choice is to carry the boxes in smaller loads, ask a colleague to hold the door, and always close it afterwards. If you see a propped door, close it and tell your line manager.","ar":"A cleaner is carrying heavy boxes along the Year 5 corridor. To make the work easier, she props the fire door open with a bucket. She plans to remove it in ten minutes. \u003cstrong>Is this a problem?\u003c/strong> Yes. Fire doors only protect people when they are closed. If a fire started in a nearby room, smoke could spread down the corridor through the open door. The better choice is to carry the boxes in smaller loads, ask a colleague to hold the door, and always close it afterwards. If you see a propped door, close it and tell your line manager."}}],"checks":[{"id":"m1q1","q":{"en":"Which three things must be present for a fire to burn?","ar":"Which three things must be present for a fire to burn?"},"opts":[{"en":"Heat, fuel and oxygen","ar":"Heat, fuel and oxygen"},{"en":"Smoke, heat and wind from outside","ar":"Smoke, heat and wind from outside"},{"en":"Water, fuel and a spark from a switch","ar":"Water, fuel and a spark from a switch"},{"en":"Gas, paper and a closed room","ar":"Gas, paper and a closed room"}],"correct":0,"expl":{"en":"A fire needs heat, fuel and oxygen. If you remove one of these, the fire stops. This is the basic idea behind most fire safety advice.","ar":"A fire needs heat, fuel and oxygen. If you remove one of these, the fire stops. This is the basic idea behind most fire safety advice."}},{"id":"m1q2","q":{"en":"In the canteen, a member of staff leaves a pan of hot oil on the cooker and goes to the store room. What is the main problem?","ar":"In the canteen, a member of staff leaves a pan of hot oil on the cooker and goes to the store room. What is the main problem?"},"opts":[{"en":"The oil will lose its taste if it stays hot for too long","ar":"The oil will lose its taste if it stays hot for too long"},{"en":"Hot oil left alone can catch fire very quickly","ar":"Hot oil left alone can catch fire very quickly"},{"en":"The pan may be too heavy for the cooker to hold safely","ar":"The pan may be too heavy for the cooker to hold safely"},{"en":"The store room may need more staff for a longer time","ar":"The store room may need more staff for a longer time"}],"correct":1,"expl":{"en":"Hot oil can catch fire in minutes. Cooking must be watched at all times. If you must leave, switch off the heat or ask a colleague to stay.","ar":"Hot oil can catch fire in minutes. Cooking must be watched at all times. If you must leave, switch off the heat or ask a colleague to stay."}},{"id":"m1q3","q":{"en":"A fire door in the corridor has been propped open with a chair. What should you do?","ar":"A fire door in the corridor has been propped open with a chair. What should you do?"},"opts":[{"en":"Leave it open because the corridor is busy at break time","ar":"Leave it open because the corridor is busy at break time"},{"en":"Open the other fire doors too so the air can move freely","ar":"Open the other fire doors too so the air can move freely"},{"en":"Remove the chair, close the door and tell your line manager","ar":"Remove the chair, close the door and tell your line manager"},{"en":"Wait for the next drill and check whether anyone mentions it","ar":"Wait for the next drill and check whether anyone mentions it"}],"correct":2,"expl":{"en":"Fire doors slow smoke and flames only when they are closed. Close the door, remove whatever is holding it open and report it so it does not happen again.","ar":"Fire doors slow smoke and flames only when they are closed. Close the door, remove whatever is holding it open and report it so it does not happen again."}}]},{"id":"m2","title":{"en":"Raising the Alarm and What to Do When It Sounds","ar":"Raising the Alarm and What to Do When It Sounds"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Every minute counts in a fire. Two things must happen at once: people must be warned, and the fire service must be called. You may be the first person to see smoke or flames. Do not assume that someone else has already raised the alarm.","ar":"Every minute counts in a fire. Two things must happen at once: people must be warned, and the fire service must be called. You may be the first person to see smoke or flames. Do not assume that someone else has already raised the alarm."}},{"t":"h","c":{"en":"If you discover a fire","ar":"If you discover a fire"}},{"t":"p","c":{"en":"Many schools teach a short memory aid for this. A common one is RACE: Rescue, Alarm, Contain, Evacuate (or Extinguish, if trained). Here are the same ideas in plain English. Use the order in the school's own plan if it is different.","ar":"Many schools teach a short memory aid for this. A common one is RACE: Rescue, Alarm, Contain, Evacuate (or Extinguish, if trained). Here are the same ideas in plain English. Use the order in the school's own plan if it is different."}},{"t":"steps","c":{"en":["\u003cstrong>Get people away.\u003c/strong> If anyone is in immediate danger, help them move away from the fire. Do not put yourself at risk.","\u003cstrong>Raise the alarm.\u003c/strong> Press the nearest fire alarm call point. Shout \"Fire!\" if you must, so that nearby people know.","\u003cstrong>Call 997.\u003c/strong> This is the Civil Defence number for fire. Say who you are, the name and address of the school, and where the fire is. If the office calls for you, make sure someone has done it.","\u003cstrong>Close doors if it is safe.\u003c/strong> Closing a door behind you slows the spread of smoke and fire. Do not lock it.","\u003cstrong>Leave the building.\u003c/strong> Use the nearest safe exit and go to the assembly point. Only fight the fire if you are trained, it is very small and you have a clear exit behind you."],"ar":["\u003cstrong>Get people away.\u003c/strong> If anyone is in immediate danger, help them move away from the fire. Do not put yourself at risk.","\u003cstrong>Raise the alarm.\u003c/strong> Press the nearest fire alarm call point. Shout \"Fire!\" if you must, so that nearby people know.","\u003cstrong>Call 997.\u003c/strong> This is the Civil Defence number for fire. Say who you are, the name and address of the school, and where the fire is. If the office calls for you, make sure someone has done it.","\u003cstrong>Close doors if it is safe.\u003c/strong> Closing a door behind you slows the spread of smoke and fire. Do not lock it.","\u003cstrong>Leave the building.\u003c/strong> Use the nearest safe exit and go to the assembly point. Only fight the fire if you are trained, it is very small and you have a clear exit behind you."]}},{"t":"callout","k":"tip","title":{"en":"Think of it as: warn, call, close, go","ar":"Think of it as: warn, call, close, go"},"c":{"en":"If you forget the steps in a stressful moment, remember four words: \u003cstrong>warn\u003c/strong> people, \u003cstrong>call\u003c/strong> 997, \u003cstrong>close\u003c/strong> the door if safe, \u003cstrong>go\u003c/strong> to the assembly point.","ar":"If you forget the steps in a stressful moment, remember four words: \u003cstrong>warn\u003c/strong> people, \u003cstrong>call\u003c/strong> 997, \u003cstrong>close\u003c/strong> the door if safe, \u003cstrong>go\u003c/strong> to the assembly point."}},{"t":"h","c":{"en":"If you hear the alarm","ar":"If you hear the alarm"}},{"t":"p","c":{"en":"Treat every alarm as real until the school says otherwise. Even a drill must be taken seriously, because we practise the way we would act in a real emergency.","ar":"Treat every alarm as real until the school says otherwise. Even a drill must be taken seriously, because we practise the way we would act in a real emergency."}},{"t":"list","c":{"en":["\u003cstrong>Stop what you are doing.\u003c/strong> Switch off anything dangerous if it takes just a second, for example a cooker or a lab burner.","\u003cstrong>Do not stop for belongings.\u003c/strong> Bags, phones, coats and lunch can be replaced. People cannot.","\u003cstrong>Check your area quickly.\u003c/strong> If it is safe, look in toilets, store rooms and side rooms for anyone who may not have heard.","\u003cstrong>Leave by the nearest safe exit.\u003c/strong> If that exit has smoke or fire, use another. Do not use lifts.","\u003cstrong>Walk, do not run.\u003c/strong> Running causes falls, especially on stairs, and can make children frightened.","\u003cstrong>Help anyone who needs help\u003c/strong> and then go to the assembly point."],"ar":["\u003cstrong>Stop what you are doing.\u003c/strong> Switch off anything dangerous if it takes just a second, for example a cooker or a lab burner.","\u003cstrong>Do not stop for belongings.\u003c/strong> Bags, phones, coats and lunch can be replaced. People cannot.","\u003cstrong>Check your area quickly.\u003c/strong> If it is safe, look in toilets, store rooms and side rooms for anyone who may not have heard.","\u003cstrong>Leave by the nearest safe exit.\u003c/strong> If that exit has smoke or fire, use another. Do not use lifts.","\u003cstrong>Walk, do not run.\u003c/strong> Running causes falls, especially on stairs, and can make children frightened.","\u003cstrong>Help anyone who needs help\u003c/strong> and then go to the assembly point."]}},{"t":"scenario","title":{"en":"Scenario: smoke at break time","ar":"Scenario: smoke at break time"},"c":{"en":"You are in the school office at break. The smoke detector near the photocopy room starts to sound. You see light grey smoke coming from under the door. A colleague says, \"It is probably just the machine. Let us wait and see.\" \u003cstrong>What do you do?\u003c/strong> Do not wait. Press the nearest alarm call point, ask a colleague to call 997 (or call it yourself), close the office door if you are able, and leave by the nearest safe exit. Smoke from a machine can quickly become a real fire. It is much better to evacuate for a false alarm than to wait for a real one.","ar":"You are in the school office at break. The smoke detector near the photocopy room starts to sound. You see light grey smoke coming from under the door. A colleague says, \"It is probably just the machine. Let us wait and see.\" \u003cstrong>What do you do?\u003c/strong> Do not wait. Press the nearest alarm call point, ask a colleague to call 997 (or call it yourself), close the office door if you are able, and leave by the nearest safe exit. Smoke from a machine can quickly become a real fire. It is much better to evacuate for a false alarm than to wait for a real one."}},{"t":"callout","k":"warn","title":{"en":"Never test a door or a room by opening it wide","ar":"Never test a door or a room by opening it wide"},"c":{"en":"If you suspect fire behind a closed door, touch the back of your hand to the door first. If it is hot, do not open it. Leave and tell the Fire Warden. An open door gives the fire fresh air and lets smoke into your path.","ar":"If you suspect fire behind a closed door, touch the back of your hand to the door first. If it is hot, do not open it. Leave and tell the Fire Warden. An open door gives the fire fresh air and lets smoke into your path."}}],"checks":[{"id":"m2q1","q":{"en":"You see smoke coming from a store room and nobody else has noticed. What should you do first?","ar":"You see smoke coming from a store room and nobody else has noticed. What should you do first?"},"opts":[{"en":"Look inside the store room first to find out the cause of the smoke","ar":"Look inside the store room first to find out the cause of the smoke"},{"en":"Tell the Principal at the end of the school day in person","ar":"Tell the Principal at the end of the school day in person"},{"en":"Collect your bag and your phone so you can call the fire service","ar":"Collect your bag and your phone so you can call the fire service"},{"en":"Press the nearest alarm call point and warn people nearby","ar":"Press the nearest alarm call point and warn people nearby"}],"correct":3,"expl":{"en":"Raise the alarm straight away so people can leave. Do not open doors to investigate, and do not go back for your belongings.","ar":"Raise the alarm straight away so people can leave. Do not open doors to investigate, and do not go back for your belongings."}},{"id":"m2q2","q":{"en":"The alarm sounds while you are in the office. A colleague says it is probably a drill and keeps working. What is the correct response?","ar":"The alarm sounds while you are in the office. A colleague says it is probably a drill and keeps working. What is the correct response?"},"opts":[{"en":"Treat it as real, stop work and leave by the nearest safe exit","ar":"Treat it as real, stop work and leave by the nearest safe exit"},{"en":"Finish your task first, then leave as the last person in the room","ar":"Finish your task first, then leave as the last person in the room"},{"en":"Ask the Vice Principal by phone if it is a drill before moving","ar":"Ask the Vice Principal by phone if it is a drill before moving"},{"en":"Stay at your desk until someone comes to tell you it is real","ar":"Stay at your desk until someone comes to tell you it is real"}],"correct":0,"expl":{"en":"Always treat an alarm as real until the school says it is not. Stop work and leave. Waiting to confirm wastes time that might matter in a real fire.","ar":"Always treat an alarm as real until the school says it is not. Stop work and leave. Waiting to confirm wastes time that might matter in a real fire."}},{"id":"m2q3","q":{"en":"What number do you call to report a fire in the UAE?","ar":"What number do you call to report a fire in the UAE?"},"opts":[{"en":"998","ar":"998"},{"en":"997","ar":"997"},{"en":"999","ar":"999"},{"en":"991","ar":"991"}],"correct":1,"expl":{"en":"997 is the Civil Defence (fire) number. 998 is the ambulance and 999 is the police.","ar":"997 is the Civil Defence (fire) number. 998 is the ambulance and 999 is the police."}}]},{"id":"m3","title":{"en":"Evacuating Pupils, Visitors and People Who Need Help","ar":"Evacuating Pupils, Visitors and People Who Need Help"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Getting out of the building is only the first part of an evacuation. The second part is making sure everyone is accounted for. The school's fire evacuation plan shows the exit routes and the assembly point. Make sure you know both for the areas where you work. Your line manager can show you the plan.","ar":"Getting out of the building is only the first part of an evacuation. The second part is making sure everyone is accounted for. The school's fire evacuation plan shows the exit routes and the assembly point. Make sure you know both for the areas where you work. Your line manager can show you the plan."}},{"t":"h","c":{"en":"Routes and the assembly point","ar":"Routes and the assembly point"}},{"t":"list","c":{"en":["Every room should have a nearest exit and a second exit if the first is blocked. Learn both.","Exit routes must always be clear. Do not store chairs, boxes, bins, bikes or equipment in corridors, on stairs or in front of doors.","Exit doors must open easily from the inside. If you find one locked, chained or stuck, report it the same day.","The \u003cstrong>assembly point\u003c/strong> is the safe place outside where everyone meets. Stay there. Do not wander off or go back to the building."],"ar":["Every room should have a nearest exit and a second exit if the first is blocked. Learn both.","Exit routes must always be clear. Do not store chairs, boxes, bins, bikes or equipment in corridors, on stairs or in front of doors.","Exit doors must open easily from the inside. If you find one locked, chained or stuck, report it the same day.","The \u003cstrong>assembly point\u003c/strong> is the safe place outside where everyone meets. Stay there. Do not wander off or go back to the building."]}},{"t":"h","c":{"en":"Helping children","ar":"Helping children"}},{"t":"list","c":{"en":["Use a calm, clear, firm voice. Say short things: \"Walk with me. Stay in line. Hold the rail.\"","Do not take children away from their teacher's group. Help them join the nearest class and tell their teacher where they are.","If you find a child alone, take them with you to the assembly point and tell a teacher or the Fire Warden by name.","Little children may hide when they are scared. Look in toilets and under tables if it is safe to do so."],"ar":["Use a calm, clear, firm voice. Say short things: \"Walk with me. Stay in line. Hold the rail.\"","Do not take children away from their teacher's group. Help them join the nearest class and tell their teacher where they are.","If you find a child alone, take them with you to the assembly point and tell a teacher or the Fire Warden by name.","Little children may hide when they are scared. Look in toilets and under tables if it is safe to do so."]}},{"t":"h","c":{"en":"Visitors, contractors and parents","ar":"Visitors, contractors and parents"}},{"t":"p","c":{"en":"Visitors do not know the building. Reception staff must help them. If the alarm sounds, take the visitor book or the visitor list (or your device with the list) if you can do so without delay. This helps the Fire Warden know who is on site. Walk visitors to the assembly point. A visitor must never leave the group to go back for their belongings or to go home.","ar":"Visitors do not know the building. Reception staff must help them. If the alarm sounds, take the visitor book or the visitor list (or your device with the list) if you can do so without delay. This helps the Fire Warden know who is on site. Walk visitors to the assembly point. A visitor must never leave the group to go back for their belongings or to go home."}},{"t":"h","c":{"en":"People who need help to get out","ar":"People who need help to get out"}},{"t":"p","c":{"en":"Some people cannot use stairs or cannot move quickly. This may be a pupil with a leg injury, a staff member who uses a wheelchair, a visitor who is older or a person who is deaf or blind. Many schools have a personal evacuation plan for such people. Check with your line manager how your school arranges this.","ar":"Some people cannot use stairs or cannot move quickly. This may be a pupil with a leg injury, a staff member who uses a wheelchair, a visitor who is older or a person who is deaf or blind. Many schools have a personal evacuation plan for such people. Check with your line manager how your school arranges this."}},{"t":"list","c":{"en":["\u003cstrong>Do not use lifts.\u003c/strong> In a fire, a lift can stop between floors or open on a floor that is full of smoke.","Ask the person how they would like to be helped. Do not lift or carry anyone unless you are trained or it is an emergency and you have no other choice.","If a person cannot leave safely, take them to a safe place if the plan allows it, and tell the Fire Warden and the Fire Service their exact location. Do not leave them without telling someone.","A person who is deaf may not hear the alarm. Check on them or use a signal that was agreed with them."],"ar":["\u003cstrong>Do not use lifts.\u003c/strong> In a fire, a lift can stop between floors or open on a floor that is full of smoke.","Ask the person how they would like to be helped. Do not lift or carry anyone unless you are trained or it is an emergency and you have no other choice.","If a person cannot leave safely, take them to a safe place if the plan allows it, and tell the Fire Warden and the Fire Service their exact location. Do not leave them without telling someone.","A person who is deaf may not hear the alarm. Check on them or use a signal that was agreed with them."]}},{"t":"h","c":{"en":"Roll call","ar":"Roll call"}},{"t":"p","c":{"en":"At the assembly point, teachers take roll call of their class. Support staff are counted too. Tell the person in charge that you are present. If you are with a child who is not from your class, say so loudly and clearly. Never leave the assembly point without telling the Fire Warden. If someone is missing, tell the Fire Warden at once. Do not go back to search yourself. The fire service will search.","ar":"At the assembly point, teachers take roll call of their class. Support staff are counted too. Tell the person in charge that you are present. If you are with a child who is not from your class, say so loudly and clearly. Never leave the assembly point without telling the Fire Warden. If someone is missing, tell the Fire Warden at once. Do not go back to search yourself. The fire service will search."}},{"t":"scenario","title":{"en":"Scenario: the child on the stairs","ar":"Scenario: the child on the stairs"},"c":{"en":"The alarm sounds. On your way out you see a Year 2 pupil crying on the stairs. She says she cannot find her class. \u003cstrong>What do you do?\u003c/strong> Stay calm and kneel to her height. Say, \"I am with you. We will walk out together.\" Take her hand, go to the assembly point and tell the Fire Warden and her teacher straight away. Do not return to the building to look for the class. Her teacher needs to know that she is safe.","ar":"The alarm sounds. On your way out you see a Year 2 pupil crying on the stairs. She says she cannot find her class. \u003cstrong>What do you do?\u003c/strong> Stay calm and kneel to her height. Say, \"I am with you. We will walk out together.\" Take her hand, go to the assembly point and tell the Fire Warden and her teacher straight away. Do not return to the building to look for the class. Her teacher needs to know that she is safe."}},{"t":"callout","k":"warn","title":{"en":"Do not go back in","ar":"Do not go back in"},"c":{"en":"Once you have left the building, you must not re-enter for any reason until the Fire Warden or the Principal says that it is safe. This includes going back for a person, a phone, or a bag. Tell the Fire Warden who is missing and let the fire service search.","ar":"Once you have left the building, you must not re-enter for any reason until the Fire Warden or the Principal says that it is safe. This includes going back for a person, a phone, or a bag. Tell the Fire Warden who is missing and let the fire service search."}}],"checks":[{"id":"m3q1","q":{"en":"A visitor in a wheelchair is on the first floor when the alarm sounds. What should you not do?","ar":"A visitor in a wheelchair is on the first floor when the alarm sounds. What should you not do?"},"opts":[{"en":"Ask them how they would like to be helped to leave the building","ar":"Ask them how they would like to be helped to leave the building"},{"en":"Tell the Fire Warden exactly where the visitor is waiting","ar":"Tell the Fire Warden exactly where the visitor is waiting"},{"en":"Take them down in the lift to reach the assembly point quickly","ar":"Take them down in the lift to reach the assembly point quickly"},{"en":"Stay with the visitor until help arrives if the plan says so","ar":"Stay with the visitor until help arrives if the plan says so"}],"correct":2,"expl":{"en":"Lifts must never be used in a fire. They can stop or open into smoke. Ask how the person wants to be helped, follow the plan and tell the Fire Warden where they are.","ar":"Lifts must never be used in a fire. They can stop or open into smoke. Ask how the person wants to be helped, follow the plan and tell the Fire Warden where they are."}},{"id":"m3q2","q":{"en":"At the assembly point, you cannot see a pupil who is usually in your area. What is the best action?","ar":"At the assembly point, you cannot see a pupil who is usually in your area. What is the best action?"},"opts":[{"en":"Go back into the building quickly to check the library","ar":"Go back into the building quickly to check the library"},{"en":"Ask the other pupils to go and look near the exits","ar":"Ask the other pupils to go and look near the exits"},{"en":"Wait until the roll call is finished to say something","ar":"Wait until the roll call is finished to say something"},{"en":"Tell the Fire Warden at once and wait at the assembly point","ar":"Tell the Fire Warden at once and wait at the assembly point"}],"correct":3,"expl":{"en":"Tell the Fire Warden immediately. The fire service has the training and equipment to search safely. Never go back in yourself.","ar":"Tell the Fire Warden immediately. The fire service has the training and equipment to search safely. Never go back in yourself."}},{"id":"m3q3","q":{"en":"You are at reception when the alarm sounds. Two visitors are sitting in the waiting area. What should you do?","ar":"You are at reception when the alarm sounds. Two visitors are sitting in the waiting area. What should you do?"},"opts":[{"en":"Lead them out to the assembly point and report the names","ar":"Lead them out to the assembly point and report the names"},{"en":"Tell them to leave by themselves while you lock the front door","ar":"Tell them to leave by themselves while you lock the front door"},{"en":"Ask them to wait quietly until the alarm stops ringing","ar":"Ask them to wait quietly until the alarm stops ringing"},{"en":"Let them go to their cars so the road stays clear for others","ar":"Let them go to their cars so the road stays clear for others"}],"correct":0,"expl":{"en":"Visitors do not know the building. Lead them to the assembly point, keep them with you and give their names to the Fire Warden so nobody is missed.","ar":"Visitors do not know the building. Lead them to the assembly point, keep them with you and give their names to the Fire Warden so nobody is missed."}}]},{"id":"m4","title":{"en":"Fire Extinguishers: Types, PASS and When Not to Fight a Fire","ar":"Fire Extinguishers: Types, PASS and When Not to Fight a Fire"},"minutes":15,"blocks":[{"t":"p","c":{"en":"A fire extinguisher is a metal cylinder that sprays a substance onto a fire. It can put out a very small fire if it is used quickly and correctly. It can also give people false confidence. In a real emergency, your first job is always to \u003cstrong>get people out\u003c/strong>, not to fight the fire.","ar":"A fire extinguisher is a metal cylinder that sprays a substance onto a fire. It can put out a very small fire if it is used quickly and correctly. It can also give people false confidence. In a real emergency, your first job is always to \u003cstrong>get people out\u003c/strong>, not to fight the fire."}},{"t":"callout","k":"warn","title":{"en":"Only use an extinguisher if all of these are true","ar":"Only use an extinguisher if all of these are true"},"c":{"en":"You have been trained. The fire is small (for example, a waste bin). The alarm has been raised and 997 has been called. You have a clear exit behind you. You feel safe. If any of these is not true, leave.","ar":"You have been trained. The fire is small (for example, a waste bin). The alarm has been raised and 997 has been called. You have a clear exit behind you. You feel safe. If any of these is not true, leave."}},{"t":"h","c":{"en":"Types of extinguisher (in general)","ar":"Types of extinguisher (in general)"}},{"t":"p","c":{"en":"Different extinguishers are made for different fires. Using the wrong type can make a fire worse. Most extinguishers have a label that tells you what they are for. Never guess. Check the label, and ask your line manager which types are in your work area.","ar":"Different extinguishers are made for different fires. Using the wrong type can make a fire worse. Most extinguishers have a label that tells you what they are for. Never guess. Check the label, and ask your line manager which types are in your work area."}},{"t":"table","head":{"en":["Type (in general)","Used for","Do not use on"],"ar":["Type (in general)","Used for","Do not use on"]},"rows":[{"en":["Water","Paper, wood, cloth and similar solid material","Electrical equipment, hot oil or cooking fat"],"ar":["Water","Paper, wood, cloth and similar solid material","Electrical equipment, hot oil or cooking fat"]},{"en":["Foam","Solid materials and some liquid fires","Live electrical equipment unless the label says it is safe"],"ar":["Foam","Solid materials and some liquid fires","Live electrical equipment unless the label says it is safe"]},{"en":["Dry powder","Many kinds of fire, including some liquids and gases","Closed rooms (the powder is hard to breathe and hides your view)"],"ar":["Dry powder","Many kinds of fire, including some liquids and gases","Closed rooms (the powder is hard to breathe and hides your view)"]},{"en":["CO2 (carbon dioxide)","Electrical equipment and small liquid fires","Fires that can restart easily; also very cold, so do not touch the horn"],"ar":["CO2 (carbon dioxide)","Electrical equipment and small liquid fires","Fires that can restart easily; also very cold, so do not touch the horn"]},{"en":["Wet chemical","Cooking oils and fats in kitchens","Most other types of fire"],"ar":["Wet chemical","Cooking oils and fats in kitchens","Most other types of fire"]},{"en":["Fire blanket","Small pan fires and a person whose clothes are on fire","Large fires; do not throw it, fold it around your hands first"],"ar":["Fire blanket","Small pan fires and a person whose clothes are on fire","Large fires; do not throw it, fold it around your hands first"]}]},{"t":"p","c":{"en":"The school will tell you which types are in your area and whether you are trained to use them. If you are not trained, do not try.","ar":"The school will tell you which types are in your area and whether you are trained to use them. If you are not trained, do not try."}},{"t":"h","c":{"en":"How to use one: PASS","ar":"How to use one: PASS"}},{"t":"steps","c":{"en":["\u003cstrong>P is for Pull.\u003c/strong> Pull out the safety pin. It is usually a ring at the top.","\u003cstrong>A is for Aim.\u003c/strong> Aim the nozzle or hose at the base of the fire, not at the flames.","\u003cstrong>S is for Squeeze.\u003c/strong> Squeeze the handle to release the substance.","\u003cstrong>S is for Sweep.\u003c/strong> Sweep from side to side at the base of the fire until it is out. Stand about two metres away and keep your back to the exit."],"ar":["\u003cstrong>P is for Pull.\u003c/strong> Pull out the safety pin. It is usually a ring at the top.","\u003cstrong>A is for Aim.\u003c/strong> Aim the nozzle or hose at the base of the fire, not at the flames.","\u003cstrong>S is for Squeeze.\u003c/strong> Squeeze the handle to release the substance.","\u003cstrong>S is for Sweep.\u003c/strong> Sweep from side to side at the base of the fire until it is out. Stand about two metres away and keep your back to the exit."]}},{"t":"h","c":{"en":"When NOT to fight a fire","ar":"When NOT to fight a fire"}},{"t":"list","c":{"en":["The fire is bigger than a small waste bin or it is spreading.","There is a lot of smoke, and you cannot see or breathe well.","You are not trained, or you are not sure the extinguisher is the right type.","The fire is between you and the exit, or the exit would be behind the fire.","It involves gas cylinders, chemicals you do not know, or a large amount of oil.","Your instincts say, \"I should leave.\" Listen to them."],"ar":["The fire is bigger than a small waste bin or it is spreading.","There is a lot of smoke, and you cannot see or breathe well.","You are not trained, or you are not sure the extinguisher is the right type.","The fire is between you and the exit, or the exit would be behind the fire.","It involves gas cylinders, chemicals you do not know, or a large amount of oil.","Your instincts say, \"I should leave.\" Listen to them."]}},{"t":"scenario","title":{"en":"Scenario: the bin fire in the lab prep room","ar":"Scenario: the bin fire in the lab prep room"},"c":{"en":"A lab assistant sees a small fire in a metal bin in the prep room. The room has two doors. She has been trained to use a fire extinguisher and a CO2 extinguisher is on the wall. She calls out to a colleague, who raises the alarm and calls 997. \u003cstrong>Can she try to put it out?\u003c/strong> Yes, but only because all the conditions are met: she is trained, the fire is very small, others have been warned, and she stands with the door behind her. If the fire grows or smoke fills the room, she must drop the extinguisher and leave at once.","ar":"A lab assistant sees a small fire in a metal bin in the prep room. The room has two doors. She has been trained to use a fire extinguisher and a CO2 extinguisher is on the wall. She calls out to a colleague, who raises the alarm and calls 997. \u003cstrong>Can she try to put it out?\u003c/strong> Yes, but only because all the conditions are met: she is trained, the fire is very small, others have been warned, and she stands with the door behind her. If the fire grows or smoke fills the room, she must drop the extinguisher and leave at once."}},{"t":"callout","k":"tip","title":{"en":"Close the door on a fire you cannot fight","ar":"Close the door on a fire you cannot fight"},"c":{"en":"If you have to leave a room because of a fire, close the door behind you. This helps to keep the smoke in that room and slows the fire down.","ar":"If you have to leave a room because of a fire, close the door behind you. This helps to keep the smoke in that room and slows the fire down."}}],"checks":[{"id":"m4q1","q":{"en":"What does the \"A\" in PASS stand for?","ar":"What does the \"A\" in PASS stand for?"},"opts":[{"en":"Alert the Principal that the fire has started","ar":"Alert the Principal that the fire has started"},{"en":"Aim the nozzle at the base of the fire","ar":"Aim the nozzle at the base of the fire"},{"en":"Activate the sprinkler system in the corridor","ar":"Activate the sprinkler system in the corridor"},{"en":"Avoid the smoke by crouching on the floor","ar":"Avoid the smoke by crouching on the floor"}],"correct":1,"expl":{"en":"PASS stands for Pull, Aim, Squeeze, Sweep. You aim at the base of the fire, where the fuel is, not at the flames.","ar":"PASS stands for Pull, Aim, Squeeze, Sweep. You aim at the base of the fire, where the fuel is, not at the flames."}},{"id":"m4q2","q":{"en":"A fire has started in a large pile of boxes in the store and is spreading up the wall. You are trained to use an extinguisher. What should you do?","ar":"A fire has started in a large pile of boxes in the store and is spreading up the wall. You are trained to use an extinguisher. What should you do?"},"opts":[{"en":"Use the extinguisher from the doorway until it is empty","ar":"Use the extinguisher from the doorway until it is empty"},{"en":"Pull the boxes apart so the fire cannot spread further","ar":"Pull the boxes apart so the fire cannot spread further"},{"en":"Raise the alarm, call 997 and leave without fighting it","ar":"Raise the alarm, call 997 and leave without fighting it"},{"en":"Fetch a second extinguisher and ask a colleague to help","ar":"Fetch a second extinguisher and ask a colleague to help"}],"correct":2,"expl":{"en":"A fire that is large or spreading is no longer small. Do not fight it. Raise the alarm, call 997 and get out. Close the door if it is safe.","ar":"A fire that is large or spreading is no longer small. Do not fight it. Raise the alarm, call 997 and get out. Close the door if it is safe."}},{"id":"m4q3","q":{"en":"Which of these is a good reason to use an extinguisher on a small fire?","ar":"Which of these is a good reason to use an extinguisher on a small fire?"},"opts":[{"en":"You are the only adult who has seen the fire in the whole area","ar":"You are the only adult who has seen the fire in the whole area"},{"en":"You want to protect the equipment in the room from any damage","ar":"You want to protect the equipment in the room from any damage"},{"en":"You have used one before at a previous workplace some years ago","ar":"You have used one before at a previous workplace some years ago"},{"en":"You are trained, the alarm is raised and you have a clear exit","ar":"You are trained, the alarm is raised and you have a clear exit"}],"correct":3,"expl":{"en":"Fighting a fire is only for trained people with a clear exit and the alarm already raised. Saving equipment is never a good reason to take a risk.","ar":"Fighting a fire is only for trained people with a clear exit and the alarm already raised. Saving equipment is never a good reason to take a risk."}}]},{"id":"m5","title":{"en":"Roles, After the Drill and Take-aways","ar":"Roles, After the Drill and Take-aways"},"minutes":15,"blocks":[{"t":"h","c":{"en":"Fire wardens","ar":"Fire wardens"}},{"t":"p","c":{"en":"Fire wardens (sometimes called fire marshals) are staff who have extra training and extra duties in an evacuation. They check that areas are clear, help people who need support, take reports at the assembly point and speak to the fire service. Know who your Fire Wardens are. Follow their instructions at once. If you are asked to be one, you will be given training.","ar":"Fire wardens (sometimes called fire marshals) are staff who have extra training and extra duties in an evacuation. They check that areas are clear, help people who need support, take reports at the assembly point and speak to the fire service. Know who your Fire Wardens are. Follow their instructions at once. If you are asked to be one, you will be given training."}},{"t":"h","c":{"en":"Roles for support staff","ar":"Roles for support staff"}},{"t":"table","head":{"en":["Area","What you can do"],"ar":["Area","What you can do"]},"rows":[{"en":["Canteen and kitchen","Switch off cooking equipment and gas if it takes seconds. Take your group out by the nearest exit. Check the serving area and store."],"ar":["Canteen and kitchen","Switch off cooking equipment and gas if it takes seconds. Take your group out by the nearest exit. Check the serving area and store."]},{"en":["Bus bay and transport","Keep the route for fire engines clear. Do not let buses or cars block the gate. Help children to move to the assembly point if they are outside."],"ar":["Bus bay and transport","Keep the route for fire engines clear. Do not let buses or cars block the gate. Help children to move to the assembly point if they are outside."]},{"en":["Office and reception","Take the visitor list. Walk visitors out. Tell the Fire Warden who is on site. Do not lock the school gate until told."],"ar":["Office and reception","Take the visitor list. Walk visitors out. Tell the Fire Warden who is on site. Do not lock the school gate until told."]},{"en":["Cleaning and facilities","Check toilets and side rooms if safe. Do not leave equipment in corridors. Keep exits clear. Report any damage to doors or alarms."],"ar":["Cleaning and facilities","Check toilets and side rooms if safe. Do not leave equipment in corridors. Keep exits clear. Report any damage to doors or alarms."]},{"en":["Lab and library assistants","Turn off equipment and burners if it takes a second. Lead pupils out in a line. Check store rooms and prep rooms as you leave."],"ar":["Lab and library assistants","Turn off equipment and burners if it takes a second. Lead pupils out in a line. Check store rooms and prep rooms as you leave."]}]},{"t":"scenario","title":{"en":"Scenario: the bus bay","ar":"Scenario: the bus bay"},"c":{"en":"The alarm sounds while two buses are waiting to leave for the afternoon run. The drivers are sitting in the cabs, and there are children walking across the bay towards the assembly point. A fire engine would need to use this road. \u003cstrong>What should the transport staff do?\u003c/strong> Switch off engines, move away from the vehicles, keep the road clear and help the children to reach the assembly point safely. A driver should never drive a bus away through a crowd of children and should not block the gate. The drivers then report to the Fire Warden.","ar":"The alarm sounds while two buses are waiting to leave for the afternoon run. The drivers are sitting in the cabs, and there are children walking across the bay towards the assembly point. A fire engine would need to use this road. \u003cstrong>What should the transport staff do?\u003c/strong> Switch off engines, move away from the vehicles, keep the road clear and help the children to reach the assembly point safely. A driver should never drive a bus away through a crowd of children and should not block the gate. The drivers then report to the Fire Warden."}},{"t":"h","c":{"en":"After the drill: re-entry","ar":"After the drill: re-entry"}},{"t":"list","c":{"en":["Stay at the assembly point until the Fire Warden or Principal says you can go back in.","Do not re-enter because the alarm has stopped. A silent alarm does not always mean the building is safe.","When told to go in, go back calmly in your groups. Staff take care of their areas first."],"ar":["Stay at the assembly point until the Fire Warden or Principal says you can go back in.","Do not re-enter because the alarm has stopped. A silent alarm does not always mean the building is safe.","When told to go in, go back calmly in your groups. Staff take care of their areas first."]}},{"t":"h","c":{"en":"After the drill: debrief","ar":"After the drill: debrief"}},{"t":"p","c":{"en":"After a drill, the school reviews what happened. You may be asked what went well and what did not. Be honest. Do not hide a problem to make the drill look good. The drill is there to find weak points. A problem found today in a drill is a problem that cannot hurt anyone in a real fire. Never coach children to say something other than what they experienced.","ar":"After a drill, the school reviews what happened. You may be asked what went well and what did not. Be honest. Do not hide a problem to make the drill look good. The drill is there to find weak points. A problem found today in a drill is a problem that cannot hurt anyone in a real fire. Never coach children to say something other than what they experienced."}},{"t":"h","c":{"en":"Report faults and blocked exits","ar":"Report faults and blocked exits"}},{"t":"list","c":{"en":["Blocked or locked exit: tell your line manager or the facilities team straight away. Do not wait for the next drill.","Alarm or detector that is broken, covered or has a flat battery: report it the same day.","Extinguisher that is missing, used or has a broken seal: report it so that it can be replaced.","Emergency light not working, or a sign that has fallen down: report it.","If you see something unsafe and you cannot fix it, put a sign up and tell the Fire Warden."],"ar":["Blocked or locked exit: tell your line manager or the facilities team straight away. Do not wait for the next drill.","Alarm or detector that is broken, covered or has a flat battery: report it the same day.","Extinguisher that is missing, used or has a broken seal: report it so that it can be replaced.","Emergency light not working, or a sign that has fallen down: report it.","If you see something unsafe and you cannot fix it, put a sign up and tell the Fire Warden."]}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Treat every alarm as real. Stop, leave by the nearest safe exit and do not stop for belongings. \u003cstrong>2.\u003c/strong> If you find a fire: warn people, call 997, close the door if safe, go to the assembly point. \u003cstrong>3.\u003c/strong> Help pupils, visitors and anyone who needs help, never use lifts, and do not go back in until the Fire Warden or Principal says it is safe. \u003cstrong>4.\u003c/strong> Fight a fire only if you are trained, it is very small and you have an exit behind you (PASS: Pull, Aim, Squeeze, Sweep). \u003cstrong>5.\u003c/strong> Keep exits clear, close fire doors and report any fault the same day.","ar":"\u003cstrong>1.\u003c/strong> Treat every alarm as real. Stop, leave by the nearest safe exit and do not stop for belongings. \u003cstrong>2.\u003c/strong> If you find a fire: warn people, call 997, close the door if safe, go to the assembly point. \u003cstrong>3.\u003c/strong> Help pupils, visitors and anyone who needs help, never use lifts, and do not go back in until the Fire Warden or Principal says it is safe. \u003cstrong>4.\u003c/strong> Fight a fire only if you are trained, it is very small and you have an exit behind you (PASS: Pull, Aim, Squeeze, Sweep). \u003cstrong>5.\u003c/strong> Keep exits clear, close fire doors and report any fault the same day."}}],"checks":[{"id":"m5q1","q":{"en":"The alarm has stopped ringing, but the Fire Warden has not yet said anything at the assembly point. What should you do?","ar":"The alarm has stopped ringing, but the Fire Warden has not yet said anything at the assembly point. What should you do?"},"opts":[{"en":"Stay at the assembly point until you are told it is safe","ar":"Stay at the assembly point until you are told it is safe"},{"en":"Return to your area to continue work as the alarm is silent","ar":"Return to your area to continue work as the alarm is silent"},{"en":"Go back into the building to switch off the equipment","ar":"Go back into the building to switch off the equipment"},{"en":"Take the children to the classrooms to avoid a long wait","ar":"Take the children to the classrooms to avoid a long wait"}],"correct":0,"expl":{"en":"A silent alarm does not mean the building is safe. Wait for the Fire Warden or Principal to give the all-clear before anyone goes back in.","ar":"A silent alarm does not mean the building is safe. Wait for the Fire Warden or Principal to give the all-clear before anyone goes back in."}},{"id":"m5q2","q":{"en":"During your cleaning round you find a fire exit door that is blocked by a stack of chairs. What should you do?","ar":"During your cleaning round you find a fire exit door that is blocked by a stack of chairs. What should you do?"},"opts":[{"en":"Leave it because it is not your job to move other people's furniture","ar":"Leave it because it is not your job to move other people's furniture"},{"en":"Move the chairs if it is safe and report it to your line manager","ar":"Move the chairs if it is safe and report it to your line manager"},{"en":"Wait for the next fire drill to see whether the door is really needed","ar":"Wait for the next fire drill to see whether the door is really needed"},{"en":"Lock the door to stop children from playing in that area","ar":"Lock the door to stop children from playing in that area"}],"correct":1,"expl":{"en":"A blocked exit is a serious risk. Clear it if it is safe to do so and report it on the same day so it does not happen again.","ar":"A blocked exit is a serious risk. Clear it if it is safe to do so and report it on the same day so it does not happen again."}},{"id":"m5q3","q":{"en":"At the debrief after a drill, you noticed that a corridor became very crowded. What is the best thing to do?","ar":"At the debrief after a drill, you noticed that a corridor became very crowded. What is the best thing to do?"},"opts":[{"en":"Say that everything went well to avoid causing extra work","ar":"Say that everything went well to avoid causing extra work"},{"en":"Tell the pupils to say that the drill was perfect","ar":"Tell the pupils to say that the drill was perfect"},{"en":"Say clearly what you saw so the school can improve the plan","ar":"Say clearly what you saw so the school can improve the plan"},{"en":"Wait for someone else in the school to raise the problem","ar":"Wait for someone else in the school to raise the problem"}],"correct":2,"expl":{"en":"A drill exists to find problems. Being honest about what you saw helps the school fix them before a real fire.","ar":"A drill exists to find problems. Being honest about what you saw helps the school fix them before a real fire."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"You are in the canteen and see flames from a pan of hot oil. A colleague wants to pour water on it. What should you do?","ar":"You are in the canteen and see flames from a pan of hot oil. A colleague wants to pour water on it. What should you do?"},"opts":[{"en":"Help them by carrying the water to the cooker quickly","ar":"Help them by carrying the water to the cooker quickly"},{"en":"Cover it with a wet towel and then go on with your work","ar":"Cover it with a wet towel and then go on with your work"},{"en":"Carry the pan outside quickly so that the room is clear","ar":"Carry the pan outside quickly so that the room is clear"},{"en":"Stop them, raise the alarm and call 997 straight away","ar":"Stop them, raise the alarm and call 997 straight away"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A new heater in the admin office is left on overnight, next to a pile of paper. Which fire risk does this show?","ar":"A new heater in the admin office is left on overnight, next to a pile of paper. Which fire risk does this show?"},"opts":[{"en":"Heat close to fuel, which can start a fire","ar":"Heat close to fuel, which can start a fire"},{"en":"Poor air flow caused by a dirty window in the office","ar":"Poor air flow caused by a dirty window in the office"},{"en":"A lack of oxygen caused by the closed door","ar":"A lack of oxygen caused by the closed door"},{"en":"Loud noise from the heater at night in the room","ar":"Loud noise from the heater at night in the room"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"Why do we hold fire drills at school?","ar":"Why do we hold fire drills at school?"},"opts":[{"en":"To check how fast the smallest children can run outside","ar":"To check how fast the smallest children can run outside"},{"en":"To practise so people act calmly and we find problems early","ar":"To practise so people act calmly and we find problems early"},{"en":"To satisfy a rule that visitors expect to see on the wall","ar":"To satisfy a rule that visitors expect to see on the wall"},{"en":"To give the staff a short break from lessons and tasks","ar":"To give the staff a short break from lessons and tasks"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"You smell burning from the lab and hear a loud crack. The door is cool. What is the best next step?","ar":"You smell burning from the lab and hear a loud crack. The door is cool. What is the best next step?"},"opts":[{"en":"Open the door wide to check how big the fire is","ar":"Open the door wide to check how big the fire is"},{"en":"Find the lab teacher to ask what the smell might be","ar":"Find the lab teacher to ask what the smell might be"},{"en":"Raise the alarm, call 997 and tell nearby people to leave","ar":"Raise the alarm, call 997 and tell nearby people to leave"},{"en":"Wait for five minutes in case the smell fades away","ar":"Wait for five minutes in case the smell fades away"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"The alarm sounds in the school during lunch and you are the one at the serving counter. What do you do?","ar":"The alarm sounds in the school during lunch and you are the one at the serving counter. What do you do?"},"opts":[{"en":"Finish serving the children who are in the queue before you leave","ar":"Finish serving the children who are in the queue before you leave"},{"en":"Lock the kitchen door and the cash box first and then walk out","ar":"Lock the kitchen door and the cash box first and then walk out"},{"en":"Wait for a manager to tell you whether or not it is a drill","ar":"Wait for a manager to tell you whether or not it is a drill"},{"en":"Switch off equipment if it takes seconds, then leave by the nearest exit","ar":"Switch off equipment if it takes seconds, then leave by the nearest exit"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"When you call 997, which detail is most important to give?","ar":"When you call 997, which detail is most important to give?"},"opts":[{"en":"Where the fire is, and the school's name and address","ar":"Where the fire is, and the school's name and address"},{"en":"Which pupils and staff are in the building today","ar":"Which pupils and staff are in the building today"},{"en":"How long the school has been open in Sharjah","ar":"How long the school has been open const checkKey = (m, q) => m.id + ':' + q.id;

const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

function renderBlock(b){

    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return '';
}
