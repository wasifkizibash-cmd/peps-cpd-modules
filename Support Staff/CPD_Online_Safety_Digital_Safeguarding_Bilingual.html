#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

const CPD = {"meta":{"id":"online-safety-digital-safeguarding","code":"OSD","passMark":80,"hours":"2 hours","accent":"#0B7A8F","accentSoft":"#E0F2F5","eyebrow":{"en":"Staff CPD · Safeguarding · Level 2 content · Performance Standard 5","ar":"تطوير مهني للموظفين · الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> · محتوى المستوى الثاني · المعيار الخامس"},"title":{"en":"Online Safety and Digital Safeguarding","ar":"السلامة الرقمية والصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في العالم الرقمي"},"subtitle":{"en":"A self-paced module on keeping students safe online: the main risks, cyberbullying and image-sharing, contact from unknown adults, device use in class, your own professional online conduct, and how to respond when a concern arises.","ar":"وحدة ذاتية الوتيرة عن حماية الطلبة عبر الإنترنت: المخاطر الرئيسة، والتنمّر الإلكتروني ومشاركة الصور، وتواصل البالغين المجهولين، واستخدام الأجهزة في الصف، وسلوكك المهني عبر الإنترنت، وكيفية الاستجابة عند ظهور قلق."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"نحو ساعتين، بوتيرة ذاتية بالكامل"},"standard":{"en":"UAE School Inspection Framework · Performance Standard 5 (Protection, Care, Guidance & Support)","ar":"إطار الإشراف على المدارس في الإمارات · المعيار الخامس (الحماية والرعاية والتوجيه والدعم)"},"source":{"en":"PEPS Child Protection & Safeguarding Policy (Section 9), BYOD Policy, Social Media Policy, Staff Code of Conduct (Sections 6 and 11), Data Protection & Privacy Policy","ar":"سياسة حماية الطفل وصونه (القسم 9)، وسياسة الأجهزة الشخصية، وسياسة وسائل التواصل الاجتماعي، وميثاق سلوك الموظفين (القسمان 6 و11)، وسياسة حماية البيانات والخصوصية"}},"modules":[{"id":"m1","title":{"en":"Online Safety Is Safeguarding","ar":"السلامة الرقمية جزء من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"The PEPS position","ar":"موقف المدرسة"},"c":{"en":"Online safety is treated as \u003cstrong>a core part of safeguarding, not a separate subject\u003c/strong>. Concerns about a student's online activity, exposure to harmful content, cyberbullying, or contact from an unknown adult are raised with the DSL \u003cstrong>in exactly the same way as any other safeguarding concern\u003c/strong>, using the procedure in Section 6 of the Child Protection & Safeguarding Policy.","ar":"تُعامَل السلامة الرقمية بوصفها \u003cstrong>جزءًا أساسيًا من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وليست موضوعًا منفصلًا\u003c/strong>. وتُرفع المخاوف المتعلقة بنشاط الطالب عبر الإنترنت أو تعرضه لمحتوى ضار أو التنمّر الإلكتروني أو تواصل شخص بالغ مجهول معه إلى مسؤول الحماية \u003cstrong>بالطريقة نفسها تمامًا كأي قلق آخر يتعلق بالصون الشامل\u003c/strong>، باتباع الإجراء الوارد في القسم 6 من سياسة حماية الطفل وصونه."}},{"t":"h","c":{"en":"Where the detail lives","ar":"أين تُوجد التفاصيل"}},{"t":"list","c":{"en":["The \u003cstrong>Child Protection & Safeguarding Policy\u003c/strong> sets the rule: raise it with the DSL, the same day.","The \u003cstrong>Digital Citizenship Policy\u003c/strong> sets out the school's approach to safe use of technology, filtering and monitoring, and the online safety curriculum.","The \u003cstrong>BYOD Policy\u003c/strong> and \u003cstrong>Social Media Policy\u003c/strong> set the rules for students' devices and for social media use.","The \u003cstrong>Staff Code of Conduct\u003c/strong> sets the rules for your own technology and social media use."],"ar":["تضع \u003cstrong>سياسة حماية الطفل وصونه\u003c/strong> القاعدة: ارفعه إلى مسؤول الحماية في اليوم نفسه.","وتوضح \u003cstrong>سياسة المواطنة الرقمية\u003c/strong> نهج المدرسة في الاستخدام الآمن للتقنية والتصفية والمراقبة ومنهج السلامة الرقمية.","وتضع \u003cstrong>سياسة الأجهزة الشخصية\u003c/strong> و\u003cstrong>سياسة وسائل التواصل الاجتماعي\u003c/strong> القواعد الخاصة بأجهزة الطلبة واستخدام وسائل التواصل.","ويضع \u003cstrong>ميثاق سلوك الموظفين\u003c/strong> القواعد الخاصة باستخدامك للتقنية ووسائل التواصل."]}},{"t":"callout","k":"key","title":{"en":"The law","ar":"القانون"},"c":{"en":"The policies refer to Federal Decree-Law No. 34 of 2021 on Combating Rumours and Cybercrimes, which is relevant to online safety, cyberbullying and the misuse of technology to harm a child. Some online conduct can be a criminal offence, and the school may involve the relevant authorities. You do not need to know the legal detail. You need to know to report.","ar":"تشير السياسات إلى المرسوم بقانون اتحادي رقم 34 لسنة 2021 في شأن مكافحة الشائعات والجرائم الإلكترونية، وهو ذو صلة بالسلامة الرقمية والتنمّر الإلكتروني وإساءة استخدام التقنية لإيذاء طفل. وقد يشكّل بعض السلوك الرقمي جريمة، وقد تُشرك المدرسة الجهات المختصة. ولا يلزمك معرفة التفاصيل القانونية. يلزمك أن تعرف أن عليك الإبلاغ."}},{"t":"p","c":{"en":"The online world is not separate from school life. Most incidents between students, and many safeguarding concerns, have an online element. Students experience the same harm when it arrives on a screen, and often at any hour of the day.","ar":"العالم الرقمي ليس منفصلًا عن الحياة المدرسية. فمعظم الحوادث بين الطلبة وكثير من مخاوف الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> لها بُعد رقمي. ويعاني الطلبة الأذى نفسه عندما يصلهم عبر الشاشة، وغالبًا في أي ساعة من اليوم."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: support over blame","ar":"ممارسة مهنية جيدة: الدعم قبل اللوم"},"c":{"en":"The Social Media Policy states that students who make a mistake or experience harm online are \u003cstrong>supported, not shamed\u003c/strong>, when they come forward, and that no student will be penalised for reporting a genuine concern in good faith. A student who is met with a lecture is less likely to tell an adult again.","ar":"تنص سياسة وسائل التواصل الاجتماعي على أن الطلبة الذين يرتكبون خطأً أو يتعرضون لأذى عبر الإنترنت \u003cstrong>يُدعَمون ولا يُخجَلون\u003c/strong> عندما يتقدمون، وأن أي طالب لن يُعاقَب لإبلاغه عن قلق حقيقي بحسن نية. فالطالب الذي يُقابَل بمحاضرة أقل ميلًا إلى إخبار بالغ مرة أخرى."}}],"checks":[{"id":"m1q1","q":{"en":"According to the PEPS policy, how is online safety treated?","ar":"بحسب سياسة المدرسة، كيف تُعامَل السلامة الرقمية؟"},"opts":[{"en":"As a core part of safeguarding, with concerns raised with the DSL in the same way as any other","ar":"بوصفها جزءًا أساسيًا من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>، وتُرفع المخاوف إلى مسؤول الحماية بالطريقة نفسها كأي مخاوف أخرى"},{"en":"As a separate IT subject handled only by the IT team","ar":"بوصفها موضوعًا تقنيًا منفصلًا يتولاه فريق التقنية وحده"},{"en":"As a behaviour matter only","ar":"بوصفها مسألة سلوك فقط"},{"en":"As a home matter for parents, not for the school","ar":"بوصفها شأنًا منزليًا يخص أولياء الأمور لا المدرسة"}],"correct":0,"expl":{"en":"Section 9 states that online safety is a core part of safeguarding, not a separate subject, and that the procedure in Section 6 applies.","ar":"ينص القسم 9 على أن السلامة الرقمية جزء أساسي من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وليست موضوعًا منفصلًا، وأن الإجراء الوارد في القسم 6 ينطبق."}},{"id":"m1q2","q":{"en":"A student tells you she was upset by a message from an unknown adult in an online game. Who should you tell?","ar":"تخبرك طالبة بأنها انزعجت من رسالة من بالغ مجهول في لعبة إلكترونية. من ينبغي أن تُبلغ؟"},"opts":[{"en":"Only the IT Coordinator, because it is a technical matter","ar":"منسّق التقنية وحده، لأنها مسألة تقنية"},{"en":"The DSL or a deputy, the same day, using the Recording a Concern form","ar":"مسؤول الحماية أو أحد نوابه، في اليوم نفسه، باستخدام نموذج تسجيل القلق"},{"en":"Nobody, since it happened outside school hours","ar":"لا أحد، لأن ذلك حدث خارج ساعات الدوام"},{"en":"The student's friends, to find out whether they have seen the same","ar":"أصدقاء الطالبة لمعرفة هل رأوا الأمر نفسه"}],"correct":1,"expl":{"en":"Contact from an unknown adult is specifically named in Section 9. It is a safeguarding concern whether or not it happened during school hours.","ar":"ذُكر تواصل البالغ المجهول تحديدًا في القسم 9. وهو قلق يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> سواء حدث خلال ساعات الدوام أم لم يحدث."}}]},{"id":"m2","title":{"en":"The Main Online Risks and Warning Signs","ar":"أبرز المخاطر الرقمية وعلامات التحذير"},"minutes":20,"blocks":[{"t":"p","c":{"en":"\u003cem>Professional good practice.\u003c/em> A useful way to think about online risk is in four groups. These are not categories you must name in a record. They help you notice what could be happening.","ar":"\u003cem>ممارسة مهنية جيدة.\u003c/em> من الطرق المفيدة للتفكير في المخاطر الرقمية تقسيمها إلى أربع مجموعات. وهذه ليست فئات يجب أن تسمّيها في السجل، لكنها تساعدك على ملاحظة ما قد يحدث."}},{"t":"table","head":{"en":["Risk","Examples"],"ar":["الخطر","أمثلة"]},"rows":[{"en":["Content: what children see","Violent, sexual or hateful material; extremist content; content promoting self-harm; false information"],"ar":["المحتوى: ما يراه الأطفال","مواد عنيفة أو جنسية أو تحريضية؛ محتوى متطرف؛ محتوى يروّج لإيذاء النفس؛ معلومات مضللة"]},{"en":["Contact: who reaches children","Unknown adults or older children, grooming, pressure to move to private chats, requests for images"],"ar":["التواصل: من يصل إلى الأطفال","بالغون أو أطفال أكبر سنًّا مجهولون، واستدراج، وضغط للانتقال إلى محادثات خاصة، وطلب صور"]},{"en":["Conduct: how children behave","Cyberbullying, sharing or demanding private images, hurtful group chats, oversharing personal information"],"ar":["السلوك: كيف يتصرف الأطفال","تنمّر إلكتروني، ومشاركة صور خاصة أو طلبها، ومجموعات محادثة مؤذية، والإفراط في مشاركة المعلومات الشخصية"]},{"en":["Commerce and wellbeing","In-game purchases, scams, gambling-style features; too much time online, poor sleep, anxiety"],"ar":["الشراء والرفاه","مشتريات داخل الألعاب، واحتيال، وميزات تشبه القمار؛ والإفراط في الوقت عبر الإنترنت وضعف النوم والقلق"]}]},{"t":"h","c":{"en":"Warning signs a student may be in difficulty online","ar":"علامات تحذير على أن الطالب قد يواجه صعوبة عبر الإنترنت"}},{"t":"list","c":{"en":["Becomes upset, secretive or anxious after using a device, or hides the screen when an adult approaches","Mentions an online “friend” the adults do not know, or seems to be in contact with an older person","Has new gifts, money, game credit or devices they cannot explain","Is very tired, because of late-night use","Shows sudden changes in friendships, mood or school work","Talks about hurting themselves, or visits content that promotes it","Is the subject of rumours, screenshots or images spreading among students"],"ar":["ينزعج أو يتكتم أو يقلق بعد استخدام جهاز، أو يخفي الشاشة عندما يقترب بالغ","يذكر «صديقًا» عبر الإنترنت لا يعرفه البالغون، أو يبدو على اتصال بشخص أكبر سنًّا","لديه هدايا أو أموال أو رصيد ألعاب أو أجهزة جديدة لا يستطيع تفسيرها","متعب جدًا بسبب الاستخدام في وقت متأخر من الليل","تغيّرات مفاجئة في الصداقات أو المزاج أو العمل المدرسي","يتحدث عن إيذاء نفسه، أو يزور محتوى يروّج لذلك","يكون موضوع شائعات أو لقطات شاشة أو صور تنتشر بين الطلبة"]}},{"t":"callout","k":"warn","title":{"en":"Age limits and the real world","ar":"حدود العمر والواقع الفعلي"},"c":{"en":"The Social Media Policy notes that most platforms set a minimum age of 13 (Instagram, TikTok, Snapchat, X, Facebook and YouTube accounts all state 13), and PEPS supports parents in enforcing these ages. Many Primary students nonetheless have access to apps through siblings or shared accounts. If you learn that a student is using an under-age account, treat it as information for the DSL, and do not scold the child.","ar":"تشير سياسة وسائل التواصل الاجتماعي إلى أن معظم المنصات تضع حدًّا أدنى للعمر هو 13 عامًا (إنستغرام وتيك توك وسناب شات وإكس وفيسبوك وحسابات يوتيوب جميعها تذكر 13)، وتدعم المدرسة أولياء الأمور في تطبيق هذه الأعمار. ومع ذلك يصل كثير من طلبة المرحلة الابتدائية إلى التطبيقات عبر إخوتهم أو حسابات مشتركة. وإذا علمت أن طالبًا يستخدم حسابًا دون السن المسموح فاعتبر ذلك معلومة لمسؤول الحماية، ولا توبّخ الطفل."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: ask open questions","ar":"ممارسة مهنية جيدة: اطرح أسئلة مفتوحة"},"c":{"en":"In everyday conversation, show interest without judgement: “What are you playing at the moment?” “Who do you chat with online?” A student who feels they will not be punished is far more likely to tell you when something goes wrong.","ar":"في الحديث اليومي أظهر اهتمامًا بلا أحكام: «ماذا تلعب هذه الأيام؟» «مع من تتحدث عبر الإنترنت؟» فالطالب الذي يشعر بأنه لن يُعاقَب أكثر ميلًا إلى إخبارك عندما يسوء شيء."}}],"checks":[{"id":"m2q1","q":{"en":"A Year 6 student has a new phone and in-game credit he cannot explain, and hides his screen whenever a teacher walks past. What is the best response?","ar":"لدى طالب في الصف السادس هاتف جديد ورصيد ألعاب لا يستطيع تفسيره، ويخفي شاشته كلما مرّ معلم. ما أفضل استجابة؟"},"opts":[{"en":"Take the phone and read his messages to find out what is going on","ar":"خذ الهاتف واقرأ رسائله لتعرف ما يحدث"},{"en":"Do nothing unless he tells you directly that something is wrong","ar":"لا تفعل شيئًا ما لم يخبرك مباشرة بوجود خطأ"},{"en":"Record what you have seen with dates and report it to the DSL the same day","ar":"سجّل ما رأيته مع التواريخ وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Tell him off for having a phone in school","ar":"وبّخه لوجود هاتف معه في المدرسة"}],"correct":2,"expl":{"en":"Unexplained gifts, secrecy and a new device are possible signs of grooming or exploitation. Record and report. Do not search the phone or investigate.","ar":"الهدايا غير المفسَّرة والكتمان والجهاز الجديد علامات محتملة على الاستدراج أو الاستغلال. سجّل وأبلغ. ولا تفتش الهاتف ولا تحقّق."}},{"id":"m2q2","q":{"en":"What does the Social Media Policy say about how to treat a student who has made a mistake online, or been harmed online?","ar":"ماذا تقول سياسة وسائل التواصل الاجتماعي عن كيفية التعامل مع طالب ارتكب خطأً أو تعرض لأذى عبر الإنترنت؟"},"opts":[{"en":"They should be sanctioned in every case to deter others","ar":"ينبغي معاقبته في كل الحالات لردع الآخرين"},{"en":"They should be asked to delete all their accounts","ar":"ينبغي أن يُطلب منه حذف جميع حساباته"},{"en":"They should be told that it is a family matter","ar":"ينبغي إخباره بأنها مسألة عائلية"},{"en":"They are supported, not shamed, and nobody is penalised for reporting a genuine concern in good faith","ar":"يُدعَم ولا يُخجَل، ولا يُعاقَب أحد لإبلاغه عن قلق حقيقي بحسن نية"}],"correct":3,"expl":{"en":"“Support over blame” is one of the principles of the Social Media Policy. It encourages students to come forward.","ar":"«الدعم قبل اللوم» أحد مبادئ سياسة وسائل التواصل الاجتماعي. فهو يشجّع الطلبة على التقدم."}}]},{"id":"m3","title":{"en":"Cyberbullying and Sharing Images","ar":"التنمّر الإلكتروني ومشاركة الصور"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"What the Social Media Policy says","ar":"ما تقوله سياسة وسائل التواصل الاجتماعي"},"c":{"en":"Cyberbullying is \u003cstrong>treated as seriously as any other form of bullying\u003c/strong>. Students are taught to never send or forward hurtful, threatening or embarrassing messages or images about another person; that being part of a group chat that targets someone is \u003cstrong>participation in bullying, not a neutral bystander role\u003c/strong>; to save evidence (screenshots); and to report to a trusted adult without retaliating.","ar":"يُعامَل التنمّر الإلكتروني \u003cstrong>بالجدية نفسها كأي شكل آخر من أشكال التنمّر\u003c/strong>. ويُعلَّم الطلبة ألا يرسلوا أو يعيدوا إرسال رسائل أو صور مؤذية أو مهدِّدة أو محرجة عن شخص آخر؛ وأن الانتماء إلى مجموعة محادثة تستهدف شخصًا ما هو \u003cstrong>مشاركة في التنمّر وليس موقف متفرج محايد\u003c/strong>؛ وأن يحتفظوا بالأدلة (لقطات الشاشة)؛ وأن يبلغوا بالغًا موثوقًا دون انتقام."}},{"t":"h","c":{"en":"Sharing images and consent","ar":"مشاركة الصور والموافقة"}},{"t":"list","c":{"en":["Students are taught to \u003cstrong>ask permission\u003c/strong> before posting a photo, video or personal information about another person, and to respect a request to remove content.","Sharing intimate, embarrassing or private images or information about another person without consent is treated as a \u003cstrong>serious breach\u003c/strong>, and may also be a \u003cstrong>safeguarding concern and/or a criminal matter\u003c/strong>.","Under the BYOD Policy, a student's camera must never be used to take illicit or inappropriate images or to embarrass anyone, and images of others may only be made with permission of everyone shown."],"ar":["يُعلَّم الطلبة أن \u003cstrong>يستأذنوا\u003c/strong> قبل نشر صورة أو مقطع أو معلومات شخصية عن شخص آخر، وأن يحترموا طلب إزالة المحتوى.","ويُعدّ نشر صور أو معلومات حميمة أو محرجة أو خاصة عن شخص آخر دون موافقته \u003cstrong>خرقًا جسيمًا\u003c/strong>، وقد يكون أيضًا \u003cstrong>قلقًا يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> و/أو مسألة جنائية\u003c/strong>.","وبموجب سياسة الأجهزة الشخصية، يجب ألا تُستخدم كاميرا الطالب لالتقاط صور غير لائقة أو لإحراج أي شخص، ولا تُلتقط صور الآخرين إلا بإذن جميع من يظهرون فيها."]}},{"t":"h","c":{"en":"If you are told about, or see, cyberbullying or an image","ar":"إذا أُخبرت بتنمّر إلكتروني أو صورة، أو رأيتها"}},{"t":"steps","c":{"en":["\u003cstrong>Reassure the student\u003c/strong> who has been targeted. It is not their fault.","\u003cstrong>Do not forward, copy or delete\u003c/strong> messages or images. If you must see something to understand the concern, view only what is shown to you and no more.","\u003cstrong>Never view, store or send an intimate image of a child.\u003c/strong> Secure the device if you safely can, keep it away from others, and tell the DSL immediately.","\u003cstrong>Record\u003c/strong> who, what, when and on which app or platform, and the student's words.","\u003cstrong>Report to the DSL the same day.\u003c/strong> Do not contact the families yourself. The school's response follows the Anti-Bullying and Behaviour & Discipline Policies, alongside safeguarding."],"ar":["\u003cstrong>طمئن الطالب\u003c/strong> الذي استُهدف. فليس الذنب ذنبه.","\u003cstrong>لا ترسل ولا تنسخ ولا تحذف\u003c/strong> الرسائل أو الصور. وإذا لزم أن ترى شيئًا لفهم القلق فشاهد فقط ما يُعرض عليك دون زيادة.","\u003cstrong>لا تشاهد صورة حميمة لطفل ولا تخزّنها ولا ترسلها أبدًا.\u003c/strong> أمّن الجهاز إن استطعت بأمان وأبعده عن الآخرين وأبلغ مسؤول الحماية فورًا.","\u003cstrong>سجّل\u003c/strong> من وماذا ومتى وعلى أي تطبيق أو منصة، وكلمات الطالب.","\u003cstrong>أبلغ مسؤول الحماية في اليوم نفسه.\u003c/strong> ولا تتصل بالأسر بنفسك. وتتبع استجابة المدرسة سياستي مكافحة التنمّر والسلوك والانضباط إلى جانب الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>."]}},{"t":"callout","k":"warn","title":{"en":"Never promise to “make it disappear”","ar":"لا تَعِد أبدًا بأن «تجعله يختفي»"},"c":{"en":"Do not promise a student that a message or image can be removed or will be forgotten. You cannot guarantee that. Tell them instead that you will pass it to someone whose job is to help, and that they are not in trouble.","ar":"لا تَعِد الطالب بأن الرسالة أو الصورة يمكن إزالتها أو ستُنسى. فلا تستطيع ضمان ذلك. أخبره بدلًا من ذلك أنك ستسلّم الأمر إلى شخص وظيفته المساعدة، وأنه ليس في مشكلة."}}],"checks":[{"id":"m3q1","q":{"en":"A student tells you that a nude image of a classmate is going around in a Year 9 group chat. What should you do?","ar":"يخبرك طالب بأن صورة عارية لزميلة تنتشر في مجموعة محادثة لطلبة الصف التاسع. ماذا عليك أن تفعل؟"},"opts":[{"en":"Do not forward, copy or delete it. Reassure the student, and report to the DSL immediately, securing the device if you safely can","ar":"لا ترسلها ولا تنسخها ولا تحذفها. طمئن الطالب وأبلغ مسؤول الحماية فورًا، وأمّن الجهاز إن استطعت بأمان"},{"en":"Ask the student to forward it to you so that you can check it","ar":"اطلب من الطالب إرسالها إليك لتتحقق منها"},{"en":"Post a warning in the group chat telling everyone to delete it","ar":"انشر تحذيرًا في المجموعة تطلب فيه من الجميع حذفها"},{"en":"Speak to the girl in the image in front of her friends","ar":"تحدث إلى الفتاة في الصورة أمام صديقاتها"}],"correct":0,"expl":{"en":"Viewing, storing or forwarding an intimate image of a child is harmful and may be unlawful. Report at once and let the DSL decide what happens next.","ar":"مشاهدة صورة حميمة لطفل أو تخزينها أو إرسالها ضار وقد يكون مخالفًا للقانون. أبلغ فورًا ودع مسؤول الحماية يقرر ما يحدث بعد ذلك."}},{"id":"m3q2","q":{"en":"A student says, “I didn't write the nasty messages, I just stayed in the chat.” According to the Social Media Policy, what is the position?","ar":"يقول طالب: «لم أكتب الرسائل السيئة، بقيت في المحادثة فقط». بحسب سياسة وسائل التواصل الاجتماعي، ما الموقف؟"},"opts":[{"en":"Staying in the chat is fine if you do not write anything","ar":"البقاء في المحادثة لا بأس به إذا لم تكتب شيئًا"},{"en":"Being part of a group chat that targets someone is a form of participation in bullying, not a neutral bystander role","ar":"الانتماء إلى مجموعة محادثة تستهدف شخصًا ما هو شكل من أشكال المشاركة في التنمّر وليس موقف متفرج محايد"},{"en":"Only the student who wrote the messages can be involved in bullying","ar":"الطالب الذي كتب الرسائل وحده يمكن أن يكون ضالعًا في التنمّر"},{"en":"Group chats are private and the school cannot respond to them","ar":"مجموعات المحادثة خاصة ولا تستطيع المدرسة الاستجابة لها"}],"correct":1,"expl":{"en":"The policy is explicit that group-chat membership is participation, not neutrality. Staff record and report as they would for any bullying concern.","ar":"تنص السياسة صراحةً على أن الانتماء إلى مجموعة محادثة مشاركة وليس حيادًا. ويسجّل الموظفون ويبلّغون كما في أي قلق يتعلق بالتنمّر."}},{"id":"m3q3","q":{"en":"A student who is being cyberbullied asks you, “Can you make the messages go away?” What is the best response?","ar":"يسألك طالب يتعرض لتنمّر إلكتروني: «هل تستطيع أن تجعل الرسائل تختفي؟». ما أفضل استجابة؟"},"opts":[{"en":"“Yes, I'll make sure they are all deleted by tonight.”","ar":"«نعم، سأحرص على حذفها كلها الليلة.»"},{"en":"“Just ignore them. They'll get bored.”","ar":"«تجاهلها فحسب. سيملّون.»"},{"en":"Reassure him it's not his fault, say you will pass it to someone whose job is to help, and avoid promising what you cannot guarantee","ar":"طمئنه بأن الذنب ليس ذنبه، وقل إنك ستسلّم الأمر إلى شخص وظيفته المساعدة، وتجنّب وعدًا لا تستطيع ضمانه"},{"en":"“You shouldn't have been on that app.”","ar":"«ما كان ينبغي أن تكون على ذلك التطبيق.»"}],"correct":2,"expl":{"en":"Be honest. Reassure and report. Avoid blaming the student or promising outcomes you cannot control.","ar":"كن صادقًا. طمئن وأبلغ. وتجنب لوم الطالب أو الوعد بنتائج لا تتحكم فيها."}}]},{"id":"m4","title":{"en":"Contact from Strangers and Online Grooming","ar":"التواصل مع الغرباء والاستدراج عبر الإنترنت"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"What students are taught","ar":"ما يتعلمه الطلبة"},"c":{"en":"Under the Social Media Policy, students are taught to be cautious about accepting friend or follow requests or messages from people they do not know in real life, \u003cstrong>never to arrange to meet an online contact in person without a trusted adult's knowledge and involvement\u003c/strong>, and to recognise and report any contact that feels inappropriate, manipulative, or makes them uncomfortable.","ar":"بموجب سياسة وسائل التواصل الاجتماعي، يُعلَّم الطلبة أن يتوخوا الحذر من قبول طلبات الصداقة أو المتابعة أو الرسائل من أشخاص لا يعرفونهم في الواقع، و\u003cstrong>ألا يرتبوا لقاء شخص تعرّفوا عليه عبر الإنترنت دون علم بالغ موثوق ومشاركته\u003c/strong>، وأن يتعرفوا إلى أي تواصل يبدو غير لائق أو تلاعبيًّا أو يشعرهم بعدم الارتياح ويبلّغوا عنه."}},{"t":"h","c":{"en":"How online grooming can look","ar":"كيف يبدو الاستدراج عبر الإنترنت"}},{"t":"list","c":{"en":["An adult or older child \u003cstrong>builds trust\u003c/strong> through compliments, shared interests, gifts, game credit or sympathy.","They \u003cstrong>move the conversation\u003c/strong> from a public game or app to a private or disappearing-message platform.","They \u003cstrong>encourage secrecy\u003c/strong>: “Don't tell your parents or teachers.”","They \u003cstrong>test boundaries\u003c/strong>, starting with personal questions, then asking for photos, then sexual content.","They may \u003cstrong>threaten\u003c/strong> to share what the child has sent, or to tell others, to keep the child from telling anyone."],"ar":["يبني شخص بالغ أو طفل أكبر سنًّا \u003cstrong>الثقة\u003c/strong> عبر المجاملات والاهتمامات المشتركة والهدايا ورصيد الألعاب والتعاطف.","و\u003cstrong>ينقلون المحادثة\u003c/strong> من لعبة أو تطبيق عام إلى منصة خاصة أو منصة رسائل تختفي.","و\u003cstrong>يشجعون الكتمان\u003c/strong>: «لا تخبر والديك أو معلميك.»","و\u003cstrong>يختبرون الحدود\u003c/strong>، بدءًا بأسئلة شخصية ثم طلب صور ثم محتوى جنسي.","وقد \u003cstrong>يهدّدون\u003c/strong> بمشاركة ما أرسله الطفل أو بإخبار الآخرين لمنعه من إخبار أي أحد."]}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: a child is never to blame","ar":"ممارسة مهنية جيدة: الطفل ليس مسؤولًا أبدًا"},"c":{"en":"A child who has sent an image or shared personal details has been manipulated. Never say “How could you be so silly?” The message you give is: “You are not in trouble. You did the right thing to tell me.” Fear of getting in trouble is the main reason children stay silent.","ar":"الطفل الذي أرسل صورة أو شارك تفاصيل شخصية جرى التلاعب به. لا تقل أبدًا «كيف كنت بهذه السذاجة؟». الرسالة التي تقدّمها هي: «لست في مشكلة. وقد أحسنت بإخباري.» فالخوف من الوقوع في مشكلة هو السبب الرئيس لصمت الأطفال."}},{"t":"callout","k":"warn","title":{"en":"If a student is planning to meet someone, or is in danger now","ar":"إذا كان الطالب يخطط للقاء شخص، أو في خطر الآن"},"c":{"en":"Treat it as urgent. Do not leave the student alone, tell the DSL or a deputy straight away, and if there is a risk of immediate serious harm contact the Police directly (999) without waiting. Never confront the person online yourself.","ar":"تعامل معه بوصفه أمرًا عاجلًا. لا تترك الطالب وحده، وأبلغ مسؤول الحماية أو أحد نوابه فورًا، وإذا وُجد خطر ضرر جسيم وشيك فاتصل بالشرطة مباشرةً (999) دون انتظار. ولا تواجه الشخص عبر الإنترنت بنفسك أبدًا."}},{"t":"h","c":{"en":"Links to other CPDs","ar":"روابط مع وحدات أخرى"}},{"t":"p","c":{"en":"Online grooming is a form of sexual abuse and exploitation. The signs and the six steps for a disclosure are covered in \u003cem>Recognising Signs of Abuse and Neglect\u003c/em> and \u003cem>Reporting and Recording Safeguarding Concerns\u003c/em>. The same procedure applies.","ar":"الاستدراج عبر الإنترنت شكل من أشكال الإساءة الجنسية والاستغلال. وتتناول وحدتا \u003cem>التعرّف إلى علامات الإساءة والإهمال\u003c/em> و\u003cem>الإبلاغ عن مخاوف الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وتسجيلها\u003c/em> العلامات والخطوات الست للتعامل مع الإفصاح. ويُطبَّق الإجراء نفسه."}}],"checks":[{"id":"m4q1","q":{"en":"A Year 8 student tells you an online friend, whom she has never met, wants to meet her on Saturday and said, “Don't tell your parents.” What is the right response?","ar":"تخبرك طالبة في الصف الثامن أن صديقًا عبر الإنترنت، لم تلتقِ به قط، يريد لقاءها يوم السبت وقال: «لا تخبري والديك». ما الاستجابة الصحيحة؟"},"opts":[{"en":"Tell her to cancel and let you know if he contacts her again","ar":"قل لها أن تلغي اللقاء وتخبرك إذا اتصل بها مرة أخرى"},{"en":"Message the person yourself, pretending to be her","ar":"راسل الشخص بنفسك متظاهرًا بأنك هي"},{"en":"Wait until Monday to decide what to do","ar":"انتظر حتى الإثنين لتقرر ما تفعله"},{"en":"Treat it as urgent: thank her, say you must tell someone whose job is to help, and report to the DSL or a deputy straight away","ar":"تعامل معه بوصفه أمرًا عاجلًا: اشكرها وقل إنك مضطر إلى إخبار شخص وظيفته المساعدة، وأبلغ مسؤول الحماية أو أحد نوابه فورًا"}],"correct":3,"expl":{"en":"A planned meeting with an unknown online contact and a request for secrecy are strong warning signs. It is urgent. Never contact the person yourself, and never wait.","ar":"لقاء مخطَّط مع شخص مجهول عبر الإنترنت وطلب كتمان من علامات التحذير القوية. الأمر عاجل. لا تتصل بالشخص بنفسك ولا تنتظر أبدًا."}},{"id":"m4q2","q":{"en":"A student confides, “I sent him a photo and now he says he'll show everyone if I tell.” What message should you give?","ar":"يخبرك طالب: «أرسلتُ له صورة والآن يقول إنه سيريها للجميع إذا أخبرتُ أحدًا». ما الرسالة التي ينبغي أن تقدّمها؟"},"opts":[{"en":"“You are not in trouble, it isn't your fault, and you did the right thing to tell me”, then report to the DSL straight away","ar":"«لست في مشكلة، وليس ذنبك، وقد أحسنت بإخباري»، ثم أبلغ مسؤول الحماية فورًا"},{"en":"“That was a silly thing to do. You should have known better.”","ar":"«كان ذلك تصرفًا أحمق. كان ينبغي أن تعرف أفضل من ذلك.»"},{"en":"“Block him and forget it ever happened.”","ar":"«احظره وانسَ أن الأمر حدث.»"},{"en":"“We'll need to tell your parents tonight, and I'll call them.”","ar":"«سنحتاج إلى إخبار والديك الليلة، وسأتصل بهما.»"}],"correct":0,"expl":{"en":"Threats are used to keep children silent. Blame increases the child's fear. Reassure, then report. The DSL decides whether and how parents are informed.","ar":"تُستخدم التهديدات لإبقاء الأطفال صامتين. واللوم يزيد من خوف الطفل. طمئن ثم أبلغ. ومسؤول الحماية هو من يقرر هل يُبلَّغ الوالدان وكيف."}}]},{"id":"m5","title":{"en":"Devices in the Classroom: BYOD Rules and Your Role","ar":"الأجهزة في الصف: قواعد الأجهزة الشخصية ودورك"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Students in Secondary and High School take part in the BYOD programme daily. Students in other year groups bring a device only when a teacher asks. The BYOD Policy sets rules, and teachers are the people who put them into practice every day.","ar":"يشارك طلبة المرحلتين الثانوية والعليا في برنامج الأجهزة الشخصية يوميًا. أما طلبة الصفوف الأخرى فيحضرون جهازًا فقط عندما يطلب المعلم ذلك. وتضع سياسة الأجهزة الشخصية القواعد، والمعلمون هم من يطبقونها يوميًا."}},{"t":"h","c":{"en":"What the BYOD Policy requires","ar":"ما تشترطه سياسة الأجهزة الشخصية"}},{"t":"table","head":{"en":["Area","Rule"],"ar":["المجال","القاعدة"]},"rows":[{"en":["Purpose","Devices are for educational use during structured lesson time only, once the teacher gives permission"],"ar":["الغرض","الأجهزة للاستخدام التعليمي فقط خلال وقت الدرس المنظّم وبعد إذن المعلم"]},{"en":["Camera and microphone","Only used with the teacher's permission. Never to take illicit or inappropriate images, or to embarrass anyone. No recording of staff without prior consent. Images of others only with everyone's permission"],"ar":["الكاميرا والميكروفون","لا تُستخدم إلا بإذن المعلم. ولا تُستخدم أبدًا لالتقاط صور غير لائقة أو لإحراج أي شخص. ولا تسجيل للموظفين دون موافقة مسبقة. ولا صور للآخرين إلا بإذن الجميع"]},{"en":["Before, after school and breaks","Devices are not used on the premises at these times; a student who does is restricted from their device for the rest of the day"],"ar":["قبل الدوام وبعده وفي الاستراحات","لا تُستخدم الأجهزة في هذه الأوقات داخل المباني؛ ويُقيَّد الطالب الذي يفعل ذلك من استخدام جهازه بقية اليوم"]},{"en":["Network","Students connect only through the school network while at school, so that use stays within the school's oversight"],"ar":["الشبكة","يتصل الطلبة عبر شبكة المدرسة فقط أثناء وجودهم فيها لتبقى جميع استخداماتهم تحت إشراف المدرسة"]},{"en":["Logins","Students use only their own login and password, kept private. They must not access another person's device, account or files"],"ar":["بيانات الدخول","يستخدم الطلبة بيانات الدخول الخاصة بهم فقط وتُبقى سرية. ولا يجوز لهم الوصول إلى جهاز شخص آخر أو حسابه أو ملفاته"]},{"en":["Misuse","May lead to confiscation for the remainder of the school day; each case is considered individually, under the Behaviour & Discipline Policy where appropriate"],"ar":["سوء الاستخدام","قد يؤدي إلى مصادرة الجهاز بقية اليوم الدراسي؛ وتُنظر كل حالة على حدة، بموجب سياسة السلوك والانضباط عند الاقتضاء"]}]},{"t":"h","c":{"en":"Your role as teacher","ar":"دورك بوصفك معلمًا"}},{"t":"list","c":{"en":["Give \u003cstrong>clear instructions\u003c/strong> about when and how devices may be used, and which apps are needed.","\u003cstrong>Grant permission\u003c/strong> before a camera or microphone is used in class.","Address inappropriate use in line with the Behaviour & Discipline Policy, \u003cstrong>escalating to the Section Supervisor or the DSL where appropriate\u003c/strong>.","Any concern about the misuse of a camera or recording that may raise a child protection concern is dealt with under the Child Protection & Safeguarding Policy."],"ar":["قدّم \u003cstrong>تعليمات واضحة\u003c/strong> عن وقت استخدام الأجهزة وكيفيته والتطبيقات المطلوبة.","\u003cstrong>امنح الإذن\u003c/strong> قبل استخدام الكاميرا أو الميكروفون في الصف.","عالج الاستخدام غير المناسب وفق سياسة السلوك والانضباط، \u003cstrong>مع الرفع إلى مشرف القسم أو مسؤول الحماية عند الاقتضاء\u003c/strong>.","وأي قلق بشأن إساءة استخدام الكاميرا أو التسجيل قد يثير قلقًا يتعلق بحماية الطفل يُعالَج بموجب سياسة حماية الطفل وصونه."]}},{"t":"callout","k":"warn","title":{"en":"Confiscating a device: stay within the rule","ar":"مصادرة الجهاز: التزم بالقاعدة"},"c":{"en":"Confiscation is for the remainder of the school day. If you confiscate a device and see something that might be a safeguarding concern (such as an upsetting message or an image), \u003cstrong>stop, do not scroll through the device\u003c/strong>, keep it secure, and tell the DSL immediately. Do not search it yourself.","ar":"تكون المصادرة لبقية اليوم الدراسي. وإذا صادرت جهازًا ورأيت ما قد يكون قلقًا يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> (كرسالة مزعجة أو صورة) \u003cstrong>فتوقف ولا تتصفح الجهاز\u003c/strong>، واحفظه بأمان، وأبلغ مسؤول الحماية فورًا. ولا تفتشه بنفسك."}}],"checks":[{"id":"m5q1","q":{"en":"In a Year 10 lesson, a student uses his tablet camera to film a classmate who is being teased. What is the best response?","ar":"في حصة للصف العاشر يستخدم طالب كاميرا جهازه اللوحي لتصوير زميل يتعرض للمضايقة. ما أفضل استجابة؟"},"opts":[{"en":"Delete the video, then give the student a sanction","ar":"احذف المقطع ثم عاقب الطالب"},{"en":"Stop it, secure the device, do not view or delete the video, support the filmed student, record what happened and report to the DSL the same day","ar":"أوقف ذلك وأمّن الجهاز ولا تشاهد المقطع ولا تحذفه وادعم الطالب الذي صُوّر وسجّل ما حدث وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Ask the student to post the video in the class chat so everyone can see it","ar":"اطلب من الطالب نشر المقطع في محادثة الصف ليراه الجميع"},{"en":"Ignore it, since the student was only holding a device","ar":"تجاهل الأمر لأن الطالب كان يمسك جهازًا فقط"}],"correct":1,"expl":{"en":"Filming a classmate to embarrass them breaches the BYOD camera rule, and it may be a safeguarding concern. Preserve it, support the child and report.","ar":"تصوير زميل لإحراجه يخرق قاعدة الكاميرا في سياسة الأجهزة الشخصية، وقد يكون قلقًا يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>. احفظه وادعم الطفل وأبلغ."}},{"id":"m5q2","q":{"en":"When may students use a device's camera or microphone in class under the BYOD Policy?","ar":"متى يجوز للطلبة استخدام كاميرا الجهاز أو ميكروفونه في الصف بموجب سياسة الأجهزة الشخصية؟"},"opts":[{"en":"Whenever they like during structured lessons","ar":"في أي وقت يشاؤون خلال الدروس المنظمة"},{"en":"Only during break times","ar":"خلال أوقات الاستراحة فقط"},{"en":"Only once permission has been given by the teacher in charge of the class","ar":"فقط بعد أن يمنح المعلم المسؤول عن الصف الإذن"},{"en":"Whenever the other students agree","ar":"كلما وافق الطلبة الآخرون"}],"correct":2,"expl":{"en":"The policy requires the teacher's permission, and images of others may only be made with everyone's permission.","ar":"تشترط السياسة إذن المعلم، ولا تُلتقط صور الآخرين إلا بإذن الجميع."}},{"id":"m5q3","q":{"en":"You confiscate a student's phone and a worrying message appears on its screen. What should you do?","ar":"صادرت هاتف طالب وظهرت على شاشته رسالة مقلقة. ماذا عليك أن تفعل؟"},"opts":[{"en":"Read all the recent messages to understand the context","ar":"اقرأ كل الرسائل الأخيرة لتفهم السياق"},{"en":"Ask another student to read through it and tell you what it says","ar":"اطلب من طالب آخر أن يتصفحه ويخبرك بما فيه"},{"en":"Give the phone back immediately and forget what you saw","ar":"أعد الهاتف فورًا وانسَ ما رأيته"},{"en":"Do not scroll through the phone, keep it secure and tell the DSL immediately","ar":"لا تتصفح الهاتف، واحفظه بأمان، وأبلغ مسؤول الحماية فورًا"}],"correct":3,"expl":{"en":"Searching a device is not a teacher's role. Record what you saw and pass it to the DSL, who decides what to do next.","ar":"تفتيش الجهاز ليس من دور المعلم. سجّل ما رأيته وسلّمه إلى مسؤول الحماية الذي يقرر ما يلي."}}]},{"id":"m6","title":{"en":"Your Own Professional Online Conduct","ar":"سلوكك المهني عبر الإنترنت"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Safeguarding online also applies to adults. The Staff Code of Conduct sets clear expectations, which protect both students and you.","ar":"ينطبق الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> عبر الإنترنت على البالغين أيضًا. ويضع ميثاق سلوك الموظفين توقعات واضحة تحمي الطلبة وتحميك."}},{"t":"h","c":{"en":"What the Staff Code of Conduct says","ar":"ما ينص عليه ميثاق سلوك الموظفين"}},{"t":"list","c":{"en":["\u003cstrong>Never contact or accept contact from a current student\u003c/strong> via personal phone, personal social media or personal messaging apps.","\u003cstrong>Never connect with or follow a current student\u003c/strong> on personal social media accounts.","Use \u003cstrong>school-provided technology and platforms\u003c/strong> for all school-related communication.","Make sure personal social media activity \u003cstrong>does not bring the school into disrepute\u003c/strong> or breach student or family confidentiality.","Use school ICT systems responsibly, in line with the Data Protection & Privacy Policy.","\u003cstrong>Report any misuse of technology involving students\u003c/strong> as the Code directs (the Code names the Child Protection Coordinator or IT Coordinator, as appropriate). Where a student's safety is concerned, the safeguarding policy applies: the DSL, the same day."],"ar":["\u003cstrong>لا تتصل بأي طالب حالي ولا تقبل اتصاله\u003c/strong> عبر هاتفك الشخصي أو وسائل تواصلك الاجتماعي الشخصية أو تطبيقات المراسلة الشخصية.","\u003cstrong>لا تتواصل مع طالب حالي ولا تتابعه\u003c/strong> على حساباتك الشخصية في وسائل التواصل الاجتماعي.","استخدم \u003cstrong>التقنية والمنصات التي توفرها المدرسة\u003c/strong> في جميع الاتصالات المتعلقة بالمدرسة.","احرص على ألا يؤدي نشاطك الشخصي على وسائل التواصل الاجتماعي إلى \u003cstrong>الإساءة إلى سمعة المدرسة\u003c/strong> أو خرق سرية الطلبة أو الأسر.","استخدم أنظمة تقنية المعلومات في المدرسة بمسؤولية، وفق سياسة حماية البيانات والخصوصية.","\u003cstrong>أبلغ عن أي سوء استخدام للتقنية يتعلق بالطلبة\u003c/strong> كما يوجّه الميثاق (يذكر الميثاق منسّق حماية الطفل أو منسّق التقنية بحسب الحال). وحيثما تعلّق الأمر بسلامة طالب فتنطبق سياسة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>: مسؤول الحماية في اليوم نفسه."]}},{"t":"h","c":{"en":"Photographs and images of students","ar":"صور الطلبة"}},{"t":"p","c":{"en":"The Data Protection & Privacy Policy states that parental consent is obtained at admission for the use of a student's photograph or video in school publications, the school website and social media, and that parents may withdraw that consent. \u003cem>Professional good practice:\u003c/em> use only school devices and accounts, check before you post that you have consent for that student, and never keep images of students on a personal phone or personal cloud account.","ar":"تنص سياسة حماية البيانات والخصوصية على أنه تُؤخذ موافقة أولياء الأمور عند القبول على استخدام صورة الطالب أو مقطعه في منشورات المدرسة وموقعها الإلكتروني ووسائل التواصل، وأن لأولياء الأمور سحب هذه الموافقة. \u003cem>ممارسة مهنية جيدة:\u003c/em> استخدم أجهزة المدرسة وحساباتها فقط، وتحقق قبل النشر من وجود موافقة لذلك الطالب، ولا تحتفظ أبدًا بصور الطلبة على هاتف شخصي أو حساب سحابي شخصي."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: protect yourself","ar":"ممارسة مهنية جيدة: احمِ نفسك"},"c":{"en":"If a student sends you a friend request, or messages you on a personal account, do not reply. Tell the Section Supervisor or DSL, and keep a note. If a parent asks you to join a class WhatsApp group on your personal number, speak to your line manager first: school-provided platforms exist to protect everyone.","ar":"إذا أرسل لك طالب طلب صداقة أو راسلك على حساب شخصي فلا تردّ. أخبر مشرف القسم أو مسؤول الحماية واحتفظ بملاحظة. وإذا طلب منك ولي أمر الانضمام إلى مجموعة واتساب للصف على رقمك الشخصي فتحدث إلى مديرك المباشر أولًا: فمنصات المدرسة موجودة لحماية الجميع."}},{"t":"callout","k":"key","title":{"en":"Boundaries are covered in depth in CPD 7","ar":"الحدود المهنية تُشرح بعمق في الوحدة 7"},"c":{"en":"The \u003cem>Professional Boundaries with Students\u003c/em> CPD covers private messaging, favouritism, gifts, and time alone with students in more detail.","ar":"تتناول وحدة \u003cem>الحدود المهنية مع الطلبة\u003c/em> المراسلة الخاصة والمحاباة والهدايا والبقاء وحدك مع الطلبة بتفصيل أكبر."}}],"checks":[{"id":"m6q1","q":{"en":"A Year 11 student sends you a friend request on your personal Instagram account. What should you do?","ar":"يرسل إليك طالب في الصف الحادي عشر طلب صداقة على حسابك الشخصي في إنستغرام. ماذا عليك أن تفعل؟"},"opts":[{"en":"Do not accept or reply. Tell the Section Supervisor or DSL and keep a note","ar":"لا تقبله ولا تردّ. أخبر مشرف القسم أو مسؤول الحماية واحتفظ بملاحظة"},{"en":"Accept it, but only share professional content with him","ar":"اقبله لكن لا تشارك معه إلا محتوى مهنيًا"},{"en":"Accept it, provided his parents also follow you","ar":"اقبله شرط أن يتابعك والداه أيضًا"},{"en":"Reply privately to explain why you can't accept","ar":"رد عليه بشكل خاص لتشرح سبب عدم قبولك"}],"correct":0,"expl":{"en":"The Staff Code of Conduct says staff never connect with or follow current students on personal social media. Telling a manager protects both you and the student.","ar":"ينص ميثاق سلوك الموظفين على أن الموظفين لا يتواصلون مع الطلبة الحاليين ولا يتابعونهم على وسائل التواصل الاجتماعي الشخصية. وإخبار المدير يحميك ويحمي الطالب."}},{"id":"m6q2","q":{"en":"You take photos at a school event on your own phone for the school's Instagram page. What is the best practice?","ar":"التقطت صورًا في فعالية مدرسية بهاتفك الشخصي لصفحة المدرسة على إنستغرام. ما أفضل ممارسة؟"},"opts":[{"en":"Post them straight away because the event was public","ar":"انشرها فورًا لأن الفعالية كانت عامة"},{"en":"Use school devices and accounts where possible, check that the students have parental consent for images, and do not keep the photos on your personal phone","ar":"استخدم أجهزة المدرسة وحساباتها قدر الإمكان، وتحقق من وجود موافقة أولياء الأمور على الصور، ولا تحتفظ بالصور على هاتفك الشخصي"},{"en":"Keep them in your personal cloud account in case they are needed later","ar":"احتفظ بها في حسابك السحابي الشخصي تحسبًا لاحتياجها لاحقًا"},{"en":"Send them to the parents' WhatsApp groups to save time","ar":"أرسلها إلى مجموعات واتساب أولياء الأمور لتوفير الوقت"}],"correct":1,"expl":{"en":"Parental consent for images is obtained at admission and can be withdrawn. School devices and accounts keep images under the school's control.","ar":"تؤخذ موافقة أولياء الأمور على الصور عند القبول ويمكن سحبها. وتُبقي أجهزة المدرسة وحساباتها الصور تحت سيطرة المدرسة."}}]},{"id":"m7","title":{"en":"Responding to an Online Concern: Practice","ar":"الاستجابة لقلق رقمي: تطبيق عملي"},"minutes":15,"blocks":[{"t":"steps","c":{"en":["\u003cstrong>Reassure and listen.\u003c/strong> No blame, no leading questions, no promise of secrecy and no promise to “make it disappear”.","\u003cstrong>Do not view, copy, forward, delete or search.\u003c/strong> Never handle intimate images of a child.","\u003cstrong>Secure the device\u003c/strong> if you safely can, and keep it away from others.","\u003cstrong>Record\u003c/strong>: the student's words, the app or platform, dates and times, names or usernames mentioned.","\u003cstrong>Report to the DSL or a deputy the same day\u003c/strong>, or Police (999) first if there is immediate danger."],"ar":["\u003cstrong>طمئن وأصغِ.\u003c/strong> بلا لوم ولا أسئلة إيحائية ولا وعد بالسرية ولا وعد بأن «تجعله يختفي».","\u003cstrong>لا تشاهد ولا تنسخ ولا ترسل ولا تحذف ولا تفتش.\u003c/strong> ولا تتعامل أبدًا مع صور حميمة لطفل.","\u003cstrong>أمّن الجهاز\u003c/strong> إن استطعت بأمان، وأبعده عن الآخرين.","\u003cstrong>سجّل\u003c/strong>: كلمات الطالب والتطبيق أو المنصة والتواريخ والأوقات والأسماء أو أسماء المستخدمين المذكورة.","\u003cstrong>أبلغ مسؤول الحماية أو أحد نوابه في اليوم نفسه\u003c/strong>، أو الشرطة (999) أولًا إذا وُجد خطر داهم."]}},{"t":"scenario","title":{"en":"Case A","ar":"الحالة أ"},"c":{"en":"A Year 5 student tells you, “Someone on my game said they'd buy me skins if I send a picture of me without my top on. I haven't yet.”","ar":"يخبرك طالب في الصف الخامس: «شخص في لعبتي قال إنه سيشتري لي إضافات إذا أرسلت له صورة لي دون قميص. لم أرسلها بعد.»"}},{"t":"scenario","title":{"en":"Case B","ar":"الحالة ب"},"c":{"en":"A parent emails you, upset, with screenshots of a Year 7 group chat in which her daughter is called names and told to “disappear”.","ar":"ترسل لك ولية أمر رسالة بريد إلكتروني منزعجة ومعها لقطات شاشة لمحادثة جماعية لطلبة الصف السابع تُنعَت فيها ابنتها بألقاب وتُطلب منها «الاختفاء»."}},{"t":"scenario","title":{"en":"Case C","ar":"الحالة ج"},"c":{"en":"A colleague tells you, laughing, that students have been messaging him on his personal WhatsApp and that he sometimes replies at night “to help with homework”.","ar":"يخبرك زميل ضاحكًا بأن طلبة يراسلونه على واتساب الشخصي وأنه أحيانًا يردّ ليلًا «للمساعدة في الواجب»."}}],"checks":[{"id":"m7q1","q":{"en":"In Case A, what is the best course of action?","ar":"في الحالة أ، ما أفضل مسار عمل؟"},"opts":[{"en":"Tell him to block the person and not to play that game again","ar":"قل له أن يحظر الشخص ولا يلعب تلك اللعبة مرة أخرى"},{"en":"Ask him to show you the whole chat history and read it carefully","ar":"اطلب منه أن يُريك سجل المحادثة كله واقرأه بعناية"},{"en":"Thank him, tell him it is not his fault and that he has not done anything wrong, record his words and report to the DSL immediately","ar":"اشكره، وأخبره أن الذنب ليس ذنبه وأنه لم يفعل شيئًا خاطئًا، وسجّل كلماته وأبلغ مسؤول الحماية فورًا"},{"en":"Tell him you'll keep it between the two of you, since he hasn't sent anything","ar":"أخبره بأنك ستبقي الأمر بينكما لأنه لم يرسل شيئًا"}],"correct":2,"expl":{"en":"This is a likely grooming attempt. Reassure, record and report immediately. Do not investigate, promise secrecy or read the chat yourself.","ar":"هذه محاولة استدراج محتملة. طمئن وسجّل وأبلغ فورًا. ولا تحقّق ولا تَعِد بالسرية ولا تقرأ المحادثة بنفسك."}},{"id":"m7q2","q":{"en":"In Case B, what should you do with the parent's email and screenshots?","ar":"في الحالة ب، ماذا عليك أن تفعل برسالة ولية الأمر ولقطات الشاشة؟"},"opts":[{"en":"Reply to the whole group of parents so that everyone knows","ar":"ردّ على مجموعة أولياء الأمور كلها ليعلم الجميع"},{"en":"Ask the girls in the chat to explain themselves in class","ar":"اطلب من الطالبات في المحادثة أن يشرحن أنفسهن في الصف"},{"en":"Delete the email, so the screenshots are not kept","ar":"احذف الرسالة حتى لا تُحفظ لقطات الشاشة"},{"en":"Do not forward them around. Pass them to the DSL the same day, and tell the parent politely that the school will look into it","ar":"لا تُعمّمها. سلّمها إلى مسؤول الحماية في اليوم نفسه، وأخبر ولية الأمر بلطف أن المدرسة ستنظر في الأمر"}],"correct":3,"expl":{"en":"Anyone, including a parent, can raise a concern. Cyberbullying is treated as seriously as other bullying. Share the information only with the DSL, who coordinates the response.","ar":"يستطيع أي شخص، ومنه ولي الأمر، رفع قلق. والتنمّر الإلكتروني يُعامَل بالجدية نفسها كغيره من التنمّر. شارك المعلومات مع مسؤول الحماية فقط ليتولى تنسيق الاستجابة."}},{"id":"m7q3","q":{"en":"In Case C, what is the right response to your colleague?","ar":"في الحالة ج، ما الاستجابة الصحيحة لزميلك؟"},"opts":[{"en":"Gently explain that the Staff Code does not allow this, encourage him to move to school platforms, and report the concern to the DSL or Principal if it continues or you are worried","ar":"اشرح له بلطف أن ميثاق الموظفين لا يسمح بذلك، وشجّعه على الانتقال إلى منصات المدرسة، وأبلغ مسؤول الحماية أو المدير إذا استمر الأمر أو كنت قلقًا"},{"en":"Laugh it off, since he is only trying to help","ar":"خذ الأمر بالضحك لأنه يحاول المساعدة فقط"},{"en":"Join the chat yourself to see what is said","ar":"انضم إلى المحادثة بنفسك لترى ما يُقال"},{"en":"Tell the students to stop messaging him","ar":"قل للطلبة أن يتوقفوا عن مراسلته"}],"correct":0,"expl":{"en":"Staff must never accept contact from current students on personal apps. Good intentions do not change the rule. The matter is raised with the DSL or Principal as appropriate.","ar":"يجب ألا يقبل الموظفون تواصل الطلبة الحاليين على التطبيقات الشخصية. والنوايا الحسنة لا تغيّر القاعدة. ويُرفع الأمر إلى مسؤول الحماية أو المدير بحسب الحال."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"How does the PEPS policy treat online safety?","ar":"كيف تتعامل سياسة المدرسة مع السلامة الرقمية؟"},"opts":[{"en":"As a purely technical matter","ar":"بوصفها مسألة تقنية بحتة"},{"en":"As a core part of safeguarding, not a separate subject","ar":"بوصفها جزءًا أساسيًا من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وليست موضوعًا منفصلًا"},{"en":"As a matter only for parents","ar":"بوصفها مسألة تخص أولياء الأمور فقط"},{"en":"As an optional extra","ar":"بوصفها إضافة اختيارية"}],"correct":1},{"id":"e2","mod":1,"q":{"en":"Which concerns does Section 9 of the safeguarding policy say are raised with the DSL in the usual way?","ar":"أي المخاوف يقول القسم 9 من سياسة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> إنها تُرفع إلى مسؤول الحماية بالطريقة المعتادة؟"},"opts":[{"en":"Only contact from an unknown adult","ar":"تواصل البالغ المجهول فقط"},{"en":"Only cyberbullying","ar":"التنمّر الإلكتروني فقط"},{"en":"Online activity, harmful content, cyberbullying, and contact from an unknown adult","ar":"النشاط عبر الإنترنت والمحتوى الضار والتنمّر الإلكتروني وتواصل البالغ المجهول"},{"en":"Only incidents that happen during school hours","ar":"الحوادث التي تقع خلال ساعات الدوام فقط"}],"correct":2},{"id":"e3","mod":1,"q":{"en":"Which policy sets out the school's approach to filtering, monitoring and the online safety curriculum?","ar":"أي سياسة تحدد نهج المدرسة في التصفية والمراقبة ومنهج السلامة الرقمية؟"},"opts":[{"en":"The Uniform Policy","ar":"سياسة الزي المدرسي"},{"en":"The Educational Visits Policy","ar":"سياسة الرحلات التعليمية"},{"en":"The School Property Protection Policy","ar":"سياسة حماية ممتلكات المدرسة"},{"en":"The Digital Citizenship Policy","ar":"سياسة المواطنة الرقمية"}],"correct":3},{"id":"e4","mod":2,"q":{"en":"A student is tired, secretive about his phone and mentions an older online \"friend\". What is the best response?","ar":"طالب متعب ومتكتم بشأن هاتفه ويذكر «صديقًا» أكبر سنًّا عبر الإنترنت. ما أفضل استجابة؟"},"opts":[{"en":"Record what you have seen and heard and report to the DSL the same day","ar":"سجّل ما رأيته وسمعته وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Take his phone and read his messages","ar":"خذ هاتفه واقرأ رسائله"},{"en":"Wait to see whether the signs continue for a month","ar":"انتظر لترى هل تستمر العلامات شهرًا"},{"en":"Ask him to give you the friend's name so you can message them","ar":"اطلب منه اسم الصديق لتراسله"}],"correct":0},{"id":"e5","mod":2,"q":{"en":"Which of the following is a possible warning sign of online grooming?","ar":"أي مما يلي علامة تحذير محتملة للاستدراج عبر الإنترنت؟"},"opts":[{"en":"Completing homework on time","ar":"إنجاز الواجب في موعده"},{"en":"New gifts or game credit the student cannot explain, and secrecy about a new online contact","ar":"هدايا جديدة أو رصيد ألعاب لا يستطيع الطالب تفسيره، وكتمان بشأن جهة اتصال جديدة عبر الإنترنت"},{"en":"Playing a multiplayer game with school friends","ar":"لعب لعبة جماعية مع أصدقاء المدرسة"},{"en":"Using the school network to access class resources","ar":"استخدام شبكة المدرسة للوصول إلى موارد الصف"}],"correct":1},{"id":"e6","mod":2,"q":{"en":"What do most platforms in the Social Media Policy's Appendix A list as their typical minimum age?","ar":"ما الحد الأدنى للعمر الذي تذكره معظم المنصات في الملحق أ من سياسة وسائل التواصل الاجتماعي؟"},"opts":[{"en":"10","ar":"10"},{"en":"16","ar":"16"},{"en":"13","ar":"13"},{"en":"18","ar":"18"}],"correct":2},{"id":"e7","mod":2,"q":{"en":"What is the correct way to treat a student who has made a mistake online or come forward about a problem?","ar":"ما الطريقة الصحيحة للتعامل مع طالب ارتكب خطأً عبر الإنترنت أو تقدّم بشأن مشكلة؟"},"opts":[{"en":"Penalise them so that others learn","ar":"عاقبه ليتعلم الآخرون"},{"en":"Publicly discuss the case in assembly","ar":"ناقش الحالة علنًا في طابور الصباح"},{"en":"Ask them to promise never to use the internet again","ar":"اطلب منه أن يعد بألا يستخدم الإنترنت مرة أخرى"},{"en":"Support them, without shaming, and never penalise them for reporting a genuine concern in good faith","ar":"ادعمه دون تخجيل ولا تعاقبه أبدًا لإبلاغه عن قلق حقيقي بحسن نية"}],"correct":3},{"id":"e8","mod":3,"q":{"en":"According to the Social Media Policy, what is the position of a student who stays in a group chat that targets someone?","ar":"بحسب سياسة وسائل التواصل الاجتماعي، ما موقف الطالب الذي يبقى في مجموعة محادثة تستهدف شخصًا؟"},"opts":[{"en":"They are participating in bullying; it is not a neutral bystander role","ar":"هو مشارك في التنمّر؛ وليس متفرجًا محايدًا"},{"en":"They are neutral if they write nothing","ar":"هو محايد إذا لم يكتب شيئًا"},{"en":"They are a victim only","ar":"هو ضحية فقط"},{"en":"They are not involved because group chats are private","ar":"هو غير معني لأن مجموعات المحادثة خاصة"}],"correct":0},{"id":"e9","mod":3,"q":{"en":"What should you do if a student shows you an intimate image of another child?","ar":"ماذا عليك أن تفعل إذا أراك طالب صورة حميمة لطفل آخر؟"},"opts":[{"en":"Forward it to the DSL","ar":"أن ترسلها إلى مسؤول الحماية"},{"en":"Not copy, forward or delete it, secure the device if you can safely do so, and report to the DSL immediately","ar":"ألا تنسخها أو ترسلها أو تحذفها، وأن تؤمّن الجهاز إن استطعت بأمان، وتبلّغ مسؤول الحماية فورًا"},{"en":"Delete it right away","ar":"أن تحذفها فورًا"},{"en":"Ask the student to keep it so you can look at it later","ar":"أن تطلب من الطالب الاحتفاظ بها لتنظر فيها لاحقًا"}],"correct":1},{"id":"e10","mod":3,"q":{"en":"How does the Social Media Policy describe sharing intimate or embarrassing images of someone without consent?","ar":"كيف تصف سياسة وسائل التواصل الاجتماعي مشاركة صور حميمة أو محرجة لشخص ما دون موافقته؟"},"opts":[{"en":"A minor misunderstanding","ar":"سوء فهم بسيط"},{"en":"A matter only for the students' parents","ar":"مسألة تخص والدي الطلبة فقط"},{"en":"A serious breach, which may also be a safeguarding concern and/or a criminal matter","ar":"خرق جسيم، وقد يكون أيضًا قلقًا يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> و/أو مسألة جنائية"},{"en":"A normal part of online friendships","ar":"جزء طبيعي من الصداقات عبر الإنترنت"}],"correct":2},{"id":"e11","mod":3,"q":{"en":"A student who is being cyberbullied asks you to make the messages vanish. What is the best answer?","ar":"يطلب منك طالب يتعرض لتنمّر إلكتروني أن تجعل الرسائل تختفي. ما أفضل جواب؟"},"opts":[{"en":"Promise that all copies will be deleted tonight","ar":"عِده بحذف كل النسخ الليلة"},{"en":"Tell him to ignore it","ar":"قل له أن يتجاهله"},{"en":"Tell him that he should have been more careful","ar":"قل له كان ينبغي أن يكون أكثر حذرًا"},{"en":"Reassure him it's not his fault, say you'll pass it to someone whose job is to help, and do not promise what you cannot guarantee","ar":"طمئنه بأن الذنب ليس ذنبه، وقل إنك ستسلّم الأمر إلى شخص وظيفته المساعدة، ولا تعد بما لا تستطيع ضمانه"}],"correct":3},{"id":"e12","mod":4,"q":{"en":"A student says an online contact has asked to meet in person and asked her to keep it secret. What should you do?","ar":"تقول طالبة إن جهة اتصال عبر الإنترنت طلبت لقاءها شخصيًا وطلبت منها كتمان الأمر. ماذا عليك أن تفعل؟"},"opts":[{"en":"Treat it as urgent and report to the DSL or a deputy straight away, without confronting the person yourself","ar":"تعامل معه بوصفه أمرًا عاجلًا وأبلغ مسؤول الحماية أو أحد نوابه فورًا، دون مواجهة الشخص بنفسك"},{"en":"Tell her not to go, and let her decide whether to report","ar":"قل لها ألا تذهب واتركها تقرر هل تبلّغ"},{"en":"Message the person yourself","ar":"راسل الشخص بنفسك"},{"en":"Wait until after the weekend","ar":"انتظر حتى ما بعد عطلة نهاية الأسبوع"}],"correct":0},{"id":"e13","mod":4,"q":{"en":"Why might a child who has been manipulated online stay silent?","ar":"لماذا قد يصمت طفل جرى التلاعب به عبر الإنترنت؟"},"opts":[{"en":"Because online contact is never harmful","ar":"لأن التواصل عبر الإنترنت ليس ضارًا أبدًا"},{"en":"Fear of getting into trouble, shame, or threats from the other person","ar":"الخوف من الوقوع في مشكلة أو الخجل أو تهديدات الطرف الآخر"},{"en":"Because they want to be punished","ar":"لأنه يريد أن يُعاقَب"},{"en":"Because they do not use technology","ar":"لأنه لا يستخدم التقنية"}],"correct":1},{"id":"e14","mod":4,"q":{"en":"What should you say to a child who has sent an image to someone online and is afraid of the consequences?","ar":"ماذا ينبغي أن تقول لطفل أرسل صورة إلى شخص عبر الإنترنت وهو خائف من العواقب؟"},"opts":[{"en":"“That was very foolish.”","ar":"«كان ذلك تصرفًا أحمق جدًا.»"},{"en":"“You will be punished for this.”","ar":"«ستُعاقَب على هذا.»"},{"en":"“You are not in trouble. You did the right thing to tell me.”","ar":"«لست في مشكلة. وقد أحسنت بإخباري.»"},{"en":"“Let's keep this between us.”","ar":"«لنُبقِ هذا بيننا.»"}],"correct":2},{"id":"e15","mod":5,"q":{"en":"When may students use their devices on school premises under the BYOD Policy?","ar":"متى يجوز للطلبة استخدام أجهزتهم داخل مباني المدرسة بموجب سياسة الأجهزة الشخصية؟"},"opts":[{"en":"At any time, including breaks","ar":"في أي وقت بما في ذلك الاستراحات"},{"en":"Before and after school while waiting for pick-up","ar":"قبل الدوام وبعده أثناء انتظار الاستلام"},{"en":"Whenever a parent has given permission","ar":"كلما منح ولي الأمر الإذن"},{"en":"Only for educational use during structured lesson time, with the teacher's permission","ar":"للاستخدام التعليمي فقط خلال وقت الدرس المنظّم وبإذن المعلم"}],"correct":3},{"id":"e16","mod":5,"q":{"en":"What happens, under the BYOD Policy, when a device is used inappropriately?","ar":"ماذا يحدث، بموجب سياسة الأجهزة الشخصية، عند استخدام جهاز استخدامًا غير مناسب؟"},"opts":[{"en":"It may be confiscated for the remainder of the school day, and each case is considered individually","ar":"قد يُصادَر بقية اليوم الدراسي، وتُنظر كل حالة على حدة"},{"en":"It is confiscated for the rest of the term","ar":"يُصادَر بقية الفصل"},{"en":"It is searched by the teacher","ar":"يفتشه المعلم"},{"en":"The student is excluded from school","ar":"يُستبعَد الطالب من المدرسة"}],"correct":0},{"id":"e17","mod":5,"q":{"en":"You confiscate a phone and see a worrying message. What is the correct action?","ar":"صادرت هاتفًا ورأيت رسالة مقلقة. ما الإجراء الصحيح؟"},"opts":[{"en":"Read through all the messages","ar":"اقرأ كل الرسائل"},{"en":"Do not scroll through it, keep it secure, and tell the DSL immediately","ar":"لا تتصفحه، واحفظه بأمان، وأبلغ مسؤول الحماية فورًا"},{"en":"Return the phone and say nothing","ar":"أعد الهاتف ولا تقل شيئًا"},{"en":"Show the message to other staff in the staff room","ar":"أرِ الرسالة لموظفين آخرين في غرفة المعلمين"}],"correct":1},{"id":"e18","mod":6,"q":{"en":"Under the Staff Code of Conduct, how may staff communicate with current students?","ar":"بموجب ميثاق سلوك الموظفين، كيف يجوز للموظفين التواصل مع الطلبة الحاليين؟"},"opts":[{"en":"Through personal WhatsApp if the parents agree","ar":"عبر واتساب الشخصي إذا وافق الوالدان"},{"en":"Through personal Instagram if the account is private","ar":"عبر إنستغرام الشخصي إذا كان الحساب خاصًا"},{"en":"Through school-provided technology and platforms, not personal phones or personal social media","ar":"عبر التقنية والمنصات التي توفرها المدرسة، لا عبر الهواتف الشخصية أو وسائل التواصل الاجتماعي الشخصية"},{"en":"Through any app the student prefers","ar":"عبر أي تطبيق يفضل /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const ARR_N = () => S.lang==='ar' ? '←' : '→';
const ARR_P = () => S.lang==='ar' ? '→' : '←';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}
