<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health &amp; Safety Part B CPD / برنامج الصحة والسلامة - الجزء ب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#4a5670;
    --paper:#EDEFE8; --card:#FFFFFF;
    --teal:#1F5C4C; --teal-soft:#E3ECE6;
    --gold:#B7862C; --gold-soft:#F5EBD6;
    --red:#A23B3B; --red-soft:#F5E5E1;
    --line:#DBDACF;
    --wb:#A5651C; --wb-soft:#F3E4D1;
    --evi:#5C4A7A; --evi-soft:#ECE7F2;
    --shadow: 0 1px 2px rgba(27,42,74,0.06), 0 4px 14px rgba(27,42,74,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .app{max-width:1180px; margin:0 auto; padding:0 22px 60px;}
  .app.rtl{direction:rtl; font-family:'IBM Plex Sans Arabic',sans-serif;}
  .app.rtl .eyebrow, .app.rtl .cert-eyebrow, .app.rtl .concept-num, .app.rtl .check-label, .app.rtl .exam-progress, .app.rtl .prereq, .app.rtl .indicator-head .code, .app.rtl .module-head .code, .app.rtl .exam-head .eyebrow2, .app.rtl .cert-meta-row, .app.rtl .cert-seal, .app.rtl .review-tag, .app.rtl .role-tag{font-family:'IBM Plex Sans Arabic',sans-serif;}
  .app.rtl h1.programme-title, .app.rtl .module-head h2, .app.rtl .concept h3, .app.rtl .indicator-head h3, .app.rtl .exam-head h2, .app.rtl .cert-title, .app.rtl .cert-name, .app.rtl .evidence-box h4, .app.rtl .exam-cta h4, .app.rtl .name-gate h4, .app.rtl .final-banner h2{font-family:'IBM Plex Sans Arabic',sans-serif;}
  .app.rtl .disclaimer{border-left:none; border-right:3px solid var(--gold); border-radius:6px 0 0 6px;}
  .app.rtl .review-tag{margin-left:10px; margin-right:0;}
  .app.rtl .feedback{border-left:none; border-right:3px solid var(--ink-soft);}
  .app.rtl .feedback.right{border-right-color:var(--teal);}
  .app.rtl .feedback.wrong{border-right-color:var(--red);}

  header.topbar{padding:34px 0 20px; border-bottom:1px solid var(--line); margin-bottom:26px; position:relative;}
  .lang-switch{position:absolute; top:34px; right:0; display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
  .app.rtl .lang-switch{right:auto; left:0;}
  .lang-switch .lbl{font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); transition:color .15s;}
  .app.rtl .lang-switch .lbl{font-family:'IBM Plex Sans Arabic',sans-serif;}
  .lang-switch .lbl.active{color:var(--ink);}
  .lang-switch .switch{position:relative; width:44px; height:24px; flex:none; direction:ltr;}
  .lang-switch .switch input{opacity:0; width:0; height:0; position:absolute;}
  .lang-switch .slider{position:absolute; inset:0; background:#c7c6bb; border-radius:24px; transition:background .15s;}
  .lang-switch .slider::before{content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .lang-switch input:checked + .slider{background:var(--wb);}
  .lang-switch input:checked + .slider::before{transform:translateX(20px);}

  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--wb); font-weight:600;}
  h1.programme-title{font-family:'Source Serif 4',serif; font-weight:700; font-size:34px; margin:6px 0 8px; color:var(--ink); max-width:80%;}
  .programme-sub{color:var(--ink-soft); max-width:700px; margin:0 0 14px;}
  .prereq{display:inline-flex; align-items:center; gap:8px; background:var(--wb-soft); color:var(--wb); border:1px solid #c3d0e3; border-radius:20px; padding:7px 14px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;}
  .disclaimer{margin-top:14px; font-size:12.3px; color:var(--ink-soft); max-width:700px; border-left:3px solid var(--gold); padding:8px 12px; background:var(--gold-soft); border-radius:0 6px 6px 0;}

  .layout{display:grid; grid-template-columns:250px 1fr; gap:26px; align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  nav.sidebar{position:sticky; top:20px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  .sb-head{padding:14px 16px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--line);}
  .sb-item{display:flex; align-items:flex-start; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer;}
  .sb-item.locked{cursor:default; opacity:.55;}
  .sb-item:last-child{border-bottom:none;}
  .sb-item:hover{background:#F7F7F2;}
  .sb-mark{width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px; display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; border:1.5px solid var(--line); color:var(--ink-soft); background:#fff;}
  .sb-mark.passed{background:var(--teal); border-color:var(--teal); color:#fff;}
  .sb-mark.done{background:var(--wb); border-color:var(--wb); color:#fff;}
  .sb-item-title{font-weight:600; font-size:13.3px; color:var(--ink);}
  .sb-item-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  main.content{min-height:400px;}

  .module-head{background:var(--wb); color:#fff; border-radius:12px; padding:26px 28px; margin-bottom:24px; position:relative; overflow:hidden;}
  .module-head::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border:1px solid rgba(255,255,255,.14); border-radius:50%;}
  .app.rtl .module-head::after{right:auto; left:-40px;}
  .module-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#cfdaf0; letter-spacing:.08em;}
  .module-head h2{font-family:'Source Serif 4',serif; font-size:26px; margin:6px 0 10px; font-weight:700;}
  .module-head p{color:#dde6f4; max-width:660px; margin:0; font-size:14.5px;}

  .indicator-head{background:var(--ink); color:#fff; border-radius:10px; padding:16px 22px; margin:8px 0 18px;}
  .indicator-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#cdd6ea; letter-spacing:.06em;}
  .indicator-head h3{font-family:'Source Serif 4',serif; font-size:20px; margin:4px 0 0; font-weight:700;}

  .concept{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px 26px; margin-bottom:20px; box-shadow:var(--shadow);}
  .concept-num{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--wb); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .concept h3{font-family:'Source Serif 4',serif; font-size:21px; margin:0 0 12px; color:var(--ink);}
  .concept p{color:#33405c; margin:0 0 10px; font-size:14.8px;}

  .check-block{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);}
  .check-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:8px;}
  .question{margin-bottom:16px;}
  .question:last-child{margin-bottom:0;}
  .q-text{font-weight:600; font-size:14.5px; margin-bottom:9px; color:var(--ink);}
  .opt{display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; margin-bottom:7px; cursor:pointer; font-size:14px; color:#33405c;}
  .opt:hover{border-color:#b8b6a4;}
  .opt.selected{border-color:var(--ink); background:#F7F7F2; box-shadow:inset 0 0 0 1px var(--ink);}
  .opt.correct{border-color:var(--teal); background:var(--teal-soft); color:var(--teal); font-weight:600;}
  .opt.incorrect{border-color:var(--red); background:var(--red-soft); color:var(--red); font-weight:600;}
  .opt.disabled{cursor:default;}
  .opt-bullet{width:16px;height:16px;border-radius:50%;border:1.5px solid #b8b6a4;flex:none;margin-top:1px;}
  .opt.selected .opt-bullet{border-color:var(--ink); background:var(--ink); box-shadow:inset 0 0 0 3px #fff;}
  .opt.correct .opt-bullet{border-color:var(--teal); background:var(--teal);}
  .opt.incorrect .opt-bullet{border-color:var(--red); background:var(--red);}
  .feedback{margin-top:6px; padding:9px 12px; border-radius:7px; font-size:13.3px; background:#F7F7F2; color:#4a5670; border-left:3px solid var(--ink-soft);}
  .feedback.right{border-left-color:var(--teal); color:#1a4437;}
  .feedback.wrong{border-left-color:var(--red); color:#6e2a2a;}

  .evidence-box{background:var(--evi-soft); border:1px solid #cfc0df; border-radius:10px; padding:20px 24px; margin:6px 0 22px;}
  .evidence-box h4{font-family:'Source Serif 4',serif; font-size:17px; margin:0 0 4px; color:var(--evi); display:flex; align-items:center; gap:8px;}
  .evidence-box p.sub{font-size:12.8px; color:#4a3d61; margin:0 0 12px;}
  .evidence-box ul{margin:0; padding-left:20px;}
  .app.rtl .evidence-box ul{padding-left:0; padding-right:20px;}
  .evidence-box li{font-size:13.6px; color:#3a2f4d; margin-bottom:6px;}

  .exam-cta{background:var(--gold-soft); border:1px solid #e6cf9e; border-radius:10px; padding:22px 26px; text-align:center; margin-top:8px;}
  .exam-cta.locked{background:#F1F1EA; border-color:var(--line);}
  .module-locked-box{background:#F1F1EA; border:1.5px dashed var(--line); border-radius:12px; padding:32px 28px; text-align:center; margin-bottom:22px;}
  .module-locked-box .lock-icon{font-size:26px; margin-bottom:8px;}
  .module-locked-box h4{margin:0 0 6px; font-size:15px; color:var(--ink-soft);}
  .module-locked-box p{margin:0; font-size:13.5px; color:var(--ink-soft); max-width:480px; margin-left:auto; margin-right:auto;}
  .video-wrap{position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; margin:14px 0 18px; background:#000;}
  .video-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .exam-cta h4{font-family:'Source Serif 4',serif; font-size:19px; margin:0 0 6px; color:var(--ink);}
  .exam-cta p{color:var(--ink-soft); font-size:13.8px; margin:0 0 14px;}
  button.btn{font-family:'Inter',sans-serif; font-weight:600; font-size:14px; background:var(--wb); color:#fff; border:none; border-radius:7px; padding:11px 22px; cursor:pointer;}
  .app.rtl button.btn{font-family:'IBM Plex Sans Arabic',sans-serif;}
  button.btn:hover{background:#234a70;}
  button.btn:disabled{background:#c7c6bb; cursor:not-allowed;}
  button.btn.ghost{background:transparent; color:var(--wb); border:1.5px solid var(--wb);}
  button.btn.ghost:hover{background:#fff;}

  .exam-head{margin-bottom:16px;}
  .exam-head .eyebrow2{font-family:'IBM Plex Mono',monospace; color:var(--red); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;}
  .exam-head h2{font-family:'Source Serif 4',serif; font-size:24px; margin:6px 0 4px;}
  .exam-head p{color:var(--ink-soft); font-size:13.8px; margin:0;}
  .exam-progress{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin:10px 0 18px;}
  .submit-row{display:flex; justify-content:flex-end; margin-top:8px;}
  .app.rtl .submit-row{justify-content:flex-start;}

  .results{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:34px 30px; text-align:center; box-shadow:var(--shadow);}
  .stamp{display:inline-block; border:3px double var(--teal); color:var(--teal); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:20px; padding:14px 26px; border-radius:10px; transform:rotate(-4deg); letter-spacing:.06em; margin-bottom:16px; animation:stampIn .35s ease-out;}
  .stamp.fail{border:2px solid var(--red); color:var(--red); border-style:solid;}
  @keyframes stampIn{ from{transform:rotate(-4deg) scale(1.6); opacity:0;} to{transform:rotate(-4deg) scale(1); opacity:1;} }
  .score-line{font-family:'Source Serif 4',serif; font-size:22px; margin:6px 0 4px;}
  .score-sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
  .review-list{text-align:left; max-width:660px; margin:0 auto 22px; border-top:1px solid var(--line); padding-top:16px;}
  .app.rtl .review-list{text-align:right;}
  .review-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.8px;}
  .review-item:last-child{border-bottom:none;}
  .review-tag{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--wb); flex:none; width:56px;}
  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  footer.foot{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:#8b8f7f; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  a.reset-link{color:#8b8f7f; text-decoration:underline; cursor:pointer;}

  .final-banner{background:linear-gradient(135deg,#2E5C8A,#4874A8); color:#fff; border-radius:12px; padding:30px 28px; text-align:center; margin-top:24px;}
  .final-banner h2{font-family:'Source Serif 4',serif; font-size:26px; margin:0 0 8px;}
  .final-banner p{color:#dde6f4; font-size:14.5px; max-width:560px; margin:0 auto;}

  .name-gate{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:40px 34px; text-align:center; max-width:480px; margin:40px auto; box-shadow:var(--shadow); }
  .name-gate h4{ font-family:'Source Serif 4',serif; font-size:20px; margin:0 0 8px; color:var(--ink); }
  .name-gate p{ color:var(--ink-soft); font-size:13.8px; margin:0 0 18px; }
  .name-gate input{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:7px; font-family:'Inter',sans-serif; font-size:14.5px; margin-bottom:14px; box-sizing:border-box; }
  .name-gate input:focus{ outline:none; border-color:var(--wb); }
  .cert-wrap{ max-width:760px; margin:20px auto; }
  .cert-back{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); cursor:pointer; margin-bottom:16px; display:inline-block; text-decoration:underline; }
  .certificate{ background:#fff; border:2px solid var(--wb); border-radius:6px; padding:6px; }
  .certificate-inner{ border:1px solid var(--wb); padding:48px 50px; text-align:center; position:relative; }
  .cert-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--wb); margin-bottom:18px; }
  .cert-logo{ width:64px; height:64px; border-radius:50%; object-fit:cover; margin:0 auto 16px; display:block; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .cert-title{ font-family:'Source Serif 4',serif; font-weight:700; font-size:28px; color:var(--ink); margin:0 0 26px; }
  .cert-presented{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.04em; }
  .cert-name{ font-family:'Source Serif 4',serif; font-style:italic; font-size:32px; color:var(--wb); margin:6px 0 22px; border-bottom:1px solid var(--line); display:inline-block; padding:0 20px 10px; }
  .cert-body{ font-size:14.5px; color:#33405c; max-width:540px; margin:0 auto 26px; line-height:1.6; text-align:justify; }
  .cert-body b{ color:var(--ink); }
  .cert-meta-row{ display:flex; justify-content:center; gap:40px; margin:26px 0 30px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .cert-meta-row div strong{ display:block; color:var(--ink); font-size:13px; font-family:'Inter',sans-serif; margin-top:3px; }
  .cert-seal{ width:78px; height:78px; border-radius:50%; border:2px double var(--wb); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--wb); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:10.5px; text-align:center; line-height:1.3; }
  .cert-actions{ margin-top:26px; display:flex; gap:10px; justify-content:center; }

  @media print{
    body{ background:#fff; }
    .app > header.topbar, .layout > nav.sidebar, .cert-back, .cert-actions, footer.foot, .lang-switch { display:none !important; }
    .app{ padding:0; max-width:none; }
    .layout{ display:block; }
    .certificate{ box-shadow:none; }
    .cert-wrap{ margin:0; max-width:none; }
  }

   work on any real web host (Google Sites, Drive, etc.) using standard localStorage. */
if (!window.storage) {
  window.storage = {
    get: async function(key){
      try { var v = localStorage.getItem(key); return v === null ? null : { key: key, value: v }; }
      catch(e){ return null; }
    },
    set: async function(key, value){
      try { localStorage.setItem(key, value); return { key: key, value: value }; }
      catch(e){ return null; }
    },
    delete: async function(key){
      try { localStorage.removeItem(key); return { key: key, deleted: true }; }
      catch(e){ return null; }
    }
  };
}

  {

    "options": [
      "لا يوجد فرق — يُرسَل الخطاب ذاته",
      "يُتصل بأولياء الأمور هاتفياً ويُطلب اصطحاب الطفل فوراً",
      "يُبلَّغ معلم الفصل فقط",
      "يُعزَل الطالب لبقية الفصل الدراسي"
    ],
    "correct": 1,
    "explain": "القمل الحي تصعيد حقيقي يستدعي مكالمة هاتفية واصطحاباً في اليوم نفسه.",
    "tag": "5"
  }

const PASS_THRESHOLD = 0.8;
let progress = null, currentView = "concepts", examAnswers = {}, lastResult = null, storageReady = false;
let wrongAttempts = {}; // transient, per-question: last incorrect pick, NOT persisted -- lets a student retry until correct
const STORAGE_KEY = "cpd-health-safety-partb-progress-bilingual";

function defaultProgress(){ return { checks:{}, examAttempts:0, examBest:0, examPassed:false, certName:"", lang:"en" }; }
async function loadProgress(){
  try{ const res = await window.storage.get(STORAGE_KEY); progress = (res && res.value) ? Object.assign(defaultProgress(), JSON.parse(res.value)) : defaultProgress(); }
  catch(e){ progress = defaultProgress(); }
  storageReady = true; render();
}
async function saveProgress(){ try{ await window.storage.set(STORAGE_KEY, JSON.stringify(progress)); }catch(e){} }
function L(){ return progress.lang === "ar" ? STR.ar : STR.en; }
function G(){ return progress.lang === "ar" ? GROUPS_AR : GROUPS_EN; }
function E(){ return progress.lang === "ar" ? EXAM_AR : EXAM_EN; }
function checksTotal(){ let n=0; G().forEach(g=>g.concepts.forEach(c=>n+=c.checks.length)); return n; }
function checksAnswered(){ let n=0; G().forEach((g,gi)=>g.concepts.forEach((c,ci)=>c.checks.forEach((chk,qi)=>{ if(progress.checks[gi+"_"+ci+"_"+qi]!==undefined) n++; }))); return n; }
function allChecksDone(){ return checksAnswered()===checksTotal(); }
function isGroupComplete(gi){
  const g=G()[gi];
  return g.concepts.every((c,ci)=>c.checks.every((chk,qi)=>progress.checks[gi+"_"+ci+"_"+qi]!==undefined));
}
function isGroupUnlocked(gi){
  if(gi===0) return true;
  for(let i=0;i<gi;i++){ if(!isGroupComplete(i)) return false; }
  return true;
}
function toggleLang(){ progress.lang = progress.lang==="ar" ? "en" : "ar"; saveProgress(); render(); }
function answerCheck(gi,ci,qi,optIdx){
  const key=gi+"_"+ci+"_"+qi;
  if(progress.checks[key]!==undefined) return; // already answered correctly and locked in
  const chk = G()[gi].concepts[ci].checks[qi];
  if(optIdx === chk.correct){
    progress.checks[key]=optIdx;
    delete wrongAttempts[key];
    saveProgress();
  } else {
    wrongAttempts[key]=optIdx; // remember the wrong pick just long enough to show feedback; question stays open for retry
  }
  render();
}
function startExam(){ examAnswers={}; currentView="exam"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function selectExamAnswer(qi,optIdx){ examAnswers[qi]=optIdx; render(); }
function submitExam(){
  const exam=E(); const total=exam.length; let correct=0; const review=[];
  exam.forEach((q,qi)=>{ const chosen=examAnswers[qi]; const isRight=chosen===q.correct; if(isRight) correct++; else review.push({tag:q.tag,q:q.q,explain:q.explain,correctText:q.options[q.correct]}); });
  const pct=Math.round((correct/total)*100); const passed=(correct/total)>=PASS_THRESHOLD;
  progress.examAttempts+=1; progress.examBest=Math.max(progress.examBest,pct); if(passed) progress.examPassed=true;
  saveProgress(); lastResult={correct,total,pct,passed,review}; currentView="results"; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function retakeExam(){ startExam(); }
function backToConcepts(){ currentView="concepts"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
async function resetProgress(){
  if(!confirm("Reset your progress on this module? / \u0625\u0639\u0627\u062f\u0629 \u062a\u0639\u064a\u064a\u0646 \u062a\u0642\u062f\u0645\u0643 \u0641\u064a \u0647\u0630\u0647 \u0627\u0644\u0648\u062d\u062f\u0629\u061f")) return;
  const lang = progress.lang; progress=defaultProgress(); progress.lang=lang; currentView="concepts";
  try{ await window.storage.delete(STORAGE_KEY); }catch(e){}
  saveProgress(); render();
}
function scrollToConcept(gi,ci){ if(!isGroupUnlocked(gi)) return; currentView="concepts"; render(); setTimeout(()=>{ const el=document.getElementById("concept-"+gi+"-"+ci); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); },30); }
function openCertificate(){ currentView="certificate"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function submitCertName(){ const input=document.getElementById("cert-name-input"); const val=input?input.value.trim():""; if(!val) return; progress.certName=val; saveProgress(); render(); }
function editCertName(){ progress.certName=""; render(); }
function backFromCertificate(){ currentView="concepts"; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function printCertificate(){ window.print(); }
function downloadCertPDF(btn){
  const certEl = document.getElementById('certificate-print-area');
  if(!certEl){ alert('Please generate your certificate first.'); return; }
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    alert('The PDF download tool could not load (this can happen with no internet connection). Please try the Print / Save as PDF option instead.');
    return;
  }
  const originalText = btn.textContent;
  btn.textContent = 'Preparing PDF...';
  btn.disabled = true;
  try {
  html2canvas(certEl, { scale:2, backgroundColor:'#ffffff', useCORS:true }).then(function(canvas){
    const imgData = canvas.toDataURL('image/png');
    const jsPDFCtor = window.jspdf.jsPDF;
    const pdf = new jsPDFCtor({
      orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save('CPD_Certificate.pdf');
    btn.textContent = originalText;
    btn.disabled = false;
  }).catch(function(err){
    console.error('PDF generation failed:', err);
    alert('Sorry, something went wrong generating the PDF. Please try the Print / Save as PDF option instead.');
    btn.textContent = originalText;
    btn.disabled = false;
  });
  } catch(err){
    console.error(err);
    btn.textContent = originalText;
    btn.disabled = false;
    alert('Sorry, something went wrong generating the PDF. Please try the Print / Save as PDF option instead.');
  }
}
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  const app=document.getElementById("app");
  if(!storageReady){ app.innerHTML='<div style="padding:80px 0; text-align:center; color:#8b8f7f;">...</div>'; return; }
  if(currentView==="certificate"){
    app.className = "app";
    document.documentElement.setAttribute("dir","ltr");
    app.innerHTML=renderCertificateFlow();
    return;
  }
  app.className = "app" + (progress.lang==="ar" ? " rtl" : "");
  document.documentElement.setAttribute("dir", progress.lang==="ar" ? "rtl" : "ltr");
  app.innerHTML = renderHeader() + '<div class="layout"><nav class="sidebar">'+renderSidebar()+'</nav><main class="content">'+renderMain()+'</main></div>' + renderFooter();
}
function renderHeader(){
  const s=L();
  return '<header class="topbar">'+
    '<label class="lang-switch">'+
      '<span class="lbl'+(progress.lang==="en"?" active":"")+'">EN</span>'+
      '<span class="switch"><input type="checkbox" '+(progress.lang==="ar"?"checked":"")+' onchange="toggleLang()"><span class="slider"></span></span>'+
      '<span class="lbl'+(progress.lang==="ar"?" active":"")+'">\u0639\u0631\u0628\u064a</span>'+
    '</label>'+
    '<div class="eyebrow">'+s.eyebrow+'</div>'+
    '<h1 class="programme-title">'+s.title+'</h1>'+
    '<p class="programme-sub">'+s.sub+'</p>'+
    '<div class="prereq">'+s.prereqLbl+' &nbsp;|&nbsp; '+s.duration+'</div>'+
    '<div class="disclaimer">'+s.disclaimer+'</div>'+
    '</header>';
}
function renderSidebar(){
  const s=L(); const groups=G();
  let html='<div class="sb-head">'+s.thisModule+'</div>';
  groups.forEach((g,gi)=>{
    const groupUnlocked=isGroupUnlocked(gi);
    g.concepts.forEach((c,ci)=>{
      const done=c.checks.every((chk,qi)=>progress.checks[gi+"_"+ci+"_"+qi]!==undefined);
      if(!groupUnlocked){
        html+='<div class="sb-item locked" title="'+s.moduleLockedH+'">'+
          '<div class="sb-mark">\uD83D\uDD12</div>'+
          '<div><div class="sb-item-title">'+c.title+'</div><div class="sb-item-meta">'+g.code+'</div></div>'+
          '</div>';
      } else {
        html+='<div class="sb-item" onclick="scrollToConcept('+gi+','+ci+')">'+
          '<div class="sb-mark'+(done?" done":"")+'">'+(done?"\u2713":(ci+1))+'</div>'+
          '<div><div class="sb-item-title">'+c.title+'</div><div class="sb-item-meta">'+g.code+'</div></div>'+
          '</div>';
      }
    });
  });
  const examDone=progress.examPassed;
  html+='<div class="sb-item" onclick="'+(allChecksDone()?"startExam()":"")+'">'+
    '<div class="sb-mark'+(examDone?" passed":"")+'">'+(examDone?"\u2713":"E")+'</div>'+
    '<div><div class="sb-item-title">'+s.moduleExam+'</div><div class="sb-item-meta">'+(examDone?s.passedLbl+" \u00b7 "+progress.examBest+"%":(allChecksDone()?s.readyLbl:s.lockedLbl))+'</div></div>'+
    '</div>';
  return html;
}
function renderMain(){
  if(currentView==="exam") return renderExam();
  if(currentView==="results") return renderResults();
  return renderConcepts();
}
function renderModuleHead(){
  const s=L();
  return '<div class="module-head"><div class="code">'+s.selfPaced+s.duration+'</div><h2>'+s.title+'</h2><p>'+s.moduleHeadP+'</p></div>';
}
function renderConcepts(){
  const s=L(); const groups=G();
  let html=renderModuleHead();
  groups.forEach((g,gi)=>{
    const unlocked=isGroupUnlocked(gi);
    html+='<div class="indicator-head"><div class="code">'+s.indicatorLbl+g.code+'</div><h3>'+g.title+'</h3></div>';
    if(!unlocked){
      const prevTitle=groups[gi-1].title;
      html+='<div class="module-locked-box"><div class="lock-icon">\uD83D\uDD12</div><h4>'+s.moduleLockedH+'</h4><p>'+s.moduleLockedP(prevTitle)+'</p></div>';
      return;
    }
    html+='<p style="color:#4a5670; font-size:14.3px; max-width:760px; margin:0 0 16px;">'+g.intro+'</p>';
    g.concepts.forEach((c,ci)=>{
      html+='<div class="concept" id="concept-'+gi+'-'+ci+'">';
      html+='<div class="concept-num">'+g.code+' \u00b7 '+s.topicOf(ci+1,g.concepts.length)+'</div>';
      html+='<h3>'+c.title+'</h3>';
      if(c.video){
        html+='<div class="video-wrap"><iframe src="https://www.youtube.com/embed/'+c.video+'" title="'+c.title+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
      }
      c.body.forEach(p=>html+='<p>'+p+'</p>');
      html+='<div class="check-block"><div class="check-label">'+s.checkUnderstanding+'</div>';
      c.checks.forEach((chk,qi)=>html+=renderCheckQuestion(gi,ci,qi,chk));
      html+='</div></div>';
    });
    html+='<div class="evidence-box"><h4>'+s.evidenceTitle+g.code+'</h4>'+
      '<p class="sub">'+s.evidenceSub+'</p>'+
      '<ul>'+g.evidence.map(e=>'<li>'+e+'</li>').join("")+'</ul></div>';
  });
  const ready=allChecksDone();
  html+='<div class="exam-cta'+(ready?"":" locked")+'">';
  if(progress.examPassed){
    html+='<h4>'+s.examPassedH(progress.examBest)+'</h4><p>'+s.examPassedP+'</p>';
    html+='<div class="btn-row"><button class="btn ghost" onclick="startExam()">'+s.retakeExam+'</button><button class="btn" onclick="openCertificate()">'+s.getCert+'</button></div>';
  } else if(ready){
    html+='<h4>'+s.readyH+'</h4><p>'+s.readyP(groups.reduce((a,g)=>a+g.concepts.length,0),progress.examAttempts,progress.examBest)+'</p>';
    html+='<button class="btn" onclick="startExam()">'+s.startExamBtn(progress.examAttempts)+'</button>';
  } else {
    html+='<h4>'+s.lockedH+'</h4><p>'+s.lockedP(checksAnswered(),checksTotal())+'</p>';
  }
  html+='</div>';
  if(progress.examPassed){
    html+='<div class="final-banner"><h2>'+s.finalH+'</h2><p>'+s.finalP+'</p></div>';
  }
  return html;
}
function renderCheckQuestion(gi,ci,qi,chk){
  const s=L();
  const key=gi+"_"+ci+"_"+qi; const locked=progress.checks[key]; const wrongPick=wrongAttempts[key];
  let html='<div class="question"><div class="q-text">'+chk.q+'</div>';
  chk.options.forEach((opt,oi)=>{
    let cls="opt";
    let onclick;
    if(locked!==undefined){
      cls+=" disabled";
      if(oi===chk.correct) cls+=" correct";
      onclick="";
    } else {
      onclick="answerCheck("+gi+","+ci+","+qi+","+oi+")";
      if(wrongPick===oi) cls+=" incorrect";
    }
    html+='<div class="'+cls+'" onclick="'+onclick+'"><div class="opt-bullet"></div><div>'+opt+'</div></div>';
  });
  if(locked!==undefined){
    html+='<div class="feedback right">'+s.correctPrefix+chk.explain+'</div>';
  } else if(wrongPick!==undefined){
    html+='<div class="feedback wrong">'+s.wrongPrefix+s.tryAgainHint+'</div>';
  }
  html+='</div>';
  return html;
}
function renderExam(){
  const s=L(); const exam=E();
  let html='<div class="exam-head"><div class="eyebrow2">'+s.examEyebrow+'</div><h2>'+s.title+'</h2><p>'+s.examHeadP(exam.length,Math.round(PASS_THRESHOLD*100))+'</p></div>';
  const answeredCount=Object.keys(examAnswers).length;
  html+='<div class="exam-progress">'+s.answeredOf(answeredCount,exam.length)+'</div>';
  html+='<div class="concept">';
  exam.forEach((q,qi)=>{
    html+='<div class="question"><div class="q-text">'+(qi+1)+'. '+q.q+' <span style="color:#2E5C8A;font-family:IBM Plex Mono,monospace;font-size:11px;">['+q.tag+']</span></div>';
    q.options.forEach((opt,oi)=>{
      const sel=examAnswers[qi]===oi;
      html+='<div class="opt'+(sel?" selected":"")+'" onclick="selectExamAnswer('+qi+','+oi+')"><div class="opt-bullet"></div><div>'+opt+'</div></div>';
    });
    html+='</div>';
  });
  html+='</div>';
  const allAnswered=answeredCount===exam.length;
  html+='<div class="submit-row"><button class="btn" '+(allAnswered?'':'disabled')+' onclick="submitExam()">'+s.submitExam+'</button></div>';
  return html;
}
function renderResults(){
  const s=L(); const r=lastResult;
  let html='<div class="results">';
  html+='<div class="stamp'+(r.passed?"":" fail")+'">'+(r.passed?s.completedStamp:s.failStamp)+'</div>';
  html+='<div class="score-line">'+s.scoreLine(r.correct,r.total,r.pct)+'</div>';
  html+='<div class="score-sub">'+(r.passed?s.passedSub:s.failSub(Math.round(PASS_THRESHOLD*100)))+'</div>';
  if(r.review.length){
    html+='<div class="review-list">';
    r.review.forEach(item=>{
      html+='<div class="review-item"><div class="review-tag">'+item.tag+'</div><div><strong>'+item.q+'</strong><br>'+s.correctAnswerLbl+item.correctText+'. '+item.explain+'</div></div>';
    });
    html+='</div>';
  }
  html+='<div class="btn-row">';
  html+='<button class="btn ghost" onclick="backToConcepts()">'+s.backToModule+'</button>';
  if(!r.passed){ html+='<button class="btn" onclick="retakeExam()">'+s.retakeExam+'</button>'; }
  else { html+='<button class="btn" onclick="openCertificate()">'+s.getCert+'</button>'; }
  html+='</div></div>';
  return html;
}
function renderCertificateFlow(){
  const s=STR.en; /* certificate is always issued in English, regardless of the language toggle */
  if(!progress.certName){
    return '<div class="app">'+'<div class="name-gate">'+
      '<h4>'+s.oneStep+'</h4>'+
      '<p>'+s.enterName+'</p>'+
      '<input id="cert-name-input" type="text" placeholder="'+s.fullNamePh+'" autofocus>'+
      '<div class="btn-row"><button class="btn ghost" onclick="backFromCertificate()">'+s.cancel+'</button><button class="btn" onclick="submitCertName()">'+s.cont+'</button></div>'+
      '</div></div>';
  }
  return renderCertificate();
}
function renderCertificate(){
  const s=STR.en; /* certificate is always issued in English, regardless of the language toggle */
  const dateStr=new Date().toLocaleDateString(undefined, {year:"numeric",month:"long",day:"numeric"});
  return '<div class="app"><div class="cert-wrap">'+
    '<a class="cert-back" onclick="backFromCertificate()">'+s.backArrow+'</a>'+
    '<div class="certificate" id="certificate-print-area"><div class="certificate-inner">'+
      '<img class="cert-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">'+
      '<div class="cert-eyebrow">'+s.certEyebrow+'</div>'+
      '<div class="cert-seal">'+s.certSeal+'</div>'+
      '<div class="cert-title">'+s.certTitle+'</div>'+
      '<div class="cert-presented">'+s.certPresented+'</div>'+
      '<div class="cert-name">'+escapeHtml(progress.certName)+'</div>'+
      '<div class="cert-body">'+s.certBody+'</div>'+
      '<div class="cert-meta-row">'+
        '<div>'+s.scoreLbl+'<strong>'+progress.examBest+'%</strong></div>'+
        '<div>'+s.dateLbl+'<strong>'+dateStr+'</strong></div>'+
      '</div>'+
    '</div></div>'+
    '<div class="cert-actions"><button class="btn ghost" onclick="downloadCertPDF(this)">'+s.downloadCert+'</button><button class="btn" onclick="printCertificate()">'+s.printCert+'</button></div>'+
    '</div></div>';
}
function renderFooter(){
  const s=L();
  return '<footer class="foot"><span>'+s.footProgress+'</span><a class="reset-link" onclick="resetProgress()">'+s.resetLink+'</a></footer>';
}
loadProgress();
</script>
