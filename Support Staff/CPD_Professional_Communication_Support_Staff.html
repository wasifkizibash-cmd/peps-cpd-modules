#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"support-professional-communication","code":"SPR","passMark":80,"hours":"1.25 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · Support Staff · Professional Communication","ar":"Staff CPD · Support Staff · Professional Communication"},"title":{"en":"Professional Communication at Work","ar":"Professional Communication at Work"},"subtitle":{"en":"A practical guide for non-teaching staff: clear and courteous writing, speaking and phone skills, working well with colleagues and line managers, and how to raise problems the right way.","ar":"A practical guide for non-teaching staff: clear and courteous writing, speaking and phone skills, working well with colleagues and line managers, and how to raise problems the right way."},"durationLabel":{"en":"About 1 hour 15 minutes, fully self-paced","ar":"About 1 hour 15 minutes, fully self-paced"},"standard":{"en":"Professional conduct and communication · Good practice for school support staff","ar":"Professional conduct and communication · Good practice for school support staff"},"source":{"en":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)","ar":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"What Professional Communication Means","ar":"What Professional Communication Means"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose of this CPD","ar":"Purpose of this CPD"},"c":{"en":"Good communication keeps pupils safe, helps parents trust the school and makes work easier for everyone. This CPD is for all support staff: reception, accounts, drivers, security, facilities, canteen, library, laboratory and teaching assistants. By the end you will be able to write clear emails and messages, speak politely on the phone and in meetings, work well with colleagues, and report problems in the right way. \u003cstrong>This CPD supports, and does not replace, the school's own policies and your line manager's instructions.\u003c/strong>","ar":"Good communication keeps pupils safe, helps parents trust the school and makes work easier for everyone. This CPD is for all support staff: reception, accounts, drivers, security, facilities, canteen, library, laboratory and teaching assistants. By the end you will be able to write clear emails and messages, speak politely on the phone and in meetings, work well with colleagues, and report problems in the right way. \u003cstrong>This CPD supports, and does not replace, the school's own policies and your line manager's instructions.\u003c/strong>"}},{"t":"h","c":{"en":"Four qualities of good communication","ar":"Four qualities of good communication"}},{"t":"p","c":{"en":"Professional communication does not mean using difficult words or a formal voice. It means that the other person understands you, feels respected and can trust what you say. Four qualities help.","ar":"Professional communication does not mean using difficult words or a formal voice. It means that the other person understands you, feels respected and can trust what you say. Four qualities help."}},{"t":"table","head":{"en":["Quality","What it means","Example"],"ar":["Quality","What it means","Example"]},"rows":[{"en":["Clarity","Say what you mean in simple, short words. Give the main point first","\"The bus will be 15 minutes late\" is clearer than a long explanation about traffic"],"ar":["Clarity","Say what you mean in simple, short words. Give the main point first","\"The bus will be 15 minutes late\" is clearer than a long explanation about traffic"]},{"en":["Courtesy","Be polite, patient and kind, even when you are busy or the other person is upset","Greet people, say please and thank you, and do not raise your voice"],"ar":["Courtesy","Be polite, patient and kind, even when you are busy or the other person is upset","Greet people, say please and thank you, and do not raise your voice"]},{"en":["Accuracy","Give correct facts. Check names, dates, numbers and places before you say or send them","Check the bus number before you tell a parent"],"ar":["Accuracy","Give correct facts. Check names, dates, numbers and places before you say or send them","Check the bus number before you tell a parent"]},{"en":["Respect","Treat every person as important, whatever their job, age, language or culture","Speak to a cleaner and a Vice Principal with the same politeness"],"ar":["Respect","Treat every person as important, whatever their job, age, language or culture","Speak to a cleaner and a Vice Principal with the same politeness"]}]},{"t":"h","c":{"en":"A multicultural workplace","ar":"A multicultural workplace"}},{"t":"p","c":{"en":"At PEPS, staff, pupils and parents come from many countries. People have different first languages, customs and ways of showing respect. Some people look directly at you when they speak, and some do not. Some like quick, direct answers, and some prefer a gentler style. None of these is wrong.","ar":"At PEPS, staff, pupils and parents come from many countries. People have different first languages, customs and ways of showing respect. Some people look directly at you when they speak, and some do not. Some like quick, direct answers, and some prefer a gentler style. None of these is wrong."}},{"t":"list","c":{"en":["Use simple, clear English. Avoid slang and jokes that others may not understand.","Speak a little slower, not louder, when someone is learning English.","Do not make fun of accents, names, clothing or customs.","Use a person's name correctly. If you are unsure how to say it, ask kindly.","If you share a language with a colleague, be careful about using it in front of others in a way that makes them feel left out."],"ar":["Use simple, clear English. Avoid slang and jokes that others may not understand.","Speak a little slower, not louder, when someone is learning English.","Do not make fun of accents, names, clothing or customs.","Use a person's name correctly. If you are unsure how to say it, ask kindly.","If you share a language with a colleague, be careful about using it in front of others in a way that makes them feel left out."]}},{"t":"callout","k":"tip","title":{"en":"It is fine to say \"I do not understand\"","ar":"It is fine to say \"I do not understand\""},"c":{"en":"Nobody expects perfect English. If you do not understand, say so politely: \"Sorry, could you say that again, please?\" This is a sign of a careful professional, not a weak one.","ar":"Nobody expects perfect English. If you do not understand, say so politely: \"Sorry, could you say that again, please?\" This is a sign of a careful professional, not a weak one."}},{"t":"scenario","title":{"en":"Scenario: the upset parent at reception","ar":"Scenario: the upset parent at reception"},"c":{"en":"A parent arrives at reception in a loud voice. His son missed the bus and he had to drive to school. The receptionist is busy with the phone. \u003cstrong>What should she do?\u003c/strong> She should stop, make eye contact and say calmly, \"Good morning. I am sorry about the bus. Please tell me what happened and I will help you.\" She should listen without interrupting, avoid arguing, and say what she will do next, for example inform the transport supervisor and ask someone to call him. If he becomes abusive or she feels unsafe, she should call a senior colleague for help.","ar":"A parent arrives at reception in a loud voice. His son missed the bus and he had to drive to school. The receptionist is busy with the phone. \u003cstrong>What should she do?\u003c/strong> She should stop, make eye contact and say calmly, \"Good morning. I am sorry about the bus. Please tell me what happened and I will help you.\" She should listen without interrupting, avoid arguing, and say what she will do next, for example inform the transport supervisor and ask someone to call him. If he becomes abusive or she feels unsafe, she should call a senior colleague for help."}},{"t":"callout","k":"warn","title":{"en":"Calm voice, calm situation","ar":"Calm voice, calm situation"},"c":{"en":"A raised voice from you usually makes the other person louder. Slow down, lower your voice and keep your words simple. You are allowed to ask for help from your line manager if a person is abusive.","ar":"A raised voice from you usually makes the other person louder. Slow down, lower your voice and keep your words simple. You are allowed to ask for help from your line manager if a person is abusive."}}],"checks":[{"id":"m1q1","q":{"en":"Which sentence shows clarity?","ar":"Which sentence shows clarity?"},"opts":[{"en":"\"The school bus for Year 5 will be 15 minutes late today.\"","ar":"\"The school bus for Year 5 will be 15 minutes late today.\""},{"en":"\"There may be some kind of delay with some transport, possibly today.\"","ar":"\"There may be some kind of delay with some transport, possibly today.\""},{"en":"\"As you are surely aware, vehicles are sometimes affected by circumstances.\"","ar":"\"As you are surely aware, vehicles are sometimes affected by circumstances.\""},{"en":"\"Something has happened on the road, so please wait and see.\"","ar":"\"Something has happened on the road, so please wait and see.\""}],"correct":0,"expl":{"en":"Clear communication gives the main point with the key facts: who, what and how long. The other sentences are vague and leave the listener unsure.","ar":"Clear communication gives the main point with the key facts: who, what and how long. The other sentences are vague and leave the listener unsure."}},{"id":"m1q2","q":{"en":"A new colleague speaks English as a second language and often asks you to repeat things. What is the best response?","ar":"A new colleague speaks English as a second language and often asks you to repeat things. What is the best response?"},"opts":[{"en":"Speak much louder so that the colleague can hear every word you say in the room","ar":"Speak much louder so that the colleague can hear every word you say in the room"},{"en":"Repeat slowly and simply, and check that they understand","ar":"Repeat slowly and simply, and check that they understand"},{"en":"Tell them that they must improve their English before they ask again","ar":"Tell them that they must improve their English before they ask again"},{"en":"Stop talking to them and write messages to them only in future","ar":"Stop talking to them and write messages to them only in future"}],"correct":1,"expl":{"en":"Respect means patience. Slower, simpler speech helps. Loud voices, unkind comments or avoiding the person make communication worse.","ar":"Respect means patience. Slower, simpler speech helps. Loud voices, unkind comments or avoiding the person make communication worse."}},{"id":"m1q3","q":{"en":"A colleague from another culture does not look at you when you speak. What should you think?","ar":"A colleague from another culture does not look at you when you speak. What should you think?"},"opts":[{"en":"It is clear that they are not interested in anything that you say to them","ar":"It is clear that they are not interested in anything that you say to them"},{"en":"It shows that they do not respect people who have a lower position","ar":"It shows that they do not respect people who have a lower position"},{"en":"It may be a polite habit in their culture, so do not judge them as rude","ar":"It may be a polite habit in their culture, so do not judge them as rude"},{"en":"It means they are hiding something and should be reported to the manager","ar":"It means they are hiding something and should be reported to the manager"}],"correct":2,"expl":{"en":"Customs about eye contact are different around the world. Professional staff do not make quick judgements about other people's habits.","ar":"Customs about eye contact are different around the world. Professional staff do not make quick judgements about other people's habits."}}]},{"id":"m2","title":{"en":"Writing Emails and Messages","ar":"Writing Emails and Messages"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Many support staff write emails and messages each day: to parents, to colleagues, to suppliers and to managers. A written message stays for a long time, can be forwarded, and cannot be taken back. It is worth a few extra moments.","ar":"Many support staff write emails and messages each day: to parents, to colleagues, to suppliers and to managers. A written message stays for a long time, can be forwarded, and cannot be taken back. It is worth a few extra moments."}},{"t":"h","c":{"en":"A simple structure for a short email","ar":"A simple structure for a short email"}},{"t":"steps","c":{"en":["\u003cstrong>Subject line:\u003c/strong> say what the email is about in a few words. For example, \"Year 6 trip: payment due Thursday\". Avoid \"Hello\" or \"Urgent!!!\".","\u003cstrong>Greeting:\u003c/strong> \"Dear Mrs Khan,\" or \"Good morning Ahmed,\". Match the level of formality of the person you are writing to.","\u003cstrong>Main point first:\u003c/strong> put the most important thing in the first sentence.","\u003cstrong>Details:\u003c/strong> keep sentences short. Use a short list for dates or things to do.","\u003cstrong>What happens next:\u003c/strong> say what you need from the reader, and by when.","\u003cstrong>Closing:\u003c/strong> \"Kind regards,\" and your name and job title."],"ar":["\u003cstrong>Subject line:\u003c/strong> say what the email is about in a few words. For example, \"Year 6 trip: payment due Thursday\". Avoid \"Hello\" or \"Urgent!!!\".","\u003cstrong>Greeting:\u003c/strong> \"Dear Mrs Khan,\" or \"Good morning Ahmed,\". Match the level of formality of the person you are writing to.","\u003cstrong>Main point first:\u003c/strong> put the most important thing in the first sentence.","\u003cstrong>Details:\u003c/strong> keep sentences short. Use a short list for dates or things to do.","\u003cstrong>What happens next:\u003c/strong> say what you need from the reader, and by when.","\u003cstrong>Closing:\u003c/strong> \"Kind regards,\" and your name and job title."]}},{"t":"h","c":{"en":"Tone: how your words sound","ar":"Tone: how your words sound"}},{"t":"p","c":{"en":"In writing, people cannot hear your voice, so the words must be kind. Compare these two messages to a parent about a late payment.","ar":"In writing, people cannot hear your voice, so the words must be kind. Compare these two messages to a parent about a late payment."}},{"t":"table","head":{"en":["Harsh","Professional"],"ar":["Harsh","Professional"]},"rows":[{"en":["\"You have not paid. Pay today or there will be problems.\"","\"Good morning Mr Ali. Our records show the trip payment is still due. Could you please let us know when it will be paid? Thank you for your help.\""],"ar":["\"You have not paid. Pay today or there will be problems.\"","\"Good morning Mr Ali. Our records show the trip payment is still due. Could you please let us know when it will be paid? Thank you for your help.\""]}]},{"t":"list","c":{"en":["Write as if the person is in front of you.","Do not write when you are angry. Wait, then write again.","Avoid capital letters for whole sentences (they look like shouting) and too many exclamation marks.","Do not use emojis or jokes in messages to parents or managers, unless the school's style allows it."],"ar":["Write as if the person is in front of you.","Do not write when you are angry. Wait, then write again.","Avoid capital letters for whole sentences (they look like shouting) and too many exclamation marks.","Do not use emojis or jokes in messages to parents or managers, unless the school's style allows it."]}},{"t":"h","c":{"en":"Proofread, attach and reply","ar":"Proofread, attach and reply"}},{"t":"list","c":{"en":["\u003cstrong>Proofread:\u003c/strong> read the message once before you send it. Check the names, dates and numbers. Read it aloud in your head.","\u003cstrong>Attachments:\u003c/strong> check that you attached the right file. Do not send private files by mistake.","\u003cstrong>Reply all:\u003c/strong> use it only when everyone needs to read your answer. Most of the time, reply only to the sender. Replying to all with private or unneeded comments is a common mistake.","\u003cstrong>Copy (cc):\u003c/strong> add people only if they need to know.","\u003cstrong>Reply in time:\u003c/strong> answer within the time the school expects. If you need longer, say \"I have received your message and will reply by Wednesday.\""],"ar":["\u003cstrong>Proofread:\u003c/strong> read the message once before you send it. Check the names, dates and numbers. Read it aloud in your head.","\u003cstrong>Attachments:\u003c/strong> check that you attached the right file. Do not send private files by mistake.","\u003cstrong>Reply all:\u003c/strong> use it only when everyone needs to read your answer. Most of the time, reply only to the sender. Replying to all with private or unneeded comments is a common mistake.","\u003cstrong>Copy (cc):\u003c/strong> add people only if they need to know.","\u003cstrong>Reply in time:\u003c/strong> answer within the time the school expects. If you need longer, say \"I have received your message and will reply by Wednesday.\""]}},{"t":"h","c":{"en":"WhatsApp groups and boundaries","ar":"WhatsApp groups and boundaries"}},{"t":"p","c":{"en":"WhatsApp is fast, but it can blur the line between work and private life. Use only the groups and rules the school approves for work matters. Keep messages short and polite. Do not post private information about pupils or staff in a group. Avoid sending messages late at night or on days off, unless it is an emergency. Do not use a group to complain about a colleague or a manager. If a message is private or serious, speak to the person or use a school email.","ar":"WhatsApp is fast, but it can blur the line between work and private life. Use only the groups and rules the school approves for work matters. Keep messages short and polite. Do not post private information about pupils or staff in a group. Avoid sending messages late at night or on days off, unless it is an emergency. Do not use a group to complain about a colleague or a manager. If a message is private or serious, speak to the person or use a school email."}},{"t":"scenario","title":{"en":"Scenario: reply all","ar":"Scenario: reply all"},"c":{"en":"A manager sends an email to 40 staff about a change in the cleaning schedule. A cleaner replies to all with, \"This is not fair. My supervisor never listens.\" Everyone can read it. \u003cstrong>What should the cleaner have done?\u003c/strong> He should have replied only to the sender, or better, asked his line manager for a private talk. Complaints belong in a private, respectful conversation, not in front of 40 colleagues.","ar":"A manager sends an email to 40 staff about a change in the cleaning schedule. A cleaner replies to all with, \"This is not fair. My supervisor never listens.\" Everyone can read it. \u003cstrong>What should the cleaner have done?\u003c/strong> He should have replied only to the sender, or better, asked his line manager for a private talk. Complaints belong in a private, respectful conversation, not in front of 40 colleagues."}},{"t":"callout","k":"tip","title":{"en":"Three-second check before Send","ar":"Three-second check before Send"},"c":{"en":"Who is it going to? Is the subject right? Is the file the right one? These three questions stop most email mistakes.","ar":"Who is it going to? Is the subject right? Is the file the right one? These three questions stop most email mistakes."}}],"checks":[{"id":"m2q1","q":{"en":"Which subject line is best for an email to the transport supervisor?","ar":"Which subject line is best for an email to the transport supervisor?"},"opts":[{"en":"\"Hello, please read this email as soon as you have some spare time\"","ar":"\"Hello, please read this email as soon as you have some spare time\""},{"en":"\"URGENT!!! PLEASE CALL ME BACK AS SOON AS YOU CAN POSSIBLY DO IT\"","ar":"\"URGENT!!! PLEASE CALL ME BACK AS SOON AS YOU CAN POSSIBLY DO IT\""},{"en":"\"A question about a few things that happened this week at school\"","ar":"\"A question about a few things that happened this week at school\""},{"en":"\"Bus 4: delay on Monday morning and the list of pupils affected\"","ar":"\"Bus 4: delay on Monday morning and the list of pupils affected\""}],"correct":3,"expl":{"en":"A good subject line tells the reader what the email is about in a few words, so they can understand and find it later. The other lines are vague, or look like shouting.","ar":"A good subject line tells the reader what the email is about in a few words, so they can understand and find it later. The other lines are vague, or look like shouting."}},{"id":"m2q2","q":{"en":"A manager sends an email to all staff. You only wish to say \"Thank you, I will do this.\" Who should get your reply?","ar":"A manager sends an email to all staff. You only wish to say \"Thank you, I will do this.\" Who should get your reply?"},"opts":[{"en":"Only the manager who sent it, unless everybody really needs to see your answer","ar":"Only the manager who sent it, unless everybody really needs to see your answer"},{"en":"Every person on the list, so that nobody feels left out by the reply","ar":"Every person on the list, so that nobody feels left out by the reply"},{"en":"Everybody on the list, with the headteacher added to be safe","ar":"Everybody on the list, with the headteacher added to be safe"},{"en":"The manager and your three closest colleagues in the school","ar":"The manager and your three closest colleagues in the school"}],"correct":0,"expl":{"en":"Reply all fills many inboxes with messages that most people do not need. Replying to the sender is the polite, professional choice.","ar":"Reply all fills many inboxes with messages that most people do not need. Replying to the sender is the polite, professional choice."}},{"id":"m2q3","q":{"en":"A colleague sends a rude WhatsApp message in the staff group about a manager at 11 pm. What is the best action?","ar":"A colleague sends a rude WhatsApp message in the staff group about a manager at 11 pm. What is the best action?"},"opts":[{"en":"Reply with a joke so that the colleague does not feel alone in the group chat","ar":"Reply with a joke so that the colleague does not feel alone in the group chat"},{"en":"Do not join in; if worried, speak to your line manager next day","ar":"Do not join in; if worried, speak to your line manager next day"},{"en":"Send a longer message listing every other problem you have seen","ar":"Send a longer message listing every other problem you have seen"},{"en":"Take screenshots and post them on your own social media page","ar":"Take screenshots and post them on your own social media page"}],"correct":1,"expl":{"en":"Group chats are not the place for complaints. Staying out of it and raising concerns privately and calmly is the professional way.","ar":"Group chats are not the place for complaints. Staying out of it and raising concerns privately and calmly is the professional way."}}]},{"id":"m3","title":{"en":"Speaking, Phone Calls and Meetings","ar":"Speaking, Phone Calls and Meetings"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Much of school work happens by voice: at the gate, at the counter, on the radio, on the phone and in meetings. The way you speak and listen shows the school's character.","ar":"Much of school work happens by voice: at the gate, at the counter, on the radio, on the phone and in meetings. The way you speak and listen shows the school's character."}},{"t":"h","c":{"en":"Greeting and listening","ar":"Greeting and listening"}},{"t":"list","c":{"en":["Greet people with a smile and a simple greeting: \"Good morning\", \"Good afternoon\". Use the person's name if you know it.","Give your full attention. Put down your phone and stop other tasks if you can.","Do not interrupt. Let the person finish, then repeat the main point: \"So you need the bus time for tomorrow. Is that right?\"","Use a calm voice and a friendly face, even when you are tired or the day is difficult."],"ar":["Greet people with a smile and a simple greeting: \"Good morning\", \"Good afternoon\". Use the person's name if you know it.","Give your full attention. Put down your phone and stop other tasks if you can.","Do not interrupt. Let the person finish, then repeat the main point: \"So you need the bus time for tomorrow. Is that right?\"","Use a calm voice and a friendly face, even when you are tired or the day is difficult."]}},{"t":"h","c":{"en":"Asking for clarification","ar":"Asking for clarification"}},{"t":"p","c":{"en":"If you do not understand an instruction, a name or a number, ask. It is much better to ask than to guess. You can say:","ar":"If you do not understand an instruction, a name or a number, ask. It is much better to ask than to guess. You can say:"}},{"t":"list","c":{"en":["\"Sorry, could you repeat that, please?\"","\"Could you spell the name for me, please?\"","\"Let me check I have understood. You would like me to ... Is that correct?\""],"ar":["\"Sorry, could you repeat that, please?\"","\"Could you spell the name for me, please?\"","\"Let me check I have understood. You would like me to ... Is that correct?\""]}},{"t":"h","c":{"en":"Answering the phone","ar":"Answering the phone"}},{"t":"steps","c":{"en":["Answer quickly and clearly: \"Good morning, Providence English Private School, [your name] speaking. How may I help you?\"","Listen and write the main points: the caller's name, number, the reason and the date and time.","Repeat the key details back to check them.","If you cannot help, say what you will do: \"I will ask Mr Hassan to call you back before 2 o'clock.\" Do not make promises you cannot keep.","If you must transfer the call, tell the caller who you are transferring them to and why.","End politely: \"Thank you for calling. Goodbye.\""],"ar":["Answer quickly and clearly: \"Good morning, Providence English Private School, [your name] speaking. How may I help you?\"","Listen and write the main points: the caller's name, number, the reason and the date and time.","Repeat the key details back to check them.","If you cannot help, say what you will do: \"I will ask Mr Hassan to call you back before 2 o'clock.\" Do not make promises you cannot keep.","If you must transfer the call, tell the caller who you are transferring them to and why.","End politely: \"Thank you for calling. Goodbye.\""]}},{"t":"h","c":{"en":"Taking and passing on messages","ar":"Taking and passing on messages"}},{"t":"p","c":{"en":"A lost message can become a lost parent, a missed bus or a worried child. Write messages on the school's message form, or in the system the school uses. Include \u003cstrong>who\u003c/strong> called, \u003cstrong>their number\u003c/strong>, \u003cstrong>what\u003c/strong> they need, \u003cstrong>the date and time\u003c/strong> and \u003cstrong>who it is for\u003c/strong>. Pass it on the same day, or straight away if it is urgent. Check that the person has received it.","ar":"A lost message can become a lost parent, a missed bus or a worried child. Write messages on the school's message form, or in the system the school uses. Include \u003cstrong>who\u003c/strong> called, \u003cstrong>their number\u003c/strong>, \u003cstrong>what\u003c/strong> they need, \u003cstrong>the date and time\u003c/strong> and \u003cstrong>who it is for\u003c/strong>. Pass it on the same day, or straight away if it is urgent. Check that the person has received it."}},{"t":"h","c":{"en":"In meetings","ar":"In meetings"}},{"t":"list","c":{"en":["Arrive on time and bring a pen and notebook.","Listen carefully and make short notes of the actions that involve you.","Speak when you have something useful to say. Keep it short and polite.","If you do not understand, ask after the meeting if you feel shy, but do ask.","After the meeting, do the actions you agreed, and tell your manager if you need more time."],"ar":["Arrive on time and bring a pen and notebook.","Listen carefully and make short notes of the actions that involve you.","Speak when you have something useful to say. Keep it short and polite.","If you do not understand, ask after the meeting if you feel shy, but do ask.","After the meeting, do the actions you agreed, and tell your manager if you need more time."]}},{"t":"scenario","title":{"en":"Scenario: the message that was never passed on","ar":"Scenario: the message that was never passed on"},"c":{"en":"A receptionist takes a call from a mother who says her daughter has a medical appointment and must leave at 11 am. The receptionist writes the note on a sticky paper and puts it on her desk. At 11 am the teacher does not know, and the girl is still in class. \u003cstrong>What should the receptionist have done?\u003c/strong> She should have written the full details on the message form (name, class, time, reason), told the class teacher or office immediately, and checked that it was received. A sticky note on a desk is easily lost.","ar":"A receptionist takes a call from a mother who says her daughter has a medical appointment and must leave at 11 am. The receptionist writes the note on a sticky paper and puts it on her desk. At 11 am the teacher does not know, and the girl is still in class. \u003cstrong>What should the receptionist have done?\u003c/strong> She should have written the full details on the message form (name, class, time, reason), told the class teacher or office immediately, and checked that it was received. A sticky note on a desk is easily lost."}},{"t":"callout","k":"tip","title":{"en":"Write it down","ar":"Write it down"},"c":{"en":"Never trust your memory in a busy school. A short note takes ten seconds. A forgotten message can cause a serious problem.","ar":"Never trust your memory in a busy school. A short note takes ten seconds. A forgotten message can cause a serious problem."}}],"checks":[{"id":"m3q1","q":{"en":"A caller speaks quickly and you miss the name of the person they want. What should you say?","ar":"A caller speaks quickly and you miss the name of the person they want. What should you say?"},"opts":[{"en":"\"I did not catch that, so I will guess and try putting you through.\"","ar":"\"I did not catch that, so I will guess and try putting you through.\""},{"en":"\"Please speak more slowly, as I do not have time to listen all day.\"","ar":"\"Please speak more slowly, as I do not have time to listen all day.\""},{"en":"\"Sorry, could you repeat that and spell the name for me, please?\"","ar":"\"Sorry, could you repeat that and spell the name for me, please?\""},{"en":"\"I think I know who you mean, so I will just take a message for them.\"","ar":"\"I think I know who you mean, so I will just take a message for them.\""}],"correct":2,"expl":{"en":"Asking politely for repeating and spelling prevents mistakes. Guessing can send a message to the wrong person, and a rude reply spoils the call.","ar":"Asking politely for repeating and spelling prevents mistakes. Guessing can send a message to the wrong person, and a rude reply spoils the call."}},{"id":"m3q2","q":{"en":"You cannot answer a parent's question about school fees. What is the best way to end the call?","ar":"You cannot answer a parent's question about school fees. What is the best way to end the call?"},"opts":[{"en":"Tell them that you will check and that they should call again some other day","ar":"Tell them that you will check and that they should call again some other day"},{"en":"Say that you are sure someone will contact them at some point soon","ar":"Say that you are sure someone will contact them at some point soon"},{"en":"Give them your best guess about the fees in case it is correct","ar":"Give them your best guess about the fees in case it is correct"},{"en":"Say who will call them back and when, then make sure that the message is passed on","ar":"Say who will call them back and when, then make sure that the message is passed on"}],"correct":3,"expl":{"en":"A clear promise that you can keep, and a message that is passed on, shows care. Guessing about fees may give wrong information.","ar":"A clear promise that you can keep, and a message that is passed on, shows care. Guessing about fees may give wrong information."}},{"id":"m3q3","q":{"en":"You take an urgent message for a teacher who is in a lesson. What should you do?","ar":"You take an urgent message for a teacher who is in a lesson. What should you do?"},"opts":[{"en":"Write it clearly and make sure it reaches the teacher or a senior colleague now","ar":"Write it clearly and make sure it reaches the teacher or a senior colleague now"},{"en":"Leave it on the teacher's desk in the staff room until the end of the school day","ar":"Leave it on the teacher's desk in the staff room until the end of the school day"},{"en":"Tell a pupil in the corridor to remember it and pass it on to the teacher","ar":"Tell a pupil in the corridor to remember it and pass it on to the teacher"},{"en":"Wait until break time and then try to mention it when you see the teacher","ar":"Wait until break time and then try to mention it when you see the teacher"}],"correct":0,"expl":{"en":"An urgent message must reach a person quickly. Notes on desks, pupils passing messages by memory or waiting until break can all cause harm.","ar":"An urgent message must reach a person quickly. Notes on desks, pupils passing messages by memory or waiting until break can all cause harm."}}]},{"id":"m4","title":{"en":"Working with Colleagues and Line Managers","ar":"Working with Colleagues and Line Managers"},"minutes":15,"blocks":[{"t":"p","c":{"en":"A school works well when people trust each other. Every day you work with colleagues from other departments, and you report to a line manager. Good relationships make the job easier and the school safer.","ar":"A school works well when people trust each other. Every day you work with colleagues from other departments, and you report to a line manager. Good relationships make the job easier and the school safer."}},{"t":"h","c":{"en":"Asking for help","ar":"Asking for help"}},{"t":"p","c":{"en":"Nobody knows everything. Asking for help early is a sign of good judgement. Say what the problem is, what you have tried and what kind of help you need. For example: \"I am not sure how to book the minibus for the trip. I have looked at the form, but I do not know who signs it. Could you show me, please?\" Choose a good time, when your manager is not in a rush, unless it is urgent.","ar":"Nobody knows everything. Asking for help early is a sign of good judgement. Say what the problem is, what you have tried and what kind of help you need. For example: \"I am not sure how to book the minibus for the trip. I have looked at the form, but I do not know who signs it. Could you show me, please?\" Choose a good time, when your manager is not in a rush, unless it is urgent."}},{"t":"h","c":{"en":"Giving and receiving feedback","ar":"Giving and receiving feedback"}},{"t":"list","c":{"en":["\u003cstrong>Giving feedback:\u003c/strong> speak in private. Talk about the work, not the person. Be specific and kind. Say what went well, what to change and how. Example: \"Thank you for finishing the list. Next time, please check the spelling of the names before you send it.\"","\u003cstrong>Receiving feedback:\u003c/strong> listen to the end. Do not argue straight away. Ask questions if you do not understand. Say thank you. Think about it and decide what to do next.","Feedback is a chance to learn. It is not an attack, even when it is hard to hear."],"ar":["\u003cstrong>Giving feedback:\u003c/strong> speak in private. Talk about the work, not the person. Be specific and kind. Say what went well, what to change and how. Example: \"Thank you for finishing the list. Next time, please check the spelling of the names before you send it.\"","\u003cstrong>Receiving feedback:\u003c/strong> listen to the end. Do not argue straight away. Ask questions if you do not understand. Say thank you. Think about it and decide what to do next.","Feedback is a chance to learn. It is not an attack, even when it is hard to hear."]}},{"t":"h","c":{"en":"When you disagree","ar":"When you disagree"}},{"t":"steps","c":{"en":["Wait until you are calm. Do not speak when you are angry.","Ask for a private, quiet time to talk.","Say what you see and how it affects the work. Use \"I\" sentences: \"I am worried that the room is not ready on time.\"","Listen to the other person's side. Try to understand their reason.","Look for a solution you can both accept. If you cannot agree, ask your line manager to help."],"ar":["Wait until you are calm. Do not speak when you are angry.","Ask for a private, quiet time to talk.","Say what you see and how it affects the work. Use \"I\" sentences: \"I am worried that the room is not ready on time.\"","Listen to the other person's side. Try to understand their reason.","Look for a solution you can both accept. If you cannot agree, ask your line manager to help."]}},{"t":"h","c":{"en":"Confidentiality, gossip and social media","ar":"Confidentiality, gossip and social media"}},{"t":"p","c":{"en":"At work you may hear private things: a pupil's family problem, a colleague's illness or an internal decision. \u003cstrong>Confidentiality\u003c/strong> means keeping private information private. Share it only with people who need to know to do their job. Gossip is talking about other people's private matters or spreading rumours. It hurts people and damages trust. If someone starts to gossip, you can change the subject or say, \"I would rather not talk about that.\"","ar":"At work you may hear private things: a pupil's family problem, a colleague's illness or an internal decision. \u003cstrong>Confidentiality\u003c/strong> means keeping private information private. Share it only with people who need to know to do their job. Gossip is talking about other people's private matters or spreading rumours. It hurts people and damages trust. If someone starts to gossip, you can change the subject or say, \"I would rather not talk about that.\""}},{"t":"list","c":{"en":["Do not post pictures of pupils, staff, the school building's secure areas or internal matters on social media.","Do not post complaints about the school, colleagues or parents online. Raise concerns through the proper way.","Remember that your behaviour online can be seen by parents, pupils and the community, and reflects on you and the school.","The school's own policy on social media tells you what is allowed."],"ar":["Do not post pictures of pupils, staff, the school building's secure areas or internal matters on social media.","Do not post complaints about the school, colleagues or parents online. Raise concerns through the proper way.","Remember that your behaviour online can be seen by parents, pupils and the community, and reflects on you and the school.","The school's own policy on social media tells you what is allowed."]}},{"t":"scenario","title":{"en":"Scenario: the quiet complaint","ar":"Scenario: the quiet complaint"},"c":{"en":"Two canteen workers disagree about who must clean the serving area at the end of lunch. One of them says nothing to the other, but tells three colleagues how unfair it is. The problem gets worse, and the canteen is not cleaned properly. \u003cstrong>What should they do?\u003c/strong> The worker should speak calmly to her colleague in private, say what she needs, and listen. If they cannot agree, they should ask their line manager to help decide a fair plan. Talking behind her back only creates anger.","ar":"Two canteen workers disagree about who must clean the serving area at the end of lunch. One of them says nothing to the other, but tells three colleagues how unfair it is. The problem gets worse, and the canteen is not cleaned properly. \u003cstrong>What should they do?\u003c/strong> The worker should speak calmly to her colleague in private, say what she needs, and listen. If they cannot agree, they should ask their line manager to help decide a fair plan. Talking behind her back only creates anger."}},{"t":"callout","k":"warn","title":{"en":"Safeguarding is never confidential from the DSL","ar":"Safeguarding is never confidential from the DSL"},"c":{"en":"If a pupil tells you something that worries you, or you see something that may mean a child is at risk, do not keep it secret. Report it to the DSL (Designated Safeguarding Lead) the same day. Do not investigate and do not promise the child that you will keep it a secret.","ar":"If a pupil tells you something that worries you, or you see something that may mean a child is at risk, do not keep it secret. Report it to the DSL (Designated Safeguarding Lead) the same day. Do not investigate and do not promise the child that you will keep it a secret."}}],"checks":[{"id":"m4q1","q":{"en":"Your line manager tells you that your reports often have spelling mistakes. What is the best reaction?","ar":"Your line manager tells you that your reports often have spelling mistakes. What is the best reaction?"},"opts":[{"en":"Explain that the mistakes are caused by other people and by the computer software","ar":"Explain that the mistakes are caused by other people and by the computer software"},{"en":"Listen, say thank you, ask for examples and plan how to check your work","ar":"Listen, say thank you, ask for examples and plan how to check your work"},{"en":"Say nothing, but quietly feel upset, and avoid your manager for some days","ar":"Say nothing, but quietly feel upset, and avoid your manager for some days"},{"en":"Tell your colleagues that the manager is never satisfied with anybody's work","ar":"Tell your colleagues that the manager is never satisfied with anybody's work"}],"correct":1,"expl":{"en":"Good feedback is a chance to improve. Listening and asking for examples shows maturity, while blaming others or complaining behind someone's back does not help.","ar":"Good feedback is a chance to improve. Listening and asking for examples shows maturity, while blaming others or complaining behind someone's back does not help."}},{"id":"m4q2","q":{"en":"You and a colleague disagree about how to arrange a storeroom. What is the best first step?","ar":"You and a colleague disagree about how to arrange a storeroom. What is the best first step?"},"opts":[{"en":"Tell the other staff members in the room what you think of the other plan","ar":"Tell the other staff members in the room what you think of the other plan"},{"en":"Rearrange the room yourself when the colleague has gone home for the day","ar":"Rearrange the room yourself when the colleague has gone home for the day"},{"en":"Wait until you are calm, then ask for a private talk and listen","ar":"Wait until you are calm, then ask for a private talk and listen"},{"en":"Send a strong email to the colleague, and copy in the whole department","ar":"Send a strong email to the colleague, and copy in the whole department"}],"correct":2,"expl":{"en":"Calm, private conversation and listening usually solves the problem. Public criticism or working behind a colleague's back creates conflict.","ar":"Calm, private conversation and listening usually solves the problem. Public criticism or working behind a colleague's back creates conflict."}},{"id":"m4q3","q":{"en":"A pupil tells you in the corridor that something at home frightens her, and asks you to promise to keep it secret. What should you do?","ar":"A pupil tells you in the corridor that something at home frightens her, and asks you to promise to keep it secret. What should you do?"},"opts":[{"en":"Promise to keep the secret and ask her to tell you again if it gets worse","ar":"Promise to keep the secret and ask her to tell you again if it gets worse"},{"en":"Ask her many detailed questions to find out the whole truth yourself","ar":"Ask her many detailed questions to find out the whole truth yourself"},{"en":"Tell her class teacher only the next week when you are less busy","ar":"Tell her class teacher only the next week when you are less busy"},{"en":"Listen kindly, do not promise secrecy, and report it to the DSL the same day","ar":"Listen kindly, do not promise secrecy, and report it to the DSL the same day"}],"correct":3,"expl":{"en":"Staff must never promise to keep a child-protection concern secret, and should not investigate. The DSL must be told the same day.","ar":"Staff must never promise to keep a child-protection concern secret, and should not investigate. The DSL must be told the same day."}}]},{"id":"m5","title":{"en":"Reporting Problems, Escalation and Conduct","ar":"Reporting Problems, Escalation and Conduct"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Every school has problems: a broken gate lock, a late bus, an unhappy parent, a safety risk or a mistake. What matters is that the right person hears about it early, so that it can be fixed. Staying silent usually makes a small problem bigger.","ar":"Every school has problems: a broken gate lock, a late bus, an unhappy parent, a safety risk or a mistake. What matters is that the right person hears about it early, so that it can be fixed. Staying silent usually makes a small problem bigger."}},{"t":"h","c":{"en":"How to report a problem","ar":"How to report a problem"}},{"t":"steps","c":{"en":["\u003cstrong>Stay calm and safe.\u003c/strong> If someone is in danger, deal with that first and call for help. Use the emergency numbers when needed: ambulance 998, police 999, fire 997.","\u003cstrong>Tell your line manager first\u003c/strong> in most cases. Use the school's reporting method.","\u003cstrong>Give the facts:\u003c/strong> what happened, where, when, who was involved and what you have already done. Keep to facts, not opinions or blame.","\u003cstrong>Write it down\u003c/strong> the same day while you remember it clearly.","\u003cstrong>Follow up.\u003c/strong> If nothing happens and the problem is serious, ask again politely."],"ar":["\u003cstrong>Stay calm and safe.\u003c/strong> If someone is in danger, deal with that first and call for help. Use the emergency numbers when needed: ambulance 998, police 999, fire 997.","\u003cstrong>Tell your line manager first\u003c/strong> in most cases. Use the school's reporting method.","\u003cstrong>Give the facts:\u003c/strong> what happened, where, when, who was involved and what you have already done. Keep to facts, not opinions or blame.","\u003cstrong>Write it down\u003c/strong> the same day while you remember it clearly.","\u003cstrong>Follow up.\u003c/strong> If nothing happens and the problem is serious, ask again politely."]}},{"t":"h","c":{"en":"Escalation: when the first person cannot solve it","ar":"Escalation: when the first person cannot solve it"}},{"t":"p","c":{"en":"\u003cstrong>Escalation\u003c/strong> means taking a problem to someone with more authority when the first person cannot, or should not, solve it. For example, you may go to the next manager or a senior leader if your line manager is not available, or if the problem involves your line manager. Some matters must always go to a specific person. Child-protection worries go to the DSL. Health worries go to the school nurse. A fire goes to the fire evacuation plan. Data mistakes go to the data protection lead. Serious complaints about staff behaviour go to a senior leader.","ar":"\u003cstrong>Escalation\u003c/strong> means taking a problem to someone with more authority when the first person cannot, or should not, solve it. For example, you may go to the next manager or a senior leader if your line manager is not available, or if the problem involves your line manager. Some matters must always go to a specific person. Child-protection worries go to the DSL. Health worries go to the school nurse. A fire goes to the fire evacuation plan. Data mistakes go to the data protection lead. Serious complaints about staff behaviour go to a senior leader."}},{"t":"table","head":{"en":["Problem","Who to tell first"],"ar":["Problem","Who to tell first"]},"rows":[{"en":["A child may be at risk, or says something worrying","The DSL, the same day"],"ar":["A child may be at risk, or says something worrying","The DSL, the same day"]},{"en":["A pupil is ill or hurt","The school nurse, and call 998 if it is an emergency"],"ar":["A pupil is ill or hurt","The school nurse, and call 998 if it is an emergency"]},{"en":["A broken lock, a leak or a safety hazard","Your line manager and the facilities lead"],"ar":["A broken lock, a leak or a safety hazard","Your line manager and the facilities lead"]},{"en":["A rude or angry parent or visitor","A senior colleague, if you feel unsafe or the situation grows"],"ar":["A rude or angry parent or visitor","A senior colleague, if you feel unsafe or the situation grows"]},{"en":["You see a colleague acting in an unsafe or unprofessional way","Your line manager or a senior leader, privately"],"ar":["You see a colleague acting in an unsafe or unprofessional way","Your line manager or a senior leader, privately"]}]},{"t":"h","c":{"en":"Professional conduct","ar":"Professional conduct"}},{"t":"list","c":{"en":["Arrive on time, wear your uniform or dress as the school requires and keep your area tidy.","Be honest. If you make a mistake, say so quickly. Never hide it or blame another person.","Keep your promises and do what you say you will do.","Do not use your personal phone for private matters during work time when pupils or visitors are present.","Treat pupils, parents, colleagues and visitors fairly and kindly. Do not favour anyone or accept gifts that could affect your decisions, unless the school allows it.","Follow the school's policies, including those on safeguarding, data, health and safety, and conduct."],"ar":["Arrive on time, wear your uniform or dress as the school requires and keep your area tidy.","Be honest. If you make a mistake, say so quickly. Never hide it or blame another person.","Keep your promises and do what you say you will do.","Do not use your personal phone for private matters during work time when pupils or visitors are present.","Treat pupils, parents, colleagues and visitors fairly and kindly. Do not favour anyone or accept gifts that could affect your decisions, unless the school allows it.","Follow the school's policies, including those on safeguarding, data, health and safety, and conduct."]}},{"t":"scenario","title":{"en":"Scenario: the water leak","ar":"Scenario: the water leak"},"c":{"en":"A cleaner notices water dripping from the ceiling in a corridor, near an electric socket. He tells a passing teacher, who says she will mention it later. An hour passes, and the floor is wet. \u003cstrong>What should he do?\u003c/strong> He should report it to his line manager or the facilities lead straight away, give the exact place, and place a warning sign or keep pupils away if it is safe to do so. If nothing happens, or if the risk is serious, he should escalate to a senior leader. It is a safety matter, and he must follow it until someone is responsible.","ar":"A cleaner notices water dripping from the ceiling in a corridor, near an electric socket. He tells a passing teacher, who says she will mention it later. An hour passes, and the floor is wet. \u003cstrong>What should he do?\u003c/strong> He should report it to his line manager or the facilities lead straight away, give the exact place, and place a warning sign or keep pupils away if it is safe to do so. If nothing happens, or if the risk is serious, he should escalate to a senior leader. It is a safety matter, and he must follow it until someone is responsible."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"1. Be clear, courteous, accurate and respectful, and remember that people in our school come from many cultures.\u003cbr>2. Write short emails with a clear subject, a kind tone and a quick check before you press Send; be careful with reply all and WhatsApp.\u003cbr>3. Listen, ask when you do not understand, and write messages down and pass them on the same day.\u003cbr>4. Ask for help, accept feedback calmly, solve disagreements in private, keep confidences and never gossip; child-protection worries always go to the DSL the same day.\u003cbr>5. Report problems early with facts, escalate if nothing is done, and always act honestly and professionally.","ar":"1. Be clear, courteous, accurate and respectful, and remember that people in our school come from many cultures.\u003cbr>2. Write short emails with a clear subject, a kind tone and a quick check before you press Send; be careful with reply all and WhatsApp.\u003cbr>3. Listen, ask when you do not understand, and write messages down and pass them on the same day.\u003cbr>4. Ask for help, accept feedback calmly, solve disagreements in private, keep confidences and never gossip; child-protection worries always go to the DSL the same day.\u003cbr>5. Report problems early with facts, escalate if nothing is done, and always act honestly and professionally."}}],"checks":[{"id":"m5q1","q":{"en":"You see a loose handrail on the main staircase. What is the best action?","ar":"You see a loose handrail on the main staircase. What is the best action?"},"opts":[{"en":"Report it at once to your line manager or facilities lead and warn others","ar":"Report it at once to your line manager or facilities lead and warn others"},{"en":"Mention it to a friend at lunch and expect that they will pass it on","ar":"Mention it to a friend at lunch and expect that they will pass it on"},{"en":"Wait to see if somebody else reports it before you decide anything","ar":"Wait to see if somebody else reports it before you decide anything"},{"en":"Fix it quickly yourself with tools that you have borrowed from a store","ar":"Fix it quickly yourself with tools that you have borrowed from a store"}],"correct":0,"expl":{"en":"A safety hazard must be reported straight away to the person who can act. Waiting or hoping others will report it leaves pupils at risk.","ar":"A safety hazard must be reported straight away to the person who can act. Waiting or hoping others will report it leaves pupils at risk."}},{"id":"m5q2","q":{"en":"You reported a serious safety problem to your line manager two weeks ago, and nothing has changed. What should you do?","ar":"You reported a serious safety problem to your line manager two weeks ago, and nothing has changed. What should you do?"},"opts":[{"en":"Stop mentioning it, since your line manager has clearly decided to take no action on it","ar":"Stop mentioning it, since your line manager has clearly decided to take no action on it"},{"en":"Follow up politely, then escalate to a senior leader if nothing changes","ar":"Follow up politely, then escalate to a senior leader if nothing changes"},{"en":"Post a complaint on social media so that the school feels pressure to act","ar":"Post a complaint on social media so that the school feels pressure to act"},{"en":"Tell all your colleagues how poor the manager is until the issue is solved","ar":"Tell all your colleagues how poor the manager is until the issue is solved"}],"correct":1,"expl":{"en":"Escalation means taking a serious problem to a higher level through proper channels. Social media or gossip breaks conduct rules and does not solve the problem.","ar":"Escalation means taking a serious problem to a higher level through proper channels. Social media or gossip breaks conduct rules and does not solve the problem."}},{"id":"m5q3","q":{"en":"You made a mistake that caused a pupil to wait 30 minutes at the gate. What is the professional action?","ar":"You made a mistake that caused a pupil to wait 30 minutes at the gate. What is the professional action?"},"opts":[{"en":"Say that the pupil was late and did not tell you where to wait","ar":"Say that the pupil was late and did not tell you where to wait"},{"en":"Do not mention it, because the pupil was safe and nothing worse happened","ar":"Do not mention it, because the pupil was safe and nothing worse happened"},{"en":"Tell your line manager honestly, apologise, and say how you will prevent it again","ar":"Tell your line manager honestly, apologise, and say how you will prevent it again"},{"en":"Ask a colleague to say that they were the one who forgot the pupil","ar":"Ask a colleague to say that they were the one who forgot the pupil"}],"correct":2,"expl":{"en":"Honesty builds trust. Hiding or blaming others is unprofessional, and the school can only prevent a repeat if it knows what happened.","ar":"Honesty builds trust. Hiding or blaming others is unprofessional, and the school can only prevent a repeat if it knows what happened."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A parent phones in an angry voice about a missed bus. What is the best first response?","ar":"A parent phones in an angry voice about a missed bus. What is the best first response?"},"opts":[{"en":"Explain that buses are often late and that the parent should be more patient","ar":"Explain that buses are often late and that the parent should be more patient"},{"en":"Ask the parent to call back when they feel less angry about the matter","ar":"Ask the parent to call back when they feel less angry about the matter"},{"en":"Raise your voice to match theirs so the parent understands the seriousness","ar":"Raise your voice to match theirs so the parent understands the seriousness"},{"en":"Stay calm, listen, apologise for the problem and explain what you will do","ar":"Stay calm, listen, apologise for the problem and explain what you will do"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A cleaner, a driver and a Vice Principal all need to speak to you at the same time. What does respect mean here?","ar":"A cleaner, a driver and a Vice Principal all need to speak to you at the same time. What does respect mean here?"},"opts":[{"en":"Be polite to all three and deal with each fairly, by how urgent it is","ar":"Be polite to all three and deal with each fairly, by how urgent it is"},{"en":"Speak to the Vice Principal first, since senior staff always matter more than others","ar":"Speak to the Vice Principal first, since senior staff always matter more than others"},{"en":"Speak first to the person who is speaking loudest so that the noise stops","ar":"Speak first to the person who is speaking loudest so that the noise stops"},{"en":"Speak first to the colleague you know best and enjoy talking with most","ar":"Speak first to the colleague you know best and enjoy talking with most"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A new colleague pronounces your name wrongly and does not know it. What is a good, professional response?","ar":"A new colleague pronounces your name wrongly and does not know it. What is a good, professional response?"},"opts":[{"en":"Laugh loudly at their attempt in front of the rest of the team","ar":"Laugh loudly at their attempt in front of the rest of the team"},{"en":"Kindly tell them how to say your name, and stay friendly","ar":"Kindly tell them how to say your name, and stay friendly"},{"en":"Ignore it and be annoyed with them every time they speak to you","ar":"Ignore it and be annoyed with them every time they speak to you"},{"en":"Ask them to use a short nickname that you do not really like","ar":"Ask them to use a short nickname that you do not really like"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"You are writing to a parent about a change in bus time. Which opening is best?","ar":"You are writing to a parent about a change in bus time. Which opening is best?"},"opts":[{"en":"\"Hi, just so you know, something has been changed with the transport.\"","ar":"\"Hi, just so you know, something has been changed with the transport.\""},{"en":"\"URGENT!!! READ NOW!!! There is a big problem with the bus time.\"","ar":"\"URGENT!!! READ NOW!!! There is a big problem with the bus time.\""},{"en":"\"Dear Mrs Saleh, the Year 3 bus will leave at a new time from Monday.\"","ar":"\"Dear Mrs Saleh, the Year 3 bus will leave at a new time from Monday.\""},{"en":"\"To whom it may concern, regarding the matters of the school journeys.\"","ar":"\"To whom it may concern, regarding the matters of the school journeys.\""}],"correct":2},{"id":"e5","mod":2,"q":{"en":"You are about to send an email with a pupil list. Which check is most important?","ar":"You are about to send an email with a pupil list. Which check is most important?"},"opts":[{"en":"Check that the email is as long as possible to look professional","ar":"Check that the email is as long as possible to look professional"},{"en":"Check that the font is a bright colour that will be noticed","ar":"Check that the font is a bright colour that will be noticed"},{"en":"Check that the message has an emoji to make it friendly","ar":"Check that the message has an emoji to make it friendly"},{"en":"Check that the recipient and the attachment are correct","ar":"Check that the recipient and the attachment are correct"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"You are angry after a hard morning, and you want to reply to a colleague's email. What is the best choice?","ar":"You are angry after a hard morning, and you want to reply to a colleague's email. What is the best choice?"},"opts":[{"en":"Wait until you are calm, then write a polite reply with only the facts","ar":"Wait until you are calm, then write a polite reply with only the facts"},{"en":"Reply at once in capital letters, so that the colleague knows how you feel","ar":"Reply at once in capital letters, so that the colleague knows how you feel"},{"en":"Reply to everyone on the list so that they all see the colleague's mistake","ar":"Reply to everyone on the list so that they all see the colleague's mistake"},{"en":"Send a short reply that says only \"No\", without any reason or greeting","ar":"Send a short reply that says only \"No\", without any reason or greeting"}],"correct":0},{"id":"e7","mod":2,"q":{"en":"The school WhatsApp group for staff is used by a manager for work notices. A colleague posts a joke about a pupil's name. What is best?","ar":"The school WhatsApp group for staff is used by a manager for work notices. A colleague posts a joke about a pupil's name. What is best?"},"opts":[{"en":"Reply with a bigger joke, so that the colleague is not the only one to laugh","ar":"Reply with a bigger joke, so that the colleague is not the only one to laugh"},{"en":"Do not join in, and politely suggest the group is kept for work matters","ar":"Do not join in, and politely suggest the group is kept for work matters"},{"en":"Screenshot it and show the pupil's family at the next meeting","ar":"Screenshot it and show the pupil's family at the next meeting"},{"en":"Leave the group at once and refuse to read any more work notices","ar":"Leave the group at once and refuse to read any more work notices"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"You answer the phone and the caller wants someone who is not in the building. What should you do?","ar":"You answer the phone and the caller wants someone who is not in the building. What should you do?"},"opts":[{"en":"Say that the person is not here and put the phone down without anything else","ar":"Say that the person is not here and put the phone down without anything else"},{"en":"Promise that the person will call back within five minutes whatever happens","ar":"Promise that the person will call back within five minutes whatever happens"},{"en":"Offer to take a message with name, number and reason, and pass it on the same day","ar":"Offer to take a message with name, number and reason, and pass it on the same day"},{"en":"Tell the caller to ring again until somebody picks up who can help them","ar":"Tell the caller to ring again until somebody picks up who can help them"}],"correct":2},{"id":"e9","mod":3,"q":{"en":"A teacher gives you a quick instruction in a loud corridor and you are not sure tha const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return '';
}
