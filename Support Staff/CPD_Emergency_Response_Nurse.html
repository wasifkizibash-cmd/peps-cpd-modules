#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"nurse-emergency-response","code":"NER","passMark":80,"hours":"1.5 hours","accent":"#B3261E","accentSoft":"#FDE8E6","eyebrow":{"en":"Staff CPD · School Nursing · Emergencies","ar":"Staff CPD · School Nursing · Emergencies"},"title":{"en":"Emergency Response and Medical Emergencies","ar":"Emergency Response and Medical Emergencies"},"subtitle":{"en":"A self-paced module for the school nurse on leading the first response to medical emergencies at school: recognising the deteriorating child, calling 998, basic life support and the AED, the common paediatric emergencies, wider incidents such as fire and lockdown, and the handover, records and debrief that follow.","ar":"A self-paced module for the school nurse on leading the first response to medical emergencies at school: recognising the deteriorating child, calling 998, basic life support and the AED, the common paediatric emergencies, wider incidents such as fire and lockdown, and the handover, records and debrief that follow."},"durationLabel":{"en":"About 1.5 hours, fully self-paced","ar":"About 1.5 hours, fully self-paced"},"standard":{"en":"School nursing practice · Emergency preparedness and response","ar":"School nursing practice · Emergency preparedness and response"},"source":{"en":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)","ar":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"The Emergency Plan, Roles and Communication","ar":"The Emergency Plan, Roles and Communication"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and scope","ar":"Purpose and scope"},"c":{"en":"This CPD supports you as the school's \u003cstrong>clinical lead in a medical emergency\u003c/strong>. By the end you will be able to recognise and prioritise a deteriorating child, call 998 with a clear message, start BLS and use the AED, manage the common paediatric emergencies, adapt your response to fire, lockdown and heat events, and run a clean handover, record and debrief. \u003cem>Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/em>","ar":"This CPD supports you as the school's \u003cstrong>clinical lead in a medical emergency\u003c/strong>. By the end you will be able to recognise and prioritise a deteriorating child, call 998 with a clear message, start BLS and use the AED, manage the common paediatric emergencies, adapt your response to fire, lockdown and heat events, and run a clean handover, record and debrief. \u003cem>Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/em>"}},{"t":"p","c":{"en":"A good emergency response is mostly decided \u003cstrong>before\u003c/strong> the emergency. When a Year 4 child collapses on the field, there is no time to ask who has the key to the clinic, who meets the ambulance, or where the AED is. The school's emergency plan answers those questions in advance, and your job is to know it well enough to run it under pressure and to flag the gaps.","ar":"A good emergency response is mostly decided \u003cstrong>before\u003c/strong> the emergency. When a Year 4 child collapses on the field, there is no time to ask who has the key to the clinic, who meets the ambulance, or where the AED is. The school's emergency plan answers those questions in advance, and your job is to know it well enough to run it under pressure and to flag the gaps."}},{"t":"h","c":{"en":"Know the plan before you need it","ar":"Know the plan before you need it"}},{"t":"list","c":{"en":["Where the \u003cstrong>AED, emergency bag, oxygen (if held) and spare auto-injectors\u003c/strong> are kept, and who checks them and how often.","The list of students with an \u003cstrong>Individual Healthcare Plan (IHP)\u003c/strong> and emergency medication: where the plans are, and how quickly you can find a child's plan at 10:40 on a busy day.","The \u003cstrong>emergency contact route\u003c/strong>: who calls 998, who calls parents or guardians, who informs the Principal / senior leadership, and who is told first if the nurse is off site.","The \u003cstrong>ambulance access route\u003c/strong>: which gate, who opens it, who waits there, and how the crew reaches the child quickly.","The trained first-aiders on each floor and on trips, and how they reach you."],"ar":["Where the \u003cstrong>AED, emergency bag, oxygen (if held) and spare auto-injectors\u003c/strong> are kept, and who checks them and how often.","The list of students with an \u003cstrong>Individual Healthcare Plan (IHP)\u003c/strong> and emergency medication: where the plans are, and how quickly you can find a child's plan at 10:40 on a busy day.","The \u003cstrong>emergency contact route\u003c/strong>: who calls 998, who calls parents or guardians, who informs the Principal / senior leadership, and who is told first if the nurse is off site.","The \u003cstrong>ambulance access route\u003c/strong>: which gate, who opens it, who waits there, and how the crew reaches the child quickly.","The trained first-aiders on each floor and on trips, and how they reach you."]}},{"t":"h","c":{"en":"Your role: clinical lead until the ambulance arrives","ar":"Your role: clinical lead until the ambulance arrives"}},{"t":"p","c":{"en":"In most medical emergencies the nurse is the senior clinical decision-maker on site. That means you assess, decide what care is given, and direct others. It does not mean you do everything yourself. The strongest responses are those where the nurse stays with the child and \u003cstrong>delegates clearly\u003c/strong>.","ar":"In most medical emergencies the nurse is the senior clinical decision-maker on site. That means you assess, decide what care is given, and direct others. It does not mean you do everything yourself. The strongest responses are those where the nurse stays with the child and \u003cstrong>delegates clearly\u003c/strong>."}},{"t":"table","head":{"en":["Task","Who typically does it","Why it matters"],"ar":["Task","Who typically does it","Why it matters"]},"rows":[{"en":["Assess and treat the child","Nurse (or first-aider until you arrive)","One person owns clinical decisions"],"ar":["Assess and treat the child","Nurse (or first-aider until you arrive)","One person owns clinical decisions"]},{"en":["Call 998 and stay on the line","A named adult, sent by name","Frees you to stay with the child"],"ar":["Call 998 and stay on the line","A named adult, sent by name","Frees you to stay with the child"]},{"en":["Fetch AED and emergency bag","A second named adult","Saves minutes in cardiac arrest"],"ar":["Fetch AED and emergency bag","A second named adult","Saves minutes in cardiac arrest"]},{"en":["Meet the ambulance at the gate","A staff member who knows the site","Avoids delay finding the casualty"],"ar":["Meet the ambulance at the gate","A staff member who knows the site","Avoids delay finding the casualty"]},{"en":["Move other students away and supervise","Teachers / support staff","Protects the child's dignity and others' safety"],"ar":["Move other students away and supervise","Teachers / support staff","Protects the child's dignity and others' safety"]},{"en":["Inform parents / guardians and leadership","Senior leadership or designated office staff","Keeps the nurse focused on care"],"ar":["Inform parents / guardians and leadership","Senior leadership or designated office staff","Keeps the nurse focused on care"]}]},{"t":"callout","k":"tip","title":{"en":"Delegate by name, not by crowd","ar":"Delegate by name, not by crowd"},"c":{"en":"\"Someone call 998\" often means nobody does. Point and name: \u003cem>\"Mr Hassan, call 998 now, put it on speaker, tell them we have an unresponsive child, then come back and tell me.\"\u003c/em> Ask the person to \u003cstrong>report back\u003c/strong> so you know it was done.","ar":"\"Someone call 998\" often means nobody does. Point and name: \u003cem>\"Mr Hassan, call 998 now, put it on speaker, tell them we have an unresponsive child, then come back and tell me.\"\u003c/em> Ask the person to \u003cstrong>report back\u003c/strong> so you know it was done."}},{"t":"scenario","title":{"en":"Scenario: the first two minutes","ar":"Scenario: the first two minutes"},"c":{"en":"A Year 8 student collapses in the corridor. A teacher radios the clinic. You grab the emergency bag. On arrival, six students are crowding round and two staff are standing watching. \u003cstrong>What do you do?\u003c/strong> You take control calmly: send one adult to call 998, a second for the AED, a third to hold the gate; ask a teacher to move the students away; then begin your assessment. You have used the first minute to get help moving, not to start treatment alone.","ar":"A Year 8 student collapses in the corridor. A teacher radios the clinic. You grab the emergency bag. On arrival, six students are crowding round and two staff are standing watching. \u003cstrong>What do you do?\u003c/strong> You take control calmly: send one adult to call 998, a second for the AED, a third to hold the gate; ask a teacher to move the students away; then begin your assessment. You have used the first minute to get help moving, not to start treatment alone."}},{"t":"callout","k":"warn","title":{"en":"When the nurse is not on site","ar":"When the nurse is not on site"},"c":{"en":"The plan must say what happens when you are on a break, at a medical appointment or absent. Trained first-aiders act until you arrive, and the 998 call is never delayed waiting for the nurse. If you notice a gap in cover, raise it with senior leadership in writing.","ar":"The plan must say what happens when you are on a break, at a medical appointment or absent. Trained first-aiders act until you arrive, and the 998 call is never delayed waiting for the nurse. If you notice a gap in cover, raise it with senior leadership in writing."}}],"checks":[{"id":"m1q1","q":{"en":"A student has collapsed on the playground and several staff are standing nearby. What is the most effective way to get the 998 call made?","ar":"A student has collapsed on the playground and several staff are standing nearby. What is the most effective way to get the 998 call made?"},"opts":[{"en":"Name one adult, tell them to call 998 and report back to you once it is done","ar":"Name one adult, tell them to call 998 and report back to you once it is done"},{"en":"Say loudly that someone needs to call 998 and start treatment","ar":"Say loudly that someone needs to call 998 and start treatment"},{"en":"Ask the whole group to call the school office to arrange it","ar":"Ask the whole group to call the school office to arrange it"},{"en":"Make the call yourself first, then begin assessing the child once the crew is confirmed","ar":"Make the call yourself first, then begin assessing the child once the crew is confirmed"}],"correct":0,"expl":{"en":"Naming one person and asking for a report-back makes sure the call happens and keeps you with the child. A general request is often not acted on.","ar":"Naming one person and asking for a report-back makes sure the call happens and keeps you with the child. A general request is often not acted on."}},{"id":"m1q2","q":{"en":"Which statement best describes the nurse's role in a medical emergency before the ambulance arrives?","ar":"Which statement best describes the nurse's role in a medical emergency before the ambulance arrives?"},"opts":[{"en":"Observer who waits for senior leadership to decide on any treatment","ar":"Observer who waits for senior leadership to decide on any treatment"},{"en":"Clinical lead who assesses, decides on care and directs others, while delegating tasks","ar":"Clinical lead who assesses, decides on care and directs others, while delegating tasks"},{"en":"Sole responder who personally performs every task, from calling 998 to controlling the crowd","ar":"Sole responder who personally performs every task, from calling 998 to controlling the crowd"},{"en":"Adviser who stays in the clinic and talks to staff by radio only","ar":"Adviser who stays in the clinic and talks to staff by radio only"}],"correct":1,"expl":{"en":"The nurse leads clinically but should delegate calls, equipment, gate access and crowd control so they can stay with the child.","ar":"The nurse leads clinically but should delegate calls, equipment, gate access and crowd control so they can stay with the child."}},{"id":"m1q3","q":{"en":"You are asked to check emergency readiness. Which item matters most for a fast response?","ar":"You are asked to check emergency readiness. Which item matters most for a fast response?"},"opts":[{"en":"The emergency plan is stored in a locked cabinet in the main office","ar":"The emergency plan is stored in a locked cabinet in the main office"},{"en":"Only the nurse knows the location of the emergency equipment","ar":"Only the nurse knows the location of the emergency equipment"},{"en":"Everyone knows where the AED and emergency bag are and who fetches them","ar":"Everyone knows where the AED and emergency bag are and who fetches them"},{"en":"The AED has been moved to a safe place away from the playground","ar":"The AED has been moved to a safe place away from the playground"}],"correct":2,"expl":{"en":"Equipment is only useful if it can be reached fast. Shared knowledge of locations and named roles saves minutes.","ar":"Equipment is only useful if it can be reached fast. Shared knowledge of locations and named roles saves minutes."}}]},{"id":"m2","title":{"en":"Recognising the Deteriorating Child and Calling 998","ar":"Recognising the Deteriorating Child and Calling 998"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Children compensate for illness for longer than adults, then deteriorate quickly. Your first task in any emergency is a fast, structured look at the child so that you spot the sick one early and act on what you find.","ar":"Children compensate for illness for longer than adults, then deteriorate quickly. Your first task in any emergency is a fast, structured look at the child so that you spot the sick one early and act on what you find."}},{"t":"h","c":{"en":"A quick ABCDE approach","ar":"A quick ABCDE approach"}},{"t":"steps","c":{"en":["\u003cstrong>Safety first.\u003c/strong> Check the area is safe for you, the child and bystanders. Use gloves where there is blood or body fluid.","\u003cstrong>Response.\u003c/strong> Call the child's name and gently tap the shoulder. Is the child alert, responding only to voice or pain, or unresponsive?","\u003cstrong>Airway.\u003c/strong> Is it open and clear? Noisy breathing, gurgling or no air movement needs immediate action.","\u003cstrong>Breathing.\u003c/strong> Look, listen and feel. Rate, effort, colour, speech in full sentences or single words, and any wheeze.","\u003cstrong>Circulation.\u003c/strong> Colour, skin temperature, pulse, obvious bleeding, and capillary refill if you are trained to use it.","\u003cstrong>Disability and exposure.\u003c/strong> Alertness, pupils, seizure activity, blood glucose if indicated, and look for injury while protecting the child's dignity."],"ar":["\u003cstrong>Safety first.\u003c/strong> Check the area is safe for you, the child and bystanders. Use gloves where there is blood or body fluid.","\u003cstrong>Response.\u003c/strong> Call the child's name and gently tap the shoulder. Is the child alert, responding only to voice or pain, or unresponsive?","\u003cstrong>Airway.\u003c/strong> Is it open and clear? Noisy breathing, gurgling or no air movement needs immediate action.","\u003cstrong>Breathing.\u003c/strong> Look, listen and feel. Rate, effort, colour, speech in full sentences or single words, and any wheeze.","\u003cstrong>Circulation.\u003c/strong> Colour, skin temperature, pulse, obvious bleeding, and capillary refill if you are trained to use it.","\u003cstrong>Disability and exposure.\u003c/strong> Alertness, pupils, seizure activity, blood glucose if indicated, and look for injury while protecting the child's dignity."]}},{"t":"h","c":{"en":"Red flags that mean act now","ar":"Red flags that mean act now"}},{"t":"list","c":{"en":["Unresponsive, or not breathing normally (gasping is \u003cem>not\u003c/em> normal breathing).","Severe difficulty breathing: unable to speak, blue or grey lips, using neck and tummy muscles.","Swelling of the lips, tongue or throat, or widespread hives with breathing difficulty or faintness.","A seizure lasting more than 5 minutes, or repeated seizures without recovery.","Severe bleeding that does not stop with firm pressure.","Head injury with drowsiness, repeated vomiting, confusion, a seizure or unequal pupils.","A child who \"just looks very unwell\", even when you cannot yet explain why. Trust that judgement."],"ar":["Unresponsive, or not breathing normally (gasping is \u003cem>not\u003c/em> normal breathing).","Severe difficulty breathing: unable to speak, blue or grey lips, using neck and tummy muscles.","Swelling of the lips, tongue or throat, or widespread hives with breathing difficulty or faintness.","A seizure lasting more than 5 minutes, or repeated seizures without recovery.","Severe bleeding that does not stop with firm pressure.","Head injury with drowsiness, repeated vomiting, confusion, a seizure or unequal pupils.","A child who \"just looks very unwell\", even when you cannot yet explain why. Trust that judgement."]}},{"t":"callout","k":"key","title":{"en":"When in doubt, call 998","ar":"When in doubt, call 998"},"c":{"en":"It is far better to call and stand the ambulance down than to wait and regret it. If a child is unresponsive, not breathing normally, having severe breathing difficulty, or you are worried about their airway, call 998 \u003cstrong>immediately\u003c/strong>. You do not need a parent's permission, and you do not need to finish your assessment first.","ar":"It is far better to call and stand the ambulance down than to wait and regret it. If a child is unresponsive, not breathing normally, having severe breathing difficulty, or you are worried about their airway, call 998 \u003cstrong>immediately\u003c/strong>. You do not need a parent's permission, and you do not need to finish your assessment first."}},{"t":"h","c":{"en":"What to say when you call 998","ar":"What to say when you call 998"}},{"t":"steps","c":{"en":["State clearly that you need an \u003cstrong>ambulance\u003c/strong> and give the \u003cstrong>exact location\u003c/strong>: school name, area in Sharjah, gate to use, and where on site the child is.","Give a short description: age of the child, what happened, and the main problem (for example, not breathing, severe asthma, collapsed and unresponsive).","Say what you are already doing and whether an AED is being used.","Give a \u003cstrong>call-back number\u003c/strong> that will be answered, and answer it.","Stay on the line and follow the call-handler's instructions. Put the phone on speaker so you can work with both hands."],"ar":["State clearly that you need an \u003cstrong>ambulance\u003c/strong> and give the \u003cstrong>exact location\u003c/strong>: school name, area in Sharjah, gate to use, and where on site the child is.","Give a short description: age of the child, what happened, and the main problem (for example, not breathing, severe asthma, collapsed and unresponsive).","Say what you are already doing and whether an AED is being used.","Give a \u003cstrong>call-back number\u003c/strong> that will be answered, and answer it.","Stay on the line and follow the call-handler's instructions. Put the phone on speaker so you can work with both hands."]}},{"t":"callout","k":"tip","title":{"en":"Prepare the location script","ar":"Prepare the location script"},"c":{"en":"Many callers forget to give a precise location under stress. Keep a short card by the clinic phone and in the emergency bag with the school address, nearest landmark, gate names and a contact number. Send a named person to the gate, so the crew can find you.","ar":"Many callers forget to give a precise location under stress. Keep a short card by the clinic phone and in the emergency bag with the school address, nearest landmark, gate names and a contact number. Send a named person to the gate, so the crew can find you."}},{"t":"scenario","title":{"en":"Scenario: the quiet one","ar":"Scenario: the quiet one"},"c":{"en":"A Year 3 child is brought to the clinic by a teaching assistant, \"just tired after PE\". He is pale and sweaty, answering only in single words, and breathing faster than you would expect. There is no wheeze and no known condition. \u003cstrong>What do you do?\u003c/strong> This is a child who is compensating and may be deteriorating. You assess ABCDE, check his IHP and records, and call 998 early if his breathing, colour or alertness is not improving. You do not wait for a \"clear diagnosis\" or for the parent to arrive first.","ar":"A Year 3 child is brought to the clinic by a teaching assistant, \"just tired after PE\". He is pale and sweaty, answering only in single words, and breathing faster than you would expect. There is no wheeze and no known condition. \u003cstrong>What do you do?\u003c/strong> This is a child who is compensating and may be deteriorating. You assess ABCDE, check his IHP and records, and call 998 early if his breathing, colour or alertness is not improving. You do not wait for a \"clear diagnosis\" or for the parent to arrive first."}},{"t":"p","c":{"en":"Document the time of each observation as you go, or ask a helper to. The ambulance crew will want the timeline, and so will the post-incident review.","ar":"Document the time of each observation as you go, or ask a helper to. The ambulance crew will want the timeline, and so will the post-incident review."}}],"checks":[{"id":"m2q1","q":{"en":"A child is unresponsive and gasping occasionally. How should you interpret this?","ar":"A child is unresponsive and gasping occasionally. How should you interpret this?"},"opts":[{"en":"Occasional gasping shows the child is breathing, so observe closely","ar":"Occasional gasping shows the child is breathing, so observe closely"},{"en":"Gasping suggests a simple faint, so lay the child flat, raise the legs and wait","ar":"Gasping suggests a simple faint, so lay the child flat, raise the legs and wait"},{"en":"Gasping means the airway is open, so no compressions are needed","ar":"Gasping means the airway is open, so no compressions are needed"},{"en":"Gasping is not normal breathing, so treat it as cardiac arrest and call 998","ar":"Gasping is not normal breathing, so treat it as cardiac arrest and call 998"}],"correct":3,"expl":{"en":"Agonal gasps can occur in the first minutes of cardiac arrest. If the child is unresponsive and not breathing normally, call 998 and start BLS.","ar":"Agonal gasps can occur in the first minutes of cardiac arrest. If the child is unresponsive and not breathing normally, call 998 and start BLS."}},{"id":"m2q2","q":{"en":"What is the most important detail to give the 998 call-handler first?","ar":"What is the most important detail to give the 998 call-handler first?"},"opts":[{"en":"Exact location, including the gate to use, and the main problem","ar":"Exact location, including the gate to use, and the main problem"},{"en":"The child's full medical history and the parents' contact details","ar":"The child's full medical history and the parents' contact details"},{"en":"A detailed account of everything that led up to the incident","ar":"A detailed account of everything that led up to the incident"},{"en":"The names of all staff who have witnessed the emergency","ar":"The names of all staff who have witnessed the emergency"}],"correct":0,"expl":{"en":"The crew cannot help if they cannot find you. Location and the main problem come first; the call-handler will ask for more.","ar":"The crew cannot help if they cannot find you. Location and the main problem come first; the call-handler will ask for more."}},{"id":"m2q3","q":{"en":"A pale, sweaty, fast-breathing child says he is \"just tired\". Which response is best?","ar":"A pale, sweaty, fast-breathing child says he is \"just tired\". Which response is best?"},"opts":[{"en":"Ask him to rest in the clinic with a drink and recheck him at the end of the lesson","ar":"Ask him to rest in the clinic with a drink and recheck him at the end of the lesson"},{"en":"Assess ABCDE now, monitor closely and call 998 if he does not improve","ar":"Assess ABCDE now, monitor closely and call 998 if he does not improve"},{"en":"Give him water and send him back to class with a note","ar":"Give him water and send him back to class with a note"},{"en":"Wait for a parent to collect him before deciding on any action","ar":"Wait for a parent to collect him before deciding on any action"}],"correct":1,"expl":{"en":"Children can look deceptively stable and then decline fast. A structured assessment and a low threshold to call 998 protect the child.","ar":"Children can look deceptively stable and then decline fast. A structured assessment and a low threshold to call 998 protect the child."}}]},{"id":"m3","title":{"en":"Cardiac Arrest, Basic Life Support and the AED","ar":"Cardiac Arrest, Basic Life Support and the AED"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Cardiac arrest in children is less often a primary heart problem and more often follows severe breathing or circulation failure, but sudden cardiac arrest does happen in school-aged children and teenagers, including during sport. Fast recognition, high-quality compressions and early defibrillation are the difference.","ar":"Cardiac arrest in children is less often a primary heart problem and more often follows severe breathing or circulation failure, but sudden cardiac arrest does happen in school-aged children and teenagers, including during sport. Fast recognition, high-quality compressions and early defibrillation are the difference."}},{"t":"callout","k":"key","title":{"en":"Recognise and act","ar":"Recognise and act"},"c":{"en":"An unresponsive child who is \u003cstrong>not breathing normally\u003c/strong> is in cardiac arrest until proven otherwise. Shout for help, send for the AED, call 998 and start compressions. Do not spend more than about 10 seconds checking for breathing.","ar":"An unresponsive child who is \u003cstrong>not breathing normally\u003c/strong> is in cardiac arrest until proven otherwise. Shout for help, send for the AED, call 998 and start compressions. Do not spend more than about 10 seconds checking for breathing."}},{"t":"h","c":{"en":"The BLS sequence","ar":"The BLS sequence"}},{"t":"steps","c":{"en":["Check for danger, then check response. If none, shout for help and have 998 called and the AED brought.","Open the airway with a head tilt and chin lift, and look, listen and feel for normal breathing for no more than 10 seconds.","If there is no normal breathing, give \u003cstrong>5 initial rescue breaths\u003c/strong> for a child if trained and equipped (using a barrier device or pocket mask), then start compressions.","Give \u003cstrong>30 compressions to 2 breaths\u003c/strong>. Press at \u003cstrong>100 to 120 per minute\u003c/strong>, to about \u003cstrong>one third of the depth of the chest\u003c/strong>, allowing full chest recoil each time.","Use the \u003cstrong>AED as soon as it arrives\u003c/strong>. Follow its voice prompts and do not stop compressions except when the device is analysing or advising a shock.","Continue until the ambulance crew takes over, the child shows signs of life, or you are too exhausted to continue."],"ar":["Check for danger, then check response. If none, shout for help and have 998 called and the AED brought.","Open the airway with a head tilt and chin lift, and look, listen and feel for normal breathing for no more than 10 seconds.","If there is no normal breathing, give \u003cstrong>5 initial rescue breaths\u003c/strong> for a child if trained and equipped (using a barrier device or pocket mask), then start compressions.","Give \u003cstrong>30 compressions to 2 breaths\u003c/strong>. Press at \u003cstrong>100 to 120 per minute\u003c/strong>, to about \u003cstrong>one third of the depth of the chest\u003c/strong>, allowing full chest recoil each time.","Use the \u003cstrong>AED as soon as it arrives\u003c/strong>. Follow its voice prompts and do not stop compressions except when the device is analysing or advising a shock.","Continue until the ambulance crew takes over, the child shows signs of life, or you are too exhausted to continue."]}},{"t":"h","c":{"en":"Using the AED","ar":"Using the AED"}},{"t":"list","c":{"en":["Switch the AED on and follow the voice prompts. It will guide you.","Expose the chest and apply the pads \u003cstrong>as shown on the pad packaging\u003c/strong>. Dry a wet chest first, and move any medication patch away from the pad site.","Use \u003cstrong>paediatric pads or the paediatric mode\u003c/strong> for a younger child if the device has them, per the manufacturer's guidance. If none are available, use the adult pads rather than not defibrillating.","Make sure no one is touching the child when the AED analyses or delivers a shock. Say \"stand clear\" and check visually.","After a shock, restart compressions straight away unless the AED instructs otherwise."],"ar":["Switch the AED on and follow the voice prompts. It will guide you.","Expose the chest and apply the pads \u003cstrong>as shown on the pad packaging\u003c/strong>. Dry a wet chest first, and move any medication patch away from the pad site.","Use \u003cstrong>paediatric pads or the paediatric mode\u003c/strong> for a younger child if the device has them, per the manufacturer's guidance. If none are available, use the adult pads rather than not defibrillating.","Make sure no one is touching the child when the AED analyses or delivers a shock. Say \"stand clear\" and check visually.","After a shock, restart compressions straight away unless the AED instructs otherwise."]}},{"t":"callout","k":"warn","title":{"en":"Do not wait for confirmation","ar":"Do not wait for confirmation"},"c":{"en":"Do not delay compressions to find a pulse, to take a history or to wait for a second person. In children, compressions with breaths matter because arrests are often caused by a lack of oxygen. If you cannot or are unwilling to give breaths, compressions alone are better than doing nothing.","ar":"Do not delay compressions to find a pulse, to take a history or to wait for a second person. In children, compressions with breaths matter because arrests are often caused by a lack of oxygen. If you cannot or are unwilling to give breaths, compressions alone are better than doing nothing."}},{"t":"h","c":{"en":"Get the team working","ar":"Get the team working"}},{"t":"p","c":{"en":"One person does compressions, one manages the airway or breaths, one operates the AED, one calls and meets the ambulance, and one keeps a timeline. \u003cstrong>Swap the person doing compressions about every two minutes\u003c/strong> to maintain quality, using the AED analysis pause. Cheerful, brisk, specific instructions work best: \"Mrs Noor, take over compressions on my count.\"","ar":"One person does compressions, one manages the airway or breaths, one operates the AED, one calls and meets the ambulance, and one keeps a timeline. \u003cstrong>Swap the person doing compressions about every two minutes\u003c/strong> to maintain quality, using the AED analysis pause. Cheerful, brisk, specific instructions work best: \"Mrs Noor, take over compressions on my count.\""}},{"t":"scenario","title":{"en":"Scenario: the football match","ar":"Scenario: the football match"},"c":{"en":"A 15-year-old collapses during a break-time football match. A PE teacher shouts that he is \"not responding\". You arrive with the AED, find him unresponsive and not breathing normally, and 998 has been called. The teacher has begun compressions. \u003cstrong>What next?\u003c/strong> You confirm the situation, take over team leadership, switch the AED on and apply the pads while compressions continue, and follow the voice prompts. You make sure someone is meeting the ambulance, and that compressions restart straight after the shock advice. Note the times for the handover.","ar":"A 15-year-old collapses during a break-time football match. A PE teacher shouts that he is \"not responding\". You arrive with the AED, find him unresponsive and not breathing normally, and 998 has been called. The teacher has begun compressions. \u003cstrong>What next?\u003c/strong> You confirm the situation, take over team leadership, switch the AED on and apply the pads while compressions continue, and follow the voice prompts. You make sure someone is meeting the ambulance, and that compressions restart straight after the shock advice. Note the times for the handover."}},{"t":"callout","k":"tip","title":{"en":"Practise, practise, practise","ar":"Practise, practise, practise"},"c":{"en":"Skills fade within months without practice. Ask for regular scenario drills with staff, include the AED, and check that every first-aider knows where it is. Check pad and battery expiry dates on a fixed schedule and record the checks.","ar":"Skills fade within months without practice. Ask for regular scenario drills with staff, include the AED, and check that every first-aider knows where it is. Check pad and battery expiry dates on a fixed schedule and record the checks."}}],"checks":[{"id":"m3q1","q":{"en":"What compression-to-breath ratio and rate do you use for BLS in a child?","ar":"What compression-to-breath ratio and rate do you use for BLS in a child?"},"opts":[{"en":"15 compressions to 2 breaths, at about 60 per minute","ar":"15 compressions to 2 breaths, at about 60 per minute"},{"en":"30 compressions to 2 breaths, at about 140 per minute","ar":"30 compressions to 2 breaths, at about 140 per minute"},{"en":"30 compressions to 2 breaths, at 100 to 120 compressions per minute","ar":"30 compressions to 2 breaths, at 100 to 120 compressions per minute"},{"en":"5 compressions to 1 breath, at 100 to 120 per minute","ar":"5 compressions to 1 breath, at 100 to 120 per minute"}],"correct":2,"expl":{"en":"The standard BLS ratio is 30:2 at 100 to 120 per minute, pressing to about one third of the depth of the chest.","ar":"The standard BLS ratio is 30:2 at 100 to 120 per minute, pressing to about one third of the depth of the chest."}},{"id":"m3q2","q":{"en":"The AED arrives while you are doing compressions. What should you do?","ar":"The AED arrives while you are doing compressions. What should you do?"},"opts":[{"en":"Stop compressions until a second AED can be tested on the child","ar":"Stop compressions until a second AED can be tested on the child"},{"en":"Wait for the ambulance crew to arrive and confirm that a shock is needed first","ar":"Wait for the ambulance crew to arrive and confirm that a shock is needed first"},{"en":"Use the AED only after a pulse check confirms there is no pulse","ar":"Use the AED only after a pulse check confirms there is no pulse"},{"en":"Switch it on, apply the pads and follow the prompts while minimising pauses","ar":"Switch it on, apply the pads and follow the prompts while minimising pauses"}],"correct":3,"expl":{"en":"Use the AED as soon as it is available. It decides whether a shock is needed, and pauses in compressions should be kept as short as possible.","ar":"Use the AED as soon as it is available. It decides whether a shock is needed, and pauses in compressions should be kept as short as possible."}},{"id":"m3q3","q":{"en":"Why is it recommended to rotate the person giving compressions about every two minutes?","ar":"Why is it recommended to rotate the person giving compressions about every two minutes?"},"opts":[{"en":"Fatigue reduces quality of compressions, and rotation maintains depth and rate","ar":"Fatigue reduces quality of compressions, and rotation maintains depth and rate"},{"en":"The AED stops analysing correctly if the same person keeps touching the chest too long","ar":"The AED stops analysing correctly if the same person keeps touching the chest too long"},{"en":"Rotation is only a protocol and does not affect outcome in practice","ar":"Rotation is only a protocol and does not affect outcome in practice"},{"en":"It allows the person to check for a pulse during each swap","ar":"It allows the person to check for a pulse during each swap"}],"correct":0,"expl":{"en":"Compression quality falls quickly with fatigue, often before the rescuer notices. A planned swap during AED analysis keeps quality high.","ar":"Compression quality falls quickly with fatigue, often before the rescuer notices. A planned swap during AED analysis keeps quality high."}}]},{"id":"m4","title":{"en":"Anaphylaxis, Severe Asthma, Seizures, Hypoglycaemia and Bleeding","ar":"Anaphylaxis, Severe Asthma, Seizures, Hypoglycaemia and Bleeding"},"minutes":15,"blocks":[{"t":"p","c":{"en":"These are the emergencies you are most likely to meet in school. Each has a clear recognition pattern and a first response. For every child known to have one of these conditions, the \u003cstrong>IHP and the prescriber's written instruction\u003c/strong> are your guide; give medication as prescribed and per the IHP, and never invent a dose.","ar":"These are the emergencies you are most likely to meet in school. Each has a clear recognition pattern and a first response. For every child known to have one of these conditions, the \u003cstrong>IHP and the prescriber's written instruction\u003c/strong> are your guide; give medication as prescribed and per the IHP, and never invent a dose."}},{"t":"table","head":{"en":["Emergency","Recognise","First response"],"ar":["Emergency","Recognise","First response"]},"rows":[{"en":["Anaphylaxis","Sudden onset after a trigger; breathing difficulty, throat or tongue swelling, hives, faintness, pale or floppy","Give the adrenaline auto-injector as per the child's IHP and your training, call 998, lie flat (or sit if breathing is hard), note the time"],"ar":["Anaphylaxis","Sudden onset after a trigger; breathing difficulty, throat or tongue swelling, hives, faintness, pale or floppy","Give the adrenaline auto-injector as per the child's IHP and your training, call 998, lie flat (or sit if breathing is hard), note the time"]},{"en":["Severe asthma attack","Too breathless to speak in full sentences, struggling, blue lips, reliever not helping","Sit upright, give the reliever as per the IHP, call 998 if not improving or severe, stay with the child"],"ar":["Severe asthma attack","Too breathless to speak in full sentences, struggling, blue lips, reliever not helping","Sit upright, give the reliever as per the IHP, call 998 if not improving or severe, stay with the child"]},{"en":["Seizure","Collapse with rhythmic jerking, or staring and unresponsive","Time it, protect from injury, cushion the head, nothing in the mouth, do not restrain, recovery position after; 998 if over 5 minutes"],"ar":["Seizure","Collapse with rhythmic jerking, or staring and unresponsive","Time it, protect from injury, cushion the head, nothing in the mouth, do not restrain, recovery position after; 998 if over 5 minutes"]},{"en":["Hypoglycaemia","Shaky, sweaty, pale, confused, irritable, drowsy in a child with diabetes","Check glucose if able, give fast-acting sugar per the IHP if awake and able to swallow; 998 if drowsy, unable to swallow or fitting"],"ar":["Hypoglycaemia","Shaky, sweaty, pale, confused, irritable, drowsy in a child with diabetes","Check glucose if able, give fast-acting sugar per the IHP if awake and able to swallow; 998 if drowsy, unable to swallow or fitting"]},{"en":["Major bleeding","Blood spurting or soaking through dressings","Firm direct pressure, add dressings on top, elevate if possible, call 998, treat for shock"],"ar":["Major bleeding","Blood spurting or soaking through dressings","Firm direct pressure, add dressings on top, elevate if possible, call 998, treat for shock"]}]},{"t":"h","c":{"en":"Anaphylaxis: the key decisions","ar":"Anaphylaxis: the key decisions"}},{"t":"list","c":{"en":["If you suspect anaphylaxis, \u003cstrong>do not wait\u003c/strong>. Give adrenaline as per the IHP and your training, and call 998 even if the child improves.","Keep the child lying flat with legs raised where possible, or sitting if breathing is the main problem. Do not let them stand or walk.","Note the time of the injection and give the used device to the ambulance crew. A second dose may be needed if prescribed and there is no improvement; follow the IHP and the call-handler.","Every child who has had adrenaline needs hospital assessment, even if they seem well again."],"ar":["If you suspect anaphylaxis, \u003cstrong>do not wait\u003c/strong>. Give adrenaline as per the IHP and your training, and call 998 even if the child improves.","Keep the child lying flat with legs raised where possible, or sitting if breathing is the main problem. Do not let them stand or walk.","Note the time of the injection and give the used device to the ambulance crew. A second dose may be needed if prescribed and there is no improvement; follow the IHP and the call-handler.","Every child who has had adrenaline needs hospital assessment, even if they seem well again."]}},{"t":"callout","k":"warn","title":{"en":"The most common error","ar":"The most common error"},"c":{"en":"Delay. Waiting to \"see if it settles\", giving an antihistamine first, or hesitating because the child \"might just be anxious\". When there is breathing difficulty or swelling after a likely trigger, treat as anaphylaxis.","ar":"Delay. Waiting to \"see if it settles\", giving an antihistamine first, or hesitating because the child \"might just be anxious\". When there is breathing difficulty or swelling after a likely trigger, treat as anaphylaxis."}},{"t":"h","c":{"en":"Seizures: calm and protect","ar":"Seizures: calm and protect"}},{"t":"list","c":{"en":["Note the time the seizure starts. Move hard objects away and cushion the head.","Do \u003cstrong>not\u003c/strong> restrain the child and never put anything in their mouth.","Once the jerking stops, place the child in the recovery position, check breathing and stay until they are fully alert.","Call 998 if the seizure lasts more than 5 minutes, if it is a first seizure, if breathing is difficult afterwards, or if the IHP says to. Give any rescue medication only as the IHP and training allow."],"ar":["Note the time the seizure starts. Move hard objects away and cushion the head.","Do \u003cstrong>not\u003c/strong> restrain the child and never put anything in their mouth.","Once the jerking stops, place the child in the recovery position, check breathing and stay until they are fully alert.","Call 998 if the seizure lasts more than 5 minutes, if it is a first seizure, if breathing is difficult afterwards, or if the IHP says to. Give any rescue medication only as the IHP and training allow."]}},{"t":"h","c":{"en":"Bleeding and other injuries","ar":"Bleeding and other injuries"}},{"t":"list","c":{"en":["Apply firm, direct pressure with a clean pad. Do not remove soaked dressings; add more on top.","For burns, cool under running water for \u003cstrong>20 minutes\u003c/strong>, remove jewellery near the area, and cover loosely with a non-fluffy dressing.","For a suspected fracture, support the limb in the position found and do not try to straighten it.","For head injury, use red flags: drowsiness, confusion, repeated vomiting, seizure or worsening headache mean 998 or urgent hospital assessment."],"ar":["Apply firm, direct pressure with a clean pad. Do not remove soaked dressings; add more on top.","For burns, cool under running water for \u003cstrong>20 minutes\u003c/strong>, remove jewellery near the area, and cover loosely with a non-fluffy dressing.","For a suspected fracture, support the limb in the position found and do not try to straighten it.","For head injury, use red flags: drowsiness, confusion, repeated vomiting, seizure or worsening headache mean 998 or urgent hospital assessment."]}},{"t":"scenario","title":{"en":"Scenario: the PE asthma attack","ar":"Scenario: the PE asthma attack"},"c":{"en":"During a PE lesson on a hot afternoon, a Year 7 girl with asthma cannot speak in full sentences, and her lips look bluish. Her reliever inhaler is in her bag in the changing room. \u003cstrong>What do you do?\u003c/strong> You sit her upright, send someone to fetch the inhaler and the school's emergency inhaler if the school holds one under policy, and give the reliever as per her IHP. You call 998 straight away because she is severe and unable to speak, and you stay with her, reassuring and monitoring, until the crew arrive.","ar":"During a PE lesson on a hot afternoon, a Year 7 girl with asthma cannot speak in full sentences, and her lips look bluish. Her reliever inhaler is in her bag in the changing room. \u003cstrong>What do you do?\u003c/strong> You sit her upright, send someone to fetch the inhaler and the school's emergency inhaler if the school holds one under policy, and give the reliever as per her IHP. You call 998 straight away because she is severe and unable to speak, and you stay with her, reassuring and monitoring, until the crew arrive."}},{"t":"callout","k":"tip","title":{"en":"The lost inhaler","ar":"The lost inhaler"},"c":{"en":"If a child's own inhaler or auto-injector is missing or out of date, deal with the emergency first, using any emergency supply the school policy allows. Afterwards, raise the gap with parents and your records so it does not happen again.","ar":"If a child's own inhaler or auto-injector is missing or out of date, deal with the emergency first, using any emergency supply the school policy allows. Afterwards, raise the gap with parents and your records so it does not happen again."}}],"checks":[{"id":"m4q1","q":{"en":"A child with a known nut allergy develops hives, a swollen tongue and breathing difficulty after lunch. What is the correct first action?","ar":"A child with a known nut allergy develops hives, a swollen tongue and breathing difficulty after lunch. What is the correct first action?"},"opts":[{"en":"Give an antihistamine and watch to see if symptoms settle","ar":"Give an antihistamine and watch to see if symptoms settle"},{"en":"Give the adrenaline auto-injector per the IHP, and call 998","ar":"Give the adrenaline auto-injector per the IHP, and call 998"},{"en":"Send the child to the clinic with a friend and review the symptoms on arrival","ar":"Send the child to the clinic with a friend and review the symptoms on arrival"},{"en":"Wait for the parents to confirm the allergy before acting","ar":"Wait for the parents to confirm the allergy before acting"}],"correct":1,"expl":{"en":"Anaphylaxis needs adrenaline early, as per the IHP and your training, plus an emergency call. Antihistamines alone are not an appropriate first-line treatment.","ar":"Anaphylaxis needs adrenaline early, as per the IHP and your training, plus an emergency call. Antihistamines alone are not an appropriate first-line treatment."}},{"id":"m4q2","q":{"en":"A child is having a tonic-clonic seizure. Which action is correct?","ar":"A child is having a tonic-clonic seizure. Which action is correct?"},"opts":[{"en":"Hold the arms still and place a spoon between the teeth","ar":"Hold the arms still and place a spoon between the teeth"},{"en":"Splash cold water on the face and call out loudly to try to wake the child up","ar":"Splash cold water on the face and call out loudly to try to wake the child up"},{"en":"Time it, protect the head, do not restrain, and call 998 if over 5 minutes","ar":"Time it, protect the head, do not restrain, and call 998 if over 5 minutes"},{"en":"Give a drink as soon as the shaking has stopped","ar":"Give a drink as soon as the shaking has stopped"}],"correct":2,"expl":{"en":"Protect and time the seizure. Never restrain or put anything in the mouth. More than 5 minutes is an emergency.","ar":"Protect and time the seizure. Never restrain or put anything in the mouth. More than 5 minutes is an emergency."}},{"id":"m4q3","q":{"en":"How long should a minor burn be cooled under running water?","ar":"How long should a minor burn be cooled under running water?"},"opts":[{"en":"About 2 minutes, then apply a thick layer of butter","ar":"About 2 minutes, then apply a thick layer of butter"},{"en":"About 10 seconds, then apply ice directly to the burn","ar":"About 10 seconds, then apply ice directly to the burn"},{"en":"About 5 minutes, then cover tightly with a plaster","ar":"About 5 minutes, then cover tightly with a plaster"},{"en":"About 20 minutes, then cover loosely with a non-fluffy dressing","ar":"About 20 minutes, then cover loosely with a non-fluffy dressing"}],"correct":3,"expl":{"en":"Cooling for 20 minutes under running water reduces damage and pain. Do not use ice, butter or tight dressings.","ar":"Cooling for 20 minutes under running water reduces damage and pain. Do not use ice, butter or tight dressings."}}]},{"id":"m5","title":{"en":"Fire, Lockdown, Heat, Evacuation and Vulnerable Students","ar":"Fire, Lockdown, Heat, Evacuation and Vulnerable Students"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Not every emergency is one child on the ground. Fire, security incidents, severe weather, a trip accident or an outbreak of illness can affect many students and staff at once. In these events the nurse has two jobs: look after the injured or unwell, and make sure \u003cstrong>vulnerable students are not forgotten\u003c/strong>.","ar":"Not every emergency is one child on the ground. Fire, security incidents, severe weather, a trip accident or an outbreak of illness can affect many students and staff at once. In these events the nurse has two jobs: look after the injured or unwell, and make sure \u003cstrong>vulnerable students are not forgotten\u003c/strong>."}},{"t":"callout","k":"key","title":{"en":"Follow the whole-school plan","ar":"Follow the whole-school plan"},"c":{"en":"In a fire or lockdown, the Principal / senior leadership and the school's emergency plan lead. Your role is clinical: assess casualties, manage supplies, and make sure the students who need extra help are accounted for. In a fire, the number for the fire service is \u003cstrong>997\u003c/strong>; for police \u003cstrong>999\u003c/strong>; for an ambulance \u003cstrong>998\u003c/strong>.","ar":"In a fire or lockdown, the Principal / senior leadership and the school's emergency plan lead. Your role is clinical: assess casualties, manage supplies, and make sure the students who need extra help are accounted for. In a fire, the number for the fire service is \u003cstrong>997\u003c/strong>; for police \u003cstrong>999\u003c/strong>; for an ambulance \u003cstrong>998\u003c/strong>."}},{"t":"h","c":{"en":"Mass casualty and triage basics","ar":"Mass casualty and triage basics"}},{"t":"list","c":{"en":["Get help and information first: how many casualties, what injuries, is the scene safe. Do not enter an unsafe area.","Prioritise using a simple triage approach: those not breathing or with life-threatening bleeding first, then those who cannot walk, then those who can.","Move walking casualties to a designated area with a staff member, and keep a written list of names.","Give the ambulance crew a clear summary on arrival: number of casualties, their priorities and what you have done."],"ar":["Get help and information first: how many casualties, what injuries, is the scene safe. Do not enter an unsafe area.","Prioritise using a simple triage approach: those not breathing or with life-threatening bleeding first, then those who cannot walk, then those who can.","Move walking casualties to a designated area with a staff member, and keep a written list of names.","Give the ambulance crew a clear summary on arrival: number of casualties, their priorities and what you have done."]}},{"t":"h","c":{"en":"Fire and evacuation","ar":"Fire and evacuation"}},{"t":"list","c":{"en":["Evacuate as per the school plan to the assembly point, and take the emergency bag, the list of students with IHPs and any emergency medication.","Plan in advance for students who may need help to evacuate: those with mobility difficulties, sensory or medical needs, and those who may panic.","Do a roll call and report missing students to the senior leader in charge, not by returning to the building yourself.","Treat smoke inhalation, burns and anxiety at the assembly point, and call 998 for anyone with breathing difficulty."],"ar":["Evacuate as per the school plan to the assembly point, and take the emergency bag, the list of students with IHPs and any emergency medication.","Plan in advance for students who may need help to evacuate: those with mobility difficulties, sensory or medical needs, and those who may panic.","Do a roll call and report missing students to the senior leader in charge, not by returning to the building yourself.","Treat smoke inhalation, burns and anxiety at the assembly point, and call 998 for anyone with breathing difficulty."]}},{"t":"h","c":{"en":"Lockdown or security incident","ar":"Lockdown or security incident"}},{"t":"list","c":{"en":["Follow the school's lockdown procedure: secure the room, stay out of sight, keep quiet, and wait for the all-clear from leadership.","If you are in the clinic, lock the door, silence phones, and bring any students already with you into the room.","Keep emergency medication and your IHP list within reach. Children with asthma or diabetes still need their medication in a lockdown.","Prepare a calm, simple way to keep children reassured and quiet."],"ar":["Follow the school's lockdown procedure: secure the room, stay out of sight, keep quiet, and wait for the all-clear from leadership.","If you are in the clinic, lock the door, silence phones, and bring any students already with you into the room.","Keep emergency medication and your IHP list within reach. Children with asthma or diabetes still need their medication in a lockdown.","Prepare a calm, simple way to keep children reassured and quiet."]}},{"t":"h","c":{"en":"Heat","ar":"Heat"}},{"t":"p","c":{"en":"In the UAE climate, heat illness is a real risk in outdoor sessions, trips and bus journeys. Know the early signs: headache, dizziness, nausea, very hot or flushed skin, heavy sweating then cessation, confusion. \u003cstrong>Heat stroke is an emergency.\u003c/strong> Move the child to shade or a cool place, remove excess clothing, cool actively with water and fanning, and call 998 if there is confusion, collapse or a very high temperature.","ar":"In the UAE climate, heat illness is a real risk in outdoor sessions, trips and bus journeys. Know the early signs: headache, dizziness, nausea, very hot or flushed skin, heavy sweating then cessation, confusion. \u003cstrong>Heat stroke is an emergency.\u003c/strong> Move the child to shade or a cool place, remove excess clothing, cool actively with water and fanning, and call 998 if there is confusion, collapse or a very high temperature."}},{"t":"table","head":{"en":["Student group","What to plan for"],"ar":["Student group","What to plan for"]},"rows":[{"en":["Asthma, diabetes, epilepsy, severe allergy","Emergency medication to hand, IHP list taken to the assembly point or lockdown room"],"ar":["Asthma, diabetes, epilepsy, severe allergy","Emergency medication to hand, IHP list taken to the assembly point or lockdown room"]},{"en":["Mobility difficulty or wheelchair user","A named adult and a planned evacuation route; a buddy system"],"ar":["Mobility difficulty or wheelchair user","A named adult and a planned evacuation route; a buddy system"]},{"en":["Sensory needs or anxiety","Quiet reassurance, familiar adult, simple instructions"],"ar":["Sensory needs or anxiety","Quiet reassurance, familiar adult, simple instructions"]},{"en":["Very young children (Years 1 to 3)","Close supervision and calm voices; they follow adults' reactions"],"ar":["Very young children (Years 1 to 3)","Close supervision and calm voices; they follow adults' reactions"]}]},{"t":"scenario","title":{"en":"Scenario: the trip","ar":"Scenario: the trip"},"c":{"en":"On a school trip, a minibus is delayed by traffic in hot weather. A Year 5 child with diabetes has missed a snack and becomes pale, shaky and confused. Two other children feel faint. \u003cstrong>What do you do?\u003c/strong> You move all three into shade and cool air, check the child with diabetes first, follow the IHP for hypoglycaemia, give fluids and cool the other two, and call 998 if anyone is confused and does not improve. You tell the group leader and the school, and you note the times.","ar":"On a school trip, a minibus is delayed by traffic in hot weather. A Year 5 child with diabetes has missed a snack and becomes pale, shaky and confused. Two other children feel faint. \u003cstrong>What do you do?\u003c/strong> You move all three into shade and cool air, check the child with diabetes first, follow the IHP for hypoglycaemia, give fluids and cool the other two, and call 998 if anyone is confused and does not improve. You tell the group leader and the school, and you note the times."}}],"checks":[{"id":"m5q1","q":{"en":"A fire alarm sounds and you are in the clinic with a child who has a severe allergy. What should you take to the assembly point?","ar":"A fire alarm sounds and you are in the clinic with a child who has a severe allergy. What should you take to the assembly point?"},"opts":[{"en":"The student IHP list, the emergency bag and the child's emergency medication","ar":"The student IHP list, the emergency bag and the child's emergency medication"},{"en":"Only the clinic keys, since the building must be locked","ar":"Only the clinic keys, since the building must be locked"},{"en":"Only the attendance register and the visitors book from the main office, as these list who is on site","ar":"Only the attendance register and the visitors book from the main office, as these list who is on site"},{"en":"Nothing, because the fire service will handle all medical needs","ar":"Nothing, because the fire service will handle all medical needs"}],"correct":0,"expl":{"en":"You need the IHP list, emergency bag and the child's medication at the assembly point so you can treat and account for vulnerable students.","ar":"You need the IHP list, emergency bag and the child's medication at the assembly point so you can treat and account for vulnerable students."}},{"id":"m5q2","q":{"en":"During a lockdown, which action is most appropriate for the nurse in the clinic?","ar":"During a lockdown, which action is most appropriate for the nurse in the clinic?"},"opts":[{"en":"Open the door to let other students in from the corridor and keep the lights and phones on","ar":"Open the door to let other students in from the corridor and keep the lights and phones on"},{"en":"Lock the door, keep quiet, keep emergency medication to hand, wait for the all-clear","ar":"Lock the door, keep quiet, keep emergency medication to hand, wait for the all-clear"},{"en":"Leave the clinic to find the Principal for instructions","ar":"Leave the clinic to find the Principal for instructions"},{"en":"Switch the lights on and phone parents on speaker","ar":"Switch the lights on and phone parents on speaker"}],"correct":1,"expl":{"en":"Follow the lockdown procedure: secure the room, stay quiet and out of sight, and keep medication ready until leadership gives the all-clear.","ar":"Follow the lockdown procedure: secure the room, stay quiet and out of sight, and keep medication ready until leadership gives the all-clear."}},{"id":"m5q3","q":{"en":"A student on an outdoor activity becomes confused and has very hot skin. What is the best response?","ar":"A student on an outdoor activity becomes confused and has very hot skin. What is the best response?"},"opts":[{"en":"Give a large drink and ask them to walk it off in the sun","ar":"Give a large drink and ask them to walk it off in the sun"},{"en":"Wait to see if the confusion clears within the hour","ar":"Wait to see if the confusion clears within the hour"},{"en":"Treat as heat stroke: cool actively, move to shade and call 998","ar":"Treat as heat stroke: cool actively, move to shade and call 998"},{"en":"Wrap them in a blanket to stop shivering","ar":"Wrap them in a blanket to stop shivering"}],"correct":2,"expl":{"en":"Confusion with heat exposure suggests heat stroke, a medical emergency. Cool the child and call 998.","ar":"Confusion with heat exposure suggests heat stroke, a medical emergency. Cool the child and call 998."}}]},{"id":"m6","title":{"en":"Handover, Parents, Debrief, Records and Drills","ar":"Handover, Parents, Debrief, Records and Drills"},"minutes":15,"blocks":[{"t":"p","c":{"en":"The emergency does not end when the ambulance leaves. How you hand over, speak to parents, record what happened, and learn from the incident is part of safe practice, and is what the school and the family will rely on afterwards.","ar":"The emergency does not end when the ambulance leaves. How you hand over, speak to parents, record what happened, and learn from the incident is part of safe practice, and is what the school and the family will rely on afterwards."}},{"t":"h","c":{"en":"A clear handover to the ambulance crew","ar":"A clear handover to the ambulance crew"}},{"t":"p","c":{"en":"Use a structured format. A simple pattern that works is: \u003cstrong>Who\u003c/strong> (name, age, relevant conditions and IHP), \u003cstrong>What happened\u003c/strong> (brief history and time), \u003cstrong>What you found\u003c/strong> (observations), \u003cstrong>What you did\u003c/strong> (treatments, medication given and times, AED use) and \u003cstrong>What is needed\u003c/strong> (your concerns). Hand over written notes, the used auto-injector and a copy of the IHP, and tell the crew where the child is being taken.","ar":"Use a structured format. A simple pattern that works is: \u003cstrong>Who\u003c/strong> (name, age, relevant conditions and IHP), \u003cstrong>What happened\u003c/strong> (brief history and time), \u003cstrong>What you found\u003c/strong> (observations), \u003cstrong>What you did\u003c/strong> (treatments, medication given and times, AED use) and \u003cstrong>What is needed\u003c/strong> (your concerns). Hand over written notes, the used auto-injector and a copy of the IHP, and tell the crew where the child is being taken."}},{"t":"h","c":{"en":"Communicating with parents and guardians","ar":"Communicating with parents and guardians"}},{"t":"list","c":{"en":["Contact parents or guardians promptly, ideally through a senior colleague, so you stay with the child. Use the emergency contact details held by the school.","Give facts in plain, calm language: what happened, what has been done, where the child is going and who is with them. Do not speculate on cause or give a prognosis you cannot know.","Do not apportion blame, and avoid promising outcomes. If the news is serious, ask for a senior colleague to speak with the family in person.","If a parent cannot be reached, follow the school's procedure and keep trying. A trusted staff member accompanies the child to hospital."],"ar":["Contact parents or guardians promptly, ideally through a senior colleague, so you stay with the child. Use the emergency contact details held by the school.","Give facts in plain, calm language: what happened, what has been done, where the child is going and who is with them. Do not speculate on cause or give a prognosis you cannot know.","Do not apportion blame, and avoid promising outcomes. If the news is serious, ask for a senior colleague to speak with the family in person.","If a parent cannot be reached, follow the school's procedure and keep trying. A trusted staff member accompanies the child to hospital."]}},{"t":"callout","k":"warn","title":{"en":"Never delay emergency care to find a parent","ar":"Never delay emergency care to find a parent"},"c":{"en":"Parental consent is not needed to call 998 or to give lifesaving first aid in an emergency. Emergency treatment goes ahead; contact with the family runs alongside it.","ar":"Parental consent is not needed to call 998 or to give lifesaving first aid in an emergency. Emergency treatment goes ahead; contact with the family runs alongside it."}},{"t":"h","c":{"en":"Records","ar":"Records"}},{"t":"list","c":{"en":["Record as soon as you can, while it is fresh: times, observations, actions, medication given, and who was involved. Keep it \u003cstrong>factual, timed and signed\u003c/strong>.","Health information is sensitive personal data. Store and share it as the school's records and data protection policy requires, and in line with UAE data protection and health-information confidentiality law. Share only with those who need to know.","If the incident involved a medication error, an equipment fault or a near-miss, report it through the school's incident process."],"ar":["Record as soon as you can, while it is fresh: times, observations, actions, medication given, and who was involved. Keep it \u003cstrong>factual, timed and signed\u003c/strong>.","Health information is sensitive personal data. Store and share it as the school's records and data protection policy requires, and in line with UAE data protection and health-information confidentiality law. Share only with those who need to know.","If the incident involved a medication error, an equipment fault or a near-miss, report it through the school's incident process."]}},{"t":"h","c":{"en":"Post-incident debrief","ar":"Post-incident debrief"}},{"t":"list","c":{"en":["Hold a short, supportive debrief within a day or two, while keeping it blame-free: what went well, what was difficult, what should change.","Check on staff and students who witnessed the event. Some will need extra support, and you are also entitled to it.","Feed learning into the emergency plan, equipment checks and training. Record the actions agreed and who will do them."],"ar":["Hold a short, supportive debrief within a day or two, while keeping it blame-free: what went well, what was difficult, what should change.","Check on staff and students who witnessed the event. Some will need extra support, and you are also entitled to it.","Feed learning into the emergency plan, equipment checks and training. Record the actions agreed and who will do them."]}},{"t":"h","c":{"en":"Drills and readiness","ar":"Drills and readiness"}},{"t":"list","c":{"en":["Take part in regular drills that include medical scenarios, not only fire evacuation.","Check the emergency equipment on a fixed schedule: AED pads and battery, emergency bag, spare inhalers and auto-injectors (school supply where policy allows), and expiry dates.","Keep your own BLS and first-aid skills current, and encourage practice for all trained first-aiders."],"ar":["Take part in regular drills that include medical scenarios, not only fire evacuation.","Check the emergency equipment on a fixed schedule: AED pads and battery, emergency bag, spare inhalers and auto-injectors (school supply where policy allows), and expiry dates.","Keep your own BLS and first-aid skills current, and encourage practice for all trained first-aiders."]}},{"t":"scenario","title":{"en":"Scenario: the debrief","ar":"Scenario: the debrief"},"c":{"en":"After a Year 6 child with a severe allergic reaction has gone to hospital, a teaching assistant says she is shaking and keeps replaying the event. A colleague suggests \"we should not talk about it\". \u003cstrong>What do you do?\u003c/strong> You offer her a private, calm conver
