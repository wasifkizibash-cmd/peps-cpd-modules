sation, tell her she acted well, explain where she can get further support, and arrange a blame-free team debrief. You also record the incident accurately and flag one learning point, that the auto-injector was in a different bag from the child, to leadership.","ar":"After a Year 6 child with a severe allergic reaction has gone to hospital, a teaching assistant says she is shaking and keeps replaying the event. A colleague suggests \"we should not talk about it\". \u003cstrong>What do you do?\u003c/strong> You offer her a private, calm conversation, tell her she acted well, explain where she can get further support, and arrange a blame-free team debrief. You also record the incident accurately and flag one learning point, that the auto-injector was in a different bag from the child, to leadership."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Know the plan, equipment and roles before the emergency, and delegate by name. \u003cstrong>2.\u003c/strong> Assess quickly, trust your concern, and call 998 early with a precise location. \u003cstrong>3.\u003c/strong> Unresponsive and not breathing normally means compressions, the AED, and a team. \u003cstrong>4.\u003c/strong> Act without delay in anaphylaxis, severe asthma, seizures, hypoglycaemia and bleeding, following the IHP. \u003cstrong>5.\u003c/strong> Hand over clearly, record factually, keep information confidential, and debrief without blame. \u003cem>Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/em>","ar":"\u003cstrong>1.\u003c/strong> Know the plan, equipment and roles before the emergency, and delegate by name. \u003cstrong>2.\u003c/strong> Assess quickly, trust your concern, and call 998 early with a precise location. \u003cstrong>3.\u003c/strong> Unresponsive and not breathing normally means compressions, the AED, and a team. \u003cstrong>4.\u003c/strong> Act without delay in anaphylaxis, severe asthma, seizures, hypoglycaemia and bleeding, following the IHP. \u003cstrong>5.\u003c/strong> Hand over clearly, record factually, keep information confidential, and debrief without blame. \u003cem>Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/em>"}}],"checks":[{"id":"m6q1","q":{"en":"What is a good structure for a handover to the ambulance crew?","ar":"What is a good structure for a handover to the ambulance crew?"},"opts":[{"en":"A full written history of the child since they joined school","ar":"A full written history of the child since they joined school"},{"en":"Only the child's name and the time the call was made","ar":"Only the child's name and the time the call was made"},{"en":"A list of every adult present and what each one said","ar":"A list of every adult present and what each one said"},{"en":"Who, what happened, what you found, what you did and what is needed","ar":"Who, what happened, what you found, what you did and what is needed"}],"correct":3,"expl":{"en":"A short, structured handover (who, what happened, findings, actions, needs) gives the crew what they need quickly.","ar":"A short, structured handover (who, what happened, findings, actions, needs) gives the crew what they need quickly."}},{"id":"m6q2","q":{"en":"A parent cannot be reached during an emergency. What should happen?","ar":"A parent cannot be reached during an emergency. What should happen?"},"opts":[{"en":"Emergency care and the 998 call go ahead, and efforts to reach the family continue","ar":"Emergency care and the 998 call go ahead, and efforts to reach the family continue"},{"en":"Treatment is delayed until a parent or guardian gives verbal consent by phone or message","ar":"Treatment is delayed until a parent or guardian gives verbal consent by phone or message"},{"en":"The child is sent home to wait with a friend's family","ar":"The child is sent home to wait with a friend's family"},{"en":"The nurse waits for the Principal to find the parent first","ar":"The nurse waits for the Principal to find the parent first"}],"correct":0,"expl":{"en":"Lifesaving care does not depend on parental consent. Keep trying to contact the family while care continues.","ar":"Lifesaving care does not depend on parental consent. Keep trying to contact the family while care continues."}},{"id":"m6q3","q":{"en":"Which approach to a post-incident debrief is most appropriate?","ar":"Which approach to a post-incident debrief is most appropriate?"},"opts":[{"en":"A private review that names the staff member at fault","ar":"A private review that names the staff member at fault"},{"en":"A blame-free review of what went well and what to change, with support for staff","ar":"A blame-free review of what went well and what to change, with support for staff"},{"en":"No debrief unless the child suffered permanent harm","ar":"No debrief unless the child suffered permanent harm"},{"en":"A review limited to checking that the paperwork is complete and the equipment restocked","ar":"A review limited to checking that the paperwork is complete and the equipment restocked"}],"correct":1,"expl":{"en":"A blame-free debrief supports learning and wellbeing, and leads to improvements in plans and training.","ar":"A blame-free debrief supports learning and wellbeing, and leads to improvements in plans and training."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"The school's emergency plan names the nurse as clinical lead. Which action best fits that role during a collapse?","ar":"The school's emergency plan names the nurse as clinical lead. Which action best fits that role during a collapse?"},"opts":[{"en":"Go to the office to coordinate the parents' calls yourself","ar":"Go to the office to coordinate the parents' calls yourself"},{"en":"Perform all tasks yourself so nothing is missed or delayed","ar":"Perform all tasks yourself so nothing is missed or delayed"},{"en":"Stay with the child, direct helpers by name, and let others call and fetch equipment","ar":"Stay with the child, direct helpers by name, and let others call and fetch equipment"},{"en":"Wait in the clinic until staff bring the child to you, then begin your assessment there","ar":"Wait in the clinic until staff bring the child to you, then begin your assessment there"}],"correct":2},{"id":"e2","mod":1,"q":{"en":"You arrive at an emergency and a crowd is gathering. Which is the best first step?","ar":"You arrive at an emergency and a crowd is gathering. Which is the best first step?"},"opts":[{"en":"Ask the crowd who saw what happened before examining the child","ar":"Ask the crowd who saw what happened before examining the child"},{"en":"Start treatment alone and ask the group to stay close by","ar":"Start treatment alone and ask the group to stay close by"},{"en":"Wait for senior leadership to arrive and give instructions","ar":"Wait for senior leadership to arrive and give instructions"},{"en":"Send named adults to call 998, bring the AED and move students away","ar":"Send named adults to call 998, bring the AED and move students away"}],"correct":3},{"id":"e3","mod":1,"q":{"en":"During a review you find that the AED is kept in a locked office that only two people can open. What is the best response?","ar":"During a review you find that the AED is kept in a locked office that only two people can open. What is the best response?"},"opts":[{"en":"Report the access problem to leadership and ask for a fast, known route to it","ar":"Report the access problem to leadership and ask for a fast, known route to it"},{"en":"Keep the arrangement because a locked office best protects the equipment from loss or theft","ar":"Keep the arrangement because a locked office best protects the equipment from loss or theft"},{"en":"Tell the nurse alone where the key is kept to save time","ar":"Tell the nurse alone where the key is kept to save time"},{"en":"Move the AED to the clinic and tell nobody else about it","ar":"Move the AED to the clinic and tell nobody else about it"}],"correct":0},{"id":"e4","mod":2,"q":{"en":"A Year 2 child is quiet, grey and breathing fast after a fall, but says she is \"fine\". What is the best action?","ar":"A Year 2 child is quiet, grey and breathing fast after a fall, but says she is \"fine\". What is the best action?"},"opts":[{"en":"Give a drink and rest for ten minutes, then return her to class if she says she is fine","ar":"Give a drink and rest for ten minutes, then return her to class if she says she is fine"},{"en":"Do a structured assessment and call 998 if breathing or colour does not improve","ar":"Do a structured assessment and call 998 if breathing or colour does not improve"},{"en":"Wait for her parents to collect her and give an opinion","ar":"Wait for her parents to collect her and give an opinion"},{"en":"Ask her teacher whether she is usually this quiet in lessons","ar":"Ask her teacher whether she is usually this quiet in lessons"}],"correct":1},{"id":"e5","mod":2,"q":{"en":"Which of these is a red flag for calling 998 immediately?","ar":"Which of these is a red flag for calling 998 immediately?"},"opts":[{"en":"A child who has a mild headache and wants to lie down","ar":"A child who has a mild headache and wants to lie down"},{"en":"A child who feels slightly sick before an exam","ar":"A child who feels slightly sick before an exam"},{"en":"A child who cannot speak in full sentences and has blue lips","ar":"A child who cannot speak in full sentences and has blue lips"},{"en":"A child with a small graze that has stopped bleeding","ar":"A child with a small graze that has stopped bleeding"}],"correct":2},{"id":"e6","mod":2,"q":{"en":"You call 998 for a child collapsed behind the sports hall. What should you say about location?","ar":"You call 998 for a child collapsed behind the sports hall. What should you say about location?"},"opts":[{"en":"Say it is a school in Sharjah and the crew will look for it","ar":"Say it is a school in Sharjah and the crew will look for it"},{"en":"Give only the child's name and class to avoid confusion","ar":"Give only the child's name and class to avoid confusion"},{"en":"Offer to call back with the full details once the child is stable and the crew is on its way","ar":"Offer to call back with the full details once the child is stable and the crew is on its way"},{"en":"Give the school name, the area, the gate to use and where on site the child is","ar":"Give the school name, the area, the gate to use and where on site the child is"}],"correct":3},{"id":"e7","mod":3,"q":{"en":"A teacher says a collapsed student is \"making funny noises, so he is breathing\". He is unresponsive. What do you do?","ar":"A teacher says a collapsed student is \"making funny noises, so he is breathing\". He is unresponsive. What do you do?"},"opts":[{"en":"Treat as cardiac arrest if breathing is not normal: call 998, start compressions, use the AED","ar":"Treat as cardiac arrest if breathing is not normal: call 998, start compressions, use the AED"},{"en":"Place him on his side and check again after several minutes","ar":"Place him on his side and check again after several minutes"},{"en":"Give him a few sips of water to see if he responds","ar":"Give him a few sips of water to see if he responds"},{"en":"Tell the teacher to take his pulse for a full minute first and only then call 998 if it is absent","ar":"Tell the teacher to take his pulse for a full minute first and only then call 998 if it is absent"}],"correct":0},{"id":"e8","mod":3,"q":{"en":"Two rescuers are giving CPR to a child. Which describes the correct technique?","ar":"Two rescuers are giving CPR to a child. Which describes the correct technique?"},"opts":[{"en":"15 compressions to 2 breaths, as hard and fast as possible","ar":"15 compressions to 2 breaths, as hard and fast as possible"},{"en":"30 compressions to 2 breaths, at 100 to 120 per minute, to about one third chest depth","ar":"30 compressions to 2 breaths, at 100 to 120 per minute, to about one third chest depth"},{"en":"30 compressions to 2 breaths, pressing down just a few centimetres each time","ar":"30 compressions to 2 breaths, pressing down just a few centimetres each time"},{"en":"30 compressions to 5 breaths, with long pauses between sets","ar":"30 compressions to 5 breaths, with long pauses between sets"}],"correct":1},{"id":"e9","mod":3,"q":{"en":"The AED pads supplied are adult size and no paediatric pads are available for a younger child in arrest. What should you do?","ar":"The AED pads supplied are adult size and no paediatric pads are available for a younger child in arrest. What should you do?"},"opts":[{"en":"Do not use the AED because the pads are the wrong size, and continue compressions alone","ar":"Do not use the AED because the pads are the wrong size, and continue compressions alone"},{"en":"Cut the adult pads in half to make them smaller","ar":"Cut the adult pads in half to make them smaller"},{"en":"Use the adult pads as guided by the device, rather than not defibrillating","ar":"Use the adult pads as guided by the device, rather than not defibrillating"},{"en":"Wait for the ambulance crew to bring child pads","ar":"Wait for the ambulance crew to bring child pads"}],"correct":2},{"id":"e10","mod":3,"q":{"en":"After the AED delivers a shock, what should happen next?","ar":"After the AED delivers a shock, what should happen next?"},"opts":[{"en":"Check for a pulse for at least a minute before restarting compressions or doing anything else","ar":"Check for a pulse for at least a minute before restarting compressions or doing anything else"},{"en":"Wait for the AED to analyse again before touching the child","ar":"Wait for the AED to analyse again before touching the child"},{"en":"Stop and move the child into the recovery position","ar":"Stop and move the child into the recovery position"},{"en":"Restart compressions straight away unless the AED advises otherwise","ar":"Restart compressions straight away unless the AED advises otherwise"}],"correct":3},{"id":"e11","mod":4,"q":{"en":"A child with a known allergy has facial swelling, wheeze and faintness after a snack. The IHP lists an adrenaline auto-injector. What is the best action?","ar":"A child with a known allergy has facial swelling, wheeze and faintness after a snack. The IHP lists an adrenaline auto-injector. What is the best action?"},"opts":[{"en":"Give the auto-injector as per the IHP and your training, then call 998","ar":"Give the auto-injector as per the IHP and your training, then call 998"},{"en":"Give an antihistamine first and review in 15 minutes","ar":"Give an antihistamine first and review in 15 minutes"},{"en":"Call the parents to check whether to use the injector, and wait for their reply first","ar":"Call the parents to check whether to use the injector, and wait for their reply first"},{"en":"Sit the child up and wait for the swelling to settle","ar":"Sit the child up and wait for the swelling to settle"}],"correct":0},{"id":"e12","mod":4,"q":{"en":"A child has a seizure lasting over 5 minutes in the classroom. What should be done?","ar":"A child has a seizure lasting over 5 minutes in the classroom. What should be done?"},"opts":[{"en":"Put a soft object in the mouth to protect the tongue","ar":"Put a soft object in the mouth to protect the tongue"},{"en":"Call 998, protect the head, stay with the child and keep timing","ar":"Call 998, protect the head, stay with the child and keep timing"},{"en":"Hold the limbs firmly to reduce the jerking","ar":"Hold the limbs firmly to reduce the jerking"},{"en":"Wait until it stops before deciding whether to call","ar":"Wait until it stops before deciding whether to call"}],"correct":1},{"id":"e13","mod":4,"q":{"en":"A child with diabetes is shaky, pale and confused but can swallow. What is the appropriate response?","ar":"A child with diabetes is shaky, pale and confused but can swallow. What is the appropriate response?"},"opts":[{"en":"Give a large meal and ask the child to lie down alone in the clinic until it passes","ar":"Give a large meal and ask the child to lie down alone in the clinic until it passes"},{"en":"Wait for the next scheduled glucose check","ar":"Wait for the next scheduled glucose check"},{"en":"Check glucose if able and give fast-acting sugar per the IHP, then monitor","ar":"Check glucose if able and give fast-acting sugar per the IHP, then monitor"},{"en":"Give nothing by mouth and call the parents first","ar":"Give nothing by mouth and call the parents first"}],"correct":2},{"id":"e14","mod":4,"q":{"en":"A boy has a deep cut on his forearm and blood is soaking through the pad. What should you do?","ar":"A boy has a deep cut on his forearm and blood is soaking through the pad. What should you do?"},"opts":[{"en":"Remove the soaked pad and replace it with a fresh one each minute to check the bleeding","ar":"Remove the soaked pad and replace it with a fresh one each minute to check the bleeding"},{"en":"Apply a tourniquet immediately at the shoulder","ar":"Apply a tourniquet immediately at the shoulder"},{"en":"Rinse the wound for 20 minutes before applying pressure","ar":"Rinse the wound for 20 minutes before applying pressure"},{"en":"Apply firm direct pressure, add more dressings on top and call 998","ar":"Apply firm direct pressure, add more dressings on top and call 998"}],"correct":3},{"id":"e15","mod":5,"q":{"en":"The fire alarm sounds during break. Which of the following is most important for the nurse to bring to the assembly point?","ar":"The fire alarm sounds during break. Which of the following is most important for the nurse to bring to the assembly point?"},"opts":[{"en":"The emergency bag and the list of students with IHPs and emergency medication","ar":"The emergency bag and the list of students with IHPs and emergency medication"},{"en":"The clinic computer so records can be updated outside","ar":"The clinic computer so records can be updated outside"},{"en":"The visitors' signing-in book from the front office","ar":"The visitors' signing-in book from the front office"},{"en":"The key to the clinic so that nobody can enter it","ar":"The key to the clinic so that nobody can enter it"}],"correct":0},{"id":"e16","mod":5,"q":{"en":"During a lockdown, a child with asthma becomes wheezy. What is the best approach?","ar":"During a lockdown, a child with asthma becomes wheezy. What is the best approach?"},"opts":[{"en":"Open the door and take the child along the corridor to the clinic at once to collect the reliever","ar":"Open the door and take the child along the corridor to the clinic at once to collect the reliever"},{"en":"Give the reliever per the IHP quietly in the secure room, and call 998 if severe","ar":"Give the reliever per the IHP quietly in the secure room, and call 998 if severe"},{"en":"Tell the child to stay quiet and wait until the all-clear","ar":"Tell the child to stay quiet and wait until the all-clear"},{"en":"Send a student to tell the Principal while the door is open","ar":"Send a student to tell the Principal while the door is open"}],"correct":1},{"id":"e17","mod":5,"q":{"en":"A group on a hot-weather trip includes a wheelchair user and a child with severe allergy. Which preparation is most useful?","ar":"A group on a hot-weather trip includes a wheelchair user and a child with severe allergy. Which preparation is most useful?"},"opts":[{"en":"A general plan that applies to all students in the same way","ar":"A general plan that applies to all students in the same way"},{"en":"A plan that relies on students to tell staff when they need help","ar":"A plan that relies on students to tell staff when they need help"},{"en":"A named adult and route for the wheelchair user, plus IHP and medication in the bag","ar":"A named adult and route for the wheelchair user, plus IHP and medication in the bag"},{"en":"No special plan, since the trip leader is in charge of all needs and will manage on the day","ar":"No special plan, since the trip leader is in charge of all needs and will manage on the day"}],"correct":2},{"id":"e18","mod":6,"q":{"en":"You are handing over a child to the ambulance crew. Which of the following should you include?","ar":"You are handing over a child to the ambulance crew. Which of the following should you include?"},"opts":[{"en":"Your own opinion of the likely cause of the incident and a clear view on who was at fault","ar":"Your own opinion of the likely cause of the incident and a clear view on who was at fault"},{"en":"A summary of all the child's past school behaviour","ar":"A summary of all the child's past school behaviour"},{"en":"The names of every student who saw the incident","ar":"The names of every student who saw the incident"},{"en":"What happened, observations, treatments and times, medication given and your concerns","ar":"What happened, observations, treatments and times, medication given and your concerns"}],"correct":3},{"id":"e19","mod":6,"q":{"en":"A parent asks for details of an incident involving another child who also needed first aid. What is the right response?","ar":"A parent asks for details of an incident involving another child who also needed first aid. What is the right response?"},"opts":[{"en":"Share information only about the parent's own child and keep others' health information private","ar":"Share information only about the parent's own child and keep others' health information private"},{"en":"Share all the facts about the event and everyone involved, to be fully open and transparent with the parent","ar":"Share all the facts about the event and everyone involved, to be fully open and transparent with the parent"},{"en":"Give the other child's name so the parents can speak","ar":"Give the other child's name so the parents can speak"},{"en":"Refuse to say anything at all about their own child","ar":"Refuse to say anything at all about their own child"}],"correct":0},{"id":"e20","mod":6,"q":{"en":"A child's incident record is requested by a staff member who was not involved and has no role in the child's care. What is the right response?","ar":"A child's incident record is requested by a staff member who was not involved and has no role in the child's care. What is the right response?"},"opts":[{"en":"Share it freely, because all staff work for the same school","ar":"Share it freely, because all staff work for the same school"},{"en":"Share only with those who need to know, in line with the records policy","ar":"Share only with those who need to know, in line with the records policy"},{"en":"Post a summary on the staff room board to inform everyone","ar":"Post a summary on the staff room board to inform everyone"},{"en":"Send the full record by personal messaging to save time","ar":"Send the full record by personal messaging to save time"}],"correct":1}]};

/* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;
if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const ARR_N = () => S.lang==='ar' ? '←' : '→';
const ARR_P = () => S.lang==='ar' ? '→' : '←';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
