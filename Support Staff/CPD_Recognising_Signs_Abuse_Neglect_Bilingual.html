#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"recognising-signs-abuse-neglect","code":"RSA","passMark":80,"hours":"2 hours","accent":"#0F6B6B","accentSoft":"#E2F1F0","eyebrow":{"en":"Staff CPD · Safeguarding · Level 2 content · Performance Standard 5","ar":"تطوير مهني للموظفين · الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> · محتوى المستوى الثاني · المعيار الخامس"},"title":{"en":"Recognising Signs of Abuse and Neglect","ar":"التعرّف إلى علامات الإساءة والإهمال"},"subtitle":{"en":"A self-paced module for staff who work regularly with students. It builds on the PEPS definitions of physical, emotional and sexual abuse and neglect, and shows what staff may notice, why patterns matter, and what to do next. It is about noticing and reporting, never diagnosing.","ar":"وحدة ذاتية الوتيرة للموظفين الذين يعملون مع الطلبة بانتظام. تبني على تعريفات المدرسة للإساءة الجسدية والعاطفية والجنسية والإهمال، وتبيّن ما قد يلاحظه الموظفون، ولماذا تهمّ الأنماط، وما يجب فعله بعد ذلك. محورها الملاحظة والإبلاغ وليس التشخيص أبدًا."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"نحو ساعتين، بوتيرة ذاتية بالكامل"},"standard":{"en":"UAE School Inspection Framework · Performance Standard 5 (Protection, Care, Guidance & Support)","ar":"إطار الإشراف على المدارس في الإمارات · المعيار الخامس (الحماية والرعاية والتوجيه والدعم)"},"source":{"en":"PEPS Child Protection & Safeguarding Policy (Level 3) 2026–2027, Sections 3 and 5","ar":"سياسة حماية الطفل وصونه في مدرسة PEPS (المستوى الثالث) 2026–2027، القسمان 3 و5"}},"modules":[{"id":"m1","title":{"en":"Noticing: Why Recognition Matters","ar":"الملاحظة: لماذا يهمّ التعرّف إلى العلامات؟"},"minutes":15,"blocks":[{"t":"p","c":{"en":"This module builds on \u003cem>Child Protection & Safeguarding Awareness\u003c/em>. The PEPS three-tier training framework expects staff with regular contact with students (Level 2) to have a \u003cstrong>deeper understanding of the indicators of abuse and neglect\u003c/strong>. That is what this CPD develops.","ar":"تبني هذه الوحدة على وحدة \u003cem>التوعية بحماية الطفل وصون سلامته\u003c/em>. ويتوقع إطار التدريب ثلاثي المستويات في المدرسة من الموظفين ذوي الاتصال المنتظم بالطلبة (المستوى الثاني) أن يمتلكوا \u003cstrong>فهمًا أعمق لمؤشرات الإساءة والإهمال\u003c/strong>. وهذا ما تنمّيه هذه الوحدة."}},{"t":"callout","k":"key","title":{"en":"Signs are a reason to look closer, not proof","ar":"العلامات سبب للتدقيق وليست دليلًا قاطعًا"},"c":{"en":"Your job is to \u003cstrong>notice, record and report\u003c/strong>. It is never to diagnose, investigate or decide whether abuse has happened. That decision belongs to the Designated Safeguarding Lead (DSL) and, where needed, the external agencies.","ar":"مهمتك أن \u003cstrong>تلاحظ وتسجّل وتبلّغ\u003c/strong>. وليست مهمتك أبدًا أن تشخّص أو تحقّق أو تقرر ما إذا كانت الإساءة قد وقعت. فهذا القرار يعود إلى مسؤول حماية الطفل المعيّن (DSL) وإلى الجهات الخارجية عند الحاجة."}},{"t":"h","c":{"en":"Three ways a child may show you something is wrong","ar":"ثلاث طرق قد يُظهر بها الطفل أن شيئًا ما ليس على ما يرام"}},{"t":"list","c":{"en":["\u003cstrong>What you see:\u003c/strong> injuries, appearance, hygiene, clothing, signs of poor health.","\u003cstrong>What you notice in behaviour:\u003c/strong> changes in mood, attendance, concentration, play, and relationships with adults and other children.","\u003cstrong>What a child says or shows:\u003c/strong> a direct disclosure, a hint, a comment in passing, or something in their writing, drawing, play or online activity."],"ar":["\u003cstrong>ما تراه:\u003c/strong> الإصابات والمظهر والنظافة والملابس وعلامات اعتلال الصحة.","\u003cstrong>ما تلاحظه في السلوك:\u003c/strong> تغيّرات في المزاج والحضور والتركيز واللعب والعلاقات مع البالغين والأطفال الآخرين.","\u003cstrong>ما يقوله الطفل أو يُظهره:\u003c/strong> إفصاح مباشر أو تلميح أو تعليق عابر أو شيء في كتابته أو رسمه أو لعبه أو نشاطه عبر الإنترنت."]}},{"t":"h","c":{"en":"Why patterns and changes matter","ar":"لماذا تهمّ الأنماط والتغيّرات"}},{"t":"p","c":{"en":"One sign on its own is rarely conclusive. Staff who see a child every day are best placed to notice a \u003cstrong>change from that child's usual behaviour\u003c/strong>, a sign that keeps repeating, or several different signs appearing together. Record each one. The DSL keeps accurate records for every child about whom a concern has been raised, so your note may be the missing piece that completes a picture only the DSL can see.","ar":"نادرًا ما تكون علامة واحدة قاطعة بمفردها. والموظفون الذين يرون الطفل كل يوم هم الأقدر على ملاحظة \u003cstrong>تغيّر عن سلوكه المعتاد\u003c/strong> أو علامة تتكرر أو عدة علامات مختلفة تظهر معًا. سجّل كل واحدة منها. فمسؤول الحماية يحتفظ بسجلات دقيقة لكل طفل رُفع بشأنه قلق، وقد تكون ملاحظتك القطعة الناقصة التي تكمل صورة لا يراها إلا هو."}},{"t":"callout","k":"warn","title":{"en":"Do not wait for certainty","ar":"لا تنتظر اليقين"},"c":{"en":"Staff do not need to be certain that abuse is taking place before raising a concern. Report all concerns, however minor they may seem. Deciding what happens next sits with the DSL, not with the member of staff who noticed the concern.","ar":"لا يلزم أن يكون الموظف متأكدًا من وقوع الإساءة قبل أن يرفع مخاوفه. أبلغ عن جميع المخاوف مهما بدت بسيطة. وقرار ما يحدث بعد ذلك يعود إلى مسؤول الحماية وليس إلى الموظف الذي لاحظ القلق."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: check your assumptions","ar":"ممارسة مهنية جيدة: راجع افتراضاتك"},"c":{"en":"It is easy to explain signs away: “he is just clumsy”, “she has always been shy”, “that is how their family is”. Every child has an equal right to protection, whatever their age, ability, culture, language or background. Ask yourself whether you would still be reassured if the same signs appeared in a different child.","ar":"من السهل تبرير العلامات: «إنه خرِق فحسب»، «هي خجولة دائمًا»، «هكذا هي أسرتهم». لكل طفل حقٌّ متساوٍ في الحماية أيًّا كان عمره أو قدراته أو ثقافته أو لغته أو خلفيته. اسأل نفسك: هل كنت سترتاح لو ظهرت العلامات نفسها على طفل آخر؟"}}],"checks":[{"id":"m1q1","q":{"en":"A usually cheerful Year 4 student has become quiet and tearful over two weeks and flinches when a teacher raises their voice. What is the best response?","ar":"طالب في الصف الرابع كان مرحًا عادةً أصبح هادئًا وباكيًا خلال أسبوعين ويجفل عندما يرفع المعلم صوته. ما أفضل استجابة؟"},"opts":[{"en":"Record what you have seen, with dates, and report it to the DSL the same day. The DSL decides what the signs mean","ar":"سجّل ما رأيته مع التواريخ وأبلغ مسؤول الحماية في اليوم نفسه. فهو من يقرر ما تعنيه العلامات"},{"en":"Wait another few weeks, because a single change is not enough to report","ar":"انتظر أسابيع أخرى لأن تغيّرًا واحدًا لا يكفي للإبلاغ"},{"en":"Ask the child directly whether anyone at home is hurting them","ar":"اسأل الطفل مباشرةً هل يؤذيه أحد في المنزل"},{"en":"Tell the parents you suspect the child is being abused","ar":"أخبر الوالدين بأنك تشك في تعرض الطفل للإساءة"}],"correct":0,"expl":{"en":"Changes in behaviour are exactly what staff are well placed to notice. Record the facts and report the same day. Do not question the child, and do not contact the family. The DSL decides what happens next.","ar":"التغيّرات في السلوك هي بالضبط ما يستطيع الموظفون ملاحظته. سجّل الوقائع وأبلغ في اليوم نفسه. لا تستجوب الطفل ولا تتصل بالأسرة. فمسؤول الحماية هو من يقرر الخطوة التالية."}},{"id":"m1q2","q":{"en":"Which statement best describes your role when you notice possible signs of abuse or neglect?","ar":"أي العبارات التالية تصف دورك على أفضل وجه عندما تلاحظ علامات محتملة للإساءة أو الإهمال؟"},"opts":[{"en":"Investigate until you can confirm abuse before you raise it with anyone","ar":"أن تحقّق حتى تتأكد من الإساءة قبل أن تطرح الأمر على أحد"},{"en":"Notice, record the facts and report to the DSL. The DSL and agencies decide whether abuse has occurred","ar":"أن تلاحظ وتسجّل الوقائع وتبلّغ مسؤول الحماية. فهو والجهات المعنية يقرران هل وقعت إساءة"},{"en":"Work out exactly which category of abuse it is before reporting","ar":"أن تحدد بدقة أي فئات الإساءة هي قبل الإبلاغ"},{"en":"Report only when several different signs have appeared together","ar":"ألا تبلّغ إلا عندما تظهر عدة علامات مختلفة معًا"}],"correct":1,"expl":{"en":"Staff are not investigators or diagnosticians. They notice, record and report, and the DSL decides on next steps.","ar":"الموظفون ليسوا محققين ولا مشخّصين. هم يلاحظون ويسجّلون ويبلّغون، ويقرر مسؤول الحماية الخطوات التالية."}}]},{"id":"m2","title":{"en":"Physical Abuse: Recognising the Signs","ar":"الإساءة الجسدية: التعرّف إلى العلامات"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"The PEPS definition","ar":"تعريف المدرسة"},"c":{"en":"\u003cstrong>Physical abuse\u003c/strong> is the causing of physical harm or injury to a child, or the failure to prevent physical harm or suffering. This may involve hitting, shaking, throwing, poisoning, burning, or otherwise causing physical harm.","ar":"\u003cstrong>الإساءة الجسدية\u003c/strong> هي إلحاق أذى جسدي أو إصابة بالطفل، أو عدم منع الأذى أو المعاناة الجسدية. وقد تشمل الضرب أو الهزّ أو الرمي أو التسميم أو الحرق أو أي شكل آخر من إلحاق الأذى الجسدي."}},{"t":"h","c":{"en":"Possible signs","ar":"العلامات المحتملة"}},{"t":"table","head":{"en":["What you may see","What you may notice in behaviour"],"ar":["ما قد تراه","ما قد تلاحظه في السلوك"]},"rows":[{"en":["Injuries with no explanation, or with an explanation that changes or does not fit the injury","Flinching, or fear of physical contact or raised voices"],"ar":["إصابات دون تفسير، أو بتفسير يتغيّر أو لا يتناسب مع الإصابة","الجفلة أو الخوف من الاتصال الجسدي أو من ارتفاع الأصوات"]},{"en":["Bruises, burns, bite marks or scratches in unusual places, or in a recognisable pattern (for example the outline of a hand, belt or cord)","Reluctance to change for PE, or long sleeves and covered limbs in hot weather"],"ar":["كدمات أو حروق أو آثار عضّ أو خدوش في أماكن غير معتادة أو بنمط يمكن تمييزه (كشكل يد أو حزام أو سلك)","التردد في تبديل الملابس لحصة التربية البدنية، أو ارتداء أكمام طويلة وتغطية الأطراف في الطقس الحار"]},{"en":["Injuries that keep recurring","Fear of going home or of being collected by a particular person"],"ar":["إصابات تتكرر باستمرار","الخوف من العودة إلى المنزل أو من أن يستلمه شخص بعينه"]},{"en":["Untreated injuries, or an injury that has not received care that was clearly needed","Watchfulness around adults, sudden aggression or withdrawal"],"ar":["إصابات غير معالَجة أو إصابة لم تحصل على رعاية كان من الواضح أنها لازمة","يقظة مفرطة حول البالغين، أو عدوانية أو انسحاب مفاجئ"]}]},{"t":"callout","k":"tip","title":{"en":"Professional good practice: accidents happen","ar":"ممارسة مهنية جيدة: الحوادث تقع"},"c":{"en":"Children get bumps and bruises. Look at the \u003cstrong>location\u003c/strong> (shins and knees are common, soft areas such as the upper arms, neck or back are less so), the \u003cstrong>pattern\u003c/strong>, how often it happens, and whether the explanation fits. You do not need to decide which it is. Describe what you see and report.","ar":"يتعرض الأطفال للكدمات والرضوض. انظر إلى \u003cstrong>الموضع\u003c/strong> (الساقان والركبتان شائعتان، أما المناطق الرخوة كأعلى الذراعين والعنق والظهر فأقل شيوعًا)، وإلى \u003cstrong>النمط\u003c/strong>، وإلى مدى تكرار الأمر، وهل يتناسب التفسير مع الإصابة. ولا يلزمك أن تحسم أيّهما. صِف ما تراه وأبلغ."}},{"t":"h","c":{"en":"If you see an injury","ar":"إذا رأيت إصابة"}},{"t":"steps","c":{"en":["\u003cstrong>Medical needs come first.\u003c/strong> If the child needs care, take them to the school clinic.","\u003cstrong>Do not ask the child to remove clothing\u003c/strong> or show you more. Describe only what is already visible.","\u003cstrong>Do not ask leading questions.\u003c/strong> If the child starts to talk, follow the six steps for a disclosure.","\u003cstrong>Record\u003c/strong> what you saw (place, size, colour, appearance) and anything the child said, with the date and time.","\u003cstrong>Report to the DSL the same day.\u003c/strong> If there is a risk of immediate serious harm, contact the Police directly."],"ar":["\u003cstrong>الاحتياجات الطبية أولًا.\u003c/strong> إذا احتاج الطفل إلى رعاية فاصطحبه إلى عيادة المدرسة.","\u003cstrong>لا تطلب من الطفل خلع ملابسه\u003c/strong> أو إظهار المزيد. صِف فقط ما هو ظاهر أصلًا.","\u003cstrong>لا تطرح أسئلة إيحائية.\u003c/strong> وإذا بدأ الطفل يتحدث فاتبع الخطوات الست للتعامل مع الإفصاح.","\u003cstrong>سجّل\u003c/strong> ما رأيته (الموضع والحجم واللون والمظهر) وأي شيء قاله الطفل، مع التاريخ والوقت.","\u003cstrong>أبلغ مسؤول الحماية في اليوم نفسه.\u003c/strong> وإذا وُجد خطر ضرر جسيم وشيك فاتصل بالشرطة مباشرةً."]}},{"t":"scenario","title":{"en":"Scenario","ar":"سيناريو"},"c":{"en":"Zaid, in Year 3, has a long red mark on his upper arm. He says he fell off his bike. Earlier he told a classmate that his dad was “really angry” last night. In PE he refuses to take off his jumper.","ar":"زيد في الصف الثالث لديه علامة حمراء طويلة على أعلى ذراعه. يقول إنه سقط عن دراجته. وقد قال لزميل له في وقت سابق إن أباه كان «غاضبًا جدًا» الليلة الماضية. وفي حصة التربية البدنية يرفض خلع سترته."}}],"checks":[{"id":"m2q1","q":{"en":"You notice an unexplained bruise on a student's upper arm. What is the most appropriate action?","ar":"لاحظت كدمة غير مفسَّرة على أعلى ذراع طالب. ما الإجراء الأنسب؟"},"opts":[{"en":"Ask the child to lift their sleeve fully so you can describe it accurately","ar":"اطلب من الطفل رفع كمّه بالكامل لتصفها بدقة"},{"en":"Photograph it on your own phone so you have proof","ar":"صوّرها بهاتفك الشخصي ليكون لديك دليل"},{"en":"Record the date, location, size and appearance, plus anything the child says, and pass it to the DSL the same day","ar":"سجّل التاريخ والموضع والحجم والمظهر وأي شيء يقوله الطفل، وسلّمه إلى مسؤول الحماية في اليوم نفسه"},{"en":"Ask a parent to explain it before deciding whether to report","ar":"اطلب من أحد الوالدين تفسيرها قبل أن تقرر هل تبلّغ"}],"correct":2,"expl":{"en":"Describe only what is visible and report the same day. Do not ask a child to undress or show more, and do not contact the family first: the DSL decides whether and how parents are informed.","ar":"صِف ما هو ظاهر فقط وأبلغ في اليوم نفسه. لا تطلب من الطفل خلع ملابسه أو إظهار المزيد، ولا تتصل بالأسرة أولًا: فمسؤول الحماية هو من يقرر هل يُبلَّغ الأهل وكيف."}},{"id":"m2q2","q":{"en":"In the scenario about Zaid, why is this worth reporting even though he gave an explanation?","ar":"في سيناريو زيد، لماذا يستحق الأمر الإبلاغ رغم أنه قدّم تفسيرًا؟"},"opts":[{"en":"Because boys of his age are never clumsy and a fall is not a possible cause","ar":"لأن الأولاد في عمره لا يتعثرون أبدًا والسقوط ليس سببًا محتملًا"},{"en":"Because the school must always contact the Police when a child has a mark","ar":"لأن على المدرسة أن تتصل بالشرطة دائمًا عندما يكون لدى الطفل علامة"},{"en":"It is not worth reporting, because he has given an explanation","ar":"لا يستحق الإبلاغ لأنه قدّم تفسيرًا"},{"en":"The mark, his comment about his dad being angry and his refusal to take off his jumper together form a pattern the DSL should see","ar":"العلامة وتعليقه عن غضب أبيه ورفضه خلع سترته تشكّل معًا نمطًا ينبغي أن يطّلع عليه مسؤول الحماية"}],"correct":3,"expl":{"en":"No one sign proves anything, but together these signs form a pattern worth reporting. You do not have to decide whether the explanation is true. The DSL can put your note alongside other information.","ar":"لا تثبت علامة واحدة شيئًا، لكن هذه العلامات معًا تشكّل نمطًا يستحق الإبلاغ. ولا يلزمك أن تقرر هل التفسير صحيح. فمسؤول الحماية يستطيع وضع ملاحظتك إلى جانب معلومات أخرى."}},{"id":"m2q3","q":{"en":"Which description matches the PEPS definition of physical abuse?","ar":"أي وصف يطابق تعريف المدرسة للإساءة الجسدية؟"},"opts":[{"en":"Causing physical harm or injury to a child, or failing to prevent physical harm or suffering","ar":"إلحاق أذى جسدي أو إصابة بالطفل، أو عدم منع الأذى أو المعاناة الجسدية"},{"en":"A persistent failure to provide food, shelter, supervision or medical care","ar":"إخفاق مستمر في توفير الغذاء أو المأوى أو الإشراف أو الرعاية الطبية"},{"en":"Conveying to a child that they are worthless, unloved or inadequate","ar":"إشعار الطفل بأنه عديم القيمة أو غير محبوب أو غير كفء"},{"en":"Involving a child in looking at, or producing, sexual images","ar":"إشراك الطفل في مشاهدة صور جنسية أو إنتاجها"}],"correct":0,"expl":{"en":"The other three descriptions are the PEPS definitions of neglect, emotional abuse and sexual abuse.","ar":"الأوصاف الثلاثة الأخرى هي تعريفات المدرسة للإهمال والإساءة العاطفية والإساءة الجنسية."}}]},{"id":"m3","title":{"en":"Emotional Abuse: Recognising the Signs","ar":"الإساءة العاطفية: التعرّف إلى العلامات"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"The PEPS definition","ar":"تعريف المدرسة"},"c":{"en":"\u003cstrong>Emotional abuse\u003c/strong> is the persistent emotional maltreatment of a child such as to cause severe and persistent adverse effects on their emotional development. This may include conveying to a child that they are worthless, unloved or inadequate, or exposing them to serious bullying, isolation or humiliation.","ar":"\u003cstrong>الإساءة العاطفية\u003c/strong> هي سوء المعاملة العاطفية المستمر للطفل بما يسبب آثارًا سلبية شديدة ومستمرة في نموه العاطفي. وقد تشمل إشعار الطفل بأنه عديم القيمة أو غير محبوب أو غير كفء، أو تعريضه للتنمّر الجسيم أو العزلة أو الإذلال."}},{"t":"p","c":{"en":"Emotional abuse leaves no marks, so it is often the hardest to see. It is recognised through \u003cstrong>patterns of behaviour over time\u003c/strong> and through what a child says about themselves and about how they are treated.","ar":"لا تترك الإساءة العاطفية آثارًا ظاهرة، ولذلك فهي غالبًا الأصعب في الملاحظة. ويُتعرَّف إليها عبر \u003cstrong>أنماط السلوك على مدى الوقت\u003c/strong> وعبر ما يقوله الطفل عن نفسه وعن طريقة معاملته."}},{"t":"h","c":{"en":"Possible signs","ar":"العلامات المحتملة"}},{"t":"table","head":{"en":["In behaviour and emotions","In what the child says or does"],"ar":["في السلوك والمشاعر","فيما يقوله الطفل أو يفعله"]},"rows":[{"en":["Very low self-esteem, or constant anxiety and fearfulness","Calls themselves “stupid”, “bad” or “worthless”, perhaps repeating what an adult has said to them"],"ar":["تدنٍّ شديد في تقدير الذات، أو قلق وخوف مستمران","يصف نفسه بـ«الغبي» أو «السيئ» أو «عديم القيمة»، وربما يكرر ما قاله له شخص بالغ"]},{"en":["Sudden changes: becoming withdrawn, or suddenly aggressive","Is terrified of making mistakes, or of being in trouble"],"ar":["تغيّرات مفاجئة: الانطواء أو العدوانية المفاجئة","يخاف بشدة من ارتكاب الأخطاء أو من التعرض للعقاب"]},{"en":["Seeking constant reassurance, or being extremely compliant","Rarely mentions home, or becomes distressed when it is mentioned"],"ar":["السعي المستمر إلى الطمأنة، أو الإفراط في الامتثال","نادرًا ما يتحدث عن المنزل، أو ينزعج عندما يُذكر"]},{"en":["Difficulty forming friendships; isolation from other children","Complains of headaches or stomach aches with no clear cause"],"ar":["صعوبة في تكوين الصداقات؛ والعزلة عن الأطفال الآخرين","يشكو من صداع أو آلام في المعدة دون سبب واضح"]},{"en":["Returning to younger behaviours, or delays in development","Talks about hurting themselves (see Module 6)"],"ar":["العودة إلى سلوكيات أصغر سنًّا، أو تأخر في النمو","يتحدث عن إيذاء نفسه (انظر الوحدة 6)"]}]},{"t":"callout","k":"warn","title":{"en":"Bullying can be emotional abuse","ar":"التنمّر قد يكون إساءة عاطفية"},"c":{"en":"The PEPS definition includes exposing a child to \u003cstrong>serious bullying, isolation or humiliation\u003c/strong>. Bullying is therefore not only a behaviour matter. It can be a safeguarding concern. It is raised with the DSL like any other concern.","ar":"يشمل تعريف المدرسة تعريض الطفل \u003cstrong>للتنمّر الجسيم أو العزلة أو الإذلال\u003c/strong>. ولذلك فالتنمّر ليس مسألة سلوك فحسب، بل قد يكون مصدر قلق يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>. ويُرفع إلى مسؤول الحماية كأي قلق آخر."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: describe, do not label","ar":"ممارسة مهنية جيدة: صِف ولا تصنّف"},"c":{"en":"Write “Maryam said ‘I'm stupid, my mum says so’ on Tuesday and Thursday, and cried when she got a question wrong”, not “Maryam is being emotionally abused”. Exact words and dates are what the DSL needs.","ar":"اكتب «قالت مريم يوم الثلاثاء ويوم الخميس: ‹أنا غبية، أمي تقول ذلك›، وبكت عندما أخطأت في سؤال»، لا «مريم تتعرض لإساءة عاطفية». فالكلمات الدقيقة والتواريخ هي ما يحتاجه مسؤول الحماية."}}],"checks":[{"id":"m3q1","q":{"en":"A Year 7 student keeps saying “I'm stupid, my mum says so”, cries when she gets a question wrong and refuses to try new tasks. What is the best response?","ar":"طالبة في الصف السابع تكرر «أنا غبية، أمي تقول ذلك»، وتبكي عندما تخطئ في سؤال، وترفض تجربة مهام جديدة. ما أفضل استجابة؟"},"opts":[{"en":"Treat it as normal shyness and report only if it continues for a full term","ar":"اعتبره خجلًا عاديًا ولا تبلّغ إلا إذا استمر فصلًا دراسيًا كاملًا"},{"en":"Record her exact words with dates and report to the DSL the same day, because this may be a sign of emotional abuse","ar":"سجّل كلماتها بدقة مع التواريخ وأبلغ مسؤول الحماية في اليوم نفسه، فقد تكون هذه علامة على إساءة عاطفية"},{"en":"Treat it as a neglect concern, because she is not receiving what she needs academically","ar":"اعتبره قلقًا يتعلق بالإهمال لأنها لا تحصل على ما تحتاجه أكاديميًا"},{"en":"Treat it as a behaviour matter and give a sanction for refusing tasks","ar":"اعتبره مسألة سلوك وفرض عقوبة على رفض المهام"}],"correct":1,"expl":{"en":"Her words about herself, repeating what an adult has said, and her reaction to mistakes form a pattern. Record the exact words and dates and report the same day. The DSL decides what the pattern means.","ar":"كلماتها عن نفسها وتكرارها ما قاله بالغ وردّ فعلها على الأخطاء تشكّل نمطًا. سجّل الكلمات الدقيقة والتواريخ وأبلغ في اليوم نفسه. ومسؤول الحماية هو من يقرر ما يعنيه هذا النمط."}},{"id":"m3q2","q":{"en":"Which statement about emotional abuse is correct?","ar":"أي العبارات التالية عن الإساءة العاطفية صحيحة؟"},"opts":[{"en":"It is only abuse if it leaves physical marks","ar":"لا تُعدّ إساءة إلا إذا تركت آثارًا جسدية"},{"en":"It is only abuse if it happens once and is very severe","ar":"لا تُعدّ إساءة إلا إذا حدثت مرة واحدة وكانت شديدة جدًا"},{"en":"It leaves no visible marks, so patterns in behaviour and what the child says are especially important to record","ar":"لا تترك آثارًا ظاهرة، لذا فأنماط السلوك وما يقوله الطفل مهمة بوجه خاص للتسجيل"},{"en":"It can only be reported once the child has used the word “abuse”","ar":"لا يمكن الإبلاغ عنها إلا بعد أن يستخدم الطفل كلمة «إساءة»"}],"correct":2,"expl":{"en":"The PEPS definition refers to persistent maltreatment with severe and persistent effects. Because there are no marks, careful records of behaviour, dates and the child's exact words matter.","ar":"يشير تعريف المدرسة إلى سوء معاملة مستمر ذي آثار شديدة ومستمرة. ولأنه لا توجد آثار ظاهرة، فمن المهم الاحتفاظ بسجلات دقيقة للسلوك والتواريخ وكلمات الطفل الحرفية."}}]},{"id":"m4","title":{"en":"Sexual Abuse and Grooming: Recognising the Signs","ar":"الإساءة الجنسية والاستدراج: التعرّف إلى العلامات"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"The PEPS definition","ar":"تعريف المدرسة"},"c":{"en":"\u003cstrong>Sexual abuse\u003c/strong> is forcing or enticing a child to take part in sexual activities, whether or not the child is aware of what is happening. It includes contact and non-contact activities, such as involving a child in looking at, or in the production of, sexual images.","ar":"\u003cstrong>الإساءة الجنسية\u003c/strong> هي إجبار الطفل أو استدراجه للمشاركة في أنشطة جنسية، سواء أدرك ما يحدث أم لم يدرك. وتشمل الأنشطة التي تتضمن اتصالًا جسديًا وغير الجسدية، كإشراك الطفل في مشاهدة صور جنسية أو إنتاجها."}},{"t":"callout","k":"warn","title":{"en":"A child may not tell you directly","ar":"قد لا يخبرك الطفل مباشرةً"},"c":{"en":"A child may not realise that what is happening is abuse. They may feel ashamed, afraid, or loyal to the person involved, or they may have been told to keep it secret. Disclosures are often partial, indirect or tested with a small hint first. Record every hint, in the child's own words, and report it.","ar":"قد لا يدرك الطفل أن ما يحدث له إساءة. وقد يشعر بالخجل أو الخوف أو الولاء للشخص المعني، وقد يكون قيل له أن يكتم الأمر. وغالبًا ما يكون الإفصاح جزئيًا أو غير مباشر أو يبدأ بتلميح صغير لاختبار ردّ الفعل. سجّل كل تلميح بكلمات الطفل نفسها وأبلغ عنه."}},{"t":"h","c":{"en":"Possible signs","ar":"العلامات المحتملة"}},{"t":"list","c":{"en":["Sexual knowledge, language, play or drawings that are unusual for the child's age","Sudden changes in behaviour: becoming withdrawn, anxious, aggressive or unusually clingy","Fear of, or reluctance to be alone with, a particular person; or sudden dislike of a place or activity","Secrecy about online activity or contacts; new phones, gifts or money that the child cannot explain","Reluctance to undress for PE or to use toilets and changing areas","Physical discomfort, or health problems that have no clear explanation","Self-harm, sleep difficulties, running away, or a sudden drop in attendance or attainment"],"ar":["معرفة أو لغة أو لعب أو رسومات جنسية غير معتادة بالنسبة لعمر الطفل","تغيّرات مفاجئة في السلوك: الانطواء أو القلق أو العدوانية أو التعلق غير المعتاد","الخوف من شخص بعينه أو التردد في البقاء وحده معه؛ أو كراهية مفاجئة لمكان أو نشاط","الكتمان بشأن النشاط أو جهات الاتصال عبر الإنترنت؛ وهواتف جديدة أو هدايا أو أموال لا يستطيع الطفل تفسيرها","التردد في خلع الملابس لحصة التربية البدنية أو في استخدام دورات المياه وغرف تبديل الملابس","انزعاج جسدي أو مشكلات صحية بلا تفسير واضح","إيذاء النفس أو صعوبات النوم أو الهروب أو تراجع مفاجئ في الحضور أو التحصيل"]}},{"t":"h","c":{"en":"Understanding grooming","ar":"فهم الاستدراج"}},{"t":"p","c":{"en":"\u003cem>Professional good practice.\u003c/em> Grooming is the process by which someone builds a child's trust and emotional connection in order to manipulate, exploit or abuse them. It can happen online or in person, and the person may be an adult or an older child, including someone the child already trusts. Warning signs include:","ar":"\u003cem>ممارسة مهنية جيدة.\u003c/em> الاستدراج هو العملية التي يبني بها شخص ثقة الطفل وارتباطه العاطفي بهدف التلاعب به أو استغلاله أو الإساءة إليه. وقد يحدث عبر الإنترنت أو وجهًا لوجه، وقد يكون الشخص بالغًا أو طفلًا أكبر سنًّا، بمن في ذلك شخص يثق به الطفل أصلًا. ومن علاماته التحذيرية:"}},{"t":"list","c":{"en":["Special attention, gifts or favours that single one child out","Efforts to be alone with the child, or to move conversations to private channels","Encouraging secrecy: “this is just between us”","Pulling the child away from friends, family or trusted adults"],"ar":["اهتمام خاص أو هدايا أو معاملة تفضيلية تميّز طفلًا بعينه","محاولات البقاء مع الطفل وحده أو نقل المحادثات إلى قنوات خاصة","التشجيع على الكتمان: «هذا بيننا فقط»","إبعاد الطفل عن أصدقائه أو أسرته أو البالغين الذين يثق بهم"]}},{"t":"callout","k":"key","title":{"en":"What to do","ar":"ما العمل"},"c":{"en":"Follow the six steps for a disclosure: stay calm, do not promise confidentiality, do not ask leading questions, reassure the child, write it down and pass it to the DSL the same day. \u003cstrong>Do not confront the person concerned and do not contact the family.\u003c/strong> The DSL decides whether and how parents are informed, because a parent may be the person of concern.","ar":"اتبع الخطوات الست للتعامل مع الإفصاح: حافظ على هدوئك، ولا تَعِد بالسرية، ولا تطرح أسئلة إيحائية، وطمئن الطفل، ودوّن ما قاله، وسلّمه إلى مسؤول الحماية في اليوم نفسه. \u003cstrong>لا تواجه الشخص المعني ولا تتصل بالأسرة.\u003c/strong> فمسؤول الحماية هو من يقرر هل يُبلَّغ الأهل وكيف، لأن أحد الوالدين قد يكون هو الشخص المثير للقلق."}}],"checks":[{"id":"m4q1","q":{"en":"Which statement about sexual abuse matches the PEPS definition?","ar":"أي العبارات التالية عن الإساءة الجنسية تطابق تعريف المدرسة؟"},"opts":[{"en":"It always involves physical contact","ar":"تتضمن دائمًا اتصالًا جسديًا"},{"en":"It only counts if the child says that they did not agree","ar":"لا تُحتسب إلا إذا قال الطفل إنه لم يوافق"},{"en":"It can only be committed by adults, never by other children","ar":"لا يرتكبها إلا البالغون، وليس الأطفال الآخرون أبدًا"},{"en":"It includes non-contact activities, such as involving a child in looking at, or producing, sexual images, whether or not the child understands what is happening","ar":"تشمل الأنشطة غير الجسدية، كإشراك الطفل في مشاهدة صور جنسية أو إنتاجها، سواء فهم الطفل ما يحدث أم لم يفهم"}],"correct":3,"expl":{"en":"The definition covers contact and non-contact activities and applies whether or not the child is aware of what is happening. Elsewhere the policy recognises that children can also abuse other children.","ar":"يغطي التعريف الأنشطة الجسدية وغير الجسدية، وينطبق سواء أدرك الطفل ما يحدث أم لم يدرك. وتقرّ السياسة في موضع آخر بأن الأطفال قد يسيئون إلى أطفال آخرين."}},{"id":"m4q2","q":{"en":"A Year 6 student seems anxious and has a new phone and gifts she cannot explain. She says, “A friend online says I mustn't tell anyone.” What is the best response?","ar":"طالبة في الصف السادس تبدو قلقة ولديها هاتف جديد وهدايا لا تستطيع تفسيرها. وتقول: «صديق عبر الإنترنت يقول لي ألا أخبر أحدًا». ما أفضل استجابة؟"},"opts":[{"en":"Listen without leading questions, tell her you cannot keep it secret, record her words and pass them to the DSL the same day","ar":"أصغِ دون أسئلة إيحائية، وأخبرها أنك لا تستطيع إبقاء الأمر سرًّا، وسجّل كلماتها وسلّمها إلى مسؤول الحماية في اليوم نفسه"},{"en":"Ask for the person's name, age and everything they have said so you can check it","ar":"اطلب اسم الشخص وعمره وكل ما قاله لتتحقق منه"},{"en":"Take her phone and read the messages to find out what is happening","ar":"خذ هاتفها واقرأ الرسائل لتعرف ما يحدث"},{"en":"Call her parents that evening so they can deal with it","ar":"اتصل بوالديها مساءً ليتولّيا الأمر"}],"correct":0,"expl":{"en":"Your role is to listen and report. Investigating, searching the phone or contacting the family could put the child at greater risk and harm any later enquiry. The DSL decides the next steps.","ar":"دورك أن تصغي وتبلّغ. فالتحقيق أو تفتيش الهاتف أو الاتصال بالأسرة قد يعرّض الطفلة لخطر أكبر ويضر بأي تحقيق لاحق. ومسؤول الحماية هو من يقرر الخطوات التالية."}},{"id":"m4q3","q":{"en":"A student hints at something worrying, then says, “It's nothing, forget it.” What should you do?","ar":"يلمّح طالب إلى أمر مقلق ثم يقول: «لا شيء، انسَ الأمر». ماذا عليك أن تفعل؟"},"opts":[{"en":"Respect the student's wish and do nothing unless they raise it again","ar":"احترم رغبة الطالب ولا تفعل شيئًا ما لم يعد طرح الأمر"},{"en":"Record the hint in the student's own words, with the date and time, and report it to the DSL the same day","ar":"سجّل التلميح بكلمات الطالب نفسها مع التاريخ والوقت، وأبلغ مسؤول الحماية به في اليوم نفسه"},{"en":"Press the student until they explain what they meant","ar":"ألحّ على الطالب حتى يشرح ما قصده"},{"en":"Ask the student's friends what they know","ar":"اسأل أصدقاء الطالب عمّا يعرفونه"}],"correct":1,"expl":{"en":"A hint is a concern. Children often test an adult's reaction before saying more, and a retraction does not remove the concern. Record it and report. Do not press the child.","ar":"التلميح قلق يجب التعامل معه. فالأطفال كثيرًا ما يختبرون ردّ فعل البالغ قبل أن يقولوا المزيد، والتراجع عن القول لا يُزيل القلق. سجّله وأبلغ عنه. ولا تُلحّ على الطفل."}}]},{"id":"m5","title":{"en":"Neglect: Recognising the Signs","ar":"الإهمال: التعرّف إلى العلامات"},"minutes":20,"blocks":[{"t":"callout","k":"key","title":{"en":"The PEPS definition","ar":"تعريف المدرسة"},"c":{"en":"\u003cstrong>Neglect\u003c/strong> is the persistent failure to meet a child's basic physical and/or psychological needs, likely to result in serious impairment of health or development, including failure to provide adequate food, shelter, supervision, or access to medical care.","ar":"\u003cstrong>الإهمال\u003c/strong> هو الإخفاق المستمر في تلبية احتياجات الطفل الجسدية و/أو النفسية الأساسية بما يُرجَّح أن يؤدي إلى ضرر بالغ في صحته أو نموه، ويشمل عدم توفير الغذاء الكافي أو المأوى أو الإشراف أو الرعاية الطبية."}},{"t":"p","c":{"en":"Neglect is rarely one dramatic event. It is usually a \u003cstrong>slow pattern\u003c/strong> that builds up. Because staff see a child day after day, they are often the first to notice it.","ar":"نادرًا ما يكون الإهمال حدثًا دراميًا واحدًا. فهو في الغالب \u003cstrong>نمط بطيء\u003c/strong> يتراكم. ولأن الموظفين يرون الطفل يومًا بعد يوم، فهم غالبًا أول من يلاحظه."}},{"t":"h","c":{"en":"Areas of need and possible signs","ar":"مجالات الاحتياج والعلامات المحتملة"}},{"t":"table","head":{"en":["Area of need","Possible signs"],"ar":["مجال الاحتياج","العلامات المحتملة"]},"rows":[{"en":["Food","Persistently hungry or arriving without breakfast or lunch; hoarding or taking food; noticeable weight change"],"ar":["الغذاء","جوع مستمر أو الحضور دون فطور أو غداء؛ تخزين الطعام أو أخذه؛ تغيّر ملحوظ في الوزن"]},{"en":["Clothing and hygiene","Dirty or unwashed uniform for long periods; clothes unsuitable for the weather; poor personal hygiene"],"ar":["الملابس والنظافة","زي متسخ أو غير مغسول لفترات طويلة؛ ملابس لا تناسب الطقس؛ ضعف في النظافة الشخصية"]},{"en":["Medical and dental care","Untreated illness, dental pain or injuries; missed appointments; medication not given"],"ar":["الرعاية الطبية والسنية","مرض أو ألم أسنان أو إصابات دون علاج؛ مواعيد طبية فائتة؛ أدوية لا تُعطى"]},{"en":["Supervision and safety","Left alone or unsupervised for long periods or at an age when this is unsafe; repeated injuries from lack of supervision"],"ar":["الإشراف والسلامة","يُترك وحده أو دون إشراف لفترات طويلة أو في سن لا يكون ذلك آمنًا فيها؛ إصابات متكررة نتيجة غياب الإشراف"]},{"en":["Emotional and psychological needs","Little warmth or attention from carers; persistent tiredness; seeking attention from any adult"],"ar":["الاحتياجات العاطفية والنفسية","قلة الدفء أو الاهتمام من مقدمي الرعاية؛ إرهاق مستمر؛ السعي إلى انتباه أي بالغ"]},{"en":["Attendance and learning","Frequent lateness or unexplained absence; arriving without equipment; sudden or long gaps in attendance"],"ar":["الحضور والتعلّم","تأخر متكرر أو غياب غير مبرَّر؛ الحضور دون الأدوات؛ انقطاع مفاجئ أو طويل عن الحضور"]}]},{"t":"p","c":{"en":"Unexplained absence matters. The policy lists \u003cem>children missing education\u003c/em> among the other safeguarding concerns, and the Candidate Absence Policy sets out how unexplained student absence is identified and followed up.","ar":"الغياب غير المبرَّر أمر مهم. فالسياسة تدرج \u003cem>الأطفال المنقطعين عن التعليم\u003c/em> ضمن المخاوف الأخرى المتعلقة بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>، وتوضّح سياسة الغياب كيفية تحديد غياب الطلبة غير المبرَّر ومتابعته."}},{"t":"callout","k":"tip","title":{"en":"Professional good practice: report the pattern, not the judgement","ar":"ممارسة مهنية جيدة: أبلغ عن النمط لا عن الحكم"},"c":{"en":"A family may be under financial or health pressure, and that can explain some of these signs. That is for the DSL to assess. The policy allows the DSL to respond with school-based support, such as pastoral care or a wellbeing plan, as well as external referral. Reporting is how a family can be offered help. It is not an accusation.","ar":"قد تكون الأسرة تحت ضغط مالي أو صحي، وقد يفسّر ذلك بعض هذه العلامات. وهذا أمر يقيّمه مسؤول الحماية. وتتيح السياسة له أن يستجيب بدعم داخل المدرسة، كالرعاية الرعوية أو خطة الرفاه، إلى جانب الإحالة الخارجية. فالإبلاغ وسيلة لتقديم المساعدة للأسرة وليس اتهامًا لها."}},{"t":"scenario","title":{"en":"Scenario","ar":"سيناريو"},"c":{"en":"Layla, in Year 2, arrives most days without breakfast and is hungry by 9 a.m. Her uniform has not been washed for weeks. She mentions being at home alone with her little brother in the evenings, and the school clinic has noted untreated toothache.","ar":"ليلى في الصف الثاني تصل معظم الأيام دون فطور وتشعر بالجوع عند التاسعة صباحًا. ولم يُغسل زيّها المدرسي منذ أسابيع. وتذكر أنها تبقى في المنزل وحدها مع أخيها الصغير في المساء، وقد سجّلت عيادة المدرسة ألم أسنان غير معالَج."}}],"checks":[{"id":"m5q1","q":{"en":"Which description best fits neglect under the PEPS definition?","ar":"أي وصف يناسب الإهمال بحسب تعريف المدرسة؟"},"opts":[{"en":"A single occasion when a child arrives without a packed lunch","ar":"مرة واحدة يحضر فيها الطفل دون وجبة غداء"},{"en":"A student being given a detention for forgetting homework","ar":"منح طالب عقوبة احتجاز لنسيانه الواجب المنزلي"},{"en":"A persistent failure to meet a child's basic needs, such as food, supervision or medical care, likely to seriously impair health or development","ar":"إخفاق مستمر في تلبية احتياجات الطفل الأساسية، كالغذاء أو الإشراف أو الرعاية الطبية، بما يُرجَّح أن يضر بصحته أو نموه ضررًا بالغًا"},{"en":"A parent disagreeing with a teacher about homework","ar":"اختلاف ولي أمر مع معلم حول الواجب المنزلي"}],"correct":2,"expl":{"en":"Neglect is persistent and affects basic needs. A one-off event is not neglect, but a repeated pattern should be recorded and reported.","ar":"الإهمال مستمر ويمسّ الاحتياجات الأساسية. والحدث العابر ليس إهمالًا، لكن النمط المتكرر ينبغي تسجيله والإبلاغ عنه."}},{"id":"m5q2","q":{"en":"A student's unexplained absences are growing, and the student is often tired and unwashed when present. What should you do?","ar":"تتزايد غيابات طالب غير المبرَّرة، وهو غالبًا متعب وغير نظيف عند حضوره. ماذا عليك أن تفعل؟"},"opts":[{"en":"Treat it as truancy only and leave it to the behaviour system","ar":"اعتبره تغيّبًا متعمدًا فقط واتركه لنظام السلوك"},{"en":"Call the family yourself to ask about life at home","ar":"اتصل بالأسرة بنفسك لتسأل عن الحياة في المنزل"},{"en":"Wait until the end of term to see whether things improve","ar":"انتظر حتى نهاية الفصل لترى هل تتحسن الأمور"},{"en":"Record the pattern, with dates, and report it to the DSL the same day","ar":"سجّل النمط مع التواريخ وأبلغ مسؤول الحماية به في اليوم نفسه"}],"correct":3,"expl":{"en":"Unexplained absence combined with other signs can indicate neglect or a child missing education. Staff record the pattern and report. They do not contact the family themselves or wait.","ar":"قد يشير الغياب غير المبرَّر مع علامات أخرى إلى الإهمال أو إلى انقطاع الطفل عن التعليم. ويسجّل الموظفون النمط ويبلّغون، ولا يتصلون بالأسرة بأنفسهم ولا ينتظرون."}},{"id":"m5q3","q":{"en":"A family is under financial pressure and their child often arrives hungry. What should staff do?","ar":"أسرة تحت ضغط مالي وطفلها يصل جائعًا في كثير من الأحيان. ماذا ينبغي على الموظفين أن يفعلوا؟"},"opts":[{"en":"Report the concern in the normal way. The DSL can arrange school-based support or refer externally, as appropriate","ar":"يُبلَّغ عن القلق بالطريقة المعتادة. ويستطيع مسؤول الحماية ترتيب دعم داخل المدرسة أو الإحالة الخارجية بحسب الحاجة"},{"en":"Do nothing, because hunger caused by money problems is not a safeguarding matter","ar":"لا شيء، فالجوع الناتج عن مشكلات مالية ليس مسألة تتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"},{"en":"Give the family advice yourself on how to manage their money","ar":"تقديم نصائح للأسرة بنفسك حول كيفية إدارة أموالها"},{"en":"Tell the child's classmates so they can share their food","ar":"إخبار زملاء الطفل ليتقاسموا معه طعامهم"}],"correct":0,"expl":{"en":"Staff report the pattern and the DSL decides on the response. The policy allows for pastoral care, a wellbeing plan or external referral. Reporting opens the way to help for the child.","ar":"يبلّغ الموظفون عن النمط ويقرر مسؤول الحماية الاستجابة. وتتيح السياسة الرعاية الرعوية أو خطة الرفاه أو الإحالة الخارجية. والإبلاغ يفتح الطريق إلى المساعدة للطفل."}}]},{"id":"m6","title":{"en":"Other Concerns and Children Who May Be Missed","ar":"مخاوف أخرى والأطفال الذين قد يُغفَل عنهم"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Beyond the four categories, the PEPS policy asks staff to be alert to other specific safeguarding concerns. \u003cstrong>Each one is raised with the DSL in the same way as any other concern.\u003c/strong>","ar":"إلى جانب الفئات الأربع، تطلب سياسة المدرسة من الموظفين الانتباه إلى مخاوف أخرى محددة تتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>. \u003cstrong>وتُرفع كل منها إلى مسؤول الحماية بالطريقة نفسها كأي قلق آخر.\u003c/strong>"}},{"t":"table","head":{"en":["Concern","Possible signs"],"ar":["القلق","العلامات المحتملة"]},"rows":[{"en":["Online safety risks","Secrecy about online contacts, upset after being online, new unexplained gifts, contact from an unknown adult"],"ar":["مخاطر السلامة الرقمية","الكتمان بشأن جهات الاتصال عبر الإنترنت، والانزعاج بعد استخدام الإنترنت، وهدايا جديدة غير مفسَّرة، وتواصل شخص بالغ مجهول"]},{"en":["Radicalisation and extremist views","Expressing or sharing views that justify violence or hostility towards a group, growing intolerance, interest in extremist material online, sudden withdrawal from friends"],"ar":["التطرف والأفكار المتطرفة","التعبير عن آراء تبرّر العنف أو العداء تجاه فئة ما أو نشرها، وتزايد التعصب، والاهتمام بمواد متطرفة عبر الإنترنت، والانسحاب المفاجئ من الأصدقاء"]},{"en":["Forced marriage","A child who talks of being made to marry against their wishes, or is anxious about a planned trip or long absence"],"ar":["الزواج القسري","طفل يتحدث عن إجباره على الزواج رغمًا عنه، أو يبدو قلقًا من رحلة مقررة أو غياب طويل"]},{"en":["Female genital mutilation","A girl who talks of a “special procedure” or planned trip, long absence from school, or difficulty sitting or walking afterwards"],"ar":["ختان الإناث","فتاة تتحدث عن «إجراء خاص» أو رحلة مقررة، أو غياب طويل عن المدرسة، أو صعوبة في الجلوس أو المشي بعد ذلك"]},{"en":["Substance misuse","Changes in mood, friends or appearance; drowsiness; unusual smells; vaping or other items brought to school"],"ar":["تعاطي المواد المؤذية","تغيّرات في المزاج أو الأصدقاء أو المظهر؛ نعاس؛ روائح غير معتادة؛ إحضار أدوات التدخين الإلكتروني أو غيرها إلى المدرسة"]},{"en":["Self-harm","Unexplained cuts or burns, covering arms or legs in hot weather, talk of hopelessness or of wanting to hurt themselves"],"ar":["إيذاء النفس","جروح أو حروق غير مفسَّرة، وتغطية الذراعين أو الساقين في الطقس الحار، والحديث عن اليأس أو الرغبة في إيذاء النفس"]},{"en":["Children missing education","Unexplained absence, not returning after a holiday, or sudden withdrawal from school"],"ar":["الأطفال المنقطعون عن التعليم","غياب غير مبرَّر، أو عدم العودة بعد إجازة، أو الانسحاب المفاجئ من المدرسة"]}]},{"t":"callout","k":"warn","title":{"en":"If a child may be at immediate risk","ar":"إذا كان الطفل معرّضًا لخطر داهم"},"c":{"en":"If a student tells you they plan to hurt themselves, do not leave them alone. Get the DSL or a deputy straight away, involve the school clinic if needed, and if there is a risk of immediate serious harm contact the emergency services without waiting. Never promise to keep it secret.","ar":"إذا أخبرك طالب بأنه ينوي إيذاء نفسه فلا تتركه وحده. اطلب مسؤول الحماية أو أحد نوابه فورًا، وأشرِك عيادة المدرسة عند الحاجة، وإذا وُجد خطر ضرر جسيم وشيك فاتصل بخدمات الطوارئ دون انتظار. ولا تَعِد أبدًا بإبقاء الأمر سرًّا."}},{"t":"h","c":{"en":"Children whose signs are easy to miss","ar":"أطفال يسهل إغفال علاماتهم"}},{"t":"p","c":{"en":"The policy recognises that some students, including students of determination and English Language Learners, may need additional support to communicate or be understood. The DSL works with the Inclusion Support Team in these cases. \u003cem>Professional good practice:\u003c/em> be careful not to attribute every change in a child to their condition or to their still-developing English, and notice quiet, compliant children as well as those whose behaviour is loud.","ar":"تقرّ السياسة بأن بعض الطلبة، ومنهم الطلبة من أصحاب الهمم ومتعلمو اللغة الإنجليزية، قد يحتاجون إلى دعم إضافي ليتواصلوا أو يُفهَموا. ويعمل مسؤول الحماية مع فريق الدعم الشامل في هذه الحالات. \u003cem>ممارسة مهنية جيدة:\u003c/em> احذر من أن تنسب كل تغيّر في الطفل إلى حالته أو إلى لغته الإنجليزية التي ما تزال في طور النمو، وانتبه إلى الأطفال الهادئين المنقادين كما تنتبه إلى من يكون سلوكهم صاخبًا."}}],"checks":[{"id":"m6q1","q":{"en":"A student with a speech and language difficulty becomes suddenly withdrawn and has unexplained marks. A colleague says, “It's just part of his condition.” What is the right response?","ar":"طالب لديه صعوبة في النطق واللغة أصبح منطويًا فجأة ولديه علامات غير مفسَّرة. يقول زميل: «هذا مجرد جزء من حالته». ما الاستجابة الصحيحة؟"},"opts":[{"en":"Agree, because changes in behaviour are expected for this student","ar":"وافق، لأن تغيّرات السلوك متوقعة لدى هذا الطالب"},{"en":"Record and report it to the DSL as you would for any child. Do not assume the signs are caused by the condition","ar":"سجّل الأمر وأبلغ مسؤول الحماية كما تفعل مع أي طفل. ولا تفترض أن العلامات سببها حالته"},{"en":"Report only if the student can explain what happened in words","ar":"لا تبلّغ إلا إذا استطاع الطالب أن يشرح ما حدث بالكلمات"},{"en":"Leave it to the student's parents to follow up","ar":"اترك المتابعة لوالدي الطالب"}],"correct":1,"expl":{"en":"Signs may be missed or wrongly explained for students who need extra support to communicate. Every child has an equal right to protection. Staff report, and the DSL works with the Inclusion Support Team.","ar":"قد تُغفَل العلامات أو يُخطأ تفسيرها لدى الطلبة الذين يحتاجون إلى دعم إضافي للتواصل. ولكل طفل حقٌّ متساوٍ في الحماية. ويبلّغ الموظفون، ويعمل مسؤول الحماية مع فريق الدعم الشامل."}},{"id":"m6q2","q":{"en":"How should staff raise a concern about self-harm, forced marriage or substance misuse?","ar":"كيف ينبغي للموظفين رفع قلق بشأن إيذاء النفس أو الزواج القسري أو تعاطي المواد المؤذية؟"},"opts":[{"en":"Only with the student counsellor, because these are wellbeing issues","ar":"إلى مرشد الطلبة فقط، لأن هذه قضايا رفاه"},{"en":"With the student's parents first, so they can respond","ar":"إلى والدي الطالب أولًا ليستجيبا"},{"en":"With the DSL, in the same way as any other safeguarding concern","ar":"إلى مسؤول الحماية، بالطريقة نفسها كأي قلق آخر يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"},{"en":"Through the behaviour system, with a sanction if appropriate","ar":"عبر نظام السلوك، مع عقوبة إن لزم"}],"correct":2,"expl":{"en":"The policy says any such concern is raised with the DSL in the same way as any other. The DSL involves the counsellor, nurse or agencies as needed.","ar":"تنص السياسة على أن أي قلق من هذا النوع يُرفع إلى مسؤول الحماية بالطريقة نفسها كأي قلق آخر. ويُشرك مسؤول الحماية المرشد أو الممرض أو الجهات المعنية عند الحاجة."}}]},{"id":"m7","title":{"en":"From Noticing to Acting: Practice","ar":"من الملاحظة إلى الفعل: تطبيق عملي"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Whatever the category, the response is the same. These steps connect everything you have learned in this CPD.","ar":"أيًّا كانت الفئة، فالاستجابة واحدة. وتربط هذه الخطوات كل ما تعلمته في هذه الوحدة."}},{"t":"steps","c":{"en":["\u003cstrong>Notice\u003c/strong> the sign or change. Do not explain it away.","\u003cstrong>Listen\u003c/strong> if the child speaks: stay calm, no leading questions, no promise of secrecy.","\u003cstrong>Record\u003c/strong> the facts: what you saw, what was said in the words used, the date and time. Keep opinion separate.","\u003cstrong>Report\u003c/strong> to the DSL or a deputy the same day. If a child is in immediate danger, contact the Police.","\u003cstrong>Stay alert.\u003c/strong> New signs mean a new record. The DSL decides what happens next."],"ar":["\u003cstrong>لاحظ\u003c/strong> العلامة أو التغيّر. ولا تبرّره.","\u003cstrong>أصغِ\u003c/strong> إذا تحدث الطفل: حافظ على هدوئك، ولا أسئلة إيحائية، ولا وعد بالسرية.","\u003cstrong>سجّل\u003c/strong> الوقائع: ما رأيته وما قيل بالكلمات المستخدمة والتاريخ والوقت. وأبقِ الرأي منفصلًا.","\u003cstrong>أبلغ\u003c/strong> مسؤول الحماية أو أحد نوابه في اليوم نفسه. وإذا كان الطفل في خطر داهم فاتصل بالشرطة.","\u003cstrong>ابقَ منتبهًا.\u003c/strong> العلامات الجديدة تعني سجلًّا جديدًا. ومسؤول الحماية هو من يقرر ما يحدث بعد ذلك."]}},{"t":"h","c":{"en":"What not to do","ar":"ما لا يجوز فعله"}},{"t":"list","c":{"en":["Do not investigate or try to prove what happened.","Do not ask leading questions, or ask a child to show you an injury or remove clothing.","Do not confront the parent or the person you are worried about.","Do not promise confidentiality.","Do not discuss the child with colleagues who are not involved.","Do not wait until you are certain."],"ar":["لا تحقّق ولا تحاول إثبات ما حدث.","لا تطرح أسئلة إيحائية، ولا تطلب من الطفل أن يُريك إصابة أو يخلع ملابسه.","لا تواجه ولي الأمر أو الشخص الذي يقلقك.","لا تَعِد بالسرية.","لا تناقش أمر الطفل مع زملاء غير معنيين.","لا تنتظر حتى تتأكد."]}},{"t":"callout","k":"key","title":{"en":"A deputy is always available","ar":"نائب المسؤول متوافر دائمًا"},"c":{"en":"At least one deputy DSL is available at all times the school is in session, so there is never a reason to delay a report because the DSL is out of the building.","ar":"يتوافر نائب واحد على الأقل لمسؤول الحماية طوال وقت الدوام المدرسي، فلا مبرر لتأخير الإبلاغ لأن مسؤول الحماية خارج المبنى."}}],"checks":[{"id":"m7q1","q":{"en":"A Year 5 student has a bruise on his upper arm and says he fell. He looks fearful when it is time to be collected. What is the best next step?","ar":"طالب في الصف الخامس لديه كدمة في أعلى ذراعه ويقول إنه سقط. ويبدو خائفًا عندما يحين وقت استلامه. ما أفضل خطوة تالية؟"},"opts":[{"en":"Wait until tomorrow to see whether the bruise is still there","ar":"انتظر حتى الغد لترى هل ما تزال الكدمة موجودة"},{"en":"Ask the parent at collection how he got the bruise","ar":"اسأل ولي الأمر عند الاستلام كيف حصل على الكدمة"},{"en":"Ask him to show you the rest of his arm and back","ar":"اطلب منه أن يُريك بقية ذراعه وظهره"},{"en":"Record what you saw and heard and report to the DSL or a deputy straight away, before he is collected","ar":"سجّل ما رأيته وسمعته وأبلغ مسؤول الحماية أو أحد نوابه فورًا، قبل أن يستلمه أحد"}],"correct":3,"expl":{"en":"His fear about going home adds to the concern, so report before he leaves. Do not question the parent or examine the child. The DSL decides what happens next, and a deputy is always available.","ar":"خوفه من العودة إلى المنزل يزيد من القلق، لذا أبلغ قبل أن يغادر. لا تسأل ولي الأمر ولا تفحص الطفل. ومسؤول الحماية هو من يقرر ما يحدث بعد ذلك، ويتوافر نائب دائمًا."}},{"id":"m7q2","q":{"en":"Which entry would make the best record of a concern?","ar":"أي إدخال يشكّل أفضل سجلّ لقلق ما؟"},"opts":[{"en":"On Tuesday at 10:15, Layla said, “I look after my brother on my own at night.” Her uniform is unwashed. She has missed breakfast three days this week.","ar":"يوم الثلاثاء الساعة 10:15 قالت ليلى: «أنا أعتني بأخي وحدي في الليل». وزيّها غير مغسول. وقد فاتها الفطور ثلاثة أيام هذا الأسبوع."},{"en":"Layla's parents are clearly neglecting her and should be reported.","ar":"والدا ليلى يهملانها بوضوح ويجب الإبلاغ عنهما."},{"en":"Layla seems to have some problems at home. Will keep an eye on it.","ar":"يبدو أن ليلى تعاني مشكلات في المنزل. سأتابع الأمر."},{"en":"Layla was hungry again. Her mother needs to be told to feed her properly.","ar":"ليلى جائعة مرة أخرى. يجب إخبار أمها بأن تطعمها كما ينبغي."}],"correct":0,"expl":{"en":"A good record gives dates, the child's own words and what you saw. It does not give opinions or conclusions, and it does not decide what should happen to the family.","ar":"يتضمن السجل الجيد التواريخ وكلمات الطفل ذاتها وما رأيته. ولا يتضمن آراء أو استنتاجات، ولا يقرر ما ينبغي أن يحدث للأسرة."}},{"id":"m7q3","q":{"en":"You are worried about a child but the DSL is off-site today. What should you do?","ar":"أنت قلق على طفل لكن مسؤول الحماية خارج المدرسة اليوم. ماذا عليك أن تفعل؟"},"opts":[{"en":"Wait until the DSL returns, even if that takes several days","ar":"انتظر عودة مسؤول الحماية حتى لو استغرق ذلك عدة أيام"},{"en":"Report to a deputy DSL, since at least one is available whenever the school is in session","ar":"أبلغ أحد نواب مسؤول الحماية، فواحد منهم على الأقل متوافر طوال وقت الدوام المدرسي"},{"en":"Decide for yourself what should be done and contact the family","ar":"قرّر بنفسك ما ينبغي فعله واتصل بالأسرة"},{"en":"Mention it to a friendly colleague and hope they pass it on","ar":"اذكره لزميل ودود وأمِل أن ينقله"}],"correct":1,"expl":{"en":"Deputy DSLs are trained to the same Level 3 standard and carry out the DSL's functions in their absence. At least one is available at all times when the school is in session.","ar":"نواب مسؤول الحماية مدرَّبون على المستوى الثالث نفسه ويؤدّون مهام المسؤول في غيابه. ويتوافر واحد منهم على الأقل في جميع أوقات الدوام المدرسي."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"What is the role of a member of staff who notices possible signs of abuse?","ar":"ما دور الموظف الذي يلاحظ علامات محتملة للإساءة؟"},"opts":[{"en":"To investigate and confirm what has happened","ar":"أن يحقّق ويؤكد ما حدث"},{"en":"To decide which agency should be contacted","ar":"أن يقرر أي جهة ينبغي الاتصال بها"},{"en":"To notice, record the facts and report to the DSL","ar":"أن يلاحظ ويسجّل الوقائع ويبلّغ مسؤول الحماية"},{"en":"To discuss it with the parents first","ar":"أن يناقش الأمر مع الوالدين أولًا"}],"correct":2},{"id":"e2","mod":1,"q":{"en":"Why is it useful to know what is typical for each child in your class?","ar":"لماذا من المفيد أن تعرف ما هو معتاد لدى كل طفل في صفك؟"},"opts":[{"en":"So that you can diagnose the type of abuse more quickly","ar":"لتشخّص نوع الإساءة بسرعة أكبر"},{"en":"So that you can avoid reporting children who are usually quiet","ar":"لتتجنب الإبلاغ عن الأطفال الهادئين عادةً"},{"en":"So that you can tell the parents what is normal","ar":"لتخبر الوالدين بما هو طبيعي"},{"en":"A change from a child's usual behaviour or appearance is often the first sign, and it can only be noticed if you know the child","ar":"غالبًا ما يكون التغيّر عن سلوك الطفل أو مظهره المعتاد هو العلامة الأولى، ولا يمكن ملاحظته إلا إذا عرفت الطفل"}],"correct":3},{"id":"e3","mod":1,"q":{"en":"A colleague says, “I'm only about 70% sure, so I won't report it yet.” What does the PEPS policy say?","ar":"يقول زميل: «أنا متأكد بنسبة 70% فقط، لذا لن أبلّغ بعد». ماذا تقول سياسة المدرسة؟"},"opts":[{"en":"Staff do not need to be certain. All concerns are reported, however minor they may seem","ar":"لا يلزم أن يكون الموظف متأكدًا. تُرفع جميع المخاوف مهما بدت بسيطة"},{"en":"Staff should wait until they are at least 90% sure","ar":"ينبغي أن ينتظر الموظفون حتى تبلغ ثقتهم 90% على الأقل"},{"en":"Only concerns confirmed by a second colleague are reported","ar":"لا تُرفع إلا المخاوف التي يؤكدها زميل آخر"},{"en":"Concerns are reported only if the child has spoken about them","ar":"لا تُرفع المخاوف إلا إذا تحدث عنها الطفل"}],"correct":0},{"id":"e4","mod":2,"q":{"en":"Which combination would most justify a prompt report about possible physical abuse?","ar":"أي مجموعة من الحالات التالية تبرّر الإبلاغ العاجل بدرجة أكبر عن إساءة جسدية محتملة؟"},"opts":[{"en":"A grazed knee after a fall that a member of staff witnessed","ar":"ركبة مخدوشة بعد سقوط شاهده أحد الموظفين"},{"en":"Repeated injuries, an explanation that keeps changing, and a child who flinches at contact","ar":"إصابات متكررة وتفسير يتغيّر باستمرار وطفل يجفل عند الاتصال"},{"en":"A bruise on the shin after football, explained the same way each time","ar":"كدمة على الساق بعد كرة القدم تُفسَّر بالطريقة نفسها في كل مرة"},{"en":"A child who is tired after a late family event once","ar":"طفل متعب بعد مناسبة عائلية متأخرة مرة واحدة"}],"correct":1},{"id":"e5","mod":2,"q":{"en":"A child has an injury that may be physical abuse. What should you avoid doing?","ar":"لدى طفل إصابة قد تكون ناتجة عن إساءة جسدية. ما الذي ينبغي تجنّبه؟"},"opts":[{"en":"Taking the child to the school clinic if they need care","ar":"اصطحاب الطفل إلى عيادة المدرسة إذا احتاج إلى رعاية"},{"en":"Recording the date, location and appearance of what is visible","ar":"تسجيل تاريخ ما هو ظاهر وموضعه ومظهره"},{"en":"Asking the child to remove clothing or show you more of the injury","ar":"أن تطلب من الطفل خلع ملابسه أو إظهار المزيد من الإصابة"},{"en":"Reporting to the DSL the same day","ar":"الإبلاغ إلى مسؤول الحماية في اليوم نفسه"}],"correct":2},{"id":"e6","mod":3,"q":{"en":"Which category is described by “conveying to a child that they are worthless, unloved or inadequate”?","ar":"أي فئة يصفها «إشعار الطفل بأنه عديم القيمة أو غير محبوب أو غير كفء»؟"},"opts":[{"en":"Physical abuse","ar":"الإساءة الجسدية"},{"en":"Neglect","ar":"الإهمال"},{"en":"Peer-on-peer abuse only","ar":"الإساءة بين الأقران فقط"},{"en":"Emotional abuse","ar":"الإساءة العاطفية"}],"correct":3},{"id":"e7","mod":3,"q":{"en":"Under the PEPS definition, which of the following can be a form of emotional abuse?","ar":"بحسب تعريف المدرسة، أي مما يلي قد يكون شكلًا من أشكال الإساءة العاطفية؟"},"opts":[{"en":"Exposing a child to serious bullying, isolation or humiliation","ar":"تعريض الطفل للتنمّر الجسيم أو العزلة أو الإذلال"},{"en":"Giving a child a fair and proportionate consequence for poor behaviour","ar":"منح الطفل عاقبة عادلة ومتناسبة على سلوك سيئ"},{"en":"Asking a child to redo work that has errors","ar":"أن يُطلب من الطفل إعادة عمل فيه أخطاء"},{"en":"Telling a child that they must follow the school rules","ar":"إخبار الطفل بأن عليه الالتزام بقواعد المدرسة"}],"correct":0},{"id":"e8","mod":4,"q":{"en":"Why might a child who is being sexually abused give only a partial or indirect disclosure?","ar":"لماذا قد يُدلي طفل يتعرض لإساءة جنسية بإفصاح جزئي أو غير مباشر فقط؟"},"opts":[{"en":"Because children of that age rarely remember events clearly","ar":"لأن الأطفال في هذا العمر نادرًا ما يتذكرون الأحداث بوضوح"},{"en":"They may feel ashamed or afraid, may not realise it is abuse, or may have been told to keep it secret","ar":"قد يشعر بالخجل أو الخوف، أو لا يدرك أنها إساءة، أو قد يكون قيل له أن يكتم الأمر"},{"en":"Because abuse of this kind is very unlikely to be real","ar":"لأن هذا النوع من الإساءة بعيد الاحتمال جدًا أن يكون حقيقيًا"},{"en":"Because they want the member of staff to investigate","ar":"لأنه يريد أن يحقّق الموظف في الأمر"}],"correct":1},{"id":"e9","mod":4,"q":{"en":"A student seems withdrawn and talks about a person online who told her to keep their chats secret. What should you do?","ar":"تبدو طالبة منطوية وتتحدث عن شخص عبر الإنترنت طلب منها أن تبقي محادثاتهما سرًّا. ماذا عليك أن تفعل؟"},"opts":[{"en":"Message the person yourself to find out who they are","ar":"راسل الشخص بنفسك لتعرف من يكون"},{"en":"Ask her to delete the chats so she is safe","ar":"اطلب منها حذف المحادثات لتكون بأمان"},{"en":"Listen, do not promise secrecy, record her words, and report to the DSL the same day","ar":"أصغِ ولا تَعِد بالسرية، وسجّل كلماتها وأبلغ مسؤول الحماية في اليوم نفسه"},{"en":"Tell her to ignore the person and let you know if it continues","ar":"قل لها أن تتجاهل الشخص وتخبرك إذا استمر الأمر"}],"correct":2},{"id":"e10","mod":4,"q":{"en":"A student hints at a worry and then says, “It's nothing.” What is the right course of action?","ar":"يلمّح طالب إلى قلق ثم يقول: «لا شيء». ما المسار الصحيح؟"},"opts":[{"en":"Accept that it is nothing and take no further action","ar":"اعتبر أنه لا شيء ولا تتخذ أي إجراء آخر"},{"en":"Ask the student to promise to tell you if it happens again","ar":"اطلب من الطالب أن يعدك بإخبارك إذا تكرر الأمر"},{"en":"Wait for the student to raise it again before recording anything","ar":"انتظر حتى يعيد الطالب طرح الأمر قبل أن تسجّل أي شيء"},{"en":"Record the hint in the student's words and report it the same day","ar":"سجّل التلميح بكلمات الطالب وأبلغ عنه في اليوم نفسه"}],"correct":3},{"id":"e11","mod":5,"q":{"en":"Which pattern most closely suggests neglect?","ar":"أي نمط يشير بدرجة أكبر إلى الإهمال؟"},"opts":[{"en":"Persistently arriving hungry, in unwashed or unsuitable clothes, with untreated dental pain","ar":"الحضور باستمرار جائعًا بملابس غير مغسولة أو غير مناسبة ومع ألم أسنان غير معالَج"},{"en":"Occasionally forgetting a packed lunch","ar":"نسيان وجبة الغداء أحيانًا"},{"en":"Wearing last year's shoes that still fit","ar":"ارتداء حذاء العام الماضي الذي ما يزال مناسبًا"},{"en":"Being tired after a school sports day","ar":"التعب بعد يوم رياضي مدرسي"}],"correct":0},{"id":"e12","mod":5,"q":{"en":"What do the words “persistent failure” mean in the PEPS definition of neglect?","ar":"ماذا تعني عبارة «الإخفاق المستمر» في تعريف المدرسة للإهمال؟"},"opts":[{"en":"Neglect only exists if a child has been absent from school","ar":"لا يوجد إهمال إلا إذا غاب الطفل عن المدرسة"},{"en":"Neglect is usually a repeated pattern over time rather than a single event","ar":"الإهمال في الغالب نمط متكرر على مدى الوقت وليس حدثًا منفردًا"},{"en":"Neglect only counts after a medical diagnosis","ar":"لا يُعدّ الإهمال إلا بعد تشخيص طبي"},{"en":"Neglect only counts if the family has refused help","ar":"لا يُعدّ الإهمال إلا إذا رفضت الأسرة المساعدة"}],"correct":1},{"id":"e13","mod":5,"q":{"en":"A child's family is in financial difficulty and the child often arrives hungry. What is the best action for staff?","ar":"أسرة طفل تعاني صعوبة مالية والطفل يصل جائعًا في كثير من الأحيان. ما أفضل إجراء للموظفين؟"},"opts":[{"en":"Do not report it, because poverty is not a concern for the school","ar":"عدم الإبلاغ لأن الفقر ليس شأنًا يخص المدرسة"},{"en":"Raise the matter with the child's classmates","ar":"طرح الأمر على زملاء الطفل"},{"en":"Report the pattern to the DSL, who can arrange school-based support or refer externally","ar":"الإبلاغ عن النمط إلى مسؤول الحماية الذي يستطيع ترتيب دعم داخل المدرسة أو الإحالة الخارجية"},{"en":"Lecture the parents about their responsibilities","ar":"إلقاء محاضرة على الوالدين عن مسؤولياتهما"}],"correct":2},{"id":"e14","mod":6,"q":{"en":"A student tells you she plans to hurt herself tonight. What should you do?","ar":"تخبرك طالبة بأنها تنوي إيذاء نفسها الليلة. ماذا عليك أن تفعل؟"},"opts":[{"en":"Promise to keep it secret and check on her tomorrow","ar":"عِدها بإبقاء الأمر سرًّا وتفقّدها غدًا"},{"en":"Send her back to class and mention it at the end of the week","ar":"أعدها إلى الصف واذكر الأمر في نهاية الأسبوع"},{"en":"Text her parents and carry on with the lesson","ar":"أرسل رسالة نصية إلى والديها وواصل الحصة"},{"en":"Do not leave her alone, get the DSL or a deputy straight away, and contact emergency services if she is in immediate danger","ar":"لا تتركها وحدها، واطلب مسؤول الحماية أو أحد نوابه فورًا، واتصل بخدمات الطوارئ إذا كانت في خطر داهم"}],"correct":3},{"id":"e15","mod":6,"q":{"en":"A student who is an English Language Learner is quiet, tearful and has unexplained marks. What is the best response?","ar":"طالب من متعلمي اللغة الإنجليزية هادئ وباكٍ ولديه علامات غير مفسَّرة. ما أفضل استجابة؟"},"opts":[{"en":"Record what you see and report to the DSL, who works with the Inclusion Support Team if extra support is needed to communicate","ar":"سجّل ما تراه وأبلغ مسؤول الحماية الذي يعمل مع فريق الدعم الشامل إذا لزم دعم إضافي للتواصل"},{"en":"Assume the signs are caused by his difficulty with English","ar":"افترض أن العلامات سببها صعوبته في الإنجليزية"},{"en":"Wait until his English is good enough for him to explain","ar":"انتظر حتى تصبح إنجليزيته جيدة بما يكفي ليشرح"},{"en":"Ask a classmate to translate and question him in front of others","ar":"اطلب من زميل الترجمة واستجوبه أمام الآخرين"}],"correct":0},{"id":"e16","mod":6,"q":{"en":"A student has been absent for two weeks with no explanation, and the family cannot be reached. How should this be handled?","ar":"غاب طالب أسبوعين دون تفسير، وتعذّر الوصول إلى أسرته. كيف ينبغي التعامل مع ذلك؟"},"opts":[{"en":"As a behaviour matter only, with a letter about attendance","ar":"بوصفه مسألة سلوك فقط مع رسالة عن الحضور"},{"en":"As a possible safeguarding concern (child missing education): raise it with the DSL","ar":"بوصفه قلقًا محتملًا يتعلق بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> (طفل منقطع عن التعليم): يُرفع إلى مسؤول الحماية"},{"en":"By waiting until the next parents' evening","ar":"بانتظار اجتماع أولياء الأمور القادم"},{"en":"By asking the other students where he is","ar":"بسؤال الطلبة الآخرين عن مكانه"}],"correct":1},{"id":"e17","mod":7,"q":{"en":"Which elements belong in a good written record of a concern?","ar":"أي العناصر تدخل في السجل الكتابي الجيد للقلق؟"},"opts":[{"en":"Your conclusion about which type of abuse has occurred","ar":"استنتاجك حول نوع الإساءة التي وقعت"},{"en":"Your opinion of the parents and how they live","ar":"رأيك في الوالدين وطريقة عيشهما"},{"en":"Dates and times, what you saw, the child's own words, and any immediate action, with opinion kept separate","ar":"التواريخ والأوقات وما رأيته وكلمات الطفل ذاتها وأي إجراء فوري، مع إبقاء الرأي منفصلًا"},{"en":"A summary written in your own words that replaces what the child said","ar":"ملخص بكلماتك الخاصة يحلّ محل ما قاله الطفل"}],"correct":2},{"id":"e18","mod":7,"q":{"en":"Who decides whether a concern is handled in school or referred to an external agency?","ar":"من يقرر هل يُعالَج القلق داخل المدرسة أم يُحال إلى جهة خارجية؟"},"opts":[{"en":"The teacher who first noticed it","ar":"المعلم الذي لاحظه أولًا"},{"en":"The child's class","ar":"صف الطفل"},{"en":"The parent of the child","ar":"والد الطفل أو والدته"},{"en":"The DSL, after an initial assessment","ar":"مسؤول الحماية بعد تقييم أولي"}],"correct":3},{"id":"e19","mod":7,"q":{"en":"You see a worrying mark on a child, and a parent's explanation sounds believable. What should you do before reporting?","ar":"ترى علامة مقلقة على طفل، ويبدو تفسير أحد الوالدين معقولًا. ماذا عليك أن تفعل قبل الإبلاغ؟"},"opts":[{"en":"Nothing needs to come first: report to the DSL the same day and leave it to the DSL to decide","ar":"لا شيء ينبغي أن يسبق ذلك: أبلغ مسؤول الحماية في اليوم نفسه واترك له القرار"},{"en":"Check the explanation with the child's friends","ar":"تحقق من التفسير مع أصدقاء الطفل"},{"en":"Wait a week to see if the mark fades","ar":"انتظر أسبوعًا لترى هل تتلاشى العلامة"},{"en":"Ask a colleague whether they believe the explanation","ar":"اسأل زميلًا هل يصدّق التفسير"}],"correct":0},{"id":"e20","mod":7,"q":{"en":"It is the afternoon, you have a concern, and the DSL is off-site. What is correct?","ar":"الوقت بعد الظهر ولديك قلق ومسؤول الحماية خارج المدرسة. ما الصحيح؟"},"opts":[{"en":"Wait until the DSL is back in school","ar":"انتظر عودة مسؤول الحماية إلى المدرسة"},{"en":"Report to a deputy DSL, because at least one is available whenever the school is in session","ar":"أبلغ أحد نواب المسؤول، لأن واحدًا منهم على الأقل متوافر طوال وقت الدوام"},{"en":"Contact the family and ask them about it yourself","ar":"اتصل بالأسرة واسألها عن الأمر بنفسك"},{"en":"Write a note and leave it in the DSL's pigeonhole","ar":"اكتب ملاحظة واتركها في صندوق مسؤول الحماية"}],"correct":1},{"id":"e21","mod":7,"q":{"en":"If a child is in immediate danger and the DSL cannot be reached, what should you do?","ar":"إذا كان الطفل في خطر داهم وتعذّر الوصول إلى مسؤول الحماية، ماذا عليك أن تفعل؟"},"opts":[{"en":"Wait for the DSL, as only the DSL may contact the Police","ar":"انتظر مسؤول الحماية، فهو وحده من يحق له الاتصال بالشرطة"},{"en":"Ask the child to wait in the classroom until the end of the day","ar":"اطلب من الطفل الانتظار في الصف حتى نهاية اليوم"},{"en":"Contact the Police without delay and tell the DSL as soon as possible afterwards","ar":"اتصل بالشرطة دون تأخير وأخبر مسؤول الحماية في أقرب وقت ممكن بعد ذلك"},{"en":"Ask the child's parents to come in to decide what to do","ar":"اطلب من والدي الطفل الحضور ليقررا ما يجب فعله"}],"correct":2}]};
