#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

does not replace, the school's own policies and your line manager's instructions.\u003c/strong>","ar":"Parents talk to support staff every day: at the gate, at reception, on the bus, in the canteen and by phone. This course helps you speak with parents in a clear, kind and safe way. By the end you will be able to say what you can share, refer what you cannot, handle complaints, protect children, and keep simple records. \u003cstrong>This CPD supports, and does not replace, the school's own policies and your line manager's instructions.\u003c/strong>"}},{"t":"p","c":{"en":"Parents trust us with their children. When a support staff member is friendly, honest and careful, that trust grows. You are often the first person a parent meets, so your role matters a great deal. You are not expected to know everything. You are expected to be polite, to protect private information and to send the parent to the right person.","ar":"Parents trust us with their children. When a support staff member is friendly, honest and careful, that trust grows. You are often the first person a parent meets, so your role matters a great deal. You are not expected to know everything. You are expected to be polite, to protect private information and to send the parent to the right person."}},{"t":"h","c":{"en":"What you can usually say","ar":"What you can usually say"}},{"t":"list","c":{"en":["General school information that is already public or has been sent to all parents, such as the date of an event or the time school finishes.","Simple facts about your own area, such as where the lost property box is or how to reach the school office.","A kind greeting, thanks and reassurance that you will pass on a message.","Who the right person is for a question, and how the parent can reach them through the school's usual channels."],"ar":["General school information that is already public or has been sent to all parents, such as the date of an event or the time school finishes.","Simple facts about your own area, such as where the lost property box is or how to reach the school office.","A kind greeting, thanks and reassurance that you will pass on a message.","Who the right person is for a question, and how the parent can reach them through the school's usual channels."]}},{"t":"h","c":{"en":"What you must not discuss","ar":"What you must not discuss"}},{"t":"p","c":{"en":"Some topics belong to teachers, the school nurse, accounts or senior leadership. If you talk about them, you may share wrong or private information, or cause worry and conflict. Refer these topics politely.","ar":"Some topics belong to teachers, the school nurse, accounts or senior leadership. If you talk about them, you may share wrong or private information, or cause worry and conflict. Refer these topics politely."}},{"t":"table","head":{"en":["Topic","Why you refer it","Who usually answers"],"ar":["Topic","Why you refer it","Who usually answers"]},"rows":[{"en":["Other children (names, behaviour, injuries)","It is private information about another family","The class teacher or coordinator, who decides what may be shared"],"ar":["Other children (names, behaviour, injuries)","It is private information about another family","The class teacher or coordinator, who decides what may be shared"]},{"en":["Grades, progress and exam results","Teachers can explain them properly and fairly","The class or subject teacher"],"ar":["Grades, progress and exam results","Teachers can explain them properly and fairly","The class or subject teacher"]},{"en":["Discipline and sanctions","Facts may be incomplete and the school must act fairly","The coordinator or senior leadership"],"ar":["Discipline and sanctions","Facts may be incomplete and the school must act fairly","The coordinator or senior leadership"]},{"en":["Health and medicine","Health data is sensitive and needs trained staff","The school nurse"],"ar":["Health and medicine","Health data is sensitive and needs trained staff","The school nurse"]},{"en":["Fee decisions, discounts and payment plans","Only authorised staff can decide","The accounts team or senior leadership"],"ar":["Fee decisions, discounts and payment plans","Only authorised staff can decide","The accounts team or senior leadership"]}]},{"t":"callout","k":"warn","title":{"en":"Personal data is protected","ar":"Personal data is protected"},"c":{"en":"UAE law (Federal Decree-Law No. 45 of 2021 on Personal Data Protection) protects personal data. Health, child and ID information is especially sensitive. Never share it unless the school's policy says you may, and you are sure who you are speaking to.","ar":"UAE law (Federal Decree-Law No. 45 of 2021 on Personal Data Protection) protects personal data. Health, child and ID information is especially sensitive. Never share it unless the school's policy says you may, and you are sure who you are speaking to."}},{"t":"scenario","title":{"en":"Scenario: \"Was my son pushed?\"","ar":"Scenario: \"Was my son pushed?\""},"c":{"en":"At the gate, a mother says, \"My son came home with a bruise. Another boy pushed him, didn't he? Who was it?\" You saw a small argument earlier. \u003cstrong>What should you do?\u003c/strong> Do not name any child and do not tell her what you think happened. Say kindly, \"I am sorry he was hurt. I cannot talk about other children, but his class teacher can look into it. Shall I ask her to call you today?\" Then pass the message to the teacher the same day. The mother feels heard and nobody's privacy is broken.","ar":"At the gate, a mother says, \"My son came home with a bruise. Another boy pushed him, didn't he? Who was it?\" You saw a small argument earlier. \u003cstrong>What should you do?\u003c/strong> Do not name any child and do not tell her what you think happened. Say kindly, \"I am sorry he was hurt. I cannot talk about other children, but his class teacher can look into it. Shall I ask her to call you today?\" Then pass the message to the teacher the same day. The mother feels heard and nobody's privacy is broken."}},{"t":"callout","k":"tip","title":{"en":"A good phrase to remember","ar":"A good phrase to remember"},"c":{"en":"\"I cannot help with that myself, but I know who can, and I will make sure they hear from you.\" It is honest, kind and useful.","ar":"\"I cannot help with that myself, but I know who can, and I will make sure they hear from you.\" It is honest, kind and useful."}}],"checks":[{"id":"m1q1","q":{"en":"A parent asks you what grade another child got in the maths test. What should you do?","ar":"A parent asks you what grade another child got in the maths test. What should you do?"},"opts":[{"en":"Explain politely that you cannot share other children's results","ar":"Explain politely that you cannot share other children's results"},{"en":"Tell the parent the grade, because it is not a very private matter","ar":"Tell the parent the grade, because it is not a very private matter"},{"en":"Say the grade quietly so that nobody nearby can hear you","ar":"Say the grade quietly so that nobody nearby can hear you"},{"en":"Show the parent the class list so that they can check themselves","ar":"Show the parent the class list so that they can check themselves"}],"correct":0,"expl":{"en":"Grades and results are private and belong to the family and the teachers. Support staff must not share them, even quietly or in part.","ar":"Grades and results are private and belong to the family and the teachers. Support staff must not share them, even quietly or in part."}},{"id":"m1q2","q":{"en":"Which of these can a support staff member usually tell a parent?","ar":"Which of these can a support staff member usually tell a parent?"},"opts":[{"en":"The reason why a pupil was given a sanction on the day before","ar":"The reason why a pupil was given a sanction on the day before"},{"en":"The finish time on sports day, as sent to all parents in the circular","ar":"The finish time on sports day, as sent to all parents in the circular"},{"en":"The name of the pupil who hurt the parent's child during break","ar":"The name of the pupil who hurt the parent's child during break"},{"en":"Whether another family has paid the school fees for the term","ar":"Whether another family has paid the school fees for the term"}],"correct":1,"expl":{"en":"You may share public school information that has been sent to all parents. Discipline, other pupils and fees are private and must be referred.","ar":"You may share public school information that has been sent to all parents. Discipline, other pupils and fees are private and must be referred."}},{"id":"m1q3","q":{"en":"A father asks you whether his daughter has a medical condition that the nurse mentioned. What is the best reply?","ar":"A father asks you whether his daughter has a medical condition that the nurse mentioned. What is the best reply?"},"opts":[{"en":"Say what you remember hearing so that he does not have to wait for the nurse","ar":"Say what you remember hearing so that he does not have to wait for the nurse"},{"en":"Tell him not to worry, because the nurse would have already called him","ar":"Tell him not to worry, because the nurse would have already called him"},{"en":"Say the school nurse is the right person and offer to pass on his request","ar":"Say the school nurse is the right person and offer to pass on his request"},{"en":"Ask his daughter at lunchtime so that you can give him a quick answer","ar":"Ask his daughter at lunchtime so that you can give him a quick answer"}],"correct":2,"expl":{"en":"Health information needs trained staff who know the facts. Refer to the nurse and pass on the request. Guessing or asking the child can cause wrong information and worry.","ar":"Health information needs trained staff who know the facts. Refer to the nurse and pass on the request. Guessing or asking the child can cause wrong information and worry."}}]},{"id":"m2","title":{"en":"Clear Messages by Phone, Email, WhatsApp and in Person","ar":"Clear Messages by Phone, Email, WhatsApp and in Person"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Parents contact us in many ways. Each way has its own good habits. In all of them, the message must be short, simple, polite and correct. Many of our parents speak English as a second language, and some are more comfortable in Arabic or another language.","ar":"Parents contact us in many ways. Each way has its own good habits. In all of them, the message must be short, simple, polite and correct. Many of our parents speak English as a second language, and some are more comfortable in Arabic or another language."}},{"t":"h","c":{"en":"Clear and simple messages","ar":"Clear and simple messages"}},{"t":"list","c":{"en":["Use short sentences and everyday words. Say \"finish\" instead of \"conclude\".","Put the most important thing first: what, when and where.","Give one main message at a time. Too much information makes people miss the key point.","Avoid short forms, school jargon and jokes. If you must use a school word, explain it.","Check understanding: \"Is that clear?\" or \"Would you like me to say it again?\""],"ar":["Use short sentences and everyday words. Say \"finish\" instead of \"conclude\".","Put the most important thing first: what, when and where.","Give one main message at a time. Too much information makes people miss the key point.","Avoid short forms, school jargon and jokes. If you must use a school word, explain it.","Check understanding: \"Is that clear?\" or \"Would you like me to say it again?\""]}},{"t":"h","c":{"en":"Choose the right channel","ar":"Choose the right channel"}},{"t":"table","head":{"en":["Channel","Good habits","Take care"],"ar":["Channel","Good habits","Take care"]},"rows":[{"en":["Phone","Smile, speak slowly, write notes and repeat the key point back","Be sure who you are speaking to before you share anything"],"ar":["Phone","Smile, speak slowly, write notes and repeat the key point back","Be sure who you are speaking to before you share anything"]},{"en":["Email","Clear subject, short message, polite ending, read before sending","Check the name and address. Never put one family's details in another family's email"],"ar":["Email","Clear subject, short message, polite ending, read before sending","Check the name and address. Never put one family's details in another family's email"]},{"en":["WhatsApp","Use the school's approved number or group, short messages, normal hours","Do not use your own private chat for pupil matters, and do not share photos of pupils without school approval"],"ar":["WhatsApp","Use the school's approved number or group, short messages, normal hours","Do not use your own private chat for pupil matters, and do not share photos of pupils without school approval"]},{"en":["In person","Greet, listen, stay calm, offer a private place for sensitive subjects","Do not talk about a child in a busy corridor or at the gate where others can hear"],"ar":["In person","Greet, listen, stay calm, offer a private place for sensitive subjects","Do not talk about a child in a busy corridor or at the gate where others can hear"]}]},{"t":"callout","k":"tip","title":{"en":"Use the school's channels","ar":"Use the school's channels"},"c":{"en":"Always use school-approved accounts, numbers and groups. Private accounts are harder to protect and can lead to mistakes. If you are unsure which channel is allowed, ask your line manager.","ar":"Always use school-approved accounts, numbers and groups. Private accounts are harder to protect and can lead to mistakes. If you are unsure which channel is allowed, ask your line manager."}},{"t":"h","c":{"en":"Cultural respect and language needs","ar":"Cultural respect and language needs"}},{"t":"p","c":{"en":"Our families come from many countries and cultures. Respect is the base of every conversation. Greet people warmly, use their title and name correctly, and follow the person's lead on handshakes and eye contact. Be careful with humour and with comments about family, religion or dress.","ar":"Our families come from many countries and cultures. Respect is the base of every conversation. Greet people warmly, use their title and name correctly, and follow the person's lead on handshakes and eye contact. Be careful with humour and with comments about family, religion or dress."}},{"t":"list","c":{"en":["Offer help in the language the parent finds easiest. Many parents prefer Arabic. If a colleague speaks the language, ask them to help.","Speak slowly, not loudly. Speaking louder does not help understanding.","Use simple written messages and, where the school provides it, a translated version of an important notice.","Never make a parent feel embarrassed about their English. Never use a child as an interpreter for serious or private matters."],"ar":["Offer help in the language the parent finds easiest. Many parents prefer Arabic. If a colleague speaks the language, ask them to help.","Speak slowly, not loudly. Speaking louder does not help understanding.","Use simple written messages and, where the school provides it, a translated version of an important notice.","Never make a parent feel embarrassed about their English. Never use a child as an interpreter for serious or private matters."]}},{"t":"scenario","title":{"en":"Scenario: the parent who prefers Arabic","ar":"Scenario: the parent who prefers Arabic"},"c":{"en":"A father comes to reception to ask about a change to the bus stop. His English is limited, and he looks worried. \u003cstrong>What do you do?\u003c/strong> Greet him warmly, speak slowly and ask, \"Would you prefer to speak in Arabic?\" If you do not speak Arabic, ask a colleague who does to help. Write the new stop clearly on paper, and check he understands. He leaves with the right information and with respect.","ar":"A father comes to reception to ask about a change to the bus stop. His English is limited, and he looks worried. \u003cstrong>What do you do?\u003c/strong> Greet him warmly, speak slowly and ask, \"Would you prefer to speak in Arabic?\" If you do not speak Arabic, ask a colleague who does to help. Write the new stop clearly on paper, and check he understands. He leaves with the right information and with respect."}},{"t":"callout","k":"warn","title":{"en":"Do not use the pupil as your interpreter","ar":"Do not use the pupil as your interpreter"},"c":{"en":"Pupils should not translate a conversation about discipline, health, money or safety. They may be upset, may leave out parts, and should not hear adult matters.","ar":"Pupils should not translate a conversation about discipline, health, money or safety. They may be upset, may leave out parts, and should not hear adult matters."}}],"checks":[{"id":"m2q1","q":{"en":"Which message to a parent is clearest?","ar":"Which message to a parent is clearest?"},"opts":[{"en":"\"Regarding the forthcoming excursion, please ensure all documentation is submitted forthwith.\"","ar":"\"Regarding the forthcoming excursion, please ensure all documentation is submitted forthwith.\""},{"en":"\"Hi! Quick one: trip soon, forms needed. Let me know if any worries! Thanks!\"","ar":"\"Hi! Quick one: trip soon, forms needed. Let me know if any worries! Thanks!\""},{"en":"\"There will be a trip, and the forms must come back at some time before it happens.\"","ar":"\"There will be a trip, and the forms must come back at some time before it happens.\""},{"en":"\"The Year 4 trip is on Monday 10 March. Please send the form by Friday.\"","ar":"\"The Year 4 trip is on Monday 10 March. Please send the form by Friday.\""}],"correct":3,"expl":{"en":"Clear messages use short sentences, everyday words and the key facts first: what, when and what to do. Long formal words and vague wording confuse readers.","ar":"Clear messages use short sentences, everyday words and the key facts first: what, when and what to do. Long formal words and vague wording confuse readers."}},{"id":"m2q2","q":{"en":"A parent has limited English and you cannot understand each other. What is a good solution?","ar":"A parent has limited English and you cannot understand each other. What is a good solution?"},"opts":[{"en":"Ask a colleague who speaks her language to help, and write key points down","ar":"Ask a colleague who speaks her language to help, and write key points down"},{"en":"Ask the parent's young child to translate the whole conversation for both of you","ar":"Ask the parent's young child to translate the whole conversation for both of you"},{"en":"Speak louder and faster until the parent understands what you are saying","ar":"Speak louder and faster until the parent understands what you are saying"},{"en":"Ask the parent to return with an email, as written English is easier to read","ar":"Ask the parent to return with an email, as written English is easier to read"}],"correct":0,"expl":{"en":"Respectful help in the parent's language, with written key points, works best. Children should not interpret, and speaking louder does not help.","ar":"Respectful help in the parent's language, with written key points, works best. Children should not interpret, and speaking louder does not help."}},{"id":"m2q3","q":{"en":"You want to message a parent about a pupil's late arrival. Which channel is correct?","ar":"You want to message a parent about a pupil's late arrival. Which channel is correct?"},"opts":[{"en":"Your own private WhatsApp, because the parent is more likely to see it quickly","ar":"Your own private WhatsApp, because the parent is more likely to see it quickly"},{"en":"The school's approved phone, email or WhatsApp, privately to that parent","ar":"The school's approved phone, email or WhatsApp, privately to that parent"},{"en":"A message to the whole class parents' group, to remind everyone about timing","ar":"A message to the whole class parents' group, to remind everyone about timing"},{"en":"A conversation at the gate in the morning, when other parents are also there","ar":"A conversation at the gate in the morning, when other parents are also there"}],"correct":1,"expl":{"en":"Use school-approved channels and share a pupil's details only with that pupil's parent, in private. Group messages and busy places can break privacy.","ar":"Use school-approved channels and share a pupil's details only with that pupil's parent, in private. Group messages and busy places can break privacy."}}]},{"id":"m3","title":{"en":"Handling Complaints and Concerns, and Escalation","ar":"Handling Complaints and Concerns, and Escalation"},"minutes":15,"blocks":[{"t":"p","c":{"en":"A complaint is a chance to put things right. Most parents who complain care about their child and want to be heard. A good first response from a support staff member can stop a small worry from becoming a big problem.","ar":"A complaint is a chance to put things right. Most parents who complain care about their child and want to be heard. A good first response from a support staff member can stop a small worry from becoming a big problem."}},{"t":"h","c":{"en":"Receiving a concern or complaint","ar":"Receiving a concern or complaint"}},{"t":"steps","c":{"en":["Stay calm and polite. Find a quiet, private place if possible.","Listen to the whole story without interrupting or arguing.","Thank the parent for telling you. Say you are sorry they are upset. This does not mean you agree who is right.","Write down the key facts: who, what, when, and what the parent wants to happen.","Do not promise an outcome you cannot control. Say who will deal with it and by when, as far as you know.","Pass the complaint to the right person the same day, using the school's complaints process."],"ar":["Stay calm and polite. Find a quiet, private place if possible.","Listen to the whole story without interrupting or arguing.","Thank the parent for telling you. Say you are sorry they are upset. This does not mean you agree who is right.","Write down the key facts: who, what, when, and what the parent wants to happen.","Do not promise an outcome you cannot control. Say who will deal with it and by when, as far as you know.","Pass the complaint to the right person the same day, using the school's complaints process."]}},{"t":"callout","k":"tip","title":{"en":"Say sorry for the feeling, not the fault","ar":"Say sorry for the feeling, not the fault"},"c":{"en":"\"I am sorry you are worried\" is kind and honest. \"Yes, the teacher was wrong\" is a judgement that is not yours to make.","ar":"\"I am sorry you are worried\" is kind and honest. \"Yes, the teacher was wrong\" is a judgement that is not yours to make."}},{"t":"h","c":{"en":"Do not defend, blame or promise","ar":"Do not defend, blame or promise"}},{"t":"table","head":{"en":["Instead of","Say"],"ar":["Instead of","Say"]},"rows":[{"en":["\"That is not true.\"","\"Thank you for telling me. I will make sure the right person looks into it.\""],"ar":["\"That is not true.\"","\"Thank you for telling me. I will make sure the right person looks into it.\""]},{"en":["\"The teacher is always very good.\"","\"I will pass your concern to the coordinator today.\""],"ar":["\"The teacher is always very good.\"","\"I will pass your concern to the coordinator today.\""]},{"en":["\"I will make sure he is punished.\"","\"The school will look at what happened fairly.\""],"ar":["\"I will make sure he is punished.\"","\"The school will look at what happened fairly.\""]},{"en":["\"It is nothing to worry about.\"","\"I understand this worries you. Let me find out who can help.\""],"ar":["\"It is nothing to worry about.\"","\"I understand this worries you. Let me find out who can help.\""]}]},{"t":"h","c":{"en":"Escalation: when and how","ar":"Escalation: when and how"}},{"t":"p","c":{"en":"Escalation means passing a matter to a more senior or more suitable person. Do it when you cannot fix the problem, when the parent asks for a manager, or when the matter is serious.","ar":"Escalation means passing a matter to a more senior or more suitable person. Do it when you cannot fix the problem, when the parent asks for a manager, or when the matter is serious."}},{"t":"list","c":{"en":["A complaint about a teacher, a pupil or a decision goes to the coordinator or senior leadership, following the school's complaints policy.","Anything about the safety of a child goes to the DSL (Designated Safeguarding Lead) at once. See the next module.","A parent who is abusive or threatening: stay safe, get a senior colleague, and report it the same day.","Tell the parent what will happen next, and keep your promise to pass the matter on."],"ar":["A complaint about a teacher, a pupil or a decision goes to the coordinator or senior leadership, following the school's complaints policy.","Anything about the safety of a child goes to the DSL (Designated Safeguarding Lead) at once. See the next module.","A parent who is abusive or threatening: stay safe, get a senior colleague, and report it the same day.","Tell the parent what will happen next, and keep your promise to pass the matter on."]}},{"t":"scenario","title":{"en":"Scenario: the complaint about the bus","ar":"Scenario: the complaint about the bus"},"c":{"en":"A mother stops you at reception and says, \"The bus driver shouted at my daughter this morning. This is not acceptable!\" You are not the transport supervisor. \u003cstrong>What do you do?\u003c/strong> Listen fully and thank her. Write down her daughter's name, class, the bus number, the time and what she said happened. Say, \"I am sorry your daughter was upset. I will give this to the transport supervisor today, and someone will contact you.\" Do not defend the driver or promise a result. Then pass it on and check that someone has called her.","ar":"A mother stops you at reception and says, \"The bus driver shouted at my daughter this morning. This is not acceptable!\" You are not the transport supervisor. \u003cstrong>What do you do?\u003c/strong> Listen fully and thank her. Write down her daughter's name, class, the bus number, the time and what she said happened. Say, \"I am sorry your daughter was upset. I will give this to the transport supervisor today, and someone will contact you.\" Do not defend the driver or promise a result. Then pass it on and check that someone has called her."}},{"t":"callout","k":"warn","title":{"en":"Keep it fair and private","ar":"Keep it fair and private"},"c":{"en":"Do not discuss a complaint with other parents, in staff group chats or in public places. It can harm the people involved and the school's trust.","ar":"Do not discuss a complaint with other parents, in staff group chats or in public places. It can harm the people involved and the school's trust."}}],"checks":[{"id":"m3q1","q":{"en":"A parent says a teacher treated his son unfairly. What is the best response?","ar":"A parent says a teacher treated his son unfairly. What is the best response?"},"opts":[{"en":"Explain that the teacher is experienced and would never act unfairly","ar":"Explain that the teacher is experienced and would never act unfairly"},{"en":"Agree that the teacher should be spoken to and promise it will happen","ar":"Agree that the teacher should be spoken to and promise it will happen"},{"en":"Listen, thank him, write the facts down and pass them to a senior person","ar":"Listen, thank him, write the facts down and pass them to a senior person"},{"en":"Tell him to speak to the teacher directly and avoid involving the office","ar":"Tell him to speak to the teacher directly and avoid involving the office"}],"correct":2,"expl":{"en":"Listen, record the facts and escalate. You should not defend, blame or make promises about the result, because a fair process must look at all sides.","ar":"Listen, record the facts and escalate. You should not defend, blame or make promises about the result, because a fair process must look at all sides."}},{"id":"m3q2","q":{"en":"Which sentence is the best to say to an upset parent?","ar":"Which sentence is the best to say to an upset parent?"},"opts":[{"en":"\"I am sorry the teacher made that mistake. It will not happen again.\"","ar":"\"I am sorry the teacher made that mistake. It will not happen again.\""},{"en":"\"I think there has been a mix-up, so there is probably no problem.\"","ar":"\"I think there has been a mix-up, so there is probably no problem.\""},{"en":"\"The rules are very clear, and there is nothing more that I can do about it.\"","ar":"\"The rules are very clear, and there is nothing more that I can do about it.\""},{"en":"\"I am sorry you are worried. I will pass this to the coordinator today.\"","ar":"\"I am sorry you are worried. I will pass this to the coordinator today.\""}],"correct":3,"expl":{"en":"Apologising for the worry, not the fault, is kind and honest. Then say what you will do. Blaming, dismissing or hiding behind rules makes parents angrier.","ar":"Apologising for the worry, not the fault, is kind and honest. Then say what you will do. Blaming, dismissing or hiding behind rules makes parents angrier."}},{"id":"m3q3","q":{"en":"When should you pass a complaint on to a more senior person?","ar":"When should you pass a complaint on to a more senior person?"},"opts":[{"en":"The same day, when you cannot solve it or the parent asks for a manager","ar":"The same day, when you cannot solve it or the parent asks for a manager"},{"en":"Only after the parent has written the complaint on paper and signed it","ar":"Only after the parent has written the complaint on paper and signed it"},{"en":"Only when the same parent has complained three or more times before","ar":"Only when the same parent has complained three or more times before"},{"en":"At the end of the week, so that you can collect all of the complaints","ar":"At the end of the week, so that you can collect all of the complaints"}],"correct":0,"expl":{"en":"Complaints should be passed on promptly. Waiting makes parents feel ignored and lets small problems grow. There is no need for paper or repeated complaints first.","ar":"Complaints should be passed on promptly. Waiting makes parents feel ignored and lets small problems grow. There is no need for paper or repeated complaints first."}}]},{"id":"m4","title":{"en":"Safeguarding and Sensitive Situations","ar":"Safeguarding and Sensitive Situations"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Safeguarding means protecting children from harm and keeping them safe. It is everyone's job: every adult in the school, including drivers, cleaners, guards, canteen staff and office staff. Because you meet families and children in many places, you may be the person who notices or hears something important.","ar":"Safeguarding means protecting children from harm and keeping them safe. It is everyone's job: every adult in the school, including drivers, cleaners, guards, canteen staff and office staff. Because you meet families and children in many places, you may be the person who notices or hears something important."}},{"t":"h","c":{"en":"Who may collect a child?","ar":"Who may collect a child?"}},{"t":"p","c":{"en":"Collection is one of the most sensitive moments of the day. A child must go home only with an authorised adult. The school has a list of people who may collect each child. Follow the school's collection procedure every time, even if you know the person.","ar":"Collection is one of the most sensitive moments of the day. A child must go home only with an authorised adult. The school has a list of people who may collect each child. Follow the school's collection procedure every time, even if you know the person."}},{"t":"steps","c":{"en":["Check the school's authorised list. Do not release a child on the word of the child or a stranger.","Ask a person you do not know for ID and compare it with the list.","If a parent sends someone new, the school needs advance notice through the usual channel. Follow the school's steps and ask a manager if unsure.","If the person is not on the list, do not release the child. Stay calm and polite, and call a senior colleague.","If the person seems unwell, upset or unsafe to drive, tell a senior colleague at once. Do not argue; keep the child safe."],"ar":["Check the school's authorised list. Do not release a child on the word of the child or a stranger.","Ask a person you do not know for ID and compare it with the list.","If a parent sends someone new, the school needs advance notice through the usual channel. Follow the school's steps and ask a manager if unsure.","If the person is not on the list, do not release the child. Stay calm and polite, and call a senior colleague.","If the person seems unwell, upset or unsafe to drive, tell a senior colleague at once. Do not argue; keep the child safe."]}},{"t":"h","c":{"en":"Custody and family situations","ar":"Custody and family situations"}},{"t":"p","c":{"en":"Some families live apart. There may be a court order or an agreement about who may collect or see the child. This is a legal matter. \u003cstrong>You do not decide who is right.\u003c/strong> Follow the information held by the school, and call a senior colleague if two parents disagree at the gate. Never take sides and never discuss one parent with the other.","ar":"Some families live apart. There may be a court order or an agreement about who may collect or see the child. This is a legal matter. \u003cstrong>You do not decide who is right.\u003c/strong> Follow the information held by the school, and call a senior colleague if two parents disagree at the gate. Never take sides and never discuss one parent with the other."}},{"t":"callout","k":"warn","title":{"en":"If someone is angry or pulls a child","ar":"If someone is angry or pulls a child"},"c":{"en":"Do not physically hold a child or fight over them. Keep calm, keep the child's safety first, and call for senior help. If there is danger to anyone, call 999.","ar":"Do not physically hold a child or fight over them. Keep calm, keep the child's safety first, and call for senior help. If there is danger to anyone, call 999."}},{"t":"h","c":{"en":"Unusual things a child says or shows","ar":"Unusual things a child says or shows"}},{"t":"list","c":{"en":["A child may tell you something worrying, or you may see marks, fear, hunger or a big change in behaviour.","Listen calmly and kindly. Say, \"Thank you for telling me. You did the right thing.\"","Do not ask leading questions, do not investigate and do not promise to keep a secret. Say you must tell someone whose job is to help.","Do not tell the parent or other staff or pupils. Only the DSL decides what happens next.","\u003cstrong>Report it to the DSL the same day.\u003c/strong> Write down what you heard or saw, in the child's own words, with the date and time."],"ar":["A child may tell you something worrying, or you may see marks, fear, hunger or a big change in behaviour.","Listen calmly and kindly. Say, \"Thank you for telling me. You did the right thing.\"","Do not ask leading questions, do not investigate and do not promise to keep a secret. Say you must tell someone whose job is to help.","Do not tell the parent or other staff or pupils. Only the DSL decides what happens next.","\u003cstrong>Report it to the DSL the same day.\u003c/strong> Write down what you heard or saw, in the child's own words, with the date and time."]}},{"t":"callout","k":"tip","title":{"en":"You do not need proof","ar":"You do not need proof"},"c":{"en":"You do not have to be sure that something is wrong. A worry is enough. It is the DSL's job to decide what to do.","ar":"You do not have to be sure that something is wrong. A worry is enough. It is the DSL's job to decide what to do."}},{"t":"scenario","title":{"en":"Scenario: a child says, \"Please do not tell\"","ar":"Scenario: a child says, \"Please do not tell\""},"c":{"en":"A canteen worker is clearing tables. A Year 3 pupil whispers, \"I am hungry at home, and my dad shouts at night. Please do not tell.\" \u003cstrong>What should the worker do?\u003c/strong> Listen kindly. Say, \"Thank you for telling me. I cannot keep this secret, because I must tell someone who can help you.\" Do not ask many questions. Do not speak to the father. Write down the child's words, and tell the DSL the same day. The child is safe, and the right person can act.","ar":"A canteen worker is clearing tables. A Year 3 pupil whispers, \"I am hungry at home, and my dad shouts at night. Please do not tell.\" \u003cstrong>What should the worker do?\u003c/strong> Listen kindly. Say, \"Thank you for telling me. I cannot keep this secret, because I must tell someone who can help you.\" Do not ask many questions. Do not speak to the father. Write down the child's words, and tell the DSL the same day. The child is safe, and the right person can act."}}],"checks":[{"id":"m4q1","q":{"en":"A man you do not know asks to collect a Year 2 pupil. He says the mother sent him. He is not on the list. What should you do?","ar":"A man you do not know asks to collect a Year 2 pupil. He says the mother sent him. He is not on the list. What should you do?"},"opts":[{"en":"Let the child go with him once the child says that he knows the man","ar":"Let the child go with him once the child says that he knows the man"},{"en":"Do not release the child, stay polite, and call a senior colleague to help","ar":"Do not release the child, stay polite, and call a senior colleague to help"},{"en":"Let him collect the child, and phone the mother to tell her afterwards","ar":"Let him collect the child, and phone the mother to tell her afterwards"},{"en":"Ask him to wait at the gate and send the child to find his older sister","ar":"Ask him to wait at the gate and send the child to find his older sister"}],"correct":1,"expl":{"en":"A child may only leave with an authorised adult on the list. Never release a child on someone's word. A senior colleague will contact the parent through the school's steps.","ar":"A child may only leave with an authorised adult on the list. Never release a child on someone's word. A senior colleague will contact the parent through the school's steps."}},{"id":"m4q2","q":{"en":"Two parents argue at the gate about which one may collect their child. What is best?","ar":"Two parents argue at the gate about which one may collect their child. What is best?"},"opts":[{"en":"Ask the child which parent he wants to go home with, so that the argument stops","ar":"Ask the child which parent he wants to go home with, so that the argument stops"},{"en":"Support the parent who seems more upset, because they may have good reason","ar":"Support the parent who seems more upset, because they may have good reason"},{"en":"Stay calm, protect the child, follow school records and call a senior colleague","ar":"Stay calm, protect the child, follow school records and call a senior colleague"},{"en":"Let the child go with the first parent who reaches him, and avoid a long wait","ar":"Let the child go with the first parent who reaches him, and avoid a long wait"}],"correct":2,"expl":{"en":"Custody is a legal matter. You do not decide who is right. Follow school records and get senior help, and never ask the child to choose.","ar":"Custody is a legal matter. You do not decide who is right. Follow school records and get senior help, and never ask the child to choose."}},{"id":"m4q3","q":{"en":"A pupil tells you something that worries you and asks you to keep it a secret. What do you do?","ar":"A pupil tells you something that worries you and asks you to keep it a secret. What do you do?"},"opts":[{"en":"Keep the secret, so that the pupil continues to trust you with problems","ar":"Keep the secret, so that the pupil continues to trust you with problems"},{"en":"Ask the pupil's friends if the story is true before you tell anyone else","ar":"Ask the pupil's friends if the story is true before you tell anyone else"},{"en":"Tell the pupil's parents the same afternoon, so that they can deal with it","ar":"Tell the pupil's parents the same afternoon, so that they can deal with it"},{"en":"Say you cannot keep it secret, and report it to the DSL on the same day","ar":"Say you cannot keep it secret, and report it to the DSL on the same day"}],"correct":3,"expl":{"en":"Never promise secrecy. Report to the DSL the same day. Do not investigate or tell parents, because that could put the child at greater risk.","ar":"Never promise secrecy. Report to the DSL the same day. Do not investigate or tell parents, because that could put the child at greater risk."}}]},{"id":"m5","title":{"en":"Recording, Consistency and School Messages","ar":"Recording, Consistency and School Messages"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Good communication is not only what we say. It is also what we write down and how consistent we are. If five staff give five different answers, parents lose trust. A simple record and a shared message keep everyone together.","ar":"Good communication is not only what we say. It is also what we write down and how consistent we are. If five staff give five different answers, parents lose trust. A simple record and a shared message keep everyone together."}},{"t":"h","c":{"en":"Recording conversations","ar":"Recording conversations"}},{"t":"p","c":{"en":"Write a short note of any important conversation, request or concern on the same day. Use the school's approved log, form or system, not private paper or your own phone.","ar":"Write a short note of any important conversation, request or concern on the same day. Use the school's approved log, form or system, not private paper or your own phone."}},{"t":"table","head":{"en":["Write down","Do not write"],"ar":["Write down","Do not write"]},"rows":[{"en":["Date, time and who you spoke to","Your opinion about the parent or the child"],"ar":["Date, time and who you spoke to","Your opinion about the parent or the child"]},{"en":["What was asked or reported, in plain facts","Guesses about why it happened"],"ar":["What was asked or reported, in plain facts","Guesses about why it happened"]},{"en":["What you said and what you agreed to do","Promises that you cannot keep"],"ar":["What you said and what you agreed to do","Promises that you cannot keep"]},{"en":["Who you passed it to and when","Details that other staff do not need to know"],"ar":["Who you passed it to and when","Details that other staff do not need to know"]}]},{"t":"callout","k":"tip","title":{"en":"Facts, not feelings","ar":"Facts, not feelings"},"c":{"en":"Write what you saw or heard: \"Mother said the bus arrived 30 minutes late.\" Not: \"Mother was being unreasonable.\"","ar":"Write what you saw or heard: \"Mother said the bus arrived 30 minutes late.\" Not: \"Mother was being unreasonable.\""}},{"t":"h","c":{"en":"Being consistent","ar":"Being consistent"}},{"t":"list","c":{"en":["Give the same answer as your colleagues. If you are not sure what the school's answer is, ask before you speak.","Use the school's official messages and wording for matters such as fees, rules and events.","Do not give your own views on school decisions or on other staff members.","If you have given wrong information, correct it quickly and tell your line manager."],"ar":["Give the same answer as your colleagues. If you are not sure what the school's answer is, ask before you speak.","Use the school's official messages and wording for matters such as fees, rules and events.","Do not give your own views on school decisions or on other staff members.","If you have given wrong information, correct it quickly and tell your line manager."]}},{"t":"h","c":{"en":"Sharing school messages","ar":"Sharing school messages"}},{"t":"p","c":{"en":"Parents often ask about circulars, events, absences and bus changes. These messages must be accurate and sent through the right route.","ar":"Parents often ask about circulars, events, absences and bus changes. These messages must be accurate and sent through the right route."}},{"t":"table","head":{"en":["Type of message","Good practice"],"ar":["Type of message","Good practice"]},"rows":[{"en":["Circulars and notices","Share only the official version. Do not add or change details. Check that the correct year groups receive it"],"ar":["Circulars and notices","Share only the official version. Do not add or change details. Check that the correct year groups receive it"]},{"en":["Events","Give the date, time, place and what to bring, as the school has published them"],"ar":["Events","Give the date, time, place and what to bring, as the school has published them"]},{"en":["Absences","Write down the pupil's name, class, reason and date, and pass it to the class teacher or the office the same day. Do not share it with other parents"],"ar":["Absences","Write down the pupil's name, class, reason and date, and pass it to the class teacher or the office the same day. Do not share it with other parents"]},{"en":["Bus changes","Check with transport, then tell only the affected families through the school's approved channel. Always confirm the new time and stop"],"ar":["Bus changes","Check with transport, then tell only the affected families through the school's approved channel. Always confirm the new time and stop"]}]},{"t":"scenario","title":{"en":"Scenario: the changed bus time","ar":"Scenario: the changed bus time"},"c":{"en":"At 1 pm, the transport supervisor tells you that the Year 5 bus will leave 30 minutes early because of a road closure. A parent calls and asks, \"Is the bus normal today?\" \u003cstrong>What do you do?\u003c/strong> Share the correct, confirmed information: \"The Year 5 bus will leave 30 minutes early today because of a road closure.\" Say that the school is also sending a message to Year 5 families. Do not guess or give extra details. Write down the call, and tell the supervisor if parents are confused.","ar":"At 1 pm, the transport supervisor tells you that the Year 5 bus will leave 30 minutes early because of a road closure. A parent calls and asks, \"Is the bus normal today?\" \u003cstrong>What do you do?\u003c/strong> Share the correct, confirmed information: \"The Year 5 bus will leave 30 minutes early today because of a road closure.\" Say that the school is also sending a message to Year 5 families. Do not guess or give extra details. Write down the call, and tell the supervisor if parents are confused."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Share only public school information. Refer other children, grades, discipline, health and fees to the right person.\u003cbr>\u003cstrong>2.\u003c/strong> Use short, clear messages, school-approved channels and respect for every language and culture.\u003cbr>\u003cstrong>3.\u003c/strong> Listen to complaints, say sorry for the worry, write the facts down and escalate the same day.\u003cbr>\u003cstrong>4.\u003c/strong> Release a child only to an authorised adult, never promise secrecy, and report any concern to the DSL the same day.\u003cbr>\u003cstrong>5.\u003c/strong> Record important conversations as facts, and give the school's one consistent message.","ar":"\u003cstrong>1.\u003c/strong> Share only public school information. Refer other children, grades, discipline, health and fees to the right person.\u003cbr>\u003cstrong>2.\u003c/strong> Use short, clear messages, school-approved channels and respect for every language and culture.\u003cbr>\u003cstrong>3.\u003c/strong> Listen to complaints, say sorry for the worry, write the facts down and escalate the same day.\u003cbr>\u003cstrong>4.\u003c/strong> Release a child only to an authorised adult, never promise secrecy, and report any concern to the DSL the same day.\u003cbr>\u003cstrong>5.\u003c/strong> Record important conversations as facts, and give the school's one consistent message."}}],"checks":[{"id":"m5q1","q":{"en":"Which note is best in the school's record after a phone call?","ar":"Which note is best in the school's record after a phone call?"},"opts":[{"en":"\"10 March, 9:15: Mrs Noor said the Year 3 bus was late. I told transport.\"","ar":"\"10 March, 9:15: Mrs Noor said the Year 3 bus was late. I told transport.\""},{"en":"\"Mrs Noor rang again and was very rude and unreasonable about the bus today.\"","ar":"\"Mrs Noor rang again and was very rude and unreasonable about the bus today.\""},{"en":"\"Bus problem. Mother upset. Probably the driver's fault again, I think.\"","ar":"\"Bus problem. Mother upset. Probably the driver's fault again, I think.\""},{"en":"\"Spoke to parent. Told her it would be fixed soon, so no further action.\"","ar":"\"Spoke to parent. Told her it would be fixed soon, so no further action.\""}],"correct":0,"expl":{"en":"A good record has the date and time, the facts, and what you did. It does not include opinions, guesses or promises.","ar":"A good record has the date and time, the facts, and what you did. It does not include opinions, guesses or promises."}},{"id":"m5q2","q":{"en":"A parent calls to say her son will be absent tomorrow because he is unwell. What should you do?","ar":"A parent calls to say her son will be absent tomorrow because he is unwell. What should you do?"},"opts":[{"en":"Tell her to send a doctor's letter first and then ring again after that","ar":"Tell her to send a doctor's letter first and then ring again after that"},{"en":"Write the name, class, reason and date, and pass it to the class teacher","ar":"Write the name, class, reason and date, and pass it to the class teacher"},{"en":"Share the news with the parents' group so that they send him homework","ar":"Share the news with the parents' group so that they send him homework"},{"en":"Make a mental note and tell the teacher only if the child is absent again","ar":"Make a mental note and tell the teacher only if the child is absent again"}],"correct":1,"expl":{"en":"Record absences accurately the same day and pass them to the right person. Do not share a child's illness with other parents.","ar":"Record absences accurately the same day and pass them to the right person. Do not share a child's illness with other parents."}},{"id":"m5q3","q":{"en":"A colleague gives a parent a different answer from yours about a school rule. What is the best step?","ar":"A colleague gives a parent a different answer from yours about a school rule. What is the best step?"},"opts":[{"en":"Say your answer is right because you have worked in the school for longer","ar":"Say your answer is right because you have worked in the school for longer"},{"en":"Tell the parent that staff often disagree, so she should ask the Principal","ar":"Tell the parent that staff often disagree, so she should ask the Principal"},{"en":"Check the official answer with your line manager and give that message","ar":"Check the official answer with your line manager and give that message"},{"en":"Agree with whichever answer the parent likes best, to avoid an argument","ar":"Agree with whichever answer the parent likes best, to avoid an argument"}],"correct":2,"expl":{"en":"Consistency builds trust. Check the official answer and give the same message. Do not argue in front of the parent or give an answer just to please her.","ar":"Consistency builds trust. Check the official answer and give the same message. Do not argue in front of the parent or give an answer just to please her."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A parent stops you in the corridor and asks why another pupil was sent home from school. What should you say?","ar":"A parent stops you in the corridor and asks why another pupil was sent home from school. What should you say?"},"opts":[{"en":"Tell her quietly what you heard, as long as no other parents are listening","ar":"Tell her quietly what you heard, as long as no other parents are listening"},{"en":"Say that the pupil was probably sent home for bad behaviour in class today","ar":"Say that the pupil was probably sent home for bad behaviour in class today"},{"en":"Suggest she asks the other pupil's family, since they know the facts","ar":"Suggest she asks the other pupil's family, since they know the facts"},{"en":"Explain you cannot discuss other pupils, and offer to pass on her question","ar":"Explain you cannot discuss other pupils, and offer to pass on her question"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A mother asks you to tell her how her daughter is doing in English this term. What is the best reply?","ar":"A mother asks you to tell her how her daughter is doing in English this term. What is the best reply?"},"opts":[{"en":"Say the English teacher is the best person to ask, and offer to pass it on","ar":"Say the English teacher is the best person to ask, and offer to pass it on"},{"en":"Say your daughter seems to be doing well, since she looks happy in class","ar":"Say your daughter seems to be doing well, since she looks happy in class"},{"en":"Look at the teacher's marks quickly and tell her the grade on a page","ar":"Look at the teacher's marks quickly and tell her the grade on a page"},{"en":"Tell her that results are never shared with parents outside the report","ar":"Tell her that results are never shared with parents outside the report"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A parent asks you to reduce her fees because she lost her job. What should you do?","ar":"A parent asks you to reduce her fees because she lost her job. What should you do?"},"opts":[{"en":"Promise that you will ask for a discount from the next term and write the date","ar":"Promise that you will ask for a discount from the next term and write the date"},{"en":"Listen kindly, say you cannot decide this, and refer her to accounts","ar":"Listen kindly, say you cannot decide this, and refer her to accounts"},{"en":"Tell her that the school never changes the fees and she must find the money","ar":"Tell her that the school never changes the fees and she must find the money"},{"en":"Suggest that she pays half the amount now and you will tell nobody","ar":"Suggest that she pays half the amount now and you will tell nobody"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"You need to tell a parent about a late change to the school day. Which message is best?","ar":"You need to tell a parent about a late change to the school day. Which message is best?"},"opts":[{"en":"\"Please note the revised dismissal arrangements for the forthcoming Thursday.\"","ar":"\"Please note the revised dismissal arrangements for the forthcoming Thursday.\""},{"en":"\"Thursday is different. Check the school website when you have time.\"","ar":"\"Thursday is different. Check the school website when you have time.\""},{"en":"\"School finishes at 1 pm on Thursday. Please collect your child at 1 pm.\"","ar":"\"School finishes at 1 pm on Thursday. Please collect your child at 1 pm.\""},{"en":"\"Early finish soon, so don't be late, as the teachers will be leaving.\"","ar":"\"Early finish soon, so don't be late, as the teachers will be leaving.\""}],"correct":2},{"id":"e5","mod":2,"q":{"en":"You are about to email a parent's address list a reminder about a trip. What is the safest habit?","ar":"You are about to email a parent's address list a reminder about a trip. What is the safest habit?"},"opts":[{"en":"Send it to the whole year group at once, so that nobody is left out","ar":"Send it to the whole year group at once, so that nobody is left out"},{"en":"Add the class list below your message so that parents can see who is going","ar":"Add the class list below your message so that parents can see who is going"},{"en":"Forward the last email you sent, in case it already has the correct address","ar":"Forward the last email you sent, in case it already has the correct address"},{"en":"Check the recipients, and never include another family's details in it","ar":"Check the recipients, and never include another family's details in it"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"A parent tells you in Arabic that she cannot read the English circular. What is the best step?","ar":"A parent tells you in Arabic that she cannot read the English circular. What is the best step?"},"opts":[{"en":"Ask a colleague to help in Arabic, or write the key points down simply","ar":"Ask a colleague to help in Arabic, or write the key points down simply"},{"en":"Tell her to ask her child to read and explain the circular at home","ar":"Tell her to ask her child to read and explain the circular at home"},{"en":"Give her the same circular again, as she may understand it the second time","ar":"Give her the same circular again, as she may understand it the second time"},{"en":"Explain that all school communication is in English and she will learn","ar":"Explain that all school communication is in English and she will learn"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A father shouts at reception that the school has \"lost\" his child's lunch money. What should you do first?","ar":"A father shouts at reception that the school has \"lost\" his child's lunch money. What should you do first?"},"opts":[{"en":"Tell him that the school never loses money and ask for his proof","ar":"Tell him that the school never loses money and ask for his proof"},{"en":"Stay calm, listen, write down the facts and say who will look into it","ar":"Stay calm, listen, write down the facts and say who will look into it"},{"en":"Offer to give him the same amount from the office drawer to calm him","ar":"Offer to give him the same amount from the office drawer to calm him"},{"en":"Ask him to leave and write to the Principal if he wants to complain","ar":"Ask him to leave and write to the Principal if he wants to complain"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"A parent says she wants to speak to a manager about a decision. What is the right response?","ar":"A parent says she wants to speak to a manager about a decision. What is the right response?"},"opts":[{"en":"Explain that the manager is very busy and she should try the next week","ar":"Explain that the manager is very busy and she should try the next week"},{"en":"Tell her that managers do not usually discuss complaints with parents","ar":"Tell her that managers do not usually discuss complaints with parents"},{"en":"Say you will arrange it, note her name and concern, and pass it on today","ar":"Say you will arrange it, note her name and concern, and pass it on today"},{"en":"Ask her to explain the complaint first so that you can decide if it is serious","ar":"Ask her to explain the complaint first so that you can decide if it is serious"}],"correct":2},{"id":"e9","mod":3,"q":{"en":"After a complaint, a colleague asks you in a group chat what happened and who was involved. What do you do?","ar":"After a complaint, a colleague asks you in a group chat what happened and who was involved. What do you do?"},"opts":[{"en":"Share a summary with the names removed, since the group is only for staff","ar":"Share a summary with the names removed, since the group is only for staff"},{"en":"Share the details only with the staff members who you trust most","ar":"Share the details only with the staff members who you trust most"},{"en":"Share the full story so that everyone can be prepared in case it happens again","ar":"Share the full story so that everyone can be prepared in case it happens again"},{"en":"Share nothing in the chat; tell your colleague to ask the person dealing with it","ar":"Share nothing in the chat; tell your colleague to ask the person dealing with it"}],"correct":3},{"id":"e10","mod":4,"q":{"en":"At collection, a grandmother who is not on the list says the father sent her. The father is not answering his phone. What should you do?","ar":"At collection, a grandmother who is not on the list says the father sent her. The father is not answering his phone. What should you do?"},"opts":[{"en":"Do not release the child, stay polite and ask a senior colleague for help","ar":"Do not release the child, stay polite and ask a senior colleague for help"},{"en":"Release the child because she is family, and note the name and time carefully","ar":"Release the child because she is family, and note the name and time carefully"},{"en":"Ask the child if he knows her and let him go if he says he does","ar":"Ask the child if he knows her and let him go if he says he does"},{"en":"Let her take the child, but ask her to sign a note on a piece of paper","ar":"Let her take the child, but ask her to sign a note on a piece of paper"}],"correct":0},{"id":"e11","mod":4,"q":{"en":"A driver notices that a pupil on his bus has new marks on her arm and is very quiet. What should he do?","ar":"A driver notices that a pupil on his bus has new marks on her arm and is very quiet. What should he do?"},"opts":[{"en":"Ask her many questions on the bus until she explains how she got the marks","ar":"Ask her many questions on the bus until she explains how she got the marks"},{"en":"Report what he saw to the DSL the same day, without questioning her","ar":"Report what he saw to the DSL the same day, without questioning her"},{"en":"Wait a week to see whether the marks go away before telling anyone","ar":"Wait a week to see whether the marks go away before telling anyone"},{"en":"Speak to her parents the next morning to ask them what happened to her","ar":"Speak to her parents the next morning to ask them what happened to her"}],"correct":1},{"id":"e12","mod":4,"q":{"en":"A pupil tells a cleaner that she is afraid to go home. The cleaner is unsure if it is serious. What is best?","ar":"A pupil tells a cleaner that she is afraid to go home. The cleaner is unsure if it is serious. What is best?"},"opts":[{"en":"Wait until she has said more and the cleaner is sure that it is serious","ar":"Wait until she has said more and the cleaner is sure that it is serious"},{"en":"Tell the pupil's class teacher at the end of the week, as part of a general chat","ar":"Tell the pupil's class teacher at the end of the week, as part of a general chat"},{"en":"Report it to the DSL the same day, because a worry is enough","ar":"Report it to the DSL the same day, because a worry is enough function renderBlock(b){

    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return '';
}
