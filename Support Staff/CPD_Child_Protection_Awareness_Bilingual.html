#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

const CPD = {"meta":{"id":"child-protection-awareness","code":"CPA","passMark":80,"hours":"3 hours","accent":"#5B3A7A","accentSoft":"#EEE7F4","eyebrow":{"en":"Whole Staff CPD · Safeguarding · Performance Standard 5","ar":"تطوير مهني لجميع الموظفين · الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> · المعيار الخامس"},"title":{"en":"Child Protection & Safeguarding Awareness","ar":"التوعية بحماية الطفل والصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"},"subtitle":{"en":"A self-paced module for all staff on keeping every child safe: the law in the UAE and Sharjah, who does what at PEPS, the categories of abuse, how to respond when a child tells you something, how to record and report a concern, confidentiality, allegations against adults, and safer recruitment.","ar":"وحدة ذاتية الوتيرة لجميع الموظفين حول الحفاظ على سلامة كل طفل: القانون في الإمارات والشارقة، ومن يقوم بماذا في المدرسة، وفئات الإساءة، وكيفية الاستجابة عندما يخبرك الطفل بأمر ما، وكيفية تسجيل المخاوف والإبلاغ عنها، والسرية، والادعاءات ضد البالغين، والتوظيف الآمن."},"durationLabel":{"en":"About 3 hours, fully self-paced","ar":"نحو 3 ساعات، بوتيرة ذاتية بالكامل"},"standard":{"en":"UAE School Inspection Framework · Performance Standard 5 (Protection, Care, Guidance & Support)","ar":"إطار الإشراف على المدارس في الإمارات · المعيار الخامس (الحماية والرعاية والتوجيه والدعم)"},"source":{"en":"PEPS Child Protection & Safeguarding Policy (Level 3) 2026–2027","ar":"سياسة حماية الطفل والصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في مدرسة PEPS (المستوى الثالث) 2026–2027"}},"modules":[{"id":"m1","title":{"en":"Why Safeguarding Matters","ar":"لماذا يهمّ الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>؟"},"minutes":20,"blocks":[{"t":"p","c":{"en":"This programme is built on the school's principal safeguarding document, the \u003cstrong>PEPS Child Protection & Safeguarding Policy (Level 3), 2026–2027\u003c/strong>. Over the next three hours you will learn how PEPS keeps every child safe, what the law in the UAE and Sharjah expects of you personally, and exactly what to do if you are worried about a child.","ar":"يستند هذا البرنامج إلى الوثيقة الرئيسة للصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المدرسة، وهي \u003cstrong>سياسة حماية الطفل والصون الشامل في مدرسة بروفيدنس الإنجليزية الخاصة (المستوى الثالث) للعام 2026–2027\u003c/strong>. ستتعرّف خلال الساعات الثلاث القادمة إلى كيفية حفاظ المدرسة على سلامة كل طفل، وما يتوقعه منك القانون في الإمارات والشارقة شخصيًا، وما عليك فعله بالضبط إذا ساورك قلق على طفل."}},{"t":"callout","k":"key","title":{"en":"Our statement of intent","ar":"بيان التزامنا"},"c":{"en":"“The welfare of the child is, and must always remain, paramount.” Every child, regardless of age, gender, ability, culture, race, language, religion or family background, has an equal right to protection, and every member of our community shares responsibility for it.","ar":"«رفاه الطفل هو، ويجب أن يبقى دائمًا، الاعتبار الأسمى». لكل طفل، بغضّ النظر عن عمره أو جنسه أو قدراته أو ثقافته أو عرقه أو لغته أو دينه أو خلفيته الأسرية، حقٌّ متساوٍ في الحماية، ويتشارك كل فرد في مجتمعنا المسؤولية عنها."}},{"t":"h","c":{"en":"Two terms you must be able to tell apart","ar":"مصطلحان يجب أن تميّز بينهما"}},{"t":"table","head":{"en":["Term","What it means"],"ar":["المصطلح","ماذا يعني"]},"rows":[{"en":["Safeguarding","The broader, \u003cem>proactive\u003c/em> duty to protect children's health, wellbeing and rights and to let them grow up in safe and effective care, through good pastoral practice, supervision and a positive school culture."],"ar":["الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>","الواجب الأوسع والاستباقي لحماية صحة الأطفال ورفاههم وحقوقهم وتمكينهم من النمو في رعاية آمنة وفعّالة، من خلال الممارسات الرعوية الجيدة والإشراف والثقافة المدرسية الإيجابية."]},{"en":["Child protection","The more specific activity undertaken to protect \u003cem>individual\u003c/em> children who have been identified as suffering, or likely to suffer, significant harm."],"ar":["حماية الطفل \u003cbdi>(Child Protection)\u003c/bdi>","النشاط الأكثر تحديدًا الذي يُتّخذ لحماية أطفال \u003cem>بعينهم\u003c/em> تبيّن أنهم يعانون، أو يُرجَّح أن يعانوا، من ضرر جسيم."]}]},{"t":"h","c":{"en":"What PEPS commits to","ar":"ما تلتزم به المدرسة"}},{"t":"list","c":{"en":["Providing a safe environment in which children feel confident to raise concerns about their own welfare or that of others.","Identifying students who are suffering, or likely to suffer, significant harm, and acting so that they are kept safe both at home and at school.","Making sure all staff and volunteers understand their responsibility to be alert to the signs of abuse and to refer any concern to the Designated Safeguarding Lead (DSL).","Following safer recruitment procedures and responding properly to any allegation against a member of staff, volunteer or contractor.","Providing safeguarding training at the level appropriate to each role, and reviewing the policy at least once a year."],"ar":["توفير بيئة آمنة يشعر فيها الأطفال بالثقة في الإبلاغ عن مخاوفهم بشأن رفاههم أو رفاه غيرهم.","تحديد الطلبة الذين يعانون، أو يُرجَّح أن يعانوا، من ضرر جسيم، واتخاذ الإجراءات التي تُبقيهم آمنين في المنزل وفي المدرسة.","التأكد من أن جميع الموظفين والمتطوعين يدركون مسؤوليتهم في الانتباه لعلامات الإساءة وإحالة أي مخاوف إلى مسؤول حماية الطفل المعيّن (DSL).","اتباع إجراءات التوظيف الآمن والتعامل بالشكل الصحيح مع أي ادعاء ضد أحد الموظفين أو المتطوعين أو المتعاقدين.","توفير التدريب على الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> بما يناسب كل دور، ومراجعة السياسة مرة واحدة على الأقل في السنة."]}},{"t":"h","c":{"en":"Who and where the policy covers","ar":"من تشمل السياسة وأين تسري"}},{"t":"p","c":{"en":"The policy applies to all students from FS2 to Year 13, and to all staff, governors, volunteers, contractors, visitors and third parties working with or around students, \u003cstrong>on and off site\u003c/strong>, including school transport, trips and extracurricular activities.","ar":"تسري السياسة على جميع الطلبة من مرحلة FS2 حتى الصف الثالث عشر، وعلى جميع الموظفين وأعضاء مجلس الإدارة والمتطوعين والمتعاقدين والزوار والأطراف الثالثة الذين يعملون مع الطلبة أو بالقرب منهم، \u003cstrong>داخل المدرسة وخارجها\u003c/strong>، بما في ذلك النقل المدرسي والرحلات والأنشطة اللاصفية."}},{"t":"callout","k":"warn","title":{"en":"Safeguarding is everyone's responsibility","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> مسؤولية الجميع"},"c":{"en":"Whatever your role (teacher, assistant, administrator, driver, supervisor), you may be the adult a child chooses to trust. You do not need to be a specialist to act. You need to notice, listen, record and report.","ar":"أيًّا كان دورك (معلمًا أو مساعدًا أو إداريًا أو سائقًا أو مشرفًا)، فقد تكون أنت الشخص البالغ الذي يختار الطفل أن يثق به. لا يلزم أن تكون متخصصًا لتتصرّف؛ المطلوب أن تلاحظ وتُصغي وتسجّل وتبلّغ."}}],"checks":[{"id":"m1q1","q":{"en":"Which statement best describes the difference between safeguarding and child protection?","ar":"أي العبارات التالية تصف على أفضل وجه الفرق بين الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وحماية الطفل؟"},"opts":[{"en":"Safeguarding is the broad, proactive duty to promote children's welfare; child protection is the specific action taken for children suffering, or likely to suffer, significant harm.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> واجب واسع واستباقي لتعزيز رفاه الأطفال، أما حماية الطفل فهي الإجراء المحدد الذي يُتّخذ لأطفال يعانون أو يُرجَّح أن يعانوا من ضرر جسيم."},{"en":"Safeguarding applies only to teachers; child protection applies only to the DSL.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> يخص المعلمين فقط، أما حماية الطفل فتخص مسؤول الحماية (DSL) فقط."},{"en":"The two terms mean exactly the same thing and can be used interchangeably.","ar":"المصطلحان يعنيان الشيء نفسه تمامًا ويمكن استخدامهما بالتبادل."},{"en":"Safeguarding begins only after abuse has been proven; child protection happens before.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> لا يبدأ إلا بعد ثبوت الإساءة، أما حماية الطفل فتسبقها."}],"correct":0,"expl":{"en":"Safeguarding is proactive and school-wide (culture, supervision, pastoral care). Child protection is the targeted response for an individual child at risk of significant harm.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> استباقي ويشمل المدرسة كلها (الثقافة والإشراف والرعاية الرعوية)، أما حماية الطفل فهي الاستجابة الموجّهة لطفل بعينه معرّض لخطر ضرر جسيم."}},{"id":"m1q2","q":{"en":"Which of these is covered by the PEPS safeguarding policy?","ar":"أي مما يلي تشمله سياسة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المدرسة؟"},"opts":[{"en":"Only teaching staff while lessons are taking place in the classroom.","ar":"المعلمون فقط أثناء الحصص داخل الصف."},{"en":"Staff, volunteers, contractors and visitors, both on site and off site (including trips and school transport).","ar":"الموظفون والمتطوعون والمتعاقدون والزوار، داخل المدرسة وخارجها (بما في ذلك الرحلات والنقل المدرسي)."},{"en":"Only students in secondary school (Year 7 to Year 13).","ar":"طلبة المرحلة الثانوية فقط (من الصف السابع إلى الثالث عشر)."},{"en":"Only incidents that happen inside the school building.","ar":"الحوادث التي تقع داخل مبنى المدرسة فقط."}],"correct":1,"expl":{"en":"The policy covers all students from FS2 to Year 13 and everyone working with or around them, on and off site, including transport, trips and extracurricular activities.","ar":"تشمل السياسة جميع الطلبة من FS2 إلى الصف الثالث عشر وكل من يعمل معهم أو بالقرب منهم، داخل المدرسة وخارجها، بما في ذلك النقل والرحلات والأنشطة اللاصفية."}}]},{"id":"m2","title":{"en":"The UAE and Sharjah Legal Framework","ar":"الإطار القانوني في الإمارات والشارقة"},"minutes":20,"blocks":[{"t":"p","c":{"en":"Safeguarding at PEPS is not only good practice, it is a legal duty. The policy is written with reference to the child protection legislation and regulatory guidance that apply in the United Arab Emirates and the Emirate of Sharjah.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المدرسة ليس ممارسة جيدة فحسب، بل هو واجب قانوني. وقد كُتبت السياسة استنادًا إلى تشريعات حماية الطفل والتوجيهات التنظيمية السارية في دولة الإمارات العربية المتحدة وإمارة الشارقة."}},{"t":"h","c":{"en":"Wadeema's Law","ar":"قانون وديمة"}},{"t":"p","c":{"en":"\u003cstrong>Federal Law No. (3) of 2016 concerning Child Rights\u003c/strong>, known as Wadeema's Law, establishes the fundamental rights of the child in the UAE, including the right to protection from all forms of abuse, neglect and exploitation. It places a duty on anyone in contact with children, including teachers and school staff, to report suspected abuse to the competent authorities.","ar":"\u003cstrong>القانون الاتحادي رقم (3) لسنة 2016 بشأن حقوق الطفل\u003c/strong>، المعروف بقانون وديمة، يقرّ الحقوق الأساسية للطفل في الإمارات، ومنها الحق في الحماية من جميع أشكال الإساءة والإهمال والاستغلال. ويفرض واجبًا على كل من يتعامل مع الأطفال، ومنهم المعلمون وموظفو المدرسة، بالإبلاغ عن الاشتباه في الإساءة إلى الجهات المختصة."}},{"t":"callout","k":"warn","title":{"en":"The reporting duty is personal","ar":"واجب الإبلاغ واجب شخصي"},"c":{"en":"Wadeema's Law places a legal obligation on school staff, as persons in regular contact with children, to report suspected abuse or neglect to the relevant authority. This duty \u003cstrong>cannot be delegated away or ignored\u003c/strong>, and it applies regardless of a staff member's role or seniority.","ar":"يُلزم قانون وديمة موظفي المدرسة، بوصفهم أشخاصًا على اتصال منتظم بالأطفال، بالإبلاغ عن الاشتباه في الإساءة أو الإهمال إلى الجهة المعنية. وهذا الواجب \u003cstrong>لا يمكن التنصّل منه أو تجاهله\u003c/strong>، وينطبق أيًّا كان دور الموظف أو مستواه الوظيفي."}},{"t":"h","c":{"en":"The wider framework","ar":"الإطار الأوسع"}},{"t":"table","head":{"en":["Instrument or body","Why it matters to you"],"ar":["التشريع أو الجهة","أهميته بالنسبة لك"]},"rows":[{"en":["Cabinet Resolution No. (52) of 2018","The Executive Regulation of Wadeema's Law: it sets out the practical mechanisms for carrying out child protection duties."],"ar":["قرار مجلس الوزراء رقم (52) لسنة 2018","اللائحة التنفيذية لقانون وديمة: تحدد الآليات العملية لتنفيذ واجبات حماية الطفل."]},{"en":["National Child Protection Policy in Educational Institutions (Ministry of Education)","Applies to all public and private educational institutions, whether teaching in person or remotely. Sets out the roles of schools, staff, parents and authorities."],"ar":["السياسة الوطنية لحماية الطفل في المؤسسات التعليمية (وزارة التربية والتعليم)","تنطبق على جميع المؤسسات التعليمية الحكومية والخاصة، سواء قدّمت التعليم حضوريًا أو عن بُعد، وتحدد أدوار المدارس والموظفين وأولياء الأمور والجهات المعنية."]},{"en":["UAE School Inspection Framework, Performance Standard 5","The protection, care, guidance and support of students is inspected as a distinct standard."],"ar":["إطار الإشراف على المدارس في الإمارات، المعيار الخامس","تُقيَّم حماية الطلبة ورعايتهم وتوجيههم ودعمهم بوصفها معيارًا مستقلًا."]},{"en":["Sharjah Private Education Authority (SPEA), Emiri Decree No. 45 of 2018","The regulator that licenses, inspects and monitors PEPS, including its compliance with child protection and safeguarding requirements."],"ar":["هيئة الشارقة للتعليم الخاص (SPEA)، المرسوم الأميري رقم (45) لسنة 2018","الجهة التنظيمية التي ترخّص للمدرسة وتفتّشها وترصد التزامها، بما في ذلك التزامها بمتطلبات حماية الطفل والصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>."]},{"en":["Federal Decree-Law No. 34 of 2021 on Combating Rumours and Cybercrimes","Relevant to online safety, cyberbullying and the misuse of technology to harm a child."],"ar":["المرسوم بقانون اتحادي رقم (34) لسنة 2021 في شأن مكافحة الشائعات والجرائم الإلكترونية","ذو صلة بالسلامة الرقمية والتنمّر الإلكتروني وإساءة استخدام التقنية للإضرار بالطفل."]},{"en":["UN Convention on the Rights of the Child (UNCRC)","Ratified by the UAE. The best interests of the child are the primary consideration in all actions concerning children."],"ar":["اتفاقية الأمم المتحدة لحقوق الطفل","صادقت عليها الدولة. مصلحة الطفل الفضلى هي الاعتبار الأول في جميع الإجراءات المتعلقة بالأطفال."]}]},{"t":"p","c":{"en":"The policy also draws on international best-practice frameworks used by British-curriculum schools, such as \u003cem>Keeping Children Safe in Education\u003c/em> and \u003cem>Working Together to Safeguard Children\u003c/em>. These are used to \u003cstrong>benchmark practice\u003c/strong>, not as UAE legal requirements.","ar":"كما تستفيد السياسة من أطر الممارسات الدولية الفضلى المعتمدة في مدارس المنهج البريطاني، مثل \u003cem>Keeping Children Safe in Education\u003c/em> و\u003cem>Working Together to Safeguard Children\u003c/em>. وتُستخدم هذه الأطر \u003cstrong>للمقارنة المرجعية بالممارسة\u003c/strong> وليست متطلبات قانونية في الإمارات."}}],"checks":[{"id":"m2q1","q":{"en":"Which UAE law places a duty on teachers and school staff to report suspected child abuse to the competent authorities?","ar":"أي قانون إماراتي يفرض على المعلمين وموظفي المدرسة واجب الإبلاغ عن الاشتباه في إساءة معاملة الطفل إلى الجهات المختصة؟"},"opts":[{"en":"Emiri Decree No. 45 of 2018, which established SPEA","ar":"المرسوم الأميري رقم (45) لسنة 2018 الذي أنشأ هيئة SPEA"},{"en":"The guidance document Keeping Children Safe in Education","ar":"وثيقة الإرشاد Keeping Children Safe in Education"},{"en":"Federal Law No. (3) of 2016 concerning Child Rights (Wadeema's Law)","ar":"القانون الاتحادي رقم (3) لسنة 2016 بشأن حقوق الطفل (قانون وديمة)"},{"en":"The school's own uniform and behaviour policies","ar":"سياستا الزي المدرسي والسلوك في المدرسة نفسها"}],"correct":2,"expl":{"en":"Wadeema's Law places the reporting duty on anyone in regular contact with children, including all school staff. The SPEA decree creates the regulator, and Keeping Children Safe in Education is a benchmark, not UAE law.","ar":"يفرض قانون وديمة واجب الإبلاغ على كل من يتعامل مع الأطفال بانتظام، ومنهم جميع موظفي المدرسة. أما مرسوم SPEA فينشئ الجهة التنظيمية، ووثيقة Keeping Children Safe in Education مرجع للمقارنة وليست قانونًا إماراتيًا."}},{"id":"m2q2","q":{"en":"A new teacher says, “Reporting is the DSL's job, not mine, because the DSL is more senior.” What is the correct position?","ar":"قالت معلمة جديدة: «الإبلاغ مهمة مسؤول الحماية وليس مهمتي لأنه أعلى مني منصبًا». ما الموقف الصحيح؟"},"opts":[{"en":"Only senior leaders carry the legal duty to report; teachers simply pass on information.","ar":"القادة الكبار وحدهم يتحملون واجب الإبلاغ القانوني؛ أما المعلمون فينقلون المعلومات فقط."},{"en":"The duty applies only if the teacher is certain that abuse has taken place.","ar":"ينطبق الواجب فقط إذا كان المعلم متأكدًا من وقوع الإساءة."},{"en":"The duty applies only to concerns that arise during lesson time.","ar":"ينطبق الواجب فقط على المخاوف التي تنشأ أثناء وقت الحصص."},{"en":"The legal duty to report applies to every member of staff, whatever their role or seniority, and cannot be delegated away.","ar":"واجب الإبلاغ القانوني ينطبق على كل موظف أيًّا كان دوره أو مستواه الوظيفي، ولا يمكن التنصّل منه."}],"correct":3,"expl":{"en":"Wadeema's Law and the PEPS policy make reporting a personal duty. You do not need certainty: raising a concern is enough, and the DSL decides what happens next.","ar":"يجعل قانون وديمة وسياسة المدرسة الإبلاغ واجبًا شخصيًا. ولا يلزم اليقين: يكفي رفع المخاوف، ثم يقرر مسؤول الحماية الخطوات التالية."}}]},{"id":"m3","title":{"en":"Roles and Responsibilities: Who Does What","ar":"الأدوار والمسؤوليات: من يقوم بماذا؟"},"minutes":20,"blocks":[{"t":"p","c":{"en":"Safeguarding is everyone's responsibility. Every adult working with, or on behalf of, PEPS students has a part to play, but certain roles carry specific, named responsibility.","ar":"الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> مسؤولية الجميع. فكل بالغ يعمل مع طلبة المدرسة أو نيابةً عنها له دور، لكن بعض الأدوار تحمل مسؤوليات محددة ومسمّاة."}},{"t":"table","head":{"en":["Role","Key responsibilities"],"ar":["الدور","أبرز المسؤوليات"]},"rows":[{"en":["Principal","Has overall responsibility for safeguarding and is accountable to the Governing Body and SPEA. Makes sure the DSL and deputies are appointed, trained to Level 3 and given time and resources. Acts as case manager for allegations against staff (the Chair of the Governing Body does so if the allegation concerns the Principal)."],"ar":["مدير المدرسة","يتحمل المسؤولية الشاملة عن الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>، ويخضع للمساءلة أمام مجلس الإدارة وهيئة SPEA. يضمن تعيين مسؤول الحماية ونوابه وتدريبهم على المستوى الثالث ومنحهم الوقت والموارد. ويتولى إدارة الحالة عند ورود ادعاء ضد أحد الموظفين (ويتولاها رئيس مجلس الإدارة إذا تعلق الادعاء بالمدير)."]},{"en":["Designated Safeguarding Lead (DSL)","Takes lead responsibility. First point of contact for any staff member, student or parent with a concern. Manages referrals to the Ministry of Education's Child Protection Unit, the Sharjah Child Protection Centre, the Ministry of Interior's Child Protection Centre and/or the Police. Keeps confidential records separate from the general school file. Works with the Inclusion Support Team where a child needs extra support to be understood."],"ar":["مسؤول حماية الطفل المعيّن (DSL)","يتولى المسؤولية الأولى. وهو جهة الاتصال الأولى لأي موظف أو طالب أو ولي أمر لديه مخاوف. يدير الإحالات إلى وحدة حماية الطفل بوزارة التربية والتعليم، ومركز حماية الطفل في الشارقة، ومركز حماية الطفل بوزارة الداخلية و/أو الشرطة. ويحتفظ بسجلات سرية منفصلة عن الملف المدرسي العام. ويعمل مع فريق الدعم الشامل عندما يحتاج الطفل إلى دعم إضافي ليُفهَم."]},{"en":["Deputy DSLs","Trained to the same Level 3 standard and authorised to carry out the DSL's functions in the DSL's absence. At least one deputy is available whenever the school is in session, including off-site trips and activities where practicable."],"ar":["نواب مسؤول الحماية","مدرَّبون على المستوى الثالث نفسه ومخوّلون بممارسة مهام مسؤول الحماية في غيابه. ويتوافر نائب واحد على الأقل طوال وقت الدوام المدرسي، بما في ذلك الرحلات والأنشطة خارج المدرسة متى أمكن ذلك."]},{"en":["School Counsellor and School Nurse","Core members of the Designated Safeguarding Team, bringing pastoral and medical expertise and supporting the wellbeing of the student and family throughout a safeguarding process."],"ar":["المرشد المدرسي والممرض المدرسي","عضوان أساسيان في فريق الحماية المعيّن، يقدّمان الخبرة الرعوية والطبية ويدعمان رفاه الطالب وأسرته طوال أي إجراء حماية."]},{"en":["Governing Body","Makes sure safeguarding arrangements are robust and the policy meets current requirements. Appoints a link governor for safeguarding who meets the DSL regularly and provides independent challenge."],"ar":["مجلس الإدارة","يضمن متانة ترتيبات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وتوافق السياسة مع المتطلبات الحالية. ويعيّن عضوًا مرتبطًا بملف الحماية يلتقي بمسؤول الحماية بانتظام ويوفّر رقابة مستقلة."]},{"en":["Parents and carers","Know the policy, give accurate emergency contact and medical information, and raise any concern about their own child or another child with the teacher or directly with the DSL."],"ar":["أولياء الأمور ومقدمو الرعاية","يعرفون السياسة، ويقدّمون معلومات دقيقة عن جهات الاتصال الطارئة والحالة الصحية، ويرفعون أي مخاوف بشأن طفلهم أو طفل آخر إلى المعلم أو مباشرةً إلى مسؤول الحماية."]},{"en":["Students","Are taught, in an age-appropriate way, how to recognise unsafe situations and who to talk to. They know that any member of staff will listen and that they will not get in trouble for raising a genuine concern."],"ar":["الطلبة","يتعلّمون بما يناسب أعمارهم كيف يتعرّفون إلى المواقف غير الآمنة وإلى من يتحدثون. ويعرفون أن أي موظف سيصغي إليهم وأنهم لن يُعاقبوا على رفع مخاوف حقيقية."]}]},{"t":"h","c":{"en":"Your safeguarding team at PEPS","ar":"فريق الحماية في مدرستك"}},{"t":"table","head":{"en":["Role","Name","Email"],"ar":["الدور","الاسم","البريد الإلكتروني"]},"rows":[{"en":["Designated Safeguarding Lead","Reham Badr","\u003cspan class=\"ltr\">raham.badr@pepsschool.ae\u003c/span>"],"ar":["مسؤول حماية الطفل المعيّن","\u003cbdi>Reham Badr\u003c/bdi>","\u003cspan class=\"ltr\">raham.badr@pepsschool.ae\u003c/span>"]},{"en":["Deputy DSL","Raef Fadel","\u003cspan class=\"ltr\">raef.fadel@pepsschool.ae\u003c/span>"],"ar":["نائب مسؤول الحماية","\u003cbdi>Raef Fadel\u003c/bdi>","\u003cspan class=\"ltr\">raef.fadel@pepsschool.ae\u003c/span>"]},{"en":["Deputy DSL","Mohamed Ali","\u003cspan class=\"ltr\">Mohamed.alielahmadi@pepsschool.ae\u003c/span>"],"ar":["نائب مسؤول الحماية","\u003cbdi>Mohamed Ali\u003c/bdi>","\u003cspan class=\"ltr\">Mohamed.alielahmadi@pepsschool.ae\u003c/span>"]},{"en":["Deputy DSL","Qaryah Nazeer","\u003cspan class=\"ltr\">qaryah.nazeer@pepsschool.ae\u003c/span>"],"ar":["نائب مسؤول الحماية","\u003cbdi>Qaryah Nazeer\u003c/bdi>","\u003cspan class=\"ltr\">qaryah.nazeer@pepsschool.ae\u003c/span>"]},{"en":["Link Governor for Safeguarding","Ziad Badr","\u003cspan class=\"ltr\">ziad@peps.ae\u003c/span>"],"ar":["العضو المرتبط بملف الحماية في مجلس الإدارة","\u003cbdi>Ziad Badr\u003c/bdi>","\u003cspan class=\"ltr\">ziad@peps.ae\u003c/span>"]}]},{"t":"p","c":{"en":"\u003cem>These details come from Appendix E of the 2026–2027 policy. Always check the current version of the policy for any change.\u003c/em>","ar":"\u003cem>هذه البيانات مأخوذة من الملحق (هـ) في سياسة 2026–2027. راجع دائمًا النسخة الحالية من السياسة للتأكد من أي تغيير.\u003c/em>"}},{"t":"h","c":{"en":"What every member of staff must do","ar":"ما يجب على كل موظف فعله"}},{"t":"steps","c":{"en":["\u003cstrong>Complete Level 1 safeguarding induction\u003c/strong> before, or as soon as possible after, starting work, and refresh it regularly.","\u003cstrong>Stay alert\u003c/strong> to signs that a child may be at risk, whatever your role.","\u003cstrong>Report any concern\u003c/strong> to the DSL (or a deputy) as soon as possible, and always on the same day.","\u003cstrong>Never\u003c/strong> investigate a concern yourself, promise a child confidentiality, or take independent action outside the policy.","\u003cstrong>Maintain professional boundaries\u003c/strong> with students at all times, in line with the Staff Code of Conduct."],"ar":["\u003cstrong>أكمل تدريب الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> التعريفي (المستوى الأول)\u003c/strong> قبل بدء العمل أو في أقرب وقت ممكن بعده، وجدّده بانتظام.","\u003cstrong>ابقَ منتبهًا\u003c/strong> لعلامات تعرّض الطفل للخطر، أيًّا كان دورك.","\u003cstrong>أبلغ عن أي مخاوف\u003c/strong> إلى مسؤول الحماية (أو أحد نوابه) في أسرع وقت ممكن، ودائمًا في اليوم نفسه.","\u003cstrong>لا تقم أبدًا\u003c/strong> بالتحقيق في أي مخاوف بنفسك، ولا تَعِد الطفل بالسرية، ولا تتخذ إجراءً مستقلًا خارج السياسة.","\u003cstrong>حافظ على الحدود المهنية\u003c/strong> مع الطلبة في جميع الأوقات وفقًا لميثاق سلوك الموظفين."]}}],"checks":[{"id":"m3q1","q":{"en":"Who is the first point of contact for any staff member, student or parent who has a safeguarding concern?","ar":"من هو أول جهة اتصال لأي موظف أو طالب أو ولي أمر لديه مخاوف تتعلق بالحماية؟"},"opts":[{"en":"The Designated Safeguarding Lead (or a deputy DSL)","ar":"مسؤول حماية الطفل المعيّن (DSL) أو أحد نوابه"},{"en":"The student's class teacher only","ar":"معلم صف الطالب فقط"},{"en":"The school receptionist","ar":"موظف الاستقبال في المدرسة"},{"en":"The relevant Head of Department","ar":"رئيس القسم المعني"}],"correct":0,"expl":{"en":"The DSL is the first point of contact. Deputy DSLs are trained to the same Level 3 standard and act in the DSL's absence, and at least one is available whenever the school is in session.","ar":"مسؤول الحماية هو أول جهة اتصال. ونوابه مدرّبون على المستوى الثالث نفسه ويقومون مقامه في غيابه، ويتوافر واحد منهم على الأقل طوال وقت الدوام المدرسي."}},{"id":"m3q2","q":{"en":"By when must a member of staff report a safeguarding concern to the DSL?","ar":"في أي موعد يجب على الموظف إبلاغ مسؤول الحماية بأي مخاوف تتعلق بالحماية؟"},"opts":[{"en":"At the end of the week, once more evidence has been gathered","ar":"في نهاية الأسبوع بعد جمع مزيد من الأدلة"},{"en":"As soon as possible, and always on the same day the concern arises","ar":"في أسرع وقت ممكن، ودائمًا في اليوم نفسه الذي ينشأ فيه القلق"},{"en":"Within a month, at the next staff meeting","ar":"خلال شهر، في اجتماع الموظفين القادم"},{"en":"Only after speaking to the child's parents first","ar":"فقط بعد التحدث إلى والدي الطفل أولًا"}],"correct":1,"expl":{"en":"Delay can leave a child at risk. Concerns are reported on the same day, and staff never wait to gather more evidence or to speak to parents first.","ar":"قد يعرّض التأخير الطفل للخطر. تُرفع المخاوف في اليوم نفسه، ولا ينتظر الموظفون جمع مزيد من الأدلة ولا التحدث إلى الأهل أولًا."}},{"id":"m3q3","q":{"en":"Once you have raised a concern, whose responsibility is it to decide what happens next?","ar":"بعد أن ترفع مخاوفك، على من تقع مسؤولية تقرير ما سيحدث بعد ذلك؟"},"opts":[{"en":"The member of staff who noticed the concern","ar":"الموظف الذي لاحظ القلق"},{"en":"The child's friends, who know the situation best","ar":"أصدقاء الطفل الذين يعرفون الوضع أفضل من غيرهم"},{"en":"The Designated Safeguarding Lead, not the member of staff who noticed the concern","ar":"مسؤول حماية الطفل المعيّن، وليس الموظف الذي لاحظ القلق"},{"en":"Nobody; the concern is simply filed away","ar":"لا أحد؛ يُحفظ البلاغ ببساطة في الملف"}],"correct":2,"expl":{"en":"You raise the concern; the DSL assesses it and decides on the response. Never investigate, promise confidentiality or act independently.","ar":"دورك أن ترفع القلق؛ ثم يقيّمه مسؤول الحماية ويقرر الاستجابة. لا تحقّق بنفسك ولا تَعِد بالسرية ولا تتصرف بشكل مستقل."}}]},{"id":"m4","title":{"en":"Recognising Abuse: The Four Categories and Beyond","ar":"التعرّف إلى الإساءة: الفئات الأربع وما بعدها"},"minutes":25,"blocks":[{"t":"p","c":{"en":"There are four recognised categories of abuse. A child may experience one or more than one type at the same time.","ar":"هناك أربع فئات معترف بها للإساءة. وقد يتعرض الطفل لنوع واحد أو لأكثر من نوع في الوقت نفسه."}},{"t":"table","head":{"en":["Category","Definition in the PEPS policy","Examples of what you might notice"],"ar":["الفئة","التعريف في سياسة المدرسة","أمثلة على ما قد تلاحظه"]},"rows":[{"en":["Physical abuse","Causing physical harm or injury to a child, or failing to prevent physical harm or suffering. It may involve hitting, shaking, throwing, poisoning or burning.","Unexplained injuries, bruises in unusual places, flinching, covering the body in hot weather, fear of going home."],"ar":["الإساءة الجسدية","إلحاق أذى جسدي أو إصابة بالطفل، أو عدم منع الأذى أو المعاناة الجسدية. وقد تشمل الضرب أو الهزّ أو الرمي أو التسميم أو الحرق.","إصابات غير مفسَّرة، وكدمات في أماكن غير معتادة، وانكماش عند الاقتراب، وتغطية الجسم في الطقس الحار، والخوف من العودة إلى المنزل."]},{"en":["Emotional abuse","Persistent emotional maltreatment causing severe and lasting harm to emotional development, such as conveying that a child is worthless, unloved or inadequate, or exposing them to serious bullying, isolation or humiliation.","Very low self-esteem, anxiety, sudden withdrawal, extremes of behaviour."],"ar":["الإساءة العاطفية","سوء معاملة عاطفية مستمر يسبب آثارًا سلبية شديدة ومستمرة في النمو العاطفي، كإشعار الطفل بأنه عديم القيمة أو غير محبوب أو غير كفء، أو تعريضه للتنمّر الجسيم أو العزلة أو الإذلال.","تدنٍّ شديد في تقدير الذات، وقلق، وانسحاب مفاجئ، وتطرّف في السلوك."]},{"en":["Sexual abuse","Forcing or enticing a child to take part in sexual activities, whether or not the child is aware of what is happening. It includes contact and non-contact activities, such as involving a child in looking at, or in the production of, sexual images.","Sexual knowledge or behaviour unusual for the child's age, secrecy about online contact, reluctance to be with a particular adult."],"ar":["الإساءة الجنسية","إجبار الطفل أو استدراجه للمشاركة في أنشطة جنسية، سواء أدرك ما يحدث أم لم يدرك. وتشمل الأنشطة التي تتضمن اتصالًا جسديًا وغير الجسدية، كإشراك الطفل في مشاهدة صور جنسية أو إنتاجها.","معرفة أو سلوك جنسي لا يناسب عمر الطفل، وكتمان بشأن التواصل عبر الإنترنت، وتردد في البقاء مع شخص بالغ بعينه."]},{"en":["Neglect","The persistent failure to meet a child's basic physical and/or psychological needs, likely to seriously impair health or development, including failure to provide adequate food, shelter, supervision or access to medical care.","Persistently hungry, dirty or inappropriately dressed, frequent absence, untreated medical or dental problems, left unsupervised."],"ar":["الإهمال","الإخفاق المستمر في تلبية احتياجات الطفل الجسدية و/أو النفسية الأساسية بما يُرجَّح أن يضر بصحته أو نموه ضررًا بالغًا، ويشمل عدم توفير الغذاء الكافي أو المأوى أو الإشراف أو الرعاية الطبية.","جوع مستمر، وإهمال النظافة أو ارتداء ملابس غير مناسبة، وغياب متكرر، ومشكلات طبية أو سنية دون علاج، وتُرك دون إشراف."]}]},{"t":"p","c":{"en":"\u003cem>The examples in the right-hand column are illustrations only. A sign is a reason to look closer and to report, not proof. The next CPD in this series, “Recognising Signs of Abuse and Neglect”, explores indicators in depth.\u003c/em>","ar":"\u003cem>الأمثلة في العمود الأخير توضيحية فقط. العلامة سبب للتدقيق والإبلاغ وليست دليلًا قاطعًا. وتتناول الوحدة المهنية التالية في هذه السلسلة، «التعرّف إلى علامات الإساءة والإهمال»، المؤشرات بتعمّق.\u003c/em>"}},{"t":"callout","k":"key","title":{"en":"You do not need to be certain","ar":"لا يلزم أن تكون متأكدًا"},"c":{"en":"Staff do not need to be certain that abuse is taking place before raising a concern. Report all concerns, however minor they may seem. The responsibility for deciding what happens next sits with the DSL, not with the member of staff who noticed the concern.","ar":"لا يلزم أن يكون الموظف متأكدًا من وقوع الإساءة قبل أن يرفع مخاوفه. أبلغ عن جميع المخاوف مهما بدت بسيطة. فمسؤولية تقرير ما يحدث بعد ذلك تقع على مسؤول الحماية وليس على الموظف الذي لاحظ القلق."}},{"t":"h","c":{"en":"Peer-on-peer abuse","ar":"الإساءة بين الأقران"}},{"t":"p","c":{"en":"Children can, and do, abuse other children. This can take many forms, including bullying (including online bullying), physical abuse, sexual violence and sexual harassment, and gender-based violence.","ar":"يمكن للأطفال أن يسيئوا إلى أطفال آخرين، وهذا يحدث فعلًا. ويتخذ ذلك أشكالًا عديدة، منها التنمّر (بما فيه التنمّر الإلكتروني) والإساءة الجسدية والعنف الجنسي والتحرش الجنسي والعنف القائم على النوع الاجتماعي."}},{"t":"callout","k":"warn","title":{"en":"Never “just banter”","ar":"ليس «مجرد مزاح» أبدًا"},"c":{"en":"Abusive behaviour by one child towards another is never acceptable and will never be dismissed as “banter”, “part of growing up” or a normal part of a relationship. It is treated with the same seriousness as abuse by an adult, under this policy together with the Anti-Bullying Policy and the Behaviour & Discipline Policy.","ar":"السلوك المسيء من طفل تجاه آخر غير مقبول أبدًا، ولن يُستهان به بوصفه «مزاحًا» أو «جزءًا من النمو» أو جزءًا طبيعيًا من العلاقات. ويُعامل بالجدية نفسها كالإساءة من شخص بالغ، بموجب هذه السياسة إلى جانب سياسة مكافحة التنمّر وسياسة السلوك والانضباط."}},{"t":"h","c":{"en":"Other safeguarding concerns","ar":"مخاوف أخرى تتعلق بالحماية"}},{"t":"p","c":{"en":"Beyond the four categories, staff must also be alert to these concerns. Each is raised with the DSL in the same way as any other.","ar":"إلى جانب الفئات الأربع، يجب على الموظفين الانتباه إلى المخاوف التالية أيضًا. وتُرفع كل منها إلى مسؤول الحماية بالطريقة نفسها كأي قلق آخر."}},{"t":"list","c":{"en":["Online safety risks","Radicalisation and exposure to extremist views","Forced marriage","Female genital mutilation","Substance misuse","Self-harm","Children missing education"],"ar":["مخاطر السلامة الرقمية","التطرف والتعرّض للأفكار المتطرفة","الزواج القسري","ختان الإناث","تعاطي المواد المؤذية","إيذاء النفس","الأطفال المنقطعون عن التعليم"]}},{"t":"scenario","title":{"en":"Case study","ar":"دراسة حالة"},"c":{"en":"A Year 8 student is often hungry, has worn the same unwashed uniform for weeks, complains of toothache that nobody has treated, and says she is usually alone at home until late. No single incident looks serious, but the pattern is persistent.","ar":"طالبة في الصف الثامن تشعر بالجوع كثيرًا، وترتدي الزي المدرسي نفسه دون غسل منذ أسابيع، وتشكو من ألم في أسنانها لم يعالجه أحد، وتقول إنها تبقى وحدها في المنزل حتى وقت متأخر عادةً. لا يبدو أي حدث منفرد خطيرًا، لكن النمط مستمر."}}],"checks":[{"id":"m4q1","q":{"en":"In the case study, which category of abuse does the pattern most closely suggest?","ar":"في دراسة الحالة، أي فئات الإساءة يشير إليها هذا النمط بدرجة أكبر؟"},"opts":[{"en":"Physical abuse: hitting or burning the child","ar":"الإساءة الجسدية: ضرب الطفل أو حرقه"},{"en":"Sexual abuse: involving the child in sexual activity","ar":"الإساءة الجنسية: إشراك الطفل في نشاط جنسي"},{"en":"Peer-on-peer abuse: harm caused by another child","ar":"الإساءة بين الأقران: ضرر يسبّبه طفل آخر"},{"en":"Neglect: a persistent failure to meet the child's basic physical and psychological needs","ar":"الإهمال: إخفاق مستمر في تلبية احتياجات الطفل الجسدية والنفسية الأساسية"}],"correct":3,"expl":{"en":"Neglect is the persistent failure to meet basic needs such as food, shelter, supervision and medical care. A pattern like this should be recorded and reported even though no single event looks serious.","ar":"الإهمال هو الإخفاق المستمر في تلبية الاحتياجات الأساسية كالغذاء والمأوى والإشراف والرعاية الطبية. ويجب تسجيل نمط كهذا والإبلاغ عنه وإن لم يبدُ أي حدث منفرد خطيرًا."}},{"id":"m4q2","q":{"en":"You are unsure whether what you have seen is really abuse. What should you do?","ar":"لست متأكدًا مما إذا كان ما رأيته إساءة حقيقية. ماذا عليك أن تفعل؟"},"opts":[{"en":"Report it to the DSL the same day, because you do not need to be certain before raising a concern","ar":"أبلغ مسؤول الحماية في اليوم نفسه، فلا يلزم أن تكون متأكدًا قبل رفع القلق"},{"en":"Wait until you are completely sure, so you do not cause trouble for the family","ar":"انتظر حتى تتأكد تمامًا كي لا تتسبب في مشكلة للأسرة"},{"en":"Ask the child detailed questions until you can prove what happened","ar":"اطرح على الطفل أسئلة تفصيلية حتى تتمكن من إثبات ما حدث"},{"en":"Ignore it if it seems minor","ar":"تجاهله إذا بدا بسيطًا"}],"correct":0,"expl":{"en":"Staff report all concerns, however minor they may seem. Deciding what happens next is the DSL's responsibility, and investigating yourself could harm the child and any later enquiry.","ar":"يبلّغ الموظفون عن جميع المخاوف مهما بدت بسيطة. وقرار ما يحدث بعدها من مسؤولية مسؤول الحماية، وقد يضر تحقيقك بنفسك بالطفل وبأي تحقيق لاحق."}},{"id":"m4q3","q":{"en":"A student says the teasing, shoving and humiliating messages from a classmate are “just banter”. How does the PEPS policy treat this?","ar":"يقول طالب إن السخرية والدفع والرسائل المهينة من زميل له «مجرد مزاح». كيف تتعامل سياسة المدرسة مع ذلك؟"},"opts":[{"en":"As a normal part of growing up, to be sorted out by the students themselves","ar":"بوصفه جزءًا طبيعيًا من النمو ويتولى الطلبة حلّه بأنفسهم"},{"en":"It is never dismissed as banter. It is treated as seriously as abuse by an adult and raised with the DSL, alongside the Anti-Bullying and Behaviour & Discipline policies","ar":"لا يُستهان به بوصفه مزاحًا. يُعامل بالجدية نفسها كالإساءة من شخص بالغ ويُرفع إلى مسؤول الحماية، بالتوازي مع سياستَي مكافحة التنمّر والسلوك والانضباط"},{"en":"As a behaviour matter only; safeguarding procedures never apply between children","ar":"بوصفه مسألة سلوك فقط؛ فإجراءات الحماية لا تنطبق أبدًا بين الأطفال"},{"en":"As acceptable if the two students seem to be friends","ar":"بوصفه مقبولًا إذا بدا أن الطالبين صديقان"}],"correct":1,"expl":{"en":"Children can and do abuse other children. Peer-on-peer abuse is never dismissed as banter, part of growing up or a normal part of a relationship.","ar":"يمكن للأطفال أن يسيئوا إلى أطفال آخرين، وهذا يحدث فعلًا. ولا يُستهان بالإساءة بين الأقران بوصفها مزاحًا أو جزءًا من النمو أو جزءًا طبيعيًا من العلاقات."}}]},{"id":"m5","title":{"en":"When a Child Tells You","ar":"عندما يُفصح لك الطفل"},"minutes":25,"blocks":[{"t":"p","c":{"en":"Any member of staff may be the person a child chooses to talk to. How you respond in the first few minutes matters enormously, both for the child's trust and for any later enquiry.","ar":"قد يكون أي موظف هو الشخص الذي يختار الطفل أن يتحدث إليه. وتُحدث طريقة استجابتك في الدقائق الأولى فرقًا كبيرًا، سواء لثقة الطفل أو لأي تحقيق لاحق."}},{"t":"h","c":{"en":"Six steps if a child discloses","ar":"ست خطوات إذا أفصح الطفل"}},{"t":"steps","c":{"en":["\u003cstrong>Stay calm\u003c/strong> and listen carefully, without expressing shock or disbelief.","\u003cstrong>Do not promise confidentiality.\u003c/strong> Explain, gently and in an age-appropriate way, that you will need to tell someone whose job it is to help.","\u003cstrong>Do not ask leading questions or investigate.\u003c/strong> Your role is to listen, not to interview the child.","\u003cstrong>Reassure the child\u003c/strong> that they have done the right thing in telling you, and that it is not their fault.","\u003cstrong>Write it down\u003c/strong> as soon as possible afterwards, in the child's own words as far as possible, with the date, time and any names mentioned.","\u003cstrong>Pass it to the DSL the same day.\u003c/strong>"],"ar":["\u003cstrong>حافظ على هدوئك\u003c/strong> وأصغِ باهتمام دون إظهار صدمة أو عدم تصديق.","\u003cstrong>لا تَعِد بالسرية.\u003c/strong> اشرح بلطف وبما يناسب عمر الطفل أنك ستحتاج إلى إخبار شخص وظيفته المساعدة.","\u003cstrong>لا تطرح أسئلة إيحائية ولا تحقّق.\u003c/strong> دورك أن تصغي لا أن تستجوب الطفل.","\u003cstrong>طمئن الطفل\u003c/strong> بأنه فعل الصواب حين أخبرك، وبأن الأمر ليس ذنبه.","\u003cstrong>دوّن ما حدث\u003c/strong> في أقرب وقت ممكن بعد ذلك، بكلمات الطفل نفسها قدر الإمكان، مع التاريخ والوقت وأي أسماء وردت.","\u003cstrong>سلّمه إلى مسؤول الحماية في اليوم نفسه.\u003c/strong>"]}},{"t":"h","c":{"en":"Helpful words and words to avoid","ar":"عبارات مفيدة وعبارات يجب تجنبها"}},{"t":"table","head":{"en":["Helpful","Avoid"],"ar":["مفيد","تجنّب"]},"rows":[{"en":["“Thank you for telling me. You did the right thing.”","“Are you sure? That doesn't sound like something he would do.”"],"ar":["«شكرًا لأنك أخبرتني. لقد فعلت الصواب».","«هل أنت متأكد؟ هذا لا يبدو شيئًا يفعله هو»."]},{"en":["“It is not your fault.”","“Why didn't you tell someone sooner?”"],"ar":["«ليس هذا ذنبك».","«لماذا لم تخبر أحدًا من قبل؟»"]},{"en":["“I can't keep this a secret, because I need to tell someone whose job is to help keep you safe.”","“I promise I won't tell anyone.”"],"ar":["«لا أستطيع أن أبقي هذا سرًّا، لأنني بحاجة إلى إخبار شخص وظيفته مساعدتك على البقاء بأمان».","«أعدك ألّا أخبر أحدًا»."]},{"en":["“I'm listening. Take your time.”","“Did he touch you? Was it your arm or your leg?”"],"ar":["«أنا أصغي إليك. خذ وقتك».","«هل لمسك؟ هل كان ذلك في ذراعك أم ساقك؟»"]}]},{"t":"scenario","title":{"en":"Scenario","ar":"سيناريو"},"c":{"en":"A Year 6 student stays behind after the lesson. Quietly, she says: “My uncle hurts me when Mum is at work. Please promise you won't tell anyone.” Her eyes are full of tears.","ar":"تبقى طالبة في الصف السادس بعد انتهاء الحصة. تقول بصوت خافت: «عمّي يؤذيني عندما تكون أمي في العمل. أرجوك عدني ألّا تخبري أحدًا». وعيناها مليئتان بالدموع."}},{"t":"h","c":{"en":"When a child needs extra support to be understood","ar":"عندما يحتاج الطفل إلى دعم إضافي ليُفهَم"}},{"t":"p","c":{"en":"The DSL coordinates the response where a concern involves a student of determination, an English Language Learner or another student who may need additional support to communicate or be understood, working with the Inclusion Support Team. If a child struggles to explain, stay patient, never put words in their mouth, record exactly what you saw, heard and understood, and pass it to the DSL the same day.","ar":"يتولى مسؤول الحماية تنسيق الاستجابة عندما يتعلق القلق بطالب من أصحاب الهمم أو متعلم للغة الإنجليزية أو أي طالب قد يحتاج إلى دعم إضافي ليتواصل أو يُفهَم، بالتعاون مع فريق الدعم الشامل. وإذا وجد الطفل صعوبة في التعبير فكن صبورًا، ولا تضع الكلمات على لسانه، وسجّل بدقة ما رأيته وسمعته وفهمته، ثم سلّمه إلى مسؤول الحماية في اليوم نفسه."}},{"t":"callout","k":"tip","title":{"en":"Your note is a record that may matter later","ar":"ملاحظتك سجل قد تكون له أهمية لاحقًا"},"c":{"en":"Records are factual and dated, and they clearly separate what you observed, what was said (in the words used) and any opinion. Do not “tidy up” the child's words.","ar":"السجلات واقعية ومؤرَّخة، وتفصل بوضوح بين ما لاحظته وما قيل (بالكلمات المستخدمة) وأي رأي. لا «تُنمّق» كلمات الطفل."}}],"checks":[{"id":"m5q1","q":{"en":"In the scenario above, the student asks you to promise not to tell anyone. What is the best response?","ar":"في السيناريو أعلاه، تطلب الطالبة منك أن تعديها بألّا تخبري أحدًا. ما أفضل استجابة؟"},"opts":[{"en":"“I promise I won't tell anyone. It will be our secret.”","ar":"«أعدك ألّا أخبر أحدًا. سيبقى هذا سرًّا بيننا»."},{"en":"“Are you sure? Your uncle seems like such a kind man.”","ar":"«هل أنتِ متأكدة؟ يبدو عمّكِ رجلًا لطيفًا جدًا»."},{"en":"“Thank you for telling me. I can't keep this secret because I need to tell someone whose job is to help keep you safe.”","ar":"«شكرًا لأنك أخبرتني. لا أستطيع أن أبقي هذا سرًّا لأنني بحاجة إلى إخبار شخص وظيفته مساعدتك على البقاء بأمان»."},{"en":"“Let me ask your friends and your uncle what really happened first.”","ar":"«دعيني أسأل صديقاتك وعمّكِ أولًا عمّا حدث فعلًا»."}],"correct":2,"expl":{"en":"You must never promise confidentiality. Explain gently that you need to tell someone whose job is to help, reassure the child that it is not her fault, and pass the concern to the DSL the same day.","ar":"يجب ألّا تَعِد بالسرية أبدًا. اشرح بلطف أنك بحاجة إلى إخبار شخص وظيفته المساعدة، وطمئن الطفلة بأن الأمر ليس ذنبها، وأحِل القلق إلى مسؤول الحماية في اليوم نفسه."}},{"id":"m5q2","q":{"en":"A child has just finished telling you something worrying. Which action is consistent with the policy?","ar":"انتهى طفل للتو من إخبارك بأمر مقلق. أي الإجراءات التالية يتوافق مع السياسة؟"},"opts":[{"en":"Ask detailed questions to establish exactly what happened, so your report is complete","ar":"طرح أسئلة تفصيلية لمعرفة ما حدث بالضبط ليكون تقريرك كاملًا"},{"en":"Reassure the child by promising to keep everything between the two of you","ar":"طمأنة الطفل بوعده بأن يبقى كل شيء بينكما"},{"en":"Show how shocked you are so the child sees you take it seriously","ar":"إظهار مدى صدمتك ليرى الطفل أنك تأخذ الأمر بجدية"},{"en":"Listen calmly, avoid leading questions and let the child say it in their own words","ar":"الإصغاء بهدوء وتجنّب الأسئلة الإيحائية وترك الطفل يقول ما لديه بكلماته"}],"correct":3,"expl":{"en":"Your role is to listen, not to interview. Leading questions can distort a child's account and affect any later enquiry. Stay calm, avoid showing shock or disbelief, and never promise confidentiality.","ar":"دورك أن تصغي لا أن تستجوب. فقد تشوّه الأسئلة الإيحائية رواية الطفل وتؤثر في أي تحقيق لاحق. حافظ على هدوئك، وتجنّب إظهار الصدمة أو عدم التصديق، ولا تَعِد بالسرية أبدًا."}},{"id":"m5q3","q":{"en":"After the conversation ends, what should you do?","ar":"بعد انتهاء الحديث، ماذا عليك أن تفعل؟"},"opts":[{"en":"Write down what was said, in the child's own words as far as possible, with the date, time and any names, and pass it to the DSL the same day","ar":"دوّن ما قيل بكلمات الطفل نفسها قدر الإمكان مع التاريخ والوقت وأي أسماء، وسلّمه إلى مسؤول الحماية في اليوم نفسه"},{"en":"Wait a few days to see whether the child raises it again before recording anything","ar":"انتظر أيامًا لترى هل سيعيد الطفل الحديث عنه قبل أن تسجّل شيئًا"},{"en":"Keep a private note and share it only if the child's behaviour gets worse","ar":"احتفظ بملاحظة خاصة ولا تشاركها إلا إذا ساء سلوك الطفل"},{"en":"Discuss it with colleagues in the staffroom to get several opinions","ar":"ناقشه مع الزملاء في غرفة المعلمين لتأخذ آراء متعددة"}],"correct":0,"expl":{"en":"A prompt, factual written record in the child's own words is vital. It goes to the DSL the same day and is never shared casually with other colleagues.","ar":"السجل الكتابي الفوري والواقعي بكلمات الطفل نفسها أمر حيوي. ويُسلَّم إلى مسؤول الحماية في اليوم نفسه ولا يُشارَك عرضًا مع الزملاء الآخرين."}}]},{"id":"m6","title":{"en":"Recording, Reporting and Referral","ar":"التسجيل والإبلاغ والإحالة"},"minutes":25,"blocks":[{"t":"p","c":{"en":"Every concern, however small it may seem, is recorded in writing using the \u003cstrong>Recording a Concern form\u003c/strong> (Appendix C of the policy) and passed to the DSL or a deputy without delay.","ar":"يُسجَّل كل قلق مهما بدا صغيرًا كتابةً باستخدام \u003cstrong>نموذج تسجيل المخاوف\u003c/strong> (الملحق ج من السياسة) ويُسلَّم إلى مسؤول الحماية أو أحد نوابه دون تأخير."}},{"t":"h","c":{"en":"What goes on the form","ar":"ما يتضمنه النموذج"}},{"t":"list","c":{"en":["The student's name and class","The date and time of the concern","Your name and role, and the date you passed it to the DSL","What was observed, said or reported (use the child's own words where possible)","Any immediate action taken","Completed by the DSL or deputy: who received it and when"],"ar":["اسم الطالب وصفه","تاريخ القلق ووقته","اسمك ودورك وتاريخ تسليمه إلى مسؤول الحماية","ما لوحظ أو قيل أو أُبلغ عنه (استخدم كلمات الطفل نفسها حيثما أمكن)","أي إجراء فوري اتُّخذ","يستكمله مسؤول الحماية أو نائبه: من استلمه ومتى"]}},{"t":"h","c":{"en":"What a good record looks like","ar":"كيف يبدو السجل الجيد"}},{"t":"p","c":{"en":"Records are \u003cstrong>factual\u003c/strong> and \u003cstrong>timely\u003c/strong>. They distinguish clearly between what was observed, what was said (in the words used) and any opinion or professional judgement. They are kept securely and confidentially, separate from the student's general school file.","ar":"السجلات \u003cstrong>واقعية\u003c/strong> و\u003cstrong>فورية\u003c/strong>. وتميّز بوضوح بين ما لوحظ وما قيل (بالكلمات المستخدمة) وأي رأي أو تقدير مهني. وتُحفظ بشكل آمن وسري بمعزل عن الملف المدرسي العام للطالب."}},{"t":"table","head":{"en":["Weak record","Strong record"],"ar":["سجل ضعيف","سجل قوي"]},"rows":[{"en":["“Father is clearly violent and the child is terrified.”","“A student in 7B said: ‘Dad hit me with a belt last night.’ I saw a red mark on his forearm. 9:40, Tuesday. I did not ask further questions.”"],"ar":["«الأب عنيف بوضوح والطفل مرعوب».","«قال طالب في 7ب: ‹ضربني أبي بحزام ليلة أمس›. رأيت علامة حمراء على ساعده. الساعة 9:40 يوم الثلاثاء. لم أطرح أسئلة إضافية»."]}]},{"t":"h","c":{"en":"Referral and escalation: six steps","ar":"الإحالة والتصعيد: ست خطوات"}},{"t":"table","head":{"en":["Step","What happens"],"ar":["الخطوة","ماذا يحدث"]},"rows":[{"en":["1. Concern raised","Any member of staff, student, parent or visitor raises a concern with the DSL or a deputy, using the Recording a Concern form where applicable."],"ar":["1. رفع القلق","يرفع أي موظف أو طالب أو ولي أمر أو زائر قلقه إلى مسؤول الحماية أو أحد نوابه، باستخدام نموذج تسجيل المخاوف حيثما انطبق."]},{"en":["2. Initial assessment","The DSL assesses the concern, gathers further relevant information and decides the next step, from in-school monitoring and pastoral support to immediate external referral."],"ar":["2. التقييم الأولي","يقيّم مسؤول الحماية القلق ويجمع المعلومات الإضافية ذات الصلة ويقرر الخطوة التالية، من المتابعة الرعوية داخل المدرسة إلى الإحالة الخارجية الفورية."]},{"en":["3. Internal action","Where school-based support is enough (pastoral care, a wellbeing plan, a conversation with parents), the DSL coordinates it with relevant staff."],"ar":["3. الإجراء الداخلي","عندما يكفي الدعم داخل المدرسة (رعاية رعوية أو خطة رفاه أو حديث مع الأهل) ينسّقه مسؤول الحماية مع الموظفين المعنيين."]},{"en":["4. External referral","Where a child may be suffering, or is likely to suffer, significant harm, a referral is made without delay to the Ministry of Education's Child Protection Unit and/or the Sharjah Child Protection Centre, the Ministry of Interior's Child Protection Centre and/or the Police."],"ar":["4. الإحالة الخارجية","عندما يكون الطفل معرّضًا لضرر جسيم أو يُرجَّح أن يتعرض له، تُجرى الإحالة دون تأخير إلى وحدة حماية الطفل بوزارة التربية والتعليم و/أو مركز حماية الطفل في الشارقة، ومركز حماية الطفل بوزارة الداخلية و/أو الشرطة."]},{"en":["5. Immediate danger","The DSL (or any member of staff, if the DSL is not immediately available) contacts the Police without delay and informs the DSL as soon as possible afterwards."],"ar":["5. الخطر الداهم","يتصل مسؤول الحماية (أو أي موظف إذا تعذّر الوصول إليه فورًا) بالشرطة دون تأخير، ويُبلغ مسؤول الحماية في أقرب وقت ممكن بعد ذلك."]},{"en":["6. Follow-up","The DSL monitors the outcome of any referral, keeps records up to date and makes sure the child continues to receive support at school throughout and after the process."],"ar":["6. المتابعة","يتابع مسؤول الحماية نتيجة أي إحالة ويحدّث السجلات ويضمن استمرار حصول الطفل على الدعم في المدرسة أثناء الإجراءات وبعدها."]}]},{"t":"callout","k":"warn","title":{"en":"Immediate danger: do not wait","ar":"الخطر الداهم: لا تنتظر"},"c":{"en":"If at any point there is a risk of immediate serious harm to a child, contact the Police or the relevant emergency service directly, without waiting for the DSL. Anybody can, and should, make a referral.","ar":"إذا وُجد في أي وقت خطر ضرر جسيم وشيك على الطفل، فاتصل بالشرطة أو بخدمة الطوارئ المعنية مباشرةً دون انتظار مسؤول الحماية. يمكن لأي شخص أن يُحيل، ويجب عليه ذلك."}},{"t":"h","c":{"en":"Key external contacts","ar":"جهات الاتصال الخارجية الرئيسة"}},{"t":"table","head":{"en":["Agency","How to reach them"],"ar":["الجهة","طريقة التواصل"]},"rows":[{"en":["Sharjah Child Protection Centre","\u003cspan class=\"ltr\">800 700\u003c/span> (toll-free, 24 hours)"],"ar":["مركز حماية الطفل في الشارقة","\u003cspan class=\"ltr\">800 700\u003c/span> (مجاني، على مدار 24 ساعة)"]},{"en":["Ministry of Interior, Child Protection Centre","\u003cspan class=\"ltr\">116111\u003c/span>, \u003cspan class=\"ltr\">moi-cpc.ae\u003c/span>, or the “Hemayati” app"],"ar":["وزارة الداخلية، مركز حماية الطفل","\u003cspan class=\"ltr\">116111\u003c/span> أو \u003cspan class=\"ltr\">moi-cpc.ae\u003c/span> أو تطبيق «حمايتي»"]},{"en":["Ministry of Education, Child Protection Unit","\u003cspan class=\"ltr\">80085\u003c/span>, or \u003cspan class=\"ltr\">cpu@moe.gov.ae\u003c/span>"],"ar":["وزارة التربية والتعليم، وحدة حماية الطفل","\u003cspan class=\"ltr\">80085\u003c/span> أو \u003cspan class=\"ltr\">cpu@moe.gov.ae\u003c/span>"]},{"en":["Police (emergency)","\u003cspan class=\"ltr\">999\u003c/span>"],"ar":["الشرطة (الطوارئ)","\u003cspan class=\"ltr\">999\u003c/span>"]}]},{"t":"p","c":{"en":"\u003cem>These contacts come from Appendix E of the 2026–2027 policy, which notes that numbers should be verified periodically against official sources.\u003c/em>","ar":"\u003cem>جهات الاتصال هذه مأخوذة من الملحق (هـ) في سياسة 2026–2027، التي تنص على ضرورة التحقق من الأرقام دوريًا من المصادر الرسمية.\u003c/em>"}}],"checks":[{"id":"m6q1","q":{"en":"Which entry would be best in the “what was observed, said or reported” box of the Recording a Concern form?","ar":"أي إدخال هو الأفضل في خانة «ما لوحظ أو قيل أو أُبلغ عنه» في نموذج تسجيل المخاوف؟"},"opts":[{"en":"I think this child's father is clearly a violent man and the family should be reported.","ar":"أعتقد أن والد هذا الطفل رجل عنيف بوضوح وأنه يجب الإبلاغ عن الأسرة."},{"en":"A student in 7B said, “Dad hit me with a belt last night.” I saw a red mark on his forearm. Noted at 9:40 on Tuesday.","ar":"قال طالب في 7ب: «ضربني أبي بحزام ليلة أمس». رأيت علامة حمراء على ساعده. دُوِّن الأمر الساعة 9:40 يوم الثلاثاء."},{"en":"The child seemed upset and probably has problems at home; I will keep an eye on things.","ar":"بدا الطفل منزعجًا وربما يعاني مشكلات في المنزل؛ سأتابع الأمر."},{"en":"Something is wrong in 7B. I will mention it when I next see the DSL.","ar":"ثمة أمر غير طبيعي في 7ب. سأذكره عندما ألتقي مسؤول الحماية."}],"correct":1,"expl":{"en":"Records are factual and timely. They give the child's words as spoken, what you saw and the time, and keep opinion separate from fact.","ar":"السجلات واقعية وفورية. فهي تنقل كلمات الطفل كما قيلت وما رأيته ووقت حدوثه، وتفصل الرأي عن الواقع."}},{"id":"m6q2","q":{"en":"Who normally decides whether a concern is handled through school-based support or referred to an external agency?","ar":"من الذي يقرر عادةً هل يُعالَج القلق عبر الدعم داخل المدرسة أم يُحال إلى جهة خارجية؟"},"opts":[{"en":"The member of staff who first noticed the concern","ar":"الموظف الذي لاحظ القلق أولًا"},{"en":"The student's parents","ar":"والدا الطالب"},{"en":"The DSL, after an initial assessment of the concern","ar":"مسؤول الحماية، بعد تقييم أولي للقلق"},{"en":"The class teacher after discussing it with colleagues","ar":"معلم الصف بعد مناقشته مع الزملاء"}],"correct":2,"expl":{"en":"After the concern is raised, the DSL assesses it, gathers any further relevant information and decides the next step, from in-school support to immediate external referral.","ar":"بعد رفع القلق، يقيّمه مسؤول الحماية ويجمع أي معلومات إضافية ذات صلة ويقرر الخطوة التالية، من الدعم داخل المدرسة إلى الإحالة الخارجية الفورية."}},{"id":"m6q3","q":{"en":"A child is in immediate danger and the DSL cannot be reached. What should you do?","ar":"طفل في خطر داهم وتعذّر الوصول إلى مسؤول الحماية. ماذا عليك أن تفعل؟"},"opts":[{"en":"Wait until the DSL is available, even if that takes hours","ar":"انتظر حتى يتوافر مسؤول الحماية حتى لو استغرق ذلك ساعات"},{"en":"Send an email to the DSL and carry on with the lesson","ar":"أرسل بريدًا إلكترونيًا إلى مسؤول الحماية وواصل الحصة"},{"en":"Ask the child's parents to come to school and decide what to do","ar":"اطلب من والدَي الطفل الحضور إلى المدرسة ليقررا ما يجب فعله"},{"en":"Contact the Police without delay (999) and inform the DSL as soon as possible afterwards","ar":"اتصل بالشرطة دون تأخير (999) وأبلغ مسؤول الحماية في أقرب وقت ممكن بعد ذلك"}],"correct":3,"expl":{"en":"Where there is a risk of immediate serious harm, any member of staff may contact the Police or emergency services directly without waiting for the DSL, and informs the DSL as soon as possible afterwards.","ar":"عند وجود خطر ضرر جسيم وشيك، يمكن لأي موظف الاتصال بالشرطة أو خدمات الطوارئ مباشرةً دون انتظار مسؤول الحماية، ثم يُبلغ مسؤول الحماية في أقرب وقت ممكن."}}]},{"id":"m7","title":{"en":"Confidentiality, Information Sharing and Records","ar":"السرية وتبادل المعلومات والسجلات"},"minutes":15,"blocks":[{"t":"p","c":{"en":"In safeguarding, confidentiality does not mean secrecy. You can never promise a child that you will keep a disclosure secret, but you must protect the information carefully once you have passed it on.","ar":"في الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>، السرية لا تعني الكتمان. لا يجوز أن تَعِد الطفل أبدًا بإبقاء ما أفصح عنه سرًّا، لكن عليك حماية المعلومات بعناية بمجرد تسليمها."}},{"t":"h","c":{"en":"Sharing information","ar":"تبادل المعلومات"}},{"t":"list","c":{"en":["Information about a concern is shared only with those who need to know, on a strict \u003cstrong>need-to-know\u003c/strong> basis.","Staff never discuss a safeguarding case with colleagues who are not involved, with the wider school community, or on social media or other public platforms.","Where sharing information with parents could increase the risk to the child (for example, where a parent is the subject of the concern), the DSL decides, in consultation with the relevant authority where necessary, whether and how parents are informed.","Information is shared with external agencies in line with UAE data protection requirements and only to the extent necessary to protect the child."],"ar":["تُشارَك المعلومات المتعلقة بالقلق فقط مع من يحتاجون إلى معرفتها، وفق مبدأ \u003cstrong>الحاجة إلى المعرفة\u003c/strong> الصارم.","لا يناقش الموظفون أي حالة حماية مع زملاء غير معنيين، ولا مع المجتمع المدرسي الأوسع، ولا على وسائل التواصل الاجتماعي أو المنصات العامة الأخرى.","عندما قد يزيد إطلاع الأهل على المعلومات من خطر تعرّض الطفل للأذى (كأن يكون أحد الوالدين موضوع القلق)، يقرر مسؤول الحماية، بالتشاور مع الجهة المعنية عند الحاجة، هل يُبلَّغ الأهل وكيف.","تُشارَك المعلومات مع الجهات الخارجية وفق متطلبات حماية البيانات في الإمارات وبالقدر اللازم فقط لحماية الطفل."]}},{"t":"h","c":{"en":"Safeguarding records","ar":"سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"}},{"t":"list","c":{"en":["Stored securely, \u003cstrong>separately from the student's general school file\u003c/strong>, with access restricted to the DSL, deputy DSLs and the Principal.","Factual and dated, clearly distinguishing what was observed, what was said (in the words used) and any opinion.","Retained in line with UAE data protection requirements, and transferred securely to the student's next school if they leave PEPS, where this is in the child's best interests.","Personal data about a concern is never disclosed to unauthorised third parties."],"ar":["تُحفظ بشكل آمن \u003cstrong>بمعزل عن الملف المدرسي العام للطالب\u003c/strong>، ويقتصر الاطلاع عليها على مسؤول الحماية ونوابه والمدير.","واقعية ومؤرَّخة، وتميّز بوضوح بين ما لوحظ وما قيل (بالكلمات المستخدمة) وأي رأي.","تُحفظ وفق متطلبات حماية البيانات في الإمارات، وتُنقل بأمان إلى مدرسة الطالب التالية إذا غادر المدرسة، متى كان ذلك في مصلحة الطفل الفضلى.","لا تُكشف البيانات الشخصية المتعلقة بالقلق لأطراف ثالثة غير مصرّح لها."]}},{"t":"scenario","title":{"en":"Scenario","ar":"سيناريو"},"c":{"en":"In the staffroom, a colleague who teaches another year group says: “I heard something happened with a student in your class yesterday. What's going on? Is it true?”","ar":"في غرفة المعلمين، يقول زميل يدرّس صفًا آخر: «سمعت أن أمرًا ما حدث مع طالب في صفك أمس. ماذا يحدث؟ هل هذا صحيح؟»"}}],"checks":[{"id":"m7q1","q":{"en":"Who has access to a student's safeguarding records?","ar":"من يحق له الاطلاع على سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> الخاصة بالطالب؟"},"opts":[{"en":"The DSL, the deputy DSLs and the Principal","ar":"مسؤول الحماية ونوابه والمدير"},{"en":"The student's class teacher and every colleague who has taught the student","ar":"معلم صف الطالب وكل زميل درّسه"},{"en":"Any parent who asks to see them","ar":"أي ولي أمر يطلب الاطلاع عليها"},{"en":"All staff, so that everyone is fully informed","ar":"جميع الموظفين ليكون الجميع على اطلاع كامل"}],"correct":0,"expl":{"en":"Records are kept securely, separately from the general school file, with access restricted to the DSL, deputy DSLs and the Principal.","ar":"تُحفظ السجلات بشكل آمن ومنفصل عن الملف المدرسي العام، ويقتصر الاطلاع عليها على مسؤول الحماية ونوابه والمدير."}},{"id":"m7q2","q":{"en":"How should you respond to the colleague in the staffroom scenario?","ar":"كيف تردّ على الزميل في سيناريو غرفة المعلمين؟"},"opts":[{"en":"Share a few details, since they are a fellow teacher and will keep it private","ar":"شاركه بعض التفاصيل لأنه زميل معلم وسيحافظ على الخصوصية"},{"en":"Politely decline to discuss it: safeguarding information is shared only with those who need to know","ar":"اعتذر بلطف عن مناقشته: فمعلومات الحماية لا تُشارَك إلا مع من يحتاجون إلى معرفتها"},{"en":"Tell them what the child said so they can look out for the student","ar":"أخبره بما قاله الطفل ليراعي الطالب"},{"en":"Post a general note in the staff group chat so everyone is aware","ar":"انشر ملاحظة عامة في مجموعة الموظفين ليعلم الجميع"}],"correct":1,"expl":{"en":"Never discuss a safeguarding case with colleagues who are not involved, with the wider community or on social media. Strict need-to-know protects the child and the integrity of any enquiry.","ar":"لا تناقش أي حالة حماية مع زملاء غير معنيين أو مع المجتمع الأوسع أو على وسائل التواصل الاجتماعي. فالالتزام الصارم بمبدأ الحاجة إلى المعرفة يحمي الطفل ونزاهة أي تحقيق."}},{"id":"m7q3","q":{"en":"A parent is the subject of a safeguarding concern. Who decides whether and how parents are informed?","ar":"ولي الأمر هو موضوع قلق يتعلق بالحماية. من يقرر هل يُبلَّغ الأهل وكيف؟"},"opts":[{"en":"The class teacher, who should always call the parents first","ar":"معلم الصف، الذي عليه دائمًا الاتصال بالأهل أولًا"},{"en":"The student, who decides whom to tell","ar":"الطالب، الذي يقرر لمن يخبر"},{"en":"The DSL, in consultation with the relevant authority where necessary","ar":"مسؤول الحماية، بالتشاور مع الجهة المعنية عند الحاجة"},{"en":"The member of staff who first noticed the concern","ar":"الموظف الذي لاحظ القلق أولًا"}],"correct":2,"expl":{"en":"Telling parents can sometimes increase the risk to a child. That is why the DSL decides whether and how parents are informed, and why you should not contact the family yourself.","ar":"قد يزيد إبلاغ الأهل أحيانًا من الخطر على الطفل. ولهذا يقرر مسؤول الحماية هل يُبلَّغ الأهل وكيف، ولهذا لا ينبغي أن تتصل بالأسرة بنفسك."}}]},{"id":"m8","title":{"en":"Allegations Against Adults, Safer Recruitment and Off-Site Activities","ar":"الادعاءات ضد البالغين والتوظيف الآمن والأنشطة خارج المدرسة"},"minutes":20,"blocks":[{"t":"p","c":{"en":"Keeping children safe also means taking seriously the possibility that an adult connected to the school may cause harm, and having robust systems to prevent it.","ar":"الحفاظ على سلامة الأطفال يعني أيضًا أخذ احتمال أن يتسبب شخص بالغ مرتبط بالمدرسة في أذى على محمل الجد، ووجود أنظمة متينة لمنع ذلك."}},{"t":"h","c":{"en":"Allegations against staff, volunteers or contractors","ar":"الادعاءات ضد الموظفين أو المتطوعين أو المتعاقدين"}},{"t":"p","c":{"en":"Any allegation that a member of staff, volunteer, contractor or agency worker may have behaved in a way that has harmed, or may harm, a child is taken extremely seriously. It is managed separately from the general referral procedure so that both the child and the adult are treated fairly.","ar":"يُؤخذ أي ادعاء بأن موظفًا أو متطوعًا أو متعاقدًا أو عاملًا من وكالة قد تصرّف بطريقة أضرّت بطفل أو قد تضرّ به على محمل الجد الشديد. ويُدار بمعزل عن إجراء الإحالة العام ليُعامَل الطفل والبالغ معاملة عادلة."}},{"t":"steps","c":{"en":["Report it \u003cstrong>immediately to the Principal\u003c/strong>, who acts as case manager. If the allegation concerns the Principal, report it to the \u003cstrong>Chair of the Governing Body\u003c/strong>.","The case manager considers without delay whether a child may be suffering, or is likely to suffer, significant harm. If so, a referral is made immediately to the relevant authority and/or the Police, in parallel with any internal process.","Interim measures may be considered to protect students, such as adjusting duties or, in serious cases, suspension. \u003cstrong>Suspension is not, in itself, an indication of guilt.\u003c/strong>","The adult concerned is told the nature of the allegation as far as this does not compromise the child's safety or the enquiry, and is treated fairly and supportively under the school's HR and disciplinary procedures.","A confidential record is kept, stating whether the allegation was substantiated, unsubstantiated, unfounded or malicious."],"ar":["أبلغ \u003cstrong>مدير المدرسة فورًا\u003c/strong>، فهو يتولى إدارة الحالة. وإذا تعلّق الادعاء بالمدير فأبلغ \u003cstrong>رئيس مجلس الإدارة\u003c/strong>.","ينظر مدير الحالة دون تأخير فيما إذا كان الطفل يعاني أو يُرجَّح أن يعاني من ضرر جسيم. وفي هذه الحالة تُجرى الإحالة فورًا إلى الجهة المعنية و/أو الشرطة بالتوازي مع أي إجراء داخلي.","قد تُدرس تدابير مؤقتة لحماية الطلبة، كتعديل المهام أو الإيقاف عن العمل في الحالات الخطيرة. \u003cstrong>والإيقاف عن العمل ليس في حد ذاته دليلًا على الإدانة.\u003c/strong>","يُبلَّغ الشخص المعني بطبيعة الادعاء بقدر ما لا يضر بسلامة الطفل أو بالتحقيق، ويُعامل بإنصاف ودعم وفق إجراءات الموارد البشرية والإجراءات التأديبية في المدرسة.","يُحتفظ بسجل سري يبيّن هل كان الادعاء مثبتًا أم غير مثبت أم لا أساس له أم كيديًا."]}},{"t":"callout","k":"key","title":{"en":"A concern raised in good faith is always protected","ar":"القلق المرفوع بحسن نية محمي دائمًا"},"c":{"en":"Where an allegation is found to be malicious, the school considers what disciplinary action may be appropriate. However, a genuine concern raised in good faith that later proves unfounded is \u003cstrong>never\u003c/strong> treated as malicious.","ar":"إذا تبيّن أن الادعاء كيدي، تنظر المدرسة في الإجراء التأديبي المناسب. أما القلق الحقيقي المرفوع بحسن نية والذي يتبيّن لاحقًا أنه لا أساس له فلا يُعامَل \u003cstrong>أبدًا\u003c/strong> على أنه كيدي."}},{"t":"callout","k":"warn","title":{"en":"Do not confront or investigate","ar":"لا تواجه ولا تحقّق"},"c":{"en":"If you are worried about a colleague's behaviour towards a student, do not confront the colleague, investigate, or discuss it with others. Report it at once to the Principal (or the Chair of the Governing Body if it concerns the Principal).","ar":"إذا ساورك قلق من سلوك زميل تجاه طالب، فلا تواجه الزميل ولا تحقّق ولا تناقش الأمر مع الآخرين. أبلغ المدير فورًا (أو رئيس مجلس الإدارة إذا تعلّق الأمر بالمدير)."}},{"t":"h","c":{"en":"Safer recruitment","ar":"التوظيف الآمن"}},{"t":"list","c":{"en":["Job advertisements and interviews make clear the school's commitment to safeguarding.","Identity, right to work and relevant qualifications are verified before appointment.","At least two references are obtained, including where possible from the most recent employer working with children, and followed up directly.","A police clearance certificate (or equivalent from the country of residence and any prior country of residence) is obtained before, or as a condition of, appointment.","Gaps in employment history are explored and satisfactorily explained.","All new staff receive Level 1 induction covering the policy, the Staff Code of Conduct and how to raise a concern.","A single central record of checks is kept by HR and the DSL and is available for inspection by SPEA."],"ar":["تُبيّن إعلانات الوظائف والمقابلات التزام المدرسة بالصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>.","يُتحقَّق من الهوية وحق العمل والمؤهلات ذات الصلة قبل التعيين.","يُحصل على مرجعين على الأقل، ومنهما حيثما أمكن آخر جهة عمل تعامل فيها المرشح مع الأطفال، ويُتابَعان مباشرةً.","يُحصل على شهادة حسن سيرة وسلوك (أو ما يعادلها من بلد الإقامة وأي بلد إقامة سابق) قبل التعيين أو شرطًا له.","تُستقصى الفجوات في السجل الوظيفي ويُحصل على تفسير مُرضٍ لها.","يتلقى جميع الموظفين الجدد التدريب التعريفي (المستوى الأول) الذي يشمل السياسة وميثاق سلوك الموظفين وكيفية رفع المخاوف.","يحتفظ قسم الموارد البشرية ومسؤول الحماية بسجل مركزي موحّد للفحوص متاح لتفتيش هيئة SPEA."]}},{"t":"h","c":{"en":"Trips, acti
