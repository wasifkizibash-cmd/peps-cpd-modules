vities and transport","ar":"الرحلات والأنشطة والنقل"}},{"t":"list","c":{"en":["The policy applies in full to all off-site activities (field trips, sports fixtures, the international trip) and to the school bus service.","\u003cstrong>A named member of staff with Level 2 safeguarding training accompanies every off-site trip\u003c/strong> and can contact a deputy DSL at all times.","Risk assessments, including supervision ratios, are completed and approved in advance in line with the Health & Safety Policy.","Bus supervisors and drivers go through the same safer recruitment checks as staff and receive Level 1 safeguarding training."],"ar":["تسري السياسة بالكامل على جميع الأنشطة خارج المدرسة (الرحلات الميدانية والمباريات الرياضية والرحلة الدولية) وعلى خدمة الحافلات المدرسية.","\u003cstrong>يرافق كل رحلة خارج المدرسة موظف محدد حاصل على تدريب الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> (المستوى الثاني)\u003c/strong> ويستطيع التواصل مع أحد نواب مسؤول الحماية في كل وقت.","تُنجز تقييمات المخاطر، بما فيها نسب الإشراف، وتُعتمد مسبقًا وفق سياسة الصحة والسلامة.","يخضع مشرفو الحافلات والسائقون لفحوص التوظيف الآمن نفسها التي يخضع لها الموظفون ويتلقون تدريب الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> (المستوى الأول)."]}}],"checks":[{"id":"m8q1","q":{"en":"You are worried about how a colleague has been behaving towards a student. Whom do you report this to?","ar":"ساورك قلق بشأن سلوك زميل تجاه طالب. إلى من تُبلّغ؟"},"opts":[{"en":"The colleague directly, to give them a chance to explain first","ar":"الزميل مباشرةً لمنحه فرصة للتوضيح أولًا"},{"en":"The student's parents, so that they can decide what to do","ar":"والدا الطالب ليقررا ما يجب فعله"},{"en":"Nobody, until you have collected proof yourself","ar":"لا أحد، حتى تجمع الدليل بنفسك"},{"en":"The Principal, who acts as case manager (or the Chair of the Governing Body if the concern is about the Principal)","ar":"مدير المدرسة الذي يتولى إدارة الحالة (أو رئيس مجلس الإدارة إذا كان القلق بشأن المدير)"}],"correct":3,"expl":{"en":"Allegations against staff go immediately to the Principal as case manager, or to the Chair of the Governing Body if the Principal is the subject. Never confront the colleague or investigate yourself.","ar":"تُرفع الادعاءات ضد الموظفين فورًا إلى المدير بصفته مدير الحالة، أو إلى رئيس مجلس الإدارة إذا كان المدير هو المعني. لا تواجه الزميل ولا تحقّق بنفسك."}},{"id":"m8q2","q":{"en":"A member of staff is suspended while an allegation is looked into. What does the policy say about suspension?","ar":"أُوقف موظف عن العمل أثناء النظر في ادعاء. ماذا تقول السياسة عن الإيقاف عن العمل؟"},"opts":[{"en":"It is a protective interim measure and is not, in itself, an indication of guilt","ar":"هو تدبير مؤقت وقائي وليس في حد ذاته دليلًا على الإدانة"},{"en":"It means the allegation has been proved","ar":"يعني أن الادعاء قد ثبت"},{"en":"It is automatic as soon as any allegation is made","ar":"يحدث تلقائيًا بمجرد تقديم أي ادعاء"},{"en":"It is a punishment applied after the enquiry has ended","ar":"هو عقوبة تُطبّق بعد انتهاء التحقيق"}],"correct":0,"expl":{"en":"Interim measures such as adjusting duties or suspension protect students while the matter is looked into. Suspension is not, in itself, an indication of guilt.","ar":"تحمي التدابير المؤقتة كتعديل المهام أو الإيقاف الطلبة أثناء النظر في الأمر. والإيقاف ليس في حد ذاته دليلًا على الإدانة."}},{"id":"m8q3","q":{"en":"You raised a genuine concern in good faith, but after the enquiry it proves unfounded. How is it treated?","ar":"رفعتَ قلقًا حقيقيًا بحسن نية، لكن تبيّن بعد التحقيق أنه لا أساس له. كيف يُعامل؟"},"opts":[{"en":"It is treated as malicious because it was not proved","ar":"يُعامل على أنه كيدي لأنه لم يثبت"},{"en":"It is never treated as malicious; only an allegation found to be malicious may lead to disciplinary consideration","ar":"لا يُعامل أبدًا على أنه كيدي؛ فالادعاء الكيدي وحده قد يستدعي النظر في إجراء تأديبي"},{"en":"You will normally face disciplinary action for raising it","ar":"ستواجه عادةً إجراءً تأديبيًا لرفعه"},{"en":"It is deleted, and you are told never to raise a similar concern again","ar":"يُحذف، ويُطلب منك ألّا ترفع قلقًا مماثلًا مرة أخرى"}],"correct":1,"expl":{"en":"The policy protects genuine concerns raised in good faith. Staff should never hold back a concern for fear that it might prove unfounded.","ar":"تحمي السياسة المخاوف الحقيقية المرفوعة بحسن نية. ولا ينبغي للموظفين أن يحجموا عن رفع قلق خوفًا من أن يتبيّن أنه لا أساس له."}}]},{"id":"m9","title":{"en":"Training, Partnerships and Putting It All Together","ar":"التدريب والشراكات وربط كل ما تعلمته"},"minutes":15,"blocks":[{"t":"h","c":{"en":"The three-tier training framework","ar":"إطار التدريب ثلاثي المستويات"}},{"t":"p","c":{"en":"PEPS matches the depth of safeguarding training to each person's level of contact with, and responsibility for, students.","ar":"تُطابق المدرسة عمق التدريب على الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> مع مستوى تعامل كل شخص مع الطلبة ومسؤوليته عنهم."}},{"t":"table","head":{"en":["Level","Who","Content","Refresher"],"ar":["المستوى","لمن","المحتوى","التجديد"]},"rows":[{"en":["Level 1","All staff, volunteers, contractors and governors with any contact with students","Basic awareness: categories of abuse, the duty to report, knowing the DSL and deputies, how to raise a concern","On induction; refreshed at least annually"],"ar":["المستوى الأول","جميع الموظفين والمتطوعين والمتعاقدين وأعضاء المجلس ممن لهم أي اتصال بالطلبة","الوعي الأساسي: فئات الإساءة وواجب الإبلاغ ومعرفة مسؤول الحماية ونوابه وكيفية رفع المخاوف","عند التعيين؛ ويُجدَّد مرة في السنة على الأقل"]},{"en":["Level 2","Staff with regular or frequent direct contact: all teaching staff, LSAs, bus supervisors, coaches, activity leaders","Deeper understanding of indicators of abuse and neglect, peer-on-peer abuse, online safety risks and the school's reporting and recording procedures","At least every two years"],"ar":["المستوى الثاني","الموظفون ذوو الاتصال المباشر المنتظم أو المتكرر: جميع أعضاء الهيئة التعليمية ومساعدو دعم التعلم ومشرفو الحافلات والمدربون وقادة الأنشطة","فهم أعمق لمؤشرات الإساءة والإهمال والإساءة بين الأقران ومخاطر السلامة الرقمية وإجراءات المدرسة للإبلاغ والتسجيل","مرة كل سنتين على الأقل"]},{"en":["Level 3","The DSL and deputy DSLs","Advanced: UAE child protection legislation, referrals and multi-agency working, allegations against staff, safer recruitment, record-keeping and leading a safeguarding culture","At least every two years"],"ar":["المستوى الثالث","مسؤول الحماية ونوابه","متقدم: تشريعات حماية الطفل في الإمارات والإحالات والعمل مع جهات متعددة والادعاءات ضد الموظفين والتوظيف الآمن وحفظ السجلات وقيادة ثقافة الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>","مرة كل سنتين على الأقل"]}]},{"t":"p","c":{"en":"Training records for all three levels are kept by the DSL and are available for inspection by SPEA. This CPD supports the knowledge expected at Level 1 and builds towards Level 2. Ask the DSL how your completion is recorded in the school's training records.","ar":"يحتفظ مسؤول الحماية بسجلات التدريب للمستويات الثلاثة، وهي متاحة لتفتيش هيئة SPEA. وتدعم هذه الوحدة المعرفة المتوقعة في المستوى الأول وتبني نحو المستوى الثاني. اسأل مسؤول الحماية كيف يُسجَّل إتمامك لها في سجلات التدريب بالمدرسة."}},{"t":"h","c":{"en":"Working with external agencies","ar":"العمل مع الجهات الخارجية"}},{"t":"p","c":{"en":"The DSL is the school's primary point of contact for the Ministry of Education's Child Protection Unit, the Sharjah Child Protection Centre, the Ministry of Interior's Child Protection Centre, the Police and other relevant agencies, and makes sure requests for information or attendance at meetings are answered promptly.","ar":"مسؤول الحماية هو جهة الاتصال الرئيسة للمدرسة مع وحدة حماية الطفل بوزارة التربية والتعليم، ومركز حماية الطفل في الشارقة، ومركز حماية الطفل بوزارة الداخلية، والشرطة، والجهات المعنية الأخرى، ويضمن الاستجابة السريعة لطلبات المعلومات أو الحضور في الاجتماعات."}},{"t":"h","c":{"en":"Online safety is part of safeguarding","ar":"السلامة الرقمية جزء من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"}},{"t":"p","c":{"en":"Online safety is a core part of safeguarding, not a separate subject. Concerns about a student's online activity, exposure to harmful content, cyberbullying or contact from an unknown adult are raised with the DSL in exactly the same way as any other safeguarding concern. The Digital Citizenship Policy sets out the school's approach in full.","ar":"السلامة الرقمية جزء أصيل من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> وليست موضوعًا منفصلًا. وتُرفع المخاوف المتعلقة بنشاط الطالب على الإنترنت أو تعرّضه لمحتوى ضار أو التنمّر الإلكتروني أو تواصل شخص بالغ مجهول معه إلى مسؤول الحماية بالطريقة نفسها تمامًا كأي قلق آخر يتعلق بالحماية. وتبيّن سياسة المواطنة الرقمية نهج المدرسة بالتفصيل."}},{"t":"h","c":{"en":"Policies that work alongside this one","ar":"سياسات تعمل جنبًا إلى جنب مع هذه السياسة"}},{"t":"list","c":{"en":["Behaviour & Discipline Policy","Anti-Bullying Policy","Digital Citizenship Policy","Health & Safety Policy","Inclusion Policy","Whole-School Wellbeing Policy","Candidate Absence Policy (identifying and following up unexplained absence)"],"ar":["سياسة السلوك والانضباط","سياسة مكافحة التنمّر","سياسة المواطنة الرقمية","سياسة الصحة والسلامة","سياسة الدمج والشمول","سياسة الرفاه المدرسي الشامل","سياسة الغياب (تحديد الغياب غير المبرَّر ومتابعته)"]}},{"t":"callout","k":"key","title":{"en":"A simple way to remember your role","ar":"طريقة بسيطة لتتذكر دورك"},"c":{"en":"\u003cstrong>Notice\u003c/strong> signs of harm, however small. \u003cstrong>Listen\u003c/strong> calmly and never promise secrecy. \u003cstrong>Record\u003c/strong> the facts in the child's own words. \u003cstrong>Report\u003c/strong> to the DSL the same day (or to the Police if a child is in immediate danger). \u003cstrong>Respect\u003c/strong> confidentiality on a need-to-know basis.","ar":"\u003cstrong>لاحظ\u003c/strong> علامات الأذى مهما كانت صغيرة. \u003cstrong>أصغِ\u003c/strong> بهدوء ولا تَعِد بالسرية أبدًا. \u003cstrong>سجّل\u003c/strong> الوقائع بكلمات الطفل نفسها. \u003cstrong>أبلغ\u003c/strong> مسؤول الحماية في اليوم نفسه (أو الشرطة إذا كان الطفل في خطر داهم). \u003cstrong>احترم\u003c/strong> السرية وفق مبدأ الحاجة إلى المعرفة."}},{"t":"p","c":{"en":"You have now completed all nine modules. When you are ready, move on to the Final Assessment.","ar":"لقد أتممت الآن الوحدات التسع جميعها. وعندما تكون مستعدًا، انتقل إلى التقييم النهائي."}}],"checks":[{"id":"m9q1","q":{"en":"Level 2 safeguarding training is designed for which group?","ar":"لأي فئة صُمّم التدريب على الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المستوى الثاني؟"},"opts":[{"en":"Only the DSL and deputy DSLs","ar":"مسؤول الحماية ونوابه فقط"},{"en":"Only visitors who come to the school once","ar":"الزوار الذين يأتون إلى المدرسة مرة واحدة فقط"},{"en":"Staff with regular or frequent direct contact with students, such as teaching staff, LSAs, bus supervisors, coaches and activity leaders","ar":"الموظفون ذوو الاتصال المباشر المنتظم أو المتكرر بالطلبة، مثل الهيئة التعليمية ومساعدي دعم التعلم ومشرفي الحافلات والمدربين وقادة الأنشطة"},{"en":"Only members of the Governing Body","ar":"أعضاء مجلس الإدارة فقط"}],"correct":2,"expl":{"en":"Level 2 builds on Level 1 for staff who regularly work with students, covering indicators of abuse, peer-on-peer abuse, online risks and the school's procedures. The DSL and deputies are trained to Level 3.","ar":"يبني المستوى الثاني على المستوى الأول للموظفين الذين يعملون مع الطلبة بانتظام، ويغطي مؤشرات الإساءة والإساءة بين الأقران والمخاطر الرقمية وإجراءات المدرسة. أما مسؤول الحماية ونوابه فيُدرَّبون على المستوى الثالث."}},{"id":"m9q2","q":{"en":"A student tells you that an adult they met online keeps messaging them and asks them to keep it secret. How do you raise this?","ar":"يخبرك طالب بأن شخصًا بالغًا تعرّف إليه عبر الإنترنت يراسله باستمرار ويطلب منه أن يبقي الأمر سرًّا. كيف ترفع هذا القلق؟"},"opts":[{"en":"Online safety is a separate IT matter, so report it only to the IT team","ar":"السلامة الرقمية مسألة تقنية منفصلة لذا أبلغ فريق تقنية المعلومات فقط"},{"en":"Ask the student to block the person and treat the matter as closed","ar":"اطلب من الطالب حظر الشخص واعتبر المسألة منتهية"},{"en":"Message the adult yourself to find out who they are","ar":"راسل البالغ بنفسك لتعرف من يكون"},{"en":"As any other safeguarding concern: record it and pass it to the DSL the same day, using the standard procedure","ar":"بوصفه أي قلق آخر يتعلق بالحماية: سجّله وسلّمه إلى مسؤول الحماية في اليوم نفسه وفق الإجراء المعتاد"}],"correct":3,"expl":{"en":"Online safety is a core part of safeguarding. Concerns about harmful content, cyberbullying or contact from an unknown adult follow exactly the same procedure as any other concern.","ar":"السلامة الرقمية جزء أصيل من الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>. وتتبع المخاوف المتعلقة بالمحتوى الضار أو التنمّر الإلكتروني أو تواصل شخص بالغ مجهول الإجراء نفسه تمامًا كأي قلق آخر."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"According to the PEPS statement of intent, what must always remain paramount?","ar":"وفقًا لبيان التزام المدرسة، ما الذي يجب أن يبقى دائمًا الاعتبار الأسمى؟"},"opts":[{"en":"The welfare of the child","ar":"رفاه الطفل"},{"en":"The reputation of the school","ar":"سمعة المدرسة"},{"en":"The convenience of the adults involved","ar":"راحة البالغين المعنيين"},{"en":"The wishes of the family concerned","ar":"رغبات الأسرة المعنية"}],"correct":0},{"id":"e2","mod":2,"q":{"en":"Which body licenses, inspects and monitors PEPS, including its compliance with child protection requirements?","ar":"أي جهة ترخّص لمدرسة PEPS وتفتّشها وترصد التزامها، بما في ذلك التزامها بمتطلبات حماية الطفل؟"},"opts":[{"en":"The school's own parent association","ar":"جمعية أولياء الأمور في المدرسة نفسها"},{"en":"The Sharjah Private Education Authority (SPEA)","ar":"هيئة الشارقة للتعليم الخاص (SPEA)"},{"en":"The school's own Governing Body, with no outside oversight","ar":"مجلس إدارة المدرسة نفسه دون أي رقابة خارجية"},{"en":"The school's insurance provider","ar":"شركة التأمين الخاصة بالمدرسة"}],"correct":1},{"id":"e3","mod":3,"q":{"en":"What is true of the deputy DSLs?","ar":"ما العبارة الصحيحة عن نواب مسؤول الحماية؟"},"opts":[{"en":"They are trained only to Level 1 and can only take messages","ar":"هم مدرَّبون على المستوى الأول فقط ويمكنهم تلقي الرسائل فقط"},{"en":"They may record concerns but may never act on them","ar":"يمكنهم تسجيل المخاوف لكن لا يجوز لهم التصرف بشأنها"},{"en":"They are trained to the same Level 3 standard as the DSL and can carry out the DSL's functions in the DSL's absence","ar":"هم مدرَّبون على المستوى الثالث نفسه الذي يتدرب عليه مسؤول الحماية ويمكنهم أداء مهامه في غيابه"},{"en":"They are needed only during off-site trips","ar":"تقتصر الحاجة إليهم على الرحلات خارج المدرسة"}],"correct":2},{"id":"e4","mod":4,"q":{"en":"Which of the following is included in the definition of sexual abuse?","ar":"أي مما يلي يدخل ضمن تعريف الإساءة الجنسية؟"},"opts":[{"en":"Only physical contact; non-contact activity is never abuse","ar":"الاتصال الجسدي فقط؛ فالنشاط غير الجسدي ليس إساءة أبدًا"},{"en":"Only acts that the child understands to be abusive","ar":"الأفعال التي يدرك الطفل أنها مسيئة فقط"},{"en":"Only acts committed by adults, never by other children","ar":"الأفعال التي يرتكبها البالغون فقط، وليس الأطفال الآخرون أبدًا"},{"en":"Involving a child in looking at, or in the production of, sexual images (a non-contact activity)","ar":"إشراك الطفل في مشاهدة صور جنسية أو إنتاجها (نشاط دون اتصال جسدي)"}],"correct":3},{"id":"e5","mod":4,"q":{"en":"A student is repeatedly told by an adult at home that they are worthless and unloved. Which category does this most closely describe?","ar":"يقال لطالب مرارًا في المنزل إنه عديم القيمة وغير محبوب. أي فئة تصفه بدرجة أكبر؟"},"opts":[{"en":"Emotional abuse","ar":"الإساءة العاطفية"},{"en":"Neglect","ar":"الإهمال"},{"en":"Physical abuse","ar":"الإساءة الجسدية"},{"en":"Sexual abuse","ar":"الإساءة الجنسية"}],"correct":0},{"id":"e6","mod":4,"q":{"en":"Two Year 9 students keep sharing a humiliating image of a classmate. A colleague says, “It's just kids being kids.” What is the right response?","ar":"يتداول طالبان في الصف التاسع صورة مهينة لزميل لهما مرارًا. يقول أحد الزملاء: «هذا مجرد تصرف أطفال». ما الاستجابة الصحيحة؟"},"opts":[{"en":"Agree, because behaviour between students is outside safeguarding","ar":"الموافقة لأن سلوك الطلبة فيما بينهم خارج نطاق الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>"},{"en":"Treat it as possible peer-on-peer abuse: record it and raise it with the DSL the same day","ar":"التعامل معه بوصفه إساءة محتملة بين الأقران: سجّله وارفعه إلى مسؤول الحماية في اليوم نفسه"},{"en":"Wait until the classmate complains for themselves","ar":"الانتظار حتى يشتكي الزميل بنفسه"},{"en":"Ask the students to delete the image and take no further action","ar":"طلب حذف الصورة من الطالبين وعدم اتخاذ أي إجراء آخر"}],"correct":1},{"id":"e7","mod":4,"q":{"en":"Which of the following is listed among the “other safeguarding concerns” that staff must raise with the DSL?","ar":"أي مما يلي مدرج ضمن «المخاوف الأخرى المتعلقة بالحماية» التي يجب على الموظفين رفعها إلى مسؤول الحماية؟"},"opts":[{"en":"A student forgetting their homework","ar":"نسيان طالب لواجبه المنزلي"},{"en":"A student arriving a few minutes late on one occasion","ar":"وصول طالب متأخرًا بضع دقائق مرة واحدة"},{"en":"Radicalisation and exposure to extremist views","ar":"التطرف والتعرّض للأفكار المتطرفة"},{"en":"A student wearing the wrong shoes","ar":"ارتداء طالب حذاءً غير مطابق"}],"correct":2},{"id":"e8","mod":5,"q":{"en":"A child begins to disclose something worrying. Which of these should you do?","ar":"بدأ طفل يُفصح عن أمر مقلق. أي مما يلي عليك فعله؟"},"opts":[{"en":"Ask probing questions to find out exactly who, when and where","ar":"اطرح أسئلة استقصائية لمعرفة من وأين ومتى بالضبط"},{"en":"Promise the child that you will tell nobody","ar":"عِد الطفل بألّا تخبر أحدًا"},{"en":"Tell the child that you need proof before anyone can help","ar":"أخبر الطفل بأنك بحاجة إلى دليل قبل أن يتمكن أحد من المساعدة"},{"en":"Stay calm, listen carefully, and reassure the child that they did the right thing and that it is not their fault","ar":"حافظ على هدوئك وأصغِ باهتمام وطمئن الطفل بأنه فعل الصواب وأن الأمر ليس ذنبه"}],"correct":3},{"id":"e9","mod":5,"q":{"en":"A child says, “You won't tell anyone, will you?” What should you say?","ar":"يقول طفل: «لن تخبر أحدًا، أليس كذلك؟». ماذا عليك أن تقول؟"},"opts":[{"en":"That you can't keep it secret, because you need to tell someone whose job is to help keep them safe","ar":"إنك لا تستطيع إبقاءه سرًّا لأنك بحاجة إلى إخبار شخص وظيفته مساعدته على البقاء بأمان"},{"en":"“No, I promise. It's just between us.”","ar":"«لا، أعدك. سيبقى الأمر بيننا»."},{"en":"“That depends on how serious it turns out to be.”","ar":"«هذا يعتمد على مدى خطورته»."},{"en":"“I'll decide later whether to tell anyone.”","ar":"«سأقرر لاحقًا هل أخبر أحدًا»."}],"correct":0},{"id":"e10","mod":5,"q":{"en":"A student who is still learning English struggles to explain something worrying. What is the best approach?","ar":"طالب ما يزال يتعلم الإنجليزية يجد صعوبة في شرح أمر مقلق. ما أفضل نهج؟"},"opts":[{"en":"Ask a classmate to translate, then question both students in detail","ar":"اطلب من زميل الترجمة ثم استجوب الطالبين بالتفصيل"},{"en":"Listen patiently without putting words in their mouth, record what you saw, heard and understood, and pass it to the DSL the same day","ar":"أصغِ بصبر دون وضع كلمات على لسانه، وسجّل ما رأيته وسمعته وفهمته، وسلّمه إلى مسؤول الحماية في اليوم نفسه"},{"en":"Wait until the student's English improves before acting","ar":"انتظر حتى تتحسن لغته الإنجليزية قبل التصرف"},{"en":"Decide what the student probably meant and record that as fact","ar":"قرر ما قصده الطالب على الأرجح وسجّله بوصفه حقيقة"}],"correct":1},{"id":"e11","mod":6,"q":{"en":"Which details belong on the Recording a Concern form?","ar":"أي بيانات تُدرج في نموذج تسجيل المخاوف؟"},"opts":[{"en":"Only the student's name; the DSL will find out the rest","ar":"اسم الطالب فقط؛ [{"en":"\u003cspan class=\"ltr\">999\u003c/span>","ar":"\u003cspan class=\"ltr\">999\u003c/span>"},{"en":"\u003cspan class=\"ltr\">800 700\u003c/span>","ar":"\u003cspan class=\"ltr\">800 700\u003c/span>"},{"en":"\u003cspan class=\"ltr\">80085\u003c/span>","ar":"\u003cspan class=\"ltr\">80085\u003c/span>"},{"en":"\u003cspan class=\"ltr\">116111\u003c/span>","ar":"\u003cspan class=\"ltr\">116111\u003c/span>"}],"correct":1},{"id":"e15","mod":7,"q":{"en":"Where are safeguarding records kept?","ar":"أين تُحفظ سجلات الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi>؟"},"opts":[{"en":"In the student's general file, where any teacher can read them","ar":"في الملف العام للطالب حيث يمكن لأي معلم قراءتها"},{"en":"On each teacher's personal phone so they are always to hand","ar":"على الهاتف الشخصي لكل معلم لتكون في متناوله دائمًا"},{"en":"Securely, separately from the student's general school file, with access restricted to the DSL, deputy DSLs and the Principal","ar":"بشكل آمن ومنفصل عن الملف المدرسي العام للطالب، مع حصر الاطلاع بمسؤول الحماية ونوابه والمدير"},{"en":"In a staffroom folder so that everyone is informed","ar":"في مجلد بغرفة المعلمين ليكون الجميع على اطلاع"}],"correct":2},{"id":"e16","mod":7,"q":{"en":"Which of these is acceptable when you know about a safeguarding case?","ar":"أي مما يلي مقبول عندما تعلم بحالة تتعلق بالحماية؟"},"opts":[{"en":"Mentioning it in a general social media post without naming the student","ar":"ذكرها في منشور عام على وسائل التواصل الاجتماعي دون ذكر اسم الطالب"},{"en":"Discussing it with other parents to warn them","ar":"مناقشتها مع أولياء أمور آخرين لتحذيرهم"},{"en":"Chatting about it with colleagues who teach other classes","ar":"الحديث عنها مع زملاء يدرّسون صفوفًا أخرى"},{"en":"Sharing it only with those who need to know, through the DSL","ar":"مشاركتها فقط مع من يحتاجون إلى معرفتها، عبر مسؤول الحماية"}],"correct":3},{"id":"e17","mod":8,"q":{"en":"You see a colleague behaving in a way that worries you around a student. What should you do ة إلى شخص محدد إذا كانت الرحلة قصيرة"}],"correct":2},{"id":"e20","mod":9,"q":{"en":"How often must Level 1 safeguarding training be refreshed?","ar":"ما مدى تكرار تجديد التدريب على الصون الشامل \u003cbdi>(Safeguarding)\u003c/bdi> في المستوى الأول؟"},"opts":[{"en":"Only once, at induction","ar":"مرة واحدة فقط عند التعيين"},{"en":"Every five years","ar":"كل خمس سنوات"},{"en":"Only after an incident occurs","ar":"فقط بعد وقوع حادثة"},{"en":"At least annually","ar":"مرة في السنة على الأقل"}],"correct":3}]};

/* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const ARR_N = () => S.lang==='ar' ? '←' : '→';
const ARR_P = () => S.lang==='ar' ? '→' : '←';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li><li>${fill(t.how5)}</li></ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div><div class="c-mod-ar">${META.title.ar}</div></div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
