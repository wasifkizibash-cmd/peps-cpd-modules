#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"nurse-first-aid","code":"NFA","passMark":80,"hours":"1.5 hours","accent":"#C0392B","accentSoft":"#FBE9E7","eyebrow":{"en":"Staff CPD · School Nursing · First Aid","ar":"Staff CPD · School Nursing · First Aid"},"title":{"en":"First Aid in School","ar":"First Aid in School"},"subtitle":{"en":"A self-paced refresher for the school nurse: rapid assessment, bleeding, burns and injuries, choking and resuscitation, sudden illness, accurate documentation, and clear communication with parents and the ambulance crew.","ar":"A self-paced refresher for the school nurse: rapid assessment, bleeding, burns and injuries, choking and resuscitation, sudden illness, accurate documentation, and clear communication with parents and the ambulance crew."},"durationLabel":{"en":"About 1.5 hours, fully self-paced","ar":"About 1.5 hours, fully self-paced"},"standard":{"en":"School nursing practice · First aid and emergency response","ar":"School nursing practice · First aid and emergency response"},"source":{"en":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)","ar":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Your Role, the First-Aid Kit and Rapid Assessment","ar":"Your Role, the First-Aid Kit and Rapid Assessment"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and scope","ar":"Purpose and scope"},"c":{"en":"This CPD refreshes the practical first-aid decisions a school nurse makes in a school of children aged about 5 to 18. By the end you will be able to run a structured primary survey, treat and escalate common injuries and illnesses, document an incident properly and hand over cleanly to the ambulance crew. \u003cstrong>Always follow the child's Individual Healthcare Plan (IHP) and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/strong>","ar":"This CPD refreshes the practical first-aid decisions a school nurse makes in a school of children aged about 5 to 18. By the end you will be able to run a structured primary survey, treat and escalate common injuries and illnesses, document an incident properly and hand over cleanly to the ambulance crew. \u003cstrong>Always follow the child's Individual Healthcare Plan (IHP) and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.\u003c/strong>"}},{"t":"p","c":{"en":"In a school, the nurse is usually the most clinically trained person on site and the person everyone looks for. That brings two responsibilities: giving safe, proportionate care yourself, and making sure the first aiders around you know when to call you and when to call 998. Most incidents are minor, but the same child who has a graze today may have an undiagnosed condition tomorrow, so the habit of a structured assessment matters even when the problem looks trivial.","ar":"In a school, the nurse is usually the most clinically trained person on site and the person everyone looks for. That brings two responsibilities: giving safe, proportionate care yourself, and making sure the first aiders around you know when to call you and when to call 998. Most incidents are minor, but the same child who has a graze today may have an undiagnosed condition tomorrow, so the habit of a structured assessment matters even when the problem looks trivial."}},{"t":"h","c":{"en":"Primary survey: DRABC and ABCDE","ar":"Primary survey: DRABC and ABCDE"}},{"t":"p","c":{"en":"Use whichever framework your training and the school's procedures prefer, but use it every time. \u003cstrong>DRABC\u003c/strong> (Danger, Response, Airway, Breathing, Circulation) is the classic first-aid sequence. \u003cstrong>ABCDE\u003c/strong> (Airway, Breathing, Circulation, Disability, Exposure) extends it for a clinician who is assessing a child who is unwell or injured.","ar":"Use whichever framework your training and the school's procedures prefer, but use it every time. \u003cstrong>DRABC\u003c/strong> (Danger, Response, Airway, Breathing, Circulation) is the classic first-aid sequence. \u003cstrong>ABCDE\u003c/strong> (Airway, Breathing, Circulation, Disability, Exposure) extends it for a clinician who is assessing a child who is unwell or injured."}},{"t":"table","head":{"en":["Step","What you are checking","Typical school example"],"ar":["Step","What you are checking","Typical school example"]},"rows":[{"en":["Danger","Is it safe for you, the child and bystanders?","A child down on a wet corridor, a climbing frame still in use, broken glass"],"ar":["Danger","Is it safe for you, the child and bystanders?","A child down on a wet corridor, a climbing frame still in use, broken glass"]},{"en":["Response / Airway","Does the child respond to voice or touch? Is the airway open and clear?","A child silent after a fall from monkey bars; a child with food in the mouth"],"ar":["Response / Airway","Does the child respond to voice or touch? Is the airway open and clear?","A child silent after a fall from monkey bars; a child with food in the mouth"]},{"en":["Breathing","Rate, effort, noise, colour, ability to speak in sentences","Wheeze and short sentences after PE; noisy breathing after an allergen exposure"],"ar":["Breathing","Rate, effort, noise, colour, ability to speak in sentences","Wheeze and short sentences after PE; noisy breathing after an allergen exposure"]},{"en":["Circulation","Pulse, skin colour and temperature, capillary refill, obvious bleeding","Pale, clammy child after a faint; heavy bleeding from a scalp wound"],"ar":["Circulation","Pulse, skin colour and temperature, capillary refill, obvious bleeding","Pale, clammy child after a faint; heavy bleeding from a scalp wound"]},{"en":["Disability","Alert, responds to voice, responds to pain, unresponsive; pupils; blood glucose where relevant","Drowsy child after a head knock; a known diabetic who is vague and sweaty"],"ar":["Disability","Alert, responds to voice, responds to pain, unresponsive; pupils; blood glucose where relevant","Drowsy child after a head knock; a known diabetic who is vague and sweaty"]},{"en":["Exposure","Look for hidden injuries or rashes while protecting dignity and temperature","Hives spreading under a school shirt; a bruise the child did not mention"],"ar":["Exposure","Look for hidden injuries or rashes while protecting dignity and temperature","Hives spreading under a school shirt; a bruise the child did not mention"]}]},{"t":"callout","k":"tip","title":{"en":"Treat life threats in the order found","ar":"Treat life threats in the order found"},"c":{"en":"Do not move on to the next letter until you have dealt with a problem in the current one. A child who cannot breathe does not need their ankle examined yet. Call for help early: send a named person to phone 998 and to fetch the defibrillator (AED) while you start treatment.","ar":"Do not move on to the next letter until you have dealt with a problem in the current one. A child who cannot breathe does not need their ankle examined yet. Call for help early: send a named person to phone 998 and to fetch the defibrillator (AED) while you start treatment."}},{"t":"h","c":{"en":"The first-aid kit and equipment","ar":"The first-aid kit and equipment"}},{"t":"list","c":{"en":["Check the main kit, the PE bag, trip bags and the playground grab-bag against the school's checklist on a regular, recorded schedule, including expiry dates.","Keep in the clinic and in an agreed accessible location: AED with paediatric pads or mode, pocket mask or face shield, gloves, dressings, burns materials, ice packs, a thermometer, a blood glucose meter and sugar source, and spacers for reliever inhalers.","Check that emergency medication named in IHPs (for example adrenaline auto-injectors and reliever inhalers) is in date, labelled with the child's name and travels with the child on trips.","Make sure staff know where the AED is and that a missing, discharged or expired item is reported the same day to whoever manages stock.","Replace single-use items after every use and record what was used, so the kit is always ready for the next incident."],"ar":["Check the main kit, the PE bag, trip bags and the playground grab-bag against the school's checklist on a regular, recorded schedule, including expiry dates.","Keep in the clinic and in an agreed accessible location: AED with paediatric pads or mode, pocket mask or face shield, gloves, dressings, burns materials, ice packs, a thermometer, a blood glucose meter and sugar source, and spacers for reliever inhalers.","Check that emergency medication named in IHPs (for example adrenaline auto-injectors and reliever inhalers) is in date, labelled with the child's name and travels with the child on trips.","Make sure staff know where the AED is and that a missing, discharged or expired item is reported the same day to whoever manages stock.","Replace single-use items after every use and record what was used, so the kit is always ready for the next incident."]}},{"t":"scenario","title":{"en":"Scenario: the playground fall","ar":"Scenario: the playground fall"},"c":{"en":"At lunch break a Year 3 pupil falls from the climbing frame. A teacher runs to the clinic and says only, \"She's hurt her arm.\" You arrive to find the child sitting up and crying, holding her forearm. \u003cstrong>What should you do first?\u003c/strong> Before touching the arm, check danger (others still on the frame), then confirm she responds and speaks, her airway is clear and her breathing and colour are normal. A crying child is a breathing child, but also ask about her head and neck: did she hit her head, is there neck pain? Only once the primary survey is clear do you turn to the arm, support it in the position found, and decide on a splint, ice and transfer for assessment.","ar":"At lunch break a Year 3 pupil falls from the climbing frame. A teacher runs to the clinic and says only, \"She's hurt her arm.\" You arrive to find the child sitting up and crying, holding her forearm. \u003cstrong>What should you do first?\u003c/strong> Before touching the arm, check danger (others still on the frame), then confirm she responds and speaks, her airway is clear and her breathing and colour are normal. A crying child is a breathing child, but also ask about her head and neck: did she hit her head, is there neck pain? Only once the primary survey is clear do you turn to the arm, support it in the position found, and decide on a splint, ice and transfer for assessment."}},{"t":"callout","k":"warn","title":{"en":"Do not let a distracting injury hide a serious one","ar":"Do not let a distracting injury hide a serious one"},"c":{"en":"A dramatic wound or a screaming child can pull attention away from a quiet airway, breathing or head problem. Complete the primary survey first, then treat the visible injury.","ar":"A dramatic wound or a screaming child can pull attention away from a quiet airway, breathing or head problem. Complete the primary survey first, then treat the visible injury."}}],"checks":[{"id":"m1q1","q":{"en":"You arrive at a child lying motionless on the sports hall floor. What is the correct first action?","ar":"You arrive at a child lying motionless on the sports hall floor. What is the correct first action?"},"opts":[{"en":"Check that the area is safe for you and the child, then check for a response","ar":"Check that the area is safe for you and the child, then check for a response"},{"en":"Begin chest compressions straight away without any checks","ar":"Begin chest compressions straight away without any checks"},{"en":"Move the child onto a bench so that you can assess them better in good light","ar":"Move the child onto a bench so that you can assess them better in good light"},{"en":"Examine the most obvious injury first, then check for responsiveness and breathing","ar":"Examine the most obvious injury first, then check for responsiveness and breathing"}],"correct":0,"expl":{"en":"The sequence starts with Danger, then Response. Making sure the scene is safe protects you, the child and others, and you only start compressions after confirming the child does not respond and is not breathing normally.","ar":"The sequence starts with Danger, then Response. Making sure the scene is safe protects you, the child and others, and you only start compressions after confirming the child does not respond and is not breathing normally."}},{"id":"m1q2","q":{"en":"Which feature distinguishes ABCDE from DRABC?","ar":"Which feature distinguishes ABCDE from DRABC?"},"opts":[{"en":"ABCDE leaves out the airway because it is only checked after glucose and exposure","ar":"ABCDE leaves out the airway because it is only checked after glucose and exposure"},{"en":"ABCDE adds disability (conscious level, glucose) and exposure checks to find hidden problems","ar":"ABCDE adds disability (conscious level, glucose) and exposure checks to find hidden problems"},{"en":"ABCDE can only be used by a doctor in a hospital, never by a nurse working in a school clinic","ar":"ABCDE can only be used by a doctor in a hospital, never by a nurse working in a school clinic"},{"en":"ABCDE starts with checking the pulse and blood pressure before looking at the airway","ar":"ABCDE starts with checking the pulse and blood pressure before looking at the airway"}],"correct":1,"expl":{"en":"ABCDE keeps airway, breathing and circulation and then adds Disability (alertness, pupils, glucose) and Exposure (looking for hidden injury or rash while keeping the child covered and warm).","ar":"ABCDE keeps airway, breathing and circulation and then adds Disability (alertness, pupils, glucose) and Exposure (looking for hidden injury or rash while keeping the child covered and warm)."}},{"id":"m1q3","q":{"en":"During a monthly check you find the paediatric pads for the AED are past their expiry date. What is the best response?","ar":"During a monthly check you find the paediatric pads for the AED are past their expiry date. What is the best response?"},"opts":[{"en":"Leave them in place because an old set is better than nothing and note it for the next audit","ar":"Leave them in place because an old set is better than nothing and note it for the next audit"},{"en":"Wait until the next termly audit and record it then","ar":"Wait until the next termly audit and record it then"},{"en":"Report it the same day, arrange replacement pads and record the action taken","ar":"Report it the same day, arrange replacement pads and record the action taken"},{"en":"Remove the AED so that nobody tries to use faulty equipment, and wait for the termly order","ar":"Remove the AED so that nobody tries to use faulty equipment, and wait for the termly order"}],"correct":2,"expl":{"en":"Out-of-date equipment must be reported and replaced promptly, and the action recorded. Leaving it unreported risks a failed shock in an emergency, and removing the AED leaves the school with no device at all.","ar":"Out-of-date equipment must be reported and replaced promptly, and the action recorded. Leaving it unreported risks a failed shock in an emergency, and removing the AED leaves the school with no device at all."}}]},{"id":"m2","title":{"en":"Bleeding, Wounds, Burns and Nosebleeds","ar":"Bleeding, Wounds, Burns and Nosebleeds"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Cuts, grazes, burns and nosebleeds make up much of a school nurse's day. Your task is to stop bleeding, protect the wound, judge which injuries need onward care, and keep the child calm. Wear gloves for every wound, and treat all blood and body fluids as potentially infectious.","ar":"Cuts, grazes, burns and nosebleeds make up much of a school nurse's day. Your task is to stop bleeding, protect the wound, judge which injuries need onward care, and keep the child calm. Wear gloves for every wound, and treat all blood and body fluids as potentially infectious."}},{"t":"h","c":{"en":"Controlling bleeding","ar":"Controlling bleeding"}},{"t":"steps","c":{"en":["Put on gloves and ask the child (or a helper) to sit or lie down; a child who feels faint should be laid flat.","Apply firm, direct pressure over the wound with a clean pad or dressing, using your gloved hand.","If the child can do so safely, let them hold the pad; raise the injured limb if you do not suspect a fracture.","Keep pressing; do not keep lifting the pad to look. If blood soaks through, add another dressing on top rather than removing the first.","Secure with a firm bandage that is snug but does not cut off circulation, then check the fingers or toes for colour, warmth and feeling.","If bleeding is severe or does not slow with pressure, call 998 and keep treating for shock: lie the child down, keep them warm and reassure."],"ar":["Put on gloves and ask the child (or a helper) to sit or lie down; a child who feels faint should be laid flat.","Apply firm, direct pressure over the wound with a clean pad or dressing, using your gloved hand.","If the child can do so safely, let them hold the pad; raise the injured limb if you do not suspect a fracture.","Keep pressing; do not keep lifting the pad to look. If blood soaks through, add another dressing on top rather than removing the first.","Secure with a firm bandage that is snug but does not cut off circulation, then check the fingers or toes for colour, warmth and feeling.","If bleeding is severe or does not slow with pressure, call 998 and keep treating for shock: lie the child down, keep them warm and reassure."]}},{"t":"callout","k":"warn","title":{"en":"Severe bleeding","ar":"Severe bleeding"},"c":{"en":"Life-threatening bleeding from a limb that cannot be controlled by firm direct pressure may need a tourniquet or haemostatic dressing, but only if you are trained and equipped to use one in line with the school's procedures. Call 998 early, and note the time any such device is applied so you can hand it over.","ar":"Life-threatening bleeding from a limb that cannot be controlled by firm direct pressure may need a tourniquet or haemostatic dressing, but only if you are trained and equipped to use one in line with the school's procedures. Call 998 early, and note the time any such device is applied so you can hand it over."}},{"t":"h","c":{"en":"Wounds and when to escalate","ar":"Wounds and when to escalate"}},{"t":"list","c":{"en":["\u003cstrong>Grazes and minor cuts:\u003c/strong> rinse with clean running water, pat dry, cover with a suitable dressing, and check the child's tetanus protection is on record where your procedures require it.","\u003cstrong>Embedded objects:\u003c/strong> do not pull them out. Pad around the object to support it and prevent movement, then arrange urgent transfer.","\u003cstrong>Deep, gaping or contaminated wounds, bites and wounds on the face or over a joint:\u003c/strong> need medical review, so inform the parents promptly.","\u003cstrong>Scalp wounds\u003c/strong> bleed heavily and look worse than they are, but always ask about the mechanism and assess for head injury (see Module 3).","\u003cstrong>Human or animal bites:\u003c/strong> irrigate, dress, and refer for medical advice the same day; record the incident and follow the school's behaviour or safeguarding procedure where a student bit another."],"ar":["\u003cstrong>Grazes and minor cuts:\u003c/strong> rinse with clean running water, pat dry, cover with a suitable dressing, and check the child's tetanus protection is on record where your procedures require it.","\u003cstrong>Embedded objects:\u003c/strong> do not pull them out. Pad around the object to support it and prevent movement, then arrange urgent transfer.","\u003cstrong>Deep, gaping or contaminated wounds, bites and wounds on the face or over a joint:\u003c/strong> need medical review, so inform the parents promptly.","\u003cstrong>Scalp wounds\u003c/strong> bleed heavily and look worse than they are, but always ask about the mechanism and assess for head injury (see Module 3).","\u003cstrong>Human or animal bites:\u003c/strong> irrigate, dress, and refer for medical advice the same day; record the incident and follow the school's behaviour or safeguarding procedure where a student bit another."]}},{"t":"h","c":{"en":"Burns and scalds","ar":"Burns and scalds"}},{"t":"steps","c":{"en":["Stop the burning process and remove the child from the source.","Cool the burn under cool or lukewarm running water for \u003cstrong>20 minutes\u003c/strong>. Start as soon as possible; cooling is still helpful if delayed.","Take off jewellery, watches and loose clothing near the burn before swelling starts, but do not pull off anything stuck to the skin.","Cover loosely with cling film laid lengthways, or a clean non-fluffy dressing. Do not wrap it circumferentially.","Keep the rest of the child warm, treat pain according to the school's medication policy, and arrange medical assessment as below."],"ar":["Stop the burning process and remove the child from the source.","Cool the burn under cool or lukewarm running water for \u003cstrong>20 minutes\u003c/strong>. Start as soon as possible; cooling is still helpful if delayed.","Take off jewellery, watches and loose clothing near the burn before swelling starts, but do not pull off anything stuck to the skin.","Cover loosely with cling film laid lengthways, or a clean non-fluffy dressing. Do not wrap it circumferentially.","Keep the rest of the child warm, treat pain according to the school's medication policy, and arrange medical assessment as below."]}},{"t":"callout","k":"warn","title":{"en":"Do not","ar":"Do not"},"c":{"en":"Do not apply ice, butter, toothpaste or creams, do not burst blisters, and do not use adhesive dressings on the burn. Do not cool for so long, or with water so cold, that the child becomes chilled, especially a small child with a large scald.","ar":"Do not apply ice, butter, toothpaste or creams, do not burst blisters, and do not use adhesive dressings on the burn. Do not cool for so long, or with water so cold, that the child becomes chilled, especially a small child with a large scald."}},{"t":"list","c":{"en":["\u003cstrong>Call 998 or arrange urgent transfer for:\u003c/strong> burns to the face, airway, hands, feet or genitals; large or deep burns; chemical or electrical burns; burns with breathing difficulty; and any burn in a young child that you are unsure about.","Chemical burns: brush off dry powder first where appropriate, then irrigate with copious running water for longer than 20 minutes and identify the substance; for a laboratory or swimming pool chemical, retrieve the product label for the crew."],"ar":["\u003cstrong>Call 998 or arrange urgent transfer for:\u003c/strong> burns to the face, airway, hands, feet or genitals; large or deep burns; chemical or electrical burns; burns with breathing difficulty; and any burn in a young child that you are unsure about.","Chemical burns: brush off dry powder first where appropriate, then irrigate with copious running water for longer than 20 minutes and identify the substance; for a laboratory or swimming pool chemical, retrieve the product label for the crew."]}},{"t":"h","c":{"en":"Nosebleeds","ar":"Nosebleeds"}},{"t":"list","c":{"en":["Sit the child up, lean \u003cstrong>forward\u003c/strong> and pinch the soft part of the nose, just below the bony bridge, for about 10 minutes without releasing to check.","Ask the child to breathe through the mouth and spit out any blood that collects. Do not tip the head back.","Apply a cool cloth to the back of the neck if the child finds it comforting; avoid nose blowing or picking for several hours.","Seek medical help if bleeding continues beyond 20 minutes of correct pressure, follows a significant blow to the head or face, or if the child is on blood-thinning medication or has a known bleeding disorder."],"ar":["Sit the child up, lean \u003cstrong>forward\u003c/strong> and pinch the soft part of the nose, just below the bony bridge, for about 10 minutes without releasing to check.","Ask the child to breathe through the mouth and spit out any blood that collects. Do not tip the head back.","Apply a cool cloth to the back of the neck if the child finds it comforting; avoid nose blowing or picking for several hours.","Seek medical help if bleeding continues beyond 20 minutes of correct pressure, follows a significant blow to the head or face, or if the child is on blood-thinning medication or has a known bleeding disorder."]}},{"t":"scenario","title":{"en":"Scenario: the science laboratory scald","ar":"Scenario: the science laboratory scald"},"c":{"en":"A Year 9 student spills hot water from a beaker over the back of her hand and wrist. A teacher has pulled off her cardigan and put toothpaste on the area. \u003cstrong>What do you do?\u003c/strong> Take her to the nearest tap, gently remove the toothpaste under running water and continue cooling for the full 20 minutes, removing the bracelet she is wearing. Check the size and depth: the hand is a high-risk site, so cover with cling film and arrange medical assessment. Phone the parents, record the cooling time and ask the department to report the incident under the school's incident procedure.","ar":"A Year 9 student spills hot water from a beaker over the back of her hand and wrist. A teacher has pulled off her cardigan and put toothpaste on the area. \u003cstrong>What do you do?\u003c/strong> Take her to the nearest tap, gently remove the toothpaste under running water and continue cooling for the full 20 minutes, removing the bracelet she is wearing. Check the size and depth: the hand is a high-risk site, so cover with cling film and arrange medical assessment. Phone the parents, record the cooling time and ask the department to report the incident under the school's incident procedure."}}],"checks":[{"id":"m2q1","q":{"en":"A child's forearm wound is bleeding heavily and the first dressing is soaked through. What do you do?","ar":"A child's forearm wound is bleeding heavily and the first dressing is soaked through. What do you do?"},"opts":[{"en":"Remove the soaked dressing, wipe the wound clean and replace it with a fresh one","ar":"Remove the soaked dressing, wipe the wound clean and replace it with a fresh one"},{"en":"Release the pressure for a minute to see how bad the wound is","ar":"Release the pressure for a minute to see how bad the wound is"},{"en":"Apply a bandage as tightly as possible and leave the fingers unchecked until the parent arrives","ar":"Apply a bandage as tightly as possible and leave the fingers unchecked until the parent arrives"},{"en":"Add a further dressing on top, keep firm pressure and call 998 if bleeding is not controlled","ar":"Add a further dressing on top, keep firm pressure and call 998 if bleeding is not controlled"}],"correct":3,"expl":{"en":"Lifting the pad disturbs the clot that is forming. Add layers on top, maintain firm direct pressure, and escalate if it does not slow. Check circulation beyond a bandage so that it is not too tight.","ar":"Lifting the pad disturbs the clot that is forming. Add layers on top, maintain firm direct pressure, and escalate if it does not slow. Check circulation beyond a bandage so that it is not too tight."}},{"id":"m2q2","q":{"en":"What is the recommended first aid for a scald to the hand?","ar":"What is the recommended first aid for a scald to the hand?"},"opts":[{"en":"Cool under running water for 20 minutes, remove jewellery, then cover loosely with cling film","ar":"Cool under running water for 20 minutes, remove jewellery, then cover loosely with cling film"},{"en":"Apply ice directly for five minutes, then a thick cream, and cover with an adhesive dressing","ar":"Apply ice directly for five minutes, then a thick cream, and cover with an adhesive dressing"},{"en":"Burst any blisters so that the wound can drain, then dress it with a fluffy cotton pad","ar":"Burst any blisters so that the wound can drain, then dress it with a fluffy cotton pad"},{"en":"Cover tightly with an adhesive dressing and wait for review","ar":"Cover tightly with an adhesive dressing and wait for review"}],"correct":0,"expl":{"en":"Prolonged cooling limits the depth of tissue damage. Ice, creams and popping blisters cause harm or infection, and tight adhesive dressings damage burned skin.","ar":"Prolonged cooling limits the depth of tissue damage. Ice, creams and popping blisters cause harm or infection, and tight adhesive dressings damage burned skin."}},{"id":"m2q3","q":{"en":"A pupil has a nosebleed. Which instruction is correct?","ar":"A pupil has a nosebleed. Which instruction is correct?"},"opts":[{"en":"Tip the head back and pinch the bridge of the nose","ar":"Tip the head back and pinch the bridge of the nose"},{"en":"Lean forward and pinch the soft part of the nose for about 10 minutes","ar":"Lean forward and pinch the soft part of the nose for about 10 minutes"},{"en":"Lie flat on the back, place ice on the forehead and wait for the bleeding to stop","ar":"Lie flat on the back, place ice on the forehead and wait for the bleeding to stop"},{"en":"Keep the nostrils open, blow gently to clear any clots and then hold a tissue lightly in place","ar":"Keep the nostrils open, blow gently to clear any clots and then hold a tissue lightly in place"}],"correct":1,"expl":{"en":"Leaning forward stops blood running down the throat and pinching the soft part closes the bleeding point. Tilting the head back can cause swallowing or choking on blood.","ar":"Leaning forward stops blood running down the throat and pinching the soft part closes the bleeding point. Tilting the head back can cause swallowing or choking on blood."}}]},{"id":"m3","title":{"en":"Bones, Head, Spine, Sports, Eye and Dental Injuries","ar":"Bones, Head, Spine, Sports, Eye and Dental Injuries"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Falls and collisions in the playground and on the sports field produce sprains, fractures and head injuries. Your key judgements are: is there a possible spinal or serious head injury, does the limb need immobilising, and can the child safely stay at school.","ar":"Falls and collisions in the playground and on the sports field produce sprains, fractures and head injuries. Your key judgements are: is there a possible spinal or serious head injury, does the limb need immobilising, and can the child safely stay at school."}},{"t":"h","c":{"en":"Suspected fractures, sprains and strains","ar":"Suspected fractures, sprains and strains"}},{"t":"list","c":{"en":["Look for deformity, swelling, bruising, loss of movement, severe pain on gentle touch, and a limb that looks pale or feels cold.","Support the injury in the position found, using padding and a sling or splint if you are trained. Do not try to straighten a deformed limb.","Apply a cold pack wrapped in a cloth for short periods to reduce swelling and pain; never place ice directly on the skin.","Keep the child nil by mouth if they may need an anaesthetic or surgery; give pain relief only in line with the school's medication policy and parental consent.","Check circulation, sensation and movement beyond the injury before and after any splinting. An open wound over a possible fracture, or poor circulation beyond it, needs 998.","For sprains and strains, a short period of rest, cold, gentle compression and elevation is reasonable, with review if weight-bearing is not possible after the injury."],"ar":["Look for deformity, swelling, bruising, loss of movement, severe pain on gentle touch, and a limb that looks pale or feels cold.","Support the injury in the position found, using padding and a sling or splint if you are trained. Do not try to straighten a deformed limb.","Apply a cold pack wrapped in a cloth for short periods to reduce swelling and pain; never place ice directly on the skin.","Keep the child nil by mouth if they may need an anaesthetic or surgery; give pain relief only in line with the school's medication policy and parental consent.","Check circulation, sensation and movement beyond the injury before and after any splinting. An open wound over a possible fracture, or poor circulation beyond it, needs 998.","For sprains and strains, a short period of rest, cold, gentle compression and elevation is reasonable, with review if weight-bearing is not possible after the injury."]}},{"t":"h","c":{"en":"Head injury","ar":"Head injury"}},{"t":"p","c":{"en":"Most head knocks are minor, but some need urgent assessment. Always ask what happened, whether the child lost consciousness, and how they have been since. Observe the child for a period appropriate to your procedure and give parents written head-injury advice whenever a head injury occurs, even if it seemed minor.","ar":"Most head knocks are minor, but some need urgent assessment. Always ask what happened, whether the child lost consciousness, and how they have been since. Observe the child for a period appropriate to your procedure and give parents written head-injury advice whenever a head injury occurs, even if it seemed minor."}},{"t":"callout","k":"warn","title":{"en":"Red flags: call 998 or arrange urgent transfer","ar":"Red flags: call 998 or arrange urgent transfer"},"c":{"en":"Any loss of consciousness; drowsiness or difficulty waking; confusion or abnormal behaviour; repeated vomiting; a worsening headache; a seizure; weakness, clumsiness or slurred speech; unequal pupils; clear fluid or blood from the nose or ears; a significant mechanism such as a fall from height or a high-speed collision; or any neck pain.","ar":"Any loss of consciousness; drowsiness or difficulty waking; confusion or abnormal behaviour; repeated vomiting; a worsening headache; a seizure; weakness, clumsiness or slurred speech; unequal pupils; clear fluid or blood from the nose or ears; a significant mechanism such as a fall from height or a high-speed collision; or any neck pain."}},{"t":"h","c":{"en":"Suspected spinal injury","ar":"Suspected spinal injury"}},{"t":"steps","c":{"en":["Suspect a spinal injury after a significant fall, a diving or trampoline accident, a collision, or any head injury with neck pain, numbness or tingling.","Tell the child not to move and ask a helper to hold the head and neck steady in the position found, while you call 998.","Do not move the child unless there is immediate danger or you must open the airway or start CPR, which always takes priority.","Monitor breathing and responsiveness continuously, keep the child warm and reassure them until the ambulance crew takes over."],"ar":["Suspect a spinal injury after a significant fall, a diving or trampoline accident, a collision, or any head injury with neck pain, numbness or tingling.","Tell the child not to move and ask a helper to hold the head and neck steady in the position found, while you call 998.","Do not move the child unless there is immediate danger or you must open the airway or start CPR, which always takes priority.","Monitor breathing and responsiveness continuously, keep the child warm and reassure them until the ambulance crew takes over."]}},{"t":"table","head":{"en":["Situation","Do","Avoid"],"ar":["Situation","Do","Avoid"]},"rows":[{"en":["Suspected fracture","Immobilise in position found, check circulation, keep still","Straightening the limb or letting the child walk on it"],"ar":["Suspected fracture","Immobilise in position found, check circulation, keep still","Straightening the limb or letting the child walk on it"]},{"en":["Head injury with vomiting or drowsiness","Call 998, monitor airway and level of response","Sending the child back to class or home alone"],"ar":["Head injury with vomiting or drowsiness","Call 998, monitor airway and level of response","Sending the child back to class or home alone"]},{"en":["Neck pain after a fall","Hold head and neck still, call 998","Sitting the child up or removing a helmet unaided"],"ar":["Neck pain after a fall","Hold head and neck still, call 998","Sitting the child up or removing a helmet unaided"]},{"en":["Mild head knock, child alert","Observe, record, give written advice to parents","Leaving the child unobserved or giving no advice"],"ar":["Mild head knock, child alert","Observe, record, give written advice to parents","Leaving the child unobserved or giving no advice"]}]},{"t":"h","c":{"en":"Eye injuries","ar":"Eye injuries"}},{"t":"list","c":{"en":["\u003cstrong>Chemical in the eye\u003c/strong> (cleaning fluid, science reagent): irrigate immediately with clean running water for at least 10 to 20 minutes, holding the eyelids open, then seek urgent eye care and bring the product label.","\u003cstrong>Object stuck in the eye or blunt trauma:\u003c/strong> do not rub, press or try to remove an embedded object. Cover the eye lightly with a shield or paper cup, discourage eye movement and arrange emergency care.","\u003cstrong>Loose speck or eyelash:\u003c/strong> rinse gently and let tears wash it out; refer if pain, redness or vision change persists."],"ar":["\u003cstrong>Chemical in the eye\u003c/strong> (cleaning fluid, science reagent): irrigate immediately with clean running water for at least 10 to 20 minutes, holding the eyelids open, then seek urgent eye care and bring the product label.","\u003cstrong>Object stuck in the eye or blunt trauma:\u003c/strong> do not rub, press or try to remove an embedded object. Cover the eye lightly with a shield or paper cup, discourage eye movement and arrange emergency care.","\u003cstrong>Loose speck or eyelash:\u003c/strong> rinse gently and let tears wash it out; refer if pain, redness or vision change persists."]}},{"t":"h","c":{"en":"Dental injuries","ar":"Dental injuries"}},{"t":"list","c":{"en":["\u003cstrong>Knocked-out permanent tooth:\u003c/strong> find the tooth, hold it by the crown and never touch the root. If clean and the child is cooperative and alert, replace it in the socket; if not, keep it in milk or the child's own saliva and seek an urgent dentist.","Never reimplant a knocked-out baby tooth, because it can damage the developing tooth beneath; keep the child comfortable and refer to a dentist.","Chipped or fractured teeth, and any tooth that is loosened, need dental review the same day. Keep fragments if found."],"ar":["\u003cstrong>Knocked-out permanent tooth:\u003c/strong> find the tooth, hold it by the crown and never touch the root. If clean and the child is cooperative and alert, replace it in the socket; if not, keep it in milk or the child's own saliva and seek an urgent dentist.","Never reimplant a knocked-out baby tooth, because it can damage the developing tooth beneath; keep the child comfortable and refer to a dentist.","Chipped or fractured teeth, and any tooth that is loosened, need dental review the same day. Keep fragments if found."]}},{"t":"scenario","title":{"en":"Scenario: the football collision","ar":"Scenario: the football collision"},"c":{"en":"During a Year 8 football match two boys collide heads. One gets up laughing, but five minutes later complains of a headache and vomits once. \u003cstrong>What do you do?\u003c/strong> Take him out of play, assess airway, breathing and level of response, and ask about loss of consciousness and the mechanism. Headache plus vomiting after a head collision are red flags in themselves, so keep him under direct observation and call the parents. If he becomes drowsy, vomits again, or you remain concerned, call 998. Do not let him return to the match or travel home alone. Record your observations with times.","ar":"During a Year 8 football match two boys collide heads. One gets up laughing, but five minutes later complains of a headache and vomits once. \u003cstrong>What do you do?\u003c/strong> Take him out of play, assess airway, breathing and level of response, and ask about loss of consciousness and the mechanism. Headache plus vomiting after a head collision are red flags in themselves, so keep him under direct observation and call the parents. If he becomes drowsy, vomits again, or you remain concerned, call 998. Do not let him return to the match or travel home alone. Record your observations with times."}}],"checks":[{"id":"m3q1","q":{"en":"A student falls from a trampoline and complains of neck pain and tingling in the hands. What is the correct action?","ar":"A student falls from a trampoline and complains of neck pain and tingling in the hands. What is the correct action?"},"opts":[{"en":"Sit the student up gently, support the neck with a scarf and walk to the clinic for assessment","ar":"Sit the student up gently, support the neck with a scarf and walk to the clinic for assessment"},{"en":"Roll the student into the recovery position straight away so that the airway stays clear","ar":"Roll the student into the recovery position straight away so that the airway stays clear"},{"en":"Keep the head and neck still in the position found, call 998 and monitor breathing","ar":"Keep the head and neck still in the position found, call 998 and monitor breathing"},{"en":"Ask the student to turn the neck slowly from side to side to test for pain and stiffness","ar":"Ask the student to turn the neck slowly from side to side to test for pain and stiffness"}],"correct":2,"expl":{"en":"Neck pain with neurological symptoms after a fall must be treated as a spinal injury. Movement risks worsening damage, so only move the child if the airway or life is threatened.","ar":"Neck pain with neurological symptoms after a fall must be treated as a spinal injury. Movement risks worsening damage, so only move the child if the airway or life is threatened."}},{"id":"m3q2","q":{"en":"A permanent front tooth is knocked out. What should you do?","ar":"A permanent front tooth is knocked out. What should you do?"},"opts":[{"en":"Scrub the root clean under a tap, then store it dry in a tissue until a dentist is free","ar":"Scrub the root clean under a tap, then store it dry in a tissue until a dentist is free"},{"en":"Wait until the end of the school day to arrange dental care, keeping the tooth wrapped in a tissue in the child's own pocket","ar":"Wait until the end of the school day to arrange dental care, keeping the tooth wrapped in a tissue in the child's own pocket"},{"en":"Hold it by the root so that you can rinse it thoroughly, then place it in clean water","ar":"Hold it by the root so that you can rinse it thoroughly, then place it in clean water"},{"en":"Handle it by the crown only and replant it if clean and safe, otherwise store it in milk and go to a dentist urgently","ar":"Handle it by the crown only and replant it if clean and safe, otherwise store it in milk and go to a dentist urgently"}],"correct":3,"expl":{"en":"The root surface contains cells that allow the tooth to reattach. Touching or scrubbing them reduces success, and time matters, so treatment is urgent.","ar":"The root surface contains cells that allow the tooth to reattach. Touching or scrubbing them reduces success, and time matters, so treatment is urgent."}},{"id":"m3q3","q":{"en":"Which of these is a red flag after a head injury that justifies calling 998?","ar":"Which of these is a red flag after a head injury that justifies calling 998?"},"opts":[{"en":"Repeated vomiting and increasing drowsiness","ar":"Repeated vomiting and increasing drowsiness"},{"en":"A small bump with the child alert and chatting","ar":"A small bump with the child alert and chatting"},{"en":"A mild headache that eases after drinking water","ar":"A mild headache that eases after drinking water"},{"en":"A graze on the forehead with no other symptoms","ar":"A graze on the forehead with no other symptoms"}],"correct":0,"expl":{"en":"Repeated vomiting and drowsiness suggest rising pressure within the skull or a significant injury. A small bump with a normal child is still observed, but does not alone require an ambulance.","ar":"Repeated vomiting and drowsiness suggest rising pressure within the skull or a significant injury. A small bump with a normal child is still observed, but does not alone require an ambulance."}}]},{"id":"m4","title":{"en":"Choking, the Unresponsive Child, BLS and the AED","ar":"Choking, the Unresponsive Child, BLS and the AED"},"minutes":15,"blocks":[{"t":"p","c":{"en":"These are the situations in which seconds count and your preparation shows. The aim is to recognise them immediately, call 998, start the right sequence without hesitation, and use the AED as soon as it arrives.","ar":"These are the situations in which seconds count and your preparation shows. The aim is to recognise them immediately, call 998, start the right sequence without hesitation, and use the AED as soon as it arrives."}},{"t":"h","c":{"en":"Choking","ar":"Choking"}},{"t":"callout","k":"key","title":{"en":"Mild or severe?","ar":"Mild or severe?"},"c":{"en":"\u003cstrong>Mild obstruction:\u003c/strong> the child can cough effectively, speak or cry, and is breathing between coughs. Encourage coughing and stay with them. \u003cstrong>Severe obstruction:\u003c/strong> the child cannot speak, cough or breathe, may clutch the throat or go silent and blue, and may become unresponsive.","ar":"\u003cstrong>Mild obstruction:\u003c/strong> the child can cough effectively, speak or cry, and is breathing between coughs. Encourage coughing and stay with them. \u003cstrong>Severe obstruction:\u003c/strong> the child cannot speak, cough or breathe, may clutch the throat or go silent and blue, and may become unresponsive."}},{"t":"steps","c":{"en":["Confirm severe choking: ineffective or silent cough, cannot speak, distressed. Ask a helper to call 998.","For a child, lean them forward and give up to \u003cstrong>five back blows\u003c/strong> between the shoulder blades with the heel of your hand.","If the obstruction is not cleared, give up to \u003cstrong>five abdominal thrusts\u003c/strong>: stand behind, fist above the navel, pull sharply inwards and upwards.","Alternate five back blows and five abdominal thrusts until the object comes out or the child becomes unresponsive.","If the child becomes unresponsive, lay them down and start CPR. Look in the mouth before rescue breaths and remove only an object you can see."],"ar":["Confirm severe choking: ineffective or silent cough, cannot speak, distressed. Ask a helper to call 998.","For a child, lean them forward and give up to \u003cstrong>five back blows\u003c/strong> between the shoulder blades with the heel of your hand.","If the obstruction is not cleared, give up to \u003cstrong>five abdominal thrusts\u003c/strong>: stand behind, fist above the navel, pull sharply inwards and upwards.","Alternate five back blows and five abdominal thrusts until the object comes out or the child becomes unresponsive.","If the child becomes unresponsive, lay them down and start CPR. Look in the mouth before rescue breaths and remove only an object you can see."]}},{"t":"callout","k":"tip","title":{"en":"Infants and aftercare","ar":"Infants and aftercare"},"c":{"en":"For an infant, use back blows and chest thrusts, not abdominal thrusts, in line with your training. Any child who has received abdominal thrusts, or who has persistent cough, difficulty swallowing or breathing, must be assessed medically afterwards, because internal injury is possible even if they look well.","ar":"For an infant, use back blows and chest thrusts, not abdominal thrusts, in line with your training. Any child who has received abdominal thrusts, or who has persistent cough, difficulty swallowing or breathing, must be assessed medically afterwards, because internal injury is possible even if they look well."}},{"t":"h","c":{"en":"The unresponsive child: basic life support (BLS)","ar":"The unresponsive child: basic life support (BLS)"}},{"t":"steps","c":{"en":["Check \u003cstrong>danger\u003c/strong>, then gently shake the shoulders and call to the child. If there is no response, shout for help.","Open the airway with a head tilt and chin lift (a jaw thrust if you suspect spinal injury and the airway is not open).","Look, listen and feel for normal breathing for up to 10 seconds. Occasional gasps are not normal breathing.","If not breathing normally, send someone to call \u003cstrong>998\u003c/strong> and fetch the AED. If you are alone with a phone, put it on speaker and call as you start.","Follow your paediatric BLS training: for a child, begin with five rescue breaths, then 30 chest compressions followed by two breaths (30:2).","Compress the centre of the chest at \u003cstrong>100 to 120 per minute\u003c/strong>, to about one third of the depth of the chest, allowing full recoil. Minimise interruptions.","Continue until the ambulance crew takes over, the child shows signs of life, or you are too exhausted to continue."],"ar":["Check \u003cstrong>danger\u003c/strong>, then gently shake the shoulders and call to the child. If there is no response, shout for help.","Open the airway with a head tilt and chin lift (a jaw thrust if you suspect spinal injury and the airway is not open).","Look, listen and feel for normal breathing for up to 10 seconds. Occasional gasps are not normal breathing.","If not breathing normally, send someone to call \u003cstrong>998\u003c/strong> and fetch the AED. If you are alone with a phone, put it on speaker and call as you start.","Follow your paediatric BLS training: for a child, begin with five rescue breaths, then 30 chest compressions followed by two breaths (30:2).","Compress the centre of the chest at \u003cstrong>100 to 120 per minute\u003c/strong>, to about one third of the depth of the chest, allowing full recoil. Minimise interruptions.","Continue until the ambulance crew takes over, the child shows signs of life, or you are too exhausted to continue."]}},{"t":"h","c":{"en":"Using the AED","ar":"Using the AED"}},{"t":"list","c":{"en":["Switch the AED on as soon as it arrives and follow its voice prompts. Carry on compressions while the pads are applied.","Use paediatric pads or mode for younger children where the device has them, with placement as shown on the pads; use adult pads if no paediatric option exists rather than delaying.","Make sure nobody touches the child when the AED analyses and when it advises a shock. Resume CPR immediately after the shock if the device instructs.","Leave the pads on and the AED switched on until the crew arrives, and hand over the device if requested."],"ar":["Switch the AED on as soon as it arrives and follow its voice prompts. Carry on compressions while the pads are applied.","Use paediatric pads or mode for younger children where the device has them, with placement as shown on the pads; use adult pads if no paediatric option exists rather than delaying.","Make sure nobody touches the child when the AED analyses and when it advises a shock. Resume CPR immediately after the shock if the device instructs.","Leave the pads on and the AED switched on until the crew arrives, and hand over the device if requested."]}},{"t":"callout","k":"warn","title":{"en":"After an arrest","ar":"After an arrest"},"c":{"en":"A cardiac arrest in school is a critical incident. Make sure the Principal and senior leadership are informed, parents are contacted and the family is supported by a senior member of staff. Record events with timings, and make arrangements for debriefing and wellbeing support for the staff and students who witnessed it.","ar":"A cardiac arrest in school is a critical incident. Make sure the Principal and senior leadership are informed, parents are contacted and the family is supported by a senior member of staff. Record events with timings, and make arrangements for debriefing and wellbeing support for the staff and students who witnessed it."}},{"t":"scenario","title":{"en":"Scenario: the child who is found in the changing room","ar":"Scenario: the child who is found in the changing room"},"c":{"en":"A Year 6 pupil is found slumped in the PE changing room by a teaching assistant, who runs to get you. You find the child unresponsive and not breathing normally. \u003cstrong>What do you do?\u003c/strong> Shout for help and send the assistant with a clear instruction: \"Call 998 and bring the AED.\" Open the airway, confirm absent breathing and start the paediatric sequence of rescue breaths and compressions. When the AED arrives, apply paediatric pads and follow the prompts. Direct another adult to meet the ambulance at the gate and to inform the Principal. Note the time of collapse, when CPR started and any shocks delivered.","ar":"A Year 6 pupil is found slumped in the PE changing room by a teaching assistant, who runs to get you. You find the child unresponsive and not breathing normally. \u003cstrong>What do you do?\u003c/strong> Shout for help and send the assistant with a clear instruction: \"Call 998 and bring the AED.\" Open the airway, confirm absent breathing and start the paediatric sequence of rescue breaths and compressions. When the AED arrives, apply paediatric pads and follow the prompts. Direct another adult to meet the ambulance at the gate and to inform the Principal. Note the time of collapse, when CPR started and any shocks delivered."}}],"checks":[{"id":"m4q1","q":{"en":"A child with severe choking cannot cough or speak and is still responsive. What is the right sequence?","ar":"A child with severe choking cannot cough or speak and is still responsive. What is the right sequence?"},"opts":[{"en":"Give small sips of water to wash the object down and watch the child closely for ten minutes","ar":"Give small sips of water to wash the object down and watch the child closely for ten minutes"},{"en":"Call 998, give back blows, then abdominal thrusts, alternating until the object clears or the child becomes unresponsive","ar":"Call 998, give back blows, then abdominal thrusts, alternating until the object clears or the child becomes unresponsive"},{"en":"Sweep the mouth blindly with a finger to clear the object, then give back blows and offer a sip of water afterwards","ar":"Sweep the mouth blindly with a finger to clear the object, then give back blows and offer a sip of water afterwards"},{"en":"Lay the child flat and start chest compressions immediately while the child is still responsive","ar":"Lay the child flat and start chest compressions immediately while the child is still responsive"}],"correct":1,"expl":{"en":"Severe obstruction needs back blows alternating with abdominal thrusts. Drinking is unsafe, blind finger sweeps can push the object further, and compressions begin only if the child becomes unresponsive.","ar":"Severe obstruction needs back blows alternating with abdominal thrusts. Drinking is unsafe, blind finger sweeps can push the object further, and compressions begin only if the child becomes unresponsive."}},{"id":"m4q2","q":{"en":"Which statement about chest compressions in BLS is correct?","ar":"Which statement about chest compressions in BLS is correct?"},"opts":[{"en":"Push as slowly as possible to avoid injuring the ribs, with about one breath after every ten","ar":"Push as slowly as possible to avoid injuring the ribs, with about one breath after every ten"},{"en":"Compress very lightly using only the fingertips of one hand, at about 80 per minute","ar":"Compress very lightly using only the fingertips of one hand, at about 80 per minute"},{"en":"Push at 100 to 120 per minute to one third of chest depth, using 30 compressions to two breaths","ar":"Push at 100 to 120 per minute to one third of chest depth, using 30 compressions to two breaths"},{"en":"Aim for 60 compressions per minute with a short break after every ten to allow rest","ar":"Aim for 60 compressions per minute with a short break after every ten to allow rest"}],"correct":2,"expl":{"en":"Effective compressions need the correct rate and depth with full recoil and minimal interruption. The standard ratio is 30 compressions to two breaths.","ar":"Effective compressions need the correct rate and depth with full recoil and minimal interruption. The standard ratio is 30 compressions to two breaths."}},{"id":"m4q3","q":{"en":"Why should the AED be attached as soon as it arrives?","ar":"Why should the AED be attached as soon as it arrives?"},"opts":[{"en":"Because it should replace chest compressions once attached, so that the rescuer can rest","ar":"Because it should replace chest compressions once attached, so that the rescuer can rest"},{"en":"Because it is only needed after the ambulance has arrived and the crew have taken over, since only paramedics may use it","ar":"Because it is only needed after the ambulance has arrived and the crew have taken over, since only paramedics may use it"},{"en":"Because it keeps the child warm during resuscitation and supports the airway until help comes","ar":"Because it keeps the child warm during resuscitation and supports the airway until help comes"},{"en":"Early defibrillation of a shockable rhythm greatly improves chances of survival, and the device decides whether a shock is needed","ar":"Early defibrillation of a shockable rhythm greatly improves chances of survival, and the device decides whether a shock is needed"}],"correct":3,"expl":{"en":"The AED analyses the rhythm and advises a shock only when appropriate. CPR continues around its prompts, and it supports rather than replaces compressions.","ar":"The AED analyses the rhythm and advises a shock only when appropriate. CPR continues around its prompts, and it supports rather than replaces compressions."}}]},{"id":"m5","title":{"en":"Sudden Illness: Faints, Seizures, Asthma, Hypoglycaemia, Anaphylaxis and Heat","ar":"Sudden Illness: Faints, Seizures, Asthma, Hypoglycaemia, Anaphylaxis and Heat"},"minutes":15,"blocks":[{"t":"callout","k":"warn","title":{"en":"Always start with the child's plan","ar":"Always start with the child's plan"},"c":{"en":"Children with epilepsy, asthma, diabetes or severe allergy should have an IHP with a written emergency plan. Give medication as prescribed and as written in the IHP and the prescriber's instruction; never from memory and never with another child's supply. This module covers recognition and first response, not dosing.","ar":"Children with epilepsy, asthma, diabetes or severe allergy should have an IHP with a written emergency plan. Give medication as prescribed and as written in the IHP and the prescriber's instruction; never from memory and never with another child's supply. This module covers recognition and first response, not dosing."}},{"t":"h","c":{"en":"Fainting","ar":"Fainting"}},{"t":"list","c":{"en":["Lay the child flat and raise the legs if possible, loosen tight clothing and ensure fresh air. Recovery is usually within a minute or two.","Afterwards, sit them up slowly and offer a drink. Ask about breakfast, hydration, standing for a long time and heat.","Seek medical review if the faint happened during exercise, with chest pain or palpitations, was without warning, or repeats. Check that an unresponsive child is breathing normally, since a seizure or arrest can look like a faint."],"ar":["Lay the child flat and raise the legs if possible, loosen tight clothing and ensure fresh air. Recovery is usually within a minute or two.","Afterwards, sit them up slowly and offer a drink. Ask about breakfast, hydration, standing for a long time and heat.","Seek medical review if the faint happened during exercise, with chest pain or palpitations, was without warning, or repeats. Check that an unresponsive child is breathing normally, since a seizure or arrest can look like a faint."]}},{"t":"h","c":{"en":"Seizures","ar":"Seizures"}},{"t":"steps","c":{"en":["Note the \u003cstrong>time\u003c/strong> the seizure starts and move hard objects away. Cushion the head.","Do \u003cstrong>not restrain\u003c/strong> the child and do \u003cstrong>not put anything in the mouth\u003c/strong>.","When the jerking stops, check breathing and place the child in the recovery position. Stay and reassure as they recover, as they will be confused and tired.","Call \u003cstrong>998\u003c/strong> if the seizure lasts more than \u003cstrong>5 minutes\u003c/strong>, repeats without recovery, if it is the child's first, if there is an injury, or if breathing is difficult, in line with the child's plan."],"ar":["Note the \u003cstrong>time\u003c/strong> the seizure starts and move hard objects away. Cushion the head.","Do \u003cstrong>not restrain\u003c/strong> the child and do \u003cstrong>not put anything in the mouth\u003c/strong>.","When the jerking stops, check breathing and place the child in the recovery position. Stay and reassure as they recover, as they will be confused and tired.","Call \u003cstrong>998\u003c/strong> if the seizure lasts more than \u003cstrong>5 minutes\u003c/strong>, repeats without recovery, if it is the child's first, if there is an injury, or if breathing is difficult, in line with the child's plan."]}},{"t":"h","c":{"en":"Asthma attack basics","ar":"Asthma attack basics"}},{"t":"list","c":{"en":["Signs: cough, wheeze, tight chest, breathlessness, difficulty speaking in full sentences. A silent chest, blue lips, exhaustion or drowsiness are signs of a life-threatening attack.","Keep the child calm and sitting upright, leaning slightly forward. Do not lay them flat.","Give their reliever inhaler through a spacer as written in their IHP, and follow the plan for repeating it.","Call 998 if there is no improvement, the child is struggling to speak, the reliever is not available, or you are worried. Continue the plan until the crew arrives."],"ar":["Signs: cough, wheeze, tight chest, breathlessness, difficulty speaking in full sentences. A silent chest, blue lips, exhaustion or drowsiness are signs of a life-threatening attack.","Keep the child calm and sitting upright, leaning slightly forward. Do not lay them flat.","Give their reliever inhaler through a spacer as written in their IHP, and follow the plan for repeating it.","Call 998 if there is no improvement, the child is struggling to speak, the reliever is not available, or you are worried. Continue the plan until the crew arrives."]}},{"t":"h","c":{"en":"Hypoglycaemia basics","ar":"Hypoglycaemia basics"}},{"t":"p","c":{"en":"Low blood glucose in a child with diabetes can cause hunger, shakiness, sweating, pallor, headache, irritability or vague behaviour, and can look like misbehaviour or exam stress. Follow the IHP: check the glucose level if you can, give fast-acting sugar if the child is awake and able to swallow safely, then recheck and follow with a snack as the plan says. If the child is drowsy, unable to swallow, seizing or unconscious, give nothing by mouth, put them in the recovery position and call 998; give emergency treatment only as prescribed and as you are trained.","ar":"Low blood glucose in a child with diabetes can cause hunger, shakiness, sweating, pallor, headache, irritability or vague behaviour, and can look like misbehaviour or exam stress. Follow the IHP: check the glucose level if you can, give fast-acting sugar if the child is awake and able to swallow safely, then recheck and follow with a snack as the plan says. If the child is drowsy, unable to swallow, seizing or unconscious, give nothing by mouth, put them in the recovery position and call 998; give emergency treatment only as prescribed and as you are trained."}},{"t":"h","c":{"en":"Anaphylaxis recognition","ar":"Anaphylaxis recognition"}},{"t":"callout","k":"key","title":{"en":"Recognise and act","ar":"Recognise and act"},"c":{"en":"Suspect anaphylaxis when there is sudden onset after exposure to a likely trigger (food, sting, medicine) with \u003cstrong>airway, breathing or circulation problems\u003c/strong>: swelling of the tongue or throat, hoarse voice, wheeze or breathlessness, pallor, floppiness or collapse. Skin changes such as hives often occur but may be absent. \u003cstrong>Give the adrenaline auto-injector as per the child's IHP and your training, and call 998 saying \"anaphylaxis\".\u003c/strong>","ar":"Suspect anaphylaxis when there is sudden onset after exposure to a likely trigger (food, sting, medicine) with \u003cstrong>airway, breathing or circulation problems\u003c/strong>: swelling of the tongue or throat, hoarse voice, wheeze or breathlessness, pallor, floppiness or collapse. Skin changes such as hives often occur but may be absent. \u003cstrong>Give the adrenaline auto-injector as per the child's IHP and your training, and call 998 saying \"anaphylaxis\".\u003c/strong>"}},{"t":"list","c":{"en":["Lay the child flat with legs raised; if breathing is difficult let them sit up; if unconscious and breathing, use the recovery position. Do not let them stand or walk.","Note the time of the injection and follow the plan for a further injection if there is no improvement. Hand used devices to the ambulance crew.","Every child given adrenaline must go to hospital, even if they appear to recover."],"ar":["Lay the child flat with legs raised; if breathing is difficult let them sit up; if unconscious and breathing, use the recovery position. Do not let them stand or walk.","Note the time of the injection and follow the plan for a further injection if there is no improvement. Hand used devices to the ambulance crew.","Every child given adrenaline must go to hospital, even if they appear to recover."]}},{"t":"h","c":{"en":"Heat illness","ar":"Heat illness"}},{"t":"list","c":{"en":["\u003cstrong>Heat exhaustion:\u003c/strong> headache, dizziness, nausea, heavy sweating, pale clammy skin, fast pulse. Move to a cool shaded place, remove excess clothing, cool the skin with water and fans, and give sips of water.","\u003cstrong>Heat stroke:\u003c/strong> confusion, collapse, seizure, very hot skin, or no improvement within a short time. This is an emergency: call 998 and cool aggressively, ideally with cool water immersion or wet sheets and fanning, while monitoring airway and breathing.","In the UAE climate, make sure outdoor activity, trips and sports days follow the school's heat guidance with shade, water breaks and early recognition."],"ar":["\u003cstrong>Heat exhaustion:\u003c/strong> headache, dizziness, nausea, heavy sweating, pale clammy skin, fast pulse. Move to a cool shaded place, remove excess clothing, cool the skin with water and fans, and give sips of water.","\u003cstrong>Heat stroke:\u003c/strong> confusion, collapse, seizure, very hot skin, or no improvement within a short time. This is an emergency: call 998 and cool aggressively, ideally with cool water immersion or wet sheets and fanning, while monitoring airway and breathing.","In the UAE climate, make sure outdoor activity, trips and sports days follow the school's heat guidance with shade, water breaks and early recognition."]}},{"t":"scenario","title":{"en":"Scenario: asthma at the cross-country","ar":"Scenario: asthma at the cross-country"},"c":{"en":"A Year 7 student with asthma starts wheezing during a cross-country run. She can only say a few words at a time. Her inhaler is at the finish area. \u003cstrong>What do you do?\u003c/strong> Stop the activity, sit her upright and send a runner for the inhaler, spacer and her IHP while a colleague phones 998. Give the reliever as the plan directs and keep her calm. Her inability to speak in sentences and the delay in getting the medication make this serious, so do not wait to see whether she settles. Afterwards, review why her inhaler was not with her and put it right.","ar":"A Year 7 student with asthma starts wheezing during a cross-country run. She can only say a few words at a time. Her inhaler is at the finish area. \u003cstrong>What do you do?\u003c/strong> Stop the activity, sit her upright and send a runner for the inhaler, spacer and her IHP while a colleague phones 998. Give the reliever
