as the plan directs and keep her calm. Her inability to speak in sentences and the delay in getting the medication make this serious, so do not wait to see whether she settles. Afterwards, review why her inhaler was not with her and put it right."}}],"checks":[{"id":"m5q1","q":{"en":"A student has a generalised seizure in the classroom. What should staff do?","ar":"A student has a generalised seizure in the classroom. What should staff do?"},"opts":[{"en":"Time it, protect the head and clear the area, and call 998 if it lasts over five minutes","ar":"Time it, protect the head and clear the area, and call 998 if it lasts over five minutes"},{"en":"Hold the student still to prevent injury and put a soft spoon in the mouth to protect the tongue","ar":"Hold the student still to prevent injury and put a soft spoon in the mouth to protect the tongue"},{"en":"Give a drink of water straight away to help recovery and keep the student sitting upright","ar":"Give a drink of water straight away to help recovery and keep the student sitting upright"},{"en":"Wait for a full ten minutes while timing the seizure before calling for help","ar":"Wait for a full ten minutes while timing the seizure before calling for help"}],"correct":0,"expl":{"en":"Do not restrain the child or place anything in the mouth. Note the time and call 998 if the seizure goes beyond five minutes or follows the child's emergency plan.","ar":"Do not restrain the child or place anything in the mouth. Note the time and call 998 if the seizure goes beyond five minutes or follows the child's emergency plan."}},{"id":"m5q2","q":{"en":"Which combination should make you suspect anaphylaxis after a child eats a snack?","ar":"Which combination should make you suspect anaphylaxis after a child eats a snack?"},"opts":[{"en":"A single sneeze and a runny nose after lunch, with no other symptoms at all","ar":"A single sneeze and a runny nose after lunch, with no other symptoms at all"},{"en":"Swollen tongue, hoarse voice and breathing difficulty within minutes","ar":"Swollen tongue, hoarse voice and breathing difficulty within minutes"},{"en":"Mild stomach ache that settled after a drink of water and a short rest","ar":"Mild stomach ache that settled after a drink of water and a short rest"},{"en":"Tiredness and a mild headache late in the afternoon after a long, busy day","ar":"Tiredness and a mild headache late in the afternoon after a long, busy day"}],"correct":1,"expl":{"en":"Anaphylaxis involves airway, breathing or circulation compromise shortly after exposure. Mild, isolated symptoms do not fit, but a child with a known allergy should be watched closely.","ar":"Anaphylaxis involves airway, breathing or circulation compromise shortly after exposure. Mild, isolated symptoms do not fit, but a child with a known allergy should be watched closely."}},{"id":"m5q3","q":{"en":"A known diabetic child is drowsy, cannot swallow safely and is vague. What is the correct action?","ar":"A known diabetic child is drowsy, cannot swallow safely and is vague. What is the correct action?"},"opts":[{"en":"Pour sugary drink slowly into the mouth to raise the glucose quickly, then recheck in ten minutes and give a snack","ar":"Pour sugary drink slowly into the mouth to raise the glucose quickly, then recheck in ten minutes and give a snack"},{"en":"Let the child sleep in a quiet room and recheck the glucose again in about an hour","ar":"Let the child sleep in a quiet room and recheck the glucose again in about an hour"},{"en":"Give nothing by mouth, place in the recovery position and call 998, using emergency treatment only as prescribed and trained","ar":"Give nothing by mouth, place in the recovery position and call 998, using emergency treatment only as prescribed and trained"},{"en":"Give the child's usual insulin dose from the IHP to correct the problem, then call the parents","ar":"Give the child's usual insulin dose from the IHP to correct the problem, then call the parents"}],"correct":2,"expl":{"en":"A child who cannot swallow safely risks choking on food or drink. This is a medical emergency, and any rescue treatment must follow the prescriber's plan.","ar":"A child who cannot swallow safely risks choking on food or drink. This is a medical emergency, and any rescue treatment must follow the prescriber's plan."}}]},{"id":"m6","title":{"en":"Documenting Incidents, Informing Parents and Ambulance Handover","ar":"Documenting Incidents, Informing Parents and Ambulance Handover"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Good care is only half of the job. A clear record protects the child, the staff and you, and a calm, accurate conversation with parents and the ambulance crew keeps everyone informed. This module also gathers the take-aways for the whole CPD.","ar":"Good care is only half of the job. A clear record protects the child, the staff and you, and a calm, accurate conversation with parents and the ambulance crew keeps everyone informed. This module also gathers the take-aways for the whole CPD."}},{"t":"h","c":{"en":"Documenting an incident","ar":"Documenting an incident"}},{"t":"list","c":{"en":["Record as soon as practical after the incident, while details are fresh, and keep the record factual: who, what, when, where, what you observed, what you did and what happened next.","Include times (of the event, of your assessment, of treatment, of calling 998 and of parental contact), observations such as breathing, colour and level of response, and any medication given with dose as prescribed, time and who gave it.","Write what you saw and what the child said, in the child's own words where relevant, not opinions or labels. For example, \"Child states he fell from the bars and hit the back of his head\", not \"careless boy\".","Name witnesses, record the first aider who attended and note any follow-up advice given to the parents and the child.","Sign and date the entry. Never alter a record afterwards; if you need to correct something, add a dated, signed addendum.","Use the school's incident or accident reporting procedure for anything serious, any head injury, any use of emergency medication and any call to 998, and tell the Principal or senior leadership as the procedure requires."],"ar":["Record as soon as practical after the incident, while details are fresh, and keep the record factual: who, what, when, where, what you observed, what you did and what happened next.","Include times (of the event, of your assessment, of treatment, of calling 998 and of parental contact), observations such as breathing, colour and level of response, and any medication given with dose as prescribed, time and who gave it.","Write what you saw and what the child said, in the child's own words where relevant, not opinions or labels. For example, \"Child states he fell from the bars and hit the back of his head\", not \"careless boy\".","Name witnesses, record the first aider who attended and note any follow-up advice given to the parents and the child.","Sign and date the entry. Never alter a record afterwards; if you need to correct something, add a dated, signed addendum.","Use the school's incident or accident reporting procedure for anything serious, any head injury, any use of emergency medication and any call to 998, and tell the Principal or senior leadership as the procedure requires."]}},{"t":"callout","k":"key","title":{"en":"Confidentiality and data","ar":"Confidentiality and data"},"c":{"en":"Health information is sensitive personal data. Federal Decree-Law No. 45 of 2021 on Personal Data Protection and Federal Law No. 2 of 2019 on the Use of ICT in Health Fields both emphasise confidentiality and secure storage. Follow the school's records and data protection policy, share on a need-to-know basis, store records securely, and remember that a safeguarding concern overrides confidentiality: tell the DSL (Designated Safeguarding Lead). Never promise a child that you will keep something secret.","ar":"Health information is sensitive personal data. Federal Decree-Law No. 45 of 2021 on Personal Data Protection and Federal Law No. 2 of 2019 on the Use of ICT in Health Fields both emphasise confidentiality and secure storage. Follow the school's records and data protection policy, share on a need-to-know basis, store records securely, and remember that a safeguarding concern overrides confidentiality: tell the DSL (Designated Safeguarding Lead). Never promise a child that you will keep something secret."}},{"t":"h","c":{"en":"Informing parents","ar":"Informing parents"}},{"t":"steps","c":{"en":["Phone parents promptly for anything beyond a minor injury, any head injury, any use of emergency medication, and any case where the child should go home or to hospital.","Be calm, clear and factual: say who you are, what happened, what you found, what you have done and what you need them to do (collect, meet at hospital, observe at home).","Give written advice for head injuries and anything requiring observation at home, and confirm that the contact details on file are current.","If you cannot reach a parent, use the emergency contacts on file, record every attempt, and never delay emergency care while waiting.","If the injury raises any concern about how it happened, such as unexplained or repeated injuries or an account that does not fit, do not question the child at length; record their exact words and speak to the DSL the same day."],"ar":["Phone parents promptly for anything beyond a minor injury, any head injury, any use of emergency medication, and any case where the child should go home or to hospital.","Be calm, clear and factual: say who you are, what happened, what you found, what you have done and what you need them to do (collect, meet at hospital, observe at home).","Give written advice for head injuries and anything requiring observation at home, and confirm that the contact details on file are current.","If you cannot reach a parent, use the emergency contacts on file, record every attempt, and never delay emergency care while waiting.","If the injury raises any concern about how it happened, such as unexplained or repeated injuries or an account that does not fit, do not question the child at length; record their exact words and speak to the DSL the same day."]}},{"t":"h","c":{"en":"Ambulance handover","ar":"Ambulance handover"}},{"t":"p","c":{"en":"A good handover is brief and structured. A simple pattern such as \u003cstrong>ATMIST\u003c/strong> keeps it complete: Age, Time of onset or injury, Mechanism, Injuries or illness found, Signs (observations and trends), Treatment given.","ar":"A good handover is brief and structured. A simple pattern such as \u003cstrong>ATMIST\u003c/strong> keeps it complete: Age, Time of onset or injury, Mechanism, Injuries or illness found, Signs (observations and trends), Treatment given."}},{"t":"list","c":{"en":["Meet the crew at the gate with a staff member holding the gate and lifts clear, and take them straight to the child.","Hand over the child's IHP, medical history, allergies, medication used and its time, and your record of observations and times.","Send a member of staff with the child if a parent has not arrived, and make sure a parent knows which hospital the child is going to.","Afterwards, complete your records, restock the kit, inform senior leadership and offer support to the staff and children who were involved."],"ar":["Meet the crew at the gate with a staff member holding the gate and lifts clear, and take them straight to the child.","Hand over the child's IHP, medical history, allergies, medication used and its time, and your record of observations and times.","Send a member of staff with the child if a parent has not arrived, and make sure a parent knows which hospital the child is going to.","Afterwards, complete your records, restock the kit, inform senior leadership and offer support to the staff and children who were involved."]}},{"t":"scenario","title":{"en":"Scenario: the parent who cannot be reached","ar":"Scenario: the parent who cannot be reached"},"c":{"en":"A Year 5 boy hits his head on a desk and is drowsy and vomits. You have called 998. Both parents' numbers go to voicemail. \u003cstrong>What do you do?\u003c/strong> Do not wait. Care for the child and leave a clear voicemail, then try the other emergency contacts on file and ask the school office to keep trying. Record each attempt with its time. Send a staff member who knows the child to travel with him, with his records, and hand over to the crew using ATMIST. Keep the Principal informed. As soon as you reach a parent, tell them where he is and what has happened.","ar":"A Year 5 boy hits his head on a desk and is drowsy and vomits. You have called 998. Both parents' numbers go to voicemail. \u003cstrong>What do you do?\u003c/strong> Do not wait. Care for the child and leave a clear voicemail, then try the other emergency contacts on file and ask the school office to keep trying. Record each attempt with its time. Send a staff member who knows the child to travel with him, with his records, and hand over to the crew using ATMIST. Keep the Principal informed. As soon as you reach a parent, tell them where he is and what has happened."}},{"t":"callout","k":"key","title":{"en":"Five take-aways from this CPD","ar":"Five take-aways from this CPD"},"c":{"en":"1. Use a structured primary survey every time and treat life threats in the order found. 2. Control bleeding with firm direct pressure and cool burns for 20 minutes under running water. 3. In choking and collapse, call 998 early and start BLS with the AED as soon as it arrives; suspect head or spinal injury before moving a child. 4. Follow the IHP and the prescriber's instructions for asthma, diabetes, epilepsy and anaphylaxis, and call 998 when the plan or your judgement says so. 5. Document factually with times, inform parents promptly, hand over with a clear structure, and keep health information confidential, except where safeguarding requires you to share.","ar":"1. Use a structured primary survey every time and treat life threats in the order found. 2. Control bleeding with firm direct pressure and cool burns for 20 minutes under running water. 3. In choking and collapse, call 998 early and start BLS with the AED as soon as it arrives; suspect head or spinal injury before moving a child. 4. Follow the IHP and the prescriber's instructions for asthma, diabetes, epilepsy and anaphylaxis, and call 998 when the plan or your judgement says so. 5. Document factually with times, inform parents promptly, hand over with a clear structure, and keep health information confidential, except where safeguarding requires you to share."}}],"checks":[{"id":"m6q1","q":{"en":"Which entry is best practice in an incident record?","ar":"Which entry is best practice in an incident record?"},"opts":[{"en":"\"Clumsy boy ran carelessly down the steps again and hurt his arm, as he often does\"","ar":"\"Clumsy boy ran carelessly down the steps again and hurt his arm, as he often does\""},{"en":"\"Seemed fine, so no notes made about timing or findings\"","ar":"\"Seemed fine, so no notes made about timing or findings\""},{"en":"\"Wrist probably broken after a careless fall, so parents will be told eventually when convenient\"","ar":"\"Wrist probably broken after a careless fall, so parents will be told eventually when convenient\""},{"en":"\"Child states he slipped on the wet step and landed on his left wrist; swelling and tenderness noted at 10:42\"","ar":"\"Child states he slipped on the wet step and landed on his left wrist; swelling and tenderness noted at 10:42\""}],"correct":3,"expl":{"en":"Records should be factual, timed, and use the child's own words, avoiding opinion or labels. Delayed or vague notes weaken the record and the child's care.","ar":"Records should be factual, timed, and use the child's own words, avoiding opinion or labels. Delayed or vague notes weaken the record and the child's care."}},{"id":"m6q2","q":{"en":"A parent cannot be reached after an ambulance has been called. What is the correct approach?","ar":"A parent cannot be reached after an ambulance has been called. What is the correct approach?"},"opts":[{"en":"Continue care and transfer, keep trying all emergency contacts, record each attempt and send a staff member with the child","ar":"Continue care and transfer, keep trying all emergency contacts, record each attempt and send a staff member with the child"},{"en":"Delay the ambulance until a parent has been contacted and has agreed to the transfer","ar":"Delay the ambulance until a parent has been contacted and has agreed to the transfer"},{"en":"Stop trying after one voicemail to avoid distressing the family, and write a full note of what happened tomorrow","ar":"Stop trying after one voicemail to avoid distressing the family, and write a full note of what happened tomorrow"},{"en":"Send the child alone with the crew and note the details of the hospital afterwards","ar":"Send the child alone with the crew and note the details of the hospital afterwards"}],"correct":0,"expl":{"en":"Emergency care must not be delayed for consent when a child needs urgent treatment. Keep trying contacts, and make sure an adult the child knows goes with them.","ar":"Emergency care must not be delayed for consent when a child needs urgent treatment. Keep trying contacts, and make sure an adult the child knows goes with them."}},{"id":"m6q3","q":{"en":"A child's account of an injury does not fit the injury you see, and the same child had a similar injury last month. What should you do?","ar":"A child's account of an injury does not fit the injury you see, and the same child had a similar injury last month. What should you do?"},"opts":[{"en":"Promise the child that you will keep what they say secret so that they feel safe to talk","ar":"Promise the child that you will keep what they say secret so that they feel safe to talk"},{"en":"Record their exact words without leading questions and speak to the DSL the same day","ar":"Record their exact words without leading questions and speak to the DSL the same day"},{"en":"Question the child at length until the full story emerges, then record a summary of it","ar":"Question the child at length until the full story emerges, then record a summary of it"},{"en":"Wait to see whether it happens a third time before involving anyone else in the school","ar":"Wait to see whether it happens a third time before involving anyone else in the school"}],"correct":1,"expl":{"en":"Safeguarding concerns override confidentiality and must be shared the same day with the DSL. Avoid leading or repeated questioning, and never promise secrecy.","ar":"Safeguarding concerns override confidentiality and must be shared the same day with the DSL. Avoid leading or repeated questioning, and never promise secrecy."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A teacher calls you to a child who has collapsed during break. You arrive and find the child lying on the ground with others crowding around. What is your first step?","ar":"A teacher calls you to a child who has collapsed during break. You arrive and find the child lying on the ground with others crowding around. What is your first step?"},"opts":[{"en":"Pick the child up and carry them to the clinic at once so that they are out of the crowd","ar":"Pick the child up and carry them to the clinic at once so that they are out of the crowd"},{"en":"Begin rescue breaths at once, before confirming a response or checking whether it is safe","ar":"Begin rescue breaths at once, before confirming a response or checking whether it is safe"},{"en":"Make sure the scene is safe, ask bystanders to step back, and check for a response","ar":"Make sure the scene is safe, ask bystanders to step back, and check for a response"},{"en":"Ask the other children what happened and who saw it before touching the child at all","ar":"Ask the other children what happened and who saw it before touching the child at all"}],"correct":2},{"id":"e2","mod":1,"q":{"en":"While completing the primary survey on an injured child you notice a dramatic bleeding scalp wound, but the child is quiet and breathing noisily. Which is the correct priority?","ar":"While completing the primary survey on an injured child you notice a dramatic bleeding scalp wound, but the child is quiet and breathing noisily. Which is the correct priority?"},"opts":[{"en":"Bandage the scalp wound first because it is the most visible and the most frightening to others","ar":"Bandage the scalp wound first because it is the most visible and the most frightening to others"},{"en":"Wait for the parents to arrive and give consent before treating either problem","ar":"Wait for the parents to arrive and give consent before treating either problem"},{"en":"Take the child's temperature and weight before doing anything else for the problem","ar":"Take the child's temperature and weight before doing anything else for the problem"},{"en":"Address the airway and breathing problem first, then control the bleeding","ar":"Address the airway and breathing problem first, then control the bleeding"}],"correct":3},{"id":"e3","mod":1,"q":{"en":"You are asked to review the school's first-aid arrangements. Which action would best improve readiness?","ar":"You are asked to review the school's first-aid arrangements. Which action would best improve readiness?"},"opts":[{"en":"Recorded regular checks of every kit and the AED, with expiry dates and a named person to restock","ar":"Recorded regular checks of every kit and the AED, with expiry dates and a named person to restock"},{"en":"Keeping all supplies in one locked cupboard in the clinic, with the key held by the office","ar":"Keeping all supplies in one locked cupboard in the clinic, with the key held by the office"},{"en":"Checking kits only when a staff member reports a shortage or a kit has been used up","ar":"Checking kits only when a staff member reports a shortage or a kit has been used up"},{"en":"Ordering extra stock every term whether or not it was used, without checking any expiry dates","ar":"Ordering extra stock every term whether or not it was used, without checking any expiry dates"}],"correct":0},{"id":"e4","mod":6,"q":{"en":"After you treat a pupil's head injury, a colleague suggests writing \"careless boy, always in trouble\" in the notes. What is the best entry?","ar":"After you treat a pupil's head injury, a colleague suggests writing \"careless boy, always in trouble\" in the notes. What is the best entry?"},"opts":[{"en":"A brief opinion on the child's behaviour so that other staff are warned about the pupil","ar":"A brief opinion on the child's behaviour so that other staff are warned about the pupil"},{"en":"A factual, timed note of what the child said, what you observed and what you did","ar":"A factual, timed note of what the child said, what you observed and what you did"},{"en":"No entry, since the injury was minor and the child went home with a sticker and a plaster","ar":"No entry, since the injury was minor and the child went home with a sticker and a plaster"},{"en":"A note written the next day from memory, with the details tidied up and left unsigned","ar":"A note written the next day from memory, with the details tidied up and left unsigned"}],"correct":1},{"id":"e5","mod":2,"q":{"en":"A Year 4 pupil has a deep cut to the palm and the dressing is soaked within a minute. What should you do?","ar":"A Year 4 pupil has a deep cut to the palm and the dressing is soaked within a minute. What should you do?"},"opts":[{"en":"Take the dressing off and rinse the wound under the tap to see whether the bleeding has eased","ar":"Take the dressing off and rinse the wound under the tap to see whether the bleeding has eased"},{"en":"Apply a tight bandage straight over the soaked dressing and send the child back to class","ar":"Apply a tight bandage straight over the soaked dressing and send the child back to class"},{"en":"Keep firm direct pressure, add more dressings on top, and call 998 if bleeding remains uncontrolled","ar":"Keep firm direct pressure, add more dressings on top, and call 998 if bleeding remains uncontrolled"},{"en":"Elevate the arm, release the pressure and wait ten minutes before reviewing the wound","ar":"Elevate the arm, release the pressure and wait ten minutes before reviewing the wound"}],"correct":2},{"id":"e6","mod":2,"q":{"en":"A canteen worker spills boiling water over a pupil's forearm. Which sequence is correct?","ar":"A canteen worker spills boiling water over a pupil's forearm. Which sequence is correct?"},"opts":[{"en":"Apply ice for a few minutes, then butter, and cover with a tight adhesive bandage","ar":"Apply ice for a few minutes, then butter, and cover with a tight adhesive bandage"},{"en":"Burst the blisters to release the fluid, then cover the area with fluffy cotton wool","ar":"Burst the blisters to release the fluid, then cover the area with fluffy cotton wool"},{"en":"Cover at once with a tight dressing, keep the arm raised, and cool it under water after about an hour","ar":"Cover at once with a tight dressing, keep the arm raised, and cool it under water after about an hour"},{"en":"Cool under running water for 20 minutes, remove jewellery, cover loosely with cling film and assess","ar":"Cool under running water for 20 minutes, remove jewellery, cover loosely with cling film and assess"}],"correct":3},{"id":"e7","mod":2,"q":{"en":"A student has a nosebleed which has not stopped after 25 minutes of correct pinching. What is the best next step?","ar":"A student has a nosebleed which has not stopped after 25 minutes of correct pinching. What is the best next step?"},"opts":[{"en":"Arrange medical assessment and inform the parents","ar":"Arrange medical assessment and inform the parents"},{"en":"Tip the head back, keep pinching the nose and continue like this for a further hour, swallowing any blood","ar":"Tip the head back, keep pinching the nose and continue like this for a further hour, swallowing any blood"},{"en":"Pack the nostril firmly with tissue and let the student return to the lesson","ar":"Pack the nostril firmly with tissue and let the student return to the lesson"},{"en":"Ask the student to blow the nose to clear any clot","ar":"Ask the student to blow the nose to clear any clot"}],"correct":0},{"id":"e8","mod":2,"q":{"en":"During a science lesson a student gets a dry corrosive powder on the hand and sleeve. What is the appropriate first aid?","ar":"During a science lesson a student gets a dry corrosive powder on the hand and sleeve. What is the appropriate first aid?"},"opts":[{"en":"Cover the hand and sleeve with a dry dressing to stop the powder spreading further","ar":"Cover the hand and sleeve with a dry dressing to stop the powder spreading further"},{"en":"Brush off loose powder, remove contaminated clothing and irrigate with plenty of running water for a prolonged period","ar":"Brush off loose powder, remove contaminated clothing and irrigate with plenty of running water for a prolonged period"},{"en":"Rub the skin firmly with a damp paper towel to remove the powder, then apply a soothing cream to the whole area","ar":"Rub the skin firmly with a damp paper towel to remove the powder, then apply a soothing cream to the whole area"},{"en":"Wait for the science technician to identify the substance and read its label before you start any treatment on the hand","ar":"Wait for the science technician to identify the substance and read its label before you start any treatment on the hand"}],"correct":1},{"id":"e9","mod":3,"q":{"en":"A Year 10 student lands awkwardly in basketball. The ankle is swollen and misshapen, and he cannot bear weight. What should you do?","ar":"A Year 10 student lands awkwardly in basketball. The ankle is swollen and misshapen, and he cannot bear weight. What should you do?"},"opts":[{"en":"Straighten the ankle gently to see whether it is bro function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }

const checkKey = (m, q) => m.id + ':' + q.id;

const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>

    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
