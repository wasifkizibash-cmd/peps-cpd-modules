cation or an IHP.","Agree who will carry and administer medicines, and make sure that person is \u003cstrong>trained\u003c/strong> and understands the child's plan. For complex needs, you may need to attend or arrange appropriately trained cover.","Send medicines in their original containers, in a labelled bag with the record, a copy of the IHP, and emergency contact numbers. Include emergency medicines, plus a spare where the family can supply one.","Plan for \u003cstrong>temperature\u003c/strong>: cold bags for refrigerated items, shade and insulation in hot weather.","Know the emergency plan for the venue: the route to the nearest hospital, a working phone, and 998 for an ambulance.","Record the doses given on the trip and hand the records to the clinic when back at school."],"ar":["Review the trip's participant list with the organiser \u003cstrong>early\u003c/strong>, and identify every student with medication or an IHP.","Agree who will carry and administer medicines, and make sure that person is \u003cstrong>trained\u003c/strong> and understands the child's plan. For complex needs, you may need to attend or arrange appropriately trained cover.","Send medicines in their original containers, in a labelled bag with the record, a copy of the IHP, and emergency contact numbers. Include emergency medicines, plus a spare where the family can supply one.","Plan for \u003cstrong>temperature\u003c/strong>: cold bags for refrigerated items, shade and insulation in hot weather.","Know the emergency plan for the venue: the route to the nearest hospital, a working phone, and 998 for an ambulance.","Record the doses given on the trip and hand the records to the clinic when back at school."]}},{"t":"h","c":{"en":"PE, sport and break times","ar":"PE, sport and break times"}},{"t":"p","c":{"en":"PE staff and coaches should know, at the level they need, which students have emergency medicines, where those are, and what to do. Reliever inhalers and adrenaline must go with the class to the field, court or pool, not stay in the clinic. Review needs before every sports day and every season of fixtures.","ar":"PE staff and coaches should know, at the level they need, which students have emergency medicines, where those are, and what to do. Reliever inhalers and adrenaline must go with the class to the field, court or pool, not stay in the clinic. Review needs before every sports day and every season of fixtures."}},{"t":"h","c":{"en":"Self-carry of medicines","ar":"Self-carry of medicines"}},{"t":"p","c":{"en":"Some students can safely carry and use their own medicines, particularly inhalers, adrenaline auto-injectors and glucose supplies. Agree this in the IHP with the family and student:","ar":"Some students can safely carry and use their own medicines, particularly inhalers, adrenaline auto-injectors and glucose supplies. Agree this in the IHP with the family and student:"}},{"t":"list","c":{"en":["Assess the student's maturity and ability to use the device correctly, and check technique.","Agree what is carried, where it is kept, and what happens if it is lost, forgotten or empty.","Ensure a spare is available in the clinic where possible.","Review the arrangement if there are concerns about misuse, sharing or safety. Self-carry is not suitable for every medicine or every child."],"ar":["Assess the student's maturity and ability to use the device correctly, and check technique.","Agree what is carried, where it is kept, and what happens if it is lost, forgotten or empty.","Ensure a spare is available in the clinic where possible.","Review the arrangement if there are concerns about misuse, sharing or safety. Self-carry is not suitable for every medicine or every child."]}},{"t":"h","c":{"en":"Emergency medicines and the lost inhaler","ar":"Emergency medicines and the lost inhaler"}},{"t":"callout","k":"key","title":{"en":"Emergency actions","ar":"Emergency actions"},"c":{"en":"For a child in difficulty, follow the IHP and your training, call 998 where the plan or the situation requires it, and give emergency medicines promptly. For suspected anaphylaxis, give the adrenaline auto-injector as per the child's IHP and your training, and call 998. Do not wait to see whether symptoms improve. Do not delay for a parent's permission once an IHP authorises emergency treatment. Record and inform parents afterwards.","ar":"For a child in difficulty, follow the IHP and your training, call 998 where the plan or the situation requires it, and give emergency medicines promptly. For suspected anaphylaxis, give the adrenaline auto-injector as per the child's IHP and your training, and call 998. Do not wait to see whether symptoms improve. Do not delay for a parent's permission once an IHP authorises emergency treatment. Record and inform parents afterwards."}},{"t":"p","c":{"en":"If a child's inhaler is lost or empty, do not just say \"go back to class\". Check the clinic stock and any spare, tell the parent the same day to replace it, and be alert to symptoms in the meantime.","ar":"If a child's inhaler is lost or empty, do not just say \"go back to class\". Check the clinic stock and any spare, tell the parent the same day to replace it, and be alert to symptoms in the meantime."}},{"t":"h","c":{"en":"Disposal and returning medicines to parents","ar":"Disposal and returning medicines to parents"}},{"t":"list","c":{"en":["Return \u003cstrong>unused, expired or no-longer-needed medicines to the parent or guardian\u003c/strong> wherever possible, and record what was returned, in what amount, who received it and the date.","For controlled medicines, use a witnessed handover and update the balance register.","Medicines that cannot be returned must be disposed of through a route approved by the school's policy and local health-authority guidance, never in ordinary bins or the sink, and recorded with a witness.","Use a \u003cstrong>sharps container\u003c/strong> for needles and lancets, never recapping, and replace it when it reaches the fill line. Never put sharps in general waste.","At the end of the year, clear out medicines that are not being continued, and remind parents to supply new, in-date stock."],"ar":["Return \u003cstrong>unused, expired or no-longer-needed medicines to the parent or guardian\u003c/strong> wherever possible, and record what was returned, in what amount, who received it and the date.","For controlled medicines, use a witnessed handover and update the balance register.","Medicines that cannot be returned must be disposed of through a route approved by the school's policy and local health-authority guidance, never in ordinary bins or the sink, and recorded with a witness.","Use a \u003cstrong>sharps container\u003c/strong> for needles and lancets, never recapping, and replace it when it reaches the fill line. Never put sharps in general waste.","At the end of the year, clear out medicines that are not being continued, and remind parents to supply new, in-date stock."]}},{"t":"scenario","title":{"en":"Scenario: the day trip","ar":"Scenario: the day trip"},"c":{"en":"A Year 9 trip is planned, and a student has an IHP for severe allergy. The organiser says a first-aid kit will be enough. \u003cstrong>What do you do?\u003c/strong> You explain that the student's adrenaline auto-injectors must travel with a trained adult, with a copy of the IHP and emergency contacts. You brief the trip leader, check the venue's food arrangements with the family, confirm the route to the nearest hospital, and make sure that someone knows to call 998 immediately in an emergency. You also check the device's expiry date before departure.","ar":"A Year 9 trip is planned, and a student has an IHP for severe allergy. The organiser says a first-aid kit will be enough. \u003cstrong>What do you do?\u003c/strong> You explain that the student's adrenaline auto-injectors must travel with a trained adult, with a copy of the IHP and emergency contacts. You brief the trip leader, check the venue's food arrangements with the family, confirm the route to the nearest hospital, and make sure that someone knows to call 998 immediately in an emergency. You also check the device's expiry date before departure."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> No dose without written authorisation, the original labelled container and a check that it is in date. \u003cstrong>2.\u003c/strong> Store securely, but keep emergency medicines instantly accessible. \u003cstrong>3.\u003c/strong> Verify the right child, medicine, dose, route and time every time, and restart if interrupted. \u003cstrong>4.\u003c/strong> Record at the time, factually, and report errors and near-misses honestly so the system learns. \u003cstrong>5.\u003c/strong> Plan ahead for trips, PE, self-carry and disposal, and always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.","ar":"\u003cstrong>1.\u003c/strong> No dose without written authorisation, the original labelled container and a check that it is in date. \u003cstrong>2.\u003c/strong> Store securely, but keep emergency medicines instantly accessible. \u003cstrong>3.\u003c/strong> Verify the right child, medicine, dose, route and time every time, and restart if interrupted. \u003cstrong>4.\u003c/strong> Record at the time, factually, and report errors and near-misses honestly so the system learns. \u003cstrong>5.\u003c/strong> Plan ahead for trips, PE, self-carry and disposal, and always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions."}}],"checks":[{"id":"m6q1","q":{"en":"A student with an IHP for severe allergy is going on a day trip. What is the best arrangement?","ar":"A student with an IHP for severe allergy is going on a day trip. What is the best arrangement?"},"opts":[{"en":"A general first-aid kit carried by the trip leader is sufficient for every student on the trip, whatever their needs","ar":"A general first-aid kit carried by the trip leader is sufficient for every student on the trip, whatever their needs"},{"en":"The student leaves the injector in the clinic, as the venue will have its own","ar":"The student leaves the injector in the clinic, as the venue will have its own"},{"en":"The parent is asked to follow the coach by car with the injector in their bag","ar":"The parent is asked to follow the coach by car with the injector in their bag"},{"en":"Emergency medicines travel with a trained adult, plus the IHP, contacts and an expiry check","ar":"Emergency medicines travel with a trained adult, plus the IHP, contacts and an expiry check"}],"correct":3,"expl":{"en":"Emergency medicines must be immediately available to someone trained to use them. The IHP and contacts must go too.","ar":"Emergency medicines must be immediately available to someone trained to use them. The IHP and contacts must go too."}},{"id":"m6q2","q":{"en":"What is the safest approach for unused medicine at the end of a student's treatment?","ar":"What is the safest approach for unused medicine at the end of a student's treatment?"},"opts":[{"en":"Return it to the parent and record the amount handed over and who received it","ar":"Return it to the parent and record the amount handed over and who received it"},{"en":"Pour it down the clinic sink and rinse the bottle before recycling it","ar":"Pour it down the clinic sink and rinse the bottle before recycling it"},{"en":"Keep it in the clinic as general spare stock to use for other students later","ar":"Keep it in the clinic as general spare stock to use for other students later"},{"en":"Give it to another student who has a similar need and no medicine of their own","ar":"Give it to another student who has a similar need and no medicine of their own"}],"correct":0,"expl":{"en":"Returning medicine to the parent with a record is the standard route. Never use one child's medicine for another.","ar":"Returning medicine to the parent with a record is the standard route. Never use one child's medicine for another."}},{"id":"m6q3","q":{"en":"A secondary student is happy to carry their own inhaler. What should the nurse do?","ar":"A secondary student is happy to carry their own inhaler. What should the nurse do?"},"opts":[{"en":"Allow it without discussion, as older students are always able to manage safely","ar":"Allow it without discussion, as older students are always able to manage safely"},{"en":"Agree self-carry through the IHP, check technique, and plan for loss or an empty device","ar":"Agree self-carry through the IHP, check technique, and plan for loss or an empty device"},{"en":"Refuse it, because students may never carry any medicines on school premises","ar":"Refuse it, because students may never carry any medicines on school premises"},{"en":"Let the student share it with friends when they need it, to keep everyone included","ar":"Let the student share it with friends when they need it, to keep everyone included"}],"correct":1,"expl":{"en":"Self-carry can be safe and empowering for many students if agreed with the family, supported by technique checks and a plan for problems.","ar":"Self-carry can be safe and empowering for many students if agreed with the family, supported by technique checks and a plan for problems."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A parent's signed request is present, but the medicine has been poured into an unlabelled bottle. What do you do?","ar":"A parent's signed request is present, but the medicine has been poured into an unlabelled bottle. What do you do?"},"opts":[{"en":"Give it, since the parent's signature on the form already shows consent to the medicine being given","ar":"Give it, since the parent's signature on the form already shows consent to the medicine being given"},{"en":"Label it yourself from the form details and then use it for the child","ar":"Label it yourself from the form details and then use it for the child"},{"en":"Do not give it; ask the parent to supply it in its original dispensing container","ar":"Do not give it; ask the parent to supply it in its original dispensing container"},{"en":"Give a smaller amount than the form states, to be on the safe side","ar":"Give a smaller amount than the form states, to be on the safe side"}],"correct":2},{"id":"e2","mod":1,"q":{"en":"Which of these is acceptable authorisation for a first dose of a prescribed medicine?","ar":"Which of these is acceptable authorisation for a first dose of a prescribed medicine?"},"opts":[{"en":"A message passed on by the student's friend, who says the parent agreed this morning and signed nothing","ar":"A message passed on by the student's friend, who says the parent agreed this morning and signed nothing"},{"en":"A phone call from an unidentified number claiming to be the parent","ar":"A phone call from an unidentified number claiming to be the parent"},{"en":"A handwritten note without a signature, in a container with no label","ar":"A handwritten note without a signature, in a container with no label"},{"en":"A signed parental request plus the prescriber's instruction on a labelled original container","ar":"A signed parental request plus the prescriber's instruction on a labelled original container"}],"correct":3},{"id":"e3","mod":1,"q":{"en":"A Year 11 student and their parents disagree about whether the student should carry a medicine. What is the best step?","ar":"A Year 11 student and their parents disagree about whether the student should carry a medicine. What is the best step?"},"opts":[{"en":"Do not decide alone; involve senior leadership and the prescriber, and record it","ar":"Do not decide alone; involve senior leadership and the prescriber, and record it"},{"en":"Side with the student and keep the arrangement private from the parents","ar":"Side with the student and keep the arrangement private from the parents"},{"en":"Side with the parents and arrange it without hearing the student's view","ar":"Side with the parents and arrange it without hearing the student's view"},{"en":"Let the student decide for themselves and ask the nurse to keep it quiet","ar":"Let the student decide for themselves and ask the nurse to keep it quiet"}],"correct":0},{"id":"e4","mod":2,"q":{"en":"An emergency auto-injector is found locked in a cabinet whose key holder is off site. What is the learning point?","ar":"An emergency auto-injector is found locked in a cabinet whose key holder is off site. What is the learning point?"},"opts":[{"en":"Locking emergency medicines away is always best practice for the school","ar":"Locking emergency medicines away is always best practice for the school"},{"en":"Emergency medicines must be quickly accessible and every adult must know where they are","ar":"Emergency medicines must be quickly accessible and every adult must know where they are"},{"en":"Only the Principal should hold the key, so no one else can open the cabinet","ar":"Only the Principal should hold the key, so no one else can open the cabinet"},{"en":"Auto-injectors do not need to be located in advance, as staff can search the clinic when needed","ar":"Auto-injectors do not need to be located in advance, as staff can search the clinic when needed"}],"correct":1},{"id":"e5","mod":2,"q":{"en":"The medicine fridge has been out of range over a long weekend. A student's refrigerated medicine is due. What is correct?","ar":"The medicine fridge has been out of range over a long weekend. A student's refrigerated medicine is due. What is correct?"},"opts":[{"en":"Use it, since it looks and smells normal and nothing seems to have changed","ar":"Use it, since it looks and smells normal and nothing seems to have changed"},{"en":"Give a slightly larger amount to compensate for any possible loss of strength","ar":"Give a slightly larger amount to compensate for any possible loss of strength"},{"en":"Quarantine it, seek pharmacist or prescriber advice, inform the parent, and record it","ar":"Quarantine it, seek pharmacist or prescriber advice, inform the parent, and record it"},{"en":"Move it to the staff-room fridge, which holds a steadier temperature","ar":"Move it to the staff-room fridge, which holds a steadier temperature"}],"correct":2},{"id":"e6","mod":2,"q":{"en":"A controlled medicine's register shows one fewer than the count on the shelf. What should you do?","ar":"A controlled medicine's register shows one fewer than the count on the shelf. What should you do?"},"opts":[{"en":"Adjust the register quietly to match the shelf count and move on without telling anyone else","ar":"Adjust the register quietly to match the shelf count and move on without telling anyone else"},{"en":"Wait a month to see whether the count resolves itself before reporting","ar":"Wait a month to see whether the count resolves itself before reporting"},{"en":"Ask the parent to correct the register entry when they next visit","ar":"Ask the parent to correct the register entry when they next visit"},{"en":"Report the discrepancy at once to leadership, without altering the register to match","ar":"Report the discrepancy at once to leadership, without altering the register to match"}],"correct":3},{"id":"e7","mod":3,"q":{"en":"Two students have the same first name and different medicines. Which precaution is best?","ar":"Two students have the same first name and different medicines. Which precaution is best?"},"opts":[{"en":"Verify full name and class, check photo and label, and flag both records with an alert","ar":"Verify full name and class, check photo and label, and flag both records with an alert"},{"en":"Rely on the child's confident answer about who they are and which tablet they take","ar":"Rely on the child's confident answer about who they are and which tablet they take"},{"en":"Call them by first name only and give whichever medicine answers first","ar":"Call them by first name only and give whichever medicine answers first"},{"en":"Let the older child take both tablets and collect the record later","ar":"Let the older child take both tablets and collect the record later"}],"correct":0},{"id":"e8","mod":3,"q":{"en":"Which sequence best reflects a safe administration routine?","ar":"Which sequence best reflects a safe administration routine?"},"opts":[{"en":"Give the dose first to save time, then check the record and label later","ar":"Give the dose first to save time, then check the record and label later"},{"en":"Check record and label, verify the child, give the dose, watch it taken, then record","ar":"Check record and label, verify the child, give the dose, watch it taken, then record"},{"en":"Pre-sign the record to save time, then give the dose and watch it taken","ar":"Pre-sign the record to save time, then give the dose and watch it taken"},{"en":"Leave the dose with the child to take later and record it at the end of the school day","ar":"Leave the dose with the child to take later and record it at the end of the school day"}],"correct":1},{"id":"e9","mod":3,"q":{"en":"The label, the record and the child's description of the medicine do not agree. What is the correct action?","ar":"The label, the record and the child's description of the medicine do not agree. What is the correct action?"},"opts":[{"en":"Go with the child's account of what the medicine is and how much to take","ar":"Go with the child's account of what the medicine is and how much to take"},{"en":"Give the lower dose that appears on either document, to be on the safe side","ar":"Give the lower dose that appears on either document, to be on the safe side"},{"en":"Stop, do not give it, and clarify with the parent, prescriber or pharmacist","ar":"Stop, do not give it, and clarify with the parent, prescriber or pharmacist"},{"en":"Give it as the record states and sort out the label and paperwork afterwards","ar":"Give it as the record states and sort out the label and paperwork afterwards"}],"correct":2},{"id":"e10","mod":3,"q":{"en":"A parent phones to say a medicine's timing should change from tomorrow. How do you respond?","ar":"A parent phones to say a medicine's timing should change from tomorrow. How do you respond?"},"opts":[{"en":"Make the change at once on the parent's word and tell the parent it is done, noting it later on the record","ar":"Make the change at once on the parent's word and tell the parent it is done, noting it later on the record"},{"en":"Ask the student to confirm the change, and follow what the student reports","ar":"Ask the student to confirm the change, and follow what the student reports"},{"en":"Give both the old and new doses, so that nothing is missed during the change","ar":"Give both the old and new doses, so that nothing is missed during the change"},{"en":"Explain that the prescriber's written instruction and a signed request are needed first","ar":"Explain that the prescriber's written instruction and a signed request are needed first"}],"correct":3},{"id":"e11","mod":4,"q":{"en":"Why must a corrected entry in the medication record still be readable?","ar":"Why must a corrected entry in the medication record still be readable?"},"opts":[{"en":"So the original and the correction are both traceable, with who changed it and when","ar":"So the original and the correction are both traceable, with who changed it and when"},{"en":"So the record looks tidy and neat for any visiting inspector, auditor or parent who reads it","ar":"So the record looks tidy and neat for any visiting inspector, auditor or parent who reads it"},{"en":"So the parent can later change the entry if they disagree with it","ar":"So the parent can later change the entry if they disagree with it"},{"en":"So the nurse is no longer personally responsible for the original entry","ar":"So the nurse is no longer personally responsible for the original entry"}],"correct":0},{"id":"e12","mod":4,"q":{"en":"Another parent asks you what medicine a classmate takes. What is the right reply?","ar":"Another parent asks you what medicine a classmate takes. What is the right reply?"},"opts":[{"en":"Share it, because the two sets of parents are friends and would not mind","ar":"Share it, because the two sets of parents are friends and would not mind"},{"en":"Decline to share any other child's health information","ar":"Decline to share any other child's health information"},{"en":"Give a brief hint, without naming the medicine or the condition","ar":"Give a brief hint, without naming the medicine or the condition"},{"en":"Tell them to ask the other child directly, as they are classmates","ar":"Tell them to ask the other child directly, as they are classmates"}],"correct":1},{"id":"e13","mod":4,"q":{"en":"You gave a dose but forgot to record it and a colleague is about to repeat it. What do you do first?","ar":"You gave a dose but forgot to record it and a colleague is about to repeat it. What do you do first?"},"opts":[{"en":"Allow the second dose to go ahead and sign the record for both doses","ar":"Allow the second dose to go ahead and sign the record for both doses"},{"en":"Backdate the entry so that the record looks as though it was made on time","ar":"Backdate the entry so that the record looks as though it was made on time"},{"en":"Stop the repeat dose, confirm the first dose, make a marked late entry, and report the near-miss","ar":"Stop the repeat dose, confirm the first dose, make a marked late entry, and report the near-miss"},{"en":"Say nothing, hope the record catches up, and watch the child closely for the rest of the afternoon","ar":"Say nothing, hope the record catches up, and watch the child closely for the rest of the afternoon"}],"correct":2},{"id":"e14","mod":4,"q":{"en":"Where should medication records be kept and shared?","ar":"Where should medication records be kept and shared?"},"opts":[{"en":"On a personal phone for convenience, so records can be checked anywhere","ar":"On a personal phone for convenience, so records can be checked anywhere"},{"en":"In a staff WhatsApp group, so that all colleagues can see updates quickly","ar":"In a staff WhatsApp group, so that all colleagues can see updates quickly"},{"en":"On an open desk in the clinic, so the latest sheet is always visible","ar":"On an open desk in the clinic, so the latest sheet is always visible"},{"en":"In locked or approved systems, shared on a need-to-know basis","ar":"In locked or approved systems, shared on a need-to-know basis"}],"correct":3},{"id":"e15","mod":5,"q":{"en":"A student is given another child's medicine by mistake. After checking the child's condition, what next?","ar":"A student is given another child's medicine by mistake. After checking the child's condition, what next?"},"opts":[{"en":"Seek clinical advice, inform parents and leadership honestly, record and report","ar":"Seek clinical advice, inform parents and leadership honestly, record and report"},{"en":"Say nothing to the family unless symptoms appear later in the day","ar":"Say nothing to the family unless symptoms appear later in the day"},{"en":"Ask the students to keep it between themselves to avoid upsetting anyone","ar":"Ask the students to keep it between themselves to avoid upsetting anyone"},{"en":"Correct the record quietly so it shows the right child received the dose","ar":"Correct the record quietly so it shows the right child received the dose"}],"correct":0},{"id":"e16","mod":5,"q":{"en":"A near-miss is caught before the dose is given. What is the best response?","ar":"A near-miss is caught before the dose is given. What is the best response?"},"opts":[{"en":"Forget it because no harm occurred and no one else knew about it","ar":"Forget it because no harm occurred and no one else knew about it"},{"en":"Record and report it and look for the system causes so it is less likely to recur","ar":"Record and report it and look for the     case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;

    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>

    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
