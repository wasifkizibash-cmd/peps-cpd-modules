#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

  .layout{grid-template-columns:1fr;padding:16px 14px 60px}

  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}

  .side-toggle{cursor:pointer;margin:0;padding:8px}

  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}

  h1{font-size:26px} h2{font-size:22px}

}

  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"nurse-medication","code":"NMD","passMark":80,"hours":"1.5 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · School Nursing · Medication","ar":"Staff CPD · School Nursing · Medication"},"title":{"en":"Medication Management in School","ar":"Medication Management in School"},"subtitle":{"en":"A self-paced module for the school nurse on handling medicines safely in a Years 1-13 school: consent and written authorisation, storage, administration checks, records, errors and near-misses, and medicines on trips, in PE and in emergencies.","ar":"A self-paced module for the school nurse on handling medicines safely in a Years 1-13 school: consent and written authorisation, storage, administration checks, records, errors and near-misses, and medicines on trips, in PE and in emergencies."},"durationLabel":{"en":"About 1.5 hours, fully self-paced","ar":"About 1.5 hours, fully self-paced"},"standard":{"en":"School nursing practice · Safe medicines management in schools","ar":"School nursing practice · Safe medicines management in schools"},"source":{"en":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)","ar":"Current international good practice for school nursing, UAE emergency and health-authority guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Principles, Consent and Written Authorisation","ar":"Principles, Consent and Written Authorisation"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and scope","ar":"Purpose and scope"},"c":{"en":"This CPD supports the nurse in managing medicines safely for students aged about 5 to 18. By the end you will be able to: check that a medicine is properly authorised before it is accepted; store it correctly; administer it with the right checks; record it accurately; respond to errors, near-misses and refusals; and plan for trips, PE, emergencies and the return of medicines to parents. Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions.","ar":"This CPD supports the nurse in managing medicines safely for students aged about 5 to 18. By the end you will be able to: check that a medicine is properly authorised before it is accepted; store it correctly; administer it with the right checks; record it accurately; respond to errors, near-misses and refusals; and plan for trips, PE, emergencies and the return of medicines to parents. Always follow the child's IHP and the school's own procedures; this CPD supports, and does not replace, your professional training, scope of practice and licence conditions."}},{"t":"h","c":{"en":"Why a clear framework matters","ar":"Why a clear framework matters"}},{"t":"p","c":{"en":"A school is not a ward. Medicines arrive in school bags, are held in a clinic by one nurse, and are given to children who may be anxious, distracted, or in a hurry to get back to class. The framework below exists so that the same safe decision is made whether you are fresh at 7.30 am or interrupted at 1.40 pm on a busy day.","ar":"A school is not a ward. Medicines arrive in school bags, are held in a clinic by one nurse, and are given to children who may be anxious, distracted, or in a hurry to get back to class. The framework below exists so that the same safe decision is made whether you are fresh at 7.30 am or interrupted at 1.40 pm on a busy day."}},{"t":"list","c":{"en":["\u003cstrong>Need.\u003c/strong> Is the medicine genuinely needed during school hours? Doses that can be given safely at home, before or after school, should usually stay at home. Ask the family and, if unclear, the prescriber.","\u003cstrong>Authorisation.\u003c/strong> Written parental or guardian consent plus the prescriber's written instruction (on the label or in the IHP) are in place before the first dose.","\u003cstrong>Safety.\u003c/strong> The medicine is in date, in its original container, labelled for this child, and stored correctly.","\u003cstrong>Accountability.\u003c/strong> Every dose given, refused or missed is recorded, and any problem is reported and learned from."],"ar":["\u003cstrong>Need.\u003c/strong> Is the medicine genuinely needed during school hours? Doses that can be given safely at home, before or after school, should usually stay at home. Ask the family and, if unclear, the prescriber.","\u003cstrong>Authorisation.\u003c/strong> Written parental or guardian consent plus the prescriber's written instruction (on the label or in the IHP) are in place before the first dose.","\u003cstrong>Safety.\u003c/strong> The medicine is in date, in its original container, labelled for this child, and stored correctly.","\u003cstrong>Accountability.\u003c/strong> Every dose given, refused or missed is recorded, and any problem is reported and learned from."]}},{"t":"h","c":{"en":"Written authorisation: what to have before the first dose","ar":"Written authorisation: what to have before the first dose"}},{"t":"p","c":{"en":"Never accept a verbal request, a message passed by a child, or a note with no signature. The school's medication policy sets the exact form; in general you should hold:","ar":"Never accept a verbal request, a message passed by a child, or a note with no signature. The school's medication policy sets the exact form; in general you should hold:"}},{"t":"list","c":{"en":["A signed request from a parent or guardian giving the child's full name, year and section, and the medicine's name, strength, route, timing and the reason it is needed.","The medicine in its \u003cstrong>original pharmacy container\u003c/strong> with the dispensing label showing the child's name, medicine, strength, directions and expiry. Never accept medicine decanted into another container, or a loose tablet in an envelope.","For long-term or complex needs, an \u003cstrong>Individual Healthcare Plan (IHP)\u003c/strong> agreed with the family and, where appropriate, the treating clinician.","Up-to-date emergency contact numbers for the parents or guardians."],"ar":["A signed request from a parent or guardian giving the child's full name, year and section, and the medicine's name, strength, route, timing and the reason it is needed.","The medicine in its \u003cstrong>original pharmacy container\u003c/strong> with the dispensing label showing the child's name, medicine, strength, directions and expiry. Never accept medicine decanted into another container, or a loose tablet in an envelope.","For long-term or complex needs, an \u003cstrong>Individual Healthcare Plan (IHP)\u003c/strong> agreed with the family and, where appropriate, the treating clinician.","Up-to-date emergency contact numbers for the parents or guardians."]}},{"t":"callout","k":"warn","title":{"en":"Non-prescribed medicines","ar":"Non-prescribed medicines"},"c":{"en":"Treat over-the-counter medicines with the same discipline as prescribed ones: written consent, original packaging, the manufacturer's directions followed, and a check that the child has not already had a dose at home. Do not give a first-ever dose of any medicine without parental knowledge, and never give a student's medicine to another student. Never give aspirin-containing products to a child unless a prescriber has specifically directed it.","ar":"Treat over-the-counter medicines with the same discipline as prescribed ones: written consent, original packaging, the manufacturer's directions followed, and a check that the child has not already had a dose at home. Do not give a first-ever dose of any medicine without parental knowledge, and never give a student's medicine to another student. Never give aspirin-containing products to a child unless a prescriber has specifically directed it."}},{"t":"h","c":{"en":"Consent, capacity and the older student","ar":"Consent, capacity and the older student"}},{"t":"p","c":{"en":"Parental consent is the default for children. Older students often take medicines independently at home and may wish to carry them. Involve them in the decision: explain what the medicine is for, listen to their view, and agree the plan with the family. Where a student's wishes and the parents' wishes differ, or you are unsure what is appropriate, do not decide alone. Speak to the Principal or senior leadership and the prescriber, and record the discussion.","ar":"Parental consent is the default for children. Older students often take medicines independently at home and may wish to carry them. Involve them in the decision: explain what the medicine is for, listen to their view, and agree the plan with the family. Where a student's wishes and the parents' wishes differ, or you are unsure what is appropriate, do not decide alone. Speak to the Principal or senior leadership and the prescriber, and record the discussion."}},{"t":"scenario","title":{"en":"Scenario: the verbal request","ar":"Scenario: the verbal request"},"c":{"en":"At 7.45 am a Year 4 student hands you a bottle of liquid medicine and says, \"Mummy says I need two spoons at lunch.\" There is no note, and the pharmacy label has been partly peeled off. \u003cstrong>What do you do?\u003c/strong> You do not give it. You keep the medicine safely, phone the parent to establish what is needed, and ask for a signed request and the correctly labelled container. If the child needs a dose at lunch and cannot have it, you tell the parent promptly so they can make an alternative plan. You document the contact. A child's report is never authorisation.","ar":"At 7.45 am a Year 4 student hands you a bottle of liquid medicine and says, \"Mummy says I need two spoons at lunch.\" There is no note, and the pharmacy label has been partly peeled off. \u003cstrong>What do you do?\u003c/strong> You do not give it. You keep the medicine safely, phone the parent to establish what is needed, and ask for a signed request and the correctly labelled container. If the child needs a dose at lunch and cannot have it, you tell the parent promptly so they can make an alternative plan. You document the contact. A child's report is never authorisation."}},{"t":"callout","k":"tip","title":{"en":"Practical habit","ar":"Practical habit"},"c":{"en":"Build a short \u003cstrong>acceptance checklist\u003c/strong> for the clinic door: signed request, original labelled container, in date, IHP if needed, parent contact confirmed. If any item is missing, the medicine is not accepted for administration until it is fixed.","ar":"Build a short \u003cstrong>acceptance checklist\u003c/strong> for the clinic door: signed request, original labelled container, in date, IHP if needed, parent contact confirmed. If any item is missing, the medicine is not accepted for administration until it is fixed."}}],"checks":[{"id":"m1q1","q":{"en":"A student brings a medicine to the clinic with a verbal message from a parent but no signed request. What is the correct response?","ar":"A student brings a medicine to the clinic with a verbal message from a parent but no signed request. What is the correct response?"},"opts":[{"en":"Hold the medicine safely, contact the parent, and get written authorisation before any dose","ar":"Hold the medicine safely, contact the parent, and get written authorisation before any dose"},{"en":"Give the usual dose, since the child clearly knows what it is for and the label looks right","ar":"Give the usual dose, since the child clearly knows what it is for and the label looks right"},{"en":"Give half the usual dose as a precaution until the parent can be reached to confirm","ar":"Give half the usual dose as a precaution until the parent can be reached to confirm"},{"en":"Return it to the child's bag and let them manage it themselves until the form arrives","ar":"Return it to the child's bag and let them manage it themselves until the form arrives"}],"correct":0,"expl":{"en":"Written authorisation is required before the first dose. A child's message is never sufficient, and you should follow up promptly so the child is not left without needed treatment.","ar":"Written authorisation is required before the first dose. A child's message is never sufficient, and you should follow up promptly so the child is not left without needed treatment."}},{"id":"m1q2","q":{"en":"A parent sends loose tablets in a small envelope with the child's name written on it. Why should you not accept them?","ar":"A parent sends loose tablets in a small envelope with the child's name written on it. Why should you not accept them?"},"opts":[{"en":"Tablets are never allowed in school, so all of them must be sent home with the child","ar":"Tablets are never allowed in school, so all of them must be sent home with the child"},{"en":"They are not in the original container, so the medicine and directions cannot be verified","ar":"They are not in the original container, so the medicine and directions cannot be verified"},{"en":"Envelopes cannot be stored in a locked cabinet, so the medicine cannot be kept secure","ar":"Envelopes cannot be stored in a locked cabinet, so the medicine cannot be kept secure"},{"en":"Only liquid medicines in a bottle may be given by a school nurse during the school day, never tablets","ar":"Only liquid medicines in a bottle may be given by a school nurse during the school day, never tablets"}],"correct":1,"expl":{"en":"Original, labelled pharmacy packaging is how you verify the right medicine, strength, child and directions. Without it the identity of the tablets cannot be confirmed.","ar":"Original, labelled pharmacy packaging is how you verify the right medicine, strength, child and directions. Without it the identity of the tablets cannot be confirmed."}},{"id":"m1q3","q":{"en":"Which situation most clearly calls for an Individual Healthcare Plan rather than a simple medicine request?","ar":"Which situation most clearly calls for an Individual Healthcare Plan rather than a simple medicine request?"},"opts":[{"en":"A student who needs a single dose of a mild painkiller at lunch on one day only","ar":"A student who needs a single dose of a mild painkiller at lunch on one day only"},{"en":"A student finishing a short course of antibiotics with doses that can be given at home","ar":"A student finishing a short course of antibiotics with doses that can be given at home"},{"en":"A student with a long-term condition whose medicine may be needed urgently","ar":"A student with a long-term condition whose medicine may be needed urgently"},{"en":"A student who has forgotten a non-medicated lip balm and sunscreen at home","ar":"A student who has forgotten a non-medicated lip balm and sunscreen at home"}],"correct":2,"expl":{"en":"IHPs are for long-term or complex needs where action may depend on symptoms, such as asthma, diabetes, epilepsy or severe allergy. Simple short-term medicines usually need only a signed request.","ar":"IHPs are for long-term or complex needs where action may depend on symptoms, such as asthma, diabetes, epilepsy or severe allergy. Simple short-term medicines usually need only a signed request."}}]},{"id":"m2","title":{"en":"Safe Storage, Controlled and Emergency Medicines, Expiry and Cold Chain","ar":"Safe Storage, Controlled and Emergency Medicines, Expiry and Cold Chain"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Safe storage protects children from taking the wrong medicine, protects medicines from losing their effect, and protects the school from loss or misuse. Storage decisions are clinical decisions, not tidy-up tasks.","ar":"Safe storage protects children from taking the wrong medicine, protects medicines from losing their effect, and protects the school from loss or misuse. Storage decisions are clinical decisions, not tidy-up tasks."}},{"t":"h","c":{"en":"Basic storage standards","ar":"Basic storage standards"}},{"t":"list","c":{"en":["Keep medicines in a \u003cstrong>locked cupboard or locked drawer\u003c/strong> in the clinic, away from children and from heat, direct sunlight and damp.","Store \u003cstrong>each child's medicine separately\u003c/strong> and clearly labelled, in its original container, with the consent form or authorisation easily matched to it.","Keep \u003cstrong>keys\u003c/strong> under the nurse's control with a clear plan for who holds them when you are absent. Do not leave keys in the lock or on a shared hook.","Keep external medicines (creams, drops) separate from oral medicines, to reduce picking up the wrong one.","Never store food or drink in a medicine cupboard or fridge used for medicines."],"ar":["Keep medicines in a \u003cstrong>locked cupboard or locked drawer\u003c/strong> in the clinic, away from children and from heat, direct sunlight and damp.","Store \u003cstrong>each child's medicine separately\u003c/strong> and clearly labelled, in its original container, with the consent form or authorisation easily matched to it.","Keep \u003cstrong>keys\u003c/strong> under the nurse's control with a clear plan for who holds them when you are absent. Do not leave keys in the lock or on a shared hook.","Keep external medicines (creams, drops) separate from oral medicines, to reduce picking up the wrong one.","Never store food or drink in a medicine cupboard or fridge used for medicines."]}},{"t":"h","c":{"en":"Emergency medicines must be accessible, not locked away","ar":"Emergency medicines must be accessible, not locked away"}},{"t":"p","c":{"en":"Some medicines must be reachable in seconds: reliever inhalers, adrenaline auto-injectors, glucose for hypoglycaemia, and any emergency medicine named in an IHP. These are kept \u003cstrong>in a known, unlocked or quickly accessible place\u003c/strong>, clearly labelled, with every relevant adult knowing where they are. A locked cabinet with the key in a drawer is a delay that a child in anaphylaxis cannot afford.","ar":"Some medicines must be reachable in seconds: reliever inhalers, adrenaline auto-injectors, glucose for hypoglycaemia, and any emergency medicine named in an IHP. These are kept \u003cstrong>in a known, unlocked or quickly accessible place\u003c/strong>, clearly labelled, with every relevant adult knowing where they are. A locked cabinet with the key in a drawer is a delay that a child in anaphylaxis cannot afford."}},{"t":"callout","k":"warn","title":{"en":"Never delay emergency treatment","ar":"Never delay emergency treatment"},"c":{"en":"If a child's IHP says an emergency medicine is needed, retrieve it at once and call 998 as the plan and your training direct. Do not stop to find a key, complete a form, or phone a parent first. Record afterwards.","ar":"If a child's IHP says an emergency medicine is needed, retrieve it at once and call 998 as the plan and your training direct. Do not stop to find a key, complete a form, or phone a parent first. Record afterwards."}},{"t":"h","c":{"en":"Controlled and high-risk medicines","ar":"Controlled and high-risk medicines"}},{"t":"p","c":{"en":"Some prescribed medicines are controlled or carry a higher risk of misuse or harm. In the UAE, strict rules apply to controlled medicines. Follow current UAE health-authority guidance and the school's medication policy. In practice this usually means:","ar":"Some prescribed medicines are controlled or carry a higher risk of misuse or harm. In the UAE, strict rules apply to controlled medicines. Follow current UAE health-authority guidance and the school's medication policy. In practice this usually means:"}},{"t":"list","c":{"en":["Store them in a separately locked container within the locked medicine cupboard, with restricted key access.","Keep a \u003cstrong>running balance register\u003c/strong>: every receipt, dose and return is entered and the stock is counted regularly, with a second person witnessing where the school's policy requires it.","Investigate and escalate any discrepancy at once to the Principal or senior leadership; do not adjust the count to make it look right.","Return unused supplies to the parent or guardian with a signed, witnessed record of the amount handed over."],"ar":["Store them in a separately locked container within the locked medicine cupboard, with restricted key access.","Keep a \u003cstrong>running balance register\u003c/strong>: every receipt, dose and return is entered and the stock is counted regularly, with a second person witnessing where the school's policy requires it.","Investigate and escalate any discrepancy at once to the Principal or senior leadership; do not adjust the count to make it look right.","Return unused supplies to the parent or guardian with a signed, witnessed record of the amount handed over."]}},{"t":"h","c":{"en":"Expiry dates and stock checks","ar":"Expiry dates and stock checks"}},{"t":"p","c":{"en":"Check dates when a medicine is received, and then on a fixed schedule (for example, monthly for the whole stock and every term for emergency items). Note the expiry on a visible list so that replacements are requested in good time, not on the day a child needs them. Expired medicine is never given. Tell the parent in writing, return it, and ask for a replacement. Some products have a short shelf life once opened, so write the date of opening on the container where this applies.","ar":"Check dates when a medicine is received, and then on a fixed schedule (for example, monthly for the whole stock and every term for emergency items). Note the expiry on a visible list so that replacements are requested in good time, not on the day a child needs them. Expired medicine is never given. Tell the parent in writing, return it, and ask for a replacement. Some products have a short shelf life once opened, so write the date of opening on the container where this applies."}},{"t":"h","c":{"en":"Cold chain","ar":"Cold chain"}},{"t":"p","c":{"en":"Some medicines (certain insulins and other refrigerated products) must be stored at the temperature on the label. Use a \u003cstrong>dedicated medicine fridge\u003c/strong>, not a food fridge, with a thermometer that shows current, minimum and maximum temperatures. Record the reading at least once each school day, and act on out-of-range readings.","ar":"Some medicines (certain insulins and other refrigerated products) must be stored at the temperature on the label. Use a \u003cstrong>dedicated medicine fridge\u003c/strong>, not a food fridge, with a thermometer that shows current, minimum and maximum temperatures. Record the reading at least once each school day, and act on out-of-range readings."}},{"t":"table","head":{"en":["Situation","What to do"],"ar":["Situation","What to do"]},"rows":[{"en":["Fridge reading is outside the labelled range","Do not use the affected medicines until you have checked the manufacturer's guidance or advice from a pharmacist or prescriber. Quarantine, label and record the event."],"ar":["Fridge reading is outside the labelled range","Do not use the affected medicines until you have checked the manufacturer's guidance or advice from a pharmacist or prescriber. Quarantine, label and record the event."]},{"en":["Power failure over a weekend or holiday","On return, check the minimum and maximum readings before using any product, and follow the same quarantine and advice steps."],"ar":["Power failure over a weekend or holiday","On return, check the minimum and maximum readings before using any product, and follow the same quarantine and advice steps."]},{"en":["Medicine left in a hot car or sunny windowsill","Treat as compromised. Do not give it; seek advice and arrange a replacement."],"ar":["Medicine left in a hot car or sunny windowsill","Treat as compromised. Do not give it; seek advice and arrange a replacement."]}]},{"t":"scenario","title":{"en":"Scenario: the warm fridge","ar":"Scenario: the warm fridge"},"c":{"en":"On Monday you find the medicine fridge's maximum reading has been above the labelled range since Friday, and a student's refrigerated medicine is due this morning. \u003cstrong>What now?\u003c/strong> You do not give it on the assumption that it is probably fine. You quarantine and label the medicine, contact the pharmacist or prescriber for advice, inform the parent so a replacement can be arranged, and record the event. You also tell the Principal or senior leadership so that the fault is fixed. If the child's health depends on the dose, explain the urgency to the parent and prescriber so they can act today.","ar":"On Monday you find the medicine fridge's maximum reading has been above the labelled range since Friday, and a student's refrigerated medicine is due this morning. \u003cstrong>What now?\u003c/strong> You do not give it on the assumption that it is probably fine. You quarantine and label the medicine, contact the pharmacist or prescriber for advice, inform the parent so a replacement can be arranged, and record the event. You also tell the Principal or senior leadership so that the fault is fixed. If the child's health depends on the dose, explain the urgency to the parent and prescriber so they can act today."}}],"checks":[{"id":"m2q1","q":{"en":"Where should a child's reliever inhaler or adrenaline auto-injector be kept?","ar":"Where should a child's reliever inhaler or adrenaline auto-injector be kept?"},"opts":[{"en":"In the principal's office safe, where only one named key holder can open it","ar":"In the principal's office safe, where only one named key holder can open it"},{"en":"In the child's classroom bin, so that it is somewhere out of sight and safe","ar":"In the child's classroom bin, so that it is somewhere out of sight and safe"},{"en":"In the clinic fridge alongside refrigerated medicines, behind a locked door","ar":"In the clinic fridge alongside refrigerated medicines, behind a locked door"},{"en":"In a labelled, quickly accessible place that all relevant adults know","ar":"In a labelled, quickly accessible place that all relevant adults know"}],"correct":3,"expl":{"en":"Emergency medicines must be reachable within seconds. Secure storage must not create delays that put a child at risk.","ar":"Emergency medicines must be reachable within seconds. Secure storage must not create delays that put a child at risk."}},{"id":"m2q2","q":{"en":"You find a student's medicine is past its expiry date. What is the correct action?","ar":"You find a student's medicine is past its expiry date. What is the correct action?"},"opts":[{"en":"Do not give it, tell the parent in writing, and ask for an in-date replacement","ar":"Do not give it, tell the parent in writing, and ask for an in-date replacement"},{"en":"Give it as normal, since it was authorised and the label is otherwise correct and clear","ar":"Give it as normal, since it was authorised and the label is otherwise correct and clear"},{"en":"Double the dose to make up for the reduced strength of the old medicine","ar":"Double the dose to make up for the reduced strength of the old medicine"},{"en":"Throw it away in the clinic bin without telling the parent, to avoid worry","ar":"Throw it away in the clinic bin without telling the parent, to avoid worry"}],"correct":0,"expl":{"en":"Expired medicine is never given. The parent must know so a replacement is arranged and the child is not left without treatment.","ar":"Expired medicine is never given. The parent must know so a replacement is arranged and the child is not left without treatment."}},{"id":"m2q3","q":{"en":"Why is a dedicated medicine fridge with a minimum and maximum thermometer important?","ar":"Why is a dedicated medicine fridge with a minimum and maximum thermometer important?"},"opts":[{"en":"It allows staff lunches and drinks to be stored there safely alongside the medicines, saving space","ar":"It allows staff lunches and drinks to be stored there safely alongside the medicines, saving space"},{"en":"It shows whether temperatures went out of range between checks, so effectiveness is protected","ar":"It shows whether temperatures went out of range between checks, so effectiveness is protected"},{"en":"It removes the need to record temperatures, as the thermometer does it all","ar":"It removes the need to record temperatures, as the thermometer does it all"},{"en":"It makes expiry dates irrelevant for any medicine kept inside the fridge","ar":"It makes expiry dates irrelevant for any medicine kept inside the fridge"}],"correct":1,"expl":{"en":"Refrigerated medicines can lose effect if stored outside the labelled range. A min/max thermometer reveals excursions that a single daily reading could miss.","ar":"Refrigerated medicines can lose effect if stored outside the labelled range. A min/max thermometer reveals excursions that a single daily reading could miss."}}]},{"id":"m3","title":{"en":"Administration: Rights, Checks and Identity Verification","ar":"Administration: Rights, Checks and Identity Verification"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Most medication errors are not caused by ignorance. They happen when a competent professional is interrupted, rushed or assumes. A reliable routine, followed every time, is the best protection.","ar":"Most medication errors are not caused by ignorance. They happen when a competent professional is interrupted, rushed or assumes. A reliable routine, followed every time, is the best protection."}},{"t":"h","c":{"en":"The medication rights","ar":"The medication rights"}},{"t":"p","c":{"en":"Use the classic rights as a mental checklist at the point of administration. Many services now use more than five; the core ones are:","ar":"Use the classic rights as a mental checklist at the point of administration. Many services now use more than five; the core ones are:"}},{"t":"list","c":{"en":["\u003cstrong>Right child\u003c/strong>: verified identity, not assumed.","\u003cstrong>Right medicine\u003c/strong>: matches the authorisation and the label.","\u003cstrong>Right dose\u003c/strong>: as prescribed and as per the IHP and the prescriber's written instruction.","\u003cstrong>Right route\u003c/strong>: oral, inhaled, topical, injected or otherwise, as directed.","\u003cstrong>Right time\u003c/strong>: within the window set by the instruction; not already given at home.","\u003cstrong>Right documentation\u003c/strong>: you record straight after giving it, not before and not at the end of the day.","\u003cstrong>Right to refuse\u003c/strong>: the child's response is respected and recorded; see Module 5."],"ar":["\u003cstrong>Right child\u003c/strong>: verified identity, not assumed.","\u003cstrong>Right medicine\u003c/strong>: matches the authorisation and the label.","\u003cstrong>Right dose\u003c/strong>: as prescribed and as per the IHP and the prescriber's written instruction.","\u003cstrong>Right route\u003c/strong>: oral, inhaled, topical, injected or otherwise, as directed.","\u003cstrong>Right time\u003c/strong>: within the window set by the instruction; not already given at home.","\u003cstrong>Right documentation\u003c/strong>: you record straight after giving it, not before and not at the end of the day.","\u003cstrong>Right to refuse\u003c/strong>: the child's response is respected and recorded; see Module 5."]}},{"t":"h","c":{"en":"Identity verification in a school","ar":"Identity verification in a school"}},{"t":"p","c":{"en":"Younger children cannot reliably tell you their name, and in a school with many sections there can be siblings, cousins and children with similar names. Verify identity in a way that does not rely on a leading question such as \"You're Layla, aren't you?\"","ar":"Younger children cannot reliably tell you their name, and in a school with many sections there can be siblings, cousins and children with similar names. Verify identity in a way that does not rely on a leading question such as \"You're Layla, aren't you?\""}},{"t":"list","c":{"en":["Ask the child to tell you their \u003cstrong>full name and class\u003c/strong> and compare it to the record.","Use a \u003cstrong>photograph\u003c/strong> on the medication record or IHP, where your policy and the family's consent allow.","Match the child, the container label and the administration record, all three, at the moment of giving.","For students who are unable to state their name, ask a staff member who knows them well to confirm, and note that on the record.","Be alert to children with the \u003cstrong>same or similar names\u003c/strong> in the same year and mark their records clearly."],"ar":["Ask the child to tell you their \u003cstrong>full name and class\u003c/strong> and compare it to the record.","Use a \u003cstrong>photograph\u003c/strong> on the medication record or IHP, where your policy and the family's consent allow.","Match the child, the container label and the administration record, all three, at the moment of giving.","For students who are unable to state their name, ask a staff member who knows them well to confirm, and note that on the record.","Be alert to children with the \u003cstrong>same or similar names\u003c/strong> in the same year and mark their records clearly."]}},{"t":"h","c":{"en":"A safe administration routine","ar":"A safe administration routine"}},{"t":"steps","c":{"en":["Wash or sanitise your hands, and prepare a clean work surface away from distractions.","Find the record and confirm the authorisation, the time window, and whether a dose has already been given today.","Check the medicine's label against the record: name, strength, route, directions, child's name, expiry.","Verify the child's identity as described above.","Ask about allergies, how they are feeling, and whether they have had anything at home. Stop and seek advice if anything has changed or does not fit.","Prepare and give the dose as the label and instruction direct. Watch the child take it, and do not leave it with them to take later.","Record immediately, store the medicine correctly, and observe the child for any reaction."],"ar":["Wash or sanitise your hands, and prepare a clean work surface away from distractions.","Find the record and confirm the authorisation, the time window, and whether a dose has already been given today.","Check the medicine's label against the record: name, strength, route, directions, child's name, expiry.","Verify the child's identity as described above.","Ask about allergies, how they are feeling, and whether they have had anything at home. Stop and seek advice if anything has changed or does not fit.","Prepare and give the dose as the label and instruction direct. Watch the child take it, and do not leave it with them to take later.","Record immediately, store the medicine correctly, and observe the child for any reaction."]}},{"t":"callout","k":"warn","title":{"en":"Stop if anything does not match","ar":"Stop if anything does not match"},"c":{"en":"If the label, record and child do not all agree, or if you are unsure about anything, \u003cstrong>stop\u003c/strong>. Do not give the medicine. Clarify with the parent, prescriber or pharmacist, and record what happened. A delayed dose that is later clarified is far safer than a guessed dose.","ar":"If the label, record and child do not all agree, or if you are unsure about anything, \u003cstrong>stop\u003c/strong>. Do not give the medicine. Clarify with the parent, prescriber or pharmacist, and record what happened. A delayed dose that is later clarified is far safer than a guessed dose."}},{"t":"callout","k":"tip","title":{"en":"Protect the routine from interruptions","ar":"Protect the routine from interruptions"},"c":{"en":"Many clinics find it helps to put up a simple \"medication round in progress\" sign, to hand off phone calls and walk-ins briefly, and to complete one child's administration fully before starting the next. If you are interrupted, restart your checks from the beginning of that child's sequence.","ar":"Many clinics find it helps to put up a simple \"medication round in progress\" sign, to hand off phone calls and walk-ins briefly, and to complete one child's administration fully before starting the next. If you are interrupted, restart your checks from the beginning of that child's sequence."}},{"t":"scenario","title":{"en":"Scenario: the two Aishas","ar":"Scenario: the two Aishas"},"c":{"en":"Two Year 6 girls named Aisha, from different sections, come to the clinic at lunchtime. Only one has authorised medication due. One says, \"It's me, I'm the one who takes the tablet.\" \u003cstrong>How do you proceed?\u003c/strong> You ask each to give their full name and class, compare with the record and photograph, check the label, and only then give the dose. You mark both records with a visible \"same name\" alert and tell colleagues who cover the clinic. Over-reliance on the child's confident answer is how wrong-child errors begin.","ar":"Two Year 6 girls named Aisha, from different sections, come to the clinic at lunchtime. Only one has authorised medication due. One says, \"It's me, I'm the one who takes the tablet.\" \u003cstrong>How do you proceed?\u003c/strong> You ask each to give their full name and class, compare with the record and photograph, check the label, and only then give the dose. You mark both records with a visible \"same name\" alert and tell colleagues who cover the clinic. Over-reliance on the child's confident answer is how wrong-child errors begin."}},{"t":"scenario","title":{"en":"Scenario: the changed instruction","ar":"Scenario: the changed instruction"},"c":{"en":"A parent phones to say the doctor has changed the dose of a student's regular medicine, and asks you to follow the new amount from tomorrow. \u003cstrong>What do you do?\u003c/strong> You do not change the dose on a verbal instruction alone. You ask for the new written instruction from the prescriber or a newly dispensed, relabelled container and a signed parental request, and you update the record when you have them. Until then you give only what the current authorisation and label support, and you tell the parent clearly what you can and cannot do.","ar":"A parent phones to say the doctor has changed the dose of a student's regular medicine, and asks you to follow the new amount from tomorrow. \u003cstrong>What do you do?\u003c/strong> You do not change the dose on a verbal instruction alone. You ask for the new written instruction from the prescriber or a newly dispensed, relabelled container and a signed parental request, and you update the record when you have them. Until then you give only what the current authorisation and label support, and you tell the parent clearly what you can and cannot do."}}],"checks":[{"id":"m3q1","q":{"en":"What is the most reliable way to verify the identity of a young child before giving a medicine?","ar":"What is the most reliable way to verify the identity of a young child before giving a medicine?"},"opts":[{"en":"Ask \"Are you Layla?\" and wait for a yes before checking the label","ar":"Ask \"Are you Layla?\" and wait for a yes before checking the label"},{"en":"Rely on the class teacher's wave from the doorway to confirm who the child is, then give the dose","ar":"Rely on the class teacher's wave from the doorway to confirm who the child is, then give the dose"},{"en":"Ask for full name and class, then match it with the record, label and photograph","ar":"Ask for full name and class, then match it with the record, label and photograph"},{"en":"Match only the child's first name to the bottle, as surnames are often similar","ar":"Match only the child's first name to the bottle, as surnames are often similar"}],"correct":2,"expl":{"en":"Leading questions invite a \"yes\". Open identity questions plus matching the record and label provide a more reliable check.","ar":"Leading questions invite a \"yes\". Open identity questions plus matching the record and label provide a more reliable check."}},{"id":"m3q2","q":{"en":"You are interrupted by a phone call midway through preparing a dose. What should you do?","ar":"You are interrupted by a phone call midway through preparing a dose. What should you do?"},"opts":[{"en":"Carry on from where you stopped, since you had already checked the label once","ar":"Carry on from where you stopped, since you had already checked the label once"},{"en":"Give the dose quickly so that the child does not miss any more of the lesson","ar":"Give the dose quickly so that the child does not miss any more of the lesson"},{"en":"Ask the child to complete the preparation themselves while you take the call","ar":"Ask the child to complete the preparation themselves while you take the call"},{"en":"Pause, and when you return restart your checks for that child from the beginning","ar":"Pause, and when you return restart your checks for that child from the beginning"}],"correct":3,"expl":{"en":"Interruptions are a major cause of errors. Restarting the checks is a simple way to protect against omitted steps.","ar":"Interruptions are a major cause of errors. Restarting the checks is a simple way to protect against omitted steps."}},{"id":"m3q3","q":{"en":"A parent asks by phone for a change of dose starting tomorrow. What is the correct response?","ar":"A parent asks by phone for a change of dose starting tomorrow. What is the correct response?"},"opts":[{"en":"Ask for the prescriber's new written instruction and a signed request first","ar":"Ask for the prescriber's new written instruction and a signed request first"},{"en":"Change the dose on the parent's word and note the change on the record later","ar":"Change the dose on the parent's word and note the change on the record later"},{"en":"Ask the child what the doctor said and follow the child's own account of it without delay","ar":"Ask the child what the doctor said and follow the child's own account of it without delay"},{"en":"Halve the dose as a precaution until someone confirms the new amount","ar":"Halve the dose as a precaution until someone confirms the new amount"}],"correct":0,"expl":{"en":"Dose changes require written authority from the prescriber, with parental consent. Verbal changes are a known source of error.","ar":"Dose changes require written authority from the prescriber, with parental consent. Verbal changes are a known source of error."}}]},{"id":"m4","title":{"en":"Documentation and the Medication Administration Record","ar":"Documentation and the Medication Administration Record"},"minutes":15,"blocks":[{"t":"p","c":{"en":"If it is not recorded, it cannot be shown to have happened, and the next person cannot tell whether the child has had their dose. Good records protect children first, and then protect you.","ar":"If it is not recorded, it cannot be shown to have happened, and the next person cannot tell whether the child has had their dose. Good records protect children first, and then protect you."}},{"t":"h","c":{"en":"What the medication administration record (MAR) should show","ar":"What the medication administration record (MAR) should show"}},{"t":"list","c":{"en":["The child's full name, year and section, date of birth where policy allows, and a photograph if consent has been given.","Any known allergies or sensitivities.","The medicine's name, strength, form, route, directions and the prescriber's instruction, matching the label.","The date and time of every dose, the amount given, and your name and signature or initials.","Any \u003cstrong>missed, refused or withheld\u003c/strong> dose, with the reason.","Any reaction, concern or unusual observation, and who was informed.","Receipt and return entries: the quantity received, the date, who delivered it, and the quantity returned or disposed of."],"ar":["The child's full name, year and section, date of birth where policy allows, and a photograph if consent has been given.","Any known allergies or sensitivities.","The medicine's name, strength, form, route, directions and the prescriber's instruction, matching the label.","The date and time of every dose, the amount given, and your name and signature or initials.","Any \u003cstrong>missed, refused or withheld\u003c/strong> dose, with the reason.","Any reaction, concern or unusual observation, and who was informed.","Receipt and return entries: the quantity received, the date, who delivered it, and the quantity returned or disposed of."]}},{"t":"h","c":{"en":"Principles of good recording","ar":"Principles of good recording"}},{"t":"list","c":{"en":["\u003cstrong>Contemporaneous.\u003c/strong> Record at the time, or immediately after. Do not pre-sign, and do not rely on memory at the end of the day.","\u003cstrong>Accurate and factual.\u003c/strong> Write what you saw and did, not opinion. For example, \"Refused tablet, said it tastes bad, parent informed at 12.40\" rather than \"Naughty today\".","\u003cstrong>Legible and complete.\u003c/strong> Use black ink on paper, or the school's approved electronic system. Avoid abbreviations that colleagues may misread.","\u003cstrong>Corrections.\u003c/strong> If you make a mistake, put a single line through it so it is still readable, add the date and your initials, and write the correct entry. Never use correction fluid or erase.","\u003cstrong>Attributable.\u003c/strong> It is clear who gave the medicine and when."],"ar":["\u003cstrong>Contemporaneous.\u003c/strong> Record at the time, or immediately after. Do not pre-sign, and do not rely on memory at the end of the day.","\u003cstrong>Accurate and factual.\u003c/strong> Write what you saw and did, not opinion. For example, \"Refused tablet, said it tastes bad, parent informed at 12.40\" rather than \"Naughty today\".","\u003cstrong>Legible and complete.\u003c/strong> Use black ink on paper, or the school's approved electronic system. Avoid abbreviations that colleagues may misread.","\u003cstrong>Corrections.\u003c/strong> If you make a mistake, put a single line through it so it is still readable, add the date and your initials, and write the correct entry. Never use correction fluid or erase.","\u003cstrong>Attributable.\u003c/strong> It is clear who gave the medicine and when."]}},{"t":"h","c":{"en":"Confidentiality and data protection","ar":"Confidentiality and data protection"}},{"t":"p","c":{"en":"Medication records are health information. Under Federal Decree-Law No. 45 of 2021 on Personal Data Protection, health data is sensitive personal data, and Federal Law No. 2 of 2019 on the Use of ICT in Health Fields addresses confidentiality and the storage of health information within the UAE unless an exemption applies. You do not need the legal detail. Follow the school's records and data protection policy and apply these everyday rules:","ar":"Medication records are health information. Under Federal Decree-Law No. 45 of 2021 on Personal Data Protection, health data is sensitive personal data, and Federal Law No. 2 of 2019 on the Use of ICT in Health Fields addresses confidentiality and the storage of health information within the UAE unless an exemption applies. You do not need the legal detail. Follow the school's records and data protection policy and apply these everyday rules:"}},{"t":"list","c":{"en":["Keep paper records in a locked place and out of sight of visitors and students. Do not leave a record open on a clinic desk or screen.","Use only school-approved systems for electronic records, with individual log-ins and no shared passwords. Do not photograph records or medicines on a personal phone, and do not discuss medication in WhatsApp groups.","Share information on a \u003cstrong>need-to-know\u003c/strong> basis: teachers and PE staff need to know what to do in an emergency, not necessarily the full medical background.","Never promise a child complete secrecy. If a safeguarding concern arises, it overrides confidentiality and goes to the DSL.","Keep and dispose of records according to the school's records policy."],"ar":["Keep paper records in a locked place and out of sight of visitors and students. Do not leave a record open on a clinic desk or screen.","Use only school-approved systems for electronic records, with individual log-ins and no shared passwords. Do not photograph records or medicines on a personal phone, and do not discuss medication in WhatsApp groups.","Share information on a \u003cstrong>need-to-know\u003c/strong> basis: teachers and PE staff need to know what to do in an emergency, not necessarily the full medical background.","Never promise a child complete secrecy. If a safeguarding concern arises, it overrides confidentiality and goes to the DSL.","Keep and dispose of records according to the school's records policy."]}},{"t":"table","head":{"en":["Request","Sensible approach"],"ar":["Request","Sensible approach"]},"rows":[{"en":["A parent asks what dose was given last week","Provide the entries from their own child's record; confirm identity of the requester first."],"ar":["A parent asks what dose was given last week","Provide the entries from their own child's record; confirm identity of the requester first."]},{"en":["A teacher asks \"what is wrong with\" a student","Share only what they need to keep the child safe, as agreed in the IHP; do not disclose the diagnosis history without need."],"ar":["A teacher asks \"what is wrong with\" a student","Share only what they need to keep the child safe, as agreed in the IHP; do not disclose the diagnosis history without need."]},{"en":["Another parent asks about a classmate's medicine","Decline to discuss any other child's health information."],"ar":["Another parent asks about a classmate's medicine","Decline to discuss any other child's health information."]},{"en":["An outside clinician or authority requests records","Refer to the Principal or senior leadership and follow the records policy before releasing anything."],"ar":["An outside clinician or authority requests records","Refer to the Principal or senior leadership and follow the records policy before releasing anything."]}]},{"t":"scenario","title":{"en":"Scenario: the missing signature","ar":"Scenario: the missing signature"},"c":{"en":"At the end of a busy day you notice you gave a Year 2 student's lunchtime dose but did not sign the record. A colleague covering the afternoon is about to give the same dose again because nothing is recorded. \u003cstrong>What now?\u003c/strong> Catch it first: stop the second dose, confirm with the child, your memory and any witness that the first dose was given, and record the entry now with the actual time and a clear note that it was a late entry. Then report it as a near-miss and learn from it (Module 5). Never backdate a record.","ar":"At the end of a busy day you notice you gave a Year 2 student's lunchtime dose but did not sign the record. A colleague covering the afternoon is about to give the same dose again because nothing is recorded. \u003cstrong>What now?\u003c/strong> Catch it first: stop the second dose, confirm with the child, your memory and any witness that the first dose was given, and record the entry now with the actual time and a clear note that it was a late entry. Then report it as a near-miss and learn from it (Module 5). Never backdate a record."}}],"checks":[{"id":"m4q1","q":{"en":"You write the wrong time on the record. What is the correct way to correct it?","ar":"You write the wrong time on the record. What is the correct way to correct it?"},"opts":[{"en":"Cover it neatly with correction fluid and rewrite the correct time over it","ar":"Cover it neatly with correction fluid and rewrite the correct time over it"},{"en":"Strike through with a single line, date and initial it, and write the correct time","ar":"Strike through with a single line, date and initial it, and write the correct time"},{"en":"Scribble over it until it is unreadable and write the right time clearly below it","ar":"Scribble over it until it is unreadable and write the right time clearly below it"},{"en":"Tear out the page and start a fresh one, keeping the old one out of the file","ar":"Tear out the page and start a fresh one, keeping the old one out of the file"}],"correct":1,"expl":{"en":"Records must remain legible and traceable. A single line, date and initials show what changed, when, and by whom.","ar":"Records must remain legible and traceable. A single line, date and initials show what changed, when, and by whom."}},{"id":"m4q2","q":{"en":"Which entry is the best example of good recording?","ar":"Which entry is the best example of good recording?"},"opts":[{"en":"\"Awkward today, would not cooperate; refused everything I offered at lunch\"","ar":"\"Awkward today, would not cooperate; refused everything I offered at lunch\""},{"en":"\"Usual medicine given at lunchtime, I think; signed at end of day\"","ar":"\"Usual medicine given at lunchtime, I think; signed at end of day\""},{"en":"\"Refused inhaler at 12.15, said felt fine; no wheeze noted; parent phoned 12.25\"","ar":"\"Refused inhaler at 12.15, said felt fine; no wheeze noted; parent phoned 12.25\""},{"en":"\"All fine today, nothing to report; usual routine followed by everyone\"","ar":"\"All fine today, nothing to report; usual routine followed by everyone\""}],"correct":2,"expl":{"en":"Good entries are factual, specific and timed, and show actions taken. Opinions and vague wording do not help the next person.","ar":"Good entries are factual, specific and timed, and show actions taken. Opinions and vague wording do not help the next person."}},{"id":"m4q3","q":{"en":"A teacher asks you for a full explanation of a student's medical history \"just so I know\". What is best?","ar":"A teacher asks you for a full explanation of a student's medical history \"just so I know\". What is best?"},"opts":[{"en":"Hand over the entire medical file so the teacher can avoid any misunderstanding","ar":"Hand over the entire medical file so the teacher can avoid any misunderstanding"},{"en":"Discuss the history openly in the staff room so all colleagues are informed","ar":"Discuss the history openly in the staff room so all colleagues are informed"},{"en":"Refuse to share anything at all, including the actions needed in an emergency","ar":"Refuse to share anything at all, including the actions needed in an emergency"},{"en":"Share what is needed to keep the student safe in class, as agreed in the IHP","ar":"Share what is needed to keep the student safe in class, as agreed in the IHP"}],"correct":3,"expl":{"en":"Need-to-know sharing balances safety and privacy. Staff must know what to do, but need not know every detail.","ar":"Need-to-know sharing balances safety and privacy. Staff must know what to do, but need not know every detail."}}]},{"id":"m5","title":{"en":"Errors, Near-Misses, Refusals, Reporting and Learning","ar":"Errors, Near-Misses, Refusals, Reporting and Learning"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Every nurse who gives medicines will, at some point, make or narrowly avoid an error. What distinguishes a safe service is not that nothing ever goes wrong, but that problems are recognised, reported, and used to improve the system.","ar":"Every nurse who gives medicines will, at some point, make or narrowly avoid an error. What distinguishes a safe service is not that nothing ever goes wrong, but that problems are recognised, reported, and used to improve the system."}},{"t":"h","c":{"en":"Definitions","ar":"Definitions"}},{"t":"list","c":{"en":["\u003cstrong>Error.\u003c/strong> A medicine is given incorrectly: the wrong child, medicine, dose, route or time, or a dose is missed or duplicated.","\u003cstrong>Near-miss.\u003c/strong> An error is caught before it reaches the child. These are valuable: they show where the system is weak without anyone being harmed.","\u003cstrong>Refusal.\u003c/strong> A child declines a dose. This is a clinical and communication matter, not misbehaviour."],"ar":["\u003cstrong>Error.\u003c/strong> A medicine is given incorrectly: the wrong child, medicine, dose, route or time, or a dose is missed or duplicated.","\u003cstrong>Near-miss.\u003c/strong> An error is caught before it reaches the child. These are valuable: they show where the system is weak without anyone being harmed.","\u003cstrong>Refusal.\u003c/strong> A child declines a dose. This is a clinical and communication matter, not misbehaviour."]}},{"t":"h","c":{"en":"If an error has reached the child","ar":"If an error has reached the child"}},{"t":"steps","c":{"en":["\u003cstrong>Make the child safe.\u003c/strong> Stay with them and assess how they are. If there are signs of a serious reaction, or you are worried, call 998 and follow your training.","\u003cstrong>Seek clinical advice.\u003c/strong> Contact the prescriber, pharmacist or the relevant health service promptly and follow their advice. Have the medicine container and the record to hand.","\u003cstrong>Inform the parent or guardian\u003c/strong> straight away, honestly and calmly, as well as the Principal or senior leadership.","\u003cstrong>Record\u003c/strong> factually what happened, what was given, what you did and who was told, including times.","\u003cstrong>Report\u003c/strong> through the school's incident procedure and any required health-authority route.","\u003cstrong>Review.\u003c/strong> With leadership, look for causes in the system, such as interruptions, similar names, unclear labels or workload, and put a fix in place."],"ar":["\u003cstrong>Make the child safe.\u003c/strong> Stay with them and assess how they are. If there are signs of a serious reaction, or you are worried, call 998 and follow your training.","\u003cstrong>Seek clinical advice.\u003c/strong> Contact the prescriber, pharmacist or the relevant health service promptly and follow their advice. Have the medicine container and the record to hand.","\u003cstrong>Inform the parent or guardian\u003c/strong> straight away, honestly and calmly, as well as the Principal or senior leadership.","\u003cstrong>Record\u003c/strong> factually what happened, what was given, what you did and who was told, including times.","\u003cstrong>Report\u003c/strong> through the school's incident procedure and any required health-authority route.","\u003cstrong>Review.\u003c/strong> With leadership, look for causes in the system, such as interruptions, similar names, unclear labels or workload, and put a fix in place."]}},{"t":"callout","k":"key","title":{"en":"Honesty first","ar":"Honesty first"},"c":{"en":"Tell the family the truth, early. Concealing an error causes far more harm than the error. Open, calm communication, with an apology for what has happened and a clear explanation of what is being done, keeps trust. Support colleagues too: a blame culture means near-misses go unreported.","ar":"Tell the family the truth, early. Concealing an error causes far more harm than the error. Open, calm communication, with an apology for what has happened and a clear explanation of what is being done, keeps trust. Support colleagues too: a blame culture means near-misses go unreported."}},{"t":"h","c":{"en":"Near-misses: use them","ar":"Near-misses: use them"}},{"t":"p","c":{"en":"If you catch a mix-up before the dose is given, record it, report it, and discuss it. Ask \"what made this possible?\" rather than \"who did it?\" Common causes in schools include similar-looking packaging, children with the same name, verbal changes of instruction, covering staff who do not know the routine, and pressure around break times.","ar":"If you catch a mix-up before the dose is given, record it, report it, and discuss it. Ask \"what made this possible?\" rather than \"who did it?\" Common causes in schools include similar-looking packaging, children with the same name, verbal changes of instruction, covering staff who do not know the routine, and pressure around break times."}},{"t":"h","c":{"en":"When a child refuses","ar":"When a child refuses"}},{"t":"list","c":{"en":["Do not force, trick or disguise a medicine in food or drink. Doing so removes trust and consent, and can be unsafe.","Stay calm and ask what is behind it: taste, fear, embarrassment, feeling well, or a past bad experience.","Offer reasonable, authorised options, such as a different time within the window or a different method that the prescriber has approved.","\u003cstrong>Record\u003c/strong> the refusal and the reason, and tell the parent the same day.","For critical medicines, such as seizure rescue, insulin or an inhaler in a worsening asthma attack, follow the IHP and seek advice straight away; a refusal can be an emergency."],"ar":["Do not force, trick or disguise a medicine in food or drink. Doing so removes trust and consent, and can be unsafe.","Stay calm and ask what is behind it: taste, fear, embarrassment, feeling well, or a past bad experience.","Offer reasonable, authorised options, such as a different time within the window or a different method that the prescriber has approved.","\u003cstrong>Record\u003c/strong> the refusal and the reason, and tell the parent the same day.","For critical medicines, such as seizure rescue, insulin or an inhaler in a worsening asthma attack, follow the IHP and seek advice straight away; a refusal can be an emergency."]}},{"t":"scenario","title":{"en":"Scenario: the wrong-student near-miss","ar":"Scenario: the wrong-student near-miss"},"c":{"en":"You are about to give a Year 8 student a tablet when you notice the record photograph does not match the student in front of you. The child says, \"Oh, that is my friend's, I just came with her.\" \u003cstrong>What do you do?\u003c/strong> No dose is given. You make sure each child is safe, return the medicine to storage, and send the correct student for their dose after full checks. You record it as a near-miss, speak to both children kindly but clearly about why only the named child may take it, and ask what let it happen: was the clinic unattended, was the door open, were students sent in together? Then agree a change, such as one child at a time and an identity check before any bottle is touched.","ar":"You are about to give a Year 8 student a tablet when you notice the record photograph does not match the student in front of you. The child says, \"Oh, that is my friend's, I just came with her.\" \u003cstrong>What do you do?\u003c/strong> No dose is given. You make sure each child is safe, return the medicine to storage, and send the correct student for their dose after full checks. You record it as a near-miss, speak to both children kindly but clearly about why only the named child may take it, and ask what let it happen: was the clinic unattended, was the door open, were students sent in together? Then agree a change, such as one child at a time and an identity check before any bottle is touched."}},{"t":"scenario","title":{"en":"Scenario: the refused inhaler","ar":"Scenario: the refused inhaler"},"c":{"en":"A Year 5 student with asthma refuses a prescribed preventer dose, saying friends laugh at the spacer. \u003cstrong>What do you do?\u003c/strong> You listen, offer privacy for dosing, record the refusal, and inform the parent. You also talk with the family about how the student feels, and with the prescriber if a different device might help. You treat it as a support issue first, and not as defiance.","ar":"A Year 5 student with asthma refuses a prescribed preventer dose, saying friends laugh at the spacer. \u003cstrong>What do you do?\u003c/strong> You listen, offer privacy for dosing, record the refusal, and inform the parent. You also talk with the family about how the student feels, and with the prescriber if a different device might help. You treat it as a support issue first, and not as defiance."}}],"checks":[{"id":"m5q1","q":{"en":"You realise a medicine was given to the wrong student about ten minutes ago. What is the first priority?","ar":"You realise a medicine was given to the wrong student about ten minutes ago. What is the first priority?"},"opts":[{"en":"Check the child and get clinical advice, calling 998 if there are worrying signs","ar":"Check the child and get clinical advice, calling 998 if there are worrying signs"},{"en":"Complete the incident form in full before doing anything else for the child","ar":"Complete the incident form in full before doing anything else for the child"},{"en":"Wait to see whether symptoms appear before telling anyone about the mistake","ar":"Wait to see whether symptoms appear before telling anyone about the mistake"},{"en":"Ask both students to keep quiet about it to avoid worrying their families","ar":"Ask both students to keep quiet about it to avoid worrying their families"}],"correct":0,"expl":{"en":"The child's safety comes first. Then seek clinical advice, inform the family and leadership, record and report.","ar":"The child's safety comes first. Then seek clinical advice, inform the family and leadership, record and report."}},{"id":"m5q2","q":{"en":"What is the main value of recording near-misses?","ar":"What is the main value of recording near-misses?"},"opts":[{"en":"They show which colleague was responsible so that they can be disciplined","ar":"They show which colleague was responsible so that they can be disciplined"},{"en":"They reveal system weaknesses so changes can be made before a child is harmed","ar":"They reveal system weaknesses so changes can be made before a child is harmed"},{"en":"They prove that no real errors occur in the school and that checks are working","ar":"They prove that no real errors occur in the school and that checks are working"},{"en":"They replace the need for administration checks once enough have been logged","ar":"They replace the need for administration checks once enough have been logged"}],"correct":1,"expl":{"en":"Near-misses give learning without harm. A culture that reports them is a safer one.","ar":"Near-misses give learning without harm. A culture that reports them is a safer one."}},{"id":"m5q3","q":{"en":"A younger child refuses a dose of liquid medicine because of the taste. What is the best response?","ar":"A younger child refuses a dose of liquid medicine because of the taste. What is the best response?"},"opts":[{"en":"Mix it into the child's juice without telling them, so that the dose is taken quickly and calmly","ar":"Mix it into the child's juice without telling them, so that the dose is taken quickly and calmly"},{"en":"Hold the child still with another adult and give it quickly to finish the dose","ar":"Hold the child still with another adult and give it quickly to finish the dose"},{"en":"Do not disguise it, explore the reason, offer authorised options, and inform the parent","ar":"Do not disguise it, explore the reason, offer authorised options, and inform the parent"},{"en":"Say nothing to the family and mark it as given so the record looks complete","ar":"Say nothing to the family and mark it as given so the record looks complete"}],"correct":2,"expl":{"en":"Disguising or forcing medicine undermines consent and trust and can be unsafe. Record the refusal and involve the parent.","ar":"Disguising or forcing medicine undermines consent and trust and can be unsafe. Record the refusal and involve the parent."}}]},{"id":"m6","title":{"en":"Trips, PE, Self-Carry, Emergency Medicines and Disposal","ar":"Trips, PE, Self-Carry, Emergency Medicines and Disposal"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Medicines do not stay neatly in the clinic. Students leave the building for trips and matches, play sport on the field, and older students carry their own inhalers and auto-injectors. Each setting needs a plan made in advance.","ar":"Medicines do not stay neatly in the clinic. Students leave the building for trips and matches, play sport on the field, and older students carry their own inhalers and auto-injectors. Each setting needs a plan made in advance."}},{"t":"h","c":{"en":"School trips","ar":"School trips"}},{"t":"list","c":{"en":["Review the trip's participant list with the organiser \u003cstrong>early\u003c/strong>, and identify every student with medi
