#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"support-customer-service","code":"SCS","passMark":80,"hours":"1.25 hours","accent":"#B8620B","accentSoft":"#FBEEDC","eyebrow":{"en":"Staff CPD · Support Staff · Customer Service","ar":"Staff CPD · Support Staff · Customer Service"},"title":{"en":"Customer Service in a School","ar":"Customer Service in a School"},"subtitle":{"en":"A self-paced course for support staff: first impressions, listening and greeting, handling questions, delays and mistakes, staying calm with upset people, and following up so that nobody is left waiting.","ar":"A self-paced course for support staff: first impressions, listening and greeting, handling questions, delays and mistakes, staying calm with upset people, and following up so that nobody is left waiting."},"durationLabel":{"en":"About 1 hour 15 minutes, fully self-paced","ar":"About 1 hour 15 minutes, fully self-paced"},"standard":{"en":"School support staff · Customer service and professional conduct","ar":"School support staff · Customer service and professional conduct"},"source":{"en":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)","ar":"Good practice for school support staff, UAE guidance, and school policy (to be aligned by the school)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why Service Matters and First Impressions","ar":"Why Service Matters and First Impressions"},"minutes":15,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose of this course","ar":"Purpose of this course"},"c":{"en":"This course helps every support staff member give calm, friendly and helpful service to the people who use our school. By the end you will be able to make a good first impression, listen well, answer questions honestly, say \"no\" politely, stay safe with upset people, and follow up so that nobody is forgotten. \u003cstrong>This CPD supports, and does not replace, the school's own policies and your line manager's instructions.\u003c/strong>","ar":"This course helps every support staff member give calm, friendly and helpful service to the people who use our school. By the end you will be able to make a good first impression, listen well, answer questions honestly, say \"no\" politely, stay safe with upset people, and follow up so that nobody is forgotten. \u003cstrong>This CPD supports, and does not replace, the school's own policies and your line manager's instructions.\u003c/strong>"}},{"t":"p","c":{"en":"A school is not a shop, but it is a place of service. Every day, people come to us with a need: a parent who wants to ask about a bus, a visitor who has a meeting, a pupil who has lost a bag, a teacher who needs a room opened. How we treat them in the first minute shapes how they feel about the whole school.","ar":"A school is not a shop, but it is a place of service. Every day, people come to us with a need: a parent who wants to ask about a bus, a visitor who has a meeting, a pupil who has lost a bag, a teacher who needs a room opened. How we treat them in the first minute shapes how they feel about the whole school."}},{"t":"h","c":{"en":"Who are our \"customers\"?","ar":"Who are our \"customers\"?"}},{"t":"p","c":{"en":"We use the word \"customer\" for anyone who needs our help. In a school there are four main groups. Each one needs something a little different.","ar":"We use the word \"customer\" for anyone who needs our help. In a school there are four main groups. Each one needs something a little different."}},{"t":"table","head":{"en":["Group","What they often need","What helps most"],"ar":["Group","What they often need","What helps most"]},"rows":[{"en":["Parents and carers","Information, reassurance, a safe place for their child","A warm greeting, a clear answer, and honesty when you do not know"],"ar":["Parents and carers","Information, reassurance, a safe place for their child","A warm greeting, a clear answer, and honesty when you do not know"]},{"en":["Visitors","To find the right person or place, and to feel safe","A friendly welcome, clear directions and the school's sign-in steps"],"ar":["Visitors","To find the right person or place, and to feel safe","A friendly welcome, clear directions and the school's sign-in steps"]},{"en":["Pupils","Help, kindness and a trusted adult","A calm voice, patience and respect at their level"],"ar":["Pupils","Help, kindness and a trusted adult","A calm voice, patience and respect at their level"]},{"en":["Colleagues","Quick, reliable support to do their own job","Doing what you promised, on time, and saying so if you cannot"],"ar":["Colleagues","Quick, reliable support to do their own job","Doing what you promised, on time, and saying so if you cannot"]}]},{"t":"callout","k":"tip","title":{"en":"Colleagues count too","ar":"Colleagues count too"},"c":{"en":"The teacher who needs a printer fixed or the driver who needs a form signed is also a customer. When we serve each other well, the pupils feel the difference.","ar":"The teacher who needs a printer fixed or the driver who needs a form signed is also a customer. When we serve each other well, the pupils feel the difference."}},{"t":"h","c":{"en":"The first 30 seconds","ar":"The first 30 seconds"}},{"t":"p","c":{"en":"People decide very quickly whether we are friendly and trustworthy. Most of that decision comes before we say anything important. Use these simple habits every time.","ar":"People decide very quickly whether we are friendly and trustworthy. Most of that decision comes before we say anything important. Use these simple habits every time."}},{"t":"steps","c":{"en":["Stop what you are doing and look up. Even a short pause shows respect.","Smile and give a greeting in your normal voice, for example \"Good morning, how can I help?\"","Use the person's name if you know it, and be clear about who you are.","Keep your desk, uniform and badge tidy. Appearance is part of the first impression.","If you are busy, say so kindly: \"I will be with you in one minute.\" Do not ignore the person."],"ar":["Stop what you are doing and look up. Even a short pause shows respect.","Smile and give a greeting in your normal voice, for example \"Good morning, how can I help?\"","Use the person's name if you know it, and be clear about who you are.","Keep your desk, uniform and badge tidy. Appearance is part of the first impression.","If you are busy, say so kindly: \"I will be with you in one minute.\" Do not ignore the person."]}},{"t":"scenario","title":{"en":"Scenario: two arrivals at the front desk","ar":"Scenario: two arrivals at the front desk"},"c":{"en":"A mother arrives at the desk at the same time as a delivery driver. You are finishing a form. \u003cstrong>What should you do?\u003c/strong> Look up at once and greet both people. Say to the mother, \"Good morning, I will be with you in one moment,\" and quickly tell the driver where to leave the parcel. Then give the mother your full attention. Nobody feels invisible, and nobody is rushed or ignored.","ar":"A mother arrives at the desk at the same time as a delivery driver. You are finishing a form. \u003cstrong>What should you do?\u003c/strong> Look up at once and greet both people. Say to the mother, \"Good morning, I will be with you in one moment,\" and quickly tell the driver where to leave the parcel. Then give the mother your full attention. Nobody feels invisible, and nobody is rushed or ignored."}},{"t":"callout","k":"warn","title":{"en":"Never let a screen or phone win","ar":"Never let a screen or phone win"},"c":{"en":"Looking at your phone or computer while someone stands in front of you tells them they do not matter. Put the phone down. If you must finish something, say so and give a time.","ar":"Looking at your phone or computer while someone stands in front of you tells them they do not matter. Put the phone down. If you must finish something, say so and give a time."}}],"checks":[{"id":"m1q1","q":{"en":"A father arrives at the front desk while you are typing. What is the best first action?","ar":"A father arrives at the front desk while you are typing. What is the best first action?"},"opts":[{"en":"Look up, smile and greet him, and say how soon you can help","ar":"Look up, smile and greet him, and say how soon you can help"},{"en":"Keep typing until you have finished the sentence, then speak to him","ar":"Keep typing until you have finished the sentence, then speak to him"},{"en":"Point to the waiting chairs and carry on working until you are free","ar":"Point to the waiting chairs and carry on working until you are free"},{"en":"Ask him to come back later because you are in the middle of a task","ar":"Ask him to come back later because you are in the middle of a task"}],"correct":0,"expl":{"en":"A quick look, a smile and a greeting show respect straight away. If you are busy, tell the person how long you will be. Ignoring someone, even for a short time, gives a poor first impression.","ar":"A quick look, a smile and a greeting show respect straight away. If you are busy, tell the person how long you will be. Ignoring someone, even for a short time, gives a poor first impression."}},{"id":"m1q2","q":{"en":"Which of these people count as \"customers\" in a school?","ar":"Which of these people count as \"customers\" in a school?"},"opts":[{"en":"Only parents who pay fees to the school and who visit often","ar":"Only parents who pay fees to the school and who visit often"},{"en":"Parents, visitors, pupils and colleagues who need your help","ar":"Parents, visitors, pupils and colleagues who need your help"},{"en":"Only visitors who come from outside the school and sign in","ar":"Only visitors who come from outside the school and sign in"},{"en":"Only pupils, because they are the main reason the school exists","ar":"Only pupils, because they are the main reason the school exists"}],"correct":1,"expl":{"en":"Anyone who needs our help is a customer. Each group has different needs, and good service means treating all of them with respect.","ar":"Anyone who needs our help is a customer. Each group has different needs, and good service means treating all of them with respect."}},{"id":"m1q3","q":{"en":"Why do the first 30 seconds matter so much?","ar":"Why do the first 30 seconds matter so much?"},"opts":[{"en":"The first 30 seconds are the only time that a person will really listen to us","ar":"The first 30 seconds are the only time that a person will really listen to us"},{"en":"After that time, it is too late for the person to change their opinion of us","ar":"After that time, it is too late for the person to change their opinion of us"},{"en":"People quickly judge if we are friendly and trustworthy, and it shapes their view","ar":"People quickly judge if we are friendly and trustworthy, and it shapes their view"},{"en":"School rules say that every greeting must be timed and then written in a log","ar":"School rules say that every greeting must be timed and then written in a log"}],"correct":2,"expl":{"en":"People form a view very fast. A warm start makes the rest of the conversation easier, but a good person can still repair a bad start. There is no rule to time greetings.","ar":"People form a view very fast. A warm start makes the rest of the conversation easier, but a good person can still repair a bad start. There is no rule to time greetings."}}]},{"id":"m2","title":{"en":"Listening, Body Language and Greeting","ar":"Listening, Body Language and Greeting"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Good service starts with listening. Many problems at school get bigger because the person did not feel heard. When you listen well, you often solve the problem faster and the person becomes calmer.","ar":"Good service starts with listening. Many problems at school get bigger because the person did not feel heard. When you listen well, you often solve the problem faster and the person becomes calmer."}},{"t":"h","c":{"en":"How to listen well","ar":"How to listen well"}},{"t":"list","c":{"en":["Give your full attention. Face the person and stop other tasks.","Let them finish. Do not interrupt, even if you think you know what they will say.","Ask a short question if you are not sure: \"Do you mean the Year 4 bus or the Year 5 bus?\"","Repeat the main point back: \"So your son's bus was late this morning. Is that right?\"","Write down names, dates and phone numbers so that you do not have to ask twice."],"ar":["Give your full attention. Face the person and stop other tasks.","Let them finish. Do not interrupt, even if you think you know what they will say.","Ask a short question if you are not sure: \"Do you mean the Year 4 bus or the Year 5 bus?\"","Repeat the main point back: \"So your son's bus was late this morning. Is that right?\"","Write down names, dates and phone numbers so that you do not have to ask twice."]}},{"t":"h","c":{"en":"Body language","ar":"Body language"}},{"t":"p","c":{"en":"Our body speaks before our mouth does. Many people in our school community speak English as a second language, so friendly body language is even more important.","ar":"Our body speaks before our mouth does. Many people in our school community speak English as a second language, so friendly body language is even more important."}},{"t":"table","head":{"en":["Helpful","Unhelpful"],"ar":["Helpful","Unhelpful"]},"rows":[{"en":["Open hands, relaxed shoulders, a calm face","Folded arms, a tight jaw, a frown"],"ar":["Open hands, relaxed shoulders, a calm face","Folded arms, a tight jaw, a frown"]},{"en":["Looking at the person (in a way that is comfortable and respectful)","Looking at the clock, the screen or past the person"],"ar":["Looking at the person (in a way that is comfortable and respectful)","Looking at the clock, the screen or past the person"]},{"en":["Nodding while they speak","Sighing or rolling your eyes"],"ar":["Nodding while they speak","Sighing or rolling your eyes"]},{"en":["A calm, medium voice and a steady pace","A loud, fast or sharp voice"],"ar":["A calm, medium voice and a steady pace","A loud, fast or sharp voice"]}]},{"t":"callout","k":"tip","title":{"en":"Respect different customs","ar":"Respect different customs"},"c":{"en":"Our community is international. Some people prefer less eye contact, and some prefer not to shake hands. Follow the person's lead and always stay polite and warm.","ar":"Our community is international. Some people prefer less eye contact, and some prefer not to shake hands. Follow the person's lead and always stay polite and warm."}},{"t":"h","c":{"en":"Greeting on the phone","ar":"Greeting on the phone"}},{"t":"steps","c":{"en":["Answer quickly, ideally before the fourth ring, and smile. People can hear a smile.","Say the school name, a greeting and your name: \"Good morning, Providence English Private School, this is Sara. How can I help you?\"","Listen and take notes. Ask for the name and number early in the call.","If you must transfer, say who you are transferring to and why. Never leave the caller on hold in silence.","End with a summary and a kind close: \"I will pass this to the Year 3 teacher today. Thank you for calling.\""],"ar":["Answer quickly, ideally before the fourth ring, and smile. People can hear a smile.","Say the school name, a greeting and your name: \"Good morning, Providence English Private School, this is Sara. How can I help you?\"","Listen and take notes. Ask for the name and number early in the call.","If you must transfer, say who you are transferring to and why. Never leave the caller on hold in silence.","End with a summary and a kind close: \"I will pass this to the Year 3 teacher today. Thank you for calling.\""]}},{"t":"h","c":{"en":"Greeting at the front desk, on WhatsApp and by email","ar":"Greeting at the front desk, on WhatsApp and by email"}},{"t":"list","c":{"en":["\u003cstrong>Front desk:\u003c/strong> greet, ask the purpose of the visit, and follow the school's visitor sign-in and badge steps every time.","\u003cstrong>WhatsApp:\u003c/strong> use only the school's approved number or group for school matters. Write short, polite messages. Do not share private details about a pupil in a group.","\u003cstrong>Email:\u003c/strong> use a clear subject line, a greeting, short sentences and a polite closing. Read it again before you press send. Check the name and address.","For all channels, use simple words. Avoid slang, short forms and jokes that may not translate well."],"ar":["\u003cstrong>Front desk:\u003c/strong> greet, ask the purpose of the visit, and follow the school's visitor sign-in and badge steps every time.","\u003cstrong>WhatsApp:\u003c/strong> use only the school's approved number or group for school matters. Write short, polite messages. Do not share private details about a pupil in a group.","\u003cstrong>Email:\u003c/strong> use a clear subject line, a greeting, short sentences and a polite closing. Read it again before you press send. Check the name and address.","For all channels, use simple words. Avoid slang, short forms and jokes that may not translate well."]}},{"t":"scenario","title":{"en":"Scenario: the confusing phone call","ar":"Scenario: the confusing phone call"},"c":{"en":"A parent calls and speaks quickly. You understand only part of the message. \u003cstrong>What do you do?\u003c/strong> Do not guess. Say kindly, \"I want to be sure I understand. Could you say that again a little slower?\" Then repeat back the main point. If the language is still difficult, offer to ask a colleague who speaks the parent's language to call back. The parent feels respected and the message is correct.","ar":"A parent calls and speaks quickly. You understand only part of the message. \u003cstrong>What do you do?\u003c/strong> Do not guess. Say kindly, \"I want to be sure I understand. Could you say that again a little slower?\" Then repeat back the main point. If the language is still difficult, offer to ask a colleague who speaks the parent's language to call back. The parent feels respected and the message is correct."}},{"t":"callout","k":"warn","title":{"en":"Protect private information","ar":"Protect private information"},"c":{"en":"Do not give a pupil's details to a caller until you are sure who they are and that they are allowed to know. If you are unsure, take a number and ask your line manager.","ar":"Do not give a pupil's details to a caller until you are sure who they are and that they are allowed to know. If you are unsure, take a number and ask your line manager."}}],"checks":[{"id":"m2q1","q":{"en":"A parent is explaining a problem and you think you know the answer already. What should you do?","ar":"A parent is explaining a problem and you think you know the answer already. What should you do?"},"opts":[{"en":"Interrupt politely and give your answer so that you save the parent some time","ar":"Interrupt politely and give your answer so that you save the parent some time"},{"en":"Nod and start looking for a form while the parent is still speaking","ar":"Nod and start looking for a form while the parent is still speaking"},{"en":"Tell the parent to write the problem in an email, as that is quicker","ar":"Tell the parent to write the problem in an email, as that is quicker"},{"en":"Let the parent finish, then repeat the main point to check you understood","ar":"Let the parent finish, then repeat the main point to check you understood"}],"correct":3,"expl":{"en":"Letting people finish shows respect and gives you the full facts. Repeating the main point checks that you understood and makes the person feel heard.","ar":"Letting people finish shows respect and gives you the full facts. Repeating the main point checks that you understood and makes the person feel heard."}},{"id":"m2q2","q":{"en":"Which phone greeting is best?","ar":"Which phone greeting is best?"},"opts":[{"en":"\"Good morning, Providence English Private School, this is Sara. How can I help you?\"","ar":"\"Good morning, Providence English Private School, this is Sara. How can I help you?\""},{"en":"\"Hello? Yes, who is this, please?\"","ar":"\"Hello? Yes, who is this, please?\""},{"en":"\"Reception. Please hold. I am busy with another call right now.\"","ar":"\"Reception. Please hold. I am busy with another call right now.\""},{"en":"\"Good morning. You have called the school. Please tell me the problem quickly.\"","ar":"\"Good morning. You have called the school. Please tell me the problem quickly.\""}],"correct":0,"expl":{"en":"A good greeting gives the school name, a friendly welcome and your name, then invites the caller to speak. It is polite and clear.","ar":"A good greeting gives the school name, a friendly welcome and your name, then invites the caller to speak. It is polite and clear."}},{"id":"m2q3","q":{"en":"A parent writes to you on WhatsApp asking about another pupil's behaviour. What is the best response?","ar":"A parent writes to you on WhatsApp asking about another pupil's behaviour. What is the best response?"},"opts":[{"en":"Give a short answer about what you saw, because the parent seems very worried","ar":"Give a short answer about what you saw, because the parent seems very worried"},{"en":"Reply politely that you cannot discuss other pupils, and offer to refer the message","ar":"Reply politely that you cannot discuss other pupils, and offer to refer the message"},{"en":"Ignore the message so that no private information is shared with anyone","ar":"Ignore the message so that no private information is shared with anyone"},{"en":"Forward the message to the class group so that the other parents can help","ar":"Forward the message to the class group so that the other parents can help"}],"correct":1,"expl":{"en":"Private information about pupils must not be shared. A polite reply that offers to refer the message helps the parent without breaking confidentiality. Ignoring it, or sharing it in a group, is wrong.","ar":"Private information about pupils must not be shared. A polite reply that offers to refer the message helps the parent without breaking confidentiality. Ignoring it, or sharing it in a group, is wrong."}}]},{"id":"m3","title":{"en":"Questions, Delays, Mistakes and Saying No Politely","ar":"Questions, Delays, Mistakes and Saying No Politely"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Every day brings questions we cannot answer at once, delays we did not plan, and sometimes mistakes. How we deal with them matters more than the problem itself. People forgive a problem if we are honest, helpful and quick.","ar":"Every day brings questions we cannot answer at once, delays we did not plan, and sometimes mistakes. How we deal with them matters more than the problem itself. People forgive a problem if we are honest, helpful and quick."}},{"t":"h","c":{"en":"When you get a question","ar":"When you get a question"}},{"t":"steps","c":{"en":["Listen to the whole question.","If you know the answer and are allowed to share it, give it clearly in simple words.","If you do not know, say so: \"I am not sure. Let me find out for you.\"","Never guess. A wrong answer causes more trouble than \"I will check.\"","Tell the person when you will come back with the answer, and then do it."],"ar":["Listen to the whole question.","If you know the answer and are allowed to share it, give it clearly in simple words.","If you do not know, say so: \"I am not sure. Let me find out for you.\"","Never guess. A wrong answer causes more trouble than \"I will check.\"","Tell the person when you will come back with the answer, and then do it."]}},{"t":"h","c":{"en":"When there is a delay","ar":"When there is a delay"}},{"t":"p","c":{"en":"Buses run late, printers stop and meetings run over. Do not hide a delay. Tell people early, tell them the reason in one simple sentence, and say what happens next.","ar":"Buses run late, printers stop and meetings run over. Do not hide a delay. Tell people early, tell them the reason in one simple sentence, and say what happens next."}},{"t":"table","head":{"en":["Weak message","Better message"],"ar":["Weak message","Better message"]},"rows":[{"en":["\"The bus is late.\"","\"The Year 2 bus is about 20 minutes late because of traffic. I will update you again at 3:30.\""],"ar":["\"The bus is late.\"","\"The Year 2 bus is about 20 minutes late because of traffic. I will update you again at 3:30.\""]},{"en":["\"I do not know.\"","\"I do not have that answer yet. I will ask the Year 4 coordinator and call you by the end of today.\""],"ar":["\"I do not know.\"","\"I do not have that answer yet. I will ask the Year 4 coordinator and call you by the end of today.\""]},{"en":["\"Wait here.\"","\"Please take a seat. Mr Ali will be with you in about five minutes.\""],"ar":["\"Wait here.\"","\"Please take a seat. Mr Ali will be with you in about five minutes.\""]}]},{"t":"callout","k":"tip","title":{"en":"Under-promise and over-deliver","ar":"Under-promise and over-deliver"},"c":{"en":"Only give a time you can keep. If you say \"this afternoon\", make sure it happens this afternoon. If it cannot, call before the time and give a new one.","ar":"Only give a time you can keep. If you say \"this afternoon\", make sure it happens this afternoon. If it cannot, call before the time and give a new one."}},{"t":"h","c":{"en":"When you make a mistake","ar":"When you make a mistake"}},{"t":"p","c":{"en":"We all make mistakes. A good response has four parts: say sorry, say what happened, fix it, and tell your line manager if the mistake could affect someone.","ar":"We all make mistakes. A good response has four parts: say sorry, say what happened, fix it, and tell your line manager if the mistake could affect someone."}},{"t":"list","c":{"en":["\u003cstrong>Say sorry simply:\u003c/strong> \"I am sorry. That was my mistake.\"","\u003cstrong>Explain briefly:\u003c/strong> do not make long excuses or blame others.","\u003cstrong>Fix it:\u003c/strong> correct the error as soon as you can.","\u003cstrong>Report it:\u003c/strong> if private information was shared or a child could be affected, tell your line manager the same day."],"ar":["\u003cstrong>Say sorry simply:\u003c/strong> \"I am sorry. That was my mistake.\"","\u003cstrong>Explain briefly:\u003c/strong> do not make long excuses or blame others.","\u003cstrong>Fix it:\u003c/strong> correct the error as soon as you can.","\u003cstrong>Report it:\u003c/strong> if private information was shared or a child could be affected, tell your line manager the same day."]}},{"t":"scenario","title":{"en":"Scenario: the email to the wrong parent","ar":"Scenario: the email to the wrong parent"},"c":{"en":"You send a trip reminder to the wrong parent by mistake. It has the name of a child who is not theirs. \u003cstrong>What should you do?\u003c/strong> Tell your line manager at once. Do not hide it or try to delete everything quietly. Follow the school's steps for a data mistake, which may include asking the person to delete the email. Apologise to anyone affected. UAE law on personal data (Federal Decree-Law No. 45 of 2021) treats child data as sensitive, so this must be reported and not hidden.","ar":"You send a trip reminder to the wrong parent by mistake. It has the name of a child who is not theirs. \u003cstrong>What should you do?\u003c/strong> Tell your line manager at once. Do not hide it or try to delete everything quietly. Follow the school's steps for a data mistake, which may include asking the person to delete the email. Apologise to anyone affected. UAE law on personal data (Federal Decree-Law No. 45 of 2021) treats child data as sensitive, so this must be reported and not hidden."}},{"t":"h","c":{"en":"Saying no politely","ar":"Saying no politely"}},{"t":"p","c":{"en":"Sometimes the answer must be no: you cannot let a visitor in without a badge, you cannot give out a phone number, you cannot change a rule. A \"no\" can still be kind.","ar":"Sometimes the answer must be no: you cannot let a visitor in without a badge, you cannot give out a phone number, you cannot change a rule. A \"no\" can still be kind."}},{"t":"steps","c":{"en":["Start with understanding: \"I can see why you need this.\"","Say no clearly and give the reason in one short sentence: \"I cannot give out a pupil's details because the school must protect them.\"","Offer what you can do: \"I can ask the teacher to call you today.\"","Stay calm and friendly even if the person is disappointed."],"ar":["Start with understanding: \"I can see why you need this.\"","Say no clearly and give the reason in one short sentence: \"I cannot give out a pupil's details because the school must protect them.\"","Offer what you can do: \"I can ask the teacher to call you today.\"","Stay calm and friendly even if the person is disappointed."]}}],"checks":[{"id":"m3q1","q":{"en":"A parent asks you a question about the exam timetable. You are not sure of the answer. What is best?","ar":"A parent asks you a question about the exam timetable. You are not sure of the answer. What is best?"},"opts":[{"en":"Give the answer you think is most likely so that the parent leaves happy and calm","ar":"Give the answer you think is most likely so that the parent leaves happy and calm"},{"en":"Tell the parent to look on the school website and come back if there is still a problem","ar":"Tell the parent to look on the school website and come back if there is still a problem"},{"en":"Say you will check, find the correct answer and tell the parent when you will reply","ar":"Say you will check, find the correct answer and tell the parent when you will reply"},{"en":"Suggest that the parent asks another parent whose child is in the same year group","ar":"Suggest that the parent asks another parent whose child is in the same year group"}],"correct":2,"expl":{"en":"Never guess. Saying \"I will check\" and then doing it builds trust. Always say when you will come back to the person.","ar":"Never guess. Saying \"I will check\" and then doing it builds trust. Always say when you will come back to the person."}},{"id":"m3q2","q":{"en":"The school bus will be 30 minutes late. What is the best way to tell parents?","ar":"The school bus will be 30 minutes late. What is the best way to tell parents?"},"opts":[{"en":"Wait until the bus is nearly there so that parents do not need to worry for long","ar":"Wait until the bus is nearly there so that parents do not need to worry for long"},{"en":"Tell only the parents who phone the school and ask where the bus is today","ar":"Tell only the parents who phone the school and ask where the bus is today"},{"en":"Say only that there is a small delay and give no reason or any new time","ar":"Say only that there is a small delay and give no reason or any new time"},{"en":"Tell them early, give a simple reason and say when you will update them","ar":"Tell them early, give a simple reason and say when you will update them"}],"correct":3,"expl":{"en":"Early, clear and honest messages let parents plan and reduce worry. Hiding or hinting at a delay causes more calls and less trust.","ar":"Early, clear and honest messages let parents plan and reduce worry. Hiding or hinting at a delay causes more calls and less trust."}},{"id":"m3q3","q":{"en":"A visitor asks you to let them walk in without signing in, because they are in a hurry. What should you say?","ar":"A visitor asks you to let them walk in without signing in, because they are in a hurry. What should you say?"},"opts":[{"en":"\"I understand you are in a hurry. Signing in is for safety, and it takes one minute.\"","ar":"\"I understand you are in a hurry. Signing in is for safety, and it takes one minute.\""},{"en":"\"No. These are the rules and I cannot change them for anyone at all.\"","ar":"\"No. These are the rules and I cannot change them for anyone at all.\""},{"en":"\"Go ahead this time, but please sign in on your way out.\"","ar":"\"Go ahead this time, but please sign in on your way out.\""},{"en":"\"Please ask the Principal first, because I am not allowed to speak to visitors.\"","ar":"\"Please ask the Principal first, because I am not allowed to speak to visitors.\""}],"correct":0,"expl":{"en":"A polite \"no\" shows understanding, gives a short reason and offers a quick way forward. Safety rules for visitors must always be followed.","ar":"A polite \"no\" shows understanding, gives a short reason and offers a quick way forward. Safety rules for visitors must always be followed."}}]},{"id":"m4","title":{"en":"Difficult and Upset People","ar":"Difficult and Upset People"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Most people are kind, but some days someone will be upset, worried or angry. Parents love their children very much, and fear can sound like anger. Your job is to stay calm, listen, show you care and keep everyone safe.","ar":"Most people are kind, but some days someone will be upset, worried or angry. Parents love their children very much, and fear can sound like anger. Your job is to stay calm, listen, show you care and keep everyone safe."}},{"t":"h","c":{"en":"Stay calm: look after yourself first","ar":"Stay calm: look after yourself first"}},{"t":"list","c":{"en":["Breathe slowly. Lower your voice, not raise it.","Do not take it personally. The person is usually upset about a problem, not about you.","Keep your body relaxed and your hands visible and open.","Stand or sit at an angle, not directly face to face, and keep a clear way to the door."],"ar":["Breathe slowly. Lower your voice, not raise it.","Do not take it personally. The person is usually upset about a problem, not about you.","Keep your body relaxed and your hands visible and open.","Stand or sit at an angle, not directly face to face, and keep a clear way to the door."]}},{"t":"h","c":{"en":"A simple method: listen, empathise, act","ar":"A simple method: listen, empathise, act"}},{"t":"steps","c":{"en":["\u003cstrong>Listen.\u003c/strong> Let the person speak without interrupting. Often they just need to be heard.","\u003cstrong>Empathise.\u003c/strong> Show you understand how they feel: \"I can see you are worried. I would feel the same.\"","\u003cstrong>Say what you can do.\u003c/strong> \"Let me take your details and ask the coordinator to call you today.\"","\u003cstrong>Move to a quieter place\u003c/strong> if the school allows it and it is safe. Do not take an angry person into a closed room alone.","\u003cstrong>Agree the next step\u003c/strong> and write it down."],"ar":["\u003cstrong>Listen.\u003c/strong> Let the person speak without interrupting. Often they just need to be heard.","\u003cstrong>Empathise.\u003c/strong> Show you understand how they feel: \"I can see you are worried. I would feel the same.\"","\u003cstrong>Say what you can do.\u003c/strong> \"Let me take your details and ask the coordinator to call you today.\"","\u003cstrong>Move to a quieter place\u003c/strong> if the school allows it and it is safe. Do not take an angry person into a closed room alone.","\u003cstrong>Agree the next step\u003c/strong> and write it down."]}},{"t":"callout","k":"tip","title":{"en":"Words that calm","ar":"Words that calm"},"c":{"en":"Try: \"Thank you for telling me.\" \"I understand.\" \"Let me see how I can help.\" Avoid: \"Calm down.\" \"That is not my problem.\" \"You are wrong.\"","ar":"Try: \"Thank you for telling me.\" \"I understand.\" \"Let me see how I can help.\" Avoid: \"Calm down.\" \"That is not my problem.\" \"You are wrong.\""}},{"t":"h","c":{"en":"Boundaries and when to get help","ar":"Boundaries and when to get help"}},{"t":"p","c":{"en":"Being polite does not mean accepting everything. You are allowed to protect yourself and the pupils nearby.","ar":"Being polite does not mean accepting everything. You are allowed to protect yourself and the pupils nearby."}},{"t":"table","head":{"en":["Situation","What to do"],"ar":["Situation","What to do"]},"rows":[{"en":["Raised voice but the person is still listening","Stay calm, listen, empathise, offer a next step"],"ar":["Raised voice but the person is still listening","Stay calm, listen, empathise, offer a next step"]},{"en":["Shouting, insults or strong anger that does not ease","Say calmly you will get a manager, then ask a colleague or senior staff member to help"],"ar":["Shouting, insults or strong anger that does not ease","Say calmly you will get a manager, then ask a colleague or senior staff member to help"]},{"en":["Threats, pushing, throwing things or any danger","Keep distance, get security and senior leadership at once, and call 999 if there is immediate danger"],"ar":["Threats, pushing, throwing things or any danger","Keep distance, get security and senior leadership at once, and call 999 if there is immediate danger"]},{"en":["A parent who is upset but also seems unwell or in distress","Stay kind, call a senior colleague or the school nurse for help"],"ar":["A parent who is upset but also seems unwell or in distress","Stay kind, call a senior colleague or the school nurse for help"]}]},{"t":"callout","k":"warn","title":{"en":"Never tolerate abuse","ar":"Never tolerate abuse"},"c":{"en":"Shouting insults, swearing at you, threatening you or touching you is not acceptable, however upset the person is. You do not have to stay. Say calmly, \"I want to help, but I cannot while you speak to me like this. I will get my manager.\" Then leave safely and report it to your line manager the same day.","ar":"Shouting insults, swearing at you, threatening you or touching you is not acceptable, however upset the person is. You do not have to stay. Say calmly, \"I want to help, but I cannot while you speak to me like this. I will get my manager.\" Then leave safely and report it to your line manager the same day."}},{"t":"scenario","title":{"en":"Scenario: the shouting father at reception","ar":"Scenario: the shouting father at reception"},"c":{"en":"A father comes to reception shouting that his daughter was left alone at the gate yesterday. Other pupils are nearby. \u003cstrong>What do you do?\u003c/strong> Keep your voice low: \"I am very sorry to hear this. I want to make sure it is looked at properly.\" Invite him to sit away from the pupils if it is safe, and ask a senior colleague to join you at once. Do not argue or defend yourself. If he threatens anyone, step back, keep pupils safe and call security and senior leadership. Write down what happened afterwards.","ar":"A father comes to reception shouting that his daughter was left alone at the gate yesterday. Other pupils are nearby. \u003cstrong>What do you do?\u003c/strong> Keep your voice low: \"I am very sorry to hear this. I want to make sure it is looked at properly.\" Invite him to sit away from the pupils if it is safe, and ask a senior colleague to join you at once. Do not argue or defend yourself. If he threatens anyone, step back, keep pupils safe and call security and senior leadership. Write down what happened afterwards."}},{"t":"p","c":{"en":"After a hard incident, tell your line manager how you feel. Support is available, and you do not have to carry it alone.","ar":"After a hard incident, tell your line manager how you feel. Support is available, and you do not have to carry it alone."}}],"checks":[{"id":"m4q1","q":{"en":"A mother is crying and angry because her son was hurt at play. What is the best first step?","ar":"A mother is crying and angry because her son was hurt at play. What is the best first step?"},"opts":[{"en":"Explain that accidents happen every day at school and cannot be stopped","ar":"Explain that accidents happen every day at school and cannot be stopped"},{"en":"Listen without interrupting and show that you understand she is worried","ar":"Listen without interrupting and show that you understand she is worried"},{"en":"Tell her gently to calm down, so that you can talk about it properly","ar":"Tell her gently to calm down, so that you can talk about it properly"},{"en":"Say that you are not the right person and walk away to find a teacher","ar":"Say that you are not the right person and walk away to find a teacher"}],"correct":1,"expl":{"en":"People who are upset first need to feel heard. Listening and showing understanding calms most situations. \"Calm down\" and quick excuses usually make things worse.","ar":"People who are upset first need to feel heard. Listening and showing understanding calms most situations. \"Calm down\" and quick excuses usually make things worse."}},{"id":"m4q2","q":{"en":"A parent starts shouting insults and swearing at you. He does not stop when you ask him kindly. What should you do?","ar":"A parent starts shouting insults and swearing at you. He does not stop when you ask him kindly. What should you do?"},"opts":[{"en":"Shout back, so that he understands how it feels to be spoken to in that way","ar":"Shout back, so that he understands how it feels to be spoken to in that way"},{"en":"Stay and take it quietly, because a parent always has a right to be upset","ar":"Stay and take it quietly, because a parent always has a right to be upset"},{"en":"Say calmly you will get a manager, step away safely and report it that day","ar":"Say calmly you will get a manager, step away safely and report it that day"},{"en":"Ask him to write the complaint, and then wait next to him until he has finished it","ar":"Ask him to write the complaint, and then wait next to him until he has finished it"}],"correct":2,"expl":{"en":"You must never tolerate abuse. You can stay polite while stepping away and getting help. Always report the incident to your line manager.","ar":"You must never tolerate abuse. You can stay polite while stepping away and getting help. Always report the incident to your line manager."}},{"id":"m4q3","q":{"en":"A visitor becomes threatening and pushes a chair near some pupils. What is the right action?","ar":"A visitor becomes threatening and pushes a chair near some pupils. What is the right action?"},"opts":[{"en":"Try to take the chair from him and calm him by speaking to him closely","ar":"Try to take the chair from him and calm him by speaking to him closely"},{"en":"Wait to see if he calms down in a few minutes, before telling a manager","ar":"Wait to see if he calms down in a few minutes, before telling a manager"},{"en":"Send a message to the parents' group so that they are aware of the situation","ar":"Send a message to the parents' group so that they are aware of the situation"},{"en":"Keep your distance, move pupils away, alert security and leaders, and call 999 if needed","ar":"Keep your distance, move pupils away, alert security and leaders, and call 999 if needed"}],"correct":3,"expl":{"en":"Safety comes first. Do not put yourself at risk. Get help from security and senior leadership straight away and call 999 if there is immediate danger.","ar":"Safety comes first. Do not put yourself at risk. Get help from security and senior leadership straight away and call 999 if there is immediate danger."}}]},{"id":"m5","title":{"en":"Following Up, Closing the Loop, Teamwork and Referring","ar":"Following Up, Closing the Loop, Teamwork and Referring"},"minutes":15,"blocks":[{"t":"p","c":{"en":"Good service does not end when the person leaves the desk. The most common complaint in any school is \"nobody got back to me.\" Following up fixes this. We call it closing the loop: the person asked, we acted, and we told them the result.","ar":"Good service does not end when the person leaves the desk. The most common complaint in any school is \"nobody got back to me.\" Following up fixes this. We call it closing the loop: the person asked, we acted, and we told them the result."}},{"t":"h","c":{"en":"Closing the loop","ar":"Closing the loop"}},{"t":"steps","c":{"en":["Write down every request: who asked, what they need, what you promised and by when.","Do the action or pass it to the right person, and say clearly what you need from them.","Check that it was done. Do not assume.","Go back to the person with the result, even if the result is \"not possible.\" Thank them for waiting.","If you cannot meet your time, tell them before the time passes, and give a new one."],"ar":["Write down every request: who asked, what they need, what you promised and by when.","Do the action or pass it to the right person, and say clearly what you need from them.","Check that it was done. Do not assume.","Go back to the person with the result, even if the result is \"not possible.\" Thank them for waiting.","If you cannot meet your time, tell them before the time passes, and give a new one."]}},{"t":"callout","k":"tip","title":{"en":"A small note saves a big problem","ar":"A small note saves a big problem"},"c":{"en":"Keep a simple notebook or the school's approved log for requests. If you are absent, a colleague can then carry on without asking the parent to repeat everything.","ar":"Keep a simple notebook or the school's approved log for requests. If you are absent, a colleague can then carry on without asking the parent to repeat everything."}},{"t":"h","c":{"en":"Referring to the right person","ar":"Referring to the right person"}},{"t":"p","c":{"en":"You do not have to know everything. You do have to know who does. A good referral is warm, not a brush-off. Never say \"that is not my job\" and stop.","ar":"You do not have to know everything. You do have to know who does. A good referral is warm, not a brush-off. Never say \"that is not my job\" and stop."}},{"t":"table","head":{"en":["Type of request","Usually refer to"],"ar":["Type of request","Usually refer to"]},"rows":[{"en":["A question about a child's learning or classwork","The class teacher or the coordinator"],"ar":["A question about a child's learning or classwork","The class teacher or the coordinator"]},{"en":["A serious concern about behaviour or a complaint","The coordinator or senior leadership, following the school's complaints process"],"ar":["A serious concern about behaviour or a complaint","The coordinator or senior leadership, following the school's complaints process"]},{"en":["An illness, injury or medicine question","The school nurse"],"ar":["An illness, injury or medicine question","The school nurse"]},{"en":["Anything that suggests a child may be at risk of harm","The DSL (Designated Safeguarding Lead), the same day"],"ar":["Anything that suggests a child may be at risk of harm","The DSL (Designated Safeguarding Lead), the same day"]},{"en":["Fee questions and payments","The accounts team, following the school's fee policy"],"ar":["Fee questions and payments","The accounts team, following the school's fee policy"]}]},{"t":"list","c":{"en":["Explain who you are sending them to and why.","Pass on the facts yourself so the person does not need to repeat the story.","Make sure the other person agrees to take it. Do not just send people away.","Check later that it happened."],"ar":["Explain who you are sending them to and why.","Pass on the facts yourself so the person does not need to repeat the story.","Make sure the other person agrees to take it. Do not just send people away.","Check later that it happened."]}},{"t":"h","c":{"en":"Teamwork","ar":"Teamwork"}},{"t":"p","c":{"en":"The parent does not see \"accounts\", \"reception\" and \"transport\". They see one school. If one team gives a different answer from another, trust falls. Share information with colleagues who need it, support each other at busy times and speak kindly about each other in front of visitors.","ar":"The parent does not see \"accounts\", \"reception\" and \"transport\". They see one school. If one team gives a different answer from another, trust falls. Share information with colleagues who need it, support each other at busy times and speak kindly about each other in front of visitors."}},{"t":"scenario","title":{"en":"Scenario: whose job is it?","ar":"Scenario: whose job is it?"},"c":{"en":"A parent tells you at the gate that her son seems afraid to come to school and does not want to say why. You work in the canteen. \u003cstrong>What do you do?\u003c/strong> Thank her for telling you, listen kindly and do not promise secrecy or try to solve it yourself. Pass what she said to the DSL or your line manager the same day, using the school's steps. Tell her who will follow up, and let her know the school will contact her. She is heard and the right person acts.","ar":"A parent tells you at the gate that her son seems afraid to come to school and does not want to say why. You work in the canteen. \u003cstrong>What do you do?\u003c/strong> Thank her for telling you, listen kindly and do not promise secrecy or try to solve it yourself. Pass what she said to the DSL or your line manager the same day, using the school's steps. Tell her who will follow up, and let her know the school will contact her. She is heard and the right person acts."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Give every person a warm greeting and your full attention in the first 30 seconds.\u003cbr>\u003cstrong>2.\u003c/strong> Listen, repeat the main point back, and never guess an answer.\u003cbr>\u003cstrong>3.\u003c/strong> Be honest about delays and mistakes, say sorry simply, fix it and report it.\u003cbr>\u003cstrong>4.\u003c/strong> Stay calm with upset people, but never tolerate abuse. Get help and keep everyone safe.\u003cbr>\u003cstrong>5.\u003c/strong> Close the loop: write it down, refer warmly to the right person, and go back with the result.","ar":"\u003cstrong>1.\u003c/strong> Give every person a warm greeting and your full attention in the first 30 seconds.\u003cbr>\u003cstrong>2.\u003c/strong> Listen, repeat the main point back, and never guess an answer.\u003cbr>\u003cstrong>3.\u003c/strong> Be honest about delays and mistakes, say sorry simply, fix it and report it.\u003cbr>\u003cstrong>4.\u003c/strong> Stay calm with upset people, but never tolerate abuse. Get help and keep everyone safe.\u003cbr>\u003cstrong>5.\u003c/strong> Close the loop: write it down, refer warmly to the right person, and go back with the result."}}],"checks":[{"id":"m5q1","q":{"en":"What does \"closing the loop\" mean?","ar":"What does \"closing the loop\" mean?"},"opts":[{"en":"Telling the person the result of their request, even when the answer is no","ar":"Telling the person the result of their request, even when the answer is no"},{"en":"Finishing your own task and then telling nobody, as the person will see the result","ar":"Finishing your own task and then telling nobody, as the person will see the result"},{"en":"Making sure that each request is passed to your line manager to deal with","ar":"Making sure that each request is passed to your line manager to deal with"},{"en":"Ending a phone call as soon as the caller has finished speaking","ar":"Ending a phone call as soon as the caller has finished speaking"}],"correct":0,"expl":{"en":"Closing the loop means the person asked, we acted and we told them the result. It avoids the complaint \"nobody got back to me\".","ar":"Closing the loop means the person asked, we acted and we told them the result. It avoids the complaint \"nobody got back to me\"."}},{"id":"m5q2","q":{"en":"A parent asks you about her son's medicine at lunchtime. This is not your area. What is the best action?","ar":"A parent asks you about her son's medicine at lunchtime. This is not your area. What is the best action?"},"opts":[{"en":"Tell her it is not your job and she should phone the school office later","ar":"Tell her it is not your job and she should phone the school office later"},{"en":"Say you will refer her to the school nurse, pass on the facts and check it happened","ar":"Say you will refer her to the school nurse, pass on the facts and check it happened"},{"en":"Give your best advice from what you know, so that she does not need to wait","ar":"Give your best advice from what you know, so that she does not need to wait"},{"en":"Tell her to send the nurse an email and wait for a reply there","ar":"Tell her to send the nurse an email and wait for a reply there"}],"correct":1,"expl":{"en":"A warm referral explains who will help, passes on the facts and checks later. A brush-off or a guess leaves the parent without help.","ar":"A warm referral explains who will help, passes on the facts and checks later. A brush-off or a guess leaves the parent without help."}},{"id":"m5q3","q":{"en":"A pupil's mother tells you quietly that her child is afraid to come to school and does not say why. You are in the canteen. What should you do?","ar":"A pupil's mother tells you quietly that her child is afraid to come to school and does not say why. You are in the canteen. What should you do?"},"opts":[{"en":"Reassure her that it is probably nothing at all and ask her to speak to the teacher","ar":"Reassure her that it is probably nothing at all and ask her to speak to the teacher"},{"en":"Keep it private to protect her trust, and quietly watch the pupil for a few days","ar":"Keep it private to protect her trust, and quietly watch the pupil for a few days"},{"en":"Listen kindly, promise no secrecy, and tell the DSL the same day","ar":"Listen kindly, promise no secrecy, and tell the DSL the same day"},{"en":"Ask the pupil in the canteen what is wrong, so that you can find the real cause","ar":"Ask the pupil in the canteen what is wrong, so that you can find the real cause"}],"correct":2,"expl":{"en":"Any concern about a child's safety or wellbeing must be reported to the DSL the same day. Never promise secrecy and never investigate on your own.","ar":"Any concern about a child's safety or wellbeing must be reported to the DSL the same day. Never promise secrecy and never investigate on your own."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A parent walks up to your desk while you are talking to a colleague. What should you do?","ar":"A parent walks up to your desk while you are talking to a colleague. What should you do?"},"opts":[{"en":"Finish your conversation first, because it would be rude to stop halfway","ar":"Finish your conversation first, because it would be rude to stop halfway"},{"en":"Wave at the parent and carry on until you are fully free to help","ar":"Wave at the parent and carry on until you are fully free to help"},{"en":"Ask the parent to wait in the car park until the colleague has gone","ar":"Ask the parent to wait in the car park until the colleague has gone"},{"en":"Pause, greet the parent warmly and say you will be with them in a moment","ar":"Pause, greet the parent warmly and say you will be with them in a moment"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"Your colleague from the maths department asks you to print an urgent worksheet. What is the best way to see this request?","ar":"Your colleague from the maths department asks you to print an urgent worksheet. What is the best way to see this request?"},"opts":[{"en":"As a customer request: help promptly, and tell them if it will be late","ar":"As a customer request: help promptly, and tell them if it will be late"},{"en":"As less important than a parent request, so you can do it later when you are free","ar":"As less important than a parent request, so you can do it later when you are free"},{"en":"As the job of the department head, so you should politely send them away","ar":"As the job of the department head, so you should politely send them away"},{"en":"As a small favour that needs no promise of a time or any reply from you","ar":"As a small favour that needs no promise of a time or any reply from you"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A visitor arrives with a big smile but has no badge and no appointment. Which is the best first impression and the safest action?","ar":"A visitor arrives with a big smile but has no badge and no appointment. Which is the best first impression and the safest action?"},"opts":[{"en":"Greet warmly and let them walk in, because they look friendly and are in a hurry","ar":"Greet warmly and let them walk in, because they look friendly and are in a hurry"},{"en":"Greet warmly, ask the purpose and follow the school's sign-in steps first","ar":"Greet warmly, ask the purpose and follow the school's sign-in steps first"},{"en":"Ask them to leave the building and return when they have booked a visit","ar":"Ask them to leave the building and return when they have booked a visit"},{"en":"Greet warmly and ask a pupil who is nearby to show them to the right office","ar":"Greet warmly and ask a pupil who is nearby to show them to the right office"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"You answer a call and cannot understand the caller's name. What should you do?","ar":"You answer a call and cannot understand the caller's name. What should you do?"},"opts":[{"en":"Guess the name and use it, so the call can move quickly","ar":"Guess the name and use it, so the call can move quickly"},{"en":"Say the line is bad and hang up, hoping the caller phones again","ar":"Say the line is bad and hang up, hoping the caller phones again"},{"en":"Ask the caller kindly to repeat the name, and write it down","ar":"Ask the caller kindly to repeat the name, and write it down"},{"en":"Continue without the name, since you can find it later from the record","ar":"Continue without the name, since you can find it later from the record"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"You are writing an email to a parent about a trip. What should you do before you press send?","ar":"You are writing an email to a parent about a trip. What should you do before you press send?"},"opts":[{"en":"Add several attachments so that the parent has all the information","ar":"Add several attachments so that the parent has all the information"},{"en":"Send it at once, because a quick reply always shows good service","ar":"Send it at once, because a quick reply always shows good service"},{"en":"Copy in a few other parents so that everyone gets the same message","ar":"Copy in a few other parents so that everyone gets the same message"},{"en":"Read it again and check the name, the address and the facts","ar":"Read it again and check the name, the address and the facts"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"A parent speaks quickly and you only catch part of the message about the bus. What is best?","ar":"A parent speaks quickly and you only catch part of the message about the bus. What is best?"},"opts":[{"en":"Ask kindly for it again, more slowly, then repeat the main point back","ar":"Ask kindly for it again, more slowly, then repeat the main point back"},{"en":"Say \"yes, yes\" so that the parent feels you understood, then try to work it out later","ar":"Say \"yes, yes\" so that the parent feels you understood, then try to work it out later"},{"en":"Reply with a standard answer about buses, in case it happens to cover the question","ar":"Reply with a standard answer about buses, in case it happens to cover the question"},{"en":"Ask the parent to come back later with someone who can speak English well","ar":"Ask the parent to come back later with someone who can speak English well"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A parent asks when the school bus will arrive. You do not know. What do you say?","ar":"A parent asks when the school bus will arrive. You do not know. What do you say?"},"opts":[{"en":"\"It is usually on time, so I think it will be here in just a few minutes.\"","ar":"\"It is usually on time, so I think it will be here in just a few minutes.\""},{"en":"\"I do not know yet. I will ask transport now and call you back in 10 minutes.\"","ar":"\"I do not know yet. I will ask transport now and call you back in 10 minutes.\""},{"en":"\"I cannot say. You should phone the bus company yourself to find out.\"","ar":"\"I cannot say. You should phone the bus company yourself to find out.\""},{"en":"\"Please ask the driver when he arrives, as I do not handle buses.\"","ar":"\"Please ask the driver when he arrives, as I do not handle buses.\""}],"correct":1},{"id":"e8","mod":3,"q":{"en":"You realise you gave a parent the wrong date for a school event. What is the right response?","ar":"You realise you gave a parent the wrong date for a school event. What is the right response?"},"opts":[{"en":"Wait and see whether the parent notices the mistake, since many dates are changed later","ar":"Wait and see whether the parent notices the mistake, since many dates are changed later"},{"en":"Send the correct date to all the parents' groups, without any explanation or apology","ar":"Send the correct date to all the parents' groups, without any explanation or apology"},{"en":"Contact the parent soon, say sorry, give the right date and tell your line manager","ar":"Contact the parent soon, say sorry, give the right date and tell your line manager"},{"en":"Ask a colleague to tell the parent on the next day, as you are very busy now","ar":"Ask a colleague to tell the parent on the next day, as you are very busy now"}],"correct":2},{"id":"e9","mod":3,"q":{"en":"A parent asks you for the phone number of another child's mother. What is the best reply?","ar":"A parent asks you for the phone number of another child's mother. What is the best reply?"},"opts":[{"en":"\"I am sorry, I am not allowed to do that. Please do not ask me again.\"","ar":"\"I am sorry, I am not allowed to do that. Please do not ask me again.\""},{"en":"\"Of course, but please do not tell her that you got it from the school.\"","ar":"\"Of course, but please do not tell her that you got it from the school.\""},{"en":"\"Ask the class teacher, as they may give it to you after school.\"","ar":"\"Ask the class teacher, as they may give it to you after school.\""},{"en":"\"I cannot share other families' details, but I can pass on your number.\"","ar":"\"I cannot share other families' details, but I can pass on your number.\""}],"correct":3},{"id":"e10","mod":4,"q":{"en":"A mother is loud and angry at reception about a lost jacket. She is not threatening anyone. What is the best response?","ar":"A mother is loud and angry a const checkKey = (m, q) => m.id + ':' + q.id;

const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

function renderBlock(b){

  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return '';
}
