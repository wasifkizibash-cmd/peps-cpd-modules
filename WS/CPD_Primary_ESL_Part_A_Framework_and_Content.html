eviewed, extended and integrated into different practice tasks\". Its example is connectives. At Stage 1 learners are introduced to basic connectives such as \u003cem>and\u003c/em>. At Stage 2 this is extended to a wider range of connectives, and learners begin to integrate connectives into written practice. You can see this in the codes: 1Us.04 uses \u003cem>and\u003c/em>, 2Us.04 adds \u003cem>but, or, then\u003c/em>, and 2Wor.02 asks learners to link words, phrases and short sentences in writing with support.","ar":"The framework says that as learners move through the stages, \"previously studied language should be reviewed, extended and integrated into different practice tasks\". Its example is connectives. At Stage 1 learners are introduced to basic connectives such as \u003cem>and\u003c/em>. At Stage 2 this is extended to a wider range of connectives, and learners begin to integrate connectives into written practice. You can see this in the codes: 1Us.04 uses \u003cem>and\u003c/em>, 2Us.04 adds \u003cem>but, or, then\u003c/em>, and 2Wor.02 asks learners to link words, phrases and short sentences in writing with support."}},{"t":"h","c":{"en":"A worked example: one theme, five strands","ar":"A worked example: one theme, five strands"}},{"t":"p","c":{"en":"This example is \u003cstrong>good practice\u003c/strong>, not a Cambridge scheme of work. It shows how a Stage 2 teacher could build a short unit on \"My classroom\" and still keep every activity attached to a real objective code.","ar":"This example is \u003cstrong>good practice\u003c/strong>, not a Cambridge scheme of work. It shows how a Stage 2 teacher could build a short unit on \"My classroom\" and still keep every activity attached to a real objective code."}},{"t":"table","head":{"en":["Strand","Objective used (Stage 2)","Possible activity (25 to 30 pupils)"],"ar":["Strand","Objective used (Stage 2)","Possible activity (25 to 30 pupils)"]},"rows":[{"en":["Listening","2Ld.01: understand a short sequence of familiar instructions, with little or no support","Teacher gives two-step instructions (\"Take a pencil. Put it on the desk.\"); pupils act"],"ar":["Listening","2Ld.01: understand a short sequence of familiar instructions, with little or no support","Teacher gives two-step instructions (\"Take a pencil. Put it on the desk.\"); pupils act"]},{"en":["Speaking","2Sc.03: ask questions to find out personal information and respond","Pairs interview each other: \"What's your name? How old are you?\" and report to the group"],"ar":["Speaking","2Sc.03: ask questions to find out personal information and respond","Pairs interview each other: \"What's your name? How old are you?\" and report to the group"]},{"en":["Reading","2Rd.03: read and follow, with support, short, familiar instructions","Pupils read picture-supported cards (\"Open your book\") and do them"],"ar":["Reading","2Rd.03: read and follow, with support, short, familiar instructions","Pupils read picture-supported cards (\"Open your book\") and do them"]},{"en":["Writing","2Wc.01: write, with support, simple phrases to give personal information","Pupils complete a \"Me\" card with their name, age and favourite colour"],"ar":["Writing","2Wc.01: write, with support, simple phrases to give personal information","Pupils complete a \"Me\" card with their name, age and favourite colour"]},{"en":["Use of English","2Ug.01: use question words and structures to ask basic questions","Question-word posters (what, where, who) reused in the speaking and writing tasks"],"ar":["Use of English","2Ug.01: use question words and structures to ask basic questions","Question-word posters (what, where, who) reused in the speaking and writing tasks"]}]},{"t":"p","c":{"en":"Notice how the Use of English objective is not taught in isolation. The question words appear in the listening task, the interview and the \"Me\" card. Pupils meet the same language four times in four ways, which supports the revisiting that the framework describes. Notice, too, that the teacher does not need a perfect balance of minutes. A lesson might spend most time on speaking and only a short time on writing. What matters is that pupils get opportunities across the skills over the lesson and unit.","ar":"Notice how the Use of English objective is not taught in isolation. The question words appear in the listening task, the interview and the \"Me\" card. Pupils meet the same language four times in four ways, which supports the revisiting that the framework describes. Notice, too, that the teacher does not need a perfect balance of minutes. A lesson might spend most time on speaking and only a short time on writing. What matters is that pupils get opportunities across the skills over the lesson and unit."}},{"t":"h","c":{"en":"Phonics and handwriting inside the integrated approach","ar":"Phonics and handwriting inside the integrated approach"}},{"t":"p","c":{"en":"Version 3.0 added information about phonics and handwriting. The framework explains that phonics is a way of teaching reading and spelling by relating sounds (phonemes) to written letters and groups of letters (graphemes), and says research shows it can be particularly helpful for children whose home language is not English. It adds that when teaching phonics you should build on children's oral language in their home language, for example by identifying English sounds that may be harder because they are not present in the home language.","ar":"Version 3.0 added information about phonics and handwriting. The framework explains that phonics is a way of teaching reading and spelling by relating sounds (phonemes) to written letters and groups of letters (graphemes), and says research shows it can be particularly helpful for children whose home language is not English. It adds that when teaching phonics you should build on children's oral language in their home language, for example by identifying English sounds that may be harder because they are not present in the home language."}},{"t":"list","c":{"en":["\u003cstrong>Reading:\u003c/strong> Stage 1 includes high-level objectives for learning to read using a synthetic phonics approach: 1Rd.01 (recognise, identify, sound and name the letters of the alphabet) and 1Rd.02 (recognise, identify and blend sounds in individual words).","\u003cstrong>Handwriting:\u003c/strong> high-level objectives appear in Stages 3 to 6 (3Wca.01 legible handwriting; 4Wca.01 with some speed and fluency; 5Wca.01 with increasing speed and fluency; 6Wca.01 with appropriate speed and fluency). Stage 1 and 2 writing objectives about letter formation and consistent size and spacing (1Wca.01, 1Wca.02, 2Wca.01) lay the ground.","\u003cstrong>Connection:\u003c/strong> the framework says that making connections between phonics and handwriting helps consolidate letter-sound recall, supporting both reading and writing. It also says both need systematic development through regular, dedicated teaching, and points to the Cambridge Phonics and Handwriting Framework for a recommended structure and order."],"ar":["\u003cstrong>Reading:\u003c/strong> Stage 1 includes high-level objectives for learning to read using a synthetic phonics approach: 1Rd.01 (recognise, identify, sound and name the letters of the alphabet) and 1Rd.02 (recognise, identify and blend sounds in individual words).","\u003cstrong>Handwriting:\u003c/strong> high-level objectives appear in Stages 3 to 6 (3Wca.01 legible handwriting; 4Wca.01 with some speed and fluency; 5Wca.01 with increasing speed and fluency; 6Wca.01 with appropriate speed and fluency). Stage 1 and 2 writing objectives about letter formation and consistent size and spacing (1Wca.01, 1Wca.02, 2Wca.01) lay the ground.","\u003cstrong>Connection:\u003c/strong> the framework says that making connections between phonics and handwriting helps consolidate letter-sound recall, supporting both reading and writing. It also says both need systematic development through regular, dedicated teaching, and points to the Cambridge Phonics and Handwriting Framework for a recommended structure and order."]}},{"t":"h","c":{"en":"Schemes of work, the teacher guide and endorsed resources","ar":"Schemes of work, the teacher guide and endorsed resources"}},{"t":"p","c":{"en":"The framework describes the teacher guide as the document that supports you to plan and deliver lessons using effective teaching and learning approaches. It describes endorsed resources as published materials supported by Cambridge. It states that \"there is no requirement for endorsed textbooks to follow the teaching order suggested in the Cambridge Primary schemes of work\", and that if a resource is endorsed you can be confident that all the learning objectives are covered. For your planning, the safe rule is: the learning objectives are the curriculum; units, activities and textbooks are ways to teach them.","ar":"The framework describes the teacher guide as the document that supports you to plan and deliver lessons using effective teaching and learning approaches. It describes endorsed resources as published materials supported by Cambridge. It states that \"there is no requirement for endorsed textbooks to follow the teaching order suggested in the Cambridge Primary schemes of work\", and that if a resource is endorsed you can be confident that all the learning objectives are covered. For your planning, the safe rule is: the learning objectives are the curriculum; units, activities and textbooks are ways to teach them."}},{"t":"scenario","title":{"en":"\"We do grammar on Mondays and reading on Tuesdays\"","ar":"\"We do grammar on Mondays and reading on Tuesdays\""},"c":{"en":"A teacher in your phase describes a weekly plan: Monday grammar worksheets, Tuesday reading, Wednesday writing, Thursday speaking, with no link between them. The framework does not forbid focused practice, but it expects each lesson and unit to give opportunities for all four skills with a Use of English focus. Suggest keeping the same weekly pattern if the timetable needs it, but choosing one theme for the week, selecting one or two Use of English objectives for the week (for example 3Us.04 connectives that give reasons, such as \u003cem>because\u003c/em>), and letting the week's tasks reuse that language. Then Monday's grammar is used on Tuesday when pupils read a text with \u003cem>because\u003c/em>, on Wednesday when they write reasons, and on Thursday when they speak. Present this as a suggestion for planning, not a Cambridge rule about timetables.","ar":"A teacher in your phase describes a weekly plan: Monday grammar worksheets, Tuesday reading, Wednesday writing, Thursday speaking, with no link between them. The framework does not forbid focused practice, but it expects each lesson and unit to give opportunities for all four skills with a Use of English focus. Suggest keeping the same weekly pattern if the timetable needs it, but choosing one theme for the week, selecting one or two Use of English objectives for the week (for example 3Us.04 connectives that give reasons, such as \u003cem>because\u003c/em>), and letting the week's tasks reuse that language. Then Monday's grammar is used on Tuesday when pupils read a text with \u003cem>because\u003c/em>, on Wednesday when they write reasons, and on Thursday when they speak. Present this as a suggestion for planning, not a Cambridge rule about timetables."}},{"t":"callout","k":"warn","title":{"en":"Common misconception: integrated means every minute has every skill","ar":"Common misconception: integrated means every minute has every skill"},"c":{"en":"The framework asks for opportunities for all four skills in each lesson and unit. It does not say every activity must contain reading, writing, listening and speaking at once. A ten-minute pronunciation game is still fine. Ask whether, across the lesson and the unit, learners listen, speak, read and write, and whether the Use of English focus connects them.","ar":"The framework asks for opportunities for all four skills in each lesson and unit. It does not say every activity must contain reading, writing, listening and speaking at once. A ten-minute pronunciation game is still fine. Ask whether, across the lesson and the unit, learners listen, speak, read and write, and whether the Use of English focus connects them."}}],"checks":[{"id":"m4q1","q":{"en":"According to the framework, what should each lesson and unit provide?","ar":"According to the framework, what should each lesson and unit provide?"},"opts":[{"en":"A full grammar worksheet followed by a separate reading test on the same objective","ar":"A full grammar worksheet followed by a separate reading test on the same objective"},{"en":"Opportunities to practise all four skills and a focus on one or more Use of English objectives","ar":"Opportunities to practise all four skills and a focus on one or more Use of English objectives"},{"en":"One skill only, chosen by the textbook, with Use of English taught on another day","ar":"One skill only, chosen by the textbook, with Use of English taught on another day"},{"en":"Practice of reading and writing only, because speaking and listening are tested elsewhere","ar":"Practice of reading and writing only, because speaking and listening are tested elsewhere"}],"correct":1,"expl":{"en":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English learning objectives.","ar":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English learning objectives."}},{"id":"m4q2","q":{"en":"The framework uses connectives as an example of revisiting language. What happens between Stage 1 and Stage 2?","ar":"The framework uses connectives as an example of revisiting language. What happens between Stage 1 and Stage 2?"},"opts":[{"en":"At Stage 1 learners use all common connectives, and Stage 2 repeats the same ones with no new language","ar":"At Stage 1 learners use all common connectives, and Stage 2 repeats the same ones with no new language"},{"en":"At Stage 1 learners meet because and so, and at Stage 2 they no longer need to use connectives","ar":"At Stage 1 learners meet because and so, and at Stage 2 they no longer need to use connectives"},{"en":"The range widens beyond and, and writing practice begins","ar":"The range widens beyond and, and writing practice begins"},{"en":"At Stage 1 learners write paragraphs with connectives, and at Stage 2 they only speak them aloud","ar":"At Stage 1 learners write paragraphs with connectives, and at Stage 2 they only speak them aloud"}],"correct":2,"expl":{"en":"The framework's example: basic connectives such as and at Stage 1, extended at Stage 2 to a wider range with written practice (see 1Us.04, 2Us.04 and 2Wor.02).","ar":"The framework's example: basic connectives such as and at Stage 1, extended at Stage 2 to a wider range with written practice (see 1Us.04, 2Us.04 and 2Wor.02)."}},{"id":"m4q3","q":{"en":"Which statement about schemes of work is correct according to the framework?","ar":"Which statement about schemes of work is correct according to the framework?"},"opts":[{"en":"They are compulsory, because they set the only order in which objectives may be taught","ar":"They are compulsory, because they set the only order in which objectives may be taught"},{"en":"They contain a full lesson for every minute of teaching time in each stage of the course, so nothing else is needed","ar":"They contain a full lesson for every minute of teaching time in each stage of the course, so nothing else is needed"},{"en":"They are needed only for Stages 1 and 2, because later stages use endorsed textbooks instead","ar":"They are needed only for Stages 1 and 2, because later stages use endorsed textbooks instead"},{"en":"They are not required; they show types of activity and depth, and similar activities may be used","ar":"They are not required; they show types of activity and depth, and similar activities may be used"}],"correct":3,"expl":{"en":"The framework says you do not need to use the ideas in schemes of work, which indicate types of activities and the intended depth and breadth; they do not fill all the teaching time, so other similar activities should be used.","ar":"The framework says you do not need to use the ideas in schemes of work, which indicate types of activities and the intended depth and breadth; they do not fill all the teaching time, so other similar activities should be used."}}]},{"id":"m5","title":{"en":"The Reading Strand Across Stages 1 to 6","ar":"The Reading Strand Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Reading is where many ESL teachers feel the most pressure. Reading opens the door to every other subject, and it is where Checkpoint results are most visible. The Reading strand has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). This module traces what each asks of learners from Stage 1 to Stage 6, using the exact codes so that you can check them in your copy of the framework.","ar":"Reading is where many ESL teachers feel the most pressure. Reading opens the door to every other subject, and it is where Checkpoint results are most visible. The Reading strand has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). This module traces what each asks of learners from Stage 1 to Stage 6, using the exact codes so that you can check them in your copy of the framework."}},{"t":"h","c":{"en":"What the three sub-strands mean","ar":"What the three sub-strands mean"}},{"t":"list","c":{"en":["\u003cstrong>Reading for global meaning (Rm):\u003c/strong> understanding the main points of short and extended texts, for example the topic or theme, who the author is, who the target reader is, and the author's purpose.","\u003cstrong>Reading for detail (Rd):\u003c/strong> understanding detail, including recognising letters and words, understanding specific information, instructions and questions, deducing meaning from context, and (from Stage 6) following a line of argument.","\u003cstrong>Reading for opinion (Ro):\u003c/strong> recognising the opinions of the writer or writers in short and extended text."],"ar":["\u003cstrong>Reading for global meaning (Rm):\u003c/strong> understanding the main points of short and extended texts, for example the topic or theme, who the author is, who the target reader is, and the author's purpose.","\u003cstrong>Reading for detail (Rd):\u003c/strong> understanding detail, including recognising letters and words, understanding specific information, instructions and questions, deducing meaning from context, and (from Stage 6) following a line of argument.","\u003cstrong>Reading for opinion (Ro):\u003c/strong> recognising the opinions of the writer or writers in short and extended text."]}},{"t":"p","c":{"en":"Look at the pattern in the stages. Stage 1 has \u003cstrong>only\u003c/strong> Reading for detail (four objectives). Reading for global meaning appears from Stage 2. Reading for opinion appears from Stage 3. That order makes sense: first learners must decode letters and words, then understand a short text as a whole, then notice that writers have views.","ar":"Look at the pattern in the stages. Stage 1 has \u003cstrong>only\u003c/strong> Reading for detail (four objectives). Reading for global meaning appears from Stage 2. Reading for opinion appears from Stage 3. That order makes sense: first learners must decode letters and words, then understand a short text as a whole, then notice that writers have views."}},{"t":"h","c":{"en":"Stage 1: from letters to labelled pictures","ar":"Stage 1: from letters to labelled pictures"}},{"t":"p","c":{"en":"Stage 1 reading is about the building blocks. 1Rd.01 and 1Rd.02 are the synthetic phonics objectives from Module 4: name and sound the letters of the alphabet, then recognise and blend sounds in individual words. 1Rd.03 asks learners to understand, with support, simple words and phrases in short, simple, illustrated texts. 1Rd.04 asks them to begin to deduce the meaning of a limited range of simple, familiar words, with support, by linking them to pictures. Picture support is not cheating. It is written into the objective.","ar":"Stage 1 reading is about the building blocks. 1Rd.01 and 1Rd.02 are the synthetic phonics objectives from Module 4: name and sound the letters of the alphabet, then recognise and blend sounds in individual words. 1Rd.03 asks learners to understand, with support, simple words and phrases in short, simple, illustrated texts. 1Rd.04 asks them to begin to deduce the meaning of a limited range of simple, familiar words, with support, by linking them to pictures. Picture support is not cheating. It is written into the objective."}},{"t":"h","c":{"en":"Stages 2 to 6: reading widens and deepens","ar":"Stages 2 to 6: reading widens and deepens"}},{"t":"table","head":{"en":["Skill","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Skill","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Main points of a text","2Rm.01: with support, short, simple texts","3Rm.01: with little or no support, short, simple texts","4Rm.01: with support, some of the main points","5Rm.01: with little or no support, most of the main points","6Rm.01: with support, most of the main points of short and extended texts"],"ar":["Main points of a text","2Rm.01: with support, short, simple texts","3Rm.01: with little or no support, short, simple texts","4Rm.01: with support, some of the main points","5Rm.01: with little or no support, most of the main points","6Rm.01: with support, most of the main points of short and extended texts"]},{"en":["Reading with confidence and enjoyment","2Rm.02: begin to read, with support, simple fiction and non-fiction","3Rm.02: read, with support, a limited range","4Rm.02: read, with support, an increasing range","5Rm.02: read, with little or no support, a range","6Rm.02: read independently a range"],"ar":["Reading with confidence and enjoyment","2Rm.02: begin to read, with support, simple fiction and non-fiction","3Rm.02: read, with support, a limited range","4Rm.02: read, with support, an increasing range","5Rm.02: read, with little or no support, a range","6Rm.02: read independently a range"]},{"en":["Specific information and detail","2Rd.02: some, with support, illustrated texts","3Rd.01: most, with support","4Rd.01: most, with little or no support","5Rd.01: most (no support phrase)","6Rd.01: most, with support, short and extended texts"],"ar":["Specific information and detail","2Rd.02: some, with support, illustrated texts","3Rd.01: most, with support","4Rd.01: most, with little or no support","5Rd.01: most (no support phrase)","6Rd.01: most, with support, short and extended texts"]},{"en":["Following instructions","2Rd.03: with support, short, familiar","3Rd.02: a short sequence of familiar","4Rd.02: an increasing range","5Rd.02: a range","6Rd.02: read and follow instructions"],"ar":["Following instructions","2Rd.03: with support, short, familiar","3Rd.02: a short sequence of familiar","4Rd.02: an increasing range","5Rd.02: a range","6Rd.02: read and follow instructions"]},{"en":["Deducing meaning from context","2Rd.04: increasing range of words, linking to pictures","3Rd.03: with support, short, illustrated texts","4Rd.03: with little or no support","5Rd.03: in short texts","6Rd.04: with support, short and extended texts"],"ar":["Deducing meaning from context","2Rd.04: increasing range of words, linking to pictures","3Rd.03: with support, short, illustrated texts","4Rd.03: with little or no support","5Rd.03: in short texts","6Rd.04: with support, short and extended texts"]},{"en":["Opinion of the writer","Not yet","3Ro.01: with support","4Ro.01: with little or no support","5Ro.01: recognise (no support phrase)","6Ro.01: with support, short and extended texts"],"ar":["Opinion of the writer","Not yet","3Ro.01: with support","4Ro.01: with little or no support","5Ro.01: recognise (no support phrase)","6Ro.01: with support, short and extended texts"]}]},{"t":"p","c":{"en":"Read the table across a row and you can see the \"can-do\" ladder. Read it down a column and you see what a typical stage looks like.","ar":"Read the table across a row and you can see the \"can-do\" ladder. Read it down a column and you see what a typical stage looks like."}},{"t":"callout","k":"key","title":{"en":"A surprise in the table: support comes back at Stage 6","ar":"A surprise in the table: support comes back at Stage 6"},"c":{"en":"At Stage 5, several objectives have no support phrase or say \"little or no support\". At Stage 6, support appears again: 6Rm.01, 6Rd.01 and 6Rd.04 say \"with support\". Why? Because the texts also change. Stage 6 objectives speak of \"short and extended\" texts, and at Stage 6 learners also follow a line of argument (6Rd.03). Longer and more complex texts bring back the need for support. Progress is not always a straight line of less and less help. Sometimes the task gets harder and support returns, which is normal.","ar":"At Stage 5, several objectives have no support phrase or say \"little or no support\". At Stage 6, support appears again: 6Rm.01, 6Rd.01 and 6Rd.04 say \"with support\". Why? Because the texts also change. Stage 6 objectives speak of \"short and extended\" texts, and at Stage 6 learners also follow a line of argument (6Rd.03). Longer and more complex texts bring back the need for support. Progress is not always a straight line of less and less help. Sometimes the task gets harder and support returns, which is normal."}},{"t":"h","c":{"en":"Other Stage 4 to 6 reading objectives to notice","ar":"Other Stage 4 to 6 reading objectives to notice"}},{"t":"list","c":{"en":["\u003cstrong>Words and their families:\u003c/strong> 4Rd.04 asks learners to explore words with common roots and derivations, including links to words in their first language. 5Rd.04 asks them to identify and explore words with common roots and compare their meanings. This is a chance to use home-language knowledge as a strength.","\u003cstrong>Idioms:\u003c/strong> 6Rd.05 asks learners to explore common idiomatic phrases and their meanings.","\u003cstrong>Argument:\u003c/strong> 6Rd.03 asks learners to understand, with support, most of the detail of an argument in short and extended texts. This is the first time the Reading strand speaks of an argument."],"ar":["\u003cstrong>Words and their families:\u003c/strong> 4Rd.04 asks learners to explore words with common roots and derivations, including links to words in their first language. 5Rd.04 asks them to identify and explore words with common roots and compare their meanings. This is a chance to use home-language knowledge as a strength.","\u003cstrong>Idioms:\u003c/strong> 6Rd.05 asks learners to explore common idiomatic phrases and their meanings.","\u003cstrong>Argument:\u003c/strong> 6Rd.03 asks learners to understand, with support, most of the detail of an argument in short and extended texts. This is the first time the Reading strand speaks of an argument."]}},{"t":"p","c":{"en":"The glossary helps with the verbs. \u003cem>Deduce\u003c/em> means to arrive at a fact or conclusion by reasoning. \u003cem>Explore\u003c/em> means to investigate, look for patterns and discuss examples to inform understanding of a concept. \u003cem>Identify\u003c/em> means to locate features, such as words from a particular word class, in a text. So an \"explore\" objective like 4Rd.04 is not a vocabulary test. It is a pattern-hunting discussion, such as pupils sorting words from the same root and talking about what they have in common.","ar":"The glossary helps with the verbs. \u003cem>Deduce\u003c/em> means to arrive at a fact or conclusion by reasoning. \u003cem>Explore\u003c/em> means to investigate, look for patterns and discuss examples to inform understanding of a concept. \u003cem>Identify\u003c/em> means to locate features, such as words from a particular word class, in a text. So an \"explore\" objective like 4Rd.04 is not a vocabulary test. It is a pattern-hunting discussion, such as pupils sorting words from the same root and talking about what they have in common."}},{"t":"h","c":{"en":"Teaching examples","ar":"Teaching examples"}},{"t":"p","c":{"en":"\u003cstrong>Stage 2 (2Rd.04, 2Rd.03):\u003c/strong> pupils match six new nouns to pictures and then read and follow cards such as \"Draw a red circle\". \u003cstrong>Stage 4 (4Rd.03):\u003c/strong> before reading a short text about a school trip, pupils underline one new word and use the sentence around it to guess its meaning, then check in a picture dictionary. \u003cstrong>Stage 6 (6Ro.01):\u003c/strong> pupils read two short reviews of the same book and say which writer liked it more and which words show this.","ar":"\u003cstrong>Stage 2 (2Rd.04, 2Rd.03):\u003c/strong> pupils match six new nouns to pictures and then read and follow cards such as \"Draw a red circle\". \u003cstrong>Stage 4 (4Rd.03):\u003c/strong> before reading a short text about a school trip, pupils underline one new word and use the sentence around it to guess its meaning, then check in a picture dictionary. \u003cstrong>Stage 6 (6Ro.01):\u003c/strong> pupils read two short reviews of the same book and say which writer liked it more and which words show this."}},{"t":"scenario","title":{"en":"A Year 5 pupil reads aloud smoothly but cannot answer questions","ar":"A Year 5 pupil reads aloud smoothly but cannot answer questions"},"c":{"en":"Hamda in Y5 reads aloud fluently, but when you ask \"Why did the boy go home?\", she cannot answer. Is this a reading problem? Use the framework to think about it. Fluent sounding-out matches the phonics side of reading (Stage 1: 1Rd.01 and 1Rd.02). But 5Rd.01 asks learners to understand most specific information and detail in short texts, and 5Rm.01 asks them to understand most of the main points. These are separate abilities. Good practice is to check the vocabulary (does she know the key words?), then try a listening version of the same text (does she understand when it is read to her?), and then ask the question with a picture or a sentence starter. The answers help you see whether the gap is in decoding, in vocabulary, or in comprehension.","ar":"Hamda in Y5 reads aloud fluently, but when you ask \"Why did the boy go home?\", she cannot answer. Is this a reading problem? Use the framework to think about it. Fluent sounding-out matches the phonics side of reading (Stage 1: 1Rd.01 and 1Rd.02). But 5Rd.01 asks learners to understand most specific information and detail in short texts, and 5Rm.01 asks them to understand most of the main points. These are separate abilities. Good practice is to check the vocabulary (does she know the key words?), then try a listening version of the same text (does she understand when it is read to her?), and then ask the question with a picture or a sentence starter. The answers help you see whether the gap is in decoding, in vocabulary, or in comprehension."}},{"t":"callout","k":"tip","title":{"en":"Good practice: link Reading to Listening","ar":"Good practice: link Reading to Listening"},"c":{"en":"Because the Reading and Listening sub-strands have similar names, you can plan the same tasks in both skills: pre-teach key words, ask for the main point first, then ask for details, then ask for the speaker's or writer's opinion. Module 8 shows the matching Listening objectives.","ar":"Because the Reading and Listening sub-strands have similar names, you can plan the same tasks in both skills: pre-teach key words, ask for the main point first, then ask for details, then ask for the speaker's or writer's opinion. Module 8 shows the matching Listening objectives."}}],"checks":[{"id":"m5q1","q":{"en":"Which Reading sub-strands appear at Stage 1 in the framework?","ar":"Which Reading sub-strands appear at Stage 1 in the framework?"},"opts":[{"en":"Only Reading for detail; Reading for global meaning starts at Stage 2 and Reading for opinion at Stage 3","ar":"Only Reading for detail; Reading for global meaning starts at Stage 2 and Reading for opinion at Stage 3"},{"en":"All three sub-strands, because learners read for global meaning, detail and opinion from the start","ar":"All three sub-strands, because learners read for global meaning, detail and opinion from the start"},{"en":"Reading for global meaning and Reading for detail; Reading for opinion starts at Stage 4","ar":"Reading for global meaning and Reading for detail; Reading for opinion starts at Stage 4"},{"en":"Only Reading for opinion, because Stage 1 learners are asked to say what they like to read","ar":"Only Reading for opinion, because Stage 1 learners are asked to say what they like to read"}],"correct":0,"expl":{"en":"Stage 1 Reading has four objectives (1Rd.01 to 1Rd.04), all in Reading for detail. Rm starts at Stage 2 (2Rm.01) and Ro at Stage 3 (3Ro.01).","ar":"Stage 1 Reading has four objectives (1Rd.01 to 1Rd.04), all in Reading for detail. Rm starts at Stage 2 (2Rm.01) and Ro at Stage 3 (3Ro.01)."}},{"id":"m5q2","q":{"en":"What does 4Rd.04 ask learners to do?","ar":"What does 4Rd.04 ask learners to do?"},"opts":[{"en":"Spell most high-frequency words accurately when writing independently about familiar topics","ar":"Spell most high-frequency words accurately when writing independently about familiar topics"},{"en":"Explore words with common roots, including links to their first language","ar":"Explore words with common roots, including links to their first language"},{"en":"Read and follow an increasing range of instructions given in short, simple texts","ar":"Read and follow an increasing range of instructions given in short, simple texts"},{"en":"Recognise the opinions of the writer in short, simple texts with little or no support","ar":"Recognise the opinions of the writer in short, simple texts with little or no support"}],"correct":1,"expl":{"en":"4Rd.04 says to explore words with common roots and derivations, including links to words in their first language. The other options describe 4Wca.02, 4Rd.02 and 4Ro.01.","ar":"4Rd.04 says to explore words with common roots and derivations, including links to words in their first language. The other options describe 4Wca.02, 4Rd.02 and 4Ro.01."}},{"id":"m5q3","q":{"en":"Why do some Stage 6 reading objectives say \"with support\" when Stage 5 objectives did not?","ar":"Why do some Stage 6 reading objectives say \"with support\" when Stage 5 objectives did not?"},"opts":[{"en":"Because Stage 6 learners are expected to be weaker readers than Stage 5 learners are","ar":"Because Stage 6 learners are expected to be weaker readers than Stage 5 learners are"},{"en":"Because the framework removes all independent reading from Stage 6 to prepare for Checkpoint","ar":"Because the framework removes all independent reading from Stage 6 to prepare for Checkpoint"},{"en":"Stage 6 texts are short and extended and include following an argument, so the task is harder","ar":"Stage 6 texts are short and extended and include following an argument, so the task is harder"},{"en":"Because Stage 6 objectives are written for learners in Years 7 to 9 who join the school late in the year","ar":"Because Stage 6 objectives are written for learners in Years 7 to 9 who join the school late in the year"}],"correct":2,"expl":{"en":"6Rm.01, 6Rd.01 and 6Rd.04 refer to short and extended texts, and 6Rd.03 adds an argument. When the task is more demanding, the support phrase reappears.","ar":"6Rm.01, 6Rd.01 and 6Rd.04 refer to short and extended texts, and 6Rd.03 adds an argument. When the task is more demanding, the support phrase reappears."}}]},{"id":"m6","title":{"en":"The Writing Strand Across Stages 1 to 6","ar":"The Writing Strand Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework treats Writing as its own strand, separate from Use of English. Writing has three sub-strands: \u003cstrong>Communicative achievement (Wca)\u003c/strong>, \u003cstrong>Organisation (Wor)\u003c/strong> and \u003cstrong>Content (Wc)\u003c/strong>. The overview describes them this way. Communicative achievement is the ability to communicate in writing by forming letters and words, using punctuation, writing sentences with grammatical accuracy and appropriate register, and planning and checking work. Organisation is the ability to use connectives to organise ideas and to use appropriate layout for written genres. Content is the ability to use a range of language to write text for different purposes and genres, and to express opinion.","ar":"The framework treats Writing as its own strand, separate from Use of English. Writing has three sub-strands: \u003cstrong>Communicative achievement (Wca)\u003c/strong>, \u003cstrong>Organisation (Wor)\u003c/strong> and \u003cstrong>Content (Wc)\u003c/strong>. The overview describes them this way. Communicative achievement is the ability to communicate in writing by forming letters and words, using punctuation, writing sentences with grammatical accuracy and appropriate register, and planning and checking work. Organisation is the ability to use connectives to organise ideas and to use appropriate layout for written genres. Content is the ability to use a range of language to write text for different purposes and genres, and to express opinion."}},{"t":"p","c":{"en":"A note about Use of English. In this framework Use of English is a \u003cstrong>separate strand\u003c/strong> with its own codes (Ug, Uv, Us), not something hidden in Writing. Yet Writing still includes objectives about grammatical structures (for example 3Wca.05). The two work together: Use of English gives the pattern, and Writing asks the learner to use it in a written text. Module 7 covers Use of English in detail.","ar":"A note about Use of English. In this framework Use of English is a \u003cstrong>separate strand\u003c/strong> with its own codes (Ug, Uv, Us), not something hidden in Writing. Yet Writing still includes objectives about grammatical structures (for example 3Wca.05). The two work together: Use of English gives the pattern, and Writing asks the learner to use it in a written text. Module 7 covers Use of English in detail."}},{"t":"h","c":{"en":"Communicative achievement: from letters to edited texts","ar":"Communicative achievement: from letters to edited texts"}},{"t":"p","c":{"en":"At Stage 1 this sub-strand has five objectives. They begin with the physical skill of writing: letters and words in a straight line from left to right (1Wca.01), forming upper and lower case letters (1Wca.02). They continue with spelling some simple, high-frequency words in guided writing (1Wca.03), writing familiar words (1Wca.04) and beginning to use a limited range of simple grammatical structures, \"allowing for frequent, basic mistakes\" (1Wca.05).","ar":"At Stage 1 this sub-strand has five objectives. They begin with the physical skill of writing: letters and words in a straight line from left to right (1Wca.01), forming upper and lower case letters (1Wca.02). They continue with spelling some simple, high-frequency words in guided writing (1Wca.03), writing familiar words (1Wca.04) and beginning to use a limited range of simple grammatical structures, \"allowing for frequent, basic mistakes\" (1Wca.05)."}},{"t":"table","head":{"en":["Skill","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Skill","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Handwriting","2Wca.01: consistent size and spacing","3Wca.01: legible handwriting","4Wca.01: legible, with some speed and fluency","5Wca.01: legible, with increasing speed and fluency","6Wca.01: legible, with appropriate speed and fluency"],"ar":["Handwriting","2Wca.01: consistent size and spacing","3Wca.01: legible handwriting","4Wca.01: legible, with some speed and fluency","5Wca.01: legible, with increasing speed and fluency","6Wca.01: legible, with appropriate speed and fluency"]},{"en":["Spelling","2Wca.03: an increasing number of simple high-frequency words, guided writing","3Wca.03: most simple high-frequency words, guided writing","4Wca.02: most high-frequency words, independently","5Wca.02: high-frequency words on an increasing range of familiar topics, independently","6Wca.02: most familiar words on a range of familiar topics, independently"],"ar":["Spelling","2Wca.03: an increasing number of simple high-frequency words, guided writing","3Wca.03: most simple high-frequency words, guided writing","4Wca.02: most high-frequency words, independently","5Wca.02: high-frequency words on an increasing range of familiar topics, independently","6Wca.02: most familiar words on a range of familiar topics, independently"]},{"en":["Planning and checking","2Wca.04: plan and write phrases and short sentences, with support","3Wca.04: plan, write and check sentences, with support","4Wca.03: plan, write, edit and proofread a short sequence of sentences in a paragraph, with support","5Wca.03: plan, write, edit and proofread short texts, with support","6Wca.03: plan, write, edit and proofread short texts, with little or no support"],"ar":["Planning and checking","2Wca.04: plan and write phrases and short sentences, with support","3Wca.04: plan, write and check sentences, with support","4Wca.03: plan, write, edit and proofread a short sequence of sentences in a paragraph, with support","5Wca.03: plan, write, edit and proofread short texts, with support","6Wca.03: plan, write, edit and proofread short texts, with little or no support"]},{"en":["Grammatical accuracy","2Wca.05: some simple structures, frequent basic mistakes","3Wca.05: some simple structures and patterns, frequent basic mistakes","4Wca.04: some mistakes allowed","5Wca.04: occasional mistakes","6Wca.04: grammatical structures correctly, occasional mistakes"],"ar":["Grammatical accuracy","2Wca.05: some simple structures, frequent basic mistakes","3Wca.05: some simple structures and patterns, frequent basic mistakes","4Wca.04: some mistakes allowed","5Wca.04: occasional mistakes","6Wca.04: grammatical structures correctly, occasional mistakes"]}]},{"t":"p","c":{"en":"Two things deserve attention. First, handwriting and spelling are not \"extras\". They are written objectives, and the Cambridge Phonics and Handwriting Framework supports them. Second, the planning and checking line is a clear ladder: plan and write phrases (Stage 2), add checking (Stage 3), add editing and proofreading (Stage 4), then extend to short texts (Stage 5), with the support fading at Stage 6. A pupil who has never been asked to proofread at Stage 4 will find Stage 6 very hard.","ar":"Two things deserve attention. First, handwriting and spelling are not \"extras\". They are written objectives, and the Cambridge Phonics and Handwriting Framework supports them. Second, the planning and checking line is a clear ladder: plan and write phrases (Stage 2), add checking (Stage 3), add editing and proofreading (Stage 4), then extend to short texts (Stage 5), with the support fading at Stage 6. A pupil who has never been asked to proofread at Stage 4 will find Stage 6 very hard."}},{"t":"h","c":{"en":"Organisation: punctuation, linking and layout","ar":"Organisation: punctuation, linking and layout"}},{"t":"list","c":{"en":["\u003cstrong>Punctuation:\u003c/strong> Stage 1 has no Organisation objectives. At Stage 2, 2Wor.01 asks for basic punctuation (full stop and question mark) in guided writing; 3Wor.01 adds the exclamation mark; 4Wor.01 moves to punctuating a sequence of sentences in a paragraph; 5Wor.01 to short texts; and 6Wor.01 to punctuating short texts \"with some accuracy when writing independently\".","\u003cstrong>Linking:\u003c/strong> 2Wor.02 links words, phrases and short sentences with basic connectives, with support; 3Wor.02 does so with little or no support; 4Wor.02 links a short sequence of sentences with a limited range of connectives to create a paragraph; 5Wor.02 and 6Wor.02 use an increasing range of connectives to create a short text organised into paragraphs.","\u003cstrong>Layout:\u003c/strong> layout appears from Stage 4. 4Wor.03 asks learners to use, with support, appropriate layout for a limited range of written genres; 5Wor.03 says with little or no support; 6Wor.03 has no support phrase."],"ar":["\u003cstrong>Punctuation:\u003c/strong> Stage 1 has no Organisation objectives. At Stage 2, 2Wor.01 asks for basic punctuation (full stop and question mark) in guided writing; 3Wor.01 adds the exclamation mark; 4Wor.01 moves to punctuating a sequence of sentences in a paragraph; 5Wor.01 to short texts; and 6Wor.01 to punctuating short texts \"with some accuracy when writing independently\".","\u003cstrong>Linking:\u003c/strong> 2Wor.02 links words, phrases and short sentences with basic connectives, with support; 3Wor.02 does so with little or no support; 4Wor.02 links a short sequence of sentences with a limited range of connectives to create a paragraph; 5Wor.02 and 6Wor.02 use an increasing range of connectives to create a short text organised into paragraphs.","\u003cstrong>Layout:\u003c/strong> layout appears from Stage 4. 4Wor.03 asks learners to use, with support, appropriate layout for a limited range of written genres; 5Wor.03 says with little or no support; 6Wor.03 has no support phrase."]}},{"t":"h","c":{"en":"Content: what learners write about","ar":"Content: what learners write about"}},{"t":"p","c":{"en":"The Content sub-strand names the kinds of writing that learners produce. At Stage 1 there is one objective: 1Wc.01, writing, with support, words and short, simple phrases to give personal and factual information. Over the stages the content widens.","ar":"The Content sub-strand names the kinds of writing that learners produce. At Stage 1 there is one objective: 1Wc.01, writing, with support, words and short, simple phrases to give personal and factual information. Over the stages the content widens."}},{"t":"table","head":{"en":["Text purpose","Where the objectives appear","How it grows"],"ar":["Text purpose","Where the objectives appear","How it grows"]},"rows":[{"en":["Personal and factual information","1Wc.01, 2Wc.01","Words and short phrases (Stage 1) to simple phrases (Stage 2)"],"ar":["Personal and factual information","1Wc.01, 2Wc.01","Words and short phrases (Stage 1) to simple phrases (Stage 2)"]},{"en":["Feelings and opinions","2Wc.02 (basic feelings), 3Wc.03 (basic opinions and feelings), 4Wc.03, 5Wc.03, 6Wc.03","With support until Stage 4; little or no support at Stage 5; no support phrase at Stage 6"],"ar":["Feelings and opinions","2Wc.02 (basic feelings), 3Wc.03 (basic opinions and feelings), 4Wc.03, 5Wc.03, 6Wc.03","With support until Stage 4; little or no support at Stage 5; no support phrase at Stage 6"]},{"en":["Instructions","3Wc.01 (short, simple instructions, with support), 4Wc.01 (a short sequence), 5Wc.01, 6Wc.01 (a sequence of instructions)","Support fades from Stage 5"],"ar":["Instructions","3Wc.01 (short, simple instructions, with support), 4Wc.01 (a short sequence), 5Wc.01, 6Wc.01 (a sequence of instructions)","Support fades from Stage 5"]},{"en":["Descriptions of people, places, objects, routine actions and events","3Wc.02 (short sentences), 4Wc.02 and 5Wc.02 (a short sequence of simple sentences), 6Wc.02 (short texts, with support)","From sentences to short texts; Stage 6 adds \"with support\" again"],"ar":["Descriptions of people, places, objects, routine actions and events","3Wc.02 (short sentences), 4Wc.02 and 5Wc.02 (a short sequence of simple sentences), 6Wc.02 (short texts, with support)","From sentences to short texts; Stage 6 adds \"with support\" again"]}]},{"t":"p","c":{"en":"Observe the surprise again at Stage 6: 6Wc.02 asks for short texts \"with support\", where 5Wc.02 said \"with little or no support\". As in Reading, a harder task (a text instead of a sequence of sentences) brings support back.","ar":"Observe the surprise again at Stage 6: 6Wc.02 asks for short texts \"with support\", where 5Wc.02 said \"with little or no support\". As in Reading, a harder task (a text instead of a sequence of sentences) brings support back."}},{"t":"h","c":{"en":"Marking and feedback: what \"allowing for mistakes\" means","ar":"Marking and feedback: what \"allowing for mistakes\" means"}},{"t":"p","c":{"en":"The grammatical accuracy objectives are written with a built-in tolerance. 3Wca.05 allows \"frequent, basic mistakes\". 6Wca.04 allows \"occasional mistakes\". This tells you how to read pupils' writing: at Stage 3 you should not expect near-perfect grammar, and a page with several mistakes is not a failure if the writing communicates. As good practice, focus feedback on one or two targets linked to the lesson's objective. Do not correct every error. Over-correction can reduce the confidence that the framework's attributes aim to develop.","ar":"The grammatical accuracy objectives are written with a built-in tolerance. 3Wca.05 allows \"frequent, basic mistakes\". 6Wca.04 allows \"occasional mistakes\". This tells you how to read pupils' writing: at Stage 3 you should not expect near-perfect grammar, and a page with several mistakes is not a failure if the writing communicates. As good practice, focus feedback on one or two targets linked to the lesson's objective. Do not correct every error. Over-correction can reduce the confidence that the framework's attributes aim to develop."}},{"t":"scenario","title":{"en":"Reading a Stage 4 paragraph against the objectives","ar":"Reading a Stage 4 paragraph against the objectives"},"c":{"en":"A Y4 pupil writes: \"On Saturday I go to the park with my brother. First we played football. Then we eat ice cream. It was fun!\" Check against the framework. 4Wor.02 wants a short sequence of simple sentences linked with a limited range of connectives to create a paragraph: the pupil uses \u003cem>First\u003c/em> and \u003cem>Then\u003c/em>, so this is met with support. 4Wor.01 wants punctuation with some accuracy: full stops, capitals and an exclamation mark are present. 4Wca.04 allows \"some mistakes\": the verb tense changes from \u003cem>go\u003c/em> to \u003cem>played\u003c/em> to \u003cem>eat\u003c/em>, which is a pattern of mistakes worth one mini-lesson on past simple (4Ug.05 is the related Use of English objective). Good feedback names what works (sequence words, punctuation), then picks one target (keep the verb in the past). This is better than circling every error.","ar":"A Y4 pupil writes: \"On Saturday I go to the park with my brother. First we played football. Then we eat ice cream. It was fun!\" Check against the framework. 4Wor.02 wants a short sequence of simple sentences linked with a limited range of connectives to create a paragraph: the pupil uses \u003cem>First\u003c/em> and \u003cem>Then\u003c/em>, so this is met with support. 4Wor.01 wants punctuation with some accuracy: full stops, capitals and an exclamation mark are present. 4Wca.04 allows \"some mistakes\": the verb tense changes from \u003cem>go\u003c/em> to \u003cem>played\u003c/em> to \u003cem>eat\u003c/em>, which is a pattern of mistakes worth one mini-lesson on past simple (4Ug.05 is the related Use of English objective). Good feedback names what works (sequence words, punctuation), then picks one target (keep the verb in the past). This is better than circling every error."}},{"t":"callout","k":"tip","title":{"en":"Good practice: one genre, one checklist","ar":"Good practice: one genre, one checklist"},"c":{"en":"At Stages 4 to 6, give pupils a short checklist for each genre they write (for example an instruction text: title, list or steps, imperative verbs, sequence words, punctuation). This supports the layout objectives (4Wor.03, 5Wor.03, 6Wor.03) and the checking objectives (4Wca.03 to 6Wca.03). The framework does not give such checklists; they are a teaching idea.","ar":"At Stages 4 to 6, give pupils a short checklist for each genre they write (for example an instruction text: title, list or steps, imperative verbs, sequence words, punctuation). This supports the layout objectives (4Wor.03, 5Wor.03, 6Wor.03) and the checking objectives (4Wca.03 to 6Wca.03). The framework does not give such checklists; they are a teaching idea."}}],"checks":[{"id":"m6q1","q":{"en":"Which three sub-strands make up the Writing strand?","ar":"Which three sub-strands make up the Writing strand?"},"opts":[{"en":"Handwriting, Punctuation and Composition","ar":"Handwriting, Punctuation and Composition"},{"en":"Communicative achievement, Grammatical forms and Sentence structure","ar":"Communicative achievement, Grammatical forms and Sentence structure"},{"en":"Content, Vocabulary and Express opinion","ar":"Content, Vocabulary and Express opinion"},{"en":"Communicative achievement, Organisation and Content","ar":"Communicative achievement, Organisation and Content"}],"correct":3,"expl":{"en":"The framework divides Writing into Communicative achievement (Wca), Organisation (Wor) and Content (Wc). Grammatical forms and Sentence structure belong to Use of English.","ar":"The framework divides Writing into Communicative achievement (Wca), Organisation (Wor) and Content (Wc). Grammatical forms and Sentence structure belong to Use of English."}},{"id":"m6q2","q":{"en":"At which stage does the framework first include objectives on layout for written genres?","ar":"At which stage does the framework first include objectives on layout for written genres?"},"opts":[{"en":"Stage 4, where 4Wor.03 asks for appropriate layout for a limited range of genres, with support","ar":"Stage 4, where 4Wor.03 asks for appropriate layout for a limited range of genres, with support"},{"en":"Stage 1, where 1Wc.01 asks for letters and words to be written in a straight line","ar":"Stage 1, where 1Wc.01 asks for letters and words to be written in a straight line"},{"en":"Stage 2, where 2Wor.01 asks for a full stop and a question mark in guided writing","ar":"Stage 2, where 2Wor.01 asks for a full stop and a question mark in guided writing"},{"en":"Stage 6, where 6Wor.03 is the first time that layout is mentioned in the framework","ar":"Stage 6, where 6Wor.03 is the first time that layout is mentioned in the framework"}],"correct":0,"expl":{"en":"4Wor.03 is the first layout objective. 5Wor.03 says with little or no support and 6Wor.03 has no support phrase.","ar":"4Wor.03 is the first layout objective. 5Wor.03 says with little or no support and 6Wor.03 has no support phrase."}},{"id":"m6q3","q":{"en":"What does the phrase \"allowing for frequent, basic mistakes\" in 3Wca.05 tell a teacher?","ar":"What does the phrase \"allowing for frequent, basic mistakes\" in 3Wca.05 tell a teacher?"},"opts":[{"en":"Pupils should lose marks for every mistake so that they learn the rules at once and avoid repeating them","ar":"Pupils should lose marks for every mistake so that they learn the rules at once and avoid repeating them"},{"en":"Stage 3 pupils use simple structures with many basic mistakes, and communication still counts","ar":"Stage 3 pupils use simple structures with many basic mistakes, and communication still counts"},{"en":"Pupils at Stage 3 should already write without mistakes, with frequent checks only","ar":"Pupils at Stage 3 should already write without mistakes, with frequent checks only"},{"en":"Pupils should avoid new grammar until they can use the present simple without mistakes","ar":"Pupils should avoid new grammar until they can use the present simple without mistakes"}],"correct":1,"expl":{"en":"The wording builds tolerance for mistakes into the objective. At Stage 6 (6Wca.04) the wording changes to \"occasional mistakes\".","ar":"The wording builds tolerance for mistakes into the objective. At Stage 6 (6Wca.04) the wording changes to \"occasional mistakes\"."}}]},{"id":"m7","title":{"en":"Use of English (Grammar and Vocabulary) Across Stages 1 to 6","ar":"Use of English (Grammar and Vocabulary) Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"In Cambridge Primary English (first language), grammar is embedded in Reading and Writing. In Cambridge Primary ESL, it is not. The framework gives grammar and vocabulary their own strand, \u003cstrong>Use of English\u003c/strong>, with three sub-strands. The overview describes them like this.","ar":"In Cambridge Primary English (first language), grammar is embedded in Reading and Writing. In Cambridge Primary ESL, it is not. The framework gives grammar and vocabulary their own strand, \u003cstrong>Use of English\u003c/strong>, with three sub-strands. The overview describes them like this."}},{"t":"list","c":{"en":["\u003cstrong>Vocabulary (Uv):\u003c/strong> learners develop knowledge and use of \u003cem>word classes\u003c/em> in increasingly complex contexts. In the objectives this covers numbers, prepositions, adverbs and kinds of nouns.","\u003cstrong>Grammatical forms (Ug):\u003c/strong> learners develop knowledge and use of grammatical conventions to enable effective communication and understanding. In the objectives this covers questions, verb forms and tenses, modals, conditionals and adjectives.","\u003cstrong>Sentence structure (Us):\u003c/strong> learners develop the ability to organise sentences accurately and connect ideas for clarity and coherence. In the objectives this covers articles, pronouns, quantifiers, connectives, clauses and verb patterns."],"ar":["\u003cstrong>Vocabulary (Uv):\u003c/strong> learners develop knowledge and use of \u003cem>word classes\u003c/em> in increasingly complex contexts. In the objectives this covers numbers, prepositions, adverbs and kinds of nouns.","\u003cstrong>Grammatical forms (Ug):\u003c/strong> learners develop knowledge and use of grammatical conventions to enable effective communication and understanding. In the objectives this covers questions, verb forms and tenses, modals, conditionals and adjectives.","\u003cstrong>Sentence structure (Us):\u003c/strong> learners develop the ability to organise sentences accurately and connect ideas for clarity and coherence. In the objectives this covers articles, pronouns, quantifiers, connectives, clauses and verb patterns."]}},{"t":"p","c":{"en":"Use of English is the biggest strand at every stage: 18 objectives at Stage 1 and 27 at Stage 6 (our count). The framework says it \"provides learners with the linguistic features they need\" to engage receptively and productively. It is the toolbox that the other four strands draw on. Because of the integrated approach in Module 4, you should not teach it as a separate subject with no purpose. Each Use of English objective should be met inside real listening, speaking, reading and writing tasks.","ar":"Use of English is the biggest strand at every stage: 18 objectives at Stage 1 and 27 at Stage 6 (our count). The framework says it \"provides learners with the linguistic features they need\" to engage receptively and productively. It is the toolbox that the other four strands draw on. Because of the integrated approach in Module 4, you should not teach it as a separate subject with no purpose. Each Use of English objective should be met inside real listening, speaking, reading and writing tasks."}},{"t":"h","c":{"en":"Verb forms and tenses across the stages","ar":"Verb forms and tenses across the stages"}},{"t":"p","c":{"en":"The Grammatical forms sub-strand is the easiest place to see progression, because the same verb form returns at each stage with more complexity. Read each row as a mini-story.","ar":"The Grammatical forms sub-strand is the easiest place to see progression, because the same verb form returns at each stage with more complexity. Read each row as a mini-story."}},{"t":"table","head":{"en":["Form","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Form","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Present simple","1Ug.02: common forms, basic personal and factual information","2Ug.02: adds short answers and contractions","3Ug.03: routines, habits and states","4Ug.04: regular and irregular forms","5Ug.03: an increasing range","6Ug.03: a range of active forms; begin passive forms"],"ar":["Present simple","1Ug.02: common forms, basic personal and factual information","2Ug.02: adds short answers and contractions","3Ug.03: routines, habits and states","4Ug.04: regular and irregular forms","5Ug.03: an increasing range","6Ug.03: a range of active forms; begin passive forms"]},{"en":["Past simple","Not yet","2Ug.03: regular and irregular forms","3Ug.04: describe actions, narrate simple events","4Ug.05: routines, habits and states","5Ug.04: an increasing range","6Ug.04: range of active forms; begin passive forms"],"ar":["Past simple","Not yet","2Ug.03: regular and irregular forms","3Ug.04: describe actions, narrate simple events","4Ug.05: routines, habits and states","5Ug.04: an increasing range","6Ug.04: range of active forms; begin passive forms"]},{"en":["Present continuous","1Ug.03: positive, negative, question, present activities","2Ug.04: with short answers and contractions","3Ug.05: events and present activities","4Ug.06: with future meaning","5Ug.05: present and future meaning","6Ug.05: an increasing range"],"ar":["Present continuous","1Ug.03: positive, negative, question, present activities","2Ug.04: with short answers and contractions","3Ug.05: events and present activities","4Ug.06: with future meaning","5Ug.05: present and future meaning","6Ug.05: an increasing range"]},{"en":["Present perfect","Not yet","Not yet","3Ug.06: begin to use, to talk about experiences","4Ug.08: what has happened (indefinite time)","5Ug.07: adds unfinished past with for and since","6Ug.07: recent, indefinite and unfinished past"],"ar":["Present perfect","Not yet","Not yet","3Ug.06: begin to use, to talk about experiences","4Ug.08: what has happened (indefinite time)","5Ug.07: adds unfinished past with for and since","6Ug.07: recent, indefinite and unfinished past"]},{"en":["Future forms","Not yet","2Ug.05: will for future intention","3Ug.07: shall for suggestions, will to ask about intention","4Ug.09: will for predictions, be going to for decided plans","5Ug.08: increasing range","6Ug.08: a range of future forms"],"ar":["Future forms","Not yet","2Ug.05: will for future intention","3Ug.07: shall for suggestions, will to ask about intention","4Ug.09: will for predictions, be going to for decided plans","5Ug.08: increasing range","6Ug.08: a range of future forms"]},{"en":["Modals","1Ug.04: can/can't for ability","2Ug.06: can for requests and permission","3Ug.08: must, could","4Ug.10: have to/had to, might, may, could","5Ug.10: mustn't, need, would, could","6Ug.12: needn't, should, ought to"],"ar":["Modals","1Ug.04: can/can't for ability","2Ug.06: can for requests and permission","3Ug.08: must, could","4Ug.10: have to/had to, might, may, could","5Ug.10: mustn't, need, would, could","6Ug.12: needn't, should, ought to"]}]},{"t":"p","c":{"en":"Notice the cautious verb \u003cem>begin\u003c/em>. 3Ug.06 says \"begin to use present perfect forms\". 5Ug.09 says \"begin to use if clauses in zero conditionals\", and 6Ug.09 says \"begin to use if clauses in first conditionals\". \"Begin to\" signals first exposure, not mastery. A Y3 teacher who expects fully accurate present perfect is expecting more than the framework does.","ar":"Notice the cautious verb \u003cem>begin\u003c/em>. 3Ug.06 says \"begin to use present perfect forms\". 5Ug.09 says \"begin to use if clauses in zero conditionals\", and 6Ug.09 says \"begin to use if clauses in first conditionals\". \"Begin to\" signals first exposure, not mastery. A Y3 teacher who expects fully accurate present perfect is expecting more than the framework does."}},{"t":"p","c":{"en":"Other grammatical forms follow the same pattern: question forms from 1Ug.01 to 6Ug.01 (with tag questions beginning at 4Ug.01), imperatives from 3Ug.02 (positive only) to 4Ug.03 (positive and negative), conditionals from Stage 5, and, at Stage 6 only, passive forms (6Ug.03, 6Ug.04), prepositional verbs (6Ug.10) and simple reported speech (6Ug.11).","ar":"Other grammatical forms follow the same pattern: question forms from 1Ug.01 to 6Ug.01 (with tag questions beginning at 4Ug.01), imperatives from 3Ug.02 (positive only) to 4Ug.03 (positive and negative), conditionals from Stage 5, and, at Stage 6 only, passive forms (6Ug.03, 6Ug.04), prepositional verbs (6Ug.10) and simple reported speech (6Ug.11)."}},{"t":"h","c":{"en":"Vocabulary: word classes in growing contexts","ar":"Vocabulary: word classes in growing contexts"}},{"t":"p","c":{"en":"\"Vocabulary\" here does not mean topic word lists. It means word classes: numbers, prepositions, adverbs and nouns. For example, cardinal numbers grow from 1 to 20 (1Uv.01), to 100 (2Uv.01), to 1000 (3Uv.01). Ordinal numbers grow from 1st to 10th (1Uv.02) to 1st to 50th (2Uv.02). Prepositions of location begin at 1Uv.04 (at, in, near, next to, on) and expand at 2Uv.04 (behind, between, in front of) and 3Uv.03 (above, below, inside, opposite). Adverbs expand from place (1Uv.06), definite time (2Uv.06), frequency (3Uv.06) and manner (3Uv.08), to indefinite time (4Uv.03), degree (5Uv.06) and comparison (4Uv.04, 5Uv.05, 6Uv.05). Noun types grow from singular, plural and proper nouns (1Uv.07) to abstract and compound nouns (5Uv.07) and collective nouns (6Uv.06).","ar":"\"Vocabulary\" here does not mean topic word lists. It means word classes: numbers, prepositions, adverbs and nouns. For example, cardinal numbers grow from 1 to 20 (1Uv.01), to 100 (2Uv.01), to 1000 (3Uv.01). Ordinal numbers grow from 1st to 10th (1Uv.02) to 1st to 50th (2Uv.02). Prepositions of location begin at 1Uv.04 (at, in, near, next to, on) and expand at 2Uv.04 (behind, between, in front of) and 3Uv.03 (above, below, inside, opposite). Adverbs expand from place (1Uv.06), definite time (2Uv.06), frequency (3Uv.06) and manner (3Uv.08), to indefinite time (4Uv.03), degree (5Uv.06) and comparison (4Uv.04, 5Uv.05, 6Uv.05). Noun types grow from singular, plural and proper nouns (1Uv.07) to abstract and compound nouns (5Uv.07) and collective nouns (6Uv.06)."}},{"t":"h","c":{"en":"Sentence structure: connecting ideas","ar":"Sentence structure: connecting ideas"}},{"t":"p","c":{"en":"Sentence structure covers how words and clauses fit together. Connectives show the clearest chain, and they link directly to the Organisation sub-strands in Writing and Speaking.","ar":"Sentence structure covers how words and clauses fit together. Connectives show the clearest chain, and they link directly to the Organisation sub-strands in Writing and Speaking."}},{"t":"table","head":{"en":["Stage","Use of English connective objective","Examples named in the framework"],"ar":["Stage","Use of English connective objective","Examples named in the framework"]},"rows":[{"en":["1","1Us.04: connective and to link words and phrases","and"],"ar":["1","1Us.04: connective and to link words and phrases","and"]},{"en":["2","2Us.04: connectives to link words and phrases","but, or, then"],"ar":["2","2Us.04: connectives to link words and phrases","but, or, then"]},{"en":["3","3Us.04: connectives to give reasons","because"],"ar":["3","3Us.04: connectives to give reasons","because"]},{"en":["4","4Us.03: connectives to link parts of sentences","when, before, after, then"],"ar":["4","4Us.03: connectives to link parts of sentences","when, before, after, then"]},{"en":["5","5Us.03: connectives in short texts","so, when"],"ar":["5","5Us.03: connectives in short texts","so, when"]},{"en":["6","6Us.04: connectives in short texts","while, until, as soon as"],"ar":["6","6Us.04: connectives in short texts","while, until, as soon as"]}]},{"t":"p","c":{"en":"The same table can be used to plan speaking and writing. When your Y3 class does 3Wor.02 (linking short sentences with basic connectives), the language comes from 3Us.04. Relative clauses follow a similar ladder: defining relative clauses with which, who, that, where begin at 4Us.04, increase at 5Us.04, and at Stage 6 extend to whose and whom, with non-defining relative clauses only beginning (6Us.05).","ar":"The same table can be used to plan speaking and writing. When your Y3 class does 3Wor.02 (linking short sentences with basic connectives), the language comes from 3Us.04. Relative clauses follow a similar ladder: defining relative clauses with which, who, that, where begin at 4Us.04, increase at 5Us.04, and at Stage 6 extend to whose and whom, with non-defining relative clauses only beginning (6Us.05)."}},{"t":"scenario","title":{"en":"A Year 3 pupil says \"Yesterday he go to school\"","ar":"A Year 3 pupil says \"Yesterday he go to school\""},"c":{"en":"In a speaking activity, a Y3 pupil says \"Yesterday he go to school\". What does the framework suggest? 3Ug.04 asks for past simple regular and irregular forms to describe actions and narrate simple events, so the target is right. But 3Sc.07 allows \"frequent, basic mistakes\". Good practice is to respond naturally with a recast (\"Yes, he went to school yesterday. Who did he go with?\") rather than stop the pupil. Then, in a later lesson, plan a short task with irregular past forms (\u003cem>go, went\u003c/em>; \u003cem>eat, ate\u003c/em>) so that the pupil hears and uses the form many times. The mistake shows the objective is not yet secure, not that the pupil failed.","ar":"In a speaking activity, a Y3 pupil says \"Yesterday he go to school\". What does the framework suggest? 3Ug.04 asks for past simple regular and irregular forms to describe actions and narrate simple events, so the target is right. But 3Sc.07 allows \"frequent, basic mistakes\". Good practice is to respond naturally with a recast (\"Yes, he went to school yesterday. Who did he go with?\") rather than stop the pupil. Then, in a later lesson, plan a short task with irregular past forms (\u003cem>go, went\u003c/em>; \u003cem>eat, ate\u003c/em>) so that the pupil hears and uses the form many times. The mistake shows the objective is not yet secure, not that the pupil failed."}},{"t":"callout","k":"warn","title":{"en":"Common misconception: Use of English means worksheets","ar":"Common misconception: Use of English means worksheets"},"c":{"en":"The framework says Use of English objectives give learners the features they need to engage with language \"receptively and productively\". The strand is separate so that grammar and vocabulary get proper attention, not so that they are taught away from communication. If a pupil can complete a gap-fill on \u003cem>for\u003c/em> and \u003cem>since\u003c/em> but cannot say \"I have lived here since 2020\", the objective (5Ug.07) is not yet secure.","ar":"The framework says Use of English objectives give learners the features they need to engage with language \"receptively and productively\". The strand is separate so that grammar and vocabulary get proper attention, not so that they are taught away from communication. If a pupil can complete a gap-fill on \u003cem>for\u003c/em> and \u003cem>since\u003c/em> but cannot say \"I have lived here since 2020\", the objective (5Ug.07) is not yet secure."}}],"checks":[{"id":"m7q1","q":{"en":"How does the framework organise grammar and vocabulary in Cambridge Primary ESL?","ar":"How does the framework organise grammar and vocabulary in Cambridge Primary ESL?"},"opts":[{"en":"As part of the Reading and Writing strands only, as in Cambridge Primary English, with no strand of its own","ar":"As part of the Reading and Writing strands only, as in Cambridge Primary English, with no strand of its own"},{"en":"As a Stage 6 add-on strand that begins after the Checkpoint papers are taken","ar":"As a Stage 6 add-on strand that begins after the Checkpoint papers are taken"},{"en":"As a separate strand called Use of English, with Vocabulary, Grammatical forms and Sentence structure","ar":"As a separate strand called Use of English, with Vocabulary, Grammatical forms and Sentence structure"},{"en":"As topic word lists inside the Content sub-strand of the Writing strand","ar":"As topic word lists inside the Content sub-strand of the Writing strand"}],"correct":2,"expl":{"en":"The overview names five strands, including Use of English, and gives its three sub-strands: Vocabulary, Grammatical forms and Sentence structure.","ar":"The overview names five strands, including Use of English, and gives its three sub-strands: Vocabulary, Grammatical forms and Sentence structure."}},{"id":"m7q2","q":{"en":"What does the wording of 3Ug.06, \"begin to use present perfect forms\", mean for planning?","ar":"What does the wording of 3Ug.06, \"begin to use present perfect forms\", mean for planning?"},"opts":[{"en":"Learners must already use the present perfect accurately for all of its uses in every spoken exchange","ar":"Learners must already use the present perfect accurately for all of its uses in every spoken exchange"},{"en":"Learners should avoid the present perfect until Stage 5, when for and since are introduced","ar":"Learners should avoid the present perfect until Stage 5, when for and since are introduced"},{"en":"Learners should write the present perfect only, and speaking it is a Stage 6 objective","ar":"Learners should write the present perfect only, and speaking it is a Stage 6 objective"},{"en":"Learners meet the present perfect at Stage 3; full accuracy is not expected yet","ar":"Learners meet the present perfect at Stage 3; full accuracy is not expected yet"}],"correct":3,"expl":{"en":"\"Begin to\" signals first exposure. Later objectives (4Ug.08, 5Ug.07, 6Ug.07) develop the present perfect.","ar":"\"Begin to\" signals first exposure. Later objectives (4Ug.08, 5Ug.07, 6Ug.07) develop the present perfect."}},{"id":"m7q3","q":{"en":"Which sequence of connectives matches the examples the framework names, Stage 1 to Stage 3?","ar":"Which sequence of connectives matches the examples the framework names, Stage 1 to Stage 3?"},"opts":[{"en":"and (Stage 1); but, or, then (Stage 2); because (Stage 3)","ar":"and (Stage 1); but, or, then (Stage 2); because (Stage 3)"},{"en":"because (Stage 1); and (Stage 2); but, or, then (Stage 3)","ar":"because (Stage 1); and (Stage 2); but, or, then (Stage 3)"},{"en":"and, but (Stage 1); because, so (Stage 2); while, until (Stage 3)","ar":"and, but (Stage 1); because, so (Stage 2); while, until (Stage 3)"},{"en":"then (Stage 1); when, before (Stage 2); and, because (Stage 3)","ar":"then (Stage 1); when, before (Stage 2); and, because (Stage 3)"}],"correct":0,"expl":{"en":"1Us.04 names and, 2Us.04 names but, or, then, and 3Us.04 names because (to give reasons).","ar":"1Us.04 names and, 2Us.04 names but, or, then, and 3Us.04 names because (to give reasons)."}}]},{"id":"m8","title":{"en":"The Listening and Speaking Strands Across Stages 1 to 6","ar":"The Listening and Speaking Strands Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Listening and Speaking are the two skills that learners use most outside the classroom, and they are the two that are easiest to forget when planning from a textbook. The framework gives each its own strand. Listening mirrors Reading, with sub-strands Listening for global meaning (Lm), Listening for detail (Ld) and Listening for opinion (Lo). Speaking has Communication (Sc), Express opinion (So) and Organisation (Sor).","ar":"Listening and Speaking are the two skills that learners use most outside the classroom, and they are the two that are easiest to forget when planning from a textbook. The framework gives each its own strand. Listening mirrors Reading, with sub-strands Listening for global meaning (Lm), Listening for detail (Ld) and Listening for opinion (Lo). Speaking has Communication (Sc), Express opinion (So) and Organisation (Sor)."}},{"t":"h","c":{"en":"Listening: the same ladder as Reading","ar":"Listening: the same ladder as Reading"}},{"t":"p","c":{"en":"The overview says the two strands have similar sub-strand names so you can link them. In Listening for detail, the framework says learners recognise \u003cem>sounds\u003c/em>, letters and words, understand specific information, instructions and questions, deduce meaning from context, and (from Stage 6) follow a line of argument. The speaker is to Listening what the writer is to Reading: learners identify the topic, who the speaker is, the target audience and the speaker's purpose.","ar":"The overview says the two strands have similar sub-strand names so you can link them. In Listening for detail, the framework says learners recognise \u003cem>sounds\u003c/em>, letters and words, understand specific information, instructions and questions, deduce meaning from context, and (from Stage 6) follow a line of argument. The speaker is to Listening what the writer is to Reading: learners identify the topic, who the speaker is, the target audience and the speaker's purpose."}},{"t":"table","head":{"en":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Main points","1Lm.01: with support, the main point of short talk","2Lm.01: with little or no support","3Lm.01: with support, some of the main points","4Lm.01: with support, most of the main points","5Lm.01: with little or no support, most","6Lm.01: with support, most, in short and extended talk"],"ar":["Main points","1Lm.01: with support, the main point of short talk","2Lm.01: with little or no support","3Lm.01: with support, some of the main points","4Lm.01: with support, most of the main points","5Lm.01: with little or no support, most","6Lm.01: with support, most, in short and extended talk"]},{"en":["Instructions","1Ld.02: with support, limited, short, simple","2Ld.01: a short sequence, with little or no support","3Ld.01: a limited range of familiar instructions","4Ld.01: with support, a range","5Ld.01: with little or no support, a range","6Ld.01: a range of instructions"],"ar":["Instructions","1Ld.02: with support, limited, short, simple","2Ld.01: a short sequence, with little or no support","3Ld.01: a limited range of familiar instructions","4Ld.01: with support, a range","5Ld.01: with little or no support, a range","6Ld.01: a range of instructions"]},{"en":["Questions","1Ld.03: with support, short, simple questions","2Ld.02: with support","3Ld.02: with little or no support","4Ld.02: with support, an increasing range","5Ld.02: a range of questions","6Ld.02: questions that ask for detailed information"],"ar":["Questions","1Ld.03: with support, short, simple questions","2Ld.02: with support","3Ld.02: with little or no support","4Ld.02: with support, an increasing range","5Ld.02: a range of questions","6Ld.02: questions that ask for detailed information"]},{"en":["Specific information","1Ld.05: with support, some","2Ld.04: with little or no support, some","3Ld.04: with support, most","4Ld.04: with little or no support, most","5Ld.04: specific information and detail","6Ld.04: with support, most, in short and extended talk"],"ar":["Specific information","1Ld.05: with support, some","2Ld.04: with little or no support, some","3Ld.04: with support, most","4Ld.04: with little or no support, most","5Ld.04: specific information and detail","6Ld.04: with support, most, in short and extended talk"]},{"en":["Opinion","Not yet","Not yet","3Lo.01: with support","4Lo.01: with little or no support","5Lo.01: recognise opinions","6Lo.01: with support, in short and extended talk"],"ar":["Opinion","Not yet","Not yet","3Lo.01: with support","4Lo.01: with little or no support","5Lo.01: recognise opinions","6Lo.01: with support, in short and extended talk"]}]},{"t":"p","c":{"en":"Two Stage 1 objectives are distinctive: 1Ld.01 (recognise a limited range of simple words that
