are spelled out slowly and clearly) and 1Ld.04 (deduce meaning from context of a limited range of simple words, with support). At Stage 6, new in Listening are \"extended talk\" and 6Ld.05, understanding, with support, most of the detail of an argument. As in Reading, \"with support\" returns at Stage 6 because the task is harder.","ar":"Two Stage 1 objectives are distinctive: 1Ld.01 (recognise a limited range of simple words that are spelled out slowly and clearly) and 1Ld.04 (deduce meaning from context of a limited range of simple words, with support). At Stage 6, new in Listening are \"extended talk\" and 6Ld.05, understanding, with support, most of the detail of an argument. As in Reading, \"with support\" returns at Stage 6 because the task is harder."}},{"t":"callout","k":"key","title":{"en":"Where Listening is assessed","ar":"Where Listening is assessed"},"c":{"en":"The framework's table of Checkpoint and Progression Test papers for ESL lists three: Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. It names no speaking paper. That does not make Speaking less important in the curriculum: it has a full strand with 8 to 10 objectives at each stage (our count). If Speaking is not in a paper, your own classroom assessment is where it is checked. Check the School Support Hub, as the framework says, for more information on assessing Cambridge Primary ESL.","ar":"The framework's table of Checkpoint and Progression Test papers for ESL lists three: Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. It names no speaking paper. That does not make Speaking less important in the curriculum: it has a full strand with 8 to 10 objectives at each stage (our count). If Speaking is not in a paper, your own classroom assessment is where it is checked. Check the School Support Hub, as the framework says, for more information on assessing Cambridge Primary ESL."}},{"t":"h","c":{"en":"Speaking: more than speaking correctly","ar":"Speaking: more than speaking correctly"}},{"t":"p","c":{"en":"The Speaking strand is carefully layered. Communication covers information, descriptions, questions, instructions, pronunciation, fluency and grammar. Express opinion covers feelings and opinions. Organisation covers connectives and interaction. Read the ladder below.","ar":"The Speaking strand is carefully layered. Communication covers information, descriptions, questions, instructions, pronunciation, fluency and grammar. Express opinion covers feelings and opinions. Organisation covers connectives and interaction. Read the ladder below."}},{"t":"table","head":{"en":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Giving information (Sc.01)","simple words and phrases","phrases and short sentences","sentences","a short sequence of sentences","more detailed, a sequence of sentences","detailed information"],"ar":["Giving information (Sc.01)","simple words and phrases","phrases and short sentences","sentences","a short sequence of sentences","more detailed, a sequence of sentences","detailed information"]},{"en":["Pronunciation (Sc.04 or Sc.05)","1Sc.04: reproduce a limited range of sounds","2Sc.04: understood with some effort","3Sc.05: generally understood","4Sc.05: some clearly; others need repetition","5Sc.05: familiar words clearly","6Sc.05: begin to use intonation and stress"],"ar":["Pronunciation (Sc.04 or Sc.05)","1Sc.04: reproduce a limited range of sounds","2Sc.04: understood with some effort","3Sc.05: generally understood","4Sc.05: some clearly; others need repetition","5Sc.05: familiar words clearly","6Sc.05: begin to use intonation and stress"]},{"en":["Fluency","1Sc.05: short, rehearsed phrases; gesture and signalled requests for help","2Sc.05: pausing to search for expressions and repair communication","3Sc.06: sentences to maintain short exchanges; noticeable hesitation","4Sc.06: some hesitation, false starts, reformulation","5Sc.06: a range of exchanges","6Sc.06: begin to maintain stretches of language"],"ar":["Fluency","1Sc.05: short, rehearsed phrases; gesture and signalled requests for help","2Sc.05: pausing to search for expressions and repair communication","3Sc.06: sentences to maintain short exchanges; noticeable hesitation","4Sc.06: some hesitation, false starts, reformulation","5Sc.06: a range of exchanges","6Sc.06: begin to maintain stretches of language"]},{"en":["Expressing opinions (So.01)","Not yet","2So.01: basic feelings, with support","3So.01: basic opinions and feelings, with support","4So.01: opinions and feelings, with support","5So.01: with little or no support","6So.01: opinions, feelings and reactions"],"ar":["Expressing opinions (So.01)","Not yet","2So.01: basic feelings, with support","3So.01: basic opinions and feelings, with support","4So.01: opinions and feelings, with support","5So.01: with little or no support","6So.01: opinions, feelings and reactions"]},{"en":["Taking part in interaction (Sor.02)","1Sor.02: take turns in short, basic exchanges","2Sor.02: take turns, increasing range","3Sor.02: initiate and maintain, with support","4Sor.02: initiate, maintain and conclude, with some support","5Sor.02: with little or no support","6Sor.02: briefly summarise what others say, with support"],"ar":["Taking part in interaction (Sor.02)","1Sor.02: take turns in short, basic exchanges","2Sor.02: take turns, increasing range","3Sor.02: initiate and maintain, with support","4Sor.02: initiate, maintain and conclude, with some support","5Sor.02: with little or no support","6Sor.02: briefly summarise what others say, with support"]}]},{"t":"p","c":{"en":"This table tells you a lot. The first Stage 1 fluency objective says that learners produce \"short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary\". Gesture and asking for help are \u003cem>part of the objective\u003c/em>, not a sign that a pupil is behind. At Stage 6, learners begin to use intonation and stress and begin to summarise what others say. The word \"begin\" appears again: it marks new ground.","ar":"This table tells you a lot. The first Stage 1 fluency objective says that learners produce \"short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary\". Gesture and asking for help are \u003cem>part of the objective\u003c/em>, not a sign that a pupil is behind. At Stage 6, learners begin to use intonation and stress and begin to summarise what others say. The word \"begin\" appears again: it marks new ground."}},{"t":"p","c":{"en":"Look also at the grammar tolerance in Speaking, 1Sc.06 to 6Sc.07: \"frequent, basic mistakes\" (Stages 1 to 3), \"some basic mistakes\" (Stage 4), \"occasional, basic mistakes\" (Stage 5) and \"occasional mistakes\" (Stage 6). So the framework treats accuracy as something that grows over six years, alongside fluency and range.","ar":"Look also at the grammar tolerance in Speaking, 1Sc.06 to 6Sc.07: \"frequent, basic mistakes\" (Stages 1 to 3), \"some basic mistakes\" (Stage 4), \"occasional, basic mistakes\" (Stage 5) and \"occasional mistakes\" (Stage 6). So the framework treats accuracy as something that grows over six years, alongside fluency and range."}},{"t":"h","c":{"en":"Teaching examples","ar":"Teaching examples"}},{"t":"p","c":{"en":"\u003cstrong>Stage 3 (3Sor.02):\u003c/strong> pupils use a \"find someone who\" grid; one pupil starts the conversation, keeps it going with a second question, and a partner responds. \u003cstrong>Stage 4 (4Lo.01):\u003c/strong> the teacher reads two short descriptions of a holiday; pupils tick whether each speaker liked it. \u003cstrong>Stage 6 (6Sor.02):\u003c/strong> in groups of four, pupils plan a class trip; each group's reporter must briefly summarise what the others said so the group agrees an outcome.","ar":"\u003cstrong>Stage 3 (3Sor.02):\u003c/strong> pupils use a \"find someone who\" grid; one pupil starts the conversation, keeps it going with a second question, and a partner responds. \u003cstrong>Stage 4 (4Lo.01):\u003c/strong> the teacher reads two short descriptions of a holiday; pupils tick whether each speaker liked it. \u003cstrong>Stage 6 (6Sor.02):\u003c/strong> in groups of four, pupils plan a class trip; each group's reporter must briefly summarise what the others said so the group agrees an outcome."}},{"t":"scenario","title":{"en":"A very quiet Year 1 pupil","ar":"A very quiet Year 1 pupil"},"c":{"en":"Omar in Y1 speaks very little in class, but he nods, points and holds up a picture card when he needs a pencil. A teacher worries he is \"not speaking English\". Use the framework. 1Sc.05 says Stage 1 learners produce short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary. Omar's behaviour is within the objective. What should the teacher do next? Good practice: model the phrase (\"Can I have a pencil, please?\"), let Omar rehearse it with a partner, and then invite him to say it before he is given the pencil. This builds from signalled requests to rehearsed phrases. Check 1Ld.02 too: does he understand the instruction \"Take a pencil\"? Listening usually runs ahead of speaking.","ar":"Omar in Y1 speaks very little in class, but he nods, points and holds up a picture card when he needs a pencil. A teacher worries he is \"not speaking English\". Use the framework. 1Sc.05 says Stage 1 learners produce short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary. Omar's behaviour is within the objective. What should the teacher do next? Good practice: model the phrase (\"Can I have a pencil, please?\"), let Omar rehearse it with a partner, and then invite him to say it before he is given the pencil. This builds from signalled requests to rehearsed phrases. Check 1Ld.02 too: does he understand the instruction \"Take a pencil\"? Listening usually runs ahead of speaking."}},{"t":"callout","k":"tip","title":{"en":"Good practice: plan listening and speaking in the same task","ar":"Good practice: plan listening and speaking in the same task"},"c":{"en":"Pairs, interviews, information gaps and role-plays use Listening, Speaking and Use of English together. A pair task where one pupil gives directions and the other follows them covers speaking (4Sc.04 or 5Sc.04, giving instructions) and listening (4Ld.01 or 5Ld.01, understanding instructions) in the same five minutes.","ar":"Pairs, interviews, information gaps and role-plays use Listening, Speaking and Use of English together. A pair task where one pupil gives directions and the other follows them covers speaking (4Sc.04 or 5Sc.04, giving instructions) and listening (4Ld.01 or 5Ld.01, understanding instructions) in the same five minutes."}}],"checks":[{"id":"m8q1","q":{"en":"Which three papers does the framework list for Cambridge Primary ESL Checkpoint and Progression Tests?","ar":"Which three papers does the framework list for Cambridge Primary ESL Checkpoint and Progression Tests?"},"opts":[{"en":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking","ar":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking"},{"en":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening","ar":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening"},{"en":"Paper 1 Reading and Writing, Paper 2 Listening and Speaking and Paper 3 Use of English","ar":"Paper 1 Reading and Writing, Paper 2 Listening and Speaking and Paper 3 Use of English"},{"en":"Paper 1 Reading and Usage, Paper 2 Speaking and Paper 3 Listening","ar":"Paper 1 Reading and Usage, Paper 2 Speaking and Paper 3 Listening"}],"correct":1,"expl":{"en":"The framework's table lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening for ESL. No speaking paper is listed.","ar":"The framework's table lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening for ESL. No speaking paper is listed."}},{"id":"m8q2","q":{"en":"A Stage 1 pupil points to a picture card to ask for a pencil. What does 1Sc.05 say about this?","ar":"A Stage 1 pupil points to a picture card to ask for a pencil. What does 1Sc.05 say about this?"},"opts":[{"en":"It shows the pupil has not reached the Stage 1 objective, because gestures are not allowed","ar":"It shows the pupil has not reached the Stage 1 objective, because gestures are not allowed"},{"en":"It is acceptable only at Stage 2, where pausing and repair are first mentioned","ar":"It is acceptable only at Stage 2, where pausing and repair are first mentioned"},{"en":"Short, rehearsed phrases with gesture and signalled requests for help are part of the Stage 1 objective","ar":"Short, rehearsed phrases with gesture and signalled requests for help are part of the Stage 1 objective"},{"en":"It should be corrected at once, because pupils must speak in full sentences at Stage 1","ar":"It should be corrected at once, because pupils must speak in full sentences at Stage 1"}],"correct":2,"expl":{"en":"1Sc.05 refers to short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary.","ar":"1Sc.05 refers to short, isolated, rehearsed phrases using gesture and signalled requests for help when necessary."}},{"id":"m8q3","q":{"en":"Which new element appears in the Listening strand at Stage 6?","ar":"Which new element appears in the Listening strand at Stage 6?"},"opts":[{"en":"Listening for opinion, which is introduced for the first time at Stage 6","ar":"Listening for opinion, which is introduced for the first time at Stage 6"},{"en":"Recognising simple words that are spelled out slowly and clearly","ar":"Recognising simple words that are spelled out slowly and clearly"},{"en":"Understanding a short sequence of familiar instructions with no support, as in the early stages","ar":"Understanding a short sequence of familiar instructions with no support, as in the early stages"},{"en":"Extended talk, and understanding most of the detail of an argument, with support","ar":"Extended talk, and understanding most of the detail of an argument, with support"}],"correct":3,"expl":{"en":"Stage 6 objectives refer to \"short and extended talk\" and 6Ld.05 refers to the detail of an argument. Listening for opinion starts at Stage 3.","ar":"Stage 6 objectives refer to \"short and extended talk\" and 6Ld.05 refers to the detail of an argument. Listening for opinion starts at Stage 3."}}]},{"id":"m9","title":{"en":"Reading the Progression Across Stages: Gaps, Prerequisites and Next Steps","ar":"Reading the Progression Across Stages: Gaps, Prerequisites and Next Steps"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says: \"To enable effective progression in your teaching, you need to be familiar with the progression of skills across stages. This will help you to build on prior learning in every stage.\" It adds that the progression of learning objectives across Stages 1 to 6 is available on the School Support Hub. You can already do much of this yourself with the codes you have learned. This module shows how.","ar":"The framework says: \"To enable effective progression in your teaching, you need to be familiar with the progression of skills across stages. This will help you to build on prior learning in every stage.\" It adds that the progression of learning objectives across Stages 1 to 6 is available on the School Support Hub. You can already do much of this yourself with the codes you have learned. This module shows how."}},{"t":"h","c":{"en":"Method: trace one skill across the stages","ar":"Method: trace one skill across the stages"}},{"t":"steps","c":{"en":["Choose one skill or language point (for example, giving instructions, or connectives).","Find the matching objective in each stage, using the sub-strand names to guide you. Ask: which strand is it in? Which sub-strand?","Write the codes in a row, Stage 1 to Stage 6, and underline the words that change: support, range, length, accuracy.","Ask what a pupil needs from the stage before, and what the next stage will add.","Plan your teaching so that pupils practise what is new at your stage and revisit what was learned before."],"ar":["Choose one skill or language point (for example, giving instructions, or connectives).","Find the matching objective in each stage, using the sub-strand names to guide you. Ask: which strand is it in? Which sub-strand?","Write the codes in a row, Stage 1 to Stage 6, and underline the words that change: support, range, length, accuracy.","Ask what a pupil needs from the stage before, and what the next stage will add.","Plan your teaching so that pupils practise what is new at your stage and revisit what was learned before."]}},{"t":"h","c":{"en":"Worked trace: instructions across four skills","ar":"Worked trace: instructions across four skills"}},{"t":"p","c":{"en":"Instructions appear in all four skills, which makes them a good trace. The vocabulary and grammar needed (imperatives, sequence words) come from Use of English.","ar":"Instructions appear in all four skills, which makes them a good trace. The vocabulary and grammar needed (imperatives, sequence words) come from Use of English."}},{"t":"table","head":{"en":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"],"ar":["Skill","Stage 1","Stage 2","Stage 3","Stage 4","Stage 5","Stage 6"]},"rows":[{"en":["Listening","1Ld.02: with support, short, simple","2Ld.01: short sequence of familiar","3Ld.01: limited range of familiar","4Ld.01: with support, a range","5Ld.01: a range, little or no support","6Ld.01: a range"],"ar":["Listening","1Ld.02: with support, short, simple","2Ld.01: short sequence of familiar","3Ld.01: limited range of familiar","4Ld.01: with support, a range","5Ld.01: a range, little or no support","6Ld.01: a range"]},{"en":["Reading","Not stated","2Rd.03: with support, short, familiar","3Rd.02: short sequence of familiar","4Rd.02: increasing range","5Rd.02: a range","6Rd.02: read and follow instructions"],"ar":["Reading","Not stated","2Rd.03: with support, short, familiar","3Rd.02: short sequence of familiar","4Rd.02: increasing range","5Rd.02: a range","6Rd.02: read and follow instructions"]},{"en":["Speaking","Not stated","Not stated","3Sc.04: give, with support, short, simple","4Sc.04: with support, short sequence","5Sc.04: with little or no support","6Sc.04: give a sequence"],"ar":["Speaking","Not stated","Not stated","3Sc.04: give, with support, short, simple","4Sc.04: with support, short sequence","5Sc.04: with little or no support","6Sc.04: give a sequence"]},{"en":["Writing","Not stated","Not stated","3Wc.01: with support, short, simple","4Wc.01: with support, short sequence","5Wc.01: with little or no support","6Wc.01: write a sequence"],"ar":["Writing","Not stated","Not stated","3Wc.01: with support, short, simple","4Wc.01: with support, short sequence","5Wc.01: with little or no support","6Wc.01: write a sequence"]},{"en":["Use of English","Not stated","Not stated","3Ug.02: imperatives (positive only); 3Uv.07: adverbs of sequence such as first, next, then","4Ug.03: positive and negative imperatives","5Ug.02: imperatives with direct and indirect objects","No new imperative objective at this stage; earlier forms continue"],"ar":["Use of English","Not stated","Not stated","3Ug.02: imperatives (positive only); 3Uv.07: adverbs of sequence such as first, next, then","4Ug.03: positive and negative imperatives","5Ug.02: imperatives with direct and indirect objects","No new imperative objective at this stage; earlier forms continue"]}]},{"t":"p","c":{"en":"The trace gives teaching ideas at once. Pupils understand instructions long before they give or write them (Listening from Stage 1, Speaking and Writing from Stage 3). The imperative (3Ug.02) is taught in the same stage as giving and writing instructions (3Sc.04, 3Wc.01). So if a Y3 teacher wants pupils to write \"how to make a sandwich\", she should first make sure they have heard and followed many instructions in Years 1 and 2.","ar":"The trace gives teaching ideas at once. Pupils understand instructions long before they give or write them (Listening from Stage 1, Speaking and Writing from Stage 3). The imperative (3Ug.02) is taught in the same stage as giving and writing instructions (3Sc.04, 3Wc.01). So if a Y3 teacher wants pupils to write \"how to make a sandwich\", she should first make sure they have heard and followed many instructions in Years 1 and 2."}},{"t":"h","c":{"en":"Spotting prerequisites","ar":"Spotting prerequisites"}},{"t":"p","c":{"en":"A prerequisite is something a learner needs before they can meet a later objective. The codes make some of these clear.","ar":"A prerequisite is something a learner needs before they can meet a later objective. The codes make some of these clear."}},{"t":"table","head":{"en":["Later objective","Likely prerequisite from earlier stages","Why it matters"],"ar":["Later objective","Likely prerequisite from earlier stages","Why it matters"]},"rows":[{"en":["4Us.03: connectives such as when, before, after","3Uv.04: prepositions of time such as after, before","The same words move from prepositions to connectives"],"ar":["4Us.03: connectives such as when, before, after","3Uv.04: prepositions of time such as after, before","The same words move from prepositions to connectives"]},{"en":["5Ug.07: present perfect with for and since","3Ug.06 and 4Ug.08: first uses of the present perfect","The structure must be familiar before the new time words are added"],"ar":["5Ug.07: present perfect with for and since","3Ug.06 and 4Ug.08: first uses of the present perfect","The structure must be familiar before the new time words are added"]},{"en":["6Ug.09: first conditionals (begin)","5Ug.09: zero conditionals (begin)","Learners have met if clauses before"],"ar":["6Ug.09: first conditionals (begin)","5Ug.09: zero conditionals (begin)","Learners have met if clauses before"]},{"en":["6Us.06: subordinate clauses after say and tell","5Us.05: subordinate clauses after think, know, believe, hope","The clause pattern is extended"],"ar":["6Us.06: subordinate clauses after say and tell","5Us.05: subordinate clauses after think, know, believe, hope","The clause pattern is extended"]},{"en":["6Wca.03: plan, write, edit and proofread with little or no support","4Wca.03 and 5Wca.03: the same skills, with support","Independence grows from supported practice"],"ar":["6Wca.03: plan, write, edit and proofread with little or no support","4Wca.03 and 5Wca.03: the same skills, with support","Independence grows from supported practice"]}]},{"t":"p","c":{"en":"These links are our reading of the codes. They are good practice for planning, not a Cambridge list of prerequisites. Check the progression document on the School Support Hub for the full picture.","ar":"These links are our reading of the codes. They are good practice for planning, not a Cambridge list of prerequisites. Check the progression document on the School Support Hub for the full picture."}},{"t":"h","c":{"en":"Gaps to notice","ar":"Gaps to notice"}},{"t":"list","c":{"en":["\u003cstrong>Things that start late:\u003c/strong> Writing Organisation starts at Stage 2; Reading for global meaning at Stage 2; Reading for opinion and Listening for opinion at Stage 3; Express opinion (Speaking) at Stage 2; layout for genres at Stage 4. A Stage 1 teacher who looks for these in Stage 1 will not find them, and need not worry.","\u003cstrong>Things that return in a harder form:\u003c/strong> \"with support\" reappears at Stage 6 for extended texts and talk; \"begin to\" returns for passives, reported speech and conditionals.","\u003cstrong>Things that have no support at all:\u003c/strong> several Stage 6 objectives, such as 6Ld.01 and 6Rd.02, have no support phrase. They set the independent standard."],"ar":["\u003cstrong>Things that start late:\u003c/strong> Writing Organisation starts at Stage 2; Reading for global meaning at Stage 2; Reading for opinion and Listening for opinion at Stage 3; Express opinion (Speaking) at Stage 2; layout for genres at Stage 4. A Stage 1 teacher who looks for these in Stage 1 will not find them, and need not worry.","\u003cstrong>Things that return in a harder form:\u003c/strong> \"with support\" reappears at Stage 6 for extended texts and talk; \"begin to\" returns for passives, reported speech and conditionals.","\u003cstrong>Things that have no support at all:\u003c/strong> several Stage 6 objectives, such as 6Ld.01 and 6Rd.02, have no support phrase. They set the independent standard."]}},{"t":"h","c":{"en":"Stage 6, Checkpoint and Lower Secondary","ar":"Stage 6, Checkpoint and Lower Secondary"}},{"t":"p","c":{"en":"Stage 6 is the end of the framework. The cover of the framework says that Cambridge Primary Progression Tests \"will be available from 2022\" and Checkpoint tests \"from 2023\". The framework says assessments are provided for Stages 3 to 6, and lists the three ESL papers (Reading and Usage, Writing, Listening). At PEPS, Year 6 sits the Cambridge Primary Checkpoint (a school fact, not a framework statement). The framework says the reporting code in each objective code appears in the feedback reports for tests, so if your reports show codes such as Rm, Rd or Ug, you can now read them. This is a good reason to know the codes: you can see which sub-strands a class found hardest and trace them back to Stages 4 and 5.","ar":"Stage 6 is the end of the framework. The cover of the framework says that Cambridge Primary Progression Tests \"will be available from 2022\" and Checkpoint tests \"from 2023\". The framework says assessments are provided for Stages 3 to 6, and lists the three ESL papers (Reading and Usage, Writing, Listening). At PEPS, Year 6 sits the Cambridge Primary Checkpoint (a school fact, not a framework statement). The framework says the reporting code in each objective code appears in the feedback reports for tests, so if your reports show codes such as Rm, Rd or Ug, you can now read them. This is a good reason to know the codes: you can see which sub-strands a class found hardest and trace them back to Stages 4 and 5."}},{"t":"p","c":{"en":"After Year 6, learners move to Cambridge Lower Secondary English as a Second Language (Years 7 to 9 at PEPS). The framework's diagram places B1 around the end of Primary and through Lower Secondary. The objectives for Stages 7 to 9 are in the Lower Secondary framework, not in this one. The glossary can help during that handover: its definitions of terms such as \u003cem>deduce\u003c/em>, \u003cem>explore\u003c/em>, \u003cem>identify\u003c/em> and \u003cem>connective\u003c/em> give a shared language for teachers across stages.","ar":"After Year 6, learners move to Cambridge Lower Secondary English as a Second Language (Years 7 to 9 at PEPS). The framework's diagram places B1 around the end of Primary and through Lower Secondary. The objectives for Stages 7 to 9 are in the Lower Secondary framework, not in this one. The glossary can help during that handover: its definitions of terms such as \u003cem>deduce\u003c/em>, \u003cem>explore\u003c/em>, \u003cem>identify\u003c/em> and \u003cem>connective\u003c/em> give a shared language for teachers across stages."}},{"t":"h","c":{"en":"Using the glossary","ar":"Using the glossary"}},{"t":"p","c":{"en":"The framework's glossary has 17 short definitions. Use it in three ways. First, when you read an objective verb, check the definition: \u003cem>identify\u003c/em> means to locate features in a text; \u003cem>explore\u003c/em> means to investigate, look for patterns and discuss examples. Second, use it when you write learning outcomes for lesson plans, so colleagues understand the same verb the same way. Third, use it with new staff: \u003cem>scheme of work\u003c/em>, \u003cem>teacher guide\u003c/em>, \u003cem>strand\u003c/em> and \u003cem>sub-strand\u003c/em> are defined there in one or two lines.","ar":"The framework's glossary has 17 short definitions. Use it in three ways. First, when you read an objective verb, check the definition: \u003cem>identify\u003c/em> means to locate features in a text; \u003cem>explore\u003c/em> means to investigate, look for patterns and discuss examples. Second, use it when you write learning outcomes for lesson plans, so colleagues understand the same verb the same way. Third, use it with new staff: \u003cem>scheme of work\u003c/em>, \u003cem>teacher guide\u003c/em>, \u003cem>strand\u003c/em> and \u003cem>sub-strand\u003c/em> are defined there in one or two lines."}},{"t":"scenario","title":{"en":"A Y6 teacher plans Checkpoint preparation","ar":"A Y6 teacher plans Checkpoint preparation"},"c":{"en":"Your HOD asks a Y6 teacher to prepare learners for the Checkpoint. The teacher's first idea is to give past papers every week. Use the framework instead. First list the Stage 6 objectives in the four skills and Use of English. Second, identify sub-strands where last year's class was weakest, using test feedback codes. Third, trace those sub-strands back to Stage 4 and 5 objectives. For example, if Reading for detail was weak, look at 6Rd.01 to 6Rd.05 and at 4Rd.03 and 5Rd.03 on deducing meaning. Fourth, plan integrated lessons that revisit those objectives. Practice papers still have a place, but as a check, not as the whole course. Cambridge's framework does not say this; it is good practice built on the framework.","ar":"Your HOD asks a Y6 teacher to prepare learners for the Checkpoint. The teacher's first idea is to give past papers every week. Use the framework instead. First list the Stage 6 objectives in the four skills and Use of English. Second, identify sub-strands where last year's class was weakest, using test feedback codes. Third, trace those sub-strands back to Stage 4 and 5 objectives. For example, if Reading for detail was weak, look at 6Rd.01 to 6Rd.05 and at 4Rd.03 and 5Rd.03 on deducing meaning. Fourth, plan integrated lessons that revisit those objectives. Practice papers still have a place, but as a check, not as the whole course. Cambridge's framework does not say this; it is good practice built on the framework."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"1. Cambridge Primary ESL 0057 is designed for learners who speak another language at home, with no expected prior English at Stage 1; that is every PEPS learner. 2. Objectives are can-do statements linked to the CEFR; read the small words (support, range, length, accuracy) because they carry the progression. 3. A code such as 5Rd.01 gives the stage, the sub-strand and the order; the five strands (Reading, Writing, Use of English, Listening, Speaking) each have three sub-strands. 4. Plan integrated lessons: all four skills plus a Use of English focus, around a relevant theme. 5. Trace one skill from Stage 1 to Stage 6 before you plan, and look back for prerequisites and forward for what comes next. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"1. Cambridge Primary ESL 0057 is designed for learners who speak another language at home, with no expected prior English at Stage 1; that is every PEPS learner. 2. Objectives are can-do statements linked to the CEFR; read the small words (support, range, length, accuracy) because they carry the progression. 3. A code such as 5Rd.01 gives the stage, the sub-strand and the order; the five strands (Reading, Writing, Use of English, Listening, Speaking) each have three sub-strands. 4. Plan integrated lessons: all four skills plus a Use of English focus, around a relevant theme. 5. Trace one skill from Stage 1 to Stage 6 before you plan, and look back for prerequisites and forward for what comes next. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"What is the first step in the method for tracing a skill across the stages?","ar":"What is the first step in the method for tracing a skill across the stages?"},"opts":[{"en":"Choose one skill or language point, then find the matching objective in each stage","ar":"Choose one skill or language point, then find the matching objective in each stage"},{"en":"Read the Stage 6 objectives only, then assume earlier stages cover the same content","ar":"Read the Stage 6 objectives only, then assume earlier stages cover the same content"},{"en":"Count the objectives at each stage and compare the totals for all five strands","ar":"Count the objectives at each stage and compare the totals for all five strands"},{"en":"Select the textbook unit and teach it in the order the publisher suggests","ar":"Select the textbook unit and teach it in the order the publisher suggests"}],"correct":0,"expl":{"en":"The method starts with a single skill or language point and finds its objective at each stage, using strand and sub-strand names as a guide.","ar":"The method starts with a single skill or language point and finds its objective at each stage, using strand and sub-strand names as a guide."}},{"id":"m9q2","q":{"en":"Which pair is the best example of a prerequisite link between stages?","ar":"Which pair is the best example of a prerequisite link between stages?"},"opts":[{"en":"1Rd.01 (alphabet) before 6Ug.12 (modal forms such as should and ought to)","ar":"1Rd.01 (alphabet) before 6Ug.12 (modal forms such as should and ought to)"},{"en":"3Ug.06 and 4Ug.08 (early present perfect) before 5Ug.07 (for and since)","ar":"3Ug.06 and 4Ug.08 (early present perfect) before 5Ug.07 (for and since)"},{"en":"5Wc.03 (opinions) before 2Wor.01 (basic punctuation in guided writing)","ar":"5Wc.03 (opinions) before 2Wor.01 (basic punctuation in guided writing)"},{"en":"6Ug.11 (reported speech) before 3Ug.02 (imperatives for simple commands)","ar":"6Ug.11 (reported speech) before 3Ug.02 (imperatives for simple commands)"}],"correct":1,"expl":{"en":"The present perfect is introduced in 3Ug.06, developed in 4Ug.08, and extended with for and since in 5Ug.07. Later objectives build on the earlier ones.","ar":"The present perfect is introduced in 3Ug.06, developed in 4Ug.08, and extended with for and since in 5Ug.07. Later objectives build on the earlier ones."}},{"id":"m9q3","q":{"en":"How can Checkpoint feedback reports help a teacher use the framework?","ar":"How can Checkpoint feedback reports help a teacher use the framework?"},"opts":[{"en":"They give a list of the exact objectives that each learner must repeat when starting Stage 7 next year","ar":"They give a list of the exact objectives that each learner must repeat when starting Stage 7 next year"},{"en":"They replace the learning-objective codes, so the framework no longer needs to be used by teachers","ar":"They replace the learning-objective codes, so the framework no longer needs to be used by teachers"},{"en":"Reporting codes such as Rd or Ug show which sub-strands were weaker, so teachers can trace them back","ar":"Reporting codes such as Rd or Ug show which sub-strands were weaker, so teachers can trace them back"},{"en":"They show only an overall CEFR level, without any link to the sub-strands","ar":"They show only an overall CEFR level, without any link to the sub-strands"}],"correct":2,"expl":{"en":"The framework says the reporting code in each learning-objective code appears in the feedback reports for tests and reflects the sub-strand titles.","ar":"The framework says the reporting code in each learning-objective code appears in the feedback reports for tests and reflects the sub-strand titles."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A new teacher suggests using Cambridge Primary English, saying \"it is the main Cambridge English curriculum\". All learners at your school speak another language at home. What is the best reply?","ar":"A new teacher suggests using Cambridge Primary English, saying \"it is ge"},{"en":"No, Year 2 is B1, because primary learners are placed above the first two levels of the CEFR scale","ar":"No, Year 2 is B1, because primary learners are placed above the first two levels of the CEFR scale"},{"en":"The diagram shows A1 in the early stages, rising to A2 and B1 later, but its arrows are guidance, not exact labels","ar":"The diagram shows A1 in the early stages, rising to A2 and B1 later, but its arrows are guidance, not exact labels"},{"en":"The CEFR is not used in this framework, so no CEFR level can be linked to any stage of the programme","ar":"The CEFR is not used in this framework, so no CEFR level can be linked to any stage of the programme"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"Which rewrite of 3Sc.01 (give basic information about themselves using sentences) is the best can-do version for a Year 3 display?","ar":"Which rewrite of 3Sc.01 (give basic information about themselves using sentences) is the best can-do version for a Year 3 display?"},"opts":[{"en":"I can say single words to tell you about myself","ar":"I can say single words to tell you about myself"},{"en":"I can write a long paragraph about my family","ar":"I can write a long paragraph about my family"},{"en":"I can learn the grammar rules for sentences","ar":"I can learn the grammar rules for sentences"},{"en":"I can tell you about myself in sentences","ar":"I can tell you about myself in sentences"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"A Y3 teacher is worried because pupils make many mistakes in speaking. Which wording supports her?","ar":"A Y3 teacher is worried because pupils make many mistakes in speaking. Which wording supports her?"},"opts":[{"en":"3Sc.07 allows frequent, basic mistakes while pupils use some simple grammatical structures","ar":"3Sc.07 allows frequent, basic mistakes while pupils use some simple grammatical structures"},{"en":"3Sc.07 requires no mistakes in any structure that the pupils have already been taught in class","ar":"3Sc.07 requires no mistakes in any structure that the pupils have already been taught in class"},{"en":"3Sc.07 asks only for single words, so grammar mistakes are not relevant at all at Stage 3","ar":"3Sc.07 asks only for single words, so grammar mistakes are not relevant at all at Stage 3"},{"en":"3Sc.07 allows occasional mistakes only, and anything more means that the whole class is behind","ar":"3Sc.07 allows occasional mistakes only, and anything more means that the whole class is behind"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A planning sheet lists 5Sor.01. Which description is correct?","ar":"A planning sheet lists 5Sor.01. Which description is correct?"},"opts":[{"en":"Stage 5, Writing, Organisation: linking sentences with connectives to build a paragraph","ar":"Stage 5, Writing, Organisation: linking sentences with connectives to build a paragraph"},{"en":"Stage 5, Speaking, Organisation: linking a short sequence of simple sentences with connectives","ar":"Stage 5, Speaking, Organisation: linking a short sequence of simple sentences with connectives"},{"en":"Stage 5, Speaking, Communication: giving detailed information about themselves and others","ar":"Stage 5, Speaking, Communication: giving detailed information about themselves and others"},{"en":"Stage 5, Listening, Organisation: understanding how a speaker links the main points","ar":"Stage 5, Listening, Organisation: understanding how a speaker links the main points"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"A teacher says: \"3Rd.01 and 4Rd.01 are the same objective, and the number shows the level.\" What is the best correction?","ar":"A teacher says: \"3Rd.01 and 4Rd.01 are the same objective, and the number shows the level.\" What is the best correction?"},"opts":[{"en":"The number shows difficulty, so 01 is always the easiest objective in any strand of the framework","ar":"The number shows difficulty, so 01 is always the easiest objective in any strand of the framework"},{"en":"The number shows the /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });

if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;

  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
