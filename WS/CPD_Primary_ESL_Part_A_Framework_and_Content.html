#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:44px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:40px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:26px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:15px;color:#2b3345;line-height:1.7}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:200px}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

  .card{padding:22px 18px}

}

  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"primary-esl-framework-a","code":"PEA","passMark":80,"hours":"2.5 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · Cambridge Primary English as a Second Language 0057 · Part A","ar":"Staff CPD · Cambridge Primary English as a Second Language 0057 · Part A"},"title":{"en":"Understanding the Cambridge Primary ESL Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Primary ESL Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for primary teachers, HODs, coordinators and new staff: why the framework exists, how the CEFR and the can-do approach shape it, how the five strands and the learning-objective codes work, and what Reading, Writing, Use of English, Listening and Speaking ask of learners from Stage 1 to Stage 6.","ar":"A self-paced guide for primary teachers, HODs, coordinators and new staff: why the framework exists, how the CEFR and the can-do approach shape it, how the five strands and the learning-objective codes work, and what Reading, Writing, Use of English, Listening and Speaking ask of learners from Stage 1 to Stage 6."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Primary English as a Second Language 0057 Curriculum Framework (v3.0)","ar":"Cambridge Primary English as a Second Language 0057 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Primary English as a Second Language 0057 Curriculum Framework, version 3.0 (published September 2025). Check the current Cambridge documents; this CPD supports, and does not replace, them","ar":"Cambridge Primary English as a Second Language 0057 Curriculum Framework, version 3.0 (published September 2025). Check the current Cambridge documents; this CPD supports, and does not replace, them"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway and What Is New","ar":"Why This Framework? Purpose, Pathway and What Is New"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD is for primary teachers, HODs, coordinators and new staff who teach or lead English as a Second Language (ESL) in Years 1 to 6 (Cambridge Primary Stages 1 to 6). Part A explains the curriculum framework itself: why it exists, how it uses the CEFR, how it is organised, and what each strand asks of learners from Stage 1 to Stage 6. By the end you will be able to: explain what Cambridge Primary English as a Second Language 0057 is for; read any learning-objective code; describe how the five strands work together; trace one skill from Stage 1 to Stage 6; and notice the prerequisites that sit behind an objective. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"This CPD is for primary teachers, HODs, coordinators and new staff who teach or lead English as a Second Language (ESL) in Years 1 to 6 (Cambridge Primary Stages 1 to 6). Part A explains the curriculum framework itself: why it exists, how it uses the CEFR, how it is organised, and what each strand asks of learners from Stage 1 to Stage 6. By the end you will be able to: explain what Cambridge Primary English as a Second Language 0057 is for; read any learning-objective code; describe how the five strands work together; trace one skill from Stage 1 to Stage 6; and notice the prerequisites that sit behind an objective. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"Every learner at PEPS is learning English as a second language. That is not a small detail. It means that English is both a subject and the language in which learners meet Mathematics, Science and everything else. The Cambridge Primary English as a Second Language curriculum (code 0057) is the framework that PEPS uses to give that learning a clear shape across Years 1 to 6. A teacher who knows the framework well can answer three questions at any moment: \u003cem>What should learners be able to do now? What came before? What comes next?\u003c/em>","ar":"Every learner at PEPS is learning English as a second language. That is not a small detail. It means that English is both a subject and the language in which learners meet Mathematics, Science and everything else. The Cambridge Primary English as a Second Language curriculum (code 0057) is the framework that PEPS uses to give that learning a clear shape across Years 1 to 6. A teacher who knows the framework well can answer three questions at any moment: \u003cem>What should learners be able to do now? What came before? What comes next?\u003c/em>"}},{"t":"h","c":{"en":"What the framework says it is for","ar":"What the framework says it is for"}},{"t":"p","c":{"en":"The framework opens with its \"key benefits\". In its own words, it aims to empower learners to communicate confidently and effectively, and to develop the critical skills needed to respond to a range of information, media and texts. It also promotes active learning, develops thinking skills and encourages intellectual engagement. In short, it builds a solid foundation for two things: further study of English as a Second Language, and study through the medium of English.","ar":"The framework opens with its \"key benefits\". In its own words, it aims to empower learners to communicate confidently and effectively, and to develop the critical skills needed to respond to a range of information, media and texts. It also promotes active learning, develops thinking skills and encourages intellectual engagement. In short, it builds a solid foundation for two things: further study of English as a Second Language, and study through the medium of English."}},{"t":"list","c":{"en":["\u003cstrong>Clear progression.\u003c/strong> The structure is designed to support effective teaching of English within and across the primary stages, with clear progression of reading, writing, speaking and listening skills.","\u003cstrong>An integrated approach.\u003c/strong> The curriculum supports integrated planning and teaching. Throughout, learners revisit and engage with language at deeper levels and in different contexts.","\u003cstrong>An international standard.\u003c/strong> The learning objectives are based on the Council of Europe's Common European Framework of Reference for Languages (CEFR). The framework says this alignment makes it easy for schools and parents to understand the level of the programme.","\u003cstrong>Can-do statements.\u003c/strong> Learning outcomes are defined in terms of what learners should be able to do in English. The framework says this encourages learning-centred, activity-based approaches."],"ar":["\u003cstrong>Clear progression.\u003c/strong> The structure is designed to support effective teaching of English within and across the primary stages, with clear progression of reading, writing, speaking and listening skills.","\u003cstrong>An integrated approach.\u003c/strong> The curriculum supports integrated planning and teaching. Throughout, learners revisit and engage with language at deeper levels and in different contexts.","\u003cstrong>An international standard.\u003c/strong> The learning objectives are based on the Council of Europe's Common European Framework of Reference for Languages (CEFR). The framework says this alignment makes it easy for schools and parents to understand the level of the programme.","\u003cstrong>Can-do statements.\u003c/strong> Learning outcomes are defined in terms of what learners should be able to do in English. The framework says this encourages learning-centred, activity-based approaches."]}},{"t":"h","c":{"en":"English or English as a Second Language?","ar":"English or English as a Second Language?"}},{"t":"p","c":{"en":"The Cambridge Primary programme includes two English curricula: English (for first-language speakers) and English as a Second Language. The framework asks schools to choose the one that best reflects the context of their learners, and it explains the difference in a table. The key points are below.","ar":"The Cambridge Primary programme includes two English curricula: English (for first-language speakers) and English as a Second Language. The framework asks schools to choose the one that best reflects the context of their learners, and it explains the difference in a table. The key points are below."}},{"t":"table","head":{"en":["Question","Cambridge Primary English","Cambridge Primary English as a Second Language"],"ar":["Question","Cambridge Primary English","Cambridge Primary English as a Second Language"]},"rows":[{"en":["Designed for","Learners who speak English as a first language, at home or through significant experience such as an English-speaking kindergarten","Learners who speak a language other than English at home"],"ar":["Designed for","Learners who speak English as a first language, at home or through significant experience such as an English-speaking kindergarten","Learners who speak a language other than English at home"]},{"en":["Expected prior English at Stage 1","Well-developed speaking and listening skills and some experience of reading and writing in English","No expectation of any prior experience of English before Stage 1"],"ar":["Expected prior English at Stage 1","Well-developed speaking and listening skills and some experience of reading and writing in English","No expectation of any prior experience of English before Stage 1"]},{"en":["What it develops","Skilled communicators, competent readers, skills in evaluating and analysing language","Effective practical communication, confidence in reading, awareness of language and language-learning skills"],"ar":["What it develops","Skilled communicators, competent readers, skills in evaluating and analysing language","Effective practical communication, confidence in reading, awareness of language and language-learning skills"]},{"en":["Strands","Three: Reading, Writing, Speaking and Listening (grammar is embedded in Reading and Writing)","Five: Reading, Writing, Speaking, Listening and Use of English"],"ar":["Strands","Three: Reading, Writing, Speaking and Listening (grammar is embedded in Reading and Writing)","Five: Reading, Writing, Speaking, Listening and Use of English"]},{"en":["Checkpoint and Progression Test papers","Paper 1 Reading and Writing (non-fiction); Paper 2 Reading and Writing (fiction)","Paper 1 Reading and Usage; Paper 2 Writing; Paper 3 Listening"],"ar":["Checkpoint and Progression Test papers","Paper 1 Reading and Writing (non-fiction); Paper 2 Reading and Writing (fiction)","Paper 1 Reading and Usage; Paper 2 Writing; Paper 3 Listening"]}]},{"t":"p","c":{"en":"Notice two things. First, the ESL framework starts from \"no prior experience\", so Stage 1 objectives begin with letters, sounds and simple words. Second, grammar is not hidden inside Reading and Writing. It has its own strand, Use of English. You will meet that strand in Module 7.","ar":"Notice two things. First, the ESL framework starts from \"no prior experience\", so Stage 1 objectives begin with letters, sounds and simple words. Second, grammar is not hidden inside Reading and Writing. It has its own strand, Use of English. You will meet that strand in Module 7."}},{"t":"h","c":{"en":"Pathway, ages and teaching time","ar":"Pathway, ages and teaching time"}},{"t":"p","c":{"en":"The primary programme is part of the Cambridge Pathway, which the framework describes as leading \"seamlessly\" from primary to secondary and pre-university years. Each step builds on the previous one or on learners' earlier education in other systems. The framework is typically for learners aged 5 to 11, but the framework itself says it may be appropriate to use it for slightly different ages to suit your context.","ar":"The primary programme is part of the Cambridge Pathway, which the framework describes as leading \"seamlessly\" from primary to secondary and pre-university years. Each step builds on the previous one or on learners' earlier education in other systems. The framework is typically for learners aged 5 to 11, but the framework itself says it may be appropriate to use it for slightly different ages to suit your context."}},{"t":"p","c":{"en":"At PEPS, Years 1 to 6 follow Stages 1 to 6. Learners come to Year 1 from Foundation Stage 2 (FS2), which is not part of this framework. After Year 6 they move to Years 7 to 9, which follow Cambridge Lower Secondary English as a Second Language. The diagram in Module 2 shows how the framework itself places these programmes on the CEFR scale.","ar":"At PEPS, Years 1 to 6 follow Stages 1 to 6. Learners come to Year 1 from Foundation Stage 2 (FS2), which is not part of this framework. After Year 6 they move to Years 7 to 9, which follow Cambridge Lower Secondary English as a Second Language. The diagram in Module 2 shows how the framework itself places these programmes on the CEFR scale."}},{"t":"callout","k":"key","title":{"en":"Teaching time: the exact guidance","ar":"Teaching time: the exact guidance"},"c":{"en":"The framework says: \"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage).\" It then adds that your actual number of teaching hours may vary according to your context. This is guidance, not a rule. Your school's timetable decides the real figure.","ar":"The framework says: \"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage).\" It then adds that your actual number of teaching hours may vary according to your context. This is guidance, not a rule. Your school's timetable decides the real figure."}},{"t":"h","c":{"en":"Supporting teachers","ar":"Supporting teachers"}},{"t":"p","c":{"en":"The framework lists the support Cambridge provides, mostly on the School Support Hub. For primary ESL, the lists name these teaching resources: the curriculum framework, the Phonics and Handwriting Framework, the teacher guide and schemes of work. They also name three Cambridge Primary assessments: Progression Tests, Checkpoint and CEM Baseline Tests. The framework says assessments designed to complement the framework are provided for Stages 3 to 6. If you do not have a log-in for the Hub, the framework says to ask the Cambridge coordinator or exams officer in your school.","ar":"The framework lists the support Cambridge provides, mostly on the School Support Hub. For primary ESL, the lists name these teaching resources: the curriculum framework, the Phonics and Handwriting Framework, the teacher guide and schemes of work. They also name three Cambridge Primary assessments: Progression Tests, Checkpoint and CEM Baseline Tests. The framework says assessments designed to complement the framework are provided for Stages 3 to 6. If you do not have a log-in for the Hub, the framework says to ask the Cambridge coordinator or exams officer in your school."}},{"t":"p","c":{"en":"The framework is clear that schemes of work are optional. Each scheme of work (one for each stage) contains suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans. But \"you do not need to use the ideas in the schemes of work\", and the activities are not designed to fill all the teaching time. Teachers should add other activities of similar difficulty.","ar":"The framework is clear that schemes of work are optional. Each scheme of work (one for each stage) contains suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans. But \"you do not need to use the ideas in the schemes of work\", and the activities are not designed to fill all the teaching time. Teachers should add other activities of similar difficulty."}},{"t":"h","c":{"en":"Version 3.0 and the changes section","ar":"Version 3.0 and the changes section"}},{"t":"p","c":{"en":"The document you are reading about is \u003cstrong>version 3.0, published September 2025\u003c/strong>. The cover notes that it was first published in September 2020 for first teaching in September 2021. The changes section on page 40 says one thing was added: information about phonics and handwriting (on pages 12 and 13), to reflect the introduction of the Cambridge Phonics and Handwriting Framework. It adds that there may be other minor changes that do not affect teaching and learning. The section lists no other specific change.","ar":"The document you are reading about is \u003cstrong>version 3.0, published September 2025\u003c/strong>. The cover notes that it was first published in September 2020 for first teaching in September 2021. The changes section on page 40 says one thing was added: information about phonics and handwriting (on pages 12 and 13), to reflect the introduction of the Cambridge Phonics and Handwriting Framework. It adds that there may be other minor changes that do not affect teaching and learning. The section lists no other specific change."}},{"t":"scenario","title":{"en":"A new colleague asks which English curriculum PEPS uses","ar":"A new colleague asks which English curriculum PEPS uses"},"c":{"en":"A newly appointed teacher says: \"I have seen the Cambridge Primary English books in a catalogue. Our learners all speak Arabic or another language at home. Should we be using that curriculum instead?\" The good answer comes from the framework. Cambridge Primary English is designed for learners who speak English as a first language, with well-developed speaking and listening. The ESL curriculum is designed for learners who speak another language at home and assumes no prior English at Stage 1. Because all PEPS learners are learning English as a second language, 0057 is the matching framework. You can also point out that the two curricula have different strands and different test papers. Where this CPD gives a PEPS fact (such as Years 1 to 6 being Stages 1 to 6), it is a school fact, not something the framework states.","ar":"A newly appointed teacher says: \"I have seen the Cambridge Primary English books in a catalogue. Our learners all speak Arabic or another language at home. Should we be using that curriculum instead?\" The good answer comes from the framework. Cambridge Primary English is designed for learners who speak English as a first language, with well-developed speaking and listening. The ESL curriculum is designed for learners who speak another language at home and assumes no prior English at Stage 1. Because all PEPS learners are learning English as a second language, 0057 is the matching framework. You can also point out that the two curricula have different strands and different test papers. Where this CPD gives a PEPS fact (such as Years 1 to 6 being Stages 1 to 6), it is a school fact, not something the framework states."}},{"t":"callout","k":"tip","title":{"en":"Good practice: keep the framework open","ar":"Good practice: keep the framework open"},"c":{"en":"Keep a copy of the framework (or the learning-objective pages for your stage) beside your planning. Check each fact in this CPD against it. Cambridge may publish a newer version, so always look at the current document on the Cambridge website or the School Support Hub.","ar":"Keep a copy of the framework (or the learning-objective pages for your stage) beside your planning. Check each fact in this CPD against it. Cambridge may publish a newer version, so always look at the current document on the Cambridge website or the School Support Hub."}}],"checks":[{"id":"m1q1","q":{"en":"Which group of learners is Cambridge Primary English as a Second Language designed for, according to the framework?","ar":"Which group of learners is Cambridge Primary English as a Second Language designed for, according to the framework?"},"opts":[{"en":"Learners who speak a language other than English at home, with no expected prior English at Stage 1","ar":"Learners who speak a language other than English at home, with no expected prior English at Stage 1"},{"en":"Learners who speak English at home and have already read and written some English before Stage 1","ar":"Learners who speak English at home and have already read and written some English before Stage 1"},{"en":"Learners who attended an English-speaking kindergarten and already speak English with confidence at home","ar":"Learners who attended an English-speaking kindergarten and already speak English with confidence at home"},{"en":"Learners aged 5 to 11 who have already completed Stage 1 of Cambridge Primary English","ar":"Learners aged 5 to 11 who have already completed Stage 1 of Cambridge Primary English"}],"correct":0,"expl":{"en":"The framework's comparison table says ESL is designed for learners who speak a language other than English at home, and that there is no expectation of prior experience of English before Stage 1.","ar":"The framework's comparison table says ESL is designed for learners who speak a language other than English at home, and that there is no expectation of prior experience of English before Stage 1."}},{"id":"m1q2","q":{"en":"What does the framework say about teaching time for Cambridge Primary English as a Second Language?","ar":"What does the framework say about teaching time for Cambridge Primary English as a Second Language?"},"opts":[{"en":"Exactly 5 hours a week in every school, which is about 150 hours in each stage and cannot vary","ar":"Exactly 5 hours a week in every school, which is about 150 hours in each stage and cannot vary"},{"en":"About 4 to 5 hours a week, or 120 to 150 hours per stage; actual hours may vary","ar":"About 4 to 5 hours a week, or 120 to 150 hours per stage; actual hours may vary"},{"en":"About 3 to 4 hours a week, or 90 to 120 hours per stage, and the hours vary by context","ar":"About 3 to 4 hours a week, or 90 to 120 hours per stage, and the hours vary by context"},{"en":"No figure at all; the framework leaves the number of hours entirely to each school's choice","ar":"No figure at all; the framework leaves the number of hours entirely to each school's choice"}],"correct":1,"expl":{"en":"The framework gives \"4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage)\" as guidance, and says actual hours may vary.","ar":"The framework gives \"4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage)\" as guidance, and says actual hours may vary."}},{"id":"m1q3","q":{"en":"What did the changes section say was added in version 3.0 (September 2025)?","ar":"What did the changes section say was added in version 3.0 (September 2025)?"},"opts":[{"en":"A new strand called Phonics, with its own learning-objective codes for every stage from Stage 1 to Stage 6","ar":"A new strand called Phonics, with its own learning-objective codes for every stage from Stage 1 to Stage 6"},{"en":"A replacement of the CEFR levels with a Cambridge scale for young learners","ar":"A replacement of the CEFR levels with a Cambridge scale for young learners"},{"en":"Information about phonics and handwriting, reflecting the Cambridge Phonics and Handwriting Framework","ar":"Information about phonics and handwriting, reflecting the Cambridge Phonics and Handwriting Framework"},{"en":"A complete rewrite of the Stage 1 to Stage 6 objectives for Reading and Writing","ar":"A complete rewrite of the Stage 1 to Stage 6 objectives for Reading and Writing"}],"correct":2,"expl":{"en":"Section 5 says information about phonics and handwriting was added on pages 12 and 13. Other changes were described as minor ones that do not affect teaching and learning.","ar":"Section 5 says information about phonics and handwriting was added on pages 12 and 13. Other changes were described as minor ones that do not affect teaching and learning."}}]},{"id":"m2","title":{"en":"The CEFR and the Can-Do Approach","ar":"The CEFR and the Can-Do Approach"},"minutes":17,"blocks":[{"t":"p","c":{"en":"If you have ever tried to explain what \"Level 3 English\" means to a parent, you know the problem. Levels named by schools mean different things in different places. The framework solves this by tying its objectives to an international reference: the Common European Framework of Reference for Languages, usually shortened to \u003cstrong>CEFR\u003c/strong>. The framework describes the CEFR as used widely both within and beyond Europe to map learners' progression in English. This module explains what that means for your classroom.","ar":"If you have ever tried to explain what \"Level 3 English\" means to a parent, you know the problem. Levels named by schools mean different things in different places. The framework solves this by tying its objectives to an international reference: the Common European Framework of Reference for Languages, usually shortened to \u003cstrong>CEFR\u003c/strong>. The framework describes the CEFR as used widely both within and beyond Europe to map learners' progression in English. This module explains what that means for your classroom."}},{"t":"h","c":{"en":"The six CEFR levels","ar":"The six CEFR levels"}},{"t":"p","c":{"en":"The framework states that the CEFR describes language ability on a six-point scale, \"from A1 for beginners, up to C2 for those who have mastered a language\". The six levels are grouped into three bands.","ar":"The framework states that the CEFR describes language ability on a six-point scale, \"from A1 for beginners, up to C2 for those who have mastered a language\". The six levels are grouped into three bands."}},{"t":"table","head":{"en":["CEFR level","Band (as shown in the framework)","Where the framework's diagram uses it"],"ar":["CEFR level","Band (as shown in the framework)","Where the framework's diagram uses it"]},"rows":[{"en":["A1","Basic user","Shown against the first stages of Cambridge Primary ESL"],"ar":["A1","Basic user","Shown against the first stages of Cambridge Primary ESL"]},{"en":["A2","Basic user","Shown against the middle stages of Cambridge Primary ESL"],"ar":["A2","Basic user","Shown against the middle stages of Cambridge Primary ESL"]},{"en":["B1","Independent user","Shown from the end of the primary stages into Cambridge Lower Secondary ESL"],"ar":["B1","Independent user","Shown from the end of the primary stages into Cambridge Lower Secondary ESL"]},{"en":["B2","Independent user","Shown towards the end of Lower Secondary and leading into Cambridge IGCSE"],"ar":["B2","Independent user","Shown towards the end of Lower Secondary and leading into Cambridge IGCSE"]},{"en":["C1","Proficient user","Not used in the primary or lower secondary diagram"],"ar":["C1","Proficient user","Not used in the primary or lower secondary diagram"]},{"en":["C2","Proficient user","Not used in the primary or lower secondary diagram"],"ar":["C2","Proficient user","Not used in the primary or lower secondary diagram"]}]},{"t":"p","c":{"en":"Look at what is missing. A primary learner who completes Stage 6 is nowhere near C2. The levels are a long road, and the primary stages cover only the first steps. That is a healthy way to keep expectations realistic for learners who are meeting English mainly at school.","ar":"Look at what is missing. A primary learner who completes Stage 6 is nowhere near C2. The levels are a long road, and the primary stages cover only the first steps. That is a healthy way to keep expectations realistic for learners who are meeting English mainly at school."}},{"t":"h","c":{"en":"Reading the alignment diagram","ar":"Reading the alignment diagram"}},{"t":"p","c":{"en":"The framework includes a diagram called the alignment of Cambridge Primary and Lower Secondary English as a Second Language to the CEFR. It has a column of stage numbers, 1 to 6 for Primary and 7 to 9 for Lower Secondary, with Cambridge IGCSE above them and \"Further study through English\" across the top. Four upward arrows are drawn on it, labelled A1, A2, B1 and B2. Here is how to read it.","ar":"The framework includes a diagram called the alignment of Cambridge Primary and Lower Secondary English as a Second Language to the CEFR. It has a column of stage numbers, 1 to 6 for Primary and 7 to 9 for Lower Secondary, with Cambridge IGCSE above them and \"Further study through English\" across the top. Four upward arrows are drawn on it, labelled A1, A2, B1 and B2. Here is how to read it."}},{"t":"list","c":{"en":["\u003cstrong>A1\u003c/strong> is drawn at the bottom, across Stages 1 and 2.","\u003cstrong>A2\u003c/strong> starts at Stage 3 and rises through the middle primary stages, reaching about Stage 5 or 6.","\u003cstrong>B1\u003c/strong> starts near the top of Primary (around Stage 6) and runs through Lower Secondary (Stages 7 to 9).","\u003cstrong>B2\u003c/strong> starts in the later Lower Secondary stages and rises into Cambridge IGCSE."],"ar":["\u003cstrong>A1\u003c/strong> is drawn at the bottom, across Stages 1 and 2.","\u003cstrong>A2\u003c/strong> starts at Stage 3 and rises through the middle primary stages, reaching about Stage 5 or 6.","\u003cstrong>B1\u003c/strong> starts near the top of Primary (around Stage 6) and runs through Lower Secondary (Stages 7 to 9).","\u003cstrong>B2\u003c/strong> starts in the later Lower Secondary stages and rises into Cambridge IGCSE."]}},{"t":"callout","k":"warn","title":{"en":"Read the arrows as approximate","ar":"Read the arrows as approximate"},"c":{"en":"The arrows overlap the stage rows and do not have exact start and end lines. The framework text itself says that it provides \"guidance on how the English as a Second Language curriculum aligns to the CEFR levels\", based on CEFR descriptors, specifically the Young Learner descriptors collated for ages 7 to 10 and 11 to 15. It does not claim that every learner at the end of Stage 2 is exactly A1. Do not tell parents \"Year 6 equals B1\" or \"Year 2 equals A1\" as a fixed rule. Say instead that the diagram shows the programme building from A1 towards B1 and beyond, and check Cambridge's own information for more detail.","ar":"The arrows overlap the stage rows and do not have exact start and end lines. The framework text itself says that it provides \"guidance on how the English as a Second Language curriculum aligns to the CEFR levels\", based on CEFR descriptors, specifically the Young Learner descriptors collated for ages 7 to 10 and 11 to 15. It does not claim that every learner at the end of Stage 2 is exactly A1. Do not tell parents \"Year 6 equals B1\" or \"Year 2 equals A1\" as a fixed rule. Say instead that the diagram shows the programme building from A1 towards B1 and beyond, and check Cambridge's own information for more detail."}},{"t":"p","c":{"en":"One more point from the diagram. The framework says the Primary and Lower Secondary programmes \"provide a solid foundation for the further study of English as a Second Language, and for further study through the medium of English at Cambridge IGCSE or O Level and beyond\". The learners in your Year 6 class are therefore preparing, step by step, to study other subjects in English in the later years of school.","ar":"One more point from the diagram. The framework says the Primary and Lower Secondary programmes \"provide a solid foundation for the further study of English as a Second Language, and for further study through the medium of English at Cambridge IGCSE or O Level and beyond\". The learners in your Year 6 class are therefore preparing, step by step, to study other subjects in English in the later years of school."}},{"t":"h","c":{"en":"What \"can-do\" means","ar":"What \"can-do\" means"}},{"t":"p","c":{"en":"A can-do statement says what a learner can do with the language, not what the teacher will cover. Compare these two:","ar":"A can-do statement says what a learner can do with the language, not what the teacher will cover. Compare these two:"}},{"t":"table","head":{"en":["Content-coverage wording","Can-do wording"],"ar":["Content-coverage wording","Can-do wording"]},"rows":[{"en":["The teacher teaches question words","The learner can ask a question to find out personal information and understand the answer"],"ar":["The teacher teaches question words","The learner can ask a question to find out personal information and understand the answer"]},{"en":["The teacher covers instructions","The learner can read a short instruction and do what it says"],"ar":["The teacher covers instructions","The learner can read a short instruction and do what it says"]},{"en":["The teacher introduces opinions","The learner can say what they like and why"],"ar":["The teacher introduces opinions","The learner can say what they like and why"]}]},{"t":"p","c":{"en":"The framework's own objectives are written in this style. Almost every one starts with a verb that names what the learner does: \u003cem>understand, recognise, deduce, give, describe, ask, write, use, read, link, express\u003c/em>. For example, 2Sc.03 asks learners to ask questions to find out an increasing range of personal information and respond accordingly. The framework explains that framing objectives as a progressive sequence of can-do statements \"encourages teachers to use learning-centred, activity-based approaches\". If the objective is something the learner does, then the lesson should give the learner many chances to do it.","ar":"The framework's own objectives are written in this style. Almost every one starts with a verb that names what the learner does: \u003cem>understand, recognise, deduce, give, describe, ask, write, use, read, link, express\u003c/em>. For example, 2Sc.03 asks learners to ask questions to find out an increasing range of personal information and respond accordingly. The framework explains that framing objectives as a progressive sequence of can-do statements \"encourages teachers to use learning-centred, activity-based approaches\". If the objective is something the learner does, then the lesson should give the learner many chances to do it."}},{"t":"h","c":{"en":"Reading the small words: support, range and accuracy","ar":"Reading the small words: support, range and accuracy"}},{"t":"p","c":{"en":"Most of the difference between one stage and the next is carried by small phrases inside the can-do statements. Learn to read them closely.","ar":"Most of the difference between one stage and the next is carried by small phrases inside the can-do statements. Learn to read them closely."}},{"t":"list","c":{"en":["\u003cstrong>Support:\u003c/strong> \"with support\", \"with little or no support\" or no phrase at all. For example, 1Ld.02 says \"with support\", 2Ld.01 says \"with little or no support\".","\u003cstrong>Range:\u003c/strong> \"a limited range\", \"an increasing range\", \"a range\", \"a wide range\". For example, 3Uv.06 uses \"common adverbs of frequency\" while 6Uv.04 asks for \"a wide range of adverbs of definite and indefinite time\".","\u003cstrong>Length and complexity:\u003c/strong> \"words and phrases\", \"short sentences\", \"a short sequence of sentences\", \"short and extended texts\".","\u003cstrong>Accuracy:\u003c/strong> \"allowing for frequent, basic mistakes\" (1Sc.06) becomes \"allowing for occasional mistakes\" (6Wca.04)."],"ar":["\u003cstrong>Support:\u003c/strong> \"with support\", \"with little or no support\" or no phrase at all. For example, 1Ld.02 says \"with support\", 2Ld.01 says \"with little or no support\".","\u003cstrong>Range:\u003c/strong> \"a limited range\", \"an increasing range\", \"a range\", \"a wide range\". For example, 3Uv.06 uses \"common adverbs of frequency\" while 6Uv.04 asks for \"a wide range of adverbs of definite and indefinite time\".","\u003cstrong>Length and complexity:\u003c/strong> \"words and phrases\", \"short sentences\", \"a short sequence of sentences\", \"short and extended texts\".","\u003cstrong>Accuracy:\u003c/strong> \"allowing for frequent, basic mistakes\" (1Sc.06) becomes \"allowing for occasional mistakes\" (6Wca.04)."]}},{"t":"scenario","title":{"en":"Turning an objective into a can-do for a Stage 1 class","ar":"Turning an objective into a can-do for a Stage 1 class"},"c":{"en":"You are planning for a Y1 class and want to share the aim of 1Sc.01 with the pupils. The objective says to give basic information about themselves using simple words and phrases. A child-friendly version might be \"I can tell you my name, my age and my favourite colour.\" This is good practice, not a Cambridge requirement. Notice what you kept (personal information, simple words and phrases) and what you did not add. You did not ask for full sentences, because the Stage 1 objective speaks of \"simple words and phrases\". Full sentences are what 3Sc.01 asks for, two stages later.","ar":"You are planning for a Y1 class and want to share the aim of 1Sc.01 with the pupils. The objective says to give basic information about themselves using simple words and phrases. A child-friendly version might be \"I can tell you my name, my age and my favourite colour.\" This is good practice, not a Cambridge requirement. Notice what you kept (personal information, simple words and phrases) and what you did not add. You did not ask for full sentences, because the Stage 1 objective speaks of \"simple words and phrases\". Full sentences are what 3Sc.01 asks for, two stages later."}},{"t":"p","c":{"en":"\u003cstrong>Why this helps assessment.\u003c/strong> A can-do statement is easy to observe. You can watch a pupil attempt it and ask: did they do it alone, with prompting, or not yet? That is far more useful for planning the next lesson than a note that says \"covered question words\". Module 9 returns to this when we trace skills across the stages.","ar":"\u003cstrong>Why this helps assessment.\u003c/strong> A can-do statement is easy to observe. You can watch a pupil attempt it and ask: did they do it alone, with prompting, or not yet? That is far more useful for planning the next lesson than a note that says \"covered question words\". Module 9 returns to this when we trace skills across the stages."}}],"checks":[{"id":"m2q1","q":{"en":"Which description of the CEFR matches the framework?","ar":"Which description of the CEFR matches the framework?"},"opts":[{"en":"A four-point scale from Level 1 for beginners up to Level 4 for advanced young learners of English","ar":"A four-point scale from Level 1 for beginners up to Level 4 for advanced young learners of English"},{"en":"A scale used only in Europe, with all six levels covered inside the primary stages","ar":"A scale used only in Europe, with all six levels covered inside the primary stages"},{"en":"A Cambridge-only scale that gives a different level name to each primary stage","ar":"A Cambridge-only scale that gives a different level name to each primary stage"},{"en":"A six-point scale from A1 for beginners up to C2 for those who have mastered a language","ar":"A six-point scale from A1 for beginners up to C2 for those who have mastered a language"}],"correct":3,"expl":{"en":"The framework says the CEFR describes language ability on a six-point scale, A1 to C2, and that it is used widely within and beyond Europe.","ar":"The framework says the CEFR describes language ability on a six-point scale, A1 to C2, and that it is used widely within and beyond Europe."}},{"id":"m2q2","q":{"en":"Which statement about the alignment diagram is the most accurate?","ar":"Which statement about the alignment diagram is the most accurate?"},"opts":[{"en":"Arrows rise from A1 in the early stages through A2 and B1 to B2","ar":"Arrows rise from A1 in the early stages through A2 and B1 to B2"},{"en":"It shows exact CEFR levels for every single stage, so Stage 2 is A1 and Stage 6 is B1","ar":"It shows exact CEFR levels for every single stage, so Stage 2 is A1 and Stage 6 is B1"},{"en":"It shows C2 reached at the end of Lower Secondary, leading straight into Cambridge IGCSE","ar":"It shows C2 reached at the end of Lower Secondary, leading straight into Cambridge IGCSE"},{"en":"It shows that all primary learners reach B1 by the end of Stage 3 if they attend regularly","ar":"It shows that all primary learners reach B1 by the end of Stage 3 if they attend regularly"}],"correct":0,"expl":{"en":"The diagram has four labelled arrows (A1, A2, B1, B2) that rise across primary, lower secondary and IGCSE. The arrows are approximate guides, not exact stage cut-offs.","ar":"The diagram has four labelled arrows (A1, A2, B1, B2) that rise across primary, lower secondary and IGCSE. The arrows are approximate guides, not exact stage cut-offs."}},{"id":"m2q3","q":{"en":"What is the main purpose of writing learning objectives as can-do statements?","ar":"What is the main purpose of writing learning objectives as can-do statements?"},"opts":[{"en":"They list the topics the teacher must cover in every lesson, in a compulsory order set by Cambridge for all schools","ar":"They list the topics the teacher must cover in every lesson, in a compulsory order set by Cambridge for all schools"},{"en":"They describe what learners should be able to do, which encourages learning-centred, activity-based teaching","ar":"They describe what learners should be able to do, which encourages learning-centred, activity-based teaching"},{"en":"They set the exact number of words that a learner must write in each stage","ar":"They set the exact number of words that a learner must write in each stage"},{"en":"They replace classroom assessment, because Cambridge marks each statement as pass or fail","ar":"They replace classroom assessment, because Cambridge marks each statement as pass or fail"}],"correct":1,"expl":{"en":"The framework says defining outcomes as can-do statements encourages teachers to use learning-centred, activity-based approaches.","ar":"The framework says defining outcomes as can-do statements encourages teachers to use learning-centred, activity-based approaches."}}]},{"id":"m3","title":{"en":"Aims, Learner Attributes and How the Framework Is Organised","ar":"Aims, Learner Attributes and How the Framework Is Organised"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before you look at any single objective, it helps to see the architecture of the whole framework. It has three layers: \u003cstrong>strands\u003c/strong>, \u003cstrong>sub-strands\u003c/strong> and \u003cstrong>learning objectives\u003c/strong>. The glossary defines a strand as \"a collection of learning objectives in the curriculum framework that forms an area of learning\". A sub-strand is a sub-section that divides a strand into more specific areas. A learning objective is a statement of the expected knowledge, understanding and skills, and also a reference \"against which to check learners' ability and skills development\".","ar":"Before you look at any single objective, it helps to see the architecture of the whole framework. It has three layers: \u003cstrong>strands\u003c/strong>, \u003cstrong>sub-strands\u003c/strong> and \u003cstrong>learning objectives\u003c/strong>. The glossary defines a strand as \"a collection of learning objectives in the curriculum framework that forms an area of learning\". A sub-strand is a sub-section that divides a strand into more specific areas. A learning objective is a statement of the expected knowledge, understanding and skills, and also a reference \"against which to check learners' ability and skills development\"."}},{"t":"h","c":{"en":"The aims","ar":"The aims"}},{"t":"p","c":{"en":"The framework gives general aims for the Cambridge Primary programme: laying the foundations for lifelong learning, including curiosity and enthusiasm for learning, knowledge and skills that can be applied in and across subjects, effective and confident communication skills (including in English), and understanding of personal and local context together with global awareness. For ESL specifically, learners:","ar":"The framework gives general aims for the Cambridge Primary programme: laying the foundations for lifelong learning, including curiosity and enthusiasm for learning, knowledge and skills that can be applied in and across subjects, effective and confident communication skills (including in English), and understanding of personal and local context together with global awareness. For ESL specifically, learners:"}},{"t":"list","c":{"en":["develop a curiosity about other languages and cultures and how these shape our perceptions of the world;","see themselves as successful language learners;","are able to communicate effectively through reading, writing, speaking and listening;","become confident in and enjoy reading a range of texts;","develop a solid foundation in the skills required for continued study of ESL and for study through the medium of English."],"ar":["develop a curiosity about other languages and cultures and how these shape our perceptions of the world;","see themselves as successful language learners;","are able to communicate effectively through reading, writing, speaking and listening;","become confident in and enjoy reading a range of texts;","develop a solid foundation in the skills required for continued study of ESL and for study through the medium of English."]}},{"t":"p","c":{"en":"Look at the second aim. \"See themselves as successful language learners\" is an aim about identity as well as skill. For a Year 1 pupil who has just started English, a classroom where small successes are noticed is not a luxury. It is part of the curriculum.","ar":"Look at the second aim. \"See themselves as successful language learners\" is an aim about identity as well as skill. For a Year 1 pupil who has just started English, a classroom where small successes are noticed is not a luxury. It is part of the curriculum."}},{"t":"h","c":{"en":"The five learner attributes","ar":"The five learner attributes"}},{"t":"p","c":{"en":"The Cambridge approach encourages learners to be responsible, innovative, confident, engaged and reflective. The ESL framework describes each one in language-learning terms.","ar":"The Cambridge approach encourages learners to be responsible, innovative, confident, engaged and reflective. The ESL framework describes each one in language-learning terms."}},{"t":"table","head":{"en":["Attribute","What the framework says in ESL terms","What you might see in a PEPS lesson (good practice example)"],"ar":["Attribute","What the framework says in ESL terms","What you might see in a PEPS lesson (good practice example)"]},"rows":[{"en":["Responsible","Learners take responsibility for their learning, ask questions and look for chances to use their language to express themselves","A pupil asks \"How do you spell that?\" and then uses the new word in a sentence"],"ar":["Responsible","Learners take responsibility for their learning, ask questions and look for chances to use their language to express themselves","A pupil asks \"How do you spell that?\" and then uses the new word in a sentence"]},{"en":["Innovative","Learners explore and experiment with new language, making connections to their own language","Pupils notice that an English word looks or sounds like a word in Arabic, Urdu or another home language"],"ar":["Innovative","Learners explore and experiment with new language, making connections to their own language","Pupils notice that an English word looks or sounds like a word in Arabic, Urdu or another home language"]},{"en":["Confident","Learners feel empowered to take risks, try new language, and reflect on and learn from mistakes","A pupil tries a past tense verb, gets it wrong, and is happy to try again"],"ar":["Confident","Learners feel empowered to take risks, try new language, and reflect on and learn from mistakes","A pupil tries a past tense verb, gets it wrong, and is happy to try again"]},{"en":["Engaged","Learners are curious about other languages, cultures and perspectives","Pupils read about a festival from another country and ask questions"],"ar":["Engaged","Learners are curious about other languages, cultures and perspectives","Pupils read about a festival from another country and ask questions"]},{"en":["Reflective","Learners plan, monitor and evaluate their own learning and reflect on strategies used before","Before a writing task, a pupil says which checking strategy helped last time"],"ar":["Reflective","Learners plan, monitor and evaluate their own learning and reflect on strategies used before","Before a writing task, a pupil says which checking strategy helped last time"]}]},{"t":"h","c":{"en":"Five strands, fifteen sub-strands","ar":"Five strands, fifteen sub-strands"}},{"t":"p","c":{"en":"The framework divides the learning objectives into five strands that \"run through every primary stage\": Reading, Writing, Use of English, Listening and Speaking. Each strand has three sub-strands, so there are fifteen in all. The framework explains that Use of English provides the linguistic features learners need to engage with the language receptively (Reading and Listening) and productively (Writing and Speaking).","ar":"The framework divides the learning objectives into five strands that \"run through every primary stage\": Reading, Writing, Use of English, Listening and Speaking. Each strand has three sub-strands, so there are fifteen in all. The framework explains that Use of English provides the linguistic features learners need to engage with the language receptively (Reading and Listening) and productively (Writing and Speaking)."}},{"t":"table","head":{"en":["Strand","Sub-strands","Reporting codes"],"ar":["Strand","Sub-strands","Reporting codes"]},"rows":[{"en":["Reading","Reading for global meaning; Reading for detail; Reading for opinion","Rm, Rd, Ro"],"ar":["Reading","Reading for global meaning; Reading for detail; Reading for opinion","Rm, Rd, Ro"]},{"en":["Writing","Communicative achievement; Organisation; Content","Wca, Wor, Wc"],"ar":["Writing","Communicative achievement; Organisation; Content","Wca, Wor, Wc"]},{"en":["Use of English","Vocabulary; Grammatical forms; Sentence structure","Uv, Ug, Us"],"ar":["Use of English","Vocabulary; Grammatical forms; Sentence structure","Uv, Ug, Us"]},{"en":["Listening","Listening for global meaning; Listening for detail; Listening for opinion","Lm, Ld, Lo"],"ar":["Listening","Listening for global meaning; Listening for detail; Listening for opinion","Lm, Ld, Lo"]},{"en":["Speaking","Communication; Express opinion; Organisation","Sc, So, Sor"],"ar":["Speaking","Communication; Express opinion; Organisation","Sc, So, Sor"]}]},{"t":"p","c":{"en":"The Reading and Listening sub-strands have similar names on purpose, \"to help you to identify links between Reading and Listening skills, and to reflect these in your teaching\". Writing and Speaking share two similar sub-strands (both have one called Organisation) and each has one distinct sub-strand.","ar":"The Reading and Listening sub-strands have similar names on purpose, \"to help you to identify links between Reading and Listening skills, and to reflect these in your teaching\". Writing and Speaking share two similar sub-strands (both have one called Organisation) and each has one distinct sub-strand."}},{"t":"h","c":{"en":"How to read a learning-objective code","ar":"How to read a learning-objective code"}},{"t":"p","c":{"en":"Every learning objective has a unique code. The framework says each code includes three parts: the \u003cstrong>stage number\u003c/strong>, a \u003cstrong>reporting code\u003c/strong> (which appears in the feedback reports for tests and reflects the sub-strand titles) and a \u003cstrong>number\u003c/strong> showing the order of the objective in that sub-strand for that stage. So in \u003cstrong>5Rd.01\u003c/strong>: 5 means Stage 5, Rd means Reading for detail, and 01 means the first objective in that sub-strand at that stage.","ar":"Every learning objective has a unique code. The framework says each code includes three parts: the \u003cstrong>stage number\u003c/strong>, a \u003cstrong>reporting code\u003c/strong> (which appears in the feedback reports for tests and reflects the sub-strand titles) and a \u003cstrong>number\u003c/strong> showing the order of the objective in that sub-strand for that stage. So in \u003cstrong>5Rd.01\u003c/strong>: 5 means Stage 5, Rd means Reading for detail, and 01 means the first objective in that sub-strand at that stage."}},{"t":"table","head":{"en":["Code","Stage","Strand and sub-strand","Number"],"ar":["Code","Stage","Strand and sub-strand","Number"]},"rows":[{"en":["1Ld.04","1","Listening, Listening for detail","4th objective"],"ar":["1Ld.04","1","Listening, Listening for detail","4th objective"]},{"en":["3Sor.02","3","Speaking, Organisation","2nd objective"],"ar":["3Sor.02","3","Speaking, Organisation","2nd objective"]},{"en":["2Wor.01","2","Writing, Organisation","1st objective"],"ar":["2Wor.01","2","Writing, Organisation","1st objective"]},{"en":["6Ug.09","6","Use of English, Grammatical forms","9th objective"],"ar":["6Ug.09","6","Use of English, Grammatical forms","9th objective"]},{"en":["4Ro.01","4","Reading, Reading for opinion","1st objective"],"ar":["4Ro.01","4","Reading, Reading for opinion","1st objective"]}]},{"t":"callout","k":"warn","title":{"en":"Two sub-strands are both called Organisation","ar":"Two sub-strands are both called Organisation"},"c":{"en":"Writing Organisation has the reporting code \u003cstrong>Wor\u003c/strong> and Speaking Organisation has \u003cstrong>Sor\u003c/strong>. The letter after the stage number tells you the skill. Also note that the number only shows the order within one stage. 3Rd.01 and 4Rd.01 are different objectives, because \"the learning objectives in each stage are unique to that stage\". The framework prints one Stage 1 code (for writing familiar words) as 1Wca04, without the full stop. The pattern says it is 1Wca.04.","ar":"Writing Organisation has the reporting code \u003cstrong>Wor\u003c/strong> and Speaking Organisation has \u003cstrong>Sor\u003c/strong>. The letter after the stage number tells you the skill. Also note that the number only shows the order within one stage. 3Rd.01 and 4Rd.01 are different objectives, because \"the learning objectives in each stage are unique to that stage\". The framework prints one Stage 1 code (for writing familiar words) as 1Wca04, without the full stop. The pattern says it is 1Wca.04."}},{"t":"h","c":{"en":"How big is each stage?","ar":"How big is each stage?"}},{"t":"p","c":{"en":"Counting the objectives printed for each stage gives a useful picture of workload. These counts are our own count from the framework text, so check them against your copy.","ar":"Counting the objectives printed for each stage gives a useful picture of workload. These counts are our own count from the framework text, so check them against your copy."}},{"t":"table","head":{"en":["Stage","Listening","Speaking","Writing","Reading","Use of English","Total"],"ar":["Stage","Listening","Speaking","Writing","Reading","Use of English","Total"]},"rows":[{"en":["1","6","8","6","6","18","44"],"ar":["1","6","8","6","6","18","44"]},{"en":["2","5","9","9","6","23","52"],"ar":["2","5","9","9","6","23","52"]},{"en":["3","6","10","11","6","24","57"],"ar":["3","6","10","11","6","24","57"]},{"en":["4","6","10","11","7","23","57"],"ar":["4","6","10","11","7","23","57"]},{"en":["5","6","10","11","7","25","59"],"ar":["5","6","10","11","7","25","59"]},{"en":["6","7","10","11","8","27","63"],"ar":["6","7","10","11","8","27","63"]}]},{"t":"p","c":{"en":"Two patterns stand out. Use of English is the largest strand in every stage, which fits its role as the language that serves all four skills. And the whole framework grows gently from 44 objectives at Stage 1 to 63 at Stage 6. The framework adds that it is \"not accompanied by a prescriptive list of topics\". You choose topics and resources that suit your learners.","ar":"Two patterns stand out. Use of English is the largest strand in every stage, which fits its role as the language that serves all four skills. And the whole framework grows gently from 44 objectives at Stage 1 to 63 at Stage 6. The framework adds that it is \"not accompanied by a prescriptive list of topics\". You choose topics and resources that suit your learners."}},{"t":"scenario","title":{"en":"A HOD asks you to decode three codes on a planning sheet","ar":"A HOD asks you to decode three codes on a planning sheet"},"c":{"en":"A planning sheet for Y4 lists \"4Wor.02, 4Us.03, 4Sor.02\". Decode them. 4Wor.02 is Stage 4, Writing, Organisation, second objective: link a short sequence of simple sentences with connectives, with support, to create a paragraph. 4Us.03 is Stage 4, Use of English, Sentence structure, third objective: use connectives such as when, before, after, then. 4Sor.02 is Stage 4, Speaking, Organisation: initiate, maintain and conclude interaction. Seeing these together, you can plan one lesson where pupils talk in turns about a weekend (speaking), then write a short paragraph with connectives (writing), using the connectives taught from the Use of English strand. Three strands in one theme: this is the integrated approach of Module 4.","ar":"A planning sheet for Y4 lists \"4Wor.02, 4Us.03, 4Sor.02\". Decode them. 4Wor.02 is Stage 4, Writing, Organisation, second objective: link a short sequence of simple sentences with connectives, with support, to create a paragraph. 4Us.03 is Stage 4, Use of English, Sentence structure, third objective: use connectives such as when, before, after, then. 4Sor.02 is Stage 4, Speaking, Organisation: initiate, maintain and conclude interaction. Seeing these together, you can plan one lesson where pupils talk in turns about a weekend (speaking), then write a short paragraph with connectives (writing), using the connectives taught from the Use of English strand. Three strands in one theme: this is the integrated approach of Module 4."}}],"checks":[{"id":"m3q1","q":{"en":"What does the code 5Rd.01 tell you?","ar":"What does the code 5Rd.01 tell you?"},"opts":[{"en":"Stage 5, Reading for global meaning, the first objective for the whole primary programme","ar":"Stage 5, Reading for global meaning, the first objective for the whole primary programme"},{"en":"Strand 5, Reading, with detail level 1 for learners aged five years and older","ar":"Strand 5, Reading, with detail level 1 for learners aged five years and older"},{"en":"Stage 5, Reading for detail, the first objective in that sub-strand for that stage","ar":"Stage 5, Reading for detail, the first objective in that sub-strand for that stage"},{"en":"Stage 5, Reading for opinion, the first objective among those taught in Year 5 only","ar":"Stage 5, Reading for opinion, the first objective among those taught in Year 5 only"}],"correct":2,"expl":{"en":"A code has the stage number (5), a reporting code reflecting the sub-strand (Rd is Reading for detail) and a number showing the order in that sub-strand for that stage (01).","ar":"A code has the stage number (5), a reporting code reflecting the sub-strand (Rd is Reading for detail) and a number showing the order in that sub-strand for that stage (01)."}},{"id":"m3q2","q":{"en":"How many strands does the framework have, and which one provides the linguistic features for the four skills?","ar":"How many strands does the framework have, and which one provides the linguistic features for the four skills?"},"opts":[{"en":"Three strands; Reading and Writing provide the grammar that Speaking and Listening need in every stage","ar":"Three strands; Reading and Writing provide the grammar that Speaking and Listening need in every stage"},{"en":"Five strands; Speaking provides the language features for Reading, Writing and Listening","ar":"Five strands; Speaking provides the language features for Reading, Writing and Listening"},{"en":"Four strands; Use of English is taught only as a part of the Writing strand","ar":"Four strands; Use of English is taught only as a part of the Writing strand"},{"en":"Five strands; Use of English provides the language features for receptive and productive skills","ar":"Five strands; Use of English provides the language features for receptive and productive skills"}],"correct":3,"expl":{"en":"The framework has five strands: Reading, Writing, Use of English, Listening and Speaking. Use of English provides the linguistic features for receptive (Reading, Listening) and productive (Writing, Speaking) skills.","ar":"The framework has five strands: Reading, Writing, Use of English, Listening and Speaking. Use of English provides the linguistic features for receptive (Reading, Listening) and productive (Writing, Speaking) skills."}},{"id":"m3q3","q":{"en":"Why do the Reading and Listening sub-strands have similar names?","ar":"Why do the Reading and Listening sub-strands have similar names?"},"opts":[{"en":"To help teachers see links between Reading and Listening skills and reflect them in teaching","ar":"To help teachers see links between Reading and Listening skills and reflect them in teaching"},{"en":"Because both strands are assessed in the same Checkpoint paper at the end of Stage 6 of the primary course","ar":"Because both strands are assessed in the same Checkpoint paper at the end of Stage 6 of the primary course"},{"en":"Because Cambridge expects exactly the same objectives to be taught in the same lesson","ar":"Because Cambridge expects exactly the same objectives to be taught in the same lesson"},{"en":"To show that every Listening objective is simply a copy of a Reading objective","ar":"To show that every Listening objective is simply a copy of a Reading objective"}],"correct":0,"expl":{"en":"The framework says the sub-strand names for Reading and Listening are similar to help you identify links between the skills and reflect these in your teaching.","ar":"The framework says the sub-strand names for Reading and Listening are similar to help you identify links between the skills and reflect these in your teaching."}}]},{"id":"m4","title":{"en":"The Integrated Approach: How the Strands Work Together","ar":"The Integrated Approach: How the Strands Work Together"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Many teachers meet a framework with five strands and picture five separate timetable slots: a reading lesson, a writing lesson, a grammar lesson and so on. The framework asks for something different. In the section on teaching approaches it says: \"It is expected that teachers will adopt an integrated approach to planning and teaching English as a Second Language.\" This module looks at exactly what that means and what it does not.","ar":"Many teachers meet a framework with five strands and picture five separate timetable slots: a reading lesson, a writing lesson, a grammar lesson and so on. The framework asks for something different. In the section on teaching approaches it says: \"It is expected that teachers will adopt an integrated approach to planning and teaching English as a Second Language.\" This module looks at exactly what that means and what it does not."}},{"t":"h","c":{"en":"What the framework expects","ar":"What the framework expects"}},{"t":"p","c":{"en":"The framework says each lesson and unit need to provide opportunities for practice of \u003cstrong>all four skills\u003c/strong> (reading, writing, speaking and listening) as well as a focus on \u003cstrong>one or more learning objectives from the Use of English strand\u003c/strong>. Use of English supplies the language that learners need to take in language (Reading and Listening, called receptive skills) and to produce language (Writing and Speaking, called productive skills). A related sentence in section 3 says you \"should try to plan lessons that include learning objectives from more than one strand\".","ar":"The framework says each lesson and unit need to provide opportunities for practice of \u003cstrong>all four skills\u003c/strong> (reading, writing, speaking and listening) as well as a focus on \u003cstrong>one or more learning objectives from the Use of English strand\u003c/strong>. Use of English supplies the language that learners need to take in language (Reading and Listening, called receptive skills) and to produce language (Writing and Speaking, called productive skills). A related sentence in section 3 says you \"should try to plan lessons that include learning objectives from more than one strand\"."}},{"t":"list","c":{"en":["Plan around a \u003cstrong>theme or topic\u003c/strong> that is relevant to the learners.","Give \u003cstrong>opportunities for all four skills\u003c/strong> in each lesson and unit.","Choose \u003cstrong>one or more Use of English objectives\u003c/strong> as the language focus.","Make tasks \u003cstrong>realistic\u003c/strong>: real communication often needs more than one skill at once."],"ar":["Plan around a \u003cstrong>theme or topic\u003c/strong> that is relevant to the learners.","Give \u003cstrong>opportunities for all four skills\u003c/strong> in each lesson and unit.","Choose \u003cstrong>one or more Use of English objectives\u003c/strong> as the language focus.","Make tasks \u003cstrong>realistic\u003c/strong>: real communication often needs more than one skill at once."]}},{"t":"p","c":{"en":"The framework lists six benefits of this approach. Integrating Use of English and the four skills enhances all-round development of communicative competence; lets teachers build a lesson around a relevant theme; motivates learners through variety; works at the level of realistic communication, where tasks involve more than one skill; exposes learners to authentic language; and challenges learners to interact naturally. The glossary defines \u003cem>authentic language\u003c/em> as written or spoken language used in real situations, which \"may be contrasted with graded teaching material\".","ar":"The framework lists six benefits of this approach. Integrating Use of English and the four skills enhances all-round development of communicative competence; lets teachers build a lesson around a relevant theme; motivates learners through variety; works at the level of realistic communication, where tasks involve more than one skill; exposes learners to authentic language; and challenges learners to interact naturally. The glossary defines \u003cem>authentic language\u003c/em> as written or spoken language used in real situations, which \"may be contrasted with graded teaching material\"."}},{"t":"callout","k":"key","title":{"en":"From the start of Stage 1","ar":"From the start of Stage 1"},"c":{"en":"The framework says the integrated approach \"can, and should, be implemented from the start of Stage 1\". It gives this example: asking and responding to simple questions about personal information and classroom routines uses listening and speaking skills, and also needs an understanding of possessive adjectives and words and phrases that describe people and objects. In other words, even a very early lesson is both a speaking lesson and a language lesson.","ar":"The framework says the integrated approach \"can, and should, be implemented from the start of Stage 1\". It gives this example: asking and responding to simple questions about personal information and classroom routines uses listening and speaking skills, and also needs an understanding of possessive adjectives and words and phrases that describe people and objects. In other words, even a very early lesson is both a speaking lesson and a language lesson."}},{"t":"h","c":{"en":"Revisiting and extending language","ar":"Revisiting and extending language"}},{"t":"p","c":{"en":"The framework says that as learners move through the stages, \"previously studied language should be r
