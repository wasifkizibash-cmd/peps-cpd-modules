plants take their food from the soil\". Which response best matches this module?","ar":"Most learners write that \"plants take their food from the soil\". Which response best matches this module?"},"opts":[{"en":"Mark the answer wrong and move on, because misconceptions fade as learners grow older","ar":"Mark the answer wrong and move on, because misconceptions fade as learners grow older"},{"en":"Ask learners to memorise the word equation without discussing the idea that sits behind the answer","ar":"Ask learners to memorise the word equation without discussing the idea that sits behind the answer"},{"en":"Teach the unit again from the first lesson, using exactly the same activities as before","ar":"Teach the unit again from the first lesson, using exactly the same activities as before"},{"en":"Treat it as a misconception, probe it with a question, then link it to photosynthesis in 9Bp.06","ar":"Treat it as a misconception, probe it with a question, then link it to photosynthesis in 9Bp.06"}],"correct":3,"expl":{"en":"Misconceptions are sensible ideas that do not yet fit the evidence. A probe and a clear link to the objective (9Bp.06) address the idea directly.","ar":"Misconceptions are sensible ideas that do not yet fit the evidence. A probe and a clear link to the objective (9Bp.06) address the idea directly."}},{"id":"m7q3","q":{"en":"A teacher wants to compare a Year 8 GL Progress Test result with a Year 9 Checkpoint result. What is the best approach?","ar":"A teacher wants to compare a Year 8 GL Progress Test result with a Year 9 Checkpoint result. What is the best approach?"},"opts":[{"en":"Use each as a separate external check and look for the same pattern in classroom evidence","ar":"Use each as a separate external check and look for the same pattern in classroom evidence"},{"en":"Treat the two scores as one scale and plot a single line of progress between them","ar":"Treat the two scores as one scale and plot a single line of progress between them"},{"en":"Use only the test with the better result, because it shows the learner's true potential best","ar":"Use only the test with the better result, because it shows the learner's true potential best"},{"en":"Ignore both tests until the end of Year 10, when IGCSE results will be available","ar":"Ignore both tests until the end of Year 10, when IGCSE results will be available"}],"correct":0,"expl":{"en":"The tests have different providers, purposes and dates. They should not be treated as one scale. Look for patterns across several sources.","ar":"The tests have different providers, purposes and dates. They should not be treated as one scale. Look for patterns across several sources."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A PEPS science class may include learners who read English slowly, learners with identified needs, learners who finish early and ask for more, and learners who have just arrived from another school or from Primary. This module looks at how to include every learner, how to challenge those who are ready, and how to manage the two moves around Lower Secondary: from Primary Stage 6 into Stage 7, and from Stage 9 towards IGCSE sciences.","ar":"A PEPS science class may include learners who read English slowly, learners with identified needs, learners who finish early and ask for more, and learners who have just arrived from another school or from Primary. This module looks at how to include every learner, how to challenge those who are ready, and how to manage the two moves around Lower Secondary: from Primary Stage 6 into Stage 7, and from Stage 9 towards IGCSE sciences."}},{"t":"h","c":{"en":"What the framework says, and what it does not say","ar":"What the framework says, and what it does not say"}},{"t":"p","c":{"en":"The Science framework does not have a section on special educational needs, disability, or gifted and talented learners. It says that its sequenced strands let learners \"describe, explain and investigate the world around them at an age appropriate level\", that it is typically for learners aged 11 to 14 but \"it may be appropriate to use it for slightly different ages to suit your context\", and that the learning objectives are \"a reference against which learners' attainment and skills development can be checked\". So the learning objectives are the common reference. How you help each learner reach them is a professional decision, and the rest of this section is \u003cstrong>good practice\u003c/strong> and \u003cstrong>PEPS context\u003c/strong>, not framework text.","ar":"The Science framework does not have a section on special educational needs, disability, or gifted and talented learners. It says that its sequenced strands let learners \"describe, explain and investigate the world around them at an age appropriate level\", that it is typically for learners aged 11 to 14 but \"it may be appropriate to use it for slightly different ages to suit your context\", and that the learning objectives are \"a reference against which learners' attainment and skills development can be checked\". So the learning objectives are the common reference. How you help each learner reach them is a professional decision, and the rest of this section is \u003cstrong>good practice\u003c/strong> and \u003cstrong>PEPS context\u003c/strong>, not framework text."}},{"t":"h","c":{"en":"Including students of determination and learners with SEND","ar":"Including students of determination and learners with SEND"}},{"t":"p","c":{"en":"In the UAE, students with special educational needs and disabilities are called students of determination. Your school will have its own process for identifying needs and writing support or individual education plans. Follow it, and work with the SEN team and the learner's other teachers. Do not guess a learner's needs from their behaviour or their English.","ar":"In the UAE, students with special educational needs and disabilities are called students of determination. Your school will have its own process for identifying needs and writing support or individual education plans. Follow it, and work with the SEN team and the learner's other teachers. Do not guess a learner's needs from their behaviour or their English."}},{"t":"table","head":{"en":["Barrier in science (good practice)","Example","Adjustment that keeps the objective"],"ar":["Barrier in science (good practice)","Example","Adjustment that keeps the objective"]},"rows":[{"en":["Heavy reading load","A long practical method with no pictures","Number the steps, add pictures or a step-by-step video, and read the method aloud"],"ar":["Heavy reading load","A long practical method with no pictures","Number the steps, add pictures or a step-by-step video, and read the method aloud"]},{"en":["Practical dexterity or equipment handling","Using a measuring cylinder or a Bunsen burner (7TWSc.02)","Use larger or adapted equipment; give a role in the group, such as recorder, with a turn at handling"],"ar":["Practical dexterity or equipment handling","Using a measuring cylinder or a Bunsen burner (7TWSc.02)","Use larger or adapted equipment; give a role in the group, such as recorder, with a turn at handling"]},{"en":["Abstract ideas","Particles, electrons, tectonic plates","Use physical models, gestures, short animations and one example at a time"],"ar":["Abstract ideas","Particles, electrons, tectonic plates","Use physical models, gestures, short animations and one example at a time"]},{"en":["Working memory and organisation","A multi-stage investigation with several variables","Give a planning table, a checklist and one stage at a time"],"ar":["Working memory and organisation","A multi-stage investigation with several variables","Give a planning table, a checklist and one stage at a time"]},{"en":["Written recording","Writing a conclusion (8TWSa.03)","Allow oral explanations, photos or a pre-drawn table, with the science marked first"],"ar":["Written recording","Writing a conclusion (8TWSa.03)","Allow oral explanations, photos or a pre-drawn table, with the science marked first"]}]},{"t":"callout","k":"tip","title":{"en":"Same objective, different route","ar":"Same objective, different route"},"c":{"en":"Good inclusive teaching changes the route to the objective, not the objective itself. For example, \"describe the difference between climate and weather\" (8ESc.03) can be shown with a picture sort, a spoken explanation or a written answer. Check with the SEN team when an objective itself needs to be adapted in a learner's plan.","ar":"Good inclusive teaching changes the route to the objective, not the objective itself. For example, \"describe the difference between climate and weather\" (8ESc.03) can be shown with a picture sort, a spoken explanation or a written answer. Check with the SEN team when an objective itself needs to be adapted in a learner's plan."}},{"t":"h","c":{"en":"Challenge and gifted and talented learners","ar":"Challenge and gifted and talented learners"}},{"t":"p","c":{"en":"Challenge means deeper thinking, not simply more work or an earlier jump to the next stage. If your school has a gifted and talented (G&T) register or a nomination process, use it. The framework's skills objectives offer natural challenge, because they go beyond recall.","ar":"Challenge means deeper thinking, not simply more work or an earlier jump to the next stage. If your school has a gifted and talented (G&T) register or a nomination process, use it. The framework's skills objectives offer natural challenge, because they go beyond recall."}},{"t":"table","head":{"en":["Challenge idea (good practice)","Framework link","Example task"],"ar":["Challenge idea (good practice)","Framework link","Example task"]},"rows":[{"en":["Explain why, not only what","9TWSa.01 Evaluate the strength of the evidence","\"How strong is our evidence? What would make it stronger?\""],"ar":["Explain why, not only what","9TWSa.01 Evaluate the strength of the evidence","\"How strong is our evidence? What would make it stronger?\""]},{"en":["Meet surprising results","9TWSp.02 Examples where unexpected results led to improved understanding","Research a case where an unexpected result changed an idea, and present it"],"ar":["Meet surprising results","9TWSp.02 Examples where unexpected results led to improved understanding","Research a case where an unexpected result changed an idea, and present it"]},{"en":["Predict and test between data points","9TWSa.05 Predict results between the data points collected","Predict a value between two measurements, then test it"],"ar":["Predict and test between data points","9TWSa.05 Predict results between the data points collected","Predict a value between two measurements, then test it"]},{"en":["Evaluate issues","7SIC.03 Evaluate issues which involve and/or require scientific understanding","Evaluate a claim about a local environmental issue using two sources"],"ar":["Evaluate issues","7SIC.03 Evaluate issues which involve and/or require scientific understanding","Evaluate a claim about a local environmental issue using two sources"]},{"en":["Design your own investigation","9TWSp.04 Plan investigations to obtain appropriate evidence","Plan an investigation for a question the learner chooses, with a risk assessment"],"ar":["Design your own investigation","9TWSp.04 Plan investigations to obtain appropriate evidence","Plan an investigation for a question the learner chooses, with a risk assessment"]}]},{"t":"h","c":{"en":"Differentiation that works in a class of 25 to 30","ar":"Differentiation that works in a class of 25 to 30"}},{"t":"list","c":{"en":["\u003cstrong>Differentiate by support, not only by task.\u003c/strong> Offer all learners the same main question, with optional word banks, frames, hint cards or a partner.","\u003cstrong>Use open tasks.\u003c/strong> \"Design a test to compare two materials\" lets every learner start, and lets some go further.","\u003cstrong>Ask differentiated questions.\u003c/strong> Prepare three levels of question on the same idea (describe, explain, evaluate) and direct them with care.","\u003cstrong>Avoid fixed labels.\u003c/strong> A learner may be strong in physics and need support in writing. Change groups often."],"ar":["\u003cstrong>Differentiate by support, not only by task.\u003c/strong> Offer all learners the same main question, with optional word banks, frames, hint cards or a partner.","\u003cstrong>Use open tasks.\u003c/strong> \"Design a test to compare two materials\" lets every learner start, and lets some go further.","\u003cstrong>Ask differentiated questions.\u003c/strong> Prepare three levels of question on the same idea (describe, explain, evaluate) and direct them with care.","\u003cstrong>Avoid fixed labels.\u003c/strong> A learner may be strong in physics and need support in writing. Change groups often."]}},{"t":"h","c":{"en":"Transition: Primary Stage 6 into Stage 7","ar":"Transition: Primary Stage 6 into Stage 7"}},{"t":"p","c":{"en":"The framework says that \"each step of the pathway builds on the learners' development from the previous one\", and that the objectives in each stage \"provide clear progression from the previous stage\". It says the progression of the objectives across Stages 7 to 9 is on the School Support Hub. The Cambridge Primary Science framework (0097, version 4.0) shows what many Year 7 learners have already met. These examples come from that framework and from the 0893 framework.","ar":"The framework says that \"each step of the pathway builds on the learners' development from the previous one\", and that the objectives in each stage \"provide clear progression from the previous stage\". It says the progression of the objectives across Stages 7 to 9 is on the School Support Hub. The Cambridge Primary Science framework (0097, version 4.0) shows what many Year 7 learners have already met. These examples come from that framework and from the 0893 framework."}},{"t":"table","head":{"en":["Idea","In Primary Stage 6","In Lower Secondary","Teaching point (good practice)"],"ar":["Idea","In Primary Stage 6","In Lower Secondary","Teaching point (good practice)"]},"rows":[{"en":["Types of enquiry and variables","6TWSp.02 five main types of enquiry; 6TWSp.04 plan fair tests with independent, dependent and control variables","7TWSp.04 plan a range of investigations of different types; not all can be fair tests","Start with the terms learners already have, then widen to other types"],"ar":["Types of enquiry and variables","6TWSp.02 five main types of enquiry; 6TWSp.04 plan fair tests with independent, dependent and control variables","7TWSp.04 plan a range of investigations of different types; not all can be fair tests","Start with the terms learners already have, then widen to other types"]},{"en":["Risk","6TWSp.05 describe risks and how to minimise them","7TWSp.05 hazard symbols; 8TWSp.05 risk assessments","Show the hazard symbols early and build to written risk assessments"],"ar":["Risk","6TWSp.05 describe risks and how to minimise them","7TWSp.05 hazard symbols; 8TWSp.05 risk assessments","Show the hazard symbols early and build to written risk assessments"]},{"en":["Circuits","6Pe.01 series and parallel circuits with symbols","7Pe.03 to 7Pe.05 series circuits; 9Pe.01 parallel circuits","Do not assume learners have forgotten parallel circuits; use a quick retrieval at the start of Stage 9"],"ar":["Circuits","6Pe.01 series and parallel circuits with symbols","7Pe.03 to 7Pe.05 series circuits; 9Pe.01 parallel circuits","Do not assume learners have forgotten parallel circuits; use a quick retrieval at the start of Stage 9"]},{"en":["Respiratory system","6Bs.02 oxygen from the air moves into the blood in the lungs","8Bs.03 and 8Bs.04 structure, alveoli, and diffusion","Start from what learners already know about oxygen and blood"],"ar":["Respiratory system","6Bs.02 oxygen from the air moves into the blood in the lungs","8Bs.03 and 8Bs.04 structure, alveoli, and diffusion","Start from what learners already know about oxygen and blood"]},{"en":["Evaluation","6TWSa.04 suggest how an investigation could be improved","7TWSa.04 evaluate and suggest improvements","Ask for a reason with every improvement"],"ar":["Evaluation","6TWSa.04 suggest how an investigation could be improved","7TWSa.04 evaluate and suggest improvements","Ask for a reason with every improvement"]}]},{"t":"p","c":{"en":"At PEPS, learners move from Year 6 to Year 7. Good practice is to meet the Year 6 science teacher (or read the primary records), look at what learners have already covered, and use a short baseline task in the first weeks, such as a practical with a prediction and a conclusion. Use the evidence to adjust your plan. Do not assume learners know nothing, and do not assume they know everything in the Primary framework.","ar":"At PEPS, learners move from Year 6 to Year 7. Good practice is to meet the Year 6 science teacher (or read the primary records), look at what learners have already covered, and use a short baseline task in the first weeks, such as a practical with a prediction and a conclusion. Use the evidence to adjust your plan. Do not assume learners know nothing, and do not assume they know everything in the Primary framework."}},{"t":"h","c":{"en":"Stage 9 towards IGCSE sciences","ar":"Stage 9 towards IGCSE sciences"}},{"t":"p","c":{"en":"The 0893 framework looks ahead in only a few places. It says the Cambridge approach gives learners \"the knowledge and skills they require to access and excel at science in later phases of education\". Its appendix lists the symbols, units and formulae that learners should use (for example density = mass / volume and resistance = voltage / current). In version 3.0, the formulae for speed and pressure in 8Pf.01 and 8Pf.05 were reformatted \"using the same style as for Cambridge IGCSE and O Level qualifications\". It does not describe IGCSE content. At PEPS, learners continue to IGCSE sciences from Year 10 (PEPS context). To prepare them well, use the framework's formula style consistently, practise units and standard symbols, keep the enquiry skills strong, and, with your HOD, talk with Year 10 science teachers about what they find learners need. Check the IGCSE syllabuses for content.","ar":"The 0893 framework looks ahead in only a few places. It says the Cambridge approach gives learners \"the knowledge and skills they require to access and excel at science in later phases of education\". Its appendix lists the symbols, units and formulae that learners should use (for example density = mass / volume and resistance = voltage / current). In version 3.0, the formulae for speed and pressure in 8Pf.01 and 8Pf.05 were reformatted \"using the same style as for Cambridge IGCSE and O Level qualifications\". It does not describe IGCSE content. At PEPS, learners continue to IGCSE sciences from Year 10 (PEPS context). To prepare them well, use the framework's formula style consistently, practise units and standard symbols, keep the enquiry skills strong, and, with your HOD, talk with Year 10 science teachers about what they find learners need. Check the IGCSE syllabuses for content."}},{"t":"scenario","title":{"en":"Scenario: the new Year 7 learner who \"knows it all\"","ar":"Scenario: the new Year 7 learner who \"knows it all\""},"c":{"en":"A new Year 7 learner joins in September and says: \"I did all this last year.\" The teacher gives a short baseline task on the first lesson: predict, test and conclude, using a simple fair test. The learner plans well but cannot explain why repeating measurements helps. What should the teacher do? Use the evidence. The learner clearly has Primary enquiry skills, but 7TWSc.03 (evaluating whether measurements are repeated sufficiently to be reliable) still needs work. Offer a challenge, for example 7TWSa.04 (evaluate and suggest improvements with reasons), and avoid repeating work that the learner has already done.","ar":"A new Year 7 learner joins in September and says: \"I did all this last year.\" The teacher gives a short baseline task on the first lesson: predict, test and conclude, using a simple fair test. The learner plans well but cannot explain why repeating measurements helps. What should the teacher do? Use the evidence. The learner clearly has Primary enquiry skills, but 7TWSc.03 (evaluating whether measurements are repeated sufficiently to be reliable) still needs work. Offer a challenge, for example 7TWSa.04 (evaluate and suggest improvements with reasons), and avoid repeating work that the learner has already done."}}],"checks":[{"id":"m8q1","q":{"en":"Which statement about inclusion is accurate for the 0893 framework?","ar":"Which statement about inclusion is accurate for the 0893 framework?"},"opts":[{"en":"The framework gives a separate list of reduced objectives for learners with identified needs","ar":"The framework gives a separate list of reduced objectives for learners with identified needs"},{"en":"The framework has no section on SEND or G&T, so the school's own processes guide adaptation","ar":"The framework has no section on SEND or G&T, so the school's own processes guide adaptation"},{"en":"The framework requires gifted learners to move to the next stage as soon as they are ready","ar":"The framework requires gifted learners to move to the next stage as soon as they are ready"},{"en":"The framework states that learners of determination should not take part in practical work","ar":"The framework states that learners of determination should not take part in practical work"}],"correct":1,"expl":{"en":"The framework describes objectives as a common reference and does not give special-needs guidance. Adaptations follow school processes.","ar":"The framework describes objectives as a common reference and does not give special-needs guidance. Adaptations follow school processes."}},{"id":"m8q2","q":{"en":"A learner reads English slowly but can explain particle ideas aloud. Which adjustment best keeps the objective (7Cm.06)?","ar":"A learner reads English slowly but can explain particle ideas aloud. Which adjustment best keeps the objective (7Cm.06)?"},"opts":[{"en":"Give the learner the Stage 6 version of the objective, because reading is such a barrier","ar":"Give the learner the Stage 6 version of the objective, because reading is such a barrier"},{"en":"Ask the learner to copy the textbook paragraph neatly, to practise spelling","ar":"Ask the learner to copy the textbook paragraph neatly, to practise spelling"},{"en":"Let the learner explain with a labelled particle diagram and a word bank before writing","ar":"Let the learner explain with a labelled particle diagram and a word bank before writing"},{"en":"Remove the learner from the practical, because speaking is easier than doing","ar":"Remove the learner from the practical, because speaking is easier than doing"}],"correct":2,"expl":{"en":"The objective is about describing states of matter in terms of particles. A diagram, a word bank and speaking give access without lowering the objective.","ar":"The objective is about describing states of matter in terms of particles. A diagram, a word bank and speaking give access without lowering the objective."}},{"id":"m8q3","q":{"en":"Which fact about the move towards IGCSE sciences is stated in the 0893 framework?","ar":"Which fact about the move towards IGCSE sciences is stated in the 0893 framework?"},"opts":[{"en":"Stage 9 learners must complete a set of IGCSE practical papers before they move to Year 10","ar":"Stage 9 learners must complete a set of IGCSE practical papers before they move to Year 10"},{"en":"The IGCSE syllabus content for Biology, Chemistry and Physics is listed in the framework appendix, topic by topic","ar":"The IGCSE syllabus content for Biology, Chemistry and Physics is listed in the framework appendix, topic by topic"},{"en":"All Stage 9 objectives are identical to the first topics of the IGCSE science syllabuses","ar":"All Stage 9 objectives are identical to the first topics of the IGCSE science syllabuses"},{"en":"In version 3.0, the speed and pressure formulae in 8Pf.01 and 8Pf.05 were formatted in the style used for IGCSE and O Level","ar":"In version 3.0, the speed and pressure formulae in 8Pf.01 and 8Pf.05 were formatted in the style used for IGCSE and O Level"}],"correct":3,"expl":{"en":"The changes section of the framework states the formulae were reformatted in the same style as for Cambridge IGCSE and O Level qualifications.","ar":"The changes section of the framework states the formulae were reformatted in the same style as for Cambridge IGCSE and O Level qualifications."}}]},{"id":"m9","title":{"en":"Quality and Review: Checking Your Teaching","ar":"Quality and Review: Checking Your Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This final module brings the CPD together. It gives you a checklist for a curriculum-aligned science lesson, a list of common mistakes, a short action plan and five take-aways. Use the checklist for self-review, for peer observation, or when a new colleague joins the department. It is a \u003cstrong>good practice\u003c/strong> tool built from the framework and from this CPD, not an official Cambridge checklist, and it does not replace your school's lesson-observation or lesson-plan expectations.","ar":"This final module brings the CPD together. It gives you a checklist for a curriculum-aligned science lesson, a list of common mistakes, a short action plan and five take-aways. Use the checklist for self-review, for peer observation, or when a new colleague joins the department. It is a \u003cstrong>good practice\u003c/strong> tool built from the framework and from this CPD, not an official Cambridge checklist, and it does not replace your school's lesson-observation or lesson-plan expectations."}},{"t":"h","c":{"en":"A checklist for a curriculum-aligned science lesson","ar":"A checklist for a curriculum-aligned science lesson"}},{"t":"table","head":{"en":["Area","Questions to ask","Where it comes from"],"ar":["Area","Questions to ask","Where it comes from"]},"rows":[{"en":["Objective and code","Is the lesson linked to one to three framework objectives, with correct codes, written in learner-friendly words?","Modules 1 and 6"],"ar":["Objective and code","Is the lesson linked to one to three framework objectives, with correct codes, written in learner-friendly words?","Modules 1 and 6"]},{"en":["Progression","Do I know what learners met in the previous stage and what comes next?","Modules 1 and 8"],"ar":["Progression","Do I know what learners met in the previous stage and what comes next?","Modules 1 and 8"]},{"en":["Strands together","Does the lesson connect content, a skill from Thinking and Working Scientifically, and a short context link?","Module 2"],"ar":["Strands together","Does the lesson connect content, a skill from Thinking and Working Scientifically, and a short context link?","Module 2"]},{"en":["Practical opportunity","Do learners observe or do something real, with a purpose they can state?","Modules 2 and 3"],"ar":["Practical opportunity","Do learners observe or do something real, with a purpose they can state?","Modules 2 and 3"]},{"en":["Enquiry quality","Do learners predict, handle variables sensibly, collect enough data, look for anomalies and evaluate?","Module 3"],"ar":["Enquiry quality","Do learners predict, handle variables sensibly, collect enough data, look for anomalies and evaluate?","Module 3"]},{"en":["Safety and welfare","Is there a risk assessment? Are hazard symbols used? If animals or dissection are involved, are the framework points followed?","Module 4"],"ar":["Safety and welfare","Is there a risk assessment? Are hazard symbols used? If animals or dissection are involved, are the framework points followed?","Module 4"]},{"en":["Language","Are key words taught, sentence frames available, and talk planned before writing?","Module 5"],"ar":["Language","Are key words taught, sentence frames available, and talk planned before writing?","Module 5"]},{"en":["Assessment for learning","Will I know, during the lesson, who has understood? Is there a clear next step?","Modules 6 and 7"],"ar":["Assessment for learning","Will I know, during the lesson, who has understood? Is there a clear next step?","Modules 6 and 7"]},{"en":["Inclusion and challenge","Is there support for those who need it, and a deeper task for those who are ready, with the same objective?","Module 8"],"ar":["Inclusion and challenge","Is there support for those who need it, and a deeper task for those who are ready, with the same objective?","Module 8"]}]},{"t":"h","c":{"en":"Common mistakes","ar":"Common mistakes"}},{"t":"list","c":{"en":["\u003cstrong>Treating the scheme of work as compulsory,\u003c/strong> or treating a textbook order as the curriculum. The framework says you do not need to use the schemes of work.","\u003cstrong>Treating the teaching-time guidance as a fixed rule.\u003c/strong> It is for guidance, and your actual hours may vary.","\u003cstrong>Leaving out Thinking and Working Scientifically,\u003c/strong> or teaching it as a separate topic with no content.","\u003cstrong>Forcing every investigation into a fair test,\u003c/strong> although 7TWSp.04 says not all investigations can be fair tests.","\u003cstrong>Skipping the risk assessment\u003c/strong> because an activity comes from a published source. The framework says responsibility remains with the school.","\u003cstrong>Believing dissection is required.\u003c/strong> The framework says it is not.","\u003cstrong>Dropping Science in Context\u003c/strong> because it is not directly assessed.","\u003cstrong>Quoting details of Cambridge tests that the framework does not give,\u003c/strong> such as the number of questions.","\u003cstrong>Using an old code or old wording.\u003c/strong> Check the current version (3.0, February 2026) and its list of changes, for example 9Cm.03 and 9Cm.04, which now include dot-and-cross diagrams.","\u003cstrong>Lowering the objective for ESL learners\u003c/strong> instead of changing the support."],"ar":["\u003cstrong>Treating the scheme of work as compulsory,\u003c/strong> or treating a textbook order as the curriculum. The framework says you do not need to use the schemes of work.","\u003cstrong>Treating the teaching-time guidance as a fixed rule.\u003c/strong> It is for guidance, and your actual hours may vary.","\u003cstrong>Leaving out Thinking and Working Scientifically,\u003c/strong> or teaching it as a separate topic with no content.","\u003cstrong>Forcing every investigation into a fair test,\u003c/strong> although 7TWSp.04 says not all investigations can be fair tests.","\u003cstrong>Skipping the risk assessment\u003c/strong> because an activity comes from a published source. The framework says responsibility remains with the school.","\u003cstrong>Believing dissection is required.\u003c/strong> The framework says it is not.","\u003cstrong>Dropping Science in Context\u003c/strong> because it is not directly assessed.","\u003cstrong>Quoting details of Cambridge tests that the framework does not give,\u003c/strong> such as the number of questions.","\u003cstrong>Using an old code or old wording.\u003c/strong> Check the current version (3.0, February 2026) and its list of changes, for example 9Cm.03 and 9Cm.04, which now include dot-and-cross diagrams.","\u003cstrong>Lowering the objective for ESL learners\u003c/strong> instead of changing the support."]}},{"t":"callout","k":"warn","title":{"en":"Check which version you are using","ar":"Check which version you are using"},"c":{"en":"Version 3.0 (February 2026) updated a number of objectives to make them clearer, for example 9Cc.03 now includes naming the salts from reactions with hydrochloric, sulfuric and nitric acids, and 8ESp.02 now asks learners to discuss the importance of renewable resources. An old scheme or plan may use older wording. When you review a lesson, check the objective wording against the current framework, and read the \"Changes to this curriculum framework\" section.","ar":"Version 3.0 (February 2026) updated a number of objectives to make them clearer, for example 9Cc.03 now includes naming the salts from reactions with hydrochloric, sulfuric and nitric acids, and 8ESp.02 now asks learners to discuss the importance of renewable resources. An old scheme or plan may use older wording. When you review a lesson, check the objective wording against the current framework, and read the \"Changes to this curriculum framework\" section."}},{"t":"h","c":{"en":"An action plan for your own practice","ar":"An action plan for your own practice"}},{"t":"p","c":{"en":"Choose two or three actions, not ten. A useful action is specific, has a date, and has a way to check that it worked.","ar":"Choose two or three actions, not ten. A useful action is specific, has a date, and has a way to check that it worked."}},{"t":"table","head":{"en":["Area","Example action","Evidence that it worked"],"ar":["Area","Example action","Evidence that it worked"]},"rows":[{"en":["Planning","Rewrite one unit plan with objective codes, practical work and one check in the middle","The plan, and one observation of the lesson by your HOD"],"ar":["Planning","Rewrite one unit plan with objective codes, practical work and one check in the middle","The plan, and one observation of the lesson by your HOD"]},{"en":["Enquiry","Add one open investigation that is not a fair test","Learners' plans and evaluations"],"ar":["Enquiry","Add one open investigation that is not a fair test","Learners' plans and evaluations"]},{"en":["Safety","Update the risk assessment file for the next three practicals","Signed risk assessments before each lesson"],"ar":["Safety","Update the risk assessment file for the next three practicals","Signed risk assessments before each lesson"]},{"en":["Language","Introduce sentence frames for conclusions in two classes","Conclusions before and after, for five learners"],"ar":["Language","Introduce sentence frames for conclusions in two classes","Conclusions before and after, for five learners"]},{"en":["Evidence","After the next unit test, map results by objective and plan one intervention","A short note of the finding, the action and the re-check"],"ar":["Evidence","After the next unit test, map results by objective and plan one intervention","A short note of the finding, the action and the re-check"]}]},{"t":"scenario","title":{"en":"Scenario: a peer observation","ar":"Scenario: a peer observation"},"c":{"en":"You observe a Year 8 lesson on electromagnets. The objective on the board is \"8Pe.03 Investigate factors that change the strength of an electromagnet\". Learners follow a method sheet exactly, record one reading each and go home. There is no risk assessment on the desk, no prediction and no evaluation. What feedback would you give? Start with what was good (the objective was clear and learners were active). Then use the checklist: add a prediction (8TWSp.03), ask learners to choose the variable to change (8TWSp.04), repeat readings (8TWSc.03), look for anomalies (8TWSa.02) and evaluate (8TWSa.04). Ask for a risk assessment before the lesson (8TWSp.05). Agree one or two next steps, not ten.","ar":"You observe a Year 8 lesson on electromagnets. The objective on the board is \"8Pe.03 Investigate factors that change the strength of an electromagnet\". Learners follow a method sheet exactly, record one reading each and go home. There is no risk assessment on the desk, no prediction and no evaluation. What feedback would you give? Start with what was good (the objective was clear and learners were active). Then use the checklist: add a prediction (8TWSp.03), ask learners to choose the variable to change (8TWSp.04), repeat readings (8TWSc.03), look for anomalies (8TWSa.02) and evaluate (8TWSa.04). Ask for a risk assessment before the lesson (8TWSp.05). Agree one or two next steps, not ten."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"1. \u003cstrong>The objectives are the standard.\u003c/strong> Schemes of work and textbooks are suggestions; plan from the objectives, in a sensible order, and check the current version of the framework (3.0). 2. \u003cstrong>Teach the three strand types together.\u003c/strong> Practical work and Thinking and Working Scientifically make the content meaningful, and Science in Context shows why it matters. 3. \u003cstrong>Safety and welfare are your responsibility.\u003c/strong> Risk-assess every practical, use hazard symbols, and remember that dissection is not required. 4. \u003cstrong>Language and evidence guide your teaching.\u003c/strong> Build talk before writing, use assessment for learning, and use results by objective to decide what to do next, without claiming more than the evidence shows. 5. \u003cstrong>Every learner works towards the same objectives.\u003c/strong> Change the support and the challenge, not the standard, and prepare transitions into Stage 7 and from Stage 9 towards IGCSE sciences. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"1. \u003cstrong>The objectives are the standard.\u003c/strong> Schemes of work and textbooks are suggestions; plan from the objectives, in a sensible order, and check the current version of the framework (3.0). 2. \u003cstrong>Teach the three strand types together.\u003c/strong> Practical work and Thinking and Working Scientifically make the content meaningful, and Science in Context shows why it matters. 3. \u003cstrong>Safety and welfare are your responsibility.\u003c/strong> Risk-assess every practical, use hazard symbols, and remember that dissection is not required. 4. \u003cstrong>Language and evidence guide your teaching.\u003c/strong> Build talk before writing, use assessment for learning, and use results by objective to decide what to do next, without claiming more than the evidence shows. 5. \u003cstrong>Every learner works towards the same objectives.\u003c/strong> Change the support and the challenge, not the standard, and prepare transitions into Stage 7 and from Stage 9 towards IGCSE sciences. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"In a lesson review, the observer finds a clear objective, a predicting task and a risk assessment, but learners only watch a video. Which checklist area needs attention?","ar":"In a lesson review, the observer finds a clear objective, a predicting task and a risk assessment, but learners only watch a video. Which checklist area needs attention?"},"opts":[{"en":"Practical opportunity: learners should observe or do something real with a purpose","ar":"Practical opportunity: learners should observe or do something real with a purpose"},{"en":"Teaching time: the lesson should be shortened to match the figure of 90 hours a stage","ar":"Teaching time: the lesson should be shortened to match the figure of 90 hours a stage"},{"en":"Reporting codes: the lesson plan should list the codes used on test feedback reports","ar":"Reporting codes: the lesson plan should list the codes used on test feedback reports"},{"en":"Animal welfare: the lesson should include a dissection as a source of real evidence","ar":"Animal welfare: the lesson should include a dissection as a source of real evidence"}],"correct":0,"expl":{"en":"The framework says science is a practical subject and teaching should include opportunities to observe and carry out practical work.","ar":"The framework says science is a practical subject and teaching should include opportunities to observe and carry out practical work."}},{"id":"m9q2","q":{"en":"An old scheme of work for Year 9 says learners should \"use word equations\" but does not mention symbol equations. What should the teacher do?","ar":"An old scheme of work for Year 9 says learners should \"use word equations\" but does not mention symbol equations. What should the teacher do?"},"opts":[{"en":"Keep the old wording, because learning objectives are never updated after their first publication date","ar":"Keep the old wording, because learning objectives are never updated after their first publication date"},{"en":"Check the current framework wording for 9Cc.01, which includes word equations and symbol equations","ar":"Check the current framework wording for 9Cc.01, which includes word equations and symbol equations"},{"en":"Delete the objective, because balancing symbol equations is now required in Stage 9","ar":"Delete the objective, because balancing symbol equations is now required in Stage 9"},{"en":"Move the objective to Stage 8, because version 3.0 changed the stage in which it appears","ar":"Move the objective to Stage 8, because version 3.0 changed the stage in which it appears"}],"correct":1,"expl":{"en":"9Cc.01 reads \"Use word equations and symbol equations to describe reactions (balancing symbol equations is not required)\". Always check the current text.","ar":"9Cc.01 reads \"Use word equations and symbol equations to describe reactions (balancing symbol equations is not required)\". Always check the current text."}},{"id":"m9q3","q":{"en":"Which is the strongest personal action for the term?","ar":"Which is the strongest personal action for the term?"},"opts":[{"en":"Read more about science teaching when time allows during the school year, and share ideas at some point","ar":"Read more about science teaching when time allows during the school year, and share ideas at some point"},{"en":"Plan better lessons by making every lesson longer and more detailed","ar":"Plan better lessons by making every lesson longer and more detailed"},{"en":"Add sentence frames for conclusions in two classes, then compare five learners' conclusions","ar":"Add sentence frames for conclusions in two classes, then compare five learners' conclusions"},{"en":"Wait for the next set of test results and hope the learners improve","ar":"Wait for the next set of test results and hope the learners improve"}],"correct":2,"expl":{"en":"A strong action is specific, has a scope and a way to check the effect. The other options are vague.","ar":"A strong action is specific, has a scope and a way to check the effect. The other options are vague."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A new teacher says: \"The scheme of work gives one activity for each objective, so I will teach only those activities and the lessons will be complete.\" What is the best reply?","ar":"A new teacher says: \"The scheme of work gives one activity for each objective, so I will teach only those activities and the lessons will be complete.\" What is the best reply?"},"opts":[{"en":"The framework says the scheme is compulsory, so the new teacher should add nothing else to it, even if lessons finish early","ar":"The framework says the scheme is compulsory, so the new teacher should add nothing else to it, even if lessons finish early"},{"en":"The framework says each objective needs exactly one activity, so the plan is already complete","ar":"The framework says each objective needs exactly one activity, so the plan is already complete"},{"en":"The framework says activities must come from endorsed textbooks, so the scheme cannot be used","ar":"The framework says activities must come from endorsed textbooks, so the scheme cannot be used"},{"en":"The framework says the activities do not fill all the teaching time, so add others of similar difficulty","ar":"The framework says the activities do not fill all the teaching time, so add others of similar difficulty"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"Your timetable gives Year 7 only 2 hours of science a week. How should you use the framework's teaching-time guidance?","ar":"Your timetable gives Year 7 only 2 hours of science a week. How should you use the framework's teaching-time guidance?"},"opts":[{"en":"Treat the 3 hours as guidance, plan from your real hours, and prioritise carefully while covering the objectives","ar":"Treat the 3 hours as guidance, plan from your real hours, and prioritise carefully while covering the objectives"},{"en":"Treat the 3 hours as a rule, and ask Cambridge to approve the shorter timetable before you start planning any unit","ar":"Treat the 3 hours as a rule, and ask Cambridge to approve the shorter timetable before you start planning any unit"},{"en":"Teach only the Biology and Chemistry objectives, because Physics cannot be taught in less time","ar":"Teach only the Biology and Chemistry objectives, because Physics cannot be taught in less time"},{"en":"Teach all objectives at the same depth by moving the extra lessons into learners' homework time","ar":"Teach all objectives at the same depth by moving the extra lessons into learners' homework time"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"Which sequence best fits a Year 9 unit on electricity?","ar":"Which sequence best fits a Year 9 unit on electricity?"},"opts":[{"en":"Begin with calculating resistance (9Pe.03), then show symbols, and leave parallel circuits for a later unit","ar":"Begin with calculating resistance (9Pe.03), then show symbols, and leave parallel circuits for a later unit"},{"en":"Revisit series circuits and symbols, then teach how current divides in parallel circuits (9Pe.01), then resistance (9Pe.03)","ar":"Revisit series circuits and symbols, then teach how current divides in parallel circuits (9Pe.01), then resistance (9Pe.03)"},{"en":"Teach parallel circuits (9Pe.01) first, because series circuits belong only to Stage 7 and cannot be revisited in Stage 9","ar":"Teach parallel circuits (9Pe.01) first, because series circuits belong only to Stage 7 and cannot be revisited in Stage 9"},{"en":"Teach the three objectives in any order, because the codes show no relationship between the ideas","ar":"Teach the three objectives in any order, because the codes show no relationship between the ideas"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"A teacher wants a Year 7 lesson on 7Cm.06 (states of matter) to use all three strand types. Which plan does this best?","ar":"A teacher wants a Year 7 lesson on 7Cm.06 (states of matter) to use all three strand types. Which plan does this best?"},"opts":[{"en":"Teach 7Cm.06 by reading from the textbook, and add a context question or a model only if the lesson finishes early","ar":"Teach 7Cm.06 by reading from the textbook, and add a context question or a model only if the lesson finishes early"},{"en":"Teach a skills lesson on measuring first, and leave the content of 7Cm.06 for the next term","ar":"Teach a skills lesson on measuring first, and leave the content of 7Cm.06 for the next term"},{"en":"Use a particle model with its limits (7TWSm.01), teach 7Cm.06, and end with a question on how materials are used (7SIC.02)","ar":"Use a particle model with its limits (7TWSm.01), teach 7Cm.06, and end with a question on how materials are used (7SIC.02)"},{"en":"Teach 7Cm.06 and 7Cm.07 together with no practical work, so that all content is covered","ar":"Teach 7Cm.06 and 7Cm.07 together with no practical work, so that all content is covered"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"A Year 8 learner asks why they are studying analogies in science. Which answer matches the framework?","ar":"A Year 8 learner asks why they are studying analogies in science. Which answer matches the framework?"},"opts":[{"en":"Analogies are used because they are the only way to teach science to learners aged 11 to 14","ar":"Analogies are used because they are the only way to teach science to learners aged 11 to 14"},{"en":"Analogies replace the need for practical work, so they save time in a busy year","ar":"Analogies replace the need for practical work, so they save time in a busy year"},{"en":"Analogies are tested only in Science in Context, which Cambridge assesses directly at Stage 8","ar":"Analogies are tested only in Science in Context, which Cambridge assesses directly at Stage 8"},{"en":"Scientists use models and analogies to explain ideas that are not visible or are abstract","ar":"Scientists use models and analogies to explain ideas that are not visible or are abstract"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"Your head of department says \"practical work is optional if the unit is difficult\". Which statement from the framework challenges this?","ar":"Your head of department says \"practical work is optional if the unit is difficult\". Which statement from the framework challenges this?"},"opts":[{"en":"Science is a practical subject and teaching should include opportunities to observe and carry out practical work","ar":"Science is a practical subject and teaching should include opportunities to observe and carry out practical work"},{"en":"Schemes of work must include a practical activity for each learning objective in the stage","ar":"Schemes of work must include a practical activity for each learning objective in the stage"},{"en":"Practical work is assessed by Cambridge through a separate laboratory test at the end of Stage 9","ar":"Practical work is assessed by Cambridge through a separate laboratory test at the end of Stage 9"},{"en":"Every learner must carry out every practical personally, with no demonstrations allowed at any stage of the course","ar":"Every learner must carry out every practical personally, with no demonstrations allowed at any stage of the course"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A Year 7 class sorts leaves with a dichotomous key. A learner asks \"what is the independent variable?\" What is the best response?","ar":"A Year 7 class sorts leaves with a dichotomous key. A learner asks \"what is the independent variable?\" What is the best response?"},"opts":[{"en":"Choose the type of leaf as the independent variable, so that the task becomes a fair test","ar":"Choose the type of leaf as the independent variable, so that the task becomes a fair test"},{"en":"This enquiry classifies, so there is no variable to change; not all investigations can be fair tests (7TWSp.04)","ar":"This enquiry classifies, so there is no variable to change; not all investigations can be fair tests (7TWSp.04)"},{"en":"Explain that every investigation in Stage 7 must have an independent variable to be accepted by the examiners","ar":"Explain that every investigation in Stage 7 must have an independent variable to be accepted by the examiners"},{"en":"Tell the learner that classifying is not enquiry, because it has no measurements or results","ar":"Tell the learner that classifying is not enquiry, because it has no measurements or results"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"Year 9 learners measure the time for a reaction at four temperatures, with each test done once. Which next step best follows 9TWSc.03?","ar":"Year 9 learners measure the time for a reaction at four temperatures, with each test done once. Which next step best follows 9TWSc.03?"},"opts":[{"en":"Accept the single readings, because Stage 9 learners are expected to measure accurately and precisely first time","ar":"Accept the single readings, because Stage 9 learners are expected to measure accurately and precisely first time"},{"en":"Average the four times, because averaging is the only way to make single readings reliable","ar":"Average the four times, because averaging is the only way to make single readings reliable"},{"en":"Decide to repeat the readings and perhaps add more temperatures, so the data are sufficiently reliable","ar":"Decide to repeat the readings and perhaps add more temperatures, so the data are sufficiently reliable"},{"en":"Repeat the experiment at one temperature, because that alone shows the pattern across all four","ar":"Repeat the experiment at one temperature, he safety of every activity in endorsed material, so no school assessment is needed for them to run"},{"en":"Cambridge takes responsibility for safety in any school that uses an endorsed textbook or scheme","ar":"Cambridge takes responsibility for safety in any school that uses an endorsed textbook or scheme"},{"en":"The risk assessment is needed only for activities in Stage 9, where learners handle chemicals","ar":"The risk assessment is needed only for activities in Stage 9, where learners handle chemicals"}],"correct":0},{"id":"e11","mod":4,"q":{"en":"A teacher plans to dissect organs and asks how to handle fresh material. Which plan matches the framework?","ar":"A teacher plans to dissect organs and asks how to handle fresh material. Which plan matches the framework?"},"opts":[{"en":"Ask learners to bring material from home, keep it at room temperature, and use it within a week of the lesson","ar":"Ask learners to bring material from home, keep it at room temperature, and use it within a week of the lesson"},{"en":"Buy from a licensed supplier, keep it at 5 °C or below until just before use, and use it within 2 days","ar":"Buy from a licensed supplier, keep it at 5 °C or below until just before use, and use it within 2 days"},{"en":"Buy from a licensed supplier, defrost it quickly in hot water, and use it within a week","ar":"Buy from a licensed supplier, defrost it quickly in hot water, and use it within a week"},{"en":"Buy from a licensed supplier, keep it at 15 °C, and use it within 2 days to reduce waste","ar":"Buy from a licensed supplier, keep it at 15 °C, and use it within 2 days to reduce waste"}],"correct":1},{"id":"e12","mod":4,"q":{"en":"Before teaching 9Bp.01 and 9Bp.02, which approach best matches the framework on human reproduction?","ar":"Before teaching 9Bp.01 and 9Bp.02, which approach best matches the framework on human reproduction?"},"opts":[{"en":"Teach the factual content and also include a lesson on attitudes and values, as the framework requires of every school","ar":"Teach the factual content and also include a lesson on attitudes and values, as the framework requires of every school"},{"en":"Skip the objectives, because the framework says the topic must be taught by parents only","ar":"Skip the objectives, because the framework says the topic must be taught by parents only"},{"en":"Teach the factual content, follow the school's own policy, and leave attitudes and values to the school's wider curriculum","ar":"Teach the factual content, follow the school's own policy, and leave attitudes and values to the school's wider curriculum"},{"en":"Change the objectives so that the lesson does not mention gametes or chromosomes at all","ar":"Change the objectives so that the lesson does not mention gametes or chromosomes at all"}],"correct":2},{"id":"e13","mod":5,"q":{"en":"A Year 7 learner writes \"Sound moves in a vacuum\" and cannot explain why it is wrong in English. Which action best supports learning of 7Ps.01?","ar":"A Year 7 learner writes \"Sound moves in a vacuum\" and cannot explain why it is wrong in English. Which action best supports learning of 7Ps.01?"},"opts":[{"en":"Give a worksheet of ten definitions to copy, so the learner can memorise the correct English wording","ar":"Give a worksheet of ten definitions to copy, so the learner can memorise the correct English wording"},{"en":"Move the learner to a simpler objective about hearing until their English improves this term","ar":"Move the learner to a simpler objective about hearing until their English improves this term"},{"en":"Mark the sentence wrong and ask the learner to read the textbook page again alone","ar":"Mark the sentence wrong and ask the learner to read the textbook page again alone"},{"en":"Show the bell-jar demonstration, let learners explain in pairs with a frame, then write one sentence","ar":"Show the bell-jar demonstration, let learners explain in pairs with a frame, then write one sentence"}],"correct":3},{"id":"e14","mod":5,"q":{"en":"A test question says \"Evaluate the investigation\". Many learners write only a description of what they did. What is the most useful teaching response?","ar":"A test question says \"Evaluate the investigation\". Many learners write only a description of what they did. What is the most useful teaching response?"},"opts":[{"en":"Teach the command word with a frame such as \"One weakness was ___. This affected the results because ___.\"","ar":"Teach the command word with a frame such as \"One weakness was ___. This affected the results because ___.\""},{"en":"Tell learners to avoid the word \"evaluate\" and always begin an answer with \"describe\"","ar":"Tell learners to avoid the word \"evaluate\" and always begin an answer with \"describe\""},{"en":"Remove evaluation tasks from lessons until learners can describe an experiment well","ar":"Remove evaluation tasks from lessons until learners can describe an experiment well"},{"en":"Give learners a list of definitions of command words to memorise before the next lesson and test them on it","ar":"Give learners a list of definitions of command words to memorise before the next lesson and test them on it"}],"correct":0},{"id":"e15","mod":5,"q":{"en":"Which pair of words does the framework itself ask teachers to separate, and so deserves a clear language lesson?","ar":"Which pair of words does the framework itself ask teachers to separate, and so deserves a clear language lesson?"},"opts":[{"en":"Energy and power, because 7Pf.01 asks learners to compare the two ideas in detail","ar":"Energy and power, because 7Pf.01 asks learners to compare the two ideas in detail"},{"en":"Breathing and respiration, because 8Bs.03 asks learners to understand the difference","ar":"Breathing and respiration, because 8Bs.03 asks learners to understand the difference"},{"en":"Atom and molecule, because 7Cm.01 asks learners to describe the difference in detail","ar":"Atom and molecule, because 7Cm.01 asks learners to describe the difference in detail"},{"en":"Gravity and weight, because 7Pf.03 asks learners to compare the two forces","ar":"Gravity and weight, because 7Pf.03 asks learners to compare the two forces"}],"correct":1},{"id":"e16","mod":5,"q":{"en":"An ESL learner can describe photosynthesis orally but writes very little. What should the teacher check first before deciding the science needs re-teaching?","ar":"An ESL learner can describe photosynthesis orally but writes very little. What should the teacher check first before deciding the science needs re-teaching?"},"opts":[{"en":"Whether the learner can spell the word photosynthesis correctly in three consecutive attempts without help","ar":"Whether the learner can spell the word photosynthesis correctly in three consecutive attempts without help"},{"en":"Whether the learner can copy the word equation from the board without any mistakes","ar":"Whether the learner can copy the word equation from the board without any mistakes"},{"en":"Whether the learner can explain the idea in speech or in a home language, which shows the science is secure","ar":"Whether the learner can explain the idea in speech or in a home language, which shows the science is secure"},{"en":"Whether the learner has finished all homework on time during the previous half term","ar":"Whether the learner has finished all homework on time during the previous half term"}],"correct":2},{"id":"e17","mod":6,"q":{"en":"A colleague says \"the Checkpoint assesses Science in Context at Stage 9\". How should you respond?","ar":"A colleague says \"the Checkpoint assesses Science in Context at Stage 9\". How should you respond?"},"opts":[{"en":"The framework says Science in Context is assessed through a project in the Checkpoint at Stage 9","ar":"The framework says Science in Context is assessed through a project in the Checkpoint at Stage 9"},{"en":"The framework says Science in Context is assessed only in the Progression Tests, and not in the Checkpoint","ar":"The framework says Science in Context is assessed only in the Progression Tests, and not in the Checkpoint"},{"en":"The framework does not mention assessment of Science in Context, so you can accept the claim","ar":"The framework does not mention assessment of Science in Context, so you can accept the claim"},{"en":"The framework says Science in Context will not be directly assessed by Cambridge International Education","ar":"The framework says Science in Context will not be directly assessed by Cambridge International Education"}],"correct":3},{"id":"e18","mod":6,"q":{"en":"A Cambridge feedback report shows a result for the reporting code \"Pe\". Which objectives would you review?","ar":"A Cambridge feedback report shows a result for the reporting code \"Pe\". Which objectives would you review?"},"opts":[{"en":"Those in the Physics sub-strand Electricity and magnetism, such as 7Pe.03, 8Pe.03 and 9Pe.03","ar":"Those in the Physics sub-strand Electricity and magnetism, such as 7Pe.03, 8Pe.03 and 9Pe.03"},{"en":"Those about Physics in Stage 7 only, such as 7Pf.01 and 7Ps.02, because \"P\" stands for Physics","ar":"Those about Physics in Stage 7 only, such as 7Pf.01 and 7Ps.02, because \"P\" stands for Physics"},{"en":"Those in the Earth and Space strand, such as 8ESp.01 and 9ESp.02, because \"e\" stands for Earth","ar":"Those in the Earth and Space strand, such as 8ESp.01 and 9ESp.02, because \"e\" stands for Earth"},{"en":"Those that begin with the stage number 9 only, because \"e\" is short for the end of lower secondary","ar":"Those that begin with the stage number 9 only, because \"e\" is short for the end of lower secondary"}],"correct":0},{"id":"e19","mod":6,"q":{"en":"A teacher is asked for a hinge question on 9Pf.02 (heat and temperature). Which question best fits assessment for learning?","ar":"A teacher is asked for a hinge question on 9Pf.02 (heat and temperature). Which question best fits assessment for learning?"},"opts":[{"en":"A long essay question set for homework and marked by the teacher the following week","ar":"A long essay question set for homework and marked by the teacher the following week"},{"en":"A multiple-choice question whose wrong answers show specific misconceptions, answered on mini whiteboards","ar":"A multiple-choice question whose wrong answers show specific misconceptions, answered on mini whiteboards"},{"en":"A single question asked only of the learner who volunteers first, to keep the lesson moving at a good pace","ar":"A single question asked only of the learner who volunteers first, to keep the lesson moving at a good pace"},{"en":"A test question taken from last year's Checkpoint and given without discussion afterwards","ar":"A test question taken from last year's Checkpoint and given without discussion afterwards"}],"correct":1},{"id":"e20","mod":6,"q":{"en":"A parent asks the teacher to confirm how many questions are in the Year 9 Checkpoint and how it is marked. What is the best answer?","ar":"A parent asks the teacher to confirm how many questions are in the Year 9 Checkpoint and how it is marked. What is the best answer?"},"opts":[{"en":"Give the number from memory of last year's paper, since parents prefer a quick answer to a long wait","ar":"Give the number from memory of last year's paper, since parents prefer a quick answer to a long wait"},{"en":"Say that Checkpoint results are not shared with parents under any circumstances","ar":"Say that Checkpoint results are not shared with parents under any circumstances"},{"en":"The framework does not give those details, so share the official information from the School Support Hub","ar":"The framework does not give those details, so share the official information from the School Support Hub"},{"en":"Say that the Checkpoint is marked by the school, because the framework allows this","ar":"Say that the Checkpoint is marked by the school, because the framework allows this"}],"correct":2},{"id":"e21","mod":7,"q":{"en":"After a unit test, 20 of 24 learners answered the question on 8Bp.05 correctly, but 9 answered the question on 8Bs.03 correctly. What should happen next?","ar":"After a unit test, 20 of 24 learners answered the question on 8Bp.05 correctly, but 9 answered the question on 8Bs.03 correctly. What should happen next?"},"opts":[{"en":"Re-teach the whole unit, because the mean mark is the only reliable evidence for the class as a whole","ar":"Re-teach the whole unit, because the mean mark is the only reliable evidence for the class as a whole"},{"en":"Re-teach 8Bp.05, because the highest-scoring question is the one most likely to be wrong","ar":"Re-teach 8Bp.05, because the highest-scoring question is the one most likely to be wrong"},{"en":"Make no change, because results below 50 percent on one question are normal for a class","ar":"Make no change, because results below 50 percent on one question are normal for a class"},{"en":"Plan a short re-teach of 8Bs.03 with a probe question, and use brief retrieval to keep 8Bp.05 secure","ar":"Plan a short re-teach of 8Bs.03 with a probe question, and use brief retrieval to keep 8Bp.05 secure"}],"correct":3},{"id":"e22","mod":7,"q":{"en":"Learners get 8TWSa.02 questions wrong, but when asked aloud they describe the pattern correctly. What is the most likely cause?","ar":"Learners get 8TWSa.02 questions wrong, but when asked aloud they describe the pattern correctly. What is the most likely cause?"},"opts":[{"en":"A language or written-answer difficulty, so give sentence frames and practise writing the explanation","ar":"A language or written-answer difficulty, so give sentence frames and practise writing the explanation"},{"en":"A lack of content knowledge, so repeat the unit on a slower timetable with exactly the same activities","ar":"A lack of content knowledge, so repeat the unit on a slower timetable with exactly the same activities"},{"en":"A practical skill gap, so remove written tasks and give extra equipment practice only","ar":"A practical skill gap, s }

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>
