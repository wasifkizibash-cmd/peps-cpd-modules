overview that every science teacher must know well: \"Health and safety\", \"Animal welfare and the use of animals in science\" and \"Teaching human reproduction\". This module reports what each section says as exactly as possible, then explains how to apply it. Where a point is not in the framework, it is labelled \u003cstrong>good practice\u003c/strong>. For all safety decisions, follow your school's science safety guidance and speak to your HOD."}},{"t":"h","c":{"en":"Health and safety: what the framework says","ar":"Health and safety: what the framework says"}},{"t":"p","c":{"en":"The framework says that scientific experiments \"are engaging and provide opportunities for first-hand exploration of phenomena\", but that they \"must, at all times, be conducted with the utmost respect for safety\". It then states two specific responsibilities of the \u003cstrong>teacher in charge\u003c/strong>.","ar":"The framework says that scientific experiments \"are engaging and provide opportunities for first-hand exploration of phenomena\", but that they \"must, at all times, be conducted with the utmost respect for safety\". It then states two specific responsibilities of the \u003cstrong>teacher in charge\u003c/strong>."}},{"t":"table","head":{"en":["What the framework says","What it means","How to apply it (good practice)"],"ar":["What the framework says","What it means","How to apply it (good practice)"]},"rows":[{"en":["The teacher in charge must \"adhere and conform to any national, regional and school regulation\" on the safety of scientific experimentation","You must know the rules that apply in your country, region and school","Keep a copy of the school's science safety rules; ask your HOD which rules apply to each practical"],"ar":["The teacher in charge must \"adhere and conform to any national, regional and school regulation\" on the safety of scientific experimentation","You must know the rules that apply in your country, region and school","Keep a copy of the school's science safety rules; ask your HOD which rules apply to each practical"]},{"en":["The teacher in charge must \"make a risk assessment of the hazards involved with any particular class or individual\"","The risk assessment depends on the class and on individual learners, not only on the experiment","Write or check a risk assessment before each new practical; note any learner who needs extra support (for example allergies or a medical need)"],"ar":["The teacher in charge must \"make a risk assessment of the hazards involved with any particular class or individual\"","The risk assessment depends on the class and on individual learners, not only on the experiment","Write or check a risk assessment before each new practical; note any learner who needs extra support (for example allergies or a medical need)"]},{"en":["Cambridge \"takes no responsibility for the management of safety for individual published experiments\" and \"only endorses support material in relation to curriculum content\"","A published activity is not safe just because it is in a Cambridge resource","Check every activity from a scheme of work, textbook or website against your own risk assessment"],"ar":["Cambridge \"takes no responsibility for the management of safety for individual published experiments\" and \"only endorses support material in relation to curriculum content\"","A published activity is not safe just because it is in a Cambridge resource","Check every activity from a scheme of work, textbook or website against your own risk assessment"]},{"en":["\"The responsibility for the safety of all activities and experiments remains with the school.\"","The school, and therefore the teacher, is responsible","If you are not sure an activity is safe, do not run it; ask your HOD first"],"ar":["\"The responsibility for the safety of all activities and experiments remains with the school.\"","The school, and therefore the teacher, is responsible","If you are not sure an activity is safe, do not run it; ask your HOD first"]}]},{"t":"h","c":{"en":"Safety inside the learning objectives","ar":"Safety inside the learning objectives"}},{"t":"p","c":{"en":"Safety is also a skill that learners must develop. The objectives show a clear progression.","ar":"Safety is also a skill that learners must develop. The objectives show a clear progression."}},{"t":"table","head":{"en":["Stage","Planning","Carrying out"],"ar":["Stage","Planning","Carrying out"]},"rows":[{"en":["Stage 7","7TWSp.05 Know the meaning of hazard symbols, and consider them when planning practical work","7TWSc.05 Carry out practical work safely"],"ar":["Stage 7","7TWSp.05 Know the meaning of hazard symbols, and consider them when planning practical work","7TWSc.05 Carry out practical work safely"]},{"en":["Stage 8","8TWSp.05 Make risk assessments for practical work to identify and control risks","8TWSc.05 Carry out practical work safely, supported by risk assessments where appropriate"],"ar":["Stage 8","8TWSp.05 Make risk assessments for practical work to identify and control risks","8TWSc.05 Carry out practical work safely, supported by risk assessments where appropriate"]},{"en":["Stage 9","9TWSp.05 Make risk assessments for practical work to identify and control risks","9TWSc.05 Carry out practical work safely, supported by risk assessments where appropriate"],"ar":["Stage 9","9TWSp.05 Make risk assessments for practical work to identify and control risks","9TWSc.05 Carry out practical work safely, supported by risk assessments where appropriate"]}]},{"t":"p","c":{"en":"The appendix lists the hazard symbols that learners should \"recall and recognise\": acutely toxic, corrosive, flammable, hazardous to the environment, moderate hazard and health hazard. Display them in the laboratory and refer to them by name in every practical lesson. In Stage 7, learners learn what the symbols mean. In Stages 8 and 9, they move from reading hazards to writing their own risk assessments. This means that learners are not only protected by your risk assessment; they are taught to make their own.","ar":"The appendix lists the hazard symbols that learners should \"recall and recognise\": acutely toxic, corrosive, flammable, hazardous to the environment, moderate hazard and health hazard. Display them in the laboratory and refer to them by name in every practical lesson. In Stage 7, learners learn what the symbols mean. In Stages 8 and 9, they move from reading hazards to writing their own risk assessments. This means that learners are not only protected by your risk assessment; they are taught to make their own."}},{"t":"h","c":{"en":"A simple risk assessment routine (good practice)","ar":"A simple risk assessment routine (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Hazard:\u003c/strong> what could cause harm? (Hot water, a corrosive liquid, a sharp tool, glass.)","\u003cstrong>Who and how:\u003c/strong> who could be harmed and how? (Learners at the front, a learner with an allergy.)","\u003cstrong>Control:\u003c/strong> what will reduce the risk? (Goggles, smaller quantities, a teacher demonstration, a clear tidy bench, a rule about standing.)","\u003cstrong>Check:\u003c/strong> is the control in place before the practical starts, and does the class know it?","\u003cstrong>Review:\u003c/strong> after the lesson, note anything that went wrong or almost went wrong, and change the plan."],"ar":["\u003cstrong>Hazard:\u003c/strong> what could cause harm? (Hot water, a corrosive liquid, a sharp tool, glass.)","\u003cstrong>Who and how:\u003c/strong> who could be harmed and how? (Learners at the front, a learner with an allergy.)","\u003cstrong>Control:\u003c/strong> what will reduce the risk? (Goggles, smaller quantities, a teacher demonstration, a clear tidy bench, a rule about standing.)","\u003cstrong>Check:\u003c/strong> is the control in place before the practical starts, and does the class know it?","\u003cstrong>Review:\u003c/strong> after the lesson, note anything that went wrong or almost went wrong, and change the plan."]}},{"t":"p","c":{"en":"In a Year 8 reactivity unit (8Cc.03), the objective lists metals from sodium to silver. The objective asks learners to describe reactivity. It does not require every learner to handle every metal. Some very reactive metals are usually shown by video or by teacher demonstration. This is good practice, and your school safety guidance decides what is allowed.","ar":"In a Year 8 reactivity unit (8Cc.03), the objective lists metals from sodium to silver. The objective asks learners to describe reactivity. It does not require every learner to handle every metal. Some very reactive metals are usually shown by video or by teacher demonstration. This is good practice, and your school safety guidance decides what is allowed."}},{"t":"h","c":{"en":"Animal welfare and the use of animals: what the framework says","ar":"Animal welfare and the use of animals: what the framework says"}},{"t":"p","c":{"en":"The framework says that \"good animal welfare and good science work together\". It gives these expectations.","ar":"The framework says that \"good animal welfare and good science work together\". It gives these expectations."}},{"t":"list","c":{"en":["Learners \"should have opportunities to observe animals in their natural environment\", and this should be done \"responsibly and not in a way that could cause distress or harm to the animals or damage to the environment\".","If living animals are brought into school, the teacher must follow national, regional and school regulations on animal welfare.","In all circumstances the teacher responsible must ensure all animals have: a suitable environment (housed with, or apart from, other animals as the species requires), a suitable diet, the opportunity to exhibit normal behaviour patterns, and protection from pain, injury, suffering and disease.","\"There is no requirement for learners to participate in, or observe, animal dissections for Cambridge Lower Secondary.\" The framework says several alternatives (such as models and diagrams) should be considered during planning, because some learners decide not to continue studying biology if they dislike dissection.","If you decide to include dissection, animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier. \"Neither you nor your learners should kill animals for dissection.\"","Fresh material should be kept at 5 °C or below until just before use. Frozen material should be defrosted slowly (at 5 °C) without direct heat. Fresh or defrosted material should be used within 2 days. Preserved material should only be handled when wearing gloves and in a well-ventilated room."],"ar":["Learners \"should have opportunities to observe animals in their natural environment\", and this should be done \"responsibly and not in a way that could cause distress or harm to the animals or damage to the environment\".","If living animals are brought into school, the teacher must follow national, regional and school regulations on animal welfare.","In all circumstances the teacher responsible must ensure all animals have: a suitable environment (housed with, or apart from, other animals as the species requires), a suitable diet, the opportunity to exhibit normal behaviour patterns, and protection from pain, injury, suffering and disease.","\"There is no requirement for learners to participate in, or observe, animal dissections for Cambridge Lower Secondary.\" The framework says several alternatives (such as models and diagrams) should be considered during planning, because some learners decide not to continue studying biology if they dislike dissection.","If you decide to include dissection, animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier. \"Neither you nor your learners should kill animals for dissection.\"","Fresh material should be kept at 5 °C or below until just before use. Frozen material should be defrosted slowly (at 5 °C) without direct heat. Fresh or defrosted material should be used within 2 days. Preserved material should only be handled when wearing gloves and in a well-ventilated room."]}},{"t":"callout","k":"key","title":{"en":"No dissection is required","ar":"No dissection is required"},"c":{"en":"Many teachers believe that dissection is a Cambridge requirement. For Lower Secondary it is not. 7Bs.03 asks learners to explain how the structures of specialised cells relate to their functions, and 8Bs.03 asks about the human respiratory system. Both can be taught with models, diagrams, microscope slides or video. If your department chooses dissection, follow the supplier, storage and handling points above, and give learners who prefer not to take part a meaningful alternative task.","ar":"Many teachers believe that dissection is a Cambridge requirement. For Lower Secondary it is not. 7Bs.03 asks learners to explain how the structures of specialised cells relate to their functions, and 8Bs.03 asks about the human respiratory system. Both can be taught with models, diagrams, microscope slides or video. If your department chooses dissection, follow the supplier, storage and handling points above, and give learners who prefer not to take part a meaningful alternative task."}},{"t":"scenario","title":{"en":"Scenario: a class pet for Year 7","ar":"Scenario: a class pet for Year 7"},"c":{"en":"A Year 7 teacher wants to bring a small group of live snails into the classroom to teach 7Bp.01 (the seven characteristics of living organisms) and notices that the animals are kept in a small closed box over the weekend. What should the teacher do? The framework says that if living animals are brought into school the teacher must follow national, regional and school regulations and ensure a suitable environment, a suitable diet, the chance for normal behaviour, and protection from pain, injury, suffering and disease. The teacher should check school rules before bringing animals in, plan who looks after them at weekends and holidays, and consider a short observation in the school garden, or photographs and video, as an alternative. Learners can also observe animals in their natural environment, \"responsibly\".","ar":"A Year 7 teacher wants to bring a small group of live snails into the classroom to teach 7Bp.01 (the seven characteristics of living organisms) and notices that the animals are kept in a small closed box over the weekend. What should the teacher do? The framework says that if living animals are brought into school the teacher must follow national, regional and school regulations and ensure a suitable environment, a suitable diet, the chance for normal behaviour, and protection from pain, injury, suffering and disease. The teacher should check school rules before bringing animals in, plan who looks after them at weekends and holidays, and consider a short observation in the school garden, or photographs and video, as an alternative. Learners can also observe animals in their natural environment, \"responsibly\"."}},{"t":"h","c":{"en":"Teaching human reproduction: what the framework says","ar":"Teaching human reproduction: what the framework says"}},{"t":"p","c":{"en":"The framework expects that \"schools will have their own sex education policy set within their national legislative framework and drawn up in consultation with parents\". It recognises that these policies \"will be distinct and varied due to the diversity in tradition and culture\". For this reason, the framework says the focus of the science curriculum is \"factual and covers genetics, inheritance, fusion of gametes and fetal development\". It \"does not address attitudes and values or personal and social skills\", and it expects each school to decide how those parts are addressed in its wider curriculum.","ar":"The framework expects that \"schools will have their own sex education policy set within their national legislative framework and drawn up in consultation with parents\". It recognises that these policies \"will be distinct and varied due to the diversity in tradition and culture\". For this reason, the framework says the focus of the science curriculum is \"factual and covers genetics, inheritance, fusion of gametes and fetal development\". It \"does not address attitudes and values or personal and social skills\", and it expects each school to decide how those parts are addressed in its wider curriculum."}},{"t":"p","c":{"en":"The objectives below fit the four areas the framework names (genetics, inheritance, fusion of gametes and fetal development). The grouping is this CPD's reading, so check the framework for the full wording.","ar":"The objectives below fit the four areas the framework names (genetics, inheritance, fusion of gametes and fetal development). The grouping is this CPD's reading, so check the framework for the full wording."}},{"t":"table","head":{"en":["Objective","Stage","What it asks (paraphrased)"],"ar":["Objective","Stage","What it asks (paraphrased)"]},"rows":[{"en":["9Bs.03","Stage 9","Chromosomes contain genes, made of DNA, which contribute to an organism's characteristics"],"ar":["9Bs.03","Stage 9","Chromosomes contain genes, made of DNA, which contribute to an organism's characteristics"]},{"en":["9Bp.01","Stage 9","Describe the fusion of gametes to produce a fertilised egg with a new combination of DNA"],"ar":["9Bp.01","Stage 9","Describe the fusion of gametes to produce a fertilised egg with a new combination of DNA"]},{"en":["9Bp.02","Stage 9","Describe the inheritance of sex in humans in terms of XX and XY chromosomes"],"ar":["9Bp.02","Stage 9","Describe the inheritance of sex in humans in terms of XX and XY chromosomes"]},{"en":["9Bp.03","Stage 9","Describe variation within a species and relate it to genetic differences"],"ar":["9Bp.03","Stage 9","Describe variation within a species and relate it to genetic differences"]},{"en":["9Bp.08","Stage 9","Discuss how fetal development is affected by the health of the mother, including diet, smoking and drugs"],"ar":["9Bp.08","Stage 9","Discuss how fetal development is affected by the health of the mother, including diet, smoking and drugs"]}]},{"t":"p","c":{"en":"\u003cstrong>How to apply this (good practice).\u003c/strong> Teach what the objective says, in factual language, using diagrams and correct scientific terms. Before the unit, check the school's policy and tell your HOD which lessons contain these topics, so that the school can follow its own process for informing parents. Prepare a calm, brief way to answer questions that go beyond the objective: you may say \"that is a good question; we will not cover that in science, and you may ask your parents or school counsellor\", in line with school policy. In a school where learners study in their second language, also teach the key terms (gamete, fertilisation, chromosome) with images and clear definitions.","ar":"\u003cstrong>How to apply this (good practice).\u003c/strong> Teach what the objective says, in factual language, using diagrams and correct scientific terms. Before the unit, check the school's policy and tell your HOD which lessons contain these topics, so that the school can follow its own process for informing parents. Prepare a calm, brief way to answer questions that go beyond the objective: you may say \"that is a good question; we will not cover that in science, and you may ask your parents or school counsellor\", in line with school policy. In a school where learners study in their second language, also teach the key terms (gamete, fertilisation, chromosome) with images and clear definitions."}},{"t":"scenario","title":{"en":"Scenario: a question that goes further than the objective","ar":"Scenario: a question that goes further than the objective"},"c":{"en":"During the 9Bp.01 lesson a learner asks a question about attitudes and values related to relationships. What is the best response? The framework does not address attitudes and values and expects each school to decide how they are handled in the wider curriculum. The teacher should stay with the factual objective, answer respectfully and briefly, and refer the question to the school's policy and the appropriate staff, rather than giving a personal opinion. The teacher can also tell the HOD afterwards, so that the department can plan a consistent response.","ar":"During the 9Bp.01 lesson a learner asks a question about attitudes and values related to relationships. What is the best response? The framework does not address attitudes and values and expects each school to decide how they are handled in the wider curriculum. The teacher should stay with the factual objective, answer respectfully and briefly, and refer the question to the school's policy and the appropriate staff, rather than giving a personal opinion. The teacher can also tell the HOD afterwards, so that the department can plan a consistent response."}}],"checks":[{"id":"m4q1","q":{"en":"Who does the framework say is responsible for the safety of experiments?","ar":"Who does the framework say is responsible for the safety of experiments?"},"opts":[{"en":"Cambridge International Education, because it endorses the support material that schools use in class","ar":"Cambridge International Education, because it endorses the support material that schools use in class"},{"en":"The teacher in charge, and the school; Cambridge does not manage the safety of published experiments","ar":"The teacher in charge, and the school; Cambridge does not manage the safety of published experiments"},{"en":"The publisher of the endorsed textbook, because the activity appears in the book","ar":"The publisher of the endorsed textbook, because the activity appears in the book"},{"en":"The learners, because Stage 9 objectives ask them to write risk assessments","ar":"The learners, because Stage 9 objectives ask them to write risk assessments"}],"correct":1,"expl":{"en":"The framework says the teacher in charge must conform to regulations and make risk assessments, and that \"The responsibility for the safety of all activities and experiments remains with the school.\"","ar":"The framework says the teacher in charge must conform to regulations and make risk assessments, and that \"The responsibility for the safety of all activities and experiments remains with the school.\""}},{"id":"m4q2","q":{"en":"What does the framework say about animal dissection in Cambridge Lower Secondary?","ar":"What does the framework say about animal dissection in Cambridge Lower Secondary?"},"opts":[{"en":"It is required in Stage 7 and Stage 8 so that learners meet real specimens before they reach Stage 9","ar":"It is required in Stage 7 and Stage 8 so that learners meet real specimens before they reach Stage 9"},{"en":"It is required in Stage 9 only, to support the objectives on the human excretory system","ar":"It is required in Stage 9 only, to support the objectives on the human excretory system"},{"en":"It is not required, and alternatives such as models and diagrams should be considered in planning","ar":"It is not required, and alternatives such as models and diagrams should be considered in planning"},{"en":"It is required only for learners who say they want to study biology after Stage 9","ar":"It is required only for learners who say they want to study biology after Stage 9"}],"correct":2,"expl":{"en":"The framework states there is no requirement for learners to participate in or observe animal dissections and recommends considering alternatives.","ar":"The framework states there is no requirement for learners to participate in or observe animal dissections and recommends considering alternatives."}},{"id":"m4q3","q":{"en":"According to the framework, what is the focus of the curriculum in teaching human reproduction?","ar":"According to the framework, what is the focus of the curriculum in teaching human reproduction?"},"opts":[{"en":"Attitudes, values and personal and social skills, taught in the way set by Cambridge","ar":"Attitudes, values and personal and social skills, taught in the way set by Cambridge"},{"en":"Only the names of body parts, taught with the same wording in every school","ar":"Only the names of body parts, taught with the same wording in every school"},{"en":"Whatever the teacher decides, because the framework gives no focus for the topic","ar":"Whatever the teacher decides, because the framework gives no focus for the topic"},{"en":"Factual content: genetics, inheritance, fusion of gametes and fetal development","ar":"Factual content: genetics, inheritance, fusion of gametes and fetal development"}],"correct":3,"expl":{"en":"The framework says the focus is factual and does not address attitudes and values, which each school decides within its own policy.","ar":"The framework says the focus is factual and does not address attitudes and values, which each school decides within its own policy."}}]},{"id":"m5","title":{"en":"Scientific Language and Talk for ESL Learners","ar":"Scientific Language and Talk for ESL Learners"},"minutes":17,"blocks":[{"t":"p","c":{"en":"At PEPS every student learns English as a second language. A Year 8 learner who understands photosynthesis perfectly in thought may still lose marks, or lose confidence, because the question uses words such as \"evaluate\", \"justify\" or \"in terms of\". This module is about the language of science: how to teach it, how to build talk before writing, and how to support all learners without lowering the science. Most of the module is \u003cstrong>good practice\u003c/strong>. The framework gives the starting points, and they are important.","ar":"At PEPS every student learns English as a second language. A Year 8 learner who understands photosynthesis perfectly in thought may still lose marks, or lose confidence, because the question uses words such as \"evaluate\", \"justify\" or \"in terms of\". This module is about the language of science: how to teach it, how to build talk before writing, and how to support all learners without lowering the science. Most of the module is \u003cstrong>good practice\u003c/strong>. The framework gives the starting points, and they are important."}},{"t":"h","c":{"en":"What the framework says about language","ar":"What the framework says about language"}},{"t":"list","c":{"en":["The Cambridge Lower Secondary aims include \"effective and confident communication skills, including in English\".","The \"confident\" learner is described as able to \"present their findings and defend their conclusions as well as respect those of others\". That is a speaking and listening aim as much as a science aim.","Each scheme of work contains \"a list of subject-specific language that will be useful for your learners\" (check the School Support Hub).","The glossary defines key terms, including analogy, breathing, climate, diagram, experiment, hypothesis, investigation, material, mixture, representation, respiration, substance and weather. Several of these are pairs that learners often confuse."],"ar":["The Cambridge Lower Secondary aims include \"effective and confident communication skills, including in English\".","The \"confident\" learner is described as able to \"present their findings and defend their conclusions as well as respect those of others\". That is a speaking and listening aim as much as a science aim.","Each scheme of work contains \"a list of subject-specific language that will be useful for your learners\" (check the School Support Hub).","The glossary defines key terms, including analogy, breathing, climate, diagram, experiment, hypothesis, investigation, material, mixture, representation, respiration, substance and weather. Several of these are pairs that learners often confuse."]}},{"t":"h","c":{"en":"Three kinds of science words","ar":"Three kinds of science words"}},{"t":"table","head":{"en":["Kind of word","Examples","Teaching idea (good practice)"],"ar":["Kind of word","Examples","Teaching idea (good practice)"]},"rows":[{"en":["Technical words used only in science","alveoli, haemoglobin, stoma (plural stomata), precipitate, dissipate, electromagnet, dispersion","Teach with an image or object, say it aloud together, and use a word-wall card with a labelled picture"],"ar":["Technical words used only in science","alveoli, haemoglobin, stoma (plural stomata), precipitate, dissipate, electromagnet, dispersion","Teach with an image or object, say it aloud together, and use a word-wall card with a labelled picture"]},{"en":["Everyday words with a different science meaning","force, cell, volume, mass, energy, solution, model, material","Ask learners for the everyday meaning first, then show the science meaning side by side"],"ar":["Everyday words with a different science meaning","force, cell, volume, mass, energy, solution, model, material","Ask learners for the everyday meaning first, then show the science meaning side by side"]},{"en":["Academic and command words","describe, explain, identify, evaluate, discuss, compare, predict, suggest, justify","Use a verb chart with a sentence frame for each, as in the next table"],"ar":["Academic and command words","describe, explain, identify, evaluate, discuss, compare, predict, suggest, justify","Use a verb chart with a sentence frame for each, as in the next table"]}]},{"t":"h","c":{"en":"Command words in the objectives","ar":"Command words in the objectives"}},{"t":"p","c":{"en":"Learning objectives begin with verbs: know, understand, describe, explain, identify, discuss, evaluate, use, calculate, investigate. The framework does not define these verbs, so the following frames are good practice, not Cambridge definitions. Check your own test papers and scheme of work for the exact expectations.","ar":"Learning objectives begin with verbs: know, understand, describe, explain, identify, discuss, evaluate, use, calculate, investigate. The framework does not define these verbs, so the following frames are good practice, not Cambridge definitions. Check your own test papers and scheme of work for the exact expectations."}},{"t":"table","head":{"en":["Verb in objectives","Example objective","Sentence frame for learners (good practice)"],"ar":["Verb in objectives","Example objective","Sentence frame for learners (good practice)"]},"rows":[{"en":["Describe","7Cm.06 Describe the three states of matter","In a solid, the particles are ___ and they ___."],"ar":["Describe","7Cm.06 Describe the three states of matter","In a solid, the particles are ___ and they ___."]},{"en":["Explain","7ESs.04 Explain how solar and lunar eclipses happen","An eclipse happens when ___ moves between ___ and ___, because ___."],"ar":["Explain","7ESs.04 Explain how solar and lunar eclipses happen","An eclipse happens when ___ moves between ___ and ___, because ___."]},{"en":["Compare","7Bs.04 Describe the similarities and differences between plant and animal cells","Both ___ and ___ have ___, but only ___ has ___."],"ar":["Compare","7Bs.04 Describe the similarities and differences between plant and animal cells","Both ___ and ___ have ___, but only ___ has ___."]},{"en":["Evaluate","9TWSa.04 Evaluate experiments and suggest improvements","One weakness was ___. This affected the results because ___. Next time we would ___."],"ar":["Evaluate","9TWSa.04 Evaluate experiments and suggest improvements","One weakness was ___. This affected the results because ___. Next time we would ___."]},{"en":["Discuss","8ESp.02 Discuss the importance of using renewable resources","One reason for is ___. However, ___. On balance, I think ___ because ___."],"ar":["Discuss","8ESp.02 Discuss the importance of using renewable resources","One reason for is ___. However, ___. On balance, I think ___ because ___."]},{"en":["Predict","7TWSp.03 Make predictions of likely outcomes","I predict that ___ will ___ because ___."],"ar":["Predict","7TWSp.03 Make predictions of likely outcomes","I predict that ___ will ___ because ___."]}]},{"t":"h","c":{"en":"Word pairs the framework asks you to separate","ar":"Word pairs the framework asks you to separate"}},{"t":"p","c":{"en":"The framework itself separates several pairs of words. These are worth a short, clear lesson, because mixing them up causes misconceptions as well as language errors.","ar":"The framework itself separates several pairs of words. These are worth a short, clear lesson, because mixing them up causes misconceptions as well as language errors."}},{"t":"table","head":{"en":["Pair","Where the framework separates them","Teaching idea (good practice)"],"ar":["Pair","Where the framework separates them","Teaching idea (good practice)"]},"rows":[{"en":["Breathing and respiration","8Bs.03 asks learners to understand the difference; the glossary defines both","Say \"breathing moves air; respiration releases energy from food\" and use a two-column poster"],"ar":["Breathing and respiration","8Bs.03 asks learners to understand the difference; the glossary defines both","Say \"breathing moves air; respiration releases energy from food\" and use a two-column poster"]},{"en":["Weather and climate","8ESc.03; the glossary says weather is conditions \"at a particular time\" and climate is over \"a long period of time\"","Use a \"today / usually\" sorting activity with real UAE examples"],"ar":["Weather and climate","8ESc.03; the glossary says weather is conditions \"at a particular time\" and climate is over \"a long period of time\"","Use a \"today / usually\" sorting activity with real UAE examples"]},{"en":["Substance and material","Glossary: oxygen is a substance, air is a mixture; steel is a material","Sort cards into substance, mixture, material and give a reason"],"ar":["Substance and material","Glossary: oxygen is a substance, air is a mixture; steel is a material","Sort cards into substance, mixture, material and give a reason"]},{"en":["Experiment and investigation","Glossary","Use the sentence \"An investigation starts with a question; it may include experiments.\""],"ar":["Experiment and investigation","Glossary","Use the sentence \"An investigation starts with a question; it may include experiments.\""]}]},{"t":"h","c":{"en":"Build talk before writing (good practice)","ar":"Build talk before writing (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Show the phenomenon.\u003c/strong> A demonstration, object or short video gives all learners something to talk about, whatever their English.","\u003cstrong>Say it in pairs.\u003c/strong> Give a frame and two minutes: \"Tell your partner what you predict and why.\" Listen to two or three pairs. Allow learners to use their home language to think, then restate in English.","\u003cstrong>Write one sentence.\u003c/strong> Use a frame and ask for one sentence with a key word, a reason word (because, so, therefore) and a science term.","\u003cstrong>Build to a paragraph.\u003c/strong> Link sentences with sequence words (first, then, finally) or contrast words (however, whereas).","\u003cstrong>Give feedback on science first,\u003c/strong> language second. Mark whether the idea is correct, then give one language target."],"ar":["\u003cstrong>Show the phenomenon.\u003c/strong> A demonstration, object or short video gives all learners something to talk about, whatever their English.","\u003cstrong>Say it in pairs.\u003c/strong> Give a frame and two minutes: \"Tell your partner what you predict and why.\" Listen to two or three pairs. Allow learners to use their home language to think, then restate in English.","\u003cstrong>Write one sentence.\u003c/strong> Use a frame and ask for one sentence with a key word, a reason word (because, so, therefore) and a science term.","\u003cstrong>Build to a paragraph.\u003c/strong> Link sentences with sequence words (first, then, finally) or contrast words (however, whereas).","\u003cstrong>Give feedback on science first,\u003c/strong> language second. Mark whether the idea is correct, then give one language target."]}},{"t":"p","c":{"en":"A short example: Stage 9, 9Bs.01 (the pathway of water through a plant). Learners label a diagram of root hair, xylem and stomata. In pairs they say the journey using \"First... then... finally...\". Then they write: \"Water enters the plant through the root hair cells. It travels up through the xylem. Finally, it leaves the leaf as water vapour through the stomata, which is called transpiration.\" The same task can be adapted. A learner who needs more support may receive the sentence with gaps. A learner who needs challenge may add why this matters for the plant.","ar":"A short example: Stage 9, 9Bs.01 (the pathway of water through a plant). Learners label a diagram of root hair, xylem and stomata. In pairs they say the journey using \"First... then... finally...\". Then they write: \"Water enters the plant through the root hair cells. It travels up through the xylem. Finally, it leaves the leaf as water vapour through the stomata, which is called transpiration.\" The same task can be adapted. A learner who needs more support may receive the sentence with gaps. A learner who needs challenge may add why this matters for the plant."}},{"t":"callout","k":"tip","title":{"en":"Support the language, do not lower the science","ar":"Support the language, do not lower the science"},"c":{"en":"A frame is a ladder, not a floor. Keep the objective the same for all learners (for example, \"explain how water moves through a plant\") and change the amount of support: pictures, word banks, sentence starters, a partner. Over time, remove the supports one at a time. If a learner can say the idea in Arabic or another home language but not in English, the science is secure and the language needs more practice. If a learner cannot explain it in any language, the science needs re-teaching.","ar":"A frame is a ladder, not a floor. Keep the objective the same for all learners (for example, \"explain how water moves through a plant\") and change the amount of support: pictures, word banks, sentence starters, a partner. Over time, remove the supports one at a time. If a learner can say the idea in Arabic or another home language but not in English, the science is secure and the language needs more practice. If a learner cannot explain it in any language, the science needs re-teaching."}},{"t":"scenario","title":{"en":"Scenario: strong practical skills, weak writing","ar":"Scenario: strong practical skills, weak writing"},"c":{"en":"A Year 8 learner always carries out the practical correctly and answers questions orally, but writes only short, unclear conclusions. A useful plan is to give a conclusion frame (\"The results show that ___. This is because ___. A limit of our results is ___.\"), let the learner record a spoken answer to a partner first, and mark the conclusion for the science idea before the language. Use 8TWSa.03 as the guide: a conclusion interprets results and explains their limitations. Track progress by comparing the learner's writing over three or four practical reports, not by one piece.","ar":"A Year 8 learner always carries out the practical correctly and answers questions orally, but writes only short, unclear conclusions. A useful plan is to give a conclusion frame (\"The results show that ___. This is because ___. A limit of our results is ___.\"), let the learner record a spoken answer to a partner first, and mark the conclusion for the science idea before the language. Use 8TWSa.03 as the guide: a conclusion interprets results and explains their limitations. Track progress by comparing the learner's writing over three or four practical reports, not by one piece."}}],"checks":[{"id":"m5q1","q":{"en":"Which aim of the Cambridge Lower Secondary programme is directly linked to language?","ar":"Which aim of the Cambridge Lower Secondary programme is directly linked to language?"},"opts":[{"en":"Effective and confident communication skills, including in English","ar":"Effective and confident communication skills, including in English"},{"en":"The requirement that all learners complete written tests in English at the end of Stage 9","ar":"The requirement that all learners complete written tests in English at the end of Stage 9"},{"en":"The requirement that every science lesson uses sentence frames for all learners","ar":"The requirement that every science lesson uses sentence frames for all learners"},{"en":"The requirement that learners translate each scientific term into Arabic or another language","ar":"The requirement that learners translate each scientific term into Arabic or another language"}],"correct":0,"expl":{"en":"The first aims list in the framework includes effective and confident communication skills, including in English. The other statements are not in the framework.","ar":"The first aims list in the framework includes effective and confident communication skills, including in English. The other statements are not in the framework."}},{"id":"m5q2","q":{"en":"A learner writes \"breathing is how plants and animals release energy from food\". Which response best follows the framework?","ar":"A learner writes \"breathing is how plants and animals release energy from food\". Which response best follows the framework?"},"opts":[{"en":"Accept the sentence, because breathing and respiration are two names for the same thing","ar":"Accept the sentence, because breathing and respiration are two names for the same thing"},{"en":"Explain that breathing moves air in and out of the lungs and respiration releases energy","ar":"Explain that breathing moves air in and out of the lungs and respiration releases energy"},{"en":"Tell the learner to avoid the word breathing in science and use only the word respiration","ar":"Tell the learner to avoid the word breathing in science and use only the word respiration"},{"en":"Ask the learner to copy the glossary definition of both terms without any further discussion","ar":"Ask the learner to copy the glossary definition of both terms without any further discussion"}],"correct":1,"expl":{"en":"8Bs.03 asks learners to understand the difference between breathing and respiration, and the glossary defines breathing as air moving into and out of the lungs.","ar":"8Bs.03 asks learners to understand the difference between breathing and respiration, and the glossary defines breathing as air moving into and out of the lungs."}},{"id":"m5q3","q":{"en":"Which classroom routine best supports an ESL learner who knows the science but struggles to write an explanation?","ar":"Which classroom routine best supports an ESL learner who knows the science but struggles to write an explanation?"},"opts":[{"en":"Give the learner a simpler objective so that no extended writing is needed this term","ar":"Give the learner a simpler objective so that no extended writing is needed this term"},{"en":"Ask the learner to write the full explanation at once, to find out exactly which words are missing","ar":"Ask the learner to write the full explanation at once, to find out exactly which words are missing"},{"en":"Say the explanation with a partner using a frame, then write one sentence, then a short paragraph","ar":"Say the explanation with a partner using a frame, then write one sentence, then a short paragraph"},{"en":"Mark only spelling and grammar so that the learner can see every language error","ar":"Mark only spelling and grammar so that the learner can see every language error"}],"correct":2,"expl":{"en":"Talk before writing lets the learner rehearse the language while the science objective stays the same. The support is then reduced step by step.","ar":"Talk before writing lets the learner rehearse the language while the science objective stays the same. The support is then reduced step by step."}}]},{"id":"m6","title":{"en":"Assessment: AfL, Progression Tests and Checkpoint","ar":"Assessment: AfL, Progression Tests and Checkpoint"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment answers a simple question: what do my learners know, understand and do, and what should I do next? This module separates three things that are often mixed up: what the framework says about Cambridge assessments, what is good practice in everyday assessment for learning (AfL), and how the school's own external checks at PEPS (the Year 9 Checkpoint and the Year 8 GL Progress Test) fit into the picture.","ar":"Assessment answers a simple question: what do my learners know, understand and do, and what should I do next? This module separates three things that are often mixed up: what the framework says about Cambridge assessments, what is good practice in everyday assessment for learning (AfL), and how the school's own external checks at PEPS (the Year 9 Checkpoint and the Year 8 GL Progress Test) fit into the picture."}},{"t":"h","c":{"en":"What the framework says about assessment","ar":"What the framework says about assessment"}},{"t":"list","c":{"en":["\"We provide assessments designed to complement this curriculum framework for Stages 7 to 9.\"","The framework's list of resources names three Cambridge Lower Secondary assessments: the \u003cstrong>Cambridge Lower Secondary Progression Tests\u003c/strong>, the \u003cstrong>Cambridge Lower Secondary Checkpoint\u003c/strong> and \u003cstrong>Cambridge Insight assessments\u003c/strong>.","The front page says: \"Cambridge Lower Secondary Progression Tests will be available from 2022\" and \"Cambridge Lower Secondary Checkpoint tests will be available from 2023.\" Check the Hub for the current position.","\"The Science in Context strand will not be directly assessed by Cambridge International Education.\"","Each learning objective code has \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\", for example Bs in 9Bs.01.","More information on assessing Cambridge Lower Secondary Science is on the School Support Hub."],"ar":["\"We provide assessments designed to complement this curriculum framework for Stages 7 to 9.\"","The framework's list of resources names three Cambridge Lower Secondary assessments: the \u003cstrong>Cambridge Lower Secondary Progression Tests\u003c/strong>, the \u003cstrong>Cambridge Lower Secondary Checkpoint\u003c/strong> and \u003cstrong>Cambridge Insight assessments\u003c/strong>.","The front page says: \"Cambridge Lower Secondary Progression Tests will be available from 2022\" and \"Cambridge Lower Secondary Checkpoint tests will be available from 2023.\" Check the Hub for the current position.","\"The Science in Context strand will not be directly assessed by Cambridge International Education.\"","Each learning objective code has \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\", for example Bs in 9Bs.01.","More information on assessing Cambridge Lower Secondary Science is on the School Support Hub."]}},{"t":"callout","k":"warn","title":{"en":"What the framework does not say","ar":"What the framework does not say"},"c":{"en":"The framework names the assessments but does not describe their format, length, marking, scoring scale or grading, and it does not say which stages sit which test or when. Do not tell colleagues or parents such details unless you have read them on the School Support Hub or in the official test guidance. Stay within what you can show.","ar":"The framework names the assessments but does not describe their format, length, marking, scoring scale or grading, and it does not say which stages sit which test or when. Do not tell colleagues or parents such details unless you have read them on the School Support Hub or in the official test guidance. Stay within what you can show."}},{"t":"h","c":{"en":"Reporting codes: a bridge between tests and teaching","ar":"Reporting codes: a bridge between tests and teaching"}},{"t":"p","c":{"en":"Part A of this CPD explains the structure of the codes. Here is why they matter for assessment. The reporting code reflects the sub-strand titles. When a feedback report from a Cambridge test shows results by reporting code, you can link each result to the objectives in the framework with that code.","ar":"Part A of this CPD explains the structure of the codes. Here is why they matter for assessment. The reporting code reflects the sub-strand titles. When a feedback report from a Cambridge test shows results by reporting code, you can link each result to the objectives in the framework with that code."}},{"t":"table","head":{"en":["Reporting code","Sub-strand (from the framework)","Objectives you would check"],"ar":["Reporting code","Sub-strand (from the framework)","Objectives you would check"]},"rows":[{"en":["TWSm","Models and representations","7TWSm.01, 8TWSm.01, 9TWSm.01 and the others with this code"],"ar":["TWSm","Models and representations","7TWSm.01, 8TWSm.01, 9TWSm.01 and the others with this code"]},{"en":["TWSp / TWSc / TWSa","Purpose and planning; carrying out; analysis, evaluation and conclusions","All objectives in that group, across the stages"],"ar":["TWSp / TWSc / TWSa","Purpose and planning; carrying out; analysis, evaluation and conclusions","All objectives in that group, across the stages"]},{"en":["Bs / Bp / Be","Biology: structure and function; life processes; ecosystems","For example 8Bs.02 and 9Bs.01 for Bs"],"ar":["Bs / Bp / Be","Biology: structure and function; life processes; ecosystems","For example 8Bs.02 and 9Bs.01 for Bs"]},{"en":["Cm / Cp / Cc","Chemistry: materials and their structure; properties of materials; changes to materials","For example 9Cm.03 for Cm and 9Cc.04 for Cc"],"ar":["Cm / Cp / Cc","Chemistry: materials and their structure; properties of materials; changes to materials","For example 9Cm.03 for Cm and 9Cc.04 for Cc"]},{"en":["Pf / Ps / Pe","Physics: forces and energy; light and sound; electricity and magnetism","For example 8Pf.01 for Pf and 9Pe.03 for Pe"],"ar":["Pf / Ps / Pe","Physics: forces and energy; light and sound; electricity and magnetism","For example 8Pf.01 for Pf and 9Pe.03 for Pe"]},{"en":["ESp / ESc / ESs","Earth and Space: planet Earth; cycles on Earth; Earth in space","For example 9ESc.01 for ESc"],"ar":["ESp / ESc / ESs","Earth and Space: planet Earth; cycles on Earth; Earth in space","For example 9ESc.01 for ESc"]}]},{"t":"p","c":{"en":"Always check how your own report presents the codes; this table only shows what the framework's code system reflects.","ar":"Always check how your own report presents the codes; this table only shows what the framework's code system reflects."}},{"t":"h","c":{"en":"Assessment for learning in the classroom (good practice)","ar":"Assessment for learning in the classroom (good practice)"}},{"t":"p","c":{"en":"The framework does not describe classroom assessment methods, so what follows is good practice. The aim is to find out, during the lesson, what each learner understands, so that you can change what you do next.","ar":"The framework does not describe classroom assessment methods, so what follows is good practice. The aim is to find out, during the lesson, what each learner understands, so that you can change what you do next."}},{"t":"table","head":{"en":["Method","What it looks like","Example objective"],"ar":["Method","What it looks like","Example objective"]},"rows":[{"en":["Clear learning objective","Say or show the objective in learner-friendly words and what success looks like","\"I can use a word equation to describe a reaction\" (8Cc.01)"],"ar":["Clear learning objective","Say or show the objective in learner-friendly words and what success looks like","\"I can use a word equation to describe a reaction\" (8Cc.01)"]},{"en":["Hinge question","A multiple-choice question where each wrong answer shows a specific misconception; learners answer on mini whiteboards or by showing fingers","\"What is in the bubbles when water boils?\" (links to 7Cm.06)"],"ar":["Hinge question","A multiple-choice question where each wrong answer shows a specific misconception; learners answer on mini whiteboards or by showing fingers","\"What is in the bubbles when water boils?\" (links to 7Cm.06)"]},{"en":["Exit ticket","One question in the last three minutes; sort the answers into correct, nearly, not yet","\"Why does sound not travel in a vacuum?\" (7Ps.01)"],"ar":["Exit ticket","One question in the last three minutes; sort the answers into correct, nearly, not yet","\"Why does sound not travel in a vacuum?\" (7Ps.01)"]},{"en":["Observation of practical work","A checklist of skills while learners work: for example measuring accurately, recording in a table, working safely","7TWSc.04, 7TWSc.05, 7TWSc.07"],"ar":["Observation of practical work","A checklist of skills while learners work: for example measuring accurately, recording in a table, working safely","7TWSc.04, 7TWSc.05, 7TWSc.07"]},{"en":["Feedback","One clear comment on the science and one next step; time for learners to act on it","\"Your conclusion needs a limit; add one.\" (8TWSa.03)"],"ar":["Feedback","One clear comment on the science and one next step; time for learners to act on it","\"Your conclusion needs a limit; add one.\" (8TWSa.03)"]}]},{"t":"h","c":{"en":"External checks at PEPS: how they fit","ar":"External checks at PEPS: how they fit"}},{"t":"p","c":{"en":"At PEPS, Year 9 learners sit the Cambridge Lower Secondary Checkpoint in science, and Year 8 learners take the GL Progress Test (GL Progress Tests run in Years 4, 6, 8 and 10). These facts are PEPS context. They are not in the framework. The framework only names the Cambridge tests. Use each result for what it can tell you.","ar":"At PEPS, Year 9 learners sit the Cambridge Lower Secondary Checkpoint in science, and Year 8 learners take the GL Progress Test (GL Progress Tests run in Years 4, 6, 8 and 10). These facts are PEPS context. They are not in the framework. The framework only names the Cambridge tests. Use each result for what it can tell you."}},{"t":"table","head":{"en":["Check","Who provides it","Where it appears","How to use it (good practice)"],"ar":["Check","Who provides it","Where it appears","How to use it (good practice)"]},"rows":[{"en":["Everyday AfL","The teacher","Every lesson","Change today's teaching; instant, specific and low stakes"],"ar":["Everyday AfL","The teacher","Every lesson","Change today's teaching; instant, specific and low stakes"]},{"en":["Cambridge Lower Secondary Progression Tests","Cambridge (named in the framework)","Check the Hub for stages and use","If your school uses them, compare feedback by reporting code"],"ar":["Cambridge Lower Secondary Progression Tests","Cambridge (named in the framework)","Check the Hub for stages and use","If your school uses them, compare feedback by reporting code"]},{"en":["Cambridge Lower Secondary Checkpoint","Cambridge (named in the framework); sat in Year 9 at PEPS","Year 9 at PEPS","Use the reporting-code feedback to see strengths and gaps by sub-strand"],"ar":["Cambridge Lower Secondary Checkpoint","Cambridge (named in the framework); sat in Year 9 at PEPS","Year 9 at PEPS","Use the reporting-code feedback to see strengths and gaps by sub-strand"]},{"en":["GL Progress Test","GL Assessment, not Cambridge; sat in Year 8 at PEPS","Year 8","Use as an external check; do not treat it as a test of the 0893 framework unless your school has mapped it"],"ar":["GL Progress Test","GL Assessment, not Cambridge; sat in Year 8 at PEPS","Year 8","Use as an external check; do not treat it as a test of the 0893 framework unless your school has mapped it"]}]},{"t":"scenario","title":{"en":"Scenario: a parent asks what the Year 9 Checkpoint covers","ar":"Scenario: a parent asks what the Year 9 Checkpoint covers"},"c":{"en":"A parent asks: \"Does the Checkpoint test the Science in Context strand and how many questions are there?\" What is the accurate answer? The framework says the Science in Context strand \"will not be directly assessed by Cambridge International Education\". It does not give the number of questions or the format, so you should not guess. Say what is known, and offer to share the official information from the School Support Hub, through the exams officer or the Cambridge coordinator. Keep the answer simple and honest.","ar":"A parent asks: \"Does the Checkpoint test the Science in Context strand and how many questions are there?\" What is the accurate answer? The framework says the Science in Context strand \"will not be directly assessed by Cambridge International Education\". It does not give the number of questions or the format, so you should not guess. Say what is known, and offer to share the official information from the School Support Hub, through the exams officer or the Cambridge coordinator. Keep the answer simple and honest."}}],"checks":[{"id":"m6q1","q":{"en":"Which Cambridge assessments does the framework name for Lower Secondary Science?","ar":"Which Cambridge assessments does the framework name for Lower Secondary Science?"},"opts":[{"en":"Cambridge Progression Tests and Checkpoint only, with no other Cambridge assessments named","ar":"Cambridge Progression Tests and Checkpoint only, with no other Cambridge assessments named"},{"en":"GL Progress Tests, Cambridge Checkpoint and the IGCSE Science examinations taken at the end of Year 9 by every learner","ar":"GL Progress Tests, Cambridge Checkpoint and the IGCSE Science examinations taken at the end of Year 9 by every learner"},{"en":"Cambridge Baseline Tests, Progression Tests and a final Stage 9 laboratory examination","ar":"Cambridge Baseline Tests, Progression Tests and a final Stage 9 laboratory examination"},{"en":"Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments","ar":"Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments"}],"correct":3,"expl":{"en":"The framework's resources box lists Progression Tests, Checkpoint and Cambridge Insight assessments as Cambridge Lower Secondary assessments. GL Progress Tests are not Cambridge assessments.","ar":"The framework's resources box lists Progression Tests, Checkpoint and Cambridge Insight assessments as Cambridge Lower Secondary assessments. GL Progress Tests are not Cambridge assessments."}},{"id":"m6q2","q":{"en":"What does the \"reporting code\" in a learning objective code, such as Bs in 9Bs.01, do?","ar":"What does the \"reporting code\" in a learning objective code, such as Bs in 9Bs.01, do?"},"opts":[{"en":"It appears in feedback reports for tests and reflects the sub-strand titles","ar":"It appears in feedback reports for tests and reflects the sub-strand titles"},{"en":"It gives the order of the objective in the stage, with 01 as the first objective","ar":"It gives the order of the objective in the stage, with 01 as the first objective"},{"en":"It tells you the stage number, so that 9 means Stage 9 on the report","ar":"It tells you the stage number, so that 9 means Stage 9 on the report"},{"en":"It shows the difficulty level of the objective, for use in sorting test questions","ar":"It shows the difficulty level of the objective, for use in sorting test questions"}],"correct":0,"expl":{"en":"The framework says each code includes the stage number, a reporting code that reflects the sub-strand titles and appears in feedback reports, and a number for the order of the objective.","ar":"The framework says each code includes the stage number, a reporting code that reflects the sub-strand titles and appears in feedback reports, and a number for the order of the objective."}},{"id":"m6q3","q":{"en":"At PEPS, a Year 8 GL Progress Test result shows lower scores than expected. What is the best use of the result?","ar":"At PEPS, a Year 8 GL Progress Test result shows lower scores than expected. What is the best use of the result?"},"opts":[{"en":"Treat it as proof that the Stage 8 scheme of work is wrong and must be replaced at once","ar":"Treat it as proof that the Stage 8 scheme of work is wrong and must be replaced at once"},{"en":"Treat it as one external check, and compare it with classroom evidence before deciding what to change","ar":"Treat it as one external check, and compare it with classroom evidence before deciding what to change"},{"en":"Ignore it, because the test is not a Cambridge assessment and cannot say anything useful","ar":"Ignore it, because the test is not a Cambridge assessment and cannot say anything useful"},{"en":"Tell learners their Checkpoint results will be low, so that they prepare much earlier for Year 9","ar":"Tell learners their Checkpoint results will be low, so that they prepare much earlier for Year 9"}],"correct":1,"expl":{"en":"GL tests are an external check from a different provider. Compare the result with other evidence before changing teaching, and do not claim more than the test can show.","ar":"GL tests are an external check from a different provider. Compare the result with other evidence before changing teaching, and do not claim more than the test can show."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Collecting results is only the first half of assessment. The second half is using them: finding out which ideas learners have not yet understood and changing what you do. This module gives a simple method for reading results by strand and objective, a list of common science misconceptions (good practice), and a way to plan intervention and track progress. It does not use real PEPS results; the numbers in the worked example are \u003cstrong>invented for practice\u003c/strong> only.","ar":"Collecting results is only the first half of assessment. The second half is using them: finding out which ideas learners have not yet understood and changing what you do. This module gives a simple method for reading results by strand and objective, a list of common science misconceptions (good practice), and a way to plan intervention and track progress. It does not use real PEPS results; the numbers in the worked example are \u003cstrong>invented for practice\u003c/strong> only."}},{"t":"h","c":{"en":"Where the evidence comes from","ar":"Where the evidence comes from"}},{"t":"list","c":{"en":["\u003cstrong>Everyday evidence:\u003c/strong> questions in lessons, exit tickets, practical observation, written explanations, and conclusions in practical reports.","\u003cstrong>Unit evidence:\u003c/strong> end-of-unit tasks and tests written by your department, mapped to objective codes.","\u003cstrong>External evidence:\u003c/strong> at PEPS, the GL Progress Test in Year 8 and the Cambridge Lower Secondary Checkpoint in Year 9; if your school uses them, Cambridge Progression Tests. The framework says test feedback reports use reporting codes that reflect sub-strand titles, which makes it possible to link results to teaching."],"ar":["\u003cstrong>Everyday evidence:\u003c/strong> questions in lessons, exit tickets, practical observation, written explanations, and conclusions in practical reports.","\u003cstrong>Unit evidence:\u003c/strong> end-of-unit tasks and tests written by your department, mapped to objective codes.","\u003cstrong>External evidence:\u003c/strong> at PEPS, the GL Progress Test in Year 8 and the Cambridge Lower Secondary Checkpoint in Year 9; if your school uses them, Cambridge Progression Tests. The framework says test feedback reports use reporting codes that reflect sub-strand titles, which makes it possible to link results to teaching."]}},{"t":"p","c":{"en":"No single source is enough. A test shows what learners can do on that day, in that format and in English. Classroom evidence shows how they think. When the two agree, you can be more confident. When they disagree, ask why before you decide what to change.","ar":"No single source is enough. A test shows what learners can do on that day, in that format and in English. Classroom evidence shows how they think. When the two agree, you can be more confident. When they disagree, ask why before you decide what to change."}},{"t":"h","c":{"en":"A seven-step method (good practice)","ar":"A seven-step method (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Collect\u003c/strong> results for one class or year group, by learner and by question.","\u003cstrong>Map\u003c/strong> each question to an objective code or reporting code (for example 8Bs.03, 8Cc.03, 8TWSa.02).","\u003cstrong>Count\u003c/strong> how many learners got each question or objective right, and look at the pattern across the strand and across the class.","\u003cstrong>Look at the wrong answers.\u003c/strong> A wrong answer chosen by many learners tells you about a misconception.","\u003cstrong>Ask why.\u003c/strong> Was it a content gap, a misconception, a weak maths or graph skill, a command word or language problem, a practical skill, or too little time on the topic?","\u003cstrong>Decide one or two actions\u003c/strong> that match the cause, with a date.","\u003cstrong>Re-check\u003c/strong> with a short new task, and record whether the gap has closed."],"ar":["\u003cstrong>Collect\u003c/strong> results for one class or year group, by learner and by question.","\u003cstrong>Map\u003c/strong> each question to an objective code or reporting code (for example 8Bs.03, 8Cc.03, 8TWSa.02).","\u003cstrong>Count\u003c/strong> how many learners got each question or objective right, and look at the pattern across the strand and across the class.","\u003cstrong>Look at the wrong answers.\u003c/strong> A wrong answer chosen by many learners tells you about a misconception.","\u003cstrong>Ask why.\u003c/strong> Was it a content gap, a misconception, a weak maths or graph skill, a command word or language problem, a practical skill, or too little time on the topic?","\u003cstrong>Decide one or two actions\u003c/strong> that match the cause, with a date.","\u003cstrong>Re-check\u003c/strong> with a short new task, and record whether the gap has closed."]}},{"t":"h","c":{"en":"A worked example (invented numbers, for practice only)","ar":"A worked example (invented numbers, for practice only)"}},{"t":"p","c":{"en":"A department gives a ten-question check to a Year 8 class of 24 learners after a unit on breathing and respiration. These numbers are not PEPS data.","ar":"A department gives a ten-question check to a Year 8 class of 24 learners after a unit on breathing and respiration. These numbers are not PEPS data."}},{"t":"table","head":{"en":["Objective","Question focus","Learners correct (out of 24)","Reading"],"ar":["Objective","Question focus","Learners correct (out of 24)","Reading"]},"rows":[{"en":["8Bs.03","Difference between breathing and respiration","11","Under half: a misconception likely; look at the wrong answers"],"ar":["8Bs.03","Difference between breathing and respiration","11","Under half: a misconception likely; look at the wrong answers"]},{"en":["8Bs.04","Diffusion between blood and the air in the lungs","15","More than half, but a gap remains"],"ar":["8Bs.04","Diffusion between blood and the air in the lungs","15","More than half, but a gap remains"]},{"en":["8Bp.04","Where aerobic respiration occurs","20","Secure"],"ar":["8Bp.04","Where aerobic respiration occurs","20","Secure"]},{"en":["8Bp.05","The word equation","21","Secure"],"ar":["8Bp.05","The word equation","21","Secure"]},{"en":["8TWSa.02","Describing a pattern in breathing-rate data","13","Check whether the problem is the graph skill or the language"],"ar":["8TWSa.02","Describing a pattern in breathing-rate data","13","Check whether the problem is the graph skill or the language"]}]},{"t":"p","c":{"en":"What would you do? The weakest result is 8Bs.03. If many wrong answers say \"respiration is breathing out\", the cause is the misconception, not careless work, so a short re-teach using the framework's glossary definitions is needed. The 8TWSa.02 result needs a different question: ask three learners to explain the pattern aloud. If they can say it but not write it, support language; if they cannot say it, practise reading graphs. Notice also that two objectives are secure. Do not spend time on them; use a short retrieval question later to keep them secure.","ar":"What would you do? The weakest result is 8Bs.03. If many wrong answers say \"respiration is breathing out\", the cause is the misconception, not careless work, so a short re-teach using the framework's glossary definitions is needed. The 8TWSa.02 result needs a different question: ask three learners to explain the pattern aloud. If they can say it but not write it, support language; if they cannot say it, practise reading graphs. Notice also that two objectives are secure. Do not spend time on them; use a short retrieval question later to keep them secure."}},{"t":"h","c":{"en":"Common misconceptions in lower secondary science (good practice)","ar":"Common misconceptions in lower secondary science (good practice)"}},{"t":"p","c":{"en":"The framework says the schemes of work include common misconceptions. The table below shows examples of widely reported ideas linked to objectives in the framework. Use your scheme of work and your own experience to add more. Treat a misconception as a sensible idea that does not yet fit the evidence, not as a mistake to be punished.","ar":"The framework says the schemes of work include common misconceptions. The table below shows examples of widely reported ideas linked to objectives in the framework. Use your scheme of work and your own experience to add more. Treat a misconception as a sensible idea that does not yet fit the evidence, not as a mistake to be punished."}},{"t":"table","head":{"en":["Objective","Typical misconception","A quick probe (good practice)","Teaching response"],"ar":["Objective","Typical misconception","A quick probe (good practice)","Teaching response"]},"rows":[{"en":["8Bs.03","Breathing and respiration are the same thing","\"Does a plant respire? Does a plant breathe?\"","Contrast definitions; show respiration happening in every living cell"],"ar":["8Bs.03","Breathing and respiration are the same thing","\"Does a plant respire? Does a plant breathe?\"","Contrast definitions; show respiration happening in every living cell"]},{"en":["9Bp.06","Plants take their food from the soil","\"Where does most of the mass of a tree come from?\"","Link to photosynthesis making carbohydrates; use 9Bp.05 to show what minerals are for"],"ar":["9Bp.06","Plants take their food from the soil","\"Where does most of the mass of a tree come from?\"","Link to photosynthesis making carbohydrates; use 9Bp.05 to show what minerals are for"]},{"en":["7Pf.02 and 9Pf.03","Energy gets used up and disappears","\"A moving ball stops. Where did its energy go?\"","Use energy-transfer diagrams: energy dissipates and becomes less useful but is conserved"],"ar":["7Pf.02 and 9Pf.03","Energy gets used up and disappears","\"A moving ball stops. Where did its energy go?\"","Use energy-transfer diagrams: energy dissipates and becomes less useful but is conserved"]},{"en":["9Pf.02","Heat and temperature are the same","\"Which has more thermal energy, a bath of warm water or a cup of boiling water?\"","Compare the two ideas side by side; use particle pictures"],"ar":["9Pf.02","Heat and temperature are the same","\"Which has more thermal energy, a bath of warm water or a cup of boiling water?\"","Compare the two ideas side by side; use particle pictures"]},{"en":["7Pe.04 and 9Pe.01","Current is used up by the first lamp in a circuit","\"Is the current the same on both sides of the lamp?\"","Measure with ammeters on both sides and discuss the electron-flow model"],"ar":["7Pe.04 and 9Pe.01","Current is used up by the first lamp in a circuit","\"Is the current the same on both sides of the lamp?\"","Measure with ammeters on both sides and discuss the electron-flow model"]},{"en":["7Cm.06","Particles in a solid do not move","\"Draw the particles in a solid, and show what they are doing\"","Use the framework's wording: arrangement, separation and motion of particles"],"ar":["7Cm.06","Particles in a solid do not move","\"Draw the particles in a solid, and show what they are doing\"","Use the framework's wording: arrangement, separation and motion of particles"]},{"en":["7Cm.04","A mixture and a compound are the same thing","\"Is salt water a compound or a mixture? How do you know?\"","Compare the two with real examples: separate a mixture, and show that a compound cannot be separated physically"],"ar":["7Cm.04","A mixture and a compound are the same thing","\"Is salt water a compound or a mixture? How do you know?\"","Compare the two with real examples: separate a mixture, and show that a compound cannot be separated physically"]}]},{"t":"h","c":{"en":"From evidence to action: intervention","ar":"From evidence to action: intervention"}},{"t":"table","head":{"en":["Finding","Likely cause","Response (good practice)"],"ar":["Finding","Likely cause","Response (good practice)"]},"rows":[{"en":["Most of the class got a question wrong","The first teaching did not work, or a misconception is strong","Re-teach the idea to the whole class in a different way (practical, model or diagram), then re-check"],"ar":["Most of the class got a question wrong","The first teaching did not work, or a misconception is strong","Re-teach the idea to the whole class in a different way (practical, model or diagram), then re-check"]},{"en":["A small group got it wrong","Gaps in prior learning or language","Short small-group teaching, with pre-taught vocabulary and a different example"],"ar":["A small group got it wrong","Gaps in prior learning or language","Short small-group teaching, with pre-taught vocabulary and a different example"]},{"en":["Learners know the idea but lose marks on explanation questions","Command words, language, or answer structure","Teach the command words and sentence frames (Module 5); practise with model answers"],"ar":["Learners know the idea but lose marks on explanation questions","Command words, language, or answer structure","Teach the command words and sentence frames (Module 5); practise with model answers"]},{"en":["Practical or data skills are weak across topics","Not enough practice with the skill","Plan a short skills lesson in the next unit (for example, plotting a graph or reading a scale)"],"ar":["Practical or data skills are weak across topics","Not enough practice with the skill","Plan a short skills lesson in the next unit (for example, plotting a graph or reading a scale)"]},{"en":["Results are low only on a topic taught very briefly","Time, not learner ability","Check the plan and the time; if needed, adjust the long-term plan for next year"],"ar":["Results are low only on a topic taught very briefly","Time, not learner ability","Check the plan and the time; if needed, adjust the long-term plan for next year"]}]},{"t":"h","c":{"en":"Tracking progress without inventing data","ar":"Tracking progress without inventing data"}},{"t":"p","c":{"en":"A simple tracker lists learners down the side and objectives across the top, with a three-level code, for example \"not yet\", \"partly\" or \"secure\". Update it after each check, using evidence you can show (a task, a question, an observation). Keep to your school's own tracker format if it has one; ask your HOD. Some cautions:","ar":"A simple tracker lists learners down the side and objectives across the top, with a three-level code, for example \"not yet\", \"partly\" or \"secure\". Update it after each check, using evidence you can show (a task, a question, an observation). Keep to your school's own tracker format if it has one; ask your HOD. Some cautions:"}},{"t":"list","c":{"en":["\u003cstrong>Compare like with like.\u003c/strong> A Year 8 GL test and a Year 9 Checkpoint measure different things and are sat on different dates. Do not compare their scores as if they were on one scale.","\u003cstrong>Look at objectives, not only totals.\u003c/strong> A class average can hide a strand where most learners struggle.","\u003cstrong>Do not over-read small numbers.\u003c/strong> A few learners in one class are not a trend. Look for the same pattern in more than one source.","\u003cstrong>Record the action,\u003c/strong> not only the problem: what you did, when, and what the re-check showed."],"ar":["\u003cstrong>Compare like with like.\u003c/strong> A Year 8 GL test and a Year 9 Checkpoint measure different things and are sat on different dates. Do not compare their scores as if they were on one scale.","\u003cstrong>Look at objectives, not only totals.\u003c/strong> A class average can hide a strand where most learners struggle.","\u003cstrong>Do not over-read small numbers.\u003c/strong> A few learners in one class are not a trend. Look for the same pattern in more than one source.","\u003cstrong>Record the action,\u003c/strong> not only the problem: what you did, when, and what the re-check showed."]}},{"t":"scenario","title":{"en":"Scenario: the Checkpoint feedback shows a weak strand","ar":"Scenario: the Checkpoint feedback shows a weak strand"},"c":{"en":"After the Year 9 Checkpoint, the feedback report shows that learners did less well in one reporting-code group, for example Cc (changes to materials). What should the department do? First, link the code to the objectives in the framework (9Cc.01 to 9Cc.05) and to your unit plans. Second, check classroom evidence: were these objectives taught, taught late, or taught too fast? Third, look for a cause (for example 9Cc.04 asks learners to explain rates using the particle model, which needs both chemistry and language). Fourth, agree an action for the next cohort, such as earlier teaching and a mid-unit check, and record how you will know it worked. Do not write or quote results that you have not seen.","ar":"After the Year 9 Checkpoint, the feedback report shows that learners did less well in one reporting-code group, for example Cc (changes to materials). What should the department do? First, link the code to the objectives in the framework (9Cc.01 to 9Cc.05) and to your unit plans. Second, check classroom evidence: were these objectives taught, taught late, or taught too fast? Third, look for a cause (for example 9Cc.04 asks learners to explain rates using the particle model, which needs both chemistry and language). Fourth, agree an action for the next cohort, such as earlier teaching and a mid-unit check, and record how you will know it worked. Do not write or quote results that you have not seen."}}],"checks":[{"id":"m7q1","q":{"en":"Which first step best starts an analysis of test results by objective?","ar":"Which first step best starts an analysis of test results by objective?"},"opts":[{"en":"Calculate one class average and compare it with the average of the other classes","ar":"Calculate one class average and compare it with the average of the other classes"},{"en":"Rank learners by total mark and plan extra lessons for the lowest learners","ar":"Rank learners by total mark and plan extra lessons for the lowest learners"},{"en":"Map each question to an objective code or reporting code, then count how many learners were correct","ar":"Map each question to an objective code or reporting code, then count how many learners were correct"},{"en":"Choose the lowest question and repeat the whole unit from the first lesson before doing any other check","ar":"Choose the lowest question and repeat the whole unit from the first lesson before doing any other check"}],"correct":2,"expl":{"en":"Mapping questions to objective or reporting codes makes it possible to see which ideas, not only which learners, need attention.","ar":"Mapping questions to objective or reporting codes makes it possible to see which ideas, not only which learners, need attention."}},{"id":"m7q2","q":{"en":"Most learners write that \"
