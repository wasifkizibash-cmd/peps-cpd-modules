#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-science-framework-b","code":"LSB","passMark":80,"hours":"2.5 hours","accent":"#1F7A5A","accentSoft":"#E3F4EC","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary Science 0893 · Part B","ar":"Staff CPD · Cambridge Lower Secondary Science 0893 · Part B"},"title":{"en":"Understanding the Cambridge Lower Secondary Science Curriculum: Part B, From Framework to Classroom","ar":"Understanding the Cambridge Lower Secondary Science Curriculum: Part B, From Framework to Classroom"},"subtitle":{"en":"A self-paced guide for Years 7 to 9 science teachers, HODs and coordinators: how to turn the learning objectives into plans and lessons, run safe and well-designed practical enquiry, support English as a second language learners, use assessment and evidence, include every learner, and review the quality of your teaching.","ar":"A self-paced guide for Years 7 to 9 science teachers, HODs and coordinators: how to turn the learning objectives into plans and lessons, run safe and well-designed practical enquiry, support English as a second language learners, use assessment and evidence, include every learner, and review the quality of your teaching."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary Science 0893 Curriculum Framework (v3.0)","ar":"Cambridge Lower Secondary Science 0893 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Lower Secondary Science 0893 Curriculum Framework, version 3.0 (latest version published February 2026; first published September 2020 for first teaching in September 2021). Check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary Science 0893 Curriculum Framework, version 3.0 (latest version published February 2026; first published September 2020 for first teaching in September 2021). Check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"From Objectives to Lessons: Planning and Teaching Time","ar":"From Objectives to Lessons: Planning and Teaching Time"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explains how the Cambridge Lower Secondary Science framework is built: its strands, sub-strands and learning objective codes. Part B starts where Part A stops. It asks: how do I get from a list of learning objectives to a good science lesson in Year 7, 8 or 9, and how do I know the lesson worked? By the end of this module you will be able to: describe long-term, medium-term and short-term planning; say what the framework, the teacher guide and the schemes of work each provide (and what is \u003cstrong>not\u003c/strong> compulsory); use the teaching-time guidance sensibly; and sequence a unit so that skills and knowledge build in a logical order. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explains how the Cambridge Lower Secondary Science framework is built: its strands, sub-strands and learning objective codes. Part B starts where Part A stops. It asks: how do I get from a list of learning objectives to a good science lesson in Year 7, 8 or 9, and how do I know the lesson worked? By the end of this module you will be able to: describe long-term, medium-term and short-term planning; say what the framework, the teacher guide and the schemes of work each provide (and what is \u003cstrong>not\u003c/strong> compulsory); use the teaching-time guidance sensibly; and sequence a unit so that skills and knowledge build in a logical order. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"The framework is a list of what learners should know, understand and be able to do in Stages 7, 8 and 9 (Years 7, 8 and 9 at PEPS). It is not a timetable and it is not a set of lesson plans. Two teachers can follow the same learning objectives and teach very different, equally good lessons. Your job is to make the choices in between: what to teach first, which practical work to use, how long to spend, and how to check that learners have learned. Those choices are called planning.","ar":"The framework is a list of what learners should know, understand and be able to do in Stages 7, 8 and 9 (Years 7, 8 and 9 at PEPS). It is not a timetable and it is not a set of lesson plans. Two teachers can follow the same learning objectives and teach very different, equally good lessons. Your job is to make the choices in between: what to teach first, which practical work to use, how long to spend, and how to check that learners have learned. Those choices are called planning."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The framework says that sub-strands \"help to identify progression and are useful when designing long-term plans, medium-term plans and other teaching resources\". Its glossary adds that a scheme of work contains a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. So the framework itself uses three levels.","ar":"The framework says that sub-strands \"help to identify progression and are useful when designing long-term plans, medium-term plans and other teaching resources\". Its glossary adds that a scheme of work contains a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. So the framework itself uses three levels."}},{"t":"table","head":{"en":["Level","The question it answers","What it usually contains (good practice)","Stage 8 example"],"ar":["Level","The question it answers","What it usually contains (good practice)","Stage 8 example"]},"rows":[{"en":["Long-term plan","What will we cover in the whole year, and in what order?","The units for the stage, their order, and the approximate time for each","A list of units that together cover every Stage 8 objective across the year"],"ar":["Long-term plan","What will we cover in the whole year, and in what order?","The units for the stage, their order, and the approximate time for each","A list of units that together cover every Stage 8 objective across the year"]},{"en":["Medium-term plan","What will happen in this unit, week by week?","The learning objectives, planned activities, key vocabulary, practical work and planned checks","A five-week unit that includes 8Bs.03, 8Bs.04, 8Bp.04 and 8Bp.05, plus the enquiry skills that go with them"],"ar":["Medium-term plan","What will happen in this unit, week by week?","The learning objectives, planned activities, key vocabulary, practical work and planned checks","A five-week unit that includes 8Bs.03, 8Bs.04, 8Bp.04 and 8Bp.05, plus the enquiry skills that go with them"]},{"en":["Short-term plan (lesson plan)","What will happen in this lesson, step by step?","A clear lesson objective, starter, main activity, questions, resources, safety notes, plenary and assessment evidence","One lesson on gas exchange with a model of the lungs and a risk assessment for the equipment"],"ar":["Short-term plan (lesson plan)","What will happen in this lesson, step by step?","A clear lesson objective, starter, main activity, questions, resources, safety notes, plenary and assessment evidence","One lesson on gas exchange with a model of the lungs and a risk assessment for the equipment"]}]},{"t":"p","c":{"en":"The columns \"what it usually contains\" and \"Stage 8 example\" are good practice, not Cambridge requirements. Your school may ask for a particular lesson-plan format. Always follow your school's lesson-planning expectations and check with your HOD.","ar":"The columns \"what it usually contains\" and \"Stage 8 example\" are good practice, not Cambridge requirements. Your school may ask for a particular lesson-plan format. Always follow your school's lesson-planning expectations and check with your HOD."}},{"t":"h","c":{"en":"What each Cambridge document gives you","ar":"What each Cambridge document gives you"}},{"t":"list","c":{"en":["\u003cstrong>Curriculum framework:\u003c/strong> the aims, the strands, the learning objectives for Stages 7, 8 and 9, the glossary, the appendix and the changes to each version. The framework says \"You must read the whole curriculum before planning your teaching programme.\"","\u003cstrong>Teacher guide:\u003c/strong> in the framework's glossary, \"the document providing support in using the curriculum framework to plan and deliver lessons using effective teaching and learning approaches\".","\u003cstrong>Schemes of work:\u003c/strong> support materials for each stage. According to the framework, each one contains suggested units, at least one suggested teaching activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans.","\u003cstrong>School Support Hub:\u003c/strong> where Cambridge says most resources can be found. Ask the Cambridge coordinator or exams officer in your school if you do not have a log-in."],"ar":["\u003cstrong>Curriculum framework:\u003c/strong> the aims, the strands, the learning objectives for Stages 7, 8 and 9, the glossary, the appendix and the changes to each version. The framework says \"You must read the whole curriculum before planning your teaching programme.\"","\u003cstrong>Teacher guide:\u003c/strong> in the framework's glossary, \"the document providing support in using the curriculum framework to plan and deliver lessons using effective teaching and learning approaches\".","\u003cstrong>Schemes of work:\u003c/strong> support materials for each stage. According to the framework, each one contains suggested units, at least one suggested teaching activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans.","\u003cstrong>School Support Hub:\u003c/strong> where Cambridge says most resources can be found. Ask the Cambridge coordinator or exams officer in your school if you do not have a log-in."]}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Science.\" They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all the teaching time for a stage, so you should add other activities of similar difficulty, for example from endorsed resources. Endorsed textbooks are not required to follow the teaching order in the schemes of work. If a resource is endorsed, the framework says you can be confident that all the learning objectives are covered. The objectives are the standard; the scheme is a suggestion.","ar":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Science.\" They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all the teaching time for a stage, so you should add other activities of similar difficulty, for example from endorsed resources. Endorsed textbooks are not required to follow the teaching order in the schemes of work. If a resource is endorsed, the framework says you can be confident that all the learning objectives are covered. The objectives are the standard; the scheme is a suggestion."}},{"t":"h","c":{"en":"Teaching-time guidance","ar":"Teaching-time guidance"}},{"t":"p","c":{"en":"The framework gives one piece of teaching-time guidance, and it is worth quoting exactly: \"For guidance, this curriculum framework is based on learners having 3 hours of Science per week (or about 90 hours per stage). Your actual number of teaching hours may vary according to your context.\"","ar":"The framework gives one piece of teaching-time guidance, and it is worth quoting exactly: \"For guidance, this curriculum framework is based on learners having 3 hours of Science per week (or about 90 hours per stage). Your actual number of teaching hours may vary according to your context.\""}},{"t":"table","head":{"en":["Stage","Guidance in the framework","What it means in practice"],"ar":["Stage","Guidance in the framework","What it means in practice"]},"rows":[{"en":["Stage 7 (Year 7)","3 hours per week, about 90 hours per stage","About 30 weeks of teaching at 3 hours a week (90 divided by 3)"],"ar":["Stage 7 (Year 7)","3 hours per week, about 90 hours per stage","About 30 weeks of teaching at 3 hours a week (90 divided by 3)"]},{"en":["Stage 8 (Year 8)","3 hours per week, about 90 hours per stage","The same figure; the increase in difficulty comes from the objectives, not from more hours"],"ar":["Stage 8 (Year 8)","3 hours per week, about 90 hours per stage","The same figure; the increase in difficulty comes from the objectives, not from more hours"]},{"en":["Stage 9 (Year 9)","3 hours per week, about 90 hours per stage","The same figure; check your real hours early so that Stage 9 objectives are not rushed"],"ar":["Stage 9 (Year 9)","3 hours per week, about 90 hours per stage","The same figure; check your real hours early so that Stage 9 objectives are not rushed"]}]},{"t":"p","c":{"en":"Notice what the guidance does and does not say. It gives hours, not lessons, and it does not say how many hours each strand or unit should receive. It says \"about 90 hours\", and it says the real number may vary. Check how many science hours your year group actually has in the timetable (your HOD can confirm), and plan from that real number. If you have fewer hours, you must prioritise carefully and still cover the objectives. If you have more, use the extra time for practical work and for returning to difficult ideas.","ar":"Notice what the guidance does and does not say. It gives hours, not lessons, and it does not say how many hours each strand or unit should receive. It says \"about 90 hours\", and it says the real number may vary. Check how many science hours your year group actually has in the timetable (your HOD can confirm), and plan from that real number. If you have fewer hours, you must prioritise carefully and still cover the objectives. If you have more, use the extra time for practical work and for returning to difficult ideas."}},{"t":"h","c":{"en":"Sequencing a unit: five steps (good practice)","ar":"Sequencing a unit: five steps (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Group\u003c/strong> content objectives into units that make sense together. The sub-strands help here, because they are built around key concepts (for example Stage 8 Biology, \"Structure and function\").","\u003cstrong>Order\u003c/strong> the objectives so that prior ideas come first. If an objective uses a term or model from another objective, teach that one earlier.","\u003cstrong>Attach\u003c/strong> Thinking and Working Scientifically (TWS) objectives to units, so that every skill is practised several times, not once.","\u003cstrong>Link\u003c/strong> across strands where the content connects, for example Physics diffusion (8Pf.07) supports Biology gas exchange (8Bs.04).","\u003cstrong>Plan checks\u003c/strong> inside the unit, not only at the end, so that you can change your teaching while there is still time."],"ar":["\u003cstrong>Group\u003c/strong> content objectives into units that make sense together. The sub-strands help here, because they are built around key concepts (for example Stage 8 Biology, \"Structure and function\").","\u003cstrong>Order\u003c/strong> the objectives so that prior ideas come first. If an objective uses a term or model from another objective, teach that one earlier.","\u003cstrong>Attach\u003c/strong> Thinking and Working Scientifically (TWS) objectives to units, so that every skill is practised several times, not once.","\u003cstrong>Link\u003c/strong> across strands where the content connects, for example Physics diffusion (8Pf.07) supports Biology gas exchange (8Bs.04).","\u003cstrong>Plan checks\u003c/strong> inside the unit, not only at the end, so that you can change your teaching while there is still time."]}},{"t":"h","c":{"en":"A worked example: planning a Stage 8 unit","ar":"A worked example: planning a Stage 8 unit"}},{"t":"p","c":{"en":"Suppose you plan a unit called \"Breathing and respiration\" for Year 8. Four objectives belong together: 8Bs.03 (the structure of the respiratory system, and the difference between breathing and respiration), 8Bs.04 (diffusion of oxygen and carbon dioxide between blood and the air in the lungs), 8Bp.04 (aerobic respiration occurs in the mitochondria) and 8Bp.05 (the word equation for aerobic respiration).","ar":"Suppose you plan a unit called \"Breathing and respiration\" for Year 8. Four objectives belong together: 8Bs.03 (the structure of the respiratory system, and the difference between breathing and respiration), 8Bs.04 (diffusion of oxygen and carbon dioxide between blood and the air in the lungs), 8Bp.04 (aerobic respiration occurs in the mitochondria) and 8Bp.05 (the word equation for aerobic respiration)."}},{"t":"table","head":{"en":["Order","Objective","Why it comes here","Skill to attach"],"ar":["Order","Objective","Why it comes here","Skill to attach"]},"rows":[{"en":["1","8Bs.03 Breathing and the respiratory system","Learners need the structure (alveoli, diaphragm, intercostal muscles) before they can explain exchange","8TWSm.02 use an analogy, such as a bottle-and-balloon lung model"],"ar":["1","8Bs.03 Breathing and the respiratory system","Learners need the structure (alveoli, diaphragm, intercostal muscles) before they can explain exchange","8TWSm.02 use an analogy, such as a bottle-and-balloon lung model"]},{"en":["2","8Bs.04 Diffusion between blood and air","Builds on structure; diffusion is also taught in 8Pf.07, so check what learners know","8TWSa.02 trends in breathing-rate data"],"ar":["2","8Bs.04 Diffusion between blood and air","Builds on structure; diffusion is also taught in 8Pf.07, so check what learners know","8TWSa.02 trends in breathing-rate data"]},{"en":["3","8Bp.04 Aerobic respiration in mitochondria","Explains why the body needs oxygen; mitochondria were met in 7Bs.02","8TWSp.03 predict how exercise changes breathing rate"],"ar":["3","8Bp.04 Aerobic respiration in mitochondria","Explains why the body needs oxygen; mitochondria were met in 7Bs.02","8TWSp.03 predict how exercise changes breathing rate"]},{"en":["4","8Bp.05 The word equation","Summarises the process; use it last, after the idea is clear","8TWSm.03 symbols and formulae"],"ar":["4","8Bp.05 The word equation","Summarises the process; use it last, after the idea is clear","8TWSm.03 symbols and formulae"]}]},{"t":"p","c":{"en":"Look at what this plan does. It keeps the \"breathing versus respiration\" distinction for the first lesson, because 8Bs.03 asks learners to understand it, and the glossary defines the two terms separately. It links back to Stage 7 (mitochondria in 7Bs.02), links sideways to Physics (8Pf.07) and uses a TWS skill in every lesson.","ar":"Look at what this plan does. It keeps the \"breathing versus respiration\" distinction for the first lesson, because 8Bs.03 asks learners to understand it, and the glossary defines the two terms separately. It links back to Stage 7 (mitochondria in 7Bs.02), links sideways to Physics (8Pf.07) and uses a TWS skill in every lesson."}},{"t":"callout","k":"tip","title":{"en":"Watch the printed codes","ar":"Watch the printed codes"},"c":{"en":"The Stage 8 list in the framework prints one code as \"8TSWa.05\". Every other Stage 8 and Stage 7 code in that group follows the pattern TWSa, so this looks like a typing slip in the document. When you write plans, copy the pattern (8TWSa.05) and check the code against the schemes of work on the School Support Hub. The framework also records that the code for 7TWSa.05 was corrected in version 2.0, so old plans may carry an older code.","ar":"The Stage 8 list in the framework prints one code as \"8TSWa.05\". Every other Stage 8 and Stage 7 code in that group follows the pattern TWSa, so this looks like a typing slip in the document. When you write plans, copy the pattern (8TWSa.05) and check the code against the schemes of work on the School Support Hub. The framework also records that the code for 7TWSa.05 was corrected in version 2.0, so old plans may carry an older code."}},{"t":"scenario","title":{"en":"Scenario: the textbook order is different","ar":"Scenario: the textbook order is different"},"c":{"en":"Your Year 9 colleague says: \"The endorsed textbook puts the carbon cycle (9ESc.01) before photosynthesis (9Bp.06 and 9Bp.07), so we must teach it that way.\" What is the best response? The framework says there is no requirement for endorsed textbooks to follow the order in the schemes of work, and that an endorsed resource covers all the learning objectives. It does not say you must follow the textbook order either. A good plan decides the order by the ideas. The carbon cycle (limited to photosynthesis, respiration, feeding, decomposition and combustion) uses photosynthesis and respiration, so teaching photosynthesis first usually makes the cycle easier to understand. You may still use the textbook's activities and questions, in your own order.","ar":"Your Year 9 colleague says: \"The endorsed textbook puts the carbon cycle (9ESc.01) before photosynthesis (9Bp.06 and 9Bp.07), so we must teach it that way.\" What is the best response? The framework says there is no requirement for endorsed textbooks to follow the order in the schemes of work, and that an endorsed resource covers all the learning objectives. It does not say you must follow the textbook order either. A good plan decides the order by the ideas. The carbon cycle (limited to photosynthesis, respiration, feeding, decomposition and combustion) uses photosynthesis and respiration, so teaching photosynthesis first usually makes the cycle easier to understand. You may still use the textbook's activities and questions, in your own order."}}],"checks":[{"id":"m1q1","q":{"en":"According to the framework's glossary, what does a scheme of work contain?","ar":"According to the framework's glossary, what does a scheme of work contain?"},"opts":[{"en":"A suggested long-term plan, a medium-term plan with suggested activities and sample lesson plans","ar":"A suggested long-term plan, a medium-term plan with suggested activities and sample lesson plans"},{"en":"A set of compulsory lessons that every Cambridge school must teach in the order given","ar":"A set of compulsory lessons that every Cambridge school must teach in the order given"},{"en":"The full list of learning objectives for each stage, with the reporting codes used in test feedback reports","ar":"The full list of learning objectives for each stage, with the reporting codes used in test feedback reports"},{"en":"A bank of Checkpoint questions that teachers use to check each learning objective","ar":"A bank of Checkpoint questions that teachers use to check each learning objective"}],"correct":0,"expl":{"en":"The glossary describes a scheme of work as support material with a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. The framework also says you do not need to use its ideas.","ar":"The glossary describes a scheme of work as support material with a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. The framework also says you do not need to use its ideas."}},{"id":"m1q2","q":{"en":"What teaching time does the framework suggest for Stages 7 to 9, and how should you treat it?","ar":"What teaching time does the framework suggest for Stages 7 to 9, and how should you treat it?"},"opts":[{"en":"2 hours a week, about 60 hours per stage, as a fixed rule that every school must follow","ar":"2 hours a week, about 60 hours per stage, as a fixed rule that every school must follow"},{"en":"3 hours a week, about 90 hours per stage, as guidance that may vary in your context","ar":"3 hours a week, about 90 hours per stage, as guidance that may vary in your context"},{"en":"3 hours a week, about 90 hours per stage, as a minimum that no school may go below","ar":"3 hours a week, about 90 hours per stage, as a minimum that no school may go below"},{"en":"4 hours a week, about 120 hours per stage, as a target checked by Cambridge each year","ar":"4 hours a week, about 120 hours per stage, as a target checked by Cambridge each year"}],"correct":1,"expl":{"en":"The framework says \"For guidance\" it is based on 3 hours of Science per week, or about 90 hours per stage, and that actual hours may vary according to your context.","ar":"The framework says \"For guidance\" it is based on 3 hours of Science per week, or about 90 hours per stage, and that actual hours may vary according to your context."}},{"id":"m1q3","q":{"en":"A teacher plans a Year 8 unit on gas exchange. Which order follows the sequencing logic in this module?","ar":"A teacher plans a Year 8 unit on gas exchange. Which order follows the sequencing logic in this module?"},"opts":[{"en":"Teach diffusion between blood and air (8Bs.04) first, then add the lung structure at the end of the term","ar":"Teach diffusion between blood and air (8Bs.04) first, then add the lung structure at the end of the term"},{"en":"Teach only 8Bs.04 and leave 8Bs.03 to Year 9, because both cover the same idea","ar":"Teach only 8Bs.04 and leave 8Bs.03 to Year 9, because both cover the same idea"},{"en":"Teach the structure of the lungs first (8Bs.03), then diffusion of gases between blood and air (8Bs.04)","ar":"Teach the structure of the lungs first (8Bs.03), then diffusion of gases between blood and air (8Bs.04)"},{"en":"Teach the objectives in whatever order they appear in a textbook, whatever the content","ar":"Teach the objectives in whatever order they appear in a textbook, whatever the content"}],"correct":2,"expl":{"en":"The module recommends ordering objectives so that the earlier idea supports the later one. Lung structure is needed before learners can explain exchange.","ar":"The module recommends ordering objectives so that the earlier idea supports the later one. Lung structure is needed before learners can explain exchange."}}]},{"id":"m2","title":{"en":"Teaching Approaches in the Framework","ar":"Teaching Approaches in the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework has a short section called \"Overview of teaching approaches\". It is only a few paragraphs, but each sentence matters. This module reads that section closely, shows what it means for a Year 7, 8 or 9 lesson, and then adds some \u003cstrong>good practice\u003c/strong> ideas. Good practice is clearly labelled, because it is advice and not a Cambridge requirement.","ar":"The framework has a short section called \"Overview of teaching approaches\". It is only a few paragraphs, but each sentence matters. This module reads that section closely, shows what it means for a Year 7, 8 or 9 lesson, and then adds some \u003cstrong>good practice\u003c/strong> ideas. Good practice is clearly labelled, because it is advice and not a Cambridge requirement."}},{"t":"h","c":{"en":"What the framework says","ar":"What the framework says"}},{"t":"list","c":{"en":["The curriculum \"offers great flexibility through its three strand categories approach\": a skills strand, content strands and a context strand.","The three types of strands \"are designed to support each other in every stage of learning to provide learners with a holistic science education\".","\"Science is a practical subject and teaching of science should include opportunities for learners to observe and carry out practical work.\"","The Teacher Guide and the schemes of work, on the School Support Hub, give ideas for teaching and learning activities, including how the three categories of strand work together.","The teacher guide \"will support you to plan and deliver lessons using effective teaching and learning approaches\"."],"ar":["The curriculum \"offers great flexibility through its three strand categories approach\": a skills strand, content strands and a context strand.","The three types of strands \"are designed to support each other in every stage of learning to provide learners with a holistic science education\".","\"Science is a practical subject and teaching of science should include opportunities for learners to observe and carry out practical work.\"","The Teacher Guide and the schemes of work, on the School Support Hub, give ideas for teaching and learning activities, including how the three categories of strand work together.","The teacher guide \"will support you to plan and deliver lessons using effective teaching and learning approaches\"."]}},{"t":"p","c":{"en":"Notice that the framework does not prescribe one method. It does not say \"use enquiry for every lesson\" or \"teach by demonstration\". It sets two firm expectations (practical work is included, and the three strand types work together) and leaves the rest to you.","ar":"Notice that the framework does not prescribe one method. It does not say \"use enquiry for every lesson\" or \"teach by demonstration\". It sets two firm expectations (practical work is included, and the three strand types work together) and leaves the rest to you."}},{"t":"h","c":{"en":"The three strand categories working together","ar":"The three strand categories working together"}},{"t":"table","head":{"en":["Category","Strands","Role in a lesson","Example from the framework"],"ar":["Category","Strands","Role in a lesson","Example from the framework"]},"rows":[{"en":["Skills strand","Thinking and Working Scientifically (models and representations; scientific enquiry; practical work)","How learners think and work: predicting, planning, measuring, concluding, evaluating","7TWSc.04 Take appropriately accurate and precise measurements"],"ar":["Skills strand","Thinking and Working Scientifically (models and representations; scientific enquiry; practical work)","How learners think and work: predicting, planning, measuring, concluding, evaluating","7TWSc.04 Take appropriately accurate and precise measurements"]},{"en":["Content strands","Biology, Chemistry, Physics, Earth and Space","What learners know and understand about the natural world","7Cm.06 Describe the three states of matter in terms of particles"],"ar":["Content strands","Biology, Chemistry, Physics, Earth and Space","What learners know and understand about the natural world","7Cm.06 Describe the three states of matter in terms of particles"]},{"en":["Context strand","Science in Context","Why it matters: the real world, scientists and their work, impact on society and the environment","7SIC.05 Discuss how the uses of science can have a global environmental impact"],"ar":["Context strand","Science in Context","Why it matters: the real world, scientists and their work, impact on society and the environment","7SIC.05 Discuss how the uses of science can have a global environmental impact"]}]},{"t":"p","c":{"en":"The framework's own example is: \"learners are able to develop the skills within Thinking and Working Scientifically while they learn the content within the four content strands which can be taught through contexts supported by the Science in Context strand.\" In plain words, one lesson can carry all three.","ar":"The framework's own example is: \"learners are able to develop the skills within Thinking and Working Scientifically while they learn the content within the four content strands which can be taught through contexts supported by the Science in Context strand.\" In plain words, one lesson can carry all three."}},{"t":"h","c":{"en":"A worked example: one Year 7 lesson, three strands","ar":"A worked example: one Year 7 lesson, three strands"}},{"t":"p","c":{"en":"Take 7Ps.01, which asks learners to describe the vibration of particles in a sound wave and explain why sound does not travel in a vacuum. Here is how a single 50 to 60 minute lesson could carry all three categories.","ar":"Take 7Ps.01, which asks learners to describe the vibration of particles in a sound wave and explain why sound does not travel in a vacuum. Here is how a single 50 to 60 minute lesson could carry all three categories."}},{"t":"table","head":{"en":["Part of the lesson","What learners do","Strand and code"],"ar":["Part of the lesson","What learners do","Strand and code"]},"rows":[{"en":["Hook","Hear a bell ring inside a bell jar and discuss what would happen if the air were removed (a teacher demonstration or a video)","Physics: 7Ps.01 and 7Pf.04 (no air resistance in a vacuum)"],"ar":["Hook","Hear a bell ring inside a bell jar and discuss what would happen if the air were removed (a teacher demonstration or a video)","Physics: 7Ps.01 and 7Pf.04 (no air resistance in a vacuum)"]},{"en":["Model","Use a spring or a line of learners as a model of particles passing on a vibration, then list its strengths and limitations","TWS: 7TWSm.01"],"ar":["Model","Use a spring or a line of learners as a model of particles passing on a vibration, then list its strengths and limitations","TWS: 7TWSm.01"]},{"en":["Explain","Write a short explanation of why sound cannot cross a vacuum","Physics: 7Ps.01"],"ar":["Explain","Write a short explanation of why sound cannot cross a vacuum","Physics: 7Ps.01"]},{"en":["Context","Discuss how sound is used in industry or research, and who needs to understand it","Science in Context: 7SIC.02"],"ar":["Context","Discuss how sound is used in industry or research, and who needs to understand it","Science in Context: 7SIC.02"]}]},{"t":"p","c":{"en":"Only one objective is the main target of the lesson. The others appear as short, planned moments, so that the lesson stays focused. A common mistake is to try to teach six objectives in one lesson. Two or three well-linked objectives are enough.","ar":"Only one objective is the main target of the lesson. The others appear as short, planned moments, so that the lesson stays focused. A common mistake is to try to teach six objectives in one lesson. Two or three well-linked objectives are enough."}},{"t":"callout","k":"key","title":{"en":"Science in Context is part of teaching even though it is not directly assessed","ar":"Science in Context is part of teaching even though it is not directly assessed"},"c":{"en":"The framework says: \"The Science in Context strand will not be directly assessed by Cambridge International Education.\" It also says that the strand is a \"framework of statements to help learners study and understand the learning objectives within the other five science strands in a context relevant to them.\" So the strand is a teaching tool for relevance (\"science is for me\") and not a topic to cut because it is not on a test. The sensible reading is to use it inside content lessons, in short, regular moments.","ar":"The framework says: \"The Science in Context strand will not be directly assessed by Cambridge International Education.\" It also says that the strand is a \"framework of statements to help learners study and understand the learning objectives within the other five science strands in a context relevant to them.\" So the strand is a teaching tool for relevance (\"science is for me\") and not a topic to cut because it is not on a test. The sensible reading is to use it inside content lessons, in short, regular moments."}},{"t":"h","c":{"en":"Models and representations: a thread through the stages","ar":"Models and representations: a thread through the stages"}},{"t":"p","c":{"en":"Models and representations is one of the three scientific approaches in the skills strand. The framework explains that scientists use models \"to explain and think about scientific ideas that are not visible or are abstract\". That matters in lower secondary, because the content is full of ideas learners cannot see: atoms, electrons, particles in a sound wave, tectonic plates. The objectives show a clear progression.","ar":"Models and representations is one of the three scientific approaches in the skills strand. The framework explains that scientists use models \"to explain and think about scientific ideas that are not visible or are abstract\". That matters in lower secondary, because the content is full of ideas learners cannot see: atoms, electrons, particles in a sound wave, tectonic plates. The objectives show a clear progression."}},{"t":"table","head":{"en":["Stage","Models and representations objectives (paraphrased)","What the teaching shift is"],"ar":["Stage","Models and representations objectives (paraphrased)","What the teaching shift is"]},"rows":[{"en":["Stage 7","7TWSm.01 describe the strengths and limitations of a model; 7TWSm.02 use symbols and formulae","Learners judge models: what does this model show well, and what does it hide?"],"ar":["Stage 7","7TWSm.01 describe the strengths and limitations of a model; 7TWSm.02 use symbols and formulae","Learners judge models: what does this model show well, and what does it hide?"]},{"en":["Stage 8","8TWSm.01 describe what an analogy is and how it is used as a model; 8TWSm.02 use an existing analogy for a purpose; 8TWSm.03 symbols and formulae","Learners meet analogies (for example, a flow model for electric current) and use them on purpose"],"ar":["Stage 8","8TWSm.01 describe what an analogy is and how it is used as a model; 8TWSm.02 use an existing analogy for a purpose; 8TWSm.03 symbols and formulae","Learners meet analogies (for example, a flow model for electric current) and use them on purpose"]},{"en":["Stage 9","9TWSm.01 models and analogies reflect current evidence and can change; 9TWSm.02 describe important models and discuss strengths and limitations; 9TWSm.03 symbols and formulae, including dot-and-cross diagrams","Learners see that models change as evidence changes, and use more formal representations"],"ar":["Stage 9","9TWSm.01 models and analogies reflect current evidence and can change; 9TWSm.02 describe important models and discuss strengths and limitations; 9TWSm.03 symbols and formulae, including dot-and-cross diagrams","Learners see that models change as evidence changes, and use more formal representations"]}]},{"t":"p","c":{"en":"Because 9TWSm.03 and the objectives 9Cm.03 and 9Cm.04 now include dot-and-cross diagrams (version 3.0 of the framework made this clearer), a Year 9 chemistry unit on bonding is also a models lesson. Learners should be asked each time: what does this diagram show, and what does it not show?","ar":"Because 9TWSm.03 and the objectives 9Cm.03 and 9Cm.04 now include dot-and-cross diagrams (version 3.0 of the framework made this clearer), a Year 9 chemistry unit on bonding is also a models lesson. Learners should be asked each time: what does this diagram show, and what does it not show?"}},{"t":"h","c":{"en":"Good practice approaches that fit the framework","ar":"Good practice approaches that fit the framework"}},{"t":"p","c":{"en":"The following are \u003cstrong>good practice\u003c/strong> suggestions, not framework requirements. They fit the framework's view of science as practical, linked and concerned with explanation.","ar":"The following are \u003cstrong>good practice\u003c/strong> suggestions, not framework requirements. They fit the framework's view of science as practical, linked and concerned with explanation."}},{"t":"list","c":{"en":["\u003cstrong>Phenomenon first.\u003c/strong> Start with something learners can see, hear or measure (a burning candle in a closed jar, a swinging bridge picture), then name the idea. This works well for learners who are still building English, because the experience gives them something to talk about.","\u003cstrong>Predict, observe, explain.\u003c/strong> Ask learners to write a prediction before a demonstration. It links to the predicting objectives (for example 7TWSp.03) and shows misconceptions early.","\u003cstrong>Talk before writing.\u003c/strong> Give learners two minutes to explain to a partner, then write. Module 5 covers this in detail.","\u003cstrong>Short retrieval at the start.\u003c/strong> Three quick questions from last week help learners remember what they need for today's objective.","\u003cstrong>Practical with a purpose.\u003c/strong> Every practical activity should answer a question that the learners can say aloud, not simply follow instructions."],"ar":["\u003cstrong>Phenomenon first.\u003c/strong> Start with something learners can see, hear or measure (a burning candle in a closed jar, a swinging bridge picture), then name the idea. This works well for learners who are still building English, because the experience gives them something to talk about.","\u003cstrong>Predict, observe, explain.\u003c/strong> Ask learners to write a prediction before a demonstration. It links to the predicting objectives (for example 7TWSp.03) and shows misconceptions early.","\u003cstrong>Talk before writing.\u003c/strong> Give learners two minutes to explain to a partner, then write. Module 5 covers this in detail.","\u003cstrong>Short retrieval at the start.\u003c/strong> Three quick questions from last week help learners remember what they need for today's objective.","\u003cstrong>Practical with a purpose.\u003c/strong> Every practical activity should answer a question that the learners can say aloud, not simply follow instructions."]}},{"t":"scenario","title":{"en":"Scenario: \"We only have time for the content\"","ar":"Scenario: \"We only have time for the content\""},"c":{"en":"A Year 8 teacher says: \"The Checkpoint is about content, and Science in Context is not assessed, so we will skip practical work and context and just do content.\" What is a better view? First, the framework says science is a practical subject and teaching should include opportunities for learners to observe and carry out practical work. Second, Thinking and Working Scientifically is a strand with its own objectives (for example 8TWSc.02 and 8TWSa.04), so skipping it leaves objectives untaught. Third, the framework says the strand types support each other, so practical work and context often make the content easier to remember. A better plan is short, focused practical moments in each unit, with context questions that take two or three minutes.","ar":"A Year 8 teacher says: \"The Checkpoint is about content, and Science in Context is not assessed, so we will skip practical work and context and just do content.\" What is a better view? First, the framework says science is a practical subject and teaching should include opportunities for learners to observe and carry out practical work. Second, Thinking and Working Scientifically is a strand with its own objectives (for example 8TWSc.02 and 8TWSa.04), so skipping it leaves objectives untaught. Third, the framework says the strand types support each other, so practical work and context often make the content easier to remember. A better plan is short, focused practical moments in each unit, with context questions that take two or three minutes."}}],"checks":[{"id":"m2q1","q":{"en":"Which three categories of strands does the framework describe?","ar":"Which three categories of strands does the framework describe?"},"opts":[{"en":"A knowledge strand, a practical strand and an assessment strand","ar":"A knowledge strand, a practical strand and an assessment strand"},{"en":"A theory strand, a laboratory strand and a reporting strand","ar":"A theory strand, a laboratory strand and a reporting strand"},{"en":"A Stage 7 strand, a Stage 8 strand and a Stage 9 strand","ar":"A Stage 7 strand, a Stage 8 strand and a Stage 9 strand"},{"en":"A skills strand, content strands and a context strand","ar":"A skills strand, content strands and a context strand"}],"correct":3,"expl":{"en":"The framework describes a skills strand (Thinking and Working Scientifically), content strands (Biology, Chemistry, Physics, Earth and Space) and a context strand (Science in Context).","ar":"The framework describes a skills strand (Thinking and Working Scientifically), content strands (Biology, Chemistry, Physics, Earth and Space) and a context strand (Science in Context)."}},{"id":"m2q2","q":{"en":"The framework says Science in Context will not be directly assessed by Cambridge. What does this mean for planning?","ar":"The framework says Science in Context will not be directly assessed by Cambridge. What does this mean for planning?"},"opts":[{"en":"The strand is not tested directly, but it still helps learners connect the content to real contexts","ar":"The strand is not tested directly, but it still helps learners connect the content to real contexts"},{"en":"The strand can be left out of the teaching programme, because only the tested strands are required by Cambridge","ar":"The strand can be left out of the teaching programme, because only the tested strands are required by Cambridge"},{"en":"The strand should be taught in a separate lesson at the end of the year, away from content","ar":"The strand should be taught in a separate lesson at the end of the year, away from content"},{"en":"The strand is only for the most able learners, because weaker learners cannot discuss contexts","ar":"The strand is only for the most able learners, because weaker learners cannot discuss contexts"}],"correct":0,"expl":{"en":"The framework describes the strand as a framework of statements that help learners study the other strands in a relevant context. Not being directly assessed does not remove it from teaching.","ar":"The framework describes the strand as a framework of statements that help learners study the other strands in a relevant context. Not being directly assessed does not remove it from teaching."}},{"id":"m2q3","q":{"en":"At which stage do the framework's models objectives first mention analogies (8TWSm.01 and 8TWSm.02)?","ar":"At which stage do the framework's models objectives first mention analogies (8TWSm.01 and 8TWSm.02)?"},"opts":[{"en":"Stage 7, where learners first describe what an analogy is and how it works as a model","ar":"Stage 7, where learners first describe what an analogy is and how it works as a model"},{"en":"Stage 8, where learners describe what an analogy is and use an existing one for a purpose","ar":"Stage 8, where learners describe what an analogy is and use an existing one for a purpose"},{"en":"Stage 9, where learners first discuss analogies and the strengths and limitations of models","ar":"Stage 9, where learners first discuss analogies and the strengths and limitations of models"},{"en":"All three stages in the same way, because the models objectives never change across stages","ar":"All three stages in the same way, because the models objectives never change across stages"}],"correct":1,"expl":{"en":"Stage 7 has 7TWSm.01 on strengths and limitations of a model; analogies appear in 8TWSm.01 and 8TWSm.02; Stage 9 adds that models and analogies can change.","ar":"Stage 7 has 7TWSm.01 on strengths and limitations of a model; analogies appear in 8TWSm.01 and 8TWSm.02; Stage 9 adds that models and analogies can change."}}]},{"id":"m3","title":{"en":"Practical Enquiry and Working Scientifically","ar":"Practical Enquiry and Working Scientifically"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that \"an essential part of this curriculum is that learners develop skills in scientific enquiry\", including \"collecting primary data by experiment\". The Thinking and Working Scientifically (TWS) strand has three groups of enquiry objectives: purpose and planning (TWSp), carrying out (TWSc) and analysis, evaluation and conclusions (TWSa). This module follows an investigation from the first question to the final evaluation, using those objectives. Safety is covered in more detail in Module 4.","ar":"The framework says that \"an essential part of this curriculum is that learners develop skills in scientific enquiry\", including \"collecting primary data by experiment\". The Thinking and Working Scientifically (TWS) strand has three groups of enquiry objectives: purpose and planning (TWSp), carrying out (TWSc) and analysis, evaluation and conclusions (TWSa). This module follows an investigation from the first question to the final evaluation, using those objectives. Safety is covered in more detail in Module 4."}},{"t":"h","c":{"en":"Experiment, investigation, and types of enquiry","ar":"Experiment, investigation, and types of enquiry"}},{"t":"p","c":{"en":"The glossary separates two terms that teachers often mix up. An \u003cstrong>experiment\u003c/strong> is \"a specific procedure carried out to support, disprove or validate all, or part of, a scientific hypothesis\". An \u003cstrong>investigation\u003c/strong> is \"a method of acquiring scientific knowledge based on a starting question\", and it \"often involves experiments but not always\", for example when learners use secondary sources to carry out a literature review. A \u003cstrong>hypothesis\u003c/strong> is \"a scientific theory or proposed explanation made on the basis of evidence which can be further tested\".","ar":"The glossary separates two terms that teachers often mix up. An \u003cstrong>experiment\u003c/strong> is \"a specific procedure carried out to support, disprove or validate all, or part of, a scientific hypothesis\". An \u003cstrong>investigation\u003c/strong> is \"a method of acquiring scientific knowledge based on a starting question\", and it \"often involves experiments but not always\", for example when learners use secondary sources to carry out a literature review. A \u003cstrong>hypothesis\u003c/strong> is \"a scientific theory or proposed explanation made on the basis of evidence which can be further tested\"."}},{"t":"p","c":{"en":"The Lower Secondary framework does not list the types of enquiry by name. It does say, in 7TWSp.04 and 8TWSp.04, that learners should \"plan a range of investigations of different types\" and \"recognise that not all investigations can be fair tests\". In 9TWSp.04 the \"fair test\" wording is replaced by planning investigations \"to obtain appropriate evidence when testing hypotheses\". For help with the types, it is useful to know that the Cambridge Primary Science framework (0097, objective 6TWSp.02) names five main types of enquiry: research, fair testing, observing over time, identifying and classifying, and pattern seeking. Your learners may have met these in Primary Stage 6. Use the names as a shared language (this is good practice, not a Lower Secondary requirement).","ar":"The Lower Secondary framework does not list the types of enquiry by name. It does say, in 7TWSp.04 and 8TWSp.04, that learners should \"plan a range of investigations of different types\" and \"recognise that not all investigations can be fair tests\". In 9TWSp.04 the \"fair test\" wording is replaced by planning investigations \"to obtain appropriate evidence when testing hypotheses\". For help with the types, it is useful to know that the Cambridge Primary Science framework (0097, objective 6TWSp.02) names five main types of enquiry: research, fair testing, observing over time, identifying and classifying, and pattern seeking. Your learners may have met these in Primary Stage 6. Use the names as a shared language (this is good practice, not a Lower Secondary requirement)."}},{"t":"table","head":{"en":["Type of enquiry (named in the Primary framework)","A Lower Secondary example","Linked objective"],"ar":["Type of enquiry (named in the Primary framework)","A Lower Secondary example","Linked objective"]},"rows":[{"en":["Fair testing","How does the number of turns of wire change the strength of an electromagnet?","8Pe.03 Investigate factors that change the strength of an electromagnet"],"ar":["Fair testing","How does the number of turns of wire change the strength of an electromagnet?","8Pe.03 Investigate factors that change the strength of an electromagnet"]},{"en":["Identifying and classifying","Use a dichotomous key to identify a set of leaves or invertebrate pictures","7Bp.04 and 7TWSc.01 (making and using keys)"],"ar":["Identifying and classifying","Use a dichotomous key to identify a set of leaves or invertebrate pictures","7Bp.04 and 7TWSc.01 (making and using keys)"]},{"en":["Pattern seeking","Does the rate of reaction change as temperature rises? Look for the pattern in class results","9Cc.04 and 9TWSa.02"],"ar":["Pattern seeking","Does the rate of reaction change as temperature rises? Look for the pattern in class results","9Cc.04 and 9TWSa.02"]},{"en":["Observing over time","Record the weather and temperature each week and compare with climate data","8ESc.03 (the difference between weather and climate)"],"ar":["Observing over time","Record the weather and temperature each week and compare with climate data","8ESc.03 (the difference between weather and climate)"]},{"en":["Research (secondary sources)","Use secondary sources to evaluate a claim about renewable resources","8ESp.02 and 7TWSc.06"],"ar":["Research (secondary sources)","Use secondary sources to evaluate a claim about renewable resources","8ESp.02 and 7TWSc.06"]}]},{"t":"h","c":{"en":"Planning: question, prediction, variables","ar":"Planning: question, prediction, variables"}},{"t":"p","c":{"en":"A good investigation starts with a question that can be tested. 7TWSp.01 and 8TWSp.01 ask learners to identify whether a given hypothesis is testable; 9TWSp.01 asks them to suggest a testable one. Then learners predict (TWSp.03, \"based on scientific knowledge and understanding\") and plan, \"considering variables appropriately\" (TWSp.04). The framework uses the word \"variables\" but does not define independent, dependent and control variables. The Primary framework does use these terms (6TWSp.04), so use them as good practice.","ar":"A good investigation starts with a question that can be tested. 7TWSp.01 and 8TWSp.01 ask learners to identify whether a given hypothesis is testable; 9TWSp.01 asks them to suggest a testable one. Then learners predict (TWSp.03, \"based on scientific knowledge and understanding\") and plan, \"considering variables appropriately\" (TWSp.04). The framework uses the word \"variables\" but does not define independent, dependent and control variables. The Primary framework does use these terms (6TWSp.04), so use them as good practice."}},{"t":"table","head":{"en":["Variable","Plain meaning","Electromagnet example (8Pe.03)"],"ar":["Variable","Plain meaning","Electromagnet example (8Pe.03)"]},"rows":[{"en":["Independent variable","The one thing you change","The number of turns of wire"],"ar":["Independent variable","The one thing you change","The number of turns of wire"]},{"en":["Dependent variable","The thing you measure","The number of paper clips lifted"],"ar":["Dependent variable","The thing you measure","The number of paper clips lifted"]},{"en":["Control variables","Things you keep the same so the test is fair","The same battery, the same iron nail, the same wire length"],"ar":["Control variables","Things you keep the same so the test is fair","The same battery, the same iron nail, the same wire length"]}]},{"t":"p","c":{"en":"Remember that \"not all investigations can be fair tests\". If learners are classifying leaves or observing the weather, there is no independent variable to change. Do not force every enquiry into a fair-test template.","ar":"Remember that \"not all investigations can be fair tests\". If learners are classifying leaves or observing the weather, there is no independent variable to change. Do not force every enquiry into a fair-test template."}},{"t":"h","c":{"en":"Collecting data: accurate, precise, reliable","ar":"Collecting data: accurate, precise, reliable"}},{"t":"p","c":{"en":"The framework uses three important words in Stage 7 and Stage 8: \u003cstrong>reliable\u003c/strong> (7TWSc.03 and 8TWSc.03, \"evaluate whether measurements and observations have been repeated sufficiently to be reliable\"), \u003cstrong>accurate\u003c/strong> and \u003cstrong>precise\u003c/strong> (7TWSc.04 to 9TWSc.04, \"explaining why accuracy and precision are important\"). In Stage 9 the focus moves to decision-making: 9TWSc.03 asks learners to \"decide when to increase the range of observations and measurements, and increase the extent of repetition\". The framework does not give definitions for accurate, precise and reliable, so the following are good practice classroom meanings.","ar":"The framework uses three important words in Stage 7 and Stage 8: \u003cstrong>reliable\u003c/strong> (7TWSc.03 and 8TWSc.03, \"evaluate whether measurements and observations have been repeated sufficiently to be reliable\"), \u003cstrong>accurate\u003c/strong> and \u003cstrong>precise\u003c/strong> (7TWSc.04 to 9TWSc.04, \"explaining why accuracy and precision are important\"). In Stage 9 the focus moves to decision-making: 9TWSc.03 asks learners to \"decide when to increase the range of observations and measurements, and increase the extent of repetition\". The framework does not give definitions for accurate, precise and reliable, so the following are good practice classroom meanings."}},{"t":"list","c":{"en":["\u003cstrong>Accurate:\u003c/strong> close to the true value (good practice meaning).","\u003cstrong>Precise:\u003c/strong> measurements close to each other, or measured with a small scale division (good practice meaning).","\u003cstrong>Reliable:\u003c/strong> you get similar results when you repeat the work (good practice meaning)."],"ar":["\u003cstrong>Accurate:\u003c/strong> close to the true value (good practice meaning).","\u003cstrong>Precise:\u003c/strong> measurements close to each other, or measured with a small scale division (good practice meaning).","\u003cstrong>Reliable:\u003c/strong> you get similar results when you repeat the work (good practice meaning)."]}},{"t":"p","c":{"en":"Also teach the units and symbols in the framework's appendix. For example, learners should be familiar with the multiples m (milli), c (centi), k (kilo) and M (mega), and the expected units for quantities such as time (s, min, h) and force (N). Many data errors in lower secondary come from mixed units.","ar":"Also teach the units and symbols in the framework's appendix. For example, learners should be familiar with the multiples m (milli), c (centi), k (kilo) and M (mega), and the expected units for quantities such as time (s, min, h) and force (N). Many data errors in lower secondary come from mixed units."}},{"t":"h","c":{"en":"Analysis and evaluation across the stages","ar":"Analysis and evaluation across the stages"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Judging predictions and evidence","7TWSa.01 describe the accuracy of predictions and suggest why they were or were not accurate","8TWSa.01 the same objective","9TWSa.01 evaluate the strength of the evidence and how it supports or refutes the prediction"],"ar":["Judging predictions and evidence","7TWSa.01 describe the accuracy of predictions and suggest why they were or were not accurate","8TWSa.01 the same objective","9TWSa.01 evaluate the strength of the evidence and how it supports or refutes the prediction"]},{"en":["Patterns and anomalies","7TWSa.02 describe trends and patterns, including identifying anomalous results","8TWSa.02 the same objective","9TWSa.02 also suggest why results are anomalous"],"ar":["Patterns and anomalies","7TWSa.02 describe trends and patterns, including identifying anomalous results","8TWSa.02 the same objective","9TWSa.02 also suggest why results are anomalous"]},{"en":["Conclusions","7TWSa.03 make conclusions and explain their limitations","8TWSa.03 the same objective","9TWSa.03 also describe how the conclusions can be further investigated"],"ar":["Conclusions","7TWSa.03 make conclusions and explain their limitations","8TWSa.03 the same objective","9TWSa.03 also describe how the conclusions can be further investigated"]},{"en":["Presenting data","7TWSa.05 present and interpret observations and measurements","8TWSa.05 the same (printed as 8TSWa.05)","9TWSa.05 present and interpret results, and predict results between the data points"],"ar":["Presenting data","7TWSa.05 present and interpret observations and measurements","8TWSa.05 the same (printed as 8TSWa.05)","9TWSa.05 present and interpret results, and predict results between the data points"]}]},{"t":"p","c":{"en":"Look at the pattern: Stage 8 repeats Stage 7 almost word for word, so Year 8 is the stage where skills must be practised, not introduced again. Stage 9 adds a \"why\" or a \"what next\" to each skill. 9TWSa.04 (evaluate experiments and suggest improvements) is the same in all three stages, which makes evaluation a skill to build gradually.","ar":"Look at the pattern: Stage 8 repeats Stage 7 almost word for word, so Year 8 is the stage where skills must be practised, not introduced again. Stage 9 adds a \"why\" or a \"what next\" to each skill. 9TWSa.04 (evaluate experiments and suggest improvements) is the same in all three stages, which makes evaluation a skill to build gradually."}},{"t":"h","c":{"en":"A worked example: an anomalous result","ar":"A worked example: an anomalous result"}},{"t":"p","c":{"en":"Year 8 learners test how many paper clips an electromagnet lifts with 5, 10, 15 and 20 turns. Their table shows 3, 6, 9 and 21 clips. What should the teacher ask?","ar":"Year 8 learners test how many paper clips an electromagnet lifts with 5, 10, 15 and 20 turns. Their table shows 3, 6, 9 and 21 clips. What should the teacher ask?"}},{"t":"steps","c":{"en":["\u003cstrong>Describe the pattern\u003c/strong> (8TWSa.02): \"The number of clips rises by 3 for each 5 turns, but the last result is much higher.\"","\u003cstrong>Identify the anomaly:\u003c/strong> 21 does not fit the pattern. Check the record first. Was a result copied wrongly? Was the battery changed?","\u003cstrong>Decide what to do\u003c/strong> (8TWSc.03): repeat the 20-turn measurement. If the repeat gives 12, the 21 was an error and the pattern holds.","\u003cstrong>Conclude with limits\u003c/strong> (8TWSa.03): \"More turns lifted more clips. We only tested up to 20 turns, so we cannot say what happens beyond that.\"","\u003cstrong>Evaluate\u003c/strong> (8TWSa.04): \"A battery that weakens during the test would change the results. Next time we would use a fresh battery and switch off between readings.\""],"ar":["\u003cstrong>Describe the pattern\u003c/strong> (8TWSa.02): \"The number of clips rises by 3 for each 5 turns, but the last result is much higher.\"","\u003cstrong>Identify the anomaly:\u003c/strong> 21 does not fit the pattern. Check the record first. Was a result copied wrongly? Was the battery changed?","\u003cstrong>Decide what to do\u003c/strong> (8TWSc.03): repeat the 20-turn measurement. If the repeat gives 12, the 21 was an error and the pattern holds.","\u003cstrong>Conclude with limits\u003c/strong> (8TWSa.03): \"More turns lifted more clips. We only tested up to 20 turns, so we cannot say what happens beyond that.\"","\u003cstrong>Evaluate\u003c/strong> (8TWSa.04): \"A battery that weakens during the test would change the results. Next time we would use a fresh battery and switch off between readings.\""]}},{"t":"scenario","title":{"en":"Scenario: \"The graph is perfect, so there is nothing to evaluate\"","ar":"Scenario: \"The graph is perfect, so there is nothing to evaluate\""},"c":{"en":"A Year 9 group has a tidy line graph of reaction rate against temperature and says there is nothing to improve. How do you push their thinking? Use 9TWSa.01 and 9TWSa.04: ask how strong the evidence is (how many repeats, how many temperatures, was the volume of acid always the same?), and what extra data would show whether the pattern continues. Use 9TWSa.05 to ask them to predict the result between two plotted points, and then test it. A good evaluation always has a reason, not just \"we could be more careful\".","ar":"A Year 9 group has a tidy line graph of reaction rate against temperature and says there is nothing to improve. How do you push their thinking? Use 9TWSa.01 and 9TWSa.04: ask how strong the evidence is (how many repeats, how many temperatures, was the volume of acid always the same?), and what extra data would show whether the pattern continues. Use 9TWSa.05 to ask them to predict the result between two plotted points, and then test it. A good evaluation always has a reason, not just \"we could be more careful\"."}}],"checks":[{"id":"m3q1","q":{"en":"Which statement matches the framework's glossary?","ar":"Which statement matches the framework's glossary?"},"opts":[{"en":"An investigation and an experiment mean exactly the same thing in every scientific enquiry","ar":"An investigation and an experiment mean exactly the same thing in every scientific enquiry"},{"en":"An investigation always needs a fair test with an independent and a dependent variable","ar":"An investigation always needs a fair test with an independent and a dependent variable"},{"en":"An investigation often involves experiments, but not always, for example when only secondary sources are used","ar":"An investigation often involves experiments, but not always, for example when only secondary sources are used"},{"en":"An experiment is a method that uses only secondary sources of information to answer a question, with no practical work","ar":"An experiment is a method that uses only secondary sources of information to answer a question, with no practical work"}],"correct":2,"expl":{"en":"The glossary defines an investigation as a method of acquiring knowledge based on a starting question and says it often involves experiments but not always (for example a literature review).","ar":"The glossary defines an investigation as a method of acquiring knowledge based on a starting question and says it often involves experiments but not always (for example a literature review)."}},{"id":"m3q2","q":{"en":"What does the framework say in 7TWSp.04 about fair tests?","ar":"What does the framework say in 7TWSp.04 about fair tests?"},"opts":[{"en":"Every investigation at lower secondary must be written as a fair test with three variables","ar":"Every investigation at lower secondary must be written as a fair test with three variables"},{"en":"Fair tests are only for Stage 9 and learners must not meet them in Stage 7","ar":"Fair tests are only for Stage 9 and learners must not meet them in Stage 7"},{"en":"Fair tests have been replaced by reading about secondary sources in every investigation","ar":"Fair tests have been replaced by reading about secondary sources in every investigation"},{"en":"Learners should recognise that not all investigations can be fair tests","ar":"Learners should recognise that not all investigations can be fair tests"}],"correct":3,"expl":{"en":"7TWSp.04 asks learners to plan a range of investigations of different types, considering variables appropriately, and to recognise that not all investigations can be fair tests.","ar":"7TWSp.04 asks learners to plan a range of investigations of different types, considering variables appropriately, and to recognise that not all investigations can be fair tests."}},{"id":"m3q3","q":{"en":"A group has results of 4, 5, 4 and 14 for the same measurement. Which action best follows 8TWSa.02 and 8TWSc.03?","ar":"A group has results of 4, 5, 4 and 14 for the same measurement. Which action best follows 8TWSa.02 and 8TWSc.03?"},"opts":[{"en":"Identify 14 as anomalous, check the record, and repeat the measurement to see whether it is reliable","ar":"Identify 14 as anomalous, check the record, and repeat the measurement to see whether it is reliable"},{"en":"Delete the value 14 at once and report the average of the other three results only","ar":"Delete the value 14 at once and report the average of the other three results only"},{"en":"Keep all four results and report the average of 4, 5, 4 and 14 as the final result","ar":"Keep all four results and report the average of 4, 5, 4 and 14 as the final result"},{"en":"Repeat the other three measurements twice more, because only the middle results can ever be trusted","ar":"Repeat the other three measurements twice more, because only the middle results can ever be trusted"}],"correct":0,"expl":{"en":"8TWSa.02 asks learners to identify anomalous results and 8TWSc.03 asks whether measurements have been repeated sufficiently to be reliable. Checking and repeating is better than deleting without a reason.","ar":"8TWSa.02 asks learners to identify anomalous results and 8TWSc.03 asks whether measurements have been repeated sufficiently to be reliable. Checking and repeating is better than deleting without a reason."}}]},{"id":"m4","title":{"en":"Health and Safety, Animal Welfare and Teaching Human Reproduction","ar":"Health and Safety, Animal Welfare and Teaching Human Reproduction"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework has three short sections in its curriculum overview that every science teacher must know well: \"Health and safety\", \"Animal welfare and the use of animals in science\" and \"Teaching human reproduction\". This module reports what each section says as exactly as possible, then explains how to apply it. Where a point is not in the framework, it is labelled \u003cstrong>good practice\u003c/strong>. For all safety decisions, follow your school's science safety guidance and speak to your HOD.","ar":"The framework has three short sections in its curriculum
