ds, then combine the results of the whole class (for example 28 pupils, 280 tosses). Ask: \"Which result is closer to half heads, your 10 tosses or the class 280 tosses?\" This shows that large numbers of trials give more reliable results. This is good practice and matches the objective's focus on small and large numbers of trials."}},{"t":"h","c":{"en":"Prior experience expected before Stage 1","ar":"Prior experience expected before Stage 1"}},{"t":"p","c":{"en":"The framework includes a section on the prior experience of mathematics that learners should have before they start Stage 1. It says this is expected of all learners. It also says that if learners attended kindergarten, they may already achieve some Stage 1 objectives, and teachers should adapt their Stage 1 teaching accordingly. At PEPS, this is the link between FS2 and Year 1.","ar":"The framework includes a section on the prior experience of mathematics that learners should have before they start Stage 1. It says this is expected of all learners. It also says that if learners attended kindergarten, they may already achieve some Stage 1 objectives, and teachers should adapt their Stage 1 teaching accordingly. At PEPS, this is the link between FS2 and Year 1."}},{"t":"table","head":{"en":["Area","Expected before Stage 1 (summary)"],"ar":["Area","Expected before Stage 1 (summary)"]},"rows":[{"en":["Number","Develop number awareness verbally (counting forwards and backwards, chanting, songs); recognise numbers 1 to 10, including touch-counting, one-to-one correspondence, and sharing into two equal groups in play; record numbers through mark-making; make repeating colour patterns with beads or counters and say what comes next"],"ar":["Number","Develop number awareness verbally (counting forwards and backwards, chanting, songs); recognise numbers 1 to 10, including touch-counting, one-to-one correspondence, and sharing into two equal groups in play; record numbers through mark-making; make repeating colour patterns with beads or counters and say what comes next"]},{"en":["Geometry and Measure","Name and sort common 2D and 3D shapes; use everyday language of direction and distance; compare length or mass using words such as longer, shorter, heavier; name units of time (days, yesterday, today, tomorrow, morning, evening)"],"ar":["Geometry and Measure","Name and sort common 2D and 3D shapes; use everyday language of direction and distance; compare length or mass using words such as longer, shorter, heavier; name units of time (days, yesterday, today, tomorrow, morning, evening)"]},{"en":["Statistics and Probability","Represent and interpret data using pictorial representations or concrete materials"],"ar":["Statistics and Probability","Represent and interpret data using pictorial representations or concrete materials"]},{"en":["Thinking and Working Mathematically","Explore mathematical ideas using language and strategies that are personal to them"],"ar":["Thinking and Working Mathematically","Explore mathematical ideas using language and strategies that are personal to them"]}]},{"t":"scenario","title":{"en":"Scenario: planning the first weeks of Year 1","ar":"Scenario: planning the first weeks of Year 1"},"c":{"en":"A Year 1 teacher discovers that some pupils can count to 20 and recognise numbers to 10, while others have not yet secured one-to-one correspondence. The framework says prior experience such as touch-counting and one-to-one correspondence is expected before Stage 1, and that teaching should be adapted. The teacher begins with practical counting games for all pupils, uses 1Nc.01 as the target (count objects 0 to 20 with conservation of number and one-to-one correspondence), and gives more challenging counting-on tasks (1Nc.04) to those who are ready.","ar":"A Year 1 teacher discovers that some pupils can count to 20 and recognise numbers to 10, while others have not yet secured one-to-one correspondence. The framework says prior experience such as touch-counting and one-to-one correspondence is expected before Stage 1, and that teaching should be adapted. The teacher begins with practical counting games for all pupils, uses 1Nc.01 as the target (count objects 0 to 20 with conservation of number and one-to-one correspondence), and gives more challenging counting-on tasks (1Nc.04) to those who are ready."}}],"checks":[{"id":"m8q1","q":{"en":"Which list gives the four parts of the statistical enquiry cycle shown in the framework?","ar":"Which list gives the four parts of the statistical enquiry cycle shown in the framework?"},"opts":[{"en":"Ask a question; collect the data; draw a graph; write a conclusion for the class report and share it with the whole school","ar":"Ask a question; collect the data; draw a graph; write a conclusion for the class report and share it with the whole school"},{"en":"Specify the problem and plan; record, organise and represent data; interpret data; discuss data and check predictions","ar":"Specify the problem and plan; record, organise and represent data; interpret data; discuss data and check predictions"},{"en":"Specify the problem and plan; collect data; calculate the averages; present the final report","ar":"Specify the problem and plan; collect data; calculate the averages; present the final report"},{"en":"Plan the survey; record the data; interpret the data; choose a new problem and start again","ar":"Plan the survey; record the data; interpret the data; choose a new problem and start again"}],"correct":1,"expl":{"en":"The cycle diagram has four parts: specify the problem and plan, record, organise and represent data, interpret data, and discuss data and check predictions.","ar":"The cycle diagram has four parts: specify the problem and plan, record, organise and represent data, interpret data, and discuss data and check predictions."}},{"id":"m8q2","q":{"en":"Which question is a statistical question according to the framework glossary?","ar":"Which question is a statistical question according to the framework glossary?"},"opts":[{"en":"What is your favourite fruit to eat at lunch?","ar":"What is your favourite fruit to eat at lunch?"},{"en":"How old are you in years and months today?","ar":"How old are you in years and months today?"},{"en":"Which fruits do people in this class like?","ar":"Which fruits do people in this class like?"},{"en":"What is the name of your class?","ar":"What is the name of your class?"}],"correct":2,"expl":{"en":"The glossary defines a statistical question as one that has variable answers, with the example \"Which fruits do people in this class like?\".","ar":"The glossary defines a statistical question as one that has variable answers, with the example \"Which fruits do people in this class like?\"."}},{"id":"m8q3","q":{"en":"What does the framework say about learners who attended kindergarten before Stage 1?","ar":"What does the framework say about learners who attended kindergarten before Stage 1?"},"opts":[{"en":"They must start in Stage 2, because kindergarten completes all the Stage 1 objectives","ar":"They must start in Stage 2, because kindergarten completes all the Stage 1 objectives"},{"en":"They should repeat the whole prior experience section before beginning the Stage 1 work","ar":"They should repeat the whole prior experience section before beginning the Stage 1 work"},{"en":"They should be assessed with the Cambridge Primary Checkpoint before they enter Stage 1","ar":"They should be assessed with the Cambridge Primary Checkpoint before they enter Stage 1"},{"en":"They may achieve some Stage 1 objectives already, so Stage 1 teaching should be adapted","ar":"They may achieve some Stage 1 objectives already, so Stage 1 teaching should be adapted"}],"correct":3,"expl":{"en":"The framework says that learners who attended kindergarten may achieve some Stage 1 objectives before starting, and teachers should adapt their Stage 1 teaching.","ar":"The framework says that learners who attended kindergarten may achieve some Stage 1 objectives before starting, and teachers should adapt their Stage 1 teaching."}}]},{"id":"m9","title":{"en":"Reading the Progression Across Stages and Using the Framework","ar":"Reading the Progression Across Stages and Using the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that \"to enable effective progression in your teaching, you need to be familiar with the progression of skills across stages\". It adds that every stage provides clear progression from the previous stage and to the next, and that this helps you build on prior learning. This final module shows you how to read the framework across stages, not only within one.","ar":"The framework says that \"to enable effective progression in your teaching, you need to be familiar with the progression of skills across stages\". It adds that every stage provides clear progression from the previous stage and to the next, and that this helps you build on prior learning. This final module shows you how to read the framework across stages, not only within one."}},{"t":"h","c":{"en":"Tracing one idea from Stage 1 to Stage 6","ar":"Tracing one idea from Stage 1 to Stage 6"}},{"t":"p","c":{"en":"Choose a code letter and read down the stages. The table below traces \u003cstrong>fractions as operators\u003c/strong>, meaning finding a fraction of a quantity.","ar":"Choose a code letter and read down the stages. The table below traces \u003cstrong>fractions as operators\u003c/strong>, meaning finding a fraction of a quantity."}},{"t":"table","head":{"en":["Stage","Objective","What changes"],"ar":["Stage","Objective","What changes"]},"rows":[{"en":["1","1Nf.03 A half as an operator (whole number answers)","Half only"],"ar":["1","1Nf.03 A half as an operator (whole number answers)","Half only"]},{"en":["2","2Nf.04 Half, quarter and three-quarters as operators","Quarters appear"],"ar":["2","2Nf.04 Half, quarter and three-quarters as operators","Quarters appear"]},{"en":["3","3Nf.05 Half, quarter, three-quarters, third and tenth","Thirds and tenths appear"],"ar":["3","3Nf.05 Half, quarter, three-quarters, third and tenth","Thirds and tenths appear"]},{"en":["4","4Nf.03 Unit fractions as operators","Any unit fraction"],"ar":["4","4Nf.03 Unit fractions as operators","Any unit fraction"]},{"en":["5","5Nf.02 Proper fractions as operators","Fractions with numerators greater than 1"],"ar":["5","5Nf.02 Proper fractions as operators","Fractions with numerators greater than 1"]},{"en":["6","6Nf.02 Proper and improper fractions as operators","Improper fractions"],"ar":["6","6Nf.02 Proper and improper fractions as operators","Improper fractions"]}]},{"t":"p","c":{"en":"A second trace is \u003cstrong>even and odd numbers\u003c/strong>: 1Nc.05 (every other number, 0 to 20), 2Nc.05 (characteristics, 0 to 100), 3Nc.03 (use knowledge up to 10 to recognise and sort numbers) and 4Nc.02 (generalisations when adding and subtracting even and odd numbers). You can see the idea move from noticing a pattern to explaining a rule, which is Generalising in TWM.","ar":"A second trace is \u003cstrong>even and odd numbers\u003c/strong>: 1Nc.05 (every other number, 0 to 20), 2Nc.05 (characteristics, 0 to 100), 3Nc.03 (use knowledge up to 10 to recognise and sort numbers) and 4Nc.02 (generalisations when adding and subtracting even and odd numbers). You can see the idea move from noticing a pattern to explaining a rule, which is Generalising in TWM."}},{"t":"callout","k":"tip","title":{"en":"Try this with your own year group","ar":"Try this with your own year group"},"c":{"en":"Pick one objective you teach this term. Write its code, then find the objectives with the same sub-strand code in the stage before and the stage after. Ask: What must pupils already know? What will they do next? You will often find that your own objective is clearer when you see both.","ar":"Pick one objective you teach this term. Write its code, then find the objectives with the same sub-strand code in the stage before and the stage after. Ask: What must pupils already know? What will they do next? You will often find that your own objective is clearer when you see both."}},{"t":"h","c":{"en":"Spotting prerequisites and gaps","ar":"Spotting prerequisites and gaps"}},{"t":"steps","c":{"en":["\u003cstrong>Find the objective\u003c/strong> for the work and note its sub-strand code, for example 6Nf.05 (add and subtract fractions with different denominators).","\u003cstrong>Look back one or two stages\u003c/strong> in the same sub-strand. Here you find 5Nf.05 (denominators that are multiples of each other), 4Nf.05 (same denominator) and equivalence in 3Nf.06 and 4Nf.04.","\u003cstrong>Check related sub-strands.\u003c/strong> The prerequisite may be elsewhere, for example 3Ni.04 for regrouping in calculation.","\u003cstrong>Check what the pupils can do now,\u003c/strong> using a short task or question rather than assuming.","\u003cstrong>Plan a bridge.\u003c/strong> If one step is missing, teach it briefly before the new objective, using concrete or pictorial models (CRA)."],"ar":["\u003cstrong>Find the objective\u003c/strong> for the work and note its sub-strand code, for example 6Nf.05 (add and subtract fractions with different denominators).","\u003cstrong>Look back one or two stages\u003c/strong> in the same sub-strand. Here you find 5Nf.05 (denominators that are multiples of each other), 4Nf.05 (same denominator) and equivalence in 3Nf.06 and 4Nf.04.","\u003cstrong>Check related sub-strands.\u003c/strong> The prerequisite may be elsewhere, for example 3Ni.04 for regrouping in calculation.","\u003cstrong>Check what the pupils can do now,\u003c/strong> using a short task or question rather than assuming.","\u003cstrong>Plan a bridge.\u003c/strong> If one step is missing, teach it briefly before the new objective, using concrete or pictorial models (CRA)."]}},{"t":"p","c":{"en":"More examples of prerequisites: 5Gg.08 (angles on a straight line sum to 180°) builds on 3Gg.10 (a straight line is two right angles or a half turn). 6Gg.10 (angles in a triangle) builds on 5Gg.08. 4Gg.03 (derive formulae for area and perimeter of rectangles) builds on 3Gg.03 and 3Gg.04. Learners who struggle at the later objective often need the earlier idea.","ar":"More examples of prerequisites: 5Gg.08 (angles on a straight line sum to 180°) builds on 3Gg.10 (a straight line is two right angles or a half turn). 6Gg.10 (angles in a triangle) builds on 5Gg.08. 4Gg.03 (derive formulae for area and perimeter of rectangles) builds on 3Gg.03 and 3Gg.04. Learners who struggle at the later objective often need the earlier idea."}},{"t":"callout","k":"warn","title":{"en":"A gap is not always a \"weak pupil\"","ar":"A gap is not always a \"weak pupil\""},"c":{"en":"Sometimes a gap is caused by a change of school or system, by absence, or by language. The framework itself says that learners may start at slightly different ages and bring different experience. Check, support and move on; do not label.","ar":"Sometimes a gap is caused by a change of school or system, by absence, or by language. The framework itself says that learners may start at slightly different ages and bring different experience. Check, support and move on; do not label."}},{"t":"h","c":{"en":"Stage 6, the Checkpoint year and Lower Secondary","ar":"Stage 6, the Checkpoint year and Lower Secondary"}},{"t":"p","c":{"en":"At PEPS, Year 6 (Stage 6) is the Cambridge Primary Checkpoint year, and pupils move on to Cambridge Lower Secondary in Year 7. The framework tells you that Cambridge Primary Checkpoint tests were to be available from 2023, and that Cambridge provides assessments designed to complement the framework for Stages 3 to 6. It also says that the reporting codes (Nc, Nf and so on) appear in the feedback reports for tests. This is a strong reason to know the codes: when a report refers to Nf or Gg, you can identify the sub-strand and look back through the stages.","ar":"At PEPS, Year 6 (Stage 6) is the Cambridge Primary Checkpoint year, and pupils move on to Cambridge Lower Secondary in Year 7. The framework tells you that Cambridge Primary Checkpoint tests were to be available from 2023, and that Cambridge provides assessments designed to complement the framework for Stages 3 to 6. It also says that the reporting codes (Nc, Nf and so on) appear in the feedback reports for tests. This is a strong reason to know the codes: when a report refers to Nf or Gg, you can identify the sub-strand and look back through the stages."}},{"t":"p","c":{"en":"For exact information on what the Checkpoint covers, how it is reported and how it relates to your school's assessment calendar, use the School Support Hub and your HOD. The framework says that the pathway leads from primary to secondary and that each step builds on the previous one, and it notes that progression information is available on the School Support Hub.","ar":"For exact information on what the Checkpoint covers, how it is reported and how it relates to your school's assessment calendar, use the School Support Hub and your HOD. The framework says that the pathway leads from primary to secondary and that each step builds on the previous one, and it notes that progression information is available on the School Support Hub."}},{"t":"table","head":{"en":["Stage 6 ends with ...","Examples (codes)","Why it matters next"],"ar":["Stage 6 ends with ...","Examples (codes)","Why it matters next"]},"rows":[{"en":["Fractions, decimals and percentages with equivalence","6Nf.04, 6Nf.07, 6Nf.08","A secure base for later work with number"],"ar":["Fractions, decimals and percentages with equivalence","6Nf.04, 6Nf.07, 6Nf.08","A secure base for later work with number"]},{"en":["Ratio and direct proportion","6Nf.12, 6Nf.13","Ideas that develop further in later stages"],"ar":["Ratio and direct proportion","6Nf.12, 6Nf.13","Ideas that develop further in later stages"]},{"en":["Coordinates in four quadrants and transformations","6Gp.01, 6Gp.04, 6Gp.05","Position and transformation continue in later stages"],"ar":["Coordinates in four quadrants and transformations","6Gp.01, 6Gp.04, 6Gp.05","Position and transformation continue in later stages"]},{"en":["Statistical measures and predictions","6Ss.03, 6Ss.04","Interpretation and the enquiry cycle continue"],"ar":["Statistical measures and predictions","6Ss.03, 6Ss.04","Interpretation and the enquiry cycle continue"]}]},{"t":"p","c":{"en":"The third column is general guidance, not a statement from the framework. For specifics, look at the next Cambridge framework.","ar":"The third column is general guidance, not a statement from the framework. For specifics, look at the next Cambridge framework."}},{"t":"h","c":{"en":"Using the glossary","ar":"Using the glossary"}},{"t":"p","c":{"en":"The framework glossary is \"provided to support your understanding of the content\". It is short and useful for staff and for planning mathematical language lessons for ESL learners. Several terms mean exactly what the objectives need:","ar":"The framework glossary is \"provided to support your understanding of the content\". It is short and useful for staff and for planning mathematical language lessons for ESL learners. Several terms mean exactly what the objectives need:"}},{"t":"table","head":{"en":["Glossary term","Why it matters"],"ar":["Glossary term","Why it matters"]},"rows":[{"en":["Draw and Sketch","Tell you how accurate pupils' work must be (Module 7)"],"ar":["Draw and Sketch","Tell you how accurate pupils' work must be (Module 7)"]},{"en":["Complements of a number","Same as number bonds or number pairs; used in 1Ni.04, 2Ni.03 and 3Ni.03"],"ar":["Complements of a number","Same as number bonds or number pairs; used in 1Ni.04, 2Ni.03 and 3Ni.03"]},{"en":["Compose, decompose, regroup","Language of place value and calculation (Module 5)"],"ar":["Compose, decompose, regroup","Language of place value and calculation (Module 5)"]},{"en":["Bridge through 60","Marks the step from Stage 4 to Stage 5 in time intervals"],"ar":["Bridge through 60","Marks the step from Stage 4 to Stage 5 in time intervals"]},{"en":["Statistical and non-statistical question","Decides the type of investigation pupils plan (Module 8)"],"ar":["Statistical and non-statistical question","Decides the type of investigation pupils plan (Module 8)"]},{"en":["Proportion and ratio","Part-to-whole and part-to-part (Module 6)"],"ar":["Proportion and ratio","Part-to-whole and part-to-part (Module 6)"]}]},{"t":"h","c":{"en":"Quick consolidation","ar":"Quick consolidation"}},{"t":"table","head":{"en":["Sub-strand","The journey from Stage 1 to Stage 6 in one line"],"ar":["Sub-strand","The journey from Stage 1 to Stage 6 in one line"]},"rows":[{"en":["Nc","Counting to 20, then to 100 and 1000; steps and negatives; patterns become sequences, unknowns and letters"],"ar":["Nc","Counting to 20, then to 100 and 1000; steps and negatives; patterns become sequences, unknowns and letters"]},{"en":["Ni","Add and subtract to 20; multiplication and division; times tables; factors, primes and squares; laws and order of operations"],"ar":["Ni","Add and subtract to 20; multiplication and division; times tables; factors, primes and squares; laws and order of operations"]},{"en":["Nm","Recognise local money; compare coins and notes; decimal notation and giving change (the last Nm objectives are in Stage 3)"],"ar":["Nm","Recognise local money; compare coins and notes; decimal notation and giving change (the last Nm objectives are in Stage 3)"]},{"en":["Np","Zero and teens; 2- and 3-digit place value; all whole numbers; tenths and hundredths; thousandths"],"ar":["Np","Zero and teens; 2- and 3-digit place value; all whole numbers; tenths and hundredths; thousandths"]},{"en":["Nf","Halves, quarters, other fractions; percentages (Stage 4); decimals and ratio (Stage 5); different denominators and direct proportion (Stage 6)"],"ar":["Nf","Halves, quarters, other fractions; percentages (Stage 4); decimals and ratio (Stage 5); different denominators and direct proportion (Stage 6)"]},{"en":["Gt","Hour and half hour; five minutes; timetables; 24-hour clock; time zones; decimal and mixed units"],"ar":["Gt","Hour and half hour; five minutes; timetables; 24-hour clock; time zones; decimal and mixed units"]},{"en":["Gg","Sorting shapes; measuring; perimeter and area; angles; nets; symmetry; circles and triangles"],"ar":["Gg","Sorting shapes; measuring; perimeter and area; angles; nets; symmetry; circles and triangles"]},{"en":["Gp","Describe position; reflect; coordinates in the first quadrant; translate; four quadrants and rotate"],"ar":["Gp","Describe position; reflect; coordinates in the first quadrant; translate; four quadrants and rotate"]},{"en":["Ss","Questions, tables and block graphs; tally and bar charts; dot plots; continuous data and median; mean, range and scatter graphs"],"ar":["Ss","Questions, tables and block graphs; tally and bar charts; dot plots; continuous data and median; mean, range and scatter graphs"]},{"en":["Sp","Pattern language; chance words; trials; equally likely; mutually exclusive events and large trials"],"ar":["Sp","Pattern language; chance words; trials; equally likely; mutually exclusive events and large trials"]}]},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> The framework is a set of learning objectives, grouped into three strands and ten sub-strands, with Thinking and Working Mathematically embedded across them. \u003cstrong>2.\u003c/strong> A code such as 1Nc.05 tells you the stage, the sub-strand and the order number in that stage, and the reporting code links to test feedback. \u003cstrong>3.\u003c/strong> Teaching time (4 to 5 hours a week, about 120 to 150 hours a stage) is for guidance and varies, and schemes of work are not compulsory. \u003cstrong>4.\u003c/strong> Read across stages to see prerequisites: percentages begin in Stage 4, decimals and ratio in Stage 5, and the verbs draw and sketch have different meanings. \u003cstrong>5.\u003c/strong> Use the glossary, the objective lists and the School Support Hub for exact wording and resources. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.","ar":"\u003cstrong>1.\u003c/strong> The framework is a set of learning objectives, grouped into three strands and ten sub-strands, with Thinking and Working Mathematically embedded across them. \u003cstrong>2.\u003c/strong> A code such as 1Nc.05 tells you the stage, the sub-strand and the order number in that stage, and the reporting code links to test feedback. \u003cstrong>3.\u003c/strong> Teaching time (4 to 5 hours a week, about 120 to 150 hours a stage) is for guidance and varies, and schemes of work are not compulsory. \u003cstrong>4.\u003c/strong> Read across stages to see prerequisites: percentages begin in Stage 4, decimals and ratio in Stage 5, and the verbs draw and sketch have different meanings. \u003cstrong>5.\u003c/strong> Use the glossary, the objective lists and the School Support Hub for exact wording and resources. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance."}}],"checks":[{"id":"m9q1","q":{"en":"A Year 6 teacher finds that pupils cannot add fractions with different denominators (6Nf.05). What is the best way to use the framework to find the gap?","ar":"A Year 6 teacher finds that pupils cannot add fractions with different denominators (6Nf.05). What is the best way to use the framework to find the gap?"},"opts":[{"en":"Look back at 5Nf.05, 4Nf.05 and the equivalence objectives to find the missing step","ar":"Look back at 5Nf.05, 4Nf.05 and the equivalence objectives to find the missing step"},{"en":"Move forward to the Lower Secondary framework and teach its fractions objectives to the whole class","ar":"Move forward to the Lower Secondary framework and teach it  symbol"},{"en":"Write the division symbol and a rule on the board, then give practice with objects afterwards","ar":"Write the division symbol and a rule on the board, then give practice with objects afterwards"},{"en":"Show a diagram of equal groups first, then ask pupils to remember the rule for the symbol","ar":"Show a diagram of equal groups first, then ask pupils to remember the rule for the symbol"},{"en":"Ask pupils to learn the division facts by heart, then show how objects can be used later","ar":"Ask pupils to learn the division facts by heart, then show how objects can be used later"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A scheme of work says \"6Gg.09\". What can you tell from the code alone?","ar":"A scheme of work says \"6Gg.09\". What can you tell from the code alone?"},"opts":[{"en":"It is Year 9 work in Geometry, and the sixth objective for that year group in the framework","ar":"It is Year 9 work in Geometry, and the sixth objective for that year group in the framework"},{"en":"It is Stage 6, in Geometrical reasoning, shapes and measurements, and the ninth objective there","ar":"It is Stage 6, in Geometrical reasoning, shapes and measurements, and the ninth objective there"},{"en":"It is Stage 6, in Geometry and Measure as a whole, and the ninth objective in the strand","ar":"It is Stage 6, in Geometry and Measure as a whole, and the ninth objective in the strand"},{"en":"It is the sixth objective in Stage 9, which belongs to Statistics and Probability","ar":"It is the sixth objective in Stage 9, which belongs to Statistics and Probability"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"Two teachers disagree. One says 2Nf.05 and 3Nf.05 are the same idea in different years. What is the best explanation?","ar":"Two teachers disagree. One says 2Nf.05 and 3Nf.05 are the same idea in different years. What is the best explanation?"},"opts":[{"en":"The last number links an idea across stages, so 05 always means the same skill in every stage","ar":"Th }

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
