#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"primary-maths-framework-a","code":"PMA","passMark":80,"hours":"2.5 hours","accent":"#1F6FB2","accentSoft":"#E3EEF9","eyebrow":{"en":"Staff CPD · Cambridge Primary Mathematics 0096 · Part A","ar":"Staff CPD · Cambridge Primary Mathematics 0096 · Part A"},"title":{"en":"Understanding the Cambridge Primary Mathematics Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Primary Mathematics Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for primary teachers, HODs and new staff: why the framework exists, how it is organised, how to read a learning-objective code, what Thinking and Working Mathematically means, and how each strand of mathematics develops from Stage 1 to Stage 6.","ar":"A self-paced guide for primary teachers, HODs and new staff: why the framework exists, how it is organised, how to read a learning-objective code, what Thinking and Working Mathematically means, and how each strand of mathematics develops from Stage 1 to Stage 6."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Primary Mathematics 0096 Curriculum Framework (v2.1)","ar":"Cambridge Primary Mathematics 0096 Curriculum Framework (v2.1)"},"source":{"en":"Cambridge Primary Mathematics 0096 Curriculum Framework, version 2.1 (first published September 2020; latest version published June 2025). Please check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Primary Mathematics 0096 Curriculum Framework, version 2.1 (first published September 2020; latest version published June 2025). Please check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway and Support","ar":"Why This Framework? Purpose, Pathway and Support"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD helps you understand the Cambridge Primary Mathematics 0096 Curriculum Framework as a working tool, not just a list of topics. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe its aims and the Cambridge learner attributes; read a learning-objective code such as 1Nc.05; use the eight Thinking and Working Mathematically characteristics; and trace how each strand of mathematics grows from Stage 1 to Stage 6. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> It is Part A of a two-part series; see Part B for the rest of the series.","ar":"This CPD helps you understand the Cambridge Primary Mathematics 0096 Curriculum Framework as a working tool, not just a list of topics. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe its aims and the Cambridge learner attributes; read a learning-objective code such as 1Nc.05; use the eight Thinking and Working Mathematically characteristics; and trace how each strand of mathematics grows from Stage 1 to Stage 6. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> It is Part A of a two-part series; see Part B for the rest of the series."}},{"t":"p","c":{"en":"At PEPS, Years 1 to 6 follow Cambridge Primary Mathematics 0096. The official description of that programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It is a document that says what learners should know, understand and be able to do in mathematics at each stage. It does not give lesson plans and it does not tell you which textbook to use. It sets the target, and you and your colleagues plan the route.","ar":"At PEPS, Years 1 to 6 follow Cambridge Primary Mathematics 0096. The official description of that programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It is a document that says what learners should know, understand and be able to do in mathematics at each stage. It does not give lesson plans and it does not tell you which textbook to use. It sets the target, and you and your colleagues plan the route."}},{"t":"p","c":{"en":"Many teachers meet the framework only through a scheme of work or a textbook. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why are we teaching halves in Year 1 and quarters in Year 2? Where does percentage first appear? What should a Year 4 pupil already know about place value? This module gives you the foundation for answering them.","ar":"Many teachers meet the framework only through a scheme of work or a textbook. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why are we teaching halves in Year 1 and quarters in Year 2? Where does percentage first appear? What should a Year 4 pupil already know about place value? This module gives you the foundation for answering them."}},{"t":"h","c":{"en":"What the framework says about its purpose","ar":"What the framework says about its purpose"}},{"t":"p","c":{"en":"The framework describes Cambridge Primary Mathematics as a programme that encourages lifelong enthusiasm for analytical and rational thinking. Learners develop a holistic understanding of the subject, with a focus on principles, patterns, systems, functions and relationships. The aim is that they become mathematically competent and fluent in computation, and that they can apply this to everyday situations.","ar":"The framework describes Cambridge Primary Mathematics as a programme that encourages lifelong enthusiasm for analytical and rational thinking. Learners develop a holistic understanding of the subject, with a focus on principles, patterns, systems, functions and relationships. The aim is that they become mathematically competent and fluent in computation, and that they can apply this to everyday situations."}},{"t":"p","c":{"en":"The framework lists several key benefits. In plain English, the main ones are:","ar":"The framework lists several key benefits. In plain English, the main ones are:"}},{"t":"list","c":{"en":["\u003cstrong>Thinking and Working Mathematically.\u003c/strong> The framework calls this \"a unique feature\". Learners talk with others, challenge ideas and give evidence for their answers. You will study it in Module 4.","\u003cstrong>Clear progression.\u003c/strong> The framework is structured to support progression of knowledge and skills within each stage and across the primary stages.","\u003cstrong>Number as the foundation.\u003c/strong> The Number strand is described as the foundation of primary mathematics. Learners build number fluency and then use it in other strands and in their own lives.","\u003cstrong>Geometry and Measure.\u003c/strong> Learners develop spatial awareness and use number skills in real contexts, such as measuring and describing position.","\u003cstrong>Statistics and Probability.\u003c/strong> There is an emphasis on the statistical enquiry cycle and on interpreting statistics, which helps learners understand the data they meet in everyday life."],"ar":["\u003cstrong>Thinking and Working Mathematically.\u003c/strong> The framework calls this \"a unique feature\". Learners talk with others, challenge ideas and give evidence for their answers. You will study it in Module 4.","\u003cstrong>Clear progression.\u003c/strong> The framework is structured to support progression of knowledge and skills within each stage and across the primary stages.","\u003cstrong>Number as the foundation.\u003c/strong> The Number strand is described as the foundation of primary mathematics. Learners build number fluency and then use it in other strands and in their own lives.","\u003cstrong>Geometry and Measure.\u003c/strong> Learners develop spatial awareness and use number skills in real contexts, such as measuring and describing position.","\u003cstrong>Statistics and Probability.\u003c/strong> There is an emphasis on the statistical enquiry cycle and on interpreting statistics, which helps learners understand the data they meet in everyday life."]}},{"t":"callout","k":"tip","title":{"en":"Why this matters for ESL learners","ar":"Why this matters for ESL learners"},"c":{"en":"Every PEPS pupil is learning English as a second language. The framework's focus on explaining, justifying and communicating ideas means that mathematical language is part of the curriculum, not an extra. Good practice: plan the key words and sentence stems for each lesson in advance, for example \"The answer is ... because ...\".","ar":"Every PEPS pupil is learning English as a second language. The framework's focus on explaining, justifying and communicating ideas means that mathematical language is part of the curriculum, not an extra. Good practice: plan the key words and sentence stems for each lesson in advance, for example \"The answer is ... because ...\"."}},{"t":"h","c":{"en":"The Cambridge Pathway and ages","ar":"The Cambridge Pathway and ages"}},{"t":"p","c":{"en":"The framework explains that the primary programme is part of the Cambridge Pathway, which gives learners a clear path from age 5 to 19. It leads \"seamlessly\" from primary to secondary and pre-university years, and each step builds on the learners' development from the previous step or from other educational systems. The framework is typically for learners aged 5 to 11, but it may be used for slightly different ages to suit your context.","ar":"The framework explains that the primary programme is part of the Cambridge Pathway, which gives learners a clear path from age 5 to 19. It leads \"seamlessly\" from primary to secondary and pre-university years, and each step builds on the learners' development from the previous step or from other educational systems. The framework is typically for learners aged 5 to 11, but it may be used for slightly different ages to suit your context."}},{"t":"p","c":{"en":"The framework also says that it may be appropriate to introduce it at slightly different ages to suit particular circumstances. This is important in a school like PEPS, where children may arrive from different systems.","ar":"The framework also says that it may be appropriate to introduce it at slightly different ages to suit particular circumstances. This is important in a school like PEPS, where children may arrive from different systems."}},{"t":"table","head":{"en":["Stage in the PEPS journey","Cambridge link","What it means for you"],"ar":["Stage in the PEPS journey","Cambridge link","What it means for you"]},"rows":[{"en":["FS2 (before Year 1)","The framework describes \"prior experience\" expected before Stage 1","Year 1 teachers should know what FS2 children have already met (see Module 8)"],"ar":["FS2 (before Year 1)","The framework describes \"prior experience\" expected before Stage 1","Year 1 teachers should know what FS2 children have already met (see Module 8)"]},{"en":["Years 1 to 6","Stages 1 to 6 of Cambridge Primary Mathematics 0096","The learning objectives in this CPD"],"ar":["Years 1 to 6","Stages 1 to 6 of Cambridge Primary Mathematics 0096","The learning objectives in this CPD"]},{"en":["Year 6","The last primary stage (Stage 6)","PEPS Year 6 is the Cambridge Primary Checkpoint year; see Module 9"],"ar":["Year 6","The last primary stage (Stage 6)","PEPS Year 6 is the Cambridge Primary Checkpoint year; see Module 9"]},{"en":["Years 7 to 9","Cambridge Lower Secondary","Stage 6 learning is the base for secondary work; the framework says each step builds on the previous one"],"ar":["Years 7 to 9","Cambridge Lower Secondary","Stage 6 learning is the base for secondary work; the framework says each step builds on the previous one"]}]},{"t":"p","c":{"en":"In this table the stage names are from the framework. The links to PEPS year groups come from how our school is organised. Always check the current Cambridge documents for exact details of other programmes.","ar":"In this table the stage names are from the framework. The links to PEPS year groups come from how our school is organised. Always check the current Cambridge documents for exact details of other programmes."}},{"t":"h","c":{"en":"Teaching time: what the framework says","ar":"Teaching time: what the framework says"}},{"t":"callout","k":"key","title":{"en":"Teaching time, exactly as the framework gives it","ar":"Teaching time, exactly as the framework gives it"},"c":{"en":"\"For guidance, this curriculum framework is based on learners having 4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cstrong>for guidance\u003c/strong> and \u003cstrong>may vary\u003c/strong>. It is a planning guide, not a rule. Your timetable and your HOD will tell you how it works in your school.","ar":"\"For guidance, this curriculum framework is based on learners having 4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cstrong>for guidance\u003c/strong> and \u003cstrong>may vary\u003c/strong>. It is a planning guide, not a rule. Your timetable and your HOD will tell you how it works in your school."}},{"t":"h","c":{"en":"Supporting resources","ar":"Supporting resources"}},{"t":"p","c":{"en":"The framework says that most Cambridge resources are on the \u003cstrong>School Support Hub\u003c/strong>. If you do not have a log-in, the framework suggests asking the Cambridge coordinator or exams officer in your school. The resources are grouped as follows.","ar":"The framework says that most Cambridge resources are on the \u003cstrong>School Support Hub\u003c/strong>. If you do not have a log-in, the framework suggests asking the Cambridge coordinator or exams officer in your school. The resources are grouped as follows."}},{"t":"table","head":{"en":["Group","What the framework lists","How you might use it"],"ar":["Group","What the framework lists","How you might use it"]},"rows":[{"en":["Teaching resources","Curriculum framework, teacher guide, schemes of work","Framework for the objectives; teacher guide for teaching approaches; schemes of work for ideas and sample plans"],"ar":["Teaching resources","Curriculum framework, teacher guide, schemes of work","Framework for the objectives; teacher guide for teaching approaches; schemes of work for ideas and sample plans"]},{"en":["Cambridge Primary assessments","Cambridge Primary Progression Tests, Cambridge Primary Checkpoint, CEM Baseline Tests","Check the School Support Hub for what each assessment covers and which stages it is for"],"ar":["Cambridge Primary assessments","Cambridge Primary Progression Tests, Cambridge Primary Checkpoint, CEM Baseline Tests","Check the School Support Hub for what each assessment covers and which stages it is for"]},{"en":["Training","Face-to-face workshops, online training, Cambridge Professional Development Qualifications","Ask your HOD about professional development"],"ar":["Training","Face-to-face workshops, online training, Cambridge Professional Development Qualifications","Ask your HOD about professional development"]},{"en":["Community","Social media channels and community forums on the School Support Hub","Share ideas with other teachers"],"ar":["Community","Social media channels and community forums on the School Support Hub","Share ideas with other teachers"]}]},{"t":"p","c":{"en":"On assessment, the framework states that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\". It does not say more than this in the framework itself, so for details such as test content, timing and reporting you must look on the School Support Hub.","ar":"On assessment, the framework states that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\". It does not say more than this in the framework itself, so for details such as test content, timing and reporting you must look on the School Support Hub."}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Mathematics.\" They show the types of activities, the depth and the breadth of each objective, but they are not designed to fill all the teaching time. The learning objectives in the framework are what matter. Endorsed resources are available, and the framework says that if a resource is endorsed, you can be confident that all the learning objectives are covered.","ar":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Mathematics.\" They show the types of activities, the depth and the breadth of each objective, but they are not designed to fill all the teaching time. The learning objectives in the framework are what matter. Endorsed resources are available, and the framework says that if a resource is endorsed, you can be confident that all the learning objectives are covered."}},{"t":"h","c":{"en":"Versions and changes","ar":"Versions and changes"}},{"t":"p","c":{"en":"This framework was first published in September 2020 for first teaching in September 2021. The cover notes that Cambridge Primary Progression Tests would be available from 2022 and Cambridge Primary Checkpoint tests from 2023. The latest version is \u003cstrong>version 2.1, published June 2025\u003c/strong>. The \"Changes\" section says that the changes were made to make the framework digitally accessible: for example, larger font size and spacing, and alternative text for images and tables. It adds that there may be other minor changes that do not affect teaching and learning. In other words, version 2.1 did not change what is taught.","ar":"This framework was first published in September 2020 for first teaching in September 2021. The cover notes that Cambridge Primary Progression Tests would be available from 2022 and Cambridge Primary Checkpoint tests from 2023. The latest version is \u003cstrong>version 2.1, published June 2025\u003c/strong>. The \"Changes\" section says that the changes were made to make the framework digitally accessible: for example, larger font size and spacing, and alternative text for images and tables. It adds that there may be other minor changes that do not affect teaching and learning. In other words, version 2.1 did not change what is taught."}},{"t":"scenario","title":{"en":"Scenario: the new colleague","ar":"Scenario: the new colleague"},"c":{"en":"A new Year 3 teacher joins PEPS in the middle of the year. She asks: \"Do I have to follow the scheme of work in the order it is written, and how many hours of maths should my class have?\" Using the framework, you can tell her three things. First, the scheme of work is optional, so she should work from the learning objectives and her school's medium-term plan. Second, the framework suggests 4 to 5 hours per week as guidance, which may vary by context, so she should check the school timetable. Third, she can ask the Cambridge coordinator or exams officer for a School Support Hub log-in to see the teacher guide and schemes of work.","ar":"A new Year 3 teacher joins PEPS in the middle of the year. She asks: \"Do I have to follow the scheme of work in the order it is written, and how many hours of maths should my class have?\" Using the framework, you can tell her three things. First, the scheme of work is optional, so she should work from the learning objectives and her school's medium-term plan. Second, the framework suggests 4 to 5 hours per week as guidance, which may vary by context, so she should check the school timetable. Third, she can ask the Cambridge coordinator or exams officer for a School Support Hub log-in to see the teacher guide and schemes of work."}}],"checks":[{"id":"m1q1","q":{"en":"A new teacher asks how many hours of mathematics the framework expects each week. What is the best answer?","ar":"A new teacher asks how many hours of mathematics the framework expects each week. What is the best answer?"},"opts":[{"en":"It is based on 4 to 5 hours a week, about 120 to 150 hours a stage, as guidance that can vary","ar":"It is based on 4 to 5 hours a week, about 120 to 150 hours a stage, as guidance that can vary"},{"en":"It requires exactly 5 hours a week in every stage, and schools must not change this number","ar":"It requires exactly 5 hours a week in every stage, and schools must not change this number"},{"en":"It requires 3 hours a week in Stages 1 to 3 and 5 hours a week in Stages 4 to 6","ar":"It requires 3 hours a week in Stages 1 to 3 and 5 hours a week in Stages 4 to 6"},{"en":"It gives no teaching-time guidance, so each school decides without any reference to Cambridge","ar":"It gives no teaching-time guidance, so each school decides without any reference to Cambridge"}],"correct":0,"expl":{"en":"The framework says it is based on learners having 4 to 5 hours per week (about 120 to 150 hours per stage), and that actual hours may vary according to context.","ar":"The framework says it is based on learners having 4 to 5 hours per week (about 120 to 150 hours per stage), and that actual hours may vary according to context."}},{"id":"m1q2","q":{"en":"What is the main purpose of the Cambridge Primary Mathematics Curriculum Framework?","ar":"What is the main purpose of the Cambridge Primary Mathematics Curriculum Framework?"},"opts":[{"en":"To give a fixed lesson plan for every day of the school year in each primary stage and every classroom in the world","ar":"To give a fixed lesson plan for every day of the school year in each primary stage and every classroom in the world"},{"en":"To set out the learning objectives for each stage and a structure for teaching and checking attainment","ar":"To set out the learning objectives for each stage and a structure for teaching and checking attainment"},{"en":"To list the textbooks that every Cambridge school must buy before it can teach maths","ar":"To list the textbooks that every Cambridge school must buy before it can teach maths"},{"en":"To set the questions that will appear in every written test taken by primary pupils","ar":"To set the questions that will appear in every written test taken by primary pupils"}],"correct":1,"expl":{"en":"The framework gives learning objectives for Stages 1 to 6, which provide a structure for teaching and learning and a reference against which attainment can be checked.","ar":"The framework gives learning objectives for Stages 1 to 6, which provide a structure for teaching and learning and a reference against which attainment can be checked."}},{"id":"m1q3","q":{"en":"A colleague says: \"Version 2.1 of the framework means the maths content changed in 2025.\" What does the framework's own Changes section say?","ar":"A colleague says: \"Version 2.1 of the framework means the maths content changed in 2025.\" What does the framework's own Changes section say?"},"opts":[{"en":"The changes added a new strand called Thinking and Working Mathematically to Stages 1 to 6, as well as a new set of aims for pupils","ar":"The changes added a new strand called Thinking and Working Mathematically to Stages 1 to 6, as well as a new set of aims for pupils"},{"en":"The changes moved percentages and decimals into earlier stages of the primary programme","ar":"The changes moved percentages and decimals into earlier stages of the primary programme"},{"en":"The changes made it digitally accessible, for example larger font and alternative text, with no change to teaching","ar":"The changes made it digitally accessible, for example larger font and alternative text, with no change to teaching"},{"en":"The changes removed the glossary and the prior experience section from the framework","ar":"The changes removed the glossary and the prior experience section from the framework"}],"correct":2,"expl":{"en":"The Changes section describes accessibility changes (font size, spacing, alternative text) and says any other minor changes do not affect teaching and learning.","ar":"The Changes section describes accessibility changes (font size, spacing, alternative text) and says any other minor changes do not affect teaching and learning."}}]},{"id":"m2","title":{"en":"Aims and the Cambridge Learner Attributes in Mathematics","ar":"Aims and the Cambridge Learner Attributes in Mathematics"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before looking at topics, it helps to ask what the programme is for. The framework gives two sets of aims. The first applies to the whole Cambridge Primary programme. The second applies to mathematics. Reading them carefully helps you explain to parents, colleagues and inspectors why mathematics lessons look the way they do.","ar":"Before looking at topics, it helps to ask what the programme is for. The framework gives two sets of aims. The first applies to the whole Cambridge Primary programme. The second applies to mathematics. Reading them carefully helps you explain to parents, colleagues and inspectors why mathematics lessons look the way they do."}},{"t":"h","c":{"en":"The aims of the Cambridge Primary programme","ar":"The aims of the Cambridge Primary programme"}},{"t":"p","c":{"en":"The framework says that following Cambridge Primary helps learners to lay the foundations for lifelong learning. It lists four examples:","ar":"The framework says that following Cambridge Primary helps learners to lay the foundations for lifelong learning. It lists four examples:"}},{"t":"list","c":{"en":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as global awareness."],"ar":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as global awareness."]}},{"t":"p","c":{"en":"The third aim is especially relevant at PEPS. It says communication skills \"including in English\". In a mathematics lesson with ESL learners, this means that talking about mathematics in English is a legitimate learning goal, not a distraction from the real mathematics.","ar":"The third aim is especially relevant at PEPS. It says communication skills \"including in English\". In a mathematics lesson with ESL learners, this means that talking about mathematics in English is a legitimate learning goal, not a distraction from the real mathematics."}},{"t":"h","c":{"en":"The aims of Cambridge Primary Mathematics","ar":"The aims of Cambridge Primary Mathematics"}},{"t":"p","c":{"en":"In Cambridge Primary Mathematics, the framework says that learners:","ar":"In Cambridge Primary Mathematics, the framework says that learners:"}},{"t":"list","c":{"en":["engage in creative mathematical thinking to generate elegant solutions","improve numerical fluency and knowledge of key mathematical concepts to make sense of numbers, patterns, shapes, measurements and data","develop a variety of mathematical skills, strategies and a way of thinking to describe the world and play an active role in modern society","communicate solutions and ideas logically in spoken and written language, using appropriate symbols, diagrams and representations","understand that technology is a powerful way of communicating mathematics."],"ar":["engage in creative mathematical thinking to generate elegant solutions","improve numerical fluency and knowledge of key mathematical concepts to make sense of numbers, patterns, shapes, measurements and data","develop a variety of mathematical skills, strategies and a way of thinking to describe the world and play an active role in modern society","communicate solutions and ideas logically in spoken and written language, using appropriate symbols, diagrams and representations","understand that technology is a powerful way of communicating mathematics."]}},{"t":"p","c":{"en":"Notice the balance. Fluency and knowledge are there, but so are creative thinking, communication and technology. A lesson that is only about speed in calculation would miss several of the five aims. A lesson that is only about discussion, with no accurate calculation, would miss others.","ar":"Notice the balance. Fluency and knowledge are there, but so are creative thinking, communication and technology. A lesson that is only about speed in calculation would miss several of the five aims. A lesson that is only about discussion, with no accurate calculation, would miss others."}},{"t":"h","c":{"en":"The five Cambridge learner attributes","ar":"The five Cambridge learner attributes"}},{"t":"p","c":{"en":"The framework includes a diagram showing the Cambridge learner and says that the Cambridge approach encourages learners to be \u003cstrong>confident, responsible, reflective, innovative and engaged\u003c/strong>. It then describes what each attribute means in mathematics. The table below paraphrases those descriptions, and adds a classroom example that is good practice, not a Cambridge requirement.","ar":"The framework includes a diagram showing the Cambridge learner and says that the Cambridge approach encourages learners to be \u003cstrong>confident, responsible, reflective, innovative and engaged\u003c/strong>. It then describes what each attribute means in mathematics. The table below paraphrases those descriptions, and adds a classroom example that is good practice, not a Cambridge requirement."}},{"t":"table","head":{"en":["Attribute","In mathematics, the framework says learners ...","Classroom example (good practice)"],"ar":["Attribute","In mathematics, the framework says learners ...","Classroom example (good practice)"]},"rows":[{"en":["Confident","use techniques without hesitation or fear; ask questions in a structured, critical way; present findings and defend their strategies; critique and improve the solutions of others","Pupils explain their method to a partner, and the partner says one thing that is good and one thing to improve"],"ar":["Confident","use techniques without hesitation or fear; ask questions in a structured, critical way; present findings and defend their strategies; critique and improve the solutions of others","Pupils explain their method to a partner, and the partner says one thing that is good and one thing to improve"]},{"en":["Responsible","understand how principles of mathematics can be applied to real life problems in a responsible way","Year 5 pupils plan a class snack budget and decide how to share it fairly"],"ar":["Responsible","understand how principles of mathematics can be applied to real life problems in a responsible way","Year 5 pupils plan a class snack budget and decide how to share it fairly"]},{"en":["Reflective","reflect on the process of thinking and working mathematically, not only on mastering concepts; make conjectures by asking sophisticated questions","At the end of a lesson, pupils finish the sentence \"Today I changed my mind about ... because ...\""],"ar":["Reflective","reflect on the process of thinking and working mathematically, not only on mastering concepts; make conjectures by asking sophisticated questions","At the end of a lesson, pupils finish the sentence \"Today I changed my mind about ... because ...\""]},{"en":["Innovative","solve new and unfamiliar problems; choose their own strategies and suggest alternative routes to efficient solutions","Pupils find two different ways to work out 18 + 7 and say which they prefer"],"ar":["Innovative","solve new and unfamiliar problems; choose their own strategies and suggest alternative routes to efficient solutions","Pupils find two different ways to work out 18 + 7 and say which they prefer"]},{"en":["Engaged","are curious and engage intellectually to deepen understanding; use mathematics to take part in society and the economy by making informed choices","Pupils investigate a real question, such as which snack the class likes most, and use the data to advise the school shop"],"ar":["Engaged","are curious and engage intellectually to deepen understanding; use mathematics to take part in society and the economy by making informed choices","Pupils investigate a real question, such as which snack the class likes most, and use the data to advise the school shop"]}]},{"t":"callout","k":"tip","title":{"en":"A useful habit","ar":"A useful habit"},"c":{"en":"When you plan a lesson, ask: \"Which attribute am I building today, and what will pupils say or do that shows it?\" You do not need to cover all five in every lesson. Over a unit, though, each should appear.","ar":"When you plan a lesson, ask: \"Which attribute am I building today, and what will pupils say or do that shows it?\" You do not need to cover all five in every lesson. Over a unit, though, each should appear."}},{"t":"h","c":{"en":"Teaching approaches in the framework overview","ar":"Teaching approaches in the framework overview"}},{"t":"p","c":{"en":"The overview section of the framework also describes teaching approaches. Three points are worth knowing now.","ar":"The overview section of the framework also describes teaching approaches. Three points are worth knowing now."}},{"t":"steps","c":{"en":["\u003cstrong>Active learning.\u003c/strong> Cambridge advocates an active, student-centred approach. Learners work both individually and collaboratively to find solutions to mathematical problems.","\u003cstrong>Concrete, representational, abstract (CRA).\u003c/strong> The framework describes a three-step approach used in all primary stages. First, learners use objects to understand a new idea. Next, they change the concrete model into a picture of the same idea. Finally, they are shown how the pictures link to the usual mathematical symbols and notation.","\u003cstrong>Mental strategies.\u003c/strong> The framework says mental strategies are core to understanding, but that the curriculum does not require learners to follow or practise specific strategies. This gives flexibility, and learners can see mental strategies as a personal choice."],"ar":["\u003cstrong>Active learning.\u003c/strong> Cambridge advocates an active, student-centred approach. Learners work both individually and collaboratively to find solutions to mathematical problems.","\u003cstrong>Concrete, representational, abstract (CRA).\u003c/strong> The framework describes a three-step approach used in all primary stages. First, learners use objects to understand a new idea. Next, they change the concrete model into a picture of the same idea. Finally, they are shown how the pictures link to the usual mathematical symbols and notation.","\u003cstrong>Mental strategies.\u003c/strong> The framework says mental strategies are core to understanding, but that the curriculum does not require learners to follow or practise specific strategies. This gives flexibility, and learners can see mental strategies as a personal choice."]}},{"t":"p","c":{"en":"The last point is easy to miss. If a textbook insists that every child must use one named mental method, remember that the framework itself does not require this.","ar":"The last point is easy to miss. If a textbook insists that every child must use one named mental method, remember that the framework itself does not require this."}},{"t":"scenario","title":{"en":"Scenario: the quiet pupil with the right answer","ar":"Scenario: the quiet pupil with the right answer"},"c":{"en":"In a Year 4 class of 28, Amal (an ESL learner) always gets the correct answer but never speaks in group work. A colleague says: \"Her maths is fine, so I will leave her.\" Looking at the aims, you can see a gap. The framework wants learners to communicate solutions logically in spoken and written language, and the Confident attribute includes defending strategies. A good-practice response is to give Amal a sentence frame (\"I did ... first, then I ... because ...\") and let her rehearse with a partner before she speaks to the group. Her mathematics is not the problem; the aim of communication is not yet met.","ar":"In a Year 4 class of 28, Amal (an ESL learner) always gets the correct answer but never speaks in group work. A colleague says: \"Her maths is fine, so I will leave her.\" Looking at the aims, you can see a gap. The framework wants learners to communicate solutions logically in spoken and written language, and the Confident attribute includes defending strategies. A good-practice response is to give Amal a sentence frame (\"I did ... first, then I ... because ...\") and let her rehearse with a partner before she speaks to the group. Her mathematics is not the problem; the aim of communication is not yet met."}},{"t":"scenario","title":{"en":"Scenario: concrete, picture, symbol","ar":"Scenario: concrete, picture, symbol"},"c":{"en":"A Year 2 teacher introduces 3 x 5 by writing the calculation on the board and showing the method. Several pupils copy but cannot explain it. Using the CRA approach, the teacher could start with objects (three groups of five counters), move to a drawing of the groups, and then link both to 3 x 5 = 15. The framework says learners should first use objects, then pictures, then symbols.","ar":"A Year 2 teacher introduces 3 x 5 by writing the calculation on the board and showing the method. Several pupils copy but cannot explain it. Using the CRA approach, the teacher could start with objects (three groups of five counters), move to a drawing of the groups, and then link both to 3 x 5 = 15. The framework says learners should first use objects, then pictures, then symbols."}}],"checks":[{"id":"m2q1","q":{"en":"Which list gives the five Cambridge learner attributes named in the framework?","ar":"Which list gives the five Cambridge learner attributes named in the framework?"},"opts":[{"en":"Curious, creative, careful, cooperative and competent","ar":"Curious, creative, careful, cooperative and competent"},{"en":"Confident, honest, reflective, independent and engaged","ar":"Confident, honest, reflective, independent and engaged"},{"en":"Responsible, resilient, reflective, innovative and ambitious","ar":"Responsible, resilient, reflective, innovative and ambitious"},{"en":"Confident, responsible, reflective, innovative and engaged","ar":"Confident, responsible, reflective, innovative and engaged"}],"correct":3,"expl":{"en":"The framework says Cambridge Primary Mathematics supports learners to become responsible, innovative, confident, engaged and reflective.","ar":"The framework says Cambridge Primary Mathematics supports learners to become responsible, innovative, confident, engaged and reflective."}},{"id":"m2q2","q":{"en":"A Year 1 teacher begins a new idea with counters, then moves to drawings, then to written symbols. Which approach from the framework is this?","ar":"A Year 1 teacher begins a new idea with counters, then moves to drawings, then to written symbols. Which approach from the framework is this?"},"opts":[{"en":"Concrete, representational, abstract (CRA)","ar":"Concrete, representational, abstract (CRA)"},{"en":"The statistical enquiry cycle","ar":"The statistical enquiry cycle"},{"en":"The Thinking and Working Mathematically star","ar":"The Thinking and Working Mathematically star"},{"en":"The scheme of work grouping of units","ar":"The scheme of work grouping of units"}],"correct":0,"expl":{"en":"The framework describes the three-step CRA approach: objects first, then pictorial representations, then conventional symbols and notation.","ar":"The framework describes the three-step CRA approach: objects first, then pictorial representations, then conventional symbols and notation."}},{"id":"m2q3","q":{"en":"A textbook says all pupils must use one named mental strategy for addition. What does the framework say about mental strategies?","ar":"A textbook says all pupils must use one named mental strategy for addition. What does the framework say about mental strategies?"},"opts":[{"en":"They must be taught in the order given in the schemes of work, one strategy for each stage","ar":"They must be taught in the order given in the schemes of work, one strategy for each stage"},{"en":"They are important, but the curriculum does not require learners to follow or practise specific strategies","ar":"They are important, but the curriculum does not require learners to follow or practise specific strategies"},{"en":"They are not part of Cambridge Primary Mathematics and should not be taught in primary","ar":"They are not part of Cambridge Primary Mathematics and should not be taught in primary"},{"en":"They are required only in Stages 5 and 6, when learners start to work with decimals","ar":"They are required only in Stages 5 and 6, when learners start to work with decimals"}],"correct":1,"expl":{"en":"The framework says mental strategies are core to understanding but allows flexibility, so learners can choose strategies that suit them.","ar":"The framework says mental strategies are core to understanding but allows flexibility, so learners can choose strategies that suit them."}}]},{"id":"m3","title":{"en":"How the Framework Is Organised: Strands, Sub-strands and Codes","ar":"How the Framework Is Organised: Strands, Sub-strands and Codes"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A good map makes any journey easier. This module shows you the map of the framework: the strands, the sub-strands and the code system. Once you can read a code, you can find an objective in seconds, and you can follow an idea across stages.","ar":"A good map makes any journey easier. This module shows you the map of the framework: the strands, the sub-strands and the code system. Once you can read a code, you can find an objective in seconds, and you can follow an idea across stages."}},{"t":"h","c":{"en":"Three strands and ten sub-strands","ar":"Three strands and ten sub-strands"}},{"t":"p","c":{"en":"The framework divides the learning objectives into three main areas called \u003cstrong>strands\u003c/strong>. They run through every primary stage: \u003cstrong>Number\u003c/strong>, \u003cstrong>Geometry and Measure\u003c/strong>, and \u003cstrong>Statistics and Probability\u003c/strong>. Each strand is divided into \u003cstrong>sub-strands\u003c/strong>. The framework defines a strand as \"a collection of learning objectives ... that forms an area of learning\".","ar":"The framework divides the learning objectives into three main areas called \u003cstrong>strands\u003c/strong>. They run through every primary stage: \u003cstrong>Number\u003c/strong>, \u003cstrong>Geometry and Measure\u003c/strong>, and \u003cstrong>Statistics and Probability\u003c/strong>. Each strand is divided into \u003cstrong>sub-strands\u003c/strong>. The framework defines a strand as \"a collection of learning objectives ... that forms an area of learning\"."}},{"t":"p","c":{"en":"The framework states that the strands are interrelated and should be taught in conjunction with each other. For example, measuring in Geometry and Measure needs number skills, and a statistics investigation uses counting and comparing.","ar":"The framework states that the strands are interrelated and should be taught in conjunction with each other. For example, measuring in Geometry and Measure needs number skills, and a statistics investigation uses counting and comparing."}},{"t":"table","head":{"en":["Strand","Sub-strand","Reporting code","Where it appears"],"ar":["Strand","Sub-strand","Reporting code","Where it appears"]},"rows":[{"en":["Number","Counting and sequences","Nc","Stages 1 to 6"],"ar":["Number","Counting and sequences","Nc","Stages 1 to 6"]},{"en":["Number","Integers and powers","Ni","Stages 1 to 6"],"ar":["Number","Integers and powers","Ni","Stages 1 to 6"]},{"en":["Number","Money","Nm","Stages 1 to 3 only (no Nm objectives are listed for Stages 4 to 6)"],"ar":["Number","Money","Nm","Stages 1 to 3 only (no Nm objectives are listed for Stages 4 to 6)"]},{"en":["Number","Place value, ordering and rounding","Np","Stages 1 to 6"],"ar":["Number","Place value, ordering and rounding","Np","Stages 1 to 6"]},{"en":["Number","Fractions, decimals, percentages, ratio and proportion","Nf","Stages 1 to 6"],"ar":["Number","Fractions, decimals, percentages, ratio and proportion","Nf","Stages 1 to 6"]},{"en":["Geometry and Measure","Time","Gt","Stages 1 to 6"],"ar":["Geometry and Measure","Time","Gt","Stages 1 to 6"]},{"en":["Geometry and Measure","Geometrical reasoning, shapes and measurements","Gg","Stages 1 to 6"],"ar":["Geometry and Measure","Geometrical reasoning, shapes and measurements","Gg","Stages 1 to 6"]},{"en":["Geometry and Measure","Position and transformation","Gp","Stages 1 to 6"],"ar":["Geometry and Measure","Position and transformation","Gp","Stages 1 to 6"]},{"en":["Statistics and Probability","Statistics","Ss","Stages 1 to 6"],"ar":["Statistics and Probability","Statistics","Ss","Stages 1 to 6"]},{"en":["Statistics and Probability","Probability","Sp","Stages 2 to 6 (none listed for Stage 1)"],"ar":["Statistics and Probability","Probability","Sp","Stages 2 to 6 (none listed for Stage 1)"]}]},{"t":"p","c":{"en":"The \"Where it appears\" column comes from reading the learning-objective lists for each stage. It shows two facts that surprise many teachers: Money has its own objectives only in Stages 1 to 3, and Probability objectives begin in Stage 2.","ar":"The \"Where it appears\" column comes from reading the learning-objective lists for each stage. It shows two facts that surprise many teachers: Money has its own objectives only in Stages 1 to 3, and Probability objectives begin in Stage 2."}},{"t":"callout","k":"key","title":{"en":"Thinking and Working Mathematically is not a strand","ar":"Thinking and Working Mathematically is not a strand"},"c":{"en":"The framework says Thinking and Working Mathematically (TWM) \"is not an independent strand, instead it is embedded within and across the other curriculum strands\". Its characteristics \"should be integrated into the teaching of the other strands\". Each stage lists the same eight TWM objectives, with the codes TWM.01 to TWM.08.","ar":"The framework says Thinking and Working Mathematically (TWM) \"is not an independent strand, instead it is embedded within and across the other curriculum strands\". Its characteristics \"should be integrated into the teaching of the other strands\". Each stage lists the same eight TWM objectives, with the codes TWM.01 to TWM.08."}},{"t":"h","c":{"en":"How to read a learning-objective code","ar":"How to read a learning-objective code"}},{"t":"p","c":{"en":"Each learning objective has a unique code. The framework gives the example \u003cstrong>1Nc.05\u003c/strong>. These codes appear in the schemes of work, the teacher guide and other Cambridge Primary resources. A code has three parts.","ar":"Each learning objective has a unique code. The framework gives the example \u003cstrong>1Nc.05\u003c/strong>. These codes appear in the schemes of work, the teacher guide and other Cambridge Primary resources. A code has three parts."}},{"t":"table","head":{"en":["Part of code","Example in 1Nc.05","Meaning"],"ar":["Part of code","Example in 1Nc.05","Meaning"]},"rows":[{"en":["Stage number","1","The objective belongs to Stage 1 (PEPS Year 1)"],"ar":["Stage number","1","The objective belongs to Stage 1 (PEPS Year 1)"]},{"en":["Reporting code","Nc","Counting and sequences. The framework says this code appears in the feedback reports for tests and reflects the sub-strand titles"],"ar":["Reporting code","Nc","Counting and sequences. The framework says this code appears in the feedback reports for tests and reflects the sub-strand titles"]},{"en":["Number in the sub-strand","05","The order of the objective within that sub-strand for that stage; 05 is the fifth objective"],"ar":["Number in the sub-strand","05","The order of the objective within that sub-strand for that stage; 05 is the fifth objective"]}]},{"t":"p","c":{"en":"So 1Nc.05 means: Stage 1, Counting and sequences, fifth objective. If you look it up, you find that it is about understanding even and odd numbers as \"every other number\" when counting from 0 to 20.","ar":"So 1Nc.05 means: Stage 1, Counting and sequences, fifth objective. If you look it up, you find that it is about understanding even and odd numbers as \"every other number\" when counting from 0 to 20."}},{"t":"h","c":{"en":"Worked examples: reading more codes","ar":"Worked examples: reading more codes"}},{"t":"table","head":{"en":["Code","How to read it","What the objective is about (paraphrased)"],"ar":["Code","How to read it","What the objective is about (paraphrased)"]},"rows":[{"en":["3Nf.02","Stage 3, Fractions, decimals, percentages, ratio and proportion, second objective","The whole-and-parts relationship depends on the relative size of the parts, not their shape or orientation"],"ar":["3Nf.02","Stage 3, Fractions, decimals, percentages, ratio and proportion, second objective","The whole-and-parts relationship depends on the relative size of the parts, not their shape or orientation"]},{"en":["4Nf.06","Stage 4, Nf, sixth objective","Percentage as the number of parts in each hundred, and use of the % symbol"],"ar":["4Nf.06","Stage 4, Nf, sixth objective","Percentage as the number of parts in each hundred, and use of the % symbol"]},{"en":["5Gp.03","Stage 5, Position and transformation, third objective","Translating 2D shapes on square grids"],"ar":["5Gp.03","Stage 5, Position and transformation, third objective","Translating 2D shapes on square grids"]},{"en":["6Gg.10","Stage 6, Geometrical reasoning, shapes and measurements, tenth objective","The angles in a triangle add up to 180°, used to find missing angles"],"ar":["6Gg.10","Stage 6, Geometrical reasoning, shapes and measurements, tenth objective","The angles in a triangle add up to 180°, used to find missing angles"]},{"en":["3Ss.02","Stage 3, Statistics, second objective","Recording, organising and representing categorical and discrete data, and choosing a representation"],"ar":["3Ss.02","Stage 3, Statistics, second objective","Recording, organising and representing categorical and discrete data, and choosing a representation"]},{"en":["TWM.07","Thinking and Working Mathematically, seventh characteristic","Critiquing"],"ar":["TWM.07","Thinking and Working Mathematically, seventh characteristic","Critiquing"]}]},{"t":"callout","k":"warn","title":{"en":"Two common mistakes with codes","ar":"Two common mistakes with codes"},"c":{"en":"First, the final number is only an order number inside one stage. 2Nf.05 and 3Nf.05 are different objectives, and the numbers do not link ideas across stages. Second, the order of objectives is not a teaching order. The schemes of work suggest how to group and order them into units, but the framework codes themselves do not say which to teach first.","ar":"First, the final number is only an order number inside one stage. 2Nf.05 and 3Nf.05 are different objectives, and the numbers do not link ideas across stages. Second, the order of objectives is not a teaching order. The schemes of work suggest how to group and order them into units, but the framework codes themselves do not say which to teach first."}},{"t":"h","c":{"en":"How many objectives are there?","ar":"How many objectives are there?"}},{"t":"p","c":{"en":"If you count the objectives listed in each stage (not including the eight TWM statements), the number grows through the primary years. The figures below are from a count of the lists in the framework, so please check them against your copy.","ar":"If you count the objectives listed in each stage (not including the eight TWM statements), the number grows through the primary years. The figures below are from a count of the lists in the framework, so please check them against your copy."}},{"t":"table","head":{"en":["Stage","Number objectives","Geometry and Measure objectives","Statistics and Probability objectives","Total"],"ar":["Stage","Number objectives","Geometry and Measure objectives","Statistics and Probability objectives","Total"]},"rows":[{"en":["1","21","12","3","36"],"ar":["1","21","12","3","36"]},{"en":["2","26","17","5","48"],"ar":["2","26","17","5","48"]},{"en":["3","31","17","5","53"],"ar":["3","31","17","5","53"]},{"en":["4","25","16","5","46"],"ar":["4","25","16","5","46"]},{"en":["5","28","16","7","51"],"ar":["5","28","16","7","51"]},{"en":["6","29","17","8","54"],"ar":["6","29","17","8","54"]}]},{"t":"p","c":{"en":"The totals do not show difficulty, only the amount of listed content. Notice that Number is always the largest strand, which fits the framework's description of Number as the foundation.","ar":"The totals do not show difficulty, only the amount of listed content. Notice that Number is always the largest strand, which fits the framework's description of Number as the foundation."}},{"t":"scenario","title":{"en":"Scenario: planning from a code","ar":"Scenario: planning from a code"},"c":{"en":"Your HOD gives you the code 4Ss.02 for next week's lesson. You decode it: Stage 4, Statistics, second objective. You look it up and find that pupils record, organise and represent categorical and discrete data, and choose and explain which representation to use, including Venn and Carroll diagrams, tally charts, frequency tables, pictograms, bar charts and dot plots. Because the objective says \"choose and explain\", your lesson should include a moment where pupils decide which chart suits their data and say why. If you only teach pupils to draw a bar chart, you cover part of the objective.","ar":"Your HOD gives you the code 4Ss.02 for next week's lesson. You decode it: Stage 4, Statistics, second objective. You look it up and find that pupils record, organise and represent categorical and discrete data, and choose and explain which representation to use, including Venn and Carroll diagrams, tally charts, frequency tables, pictograms, bar charts and dot plots. Because the objective says \"choose and explain\", your lesson should include a moment where pupils decide which chart suits their data and say why. If you only teach pupils to draw a bar chart, you cover part of the objective."}}],"checks":[{"id":"m3q1","q":{"en":"What does the code 3Nf.02 stand for?","ar":"What does the code 3Nf.02 stand for?"},"opts":[{"en":"Stage 3, Number and fractions, the second term of the school year","ar":"Stage 3, Number and fractions, the second term of the school year"},{"en":"Year 3, Number facts, the second of the five learning objectives","ar":"Year 3, Number facts, the second of the five learning objectives"},{"en":"Stage 3, Fractions, decimals, percentages, ratio and proportion, the second objective","ar":"Stage 3, Fractions, decimals, percentages, ratio and proportion, the second objective"},{"en":"Stage 3, Fractions, decimals, percentages, ratio and proportion, for Stage 2 learners","ar":"Stage 3, Fractions, decimals, percentages, ratio and proportion, for Stage 2 learners"}],"correct":2,"expl":{"en":"The first digit is the stage, Nf is the reporting code for that sub-strand, and 02 is the order number within the sub-strand for the stage.","ar":"The first digit is the stage, Nf is the reporting code for that sub-strand, and 02 is the order number within the sub-strand for the stage."}},{"id":"m3q2","q":{"en":"A teacher says that Thinking and Working Mathematically is the fourth strand of the framework. What is the best correction?","ar":"A teacher says that Thinking and Working Mathematically is the fourth strand of the framework. What is the best correction?"},"opts":[{"en":"It is a strand, but it only appears in Stages 5 and 6 of the framework","ar":"It is a strand, but it only appears in Stages 5 and 6 of the framework"},{"en":"It is a separate subject that is taught in its own lessons once a week","ar":"It is a separate subject that is taught in its own lessons once a week"},{"en":"It is part of the Number strand only and does not apply to shapes or data","ar":"It is part of the Number strand only and does not apply to shapes or data"},{"en":"It is embedded within and across the three strands, not an independent strand","ar":"It is embedded within and across the three strands, not an independent strand"}],"correct":3,"expl":{"en":"The framework says TWM is not an independent strand but is embedded in and across the other strands, and its characteristics should be integrated into teaching.","ar":"The framework says TWM is not an independent strand but is embedded in and across the other strands, and its characteristics should be integrated into teaching."}},{"id":"m3q3","q":{"en":"Which statement about the sub-strands is correct, based on the objective lists?","ar":"Which statement about the sub-strands is correct, based on the objective lists?"},"opts":[{"en":"Money has objectives in Stages 1 to 3, and Probability objectives begin in Stage 2","ar":"Money has objectives in Stages 1 to 3, and Probability objectives begin in Stage 2"},{"en":"Money has objectives in all six stages, and Probability objectives begin in Stage 1","ar":"Money has objectives in all six stages, and Probability objectives begin in Stage 1"},{"en":"Money begins in Stage 4, and Probability objectives are listed only in Stage 6","ar":"Money begins in Stage 4, and Probability objectives are listed only in Stage 6"},{"en":"Money and Probability both have objectives in every stage from Stage 1 to Stage 6","ar":"Money and Probability both have objectives in every stage from Stage 1 to Stage 6"}],"correct":0,"expl":{"en":"The framework lists Nm objectives in Stages 1, 2 and 3 only, and Sp objectives from Stage 2 (2Sp.01) onward.","ar":"The framework lists Nm objectives in Stages 1, 2 and 3 only, and Sp objectives from Stage 2 (2Sp.01) onward."}}]},{"id":"m4","title":{"en":"Thinking and Working Mathematically: The Eight Characteristics","ar":"Thinking and Working Mathematically: The Eight Characteristics"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework calls Thinking and Working Mathematically (TWM) a unique feature of Cambridge Primary Mathematics. It describes a way of learning in which pupils \"actively engage\" with mathematics, seek to make sense of ideas and build connections between facts, procedures and concepts. The framework contrasts this with learners who \"simply follow instructions\" and carry out processes without understanding why they work or what the results mean.","ar":"The framework calls Thinking and Working Mathematically (TWM) a unique feature of Cambridge Primary Mathematics. It describes a way of learning in which pupils \"actively engage\" with mathematics, seek to make sense of ideas and build connections between facts, procedures and concepts. The framework contrasts this with learners who \"simply follow instructions\" and carry out processes without understanding why they work or what the results mean."}},{"t":"p","c":{"en":"This is the module where the framework's idea of mathematics as thinking, not only calculating, becomes practical. TWM is not an extra topic. It is the way pupils work on the topics in every strand.","ar":"This is the module where the framework's idea of mathematics as thinking, not only calculating, becomes practical. TWM is not an extra topic. It is the way pupils work on the topics in every strand."}},{"t":"h","c":{"en":"Eight characteristics in four pairs","ar":"Eight characteristics in four pairs"}},{"t":"p","c":{"en":"The framework says that TWM has eight characteristics, presented in four pairs. The four pairs are shown in the TWM Star. The characteristics are \"intertwined and interdependent\", and a high-quality task may draw on one or more of them. The framework also says that they provide the language needed to make decisions about which knowledge, procedures and strategies to use. The definitions below follow the framework closely.","ar":"The framework says that TWM has eight characteristics, presented in four pairs. The four pairs are shown in the TWM Star. The characteristics are \"intertwined and interdependent\", and a high-quality task may draw on one or more of them. The framework also says that they provide the language needed to make decisions about which knowledge, procedures and strategies to use. The definitions below follow the framework closely."}},{"t":"table","head":{"en":["Pair","Characteristic (code)","Definition (from the framework)"],"ar":["Pair","Characteristic (code)","Definition (from the framework)"]},"rows":[{"en":["Specialising and Generalising","Specialising (TWM.01)","Choosing an example and checking whether it satisfies or does not satisfy specific mathematical criteria"],"ar":["Specialising and Generalising","Specialising (TWM.01)","Choosing an example and checking whether it satisfies or does not satisfy specific mathematical criteria"]},{"en":["Specialising and Generalising","Generalising (TWM.02)","Recognising an underlying pattern by identifying many examples that satisfy the same criteria"],"ar":["Specialising and Generalising","Generalising (TWM.02)","Recognising an underlying pattern by identifying many examples that satisfy the same criteria"]},{"en":["Conjecturing and Convincing","Conjecturing (TWM.03)","Forming mathematical questions or ideas"],"ar":["Conjecturing and Convincing","Conjecturing (TWM.03)","Forming mathematical questions or ideas"]},{"en":["Conjecturing and Convincing","Convincing (TWM.04)","Presenting evidence to justify or challenge a mathematical idea or solution"],"ar":["Conjecturing and Convincing","Convincing (TWM.04)","Presenting evidence to justify or challenge a mathematical idea or solution"]},{"en":["Characterising and Classifying","Characterising (TWM.05)","Identifying and describing the mathematical properties of an object"],"ar":["Characterising and Classifying","Characterising (TWM.05)","Identifying and describing the mathematical properties of an object"]},{"en":["Characterising and Classifying","Classifying (TWM.06)","Organising objects into groups according to their mathematical properties"],"ar":["Characterising and Classifying","Classifying (TWM.06)","Organising objects into groups according to their mathematical properties"]},{"en":["Critiquing and Improving","Critiquing (TWM.07)","Comparing and evaluating ideas, representations or solutions to identify advantages and disadvantages"],"ar":["Critiquing and Improving","Critiquing (TWM.07)","Comparing and evaluating ideas, representations or solutions to identify advantages and disadvantages"]},{"en":["Critiquing and Improving","Improving (TWM.08)","Refining ideas or representations to develop a more effective approach or solution"],"ar":["Critiquing and Improving","Improving (TWM.08)","Refining ideas or representations to develop a more effective approach or solution"]}]},{"t":"p","c":{"en":"The framework adds that these characteristics are based on extensive research by Professor John Mason. It also says that TWM \"can be stimulated by inconsistencies, patterns or particular representations, and can be improved through practice, reflection and questioning\". This is helpful for planning: a surprising result, a visible pattern or a good diagram can start TWM.","ar":"The framework adds that these characteristics are based on extensive research by Professor John Mason. It also says that TWM \"can be stimulated by inconsistencies, patterns or particular representations, and can be improved through practice, reflection and questioning\". This is helpful for planning: a surprising result, a visible pattern or a good diagram can start TWM."}},{"t":"callout","k":"key","title":{"en":"TWM is embedded, not separate","ar":"TWM is embedded, not separate"},"c":{"en":"The framework says TWM \"should not be taught as a separate special activity but instead it should be embedded throughout the curriculum\". Every stage lists TWM.01 to TWM.08. For early years learners, the framework expects them to explore mathematical ideas \"using language and strategies that are personal to them\". So in FS2 and Year 1, a child's own words are welcome. Over the stages, you help the language become more precise.","ar":"The framework says TWM \"should not be taught as a separate special activity but instead it should be embedded throughout the curriculum\". Every stage lists TWM.01 to TWM.08. For early years learners, the framework expects them to explore mathematical ideas \"using language and strategies that are personal to them\". So in FS2 and Year 1, a child's own words are welcome. Over the stages, you help the language become more precise."}},{"t":"h","c":{"en":"What each pair looks like in a primary classroom","ar":"What each pair looks like in a primary classroom"}},{"t":"p","c":{"en":"The examples below are good practice, written to match objectives in the framework at different stages. They are not Cambridge requirements.","ar":"The examples below are good practice, written to match objectives in the framework at different stages. They are not Cambridge requirements."}},{"t":"table","head":{"en":["Pair","Stages 1 to 2","Stages 3 to 4","Stages 5 to 6"],"ar":["Pair","Stages 1 to 2","Stages 3 to 4","Stages 5 to 6"]},"rows":[{"en":["Specialising and Generalising","Pupils choose several numbers from 0 to 20 and check if each is even (1Nc.05). They notice that every other number is even.","Pupils try pairs such as 6 + 9 and 9 + 6 and then others (3Ni.02). They say, \"The order does not change the total.\"","Pupils test many numbers for divisibility by 4 (5Ni.07), then describe what the last two digits tell them."],"ar":["Specialising and Generalising","Pupils choose several numbers from 0 to 20 and check if each is even (1Nc.05). They notice that every other number is even.","Pupils try pairs such as 6 + 9 and 9 + 6 and then others (3Ni.02). They say, \"The order does not change the total.\"","Pupils test many numbers for divisibility by 4 (5Ni.07), then describe what the last two digits tell them."]},{"en":["Conjecturing and Convincing","A pupil asks, \"Does a shape with four sides always have four corners?\" and uses sorted shapes as evidence (2Gg.01).","A pupil says, \"An odd number plus an odd number makes an even number\" (4Nc.02) and convinces others using objects in pairs.","A pupil says, \"If a number is divisible by 6, it must be even.\" The class tests this using divisibility ideas (6Ni.07)."],"ar":["Conjecturing and Convincing","A pupil asks, \"Does a shape with four sides always have four corners?\" and uses sorted shapes as evidence (2Gg.01).","A pupil says, \"An odd number plus an odd number makes an even number\" (4Nc.02) and convinces others using objects in pairs.","A pupil says, \"If a number is divisible by 6, it must be even.\" The class tests this using divisibility ideas (6Ni.07)."]},{"en":["Characterising and Classifying","Pupils describe 2D shapes by the number of sides and whether they are curved or straight, then sort them (1Gg.01).","Pupils describe polygons and classify them as regular or irregular (3Gg.01).","Pupils describe angles and sides in triangles and quadrilaterals and group them (5Gg.01, 6Gg.01)."],"ar":["Characterising and Classifying","Pupils describe 2D shapes by the number of sides and whether they are curved or straight, then sort them (1Gg.01).","Pupils describe polygons and classify them as regular or irregular (3Gg.01).","Pupils describe angles and sides in triangles and quadrilaterals and group them (5Gg.01, 6Gg.01)."]},{"en":["Critiquing and Improving","Pupils compare two block graphs of the same data and say which is easier to read (2Ss.02).","Pupils compare two methods for the area of a compound shape and say which is more efficient (4Gg.02).","Pupils decide whether mean or median better describes a data set, and improve a poor choice (6Ss.03)."],"ar":["Critiquing and Improving","Pupils compare two block graphs of the same data and say which is easier to read (2Ss.02).","Pupils compare two methods for the area of a compound shape and say which is more efficient (4Gg.02).","Pupils decide whether mean or median better describes a data set, and improve a poor choice (6Ss.03)."]}]},{"t":"h","c":{"en":"How to embed TWM in a lesson","ar":"How to embed TWM in a lesson"}},{"t":"steps","c":{"en":["\u003cstrong>Start from the objective.\u003c/strong> Choose the learning objective for the lesson, for example 3Gg.03 on perimeter and area.","\u003cstrong>Choose one pair that fits.\u003c/strong> Do not try to use all eight. For perimeter and area, Specialising and Generalising fits well: pupils try several rectangles and look for a pattern.","\u003cstrong>Write two or three prompts.\u003c/strong> Good practice prompts include \"Can you find an example that works?\", \"Does it always work?\", \"How do you know?\" and \"Which way is more efficient, and why?\"","\u003cstrong>Plan the language.\u003c/strong> Prepare sentence stems, for example \"I think ... because ...\", \"My example shows ...\", \"I disagree because ...\". ESL learners can then take part in the thinking, even with limited English.","\u003cstrong>Allow time to reflect.\u003c/strong> End with one question that asks pupils to think about their thinking, for example \"What helped you to be sure?\""],"ar":["\u003cstrong>Start from the objective.\u003c/strong> Choose the learning objective for the lesson, f
