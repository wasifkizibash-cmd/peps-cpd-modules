or example 3Gg.03 on perimeter and area.","\u003cstrong>Choose one pair that fits.\u003c/strong> Do not try to use all eight. For perimeter and area, Specialising and Generalising fits well: pupils try several rectangles and look for a pattern.","\u003cstrong>Write two or three prompts.\u003c/strong> Good practice prompts include \"Can you find an example that works?\", \"Does it always work?\", \"How do you know?\" and \"Which way is more efficient, and why?\"","\u003cstrong>Plan the language.\u003c/strong> Prepare sentence stems, for example \"I think ... because ...\", \"My example shows ...\", \"I disagree because ...\". ESL learners can then take part in the thinking, even with limited English.","\u003cstrong>Allow time to reflect.\u003c/strong> End with one question that asks pupils to think about their thinking, for example \"What helped you to be sure?\""]}},{"t":"callout","k":"tip","title":{"en":"Prompts for each characteristic (good practice)","ar":"Prompts for each characteristic (good practice)"},"c":{"en":"\u003cstrong>Specialising:\u003c/strong> \"Try an example.\" \u003cstrong>Generalising:\u003c/strong> \"What do you notice about all your examples?\" \u003cstrong>Conjecturing:\u003c/strong> \"What do you think will happen? Why?\" \u003cstrong>Convincing:\u003c/strong> \"Can you prove it to a friend?\" \u003cstrong>Characterising:\u003c/strong> \"What can you say about this shape or number?\" \u003cstrong>Classifying:\u003c/strong> \"Which group does this belong to?\" \u003cstrong>Critiquing:\u003c/strong> \"What is good about this method, and what is not?\" \u003cstrong>Improving:\u003c/strong> \"How could we make it clearer or faster?\"","ar":"\u003cstrong>Specialising:\u003c/strong> \"Try an example.\" \u003cstrong>Generalising:\u003c/strong> \"What do you notice about all your examples?\" \u003cstrong>Conjecturing:\u003c/strong> \"What do you think will happen? Why?\" \u003cstrong>Convincing:\u003c/strong> \"Can you prove it to a friend?\" \u003cstrong>Characterising:\u003c/strong> \"What can you say about this shape or number?\" \u003cstrong>Classifying:\u003c/strong> \"Which group does this belong to?\" \u003cstrong>Critiquing:\u003c/strong> \"What is good about this method, and what is not?\" \u003cstrong>Improving:\u003c/strong> \"How could we make it clearer or faster?\""}},{"t":"h","c":{"en":"Common misunderstandings about TWM","ar":"Common misunderstandings about TWM"}},{"t":"list","c":{"en":["\u003cstrong>\"TWM is for strong pupils only.\"\u003c/strong> The framework says it applies to all primary stages. A young or weaker pupil can specialise (try an example) and convince (show with objects).","\u003cstrong>\"We need a special TWM lesson each week.\"\u003c/strong> The framework says the opposite: embed it throughout.","\u003cstrong>\"If pupils talk, they are doing TWM.\"\u003c/strong> Talk is only useful if it involves the characteristics, for example giving evidence or comparing methods.","\u003cstrong>\"TWM means not teaching procedures.\"\u003c/strong> The framework wants understanding of why procedures work, not the removal of procedures."],"ar":["\u003cstrong>\"TWM is for strong pupils only.\"\u003c/strong> The framework says it applies to all primary stages. A young or weaker pupil can specialise (try an example) and convince (show with objects).","\u003cstrong>\"We need a special TWM lesson each week.\"\u003c/strong> The framework says the opposite: embed it throughout.","\u003cstrong>\"If pupils talk, they are doing TWM.\"\u003c/strong> Talk is only useful if it involves the characteristics, for example giving evidence or comparing methods.","\u003cstrong>\"TWM means not teaching procedures.\"\u003c/strong> The framework wants understanding of why procedures work, not the removal of procedures."]}},{"t":"scenario","title":{"en":"Scenario: finding the TWM in a Year 3 lesson","ar":"Scenario: finding the TWM in a Year 3 lesson"},"c":{"en":"A Year 3 teacher plans a lesson on 3Gg.03 and 3Gg.04: perimeter and area on a square grid. Her original plan is a worksheet of ten rectangles. She improves it using TWM. First, pupils choose their own rectangle with a perimeter of 12 units (specialising). Next, they compare answers: 5 by 1, 4 by 2 and 3 by 3 all have a perimeter of 12 but different areas of 5, 8 and 9 square units. A pupil conjectures: \"The square always has the biggest area.\" Others test the idea with a perimeter of 16 (convincing). Aisha, an ESL learner, uses the stem \"My example shows ... \" and a drawing. The lesson now meets the objective and builds a habit of reasoning.","ar":"A Year 3 teacher plans a lesson on 3Gg.03 and 3Gg.04: perimeter and area on a square grid. Her original plan is a worksheet of ten rectangles. She improves it using TWM. First, pupils choose their own rectangle with a perimeter of 12 units (specialising). Next, they compare answers: 5 by 1, 4 by 2 and 3 by 3 all have a perimeter of 12 but different areas of 5, 8 and 9 square units. A pupil conjectures: \"The square always has the biggest area.\" Others test the idea with a perimeter of 16 (convincing). Aisha, an ESL learner, uses the stem \"My example shows ... \" and a drawing. The lesson now meets the objective and builds a habit of reasoning."}}],"checks":[{"id":"m4q1","q":{"en":"Which list shows the four pairs of TWM characteristics in the framework?","ar":"Which list shows the four pairs of TWM characteristics in the framework?"},"opts":[{"en":"Specialising and Estimating; Conjecturing and Convincing; Describing and Sorting; Critiquing and Checking, as four separate pairs","ar":"Specialising and Estimating; Conjecturing and Convincing; Describing and Sorting; Critiquing and Checking, as four separate pairs"},{"en":"Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving","ar":"Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving"},{"en":"Specialising and Generalising; Predicting and Proving; Characterising and Classifying; Reviewing and Improving","ar":"Specialising and Generalising; Predicting and Proving; Characterising and Classifying; Reviewing and Improving"},{"en":"Estimating and Generalising; Conjecturing and Convincing; Characterising and Sorting; Critiquing and Reflecting","ar":"Estimating and Generalising; Conjecturing and Convincing; Characterising and Sorting; Critiquing and Reflecting"}],"correct":1,"expl":{"en":"The framework names eight characteristics in four pairs: Specialising and Generalising, Conjecturing and Convincing, Characterising and Classifying, and Critiquing and Improving.","ar":"The framework names eight characteristics in four pairs: Specialising and Generalising, Conjecturing and Convincing, Characterising and Classifying, and Critiquing and Improving."}},{"id":"m4q2","q":{"en":"Pupils are asked to present evidence to show that a statement is true or false. Which characteristic is this?","ar":"Pupils are asked to present evidence to show that a statement is true or false. Which characteristic is this?"},"opts":[{"en":"Specialising","ar":"Specialising"},{"en":"Characterising","ar":"Characterising"},{"en":"Convincing","ar":"Convincing"},{"en":"Improving","ar":"Improving"}],"correct":2,"expl":{"en":"The framework defines Convincing as presenting evidence to justify or challenge a mathematical idea or solution.","ar":"The framework defines Convincing as presenting evidence to justify or challenge a mathematical idea or solution."}},{"id":"m4q3","q":{"en":"A headteacher asks where TWM fits in your timetable. Which answer follows the framework?","ar":"A headteacher asks where TWM fits in your timetable. Which answer follows the framework?"},"opts":[{"en":"It has its own weekly lesson in Stages 4 to 6, when pupils can reason in writing","ar":"It has its own weekly lesson in Stages 4 to 6, when pupils can reason in writing"},{"en":"It is taught as a unit at the end of each term, after the content is finished","ar":"It is taught as a unit at the end of each term, after the content is finished"},{"en":"It is used only with pupils who have already finished the work early in class","ar":"It is used only with pupils who have already finished the work early in class"},{"en":"It is embedded across all strands and not taught as a separate special activity","ar":"It is embedded across all strands and not taught as a separate special activity"}],"correct":3,"expl":{"en":"The framework says TWM should not be taught as a separate special activity but embedded throughout the curriculum.","ar":"The framework says TWM should not be taught as a separate special activity but embedded throughout the curriculum."}}]},{"id":"m5","title":{"en":"Number I: Counting, Place Value, Ordering, Rounding and Money","ar":"Number I: Counting, Place Value, Ordering, Rounding and Money"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that Number is \"the foundation of the primary mathematics curriculum\". This module and the next one look at the five Number sub-strands. Here we study three: Counting and sequences (Nc), Place value, ordering and rounding (Np), and Money (Nm). The examples quote the framework's objective codes so that you can check them. Please read the full wording in the framework before planning.","ar":"The framework says that Number is \"the foundation of the primary mathematics curriculum\". This module and the next one look at the five Number sub-strands. Here we study three: Counting and sequences (Nc), Place value, ordering and rounding (Np), and Money (Nm). The examples quote the framework's objective codes so that you can check them. Please read the full wording in the framework before planning."}},{"t":"h","c":{"en":"Counting and sequences (Nc)","ar":"Counting and sequences (Nc)"}},{"t":"p","c":{"en":"The framework says that learners are introduced to numbers and their properties by counting objects, so that they understand how numbers are represented and what quantities they stand for. They also identify patterns and sequences \"to facilitate early algebraic thinking\". So Nc is not only about counting aloud. It is also the start of algebra.","ar":"The framework says that learners are introduced to numbers and their properties by counting objects, so that they understand how numbers are represented and what quantities they stand for. They also identify patterns and sequences \"to facilitate early algebraic thinking\". So Nc is not only about counting aloud. It is also the start of algebra."}},{"t":"table","head":{"en":["Stage","Counting range and steps","Patterns, sequences and unknowns"],"ar":["Stage","Counting range and steps","Patterns, sequences and unknowns"]},"rows":[{"en":["1","Count objects 0 to 20 with conservation of number and one-to-one correspondence (1Nc.01); recognise familiar patterns up to 10 without counting (1Nc.02); count on in ones, twos or tens (1Nc.04)","Even and odd as \"every other number\" (1Nc.05); describe sequences of objects in familiar language (1Nc.06)"],"ar":["1","Count objects 0 to 20 with conservation of number and one-to-one correspondence (1Nc.01); recognise familiar patterns up to 10 without counting (1Nc.02); count on in ones, twos or tens (1Nc.04)","Even and odd as \"every other number\" (1Nc.05); describe sequences of objects in familiar language (1Nc.06)"]},{"en":["2","Count to 100 (2Nc.01); count on and back in ones, twos, fives or tens (2Nc.04); estimate up to 100 (2Nc.03)","Recognise, describe and extend numerical sequences (2Nc.06); characteristics of even and odd (2Nc.05)"],"ar":["2","Count to 100 (2Nc.01); count on and back in ones, twos, fives or tens (2Nc.04); estimate up to 100 (2Nc.03)","Recognise, describe and extend numerical sequences (2Nc.06); characteristics of even and odd (2Nc.05)"]},{"en":["3","Estimate up to 1000 (3Nc.01); count in steps of constant size, including hundreds, from 0 to 1000 (3Nc.02)","An object represents an unknown quantity (3Nc.04); linear sequences and the term-to-term rule (3Nc.05)"],"ar":["3","Estimate up to 1000 (3Nc.01); count in steps of constant size, including hundreds, from 0 to 1000 (3Nc.02)","An object represents an unknown quantity (3Nc.04); linear sequences and the term-to-term rule (3Nc.05)"]},{"en":["4","Count in steps including thousands and extend beyond zero to negative numbers (4Nc.01)","Generalisations about even and odd (4Nc.02); objects, shapes or symbols for unknowns (4Nc.03); linear and non-linear sequences (4Nc.04); square numbers (4Nc.05)"],"ar":["4","Count in steps including thousands and extend beyond zero to negative numbers (4Nc.01)","Generalisations about even and odd (4Nc.02); objects, shapes or symbols for unknowns (4Nc.03); linear and non-linear sequences (4Nc.04); square numbers (4Nc.05)"]},{"en":["5","Count in steps of constant size, beyond zero (5Nc.01)","Two unknown quantities (5Nc.02); any term of a linear sequence (5Nc.03); square and triangular numbers (5Nc.04)"],"ar":["5","Count in steps of constant size, beyond zero (5Nc.01)","Two unknown quantities (5Nc.02); any term of a linear sequence (5Nc.03); square and triangular numbers (5Nc.04)"]},{"en":["6","Count in steps including fractions and decimals, beyond zero (6Nc.01)","Letters for quantities that vary (6Nc.02); position-to-term rule (6Nc.03); square numbers to generate terms (6Nc.04)"],"ar":["6","Count in steps including fractions and decimals, beyond zero (6Nc.01)","Letters for quantities that vary (6Nc.02); position-to-term rule (6Nc.03); square numbers to generate terms (6Nc.04)"]}]},{"t":"p","c":{"en":"Look at the unknowns column. In Stage 3 a box or picture can stand for an unknown (for example, [ ] + 7 = 12). In Stage 5 there can be two unknowns, and by Stage 6 letters are used for quantities that vary. This is a gentle path to algebra, and each step prepares for the next.","ar":"Look at the unknowns column. In Stage 3 a box or picture can stand for an unknown (for example, [ ] + 7 = 12). In Stage 5 there can be two unknowns, and by Stage 6 letters are used for quantities that vary. This is a gentle path to algebra, and each step prepares for the next."}},{"t":"callout","k":"tip","title":{"en":"Conservation of number","ar":"Conservation of number"},"c":{"en":"The glossary defines conservation of number as \"the principle that a given quantity does not change when it is physically rearranged\". A Year 1 pupil who recounts a line of 8 counters after you spread them out has not yet secured this idea. Good practice: ask \"How many now?\" after rearranging, and let pupils check by matching one to one.","ar":"The glossary defines conservation of number as \"the principle that a given quantity does not change when it is physically rearranged\". A Year 1 pupil who recounts a line of 8 counters after you spread them out has not yet secured this idea. Good practice: ask \"How many now?\" after rearranging, and let pupils check by matching one to one."}},{"t":"h","c":{"en":"Place value, ordering and rounding (Np)","ar":"Place value, ordering and rounding (Np)"}},{"t":"p","c":{"en":"Place value is the idea that the value of a digit depends on its position. The framework shows the range growing steadily. In Stage 1, learners understand that zero represents none of something (1Np.01) and compose, decompose and regroup numbers from 10 to 20 (1Np.02). In Stage 2, they work with 2-digit numbers, recognising zero as a place holder (2Np.01). In Stage 3, they reach 3-digit numbers, and from Stage 4 the framework no longer limits the size of whole numbers (4Np.01). In Stage 5, decimals appear with tenths and hundredths (5Np.01), and in Stage 6, thousandths (6Np.01).","ar":"Place value is the idea that the value of a digit depends on its position. The framework shows the range growing steadily. In Stage 1, learners understand that zero represents none of something (1Np.01) and compose, decompose and regroup numbers from 10 to 20 (1Np.02). In Stage 2, they work with 2-digit numbers, recognising zero as a place holder (2Np.01). In Stage 3, they reach 3-digit numbers, and from Stage 4 the framework no longer limits the size of whole numbers (4Np.01). In Stage 5, decimals appear with tenths and hundredths (5Np.01), and in Stage 6, thousandths (6Np.01)."}},{"t":"p","c":{"en":"The glossary gives clear meanings for three key terms, using the number 712. To \u003cstrong>compose\u003c/strong> is to build a number, 700 + 10 + 2 = 712. To \u003cstrong>decompose\u003c/strong> is to break it up, 712 = 700 + 10 + 2. To \u003cstrong>regroup\u003c/strong> is to write it in another way to help calculation, such as 71 tens and 2 ones, or 701 + 11.","ar":"The glossary gives clear meanings for three key terms, using the number 712. To \u003cstrong>compose\u003c/strong> is to build a number, 700 + 10 + 2 = 712. To \u003cstrong>decompose\u003c/strong> is to break it up, 712 = 700 + 10 + 2. To \u003cstrong>regroup\u003c/strong> is to write it in another way to help calculation, such as 71 tens and 2 ones, or 701 + 11."}},{"t":"table","head":{"en":["Idea","How it develops across stages"],"ar":["Idea","How it develops across stages"]},"rows":[{"en":["Ordering and comparing","Relative size of quantities to order numbers: 0 to 20 (1Np.03), 2-digit (2Np.03), 3-digit with the symbols =, > and \u003c (3Np.04), positive and negative numbers (4Np.04). From Stage 5, ordering includes decimals, fractions and percentages (5Nf.08)"],"ar":["Ordering and comparing","Relative size of quantities to order numbers: 0 to 20 (1Np.03), 2-digit (2Np.03), 3-digit with the symbols =, > and \u003c (3Np.04), positive and negative numbers (4Np.04). From Stage 5, ordering includes decimals, fractions and percentages (5Nf.08)"]},{"en":["Multiplying and dividing by powers of ten","Multiply whole numbers by 10 (3Np.02); multiply and divide by 10 and 100 (4Np.02); by 10, 100 and 1000 (5Np.02); decimals by 10 and 100 (5Np.03); whole numbers and decimals by 10, 100 and 1000 (6Np.02)"],"ar":["Multiplying and dividing by powers of ten","Multiply whole numbers by 10 (3Np.02); multiply and divide by 10 and 100 (4Np.02); by 10, 100 and 1000 (5Np.02); decimals by 10 and 100 (5Np.03); whole numbers and decimals by 10, 100 and 1000 (6Np.02)"]},{"en":["Rounding","Nearest 10 (2Np.05); nearest 10 or 100 (3Np.05); nearest 10, 100, 1000, 10 000 or 100 000 (4Np.05); one decimal place to the nearest whole number (5Np.05); two decimal places to the nearest tenth or whole number (6Np.04)"],"ar":["Rounding","Nearest 10 (2Np.05); nearest 10 or 100 (3Np.05); nearest 10, 100, 1000, 10 000 or 100 000 (4Np.05); one decimal place to the nearest whole number (5Np.05); two decimal places to the nearest tenth or whole number (6Np.04)"]}]},{"t":"callout","k":"warn","title":{"en":"A common misconception: \"adding a zero\"","ar":"A common misconception: \"adding a zero\""},"c":{"en":"Pupils often learn \"to multiply by 10, add a zero\". This fails for 3.4 x 10, where the answer is 34, not 3.40. The framework talks about using knowledge of place value to multiply and divide. Good practice: show that the digits move one place to the left, using a place value chart and counters.","ar":"Pupils often learn \"to multiply by 10, add a zero\". This fails for 3.4 x 10, where the answer is 34, not 3.40. The framework talks about using knowledge of place value to multiply and divide. Good practice: show that the digits move one place to the left, using a place value chart and counters."}},{"t":"h","c":{"en":"Money (Nm)","ar":"Money (Nm)"}},{"t":"p","c":{"en":"Money has the smallest sub-strand. In Stage 1 learners recognise money used in local currency (1Nm.01). In Stage 2 they recognise the value and notation of local currency and compare the values of different combinations of coins or notes (2Nm.01, 2Nm.02). In Stage 3 they interpret money notation for currencies that use a decimal point (3Nm.01), and add and subtract amounts of money to give change (3Nm.02).","ar":"Money has the smallest sub-strand. In Stage 1 learners recognise money used in local currency (1Nm.01). In Stage 2 they recognise the value and notation of local currency and compare the values of different combinations of coins or notes (2Nm.01, 2Nm.02). In Stage 3 they interpret money notation for currencies that use a decimal point (3Nm.01), and add and subtract amounts of money to give change (3Nm.02)."}},{"t":"p","c":{"en":"The framework says \"local currency\", so a PEPS teacher can use dirhams and fils in class. Real coins, a class shop and price labels help. Because Stage 3 uses a decimal point in money, children may meet a decimal-style notation earlier than the formal study of decimals in Stage 5. The two are different objectives: Stage 3 is about reading and using money notation, while Stage 5 is about the value of digits in decimals (5Np.01).","ar":"The framework says \"local currency\", so a PEPS teacher can use dirhams and fils in class. Real coins, a class shop and price labels help. Because Stage 3 uses a decimal point in money, children may meet a decimal-style notation earlier than the formal study of decimals in Stage 5. The two are different objectives: Stage 3 is about reading and using money notation, while Stage 5 is about the value of digits in decimals (5Np.01)."}},{"t":"p","c":{"en":"There are no separate Nm objectives for Stages 4 to 6. Good practice: continue to use money as a context for other objectives, for example adding decimals (5Nf.09) or finding percentages.","ar":"There are no separate Nm objectives for Stages 4 to 6. Good practice: continue to use money as a context for other objectives, for example adding decimals (5Nf.09) or finding percentages."}},{"t":"scenario","title":{"en":"Scenario: rounding in Year 3","ar":"Scenario: rounding in Year 3"},"c":{"en":"A Year 3 pupil rounds 347 to the nearest 100 and writes 400, saying \"the 7 is big\". Another pupil writes 300 and says, \"I looked at the 4 in the tens place, and 4 is less than 5.\" This is objective 3Np.05 (round 3-digit numbers to the nearest 10 or 100). Ask both pupils to place 347 on a number line between 300 and 400 and mark the midpoint, 350. Because 347 is before the midpoint, it is closer to 300. The second pupil used the right digit, the one just to the right of the place being rounded to. The first pupil looked at the wrong digit. A number line makes the reason visible.","ar":"A Year 3 pupil rounds 347 to the nearest 100 and writes 400, saying \"the 7 is big\". Another pupil writes 300 and says, \"I looked at the 4 in the tens place, and 4 is less than 5.\" This is objective 3Np.05 (round 3-digit numbers to the nearest 10 or 100). Ask both pupils to place 347 on a number line between 300 and 400 and mark the midpoint, 350. Because 347 is before the midpoint, it is closer to 300. The second pupil used the right digit, the one just to the right of the place being rounded to. The first pupil looked at the wrong digit. A number line makes the reason visible."}},{"t":"scenario","title":{"en":"Scenario: sequences for Year 4","ar":"Scenario: sequences for Year 4"},"c":{"en":"Your Year 4 class is working on 4Nc.04, linear and non-linear sequences. A pupil says, \"The sequence 1, 4, 9, 16 goes up by a different amount each time, so it is not a pattern.\" This is a good moment for Classifying (TWM.06) and square numbers (4Nc.05). Draw squares of side 1, 2, 3 and 4 and ask the pupils to describe the pattern in the differences (3, 5, 7).","ar":"Your Year 4 class is working on 4Nc.04, linear and non-linear sequences. A pupil says, \"The sequence 1, 4, 9, 16 goes up by a different amount each time, so it is not a pattern.\" This is a good moment for Classifying (TWM.06) and square numbers (4Nc.05). Draw squares of side 1, 2, 3 and 4 and ask the pupils to describe the pattern in the differences (3, 5, 7)."}}],"checks":[{"id":"m5q1","q":{"en":"A Year 1 teacher spreads out a row of 8 counters and a pupil recounts them from 1. Which glossary idea is the pupil still developing?","ar":"A Year 1 teacher spreads out a row of 8 counters and a pupil recounts them from 1. Which glossary idea is the pupil still developing?"},"opts":[{"en":"Conservation of number: a quantity does not change when it is physically rearranged","ar":"Conservation of number: a quantity does not change when it is physically rearranged"},{"en":"Complements of a number: pairs of numbers that add up to the same total in a calculation","ar":"Complements of a number: pairs of numbers that add up to the same total in a calculation"},{"en":"Place value: the value of a digit depends on its position in the number","ar":"Place value: the value of a digit depends on its position in the number"},{"en":"Ordinal numbers: numbers that show the position of something in an order","ar":"Ordinal numbers: numbers that show the position of something in an order"}],"correct":0,"expl":{"en":"The glossary defines conservation of number as the principle that a given quantity does not change when it is physically rearranged; 1Nc.01 refers to it.","ar":"The glossary defines conservation of number as the principle that a given quantity does not change when it is physically rearranged; 1Nc.01 refers to it."}},{"id":"m5q2","q":{"en":"In which stage does the framework first include rounding to the nearest 10 (2Np.05)?","ar":"In which stage does the framework first include rounding to the nearest 10 (2Np.05)?"},"opts":[{"en":"Stage 1, for numbers from 10 to 20","ar":"Stage 1, for numbers from 10 to 20"},{"en":"Stage 2, for 2-digit numbers","ar":"Stage 2, for 2-digit numbers"},{"en":"Stage 3, for 3-digit numbers","ar":"Stage 3, for 3-digit numbers"},{"en":"Stage 4, for numbers above 1000","ar":"Stage 4, for numbers above 1000"}],"correct":1,"expl":{"en":"2Np.05 reads \"Round 2-digit numbers to the nearest 10\". Stage 3 extends this to 10 or 100 (3Np.05).","ar":"2Np.05 reads \"Round 2-digit numbers to the nearest 10\". Stage 3 extends this to 10 or 100 (3Np.05)."}},{"id":"m5q3","q":{"en":"Which statement about the Money sub-strand (Nm) is correct?","ar":"Which statement about the Money sub-strand (Nm) is correct?"},"opts":[{"en":"It has objectives in all six stages and includes exchange rates between currencies","ar":"It has objectives in all six stages and includes exchange rates between currencies"},{"en":"It has objectives only in Stage 1 and is replaced by fractions from Stage 2","ar":"It has objectives only in Stage 1 and is replaced by fractions from Stage 2"},{"en":"It has objectives in Stages 1 to 3 and uses local currency and decimal-point notation","ar":"It has objectives in Stages 1 to 3 and uses local currency and decimal-point notation"},{"en":"It first appears in Stage 4 and concentrates on percentages and discounts","ar":"It first appears in Stage 4 and concentrates on percentages and discounts"}],"correct":2,"expl":{"en":"The Nm objectives run from 1Nm.01 to 3Nm.02 and refer to local currency, money notation, coin and note combinations and giving change.","ar":"The Nm objectives run from 1Nm.01 to 3Nm.02 and refer to local currency, money notation, coin and note combinations and giving change."}}]},{"id":"m6","title":{"en":"Number II: Integers, Powers, Fractions, Decimals, Percentages, Ratio and Proportion","ar":"Number II: Integers, Powers, Fractions, Decimals, Percentages, Ratio and Proportion"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This module covers the two biggest Number sub-strands: Integers and powers (Ni), which is about whole-number calculation and the properties of numbers, and Fractions, decimals, percentages, ratio and proportion (Nf). The sequence in which ideas first appear is important for planning, so we will pay special attention to this.","ar":"This module covers the two biggest Number sub-strands: Integers and powers (Ni), which is about whole-number calculation and the properties of numbers, and Fractions, decimals, percentages, ratio and proportion (Nf). The sequence in which ideas first appear is important for planning, so we will pay special attention to this."}},{"t":"h","c":{"en":"Integers and powers (Ni)","ar":"Integers and powers (Ni)"}},{"t":"p","c":{"en":"The glossary says an \u003cstrong>integer\u003c/strong> is any positive or negative whole number and zero, and a \u003cstrong>whole number\u003c/strong> is a positive whole number or zero. Ni begins with whole numbers and addition and subtraction, and extends to multiplication, division, factors, multiples and special numbers.","ar":"The glossary says an \u003cstrong>integer\u003c/strong> is any positive or negative whole number and zero, and a \u003cstrong>whole number\u003c/strong> is a positive whole number or zero. Ni begins with whole numbers and addition and subtraction, and extends to multiplication, division, factors, multiples and special numbers."}},{"t":"table","head":{"en":["Stage","Addition and subtraction","Multiplication and division","Number properties"],"ar":["Stage","Addition and subtraction","Multiplication and division","Number properties"]},"rows":[{"en":["1","Addition as counting on or combining sets, subtraction as counting back, take away or difference (1Ni.02, 1Ni.03); complements of 10 (1Ni.04); answers 0 to 20 (1Ni.05)","Doubles up to double 10 (1Ni.06)","Read and write numbers 0 to 20 (1Ni.01)"],"ar":["1","Addition as counting on or combining sets, subtraction as counting back, take away or difference (1Ni.02, 1Ni.03); complements of 10 (1Ni.04); answers 0 to 20 (1Ni.05)","Doubles up to double 10 (1Ni.06)","Read and write numbers 0 to 20 (1Ni.01)"]},{"en":["2","The relationship between addition and subtraction (2Ni.02); up to 2 digits, no regrouping (2Ni.04)","Multiplication as repeated addition or an array; division as sharing or grouping; 1, 2, 5 and 10 times tables (2Ni.05 to 2Ni.07)","Complements of 20 and of multiples of 10 (2Ni.03)"],"ar":["2","The relationship between addition and subtraction (2Ni.02); up to 2 digits, no regrouping (2Ni.04)","Multiplication as repeated addition or an array; division as sharing or grouping; 1, 2, 5 and 10 times tables (2Ni.05 to 2Ni.07)","Complements of 20 and of multiples of 10 (2Ni.03)"]},{"en":["3","Up to 3 digits with regrouping (3Ni.04); commutative and associative properties of addition (3Ni.02)","Relationship between multiplication and division (3Ni.05); commutative and distributive properties (3Ni.06); times tables 1 to 6, 8, 9 and 10 (3Ni.07); multiply and divide up to 100 by 2, 3, 4, 5 (3Ni.08, 3Ni.09)","Complements of 100 (3Ni.03); multiples of 2, 5 and 10 (3Ni.10)"],"ar":["3","Up to 3 digits with regrouping (3Ni.04); commutative and associative properties of addition (3Ni.02)","Relationship between multiplication and division (3Ni.05); commutative and distributive properties (3Ni.06); times tables 1 to 6, 8, 9 and 10 (3Ni.07); multiply and divide up to 100 by 2, 3, 4, 5 (3Ni.08, 3Ni.09)","Complements of 100 (3Ni.03); multiples of 2, 5 and 10 (3Ni.10)"]},{"en":["4","Estimate, add and subtract up to three digits (4Ni.02)","All times tables from 1 to 10 (4Ni.04); associative property of multiplication (4Ni.03); multiply up to 1000 by 1 digit (4Ni.05); divide up to 100 by 1 digit (4Ni.06)","Factors and multiples (4Ni.07); divisibility by 2, 5, 10, 25, 50, 100 (4Ni.08)"],"ar":["4","Estimate, add and subtract up to three digits (4Ni.02)","All times tables from 1 to 10 (4Ni.04); associative property of multiplication (4Ni.03); multiply up to 1000 by 1 digit (4Ni.05); divide up to 100 by 1 digit (4Ni.06)","Factors and multiples (4Ni.07); divisibility by 2, 5, 10, 25, 50, 100 (4Ni.08)"]},{"en":["5","Integers, including where one is negative (5Ni.01)","Order of the four operations (5Ni.03); multiply up to 1000 by 1 or 2 digits (5Ni.04); divide up to 1000 by 1 digit (5Ni.05)","Prime and composite (5Ni.06); divisibility by 4 and 8 (5Ni.07); square numbers 1 to 100 (5Ni.08)"],"ar":["5","Integers, including where one is negative (5Ni.01)","Order of the four operations (5Ni.03); multiply up to 1000 by 1 or 2 digits (5Ni.04); divide up to 1000 by 1 digit (5Ni.05)","Prime and composite (5Ni.06); divisibility by 4 and 8 (5Ni.07); square numbers 1 to 100 (5Ni.08)"]},{"en":["6","Estimate, add and subtract integers (6Ni.01)","Laws of arithmetic and order of operations, brackets (6Ni.02, 6Ni.03); multiply up to 10 000 and divide up to 1000 by 1 or 2 digits (6Ni.04, 6Ni.05)","Common multiples and factors (6Ni.06); divisibility by 3, 6, 9 (6Ni.07); cube numbers 1 to 125 (6Ni.08)"],"ar":["6","Estimate, add and subtract integers (6Ni.01)","Laws of arithmetic and order of operations, brackets (6Ni.02, 6Ni.03); multiply up to 10 000 and divide up to 1000 by 1 or 2 digits (6Ni.04, 6Ni.05)","Common multiples and factors (6Ni.06); divisibility by 3, 6, 9 (6Ni.07); cube numbers 1 to 125 (6Ni.08)"]}]},{"t":"callout","k":"tip","title":{"en":"A detail worth noticing","ar":"A detail worth noticing"},"c":{"en":"Objective 3Ni.07 lists the 1, 2, 3, 4, 5, 6, 8, 9 and 10 times tables. The 7 times table is not in the Stage 3 list. All times tables from 1 to 10 come in Stage 4 (4Ni.04). Always check the exact list before you set a times-table target.","ar":"Objective 3Ni.07 lists the 1, 2, 3, 4, 5, 6, 8, 9 and 10 times tables. The 7 times table is not in the Stage 3 list. All times tables from 1 to 10 come in Stage 4 (4Ni.04). Always check the exact list before you set a times-table target."}},{"t":"p","c":{"en":"The laws of arithmetic are a group term for the associative, commutative and distributive laws (glossary). They appear gradually: commutative and associative for addition (3Ni.02), commutative and distributive for multiplication (3Ni.06), the associative property of multiplication (4Ni.03), then choosing which law to apply (5Ni.02). In Stage 6, pupils use order of operations and see that brackets can change it (6Ni.03).","ar":"The laws of arithmetic are a group term for the associative, commutative and distributive laws (glossary). They appear gradually: commutative and associative for addition (3Ni.02), commutative and distributive for multiplication (3Ni.06), the associative property of multiplication (4Ni.03), then choosing which law to apply (5Ni.02). In Stage 6, pupils use order of operations and see that brackets can change it (6Ni.03)."}},{"t":"h","c":{"en":"Fractions, decimals, percentages, ratio and proportion (Nf)","ar":"Fractions, decimals, percentages, ratio and proportion (Nf)"}},{"t":"p","c":{"en":"The Nf sub-strand is the longest in Stages 5 and 6, with 11 and 13 objectives. Its ideas arrive in a careful order. Fractions begin in Stage 1, percentages in Stage 4, and ratio and proportion in Stage 5. The framework also says in its Number overview that \"from Stage 4 learners are introduced to percentages, equivalence and negative numbers and in Stage 5 to decimal numbers, order of operations, ratio and proportion.\"","ar":"The Nf sub-strand is the longest in Stages 5 and 6, with 11 and 13 objectives. Its ideas arrive in a careful order. Fractions begin in Stage 1, percentages in Stage 4, and ratio and proportion in Stage 5. The framework also says in its Number overview that \"from Stage 4 learners are introduced to percentages, equivalence and negative numbers and in Stage 5 to decimal numbers, order of operations, ratio and proportion.\""}},{"t":"table","head":{"en":["Idea","First appears","Key objectives"],"ar":["Idea","First appears","Key objectives"]},"rows":[{"en":["Halves","Stage 1","Split into two equal or unequal parts; a half as part of a quantity, as an operator and combining halves to make wholes (1Nf.01 to 1Nf.04)"],"ar":["Halves","Stage 1","Split into two equal or unequal parts; a half as part of a quantity, as an operator and combining halves to make wholes (1Nf.01 to 1Nf.04)"]},{"en":["Quarters and equivalence of halves and quarters","Stage 2","Four equal parts; quarter and three-quarters as operators; equivalence of 1/2 and 2/4 (2Nf.01 to 2Nf.06)"],"ar":["Quarters and equivalence of halves and quarters","Stage 2","Four equal parts; quarter and three-quarters as operators; equivalence of 1/2 and 2/4 (2Nf.01 to 2Nf.06)"]},{"en":["Thirds, fifths and tenths; adding fractions with the same denominator","Stage 3","Fractions as equal parts of a whole or a set; equivalent fractions (halves, quarters, fifths, tenths); estimate, add and subtract fractions with the same denominator (3Nf.01 to 3Nf.08)"],"ar":["Thirds, fifths and tenths; adding fractions with the same denominator","Stage 3","Fractions as equal parts of a whole or a set; equivalent fractions (halves, quarters, fifths, tenths); estimate, add and subtract fractions with the same denominator (3Nf.01 to 3Nf.08)"]},{"en":["Percentages","Stage 4","Percentage as the number of parts in each hundred, with the % symbol (4Nf.06)"],"ar":["Percentages","Stage 4","Percentage as the number of parts in each hundred, with the % symbol (4Nf.06)"]},{"en":["Decimals","Stage 5","Value of digits in decimals (5Np.01); fractions, decimals and percentages with equivalent values (5Nf.04); add and subtract decimals (5Nf.09)"],"ar":["Decimals","Stage 5","Value of digits in decimals (5Np.01); fractions, decimals and percentages with equivalent values (5Nf.04); add and subtract decimals (5Nf.09)"]},{"en":["Proportion and ratio","Stage 5","Proportion compares part to whole; ratio compares part to part (5Nf.11)"],"ar":["Proportion and ratio","Stage 5","Proportion compares part to whole; ratio compares part to part (5Nf.11)"]},{"en":["Improper fractions and mixed numbers","Stage 5","Equivalent value (5Nf.03)"],"ar":["Improper fractions and mixed numbers","Stage 5","Equivalent value (5Nf.03)"]},{"en":["Different denominators, simplest form, direct proportion, equivalent ratios","Stage 6","6Nf.05 (different denominators), 6Nf.03 (simplest form), 6Nf.12 (direct proportion), 6Nf.13 (equivalent ratios)"],"ar":["Different denominators, simplest form, direct proportion, equivalent ratios","Stage 6","6Nf.05 (different denominators), 6Nf.03 (simplest form), 6Nf.12 (direct proportion), 6Nf.13 (equivalent ratios)"]}]},{"t":"callout","k":"warn","title":{"en":"Check the objectives, not only the overview","ar":"Check the objectives, not only the overview"},"c":{"en":"The overview sentence is a broad summary. The objective lists show some earlier steps. For example, equivalent fractions appear before Stage 4: 2Nf.05 (halves and quarters) and 3Nf.06 (halves, quarters, fifths and tenths). Money notation uses a decimal point in Stage 3 (3Nm.01), but decimals as place value begin in Stage 5. Always plan from the objectives and use the overview for the big picture.","ar":"The overview sentence is a broad summary. The objective lists show some earlier steps. For example, equivalent fractions appear before Stage 4: 2Nf.05 (halves and quarters) and 3Nf.06 (halves, quarters, fifths and tenths). Money notation uses a decimal point in Stage 3 (3Nm.01), but decimals as place value begin in Stage 5. Always plan from the objectives and use the overview for the big picture."}},{"t":"h","c":{"en":"Ratio and proportion: the glossary meanings","ar":"Ratio and proportion: the glossary meanings"}},{"t":"p","c":{"en":"The glossary gives precise meanings that help pupils avoid confusion. A \u003cstrong>proportion\u003c/strong> is a part-to-whole comparison. A \u003cstrong>ratio\u003c/strong> is a part-to-part comparison, usually written a : b. The glossary example: if 20 pounds is shared in the ratio 3 : 5, the first person receives 7.50, which is 3/8 of the whole. That is the first person's proportion. In a pastry recipe with fat and flour in the ratio 1 : 2, the fat has half the mass of the flour.","ar":"The glossary gives precise meanings that help pupils avoid confusion. A \u003cstrong>proportion\u003c/strong> is a part-to-whole comparison. A \u003cstrong>ratio\u003c/strong> is a part-to-part comparison, usually written a : b. The glossary example: if 20 pounds is shared in the ratio 3 : 5, the first person receives 7.50, which is 3/8 of the whole. That is the first person's proportion. In a pastry recipe with fat and flour in the ratio 1 : 2, the fat has half the mass of the flour."}},{"t":"p","c":{"en":"This gives a useful classroom check. In the pastry example, fat to flour is 1 : 2, but fat to the whole mixture is 1 out of 3. Ask pupils, \"Is that a ratio or a proportion?\" and let them explain.","ar":"This gives a useful classroom check. In the pastry example, fat to flour is 1 : 2, but fat to the whole mixture is 1 out of 3. Ask pupils, \"Is that a ratio or a proportion?\" and let them explain."}},{"t":"h","c":{"en":"Fractions as operators and as division","ar":"Fractions as operators and as division"}},{"t":"p","c":{"en":"Two ideas repeat through the objectives. A fraction can be seen as \u003cstrong>division\u003c/strong> of the numerator by the denominator (for example 2Nf.03, 3Nf.04, 4Nf.02, 5Nf.01, 6Nf.01). A fraction can also act as an \u003cstrong>operator\u003c/strong>, for example \"one quarter of 20\" (2Nf.04 and later). The range of fractions widens each stage: half, quarter and three-quarters, then unit fractions, then proper fractions, then improper fractions in Stage 6.","ar":"Two ideas repeat through the objectives. A fraction can be seen as \u003cstrong>division\u003c/strong> of the numerator by the denominator (for example 2Nf.03, 3Nf.04, 4Nf.02, 5Nf.01, 6Nf.01). A fraction can also act as an \u003cstrong>operator\u003c/strong>, for example \"one quarter of 20\" (2Nf.04 and later). The range of fractions widens each stage: half, quarter and three-quarters, then unit fractions, then proper fractions, then improper fractions in Stage 6."}},{"t":"callout","k":"tip","title":{"en":"Common fraction and decimal misconceptions (good practice)","ar":"Common fraction and decimal misconceptions (good practice)"},"c":{"en":"Pupils may think that a bigger denominator means a bigger fraction (1/8 is \"bigger\" than 1/4). Objective 4Nf.01 helps: the more parts a whole is divided into, the smaller the parts. Pupils may also think 0.25 is bigger than 0.3 because 25 is bigger than 3. Use a place value chart and compare 0.25 with 0.30.","ar":"Pupils may think that a bigger denominator means a bigger fraction (1/8 is \"bigger\" than 1/4). Objective 4Nf.01 helps: the more parts a whole is divided into, the smaller the parts. Pupils may also think 0.25 is bigger than 0.3 because 25 is bigger than 3. Use a place value chart and compare 0.25 with 0.30."}},{"t":"scenario","title":{"en":"Scenario: where do we start percentages?","ar":"Scenario: where do we start percentages?"},"c":{"en":"A Year 3 teacher wants to include percentages in a unit on fractions because pupils have asked about \"50% off\" signs in shops. The framework introduces percentage in Stage 4 (4Nf.06). The teacher can respond to the pupils' curiosity by linking 50% to a half, an idea they know (1Nf.02, 3Nf.06), without teaching the whole percentage topic early. A Year 4 teacher then builds the formal idea of percentage as parts in each hundred using a 100-square.","ar":"A Year 3 teacher wants to include percentages in a unit on fractions because pupils have asked about \"50% off\" signs in shops. The framework introduces percentage in Stage 4 (4Nf.06). The teacher can respond to the pupils' curiosity by linking 50% to a half, an idea they know (1Nf.02, 3Nf.06), without teaching the whole percentage topic early. A Year 4 teacher then builds the formal idea of percentage as parts in each hundred using a 100-square."}}],"checks":[{"id":"m6q1","q":{"en":"A Year 3 teacher plans to test all the times tables from 1 to 10 at the end of the year. What does objective 3Ni.07 list?","ar":"A Year 3 teacher plans to test all the times tables from 1 to 10 at the end of the year. What does objective 3Ni.07 list?"},"opts":[{"en":"Times tables 1, 2, 5 and 10 only, with the others held back until Stage 4","ar":"Times tables 1, 2, 5 and 10 only, with the others held back until Stage 4"},{"en":"All times tables from 1 to 12, so the Year 3 plan should include the 11 and 12","ar":"All times tables from 1 to 12, so the Year 3 plan should include the 11 and 12"},{"en":"Times tables 1 to 10 in full, so the 7 times table is already included","ar":"Times tables 1 to 10 in full, so the 7 times table is already included"},{"en":"Times tables 1, 2, 3, 4, 5, 6, 8, 9 and 10, so the 7 times table comes later","ar":"Times tables 1, 2, 3, 4, 5, 6, 8, 9 and 10, so the 7 times table comes later"}],"correct":3,"expl":{"en":"3Ni.07 lists 1, 2, 3, 4, 5, 6, 8, 9 and 10. 4Ni.04 then covers all times tables from 1 to 10.","ar":"3Ni.07 lists 1, 2, 3, 4, 5, 6, 8, 9 and 10. 4Ni.04 then covers all times tables from 1 to 10."}},{"id":"m6q2","q":{"en":"According to the framework text, in which stage are percentages first introduced?","ar":"According to the framework text, in which stage are percentages first introduced?"},"opts":[{"en":"Stage 4, with percentage as parts in each hundred (4Nf.06)","ar":"Stage 4, with percentage as parts in each hundred (4Nf.06)"},{"en":"Stage 2, with percentage linked to halves and quarters (2Nf.05)","ar":"Stage 2, with percentage linked to halves and quarters (2Nf.05)"},{"en":"Stage 3, with percentage linked to money and change (3Nm.02)","ar":"Stage 3, with percentage linked to money and change (3Nm.02)"},{"en":"Stage 5, with percentage linked to decimals and ratio (5Nf.04)","ar":"Stage 5, with percentage linked to decimals and ratio (5Nf.04)"}],"correct":0,"expl":{"en":"The overview says \"from Stage 4 learners are introduced to percentages\", and 4Nf.06 is the first percentage objective.","ar":"The overview says \"from Stage 4 learners are introduced to percentages\", and 4Nf.06 is the first percentage objective."}},{"id":"m6q3","q":{"en":"Which statement matches the glossary definitions of ratio and proportion?","ar":"Which statement matches the glossary definitions of ratio and proportion?"},"opts":[{"en":"Ratio compares part to whole; proportion compares part to part","ar":"Ratio compares part to whole; proportion compares part to part"},{"en":"Ratio compares part to part; proportion compares part to whole","ar":"Ratio compares part to part; proportion compares part to whole"},{"en":"Ratio is written as a fraction; proportion is written with a colon sign","ar":"Ratio is written as a fraction; proportion is written with a colon sign"},{"en":"Ratio is used only with money; proportion is used only with shapes","ar":"Ratio is used only with money; proportion is used only with shapes"}],"correct":1,"expl":{"en":"The glossary says proportion is a part to whole comparison and ratio is a part to part comparison; 5Nf.11 uses the same wording.","ar":"The glossary says proportion is a part to whole comparison and ratio is a part to part comparison; 5Nf.11 uses the same wording."}}]},{"id":"m7","title":{"en":"Geometry and Measure: Position, Shape, Measurement and Time","ar":"Geometry and Measure: Position, Shape, Measurement and Time"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The Geometry and Measure strand has three sub-strands: Position and transformation (Gp), Geometrical reasoning, shapes and measurements (Gg), and Time (Gt). The framework says that learners investigate geometrical relations in two and three dimensions, use mathematical language to describe the properties of shapes, and apply number skills in real contexts. Gg is the largest sub-strand, with 8 to 12 objectives in every stage, so it deserves careful planning.","ar":"The Geometry and Measure strand has three sub-strands: Position and transformation (Gp), Geometrical reasoning, shapes and measurements (Gg), and Time (Gt). The framework says that learners investigate geometrical relations in two and three dimensions, use mathematical language to describe the properties of shapes, and apply number skills in real contexts. Gg is the largest sub-strand, with 8 to 12 objectives in every stage, so it deserves careful planning."}},{"t":"h","c":{"en":"Position and transformation (Gp)","ar":"Position and transformation (Gp)"}},{"t":"p","c":{"en":"Gp starts with everyday language and grows into coordinates and transformations. The glossary gives two helpful terms. \u003cstrong>Cardinal points\u003c/strong> are the four compass points: north, east, south and west. \u003cstrong>Ordinal points\u003c/strong> are halfway between them: northeast, southeast, southwest and northwest. To \u003cstrong>translate\u003c/strong> a shape is to move it along a straight line without changing its size, shape or orientation, so every vertex moves in the same direction by the same amount.","ar":"Gp starts with everyday language and grows into coordinates and transformations. The glossary gives two helpful terms. \u003cstrong>Cardinal points\u003c/strong> are the four compass points: north, east, south and west. \u003cstrong>Ordinal points\u003c/strong> are halfway between them: northeast, southeast, southwest and northwest. To \u003cstrong>translate\u003c/strong> a shape is to move it along a straight line without changing its size, shape or orientation, so every vertex moves in the same direction by the same amount."}},{"t":"table","head":{"en":["Stage","Position and direction","Transformation"],"ar":["Stage","Position and direction","Transformation"]},"rows":[{"en":["1","Familiar language for position and direction (1Gp.01)","None listed (1Gg.07 explores a shape that looks identical as it rotates)"],"ar":["1","Familiar language for position and direction (1Gp.01)","None listed (1Gg.07 explores a shape that looks identical as it rotates)"]},{"en":["2","Use position and direction to describe movement (2Gp.01)","Sketch a reflection in a vertical mirror line (2Gp.02)"],"ar":["2","Use position and direction to describe movement (2Gp.01)","Sketch a reflection in a vertical mirror line (2Gp.02)"]},{"en":["3","Descriptions including cardinal points (3Gp.01)","Sketch a reflection in a horizontal or vertical mirror line (3Gp.02)"],"ar":["3","Descriptions including cardinal points (3Gp.01)","Sketch a reflection in a horizontal or vertical mirror line (3Gp.02)"]},{"en":["4","Cardinal and ordinal points and notations (4Gp.01); coordinates in the first quadrant (4Gp.02)","Reflect 2D shapes on square grids (4Gp.03)"],"ar":["4","Cardinal and ordinal points and notations (4Gp.01); coordinates in the first quadrant (4Gp.02)","Reflect 2D shapes on square grids (4Gp.03)"]},{"en":["5","Compare the position of coordinates (5Gp.01); plot points to form lines and shapes in the first quadrant (5Gp.02)","Translate shapes on square grids (5Gp.03); reflect in both horizontal and vertical lines to make patterns (5Gp.04)"],"ar":["5","Compare the position of coordinates (5Gp.01); plot points to form lines and shapes in the first quadrant (5Gp.02)","Translate shapes on square grids (5Gp.03); reflect in both horizontal and vertical lines to make patterns (5Gp.04)"]},{"en":["6","Coordinates with integers, fractions and decimals in all four quadrants (6Gp.01, 6Gp.02)","Translate on coordinate grids (6Gp.03); reflect in vertical, horizontal and diagonal mirror lines (6Gp.04); rotate 90 degrees around a vertex (6Gp.05)"],"ar":["6","Coordinates with integers, fractions and decimals in all four quadrants (6Gp.01, 6Gp.02)","Translate on coordinate grids (6Gp.03); reflect in vertical, horizontal and diagonal mirror lines (6Gp.04); rotate 90 degrees around a vertex (6Gp.05)"]}]},{"t":"h","c":{"en":"Geometrical reasoning, shapes and measurements (Gg)","ar":"Geometrical reasoning, shapes and measurements (Gg)"}},{"t":"p","c":{"en":"Gg combines two big ideas: the properties of shapes, and measuring. It is easier to follow if you group the objectives by theme rather than by number.","ar":"Gg combines two big ideas: the properties of shapes, and measuring. It is easier to follow if you group the objectives by theme rather than by number."}},{"t":"table","head":{"en":["Theme","Journey across the stages (selected objectives)"],"ar":["Theme","Journey across the stages (selected objectives)"]},"rows":[{"en":["2D shapes","Sort by sides and curved or straight edges (1Gg.01); properties, regular polygons, vertices (2Gg.01); regular and irregular polygons (3Gg.01); combining shapes and tessellation (4Gg.01); isosceles, equilateral and scalene triangles (5Gg.01); quadrilaterals and the parts of a circle (6Gg.01, 6Gg.02)"],"ar":["2D shapes","Sort by sides and curved or straight edges (1Gg.01); properties, regular polygons, vertices (2Gg.01); regular and irregular polygons (3Gg.01); combining shapes and tessellation (4Gg.01); isosceles, equilateral and scalene triangles (5Gg.01); quadrilaterals and the parts of a circle (6Gg.01, 6Gg.02)"]},{"en":["3D shapes","Faces, edges, flat or curved (1Gg.03); vertices (2Gg.05); recognise drawings of 3D shapes (3Gg.08); match nets to shapes (4Gg.06); sketch different nets for a cube (5Gg.05); nets of cubes, cuboids, prisms and pyramids (6Gg.06); surface area (6Gg.07)"],"ar":["3D shapes","Faces, edges, flat or curved (1Gg.03); vertices (2Gg.05); recognise drawings of 3D shapes (3Gg.08); match nets to shapes (4Gg.06); sketch different nets for a cube (5Gg.05); nets of cubes, cuboids, prisms and pyramids (6Gg.06); surface area (6Gg.07)"]},{"en":["Measuring","Language of length, mass, capacity (1Gg.02, 1Gg.04, 1Gg.05); standard and non-standard units (2Gg.03, 2Gg.06, 2Gg.07); cm, m, km, g, kg, ml, l (3Gg.02, 3Gg.06, 3Gg.07); reading scales with fractions (4Gg.09); capacity and volume (6Gg.05)"],"ar":["Measuring","Language of length, mass, capacity (1Gg.02, 1Gg.04, 1Gg.05); standard and non-standard units (2Gg.03, 2Gg.06, 2Gg.07); cm, m, km, g, kg, ml, l (3Gg.02, 3Gg.06, 3Gg.07); reading scales with fractions (4Gg.09); capacity and volume (6Gg.05)"]},{"en":["Perimeter and area","Perimeter as the distance around and area as the space inside (3Gg.03); compound shapes (4Gg.02); same perimeter with different area (5Gg.02); compound shapes divided into rectangles (5Gg.03); area of right-angled triangles (6Gg.03)"],"ar":["Perimeter and area","Perimeter as the distance around and area as the space inside (3Gg.03); compound shapes (4Gg.02); same perimeter with different area (5Gg.02); compound shapes divided into rectangles (5Gg.03); area of right-angled triangles (6Gg.03)"]},{"en":["Angles","An angle as a description of a turn (2Gg.11); compare with a right angle (3Gg.10); acute, right, obtuse (4Gg.08); reflex and angles on a straight line (5Gg.07, 5Gg.08); angles in a triangle (6Gg.10)"],"ar":["Angles","An angle as a description of a turn (2Gg.11); compare with a right angle (3Gg.10); acute, right, obtuse (4Gg.08); reflex and angles on a straight line (5Gg.07, 5Gg.08); angles in a triangle (6Gg.10)"]},{"en":["Symmetry","Shape looks the same as it rotates (1Gg.07); horizontal or vertical line (2Gg.09); both lines (3Gg.09); diagonal lines (4Gg.07); complete symmetrical patterns (5Gg.06); rotational symmetry of order x (6Gg.08)"],"ar":["Symmetry","Shape looks the same as it rotates (1Gg.07); horizontal or vertical line (2Gg.09); both lines (3Gg.09); diagonal lines (4Gg.07); complete symmetrical patterns (5Gg.06); rotational symmetry of order x (6Gg.08)"]}]},{"t":"callout","k":"tip","title":{"en":"Watch the measurement ideas that are often skipped","ar":"Watch the measurement ideas that are often skipped"},"c":{"en":"Objective 2Gg.12 asks pupils to understand a measuring scale as a continuous number line where intermediate points have value. Many errors, such as reading every mark as 1 unit, come from skipping this idea. Objective 5Gg.02 says that shapes with the same perimeter can have different areas and vice versa. A good-practice task: on a square grid, ask pupils to make three different rectangles with a perimeter of 14 units and find each area.","ar":"Objective 2Gg.12 asks pupils to understand a measuring scale as a continuous number line where intermediate points have value. Many errors, such as reading every mark as 1 unit, come from skipping this idea. Objective 5Gg.02 says that shapes with the same perimeter can have different areas and vice versa. A good-practice task: on a square grid, ask pupils to make three different rectangles with a perimeter of 14 units and find each area."}},{"t":"h","c":{"en":"Drawing and sketching: a distinction the framework makes","ar":"Drawing and sketching: a distinction the framework makes"}},{"t":"p","c":{"en":"The framework says that through this strand \"learners should understand the difference between drawing and sketching\". The glossary gives the meanings. To \u003cstrong>draw\u003c/strong> is to use mathematical instruments, such as rulers, a pair of compasses and protractors, to represent lines and shapes accurately. To \u003cstrong>sketch\u003c/strong> is to illustrate lines and shapes without instruments, so the result is representative only and may not be precise.","ar":"The framework says that through this strand \"learners should understand the difference between drawing and sketching\". The glossary gives the meanings. To \u003cstrong>draw\u003c/strong> is to use mathematical instruments, such as rulers, a pair of compasses and protractors, to represent lines and shapes accurately. To \u003cstrong>sketch\u003c/strong> is to illustrate lines and shapes without instruments, so the result is representative only and may not be precise."}},{"t":"table","head":{"en":["Verb in the objective","What the pupil does","Examples from the framework"],"ar":["Verb in the objective","What the pupil does","Examples from the framework"]},"rows":[{"en":["Draw","Uses a ruler, set square, compass or protractor to make an accurate shape","2Gg.04 draw and measure lines; 3Gg.04 draw rectangles and squares; 5Gg.03 draw compound shapes; 6Gg.09 draw angles; 6Gg.11 construct circles"],"ar":["Draw","Uses a ruler, set square, compass or protractor to make an accurate shape","2Gg.04 draw and measure lines; 3Gg.04 draw rectangles and squares; 5Gg.03 draw compound shapes; 6Gg.09 draw angles; 6Gg.11 construct circles"]},{"en":["Sketch","Draws freehand to show the properties; need not be exact","2Gg.01 and 3Gg.01 sketch 2D shapes; 5Gg.01 sketch triangles; 6Gg.01 sketch quadrilaterals; 6Gg.06 sketch nets"],"ar":["Sketch","Draws freehand to show the properties; need not be exact","2Gg.01 and 3Gg.01 sketch 2D shapes; 5Gg.01 sketch triangles; 6Gg.01 sketch quadrilaterals; 6Gg.06 sketch nets"]}]},{"t":"p","c":{"en":"The verb in the objective tells you how to teach and how to judge the work. If the objective says \"sketch\" (for example 5Gg.01), a freehand triangle with the equal sides and angles marked correctly should be accepted. If it says \"draw\" (for example 6Gg.09), pupils need to use a protractor accurately, and a freehand angle does not meet the objective.","ar":"The verb in the objective tells you how to teach and how to judge the work. If the objective says \"sketch\" (for example 5Gg.01), a freehand triangle with the equal sides and angles marked correctly should be accepted. If it says \"draw\" (for example 6Gg.09), pupils need to use a protractor accurately, and a freehand angle does not meet the objective."}},{"t":"callout","k":"warn","title":{"en":"Do not over-correct sketches","ar":"Do not over-correct sketches"},"c":{"en":"A teacher who marks down a freehand sketch because the lines are not straight is testing drawing, not the objective. Equally, a teacher who accepts a freehand angle for an objective that says \"draw\" is not testing the skill. Check the verb.","ar":"A teacher who marks down a freehand sketch because the lines are not straight is testing drawing, not the objective. Equally, a teacher who accepts a freehand angle for an objective that says \"draw\" is not testing the skill. Check the verb."}},{"t":"h","c":{"en":"Time (Gt)","ar":"Time (Gt)"}},{"t":"p","c":{"en":"Time is a short sub-strand with a clear path. The glossary defines \u003cstrong>bridge through 60\u003c/strong> as a time interval that requires knowledge that there are 60 minutes in an hour.","ar":"Time is a short sub-strand with a clear path. The glossary defines \u003cstrong>bridge through 60\u003c/strong> as a time interval that requires knowledge that there are 60 minutes in an hour."}},{"t":"table","head":{"en":["Stage","Telling and using time","Time intervals"],"ar":["Stage","Telling and using time","Time intervals"]},"rows":[{"en":["1","Language of time, days and months, hour and half hour (1Gt.01 to 1Gt.03)","None listed"],"ar":["1","Language of time, days and months, hour and half hour (1Gt.01 to 1Gt.03)","None listed"]},{"en":["2","Order units of time; five minutes on digital (12-hour) and analogue clocks; calendars (2Gt.01 to 2Gt.03)","None listed"],"ar":["2","Order units of time; five minutes on digital (12-hour) and analogue clocks; calendars (2Gt.01 to 2Gt.03)","None listed"]},{"en":["3","Read time accurately on digital (12-hour) and analogue clocks; timetables (3Gt.02, 3Gt.03)","The difference between a time and a time interval, in days, weeks, months and years (3Gt.04)"],"ar":["3","Read time accurately on digital (12-hour) and analogue clocks; timetables (3Gt.02, 3Gt.03)","The difference between a time and a time interval, in days, weeks, months and years (3Gt.04)"]},{"en":["4","24-hour notation; convert between units; timetables in 12- and 24-hour clock (4Gt.01 to 4Gt.03)","Intervals in days to years, and in seconds, minutes and hours that do not bridge through 60 (4Gt.04)"],"ar":["4","24-hour notation; convert between units; timetables in 12- and 24-hour clock (4Gt.01 to 4Gt.03)","Intervals in days to years, and in seconds, minutes and hours that do not bridge through 60 (4Gt.04)"]},{"en":["5","Times less than one second; time zones (5Gt.01, 5Gt.02)","Intervals that bridge through 60 (5Gt.03); decimal or mixed units (5Gt.04)"],"ar":["5","Times less than one second; time zones (5Gt.01, 5Gt.02)","Intervals that bridge through 60 (5Gt.03); decimal or mixed units (5Gt.04)"]},{"en":["6","None new","Convert between decimal and mixed units (6Gt.01)"],"ar":["6","None new","Convert between decimal and mixed units (6Gt.01)"]}]},{"t":"p","c":{"en":"Here is a worked example. A lesson starts at 10:15 and ends at 10:50. The interval is 35 minutes and does not bridge through 60, so it fits Stage 4 (4Gt.04). A lesson from 10:45 to 11:20 is also 35 minutes, but pupils must cross the hour, which is \"bridging through 60\", a Stage 5 idea (5Gt.03).","ar":"Here is a worked example. A lesson starts at 10:15 and ends at 10:50. The interval is 35 minutes and does not bridge through 60, so it fits Stage 4 (4Gt.04). A lesson from 10:45 to 11:20 is also 35 minutes, but pupils must cross the hour, which is \"bridging through 60\", a Stage 5 idea (5Gt.03)."}},{"t":"scenario","title":{"en":"Scenario: marking a freehand shape","ar":"Scenario: marking a freehand shape"},"c":{"en":"A Year 5 pupil is asked to sketch an isosceles triangle (5Gg.01) and draws two equal sides by eye, marks them with small lines and labels the two equal angles. The teacher is tempted to give no credit because the sides are not exactly equal. The framework says a sketch is representative and may not be precise, and the objective asks pupils to describe the shape including angles and symmetrical properties. The pupil has met the objective. The teacher could then ask, \"How would you draw it accurately?\" and move to a task where the pupil uses a ruler and protractor.","ar":"A Year 5 pupil is asked to sketch an isosceles triangle (5Gg.01) and draws two equal sides by eye, marks them with small lines and labels the two equal angles. The teacher is tempted to give no credit because the sides are not exactly equal. The framework says a sketch is representative and may not be precise, and the objective asks pupils to describe the shape including angles and symmetrical properties. The pupil has met the objective. The teacher could then ask, \"How would you draw it accurately?\" and move to a task where the pupil uses a ruler and protractor."}},{"t":"scenario","title":{"en":"Scenario: coordinates in Year 4","ar":"Scenario: coordinates in Year 4"},"c":{"en":"A Year 4 teacher wants pupils to plot (6, 3) and (2, 5) on a grid. The objective 4Gp.02 refers to the first quadrant with the aid of a grid. A pupil plots (6, 3) by going up 6 and across 3. The teacher uses a \"along the corridor, up the stairs\" rhyme (good practice), and the pupil corrects the plot. The teacher also notes that negative coordinates and all four quadrants wait until Stage 6 (6Gp.01), so no negative numbers are needed now.","ar":"A Year 4 teacher wants pupils to plot (6, 3) and (2, 5) on a grid. The objective 4Gp.02 refers to the first quadrant with the aid of a grid. A pupil plots (6, 3) by going up 6 and across 3. The teacher uses a \"along the corridor, up the stairs\" rhyme (good practice), and the pupil corrects the plot. The teacher also notes that negative coordinates and all four quadrants wait until Stage 6 (6Gp.01), so no negative numbers are needed now."}}],"checks":[{"id":"m7q1","q":{"en":"Objective 5Gg.01 asks pupils to sketch isosceles, equilateral or scalene triangles. What does \"sketch\" mean in the framework glossary?","ar":"Objective 5Gg.01 asks pupils to sketch isosceles, equilateral or scalene triangles. What does \"sketch\" mean in the framework glossary?"},"opts":[{"en":"Draw shapes using a ruler and protractor so that every side and angle is accurate, checked by a partner","ar":"Draw shapes using a ruler and protractor so that every side and angle is accurate, checked by a partner"},{"en":"Cut shapes from paper and fold them so that the equal sides are placed exactly together","ar":"Cut shapes from paper and fold them so that the equal sides are placed exactly together"},{"en":"Illustrate shapes without instruments, so they are representative only and may not be precise","ar":"Illustrate shapes without instruments, so they are representative only and may not be precise"},{"en":"Copy shapes from a printed worksheet so that sides and angles match the original","ar":"Copy shapes from a printed worksheet so that sides and angles match the original"}],"correct":2,"expl":{"en":"The glossary defines sketch as illustrating lines and shapes without mathematical instruments, so they are representative only. Draw uses instruments for accuracy.","ar":"The glossary defines sketch as illustrating lines and shapes without mathematical instruments, so they are representative only. Draw uses instruments for accuracy."}},{"id":"m7q2","q":{"en":"A class finds the time interval from 10:45 to 11:20. Which framework idea does this show, and in which stage does it first appear?","ar":"A class finds the time interval from 10:45 to 11:20. Which framework idea does this show, and in which stage does it first appear?"},"opts":[{"en":"Bridging through 60, introduced in Stage 3","ar":"Bridging through 60, introduced in Stage 3"},{"en":"Time zones, introduced in Stage 5","ar":"Time zones, introduced in Stage 5"},{"en":"The 24-hour clock, introduced in Stage 4","ar":"The 24-hour clock, introduced in Stage 4"},{"en":"Bridging through 60, introduced in Stage 5","ar":"Bridging through 60, introduced in Stage 5"}],"correct":3,"expl":{"en":"Intervals that bridge through 60 are in 5Gt.03; Stage 4 intervals (4Gt.04) do not bridge through 60.","ar":"Intervals that bridge through 60 are in 5Gt.03; Stage 4 intervals (4Gt.04) do not bridge through 60."}},{"id":"m7q3","q":{"en":"In which stage do pupils first translate 2D shapes on square grids (5Gp.03)?","ar":"In which stage do pupils first translate 2D shapes on square grids (5Gp.03)?"},"opts":[{"en":"Stage 5, after reflecting shapes in Stages 2 to 4","ar":"Stage 5, after reflecting shapes in Stages 2 to 4"},{"en":"Stage 4, at the same time as reading coordinates","ar":"Stage 4, at the same time as reading coordinates"},{"en":"Stage 3, when cardinal points are introduced","ar":"Stage 3, when cardinal points are introduced"},{"en":"Stage 6, together with rotation about a vertex","ar":"Stage 6, together with rotation about a vertex"}],"correct":0,"expl":{"en":"The first translation objective is 5Gp.03. Reflection appears from Stage 2 (2Gp.02); rotation of 90 degrees appears in Stage 6 (6Gp.05).","ar":"The first translation objective is 5Gp.03. Reflection appears from Stage 2 (2Gp.02); rotation of 90 degrees appears in Stage 6 (6Gp.05)."}}]},{"id":"m8","title":{"en":"Statistics and Probability, and Prior Experience Before Stage 1","ar":"Statistics and Probability, and Prior Experience Before Stage 1"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The Statistics and Probability strand has two sub-strands: Statistics (Ss) and Probability (Sp). The framework says that learners plan and conduct investigations, identify similarities and variations within and between data sets, and discuss their conclusions. It emphasises statistical thinking: understanding the need for data, the importance of how data is produced, and the existence of variability. Since real-world information is often shown as charts, tables, diagrams and graphs, learners are also expected to interpret data.","ar":"The Statistics and Probability strand has two sub-strands: Statistics (Ss) and Probability (Sp). The framework says that learners plan and conduct investigations, identify similarities and variations within and between data sets, and discuss their conclusions. It emphasises statistical thinking: understanding the need for data, the importance of how data is produced, and the existence of variability. Since real-world information is often shown as charts, tables, diagrams and graphs, learners are also expected to interpret data."}},{"t":"h","c":{"en":"The statistical enquiry cycle","ar":"The statistical enquiry cycle"}},{"t":"p","c":{"en":"The framework says that learners conduct simple statistics investigations as part of a \u003cstrong>four-part statistical enquiry cycle\u003c/strong>, shown in a diagram. The four parts are:","ar":"The framework says that learners conduct simple statistics investigations as part of a \u003cstrong>four-part statistical enquiry cycle\u003c/strong>, shown in a diagram. The four parts are:"}},{"t":"steps","c":{"en":["\u003cstrong>Specify the problem and plan.\u003c/strong> Decide the question and what data to collect.","\u003cstrong>Record, organise and represent data.\u003c/strong> Collect results, put them in lists or tables, and draw a chart or diagram.","\u003cstrong>Interpret data.\u003c/strong> Look for patterns, similarities and variations.","\u003cstrong>Discuss data and check predictions.\u003c/strong> Talk about conclusions and compare them with what was expected."],"ar":["\u003cstrong>Specify the problem and plan.\u003c/strong> Decide the question and what data to collect.","\u003cstrong>Record, organise and represent data.\u003c/strong> Collect results, put them in lists or tables, and draw a chart or diagram.","\u003cstrong>Interpret data.\u003c/strong> Look for patterns, similarities and variations.","\u003cstrong>Discuss data and check predictions.\u003c/strong> Talk about conclusions and compare them with what was expected."]}},{"t":"p","c":{"en":"The statement of each objective in the Ss sub-strand fits somewhere on this cycle. For example, 4Ss.01 (plan and conduct an investigation, considering what data to collect) fits part 1. 4Ss.02 (record, organise and represent) is part 2. 4Ss.03 (interpret data and discuss conclusions) covers parts 3 and 4. This link between the cycle and the objectives is a good-practice way to plan a whole investigation over several lessons.","ar":"The statement of each objective in the Ss sub-strand fits somewhere on this cycle. For example, 4Ss.01 (plan and conduct an investigation, considering what data to collect) fits part 1. 4Ss.02 (record, organise and represent) is part 2. 4Ss.03 (interpret data and discuss conclusions) covers parts 3 and 4. This link between the cycle and the objectives is a good-practice way to plan a whole investigation over several lessons."}},{"t":"h","c":{"en":"Statistical and non-statistical questions","ar":"Statistical and non-statistical questions"}},{"t":"p","c":{"en":"The glossary defines a \u003cstrong>non-statistical question\u003c/strong> as one with a single answer, for example \"What is your favourite fruit?\". A \u003cstrong>statistical question\u003c/strong> will have variable answers, for example \"Which fruits do people in this class like?\". In Stage 1, pupils answer non-statistical questions with categorical data (1Ss.01). From Stage 2 they answer both kinds of question (2Ss.01), and from Stage 4 they plan investigations to answer statistical questions (4Ss.01).","ar":"The glossary defines a \u003cstrong>non-statistical question\u003c/strong> as one with a single answer, for example \"What is your favourite fruit?\". A \u003cstrong>statistical question\u003c/strong> will have variable answers, for example \"Which fruits do people in this class like?\". In Stage 1, pupils answer non-statistical questions with categorical data (1Ss.01). From Stage 2 they answer both kinds of question (2Ss.01), and from Stage 4 they plan investigations to answer statistical questions (4Ss.01)."}},{"t":"p","c":{"en":"The glossary also defines three types of data. \u003cstrong>Categorical data\u003c/strong> are unordered categories, such as favourite colours. \u003cstrong>Discrete data\u003c/strong> come from counting, such as the number of peas in a pod. \u003cstrong>Continuous data\u003c/strong> come from measuring, such as the weight of food packets, and may be grouped into touching, non-overlapping categories.","ar":"The glossary also defines three types of data. \u003cstrong>Categorical data\u003c/strong> are unordered categories, such as favourite colours. \u003cstrong>Discrete data\u003c/strong> come from counting, such as the number of peas in a pod. \u003cstrong>Continuous data\u003c/strong> come from measuring, such as the weight of food packets, and may be grouped into touching, non-overlapping categories."}},{"t":"table","head":{"en":["Stage","Data types","Representations and summaries","Interpreting and discussing"],"ar":["Stage","Data types","Representations and summaries","Interpreting and discussing"]},"rows":[{"en":["1","Categorical","Practical resources, drawings, lists and tables, Venn and Carroll diagrams, block graphs, pictograms (1Ss.02)","Describe data using more, less, most, least (1Ss.03)"],"ar":["1","Categorical","Practical resources, drawings, lists and tables, Venn and Carroll diagrams, block graphs, pictograms (1Ss.02)","Describe data using more, less, most, least (1Ss.03)"]},{"en":["2","Categorical","Adds tally charts; choose and explain which representation to use (2Ss.02)","Identify similarities and variations (2Ss.03)"],"ar":["2","Categorical","Adds tally charts; choose and explain which representation to use (2Ss.02)","Identify similarities and variations (2Ss.03)"]},{"en":["3","Categorical and discrete","Adds frequency tables and bar charts (3Ss.02)","Interpret data within data sets (3Ss.03)"],"ar":["3","Categorical and discrete","Adds frequency tables and bar charts (3Ss.02)","Interpret data within data sets (3Ss.03)"]},{"en":["4","Categorical and discrete","Adds dot plots with one dot per count (4Ss.02)","Within and between data sets; sources of variation (4Ss.03)"],"ar":["4","Categorical and discrete","Adds dot plots with one dot per count (4Ss.02)","Within and between data sets; sources of variation (4Ss.03)"]},{"en":["5","Adds continuous","Waffle diagrams, frequency diagrams, line graphs (5Ss.02); mode and median (5Ss.03)","Patterns within and between data sets (5Ss.04)"],"ar":["5","Adds continuous","Waffle diagrams, frequency diagrams, line graphs (5Ss.02); mode and median (5Ss.03)","Patterns within and between data sets (5Ss.04)"]},{"en":["6","Categorical, discrete and continuous","Adds pie charts and scatter graphs (6Ss.02); mode (including bimodal), median, mean and range (6Ss.03)","Sources of variation and check predictions (6Ss.04); make predictions (6Ss.01)"],"ar":["6","Categorical, discrete and continuous","Adds pie charts and scatter graphs (6Ss.02); mode (including bimodal), median, mean and range (6Ss.03)","Sources of variation and check predictions (6Ss.04); make predictions (6Ss.01)"]}]},{"t":"callout","k":"tip","title":{"en":"Choose and explain","ar":"Choose and explain"},"c":{"en":"From Stage 2, objective Ss.02 says that learners \"choose and explain which representation to use in a given situation\". This is a thinking task, not only a drawing task. Good practice: give pupils the same data and ask them to choose between a pictogram and a tally chart, then give a reason in their own words.","ar":"From Stage 2, objective Ss.02 says that learners \"choose and explain which representation to use in a given situation\". This is a thinking task, not only a drawing task. Good practice: give pupils the same data and ask them to choose between a pictogram and a tally chart, then give a reason in their own words."}},{"t":"h","c":{"en":"Probability (Sp)","ar":"Probability (Sp)"}},{"t":"p","c":{"en":"The framework says that when learners explore probability, they use language associated with patterns, randomness, chance, likelihood and probability. They also recognise the difference between probabilities modelled through experiments with a small number of trials and with a large number of trials, and they describe the results.","ar":"The framework says that when learners explore probability, they use language associated with patterns, randomness, chance, likelihood and probability. They also recognise the difference between probabilities modelled through experiments with a small number of trials and with a large number of trials, and they describe the results."}},{"t":"table","head":{"en":["Stage","Language and ideas","Experiments"],"ar":["Stage","Language and ideas","Experiments"]},"rows":[{"en":["1","No Sp objectives listed","No Sp objectives listed"],"ar":["1","No Sp objectives listed","No Sp objectives listed"]},{"en":["2","Regular pattern and random pattern (2Sp.01)","Chance experiments with two outcomes (2Sp.02)"],"ar":["2","Regular pattern and random pattern (2Sp.01)","Chance experiments with two outcomes (2Sp.02)"]},{"en":["3","It will happen, it will not happen, it might happen (3Sp.01)","Conduct chance experiments and describe results (3Sp.02)"],"ar":["3","It will happen, it will not happen, it might happen (3Sp.01)","Conduct chance experiments and describe results (3Sp.02)"]},{"en":["4","Maybe, likely, certain, impossible (4Sp.01)","Small and large numbers of trials, language of probability (4Sp.02)"],"ar":["4","Maybe, likely, certain, impossible (4Sp.01)","Small and large numbers of trials, language of probability (4Sp.02)"]},{"en":["5","Likelihood and risk; equally likely outcomes (5Sp.01, 5Sp.02)","Experiments or simulations with small and large numbers of trials (5Sp.03)"],"ar":["5","Likelihood and risk; equally likely outcomes (5Sp.01, 5Sp.02)","Experiments or simulations with small and large numbers of trials (5Sp.03)"]},{"en":["6","Probability and proportion language; mutually exclusive events (6Sp.01, 6Sp.02)","Some probabilities need a large number of trials (6Sp.03); predict, analyse and describe frequency (6Sp.04)"],"ar":["6","Probability and proportion language; mutually exclusive events (6Sp.01, 6Sp.02)","Some probabilities need a large number of trials (6Sp.03); predict, analyse and describe frequency (6Sp.04)"]}]},{"t":"p","c":{"en":"A worked example for 4Sp.02: pupils toss a coin 10 times and record heads, then combine the results of the whole class (for example 28 pupils, 280 tosses). Ask: \"Which result is closer to half heads, your 10 tosses or the class 280 tosses?\" This shows that large numbers of trials give more reliable results. This is good practice and matches the objective's focus on small and large numbers of trials.","ar":"A worked example for 4Sp.02: pupils toss a coin 10 times and record hea
