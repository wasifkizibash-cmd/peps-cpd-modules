ructure, the tenth objective in that list","ar":"Stage 8, Use of English: Sentence structure, the tenth objective in that list"}],"correct":2,"expl":{"en":"The first character is the stage, Ug is the reporting code for Grammatical forms, and 10 is the order number in that stage's list.","ar":"The first character is the stage, Ug is the reporting code for Grammatical forms, and 10 is the order number in that stage's list."}},{"id":"m3q2","q":{"en":"Which strands does the framework say provide the receptive and productive skills, with Use of English supplying the language features?","ar":"Which strands does the framework say provide the receptive and productive skills, with Use of English supplying the language features?"},"opts":[{"en":"Reading and Writing are receptive; Listening and Speaking are productive","ar":"Reading and Writing are receptive; Listening and Speaking are productive"},{"en":"Listening and Speaking are receptive; Reading and Writing are productive","ar":"Listening and Speaking are receptive; Reading and Writing are productive"},{"en":"Reading and Speaking are receptive; Writing and Listening are productive","ar":"Reading and Speaking are receptive; Writing and Listening are productive"},{"en":"Reading and Listening are receptive; Writing and Speaking are productive","ar":"Reading and Listening are receptive; Writing and Speaking are productive"}],"correct":3,"expl":{"en":"The framework says Use of English provides the features needed to engage with language receptively (Reading and Listening) and productively (Writing and Speaking).","ar":"The framework says Use of English provides the features needed to engage with language receptively (Reading and Listening) and productively (Writing and Speaking)."}},{"id":"m3q3","q":{"en":"A teacher says the objective 7Rd.03 can be found again as 8Rd.03 at Stage 8, because the number is the same. What is the best correction?","ar":"A teacher says the objective 7Rd.03 can be found again as 8Rd.03 at Stage 8, because the number is the same. What is the best correction?"},"opts":[{"en":"The objectives are unique to each stage, so the same number can be a different skill; read the wording","ar":"The objectives are unique to each stage, so the same number can be a different skill; read the wording"},{"en":"The number is the same only for Reading, so the same rule does not apply to the other strands in the framework","ar":"The number is the same only for Reading, so the same rule does not apply to the other strands in the framework"},{"en":"The numbers are the same for every stage, but Stage 8 adds a letter to show the new level","ar":"The numbers are the same for every stage, but Stage 8 adds a letter to show the new level"},{"en":"The number shows the CEFR level, so a matching number means the same skill at each stage","ar":"The number shows the CEFR level, so a matching number means the same skill at each stage"}],"correct":0,"expl":{"en":"The framework says objectives in each stage are unique to that stage. The number only gives the order in that stage's list; for example 8Rd.03 is about inconsistencies in argument.","ar":"The framework says objectives in each stage are unique to that stage. The number only gives the order in that stage's list; for example 8Rd.03 is about inconsistencies in argument."}}]},{"id":"m4","title":{"en":"The Integrated Approach: How the Skills Work Together","ar":"The Integrated Approach: How the Skills Work Together"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Many teachers were trained to teach \"a reading lesson\", then \"a grammar lesson\", then \"a speaking lesson\". The Cambridge framework asks for something different. It says that teachers are \u003cstrong>expected to adopt an integrated approach\u003c/strong> to planning and teaching English as a Second Language. This module explains what that means in practice and what it does not mean.","ar":"Many teachers were trained to teach \"a reading lesson\", then \"a grammar lesson\", then \"a speaking lesson\". The Cambridge framework asks for something different. It says that teachers are \u003cstrong>expected to adopt an integrated approach\u003c/strong> to planning and teaching English as a Second Language. This module explains what that means in practice and what it does not mean."}},{"t":"h","c":{"en":"What the framework says","ar":"What the framework says"}},{"t":"p","c":{"en":"The framework says that each lesson and unit needs to provide opportunities for practice of all four skills (reading, writing, speaking and listening), as well as a focus on one or more learning objectives from the Use of English strand. The Use of English strand provides the linguistic features learners need to engage with language receptively in Reading and Listening and productively in Writing and Speaking.","ar":"The framework says that each lesson and unit needs to provide opportunities for practice of all four skills (reading, writing, speaking and listening), as well as a focus on one or more learning objectives from the Use of English strand. The Use of English strand provides the linguistic features learners need to engage with language receptively in Reading and Listening and productively in Writing and Speaking."}},{"t":"table","head":{"en":["Mode of language","Skills","What Use of English provides"],"ar":["Mode of language","Skills","What Use of English provides"]},"rows":[{"en":["Receptive (taking language in)","Reading and Listening","Features learners need to understand the texts and talk they meet, for example tenses, connectives and noun phrases"],"ar":["Receptive (taking language in)","Reading and Listening","Features learners need to understand the texts and talk they meet, for example tenses, connectives and noun phrases"]},{"en":["Productive (putting language out)","Writing and Speaking","Features learners need to say and write what they mean accurately and clearly"],"ar":["Productive (putting language out)","Writing and Speaking","Features learners need to say and write what they mean accurately and clearly"]}]},{"t":"p","c":{"en":"The framework gives six benefits of integrating Use of English and the four skills. Integration:","ar":"The framework gives six benefits of integrating Use of English and the four skills. Integration:"}},{"t":"list","c":{"en":["enhances learners' all-round development of communicative competence","enables teachers to build a lesson around a theme or a topic relevant to the learners","motivates learners by building more variety into the lesson","works at the level of realistic communication, where tasks involve more than one skill","exposes learners to authentic language","challenges learners to interact naturally."],"ar":["enhances learners' all-round development of communicative competence","enables teachers to build a lesson around a theme or a topic relevant to the learners","motivates learners by building more variety into the lesson","works at the level of realistic communication, where tasks involve more than one skill","exposes learners to authentic language","challenges learners to interact naturally."]}},{"t":"p","c":{"en":"The glossary defines \u003cstrong>authentic language\u003c/strong> as written or spoken language used in real situations, which may be contrasted with graded teaching material. Examples are a real timetable, a short news item or a recorded interview. The framework also says the integrated approach \"can and should be implemented throughout the curriculum\", starting in Primary and continuing through the Lower Secondary stages. So the pupils arrive from Years 1 to 6 already used to working this way.","ar":"The glossary defines \u003cstrong>authentic language\u003c/strong> as written or spoken language used in real situations, which may be contrasted with graded teaching material. Examples are a real timetable, a short news item or a recorded interview. The framework also says the integrated approach \"can and should be implemented throughout the curriculum\", starting in Primary and continuing through the Lower Secondary stages. So the pupils arrive from Years 1 to 6 already used to working this way."}},{"t":"h","c":{"en":"A worked example from the framework","ar":"A worked example from the framework"}},{"t":"p","c":{"en":"The framework gives its own example, which is worth reading slowly. At Stage 7, the objective \u003cstrong>7Sor.02\u003c/strong> asks learners to summarise and make some links in their response to what others say, with support, in an increasing range of exchanges in order to achieve a shared outcome. The framework says that this objective draws on listening and speaking skills and on different language features. These include an understanding of reported speech forms for statements and questions, and connectives to express reasons and give explanations.","ar":"The framework gives its own example, which is worth reading slowly. At Stage 7, the objective \u003cstrong>7Sor.02\u003c/strong> asks learners to summarise and make some links in their response to what others say, with support, in an increasing range of exchanges in order to achieve a shared outcome. The framework says that this objective draws on listening and speaking skills and on different language features. These include an understanding of reported speech forms for statements and questions, and connectives to express reasons and give explanations."}},{"t":"p","c":{"en":"You can connect this to objectives in the Use of English strand. Reported speech forms appear in 7Ug.10. Connectives to express reasons (for example therefore, as) and to give explanations (for example so that, such as) appear in 7Us.03. Questions appear in 7Ug.01 and 7Sc.02. A single group discussion can therefore serve at least five objectives.","ar":"You can connect this to objectives in the Use of English strand. Reported speech forms appear in 7Ug.10. Connectives to express reasons (for example therefore, as) and to give explanations (for example so that, such as) appear in 7Us.03. Questions appear in 7Ug.01 and 7Sc.02. A single group discussion can therefore serve at least five objectives."}},{"t":"table","head":{"en":["What pupils do in the task","Skill","Objective that supports it"],"ar":["What pupils do in the task","Skill","Objective that supports it"]},"rows":[{"en":["Listen to a partner's plan for a school event","Listening","7Ld.02 (understand most specific information and detail in talk)"],"ar":["Listen to a partner's plan for a school event","Listening","7Ld.02 (understand most specific information and detail in talk)"]},{"en":["Ask questions to find missing information","Speaking","7Sc.02 and 7Ug.01 (questions)"],"ar":["Ask questions to find missing information","Speaking","7Sc.02 and 7Ug.01 (questions)"]},{"en":["Report what the partner said to a third pupil","Speaking, Use of English","7Sor.02 and 7Ug.10 (reported speech)"],"ar":["Report what the partner said to a third pupil","Speaking, Use of English","7Sor.02 and 7Ug.10 (reported speech)"]},{"en":["Give reasons for the group's choice","Speaking, Use of English","7So.01 and 7Us.03 (connectives for reasons)"],"ar":["Give reasons for the group's choice","Speaking, Use of English","7So.01 and 7Us.03 (connectives for reasons)"]},{"en":["Write a short summary of the decision","Writing","7Wor.02 (link sentences with connectives)"],"ar":["Write a short summary of the decision","Writing","7Wor.02 (link sentences with connectives)"]}]},{"t":"h","c":{"en":"Planning with more than one strand","ar":"Planning with more than one strand"}},{"t":"p","c":{"en":"In the section on learning objectives, the framework adds that you should try to plan lessons that include learning objectives from more than one strand. It also says that the framework is not accompanied by a prescriptive list of topics. Teachers are expected to plan lessons and select topics and resources appropriate to their learners' context. The schemes of work give example topics to show how teaching might be planned over the three stages.","ar":"In the section on learning objectives, the framework adds that you should try to plan lessons that include learning objectives from more than one strand. It also says that the framework is not accompanied by a prescriptive list of topics. Teachers are expected to plan lessons and select topics and resources appropriate to their learners' context. The schemes of work give example topics to show how teaching might be planned over the three stages."}},{"t":"callout","k":"tip","title":{"en":"A simple planning routine (good practice)","ar":"A simple planning routine (good practice)"},"c":{"en":"1. Choose a topic that is relevant to your pupils, for example \"a trip to the desert camp\". 2. Choose one or two Use of English objectives as the language focus. 3. Choose one main skill objective and one or two supporting ones. 4. Check that the lesson, or the unit, gives pupils a chance to read, listen, speak and write. 5. Write the can-do aim. This routine is good practice, not a Cambridge rule.","ar":"1. Choose a topic that is relevant to your pupils, for example \"a trip to the desert camp\". 2. Choose one or two Use of English objectives as the language focus. 3. Choose one main skill objective and one or two supporting ones. 4. Check that the lesson, or the unit, gives pupils a chance to read, listen, speak and write. 5. Write the can-do aim. This routine is good practice, not a Cambridge rule."}},{"t":"h","c":{"en":"A Stage 8 planning example","ar":"A Stage 8 planning example"}},{"t":"p","c":{"en":"Imagine a Year 8 class of 28 pupils and a unit on school trips. This is an example of how a teacher could combine objectives. It is good practice for planning, not a Cambridge lesson.","ar":"Imagine a Year 8 class of 28 pupils and a unit on school trips. This is an example of how a teacher could combine objectives. It is good practice for planning, not a Cambridge lesson."}},{"t":"table","head":{"en":["Part of the lesson","What pupils do","Objective"],"ar":["Part of the lesson","What pupils do","Objective"]},"rows":[{"en":["Read","Read a short blog post about a trip and find the times and prices","8Rd.01 (specific information and detail)"],"ar":["Read","Read a short blog post about a trip and find the times and prices","8Rd.01 (specific information and detail)"]},{"en":["Language focus","Notice and practise contrast words such as although, while and however","8Us.02 (connectives to contrast)"],"ar":["Language focus","Notice and practise contrast words such as although, while and however","8Us.02 (connectives to contrast)"]},{"en":["Speak","Ask a partner about a trip and report what the partner asked and wondered","8Sc.02 (ask questions) and 8Ug.12 (reported speech with ask and wonder)"],"ar":["Speak","Ask a partner about a trip and report what the partner asked and wondered","8Sc.02 (ask questions) and 8Ug.12 (reported speech with ask and wonder)"]},{"en":["Write","Write a short extended description of a trip, with help from a frame","8Wc.01 (extended texts, with support)"],"ar":["Write","Write a short extended description of a trip, with help from a frame","8Wc.01 (extended texts, with support)"]}]},{"t":"p","c":{"en":"In this plan, all four skills appear and there are two Use of English objectives. Notice that the plan does \u003cem>not\u003c/em> try to cover every objective in the stage; it picks a few and does them well.","ar":"In this plan, all four skills appear and there are two Use of English objectives. Notice that the plan does \u003cem>not\u003c/em> try to cover every objective in the stage; it picks a few and does them well."}},{"t":"callout","k":"warn","title":{"en":"Integration does not mean covering everything in one lesson","ar":"Integration does not mean covering everything in one lesson"},"c":{"en":"The framework says each lesson and unit should give practice in all four skills, and that Use of English should have a focus. It does not ask for fifty objectives in one lesson. If a lesson has too many objectives, pupils meet each one only briefly. Over a unit, check that every objective you plan to teach appears in at least one clear moment.","ar":"The framework says each lesson and unit should give practice in all four skills, and that Use of English should have a focus. It does not ask for fifty objectives in one lesson. If a lesson has too many objectives, pupils meet each one only briefly. Over a unit, check that every objective you plan to teach appears in at least one clear moment."}},{"t":"h","c":{"en":"Why revisiting matters","ar":"Why revisiting matters"}},{"t":"p","c":{"en":"The framework says that learners \"revisit and engage with language at deeper levels and in different contexts\". The Use of English tables in Module 7 show this clearly: present perfect forms appear at Stage 7, return in a wider range at Stage 8 and again at Stage 9. If a Year 8 pupil makes errors in present perfect, it is not a sign that earlier teaching failed. It is part of how the curriculum is designed. Plan short, regular revisits, in new contexts, rather than a single large \"revision week\".","ar":"The framework says that learners \"revisit and engage with language at deeper levels and in different contexts\". The Use of English tables in Module 7 show this clearly: present perfect forms appear at Stage 7, return in a wider range at Stage 8 and again at Stage 9. If a Year 8 pupil makes errors in present perfect, it is not a sign that earlier teaching failed. It is part of how the curriculum is designed. Plan short, regular revisits, in new contexts, rather than a single large \"revision week\"."}},{"t":"scenario","title":{"en":"Scenario: the grammar-only lesson","ar":"Scenario: the grammar-only lesson"},"c":{"en":"A Year 7 teacher spends a whole lesson on a worksheet of fifteen sentences on the passive. Pupils complete it correctly, but later they do not use the passive in their writing. Using the framework, her HOD suggests keeping the language focus (7Ug.02 and 7Ug.03 mention passive forms) but building a task around it. Pupils read a short text on how a product is made, listen to a recorded description, and then write a short process paragraph with a partner. The grammar focus stays, but reading, listening, speaking and writing now surround it.","ar":"A Year 7 teacher spends a whole lesson on a worksheet of fifteen sentences on the passive. Pupils complete it correctly, but later they do not use the passive in their writing. Using the framework, her HOD suggests keeping the language focus (7Ug.02 and 7Ug.03 mention passive forms) but building a task around it. Pupils read a short text on how a product is made, listen to a recorded description, and then write a short process paragraph with a partner. The grammar focus stays, but reading, listening, speaking and writing now surround it."}},{"t":"scenario","title":{"en":"Scenario: a skills lesson without a language focus","ar":"Scenario: a skills lesson without a language focus"},"c":{"en":"A Year 9 teacher runs a lively debate (Speaking) and then a reading comprehension (Reading). Both go well, but there is no Use of English objective. The framework says every lesson and unit should include a focus on one or more Use of English objectives. The teacher can add one by choosing, for example, 9Us.01 and 9Sor.01: pupils study how speakers use connectives in the debate, then practise using a wider range in their own turn.","ar":"A Year 9 teacher runs a lively debate (Speaking) and then a reading comprehension (Reading). Both go well, but there is no Use of English objective. The framework says every lesson and unit should include a focus on one or more Use of English objectives. The teacher can add one by choosing, for example, 9Us.01 and 9Sor.01: pupils study how speakers use connectives in the debate, then practise using a wider range in their own turn."}}],"checks":[{"id":"m4q1","q":{"en":"According to the framework, what should each lesson and unit provide?","ar":"According to the framework, what should each lesson and unit provide?"},"opts":[{"en":"Practice in one main skill, with the other skills added only at the end of each term or each year","ar":"Practice in one main skill, with the other skills added only at the end of each term or each year"},{"en":"Opportunities to practise all four skills and a focus on one or more Use of English objectives","ar":"Opportunities to practise all four skills and a focus on one or more Use of English objectives"},{"en":"A focus on grammar only, with the four skills tested in the Checkpoint papers","ar":"A focus on grammar only, with the four skills tested in the Checkpoint papers"},{"en":"A Use of English worksheet in every lesson and a speaking assessment in every unit","ar":"A Use of English worksheet in every lesson and a speaking assessment in every unit"}],"correct":1,"expl":{"en":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English objectives.","ar":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English objectives."}},{"id":"m4q2","q":{"en":"Which objectives does the framework link to 7Sor.02 in its own worked example?","ar":"Which objectives does the framework link to 7Sor.02 in its own worked example?"},"opts":[{"en":"Reading and writing, with the passive voice and connectives for contrast in a single Stage 7 reading task for all learners","ar":"Reading and writing, with the passive voice and connectives for contrast in a single Stage 7 reading task for all learners"},{"en":"Listening and writing, with modal verbs and comparative structures","ar":"Listening and writing, with modal verbs and comparative structures"},{"en":"Listening and speaking, with reported speech forms and connectives for reasons and explanations","ar":"Listening and speaking, with reported speech forms and connectives for reasons and explanations"},{"en":"Reading and speaking, with relative clauses and gerunds","ar":"Reading and speaking, with relative clauses and gerunds"}],"correct":2,"expl":{"en":"The framework says 7Sor.02 draws on listening and speaking skills and on language features such as reported speech forms and connectives for reasons and explanations.","ar":"The framework says 7Sor.02 draws on listening and speaking skills and on language features such as reported speech forms and connectives for reasons and explanations."}},{"id":"m4q3","q":{"en":"A colleague says: \"The framework gives a list of topics I must teach in Stage 8.\" What is the best response?","ar":"A colleague says: \"The framework gives a list of topics I must teach in Stage 8.\" What is the best response?"},"opts":[{"en":"The framework gives a topic list for Stage 8, but not for Stages 7 and 9","ar":"The framework gives a topic list for Stage 8, but not for Stages 7 and 9"},{"en":"The topic list is in the glossary, and it must be taught in the order shown there in every Cambridge school","ar":"The topic list is in the glossary, and it must be taught in the order shown there in every Cambridge school"},{"en":"The topic list is set each year by Cambridge and sent only to the exams officer","ar":"The topic list is set each year by Cambridge and sent only to the exams officer"},{"en":"The framework has no prescriptive topic list; teachers choose topics suited to their learners' context","ar":"The framework has no prescriptive topic list; teachers choose topics suited to their learners' context"}],"correct":3,"expl":{"en":"The framework says it is not accompanied by a prescriptive list of topics, and teachers select topics and resources appropriate to their learners.","ar":"The framework says it is not accompanied by a prescriptive list of topics, and teachers select topics and resources appropriate to their learners."}}]},{"id":"m5","title":{"en":"Reading Across Stages 7 to 9","ar":"Reading Across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The Reading strand has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). This module looks at what each one asks for at Stages 7, 8 and 9, and how to turn the wording into classroom tasks. All quotations are short, so please read the full objectives in the framework before you plan.","ar":"The Reading strand has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). This module looks at what each one asks for at Stages 7, 8 and 9, and how to turn the wording into classroom tasks. All quotations are short, so please read the full objectives in the framework before you plan."}},{"t":"h","c":{"en":"What the strand is about","ar":"What the strand is about"}},{"t":"p","c":{"en":"The framework describes the three sub-strands like this.","ar":"The framework describes the three sub-strands like this."}},{"t":"list","c":{"en":["\u003cstrong>Reading for global meaning:\u003c/strong> understanding the main points of short and extended texts, for example the topic or theme, who the author is, who the target reader is and the author's purpose. Learners also develop confidence in reading a range of fiction and non-fiction texts.","\u003cstrong>Reading for detail:\u003c/strong> understanding specific information, deducing meaning from context, and understanding a line of argument.","\u003cstrong>Reading for opinion:\u003c/strong> recognising the opinions of the writer(s) and the difference between fact and opinion, including bias."],"ar":["\u003cstrong>Reading for global meaning:\u003c/strong> understanding the main points of short and extended texts, for example the topic or theme, who the author is, who the target reader is and the author's purpose. Learners also develop confidence in reading a range of fiction and non-fiction texts.","\u003cstrong>Reading for detail:\u003c/strong> understanding specific information, deducing meaning from context, and understanding a line of argument.","\u003cstrong>Reading for opinion:\u003c/strong> recognising the opinions of the writer(s) and the difference between fact and opinion, including bias."]}},{"t":"p","c":{"en":"The framework says the Reading and Listening sub-strands are named in similar ways, so that you can link the two skills in your teaching. We will look at Listening in Module 8.","ar":"The framework says the Reading and Listening sub-strands are named in similar ways, so that you can link the two skills in your teaching. We will look at Listening in Module 8."}},{"t":"h","c":{"en":"Reading for global meaning (Rm)","ar":"Reading for global meaning (Rm)"}},{"t":"table","head":{"en":["Objective","Stage 7","Stage 8","Stage 9"],"ar":["Objective","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Main points of short and extended texts","7Rm.01: understand most of the main points, with little or no support","8Rm.01: understand the main points, with little or no support","9Rm.01: understand the main points (no support phrase)"],"ar":["Main points of short and extended texts","7Rm.01: understand most of the main points, with little or no support","8Rm.01: understand the main points, with little or no support","9Rm.01: understand the main points (no support phrase)"]},{"en":["Extended reading for confidence and enjoyment","7Rm.02: a limited range of extended fiction and non-fiction","8Rm.02: an increasing range","9Rm.02: a range"],"ar":["Extended reading for confidence and enjoyment","7Rm.02: a limited range of extended fiction and non-fiction","8Rm.02: an increasing range","9Rm.02: a range"]}]},{"t":"p","c":{"en":"Look at the wording closely. In 7Rm.01 the learner understands \u003cem>most of\u003c/em> the main points. In 8Rm.01 the words \"most of\" have gone. In 9Rm.01 the support phrase has gone too. In the second row, the quantity words change: a \u003cem>limited\u003c/em> range, then an \u003cem>increasing\u003c/em> range, then \u003cem>a\u003c/em> range. This is a small but real shift. It means pupils must read more, and more varied, extended texts as they move up.","ar":"Look at the wording closely. In 7Rm.01 the learner understands \u003cem>most of\u003c/em> the main points. In 8Rm.01 the words \"most of\" have gone. In 9Rm.01 the support phrase has gone too. In the second row, the quantity words change: a \u003cem>limited\u003c/em> range, then an \u003cem>increasing\u003c/em> range, then \u003cem>a\u003c/em> range. This is a small but real shift. It means pupils must read more, and more varied, extended texts as they move up."}},{"t":"callout","k":"tip","title":{"en":"Extended reading is an objective, not a bonus","ar":"Extended reading is an objective, not a bonus"},"c":{"en":"Objectives 7Rm.02, 8Rm.02 and 9Rm.02 are about reading extended fiction and non-fiction with confidence and enjoyment. If pupils read only short coursebook texts, these objectives are not fully met. Good practice: plan a class reader or a reading choice time, and give pupils a simple way to share what they enjoyed, for example a two-sentence recommendation.","ar":"Objectives 7Rm.02, 8Rm.02 and 9Rm.02 are about reading extended fiction and non-fiction with confidence and enjoyment. If pupils read only short coursebook texts, these objectives are not fully met. Good practice: plan a class reader or a reading choice time, and give pupils a simple way to share what they enjoyed, for example a two-sentence recommendation."}},{"t":"h","c":{"en":"Reading for detail (Rd)","ar":"Reading for detail (Rd)"}},{"t":"p","c":{"en":"Reading for detail has four objectives at each stage, and they are the most varied in the strand.","ar":"Reading for detail has four objectives at each stage, and they are the most varied in the strand."}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Specific information and detail","7Rd.01: most specific information, little or no support","8Rd.01: specific information, little or no support","9Rd.01: specific information"],"ar":["Specific information and detail","7Rd.01: most specific information, little or no support","8Rd.01: specific information, little or no support","9Rd.01: specific information"]},{"en":["Detail of an argument","7Rd.02: with support","8Rd.02: with little or no support","9Rd.02: no support phrase"],"ar":["Detail of an argument","7Rd.02: with support","8Rd.02: with little or no support","9Rd.02: no support phrase"]},{"en":["Deduce meaning from context","7Rd.03: little or no support","8Rd.04: deduce, and understand some implied meaning, with support","9Rd.04: deduce, and understand some implied meaning, with little or no support"],"ar":["Deduce meaning from context","7Rd.03: little or no support","8Rd.04: deduce, and understand some implied meaning, with support","9Rd.04: deduce, and understand some implied meaning, with little or no support"]},{"en":["Inconsistencies in an argument","Not listed at Stage 7","8Rd.03: begin to recognise, with support","9Rd.03: recognise, with support"],"ar":["Inconsistencies in an argument","Not listed at Stage 7","8Rd.03: begin to recognise, with support","9Rd.03: recognise, with support"]},{"en":["Idiomatic phrases","7Rd.04: explore idiomatic phrases and their meanings","Not listed at Stage 8","Not listed at Stage 9"],"ar":["Idiomatic phrases","7Rd.04: explore idiomatic phrases and their meanings","Not listed at Stage 8","Not listed at Stage 9"]}]},{"t":"p","c":{"en":"This table shows three kinds of change in the framework. First, \u003cstrong>support is reduced\u003c/strong>: the detail of an argument moves from \"with support\" at Stage 7 to \"with little or no support\" at Stage 8 and then to no support phrase at Stage 9. Second, \u003cstrong>new skills are added\u003c/strong>: recognising inconsistencies in an argument appears at Stage 8 and continues at Stage 9, and \"implied meaning\" is added to deducing meaning. Third, \u003cstrong>some skills are not repeated\u003c/strong>: the idioms objective is listed only at Stage 7.","ar":"This table shows three kinds of change in the framework. First, \u003cstrong>support is reduced\u003c/strong>: the detail of an argument moves from \"with support\" at Stage 7 to \"with little or no support\" at Stage 8 and then to no support phrase at Stage 9. Second, \u003cstrong>new skills are added\u003c/strong>: recognising inconsistencies in an argument appears at Stage 8 and continues at Stage 9, and \"implied meaning\" is added to deducing meaning. Third, \u003cstrong>some skills are not repeated\u003c/strong>: the idioms objective is listed only at Stage 7."}},{"t":"callout","k":"warn","title":{"en":"Do not read \"not listed\" as \"never taught\"","ar":"Do not read \"not listed\" as \"never taught\""},"c":{"en":"That idioms appear only as an objective at Stage 7 does not mean they should disappear in Stages 8 and 9. Idioms and phrases still appear in texts. It only means the framework does not list a separate objective for them in later stages. The glossary definition of \u003cstrong>explore\u003c/strong> is useful at Stage 7: to investigate, look for patterns and discuss examples. So at Stage 7 pupils should investigate idioms, not only memorise a list.","ar":"That idioms appear only as an objective at Stage 7 does not mean they should disappear in Stages 8 and 9. Idioms and phrases still appear in texts. It only means the framework does not list a separate objective for them in later stages. The glossary definition of \u003cstrong>explore\u003c/strong> is useful at Stage 7: to investigate, look for patterns and discuss examples. So at Stage 7 pupils should investigate idioms, not only memorise a list."}},{"t":"h","c":{"en":"Reading for opinion (Ro)","ar":"Reading for opinion (Ro)"}},{"t":"table","head":{"en":["Objective","Stage 7","Stage 8","Stage 9"],"ar":["Objective","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Recognise the writer's opinions","7Ro.01: with little or no support","8Ro.01: recognise the opinions of the writer(s)","9Ro.01: recognise opinions and draw relevant conclusions"],"ar":["Recognise the writer's opinions","7Ro.01: with little or no support","8Ro.01: recognise the opinions of the writer(s)","9Ro.01: recognise opinions and draw relevant conclusions"]},{"en":["Fact and opinion, including bias","Not listed at Stage 7","Not listed at Stage 8","9Ro.02: recognise the difference between fact and opinion [including bias]"],"ar":["Fact and opinion, including bias","Not listed at Stage 7","Not listed at Stage 8","9Ro.02: recognise the difference between fact and opinion [including bias]"]}]},{"t":"p","c":{"en":"The framework's overview of the sub-strand mentions the difference between fact and opinion, including bias. In the Stage 7 to 9 objective lists, however, the fact and opinion objective appears first at Stage 9 as 9Ro.02. At Stages 7 and 8 the focus is on recognising the opinion of the writer. This is useful information for planning: you can prepare Stage 8 pupils for 9Ro.02 by asking them to find the writer's opinion and the words that signal it, such as \"in my view\" or \"clearly\".","ar":"The framework's overview of the sub-strand mentions the difference between fact and opinion, including bias. In the Stage 7 to 9 objective lists, however, the fact and opinion objective appears first at Stage 9 as 9Ro.02. At Stages 7 and 8 the focus is on recognising the opinion of the writer. This is useful information for planning: you can prepare Stage 8 pupils for 9Ro.02 by asking them to find the writer's opinion and the words that signal it, such as \"in my view\" or \"clearly\"."}},{"t":"h","c":{"en":"Classroom examples","ar":"Classroom examples"}},{"t":"p","c":{"en":"Here are three short examples, written as good practice, showing how a teacher might read an objective and turn it into a task. Each starts from the framework wording.","ar":"Here are three short examples, written as good practice, showing how a teacher might read an objective and turn it into a task. Each starts from the framework wording."}},{"t":"table","head":{"en":["Objective","What the teacher notices","Possible task (good practice)"],"ar":["Objective","What the teacher notices","Possible task (good practice)"]},"rows":[{"en":["7Rd.01","\"Specific information and detail\", with little or no support","Pupils scan a real school-trip leaflet and fill in a table with dates, costs and what to bring"],"ar":["7Rd.01","\"Specific information and detail\", with little or no support","Pupils scan a real school-trip leaflet and fill in a table with dates, costs and what to bring"]},{"en":["8Rd.03","\"Begin to recognise, with support\" inconsistencies in argument","Give a short review that says \"the food was excellent\" and later \"I was hungry all day\". Ask pupils to find the two sentences that do not agree. Provide a highlighter and a sentence frame"],"ar":["8Rd.03","\"Begin to recognise, with support\" inconsistencies in argument","Give a short review that says \"the food was excellent\" and later \"I was hungry all day\". Ask pupils to find the two sentences that do not agree. Provide a highlighter and a sentence frame"]},{"en":["9Ro.02","Fact versus opinion, including bias","Give two short texts about the same new phone, one from the maker and one from a customer. Pupils underline facts in one colour and opinions in another, and decide which text is more biased and why"],"ar":["9Ro.02","Fact versus opinion, including bias","Give two short texts about the same new phone, one from the maker and one from a customer. Pupils underline facts in one colour and opinions in another, and decide which text is more biased and why"]}]},{"t":"p","c":{"en":"In each case, the support in the task matches the support in the objective. At Stage 8, 8Rd.03 says \"with support\", so the highlighter and sentence frame are right. If you gave no help to a pupil who is meeting inconsistencies for the first time, you would be asking for more than the objective expects.","ar":"In each case, the support in the task matches the support in the objective. At Stage 8, 8Rd.03 says \"with support\", so the highlighter and sentence frame are right. If you gave no help to a pupil who is meeting inconsistencies for the first time, you would be asking for more than the objective expects."}},{"t":"scenario","title":{"en":"Scenario: the pupil who reads every word","ar":"Scenario: the pupil who reads every word"},"c":{"en":"A Year 7 pupil, Hamad, answers comprehension questions correctly but takes the whole lesson, because he translates each word. His teacher looks at 7Rm.01 (most of the main points) and 7Rd.03 (deduce meaning from context). Both suggest that pupils should not need to know every word. She teaches a routine: read the title and first line, decide what the text is about, underline three words you do not know, then use the sentence around each word to guess its meaning before checking. Good practice: she praises good guesses, even when they are not exact.","ar":"A Year 7 pupil, Hamad, answers comprehension questions correctly but takes the whole lesson, because he translates each word. His teacher looks at 7Rm.01 (most of the main points) and 7Rd.03 (deduce meaning from context). Both suggest that pupils should not need to know every word. She teaches a routine: read the title and first line, decide what the text is about, underline three words you do not know, then use the sentence around each word to guess its meaning before checking. Good practice: she praises good guesses, even when they are not exact."}},{"t":"scenario","title":{"en":"Scenario: the argument text","ar":"Scenario: the argument text"},"c":{"en":"A Year 8 teacher uses a text in which a student argues for a longer school day. Pupils can find the writer's reasons (8Rd.02, understand the detail of an argument) but do not notice that the writer says the day should be longer, then says that pupils are too tired. The teacher stops the class, reads the two sentences aloud, and asks: \"Do these agree?\" This links to 8Rd.03, where pupils begin to recognise inconsistencies, with support. The teacher notes that this is a new skill at Stage 8, so she keeps the first examples short and obvious.","ar":"A Year 8 teacher uses a text in which a student argues for a longer school day. Pupils can find the writer's reasons (8Rd.02, understand the detail of an argument) but do not notice that the writer says the day should be longer, then says that pupils are too tired. The teacher stops the class, reads the two sentences aloud, and asks: \"Do these agree?\" This links to 8Rd.03, where pupils begin to recognise inconsistencies, with support. The teacher notes that this is a new skill at Stage 8, so she keeps the first examples short and obvious."}}],"checks":[{"id":"m5q1","q":{"en":"At which stage does the framework first list the objective on recognising inconsistencies in argument in reading?","ar":"At which stage does the framework first list the objective on recognising inconsistencies in argument in reading?"},"opts":[{"en":"Stage 8, where learners begin to recognise them with support (8Rd.03)","ar":"Stage 8, where learners begin to recognise them with support (8Rd.03)"},{"en":"Stage 7, where learners recognise them with little or no support (7Rd.03)","ar":"Stage 7, where learners recognise them with little or no support (7Rd.03)"},{"en":"Stage 9 only, where learners recognise them for the first time (9Rd.03)","ar":"Stage 9 only, where learners recognise them for the first time (9Rd.03)"},{"en":"Stage 8, where learners recognise them with little or no support (8Rd.03)","ar":"Stage 8, where learners recognise them with little or no support (8Rd.03)"}],"correct":0,"expl":{"en":"The framework lists 8Rd.03 as \"begin to recognise, with support\" inconsistencies in argument, and 9Rd.03 continues it with support. It is not listed at Stage 7.","ar":"The framework lists 8Rd.03 as \"begin to recognise, with support\" inconsistencies in argument, and 9Rd.03 continues it with support. It is not listed at Stage 7."}},{"id":"m5q2","q":{"en":"Which sub-strand and stage does the objective on fact and opinion, including bias, belong to?","ar":"Which sub-strand and stage does the objective on fact and opinion, including bias, belong to?"},"opts":[{"en":"Reading for opinion at Stage 7, coded 7Ro.02","ar":"Reading for opinion at Stage 7, coded 7Ro.02"},{"en":"Reading for opinion at Stage 9, coded 9Ro.02","ar":"Reading for opinion at Stage 9, coded 9Ro.02"},{"en":"Reading for global meaning at Stage 9, coded 9Rm.03","ar":"Reading for global meaning at Stage 9, coded 9Rm.03"},{"en":"Reading for detail at Stage 8, coded 8Rd.05","ar":"Reading for detail at Stage 8, coded 8Rd.05"}],"correct":1,"expl":{"en":"The framework lists 9Ro.02 in Reading for opinion at Stage 9: recognise the difference between fact and opinion, including bias.","ar":"The framework lists 9Ro.02 in Reading for opinion at Stage 9: recognise the difference between fact and opinion, including bias."}},{"id":"m5q3","q":{"en":"A Year 7 teacher is planning for 7Rm.02. Which activity best matches this objective?","ar":"A Year 7 teacher is planning for 7Rm.02. Which activity best matches this objective?"},"opts":[{"en":"Pupils complete a ten-question worksheet on one paragraph taken from the coursebook","ar":"Pupils complete a ten-question worksheet on one paragraph taken from the coursebook"},{"en":"Pupils copy a short text from the board and underline all the verbs in the text","ar":"Pupils copy a short text from the board and underline all the verbs in the text"},{"en":"Pupils choose and read an extended fiction or non-fiction text and share what they enjoyed","ar":"Pupils choose and read an extended fiction or non-fiction text and share what they enjoyed"},{"en":"Pupils listen to a recorded talk and note down the speaker's main reasons","ar":"Pupils listen to a recorded talk and note down the speaker's main reasons"}],"correct":2,"expl":{"en":"7Rm.02 asks learners to read a limited range of extended fiction and non-fiction texts with confidence and enjoyment, so extended reading and enjoyment are essential.","ar":"7Rm.02 asks learners to read a limited range of extended fiction and non-fiction texts with confidence and enjoyment, so extended reading and enjoyment are essential."}}]},{"id":"m6","title":{"en":"Writing Across Stages 7 to 9","ar":"Writing Across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The Writing strand has three sub-strands: Communicative achievement (Wca), Organisation (Wor) and Content (Wc). Each has the same number of objectives at every stage: four, three and two, nine in all. This makes the progression easy to compare. In this module you will see what changes across Stages 7, 8 and 9, and how support and independence are used to describe the growth of a young writer.","ar":"The Writing strand has three sub-strands: Communicative achievement (Wca), Organisation (Wor) and Content (Wc). Each has the same number of objectives at every stage: four, three and two, nine in all. This makes the progression easy to compare. In this module you will see what changes across Stages 7, 8 and 9, and how support and independence are used to describe the growth of a young writer."}},{"t":"h","c":{"en":"What the strand is about","ar":"What the strand is about"}},{"t":"p","c":{"en":"The framework describes the Writing sub-strands in this way.","ar":"The framework describes the Writing sub-strands in this way."}},{"t":"list","c":{"en":["\u003cstrong>Communicative achievement:\u003c/strong> generating ideas, planning and editing written work, using style and register appropriate for different genres, and developing grammatical accuracy and the ability to identify and correct their own errors.","\u003cstrong>Organisation:\u003c/strong> using a range of connectives to link ideas into coherent, extended text, and using appropriate layout for a wide variety of written genres.","\u003cstrong>Content:\u003c/strong> using a range of language to write text for different purposes in a variety of genres, and expressing opinions and developing coherent arguments supported by reasons, examples and evidence."],"ar":["\u003cstrong>Communicative achievement:\u003c/strong> generating ideas, planning and editing written work, using style and register appropriate for different genres, and developing grammatical accuracy and the ability to identify and correct their own errors.","\u003cstrong>Organisation:\u003c/strong> using a range of connectives to link ideas into coherent, extended text, and using appropriate layout for a wide variety of written genres.","\u003cstrong>Content:\u003c/strong> using a range of language to write text for different purposes in a variety of genres, and expressing opinions and developing coherent arguments supported by reasons, examples and evidence."]}},{"t":"p","c":{"en":"The glossary defines \u003cstrong>connective\u003c/strong> as a word used to join words, phrases or clauses, or to show relationships between sentences. It includes conjunctions, adverbs and adverbial phrases. The framework's example sentences include \"and\", \"until\" and \"Later that day\".","ar":"The glossary defines \u003cstrong>connective\u003c/strong> as a word used to join words, phrases or clauses, or to show relationships between sentences. It includes conjunctions, adverbs and adverbial phrases. The framework's example sentences include \"and\", \"until\" and \"Later that day\"."}},{"t":"h","c":{"en":"Communicative achievement (Wca)","ar":"Communicative achievement (Wca)"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Spelling","7Wca.01: familiar words, an increasing range of topics","8Wca.01: a range of topics","9Wca.01: a wide range of topics"],"ar":["Spelling","7Wca.01: familiar words, an increasing range of topics","8Wca.01: a range of topics","9Wca.01: a wide range of topics"]},{"en":["Plan, write, edit and proofread extended texts","7Wca.02: with support","8Wca.02: with little or no support","9Wca.02: independently"],"ar":["Plan, write, edit and proofread extended texts","7Wca.02: with support","8Wca.02: with little or no support","9Wca.02: independently"]},{"en":["Style and register for genres","7Wca.03: with support","8Wca.03: with little or no support","9Wca.03: no support phrase"],"ar":["Style and register for genres","7Wca.03: with support","8Wca.03: with little or no support","9Wca.03: no support phrase"]},{"en":["Accuracy and self-correction","7Wca.04: mostly accurate, allowing for occasional mistakes","8Wca.04: mostly accurate; begin to correct their own errors","9Wca.04: mostly accurate, without mistakes that cause misunderstanding; frequently correct their own errors"],"ar":["Accuracy and self-correction","7Wca.04: mostly accurate, allowing for occasional mistakes","8Wca.04: mostly accurate; begin to correct their own errors","9Wca.04: mostly accurate, without mistakes that cause misunderstanding; frequently correct their own errors"]}]},{"t":"p","c":{"en":"Two patterns are clear. The first is the support ladder from \"with support\" to \"independently\". The second is the \u003cstrong>growth of self-correction\u003c/strong>. At Stage 7 there is no mention of correcting errors in 7Wca.04. At Stage 8 learners \"begin to correct their own errors\". At Stage 9 they \"frequently correct\" them. Also notice the target for accuracy at Stage 9: no mistakes that cause misunderstanding. This is a realistic target for ESL learners. It is not \"no mistakes\".","ar":"Two patterns are clear. The first is the support ladder from \"with support\" to \"independently\". The second is the \u003cstrong>growth of self-correction\u003c/strong>. At Stage 7 there is no mention of correcting errors in 7Wca.04. At Stage 8 learners \"begin to correct their own errors\". At Stage 9 they \"frequently correct\" them. Also notice the target for accuracy at Stage 9: no mistakes that cause misunderstanding. This is a realistic target for ESL learners. It is not \"no mistakes\"."}},{"t":"callout","k":"tip","title":{"en":"Teaching self-correction (good practice)","ar":"Teaching self-correction (good practice)"},"c":{"en":"Instead of correcting every error in red, mark the line where there is an error, or write a code in the margin (for example T for tense, SP for spelling), and let the pupil correct it. At Stage 8 give a short checklist: \"Check verbs, check connectives, check punctuation.\" By Stage 9 pupils should create their own checklist from errors they often make.","ar":"Instead of correcting every error in red, mark the line where there is an error, or write a code in the margin (for example T for tense, SP for spelling), and let the pupil correct it. At Stage 8 give a short checklist: \"Check verbs, check connectives, check punctuation.\" By Stage 9 pupils should create their own checklist from errors they often make."}},{"t":"h","c":{"en":"Organisation (Wor)","ar":"Organisation (Wor)"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Punctuation","7Wor.01: some accuracy when writing independently","8Wor.01: reasonable accuracy when writing independently","9Wor.01: reasonable accuracy; frequently correct their own errors"],"ar":["Punctuation","7Wor.01: some accuracy when writing independently","8Wor.01: reasonable accuracy when writing independently","9Wor.01: reasonable accuracy; frequently correct their own errors"]},{"en":["Linking with connectives","7Wor.02: link sentences and paragraphs, with support, using a range of connectives","8Wor.02: link ideas into coherent, extended text using a range of connectives","9Wor.02: link ideas and arguments into coherent, extended text using a range of connectives"],"ar":["Linking with connectives","7Wor.02: link sentences and paragraphs, with support, using a range of connectives","8Wor.02: link ideas into coherent, extended text using a range of connectives","9Wor.02: link ideas and arguments into coherent, extended text using a range of connectives"]},{"en":["Layout for genres","7Wor.03: with support, an increasing range of genres","8Wor.03: with little or no support, a range of genres","9Wor.03: a wide range of genres"],"ar":["Layout for genres","7Wor.03: with support, an increasing range of genres","8Wor.03: with little or no support, a range of genres","9Wor.03: a wide range of genres"]}]},{"t":"p","c":{"en":"In punctuation, the words move from \u003cem>some\u003c/em> accuracy to \u003cem>reasonable\u003c/em> accuracy, and the self-correction idea appears at Stage 9. In linking, the object changes from \"sentences and paragraphs\" to \"ideas\" to \"ideas and arguments\". That is a move from the surface of the text to its logic. In layout, the number of genres grows: an increasing range, then a range, then a wide range. A Stage 9 pupil should therefore control the layout of, for example, a formal email, a report, a review and a story, without help.","ar":"In punctuation, the words move from \u003cem>some\u003c/em> accuracy to \u003cem>reasonable\u003c/em> accuracy, and the self-correction idea appears at Stage 9. In linking, the object changes from \"sentences and paragraphs\" to \"ideas\" to \"ideas and arguments\". That is a move from the surface of the text to its logic. In layout, the number of genres grows: an increasing range, then a range, then a wide range. A Stage 9 pupil should therefore control the layout of, for example, a formal email, a report, a review and a story, without help."}},{"t":"h","c":{"en":"Content (Wc)","ar":"Content (Wc)"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Describe people, places, objects and past and present actions and events (real and imagined)","7Wc.01: short texts, with little or no support","8Wc.01: extended texts, with support","9Wc.01: extended texts, with little or no support, in detail"],"ar":["Describe people, places, objects and past and present actions and events (real and imagined)","7Wc.01: short texts, with little or no support","8Wc.01: extended texts, with support","9Wc.01: extended texts, with little or no support, in detail"]},{"en":["Opinions and arguments","7Wc.02: express opinions, with support, and begin to develop arguments with reasons, examples and evidence","8Wc.02: with little or no support, develop coherent arguments","9Wc.02: express opinions and develop coherent arguments (no support phrase)"],"ar":["Opinions and arguments","7Wc.02: express opinions, with support, and begin to develop arguments with reasons, examples and evidence","8Wc.02: with little or no support, develop coherent arguments","9Wc.02: express opinions and develop coherent arguments (no support phrase)"]}]},{"t":"p","c":{"en":"The first row contains an interesting detail. At Stage 7 learners write \u003cem>short\u003c/em> texts with little or no support. At Stage 8 they write \u003cem>extended\u003c/em> texts \u003cem>with support\u003c/em>. Support goes up when the length goes up. The framework is not going backwards. It is saying that when the task becomes bigger and harder, learners again need help. At Stage 9 the extended texts are written with little or no support and \"in detail\". A teacher who understands this will not be worried when a Year 8 pupil who wrote good paragraphs in Year 7 now needs a planning frame for a longer text.","ar":"The first row contains an interesting detail. At Stage 7 learners write \u003cem>short\u003c/em> texts with little or no support. At Stage 8 they write \u003cem>extended\u003c/em> texts \u003cem>with support\u003c/em>. Support goes up when the length goes up. The framework is not going backwards. It is saying that when the task becomes bigger and harder, learners again need help. At Stage 9 the extended texts are written with little or no support and \"in detail\". A teacher who understands this will not be worried when a Year 8 pupil who wrote good paragraphs in Year 7 now needs a planning frame for a longer text."}},{"t":"callout","k":"key","title":{"en":"Support and difficulty move together","ar":"Support and difficulty move together"},"c":{"en":"When a framework objective increases the length, range or difficulty of a task, it often adds \"with support\" again. Use this when you plan: introduce the harder task with a frame, a model text or a planning grid, and then take the help away step by step. This is the \"can-do ladder\" from Module 2 in action.","ar":"When a framework objective increases the length, range or difficulty of a task, it often adds \"with support\" again. Use this when you plan: introduce the harder task with a frame, a model text or a planning grid, and then take the help away step by step. This is the \"can-do ladder\" from Module 2 in action."}},{"t":"h","c":{"en":"Classroom examples","ar":"Classroom examples"}},{"t":"table","head":{"en":["Objective","What the teacher notices","Possible task (good practice)"],"ar":["Objective","What the teacher notices","Possible task (good practice)"]},"rows":[{"en":["7Wca.02","Generate ideas, plan, write, edit and proofread, with support","Pupils plan a short email to a new classmate using a mind map, write a draft, and then check it with a partner using a three-item checklist"],"ar":["7Wca.02","Generate ideas, plan, write, edit and proofread, with support","Pupils plan a short email to a new classmate using a mind map, write a draft, and then check it with a partner using a three-item checklist"]},{"en":["8Wc.02","Opinions and coherent arguments with reasons, examples and evidence, little or no support","Pupils write a paragraph on whether phones should be allowed in school, with one reason, one example and one piece of evidence, and underline each"],"ar":["8Wc.02","Opinions and coherent arguments with reasons, examples and evidence, little or no support","Pupils write a paragraph on whether phones should be allowed in school, with one reason, one example and one piece of evidence, and underline each"]},{"en":["9Wor.03","Appropriate layout for a wide range of genres","Pupils receive a mixed set of short texts (email, report, review, story) and write the features of each layout, then produce one in a genre they choose"],"ar":["9Wor.03","Appropriate layout for a wide range of genres","Pupils receive a mixed set of short texts (email, report, review, story) and write the features of each layout, then produce one in a genre they choose"]}]},{"t":"scenario","title":{"en":"Scenario: the pupil whose writing gets worse","ar":"Scenario: the pupil whose writing gets worse"},"c":{"en":"Maryam, a Year 8 pupil, wrote clear, correct paragraphs in Year 7. Now her longer texts have more errors and weaker links between ideas. Her new teacher worries that she has gone backwards. Looking at 7Wc.01 and 8Wc.01, the teacher sees the change from short texts with little or no support to extended texts with support. The task has become harder, so Maryam needs scaffolding again. The teacher gives her a planning grid with boxes for the introduction, two main points with reasons, and a conclusion, and a list of connectives from 8Wor.02. Within three weeks the errors fall.","ar":"Maryam, a Year 8 pupil, wrote clear, correct paragraphs in Year 7. Now her longer texts have more errors and weaker links between ideas. Her new teacher worries that she has gone backwards. Looking at 7Wc.01 and 8Wc.01, the teacher sees the change from short texts with little or no support to extended texts with support. The task has become harder, so Maryam needs scaffolding again. The teacher gives her a planning grid with boxes for the introduction, two main points with reasons, and a conclusion, and a list of connectives from 8Wor.02. Within three weeks the errors fall."}},{"t":"scenario","title":{"en":"Scenario: marking for self-correction","ar":"Scenario: marking for self-correction"},"c":{"en":"A Year 9 teacher returns writing with every error corrected. Pupils read the grade and put the work away. The teacher remembers 9Wca.04 and 9Wor.01, which expect pupils to frequently correct their own errors. She changes her approach: she underlines errors, writes a code in the margin, and asks pupils to correct five of them during the next lesson, in a different colour. She then asks each pupil to write one personal goal, for example \"check subject-verb agreement\". The corrections become part of the learning.","ar":"A Year 9 teacher returns writing with every error corrected. Pupils read the grade and put the work away. The teacher remembers 9Wca.04 and 9Wor.01, which expect pupils to frequently correct their own errors. She changes her approach: she underlines errors, writes a code in the margin, and asks pupils to correct five of them during the next lesson, in a different colour. She then asks each pupil to write one personal goal, for example \"check subject-verb agreement\". The corrections become part of the learning."}}],"checks":[{"id":"m6q1","q":{"en":"What does the framework expect Stage 9 learners to do about their own errors in writing?","ar":"What does the framework expect Stage 9 learners to do about their own errors in writing?"},"opts":[{"en":"Avoid making any mistakes, so that no correction is needed once the work is complete","ar":"Avoid making any mistakes, so that no correction is needed once the work is complete"},{"en":"Wait for the teacher to correct the errors, then copy the corrected version into their books","ar":"Wait for the teacher to correct the errors, then copy the corrected version into their books"},{"en":"Correct only spelling errors, because grammar mistakes are not part of the Stage 9 objectives","ar":"Correct only spelling errors, because grammar mistakes are not part of the Stage 9 objectives"},{"en":"Frequently correct their own errors, and avoid mistakes that cause misunderstanding (9Wca.04)","ar":"Frequently correct their own errors, and avoid mistakes that cause misunderstanding (9Wca.04)"}],"correct":3,"expl":{"en":"9Wca.04 says learners use mostly accurate written language, without making mistakes which cause misunderstanding, and frequently correct their own errors.","ar":"9Wca.04 says learners use mostly accurate written language, without making mistakes which cause misunderstanding, and frequently correct their own errors."}},{"id":"m6q2","q":{"en":"Why does 8Wc.01 say \"with support\" when 7Wc.01 says \"with little or no support\"?","ar":"Why does 8Wc.01 say \"with support\" when 7Wc.01 says \"with little or no support\"?"},"opts":[{"en":"Stage 8 asks for extended texts, not short texts, so the harder task again needs support","ar":"Stage 8 asks for extended texts, not short texts, so the harder task again needs support"},{"en":"Stage 8 learners are expected to be less skilled than Stage 7 learners in all writing tasks","ar":"Stage 8 learners are expected to be less skilled than Stage 7 learners in all writing tasks"},{"en":"The framework made a printing mistake, and both objectives should say the same thing","ar":"The framework made a printing mistake, and both objectives should say the same thing"},{"en":"Support is needed at Stage 8 only because the topics become more difficult for all learners","ar":"Support is needed at Stage 8 only because the topics become more difficult for all learners"}],"correct":0,"expl":{"en":"7Wc.01 is about short texts and 8Wc.01 is about extended texts. The longer, harder task brings back the support phrase before it is reduced again at Stage 9.","ar":"7Wc.01 is about short texts and 8Wc.01 is about extended texts. The longer, harder task brings back the support phrase before it is reduced again at Stage 9."}},{"id":"m6q3","q":{"en":"Which sequence of the Organisation objective on linking shows the correct development?","ar":"Which sequence of the Organisation objective on linking shows the correct development?"},"opts":[{"en":"Ideas and arguments (Stage 7), ideas (Stage 8), then sentences and paragraphs (Stage 9)","ar":"Ideas and arguments (Stage 7), ideas (Stage 8), then sentences and paragraphs (Stage 9)"},{"en":"Sentences and paragraphs (Stage 7), ideas (Stage 8), then ideas and arguments (Stage 9)","ar":"Sentences and paragraphs (Stage 7), ideas (Stage 8), then ideas and arguments (Stage 9)"},{"en":"Sentences (Stage 7), paragraphs (Stage 8), then whole essays with no connectives (Stage 9)","ar":"Sentences (Stage 7), paragraphs (Stage 8), then whole essays with no connectives (Stage 9)"},{"en":"Ideas (Stage 7), sentences and paragraphs (Stage 8), then ideas and arguments (Stage 9)","ar":"Ideas (Stage 7), sentences and paragraphs (Stage 8), then ideas and arguments (Stage 9)"}],"correct":1,"expl":{"en":"The framework lists 7Wor.02 (sentences and paragraphs), 8Wor.02 (ideas) and 9Wor.02 (ideas and arguments).","ar":"The framework lists 7Wor.02 (sentences and paragraphs), 8Wor.02 (ideas) and 9Wor.02 (ideas and arguments)."}}]},{"id":"m7","title":{"en":"Use of English Across Stages 7 to 9","ar":"Use of English Across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Use of English is the strand that makes ESL different from first-language English in the Cambridge framework. It is the largest strand: by the count in Module 3 it has 23 objectives at Stage 7, 24 at Stage 8 and 21 at Stage 9. This module explains how the framework organises it, how key language areas develop across the three stages, and how to teach it without turning every lesson into a grammar lesson.","ar":"Use of English is the strand that makes ESL different from first-language English in the Cambridge framework. It is the largest strand: by the count in Module 3 it has 23 objectives at Stage 7, 24 at Stage 8 and 21 at Stage 9. This module explains how the framework organises it, how key language areas develop across the three stages, and how to teach it without turning every lesson into a grammar lesson."}},{"t":"h","c":{"en":"How the framework organises Use of English","ar":"How the framework organises Use of English"}},{"t":"p","c":{"en":"The framework says the Use of English strand provides the linguistic features learners need for the receptive skills (Reading and Listening) and the productive skills (Writing and Speaking). It has three sub-strands.","ar":"The framework says the Use of English strand provides the linguistic features learners need for the receptive skills (Reading and Listening) and the productive skills (Writing and Speaking). It has three sub-strands."}},{"t":"table","head":{"en":["Sub-strand (code)","What the framework says learners develop","Number of objectives (Stage 7, 8, 9)"],"ar":["Sub-strand (code)","What the framework says learners develop","Number of objectives (Stage 7, 8, 9)"]},"rows":[{"en":["Grammatical forms (Ug)","Knowledge and use of grammatical conventions to enable effective communication and understanding","12, 14, 15"],"ar":["Grammatical forms (Ug)","Knowledge and use of grammatical conventions to enable effective communication and understanding","12, 14, 15"]},{"en":["Vocabulary (Uv)","Knowledge and use of word classes in increasingly complex contexts","5, 5, 3"],"ar":["Vocabulary (Uv)","Knowledge and use of word classes in increasingly complex contexts","5, 5, 3"]},{"en":["Sentence structure (Us)","The ability to accurately organise sentences and connect ideas for clarity and coherence","6, 5, 3"],"ar":["Sentence structure (Us)","The ability to accurately organise sentences and connect ideas for clarity and coherence","6, 5, 3"]}]},{"t":"p","c":{"en":"Notice how the framework uses the word \u003cstrong>Vocabulary\u003c/strong>. In this strand, it is about word classes in more complex contexts: for example prepositions that follow adjectives (7Uv.01), comparative adverb structures (7Uv.03), complex noun phrases (7Uv.04) and abstract and compound nouns (7Uv.05). The glossary defines vocabulary simply as \"words and phrases\". The framework does not give word lists, so topic vocabulary comes from the topics and texts you choose.","ar":"Notice how the framework uses the word \u003cstrong>Vocabulary\u003c/strong>. In this strand, it is about word classes in more complex contexts: for example prepositions that follow adjectives (7Uv.01), comparative adverb structures (7Uv.03), complex noun phrases (7Uv.04) and abstract and compound nouns (7Uv.05). The glossary defines vocabulary simply as \"words and phrases\". The framework does not give word lists, so topic vocabulary comes from the topics and texts you choose."}},{"t":"h","c":{"en":"Grammatical forms (Ug): how verb forms develop","ar":"Grammatical forms (Ug): how verb forms develop"}},{"t":"p","c":{"en":"Grammatical forms is the biggest sub-strand. The table shows how some major areas develop. It does not list every objective, so please use the framework for the full set.","ar":"Grammatical forms is the biggest sub-strand. The table shows how some major areas develop. It does not list every objective, so please use the framework for the full set."}},{"t":"table","head":{"en":["Area","Stage 7","Stage 8","Stage 9"],"ar":["Area","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Present and past simple","7Ug.02, 7Ug.03: a range of active forms and an increasing range of passive forms","8Ug.02, 8Ug.03: a wide range of active forms and a range of passive forms","9Ug.01, 9Ug.02: a wide range of active and passive forms"],"ar":["Present and past simple","7Ug.02, 7Ug.03: a range of active forms and an increasing range of passive forms","8Ug.02, 8Ug.03: a wide range of active forms and a range of passive forms","9Ug.01, 9Ug.02: a wide range of active and passive forms"]},{"en":["Continuous forms","7Ug.04, 7Ug.05: present and past continuous, an increasing range","8Ug.04: present continuous, begin to use passive forms; 8Ug.05: past continuous","9Ug.03, 9Ug.04: continuous forms, with passive forms increasing or beginning"],"ar":["Continuous forms","7Ug.04, 7Ug.05: present and past continuous, an increasing range","8Ug.04: present continuous, begin to use passive forms; 8Ug.05: past continuous","9Ug.03, 9Ug.04: continuous forms, with passive forms increasing or beginning"]},{"en":["Perfect forms","7Ug.06: present perfect, to express recent, indefinite and unfinished past","8Ug.06 present perfect; 8Ug.07 begin present perfect continuous; 8Ug.08 past perfect simple","9Ug.05 to 9Ug.08: present perfect (begin passive), present perfect continuous, past perfect simple (active and passive), begin past perfect continuous"],"ar":["Perfect forms","7Ug.06: present perfect, to express recent, indefinite and unfinished past","8Ug.06 present perfect; 8Ug.07 begin present perfect continuous; 8Ug.08 past perfect simple","9Ug.05 to 9Ug.08: present perfect (begin passive), present perfect continuous, past perfect simple (active and passive), begin past perfect continuous"]},{"en":["Conditionals","7Ug.08: zero and first conditionals, with if/unless","8Ug.10: second conditionals and wish [that] structures (present reference)","9Ug.10: begin to use third conditionals"],"ar":["Conditionals","7Ug.08: zero and first conditionals, with if/unless","8Ug.10: second conditionals and wish [that] structures (present reference)","9Ug.10: begin to use third conditionals"]},{"en":["Reported speech","7Ug.10: statements, questions and commands (say, tell), including requests","8Ug.12: a range of forms (ask, wonder)","9Ug.12: a range of reported statements and question forms"],"ar":["Reported speech","7Ug.10: statements, questions and commands (say, tell), including requests","8Ug.12: a range of forms (ask, wonder)","9Ug.12: a range of reported statements and question forms"]},{"en":["Modals","7Ug.11: a range of functions, such as obligation, permission and suggestions","8Ug.13: a wide range, and a limited range of past modals to express regret and criticism","9Ug.14: an increasing range of past modals for speculation and deduction about the past"],"ar":["Modals","7Ug.11: a range of functions, such as obligation, permission and suggestions","8Ug.13: a wide range, and a limited range of past modals to express regret and criticism","9Ug.14: an increasing range of past modals for speculation and deduction about the past"]}]},{"t":"p","c":{"en":"Four patterns are worth noticing.","ar":"Four patterns are worth noticing."}},{"t":"steps","c":{"en":["\u003cstrong>Active forms come first, passive forms follow.\u003c/strong> At Stage 7 passive forms are an \"increasing range\". At Stage 8, for example, learners \"begin to use\" passive forms of the present continuous (8Ug.04). At Stage 9, passive forms are named in almost every tense objective.","\u003cstrong>New forms arrive with \"begin to\".\u003c/strong> Present perfect continuous is \"begin to use\" at Stage 8 (8Ug.07) and then \"use\" at Stage 9 (9Ug.06). Third conditionals are \"begin to use\" at Stage 9. Past perfect continuous also begins at Stage 9 (9Ug.08).","\u003cstrong>Meaning grows with form.\u003c/strong> Modals begin with obligation, permission and suggestion at Stage 7, add regret and criticism about the past at Stage 8, and speculation and deduction about the past at Stage 9.","\u003cstrong>Range words matter.\u003c/strong> \"A range\", \"an increasing range\", \"a wide range\" and \"limited range\" tell you how broad the practice should be. They do not give a fixed list, so a team may decide together which forms to teach."],"ar":["\u003cstrong>Active forms come first, passive forms follow.\u003c/strong> At Stage 7 passive forms are an \"increasing range\". At Stage 8, for example, learners \"begin to use\" passive forms of the present continuous (8Ug.04). At Stage 9, passive forms are named in almost every tense objective.","\u003cstrong>New forms arrive with \"begin to\".\u003c/strong> Present perfect continuous is \"begin to use\" at Stage 8 (8Ug.07) and then \"use\" at Stage 9 (9Ug.06). Third conditionals are \"begin to use\" at Stage 9. Past perfect continuous also begins at Stage 9 (9Ug.08).","\u003cstrong>Meaning grows with form.\u003c/strong> Modals begin with obligation, permission and suggestion at Stage 7, add regret and criticism about the past at Stage 8, and speculation and deduction about the past at Stage 9.","\u003cstrong>Range words matter.\u003c/strong> \"A range\", \"an increasing range\", \"a wide range\" and \"limited range\" tell you how broad the practice should be. They do not give a fixed list, so a team may decide together which forms to teach."]}},{"t":"callout","k":"tip","title":{"en":"Teach the form with its meaning and use","ar":"Teach the form with its meaning and use"},"c":{"en":"A grammar objective like 8Ug.10 is not just \"second conditional: if + past simple, would + verb\". The objective includes \u003cem>wish\u003c/em> structures with present reference, and it uses the word \"Use\". Plan tasks in which pupils must use the form to say something: \"If I were the head teacher, I would ...\", \"I wish we had a longer break.\" Good practice: ask pupils to explain in their own words when you would use this form and not a first conditional.","ar":"A grammar objective like 8Ug.10 is not just \"second conditional: if + past simple, would + verb\". The objective includes \u003cem>wish\u003c/em> structures with present reference, and it uses the word \"Use\". Plan tasks in which pupils must use the form to say something: \"If I were the head teacher, I would ...\", \"I wish we had a longer break.\" Good practice: ask pupils to explain in their own words when you would use this form and not a first conditional."}},{"t":"h","c":{"en":"Vocabulary (Uv) and Sentence structure (Us)","ar":"Vocabulary (Uv) and Sentence structure (Us)"}},{"t":"table","head":{"en":["Area","Stage 7","Stage 8","Stage 9"],"ar":["Area","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Dependent prepositions","7Uv.01: an increasing range after adjectives","8Uv.01: a range after adjectives, a limited range after nouns and verbs (information about, listen to)","9Uv.01: a wide range after adjectives, an increasing range after nouns and verbs"],"ar":["Dependent prepositions","7Uv.01: an increasing range after adjectives","8Uv.01: a range after adjectives, a limited range after nouns and verbs (information about, listen to)","9Uv.01: a wide range after adjectives, an increasing range after nouns and verbs"]},{"en":["Noun phrases and nouns","7Uv.04, 7Uv.05: a limited range of complex noun phrases; an increasing range of abstract and compound nouns","8Uv.04, 8Uv.05: an increasing range of complex noun phrases; a range of abstract and compound nouns","9Uv.03: a range of abstract nouns, compound nouns and complex noun phrases"],"ar":["Noun phrases and nouns","7Uv.04, 7Uv.05: a limited range of complex noun phrases; an increasing range of abstract and compound nouns","8Uv.04, 8Uv.05: an increasing range of complex noun phrases; a range of abstract and compound nouns","9Uv.03: a range of abstract nouns, compound nouns and complex noun phrases"]},{"en":["Connectives","7Us.03: connectives for reasons (therefore, as) and explanations (so that, such as)","8Us.02: connectives for purpose and contrast (although, while, however)","9Us.01: a range of connectives"],"ar":["Connectives","7Us.03: connectives for reasons (therefore, as) and explanations (so that, such as)","8Us.02: connectives for purpose and contrast (although, while, however)","9Us.01: a range of connectives"]},{"en":["Relative clauses","7Us.04: defining and non-defining (including why clauses)","8Us.03: including with prepositions (from where, to whom)","9Us.02: including which to refer to the previous clause"],"ar":["Relative clauses","7Us.04: defining and non-defining (including why clauses)","8Us.03: including with prepositions (from where, to whom)","9Us.02: including which to refer to the previous clause"]},{"en":["Gerunds and infinitives","7Us.05, 7Us.06: a limited range of gerunds; infinitives and gerunds after a limited range of words","8Us.04, 8Us.05: an increasing range","9Us.03: infinitive and gerund forms after a range of verbs, adjectives and prepositions"],"ar":["Gerunds and infinitives","7Us.05, 7Us.06: a limited range of gerunds; infinitives and gerunds after a limited range of words","8Us.04, 8Us.05: an increasing range","9Us.03: infinitive and gerund forms after a range of verbs, adjectives and prepositions"]}]},{"t":"p","c":{"en":"You may notice that the number of Uv and Us objectives falls at Stage 9 (see the table above). This does not mean there is less to learn. At Stage 9 the objectives combine several ideas. For example, 9Uv.03 covers abstract nouns, compound nouns and complex noun phrases in one objective, where Stage 7 has separate objectives for noun phrases (7Uv.04) and abstract and compound nouns (7Uv.05). And 9Us.01 simply says \"a range of connectives\", which builds on all the connectives of Stages 7 and 8. When objectives are shorter, do not treat them as lighter.","ar":"You may notice that the number of Uv and Us objectives falls at Stage 9 (see the table above). This does not mean there is less to learn. At Stage 9 the objectives combine several ideas. For example, 9Uv.03 covers abstract nouns, compound nouns and complex noun phrases in one objective, where Stage 7 has separate objectives for noun phrases (7Uv.04) and abstract and compound nouns (7Uv.05). And 9Us.01 simply says \"a range of connectives\", which builds on all the connectives of Stages 7 and 8. When objectives are shorter, do not treat them as lighter."}},{"t":"callout","k":"warn","title":{"en":"Use of English is not a separate grammar course","ar":"Use of English is not a separate grammar course"},"c":{"en":"The framework says that Use of English objectives provide the language features for the four skills and that each lesson and unit should include a focus on one or more of them. It does not say to teach Use of English in separate gramma
