#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-esl-framework-a","code":"LEA","passMark":80,"hours":"2.5 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary English as a Second Language 0876 · Part A","ar":"Staff CPD · Cambridge Lower Secondary English as a Second Language 0876 · Part A"},"title":{"en":"Understanding the Cambridge Lower Secondary ESL Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Lower Secondary ESL Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for Years 7 to 9 teachers, HODs and new staff: why the framework exists, how the CEFR shapes it, how its five strands and objective codes work, how the integrated approach connects the skills, and how Reading, Writing, Use of English, Listening and Speaking develop across Stages 7, 8 and 9.","ar":"A self-paced guide for Years 7 to 9 teachers, HODs and new staff: why the framework exists, how the CEFR shapes it, how its five strands and objective codes work, how the integrated approach connects the skills, and how Reading, Writing, Use of English, Listening and Speaking develop across Stages 7, 8 and 9."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework (v2.0)","ar":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework (v2.0)"},"source":{"en":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework, version 2.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Please check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework, version 2.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Please check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway and Support","ar":"Why This Framework? Purpose, Pathway and Support"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD helps you understand the Cambridge Lower Secondary English as a Second Language (ESL) 0876 Curriculum Framework as a working tool, not just a list of grammar points. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe how the CEFR shapes the objectives; read a learning-objective code such as 8Ug.10; explain the integrated approach; and trace how Reading, Writing, Use of English, Listening and Speaking develop from Stage 7 to Stage 9. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"This CPD helps you understand the Cambridge Lower Secondary English as a Second Language (ESL) 0876 Curriculum Framework as a working tool, not just a list of grammar points. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe how the CEFR shapes the objectives; read a learning-objective code such as 8Ug.10; explain the integrated approach; and trace how Reading, Writing, Use of English, Listening and Speaking develop from Stage 7 to Stage 9. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"At PEPS, Years 7 to 9 follow Cambridge Lower Secondary English as a Second Language 0876. In Cambridge language, Year 7 is Stage 7, Year 8 is Stage 8 and Year 9 is Stage 9. The official description of the programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It says what learners should be able to do in English at each stage. It does not give lesson plans, a fixed list of topics or a textbook. It sets the target, and you and your colleagues decide how to reach it.","ar":"At PEPS, Years 7 to 9 follow Cambridge Lower Secondary English as a Second Language 0876. In Cambridge language, Year 7 is Stage 7, Year 8 is Stage 8 and Year 9 is Stage 9. The official description of the programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It says what learners should be able to do in English at each stage. It does not give lesson plans, a fixed list of topics or a textbook. It sets the target, and you and your colleagues decide how to reach it."}},{"t":"p","c":{"en":"Many teachers meet the framework only through a coursebook or a scheme of work. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why do we teach second conditionals in Year 8 and not in Year 7? Where does the skill of spotting bias first appear? What should a Year 8 pupil already be able to do in speaking? This module builds the foundation for the rest of the CPD.","ar":"Many teachers meet the framework only through a coursebook or a scheme of work. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why do we teach second conditionals in Year 8 and not in Year 7? Where does the skill of spotting bias first appear? What should a Year 8 pupil already be able to do in speaking? This module builds the foundation for the rest of the CPD."}},{"t":"h","c":{"en":"What the framework says about its purpose","ar":"What the framework says about its purpose"}},{"t":"p","c":{"en":"The framework says that Cambridge Lower Secondary English as a Second Language \u003cstrong>empowers learners to communicate confidently and effectively\u003c/strong> and to develop the critical skills needed to respond to a range of information, media and texts. It also says that the programme promotes active learning, develops thinking skills and encourages intellectual engagement. The goal is a solid foundation for further study of English as a Second Language, and for study through the medium of English.","ar":"The framework says that Cambridge Lower Secondary English as a Second Language \u003cstrong>empowers learners to communicate confidently and effectively\u003c/strong> and to develop the critical skills needed to respond to a range of information, media and texts. It also says that the programme promotes active learning, develops thinking skills and encourages intellectual engagement. The goal is a solid foundation for further study of English as a Second Language, and for study through the medium of English."}},{"t":"p","c":{"en":"The framework lists several key benefits. In plain English, the main ones are:","ar":"The framework lists several key benefits. In plain English, the main ones are:"}},{"t":"list","c":{"en":["\u003cstrong>Clear progression.\u003c/strong> The structure supports effective teaching of English within and across the lower secondary stages, with clear progression of reading, writing, speaking and listening skills.","\u003cstrong>An integrated approach.\u003c/strong> The curriculum supports planning and teaching that develops communication skills together. Learners revisit language at deeper levels and in different contexts.","\u003cstrong>The CEFR.\u003c/strong> The learning objectives are based on the Common European Framework of Reference for Languages, an international standard for describing language ability. You will study this in Module 2.","\u003cstrong>Can-do statements.\u003c/strong> Objectives say what learners should be able to do in English, which encourages learning-centred, activity-based teaching.","\u003cstrong>A foundation for the future.\u003c/strong> The programme prepares learners for further ESL study and for studying other subjects in English."],"ar":["\u003cstrong>Clear progression.\u003c/strong> The structure supports effective teaching of English within and across the lower secondary stages, with clear progression of reading, writing, speaking and listening skills.","\u003cstrong>An integrated approach.\u003c/strong> The curriculum supports planning and teaching that develops communication skills together. Learners revisit language at deeper levels and in different contexts.","\u003cstrong>The CEFR.\u003c/strong> The learning objectives are based on the Common European Framework of Reference for Languages, an international standard for describing language ability. You will study this in Module 2.","\u003cstrong>Can-do statements.\u003c/strong> Objectives say what learners should be able to do in English, which encourages learning-centred, activity-based teaching.","\u003cstrong>A foundation for the future.\u003c/strong> The programme prepares learners for further ESL study and for studying other subjects in English."]}},{"t":"callout","k":"tip","title":{"en":"Why this matters at PEPS","ar":"Why this matters at PEPS"},"c":{"en":"Every PEPS pupil is learning English as a second language, and from Year 7 pupils also study mathematics and science in English. The framework's aim of \"study through the medium of English\" is therefore not distant. It describes what your colleagues in other subjects need from your lessons. Good practice: ask subject teachers which language skills (for example, explaining a reason in writing) cause their pupils the most difficulty, and link your plans to them.","ar":"Every PEPS pupil is learning English as a second language, and from Year 7 pupils also study mathematics and science in English. The framework's aim of \"study through the medium of English\" is therefore not distant. It describes what your colleagues in other subjects need from your lessons. Good practice: ask subject teachers which language skills (for example, explaining a reason in writing) cause their pupils the most difficulty, and link your plans to them."}},{"t":"h","c":{"en":"English or English as a Second Language?","ar":"English or English as a Second Language?"}},{"t":"p","c":{"en":"The Cambridge Lower Secondary programme includes two English curricula: English and English as a Second Language. The framework says you should choose the most appropriate one to reflect the context of your learners, and it includes a comparison table. The main differences are below.","ar":"The Cambridge Lower Secondary programme includes two English curricula: English and English as a Second Language. The framework says you should choose the most appropriate one to reflect the context of your learners, and it includes a comparison table. The main differences are below."}},{"t":"table","head":{"en":["Question","Cambridge Lower Secondary English","Cambridge Lower Secondary ESL"],"ar":["Question","Cambridge Lower Secondary English","Cambridge Lower Secondary ESL"]},"rows":[{"en":["Who is it designed for?","Learners who speak English as a first language, at home or through significant experience such as an English-speaking primary school","Learners who speak a language other than English at home"],"ar":["Who is it designed for?","Learners who speak English as a first language, at home or through significant experience such as an English-speaking primary school","Learners who speak a language other than English at home"]},{"en":["Expected earlier study","First language English at primary school","English as a Second Language at primary school"],"ar":["Expected earlier study","First language English at primary school","English as a Second Language at primary school"]},{"en":["What does it develop?","Skilled communicators, readers who appreciate a wide range of texts, skills in evaluating and analysing language, a base for English Language, Literature and Drama","Effective use of English for practical communication, confidence in reading a range of texts, awareness of language and language-learning skills, a base for further ESL study and study through English"],"ar":["What does it develop?","Skilled communicators, readers who appreciate a wide range of texts, skills in evaluating and analysing language, a base for English Language, Literature and Drama","Effective use of English for practical communication, confidence in reading a range of texts, awareness of language and language-learning skills, a base for further ESL study and study through English"]},{"en":["How are objectives organised?","Three strands: Reading, Writing, Speaking and Listening. Grammar is embedded in Reading and Writing","Five strands: Reading, Writing, Speaking, Listening and Use of English"],"ar":["How are objectives organised?","Three strands: Reading, Writing, Speaking and Listening. Grammar is embedded in Reading and Writing","Five strands: Reading, Writing, Speaking, Listening and Use of English"]},{"en":["What do Checkpoint and Progression Tests assess?","Paper 1 Reading and Writing (non-fiction); Paper 2 Reading and Writing (fiction)","Paper 1 Reading and Usage; Paper 2 Writing; Paper 3 Listening"],"ar":["What do Checkpoint and Progression Tests assess?","Paper 1 Reading and Writing (non-fiction); Paper 2 Reading and Writing (fiction)","Paper 1 Reading and Usage; Paper 2 Writing; Paper 3 Listening"]}]},{"t":"p","c":{"en":"Two points are worth noticing. First, ESL has a separate \u003cstrong>Use of English\u003c/strong> strand, so grammar and vocabulary are planned as objectives in their own right, not only inside reading and writing. Second, the framework lists three papers for ESL assessment, and Speaking is not one of them. It does not explain why. This does not make Speaking less important in the curriculum: it still has its own strand and objectives. For details of the tests, use the Cambridge support site.","ar":"Two points are worth noticing. First, ESL has a separate \u003cstrong>Use of English\u003c/strong> strand, so grammar and vocabulary are planned as objectives in their own right, not only inside reading and writing. Second, the framework lists three papers for ESL assessment, and Speaking is not one of them. It does not explain why. This does not make Speaking less important in the curriculum: it still has its own strand and objectives. For details of the tests, use the Cambridge support site."}},{"t":"h","c":{"en":"The Cambridge Pathway and ages","ar":"The Cambridge Pathway and ages"}},{"t":"p","c":{"en":"The framework explains that the lower secondary programme is part of the Cambridge Pathway, which leads \"seamlessly\" from primary to secondary and pre-university years. Each step builds on the learners' development from the previous one or from other educational systems. The framework is typically for learners aged 11 to 14, but it may be appropriate to use it for slightly different ages to suit your context.","ar":"The framework explains that the lower secondary programme is part of the Cambridge Pathway, which leads \"seamlessly\" from primary to secondary and pre-university years. Each step builds on the learners' development from the previous one or from other educational systems. The framework is typically for learners aged 11 to 14, but it may be appropriate to use it for slightly different ages to suit your context."}},{"t":"table","head":{"en":["Where learners are","Cambridge link","What it means for you"],"ar":["Where learners are","Cambridge link","What it means for you"]},"rows":[{"en":["Years 1 to 6","Cambridge Primary English as a Second Language, Stages 1 to 6","The framework expects learners to have studied ESL at primary school. Know what pupils have already met"],"ar":["Years 1 to 6","Cambridge Primary English as a Second Language, Stages 1 to 6","The framework expects learners to have studied ESL at primary school. Know what pupils have already met"]},{"en":["Years 7 to 9","Cambridge Lower Secondary ESL 0876, Stages 7 to 9","The objectives in this CPD. Each stage has its own unique objectives"],"ar":["Years 7 to 9","Cambridge Lower Secondary ESL 0876, Stages 7 to 9","The objectives in this CPD. Each stage has its own unique objectives"]},{"en":["Year 9","The last lower secondary stage (Stage 9)","PEPS Year 9 pupils sit the Cambridge Lower Secondary Checkpoint; see Module 9"],"ar":["Year 9","The last lower secondary stage (Stage 9)","PEPS Year 9 pupils sit the Cambridge Lower Secondary Checkpoint; see Module 9"]},{"en":["Years 10 and 11","Cambridge IGCSE or O Level","The framework says the programme is a foundation for study through English at this level and beyond"],"ar":["Years 10 and 11","Cambridge IGCSE or O Level","The framework says the programme is a foundation for study through English at this level and beyond"]}]},{"t":"p","c":{"en":"In this table the stage names come from the framework. The links to PEPS year groups come from how our school is organised. Always check the current Cambridge documents for details of other programmes.","ar":"In this table the stage names come from the framework. The links to PEPS year groups come from how our school is organised. Always check the current Cambridge documents for details of other programmes."}},{"t":"h","c":{"en":"Teaching time: what the framework says","ar":"Teaching time: what the framework says"}},{"t":"callout","k":"key","title":{"en":"Teaching time, exactly as the framework gives it","ar":"Teaching time, exactly as the framework gives it"},"c":{"en":"\"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cstrong>for guidance\u003c/strong> and \u003cstrong>may vary\u003c/strong>. It is a planning guide, not a rule. Your timetable comes from the school.","ar":"\"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cstrong>for guidance\u003c/strong> and \u003cstrong>may vary\u003c/strong>. It is a planning guide, not a rule. Your timetable comes from the school."}},{"t":"h","c":{"en":"Supporting resources","ar":"Supporting resources"}},{"t":"p","c":{"en":"The framework says that most Cambridge resources are on the \u003cstrong>Cambridge Lower Secondary support site\u003c/strong>. If you do not have a log-in, the framework says to ask the Cambridge coordinator or exams officer in your school. The resources are grouped as follows.","ar":"The framework says that most Cambridge resources are on the \u003cstrong>Cambridge Lower Secondary support site\u003c/strong>. If you do not have a log-in, the framework says to ask the Cambridge coordinator or exams officer in your school. The resources are grouped as follows."}},{"t":"table","head":{"en":["Group","What the framework lists","How you might use it"],"ar":["Group","What the framework lists","How you might use it"]},"rows":[{"en":["Teaching resources","Curriculum framework, teacher guide, schemes of work","Framework for the objectives; teacher guide for teaching approaches; schemes of work for ideas and sample plans"],"ar":["Teaching resources","Curriculum framework, teacher guide, schemes of work","Framework for the objectives; teacher guide for teaching approaches; schemes of work for ideas and sample plans"]},{"en":["Cambridge Lower Secondary assessments","Progression Tests, Checkpoint, CEM Baseline Tests","Check the support site for what each covers and which stages it is for"],"ar":["Cambridge Lower Secondary assessments","Progression Tests, Checkpoint, CEM Baseline Tests","Check the support site for what each covers and which stages it is for"]},{"en":["Training","Face-to-face workshops, online training, Cambridge Professional Development Qualifications","Ask your HOD about professional development"],"ar":["Training","Face-to-face workshops, online training, Cambridge Professional Development Qualifications","Ask your HOD about professional development"]},{"en":["Community","Social media channels and community forums","Share ideas with other teachers"],"ar":["Community","Social media channels and community forums","Share ideas with other teachers"]}]},{"t":"p","c":{"en":"On assessment, the framework says only that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 7 to 9\". For test content, timing and reporting, you must look on the support site.","ar":"On assessment, the framework says only that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 7 to 9\". For test content, timing and reporting, you must look on the support site."}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework is clear: \"You do not need to use the ideas in the schemes of work.\" They show the types of activities, and the intended depth and breadth of each objective. They are not designed to fill all the teaching time, so you should add other activities of a similar level of difficulty, for example from endorsed resources. If a resource is endorsed, you can be confident that all the learning objectives are covered. There is no requirement for endorsed textbooks to follow the order in the schemes of work.","ar":"The framework is clear: \"You do not need to use the ideas in the schemes of work.\" They show the types of activities, and the intended depth and breadth of each objective. They are not designed to fill all the teaching time, so you should add other activities of a similar level of difficulty, for example from endorsed resources. If a resource is endorsed, you can be confident that all the learning objectives are covered. There is no requirement for endorsed textbooks to follow the order in the schemes of work."}},{"t":"h","c":{"en":"Version and changes","ar":"Version and changes"}},{"t":"p","c":{"en":"The cover says the framework was published in September 2020 for first teaching in September 2021, that Progression Tests would be available from 2022 and that Checkpoint tests would be available from 2023. The latest version is \u003cstrong>version 2.0, published August 2021\u003c/strong>. The \"Changes\" section says the framework was amended to make it digitally accessible, for example with larger font size and spacing and alternative text for images and tables. It adds that there may be other minor changes that do not affect teaching and learning. In other words, version 2.0 did not change what is taught.","ar":"The cover says the framework was published in September 2020 for first teaching in September 2021, that Progression Tests would be available from 2022 and that Checkpoint tests would be available from 2023. The latest version is \u003cstrong>version 2.0, published August 2021\u003c/strong>. The \"Changes\" section says the framework was amended to make it digitally accessible, for example with larger font size and spacing and alternative text for images and tables. It adds that there may be other minor changes that do not affect teaching and learning. In other words, version 2.0 did not change what is taught."}},{"t":"scenario","title":{"en":"Scenario: the new colleague","ar":"Scenario: the new colleague"},"c":{"en":"A new Year 8 teacher joins PEPS in the middle of the year. He asks: \"Do I have to follow the scheme of work in the order it is written, and how many hours of English should my class have?\" Using the framework, you can tell him three things. First, the scheme of work is optional, so he should work from the learning objectives and the school's medium-term plan. Second, the framework suggests 4 to 5 hours per week as guidance, which may vary by context, so he should check the school timetable. Third, he can ask the Cambridge coordinator or exams officer for a support site log-in to see the teacher guide and schemes of work.","ar":"A new Year 8 teacher joins PEPS in the middle of the year. He asks: \"Do I have to follow the scheme of work in the order it is written, and how many hours of English should my class have?\" Using the framework, you can tell him three things. First, the scheme of work is optional, so he should work from the learning objectives and the school's medium-term plan. Second, the framework suggests 4 to 5 hours per week as guidance, which may vary by context, so he should check the school timetable. Third, he can ask the Cambridge coordinator or exams officer for a support site log-in to see the teacher guide and schemes of work."}}],"checks":[{"id":"m1q1","q":{"en":"A new teacher asks how many hours of ESL per week the framework expects. What is the best answer?","ar":"A new teacher asks how many hours of ESL per week the framework expects. What is the best answer?"},"opts":[{"en":"It is based on 4 to 5 hours a week, about 120 to 150 hours a stage, as guidance that can vary","ar":"It is based on 4 to 5 hours a week, about 120 to 150 hours a stage, as guidance that can vary"},{"en":"It requires exactly 5 hours a week in every stage, and schools must not change this number","ar":"It requires exactly 5 hours a week in every stage, and schools must not change this number"},{"en":"It requires 3 hours a week in Stage 7 and 5 hours a week in Stages 8 and 9","ar":"It requires 3 hours a week in Stage 7 and 5 hours a week in Stages 8 and 9"},{"en":"It gives no teaching-time guidance, so each school decides without any reference to Cambridge","ar":"It gives no teaching-time guidance, so each school decides without any reference to Cambridge"}],"correct":0,"expl":{"en":"The framework says it is based on learners having 4 to 5 hours per week (about 120 to 150 hours per stage), and that actual hours may vary according to context.","ar":"The framework says it is based on learners having 4 to 5 hours per week (about 120 to 150 hours per stage), and that actual hours may vary according to context."}},{"id":"m1q2","q":{"en":"Which statement about Use of English is correct, based on the comparison of the two English curricula?","ar":"Which statement about Use of English is correct, based on the comparison of the two English curricula?"},"opts":[{"en":"English has five strands including Use of English, while ESL has three strands","ar":"English has five strands including Use of English, while ESL has three strands"},{"en":"ESL has Use of English as its own strand, while English embeds grammar in Reading and Writing","ar":"ESL has Use of English as its own strand, while English embeds grammar in Reading and Writing"},{"en":"Use of English is a strand in both curricula, with the same objectives in each","ar":"Use of English is a strand in both curricula, with the same objectives in each"},{"en":"Use of English is assessed in ESL only through a separate Paper 4 for every stage, which is why the strand has its own paper","ar":"Use of English is assessed in ESL only through a separate Paper 4 for every stage, which is why the strand has its own paper"}],"correct":1,"expl":{"en":"The framework says ESL objectives are organised into five strands, including Use of English, while English has three strands with grammar embedded in Reading and Writing.","ar":"The framework says ESL objectives are organised into five strands, including Use of English, while English has three strands with grammar embedded in Reading and Writing."}},{"id":"m1q3","q":{"en":"A colleague says: \"Version 2.0 of the framework changed the content we teach in Stage 8.\" What does the Changes section say?","ar":"A colleague says: \"Version 2.0 of the framework changed the content we teach in Stage 8.\" What does the Changes section say?"},"opts":[{"en":"The changes added a new strand called Digital English to Stages 7 to 9 and a new set of aims for every learner in all Cambridge schools","ar":"The changes added a new strand called Digital English to Stages 7 to 9 and a new set of aims for every learner in all Cambridge schools"},{"en":"The changes moved second conditionals from Stage 8 into Stage 7 for all learners","ar":"The changes moved second conditionals from Stage 8 into Stage 7 for all learners"},{"en":"The changes made it digitally accessible, for example larger font and alternative text, with no change to teaching","ar":"The changes made it digitally accessible, for example larger font and alternative text, with no change to teaching"},{"en":"The changes removed the glossary and the learning objective codes from the framework","ar":"The changes removed the glossary and the learning objective codes from the framework"}],"correct":2,"expl":{"en":"The Changes section describes accessibility changes (font size, spacing, alternative text) and says any other minor changes do not affect teaching and learning.","ar":"The Changes section describes accessibility changes (font size, spacing, alternative text) and says any other minor changes do not affect teaching and learning."}}]},{"id":"m2","title":{"en":"The CEFR and the Can-Do Approach","ar":"The CEFR and the Can-Do Approach"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Language teachers often hear the letters A1, A2, B1 and B2. They come from the CEFR, the Common European Framework of Reference for Languages. This module explains what the CEFR is, what the Cambridge framework says about how it uses the CEFR, and what the \"can-do\" approach means for planning lessons. It also shows how to talk about CEFR levels carefully, because a careless sentence such as \"Year 8 is B1\" can mislead parents and colleagues.","ar":"Language teachers often hear the letters A1, A2, B1 and B2. They come from the CEFR, the Common European Framework of Reference for Languages. This module explains what the CEFR is, what the Cambridge framework says about how it uses the CEFR, and what the \"can-do\" approach means for planning lessons. It also shows how to talk about CEFR levels carefully, because a careless sentence such as \"Year 8 is B1\" can mislead parents and colleagues."}},{"t":"h","c":{"en":"What is the CEFR?","ar":"What is the CEFR?"}},{"t":"p","c":{"en":"The framework describes the CEFR as a Council of Europe framework \"used widely both within and beyond Europe to map learners' progression in English\". It says the CEFR is an international standard, widely recognised for describing language ability. The framework adds that aligning to the CEFR makes it easy for schools and parents to understand the level of the programme.","ar":"The framework describes the CEFR as a Council of Europe framework \"used widely both within and beyond Europe to map learners' progression in English\". It says the CEFR is an international standard, widely recognised for describing language ability. The framework adds that aligning to the CEFR makes it easy for schools and parents to understand the level of the programme."}},{"t":"p","c":{"en":"The CEFR describes language ability on a six-point scale, from A1 for beginners up to C2 for those who have mastered a language. The framework shows the six levels in three pairs.","ar":"The CEFR describes language ability on a six-point scale, from A1 for beginners up to C2 for those who have mastered a language. The framework shows the six levels in three pairs."}},{"t":"table","head":{"en":["Pair of levels","Name used in the framework","Meaning of the ends of the scale"],"ar":["Pair of levels","Name used in the framework","Meaning of the ends of the scale"]},"rows":[{"en":["A1 and A2","Basic user","A1 is for beginners"],"ar":["A1 and A2","Basic user","A1 is for beginners"]},{"en":["B1 and B2","Independent user","The middle of the scale"],"ar":["B1 and B2","Independent user","The middle of the scale"]},{"en":["C1 and C2","Proficient user","C2 is for those who have mastered a language"],"ar":["C1 and C2","Proficient user","C2 is for those who have mastered a language"]}]},{"t":"h","c":{"en":"How the Cambridge framework uses the CEFR","ar":"How the Cambridge framework uses the CEFR"}},{"t":"p","c":{"en":"The framework makes four statements that are important for teachers.","ar":"The framework makes four statements that are important for teachers."}},{"t":"steps","c":{"en":["\u003cstrong>The objectives are based on the CEFR.\u003c/strong> The learning objectives for learners of ESL are \"based on\" the CEFR. They are not a copy of it. They are Cambridge's own objectives, informed by it.","\u003cstrong>Progression is mapped in each strand.\u003c/strong> The framework says learner progression in each strand is mapped in terms of the CEFR common reference levels. So the picture is not one level for the whole pupil; it is a picture for Reading, Writing, Listening, Speaking and Use of English.","\u003cstrong>Young Learner descriptors are used.\u003c/strong> Cambridge identified aspects of the curriculum that are reflected in the CEFR descriptors, and specifically the Young Learner descriptors collated for ages 7 to 10 and 11 to 15.","\u003cstrong>Outcomes are defined as \"can-do\" statements.\u003c/strong> Learning outcomes in each strand for each successive stage are defined in terms of what learners should be able to do in English. The framework says this progressive sequence of can-do statements encourages learning-centred, activity-based approaches."],"ar":["\u003cstrong>The objectives are based on the CEFR.\u003c/strong> The learning objectives for learners of ESL are \"based on\" the CEFR. They are not a copy of it. They are Cambridge's own objectives, informed by it.","\u003cstrong>Progression is mapped in each strand.\u003c/strong> The framework says learner progression in each strand is mapped in terms of the CEFR common reference levels. So the picture is not one level for the whole pupil; it is a picture for Reading, Writing, Listening, Speaking and Use of English.","\u003cstrong>Young Learner descriptors are used.\u003c/strong> Cambridge identified aspects of the curriculum that are reflected in the CEFR descriptors, and specifically the Young Learner descriptors collated for ages 7 to 10 and 11 to 15.","\u003cstrong>Outcomes are defined as \"can-do\" statements.\u003c/strong> Learning outcomes in each strand for each successive stage are defined in terms of what learners should be able to do in English. The framework says this progressive sequence of can-do statements encourages learning-centred, activity-based approaches."]}},{"t":"h","c":{"en":"Reading the alignment diagram","ar":"Reading the alignment diagram"}},{"t":"p","c":{"en":"The framework includes a diagram that illustrates the alignment of Cambridge Primary and Lower Secondary ESL to the CEFR. Because a diagram is easy to over-read, here is what it actually shows.","ar":"The framework includes a diagram that illustrates the alignment of Cambridge Primary and Lower Secondary ESL to the CEFR. Because a diagram is easy to over-read, here is what it actually shows."}},{"t":"list","c":{"en":["Stages 1 to 6 (Cambridge Primary ESL) and Stages 7 to 9 (Cambridge Lower Secondary ESL) are drawn as rows, with Cambridge IGCSE above them and the heading \"Further study through English\" at the top.","Four arrows, labelled A1, A2, B1 and B2, rise from the bottom. The A1 arrow is at the bottom of the primary stages. The A2 arrow reaches higher, in the upper primary stages. The B1 arrow reaches up into the lower secondary stages. The B2 arrow is level with Cambridge IGCSE.","The arrows are drawn at different heights and they overlap the stages. The diagram does not draw a neat box with one level for each stage, and the text does not say, for example, \"Stage 8 equals B1\"."],"ar":["Stages 1 to 6 (Cambridge Primary ESL) and Stages 7 to 9 (Cambridge Lower Secondary ESL) are drawn as rows, with Cambridge IGCSE above them and the heading \"Further study through English\" at the top.","Four arrows, labelled A1, A2, B1 and B2, rise from the bottom. The A1 arrow is at the bottom of the primary stages. The A2 arrow reaches higher, in the upper primary stages. The B1 arrow reaches up into the lower secondary stages. The B2 arrow is level with Cambridge IGCSE.","The arrows are drawn at different heights and they overlap the stages. The diagram does not draw a neat box with one level for each stage, and the text does not say, for example, \"Stage 8 equals B1\"."]}},{"t":"callout","k":"warn","title":{"en":"Avoid fixed \"Year = level\" claims","ar":"Avoid fixed \"Year = level\" claims"},"c":{"en":"Do not tell parents or colleagues that \"Year 7 is A2\" or \"Year 9 is B1\". The framework does not say this. It says the programme is aligned to the CEFR and that progression in each strand is mapped to the common reference levels, and its diagram shows the levels as arrows that rise across the stages. A safer sentence is: \"The programme is aligned to the CEFR, and the diagram shows the levels rising across the stages towards study at IGCSE.\" Check the diagram and the support site before you quote anything more exact.","ar":"Do not tell parents or colleagues that \"Year 7 is A2\" or \"Year 9 is B1\". The framework does not say this. It says the programme is aligned to the CEFR and that progression in each strand is mapped to the common reference levels, and its diagram shows the levels as arrows that rise across the stages. A safer sentence is: \"The programme is aligned to the CEFR, and the diagram shows the levels rising across the stages towards study at IGCSE.\" Check the diagram and the support site before you quote anything more exact."}},{"t":"table","head":{"en":["Careless statement","Why it is risky","Safer wording"],"ar":["Careless statement","Why it is risky","Safer wording"]},"rows":[{"en":["\"Every Year 8 pupil is B1.\"","The framework maps each strand, and pupils differ. It does not state one level for each stage","\"The Stage 8 objectives sit within a progression that the CEFR helps describe.\""],"ar":["\"Every Year 8 pupil is B1.\"","The framework maps each strand, and pupils differ. It does not state one level for each stage","\"The Stage 8 objectives sit within a progression that the CEFR helps describe.\""]},{"en":["\"Passing Stage 9 means B2.\"","The framework does not say that completing a stage gives a CEFR level","\"The programme prepares learners for study through English at IGCSE.\""],"ar":["\"Passing Stage 9 means B2.\"","The framework does not say that completing a stage gives a CEFR level","\"The programme prepares learners for study through English at IGCSE.\""]},{"en":["\"The CEFR is the curriculum.\"","The objectives are Cambridge's own, based on and informed by the CEFR","\"The curriculum framework is based on the CEFR.\""],"ar":["\"The CEFR is the curriculum.\"","The objectives are Cambridge's own, based on and informed by the CEFR","\"The curriculum framework is based on the CEFR.\""]}]},{"t":"h","c":{"en":"From grammar topics to can-do objectives","ar":"From grammar topics to can-do objectives"}},{"t":"p","c":{"en":"A traditional plan often starts from a grammar topic: \"Today we teach the past continuous.\" The Cambridge objectives start from what learners can do. Look at 7Sc.01: learners describe people, places and objects, and past and present actions and events, real and imagined. This is a communication goal. The grammar needed to reach it is a separate objective, such as 7Ug.05 (past continuous forms). A good plan joins the two.","ar":"A traditional plan often starts from a grammar topic: \"Today we teach the past continuous.\" The Cambridge objectives start from what learners can do. Look at 7Sc.01: learners describe people, places and objects, and past and present actions and events, real and imagined. This is a communication goal. The grammar needed to reach it is a separate objective, such as 7Ug.05 (past continuous forms). A good plan joins the two."}},{"t":"table","head":{"en":["Grammar-topic starting point","Can-do starting point (good practice wording)","Framework objectives that support it"],"ar":["Grammar-topic starting point","Can-do starting point (good practice wording)","Framework objectives that support it"]},"rows":[{"en":["Past simple and past continuous","\"I can describe what was happening when something unexpected occurred.\"","7Sc.01 (describe past events), 7Ug.03 and 7Ug.05 (past simple and past continuous forms)"],"ar":["Past simple and past continuous","\"I can describe what was happening when something unexpected occurred.\"","7Sc.01 (describe past events), 7Ug.03 and 7Ug.05 (past simple and past continuous forms)"]},{"en":["Reported speech","\"I can report what a classmate told me in an interview.\"","7Sor.02 (summarise what others say), 7Ug.10 (reported speech forms)"],"ar":["Reported speech","\"I can report what a classmate told me in an interview.\"","7Sor.02 (summarise what others say), 7Ug.10 (reported speech forms)"]},{"en":["Modal verbs","\"I can give advice and say what is not allowed.\"","7Ug.11 (modal forms: obligation, permission, suggestions, prohibition)"],"ar":["Modal verbs","\"I can give advice and say what is not allowed.\"","7Ug.11 (modal forms: obligation, permission, suggestions, prohibition)"]},{"en":["Connectives","\"I can explain why something happened and link my ideas clearly.\"","7Us.03 (connectives for reasons and explanations), 7Wor.02 (link sentences into extended text)"],"ar":["Connectives","\"I can explain why something happened and link my ideas clearly.\"","7Us.03 (connectives for reasons and explanations), 7Wor.02 (link sentences into extended text)"]}]},{"t":"p","c":{"en":"The can-do wording in the middle column is good practice, written for this CPD. It is not Cambridge text. The codes in the right column are real, and you can check them in the framework.","ar":"The can-do wording in the middle column is good practice, written for this CPD. It is not Cambridge text. The codes in the right column are real, and you can check them in the framework."}},{"t":"callout","k":"tip","title":{"en":"A useful habit","ar":"A useful habit"},"c":{"en":"Write the lesson aim as \"By the end of the lesson I can ...\" and add one grammar or vocabulary focus underneath. Pupils see the purpose first and the language tool second. For ESL learners this is motivating, because the lesson is about doing something in English.","ar":"Write the lesson aim as \"By the end of the lesson I can ...\" and add one grammar or vocabulary focus underneath. Pupils see the purpose first and the language tool second. For ESL learners this is motivating, because the lesson is about doing something in English."}},{"t":"h","c":{"en":"Why \"support\" appears so often in the objectives","ar":"Why \"support\" appears so often in the objectives"}},{"t":"p","c":{"en":"Many objectives include phrases such as \"with support\", \"with little or no support\" or no support phrase at all. These phrases are part of how the framework shows progression. For example, 7Wca.02 asks learners to generate ideas, plan, write, edit and proofread extended texts \"with support\". At Stage 8 the same skill is \"with little or no support\" (8Wca.02), and at Stage 9 it is \"independently\" (9Wca.02). You will see this pattern in every module from now on. It is a can-do ladder: the task stays similar, and the amount of help the learner needs goes down.","ar":"Many objectives include phrases such as \"with support\", \"with little or no support\" or no support phrase at all. These phrases are part of how the framework shows progression. For example, 7Wca.02 asks learners to generate ideas, plan, write, edit and proofread extended texts \"with support\". At Stage 8 the same skill is \"with little or no support\" (8Wca.02), and at Stage 9 it is \"independently\" (9Wca.02). You will see this pattern in every module from now on. It is a can-do ladder: the task stays similar, and the amount of help the learner needs goes down."}},{"t":"scenario","title":{"en":"Scenario: the parent meeting","ar":"Scenario: the parent meeting"},"c":{"en":"At a parents' evening, the father of a Year 8 pupil asks: \"Which CEFR level is my son now, and when will he reach B2?\" A good response uses the framework carefully. You can say that the programme is aligned to the CEFR, that the objectives are written as can-do statements, and that progress is described for each of the five strands. Then you can show him two or three objectives from his son's stage, such as 8Sc.01 and 8Wc.02, and explain what his son can already do and what he is working on. You do not name an exact level for the whole pupil, because the framework does not do this. If the father needs a formal level, you can say that you will check the Cambridge support site and the school's assessment information.","ar":"At a parents' evening, the father of a Year 8 pupil asks: \"Which CEFR level is my son now, and when will he reach B2?\" A good response uses the framework carefully. You can say that the programme is aligned to the CEFR, that the objectives are written as can-do statements, and that progress is described for each of the five strands. Then you can show him two or three objectives from his son's stage, such as 8Sc.01 and 8Wc.02, and explain what his son can already do and what he is working on. You do not name an exact level for the whole pupil, because the framework does not do this. If the father needs a formal level, you can say that you will check the Cambridge support site and the school's assessment information."}},{"t":"scenario","title":{"en":"Scenario: rewriting an aim","ar":"Scenario: rewriting an aim"},"c":{"en":"A Year 7 teacher writes the lesson aim: \"To learn the present perfect.\" Her HOD asks her to make it a can-do aim. She looks at 7Ug.06, which covers present perfect forms for recent, indefinite and unfinished past, and at 7Sc.02, which asks learners to ask questions to find out detailed information. She rewrites the aim: \"I can ask and answer questions about experiences, such as 'Have you ever ...?', using the present perfect.\" The grammar is still taught, but pupils now see the communicative reason for it.","ar":"A Year 7 teacher writes the lesson aim: \"To learn the present perfect.\" Her HOD asks her to make it a can-do aim. She looks at 7Ug.06, which covers present perfect forms for recent, indefinite and unfinished past, and at 7Sc.02, which asks learners to ask questions to find out detailed information. She rewrites the aim: \"I can ask and answer questions about experiences, such as 'Have you ever ...?', using the present perfect.\" The grammar is still taught, but pupils now see the communicative reason for it."}}],"checks":[{"id":"m2q1","q":{"en":"How does the framework describe the relationship between its objectives and the CEFR?","ar":"How does the framework describe the relationship between its objectives and the CEFR?"},"opts":[{"en":"The objectives are a copy of the CEFR descriptors, with one level fixed for each Year group in every Cambridge school","ar":"The objectives are a copy of the CEFR descriptors, with one level fixed for each Year group in every Cambridge school"},{"en":"The objectives are separate from the CEFR, which is used only for the IGCSE examination","ar":"The objectives are separate from the CEFR, which is used only for the IGCSE examination"},{"en":"The objectives follow the CEFR for Reading only, while other strands use a different scale, which is set by each school","ar":"The objectives follow the CEFR for Reading only, while other strands use a different scale, which is set by each school"},{"en":"The objectives are based on the CEFR, and progression in each strand is mapped to its reference levels","ar":"The objectives are based on the CEFR, and progression in each strand is mapped to its reference levels"}],"correct":3,"expl":{"en":"The framework says the learning objectives are based on the CEFR and that learner progression in each strand is mapped in terms of the common reference levels.","ar":"The framework says the learning objectives are based on the CEFR and that learner progression in each strand is mapped in terms of the common reference levels."}},{"id":"m2q2","q":{"en":"A parent says: \"My daughter is in Year 9, so she must be B2.\" What is the best response, based on the framework?","ar":"A parent says: \"My daughter is in Year 9, so she must be B2.\" What is the best response, based on the framework?"},"opts":[{"en":"The programme is aligned to the CEFR, but the framework does not say that each stage equals one level","ar":"The programme is aligned to the CEFR, but the framework does not say that each stage equals one level"},{"en":"That is correct, because the framework states that Stage 9 is the same as B2 for every learner","ar":"That is correct, because the framework states that Stage 9 is the same as B2 for every learner"},{"en":"That is wrong, because the CEFR has no connection to Cambridge Lower Secondary ESL at all","ar":"That is wrong, because the CEFR has no connection to Cambridge Lower Secondary ESL at all"},{"en":"That depends on her Maths result, because CEFR levels are given only after the Checkpoint","ar":"That depends on her Maths result, because CEFR levels are given only after the Checkpoint"}],"correct":0,"expl":{"en":"The framework shows the alignment in a diagram of arrows and does not write a single level for each stage. A careful answer avoids a fixed Year = level claim.","ar":"The framework shows the alignment in a diagram of arrows and does not write a single level for each stage. A careful answer avoids a fixed Year = level claim."}},{"id":"m2q3","q":{"en":"Which lesson aim is written in the can-do style that the framework encourages?","ar":"Which lesson aim is written in the can-do style that the framework encourages?"},"opts":[{"en":"The lesson covers the rules and exceptions of the past continuous tense in English","ar":"The lesson covers the rules and exceptions of the past continuous tense in English"},{"en":"By the end of the lesson I can describe a past event and say what was happening at the time","ar":"By the end of the lesson I can describe a past event and say what was happening at the time"},{"en":"Pupils will complete exercises 4 to 7 on page 52 of the coursebook in silence","ar":"Pupils will complete exercises 4 to 7 on page 52 of the coursebook in silence"},{"en":"The teacher will explain the grammar page and then give a vocabulary test","ar":"The teacher will explain the grammar page and then give a vocabulary test"}],"correct":1,"expl":{"en":"Can-do statements say what learners should be able to do in English. The other options describe teacher activity or coursebook tasks rather than learner outcomes.","ar":"Can-do statements say what learners should be able to do in English. The other options describe teacher activity or coursebook tasks rather than learner outcomes."}}]},{"id":"m3","title":{"en":"Aims, Learner Attributes and How the Framework Is Organised","ar":"Aims, Learner Attributes and How the Framework Is Organised"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before looking at objectives, it helps to ask what the programme is for and how the framework is built. This module covers the aims, the five Cambridge learner attributes, the five strands and fifteen sub-strands, and the objective codes. After it you will be able to open the framework at any page and know where you are.","ar":"Before looking at objectives, it helps to ask what the programme is for and how the framework is built. This module covers the aims, the five Cambridge learner attributes, the five strands and fifteen sub-strands, and the objective codes. After it you will be able to open the framework at any page and know where you are."}},{"t":"h","c":{"en":"The aims of the Cambridge Lower Secondary programme","ar":"The aims of the Cambridge Lower Secondary programme"}},{"t":"p","c":{"en":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning. It lists four examples:","ar":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning. It lists four examples:"}},{"t":"list","c":{"en":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as having global awareness."],"ar":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as having global awareness."]}},{"t":"h","c":{"en":"The aims of Cambridge Lower Secondary ESL","ar":"The aims of Cambridge Lower Secondary ESL"}},{"t":"p","c":{"en":"For ESL, the framework says that learners:","ar":"For ESL, the framework says that learners:"}},{"t":"list","c":{"en":["develop a curiosity about other languages and cultures and how these shape our perceptions of the world","see themselves as successful language learners","are able to communicate effectively through the skills of reading, writing, speaking and listening","become confident in and enjoy reading a range of texts","develop a solid foundation in the skills required for continued study of ESL and for study through the medium of English."],"ar":["develop a curiosity about other languages and cultures and how these shape our perceptions of the world","see themselves as successful language learners","are able to communicate effectively through the skills of reading, writing, speaking and listening","become confident in and enjoy reading a range of texts","develop a solid foundation in the skills required for continued study of ESL and for study through the medium of English."]}},{"t":"p","c":{"en":"Look at the second aim: learners \u003cstrong>see themselves as successful language learners\u003c/strong>. This is a statement about identity, not only about skills. A pupil who has always been told that his English has \"mistakes\" may not see himself as successful. Your feedback, your choice of tasks and the way you celebrate what pupils can already do all affect this aim. Notice also the fourth aim: pupils should \u003cem>enjoy\u003c/em> reading. Enjoyment is in the framework, not an extra.","ar":"Look at the second aim: learners \u003cstrong>see themselves as successful language learners\u003c/strong>. This is a statement about identity, not only about skills. A pupil who has always been told that his English has \"mistakes\" may not see himself as successful. Your feedback, your choice of tasks and the way you celebrate what pupils can already do all affect this aim. Notice also the fourth aim: pupils should \u003cem>enjoy\u003c/em> reading. Enjoyment is in the framework, not an extra."}},{"t":"h","c":{"en":"The five Cambridge learner attributes","ar":"The five Cambridge learner attributes"}},{"t":"p","c":{"en":"The framework says the Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. It then describes each one for ESL. The table paraphrases those descriptions and adds a classroom example, which is good practice and not a Cambridge requirement.","ar":"The framework says the Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. It then describes each one for ESL. The table paraphrases those descriptions and adds a classroom example, which is good practice and not a Cambridge requirement."}},{"t":"table","head":{"en":["Attribute","In ESL, the framework says learners ...","Classroom example (good practice)"],"ar":["Attribute","In ESL, the framework says learners ...","Classroom example (good practice)"]},"rows":[{"en":["Responsible","take responsibility for their learning, ask questions and look for opportunities to use their linguistic skills","Pupils keep a list of \"places I used English this week\" outside the classroom"],"ar":["Responsible","take responsibility for their learning, ask questions and look for opportunities to use their linguistic skills","Pupils keep a list of \"places I used English this week\" outside the classroom"]},{"en":["Innovative","explore and experiment with new language, making connections to their own language to build on what they already know","Pupils compare how their first language forms questions with how English does it"],"ar":["Innovative","explore and experiment with new language, making connections to their own language to build on what they already know","Pupils compare how their first language forms questions with how English does it"]},{"en":["Confident","become confident communicators; feel empowered to take risks, try new language and learn from mistakes","A \"brave word\" board where pupils add a new word they tried to use in speech"],"ar":["Confident","become confident communicators; feel empowered to take risks, try new language and learn from mistakes","A \"brave word\" board where pupils add a new word they tried to use in speech"]},{"en":["Engaged","are curious about other languages, cultures and perspectives and discover new areas of interest through English","Pupils read about a festival in another country and share one surprising fact"],"ar":["Engaged","are curious about other languages, cultures and perspectives and discover new areas of interest through English","Pupils read about a festival in another country and share one surprising fact"]},{"en":["Reflective","plan, monitor and evaluate their own learning; reflect on strategies used before to decide how to approach a new task","Before a listening task: \"Which strategy helped you last time?\""],"ar":["Reflective","plan, monitor and evaluate their own learning; reflect on strategies used before to decide how to approach a new task","Before a listening task: \"Which strategy helped you last time?\""]}]},{"t":"p","c":{"en":"Look at \"Innovative\". The framework explicitly values making connections to the learner's own language. At PEPS, where pupils share Arabic and other first languages, this supports the use of home language knowledge as a resource and not a problem.","ar":"Look at \"Innovative\". The framework explicitly values making connections to the learner's own language. At PEPS, where pupils share Arabic and other first languages, this supports the use of home language knowledge as a resource and not a problem."}},{"t":"h","c":{"en":"The five strands","ar":"The five strands"}},{"t":"p","c":{"en":"The framework divides the learning objectives into five main areas called \u003cstrong>strands\u003c/strong>. They run through every lower secondary stage: Reading, Writing, Use of English, Listening and Speaking. The framework says the five strands work together. The Use of English strand provides the linguistic features learners need to engage with language \u003cstrong>receptively\u003c/strong> (Reading and Listening) and \u003cstrong>productively\u003c/strong> (Writing and Speaking).","ar":"The framework divides the learning objectives into five main areas called \u003cstrong>strands\u003c/strong>. They run through every lower secondary stage: Reading, Writing, Use of English, Listening and Speaking. The framework says the five strands work together. The Use of English strand provides the linguistic features learners need to engage with language \u003cstrong>receptively\u003c/strong> (Reading and Listening) and \u003cstrong>productively\u003c/strong> (Writing and Speaking)."}},{"t":"p","c":{"en":"Each strand is divided into \u003cstrong>sub-strands\u003c/strong>. The sub-strand names for Reading and Listening are similar on purpose, so that you can see links between them. The framework says the Writing and Speaking strands have two similar sub-strands and one distinct sub-strand.","ar":"Each strand is divided into \u003cstrong>sub-strands\u003c/strong>. The sub-strand names for Reading and Listening are similar on purpose, so that you can see links between them. The framework says the Writing and Speaking strands have two similar sub-strands and one distinct sub-strand."}},{"t":"table","head":{"en":["Strand","Sub-strands","Reporting code"],"ar":["Strand","Sub-strands","Reporting code"]},"rows":[{"en":["Reading","Reading for global meaning; Reading for detail; Reading for opinion","Rm; Rd; Ro"],"ar":["Reading","Reading for global meaning; Reading for detail; Reading for opinion","Rm; Rd; Ro"]},{"en":["Listening","Listening for global meaning; Listening for detail; Listening for opinion","Lm; Ld; Lo"],"ar":["Listening","Listening for global meaning; Listening for detail; Listening for opinion","Lm; Ld; Lo"]},{"en":["Writing","Communicative achievement; Organisation; Content","Wca; Wor; Wc"],"ar":["Writing","Communicative achievement; Organisation; Content","Wca; Wor; Wc"]},{"en":["Speaking","Communication; Express opinion; Organisation","Sc; So; Sor"],"ar":["Speaking","Communication; Express opinion; Organisation","Sc; So; Sor"]},{"en":["Use of English","Grammatical forms; Vocabulary; Sentence structure","Ug; Uv; Us"],"ar":["Use of English","Grammatical forms; Vocabulary; Sentence structure","Ug; Uv; Us"]}]},{"t":"h","c":{"en":"How to read an objective code","ar":"How to read an objective code"}},{"t":"p","c":{"en":"Each learning objective has a unique code. The framework gives the example \u003cstrong>7Rd.01\u003c/strong>. A code has three parts:","ar":"Each learning objective has a unique code. The framework gives the example \u003cstrong>7Rd.01\u003c/strong>. A code has three parts:"}},{"t":"steps","c":{"en":["\u003cstrong>The stage number.\u003c/strong> In 7Rd.01 the first character, 7, is the stage.","\u003cstrong>The reporting code.\u003c/strong> This appears in the feedback reports for tests and reflects the sub-strand title. Rd means Reading for detail.","\u003cstrong>The order number.\u003c/strong> The number after the full stop shows the order of the objective in that sub-strand for that stage. 01 is the first objective."],"ar":["\u003cstrong>The stage number.\u003c/strong> In 7Rd.01 the first character, 7, is the stage.","\u003cstrong>The reporting code.\u003c/strong> This appears in the feedback reports for tests and reflects the sub-strand title. Rd means Reading for detail.","\u003cstrong>The order number.\u003c/strong> The number after the full stop shows the order of the objective in that sub-strand for that stage. 01 is the first objective."]}},{"t":"p","c":{"en":"The framework says these codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Practise on these examples.","ar":"The framework says these codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Practise on these examples."}},{"t":"table","head":{"en":["Code","Stage","Sub-strand","Objective in brief"],"ar":["Code","Stage","Sub-strand","Objective in brief"]},"rows":[{"en":["7Rd.01","7","Reading for detail","Understand most specific information and detail in short and extended texts, with little or no support"],"ar":["7Rd.01","7","Reading for detail","Understand most specific information and detail in short and extended texts, with little or no support"]},{"en":["8Ug.10","8","Grammatical forms","Use if/unless/if only clauses in second conditionals and wish [that] structures"],"ar":["8Ug.10","8","Grammatical forms","Use if/unless/if only clauses in second conditionals and wish [that] structures"]},{"en":["9Sor.02","9","Speaking: Organisation","Summarise and make links in response to what others say, with little or no support"],"ar":["9Sor.02","9","Speaking: Organisation","Summarise and make links in response to what others say, with little or no support"]},{"en":["7Wca.02","7","Writing: Communicative achievement","Generate ideas, plan, write, edit and proofread extended texts, with support"],"ar":["7Wca.02","7","Writing: Communicative achievement","Generate ideas, plan, write, edit and proofread extended texts, with support"]},{"en":["9Ro.02","9","Reading for opinion","Recognise the difference between fact and opinion, including bias"],"ar":["9Ro.02","9","Reading for opinion","Recognise the difference between fact and opinion, including bias"]}]},{"t":"callout","k":"warn","title":{"en":"Two things to remember about codes","ar":"Two things to remember about codes"},"c":{"en":"First, the objectives in each stage are unique to that stage. The framework says so. Second, the order number only shows the position in that stage's list. It does not link objectives across stages. For example, 7Rd.03 is about deducing meaning from context, but 8Rd.03 is about recognising inconsistencies in argument; the deducing objective is 8Rd.04 at Stage 8. To follow one skill across stages, read the wording, not only the number.","ar":"First, the objectives in each stage are unique to that stage. The framework says so. Second, the order number only shows the position in that stage's list. It does not link objectives across stages. For example, 7Rd.03 is about deducing meaning from context, but 8Rd.03 is about recognising inconsistencies in argument; the deducing objective is 8Rd.04 at Stage 8. To follow one skill across stages, read the wording, not only the number."}},{"t":"h","c":{"en":"How many objectives are there?","ar":"How many objectives are there?"}},{"t":"p","c":{"en":"Counting the objectives in the framework's lists gives the numbers below. They are a useful picture of where the weight lies, but please check them against the framework, and remember that one objective can be broad and another narrow.","ar":"Counting the objectives in the framework's lists gives the numbers below. They are a useful picture of where the weight lies, but please check them against the framework, and remember that one objective can be broad and another narrow."}},{"t":"table","head":{"en":["Strand","Stage 7","Stage 8","Stage 9"],"ar":["Strand","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Reading","7","7","8"],"ar":["Reading","7","7","8"]},{"en":["Listening","5","6","7"],"ar":["Listening","5","6","7"]},{"en":["Speaking","8","8","8"],"ar":["Speaking","8","8","8"]},{"en":["Writing","9","9","9"],"ar":["Writing","9","9","9"]},{"en":["Use of English","23","24","21"],"ar":["Use of English","23","24","21"]},{"en":["Total","52","54","53"],"ar":["Total","52","54","53"]}]},{"t":"p","c":{"en":"Two things stand out. Use of English has the most objectives in every stage, which tells you how much language knowledge the framework expects. And the totals for Reading and Listening rise as the stages rise, partly because Stage 9 adds a second opinion objective to each of them.","ar":"Two things stand out. Use of English has the most objectives in every stage, which tells you how much language knowledge the framework expects. And the totals for Reading and Listening rise as the stages rise, partly because Stage 9 adds a second opinion objective to each of them."}},{"t":"scenario","title":{"en":"Scenario: decoding a test report","ar":"Scenario: decoding a test report"},"c":{"en":"A Year 9 pupil's feedback report shows a weak result for \"Ro\". Your colleague says: \"That is the writing strand, so we should do more essays.\" You use the code table. Ro is the reporting code for Reading for opinion, in the Reading strand. The Stage 9 objectives in that sub-strand are 9Ro.01 (recognise opinions and draw relevant conclusions) and 9Ro.02 (distinguish fact from opinion, including bias). A better plan is to give the pupil short articles with a mix of facts and opinions, and ask him to mark and justify each one.","ar":"A Year 9 pupil's feedback report shows a weak result for \"Ro\". Your colleague says: \"That is the writing strand, so we should do more essays.\" You use the code table. Ro is the reporting code for Reading for opinion, in the Reading strand. The Stage 9 objectives in that sub-strand are 9Ro.01 (recognise opinions and draw relevant conclusions) and 9Ro.02 (distinguish fact from opinion, including bias). A better plan is to give the pupil short articles with a mix of facts and opinions, and ask him to mark and justify each one."}},{"t":"scenario","title":{"en":"Scenario: choosing the right objective","ar":"Scenario: choosing the right objective"},"c":{"en":"A teacher wants to plan a lesson on \"why\" clauses and writes the code 7Ug.04. Her HOD points out that 7Ug.04 is present continuous. \"Why\" clauses appear as an example in 7Us.04, in Sentence structure, which covers defining and non-defining relative clauses. The mistake shows why you decode a code by reading its sub-strand letters (Ug and Us) and not by guessing from the number.","ar":"A teacher wants to plan a lesson on \"why\" clauses and writes the code 7Ug.04. Her HOD points out that 7Ug.04 is present continuous. \"Why\" clauses appear as an example in 7Us.04, in Sentence structure, which covers defining and non-defining relative clauses. The mistake shows why you decode a code by reading its sub-strand letters (Ug and Us) and not by guessing from the number."}}],"checks":[{"id":"m3q1","q":{"en":"What does the code 8Ug.10 stand for?","ar":"What does the code 8Ug.10 stand for?"},"opts":[{"en":"Year 8, Use of English: Vocabulary, the tenth objective of the strand across all stages","ar":"Year 8, Use of English: Vocabulary, the tenth objective of the strand across all stages"},{"en":"Stage 8, Understanding grammar, the tenth objective in the Listening strand","ar":"Stage 8, Understanding grammar, the tenth objective in the Listening strand"},{"en":"Stage 8, Use of English: Grammatical forms, the tenth objective in that list","ar":"Stage 8, Use of English: Grammatical forms, the tenth objective in that list"},{"en":"Stage 8, Use of English: Sentence st
