r lessons. A grammar point is best taught when pupils need it for a reading, listening, speaking or writing task. After a short focus on form, they should use it in context.","ar":"The framework says that Use of English objectives provide the language features for the four skills and that each lesson and unit should include a focus on one or more of them. It does not say to teach Use of English in separate grammar lessons. A grammar point is best taught when pupils need it for a reading, listening, speaking or writing task. After a short focus on form, they should use it in context."}},{"t":"h","c":{"en":"Planning Use of English across a unit","ar":"Planning Use of English across a unit"}},{"t":"p","c":{"en":"With so many objectives, how can a teacher plan? Here is one good-practice approach. First, decide which Use of English objectives fit the unit topic. A unit on \"technology and change\" might fit 8Ug.04 (present continuous), 8Ug.06 (present perfect) and 8Us.02 (contrast). Second, decide how many to teach for the first time and how many to revisit. The framework says learners revisit language at deeper levels, so a unit should include both. Third, check that the objectives appear in at least two skills, for example, in a reading text and in a speaking task. Finally, plan a short way to see whether pupils can use the form in their own sentences.","ar":"With so many objectives, how can a teacher plan? Here is one good-practice approach. First, decide which Use of English objectives fit the unit topic. A unit on \"technology and change\" might fit 8Ug.04 (present continuous), 8Ug.06 (present perfect) and 8Us.02 (contrast). Second, decide how many to teach for the first time and how many to revisit. The framework says learners revisit language at deeper levels, so a unit should include both. Third, check that the objectives appear in at least two skills, for example, in a reading text and in a speaking task. Finally, plan a short way to see whether pupils can use the form in their own sentences."}},{"t":"scenario","title":{"en":"Scenario: the same error again","ar":"Scenario: the same error again"},"c":{"en":"A Year 8 teacher is frustrated: \"I taught the present perfect in Year 7 and again this term, but the class still say 'I have seen him yesterday'.\" Her HOD looks at the framework. The present perfect appears at Stages 7, 8 and 9 (7Ug.06, 8Ug.06 and 9Ug.05), each time as a range of forms, and the framework says learners revisit language at deeper levels. The persistent error is not unusual. The teacher plans a short contrast task: \"Have you ever ...? When did you ...?\" so that pupils see the present perfect for experience and the past simple for a finished time. She also makes a poster of time words for each tense.","ar":"A Year 8 teacher is frustrated: \"I taught the present perfect in Year 7 and again this term, but the class still say 'I have seen him yesterday'.\" Her HOD looks at the framework. The present perfect appears at Stages 7, 8 and 9 (7Ug.06, 8Ug.06 and 9Ug.05), each time as a range of forms, and the framework says learners revisit language at deeper levels. The persistent error is not unusual. The teacher plans a short contrast task: \"Have you ever ...? When did you ...?\" so that pupils see the present perfect for experience and the past simple for a finished time. She also makes a poster of time words for each tense."}},{"t":"scenario","title":{"en":"Scenario: reading a Stage 9 grammar objective","ar":"Scenario: reading a Stage 9 grammar objective"},"c":{"en":"A Year 9 teacher sees 9Ug.14, an increasing range of past modals, for example must have, can't have and might have, to express speculation and deduction about the past. She thinks: \"This is a grammar rule. I will give pupils a list.\" Then she re-reads the objective and notices the words \"to express speculation and deduction\". She plans a mystery: \"The classroom window was open when we arrived. Who could have opened it?\" Pupils use must have, might have and can't have with clues. The form is now tied to the function that the framework names.","ar":"A Year 9 teacher sees 9Ug.14, an increasing range of past modals, for example must have, can't have and might have, to express speculation and deduction about the past. She thinks: \"This is a grammar rule. I will give pupils a list.\" Then she re-reads the objective and notices the words \"to express speculation and deduction\". She plans a mystery: \"The classroom window was open when we arrived. Who could have opened it?\" Pupils use must have, might have and can't have with clues. The form is now tied to the function that the framework names."}}],"checks":[{"id":"m7q1","q":{"en":"Which sub-strands make up the Use of English strand?","ar":"Which sub-strands make up the Use of English strand?"},"opts":[{"en":"Grammatical forms, Spelling and Punctuation","ar":"Grammatical forms, Spelling and Punctuation"},{"en":"Vocabulary, Pronunciation and Sentence structure","ar":"Vocabulary, Pronunciation and Sentence structure"},{"en":"Grammatical forms, Vocabulary and Sentence structure","ar":"Grammatical forms, Vocabulary and Sentence structure"},{"en":"Grammatical forms, Vocabulary and Communicative achievement","ar":"Grammatical forms, Vocabulary and Communicative achievement"}],"correct":2,"expl":{"en":"The framework lists three Use of English sub-strands: Grammatical forms (Ug), Vocabulary (Uv) and Sentence structure (Us).","ar":"The framework lists three Use of English sub-strands: Grammatical forms (Ug), Vocabulary (Uv) and Sentence structure (Us)."}},{"id":"m7q2","q":{"en":"A teacher wants to plan third conditionals. At which stage do they first appear in the objectives, and how?","ar":"A teacher wants to plan third conditionals. At which stage do they first appear in the objectives, and how?"},"opts":[{"en":"Stage 7, where learners use if/unless clauses in third conditionals (7Ug.08)","ar":"Stage 7, where learners use if/unless clauses in third conditionals (7Ug.08)"},{"en":"Stage 8, where learners use a wide range of third conditionals with wish structures (8Ug.10)","ar":"Stage 8, where learners use a wide range of third conditionals with wish structures (8Ug.10)"},{"en":"Stage 9, where learners use a wide range of third conditionals with no support (9Ug.10)","ar":"Stage 9, where learners use a wide range of third conditionals with no support (9Ug.10)"},{"en":"Stage 9, where learners begin to use if/if only clauses in third conditionals (9Ug.10)","ar":"Stage 9, where learners begin to use if/if only clauses in third conditionals (9Ug.10)"}],"correct":3,"expl":{"en":"The framework lists zero and first conditionals at Stage 7, second conditionals and wish structures at Stage 8, and third conditionals with \"begin to use\" at Stage 9 (9Ug.10).","ar":"The framework lists zero and first conditionals at Stage 7, second conditionals and wish structures at Stage 8, and third conditionals with \"begin to use\" at Stage 9 (9Ug.10)."}},{"id":"m7q3","q":{"en":"A colleague says: \"Use of English means we teach grammar in separate lessons from the four skills.\" What is the best response?","ar":"A colleague says: \"Use of English means we teach grammar in separate lessons from the four skills.\" What is the best response?"},"opts":[{"en":"The framework says each lesson and unit should include Use of English objectives alongside the four skills","ar":"The framework says each lesson and unit should include Use of English objectives alongside the four skills"},{"en":"That is right, because the framework requires one separate grammar lesson in every week of the year, for all stages","ar":"That is right, because the framework requires one separate grammar lesson in every week of the year, for all stages"},{"en":"That is right, because Use of English is assessed in its own Checkpoint paper named Use of English","ar":"That is right, because Use of English is assessed in its own Checkpoint paper named Use of English"},{"en":"That is wrong, because Use of English is not part of the Stage 7 to 9 objectives at all","ar":"That is wrong, because Use of English is not part of the Stage 7 to 9 objectives at all"}],"correct":0,"expl":{"en":"The framework says Use of English supplies the language features for the four skills and that each lesson and unit needs a focus on one or more of its objectives.","ar":"The framework says Use of English supplies the language features for the four skills and that each lesson and unit needs a focus on one or more of its objectives."}}]},{"id":"m8","title":{"en":"Listening and Speaking Across Stages 7 to 9","ar":"Listening and Speaking Across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"In the framework, Listening and Speaking are two separate strands, each with three sub-strands. This module treats them together because pupils use them together in conversation, and because the framework itself links Listening with Reading by giving them similar sub-strand names. You will see what each stage asks for and how to make speaking and listening visible in a classroom of 25 to 30 pupils.","ar":"In the framework, Listening and Speaking are two separate strands, each with three sub-strands. This module treats them together because pupils use them together in conversation, and because the framework itself links Listening with Reading by giving them similar sub-strand names. You will see what each stage asks for and how to make speaking and listening visible in a classroom of 25 to 30 pupils."}},{"t":"h","c":{"en":"Listening: three sub-strands that mirror Reading","ar":"Listening: three sub-strands that mirror Reading"}},{"t":"p","c":{"en":"The framework says that the sub-strands for Listening are named like those for Reading, so that you can link the skills. The descriptions are almost the same, except that \"text\" becomes \"talk\", \"author\" becomes \"speaker\" and \"reader\" becomes \"audience\".","ar":"The framework says that the sub-strands for Listening are named like those for Reading, so that you can link the skills. The descriptions are almost the same, except that \"text\" becomes \"talk\", \"author\" becomes \"speaker\" and \"reader\" becomes \"audience\"."}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Main points of talk (Lm)","7Lm.01: most of the main points, with little or no support","8Lm.01: the main points, with little or no support","9Lm.01: the main points"],"ar":["Main points of talk (Lm)","7Lm.01: most of the main points, with little or no support","8Lm.01: the main points, with little or no support","9Lm.01: the main points"]},{"en":["Specific information and detail (Ld)","7Ld.02: most specific information, little or no support","8Ld.02: specific information, little or no support","9Ld.02: specific information"],"ar":["Specific information and detail (Ld)","7Ld.02: most specific information, little or no support","8Ld.02: specific information, little or no support","9Ld.02: specific information"]},{"en":["Detail of an argument (Ld)","7Ld.03: with support","8Ld.03: with little or no support","9Ld.03: no support phrase"],"ar":["Detail of an argument (Ld)","7Ld.03: with support","8Ld.03: with little or no support","9Ld.03: no support phrase"]},{"en":["Deduce meaning from context (Ld)","7Ld.01: with little or no support","8Ld.01: and understand some implied meaning, with support","9Ld.01: and understand some implied meaning, with little or no support"],"ar":["Deduce meaning from context (Ld)","7Ld.01: with little or no support","8Ld.01: and understand some implied meaning, with support","9Ld.01: and understand some implied meaning, with little or no support"]},{"en":["Inconsistencies in argument (Ld)","Not listed","8Ld.04: begin to recognise, with support","9Ld.04: recognise, with support"],"ar":["Inconsistencies in argument (Ld)","Not listed","8Ld.04: begin to recognise, with support","9Ld.04: recognise, with support"]},{"en":["Opinions (Lo)","7Lo.01: recognise, with little or no support","8Lo.01: recognise the opinions of the speaker(s)","9Lo.01: recognise opinions and draw relevant conclusions; 9Lo.02: difference between fact and opinion [including bias]"],"ar":["Opinions (Lo)","7Lo.01: recognise, with little or no support","8Lo.01: recognise the opinions of the speaker(s)","9Lo.01: recognise opinions and draw relevant conclusions; 9Lo.02: difference between fact and opinion [including bias]"]}]},{"t":"p","c":{"en":"Compare this table with the Reading tables in Module 5. The pattern is the same: support is reduced, implied meaning is added at Stage 8, inconsistencies are added at Stage 8 and fact and opinion with bias are added at Stage 9. The only difference is that Reading has the extended-reading objective (Rm.02) and the idioms objective (7Rd.04), and Listening does not. For a teacher this is a good gain: \u003cstrong>a skill that you teach in Reading can be practised again in Listening\u003c/strong>, with the same words of the objective.","ar":"Compare this table with the Reading tables in Module 5. The pattern is the same: support is reduced, implied meaning is added at Stage 8, inconsistencies are added at Stage 8 and fact and opinion with bias are added at Stage 9. The only difference is that Reading has the extended-reading objective (Rm.02) and the idioms objective (7Rd.04), and Listening does not. For a teacher this is a good gain: \u003cstrong>a skill that you teach in Reading can be practised again in Listening\u003c/strong>, with the same words of the objective."}},{"t":"callout","k":"tip","title":{"en":"Link Reading and Listening (good practice)","ar":"Link Reading and Listening (good practice)"},"c":{"en":"Use one topic and one skill twice. For 8Ld.04, pupils first listen to a short recorded opinion about school uniform and find two sentences that do not agree. Later they do the same with a written text (8Rd.03). Because listening is fast and cannot be re-read, the listening version is harder. Play it twice, and let pupils compare notes before checking.","ar":"Use one topic and one skill twice. For 8Ld.04, pupils first listen to a short recorded opinion about school uniform and find two sentences that do not agree. Later they do the same with a written text (8Rd.03). Because listening is fast and cannot be re-read, the listening version is harder. Play it twice, and let pupils compare notes before checking."}},{"t":"h","c":{"en":"Speaking: Communication (Sc)","ar":"Speaking: Communication (Sc)"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Describe or narrate","7Sc.01: describe people, places, objects and past and present actions and events","8Sc.01: begin to develop a clear account or narrative, expanding main points with details and examples","9Sc.01: develop a clear account or narrative, expanding and supporting main points"],"ar":["Describe or narrate","7Sc.01: describe people, places, objects and past and present actions and events","8Sc.01: begin to develop a clear account or narrative, expanding main points with details and examples","9Sc.01: develop a clear account or narrative, expanding and supporting main points"]},{"en":["Ask questions","7Sc.02: on a wide range of topics","8Sc.02: including a limited range of unfamiliar topics","9Sc.02: including unfamiliar topics"],"ar":["Ask questions","7Sc.02: on a wide range of topics","8Sc.02: including a limited range of unfamiliar topics","9Sc.02: including unfamiliar topics"]},{"en":["Pronunciation, stress, intonation","7Sc.03: most words clearly; generally appropriate","8Sc.03: words and phrases clearly; generally appropriate","9Sc.03: clearly; appropriate use of intonation and stress"],"ar":["Pronunciation, stress, intonation","7Sc.03: most words clearly; generally appropriate","8Sc.03: words and phrases clearly; generally appropriate","9Sc.03: clearly; appropriate use of intonation and stress"]},{"en":["Fluency","7Sc.04: comprehensible stretches, allowing occasional hesitation and reformulation","8Sc.04: stretches with relative ease","9Sc.04: begin to produce stretches with a degree of fluency and spontaneity"],"ar":["Fluency","7Sc.04: comprehensible stretches, allowing occasional hesitation and reformulation","8Sc.04: stretches with relative ease","9Sc.04: begin to produce stretches with a degree of fluency and spontaneity"]},{"en":["Accuracy","7Sc.05: mostly accurate, with occasional mistakes","8Sc.05: and begin to correct their own errors","9Sc.05: no mistakes which cause misunderstanding; frequently correct their own errors"],"ar":["Accuracy","7Sc.05: mostly accurate, with occasional mistakes","8Sc.05: and begin to correct their own errors","9Sc.05: no mistakes which cause misunderstanding; frequently correct their own errors"]}]},{"t":"p","c":{"en":"Pay attention to two details. First, the fluency objective at Stage 9 says \"begin to produce and maintain stretches of language with a degree of fluency and spontaneity\". Even at Stage 9, then, spontaneity is a developing skill, not a finished one. Do not expect native-like speed from every Year 9 pupil. Second, self-correction appears in speaking in the same way as in writing: not at Stage 7, \"begin to\" at Stage 8, \"frequently\" at Stage 9. So you can use one idea, \"notice and fix your own error\", in both skills.","ar":"Pay attention to two details. First, the fluency objective at Stage 9 says \"begin to produce and maintain stretches of language with a degree of fluency and spontaneity\". Even at Stage 9, then, spontaneity is a developing skill, not a finished one. Do not expect native-like speed from every Year 9 pupil. Second, self-correction appears in speaking in the same way as in writing: not at Stage 7, \"begin to\" at Stage 8, \"frequently\" at Stage 9. So you can use one idea, \"notice and fix your own error\", in both skills."}},{"t":"h","c":{"en":"Speaking: Express opinion (So) and Organisation (Sor)","ar":"Speaking: Express opinion (So) and Organisation (Sor)"}},{"t":"table","head":{"en":["Skill","Stage 7","Stage 8","Stage 9"],"ar":["Skill","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Express opinions","7So.01: with support; begin to develop arguments with reasons, examples and evidence","8So.01: with little or no support; justify points of view","9So.01: express opinions, justify their point of view and evaluate the opinions of others"],"ar":["Express opinions","7So.01: with support; begin to develop arguments with reasons, examples and evidence","8So.01: with little or no support; justify points of view","9So.01: express opinions, justify their point of view and evaluate the opinions of others"]},{"en":["Link ideas in extended talk","7Sor.01: link sentences, with support, using a range of connectives","8Sor.01: link ideas using a range of connectives","9Sor.01: link ideas and arguments using a wide range of connectives"],"ar":["Link ideas in extended talk","7Sor.01: link sentences, with support, using a range of connectives","8Sor.01: link ideas using a range of connectives","9Sor.01: link ideas and arguments using a wide range of connectives"]},{"en":["Respond to others and reach a shared outcome","7Sor.02: summarise and make some links, with support","8Sor.02: with some support, in a range of extended exchanges","9Sor.02: with little or no support, in a range of extended exchanges"],"ar":["Respond to others and reach a shared outcome","7Sor.02: summarise and make some links, with support","8Sor.02: with some support, in a range of extended exchanges","9Sor.02: with little or no support, in a range of extended exchanges"]}]},{"t":"p","c":{"en":"The framework says the Express opinion sub-strand includes, in Stage 9, evaluating the opinions of others. That is a new skill in 9So.01. A teacher can prepare for it at Stage 8 by asking pupils to say not only \"I agree\" but also \"I agree because ...\", and to give one sentence about why a partner's reason is strong or weak.","ar":"The framework says the Express opinion sub-strand includes, in Stage 9, evaluating the opinions of others. That is a new skill in 9So.01. A teacher can prepare for it at Stage 8 by asking pupils to say not only \"I agree\" but also \"I agree because ...\", and to give one sentence about why a partner's reason is strong or weak."}},{"t":"callout","k":"warn","title":{"en":"Quiet pupils and the speaking objectives","ar":"Quiet pupils and the speaking objectives"},"c":{"en":"The Speaking strand has eight objectives at every stage. A pupil who is quiet in whole-class talk can still make progress with pair work, small groups, recorded talks and short presentations. Good practice: plan a mix of pair and group tasks, give thinking time, and use sentence frames such as \"In my opinion ..., because ...\". Do not judge a pupil's speaking only from whole-class answers.","ar":"The Speaking strand has eight objectives at every stage. A pupil who is quiet in whole-class talk can still make progress with pair work, small groups, recorded talks and short presentations. Good practice: plan a mix of pair and group tasks, give thinking time, and use sentence frames such as \"In my opinion ..., because ...\". Do not judge a pupil's speaking only from whole-class answers."}},{"t":"h","c":{"en":"A note on assessment of Listening and Speaking","ar":"A note on assessment of Listening and Speaking"}},{"t":"p","c":{"en":"The framework says that Cambridge Lower Secondary Checkpoint and Progression Tests for ESL have three papers: Reading and Usage, Writing and Listening. Speaking is not listed among them. The framework does not say how or whether speaking is assessed, so do not make claims about it. Use the support site for test details, and use classroom assessment against the Speaking objectives to check pupils' progress. Speaking has its own strand, objectives and codes, so it belongs in your planning.","ar":"The framework says that Cambridge Lower Secondary Checkpoint and Progression Tests for ESL have three papers: Reading and Usage, Writing and Listening. Speaking is not listed among them. The framework does not say how or whether speaking is assessed, so do not make claims about it. Use the support site for test details, and use classroom assessment against the Speaking objectives to check pupils' progress. Speaking has its own strand, objectives and codes, so it belongs in your planning."}},{"t":"scenario","title":{"en":"Scenario: planning a Stage 9 discussion","ar":"Scenario: planning a Stage 9 discussion"},"c":{"en":"A Year 9 teacher plans a discussion on whether schools should have a four-day week. She selects 9So.01 (justify and evaluate opinions), 9Sor.02 (summarise and link to what others say), and 9Sc.04 (fluency and spontaneity). She gives each group a role card (parent, teacher, pupil, principal). Before the discussion pupils listen to a short recorded interview and use 9Lo.01 to note the speaker's opinion and a conclusion. During the discussion each pupil must summarise the previous speaker before adding a point. Later the teacher gives feedback on one thing only: how well pupils evaluated others' ideas.","ar":"A Year 9 teacher plans a discussion on whether schools should have a four-day week. She selects 9So.01 (justify and evaluate opinions), 9Sor.02 (summarise and link to what others say), and 9Sc.04 (fluency and spontaneity). She gives each group a role card (parent, teacher, pupil, principal). Before the discussion pupils listen to a short recorded interview and use 9Lo.01 to note the speaker's opinion and a conclusion. During the discussion each pupil must summarise the previous speaker before adding a point. Later the teacher gives feedback on one thing only: how well pupils evaluated others' ideas."}},{"t":"scenario","title":{"en":"Scenario: the Year 7 pupil who stops talking","ar":"Scenario: the Year 7 pupil who stops talking"},"c":{"en":"Fahad, in Year 7, stops mid-sentence when he cannot find a word. His teacher reads 7Sc.04: learners produce and maintain stretches of language comprehensibly, \"allowing for occasional hesitation and reformulation\". The framework accepts pauses and rephrasing at this stage. She teaches him two repair phrases, \"What I mean is ...\" and \"Let me say that again\", and praises him each time he uses them. Fahad's talk becomes longer because he is no longer afraid of stopping.","ar":"Fahad, in Year 7, stops mid-sentence when he cannot find a word. His teacher reads 7Sc.04: learners produce and maintain stretches of language comprehensibly, \"allowing for occasional hesitation and reformulation\". The framework accepts pauses and rephrasing at this stage. She teaches him two repair phrases, \"What I mean is ...\" and \"Let me say that again\", and praises him each time he uses them. Fahad's talk becomes longer because he is no longer afraid of stopping."}}],"checks":[{"id":"m8q1","q":{"en":"Which statement about Listening and Reading is supported by the framework?","ar":"Which statement about Listening and Reading is supported by the framework?"},"opts":[{"en":"They have identical objectives, with the word \"text\" replaced by \"talk\" in every case","ar":"They have identical objectives, with the word \"text\" replaced by \"talk\" in every case"},{"en":"Their sub-strand names are similar, to help teachers see links between the two skills","ar":"Their sub-strand names are similar, to help teachers see links between the two skills"},{"en":"They are assessed together in a single Reading and Listening paper at the Checkpoint","ar":"They are assessed together in a single Reading and Listening paper at the Checkpoint"},{"en":"They are grouped as productive skills, while Writing and Speaking are receptive skills","ar":"They are grouped as productive skills, while Writing and Speaking are receptive skills"}],"correct":1,"expl":{"en":"The framework says the Reading and Listening sub-strands have similar names to help teachers identify links and reflect them in teaching.","ar":"The framework says the Reading and Listening sub-strands have similar names to help teachers identify links and reflect them in teaching."}},{"id":"m8q2","q":{"en":"What does 9So.01 add to the Express opinion objective, compared with Stages 7 and 8?","ar":"What does 9So.01 add to the Express opinion objective, compared with Stages 7 and 8?"},"opts":[{"en":"Learners express opinions for the first time, because earlier stages ask only for facts","ar":"Learners express opinions for the first time, because earlier stages ask only for facts"},{"en":"Learners no longer need to justify their opinions, because they are expected to speak freely at Stage 9","ar":"Learners no longer need to justify their opinions, because they are expected to speak freely at Stage 9"},{"en":"Learners also evaluate the opinions of others, as well as expressing and justifying their own","ar":"Learners also evaluate the opinions of others, as well as expressing and justifying their own"},{"en":"Learners must give a prepared speech, because spontaneous talk is not assessed at Stage 9","ar":"Learners must give a prepared speech, because spontaneous talk is not assessed at Stage 9"}],"correct":2,"expl":{"en":"9So.01 says express opinions, justify their point of view and evaluate the opinions of others. The overview also says that evaluating others is in Stage 9.","ar":"9So.01 says express opinions, justify their point of view and evaluate the opinions of others. The overview also says that evaluating others is in Stage 9."}},{"id":"m8q3","q":{"en":"A Year 8 pupil sometimes notices and corrects a spoken error. Which objective does this match?","ar":"A Year 8 pupil sometimes notices and corrects a spoken error. Which objective does this match?"},"opts":[{"en":"7Sc.05, where learners must frequently correct all of their own spoken errors","ar":"7Sc.05, where learners must frequently correct all of their own spoken errors"},{"en":"9Sc.05, where learners must make no mistakes of any kind in speaking","ar":"9Sc.05, where learners must make no mistakes of any kind in speaking"},{"en":"8Sc.04, where learners must produce error-free talk with a high degree of spontaneity","ar":"8Sc.04, where learners must produce error-free talk with a high degree of spontaneity"},{"en":"8Sc.05, where learners use mostly accurate language and begin to correct their own errors","ar":"8Sc.05, where learners use mostly accurate language and begin to correct their own errors"}],"correct":3,"expl":{"en":"8Sc.05 says use mostly accurate spoken language, with occasional mistakes, and begin to correct their own errors. At Stage 9 the objective says frequently.","ar":"8Sc.05 says use mostly accurate spoken language, with occasional mistakes, and begin to correct their own errors. At Stage 9 the objective says frequently."}}]},{"id":"m9","title":{"en":"Tracing Reading from Stage 7 to Stage 9: Links, Gaps and the Road Ahead","ar":"Tracing Reading from Stage 7 to Stage 9: Links, Gaps and the Road Ahead"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that, to enable effective progression in your teaching, you need to be familiar with the progression of skills across stages. This helps you build on prior learning in every stage. In this final module you will practise doing this for Reading: tracing one skill from Stage 7 to Stage 9, looking back to primary school and forward to IGCSE, finding gaps, and using the Year 9 Checkpoint as a reference point. You can use the same method for any other strand.","ar":"The framework says that, to enable effective progression in your teaching, you need to be familiar with the progression of skills across stages. This helps you build on prior learning in every stage. In this final module you will practise doing this for Reading: tracing one skill from Stage 7 to Stage 9, looking back to primary school and forward to IGCSE, finding gaps, and using the Year 9 Checkpoint as a reference point. You can use the same method for any other strand."}},{"t":"h","c":{"en":"A method for tracing a skill","ar":"A method for tracing a skill"}},{"t":"steps","c":{"en":["\u003cstrong>Find the thread.\u003c/strong> Choose one skill, for example \"recognise opinions\". Look in the sub-strand for each stage and write the three objectives side by side.","\u003cstrong>Underline the changes.\u003c/strong> Look for changes in support (\"with support\", \"with little or no support\", no phrase), range (\"limited\", \"increasing\", \"wide\"), and new content (for example \"draw relevant conclusions\").","\u003cstrong>Name the type of change.\u003c/strong> Is it less help, a wider range, a harder text, or a new element?","\u003cstrong>Check the neighbours.\u003c/strong> Look at the same skill in Listening and at the Use of English objectives that pupils need.","\u003cstrong>Plan the steps.\u003c/strong> Decide what pupils must do at the start of the stage and what they should do by the end."],"ar":["\u003cstrong>Find the thread.\u003c/strong> Choose one skill, for example \"recognise opinions\". Look in the sub-strand for each stage and write the three objectives side by side.","\u003cstrong>Underline the changes.\u003c/strong> Look for changes in support (\"with support\", \"with little or no support\", no phrase), range (\"limited\", \"increasing\", \"wide\"), and new content (for example \"draw relevant conclusions\").","\u003cstrong>Name the type of change.\u003c/strong> Is it less help, a wider range, a harder text, or a new element?","\u003cstrong>Check the neighbours.\u003c/strong> Look at the same skill in Listening and at the Use of English objectives that pupils need.","\u003cstrong>Plan the steps.\u003c/strong> Decide what pupils must do at the start of the stage and what they should do by the end."]}},{"t":"h","c":{"en":"Tracing four reading skills","ar":"Tracing four reading skills"}},{"t":"table","head":{"en":["Skill thread","Stage 7","Stage 8","Stage 9","Type of change"],"ar":["Skill thread","Stage 7","Stage 8","Stage 9","Type of change"]},"rows":[{"en":["Understand an argument","7Rd.02: detail of an argument, with support","8Rd.02: with little or no support","9Rd.02: no support phrase","Support is reduced"],"ar":["Understand an argument","7Rd.02: detail of an argument, with support","8Rd.02: with little or no support","9Rd.02: no support phrase","Support is reduced"]},{"en":["Deduce meaning","7Rd.03: from context, little or no support","8Rd.04: from context and some implied meaning, with support","9Rd.04: the same, with little or no support","New element (implied meaning), then support reduced"],"ar":["Deduce meaning","7Rd.03: from context, little or no support","8Rd.04: from context and some implied meaning, with support","9Rd.04: the same, with little or no support","New element (implied meaning), then support reduced"]},{"en":["Opinion","7Ro.01: recognise the writer's opinions","8Ro.01: recognise the opinions of the writer(s)","9Ro.01 and 9Ro.02: draw relevant conclusions; fact and opinion, including bias","New elements at Stage 9"],"ar":["Opinion","7Ro.01: recognise the writer's opinions","8Ro.01: recognise the opinions of the writer(s)","9Ro.01 and 9Ro.02: draw relevant conclusions; fact and opinion, including bias","New elements at Stage 9"]},{"en":["Extended reading","7Rm.02: a limited range of extended texts","8Rm.02: an increasing range","9Rm.02: a range","Range widens"],"ar":["Extended reading","7Rm.02: a limited range of extended texts","8Rm.02: an increasing range","9Rm.02: a range","Range widens"]}]},{"t":"p","c":{"en":"Look at the \"Deduce meaning\" row. The change from 7Rd.03 to 8Rd.04 is not simple. At Stage 8, learners deduce meaning and also \"understand some implied meaning\", and the support phrase goes back to \"with support\". At Stage 9 the support is reduced again. This is the same pattern you met in Writing: when something new is added, support returns. A teacher who sees this will plan Stage 8 implied-meaning tasks with scaffolding, for example, \"What does the writer suggest but not say?\" with a choice of three answers.","ar":"Look at the \"Deduce meaning\" row. The change from 7Rd.03 to 8Rd.04 is not simple. At Stage 8, learners deduce meaning and also \"understand some implied meaning\", and the support phrase goes back to \"with support\". At Stage 9 the support is reduced again. This is the same pattern you met in Writing: when something new is added, support returns. A teacher who sees this will plan Stage 8 implied-meaning tasks with scaffolding, for example, \"What does the writer suggest but not say?\" with a choice of three answers."}},{"t":"callout","k":"tip","title":{"en":"Worked example: tracing \"opinion\"","ar":"Worked example: tracing \"opinion\""},"c":{"en":"Start with 7Ro.01: find the writer's opinion in a short text about a film review, with little or no support. At Stage 8 the support phrase is dropped (8Ro.01), and pupils begin to notice inconsistencies (8Rd.03). By Stage 9 they draw conclusions from the opinion (9Ro.01) and separate facts from opinions, including bias (9Ro.02). So in Year 8, an important job is to make sure pupils can name the opinion and point to the words that show it. Without this base, Year 9 conclusions and bias will be difficult.","ar":"Start with 7Ro.01: find the writer's opinion in a short text about a film review, with little or no support. At Stage 8 the support phrase is dropped (8Ro.01), and pupils begin to notice inconsistencies (8Rd.03). By Stage 9 they draw conclusions from the opinion (9Ro.01) and separate facts from opinions, including bias (9Ro.02). So in Year 8, an important job is to make sure pupils can name the opinion and point to the words that show it. Without this base, Year 9 conclusions and bias will be difficult."}},{"t":"h","c":{"en":"Looking back: what comes before Stage 7","ar":"Looking back: what comes before Stage 7"}},{"t":"p","c":{"en":"The framework says that each step of the Cambridge Pathway builds on the learners' development from the previous one or from other educational systems. It also says that Cambridge Lower Secondary ESL expects learners to have studied ESL at primary school, and the alignment diagram places Cambridge Primary ESL, Stages 1 to 6, below the lower secondary stages. The Lower Secondary framework does not list the Primary Stage 6 objectives. Those are in the Cambridge Primary English as a Second Language framework.","ar":"The framework says that each step of the Cambridge Pathway builds on the learners' development from the previous one or from other educational systems. It also says that Cambridge Lower Secondary ESL expects learners to have studied ESL at primary school, and the alignment diagram places Cambridge Primary ESL, Stages 1 to 6, below the lower secondary stages. The Lower Secondary framework does not list the Primary Stage 6 objectives. Those are in the Cambridge Primary English as a Second Language framework."}},{"t":"p","c":{"en":"PEPS pupils come from Years 1 to 6, which are Stages 1 to 6. A practical step for Year 7 teachers is to read the Stage 6 Reading objectives in the Primary framework before the new school year, and to compare them with the Stage 7 Reading objectives side by side. The framework also says a document on the progression of learning objectives across Stages 7 to 9 is available on the support site, and that progression information can be downloaded from the same site. Check it for the official picture.","ar":"PEPS pupils come from Years 1 to 6, which are Stages 1 to 6. A practical step for Year 7 teachers is to read the Stage 6 Reading objectives in the Primary framework before the new school year, and to compare them with the Stage 7 Reading objectives side by side. The framework also says a document on the progression of learning objectives across Stages 7 to 9 is available on the support site, and that progression information can be downloaded from the same site. Check it for the official picture."}},{"t":"h","c":{"en":"Looking forward: what comes after Stage 9","ar":"Looking forward: what comes after Stage 9"}},{"t":"p","c":{"en":"The framework says that Cambridge Primary and Lower Secondary ESL provide a solid foundation for the further study of ESL and for further study through the medium of English at Cambridge IGCSE or O Level and beyond. Its alignment diagram shows Cambridge IGCSE above Stage 9. The framework does not list IGCSE content, so this CPD does not describe it. A practical step is to talk with the teachers of Years 10 and 11 about which reading and writing skills pupils find hardest when they arrive, and to look for the matching Stage 9 objectives.","ar":"The framework says that Cambridge Primary and Lower Secondary ESL provide a solid foundation for the further study of ESL and for further study through the medium of English at Cambridge IGCSE or O Level and beyond. Its alignment diagram shows Cambridge IGCSE above Stage 9. The framework does not list IGCSE content, so this CPD does not describe it. A practical step is to talk with the teachers of Years 10 and 11 about which reading and writing skills pupils find hardest when they arrive, and to look for the matching Stage 9 objectives."}},{"t":"h","c":{"en":"Finding gaps and prerequisites","ar":"Finding gaps and prerequisites"}},{"t":"p","c":{"en":"If a pupil cannot do a skill at their current stage, look back for the objective that supports it. This is good practice, using the framework's own wording. It does not mean that the pupil is \"below\" the stage; it means the teacher finds the next step.","ar":"If a pupil cannot do a skill at their current stage, look back for the objective that supports it. This is good practice, using the framework's own wording. It does not mean that the pupil is \"below\" the stage; it means the teacher finds the next step."}},{"t":"table","head":{"en":["Pupil difficulty (example)","Objective at the current stage","Where to look back"],"ar":["Pupil difficulty (example)","Objective at the current stage","Where to look back"]},"rows":[{"en":["Cannot find the writer's opinion in a long text","9Ro.01, recognise opinions and draw conclusions","8Ro.01 and 7Ro.01 (recognise the writer's opinions); also 7Rm.01 (main points)"],"ar":["Cannot find the writer's opinion in a long text","9Ro.01, recognise opinions and draw conclusions","8Ro.01 and 7Ro.01 (recognise the writer's opinions); also 7Rm.01 (main points)"]},{"en":["Cannot spot an inconsistency in an argument","9Rd.03, recognise inconsistencies, with support","8Rd.03 (begin to recognise), and 7Rd.02 and 8Rd.02 (understand the detail of an argument)"],"ar":["Cannot spot an inconsistency in an argument","9Rd.03, recognise inconsistencies, with support","8Rd.03 (begin to recognise), and 7Rd.02 and 8Rd.02 (understand the detail of an argument)"]},{"en":["Misses what the writer implies","9Rd.04, implied meaning, little or no support","8Rd.04 (with support) and 7Rd.03 (deduce meaning from context)"],"ar":["Misses what the writer implies","9Rd.04, implied meaning, little or no support","8Rd.04 (with support) and 7Rd.03 (deduce meaning from context)"]},{"en":["Reads slowly and avoids long texts","9Rm.02, a range of extended texts, with enjoyment","8Rm.02 and 7Rm.02; also look at pupil interests and choice of texts"],"ar":["Reads slowly and avoids long texts","9Rm.02, a range of extended texts, with enjoyment","8Rm.02 and 7Rm.02; also look at pupil interests and choice of texts"]},{"en":["Does not understand the linking words in an argument","9Rd.02, the detail of an argument","7Us.03 and 8Us.02 (connectives for reasons, purpose and contrast) in Use of English"],"ar":["Does not understand the linking words in an argument","9Rd.02, the detail of an argument","7Us.03 and 8Us.02 (connectives for reasons, purpose and contrast) in Use of English"]}]},{"t":"p","c":{"en":"The last row shows why the neighbours matter. A reading difficulty may be a language-knowledge difficulty. If a pupil does not know that \"however\" signals contrast, an argument text is much harder to follow. Looking back at Use of English objectives, as well as other Reading objectives, will often show the real gap.","ar":"The last row shows why the neighbours matter. A reading difficulty may be a language-knowledge difficulty. If a pupil does not know that \"however\" signals contrast, an argument text is much harder to follow. Looking back at Use of English objectives, as well as other Reading objectives, will often show the real gap."}},{"t":"h","c":{"en":"The Year 9 Checkpoint","ar":"The Year 9 Checkpoint"}},{"t":"p","c":{"en":"PEPS Year 9 pupils sit the Cambridge Lower Secondary Checkpoint, which includes ESL. The framework says the Checkpoint tests were to be available from 2023, and that Cambridge provides assessments designed to complement the framework for Stages 7 to 9. For ESL, the framework lists three papers for the Checkpoint and Progression Tests: Reading and Usage, Writing, and Listening. The framework also says that the reporting code in each learning objective code appears in the feedback reports for tests.","ar":"PEPS Year 9 pupils sit the Cambridge Lower Secondary Checkpoint, which includes ESL. The framework says the Checkpoint tests were to be available from 2023, and that Cambridge provides assessments designed to complement the framework for Stages 7 to 9. For ESL, the framework lists three papers for the Checkpoint and Progression Tests: Reading and Usage, Writing, and Listening. The framework also says that the reporting code in each learning objective code appears in the feedback reports for tests."}},{"t":"p","c":{"en":"This gives you a practical routine. When you receive feedback with codes such as Rm, Rd, Ro, Ug, Uv or Us, use the sub-strand table from Module 3 to find the matching objectives, then trace the skill as in this module. Do not describe the contents or format of the papers beyond what the framework says; check the support site and the school's assessment information.","ar":"This gives you a practical routine. When you receive feedback with codes such as Rm, Rd, Ro, Ug, Uv or Us, use the sub-strand table from Module 3 to find the matching objectives, then trace the skill as in this module. Do not describe the contents or format of the papers beyond what the framework says; check the support site and the school's assessment information."}},{"t":"h","c":{"en":"Glossary: key terms from the framework","ar":"Glossary: key terms from the framework"}},{"t":"table","head":{"en":["Term","Meaning (paraphrased from the framework glossary)"],"ar":["Term","Meaning (paraphrased from the framework glossary)"]},"rows":[{"en":["Strand","A collection of learning objectives that forms an area of learning"],"ar":["Strand","A collection of learning objectives that forms an area of learning"]},{"en":["Sub-strand","A section that divides a strand into more specific areas for teaching and learning"],"ar":["Sub-strand","A section that divides a strand into more specific areas for teaching and learning"]},{"en":["Learning objective","A statement of the knowledge, understanding and skills learners will develop; a reference for checking attainment"],"ar":["Learning objective","A statement of the knowledge, understanding and skills learners will develop; a reference for checking attainment"]},{"en":["Connective","A word used to join words, phrases or clauses, or to show relationships between sentences"],"ar":["Connective","A word used to join words, phrases or clauses, or to show relationships between sentences"]},{"en":["Deduce","Arrive at a fact or conclusion by reasoning"],"ar":["Deduce","Arrive at a fact or conclusion by reasoning"]},{"en":["Explore","Investigate, look for patterns and discuss examples to inform understanding of a concept"],"ar":["Explore","Investigate, look for patterns and discuss examples to inform understanding of a concept"]},{"en":["Authentic language","Written or spoken language used in real situations, as opposed to graded teaching material"],"ar":["Authentic language","Written or spoken language used in real situations, as opposed to graded teaching material"]},{"en":["Scheme of work","Support materials for each stage: a suggested long-term plan, a medium-term plan with activities and sample lesson plans"],"ar":["Scheme of work","Support materials for each stage: a suggested long-term plan, a medium-term plan with activities and sample lesson plans"]},{"en":["Teacher guide","The document that supports using the framework to plan and deliver lessons"],"ar":["Teacher guide","The document that supports using the framework to plan and deliver lessons"]},{"en":["Active learning","A classroom approach where learners are encouraged to think hard rather than passively receive information"],"ar":["Active learning","A classroom approach where learners are encouraged to think hard rather than passively receive information"]}]},{"t":"scenario","title":{"en":"Scenario: planning a Year 9 reading unit from the thread","ar":"Scenario: planning a Year 9 reading unit from the thread"},"c":{"en":"A Year 9 team plans a four-week unit on \"social media and young people\". Using the tracing method, they choose 9Ro.02 (fact and opinion, including bias) as the main reading objective, and write down its thread: 7Ro.01, 8Ro.01 and 8Rd.03. In week one they check what pupils can already do with a short text. In week two they teach words that signal opinion and bias. In week three they compare two articles about the same topic. In week four pupils write a short argument (9Wc.02) and a partner marks the facts and opinions. The Use of English focus is 9Us.01 (a range of connectives). The unit meets Reading, Writing and Use of English together.","ar":"A Year 9 team plans a four-week unit on \"social media and young people\". Using the tracing method, they choose 9Ro.02 (fact and opinion, including bias) as the main reading objective, and write down its thread: 7Ro.01, 8Ro.01 and 8Rd.03. In week one they check what pupils can already do with a short text. In week two they teach words that signal opinion and bias. In week three they compare two articles about the same topic. In week four pupils write a short argument (9Wc.02) and a partner marks the facts and opinions. The Use of English focus is 9Us.01 (a range of connectives). The unit meets Reading, Writing and Use of English together."}},{"t":"scenario","title":{"en":"Scenario: the Year 8 pupil who cannot infer","ar":"Scenario: the Year 8 pupil who cannot infer"},"c":{"en":"A Year 8 pupil answers all literal questions but fails every question that asks what the writer suggests. His teacher checks 8Rd.04, which says \"with support\". She realises she has been asking inference questions with no help. She adds a three-step scaffold: find the clue words, say what they usually mean, then say what the writer is suggesting. After two weeks the pupil answers most questions correctly. The teacher also records this skill as a priority for Year 9, where the same objective (9Rd.04) expects little or no support.","ar":"A Year 8 pupil answers all literal questions but fails every question that asks what the writer suggests. His teacher checks 8Rd.04, which says \"with support\". She realises she has been asking inference questions with no help. She adds a three-step scaffold: find the clue words, say what they usually mean, then say what the writer is suggesting. After two weeks the pupil answers most questions correctly. The teacher also records this skill as a priority for Year 9, where the same objective (9Rd.04) expects little or no support."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"1. The framework is the official source for what is taught; coursebooks and schemes of work are optional tools. 2. Objectives are written as can-do statements based on the CEFR, so avoid fixed \"Year = level\" claims. 3. A code such as 8Ug.10 tells you the stage, the sub-strand and the order; the objectives in each stage are unique to that stage. 4. Integrate the four skills with a Use of English focus in every lesson and unit, and plan from more than one strand. 5. Trace skills across Stages 7 to 9 by reading the support, range and new elements in the wording, and use this to find gaps. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"1. The framework is the official source for what is taught; coursebooks and schemes of work are optional tools. 2. Objectives are written as can-do statements based on the CEFR, so avoid fixed \"Year = level\" claims. 3. A code such as 8Ug.10 tells you the stage, the sub-strand and the order; the objectives in each stage are unique to that stage. 4. Integrate the four skills with a Use of English focus in every lesson and unit, and plan from more than one strand. 5. Trace skills across Stages 7 to 9 by reading the support, range and new elements in the wording, and use this to find gaps. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"A Year 9 pupil struggles with 9Ro.01 (recognise opinions and draw conclusions). Which earlier objectives are the best place to look back?","ar":"A Year 9 pupil struggles with 9Ro.01 (recognise opinions and draw conclusions). Which earlier objectives are the best place to look back?"},"opts":[{"en":"8Ro.01 and 7Ro.01, which ask learners to recognise the opinions of the writer","ar":"8Ro.01 and 7Ro.01, which ask learners to recognise the opinions of the writer"},{"en":"8Rm.02 and 7Rm.02, which ask learners to read a range of extended texts for enjoyment","ar":"8Rm.02 and 7Rm.02, which ask learners to read a range of extended texts for enjoyment"},{"en":"8Ug.10 and 7Ug.08, which cover conditionals and wish structures in grammar","ar":"8Ug.10 and 7Ug.08, which cover conditionals and wish structures in grammar"},{"en":"8Sc.01 and 7Sc.01, which ask learners to describe events and expand on main points","ar":"8Sc.01 and 7Sc.01, which ask learners to describe events and expand on main points"}],"correct":0,"expl":{"en":"9Ro.01 builds on the opinion objectives at Stages 7 and 8, adding draw relevant conclusions. The other options are in different sub-strands.","ar":"9Ro.01 builds on the opinion objectives at Stages 7 and 8, adding draw relevant conclusions. The other options are in different sub-strands."}},{"id":"m9q2","q":{"en":"What does the framework say about the contents of Cambridge IGCSE?","ar":"What does the framework say about the contents of Cambridge IGCSE?"},"opts":[{"en":"It lists the IGCSE Reading objectives for each of Years 10 and 11 in a separate table","ar":"It lists the IGCSE Reading objectives for each of Years 10 and 11 in a separate table"},{"en":"It names IGCSE as further study through English, but does not list IGCSE content","ar":"It names IGCSE as further study through English, but does not list IGCSE content"},{"en":"It says Stage 9 objectives are identical to those used in the IGCSE examination papers","ar":"It says Stage 9 objectives are identical to those used in the IGCSE examination papers"},{"en":"It says IGCSE ESL replaces the Stage 9 objectives for pupils who are ready early","ar":"It says IGCSE ESL replaces the Stage 9 objectives for pupils who are ready early"}],"correct":1,"expl":{"en":"The framework says the programme prepares learners for study through English at IGCSE or O Level and beyond, and the diagram shows IGCSE above Stage 9, but it gives no IGCSE content.","ar":"The framework says the programme prepares learners for study through English at IGCSE or O Level and beyond, and the diagram shows IGCSE above Stage 9, but it gives no IGCSE content."}},{"id":"m9q3","q":{"en":"A Year 9 feedback report gives a weak result for \"Ug\". What is the best first step, using the framework?","ar":"A Year 9 feedback report gives a weak result for \"Ug\". What is the best first step, using the framework?"},"opts":[{"en":"Treat Ug as a Reading result and give the pupil extra comprehension practice","ar":"Treat Ug as a Reading result and give the pupil extra comprehension practice"},{"en":"Treat Ug as a speaking score, because the framework does not give Ug a sub-strand","ar":"Treat Ug as a speaking score, because the framework does not give Ug a sub-strand"},{"en":"Identify Ug as Grammatical forms in Use of English and review the Stage 9 Ug objectives","ar":"Identify Ug as Grammatical forms in Use of English and review the Stage 9 Ug objectives"},{"en":"Ignore the code, because reporting codes are not linked to any learning objectives or test reports","ar":"Ignore the code, because reporting codes are not linked to any learning objectives or test reports"}],"correct":2,"expl":{"en":"The framework says the reporting code reflects the sub-strand titles, and Ug is Grammatical forms in the Use of English strand.","ar":"The framework says the reporting code reflects the sub-strand titles, and Ug is Grammatical forms in the Use of English strand."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A parent asks why PEPS Year 8 follows \"English as a Second Language\" and not \"English\". Which part of the framework helps you explain the difference?","ar":"A parent asks why PEPS Year 8 follows \"English as a Second Language\" and not \"English\". Which part of the framework helps you explain the difference?"},"opts":[{"en":"The glossary, which says ESL is designed only for pupils who have just arrived in the country this year","ar":"The glossary, which says ESL is designed only for pupils who have just arrived in the country this year"},{"en":"The teaching-time section, which says ESL is for schools with fewer than four hours a week","ar":"The teaching-time section, which says ESL is for schools with fewer than four hours a week"},{"en":"The assessment section, which says ESL is for pupils who do not take Checkpoint tests","ar":"The assessment section, which says ESL is for pupils who do not take Checkpoint tests"},{"en":"The comparison table, which says ESL is designed for learners who speak another language at home","ar":"The comparison table, which says ESL is designed for learners who speak another language at home"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"Your school wants to replace the framework's objectives with the order of units in a published coursebook. What does the framework say?","ar":"Your school wants to replace the framework's objectives with the order of units in a published coursebook. What does the framework say?"},"opts":[{"en":"Schemes of work are not compulsory, and endorsed resources need not follow their order, but objectives matter","ar":"Schemes of work are not compulsory, and endorsed resources need not follow their order, but objectives matter"},{"en":"Schemes of work must be followed in the order given, because Cambridge inspects the unit order in every school and every year","ar":"Schemes of work must be followed in the order given, because Cambridge inspects the unit order in every school and every year"},{"en":"Coursebooks must replace the framework in Stages 8 and 9, once Stage 7 is complete","ar":"Coursebooks must replace the framework in Stages 8 and 9, once Stage 7 is complete"},{"en":"Only the teacher guide may be used to plan, and coursebooks are forbidden in all stages","ar":"Only the teacher guide may be used to plan, and coursebooks are forbidden in all stages"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"Which sentence about the framework's version is accurate?","ar":"Which sentence about the framework's version is accurate?"},"opts":[{"en":"Version 2.0 was published in September 2020 and it added a new Use of English strand","ar":"Version 2.0 was published in September 2020 and it added a new Use of English strand"},{"en":"Version 2.0 was published in August 2021 and its changes made the document /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;
if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
