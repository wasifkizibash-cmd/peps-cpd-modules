#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-maths-framework-b","code":"LMB","passMark":80,"hours":"2.5 hours","accent":"#1F6FB2","accentSoft":"#E3EEF9","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary Mathematics 0862 · Part B","ar":"Staff CPD · Cambridge Lower Secondary Mathematics 0862 · Part B"},"title":{"en":"Understanding the Cambridge Lower Secondary Mathematics Curriculum: Part B, From Framework to Classroom","ar":"Understanding the Cambridge Lower Secondary Mathematics Curriculum: Part B, From Framework to Classroom"},"subtitle":{"en":"A self-paced guide for Mathematics teachers in Years 7 to 9, HODs and coordinators: how to turn the Cambridge Lower Secondary Mathematics learning objectives into planned lessons, build Thinking and Working Mathematically into tasks and talk, support fluency, algebraic thinking and ESL learners, use assessment evidence, and include, challenge and prepare every learner for the next step.","ar":"A self-paced guide for Mathematics teachers in Years 7 to 9, HODs and coordinators: how to turn the Cambridge Lower Secondary Mathematics learning objectives into planned lessons, build Thinking and Working Mathematically into tasks and talk, support fluency, algebraic thinking and ESL learners, use assessment evidence, and include, challenge and prepare every learner for the next step."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework (v3.0)","ar":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Where this CPD describes good practice or PEPS context that is not in the framework, it says so. Check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Where this CPD describes good practice or PEPS context that is not in the framework, it says so. Check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"From Objectives to Lessons","ar":"From Objectives to Lessons"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explained how the Cambridge Lower Secondary Mathematics 0862 framework is organised: its strands, its learning objective codes, Thinking and Working Mathematically and the content of Stages 7, 8 and 9. Part B is about \u003cstrong>using the framework in your classroom\u003c/strong>. By the end of Part B you will be able to: plan from objectives to units and lessons; use the framework's teaching approaches; build Thinking and Working Mathematically into tasks and talk; support fluency, algebraic thinking and ESL learners; use assessment evidence to adjust your teaching; include and challenge all learners; and check the quality of a lesson. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explained how the Cambridge Lower Secondary Mathematics 0862 framework is organised: its strands, its learning objective codes, Thinking and Working Mathematically and the content of Stages 7, 8 and 9. Part B is about \u003cstrong>using the framework in your classroom\u003c/strong>. By the end of Part B you will be able to: plan from objectives to units and lessons; use the framework's teaching approaches; build Thinking and Working Mathematically into tasks and talk; support fluency, algebraic thinking and ESL learners; use assessment evidence to adjust your teaching; include and challenge all learners; and check the quality of a lesson. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"A curriculum framework is a map, not a timetable. It tells you \u003cem>what\u003c/em> learners should learn in each stage, but it does not tell you what to teach on Monday morning. That decision is yours, with your HOD, and within your school's lesson-planning expectations.","ar":"A curriculum framework is a map, not a timetable. It tells you \u003cem>what\u003c/em> learners should learn in each stage, but it does not tell you what to teach on Monday morning. That decision is yours, with your HOD, and within your school's lesson-planning expectations."}},{"t":"p","c":{"en":"In this CPD, Stage 7, Stage 8 and Stage 9 are the Cambridge stages that PEPS teaches as Year 7, Year 8 and Year 9 (PEPS context). A code such as 8Nf.05 starts with the stage number. The framework version used here is \u003cstrong>version 3.0, published August 2021\u003c/strong>. Version 2.0 (January 2021) changed three objectives: 8Gg.02, 8Ss.03 and 9Ss.03. Version 3.0 made the document digitally accessible. If a printed copy in your department has a different version number, check the current Cambridge document.","ar":"In this CPD, Stage 7, Stage 8 and Stage 9 are the Cambridge stages that PEPS teaches as Year 7, Year 8 and Year 9 (PEPS context). A code such as 8Nf.05 starts with the stage number. The framework version used here is \u003cstrong>version 3.0, published August 2021\u003c/strong>. Version 2.0 (January 2021) changed three objectives: 8Gg.02, 8Ss.03 and 9Ss.03. Version 3.0 made the document digitally accessible. If a printed copy in your department has a different version number, check the current Cambridge document."}},{"t":"h","c":{"en":"What the framework says a learning objective is","ar":"What the framework says a learning objective is"}},{"t":"p","c":{"en":"The glossary describes learning objectives as statements of the expectations of knowledge, understanding and skills that learners will develop. The framework says they give \u003cstrong>a structure for teaching and learning\u003c/strong> and \u003cstrong>a reference against which learners' attainment and skills development can be checked\u003c/strong>. So an objective does two jobs for you. It tells you what to teach, and it tells you what to check.","ar":"The glossary describes learning objectives as statements of the expectations of knowledge, understanding and skills that learners will develop. The framework says they give \u003cstrong>a structure for teaching and learning\u003c/strong> and \u003cstrong>a reference against which learners' attainment and skills development can be checked\u003c/strong>. So an objective does two jobs for you. It tells you what to teach, and it tells you what to check."}},{"t":"p","c":{"en":"The framework also says that all the objectives in each stage give clear progression from the previous stage and to the next stage. It advises you to be familiar with the progression of skills across stages, so that you can build on prior learning. The progression of objectives across Stages 7 to 9 is available on the Cambridge Lower Secondary support site.","ar":"The framework also says that all the objectives in each stage give clear progression from the previous stage and to the next stage. It advises you to be familiar with the progression of skills across stages, so that you can build on prior learning. The progression of objectives across Stages 7 to 9 is available on the Cambridge Lower Secondary support site."}},{"t":"scenario","title":{"en":"Worked example: reading an objective and planning from it","ar":"Worked example: reading an objective and planning from it"},"c":{"en":"Take \u003cstrong>8Nf.05\u003c/strong>: \u003cem>Understand percentage increase and decrease, and absolute change.\u003c/em> Reading the code: \u003cstrong>8\u003c/strong> = Stage 8; \u003cstrong>Nf\u003c/strong> = the reporting code for the sub-strand Fractions, decimals, percentages, ratio and proportion; \u003cstrong>05\u003c/strong> = the fifth objective in that sub-strand for Stage 8. Reading the words: two ideas (increase and decrease as percentages, and absolute change, the plain difference). Now look sideways. Stage 7 has \u003cstrong>7Nf.05\u003c/strong> (recognise percentages of shapes and whole numbers, including less than 1 or greater than 100). Stage 9 has \u003cstrong>9Nf.05\u003c/strong> (understand compound percentages). So a Year 8 lesson on percentage change builds on percentages of amounts from Year 7 and prepares for compound percentages in Year 9. Before you plan a lesson, always read the same sub-strand in the stage before and the stage after. The framework wording is longer than our paraphrase; check it for the full text.","ar":"Take \u003cstrong>8Nf.05\u003c/strong>: \u003cem>Understand percentage increase and decrease, and absolute change.\u003c/em> Reading the code: \u003cstrong>8\u003c/strong> = Stage 8; \u003cstrong>Nf\u003c/strong> = the reporting code for the sub-strand Fractions, decimals, percentages, ratio and proportion; \u003cstrong>05\u003c/strong> = the fifth objective in that sub-strand for Stage 8. Reading the words: two ideas (increase and decrease as percentages, and absolute change, the plain difference). Now look sideways. Stage 7 has \u003cstrong>7Nf.05\u003c/strong> (recognise percentages of shapes and whole numbers, including less than 1 or greater than 100). Stage 9 has \u003cstrong>9Nf.05\u003c/strong> (understand compound percentages). So a Year 8 lesson on percentage change builds on percentages of amounts from Year 7 and prepares for compound percentages in Year 9. Before you plan a lesson, always read the same sub-strand in the stage before and the stage after. The framework wording is longer than our paraphrase; check it for the full text."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The framework's glossary says each scheme of work contains \u003cstrong>a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\u003c/strong>. These three levels are a useful way to organise any planning, whether you use the Cambridge scheme of work or your own. The examples in the last column are good practice, not framework requirements.","ar":"The framework's glossary says each scheme of work contains \u003cstrong>a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\u003c/strong>. These three levels are a useful way to organise any planning, whether you use the Cambridge scheme of work or your own. The examples in the last column are good practice, not framework requirements."}},{"t":"table","head":{"en":["Level","The question it answers","What it usually contains (good practice)","Example for Stage 8"],"ar":["Level","The question it answers","What it usually contains (good practice)","Example for Stage 8"]},"rows":[{"en":["Long-term","What will this year group learn, and in what order?","All objectives of the stage grouped into units and placed on the school calendar, with assessment points","A year plan where proportion units come before algebraic modelling and before the end-of-year assessment"],"ar":["Long-term","What will this year group learn, and in what order?","All objectives of the stage grouped into units and placed on the school calendar, with assessment points","A year plan where proportion units come before algebraic modelling and before the end-of-year assessment"]},{"en":["Medium-term","What will we teach in this unit, and which activities will build it?","A unit of several weeks: objectives, key vocabulary, activities, resources and checks","A unit on ratio and proportion covering 8Nf.09, 8Nf.10 and 8Nf.11"],"ar":["Medium-term","What will we teach in this unit, and which activities will build it?","A unit of several weeks: objectives, key vocabulary, activities, resources and checks","A unit on ratio and proportion covering 8Nf.09, 8Nf.10 and 8Nf.11"]},{"en":["Short-term","What will happen in this lesson with these 28 learners?","One lesson: one main objective, success criteria, questions, tasks and a check","Lesson 4: share an amount in a ratio with three parts (8Nf.11)"],"ar":["Short-term","What will happen in this lesson with these 28 learners?","One lesson: one main objective, success criteria, questions, tasks and a check","Lesson 4: share an amount in a ratio with three parts (8Nf.11)"]}]},{"t":"h","c":{"en":"From objective to lesson: a simple routine","ar":"From objective to lesson: a simple routine"}},{"t":"p","c":{"en":"Good practice is to keep three things separate in a plan: the \u003cstrong>learning objective\u003c/strong> (what learners will learn), the \u003cstrong>success criteria\u003c/strong> (how you and they will know they have learned it) and the \u003cstrong>activity\u003c/strong> (what they do). Many weak plans mix the last two. \"Do page 45\" is an activity. It is not an objective.","ar":"Good practice is to keep three things separate in a plan: the \u003cstrong>learning objective\u003c/strong> (what learners will learn), the \u003cstrong>success criteria\u003c/strong> (how you and they will know they have learned it) and the \u003cstrong>activity\u003c/strong> (what they do). Many weak plans mix the last two. \"Do page 45\" is an activity. It is not an objective."}},{"t":"steps","c":{"en":["\u003cstrong>Find the objective.\u003c/strong> Write the code and the framework wording. Example: 7Gg.05, derive and know the formula for the area of a triangle.","\u003cstrong>Check what comes before.\u003c/strong> Learners need area of rectangles and the idea of base and height before they can derive the triangle formula. Check earlier objectives and the primary framework.","\u003cstrong>Write the lesson aim in learner language.\u003c/strong> \"We are learning why the area of a triangle is half of a rectangle.\"","\u003cstrong>Write success criteria.\u003c/strong> \"I can explain the formula with a drawing. I can find the area of a triangle when the height is inside it. I can find the area of a compound shape.\"","\u003cstrong>Choose the task and the Thinking and Working Mathematically (TWM) focus.\u003c/strong> For example, learners cut rectangles and compare (specialising), then explain why it always works (convincing).","\u003cstrong>Plan the check.\u003c/strong> Two or three questions during the lesson and one short task at the end, so you know who needs support tomorrow."],"ar":["\u003cstrong>Find the objective.\u003c/strong> Write the code and the framework wording. Example: 7Gg.05, derive and know the formula for the area of a triangle.","\u003cstrong>Check what comes before.\u003c/strong> Learners need area of rectangles and the idea of base and height before they can derive the triangle formula. Check earlier objectives and the primary framework.","\u003cstrong>Write the lesson aim in learner language.\u003c/strong> \"We are learning why the area of a triangle is half of a rectangle.\"","\u003cstrong>Write success criteria.\u003c/strong> \"I can explain the formula with a drawing. I can find the area of a triangle when the height is inside it. I can find the area of a compound shape.\"","\u003cstrong>Choose the task and the Thinking and Working Mathematically (TWM) focus.\u003c/strong> For example, learners cut rectangles and compare (specialising), then explain why it always works (convincing).","\u003cstrong>Plan the check.\u003c/strong> Two or three questions during the lesson and one short task at the end, so you know who needs support tomorrow."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: one main idea per lesson","ar":"Good practice: one main idea per lesson"},"c":{"en":"A lesson that tries to cover four objectives usually teaches none of them well. Some objectives are large. 7Gg.13, for example, covers angles on parallel lines, perpendicular lines and intersecting lines. Split such objectives into small steps and plan the steps across several lessons.","ar":"A lesson that tries to cover four objectives usually teaches none of them well. Some objectives are large. 7Gg.13, for example, covers angles on parallel lines, perpendicular lines and intersecting lines. Split such objectives into small steps and plan the steps across several lessons."}},{"t":"h","c":{"en":"What the teacher guide and the schemes of work contain","ar":"What the teacher guide and the schemes of work contain"}},{"t":"p","c":{"en":"The framework describes two support documents, found on the Cambridge Lower Secondary support site. The \u003cstrong>teacher guide\u003c/strong> supports you to plan and deliver lessons using effective teaching and learning approaches. The \u003cstrong>scheme of work\u003c/strong> for each stage contains:","ar":"The framework describes two support documents, found on the Cambridge Lower Secondary support site. The \u003cstrong>teacher guide\u003c/strong> supports you to plan and deliver lessons using effective teaching and learning approaches. The \u003cstrong>scheme of work\u003c/strong> for each stage contains:"}},{"t":"list","c":{"en":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","a list of subject-specific language that will be useful for your learners;","common misconceptions;","sample lesson plans;","links to relevant NRICH activities to enrich learners' mathematical experiences."],"ar":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","a list of subject-specific language that will be useful for your learners;","common misconceptions;","sample lesson plans;","links to relevant NRICH activities to enrich learners' mathematical experiences."]}},{"t":"callout","k":"key","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework says: \u003cstrong>\"You do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Mathematics.\"\u003c/strong> They show the types of activities you might use and the intended depth and breadth of each objective. The activities are \u003cstrong>not designed to fill all the teaching time\u003c/strong> for a stage, so you should use other activities of similar difficulty, for example from endorsed resources. What matters is that the learning objectives are taught well. How you group, order and teach them is your professional decision, within school expectations.","ar":"The framework says: \u003cstrong>\"You do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Mathematics.\"\u003c/strong> They show the types of activities you might use and the intended depth and breadth of each objective. The activities are \u003cstrong>not designed to fill all the teaching time\u003c/strong> for a stage, so you should use other activities of similar difficulty, for example from endorsed resources. What matters is that the learning objectives are taught well. How you group, order and teach them is your professional decision, within school expectations."}},{"t":"h","c":{"en":"Sequencing units","ar":"Sequencing units"}},{"t":"p","c":{"en":"The scheme of work gives \u003cem>suggested\u003c/em> units. The framework also says there is no requirement for endorsed textbooks to follow the teaching order of the schemes of work, and that if a resource is endorsed, all the learning objectives are covered. So more than one order is acceptable. These are good-practice questions for deciding an order (they are not Cambridge rules):","ar":"The scheme of work gives \u003cem>suggested\u003c/em> units. The framework also says there is no requirement for endorsed textbooks to follow the teaching order of the schemes of work, and that if a resource is endorsed, all the learning objectives are covered. So more than one order is acceptable. These are good-practice questions for deciding an order (they are not Cambridge rules):"}},{"t":"list","c":{"en":["\u003cstrong>Prerequisites:\u003c/strong> does this unit need something taught earlier? Place value (Np) and integers (Ni) usually come before algebra that uses negative numbers. Equivalent fractions come before ratio simplification.","\u003cstrong>Connections:\u003c/strong> the framework says the strands are interrelated and should be taught in conjunction with each other. A unit on scale drawings (Gp) can use ratio (Nf). A statistics investigation (Ss) can use percentages and fractions.","\u003cstrong>TWM:\u003c/strong> the framework says TWM should be embedded throughout the curriculum and not taught as a separate activity. So it belongs in every unit plan.","\u003cstrong>Assessment points:\u003c/strong> place units so that content is taught before the school's assessment dates, not after."],"ar":["\u003cstrong>Prerequisites:\u003c/strong> does this unit need something taught earlier? Place value (Np) and integers (Ni) usually come before algebra that uses negative numbers. Equivalent fractions come before ratio simplification.","\u003cstrong>Connections:\u003c/strong> the framework says the strands are interrelated and should be taught in conjunction with each other. A unit on scale drawings (Gp) can use ratio (Nf). A statistics investigation (Ss) can use percentages and fractions.","\u003cstrong>TWM:\u003c/strong> the framework says TWM should be embedded throughout the curriculum and not taught as a separate activity. So it belongs in every unit plan.","\u003cstrong>Assessment points:\u003c/strong> place units so that content is taught before the school's assessment dates, not after."]}},{"t":"h","c":{"en":"How much teaching time do we have?","ar":"How much teaching time do we have?"}},{"t":"p","c":{"en":"The framework gives guidance on time. Its words are: \"For guidance, this curriculum framework is based on learners having \u003cstrong>4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\u003c/strong>. Your actual number of teaching hours may vary according to your context.\" Notice three points. It is guidance, not a rule. It is the basis on which the framework was designed. And it says real hours vary. Your timetable and school calendar decide your real time. Plan from your own timetable and confirm it with your HOD.","ar":"The framework gives guidance on time. Its words are: \"For guidance, this curriculum framework is based on learners having \u003cstrong>4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\u003c/strong>. Your actual number of teaching hours may vary according to your context.\" Notice three points. It is guidance, not a rule. It is the basis on which the framework was designed. And it says real hours vary. Your timetable and school calendar decide your real time. Plan from your own timetable and confirm it with your HOD."}},{"t":"table","head":{"en":["Stage","Learning objectives counted (excluding the 8 TWM statements)","Guidance hours per stage","Simple average per objective"],"ar":["Stage","Learning objectives counted (excluding the 8 TWM statements)","Guidance hours per stage","Simple average per objective"]},"rows":[{"en":["Stage 7","63","120 to 150","about 1.9 to 2.4 hours"],"ar":["Stage 7","63","120 to 150","about 1.9 to 2.4 hours"]},{"en":["Stage 8","61","120 to 150","about 2.0 to 2.5 hours"],"ar":["Stage 8","61","120 to 150","about 2.0 to 2.5 hours"]},{"en":["Stage 9","55","120 to 150","about 2.2 to 2.7 hours"],"ar":["Stage 9","55","120 to 150","about 2.2 to 2.7 hours"]}]},{"t":"p","c":{"en":"The counts come from the objective lists in the framework. The last column is only simple division, not a recommended time per objective. Some objectives need far more time than others. For example, 8Ae.06 (solve equations with the unknown on either or both sides) needs much more time than 8Gg.03 (miles and kilometres). The table shows that time is limited, so every lesson must count.","ar":"The counts come from the objective lists in the framework. The last column is only simple division, not a recommended time per objective. Some objectives need far more time than others. For example, 8Ae.06 (solve equations with the unknown on either or both sides) needs much more time than 8Gg.03 (miles and kilometres). The table shows that time is limited, so every lesson must count."}},{"t":"scenario","title":{"en":"Scenario: two orders in one year group","ar":"Scenario: two orders in one year group"},"c":{"en":"Two Year 8 teachers plan the algebra unit. Teacher A follows the order in the Cambridge scheme of work. Teacher B follows the order of the school textbook, which teaches changing the subject of a formula (8Ae.05) before solving equations with unknowns on both sides (8Ae.06). Both say they are \"following Cambridge\". \u003cstrong>What should the HOD say?\u003c/strong> Both orders can be acceptable, because the framework does not require the scheme of work order. But the department should agree one order, or agree why they differ, so that all classes are ready for the same assessments and prerequisites are respected. The HOD should also check that every objective in the stage is covered by one route or the other.","ar":"Two Year 8 teachers plan the algebra unit. Teacher A follows the order in the Cambridge scheme of work. Teacher B follows the order of the school textbook, which teaches changing the subject of a formula (8Ae.05) before solving equations with unknowns on both sides (8Ae.06). Both say they are \"following Cambridge\". \u003cstrong>What should the HOD say?\u003c/strong> Both orders can be acceptable, because the framework does not require the scheme of work order. But the department should agree one order, or agree why they differ, so that all classes are ready for the same assessments and prerequisites are respected. The HOD should also check that every objective in the stage is covered by one route or the other."}}],"checks":[{"id":"m1q1","q":{"en":"A teacher reads the code 9Ss.04. What does the \"Ss\" part tell her?","ar":"A teacher reads the code 9Ss.04. What does the \"Ss\" part tell her?"},"opts":[{"en":"It is the reporting code for the sub-strand Statistics, which appears in the feedback reports for tests","ar":"It is the reporting code for the sub-strand Statistics, which appears in the feedback reports for tests"},{"en":"It is the number of the objective inside its sub-strand, in the order of teaching for that stage","ar":"It is the number of the objective inside its sub-strand, in the order of teaching for that stage"},{"en":"It shows that the objective is a Thinking and Working Mathematically statement for Stage 9","ar":"It shows that the objective is a Thinking and Working Mathematically statement for Stage 9"},{"en":"It is the code for the strand Statistics and Probability, so it also covers every probability objective","ar":"It is the code for the strand Statistics and Probability, so it also covers every probability objective"}],"correct":0,"expl":{"en":"The framework says each code has the stage number, a reporting code that reflects the sub-strand title (here Ss, Statistics) and a number showing the order in the sub-strand. Probability has its own reporting code, Sp.","ar":"The framework says each code has the stage number, a reporting code that reflects the sub-strand title (here Ss, Statistics) and a number showing the order in the sub-strand. Probability has its own reporting code, Sp."}},{"id":"m1q2","q":{"en":"What does the framework say about using the ideas in the Cambridge schemes of work?","ar":"What does the framework say about using the ideas in the Cambridge schemes of work?"},"opts":[{"en":"You must use them in the suggested order so that learners are ready for Cambridge assessments","ar":"You must use them in the suggested order so that learners are ready for Cambridge assessments"},{"en":"You do not need to use them to teach, and they are not designed to fill all the teaching time","ar":"You do not need to use them to teach, and they are not designed to fill all the teaching time"},{"en":"They are compulsory in Stage 7 but become optional in Stages 8 and 9 of the programme","ar":"They are compulsory in Stage 7 but become optional in Stages 8 and 9 of the programme"},{"en":"You may use them only if the school has bought the matching endorsed textbooks for each stage","ar":"You may use them only if the school has bought the matching endorsed textbooks for each stage"}],"correct":1,"expl":{"en":"The framework says you do not need to use the ideas in the schemes of work. It adds that they show types of activity and the intended depth and breadth, and that you should use other activities of similar difficulty for the remaining time.","ar":"The framework says you do not need to use the ideas in the schemes of work. It adds that they show types of activity and the intended depth and breadth, and that you should use other activities of similar difficulty for the remaining time."}},{"id":"m1q3","q":{"en":"Which sentence best matches the framework's guidance on teaching time?","ar":"Which sentence best matches the framework's guidance on teaching time?"},"opts":[{"en":"Every stage must be given exactly 5 hours of Mathematics each week for the whole school year","ar":"Every stage must be given exactly 5 hours of Mathematics each week for the whole school year"},{"en":"The framework is based on 4 to 5 hours per week, and schools with fewer hours must remove objectives","ar":"The framework is based on 4 to 5 hours per week, and schools with fewer hours must remove objectives"},{"en":"It assumes 4 to 5 hours per week (about 120 to 150 hours per stage), and real hours may vary","ar":"It assumes 4 to 5 hours per week (about 120 to 150 hours per stage), and real hours may vary"},{"en":"The framework is based on 2 to 3 hours per week, about 60 to 90 hours in each of the three stages","ar":"The framework is based on 2 to 3 hours per week, about 60 to 90 hours in each of the three stages"}],"correct":2,"expl":{"en":"The framework says it is based on learners having 4 to 5 hours of Mathematics per week (about 120 to 150 hours per stage) and that your actual number of teaching hours may vary according to your context.","ar":"The framework says it is based on learners having 4 to 5 hours of Mathematics per week (about 120 to 150 hours per stage) and that your actual number of teaching hours may vary according to your context."}}]},{"id":"m2","title":{"en":"Teaching Approaches in the Framework","ar":"Teaching Approaches in the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Many learners can follow a method on the board but cannot say why it works. The framework describes this when it explains Thinking and Working Mathematically: learners who do not think and work mathematically \"can carry out processes that their teacher has shown them, but they may not understand why the processes work or what the results mean\". The framework's Overview of teaching approaches is short, but it contains clear messages about how it expects mathematics to be taught. This module reads those messages one by one and shows what each could look like in a Year 7 to 9 classroom.","ar":"Many learners can follow a method on the board but cannot say why it works. The framework describes this when it explains Thinking and Working Mathematically: learners who do not think and work mathematically \"can carry out processes that their teacher has shown them, but they may not understand why the processes work or what the results mean\". The framework's Overview of teaching approaches is short, but it contains clear messages about how it expects mathematics to be taught. This module reads those messages one by one and shows what each could look like in a Year 7 to 9 classroom."}},{"t":"h","c":{"en":"What the Overview of teaching approaches says","ar":"What the Overview of teaching approaches says"}},{"t":"list","c":{"en":["\u003cstrong>Active learning.\u003c/strong> Cambridge advocates an active learning approach where teaching and learning is student-centred, so that it aligns with the experiences and needs of individuals.","\u003cstrong>Individual and collaborative work.\u003c/strong> Learners are encouraged to work both individually and collaboratively to find solutions to mathematical problems.","\u003cstrong>Thinking and Working Mathematically (TWM).\u003c/strong> Learners try to make sense of ideas and build connections between facts, procedures and concepts. \"Practice, reflection and questioning will help them to improve.\"","\u003cstrong>Embedded, not separate.\u003c/strong> TWM should not be taught as a separate special activity but embedded throughout the curriculum.","\u003cstrong>Mental strategies.\u003c/strong> They are important and \"at the core\" of understanding, but the curriculum does not require learners to follow or practise specific strategies.","\u003cstrong>Strands taught together.\u003c/strong> The strands are interrelated and should be taught in conjunction with each other.","\u003cstrong>Technology.\u003c/strong> One aim is that learners understand technology as a powerful way of communicating mathematics. Geometry and Measure mentions using a ruler and compass or digital technology to construct shapes."],"ar":["\u003cstrong>Active learning.\u003c/strong> Cambridge advocates an active learning approach where teaching and learning is student-centred, so that it aligns with the experiences and needs of individuals.","\u003cstrong>Individual and collaborative work.\u003c/strong> Learners are encouraged to work both individually and collaboratively to find solutions to mathematical problems.","\u003cstrong>Thinking and Working Mathematically (TWM).\u003c/strong> Learners try to make sense of ideas and build connections between facts, procedures and concepts. \"Practice, reflection and questioning will help them to improve.\"","\u003cstrong>Embedded, not separate.\u003c/strong> TWM should not be taught as a separate special activity but embedded throughout the curriculum.","\u003cstrong>Mental strategies.\u003c/strong> They are important and \"at the core\" of understanding, but the curriculum does not require learners to follow or practise specific strategies.","\u003cstrong>Strands taught together.\u003c/strong> The strands are interrelated and should be taught in conjunction with each other.","\u003cstrong>Technology.\u003c/strong> One aim is that learners understand technology as a powerful way of communicating mathematics. Geometry and Measure mentions using a ruler and compass or digital technology to construct shapes."]}},{"t":"callout","k":"tip","title":{"en":"Read the verbs","ar":"Read the verbs"},"c":{"en":"The framework uses active verbs for learners: they \u003cem>engage\u003c/em>, \u003cem>try to make sense\u003c/em>, \u003cem>build connections\u003c/em>, \u003cem>talk\u003c/em>, \u003cem>challenge ideas\u003c/em> and \u003cem>provide evidence\u003c/em>. Ask yourself in each lesson: which of these verbs did my learners do? If the answer is only \"copy\" and \"calculate\", the lesson did not use the approach the framework describes.","ar":"The framework uses active verbs for learners: they \u003cem>engage\u003c/em>, \u003cem>try to make sense\u003c/em>, \u003cem>build connections\u003c/em>, \u003cem>talk\u003c/em>, \u003cem>challenge ideas\u003c/em> and \u003cem>provide evidence\u003c/em>. Ask yourself in each lesson: which of these verbs did my learners do? If the answer is only \"copy\" and \"calculate\", the lesson did not use the approach the framework describes."}},{"t":"h","c":{"en":"Student-centred does not mean teacher-free","ar":"Student-centred does not mean teacher-free"}},{"t":"p","c":{"en":"Some teachers worry that \"student-centred\" means the teacher says less and learners are left alone. That is not what the framework says, and it is not good practice. A student-centred lesson is carefully designed by the teacher. The teacher chooses the task, anticipates what learners will say, listens, asks the next question and decides when to explain. The difference is where most of the thinking happens. In a teacher-centred lesson the teacher does most of the thinking and the learners follow. In a student-centred lesson the learners do most of the thinking and the teacher guides.","ar":"Some teachers worry that \"student-centred\" means the teacher says less and learners are left alone. That is not what the framework says, and it is not good practice. A student-centred lesson is carefully designed by the teacher. The teacher chooses the task, anticipates what learners will say, listens, asks the next question and decides when to explain. The difference is where most of the thinking happens. In a teacher-centred lesson the teacher does most of the thinking and the learners follow. In a student-centred lesson the learners do most of the thinking and the teacher guides."}},{"t":"table","head":{"en":["Feature","Mostly teacher-centred","Mostly student-centred (as the framework describes)"],"ar":["Feature","Mostly teacher-centred","Mostly student-centred (as the framework describes)"]},"rows":[{"en":["Start of lesson","Teacher states and demonstrates the method","Teacher gives a problem or example set; learners try it first, then share ideas"],"ar":["Start of lesson","Teacher states and demonstrates the method","Teacher gives a problem or example set; learners try it first, then share ideas"]},{"en":["Who talks","Teacher explains; learners answer short questions","Learners explain, question and challenge each other; teacher listens and prompts"],"ar":["Who talks","Teacher explains; learners answer short questions","Learners explain, question and challenge each other; teacher listens and prompts"]},{"en":["Worked examples","Teacher works examples; learners copy the steps","Learners compare two methods or find the error in a worked example before the teacher draws ideas together"],"ar":["Worked examples","Teacher works examples; learners copy the steps","Learners compare two methods or find the error in a worked example before the teacher draws ideas together"]},{"en":["Practice","Twenty similar questions","A short fluency set, then varied questions that need decisions and reasons"],"ar":["Practice","Twenty similar questions","A short fluency set, then varied questions that need decisions and reasons"]},{"en":["End of lesson","Teacher sets homework","Learners say what they learned and what is still unclear"],"ar":["End of lesson","Teacher sets homework","Learners say what they learned and what is still unclear"]}]},{"t":"p","c":{"en":"Good practice is a balance. A new method, a convention or a safe procedure (for example, how to use a protractor) often needs clear teacher modelling. The aim is not to remove explanation. The aim is that explanation comes at the right moment, after learners have something to explain.","ar":"Good practice is a balance. A new method, a convention or a safe procedure (for example, how to use a protractor) often needs clear teacher modelling. The aim is not to remove explanation. The aim is that explanation comes at the right moment, after learners have something to explain."}},{"t":"h","c":{"en":"A lesson shape that fits the approach (good practice)","ar":"A lesson shape that fits the approach (good practice)"}},{"t":"p","c":{"en":"The framework does not prescribe a lesson structure. The shape below is one good-practice way to build the approach into a 60-minute lesson with 28 learners. The timings are only a guide.","ar":"The framework does not prescribe a lesson structure. The shape below is one good-practice way to build the approach into a 60-minute lesson with 28 learners. The timings are only a guide."}},{"t":"steps","c":{"en":["\u003cstrong>Retrieve and warm up (5 to 8 minutes).\u003c/strong> Three quick questions on earlier objectives, using mini whiteboards. This checks prerequisites and keeps fluency alive.","\u003cstrong>Launch a problem (5 minutes).\u003c/strong> A short, rich task linked to the objective. The teacher checks that everyone understands the question, including the English words.","\u003cstrong>Explore in pairs or threes (12 to 15 minutes).\u003c/strong> Learners try, draw, test examples and disagree. The teacher walks around, listens and notes ideas to use later.","\u003cstrong>Discuss and draw ideas together (10 minutes).\u003c/strong> Chosen learners share. The teacher compares methods, names the key vocabulary and states the formal method or rule where needed.","\u003cstrong>Practise (10 to 12 minutes).\u003c/strong> Individual work, starting with fluency and moving to reasoning questions.","\u003cstrong>Reflect and check (5 minutes).\u003c/strong> One question on the objective that every learner answers alone, then a sentence: \"Today I learned... I am still not sure about...\""],"ar":["\u003cstrong>Retrieve and warm up (5 to 8 minutes).\u003c/strong> Three quick questions on earlier objectives, using mini whiteboards. This checks prerequisites and keeps fluency alive.","\u003cstrong>Launch a problem (5 minutes).\u003c/strong> A short, rich task linked to the objective. The teacher checks that everyone understands the question, including the English words.","\u003cstrong>Explore in pairs or threes (12 to 15 minutes).\u003c/strong> Learners try, draw, test examples and disagree. The teacher walks around, listens and notes ideas to use later.","\u003cstrong>Discuss and draw ideas together (10 minutes).\u003c/strong> Chosen learners share. The teacher compares methods, names the key vocabulary and states the formal method or rule where needed.","\u003cstrong>Practise (10 to 12 minutes).\u003c/strong> Individual work, starting with fluency and moving to reasoning questions.","\u003cstrong>Reflect and check (5 minutes).\u003c/strong> One question on the objective that every learner answers alone, then a sentence: \"Today I learned... I am still not sure about...\""]}},{"t":"h","c":{"en":"Collaborative work: making it real","ar":"Collaborative work: making it real"}},{"t":"p","c":{"en":"Group work is easy to write in a plan and hard to run well. Good practice for a class of 25 to 30 learners with mixed ability and varied English levels:","ar":"Group work is easy to write in a plan and hard to run well. Good practice for a class of 25 to 30 learners with mixed ability and varied English levels:"}},{"t":"list","c":{"en":["\u003cstrong>Give every learner a job.\u003c/strong> For example: one reads the task aloud, one records, one checks the units, one reports back. Rotate the roles.","\u003cstrong>Think alone first.\u003c/strong> Give 1 to 2 minutes of silent thinking before pair talk, so that stronger learners do not do all the thinking.","\u003cstrong>Ask for one agreed answer with a reason.\u003c/strong> This makes the group argue and justify, which is the heart of \u003cem>convincing\u003c/em> in TWM.","\u003cstrong>Use mixed-ability groups for exploration and similar-ability groups for targeted support.\u003c/strong> Change the grouping to suit the purpose.","\u003cstrong>Plan the language.\u003c/strong> Give sentence starters such as \"I think... because...\" and \"I disagree because...\" (see Module 5)."],"ar":["\u003cstrong>Give every learner a job.\u003c/strong> For example: one reads the task aloud, one records, one checks the units, one reports back. Rotate the roles.","\u003cstrong>Think alone first.\u003c/strong> Give 1 to 2 minutes of silent thinking before pair talk, so that stronger learners do not do all the thinking.","\u003cstrong>Ask for one agreed answer with a reason.\u003c/strong> This makes the group argue and justify, which is the heart of \u003cem>convincing\u003c/em> in TWM.","\u003cstrong>Use mixed-ability groups for exploration and similar-ability groups for targeted support.\u003c/strong> Change the grouping to suit the purpose.","\u003cstrong>Plan the language.\u003c/strong> Give sentence starters such as \"I think... because...\" and \"I disagree because...\" (see Module 5)."]}},{"t":"h","c":{"en":"Mental strategies: what the framework does and does not say","ar":"Mental strategies: what the framework does and does not say"}},{"t":"p","c":{"en":"The framework says mental strategies are important and at the core of developing understanding. It also says the curriculum \u003cem>does not require\u003c/em> learners to follow or practise specific strategies, so that learners see mental strategies as a more personal and less formal choice and have ownership over the ones they develop. The Number strand description also says learners are encouraged to use mental strategies to \u003cstrong>estimate before formally calculating\u003c/strong>. Many objectives start with the word \"estimate\", for example 7Ni.01, 7Nf.03 and 8Nf.07.","ar":"The framework says mental strategies are important and at the core of developing understanding. It also says the curriculum \u003cem>does not require\u003c/em> learners to follow or practise specific strategies, so that learners see mental strategies as a more personal and less formal choice and have ownership over the ones they develop. The Number strand description also says learners are encouraged to use mental strategies to \u003cstrong>estimate before formally calculating\u003c/strong>. Many objectives start with the word \"estimate\", for example 7Ni.01, 7Nf.03 and 8Nf.07."}},{"t":"scenario","title":{"en":"Worked example: one calculation, three mental strategies","ar":"Worked example: one calculation, three mental strategies"},"c":{"en":"A Year 7 class works on 7Nf.08, \u003cem>estimate, multiply and divide decimals by whole numbers\u003c/em>. The teacher writes 4.8 × 5 and asks, \"How could you work this out in your head?\" Learner A says: \"Half of 4.8 is 2.4, and times ten is 24.\" Learner B says: \"4 fives are 20, and 0.8 of 5 is 4, so 24.\" Learner C says: \"5 times 5 is 25, take away 5 times 0.2, which is 1, so 24.\" The framework does not ask the teacher to pick one method as the only correct one. The teacher can ask: \"Which method is easiest for these numbers? Would it work for 4.8 × 6? Why?\" This links to \u003cem>critiquing\u003c/em> and \u003cem>improving\u003c/em> in TWM. The teacher also makes sure that every learner can use at least one reliable strategy, because choice is only useful if you have something to choose from.","ar":"A Year 7 class works on 7Nf.08, \u003cem>estimate, multiply and divide decimals by whole numbers\u003c/em>. The teacher writes 4.8 × 5 and asks, \"How could you work this out in your head?\" Learner A says: \"Half of 4.8 is 2.4, and times ten is 24.\" Learner B says: \"4 fives are 20, and 0.8 of 5 is 4, so 24.\" Learner C says: \"5 times 5 is 25, take away 5 times 0.2, which is 1, so 24.\" The framework does not ask the teacher to pick one method as the only correct one. The teacher can ask: \"Which method is easiest for these numbers? Would it work for 4.8 × 6? Why?\" This links to \u003cem>critiquing\u003c/em> and \u003cem>improving\u003c/em> in TWM. The teacher also makes sure that every learner can use at least one reliable strategy, because choice is only useful if you have something to choose from."}},{"t":"h","c":{"en":"Using endorsed resources and other activities","ar":"Using endorsed resources and other activities"}},{"t":"p","c":{"en":"The framework explains that Cambridge works with publishers to provide endorsed resources and encourages varied approaches. It says that if a resource is endorsed, you can be confident that all the learning objectives are covered. A textbook is a resource, not a curriculum. If your textbook gives only routine questions, add reasoning tasks. The scheme of work also gives links to NRICH activities for enrichment. Choose any extra activity by asking: which objective does it serve, and which TWM characteristic does it use?","ar":"The framework explains that Cambridge works with publishers to provide endorsed resources and encourages varied approaches. It says that if a resource is endorsed, you can be confident that all the learning objectives are covered. A textbook is a resource, not a curriculum. If your textbook gives only routine questions, add reasoning tasks. The scheme of work also gives links to NRICH activities for enrichment. Choose any extra activity by asking: which objective does it serve, and which TWM characteristic does it use?"}},{"t":"callout","k":"warn","title":{"en":"Common mistake","ar":"Common mistake"},"c":{"en":"Teachers sometimes describe the approach as \"we do group work on Fridays\" or \"we do TWM in the last week of term\". The framework says TWM should be embedded throughout the curriculum and not taught as a separate special activity. A weekly investigation lesson, with ordinary lessons staying teacher-led, does not match this.","ar":"Teachers sometimes describe the approach as \"we do group work on Fridays\" or \"we do TWM in the last week of term\". The framework says TWM should be embedded throughout the curriculum and not taught as a separate special activity. A weekly investigation lesson, with ordinary lessons staying teacher-led, does not match this."}}],"checks":[{"id":"m2q1","q":{"en":"Which statement about the framework's teaching approach is accurate?","ar":"Which statement about the framework's teaching approach is accurate?"},"opts":[{"en":"Cambridge requires teachers to deliver every topic through whole-class demonstration followed by individual exercises","ar":"Cambridge requires teachers to deliver every topic through whole-class demonstration followed by individual exercises"},{"en":"Cambridge asks for collaborative work only in Stage 7 and for independent exercises in Stages 8 and 9","ar":"Cambridge asks for collaborative work only in Stage 7 and for independent exercises in Stages 8 and 9"},{"en":"Cambridge recommends that learners work only in pairs so that the teacher can mark each solution quickly","ar":"Cambridge recommends that learners work only in pairs so that the teacher can mark each solution quickly"},{"en":"Cambridge advocates student-centred active learning, with learners working individually and collaboratively","ar":"Cambridge advocates student-centred active learning, with learners working individually and collaboratively"}],"correct":3,"expl":{"en":"The Overview of teaching approaches says Cambridge advocates an active learning approach that is student-centred and that learners are encouraged to work both individually and collaboratively.","ar":"The Overview of teaching approaches says Cambridge advocates an active learning approach that is student-centred and that learners are encouraged to work both individually and collaboratively."}},{"id":"m2q2","q":{"en":"What does the framework say about teaching mental strategies?","ar":"What does the framework say about teaching mental strategies?"},"opts":[{"en":"They are important, but the curriculum does not require learners to practise specific strategies","ar":"They are important, but the curriculum does not require learners to practise specific strategies"},{"en":"Every learner must practise the same three mental strategies in each stage and be tested on them","ar":"Every learner must practise the same three mental strategies in each stage and be tested on them"},{"en":"They are not important, because learners should use only formal written methods to be accurate","ar":"They are not important, because learners should use only formal written methods to be accurate"},{"en":"Teachers must choose one strategy for each operation and teach it before any other method is shown","ar":"Teachers must choose one strategy for each operation and teach it before any other method is shown"}],"correct":0,"expl":{"en":"The framework says mental strategies are at the core of understanding but that the curriculum does not require specific strategies, so learners can see them as a personal and less formal choice.","ar":"The framework says mental strategies are at the core of understanding but that the curriculum does not require specific strategies, so learners can see them as a personal and less formal choice."}},{"id":"m2q3","q":{"en":"A teacher says, \"We will do Thinking and Working Mathematically in a special investigation lesson every Friday.\" What does the framework say?","ar":"A teacher says, \"We will do Thinking and Working Mathematically in a special investigation lesson every Friday.\" What does the framework say?"},"opts":[{"en":"That is the recommended pattern, because TWM needs its own lesson time in every school week","ar":"That is the recommended pattern, because TWM needs its own lesson time in every school week"},{"en":"TWM should not be a separate special activity but embedded throughout the curriculum","ar":"TWM should not be a separate special activity but embedded throughout the curriculum"},{"en":"TWM is an independent fifth strand, so it should have its own units and its own assessment","ar":"TWM is an independent fifth strand, so it should have its own units and its own assessment"},{"en":"TWM is only for Stage 9, so Friday lessons should be used for it only in that stage","ar":"TWM is only for Stage 9, so Friday lessons should be used for it only in that stage"}],"correct":1,"expl":{"en":"The framework says TWM is not an independent strand and should be embedded within and across the other strands, not taught as a separate special activity.","ar":"The framework says TWM is not an independent strand and should be embedded within and across the other strands, not taught as a separate special activity."}}]},{"id":"m3","title":{"en":"Embedding Thinking and Working Mathematically in Lessons","ar":"Embedding Thinking and Working Mathematically in Lessons"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Part A introduced the eight Thinking and Working Mathematically (TWM) characteristics, in four pairs: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. The framework says they are intertwined and interdependent, and that a high-quality mathematics task may draw on one or more of them. It also says they provide \u003cstrong>the language required to make decisions\u003c/strong> about what mathematical knowledge, procedures and strategies might be used. This module is about the practical question: \u003cem>how do I make this happen on an ordinary Tuesday?\u003c/em>","ar":"Part A introduced the eight Thinking and Working Mathematically (TWM) characteristics, in four pairs: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. The framework says they are intertwined and interdependent, and that a high-quality mathematics task may draw on one or more of them. It also says they provide \u003cstrong>the language required to make decisions\u003c/strong> about what mathematical knowledge, procedures and strategies might be used. This module is about the practical question: \u003cem>how do I make this happen on an ordinary Tuesday?\u003c/em>"}},{"t":"p","c":{"en":"The framework's TWM statements are coded TWM.01 to TWM.08 and appear at the start of every stage. They are the same in Stages 7, 8 and 9. What changes from stage to stage is the mathematics the learners think about, and how independent and precise their reasoning becomes (good practice).","ar":"The framework's TWM statements are coded TWM.01 to TWM.08 and appear at the start of every stage. They are the same in Stages 7, 8 and 9. What changes from stage to stage is the mathematics the learners think about, and how independent and precise their reasoning becomes (good practice)."}},{"t":"h","c":{"en":"The eight characteristics in the classroom","ar":"The eight characteristics in the classroom"}},{"t":"p","c":{"en":"The definitions in the second column are the framework's, shortened. The question stems in the third column are good practice, not framework text.","ar":"The definitions in the second column are the framework's, shortened. The question stems in the third column are good practice, not framework text."}},{"t":"table","head":{"en":["Characteristic","Framework definition (short)","Question stems you can use (good practice)"],"ar":["Characteristic","Framework definition (short)","Question stems you can use (good practice)"]},"rows":[{"en":["TWM.01 Specialising","Choosing an example and checking whether it meets mathematical criteria","Can you give an example? Does 12 work? Try a very small number and a very large one."],"ar":["TWM.01 Specialising","Choosing an example and checking whether it meets mathematical criteria","Can you give an example? Does 12 work? Try a very small number and a very large one."]},{"en":["TWM.02 Generalising","Recognising an underlying pattern from many examples that meet the same criteria","What do you notice? Will it always work? Can you describe the rule for any number?"],"ar":["TWM.02 Generalising","Recognising an underlying pattern from many examples that meet the same criteria","What do you notice? Will it always work? Can you describe the rule for any number?"]},{"en":["TWM.03 Conjecturing","Forming mathematical questions or ideas","What do you think will happen if...? What could we ask next? What would change if...?"],"ar":["TWM.03 Conjecturing","Forming mathematical questions or ideas","What do you think will happen if...? What could we ask next? What would change if...?"]},{"en":["TWM.04 Convincing","Presenting evidence to justify or challenge an idea or solution","How do you know? Can you convince a sceptic? Can you find a counter-example?"],"ar":["TWM.04 Convincing","Presenting evidence to justify or challenge an idea or solution","How do you know? Can you convince a sceptic? Can you find a counter-example?"]},{"en":["TWM.05 Characterising","Identifying and describing the mathematical properties of an object","What is always true about this shape, graph or number? What is the same and what is different?"],"ar":["TWM.05 Characterising","Identifying and describing the mathematical properties of an object","What is always true about this shape, graph or number? What is the same and what is different?"]},{"en":["TWM.06 Classifying","Organising objects into groups by mathematical properties","Can you sort these into groups? Is there another way to group them? Where does this one belong?"],"ar":["TWM.06 Classifying","Organising objects into groups by mathematical properties","Can you sort these into groups? Is there another way to group them? Where does this one belong?"]},{"en":["TWM.07 Critiquing","Comparing and evaluating ideas, representations or solutions for advantages and disadvantages","Which method is better here, and why? What is good about this solution? What is missing?"],"ar":["TWM.07 Critiquing","Comparing and evaluating ideas, representations or solutions for advantages and disadvantages","Which method is better here, and why? What is good about this solution? What is missing?"]},{"en":["TWM.08 Improving","Refining ideas or representations to find a more effective approach or solution","Can you make this clearer, shorter or more general? How would you change it for harder numbers?"],"ar":["TWM.08 Improving","Refining ideas or representations to find a more effective approach or solution","Can you make this clearer, shorter or more general? How would you change it for harder numbers?"]}]},{"t":"h","c":{"en":"Task design: from closed to open","ar":"Task design: from closed to open"}},{"t":"p","c":{"en":"A task develops TWM when learners must make a decision, test an idea or give a reason. Many textbook questions can be made richer with small changes. The changes below are good practice. In each case the mathematics still serves the framework objective, and the task can be used for the whole class.","ar":"A task develops TWM when learners must make a decision, test an idea or give a reason. Many textbook questions can be made richer with small changes. The changes below are good practice. In each case the mathematics still serves the framework objective, and the task can be used for the whole class."}},{"t":"table","head":{"en":["Closed question (objective)","Richer version","TWM characteristics used"],"ar":["Closed question (objective)","Richer version","TWM characteristics used"]},"rows":[{"en":["Simplify 3(x + 4). (7Ae.03, distributive law with a constant)","Zara says 3(x + 4) = 3x + 4. Try x = 1, x = 2 and x = 10. Is she right? How can you convince her?","Specialising, Convincing, Critiquing"],"ar":["Simplify 3(x + 4). (7Ae.03, distributive law with a constant)","Zara says 3(x + 4) = 3x + 4. Try x = 1, x = 2 and x = 10. Is she right? How can you convince her?","Specialising, Convincing, Critiquing"]},{"en":["Find the missing angle in this triangle. (8Gg.10, exterior angle of a triangle)","Draw any triangle and extend one side. Measure the exterior angle and the two opposite interior angles. What do you notice? Will it always be true?","Specialising, Generalising, Conjecturing"],"ar":["Find the missing angle in this triangle. (8Gg.10, exterior angle of a triangle)","Draw any triangle and extend one side. Measure the exterior angle and the two opposite interior angles. What do you notice? Will it always be true?","Specialising, Generalising, Conjecturing"]},{"en":["Calculate the mean of this data. (7Ss.04, mode, median, mean and range)","Here are two sets of data with the same mean and different ranges. Which set would you use to advertise a new bus service? Why?","Characterising, Critiquing, Convincing"],"ar":["Calculate the mean of this data. (7Ss.04, mode, median, mean and range)","Here are two sets of data with the same mean and different ranges. Which set would you use to advertise a new bus service? Why?","Characterising, Critiquing, Convincing"]},{"en":["Work out the sum of the interior angles of a hexagon. (9Gg.07)","Find the angle sums of a triangle, quadrilateral, pentagon and hexagon. What is the pattern? Write a rule for a polygon with n sides, then explain why it works.","Specialising, Generalising, Convincing"],"ar":["Work out the sum of the interior angles of a hexagon. (9Gg.07)","Find the angle sums of a triangle, quadrilateral, pentagon and hexagon. What is the pattern? Write a rule for a polygon with n sides, then explain why it works.","Specialising, Generalising, Convincing"]},{"en":["Draw all the quadrilaterals. (8Gg.01, hierarchy of quadrilaterals)","Sort these eight shapes into groups of your choice. Now sort them by a different property. Can a square also be a rectangle?","Characterising, Classifying"],"ar":["Draw all the quadrilaterals. (8Gg.01, hierarchy of quadrilaterals)","Sort these eight shapes into groups of your choice. Now sort them by a different property. Can a square also be a rectangle?","Characterising, Classifying"]}]},{"t":"scenario","title":{"en":"Worked example: one lesson on 7Ae.03 with TWM built in","ar":"Worked example: one lesson on 7Ae.03 with TWM built in"},"c":{"en":"\u003cstrong>Objective:\u003c/strong> 7Ae.03, collect like terms and apply the distributive law with a constant. \u003cstrong>Launch (5 min):\u003c/strong> Write \"3(x + 4) = 3x + 4\" on the board. Ask, \"True or false? Discuss with your partner for one minute.\" \u003cstrong>Explore (12 min):\u003c/strong> Pairs choose values of x and test both sides in a table. They find that the sides are equal only when x = 0, so the statement is not always true. This is \u003cem>specialising\u003c/em>. \u003cstrong>Discuss (10 min):\u003c/strong> The teacher asks for a \u003cem>convincing\u003c/em> argument. One pair draws a rectangle with sides 3 and (x + 4), split into 3 by x and 3 by 4. The class sees that the area is 3x + 12. This is a representation that makes the rule visible. \u003cstrong>Improve (5 min):\u003c/strong> \"Write the correct statement. Now write a rule for a(x + b).\" That is \u003cem>generalising\u003c/em> and \u003cem>improving\u003c/em>. \u003cstrong>Practise (15 min):\u003c/strong> Fluency questions first, then two \"true or false and why?\" statements. \u003cstrong>Check (5 min):\u003c/strong> One question each on a mini whiteboard. Notice that the teacher did not skip the content. The same objective is taught, but learners do the thinking.","ar":"\u003cstrong>Objective:\u003c/strong> 7Ae.03, collect like terms and apply the distributive law with a constant. \u003cstrong>Launch (5 min):\u003c/strong> Write \"3(x + 4) = 3x + 4\" on the board. Ask, \"True or false? Discuss with your partner for one minute.\" \u003cstrong>Explore (12 min):\u003c/strong> Pairs choose values of x and test both sides in a table. They find that the sides are equal only when x = 0, so the statement is not always true. This is \u003cem>specialising\u003c/em>. \u003cstrong>Discuss (10 min):\u003c/strong> The teacher asks for a \u003cem>convincing\u003c/em> argument. One pair draws a rectangle with sides 3 and (x + 4), split into 3 by x and 3 by 4. The class sees that the area is 3x + 12. This is a representation that makes the rule visible. \u003cstrong>Improve (5 min):\u003c/strong> \"Write the correct statement. Now write a rule for a(x + b).\" That is \u003cem>generalising\u003c/em> and \u003cem>improving\u003c/em>. \u003cstrong>Practise (15 min):\u003c/strong> Fluency questions first, then two \"true or false and why?\" statements. \u003cstrong>Check (5 min):\u003c/strong> One question each on a mini whiteboard. Notice that the teacher did not skip the content. The same objective is taught, but learners do the thinking."}},{"t":"h","c":{"en":"Questions that make thinking visible","ar":"Questions that make thinking visible"}},{"t":"p","c":{"en":"The framework says that practice, reflection and questioning help learners improve. Questioning is a teacher skill that can be practised. Good practice:","ar":"The framework says that practice, reflection and questioning help learners improve. Questioning is a teacher skill that can be practised. Good practice:"}},{"t":"list","c":{"en":["\u003cstrong>Ask \"how do you know?\" for correct answers too.\u003c/strong> If you only ask when an answer is wrong, learners learn that \"why?\" means \"you are wrong\".","\u003cstrong>Wait.\u003c/strong> Give 5 to 10 seconds of thinking time, or let learners talk in pairs first. This is especially important for ESL learners who are translating in their heads.","\u003cstrong>Use \"what if?\" and \"what is the same, what is different?\"\u003c/strong> These questions lead to generalising and classifying.","\u003cstrong>Ask learners to explain someone else's method.\u003c/strong> This is easier and safer than defending their own, and it develops critiquing.","\u003cstrong>Use wrong answers as a resource.\u003c/strong> Put a common error on the board and ask learners to find and explain the mistake.","\u003cstrong>Plan three questions in advance.\u003c/strong> Write them in the lesson plan: one to check the prerequisite, one to probe understanding, one to extend."],"ar":["\u003cstrong>Ask \"how do you know?\" for correct answers too.\u003c/strong> If you only ask when an answer is wrong, learners learn that \"why?\" means \"you are wrong\".","\u003cstrong>Wait.\u003c/strong> Give 5 to 10 seconds of thinking time, or let learners talk in pairs first. This is especially important for ESL learners who are translating in their heads.","\u003cstrong>Use \"what if?\" and \"what is the same, what is different?\"\u003c/strong> These questions lead to generalising and classifying.","\u003cstrong>Ask learners to explain someone else's method.\u003c/strong> This is easier and safer than defending their own, and it develops critiquing.","\u003cstrong>Use wrong answers as a resource.\u003c/strong> Put a common error on the board and ask learners to find and explain the mistake.","\u003cstrong>Plan three questions in advance.\u003c/strong> Write them in the lesson plan: one to check the prerequisite, one to probe understanding, one to extend."]}},{"t":"h","c":{"en":"Talk and reasoning with ESL learners","ar":"Talk and reasoning with ESL learners"}},{"t":"p","c":{"en":"The framework's aims include communicating solutions and ideas logically in spoken and written language, using appropriate symbols, diagrams and representations. For learners who are still developing English, reasoning can come before perfect language. Good practice:","ar":"The framework's aims include communicating solutions and ideas logically in spoken and written language, using appropriate symbols, diagrams and representations. For learners who are still developing English, reasoning can come before perfect language. Good practice:"}},{"t":"list","c":{"en":["Allow a diagram, a table or a worked example as part of an explanation. A drawing that shows why 3(x + 4) = 3x + 12 is mathematical reasoning.","Give sentence frames: \"I think ... because ...\", \"This is not always true because ... is a counter-example\", \"Method A is quicker because ...\".","Let learners rehearse in pairs, then say it to the group. The first attempt at an explanation should not be in front of 28 classmates.","Accept a short, correct reason before asking for a longer one. Build the length slowly."],"ar":["Allow a diagram, a table or a worked example as part of an explanation. A drawing that shows why 3(x + 4) = 3x + 12 is mathematical reasoning.","Give sentence frames: \"I think ... because ...\", \"This is not always true because ... is a counter-example\", \"Method A is quicker because ...\".","Let learners rehearse in pairs, then say it to the group. The first attempt at an explanation should not be in front of 28 classmates.","Accept a short, correct reason
