 before asking for a longer one. Build the length slowly."]}},{"t":"callout","k":"tip","title":{"en":"A three-level view of reasoning (good practice)","ar":"A three-level view of reasoning (good practice)"},"c":{"en":"When learners explain, listen for the level of reasoning. \u003cstrong>Level 1:\u003c/strong> a description (\"I added the numbers\"). \u003cstrong>Level 2:\u003c/strong> a reason for one case (\"It works for 12 because ...\"). \u003cstrong>Level 3:\u003c/strong> a reason for all cases (\"It works for any number because ...\"). Ask the next question to move learners up one level. This is not a Cambridge scale. It is a simple tool for planning your questions.","ar":"When learners explain, listen for the level of reasoning. \u003cstrong>Level 1:\u003c/strong> a description (\"I added the numbers\"). \u003cstrong>Level 2:\u003c/strong> a reason for one case (\"It works for 12 because ...\"). \u003cstrong>Level 3:\u003c/strong> a reason for all cases (\"It works for any number because ...\"). Ask the next question to move learners up one level. This is not a Cambridge scale. It is a simple tool for planning your questions."}},{"t":"scenario","title":{"en":"Scenario: \"Am I right?\"","ar":"Scenario: \"Am I right?\""},"c":{"en":"A Year 8 learner finishes a task early and asks, \"Is my answer right?\" The easy reply is \"Yes\" or \"No\". \u003cstrong>A better response\u003c/strong> is to turn the question back: \"How could you check it yourself? Can you convince your partner?\" Then ask for a second method or a check by substitution. This moves the authority from the teacher to the mathematics, which is the habit the framework describes when it says learners \"provide evidence that validates conjectures and solutions\". If the answer is wrong, a prompt such as \"Check the second step against your estimate\" lets the learner find the error.","ar":"A Year 8 learner finishes a task early and asks, \"Is my answer right?\" The easy reply is \"Yes\" or \"No\". \u003cstrong>A better response\u003c/strong> is to turn the question back: \"How could you check it yourself? Can you convince your partner?\" Then ask for a second method or a check by substitution. This moves the authority from the teacher to the mathematics, which is the habit the framework describes when it says learners \"provide evidence that validates conjectures and solutions\". If the answer is wrong, a prompt such as \"Check the second step against your estimate\" lets the learner find the error."}}],"checks":[{"id":"m3q1","q":{"en":"In the framework, which TWM characteristic is defined as \"presenting evidence to justify or challenge a mathematical idea or solution\"?","ar":"In the framework, which TWM characteristic is defined as \"presenting evidence to justify or challenge a mathematical idea or solution\"?"},"opts":[{"en":"Conjecturing","ar":"Conjecturing"},{"en":"Critiquing","ar":"Critiquing"},{"en":"Convincing","ar":"Convincing"},{"en":"Generalising","ar":"Generalising"}],"correct":2,"expl":{"en":"The framework defines Convincing as presenting evidence to justify or challenge an idea or solution. Conjecturing is forming mathematical questions or ideas; Critiquing is comparing and evaluating ideas; Generalising is recognising an underlying pattern.","ar":"The framework defines Convincing as presenting evidence to justify or challenge an idea or solution. Conjecturing is forming mathematical questions or ideas; Critiquing is comparing and evaluating ideas; Generalising is recognising an underlying pattern."}},{"id":"m3q2","q":{"en":"Which change turns the closed question \"Simplify 3(x + 4)\" into a task that builds TWM?","ar":"Which change turns the closed question \"Simplify 3(x + 4)\" into a task that builds TWM?"},"opts":[{"en":"Give twenty more expansions of the same type so that learners practise the procedure more times","ar":"Give twenty more expansions of the same type so that learners practise the procedure more times"},{"en":"Tell learners the rule first, then ask them to copy a worked example from the board","ar":"Tell learners the rule first, then ask them to copy a worked example from the board"},{"en":"Ask learners to expand the brackets as fast as they can and then mark the answers in class","ar":"Ask learners to expand the brackets as fast as they can and then mark the answers in class"},{"en":"Give a false statement, ask learners to test values, then convince a partner it is wrong","ar":"Give a false statement, ask learners to test values, then convince a partner it is wrong"}],"correct":3,"expl":{"en":"Testing values is specialising and giving evidence is convincing. The objective stays the same (7Ae.03), but learners decide, test and give reasons instead of only following steps.","ar":"Testing values is specialising and giving evidence is convincing. The objective stays the same (7Ae.03), but learners decide, test and give reasons instead of only following steps."}},{"id":"m3q3","q":{"en":"A learner explains: \"It works for 12 because 12 is even.\" What is the best next question to move the reasoning forward?","ar":"A learner explains: \"It works for 12 because 12 is even.\" What is the best next question to move the reasoning forward?"},"opts":[{"en":"Will it work for every even number, and can you explain why using an expression?","ar":"Will it work for every even number, and can you explain why using an expression?"},{"en":"Is 12 your favourite even number, or did you choose it to make the calculation easier?","ar":"Is 12 your favourite even number, or did you choose it to make the calculation easier?"},{"en":"Can you write the same sentence again in better English with the words you learned today?","ar":"Can you write the same sentence again in better English with the words you learned today?"},{"en":"Please sit down, and let us hear from a learner who has a different answer to yours.","ar":"Please sit down, and let us hear from a learner who has a different answer to yours."}],"correct":0,"expl":{"en":"The learner has given a reason for one case. A question about all cases moves toward generalising and convincing. The other replies do not develop the mathematical reasoning.","ar":"The learner has given a reason for one case. A question about all cases moves toward generalising and convincing. The other replies do not develop the mathematical reasoning."}}]},{"id":"m4","title":{"en":"Fluency, Algebraic Thinking, Problem Solving and Misconceptions","ar":"Fluency, Algebraic Thinking, Problem Solving and Misconceptions"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework wants learners to be both \u003cstrong>fluent\u003c/strong> and \u003cstrong>thoughtful\u003c/strong>. Its key benefits say learners become mathematically competent and fluent in computation which they can apply to everyday situations. One aim is to improve numerical fluency and knowledge of key mathematical concepts. At the same time, it says learners should seek to make sense of ideas. This module shows how to hold the two together, and how to deal with the errors that learners often make.","ar":"The framework wants learners to be both \u003cstrong>fluent\u003c/strong> and \u003cstrong>thoughtful\u003c/strong>. Its key benefits say learners become mathematically competent and fluent in computation which they can apply to everyday situations. One aim is to improve numerical fluency and knowledge of key mathematical concepts. At the same time, it says learners should seek to make sense of ideas. This module shows how to hold the two together, and how to deal with the errors that learners often make."}},{"t":"h","c":{"en":"Fluency: what the framework says","ar":"Fluency: what the framework says"}},{"t":"list","c":{"en":["The Number strand is \"the foundation of the mathematics curriculum\", and skills learned there are applied in the other strands.","Learners use the laws of arithmetic, order of operations, inverse operations and equivalence of fractions, decimals and percentages \u003cstrong>to simplify calculations\u003c/strong>.","Learners are encouraged to use mental strategies to \u003cstrong>estimate before formally calculating\u003c/strong> answers.","Many objectives begin with \"estimate\", for example 7Nf.02, 8Nf.07 and 9Nf.06."],"ar":["The Number strand is \"the foundation of the mathematics curriculum\", and skills learned there are applied in the other strands.","Learners use the laws of arithmetic, order of operations, inverse operations and equivalence of fractions, decimals and percentages \u003cstrong>to simplify calculations\u003c/strong>.","Learners are encouraged to use mental strategies to \u003cstrong>estimate before formally calculating\u003c/strong> answers.","Many objectives begin with \"estimate\", for example 7Nf.02, 8Nf.07 and 9Nf.06."]}},{"t":"p","c":{"en":"\u003cstrong>Calculators and written methods.\u003c/strong> The framework text does not give a rule about calculators, and it does not prescribe written methods for any operation. It does say that the curriculum does not require learners to follow specific mental strategies, and it says the aims include understanding technology as a way of communicating mathematics. Rules for calculator use in lessons and assessments are therefore not in this document. Check the Cambridge teacher guide and assessment information on the support site, and follow your school's and department's policy. A good-practice principle is to decide, for each task, which skill you are practising. If the objective is a calculation skill, such as 7Nf.08 (multiply and divide decimals by whole numbers), learners need to show it without a calculator. If the objective is about interpreting results or modelling, a calculator may be sensible. Always tell learners which one is expected.","ar":"\u003cstrong>Calculators and written methods.\u003c/strong> The framework text does not give a rule about calculators, and it does not prescribe written methods for any operation. It does say that the curriculum does not require learners to follow specific mental strategies, and it says the aims include understanding technology as a way of communicating mathematics. Rules for calculator use in lessons and assessments are therefore not in this document. Check the Cambridge teacher guide and assessment information on the support site, and follow your school's and department's policy. A good-practice principle is to decide, for each task, which skill you are practising. If the objective is a calculation skill, such as 7Nf.08 (multiply and divide decimals by whole numbers), learners need to show it without a calculator. If the objective is about interpreting results or modelling, a calculator may be sensible. Always tell learners which one is expected."}},{"t":"h","c":{"en":"Building fluency (good practice)","ar":"Building fluency (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Little and often.\u003c/strong> Five minutes of retrieval at the start of lessons is more effective than one long worksheet on Friday.","\u003cstrong>Fluency with understanding.\u003c/strong> Before learners practise 3/4 × 2/5 (7Nf.03), make sure they can explain, with a drawing, what the multiplication means. Then practise.","\u003cstrong>Estimate first.\u003c/strong> Make \"Is the answer bigger or smaller than 1? About how big?\" a routine. It catches many errors and matches the framework's emphasis.","\u003cstrong>Vary the practice.\u003c/strong> Change the numbers in a way that makes learners notice structure: 24 × 5, 2.4 × 5, 0.24 × 5.","\u003cstrong>Share strategies.\u003c/strong> Ask \"Who did it a different way?\" Learners add to their personal toolkit."],"ar":["\u003cstrong>Little and often.\u003c/strong> Five minutes of retrieval at the start of lessons is more effective than one long worksheet on Friday.","\u003cstrong>Fluency with understanding.\u003c/strong> Before learners practise 3/4 × 2/5 (7Nf.03), make sure they can explain, with a drawing, what the multiplication means. Then practise.","\u003cstrong>Estimate first.\u003c/strong> Make \"Is the answer bigger or smaller than 1? About how big?\" a routine. It catches many errors and matches the framework's emphasis.","\u003cstrong>Vary the practice.\u003c/strong> Change the numbers in a way that makes learners notice structure: 24 × 5, 2.4 × 5, 0.24 × 5.","\u003cstrong>Share strategies.\u003c/strong> Ask \"Who did it a different way?\" Learners add to their personal toolkit."]}},{"t":"h","c":{"en":"Algebraic thinking","ar":"Algebraic thinking"}},{"t":"p","c":{"en":"The framework says the Algebra strand builds on pre-algebra concepts in the primary stages to strengthen reasoning and the ability to find and generalise patterns and rules. Algebra is therefore not only symbol manipulation. It is a way of seeing structure. Three threads run through Stages 7 to 9:","ar":"The framework says the Algebra strand builds on pre-algebra concepts in the primary stages to strengthen reasoning and the ability to find and generalise patterns and rules. Algebra is therefore not only symbol manipulation. It is a way of seeing structure. Three threads run through Stages 7 to 9:"}},{"t":"table","head":{"en":["Thread","Stage 7","Stage 8","Stage 9"],"ar":["Thread","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Meaning of letters","7Ae.01: letters represent unknown numbers, variables or constants","8Ae.01: letters have different meanings in expressions, formulae and equations","9Ae.03: move between words and expressions, including squares, cubes and roots"],"ar":["Meaning of letters","7Ae.01: letters represent unknown numbers, variables or constants","8Ae.01: letters have different meanings in expressions, formulae and equations","9Ae.03: move between words and expressions, including squares, cubes and roots"]},{"en":["Moving between words and symbols","7Ae.04 to 7Ae.06: words to expression, formula, equation","8Ae.04 to 8Ae.06: with fractional coefficients, change the subject, unknowns on both sides","9Ae.03 to 9Ae.07: expression, formula, equation, simultaneous equations, inequalities"],"ar":["Moving between words and symbols","7Ae.04 to 7Ae.06: words to expression, formula, equation","8Ae.04 to 8Ae.06: with fractional coefficients, change the subject, unknowns on both sides","9Ae.03 to 9Ae.07: expression, formula, equation, simultaneous equations, inequalities"]},{"en":["Patterns and functions","7As.01 to 7As.03: term-to-term and nth term rules, simple functions","8As.01 to 8As.03: includes fractions and wider nth term forms","9As.01 to 9As.03: linear and quadratic sequences"],"ar":["Patterns and functions","7As.01 to 7As.03: term-to-term and nth term rules, simple functions","8As.01 to 8As.03: includes fractions and wider nth term forms","9As.01 to 9As.03: linear and quadratic sequences"]}]},{"t":"p","c":{"en":"The glossary helps with the first thread. It says that in 3x, the number 3 is a constant and x is a variable because it represents an unspecified number. If 3x = 12, then x is also an unknown number, because its value can be found (x = 4). So the same letter can be a variable in one context and an unknown in another. This is why 8Ae.01 matters: learners must see that the meaning of a letter depends on the situation.","ar":"The glossary helps with the first thread. It says that in 3x, the number 3 is a constant and x is a variable because it represents an unspecified number. If 3x = 12, then x is also an unknown number, because its value can be found (x = 4). So the same letter can be a variable in one context and an unknown in another. This is why 8Ae.01 matters: learners must see that the meaning of a letter depends on the situation."}},{"t":"callout","k":"tip","title":{"en":"Good practice: make structure visible","ar":"Good practice: make structure visible"},"c":{"en":"Use number patterns before letters: 5 + 5 + 5 = 3 × 5, 7 + 7 + 7 = 3 × 7, so n + n + n = 3n. Use area models for expanding brackets. Use balance or bar models for equations. Always ask learners to say the same idea in words, in a diagram and in symbols. This matches the objectives that ask learners to move between representations.","ar":"Use number patterns before letters: 5 + 5 + 5 = 3 × 5, 7 + 7 + 7 = 3 × 7, so n + n + n = 3n. Use area models for expanding brackets. Use balance or bar models for equations. Always ask learners to say the same idea in words, in a diagram and in symbols. This matches the objectives that ask learners to move between representations."}},{"t":"h","c":{"en":"Problem solving","ar":"Problem solving"}},{"t":"p","c":{"en":"The framework wants learners to solve new and unfamiliar problems (the \"Innovative\" learner) and to make informed choices using mathematics. Problem solving is not a separate topic. It is the use of TWM to decide what to do. A simple four-step routine can help learners who do not know where to begin (good practice, not a Cambridge scale):","ar":"The framework wants learners to solve new and unfamiliar problems (the \"Innovative\" learner) and to make informed choices using mathematics. Problem solving is not a separate topic. It is the use of TWM to decide what to do. A simple four-step routine can help learners who do not know where to begin (good practice, not a Cambridge scale):"}},{"t":"steps","c":{"en":["\u003cstrong>Understand.\u003c/strong> What is the question? What do I know? What do I need to find? Underline the key words and draw a diagram.","\u003cstrong>Plan.\u003c/strong> Which objective or idea might help? Estimate the answer. Try a simpler case.","\u003cstrong>Do.\u003c/strong> Work carefully, in steps, with units.","\u003cstrong>Check.\u003c/strong> Does the answer match my estimate? Does it make sense in the situation? Is there another way?"],"ar":["\u003cstrong>Understand.\u003c/strong> What is the question? What do I know? What do I need to find? Underline the key words and draw a diagram.","\u003cstrong>Plan.\u003c/strong> Which objective or idea might help? Estimate the answer. Try a simpler case.","\u003cstrong>Do.\u003c/strong> Work carefully, in steps, with units.","\u003cstrong>Check.\u003c/strong> Does the answer match my estimate? Does it make sense in the situation? Is there another way?"]}},{"t":"h","c":{"en":"Common misconceptions: finding and fixing them","ar":"Common misconceptions: finding and fixing them"}},{"t":"p","c":{"en":"The framework says that the scheme of work lists common misconceptions for each objective. The examples below are common in practice (good practice), linked to objective codes. A misconception is not carelessness. It is usually a sensible idea that works in one context and fails in another. Fixing it means confronting the idea with an example in which it fails, not repeating the rule.","ar":"The framework says that the scheme of work lists common misconceptions for each objective. The examples below are common in practice (good practice), linked to objective codes. A misconception is not carelessness. It is usually a sensible idea that works in one context and fails in another. Fixing it means confronting the idea with an example in which it fails, not repeating the rule."}},{"t":"table","head":{"en":["Misconception","Objective","Why learners think it","A way to address it (good practice)"],"ar":["Misconception","Objective","Why learners think it","A way to address it (good practice)"]},"rows":[{"en":["\"Multiplying always makes the number bigger.\"","7Nf.03 (multiply proper fractions)","Whole-number experience","Draw 1/2 of 1/3 on a bar. Ask, \"Is the answer bigger or smaller than 1/3? Why?\""],"ar":["\"Multiplying always makes the number bigger.\"","7Nf.03 (multiply proper fractions)","Whole-number experience","Draw 1/2 of 1/3 on a bar. Ask, \"Is the answer bigger or smaller than 1/3? Why?\""]},{"en":["\"0.35 is larger than 0.5 because 35 is larger than 5.\"","7Nf.06 (compare and order decimals)","Treating the digits after the point as a whole number","Place both on a number line from 0 to 1. Use equal-length decimals: 0.35 and 0.50."],"ar":["\"0.35 is larger than 0.5 because 35 is larger than 5.\"","7Nf.06 (compare and order decimals)","Treating the digits after the point as a whole number","Place both on a number line from 0 to 1. Use equal-length decimals: 0.35 and 0.50."]},{"en":["\"3x with x = 4 means 34.\"","7Ae.01, 7Ae.02","Letters next to numbers read like digits","Write 3x as 3 × x. Substitute with brackets: 3 × (4)."],"ar":["\"3x with x = 4 means 34.\"","7Ae.01, 7Ae.02","Letters next to numbers read like digits","Write 3x as 3 × x. Substitute with brackets: 3 × (4)."]},{"en":["\"-3 squared is -9.\"","8Ni.06 (squares of negative and positive numbers)","Calculators and order of operations confusion","Write (-3) × (-3) and -(3 × 3) side by side. Discuss what the brackets show."],"ar":["\"-3 squared is -9.\"","8Ni.06 (squares of negative and positive numbers)","Calculators and order of operations confusion","Write (-3) × (-3) and -(3 × 3) side by side. Discuss what the brackets show."]},{"en":["\"The = sign means 'work out the answer'.\"","7Ae.06 (equations)","Arithmetic practice with 3 + 4 = ?","Use balance models. Write 3 + 4 = 5 + 2 and ask whether it is true."],"ar":["\"The = sign means 'work out the answer'.\"","7Ae.06 (equations)","Arithmetic practice with 3 + 4 = ?","Use balance models. Write 3 + 4 = 5 + 2 and ask whether it is true."]},{"en":["\"A 10% increase followed by a 10% decrease returns to the start.\"","8Nf.05, 9Nf.05","Percentages seen as the same amount","Try 100: increase by 10% to 110, then decrease by 10% of 110. Compare."],"ar":["\"A 10% increase followed by a 10% decrease returns to the start.\"","8Nf.05, 9Nf.05","Percentages seen as the same amount","Try 100: increase by 10% to 110, then decrease by 10% of 110. Compare."]},{"en":["\"Pythagoras' theorem works for any triangle.\"","9Gg.10","Formula remembered without conditions","Test a right-angled and a non-right-angled triangle. Ask what is special about the first."],"ar":["\"Pythagoras' theorem works for any triangle.\"","9Gg.10","Formula remembered without conditions","Test a right-angled and a non-right-angled triangle. Ask what is special about the first."]},{"en":["\"The probability of rain tomorrow is 1/2 because it either rains or it does not.\"","7Sp.03 (equally likely outcomes)","Two outcomes seen as equally likely","Compare a coin with a weighted spinner. Ask when outcomes are equally likely."],"ar":["\"The probability of rain tomorrow is 1/2 because it either rains or it does not.\"","7Sp.03 (equally likely outcomes)","Two outcomes seen as equally likely","Compare a coin with a weighted spinner. Ask when outcomes are equally likely."]}]},{"t":"scenario","title":{"en":"Scenario: the same error in half the class","ar":"Scenario: the same error in half the class"},"c":{"en":"After a Year 7 quiz on 7Nf.06, twelve of 28 learners write that 0.4 is less than 0.35. Marking each paper with a tick or cross will not help. \u003cstrong>A better plan:\u003c/strong> (1) group the errors and identify the shared idea (\"longer decimal means larger\"); (2) tomorrow, start with two questions on mini whiteboards, \"Which is larger, 0.4 or 0.35?\" and \"Which is larger, 0.40 or 0.35?\"; (3) use a number line or money (40 fils and 35 fils) to confront the idea; (4) ask learners to explain why adding a zero does not change the value; (5) set a quick retrieval question next week to see if the idea has stayed. The whole-class response is faster than marking individually, and it works on the cause.","ar":"After a Year 7 quiz on 7Nf.06, twelve of 28 learners write that 0.4 is less than 0.35. Marking each paper with a tick or cross will not help. \u003cstrong>A better plan:\u003c/strong> (1) group the errors and identify the shared idea (\"longer decimal means larger\"); (2) tomorrow, start with two questions on mini whiteboards, \"Which is larger, 0.4 or 0.35?\" and \"Which is larger, 0.40 or 0.35?\"; (3) use a number line or money (40 fils and 35 fils) to confront the idea; (4) ask learners to explain why adding a zero does not change the value; (5) set a quick retrieval question next week to see if the idea has stayed. The whole-class response is faster than marking individually, and it works on the cause."}}],"checks":[{"id":"m4q1","q":{"en":"What does the framework say about the Number strand?","ar":"What does the framework say about the Number strand?"},"opts":[{"en":"It is taught only in Stage 7, after which learners use calculators for all number work","ar":"It is taught only in Stage 7, after which learners use calculators for all number work"},{"en":"It is the foundation of the curriculum, and its skills are applied in the other strands","ar":"It is the foundation of the curriculum, and its skills are applied in the other strands"},{"en":"It is the only strand in which Thinking and Working Mathematically should be taught","ar":"It is the only strand in which Thinking and Working Mathematically should be taught"},{"en":"It contains all the objectives that learners need for the Cambridge IGCSE examination","ar":"It contains all the objectives that learners need for the Cambridge IGCSE examination"}],"correct":1,"expl":{"en":"The framework says the Number strand is the foundation of the mathematics curriculum and that learners apply Number knowledge and skills in the other strands.","ar":"The framework says the Number strand is the foundation of the mathematics curriculum and that learners apply Number knowledge and skills in the other strands."}},{"id":"m4q2","q":{"en":"A colleague asks, \"What does the framework say about when learners may use calculators?\" What is the most accurate reply?","ar":"A colleague asks, \"What does the framework say about when learners may use calculators?\" What is the most accurate reply?"},"opts":[{"en":"Calculators are banned in Stage 7 and allowed in Stages 8 and 9, as stated in the strand descriptions","ar":"Calculators are banned in Stage 7 and allowed in Stages 8 and 9, as stated in the strand descriptions"},{"en":"Calculators must be used for every estimate, because the framework asks learners to estimate before calculating","ar":"Calculators must be used for every estimate, because the framework asks learners to estimate before calculating"},{"en":"The framework gives no calculator rule; check the teacher guide, assessment notes and school policy","ar":"The framework gives no calculator rule; check the teacher guide, assessment notes and school policy"},{"en":"Calculators are allowed only for Statistics and Probability, because those strands use large data sets","ar":"Calculators are allowed only for Statistics and Probability, because those strands use large data sets"}],"correct":2,"expl":{"en":"The framework does not state a calculator rule. Estimating before calculating is described as a mental strategy. For rules, use the Cambridge teacher guide and assessment information and your school policy.","ar":"The framework does not state a calculator rule. Estimating before calculating is described as a mental strategy. For rules, use the Cambridge teacher guide and assessment information and your school policy."}},{"id":"m4q3","q":{"en":"A learner writes that 3x = 34 when x = 4. Which objective is most closely linked to this misconception?","ar":"A learner writes that 3x = 34 when x = 4. Which objective is most closely linked to this misconception?"},"opts":[{"en":"7Ae.07, because the learner needs to understand that letters can represent an open interval","ar":"7Ae.07, because the learner needs to understand that letters can represent an open interval"},{"en":"7As.05, because the learner needs to construct tables of values for linear functions","ar":"7As.05, because the learner needs to construct tables of values for linear functions"},{"en":"7Gg.03, because the learner needs to know the parts of a circle and their names","ar":"7Gg.03, because the learner needs to know the parts of a circle and their names"},{"en":"7Ae.01, because it covers how letters represent unknown numbers, variables or constants","ar":"7Ae.01, because it covers how letters represent unknown numbers, variables or constants"}],"correct":3,"expl":{"en":"The learner reads 3x as the digits 3 and 4. The idea of what a letter and a coefficient mean is in 7Ae.01 and 7Ae.02. The other objectives are about intervals, graphs and circles.","ar":"The learner reads 3x as the digits 3 and 4. The idea of what a letter and a coefficient mean is in 7Ae.01 and 7Ae.02. The other objectives are about intervals, graphs and circles."}}]},{"id":"m5","title":{"en":"Mathematical Language for ESL Learners in Years 7 to 9","ar":"Mathematical Language for ESL Learners in Years 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"At PEPS, every student is learning English as a second language (PEPS context). The Cambridge Lower Secondary framework does not have a section on language support, but it says several things that matter here. The Cambridge Lower Secondary aims include \"effective and confident communication skills, including in English\". The mathematics aims include communicating solutions and ideas logically in spoken and written language using appropriate mathematical symbols, diagrams and representations. And the scheme of work includes \u003cstrong>a list of subject-specific language\u003c/strong> that will be useful for learners. This module offers good-practice ways to build that language. It is not a Cambridge requirement.","ar":"At PEPS, every student is learning English as a second language (PEPS context). The Cambridge Lower Secondary framework does not have a section on language support, but it says several things that matter here. The Cambridge Lower Secondary aims include \"effective and confident communication skills, including in English\". The mathematics aims include communicating solutions and ideas logically in spoken and written language using appropriate mathematical symbols, diagrams and representations. And the scheme of work includes \u003cstrong>a list of subject-specific language\u003c/strong> that will be useful for learners. This module offers good-practice ways to build that language. It is not a Cambridge requirement."}},{"t":"h","c":{"en":"Three kinds of mathematical words","ar":"Three kinds of mathematical words"}},{"t":"p","c":{"en":"It helps to sort the language of mathematics into three groups. This grouping is good practice, not framework text.","ar":"It helps to sort the language of mathematics into three groups. This grouping is good practice, not framework text."}},{"t":"table","head":{"en":["Kind of word","Examples from Stages 7 to 9","Why it is hard","What to do"],"ar":["Kind of word","Examples from Stages 7 to 9","Why it is hard","What to do"]},"rows":[{"en":["Technical words used only in mathematics","denominator, coefficient, polygon, congruent, hypotenuse, inequality","New to every learner, long, hard to pronounce","Teach with a picture or example, say it, write it, use it in the same lesson"],"ar":["Technical words used only in mathematics","denominator, coefficient, polygon, congruent, hypotenuse, inequality","New to every learner, long, hard to pronounce","Teach with a picture or example, say it, write it, use it in the same lesson"]},{"en":["Everyday words with a different mathematical meaning","table, mean, product, difference, volume, face, power, root, plane, chord, degree, range","Learners know one meaning and may not notice the second","Ask \"What does this word mean in everyday English? What does it mean in mathematics?\""],"ar":["Everyday words with a different mathematical meaning","table, mean, product, difference, volume, face, power, root, plane, chord, degree, range","Learners know one meaning and may not notice the second","Ask \"What does this word mean in everyday English? What does it mean in mathematics?\""]},{"en":["Small connecting words","of, per, each, at least, no more than, by, to, between, whereas, increases by / increases to","Small words change the maths, and they are easy to miss","Highlight them in word problems and practise with contrasting pairs"],"ar":["Small connecting words","of, per, each, at least, no more than, by, to, between, whereas, increases by / increases to","Small words change the maths, and they are easy to miss","Highlight them in word problems and practise with contrasting pairs"]}]},{"t":"p","c":{"en":"The framework's glossary gives several useful notes about vocabulary. Learners will meet more than one word for the same idea, and it helps to teach them together:","ar":"The framework's glossary gives several useful notes about vocabulary. Learners will meet more than one word for the same idea, and it helps to teach them together:"}},{"t":"list","c":{"en":["\u003cstrong>Index / indices\u003c/strong> are also called exponents or powers.","\u003cstrong>Limit\u003c/strong> is also called a bound (for example, in 9Np.02, upper and lower limits).","\u003cstrong>Standard form\u003c/strong> is also called scientific notation (9Ni.03).","\u003cstrong>Surd\u003c/strong> is also called a radical (9Ni.04).","\u003cstrong>Brackets\u003c/strong> are also called parentheses.","\u003cstrong>Draw\u003c/strong> means to use instruments for an accurate drawing, and \u003cstrong>sketch\u003c/strong> means to illustrate without instruments. The two words appear in objectives, for example 7Gg.01 (sketch regular polygons) and 7Gg.14 (draw parallel and perpendicular lines).","\u003cstrong>Integer\u003c/strong> and \u003cstrong>whole number\u003c/strong> are different: an integer can be negative; a whole number is positive or zero."],"ar":["\u003cstrong>Index / indices\u003c/strong> are also called exponents or powers.","\u003cstrong>Limit\u003c/strong> is also called a bound (for example, in 9Np.02, upper and lower limits).","\u003cstrong>Standard form\u003c/strong> is also called scientific notation (9Ni.03).","\u003cstrong>Surd\u003c/strong> is also called a radical (9Ni.04).","\u003cstrong>Brackets\u003c/strong> are also called parentheses.","\u003cstrong>Draw\u003c/strong> means to use instruments for an accurate drawing, and \u003cstrong>sketch\u003c/strong> means to illustrate without instruments. The two words appear in objectives, for example 7Gg.01 (sketch regular polygons) and 7Gg.14 (draw parallel and perpendicular lines).","\u003cstrong>Integer\u003c/strong> and \u003cstrong>whole number\u003c/strong> are different: an integer can be negative; a whole number is positive or zero."]}},{"t":"callout","k":"tip","title":{"en":"Check the word before teaching","ar":"Check the word before teaching"},"c":{"en":"The glossary defines a trapezium as a quadrilateral with one pair of parallel sides. Some learners and online sources use \"trapezoid\", which can mean a different shape in other countries. If you use online videos or apps, check that the vocabulary matches the Cambridge glossary.","ar":"The glossary defines a trapezium as a quadrilateral with one pair of parallel sides. Some learners and online sources use \"trapezoid\", which can mean a different shape in other countries. If you use online videos or apps, check that the vocabulary matches the Cambridge glossary."}},{"t":"h","c":{"en":"Teaching vocabulary inside the lesson (good practice)","ar":"Teaching vocabulary inside the lesson (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Choose the key words before the lesson.\u003c/strong> Pick 4 to 6 words that learners must understand to do the task. Do not teach 20 words at once.","\u003cstrong>Make the meaning visible.\u003c/strong> Show an example, a diagram or an object. For \"congruent\", show two cut-out triangles that fit exactly on each other.","\u003cstrong>Say and write it.\u003c/strong> Learners say the word in chorus, then in pairs, then write it. Mark the stressed syllable on difficult words: de-NOM-i-na-tor.","\u003cstrong>Use it in a sentence frame.\u003c/strong> \"The denominator is the ... number in a fraction.\" \"Triangle ABC is congruent to triangle DEF because ...\"","\u003cstrong>Keep it on the wall and in the book.\u003c/strong> A word wall or a glossary page with a picture for each word, kept up to date through the unit.","\u003cstrong>Return to it.\u003c/strong> Revisit key words in the starter next lesson and next week."],"ar":["\u003cstrong>Choose the key words before the lesson.\u003c/strong> Pick 4 to 6 words that learners must understand to do the task. Do not teach 20 words at once.","\u003cstrong>Make the meaning visible.\u003c/strong> Show an example, a diagram or an object. For \"congruent\", show two cut-out triangles that fit exactly on each other.","\u003cstrong>Say and write it.\u003c/strong> Learners say the word in chorus, then in pairs, then write it. Mark the stressed syllable on difficult words: de-NOM-i-na-tor.","\u003cstrong>Use it in a sentence frame.\u003c/strong> \"The denominator is the ... number in a fraction.\" \"Triangle ABC is congruent to triangle DEF because ...\"","\u003cstrong>Keep it on the wall and in the book.\u003c/strong> A word wall or a glossary page with a picture for each word, kept up to date through the unit.","\u003cstrong>Return to it.\u003c/strong> Revisit key words in the starter next lesson and next week."]}},{"t":"h","c":{"en":"Reading and writing: word problems","ar":"Reading and writing: word problems"}},{"t":"p","c":{"en":"A learner may fail a question because of the English, not the mathematics. Before you decide a learner has not understood a mathematical idea, check whether the language was the barrier. A routine for word problems (good practice):","ar":"A learner may fail a question because of the English, not the mathematics. Before you decide a learner has not understood a mathematical idea, check whether the language was the barrier. A routine for word problems (good practice):"}},{"t":"list","c":{"en":["\u003cstrong>Read twice.\u003c/strong> First for the story, then for the numbers.","\u003cstrong>Underline the question.\u003c/strong> What exactly must I find? Include the unit.","\u003cstrong>Draw or model it.\u003c/strong> A bar, a table or a sketch, before any calculation.","\u003cstrong>Say it in your own words.\u003c/strong> In pairs, learners retell the problem. If the home language helps, allow it.","\u003cstrong>Write the answer in a sentence.\u003c/strong> \"The new price is ... dirhams.\" This builds written communication."],"ar":["\u003cstrong>Read twice.\u003c/strong> First for the story, then for the numbers.","\u003cstrong>Underline the question.\u003c/strong> What exactly must I find? Include the unit.","\u003cstrong>Draw or model it.\u003c/strong> A bar, a table or a sketch, before any calculation.","\u003cstrong>Say it in your own words.\u003c/strong> In pairs, learners retell the problem. If the home language helps, allow it.","\u003cstrong>Write the answer in a sentence.\u003c/strong> \"The new price is ... dirhams.\" This builds written communication."]}},{"t":"p","c":{"en":"You can also reduce unnecessary reading load, so that the language does not block the mathematics. For example, in a Year 8 task on 8Nf.05 (percentage increase and decrease), replace a long paragraph about a shop with a short, clear context: \"A shirt costs 80 dirhams. The price increases by 15%. What is the new price?\" Later, return to longer texts as language grows. The aim is not to make problems easy for ever. It is to make the mathematics reachable now.","ar":"You can also reduce unnecessary reading load, so that the language does not block the mathematics. For example, in a Year 8 task on 8Nf.05 (percentage increase and decrease), replace a long paragraph about a shop with a short, clear context: \"A shirt costs 80 dirhams. The price increases by 15%. What is the new price?\" Later, return to longer texts as language grows. The aim is not to make problems easy for ever. It is to make the mathematics reachable now."}},{"t":"h","c":{"en":"Speaking: sentence frames by purpose","ar":"Speaking: sentence frames by purpose"}},{"t":"table","head":{"en":["Purpose","Sentence frames (good practice)","Linked objective example"],"ar":["Purpose","Sentence frames (good practice)","Linked objective example"]},"rows":[{"en":["Comparing","... is greater than ... because ...; ... is equivalent to ...","7Nf.06, compare and order decimals and fractions using symbols"],"ar":["Comparing","... is greater than ... because ...; ... is equivalent to ...","7Nf.06, compare and order decimals and fractions using symbols"]},{"en":["Explaining a method","First I ... Then I ... Finally I ...; I used ... because ...","8Ae.06, solve equations with unknowns on both sides"],"ar":["Explaining a method","First I ... Then I ... Finally I ...; I used ... because ...","8Ae.06, solve equations with unknowns on both sides"]},{"en":["Predicting","I think ... will happen because ...; I expect ... to be about ...","8Sp.04 and 9Sp.04, chance experiments and expected frequency"],"ar":["Predicting","I think ... will happen because ...; I expect ... to be about ...","8Sp.04 and 9Sp.04, chance experiments and expected frequency"]},{"en":["Describing a transformation","The shape is reflected in the line ...; the centre of rotation is ...; the scale factor is ...","9Gp.04, identify and describe a transformation"],"ar":["Describing a transformation","The shape is reflected in the line ...; the centre of rotation is ...; the scale factor is ...","9Gp.04, identify and describe a transformation"]},{"en":["Disagreeing politely","I see it differently because ...; Can you show me how you got ...?","Any objective: TWM.07 Critiquing"],"ar":["Disagreeing politely","I see it differently because ...; Can you show me how you got ...?","Any objective: TWM.07 Critiquing"]}]},{"t":"scenario","title":{"en":"Scenario: the learner who can solve it but cannot say it","ar":"Scenario: the learner who can solve it but cannot say it"},"c":{"en":"Maria, a Year 8 learner, solves 3x + 5 = 20 correctly on paper. When the teacher asks her to explain, she stays silent. The teacher decides the silence is about English, not mathematics. \u003cstrong>What to do:\u003c/strong> let her point and write. The teacher asks, \"Show me the first step.\" Maria writes \"- 5 on both sides\". The teacher gives a frame: \"First I ... both sides.\" Maria says, \"First I subtract 5 from both sides.\" The teacher repeats the sentence correctly, then asks a partner to say it again. Next lesson, the teacher puts the frames on the board and asks for a written explanation of a second equation, with the frame to help. Maria's mathematics was secure from the start. Her language is growing through use, and that is the way to build it.","ar":"Maria, a Year 8 learner, solves 3x + 5 = 20 correctly on paper. When the teacher asks her to explain, she stays silent. The teacher decides the silence is about English, not mathematics. \u003cstrong>What to do:\u003c/strong> let her point and write. The teacher asks, \"Show me the first step.\" Maria writes \"- 5 on both sides\". The teacher gives a frame: \"First I ... both sides.\" Maria says, \"First I subtract 5 from both sides.\" The teacher repeats the sentence correctly, then asks a partner to say it again. Next lesson, the teacher puts the frames on the board and asks for a written explanation of a second equation, with the frame to help. Maria's mathematics was secure from the start. Her language is growing through use, and that is the way to build it."}},{"t":"h","c":{"en":"Numbers, symbols and operations in spoken English","ar":"Numbers, symbols and operations in spoken English"}},{"t":"p","c":{"en":"Many errors begin when a learner hears or reads a mathematical expression in English and cannot turn it into symbols. Practise the oral language of the objectives explicitly (good practice):","ar":"Many errors begin when a learner hears or reads a mathematical expression in English and cannot turn it into symbols. Practise the oral language of the objectives explicitly (good practice):"}},{"t":"table","head":{"en":["Written form","How to say it","Why it needs practice"],"ar":["Written form","How to say it","Why it needs practice"]},"rows":[{"en":["0.35","\"zero point three five\", not \"zero point thirty-five\"","Saying 35 suggests the decimal is a whole number (see 7Nf.06)"],"ar":["0.35","\"zero point three five\", not \"zero point thirty-five\"","Saying 35 suggests the decimal is a whole number (see 7Nf.06)"]},{"en":["3/4 and 3 ÷ 4","\"three quarters\" or \"three over four\"; \"three divided by four\"","Fraction and division language can sound the same to a learner who is new to it"],"ar":["3/4 and 3 ÷ 4","\"three quarters\" or \"three over four\"; \"three divided by four\"","Fraction and division language can sound the same to a learner who is new to it"]},{"en":["x² and x³","\"x squared\", \"x cubed\"","Learners may say \"x two\" and miss the link to area and volume (8Ae.02, 8Ni.06)"],"ar":["x² and x³","\"x squared\", \"x cubed\"","Learners may say \"x two\" and miss the link to area and volume (8Ae.02, 8Ni.06)"]},{"en":["≠, \u003c, >, ≤, ≥","\"is not equal to\", \"is less than\", \"is greater than\", \"is less than or equal to\", \"is greater than or equal to\"","The symbols appear in 7Nf.06 and 8Nf.06; the pointed end is a common confusion"],"ar":["≠, \u003c, >, ≤, ≥","\"is not equal to\", \"is less than\", \"is greater than\", \"is less than or equal to\", \"is greater than or equal to\"","The symbols appear in 7Nf.06 and 8Nf.06; the pointed end is a common confusion"]},{"en":["√49 = 7","\"the square root of forty-nine is seven\"","\"Root\" also means part of a plant (see 7Ni.06)"],"ar":["√49 = 7","\"the square root of forty-nine is seven\"","\"Root\" also means part of a plant (see 7Ni.06)"]},{"en":["15% of 80","\"fifteen per cent of eighty\"","\"Of\" means multiply, but this is rarely said aloud"],"ar":["15% of 80","\"fifteen per cent of eighty\"","\"Of\" means multiply, but this is rarely said aloud"]}]},{"t":"p","c":{"en":"Ask learners to read expressions aloud in pairs before they simplify them, and to write an expression that you say aloud. Both activities are quick, and both reveal who has not yet linked the words to the symbols. They also prepare learners for the spoken justifications that TWM asks for.","ar":"Ask learners to read expressions aloud in pairs before they simplify them, and to write an expression that you say aloud. Both activities are quick, and both reveal who has not yet linked the words to the symbols. They also prepare learners for the spoken justifications that TWM asks for."}},{"t":"callout","k":"warn","title":{"en":"Common mistakes with language support","ar":"Common mistakes with language support"},"c":{"en":"(1) Simplifying the mathematics instead of the language: learners then meet a lower standard than the framework expects. (2) Teaching a long vocabulary list at the start of a unit and never returning to it. (3) Marking an answer wrong because of grammar when the mathematics is correct (see the objective being checked). (4) Always rescuing learners with the answer, so that they never need to speak.","ar":"(1) Simplifying the mathematics instead of the language: learners then meet a lower standard than the framework expects. (2) Teaching a long vocabulary list at the start of a unit and never returning to it. (3) Marking an answer wrong because of grammar when the mathematics is correct (see the objective being checked). (4) Always rescuing learners with the answer, so that they never need to speak."}}],"checks":[{"id":"m5q1","q":{"en":"Which item does the framework say a scheme of work contains that supports mathematical language?","ar":"Which item does the framework say a scheme of work contains that supports mathematical language?"},"opts":[{"en":"A list of subject-specific language that will be useful for your learners","ar":"A list of subject-specific language that will be useful for your learners"},{"en":"A bilingual dictionary for each stage, translated into the home languages of all learners","ar":"A bilingual dictionary for each stage, translated into the home languages of all learners"},{"en":"A set of sentence frames for every learning objective, written for ESL learners","ar":"A set of sentence frames for every learning objective, written for ESL learners"},{"en":"A vocabulary test for each unit, to be given at the end of the stage","ar":"A vocabulary test for each unit, to be given at the end of the stage"}],"correct":0,"expl":{"en":"The framework lists, among the contents of each scheme of work, a list of subject-specific language that will be useful for learners. Sentence frames and word walls are good-practice ideas in this CPD, not framework contents.","ar":"The framework lists, among the contents of each scheme of work, a list of subject-specific language that will be useful for learners. Sentence frames and word walls are good-practice ideas in this CPD, not framework contents."}},{"id":"m5q2","q":{"en":"According to the framework's glossary, which two words describe the same idea?","ar":"According to the framework's glossary, which two words describe the same idea?"},"opts":[{"en":"Integer and whole number, because the glossary says they both mean positive numbers and zero","ar":"Integer and whole number, because the glossary says they both mean positive numbers and zero"},{"en":"Index and exponent, because the glossary says indices are also called exponents or powers","ar":"Index and exponent, because the glossary says indices are also called exponents or powers"},{"en":"Draw and sketch, because the glossary says both mean to illustrate a shape without instruments","ar":"Draw and sketch, because the glossary says both mean to illustrate a shape without instruments"},{"en":"Constant and variable, because the glossary says both are letters that represent unknown numbers","ar":"Constant and variable, because the glossary says both are letters that represent unknown numbers"}],"correct":1,"expl":{"en":"The glossary says indices are also called exponents or powers. Integers include negative numbers, but whole numbers do not. Draw uses instruments but sketch does not. A constant has a fixed value, but a variable can take various values.","ar":"The glossary says indices are also called exponents or powers. Integers include negative numbers, but whole numbers do not. Draw uses instruments but sketch does not. A constant has a fixed value, but a variable can take various values."}},{"id":"m5q3","q":{"en":"A Year 9 learner answers a word problem about compound percentages incorrectly but solves a similar problem with numbers only. What is the best first step?","ar":"A Year 9 learner answers a word problem about compound percentages incorrectly but solves a similar problem with numbers only. What is the best first step?"},"opts":[{"en":"Move the learner to Year 8 percentage tasks until the English has improved enough for Year 9 work","ar":"Move the learner to Year 8 percentage tasks until the English has improved enough for Year 9 work"},{"en":"Mark the question wrong, since word problems are part of the objective and no support is allowed","ar":"Mark the question wrong, since word problems are part of the objective and no support is allowed"},{"en":"Check whether language blocked the task, then reread it together and add a diagram","ar":"Check whether language blocked the task, then reread it together and add a diagram"},{"en":"Give the same word problem for homework so that the learner practises reading it alone","ar":"Give the same word problem for homework so that the learner practises reading it alone"}],"correct":2,"expl":{"en":"The learner can do the mathematics but not the reading. Check the language barrier, then make the problem accessible without lowering the mathematical demand (9Nf.05 stays the objective).","ar":"The learner can do the mathematics but not the reading. Check the language barrier, then make the problem accessible without lowering the mathematical demand (9Nf.05 stays the objective)."}}]},{"id":"m6","title":{"en":"Assessment: Classroom Checks, Cambridge Assessments and External Checks","ar":"Assessment: Classroom Checks, Cambridge Assessments and External Checks"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment answers one question: \u003cem>what do learners know and what can they do now, compared with what the objectives expect?\u003c/em> The framework says the learning objectives are \"a reference against which learners' attainment and skills development can be checked\". This module separates three sources of evidence: your everyday classroom checks (assessment for learning), the Cambridge assessments named in the framework, and the external checks used at PEPS.","ar":"Assessment answers one question: \u003cem>what do learners know and what can they do now, compared with what the objectives expect?\u003c/em> The framework says the learning objectives are \"a reference against which learners' attainment and skills development can be checked\". This module separates three sources of evidence: your everyday classroom checks (assessment for learning), the Cambridge assessments named in the framework, and the external checks used at PEPS."}},{"t":"h","c":{"en":"What the framework says about assessment","ar":"What the framework says about assessment"}},{"t":"list","c":{"en":["The Cambridge Lower Secondary assessments named in the framework are the \u003cstrong>Cambridge Lower Secondary Progression Tests\u003c/strong>, the \u003cstrong>Cambridge Lower Secondary Checkpoint\u003c/strong> and the \u003cstrong>CEM Baseline Tests\u003c/strong>.","The framework says: \"We provide assessments designed to complement this curriculum framework for Stages 7 to 9\", and that more information is on the Cambridge Lower Secondary support site.","The front cover says the Progression Tests were to be available from 2022 and Checkpoint from 2023.","Each learning objective code includes a \u003cstrong>reporting code\u003c/strong> that \"appears in the feedback reports for tests\" and reflects the sub-strand titles.","The framework says you can find out more on the support site, and that your Cambridge coordinator or exams officer can help if you do not have a log-in."],"ar":["The Cambridge Lower Secondary assessments named in the framework are the \u003cstrong>Cambridge Lower Secondary Progression Tests\u003c/strong>, the \u003cstrong>Cambridge Lower Secondary Checkpoint\u003c/strong> and the \u003cstrong>CEM Baseline Tests\u003c/strong>.","The framework says: \"We provide assessments designed to complement this curriculum framework for Stages 7 to 9\", and that more information is on the Cambridge Lower Secondary support site.","The front cover says the Progression Tests were to be available from 2022 and Checkpoint from 2023.","Each learning objective code includes a \u003cstrong>reporting code\u003c/strong> that \"appears in the feedback reports for tests\" and reflects the sub-strand titles.","The framework says you can find out more on the support site, and that your Cambridge coordinator or exams officer can help if you do not have a log-in."]}},{"t":"callout","k":"key","title":{"en":"What the framework does not say","ar":"What the framework does not say"},"c":{"en":"The framework does not describe the content, length, marking or scoring of the Progression Tests, Checkpoint or CEM Baseline Tests, and it does not say which test is taken in which stage. For these details, use the Cambridge support site and the school's Cambridge coordinator or exams officer. Do not assume details from memory or from other schools.","ar":"The framework does not describe the content, length, marking or scoring of the Progression Tests, Checkpoint or CEM Baseline Tests, and it does not say which test is taken in which stage. For these details, use the Cambridge support site and the school's Cambridge coordinator or exams officer. Do not assume details from memory or from other schools."}},{"t":"h","c":{"en":"Three sources of evidence at PEPS","ar":"Three sources of evidence at PEPS"}},{"t":"table","head":{"en":["Source","Who sets it and when","What it can tell you","What it cannot tell you"],"ar":["Source","Who sets it and when","What it can tell you","What it cannot tell you"]},"rows":[{"en":["Classroom assessment for learning (AfL)","You, every lesson","Who understands today, which errors are common, what to teach next","How your class compares with a wider group"],"ar":["Classroom assessment for learning (AfL)","You, every lesson","Who understands today, which errors are common, what to teach next","How your class compares with a wider group"]},{"en":["Internal end-of-unit or end-of-term tests","Your department, following the school assessment calendar","Whether the unit objectives were learned, by class and by objective","External standard, unless the test is standardised and checked"],"ar":["Internal end-of-unit or end-of-term tests","Your department, following the school assessment calendar","Whether the unit objectives were learned, by class and by objective","External standard, unless the test is standardised and checked"]},{"en":["Cambridge Lower Secondary Checkpoint (PEPS: Year 9, Stage 9)","Cambridge assessment, named in the framework; PEPS sits it in Year 9 (PEPS context)","Attainment against Cambridge content, reported using reporting codes","Day-to-day progress, or objectives that were not tested"],"ar":["Cambridge Lower Secondary Checkpoint (PEPS: Year 9, Stage 9)","Cambridge assessment, named in the framework; PEPS sits it in Year 9 (PEPS context)","Attainment against Cambridge content, reported using reporting codes","Day-to-day progress, or objectives that were not tested"]},{"en":["GL Progress Test (PEPS: Year 8)","GL Assessment, a separate test from Cambridge; PEPS runs GL tests in Years 4, 6, 8 and 10 (PEPS context)","A standardised, external view of mathematics at Year 8","Results by Cambridge objective code, unless the report is mapped to the framework by the school"],"ar":["GL Progress Test (PEPS: Year 8)","GL Assessment, a separate test from Cambridge; PEPS runs GL tests in Years 4, 6, 8 and 10 (PEPS context)","A standardised, external view of mathematics at Year 8","Results by Cambridge objective code, unless the report is mapped to the framework by the school"]}]},{"t":"p","c":{"en":"The GL Progress Test is not named in the Cambridge framework and its reports use their own wording. When you use GL results, you can compare them with Cambridge strands only by mapping topic names to the framework carefully (see Module 7). Do not assume that a GL topic equals one Cambridge sub-strand without checking.","ar":"The GL Progress Test is not named in the Cambridge framework and its reports use their own wording. When you use GL results, you can compare them with Cambridge strands only by mapping topic names to the framework carefully (see Module 7). Do not assume that a GL topic equals one Cambridge sub-strand without checking."}},{"t":"h","c":{"en":"Assessment for learning in a lesson (good practice)","ar":"Assessment for learning in a lesson (good practice)"}},{"t":"p","c":{"en":"The framework does not describe classroom techniques, but it says that practice, reflection and questioning help learners improve. These techniques turn that idea into action:","ar":"The framework does not describe classroom techniques, but it says that practice, reflection and questioning help learners improve. These techniques turn that idea into action:"}},{"t":"list","c":{"en":["\u003cstrong>Mini whiteboards.\u003c/strong> Every learner shows an answer at the same moment, so you see the whole class, not the three hands that went up.","\u003cstrong>Hinge questions.\u003c/strong> One multiple-choice question where each wrong answer shows a different misconception. The answers decide your next step.","\u003cstrong>Exit tickets.\u003c/strong> One or two questions in the last five minutes, sorted into \"got it\", \"nearly\" and \"not yet\" before the next lesson.","\u003cstrong>Success criteria.\u003c/strong> Learners tick against a short list of \"I can...\" statements and give an example for each one.","\u003cstrong>Feedback on the mathematics.\u003c/strong> A comment such as \"Check the sign in your second line\" helps more than a grade or \"good\".","\u003cstrong>Self and peer assessment.\u003c/strong> Swap books and use a checklist. Learners learn criteria by applying them."],"ar":["\u003cstrong>Mini whiteboards.\u003c/strong> Every learner shows an answer at the same moment, so you see the whole class, not the three hands that went up.","\u003cstrong>Hinge questions.\u003c/strong> One multiple-choice question where each wrong answer shows a different misconception. The answers decide your next step.","\u003cstrong>Exit tickets.\u003c/strong> One or two questions in the last five minutes, sorted into \"got it\", \"nearly\" and \"not yet\" before the next lesson.","\u003cstrong>Success criteria.\u003c/strong> Learners tick against a short list of \"I can...\" statements and give an example for each one.","\u003cstrong>Feedback on the mathematics.\u003c/strong> A comment such as \"Check the sign in your second line\" helps more than a grade or \"good\".","\u003cstrong>Self and peer assessment.\u003c/strong> Swap books and use a checklist. Learners learn criteria by applying them."]}},{"t":"scenario","title":{"en":"Worked example: a hinge question for 8Nf.05","ar":"Worked example: a hinge question for 8Nf.05"},"c":{"en":"\u003cstrong>Question:\u003c/strong> A price of 200 dirhams increases by 10%, then decreases by 10%. What is the final price? \u003cstrong>A\u003c/strong> 200 dirhams. \u003cstrong>B\u003c/strong> 198 dirhams. \u003cstrong>C\u003c/strong> 180 dirhams. \u003cstrong>D\u003c/strong> 220 dirhams. The correct answer is B (220, then 10% of 220 is 22, so 198). Answer A shows the misconception that the changes cancel. Answer C shows learners who take 10% of 200 away twice and ignore the increase. Answer D shows learners who stopped after the increase. When 20 of 28 learners hold up B, move on. If 12 hold up A, stop and reteach the idea with a diagram. The question takes two minutes and saves a week of confusion. Notice that each wrong answer is a sensible mistake, not a silly one.","ar":"\u003cstrong>Question:\u003c/strong> A price of 200 dirhams increases by 10%, then decreases by 10%. What is the final price? \u003cstrong>A\u003c/strong> 200 dirhams. \u003cstrong>B\u003c/strong> 198 dirhams. \u003cstrong>C\u003c/strong> 180 dirhams. \u003cstrong>D\u003c/strong> 220 dirhams. The correct answer is B (220, then 10% of 220 is 22, so 198). Answer A shows the misconception that the changes cancel. Answer C shows learners who take 10% of 200 away twice and ignore the increase. Answer D shows learners who stopped after the increase. When 20 of 28 learners hold up B, move on. If 12 hold up A, stop and reteach the idea with a diagram. The question takes two minutes and saves a week of confusion. Notice that each wrong answer is a sensible mistake, not a silly one."}},{"t":"h","c":{"en":"Using the reporting codes","ar":"Using the reporting codes"}},{"t":"p","c":{"en":"The reporting codes are a practical link between Cambridge test feedback and your planning. The framework lists them as follows:","ar":"The reporting codes are a practical link between Cambridge test feedback and your planning. The framework lists them as follows:"}},{"t":"table","head":{"en":["Strand","Reporting code","Sub-strand title"],"ar":["Strand","Reporting code","Sub-strand title"]},"rows":[{"en":["Number","Nf","Fractions, decimals, percentages, ratio and proportion"],"ar":["Number","Nf","Fractions, decimals, percentages, ratio and proportion"]},{"en":["Number","Ni","Integers, powers and roots"],"ar":["Number","Ni","Integers, powers and roots"]},{"en":["Number","Np","Place value, ordering and rounding"],"ar":["Number","Np","Place value, ordering and rounding"]},{"en":["Algebra","Ae","Expressions, equations and formulae"],"ar":["Algebra","Ae","Expressions, equations and formulae"]},{"en":["Algebra","As","Sequences, functions and graphs"],"ar":["Algebra","As","Sequences, functions and graphs"]},{"en":["Geometry and Measure","Gp","Position and transformation"],"ar":["Geometry and Measure","Gp","Position and transformation"]},{"en":["Geometry and Measure","Gg","Geometrical reasoning, shapes and measurements"],"ar":["Geometry and Measure","Gg","Geometrical reasoning, shapes and measurements"]},{"en":["Statistics and Probability","Sp","Probability"],"ar":["Statistics and Probability","Sp","Probability"]},{"en":["Statistics and Probability","Ss","Statistics"],"ar":["Statistics and Probability","Ss","Statistics"]}]},{"t":"p","c":{"en":"Suppose a feedback report shows a class is weaker in \u003cstrong>Ae\u003c/strong>. You now know the sub-strand: Expressions, equations and formulae. You do not yet know the objective. Go back to your own marked papers, find the questions that tested Ae and look at the errors. Was it 8Ae.03 (factorising), 8Ae.05 (changing the subject) or 8Ae.06 (solving equations)? The reporting code tells you where to look. Your own evidence tells you what to fix.","ar":"Suppose a feedback report shows a class is weaker in \u003cstrong>Ae\u003c/strong>. You now know the sub-strand: Expressions, equations and formulae. You do not yet know the objective. Go back to your own marked papers, find the questions that tested Ae and look at the errors. Was it 8Ae.03 (factorising), 8Ae.05 (changing the subject) or 8Ae.06 (solving equations)? The reporting code tells you where to look. Your own evidence tells you what to fix."}},{"t":"h","c":{"en":"Writing a good test question (good practice)","ar":"Writing a good test question (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Tag every question with one objective code\u003c/strong> before you finalise the test, so that analysis by code is possible (Module 7).","\u003cstrong>Match the question to the objective's limits.\u003c/strong> 7Nf.02 is about mixed numbers; do not add an unrelated fraction skill that hides what you want to see.","\u003cstrong>Include different kinds of question:\u003c/strong> a short fluency item, a problem in context and one reasoning item such as \"Explain why...\" or \"Is this always true?\"","\u003cstrong>Keep the language simple\u003c/strong> so that you test mathematics, not reading, unless reading is the point.","\u003cstrong>Write the mark scheme first\u003c/strong> and decide how you will award marks for a correct method with a small slip.","\u003cstrong>Try the test yourself\u003c/strong> before giving it. This finds unclear wording and unrealistic timing."],"ar":["\u003cstrong>Tag every question with one objective code\u003c/strong> before you finalise the test, so that analysis by code is possible (Module 7).","\u003cstrong>Match the question to the objective's limits.\u003c/strong> 7Nf.02 is about mixed numbers; do not add an unrelated fraction skill that hides what you want to see.","\u003cstrong>Include different kinds of question:\u003c/strong> a short fluency item, a problem in context and one reasoning item such as \"Explain why...\" or \"Is this always true?\"","\u003cstrong>Keep the language simple\u003c/strong> so that you test mathematics, not reading, unless reading is the point.","\u003cstrong>Write the mark scheme first\u003c/strong> and decide how you will award marks for a correct method with a small slip.","\u003cstrong>Try the test yourself\u003c/strong> before giving it. This finds unclear wording and unrealistic timing."]}},{"t":"scenario","title":{"en":"Scenario: reading a feedback report with care","ar":"Scenario: reading a feedback report with care"},"c":{"en":"A Year 9 teacher receives test feedback that shows results by reporting code, and one code, Np (Place value, ordering and rounding), is lower than the others. She does not know how the report scores or compares groups, so she asks the Cambridge coordinator or exams officer for the publisher's explanation before drawing conclusions. Meanwhile she looks at the Stage 9 objectives in Np: only two, 9Np.01 (multiply and divide by powers of 10) and 9Np.02 (upper and lower limits when a number is rounded). She checks her own class work on these two objectives and finds that most errors concern limits, so she plans two lessons on 9Np.02 using a number line. She does not say that the class is \"weak at number\", and she does not guess what the report means. She uses the code to find the place to look, and her own evidence to decide what to do.","ar":"A Year 9 teacher receives test feedback that shows results by reporting code, and one code, Np (Place value, ordering and rounding), is lower than the others. She does not know how the report scores or compares groups, so she asks the Cambridge coordinator or exams officer for the publisher's explanation before drawing conclusions. Meanwhile she looks at the Stage 9 objectives in Np: only two, 9Np.01 (multiply and divide by powers of 10) and 9Np.02 (upper and lower limits when a number is rounded). She checks her own class work on these two objectives and finds that most errors concern limits, so she plans two lessons on 9Np.02 using a number line. She does not say that the class is \"weak at number\", and she does not guess what the report means. She uses the code to find the place to look, and her own evidence to decide what to do."}},{"t":"callout","k":"tip","title":{"en":"TWM in assessment (good practice)","ar":"TWM in assessment (good practice)"},"c":{"en":"The framework presents TWM as embedded throughout the curriculum. So include some questions in internal tests that ask for a reason, a counter-example or a comparison of methods, not only calculations. If a test has only routine questions, results may show fluency but not the thinking the framework values.","ar":"The framework presents TWM as embedded throughout the curriculum. So include some questions in internal tests that ask for a reason, a counter-example or a comparison of methods, not only calculations. If a test has only routine questions, results may show fluency but not the thinking the framework values."}}],"checks":[{"id":"m6q1","q":{"en":"Which assessments does the framework name as Cambridge Lower Secondary assessments?","ar":"Which assessments does the framework name as Cambridge Lower Secondary assessments?"},"opts":[{"en":"Cambridge Lower Secondary Checkpoint, GL Progress Tests and Cambridge IGCSE Mathematics papers","ar":"Cambridge Lower Secondary Checkpoint, GL Progress Tests and Cambridge IGCSE Mathematics papers"},{"en":"Cambridge Lower Secondary Progression Tests, GL Progress Tests and CAT4 reasoning tests","ar":"Cambridge Lower Secondary Progression Tests, GL Progress Tests and CAT4 reasoning tests"},{"en":"Cambridge Primary Checkpoint, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests","ar":"Cambridge Primary Checkpoint, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests"},{"en":"Cambridge Lower Secondary Progression Tests, Lower Secondary Checkpoint and CEM Baseline Tests","ar":"Cambridge Lower Secondary Progression Tests, Lower Secondary Checkpoint and CEM Baseline Tests"}],"correct":3,"expl":{"en":"The framework lists Progression Tests, Checkpoint and CEM Baseline Tests under Cambridge Lower Secondary assessments. GL Progress Tests are an external check used at PEPS and are not named in the framework.","ar":"The framework lists Progression Tests, Checkpoint and CEM Baseline Tests under Cambridge Lower Secondary assessments. GL Progress Tests are an external check used at PEPS and are not named in the framework."}},{"id":"m6q2","q":{"en":"What does the \"reporting code\" in a learning objective code tell you?","ar":"What does the \"reporting code\" in a learning objective code tell you?"},"opts":[{"en":"The sub-strand, shown in test feedback reports, so results link to parts of the curriculum","ar":"The sub-strand, shown in test feedback reports, so results link to parts of the curriculum"},{"en":"The difficulty of the objective, with higher letters meaning harder items in the Checkpoint test","ar":"The difficulty of the objective, with higher letters meaning harder items in the Checkpoint test"},{"en":"The term in which the objective should be taught, so that tests match the school calendar","ar":"The term in which the objective should be taught, so that tests match the school calendar"},{"en":"The tier of the Checkpoint paper in which the objective will be examined for each learner","ar":"The tier of the Checkpoint paper in which the objective will be examined for each learner"}],"correct":0,"expl":{"en":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. It does not describe difficulty, teaching term or tiers.","ar":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. It does not describe difficulty, teaching term or tiers."}},{"id":"m6q3","q":{"en":"A Year 8 GL Progress Test report shows a class weaker in algebra. What is the sensible next step for the teacher?","ar":"A Year 8 GL Progress Test report shows a class weaker in algebra. What is the sensible next step for the teacher?"},"opts":[{"en":"Conclude that the whole algebra strand must be taught again from Stage 7, starting next lesson","ar":"Conclude that the whole algebra strand must be taught again from Stage 7, starting next lesson"},{"en":"Look at the class's own work to find the weak Ae and As objectives, then plan teaching","ar":"Look at the class's own work to find the weak Ae and As objectives, then plan teaching"},{"en":"Wait for the Year 9 Checkpoint report before deciding whether to change any teaching","ar":"Wait for the Year 9 Checkpoint report before deciding whether to change any teaching"},{"en":"Treat the GL topic name as the same as the Cambridge reporting code and plan from it alone","ar":"Treat the GL topic name as the same as the Cambridge reporting code and plan from it alone"}],"correct":1,"expl":{"en":"A topic-level result tells you where to look, not what to teach. The teacher checks classroom evidence against Ae and As objectives and plans targeted teaching. GL topic names must be mapped carefully to the framework.","ar":"A topic-level result tells you where to look, not what to teach. The teacher checks classroom evidence against Ae and As objectives and plans targeted teaching. GL topic names must be mapped carefully to the framework."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Evidence is useful only if it changes what happens next in the classroom. A spreadsheet of marks that nobody reads is paperwork. The same spreadsheet, read by objective code and strand, tells you which objectives to teach again, which learners need help and which learners are ready for more challenge. This module shows a simple routine. All numbers in this module are \u003cstrong>invented teaching examples\u003c/strong>, not PEPS data.","ar":"Evidence is useful only if it changes what happens next in the classroom. A spreadsheet of marks that nobody reads is paperwork. The same spreadsheet, read by objective code and strand, tells you which objectives to teach again, which learners need help and which learners are ready for more challenge. This module shows a simple routine. All numbers in this module are \u003cstrong>invented teaching examples\u003c/strong>, not PEPS data."}},{"t":"h","c":{"en":"Start with a clear question","ar":"Start with a clear question"}},{"t":"p","c":{"en":"Before you open a results file, write the question you want to answer. Examples: Which objectives did most of my class not secure in the unit? Which strand is weakest compared with other strands? Are the same learners weak across several tests? Did our extra lessons improve results on the objectives we targeted? A clear question stops you from collecting data you will not use.","ar":"Before you open a results file, write the question you want to answer. Examples: Which objectives did most of my class not secure in the unit? Which strand is weakest compared with other strands? Are the same learners weak across several tests? Did our extra lessons improve results on the objectives we targeted? A clear question stops you from collecting data you will not use."}},{"t":"h","c":{"en":"Analysing a class test by objective code","ar":"Analysing a class test by objective code"}},{"t":"p","c":{"en":"Tag every question in your test with the objective code it assesses. Then record how many learners got each question right. Here is an \u003cstrong>invented\u003c/strong> example for a class of 28 in a Year 8 unit test.","ar":"Tag every question in your test with the objective code it assesses. Then record how many learners got each question right. Here is an \u003cstrong>invented\u003c/strong> example for a class of 28 in a Year 8 unit test."}},{"t":"table","head":{"en":["Question","Objective code","Learners correct (of 28)","Percentage correct (rounded)"],"ar":["Question","Objective code","Learners correct (of 28)","Percentage correct (rounded)"]},"rows":[{"en":["1","8Nf.05 (percentage change)","24","86%"],"ar":["1","8Nf.05 (percentage change)","24","86%"]},{"en":["2","8Nf.10 (simplify ratios, different units)","15","54%"],"ar":["2","8Nf.10 (simplify ratios, different units)","15","54%"]},{"en":["3","8Ae.06 (equations, unknowns on both sides)","12","43%"],"ar":["3","8Ae.06 (equations, unknowns on both sides)","12","43%"]},{"en":["4","8Ae.05 (change the subject)","10","36%"],"ar":["4","8Ae.05 (change the subject)","10","36%"]},{"en":["5","8Gg.04 (area of parallelograms and trapezia)","22","79%"],"ar":["5","8Gg.04 (area of parallelograms and trapezia)","22","79%"]},{"en":["6","8Gp.06 (enlarge by positive integer scale factor)","19","68%"],"ar":["6","8Gp.06 (enlarge by positive integer scale factor)","19","68%"]}]},{"t":"p","c":{"en":"What does the table say? Questions 3 and 4 are the weakest, and both are in \u003cstrong>Ae\u003c/strong>. Question 2 (ratio) needs attention. Questions 1 and 5 look secure. Next, look at the wrong answers on questions 3 and 4. Were learners subtracting incorrectly, or not knowing which operation to undo first? The numbers show where, the errors show why.","ar":"What does the table say? Questions 3 and 4 are the weakest, and both are in \u003cstrong>Ae\u003c/strong>. Question 2 (ratio) needs attention. Questions 1 and 5 look secure. Next, look at the wrong answers on questions 3 and 4. Were learners subtracting incorrectly, or not knowing which operation to undo first? The numbers show where, the errors show why."}},{"t":"callout","k":"warn","title":{"en":"Be careful with small numbers","ar":"Be careful with small numbers"},"c":{"en":"A class of 28 gives only a rough picture. One question per objective may be too little evidence, because a learner can guess, or can lose marks for a careless slip. Look for a pattern across several questions or two assessments before you make a big decision. Do not compare classes with different teaching time, or compare a test of one topic with a test of another as if they were equal.","ar":"A class of 28 gives only a rough picture. One question per objective may be too little evidence, because a learner can guess, or can lose marks for a careless slip. Look for a pattern across several questions or two assessments before you make a big decision. Do not compare classes with different teaching time, or compare a test of one topic with a test of another as if they were equal."}},{"t":"h","c":{"en":"From evidence to action: a five-step routine","ar":"From evidence to action: a five-step routine"}},{"t":"steps","c":{"en":["\u003cstrong>Collect.\u003c/strong> Mark by objective code. Keep question-level data, not only total marks.","\u003cstron
