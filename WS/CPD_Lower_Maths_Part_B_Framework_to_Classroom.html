g>Sort.\u003c/strong> List objectives from weakest to strongest. Mark each as \"secure\", \"nearly\" or \"not yet\" for the class.","\u003cstrong>Diagnose.\u003c/strong> Read the actual errors. Group them: a misconception, a missing prerequisite, a language problem or a careless slip? Each needs a different response.","\u003cstrong>Act.\u003c/strong> Choose actions: a whole-class reteach, a small group, one-to-one help, or a change to the unit plan next year.","\u003cstrong>Check.\u003c/strong> Set a short retrieval check two to four weeks later on the same objectives to see whether the action worked."],"ar":["\u003cstrong>Collect.\u003c/strong> Mark by objective code. Keep question-level data, not only total marks.","\u003cstrong>Sort.\u003c/strong> List objectives from weakest to strongest. Mark each as \"secure\", \"nearly\" or \"not yet\" for the class.","\u003cstrong>Diagnose.\u003c/strong> Read the actual errors. Group them: a misconception, a missing prerequisite, a language problem or a careless slip? Each needs a different response.","\u003cstrong>Act.\u003c/strong> Choose actions: a whole-class reteach, a small group, one-to-one help, or a change to the unit plan next year.","\u003cstrong>Check.\u003c/strong> Set a short retrieval check two to four weeks later on the same objectives to see whether the action worked."]}},{"t":"h","c":{"en":"Intervention: matching the response to the problem (good practice)","ar":"Intervention: matching the response to the problem (good practice)"}},{"t":"table","head":{"en":["What you found","Likely cause","Possible response"],"ar":["What you found","Likely cause","Possible response"]},"rows":[{"en":["Most of the class failed an objective","The teaching or the sequence did not work","Reteach the whole class with a different approach (a new representation or example set), not the same lesson again"],"ar":["Most of the class failed an objective","The teaching or the sequence did not work","Reteach the whole class with a different approach (a new representation or example set), not the same lesson again"]},{"en":["A group of 6 to 8 learners failed it","A shared misconception or missing prerequisite","Short small-group sessions on the missing step, with the rest of the class on extension or practice"],"ar":["A group of 6 to 8 learners failed it","A shared misconception or missing prerequisite","Short small-group sessions on the missing step, with the rest of the class on extension or practice"]},{"en":["Individuals failed across many objectives","Gaps from earlier stages, language, attendance or confidence","Diagnostic check of prerequisites, support from the HOD or the inclusion team, and a plan agreed with the learner"],"ar":["Individuals failed across many objectives","Gaps from earlier stages, language, attendance or confidence","Diagnostic check of prerequisites, support from the HOD or the inclusion team, and a plan agreed with the learner"]},{"en":["Learners scored full marks quickly","Ready for more depth","Offer extension that deepens thinking (reasoning, generalising, problem solving), not only extra pages of the same kind"],"ar":["Learners scored full marks quickly","Ready for more depth","Offer extension that deepens thinking (reasoning, generalising, problem solving), not only extra pages of the same kind"]}]},{"t":"p","c":{"en":"Interventions should be short, targeted and time-limited. \"Every Thursday forever\" tends to become routine without purpose. Decide the objective, the group, the number of sessions and the check before you begin.","ar":"Interventions should be short, targeted and time-limited. \"Every Thursday forever\" tends to become routine without purpose. Decide the objective, the group, the number of sessions and the check before you begin."}},{"t":"h","c":{"en":"Tracking progress without making up the data","ar":"Tracking progress without making up the data"}},{"t":"p","c":{"en":"A tracker is a record of evidence you actually hold. The simplest useful tracker is a grid with learners down the side and objective codes across the top. Mark each cell with one of three or four agreed statuses, based on real evidence such as a unit test or a task, and the date. Keep it simple enough that you will update it.","ar":"A tracker is a record of evidence you actually hold. The simplest useful tracker is a grid with learners down the side and objective codes across the top. Mark each cell with one of three or four agreed statuses, based on real evidence such as a unit test or a task, and the date. Keep it simple enough that you will update it."}},{"t":"list","c":{"en":["\u003cstrong>Use your school's tracker and scale.\u003c/strong> Do not create a private system that nobody else can read. If the school has no format, ask your HOD.","\u003cstrong>Record the source.\u003c/strong> \"Unit 3 test, question 4\" is evidence. \"I think he is fine\" is not.","\u003cstrong>Separate attainment from progress.\u003c/strong> Attainment is where a learner is compared with the objectives or a benchmark now. Progress is how far a learner has moved from an earlier point. A learner may have low attainment and good progress.","\u003cstrong>Do not infer a level from one result.\u003c/strong> Cambridge test feedback and GL reports must be read in the way their publishers describe. If you are unsure, ask the Cambridge coordinator or exams officer.","\u003cstrong>Never fill gaps with guesses.\u003c/strong> A blank cell is honest. A guess becomes a fact in the next report."],"ar":["\u003cstrong>Use your school's tracker and scale.\u003c/strong> Do not create a private system that nobody else can read. If the school has no format, ask your HOD.","\u003cstrong>Record the source.\u003c/strong> \"Unit 3 test, question 4\" is evidence. \"I think he is fine\" is not.","\u003cstrong>Separate attainment from progress.\u003c/strong> Attainment is where a learner is compared with the objectives or a benchmark now. Progress is how far a learner has moved from an earlier point. A learner may have low attainment and good progress.","\u003cstrong>Do not infer a level from one result.\u003c/strong> Cambridge test feedback and GL reports must be read in the way their publishers describe. If you are unsure, ask the Cambridge coordinator or exams officer.","\u003cstrong>Never fill gaps with guesses.\u003c/strong> A blank cell is honest. A guess becomes a fact in the next report."]}},{"t":"scenario","title":{"en":"Scenario: the strand that looks weak","ar":"Scenario: the strand that looks weak"},"c":{"en":"A Year 9 teacher notices that in two internal tests and one external report, her class scores lower on \u003cstrong>Gg\u003c/strong> (Geometrical reasoning, shapes and measurements) than on other sub-strands. She is tempted to schedule extra geometry for everyone. First she checks: \u003cstrong>Gg is the largest sub-strand in Stage 9, with 11 objectives\u003c/strong>, so it covers many topics. She tags the test questions and finds that most lost marks are on 9Gg.07 (sum of interior angles of any polygon) and 9Gg.10 (Pythagoras' theorem), and that many errors came from rearranging formulae (an algebra skill, 9Ae.04) and not from geometry. She plans: two lessons on 9Gg.07 using a \"generalise from triangles\" task; one lesson on Pythagoras with a check of the algebra needed; and a retrieval quiz in three weeks. The strand was only the starting point. The objective codes and the errors gave her the plan.","ar":"A Year 9 teacher notices that in two internal tests and one external report, her class scores lower on \u003cstrong>Gg\u003c/strong> (Geometrical reasoning, shapes and measurements) than on other sub-strands. She is tempted to schedule extra geometry for everyone. First she checks: \u003cstrong>Gg is the largest sub-strand in Stage 9, with 11 objectives\u003c/strong>, so it covers many topics. She tags the test questions and finds that most lost marks are on 9Gg.07 (sum of interior angles of any polygon) and 9Gg.10 (Pythagoras' theorem), and that many errors came from rearranging formulae (an algebra skill, 9Ae.04) and not from geometry. She plans: two lessons on 9Gg.07 using a \"generalise from triangles\" task; one lesson on Pythagoras with a check of the algebra needed; and a retrieval quiz in three weeks. The strand was only the starting point. The objective codes and the errors gave her the plan."}},{"t":"h","c":{"en":"Looking across strands","ar":"Looking across strands"}},{"t":"p","c":{"en":"After you analyse single objectives, step back and look at the nine sub-strands. This second invented example shows a class summary in which each sub-strand is described by the share of marks learners gained across all the questions on that sub-strand in a mixed end-of-year test.","ar":"After you analyse single objectives, step back and look at the nine sub-strands. This second invented example shows a class summary in which each sub-strand is described by the share of marks learners gained across all the questions on that sub-strand in a mixed end-of-year test."}},{"t":"table","head":{"en":["Sub-strand (reporting code)","Questions in the test","Marks gained (invented)","What the teacher might ask"],"ar":["Sub-strand (reporting code)","Questions in the test","Marks gained (invented)","What the teacher might ask"]},"rows":[{"en":["Integers, powers and roots (Ni)","4","71%","Are errors on negative numbers or on indices?"],"ar":["Integers, powers and roots (Ni)","4","71%","Are errors on negative numbers or on indices?"]},{"en":["Fractions, decimals, percentages, ratio and proportion (Nf)","8","58%","Which objectives caused the lost marks: percentages, ratio or fraction operations?"],"ar":["Fractions, decimals, percentages, ratio and proportion (Nf)","8","58%","Which objectives caused the lost marks: percentages, ratio or fraction operations?"]},{"en":["Expressions, equations and formulae (Ae)","6","49%","Are learners unable to start, or making sign errors part-way through?"],"ar":["Expressions, equations and formulae (Ae)","6","49%","Are learners unable to start, or making sign errors part-way through?"]},{"en":["Sequences, functions and graphs (As)","4","64%","Do learners confuse the nth term with the next term?"],"ar":["Sequences, functions and graphs (As)","4","64%","Do learners confuse the nth term with the next term?"]},{"en":["Geometrical reasoning, shapes and measurements (Gg)","7","66%","Is the weakness in angle reasoning or in area and volume formulae?"],"ar":["Geometrical reasoning, shapes and measurements (Gg)","7","66%","Is the weakness in angle reasoning or in area and volume formulae?"]},{"en":["Statistics (Ss) and Probability (Sp)","5","75%","Are results secure enough to move to retrieval practice only?"],"ar":["Statistics (Ss) and Probability (Sp)","5","75%","Are results secure enough to move to retrieval practice only?"]}]},{"t":"p","c":{"en":"The class summary tells the teacher to start with Ae and Nf, because they have the lowest shares and many marks. But numbers of questions differ, so the teacher must not treat the percentages as equal weights, and must go to the objective level before planning. Each row suggests a question, not an answer. A tracker is most useful when it makes you ask better questions about teaching.","ar":"The class summary tells the teacher to start with Ae and Nf, because they have the lowest shares and many marks. But numbers of questions differ, so the teacher must not treat the percentages as equal weights, and must go to the objective level before planning. Each row suggests a question, not an answer. A tracker is most useful when it makes you ask better questions about teaching."}},{"t":"callout","k":"tip","title":{"en":"Good practice: share what you find","ar":"Good practice: share what you find"},"c":{"en":"Bring one finding and one action to your department meeting: \"On 8Ae.06, 43% of my class were correct. I will reteach with balance models and test again in three weeks.\" Others may have found the same or a better method. This is how departments improve together.","ar":"Bring one finding and one action to your department meeting: \"On 8Ae.06, 43% of my class were correct. I will reteach with balance models and test again in three weeks.\" Others may have found the same or a better method. This is how departments improve together."}}],"checks":[{"id":"m7q1","q":{"en":"What is the main reason to tag test questions with learning objective codes?","ar":"What is the main reason to tag test questions with learning objective codes?"},"opts":[{"en":"So the marks can be added up faster, which means the whole-school report can be ready earlier","ar":"So the marks can be added up faster, which means the whole-school report can be ready earlier"},{"en":"So the teacher can compare her class with other classes and rank the teachers in the department","ar":"So the teacher can compare her class with other classes and rank the teachers in the department"},{"en":"So results can be analysed by objective and strand, showing which parts need teaching again","ar":"So results can be analysed by objective and strand, showing which parts need teaching again"},{"en":"So each learner gets one overall level for the year, which can be reported without more evidence","ar":"So each learner gets one overall level for the year, which can be reported without more evidence"}],"correct":2,"expl":{"en":"Coding questions by objective turns marks into information that guides teaching. The other options use the codes for speed, ranking or levels, which is not their purpose.","ar":"Coding questions by objective turns marks into information that guides teaching. The other options use the codes for speed, ranking or levels, which is not their purpose."}},{"id":"m7q2","q":{"en":"In an invented class analysis, 12 of 28 learners answered an 8Ae.06 question correctly. What is the best interpretation?","ar":"In an invented class analysis, 12 of 28 learners answered an 8Ae.06 question correctly. What is the best interpretation?"},"opts":[{"en":"The whole class has failed the Algebra strand, so Stage 8 algebra should be taught again from the start","ar":"The whole class has failed the Algebra strand, so Stage 8 algebra should be taught again from the start"},{"en":"The question was too hard, so it should be removed from the analysis and the results recalculated","ar":"The question was too hard, so it should be removed from the analysis and the results recalculated"},{"en":"The twelve learners who were correct should be moved to Stage 9 lessons for the rest of the year","ar":"The twelve learners who were correct should be moved to Stage 9 lessons for the rest of the year"},{"en":"The objective needs attention, so check the actual errors to find the cause before choosing a fix","ar":"The objective needs attention, so check the actual errors to find the cause before choosing a fix"}],"correct":3,"expl":{"en":"A low result on one objective shows where to look. The errors show why. One question is limited evidence, so it should not trigger large decisions on its own.","ar":"A low result on one objective shows where to look. The errors show why. One question is limited evidence, so it should not trigger large decisions on its own."}},{"id":"m7q3","q":{"en":"A teacher cannot find the date of a learner's last assessment on a particular objective. What should she write in the tracker?","ar":"A teacher cannot find the date of a learner's last assessment on a particular objective. What should she write in the tracker?"},"opts":[{"en":"Leave the cell blank or mark it \"not yet assessed\" until she has real evidence","ar":"Leave the cell blank or mark it \"not yet assessed\" until she has real evidence"},{"en":"Write the same status as the learner's most recent test in a different topic","ar":"Write the same status as the learner's most recent test in a different topic"},{"en":"Write the status that she thinks is most likely, based on her impression of the learner","ar":"Write the status that she thinks is most likely, based on her impression of the learner"},{"en":"Write the class average status for that objective so that the row looks complete","ar":"Write the class average status for that objective so that the row looks complete"}],"correct":0,"expl":{"en":"A tracker should record evidence that exists. A blank or \"not yet assessed\" is honest. Estimates and averages can later be mistaken for facts.","ar":"A tracker should record evidence that exists. A blank or \"not yet assessed\" is honest. Estimates and averages can later be mistaken for facts."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A class of 28 Year 8 learners is never one group. Some learners need extra access, some need more challenge, some arrived with gaps from earlier years and some are still building English. This module looks at how to teach the same framework to all of them, and how to prepare learners for the step into Stage 7 and the step out of Stage 9.","ar":"A class of 28 Year 8 learners is never one group. Some learners need extra access, some need more challenge, some arrived with gaps from earlier years and some are still building English. This module looks at how to teach the same framework to all of them, and how to prepare learners for the step into Stage 7 and the step out of Stage 9."}},{"t":"callout","k":"key","title":{"en":"What the framework says, and what it does not say","ar":"What the framework says, and what it does not say"},"c":{"en":"The framework says that the objectives provide clear progression from the previous stage and to the next stage, that each step of the Cambridge Pathway builds on the learner's development from the previous one or from other educational systems, and that the framework is typically for learners aged 11 to 14 but may be used for slightly different ages to suit your context. The framework text does \u003cstrong>not\u003c/strong> have a section on students of determination (special educational needs and disabilities, SEND), gifted and talented learners or differentiation, and it does not name IGCSE content. Everything in this module on those topics is good practice or PEPS context, and is labelled that way.","ar":"The framework says that the objectives provide clear progression from the previous stage and to the next stage, that each step of the Cambridge Pathway builds on the learner's development from the previous one or from other educational systems, and that the framework is typically for learners aged 11 to 14 but may be used for slightly different ages to suit your context. The framework text does \u003cstrong>not\u003c/strong> have a section on students of determination (special educational needs and disabilities, SEND), gifted and talented learners or differentiation, and it does not name IGCSE content. Everything in this module on those topics is good practice or PEPS context, and is labelled that way."}},{"t":"h","c":{"en":"Differentiation: same objective, different routes (good practice)","ar":"Differentiation: same objective, different routes (good practice)"}},{"t":"p","c":{"en":"A helpful principle is that \u003cstrong>the objective stays the same for the class\u003c/strong> while the route, the support and the depth change. Learners who need support should not be given a different curriculum by default. They should be given a way into the same one. Learners who are ready for challenge should go deeper into the same objective before they move on to the next stage's content.","ar":"A helpful principle is that \u003cstrong>the objective stays the same for the class\u003c/strong> while the route, the support and the depth change. Learners who need support should not be given a different curriculum by default. They should be given a way into the same one. Learners who are ready for challenge should go deeper into the same objective before they move on to the next stage's content."}},{"t":"table","head":{"en":["Way to adjust","Support (more access)","Challenge (more depth)"],"ar":["Way to adjust","Support (more access)","Challenge (more depth)"]},"rows":[{"en":["Task","Start with a simpler or more concrete example of the same idea, such as whole-number ratios before decimals","Ask \"what if?\" questions that change the conditions, such as three-part ratios or unknown totals"],"ar":["Task","Start with a simpler or more concrete example of the same idea, such as whole-number ratios before decimals","Ask \"what if?\" questions that change the conditions, such as three-part ratios or unknown totals"]},{"en":["Representation","Provide bar models, algebra tiles, number lines, grids and worked examples","Ask learners to create their own representation and compare it with others (critiquing)"],"ar":["Representation","Provide bar models, algebra tiles, number lines, grids and worked examples","Ask learners to create their own representation and compare it with others (critiquing)"]},{"en":["Language","Sentence frames, word walls, home-language support, shorter sentences, key words highlighted","Ask for a written or spoken justification for all cases, using precise vocabulary"],"ar":["Language","Sentence frames, word walls, home-language support, shorter sentences, key words highlighted","Ask for a written or spoken justification for all cases, using precise vocabulary"]},{"en":["Pace and amount","Fewer questions, well chosen; more time; chunked steps","Fewer routine questions, more open problems and investigations"],"ar":["Pace and amount","Fewer questions, well chosen; more time; chunked steps","Fewer routine questions, more open problems and investigations"]},{"en":["Thinking","Prompt cards: \"What do I know? What do I need? What can I try?\"","Conjecture, generalise and prove: \"Will it always work? Can you convince a sceptic?\""],"ar":["Thinking","Prompt cards: \"What do I know? What do I need? What can I try?\"","Conjecture, generalise and prove: \"Will it always work? Can you convince a sceptic?\""]},{"en":["Adult help","Targeted small-group teaching or a teaching assistant, with a clear purpose","Mentoring, a problem-solving club or an NRICH-style activity (the framework mentions NRICH links in the schemes of work)"],"ar":["Adult help","Targeted small-group teaching or a teaching assistant, with a clear purpose","Mentoring, a problem-solving club or an NRICH-style activity (the framework mentions NRICH links in the schemes of work)"]}]},{"t":"h","c":{"en":"Students of determination (SEND)","ar":"Students of determination (SEND)"}},{"t":"p","c":{"en":"At PEPS, the school uses the term students of determination (PEPS context). For these learners, always work with the school's inclusion or learning-support team and follow the learner's individual education plan, if there is one. Do not create your own plan outside the school's system. Within your classroom, good practice includes:","ar":"At PEPS, the school uses the term students of determination (PEPS context). For these learners, always work with the school's inclusion or learning-support team and follow the learner's individual education plan, if there is one. Do not create your own plan outside the school's system. Within your classroom, good practice includes:"}},{"t":"list","c":{"en":["\u003cstrong>Know the barrier.\u003c/strong> Is it reading, memory, attention, motor control, vision, hearing, anxiety or language? Each needs a different adjustment.","\u003cstrong>Keep the high expectation.\u003c/strong> Ask the same TWM questions. Change the way learners can answer: by pointing, drawing, building or speaking.","\u003cstrong>Reduce the load, not the thinking.\u003c/strong> Use clear layout, one instruction at a time, enlarged diagrams and extra time. For geometry objectives that need accurate drawing, such as 8Gg.12, consider digital technology, because the framework itself mentions ruler and compass \u003cem>or\u003c/em> digital technology.","\u003cstrong>Check prerequisites quietly.\u003c/strong> A short diagnostic on earlier skills (for example, multiplication facts or place value) shows where support will help most.","\u003cstrong>Celebrate small steps.\u003c/strong> Record what the learner can now do, with dates and examples."],"ar":["\u003cstrong>Know the barrier.\u003c/strong> Is it reading, memory, attention, motor control, vision, hearing, anxiety or language? Each needs a different adjustment.","\u003cstrong>Keep the high expectation.\u003c/strong> Ask the same TWM questions. Change the way learners can answer: by pointing, drawing, building or speaking.","\u003cstrong>Reduce the load, not the thinking.\u003c/strong> Use clear layout, one instruction at a time, enlarged diagrams and extra time. For geometry objectives that need accurate drawing, such as 8Gg.12, consider digital technology, because the framework itself mentions ruler and compass \u003cem>or\u003c/em> digital technology.","\u003cstrong>Check prerequisites quietly.\u003c/strong> A short diagnostic on earlier skills (for example, multiplication facts or place value) shows where support will help most.","\u003cstrong>Celebrate small steps.\u003c/strong> Record what the learner can now do, with dates and examples."]}},{"t":"h","c":{"en":"Gifted and talented learners","ar":"Gifted and talented learners"}},{"t":"p","c":{"en":"Mathematically gifted learners may grasp procedures quickly, but they still need to meet ideas deeply. Good practice is to offer \u003cstrong>depth before speed\u003c/strong>. For a Year 7 learner who masters 7Ae.06 in one lesson, a better extension than moving to Stage 8 equations is: \"Write an equation with the solution x = 6 that uses the number 5 and the number 3. How many can you find? Can you make a rule?\" Use the TWM pairs: generalise, conjecture, classify, improve. Use NRICH-type problems. Talk with your HOD before acceleration, so that the learner does not lose coverage or meet Stage 8 content without the foundations. Identification of gifted and talented learners follows the school's own process.","ar":"Mathematically gifted learners may grasp procedures quickly, but they still need to meet ideas deeply. Good practice is to offer \u003cstrong>depth before speed\u003c/strong>. For a Year 7 learner who masters 7Ae.06 in one lesson, a better extension than moving to Stage 8 equations is: \"Write an equation with the solution x = 6 that uses the number 5 and the number 3. How many can you find? Can you make a rule?\" Use the TWM pairs: generalise, conjecture, classify, improve. Use NRICH-type problems. Talk with your HOD before acceleration, so that the learner does not lose coverage or meet Stage 8 content without the foundations. Identification of gifted and talented learners follows the school's own process."}},{"t":"h","c":{"en":"Transition into Stage 7 (from Primary Stage 6)","ar":"Transition into Stage 7 (from Primary Stage 6)"}},{"t":"p","c":{"en":"Year 7 is a new start in a new phase for many learners (PEPS context). The framework says each Cambridge step builds on the one before and that the Algebra strand builds on pre-algebra concepts in the primary stages. It does not list Stage 6 content, so look at the Stage 6 objectives in the Cambridge Primary Mathematics framework (0096) and compare them with Stage 7. Good practice for the first weeks:","ar":"Year 7 is a new start in a new phase for many learners (PEPS context). The framework says each Cambridge step builds on the one before and that the Algebra strand builds on pre-algebra concepts in the primary stages. It does not list Stage 6 content, so look at the Stage 6 objectives in the Cambridge Primary Mathematics framework (0096) and compare them with Stage 7. Good practice for the first weeks:"}},{"t":"list","c":{"en":["Run a short, friendly diagnostic using Stage 6 ideas that Stage 7 needs: place value, fractions, equivalent fractions and decimals, multiplication facts and basic measurement.","Teach early objectives such as 7Ni.01 and 7Ni.03 (integers) and 7Np.01 (place value and powers of 10) as secure foundations before heavier algebra.","Look at the vocabulary: which words from primary school do learners already know, and which are new?","Make routines explicit: how to set out working, how to use a ruler and protractor, how to show a method.","Do not repeat everything. Use the diagnostic to decide what to reteach."],"ar":["Run a short, friendly diagnostic using Stage 6 ideas that Stage 7 needs: place value, fractions, equivalent fractions and decimals, multiplication facts and basic measurement.","Teach early objectives such as 7Ni.01 and 7Ni.03 (integers) and 7Np.01 (place value and powers of 10) as secure foundations before heavier algebra.","Look at the vocabulary: which words from primary school do learners already know, and which are new?","Make routines explicit: how to set out working, how to use a ruler and protractor, how to show a method.","Do not repeat everything. Use the diagnostic to decide what to reteach."]}},{"t":"h","c":{"en":"Progression across Stages 7, 8 and 9","ar":"Progression across Stages 7, 8 and 9"}},{"t":"p","c":{"en":"The framework says the objectives give clear progression. Here are five lines of progression from the framework text. Reading across a row is useful for teaching and for spotting gaps.","ar":"The framework says the objectives give clear progression. Here are five lines of progression from the framework text. Reading across a row is useful for teaching and for spotting gaps."}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Enlargement","7Gp.06: positive integer scale factors","8Gp.06: from a centre outside or on the shape","9Gp.06: centre outside, on or inside; also 9Gp.07, effect on perimeter and area"],"ar":["Enlargement","7Gp.06: positive integer scale factors","8Gp.06: from a centre outside or on the shape","9Gp.06: centre outside, on or inside; also 9Gp.07, effect on perimeter and area"]},{"en":["Equations","7Ae.06: integer coefficients, unknown on one side","8Ae.06: integer or fractional coefficients, unknowns on either or both sides","9Ae.05: including an unknown in the denominator; 9Ae.06 simultaneous equations"],"ar":["Equations","7Ae.06: integer coefficients, unknown on one side","8Ae.06: integer or fractional coefficients, unknowns on either or both sides","9Ae.05: including an unknown in the denominator; 9Ae.06 simultaneous equations"]},{"en":["Circles","7Gg.03: parts of a circle","8Gg.02: pi as a ratio, circumference formula","9Gg.01: area and circumference formulae"],"ar":["Circles","7Gg.03: parts of a circle","8Gg.02: pi as a ratio, circumference formula","9Gg.01: area and circumference formulae"]},{"en":["Probability","7Sp.04: theoretical probability of equally likely outcomes","8Sp.03: equally likely combined events","9Sp.03: combined events"],"ar":["Probability","7Sp.04: theoretical probability of equally likely outcomes","8Sp.03: equally likely combined events","9Sp.03: combined events"]},{"en":["Indices","7Ni.02: order of operations with positive indices","8Ni.05: positive and zero indices; index laws","9Ni.02: positive, negative and zero indices"],"ar":["Indices","7Ni.02: order of operations with positive indices","8Ni.05: positive and zero indices; index laws","9Ni.02: positive, negative and zero indices"]}]},{"t":"h","c":{"en":"From Stage 9 towards IGCSE","ar":"From Stage 9 towards IGCSE"}},{"t":"p","c":{"en":"At PEPS, students move from Year 9 into Cambridge IGCSE Mathematics in Years 10 and 11 (PEPS context). The framework does not describe IGCSE. What it does say is that its objectives lead to the next stage and that Stage 9 has the most advanced lower secondary content: for example 9Ae.06 (simultaneous equations), 9Ae.07 (inequalities), 9Gg.10 (Pythagoras' theorem), 9Ni.03 (standard form) and 9As.05 (graphs of quadratic functions of the form y = x² ± a). Good practice for Year 9 teachers is to read the IGCSE syllabus that PEPS uses, or talk to the Year 10 teacher, to see what the next course expects; and to make sure Stage 9 objectives are secure, because IGCSE builds on them. Do not teach IGCSE topics early at the cost of Stage 9 depth.","ar":"At PEPS, students move from Year 9 into Cambridge IGCSE Mathematics in Years 10 and 11 (PEPS context). The framework does not describe IGCSE. What it does say is that its objectives lead to the next stage and that Stage 9 has the most advanced lower secondary content: for example 9Ae.06 (simultaneous equations), 9Ae.07 (inequalities), 9Gg.10 (Pythagoras' theorem), 9Ni.03 (standard form) and 9As.05 (graphs of quadratic functions of the form y = x² ± a). Good practice for Year 9 teachers is to read the IGCSE syllabus that PEPS uses, or talk to the Year 10 teacher, to see what the next course expects; and to make sure Stage 9 objectives are secure, because IGCSE builds on them. Do not teach IGCSE topics early at the cost of Stage 9 depth."}},{"t":"scenario","title":{"en":"Scenario: two learners, one objective","ar":"Scenario: two learners, one objective"},"c":{"en":"In a Year 8 class, Hamad finds 8Ae.06 (equations with unknowns on both sides) very hard. Noura finishes the exercise in ten minutes. \u003cstrong>For Hamad:\u003c/strong> go back to a balance model with one unknown on one side, use cubes and bags, then add a second step, and let him explain with a drawing. He keeps the same objective with extra access. \u003cstrong>For Noura:\u003c/strong> ask her to create an equation with unknowns on both sides whose solution is a negative fraction, and to test it with a partner (conjecturing, improving). Both learners work on 8Ae.06. Neither is left waiting or lost, and both are thinking mathematically.","ar":"In a Year 8 class, Hamad finds 8Ae.06 (equations with unknowns on both sides) very hard. Noura finishes the exercise in ten minutes. \u003cstrong>For Hamad:\u003c/strong> go back to a balance model with one unknown on one side, use cubes and bags, then add a second step, and let him explain with a drawing. He keeps the same objective with extra access. \u003cstrong>For Noura:\u003c/strong> ask her to create an equation with unknowns on both sides whose solution is a negative fraction, and to test it with a partner (conjecturing, improving). Both learners work on 8Ae.06. Neither is left waiting or lost, and both are thinking mathematically."}}],"checks":[{"id":"m8q1","q":{"en":"Which statement about learners with different needs is accurate for the framework?","ar":"Which statement about learners with different needs is accurate for the framework?"},"opts":[{"en":"The framework requires a separate set of learning objectives for students of determination in each stage","ar":"The framework requires a separate set of learning objectives for students of determination in each stage"},{"en":"The framework has no section on SEND or gifted learners, so these ideas are good practice and school policy","ar":"The framework has no section on SEND or gifted learners, so these ideas are good practice and school policy"},{"en":"The framework says gifted and talented learners should be moved to the next stage as soon as they finish","ar":"The framework says gifted and talented learners should be moved to the next stage as soon as they finish"},{"en":"The framework gives a list of approved adjustments for each learning objective and each type of need","ar":"The framework gives a list of approved adjustments for each learning objective and each type of need"}],"correct":1,"expl":{"en":"The framework does not have a section on SEND, gifted and talented learners or differentiation. Guidance on these comes from good practice and the school's own policies and teams.","ar":"The framework does not have a section on SEND, gifted and talented learners or differentiation. Guidance on these comes from good practice and the school's own policies and teams."}},{"id":"m8q2","q":{"en":"A Year 7 learner masters 7Ae.06 very quickly. Which response best matches good practice in this module?","ar":"A Year 7 learner masters 7Ae.06 very quickly. Which response best matches good practice in this module?"},"opts":[{"en":"Move the learner straight to 8Ae.06 and let the learner work alone from the Stage 8 textbook","ar":"Move the learner straight to 8Ae.06 and let the learner work alone from the Stage 8 textbook"},{"en":"Give the learner twenty more equations of the same type so that the procedure becomes automatic","ar":"Give the learner twenty more equations of the same type so that the procedure becomes automatic"},{"en":"Offer a deeper task on the same objective, such as creating equations, before Stage 8 content","ar":"Offer a deeper task on the same objective, such as creating equations, before Stage 8 content"},{"en":"Ask the learner to help mark other learners' books for the rest of the lesson each week","ar":"Ask the learner to help mark other learners' books for the rest of the lesson each week"}],"correct":2,"expl":{"en":"Depth before speed keeps the objective and develops TWM. Acceleration needs a conversation with the HOD, and more of the same practice does not extend thinking.","ar":"Depth before speed keeps the objective and develops TWM. Acceleration needs a conversation with the HOD, and more of the same practice does not extend thinking."}},{"id":"m8q3","q":{"en":"Which row shows correct progression from the framework?","ar":"Which row shows correct progression from the framework?"},"opts":[{"en":"Equations: 7Ae.06 includes unknowns on both sides, and 9Ae.05 returns to an unknown on one side","ar":"Equations: 7Ae.06 includes unknowns on both sides, and 9Ae.05 returns to an unknown on one side"},{"en":"Circles: 7Gg.03 uses the area formula, and 9Gg.01 introduces the parts of a circle for the first time","ar":"Circles: 7Gg.03 uses the area formula, and 9Gg.01 introduces the parts of a circle for the first time"},{"en":"Probability: 7Sp.04 covers combined events, and 9Sp.03 returns to single equally likely outcomes","ar":"Probability: 7Sp.04 covers combined events, and 9Sp.03 returns to single equally likely outcomes"},{"en":"Enlargement: 7Gp.06 has positive integer scale factors; 9Gp.06 allows a centre inside the shape","ar":"Enlargement: 7Gp.06 has positive integer scale factors; 9Gp.06 allows a centre inside the shape"}],"correct":3,"expl":{"en":"In the framework, 7Gp.06 is enlargement with positive integer scale factors, and 9Gp.06 extends the centre of enlargement to outside, on or inside the shape. The other rows reverse the real progression.","ar":"In the framework, 7Gp.06 is enlargement with positive integer scale factors, and 9Gp.06 extends the centre of enlargement to outside, on or inside the shape. The other rows reverse the real progression."}}]},{"id":"m9","title":{"en":"Quality and Review: Checking a Curriculum-Aligned Maths Lesson","ar":"Quality and Review: Checking a Curriculum-Aligned Maths Lesson"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This last module brings the earlier ones together. A high-quality lesson is not one that looks busy. It is one in which the objective is clear, learners think and talk about mathematics, the teacher finds out what each learner understands and the next lesson changes because of what was found. Use the checklist below to plan your own lessons, to reflect after teaching and, if your school agrees, in peer discussion with colleagues. It is a good-practice tool and not an official Cambridge or PEPS observation form.","ar":"This last module brings the earlier ones together. A high-quality lesson is not one that looks busy. It is one in which the objective is clear, learners think and talk about mathematics, the teacher finds out what each learner understands and the next lesson changes because of what was found. Use the checklist below to plan your own lessons, to reflect after teaching and, if your school agrees, in peer discussion with colleagues. It is a good-practice tool and not an official Cambridge or PEPS observation form."}},{"t":"h","c":{"en":"Checklist for a curriculum-aligned maths lesson","ar":"Checklist for a curriculum-aligned maths lesson"}},{"t":"table","head":{"en":["Area","Questions to ask","Where this came from"],"ar":["Area","Questions to ask","Where this came from"]},"rows":[{"en":["1. Objective","Is the main learning objective identified by code (for example 8Nf.05)? Does the lesson teach what the objective asks, with its limits?","Framework: objectives as structure and reference (Module 1)"],"ar":["1. Objective","Is the main learning objective identified by code (for example 8Nf.05)? Does the lesson teach what the objective asks, with its limits?","Framework: objectives as structure and reference (Module 1)"]},{"en":["2. Progression","Have I checked the previous and next stage in the same sub-strand? Are prerequisites secure?","Framework: clear progression across stages (Modules 1 and 8)"],"ar":["2. Progression","Have I checked the previous and next stage in the same sub-strand? Are prerequisites secure?","Framework: clear progression across stages (Modules 1 and 8)"]},{"en":["3. Success criteria","Do learners know what success looks like, in simple language?","Good practice"],"ar":["3. Success criteria","Do learners know what success looks like, in simple language?","Good practice"]},{"en":["4. TWM","Is at least one TWM characteristic built into the task, not added as a separate activity?","Framework: TWM embedded (Modules 2 and 3)"],"ar":["4. TWM","Is at least one TWM characteristic built into the task, not added as a separate activity?","Framework: TWM embedded (Modules 2 and 3)"]},{"en":["5. Talk and reasoning","Do learners explain, question and justify, in pairs and as a class? Have I planned my questions?","Framework: talk, challenge, evidence; good practice for technique (Module 3)"],"ar":["5. Talk and reasoning","Do learners explain, question and justify, in pairs and as a class? Have I planned my questions?","Framework: talk, challenge, evidence; good practice for technique (Module 3)"]},{"en":["6. Fluency and understanding","Is there estimation, practice and a link to meaning? Is the calculator expectation clear?","Framework: fluency, estimating; good practice (Module 4)"],"ar":["6. Fluency and understanding","Is there estimation, practice and a link to meaning? Is the calculator expectation clear?","Framework: fluency, estimating; good practice (Module 4)"]},{"en":["7. Language","Are key words taught and used? Are sentence frames or visuals available for ESL learners?","Framework: communicating in spoken and written language; good practice (Module 5)"],"ar":["7. Language","Are key words taught and used? Are sentence frames or visuals available for ESL learners?","Framework: communicating in spoken and written language; good practice (Module 5)"]},{"en":["8. Checking understanding","Do I use a check that every learner answers (whiteboards, hinge question, exit ticket)?","Good practice (Module 6)"],"ar":["8. Checking understanding","Do I use a check that every learner answers (whiteboards, hinge question, exit ticket)?","Good practice (Module 6)"]},{"en":["9. Inclusion and challenge","Can every learner access the main task? Is there depth for those who finish early?","Good practice (Module 8)"],"ar":["9. Inclusion and challenge","Can every learner access the main task? Is there depth for those who finish early?","Good practice (Module 8)"]},{"en":["10. Next steps","What will I do tomorrow because of what I found today? Where will I record it?","Good practice (Module 7)"],"ar":["10. Next steps","What will I do tomorrow because of what I found today? Where will I record it?","Good practice (Module 7)"]}]},{"t":"h","c":{"en":"Common mistakes to avoid","ar":"Common mistakes to avoid"}},{"t":"list","c":{"en":["\u003cstrong>Teaching the topic, not the objective.\u003c/strong> \"Fractions\" is a topic. 7Nf.03 (estimate, multiply and divide proper fractions) is an objective with limits. Check whether your lesson matches the objective for the stage.","\u003cstrong>Treating the scheme of work as compulsory,\u003c/strong> or the reverse: ignoring it without checking that every objective is still covered. The framework says you do not need to use the scheme of work, but it also says what the objectives are.","\u003cstrong>Separating TWM from content.\u003c/strong> A \"problem-solving Friday\" is not the same as embedding. Look for TWM in ordinary lessons.","\u003cstrong>Over-teaching the method.\u003c/strong> If learners always see the method before they try, they have little to think about. Let them try first, sometimes.","\u003cstrong>Confusing a busy lesson with a learning lesson.\u003c/strong> Activity is not evidence. Ask what each learner could do at the end that they could not do at the start.","\u003cstrong>Assuming an error is carelessness.\u003c/strong> Most repeated errors are misconceptions, and they need a different response from a careless slip.","\u003cstrong>Using test data without questions.\u003c/strong> A percentage or a level on its own does not tell you what to teach. Break results down by objective code and strand.","\u003cstrong>Making claims about Cambridge assessments that the framework does not make.\u003c/strong> If you are not sure what a test covers, check the support site or ask the Cambridge coordinator or exams officer.","\u003cstrong>Lowering the mathematics for learners who need language help.\u003c/strong> Change the language access, not the mathematical demand."],"ar":["\u003cstrong>Teaching the topic, not the objective.\u003c/strong> \"Fractions\" is a topic. 7Nf.03 (estimate, multiply and divide proper fractions) is an objective with limits. Check whether your lesson matches the objective for the stage.","\u003cstrong>Treating the scheme of work as compulsory,\u003c/strong> or the reverse: ignoring it without checking that every objective is still covered. The framework says you do not need to use the scheme of work, but it also says what the objectives are.","\u003cstrong>Separating TWM from content.\u003c/strong> A \"problem-solving Friday\" is not the same as embedding. Look for TWM in ordinary lessons.","\u003cstrong>Over-teaching the method.\u003c/strong> If learners always see the method before they try, they have little to think about. Let them try first, sometimes.","\u003cstrong>Confusing a busy lesson with a learning lesson.\u003c/strong> Activity is not evidence. Ask what each learner could do at the end that they could not do at the start.","\u003cstrong>Assuming an error is carelessness.\u003c/strong> Most repeated errors are misconceptions, and they need a different response from a careless slip.","\u003cstrong>Using test data without questions.\u003c/strong> A percentage or a level on its own does not tell you what to teach. Break results down by objective code and strand.","\u003cstrong>Making claims about Cambridge assessments that the framework does not make.\u003c/strong> If you are not sure what a test covers, check the support site or ask the Cambridge coordinator or exams officer.","\u003cstrong>Lowering the mathematics for learners who need language help.\u003c/strong> Change the language access, not the mathematical demand."]}},{"t":"scenario","title":{"en":"Scenario: reflecting on a Year 9 lesson","ar":"Scenario: reflecting on a Year 9 lesson"},"c":{"en":"A Year 9 teacher uses the checklist after a lesson on 9Gg.07 (the sum of the interior angles of any polygon). She notes: \u003cstrong>Objective\u003c/strong> clear (yes). \u003cstrong>Progression\u003c/strong> checked 8Gg.10 and 7Gg.11, but not the Stage 6 primary angle work (partly). \u003cstrong>TWM\u003c/strong>: learners found angle sums for triangles to hexagons and spotted the pattern (yes, specialising and generalising). \u003cstrong>Talk\u003c/strong>: only a few learners spoke; most worked silently (partly). \u003cstrong>Language\u003c/strong>: \"interior\" and \"polygon\" were not taught, and two ESL learners did not follow the task (no). \u003cstrong>Check\u003c/strong>: exit ticket used, but not read yet (partly). \u003cstrong>Next steps\u003c/strong>: she decides to read the exit tickets tonight, teach \"interior\" and \"exterior\" with a drawing tomorrow, and ask learners to explain the pattern in pairs first, using a sentence frame. The checklist did not give a mark. It gave her three clear actions.","ar":"A Year 9 teacher uses the checklist after a lesson on 9Gg.07 (the sum of the interior angles of any polygon). She notes: \u003cstrong>Objective\u003c/strong> clear (yes). \u003cstrong>Progression\u003c/strong> checked 8Gg.10 and 7Gg.11, but not the Stage 6 primary angle work (partly). \u003cstrong>TWM\u003c/strong>: learners found angle sums for triangles to hexagons and spotted the pattern (yes, specialising and generalising). \u003cstrong>Talk\u003c/strong>: only a few learners spoke; most worked silently (partly). \u003cstrong>Language\u003c/strong>: \"interior\" and \"polygon\" were not taught, and two ESL learners did not follow the task (no). \u003cstrong>Check\u003c/strong>: exit ticket used, but not read yet (partly). \u003cstrong>Next steps\u003c/strong>: she decides to read the exit tickets tonight, teach \"interior\" and \"exterior\" with a drawing tomorrow, and ask learners to explain the pattern in pairs first, using a sentence frame. The checklist did not give a mark. It gave her three clear actions."}},{"t":"h","c":{"en":"Questions for a department discussion","ar":"Questions for a department discussion"}},{"t":"list","c":{"en":["Which three objectives in our Stage 8 plan need most teaching time, and what is our evidence?","Where do we put TWM tasks in our unit plans, and do all classes have the same chances?","Which common misconceptions do we all see, and do we have a shared way of addressing each one?","Which key words do ESL learners find hardest, and how do we teach them consistently across classes?","What is our agreed way to use Checkpoint and GL results, by objective code or sub-strand, in our next planning meeting?","How do Year 6 colleagues and Year 10 colleagues hear about what we are teaching, so that transition is smoother?"],"ar":["Which three objectives in our Stage 8 plan need most teaching time, and what is our evidence?","Where do we put TWM tasks in our unit plans, and do all classes have the same chances?","Which common misconceptions do we all see, and do we have a shared way of addressing each one?","Which key words do ESL learners find hardest, and how do we teach them consistently across classes?","What is our agreed way to use Checkpoint and GL results, by objective code or sub-strand, in our next planning meeting?","How do Year 6 colleagues and Year 10 colleagues hear about what we are teaching, so that transition is smoother?"]}},{"t":"p","c":{"en":"These questions are good-practice prompts for a department meeting. Use them with your HOD, and record decisions in whatever format the school asks you to use.","ar":"These questions are good-practice prompts for a department meeting. Use them with your HOD, and record decisions in whatever format the school asks you to use."}},{"t":"h","c":{"en":"Your action plan","ar":"Your action plan"}},{"t":"p","c":{"en":"CPD is useful only if something changes. Choose \u003cstrong>two or three\u003c/strong> actions, not ten. Write each one with a date and a way to check it.","ar":"CPD is useful only if something changes. Choose \u003cstrong>two or three\u003c/strong> actions, not ten. Write each one with a date and a way to check it."}},{"t":"steps","c":{"en":["\u003cstrong>Choose one unit\u003c/strong> that you will teach in the next half term, and write its objective codes on one page, with the previous and next stage checked.","\u003cstrong>Choose one task\u003c/strong> in that unit and rewrite it so that it uses at least one TWM characteristic. Plan three questions.","\u003cstrong>Choose one language action:\u003c/strong> four to six key words, with a picture or example, and one sentence frame.","\u003cstrong>Choose one checking routine\u003c/strong> (mini whiteboards, a hinge question or an exit ticket) and use it in every lesson of the unit.","\u003cstrong>Analyse one assessment by objective code.\u003c/strong> Record one finding and one action, and share them with your HOD or department.","\u003cstrong>Review.\u003c/strong> At the end of the unit, ask: what changed in my planning and in learners' work? What will I keep?"],"ar":["\u003cstrong>Choose one unit\u003c/strong> that you will teach in the next half term, and write its objective codes on one page, with the previous and next stage checked.","\u003cstrong>Choose one task\u003c/strong> in that unit and rewrite it so that it uses at least one TWM characteristic. Plan three questions.","\u003cstrong>Choose one language action:\u003c/strong> four to six key words, with a picture or example, and one sentence frame.","\u003cstrong>Choose one checking routine\u003c/strong> (mini whiteboards, a hinge question or an exit ticket) and use it in every lesson of the unit.","\u003cstrong>Analyse one assessment by objective code.\u003c/strong> Record one finding and one action, and share them with your HOD or department.","\u003cstrong>Review.\u003c/strong> At the end of the unit, ask: what changed in my planning and in learners' work? What will I keep?"]}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> The framework tells you \u003cem>what\u003c/em> to teach, through objectives with codes. It does not tell you how to plan each lesson, and the schemes of work are not compulsory; plan from the objectives, within your school's expectations. \u003cstrong>2.\u003c/strong> Cambridge advocates active, student-centred learning. Embed Thinking and Working Mathematically in ordinary lessons, through tasks, questions and talk, not as a separate activity. \u003cstrong>3.\u003c/strong> Build fluency and understanding together; find and fix misconceptions; and teach the language of mathematics deliberately, especially for ESL learners. \u003cstrong>4.\u003c/strong> Use assessment evidence, tagged by objective code and strand, to decide what to teach next, and never to invent or guess data. \u003cstrong>5.\u003c/strong> Teach every learner the same curriculum with different support and challenge, and check progression to and from your stage. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"\u003cstrong>1.\u003c/strong> The framework tells you \u003cem>what\u003c/em> to teach, through objectives with codes. It does not tell you how to plan each lesson, and the schemes of work are not compulsory; plan from the objectives, within your school's expectations. \u003cstrong>2.\u003c/strong> Cambridge advocates active, student-centred learning. Embed Thinking and Working Mathematically in ordinary lessons, through tasks, questions and talk, not as a separate activity. \u003cstrong>3.\u003c/strong> Build fluency and understanding together; find and fix misconceptions; and teach the language of mathematics deliberately, especially for ESL learners. \u003cstrong>4.\u003c/strong> Use assessment evidence, tagged by objective code and strand, to decide what to teach next, and never to invent or guess data. \u003cstrong>5.\u003c/strong> Teach every learner the same curriculum with different support and challenge, and check progression to and from your stage. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"In the checklist, which lesson feature best shows that TWM is embedded rather than separate?","ar":"In the checklist, which lesson feature best shows that TWM is embedded rather than separate?"},"opts":[{"en":"An ordinary-lesson task requires learners to test examples, justify a conclusion or compare methods","ar":"An ordinary-lesson task requires learners to test examples, justify a conclusion or compare methods"},{"en":"A weekly investigation lesson is timetabled on Fridays, apart from the unit being taught that week","ar":"A weekly investigation lesson is timetabled on Fridays, apart from the unit being taught that week"},{"en":"The lesson plan lists the eight TWM characteristics in the header, although the tasks stay the same","ar":"The lesson plan lists the eight TWM characteristics in the header, although the tasks stay the same"},{"en":"The final five minutes of each lesson are used for a puzzle that is unrelated to the lesson objective","ar":"The final five minutes of each lesson are used for a puzzle that is unrelated to the lesson objective"}],"correct":0,"expl":{"en":"The framework says TWM should be embedded throughout the curriculum, not taught as a separate special activity. Tasks that need testing, justifying and comparing show that embedding in practice.","ar":"The framework says TWM should be embedded throughout the curriculum, not taught as a separate special activity. Tasks that need testing, justifying and comparing show that embedding in practice."}},{"id":"m9q2","q":{"en":"After a lesson, a teacher decides to read the exit tickets, reteach one idea and plan a sentence frame. Which checklist area is she mainly using?","ar":"After a lesson, a teacher decides to read the exit tickets, reteach one idea and plan a sentence frame. Which checklist area is she mainly using?"},"opts":[{"en":"Objective, because she has written the learning objective code on the board for the next lesson","ar":"Objective, because she has written the learning objective code on the board for the next lesson"},{"en":"Next steps, because she is using what she found to change tomorrow's teaching","ar":"Next steps, because she is using what she found to change tomorrow's teaching"},{"en }

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
