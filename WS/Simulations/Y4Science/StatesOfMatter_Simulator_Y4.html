<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS States of Matter Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .stage { background: #F3F8F7; border-radius: 12px; padding: 20px; position: relative; }
    .particle-box { position: relative; width: 100%; height: 220px; background: #fff; border: 2px solid #D0DEDC; border-radius: 8px; overflow: hidden; }
    .particle {
        position: absolute; width: 16px; height: 16px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6FD0E0, var(--primary));
    }

    .state-readout { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .state-name { font-size: 22px; font-weight: 800; color: var(--primary-dark); }
    .temp-readout { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; color: var(--accent); }

    .slider-row { margin-top: 18px; }
    .slider-row .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: #667; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .context-note { margin-top: 18px; background: #FFF6E9; border-radius: 8px; padding: 12px 16px; font-size: 13.5px; line-height: 1.55; color: #6b5a3f; min-height: 44px; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>States of Matter Simulator</h1>
        <p>Year 4 Science &mdash; Solid, Liquid or Gas?</p>
    </div>

    <div class="stage">
        <div class="particle-box" id="particleBox"></div>
        <div class="state-readout">
            <span class="state-name" id="stateName">Solid</span>
            <span class="temp-readout" id="tempReadout">-10&deg;C</span>
        </div>
        <div class="slider-row">
            <div class="labels"><span>&#10052;&#65039; Freezing</span><span>&#128293; Boiling</span></div>
            <input type="range" min="-20" max="120" value="-10" id="tempSlider" oninput="updateTemp()">
        </div>
        <div class="context-note" id="contextNote"></div>
    </div>
</div>

<script>
const PARTICLE_COUNT = 20;
let particles = [];

function createParticles(){
    const box = document.getElementById('particleBox');
    for(let i = 0; i < PARTICLE_COUNT; i++){
        const p = document.createElement('div');
        p.className = 'particle';
        box.appendChild(p);
        particles.push(p);
    }
}

function getState(temp){
    if(temp <= 0) return 'solid';
    if(temp < 100) return 'liquid';
    return 'gas';
}

function layoutParticles(state){
    const boxW = 300, boxH = 220; // logical layout space, matches CSS box proportions closely enough for placement math
    particles.forEach((p, i) => {
        if(state === 'solid'){
            const cols = 5;
            const col = i % cols;
            const row = Math.floor(i / cols);
            const baseX = 30 + col * 55;
            const baseY = 30 + row * 45;
            p.style.left = baseX + 'px';
            p.style.top = baseY + 'px';
            p.style.transition = 'left .3s, top .3s';
        } else if(state === 'liquid'){
            p.style.left = (20 + Math.random() * 240) + 'px';
            p.style.top = (100 + Math.random() * 100) + 'px';
            p.style.transition = 'left .6s ease-in-out, top .6s ease-in-out';
        } else {
            p.style.left = (Math.random() * 280) + 'px';
            p.style.top = (Math.random() * 190) + 'px';
            p.style.transition = 'left .25s linear, top .25s linear';
        }
    });
}

let animTimer = null;
function startAnimation(state){
    if(animTimer) clearInterval(animTimer);
    const interval = state === 'solid' ? 700 : (state === 'liquid' ? 900 : 350);
    animTimer = setInterval(() => layoutParticles(state), interval);
}

const NOTES = {
    solid: "The particles are packed tightly and can only vibrate in place \u2014 like an ice cube in a Sharjah freezer.",
    liquid: "The particles can slide past each other, so the substance flows and takes the shape of its container \u2014 like water in a bottle.",
    gas: "The particles move fast and spread far apart \u2014 like steam rising from a hot cup of tea."
};

function updateTemp(){
    const temp = parseInt(document.getElementById('tempSlider').value);
    const state = getState(temp);
    document.getElementById('tempReadout').textContent = temp + '\u00b0C';
    document.getElementById('stateName').textContent = state.charAt(0).toUpperCase() + state.slice(1);
    document.getElementById('contextNote').textContent = NOTES[state];
    layoutParticles(state);
    startAnimation(state);
}

createParticles();
updateTemp();
</script>
</body>
</html>
