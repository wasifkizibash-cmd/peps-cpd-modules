<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Magnetism Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .object-picker { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .obj-btn { background: #fff; border: 2px solid var(--primary); color: var(--primary-dark); padding: 9px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .obj-btn.active { background: var(--primary); color: #fff; }

    .stage { position: relative; height: 130px; background: #F3F8F7; border-radius: 12px; border: 2px solid #D0DEDC; overflow: hidden; }
    .magnet { position: absolute; top: 45px; font-size: 40px; transition: left .3s; }
    .test-object { position: absolute; top: 50px; right: 30px; font-size: 34px; transition: right .3s; }

    .slider-row { margin: 18px 0; }
    .slider-row .labels { display: flex; justify-content: space-between; font-size: 11.5px; color: #667; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: var(--primary); }

    .verdict { text-align: center; font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
    .verdict-desc { text-align: center; font-size: 13.5px; color: #667; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Magnetism Simulator</h1>
        <p>Year 4 Science &mdash; Which Materials Are Magnetic?</p>
    </div>

    <div class="object-picker" id="objectPicker"></div>

    <div class="stage">
        <div class="magnet" id="magnet" style="left:20px;">&#129517;</div>
        <div class="test-object" id="testObject"></div>
    </div>

    <div class="slider-row">
        <div class="labels"><span>Magnet far away</span><span>Magnet very close</span></div>
        <input type="range" min="0" max="100" value="0" id="distanceSlider" oninput="updateDistance()">
    </div>

    <div class="verdict" id="verdict"></div>
    <div class="verdict-desc" id="verdictDesc"></div>
</div>

<script>
const OBJECTS = {
    paperclip: { name: "Paper Clip", icon: "&#128206;", magnetic: true },
    nail:      { name: "Iron Nail",  icon: "&#128296;", magnetic: true },
    ruler:     { name: "Plastic Ruler", icon: "&#128207;", magnetic: false },
    eraser:    { name: "Rubber Eraser", icon: "&#129503;", magnetic: false },
    can:       { name: "Aluminium Can", icon: "&#129379;", magnetic: false }
};

let currentObject = 'paperclip';

function renderPicker(){
    const picker = document.getElementById('objectPicker');
    picker.innerHTML = Object.keys(OBJECTS).map(key => {
        const active = currentObject === key;
        return `<button class="obj-btn${active ? ' active' : ''}" onclick="selectObject('${key}')">${OBJECTS[key].name}</button>`;
    }).join('');
}

function selectObject(key){
    currentObject = key;
    document.getElementById('testObject').textContent = OBJECTS[key].icon;
    renderPicker();
    updateDistance();
}

function updateDistance(){
    const closeness = parseInt(document.getElementById('distanceSlider').value); // 0 = far, 100 = very close
    const magnet = document.getElementById('magnet');
    const testObj = document.getElementById('testObject');
    const obj = OBJECTS[currentObject];

    // Magnet always moves toward the object as slider increases
    const magnetLeft = 20 + (closeness / 100) * 400;
    magnet.style.left = magnetLeft + 'px';

    let objectMoved = 0;
    if(obj.magnetic){
        // The closer the magnet gets, the more the object is pulled toward it
        objectMoved = Math.round((closeness / 100) * 60);
    }
    testObj.style.right = (30 + objectMoved) + 'px';

    const verdict = document.getElementById('verdict');
    const desc = document.getElementById('verdictDesc');

    if(obj.magnetic){
        if(closeness < 20){
            verdict.textContent = obj.name + ' \u2014 no pull yet, too far away';
        } else if(closeness < 60){
            verdict.textContent = obj.name + ' \u2014 starting to feel a pull!';
        } else {
            verdict.textContent = obj.name + ' \u2014 strongly attracted!';
        }
        desc.textContent = "This object contains iron, so it is magnetic \u2014 the closer the magnet gets, the stronger the pull.";
    } else {
        verdict.textContent = obj.name + ' \u2014 not attracted, at any distance';
        desc.textContent = "This object is not magnetic, so the magnet has no effect on it no matter how close it gets.";
    }

    return { magnetic: obj.magnetic, objectMoved, closeness };
}

renderPicker();
selectObject('paperclip');
</script>
</body>
</html>
