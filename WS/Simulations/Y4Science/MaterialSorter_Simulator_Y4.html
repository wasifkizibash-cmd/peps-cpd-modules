<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPS Material Light Sorter Simulator - Year 4</title>
<style>
    :root { --primary: #007A87; --primary-dark: #005A64; --accent: #FF9E1B; --bg: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; --on: #2E8B57; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 820px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 26px; }
    .header-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    .header p { margin: 0; color: #666; font-style: italic; font-size: 14px; }

    .intro-note { text-align: center; font-size: 14px; color: #556; margin-bottom: 22px; }

    .material-picker { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
    .mat-btn { background: #fff; border: 2px solid var(--primary); color: var(--primary-dark); padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .mat-btn.active { background: var(--primary); color: #fff; }

    .beam-stage { display: flex; align-items: center; justify-content: center; gap: 0; background: #F3F8F7; border-radius: 12px; padding: 30px 20px; margin-bottom: 20px; min-height: 120px; }
    .torch { font-size: 40px; }
    .beam { height: 10px; width: 90px; border-radius: 4px; margin: 0 4px; transition: opacity .3s, background .3s; }
    .material-panel { width: 60px; height: 90px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; text-align: center; transition: background .3s, opacity .3s; }
    .beam-out { height: 10px; width: 90px; border-radius: 4px; margin: 0 4px; transition: opacity .3s, background .3s; }
    .result-icon { font-size: 30px; }

    .verdict { text-align: center; font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }
    .verdict-desc { text-align: center; font-size: 13.5px; color: #667; margin-bottom: 22px; min-height: 20px; }

    .sort-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .sort-zone { width: 210px; background: #FCFDFD; border: 2.5px dashed #C6D2CE; border-radius: 10px; padding: 12px; text-align: center; }
    .sort-zone .z-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .sort-zone .z-items { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 24px; font-size: 12px; }
    .sort-zone .z-items span { background: #E6F2F3; color: var(--primary); padding: 2px 8px; border-radius: 12px; font-weight: 600; }

    .btn-sort { display: block; margin: 18px auto 0; padding: 10px 20px; font-size: 13.5px; font-weight: 700; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .btn-sort:hover { background: var(--primary-dark); }
    .btn-sort:disabled { background: #B7C4C0; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="header-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">
        <h1>Material Light Sorter Simulator</h1>
        <p>Year 4 Science &mdash; Opaque, Translucent or Transparent?</p>
    </div>

    <p class="intro-note">Choose a material to shine the torch at, see how much light gets through, then sort it into the right group.</p>

    <div class="material-picker" id="materialPicker"></div>

    <div class="beam-stage">
        <span class="torch">&#128294;</span>
        <div class="beam" id="beamIn"></div>
        <div class="material-panel" id="materialPanel"></div>
        <div class="beam-out" id="beamOut"></div>
        <span class="result-icon" id="resultIcon"></span>
    </div>

    <div class="verdict" id="verdict"></div>
    <div class="verdict-desc" id="verdictDesc"></div>

    <button class="btn-sort" id="sortBtn" onclick="sortCurrentMaterial()" disabled>Sort This Material</button>

    <div class="sort-row" style="margin-top:22px;">
        <div class="sort-zone">
            <div class="z-name">Opaque</div>
            <div class="z-items" id="zone-opaque"></div>
        </div>
        <div class="sort-zone">
            <div class="z-name">Translucent</div>
            <div class="z-items" id="zone-translucent"></div>
        </div>
        <div class="sort-zone">
            <div class="z-name">Transparent</div>
            <div class="z-items" id="zone-transparent"></div>
        </div>
    </div>
</div>

<script>
const MATERIALS = {
    glass:   { name: "Clear Glass",  category: "transparent", desc: "Almost all the light passes straight through \u2014 you can see clearly on the other side." },
    frosted: { name: "Frosted Glass", category: "translucent", desc: "Some light gets through, but it's scattered and blurry \u2014 you can't see a clear picture through it." },
    wood:    { name: "Wooden Board", category: "opaque", desc: "No light passes through at all \u2014 it's completely blocked." },
    paper:   { name: "Tracing Paper", category: "translucent", desc: "A soft, dim glow comes through, but shapes on the other side look fuzzy." },
    foil:    { name: "Metal Foil",   category: "opaque", desc: "No light passes through \u2014 metal blocks light completely." },
    water:   { name: "Clear Water",  category: "transparent", desc: "Light passes straight through with barely any change \u2014 just like the glass." }
};

const BEAM_STYLE = {
    opaque:      { outOpacity: 0, panelColor: '#555', label: 'Opaque \u2014 no light gets through' },
    translucent: { outOpacity: 0.4, panelColor: '#9FD8C9', label: 'Translucent \u2014 some blurry light gets through' },
    transparent: { outOpacity: 1,   panelColor: '#CFEFEA', label: 'Transparent \u2014 light passes straight through' }
};

let currentMaterial = null;
let sortedItems = { opaque: [], translucent: [], transparent: [] };

function renderPicker(){
    const picker = document.getElementById('materialPicker');
    picker.innerHTML = Object.keys(MATERIALS).map(key => {
        const already = isSorted(key);
        const active = currentMaterial === key;
        return `<button class="mat-btn${active ? ' active' : ''}" ${already ? 'disabled' : ''} onclick="selectMaterial('${key}')">${MATERIALS[key].name}${already ? ' \u2713' : ''}</button>`;
    }).join('');
}

function isSorted(key){
    return sortedItems.opaque.includes(key) || sortedItems.translucent.includes(key) || sortedItems.transparent.includes(key);
}

function selectMaterial(key){
    currentMaterial = key;
    const mat = MATERIALS[key];
    const style = BEAM_STYLE[mat.category];

    document.getElementById('materialPanel').textContent = mat.name;
    document.getElementById('materialPanel').style.background = style.panelColor;
    document.getElementById('beamIn').style.background = '#FFD98A';
    document.getElementById('beamOut').style.background = '#FFD98A';
    document.getElementById('beamOut').style.opacity = style.outOpacity;
    document.getElementById('resultIcon').textContent = style.outOpacity === 0 ? '\u{1F6AB}' : (style.outOpacity < 1 ? '\u{1F32B}\uFE0F' : '\u2728');

    document.getElementById('verdict').textContent = style.label;
    document.getElementById('verdictDesc').textContent = mat.desc;

    document.getElementById('sortBtn').disabled = isSorted(key);
    renderPicker();
}

function sortCurrentMaterial(){
    if(!currentMaterial || isSorted(currentMaterial)) return;
    const mat = MATERIALS[currentMaterial];
    sortedItems[mat.category].push(currentMaterial);
    renderZones();
    document.getElementById('sortBtn').disabled = true;
    renderPicker();
}

function renderZones(){
    ['opaque','translucent','transparent'].forEach(cat => {
        document.getElementById('zone-' + cat).innerHTML = sortedItems[cat].map(key => `<span>${MATERIALS[key].name}</span>`).join('');
    });
}

function resetSim(){
    currentMaterial = null;
    sortedItems = { opaque: [], translucent: [], transparent: [] };
    document.getElementById('materialPanel').textContent = '';
    document.getElementById('materialPanel').style.background = '#eee';
    document.getElementById('beamOut').style.opacity = 0;
    document.getElementById('resultIcon').textContent = '';
    document.getElementById('verdict').textContent = '';
    document.getElementById('verdictDesc').textContent = '';
    document.getElementById('sortBtn').disabled = true;
    renderZones();
    renderPicker();
}

renderPicker();
renderZones();
</script>
</body>
</html>
