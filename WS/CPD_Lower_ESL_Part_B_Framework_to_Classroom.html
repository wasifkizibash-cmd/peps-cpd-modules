o.01, 8Lo.01, 8So.01, 8Wc.02 and 8Us.02. Which description fits the lesson?","ar":"A teacher plans a Stage 8 lesson with 8Ro.01, 8Lo.01, 8So.01, 8Wc.02 and 8Us.02. Which description fits the lesson?"},"opts":[{"en":"It covers only the Reading and Listening strands, because the codes begin with R and L","ar":"It covers only the Reading and Listening strands, because the codes begin with R and L"},{"en":"It belongs to Stage 9 because opinion objectives appear only in the last stage","ar":"It belongs to Stage 9 because opinion objectives appear only in the last stage"},{"en":"It combines Reading, Listening, Speaking, Writing and Use of English around one topic","ar":"It combines Reading, Listening, Speaking, Writing and Use of English around one topic"},{"en":"It is a Use of English lesson only, because 8Us.02 is the last code listed","ar":"It is a Use of English lesson only, because 8Us.02 is the last code listed"}],"correct":2,"expl":{"en":"The codes Ro, Lo, So, Wc and Us belong to Reading, Listening, Speaking, Writing and Use of English.","ar":"The codes Ro, Lo, So, Wc and Us belong to Reading, Listening, Speaking, Writing and Use of English."}},{"id":"m3q2","q":{"en":"Which planning decision best matches the framework's advice on lessons and strands?","ar":"Which planning decision best matches the framework's advice on lessons and strands?"},"opts":[{"en":"Plan each lesson around objectives from one strand to keep it simple","ar":"Plan each lesson around objectives from one strand to keep it simple"},{"en":"Plan lessons from the strand with the most objectives in the stage","ar":"Plan lessons from the strand with the most objectives in the stage"},{"en":"Plan Use of English lessons only after all other strands are finished","ar":"Plan Use of English lessons only after all other strands are finished"},{"en":"Plan lessons that include objectives from more than one strand","ar":"Plan lessons that include objectives from more than one strand"}],"correct":3,"expl":{"en":"The framework says teachers should try to plan lessons that include learning objectives from more than one strand.","ar":"The framework says teachers should try to plan lessons that include learning objectives from more than one strand."}},{"id":"m3q3","q":{"en":"In the Stage 9 \"Who must have done it?\" lesson, which objective is the Use of English focus?","ar":"In the Stage 9 \"Who must have done it?\" lesson, which objective is the Use of English focus?"},"opts":[{"en":"9Ug.14, past modal forms for speculation and deduction about the past","ar":"9Ug.14, past modal forms for speculation and deduction about the past"},{"en":"9Ld.01, deducing meaning and some implied meaning in talk","ar":"9Ld.01, deducing meaning and some implied meaning in talk"},{"en":"9Sor.02, summarising and making links in response to others","ar":"9Sor.02, summarising and making links in response to others"},{"en":"9Wc.01, writing extended texts that describe actions and events in detail","ar":"9Wc.01, writing extended texts that describe actions and events in detail"}],"correct":0,"expl":{"en":"9Ug.14 is in the Grammatical forms sub-strand of Use of English. The other codes are Listening, Speaking and Writing.","ar":"9Ug.14 is in the Grammatical forms sub-strand of Use of English. The other codes are Listening, Speaking and Writing."}}]},{"id":"m4","title":{"en":"Teaching Reading and Writing Well in Years 7 to 9","ar":"Teaching Reading and Writing Well in Years 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Reading and Writing are the two strands where learners leave the most visible evidence: a marked text, an underlined sentence, a written paragraph. They are also the two skills that carry most of the written assessment in later years. This module looks at what the framework asks for in Stages 7, 8 and 9 and offers practical routines. Anything that is not in the framework is marked \u003cstrong>good practice\u003c/strong>.","ar":"Reading and Writing are the two strands where learners leave the most visible evidence: a marked text, an underlined sentence, a written paragraph. They are also the two skills that carry most of the written assessment in later years. This module looks at what the framework asks for in Stages 7, 8 and 9 and offers practical routines. Anything that is not in the framework is marked \u003cstrong>good practice\u003c/strong>."}},{"t":"h","c":{"en":"What the framework says about reading across the stages","ar":"What the framework says about reading across the stages"}},{"t":"p","c":{"en":"Reading has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). The table shows how the wording changes for a selection of objectives. Notice the support wording and the range of texts.","ar":"Reading has three sub-strands: Reading for global meaning (Rm), Reading for detail (Rd) and Reading for opinion (Ro). The table shows how the wording changes for a selection of objectives. Notice the support wording and the range of texts."}},{"t":"table","head":{"en":["Focus","Stage 7","Stage 8","Stage 9"],"ar":["Focus","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Main points of texts","7Rm.01: most of the main points, with little or no support","8Rm.01: the main points, with little or no support","9Rm.01: the main points (no support wording)"],"ar":["Main points of texts","7Rm.01: most of the main points, with little or no support","8Rm.01: the main points, with little or no support","9Rm.01: the main points (no support wording)"]},{"en":["Reading extended texts for pleasure","7Rm.02: a limited range of extended fiction and non-fiction, with confidence and enjoyment","8Rm.02: an increasing range","9Rm.02: a range"],"ar":["Reading extended texts for pleasure","7Rm.02: a limited range of extended fiction and non-fiction, with confidence and enjoyment","8Rm.02: an increasing range","9Rm.02: a range"]},{"en":["Detail of an argument","7Rd.02: with support","8Rd.02: with little or no support","9Rd.02: no support wording"],"ar":["Detail of an argument","7Rd.02: with support","8Rd.02: with little or no support","9Rd.02: no support wording"]},{"en":["Inconsistencies in an argument","Not in Stage 7 objectives","8Rd.03: begin to recognise, with support","9Rd.03: recognise, with support"],"ar":["Inconsistencies in an argument","Not in Stage 7 objectives","8Rd.03: begin to recognise, with support","9Rd.03: recognise, with support"]},{"en":["Meaning from context","7Rd.03: deduce meaning, with little or no support","8Rd.04: also some implied meaning, with support","9Rd.04: some implied meaning, with little or no support"],"ar":["Meaning from context","7Rd.03: deduce meaning, with little or no support","8Rd.04: also some implied meaning, with support","9Rd.04: some implied meaning, with little or no support"]},{"en":["Opinion","7Ro.01: recognise opinions of the writer(s)","8Ro.01: recognise opinions of the writer(s)","9Ro.01 and 9Ro.02: draw relevant conclusions; tell fact from opinion, including bias"],"ar":["Opinion","7Ro.01: recognise opinions of the writer(s)","8Ro.01: recognise opinions of the writer(s)","9Ro.01 and 9Ro.02: draw relevant conclusions; tell fact from opinion, including bias"]}]},{"t":"p","c":{"en":"Three lessons for teaching follow from this table. First, \u003cstrong>text choice matters\u003c/strong>: Stage 7 learners should read extended texts, but from a limited range, so you build stamina gradually. Second, \u003cstrong>support is a dial\u003c/strong>: at Stage 8 learners need less support for the detail of an argument, but more complex skills (implied meaning, inconsistencies) are introduced \"with support\". Third, \u003cstrong>new skills appear in a supported form first\u003c/strong>, so you can plan to teach the skill with scaffolding, then remove it.","ar":"Three lessons for teaching follow from this table. First, \u003cstrong>text choice matters\u003c/strong>: Stage 7 learners should read extended texts, but from a limited range, so you build stamina gradually. Second, \u003cstrong>support is a dial\u003c/strong>: at Stage 8 learners need less support for the detail of an argument, but more complex skills (implied meaning, inconsistencies) are introduced \"with support\". Third, \u003cstrong>new skills appear in a supported form first\u003c/strong>, so you can plan to teach the skill with scaffolding, then remove it."}},{"t":"h","c":{"en":"Choosing texts (good practice)","ar":"Choosing texts (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Match the purpose to the objective.\u003c/strong> For 8Rd.01 (specific information) a timetable, a webpage or an email works. For 8Rd.02 (detail of an argument) you need a text that actually has an argument, such as a letter to a newspaper.","\u003cstrong>Include fiction and non-fiction.\u003c/strong> The framework names both in the Rm.02 objectives, so keep a balance across the year.","\u003cstrong>Check the load.\u003c/strong> Count unknown words. If more than about one in ten is unknown, the text is probably too hard for independent reading and needs more support (this \"one in ten\" figure is a rule of thumb, not a framework statement).","\u003cstrong>Choose relevant topics.\u003c/strong> The framework says lessons should be built around themes relevant to learners. A text about school life or technology in the UAE motivates more than a text on an unfamiliar topic.","\u003cstrong>Plan to read more than once.\u003c/strong> First for the main idea (Rm), then for detail (Rd), then for the writer's opinion (Ro)."],"ar":["\u003cstrong>Match the purpose to the objective.\u003c/strong> For 8Rd.01 (specific information) a timetable, a webpage or an email works. For 8Rd.02 (detail of an argument) you need a text that actually has an argument, such as a letter to a newspaper.","\u003cstrong>Include fiction and non-fiction.\u003c/strong> The framework names both in the Rm.02 objectives, so keep a balance across the year.","\u003cstrong>Check the load.\u003c/strong> Count unknown words. If more than about one in ten is unknown, the text is probably too hard for independent reading and needs more support (this \"one in ten\" figure is a rule of thumb, not a framework statement).","\u003cstrong>Choose relevant topics.\u003c/strong> The framework says lessons should be built around themes relevant to learners. A text about school life or technology in the UAE motivates more than a text on an unfamiliar topic.","\u003cstrong>Plan to read more than once.\u003c/strong> First for the main idea (Rm), then for detail (Rd), then for the writer's opinion (Ro)."]}},{"t":"h","c":{"en":"A reading routine: before, during, after (good practice)","ar":"A reading routine: before, during, after (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Before:\u003c/strong> activate prior knowledge with a picture, a title or a quick question; pre-teach three to five key words that learners could not guess from context.","\u003cstrong>First read (global):\u003c/strong> one question about the main idea or the writer's purpose. Keep it short so that all learners succeed.","\u003cstrong>Second read (detail):\u003c/strong> questions in the order of the text, then one or two that need deduction (\"What does \u003cem>reluctant\u003c/em> probably mean here? What clue helps?\").","\u003cstrong>Third read (opinion):\u003c/strong> highlight words that show the writer's view. Stage 9 learners also separate fact from opinion (9Ro.02).","\u003cstrong>After:\u003c/strong> a short speaking or writing task that uses the language of the text. This links to the integrated approach."],"ar":["\u003cstrong>Before:\u003c/strong> activate prior knowledge with a picture, a title or a quick question; pre-teach three to five key words that learners could not guess from context.","\u003cstrong>First read (global):\u003c/strong> one question about the main idea or the writer's purpose. Keep it short so that all learners succeed.","\u003cstrong>Second read (detail):\u003c/strong> questions in the order of the text, then one or two that need deduction (\"What does \u003cem>reluctant\u003c/em> probably mean here? What clue helps?\").","\u003cstrong>Third read (opinion):\u003c/strong> highlight words that show the writer's view. Stage 9 learners also separate fact from opinion (9Ro.02).","\u003cstrong>After:\u003c/strong> a short speaking or writing task that uses the language of the text. This links to the integrated approach."]}},{"t":"scenario","title":{"en":"Scenario: \"I read it, but I do not understand\"","ar":"Scenario: \"I read it, but I do not understand\""},"c":{"en":"A Year 7 learner reads a 300-word text aloud smoothly but cannot answer questions about it. What might be happening and what could you do? Reading aloud smoothly does not prove understanding. The learner may be decoding well but not deducing meaning (7Rd.03) or following the main points (7Rm.01). Try this good-practice sequence: ask the learner to tell you, in their own words or first language, what the text is about; point to two unknown words and ask them to use the sentence around them to guess; then give two simple questions on the main points, followed by two on detail. If a pattern of difficulty appears across the class, reduce the amount of text or add pre-teaching.","ar":"A Year 7 learner reads a 300-word text aloud smoothly but cannot answer questions about it. What might be happening and what could you do? Reading aloud smoothly does not prove understanding. The learner may be decoding well but not deducing meaning (7Rd.03) or following the main points (7Rm.01). Try this good-practice sequence: ask the learner to tell you, in their own words or first language, what the text is about; point to two unknown words and ask them to use the sentence around them to guess; then give two simple questions on the main points, followed by two on detail. If a pattern of difficulty appears across the class, reduce the amount of text or add pre-teaching."}},{"t":"h","c":{"en":"What the framework says about writing across the stages","ar":"What the framework says about writing across the stages"}},{"t":"p","c":{"en":"Writing also has three sub-strands: Communicative achievement (Wca), Organisation (Wor) and Content (Wc). The table compares how independence grows.","ar":"Writing also has three sub-strands: Communicative achievement (Wca), Organisation (Wor) and Content (Wc). The table compares how independence grows."}},{"t":"table","head":{"en":["Focus","Stage 7","Stage 8","Stage 9"],"ar":["Focus","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Process: generate ideas, plan, write, edit, proofread","7Wca.02: extended texts, with support","8Wca.02: extended texts, with little or no support","9Wca.02: extended texts independently"],"ar":["Process: generate ideas, plan, write, edit, proofread","7Wca.02: extended texts, with support","8Wca.02: extended texts, with little or no support","9Wca.02: extended texts independently"]},{"en":["Style and register","7Wca.03: with support","8Wca.03: with little or no support","9Wca.03: no support wording"],"ar":["Style and register","7Wca.03: with support","8Wca.03: with little or no support","9Wca.03: no support wording"]},{"en":["Accuracy","7Wca.04: mostly accurate, occasional mistakes","8Wca.04: also begin to correct their own errors","9Wca.04: no mistakes that cause misunderstanding; frequently correct own errors"],"ar":["Accuracy","7Wca.04: mostly accurate, occasional mistakes","8Wca.04: also begin to correct their own errors","9Wca.04: no mistakes that cause misunderstanding; frequently correct own errors"]},{"en":["Linking ideas","7Wor.02: link sentences and paragraphs, with support","8Wor.02: link ideas into coherent text","9Wor.02: link ideas and arguments"],"ar":["Linking ideas","7Wor.02: link sentences and paragraphs, with support","8Wor.02: link ideas into coherent text","9Wor.02: link ideas and arguments"]},{"en":["Describing","7Wc.01: short texts, with little or no support","8Wc.01: extended texts, with support","9Wc.01: extended texts in detail, with little or no support"],"ar":["Describing","7Wc.01: short texts, with little or no support","8Wc.01: extended texts, with support","9Wc.01: extended texts in detail, with little or no support"]},{"en":["Opinions and arguments","7Wc.02: with support, begin to develop arguments","8Wc.02: with little or no support, develop coherent arguments","9Wc.02: express opinions and develop coherent arguments"],"ar":["Opinions and arguments","7Wc.02: with support, begin to develop arguments","8Wc.02: with little or no support, develop coherent arguments","9Wc.02: express opinions and develop coherent arguments"]}]},{"t":"p","c":{"en":"Read the Stage 7 and Stage 8 Wc.01 rows carefully. Stage 7 asks for \u003cem>short\u003c/em> texts with little or no support; Stage 8 asks for \u003cem>extended\u003c/em> texts with support. In other words, when the text gets longer, support returns. This is a good reminder that moving to a harder task is a reason to bring back scaffolding, not a sign of failure.","ar":"Read the Stage 7 and Stage 8 Wc.01 rows carefully. Stage 7 asks for \u003cem>short\u003c/em> texts with little or no support; Stage 8 asks for \u003cem>extended\u003c/em> texts with support. In other words, when the text gets longer, support returns. This is a good reminder that moving to a harder task is a reason to bring back scaffolding, not a sign of failure."}},{"t":"h","c":{"en":"Modelling and scaffolding writing (good practice)","ar":"Modelling and scaffolding writing (good practice)"}},{"t":"p","c":{"en":"A common and effective approach has three phases. Teachers can use it for any genre in the framework, such as a description, a narrative, an opinion paragraph or a formal letter (check the framework for the genres named in your stage).","ar":"A common and effective approach has three phases. Teachers can use it for any genre in the framework, such as a description, a narrative, an opinion paragraph or a formal letter (check the framework for the genres named in your stage)."}},{"t":"table","head":{"en":["Phase","What happens","Example: Stage 8 opinion paragraph (8Wc.02)"],"ar":["Phase","What happens","Example: Stage 8 opinion paragraph (8Wc.02)"]},"rows":[{"en":["Model","The teacher shows a good example and \"thinks aloud\" about choices, with learners looking for features.","Show a paragraph with a clear opinion, a reason, an example and a contrast. Learners colour-code each part."],"ar":["Model","The teacher shows a good example and \"thinks aloud\" about choices, with learners looking for features.","Show a paragraph with a clear opinion, a reason, an example and a contrast. Learners colour-code each part."]},{"en":["Joint","The class writes a paragraph together, with the teacher scribing and learners suggesting.","Write a paragraph on \"homework should be shorter\". Learners suggest connectives (\u003cem>however, although\u003c/em>)."],"ar":["Joint","The class writes a paragraph together, with the teacher scribing and learners suggesting.","Write a paragraph on \"homework should be shorter\". Learners suggest connectives (\u003cem>however, although\u003c/em>)."]},{"en":["Independent","Learners write alone, with a checklist; support is reduced across the year.","Learners write on a new topic with the checklist: opinion, reason, example, contrast, punctuation."],"ar":["Independent","Learners write alone, with a checklist; support is reduced across the year.","Learners write on a new topic with the checklist: opinion, reason, example, contrast, punctuation."]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: give writing a purpose and a reader","ar":"Good practice: give writing a purpose and a reader"},"c":{"en":"The framework says writing should use \"style and register appropriate to a range of written genres\". Learners write better when they know who will read the text (a classmate, a younger student, a school newsletter). Choose a reader and a purpose first, then the genre.","ar":"The framework says writing should use \"style and register appropriate to a range of written genres\". Learners write better when they know who will read the text (a classmate, a younger student, a school newsletter). Choose a reader and a purpose first, then the genre."}},{"t":"h","c":{"en":"Feedback that helps learners improve (good practice)","ar":"Feedback that helps learners improve (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Mark selectively.\u003c/strong> Choose two or three error types linked to the lesson's objective, such as past simple forms and linking words. Marking everything discourages learners and hides priorities.","\u003cstrong>Use a simple correction code\u003c/strong> such as \u003cem>T\u003c/em> (tense), \u003cem>WW\u003c/em> (wrong word), \u003cem>Sp\u003c/em> (spelling), \u003cem>P\u003c/em> (punctuation), \u003cem>^\u003c/em> (word missing). The framework expects learners from Stage 8 to \"begin to correct their own errors\" (8Wca.04), so give them a chance to correct before you do.","\u003cstrong>Comment on content first.\u003c/strong> A short comment such as \"Your second reason is the strongest; add an example\" tells learners that ideas matter, not only grammar.","\u003cstrong>Give time to respond.\u003c/strong> Ten minutes for learners to rewrite two sentences is more useful than a long comment they never read.","\u003cstrong>Reuse errors.\u003c/strong> Collect two or three common errors from the class (without names) and use them in a \"Spot the mistake\" starter in the next lesson."],"ar":["\u003cstrong>Mark selectively.\u003c/strong> Choose two or three error types linked to the lesson's objective, such as past simple forms and linking words. Marking everything discourages learners and hides priorities.","\u003cstrong>Use a simple correction code\u003c/strong> such as \u003cem>T\u003c/em> (tense), \u003cem>WW\u003c/em> (wrong word), \u003cem>Sp\u003c/em> (spelling), \u003cem>P\u003c/em> (punctuation), \u003cem>^\u003c/em> (word missing). The framework expects learners from Stage 8 to \"begin to correct their own errors\" (8Wca.04), so give them a chance to correct before you do.","\u003cstrong>Comment on content first.\u003c/strong> A short comment such as \"Your second reason is the strongest; add an example\" tells learners that ideas matter, not only grammar.","\u003cstrong>Give time to respond.\u003c/strong> Ten minutes for learners to rewrite two sentences is more useful than a long comment they never read.","\u003cstrong>Reuse errors.\u003c/strong> Collect two or three common errors from the class (without names) and use them in a \"Spot the mistake\" starter in the next lesson."]}},{"t":"callout","k":"warn","title":{"en":"Accuracy is a direction, not perfection","ar":"Accuracy is a direction, not perfection"},"c":{"en":"The framework allows for mistakes. 7Wca.04 says \"mostly accurate... allowing for occasional mistakes\", and 9Wca.04 says without \"mistakes which cause misunderstanding\". Do not expect error-free writing from a Stage 7 learner. Do act on mistakes that block meaning, and on patterns across the class.","ar":"The framework allows for mistakes. 7Wca.04 says \"mostly accurate... allowing for occasional mistakes\", and 9Wca.04 says without \"mistakes which cause misunderstanding\". Do not expect error-free writing from a Stage 7 learner. Do act on mistakes that block meaning, and on patterns across the class."}},{"t":"scenario","title":{"en":"Scenario: a long text with one long sentence","ar":"Scenario: a long text with one long sentence"},"c":{"en":"A Year 8 learner writes a good 150-word account of a trip, but uses one very long sentence connected only by \"and\". Which objectives help? 8Wor.02 (link ideas into coherent extended text using a range of connectives), 8Us.02 (connectives to indicate purpose and contrast) and 8Wor.01 (punctuate with reasonable accuracy). Good practice: highlight the long sentence, ask the learner to split it into three, and then to join two parts with \u003cem>although\u003c/em> or \u003cem>however\u003c/em>. The learner is not only corrected but also practises the target language.","ar":"A Year 8 learner writes a good 150-word account of a trip, but uses one very long sentence connected only by \"and\". Which objectives help? 8Wor.02 (link ideas into coherent extended text using a range of connectives), 8Us.02 (connectives to indicate purpose and contrast) and 8Wor.01 (punctuate with reasonable accuracy). Good practice: highlight the long sentence, ask the learner to split it into three, and then to join two parts with \u003cem>although\u003c/em> or \u003cem>however\u003c/em>. The learner is not only corrected but also practises the target language."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Reading: choose texts to suit the objective, read more than once, and plan support to be reduced across the stages. Writing: model, write jointly, then write independently, and give selective feedback with time to respond. The framework allows for occasional mistakes; accuracy and independence grow from Stage 7 to Stage 9.","ar":"Reading: choose texts to suit the objective, read more than once, and plan support to be reduced across the stages. Writing: model, write jointly, then write independently, and give selective feedback with time to respond. The framework allows for occasional mistakes; accuracy and independence grow from Stage 7 to Stage 9."}}],"checks":[{"id":"m4q1","q":{"en":"How does the wording of Rm.02 change across Stages 7, 8 and 9?","ar":"How does the wording of Rm.02 change across Stages 7, 8 and 9?"},"opts":[{"en":"A range of extended texts at every stage, with only the confidence wording changing","ar":"A range of extended texts at every stage, with only the confidence wording changing"},{"en":"A limited range of extended texts, then an increasing range, then a range","ar":"A limited range of extended texts, then an increasing range, then a range"},{"en":"One extended text, then two, then three, with fiction before non-fiction","ar":"One extended text, then two, then three, with fiction before non-fiction"},{"en":"Short simple texts, then extended texts, then academic texts only in Stage 9","ar":"Short simple texts, then extended texts, then academic texts only in Stage 9"}],"correct":1,"expl":{"en":"7Rm.02 says a limited range, 8Rm.02 an increasing range and 9Rm.02 a range of extended fiction and non-fiction texts.","ar":"7Rm.02 says a limited range, 8Rm.02 an increasing range and 9Rm.02 a range of extended fiction and non-fiction texts."}},{"id":"m4q2","q":{"en":"In the framework, which Stage 8 objective asks learners to begin to correct their own errors in writing?","ar":"In the framework, which Stage 8 objective asks learners to begin to correct their own errors in writing?"},"opts":[{"en":"8Wor.01","ar":"8Wor.01"},{"en":"8Wca.02","ar":"8Wca.02"},{"en":"8Wca.04","ar":"8Wca.04"},{"en":"8Wc.01","ar":"8Wc.01"}],"correct":2,"expl":{"en":"8Wca.04 asks for mostly accurate written language with occasional mistakes and beginning to correct own errors.","ar":"8Wca.04 asks for mostly accurate written language with occasional mistakes and beginning to correct own errors."}},{"id":"m4q3","q":{"en":"A teacher marks every error in a Year 7 learner's paragraph in red. Which good-practice change fits Module 4?","ar":"A teacher marks every error in a Year 7 learner's paragraph in red. Which good-practice change fits Module 4?"},"opts":[{"en":"Mark only spelling, because the framework treats spelling as the main writing objective","ar":"Mark only spelling, because the framework treats spelling as the main writing objective"},{"en":"Stop marking written work in Stage 7, because accuracy is not expected until Stage 9","ar":"Stop marking written work in Stage 7, because accuracy is not expected until Stage 9"},{"en":"Mark all errors but remove the grade, so that learners do not feel the pressure","ar":"Mark all errors but remove the grade, so that learners do not feel the pressure"},{"en":"Mark two or three errors linked to the lesson objective and give time to correct them","ar":"Mark two or three errors linked to the lesson objective and give time to correct them"}],"correct":3,"expl":{"en":"Selective marking linked to the objective, with time to respond, is the good practice described in this module.","ar":"Selective marking linked to the objective, with time to respond, is the good practice described in this module."}}]},{"id":"m5","title":{"en":"Teaching Listening, Speaking and Use of English; Managing Mixed-Level Classes","ar":"Teaching Listening, Speaking and Use of English; Managing Mixed-Level Classes"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Listening and speaking are the skills that disappear if teachers do not plan for them. A written task leaves a page; a conversation leaves nothing. In a class of 25 to 30 learners, the challenge is to give everyone real practice. This module looks at listening, speaking and the Use of English strand, and ends with the practical question of mixed levels. Framework statements are marked as such; routines that are not in the framework are labelled \u003cstrong>good practice\u003c/strong>.","ar":"Listening and speaking are the skills that disappear if teachers do not plan for them. A written task leaves a page; a conversation leaves nothing. In a class of 25 to 30 learners, the challenge is to give everyone real practice. This module looks at listening, speaking and the Use of English strand, and ends with the practical question of mixed levels. Framework statements are marked as such; routines that are not in the framework are labelled \u003cstrong>good practice\u003c/strong>."}},{"t":"h","c":{"en":"Listening: what the framework asks","ar":"Listening: what the framework asks"}},{"t":"p","c":{"en":"The Listening sub-strands mirror those of Reading: Listening for global meaning (Lm), for detail (Ld) and for opinion (Lo). The framework says the similar names are there \"to help you to identify links between Reading and Listening skills, and to reflect these in your teaching.\" This is a practical clue: a skill you teach in reading, such as finding implied meaning, can be taught in a listening lesson in the same way.","ar":"The Listening sub-strands mirror those of Reading: Listening for global meaning (Lm), for detail (Ld) and for opinion (Lo). The framework says the similar names are there \"to help you to identify links between Reading and Listening skills, and to reflect these in your teaching.\" This is a practical clue: a skill you teach in reading, such as finding implied meaning, can be taught in a listening lesson in the same way."}},{"t":"list","c":{"en":["\u003cstrong>Main points (Lm):\u003c/strong> 7Lm.01 and 8Lm.01 ask for understanding, with little or no support, of the main points of short and extended talk. 9Lm.01 has no support wording.","\u003cstrong>Detail (Ld):\u003c/strong> 7Ld.01 is deducing meaning from context. 8Ld.01 and 9Ld.01 add some implied meaning. 8Ld.04 and 9Ld.04 add inconsistencies in an argument, with support.","\u003cstrong>Opinion (Lo):\u003c/strong> 7Lo.01 and 8Lo.01 recognise speakers' opinions. 9Lo.01 adds relevant conclusions, and 9Lo.02 adds fact and opinion, including bias."],"ar":["\u003cstrong>Main points (Lm):\u003c/strong> 7Lm.01 and 8Lm.01 ask for understanding, with little or no support, of the main points of short and extended talk. 9Lm.01 has no support wording.","\u003cstrong>Detail (Ld):\u003c/strong> 7Ld.01 is deducing meaning from context. 8Ld.01 and 9Ld.01 add some implied meaning. 8Ld.04 and 9Ld.04 add inconsistencies in an argument, with support.","\u003cstrong>Opinion (Lo):\u003c/strong> 7Lo.01 and 8Lo.01 recognise speakers' opinions. 9Lo.01 adds relevant conclusions, and 9Lo.02 adds fact and opinion, including bias."]}},{"t":"h","c":{"en":"A listening routine (good practice)","ar":"A listening routine (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Prepare:\u003c/strong> give the topic, a purpose question and two or three key words. Learners should know what to listen for.","\u003cstrong>First listening (global):\u003c/strong> one question about the main idea or who is speaking and why. Pairs compare answers.","\u003cstrong>Second listening (detail):\u003c/strong> a table to complete or true/false statements. Pause the audio at key points if learners need it.","\u003cstrong>Third listening (language):\u003c/strong> give a short transcript extract with gaps; learners listen for a target structure or connective.","\u003cstrong>Follow-up:\u003c/strong> use the content in a speaking or writing task, for example \"Do you agree with the speaker? Why?\""],"ar":["\u003cstrong>Prepare:\u003c/strong> give the topic, a purpose question and two or three key words. Learners should know what to listen for.","\u003cstrong>First listening (global):\u003c/strong> one question about the main idea or who is speaking and why. Pairs compare answers.","\u003cstrong>Second listening (detail):\u003c/strong> a table to complete or true/false statements. Pause the audio at key points if learners need it.","\u003cstrong>Third listening (language):\u003c/strong> give a short transcript extract with gaps; learners listen for a target structure or connective.","\u003cstrong>Follow-up:\u003c/strong> use the content in a speaking or writing task, for example \"Do you agree with the speaker? Why?\""]}},{"t":"callout","k":"tip","title":{"en":"Good practice: listening is not a test","ar":"Good practice: listening is not a test"},"c":{"en":"Many learners think a listening lesson means \"play once and mark\". Treat listening as something to teach: play more than once, use short extracts, and let learners listen for different things each time. Reserve single-play listening for check tasks.","ar":"Many learners think a listening lesson means \"play once and mark\". Treat listening as something to teach: play more than once, use short extracts, and let learners listen for different things each time. Reserve single-play listening for check tasks."}},{"t":"h","c":{"en":"Speaking: what the framework asks","ar":"Speaking: what the framework asks"}},{"t":"p","c":{"en":"Speaking has three sub-strands: Communication (Sc), Express opinion (So) and Organisation (Sor). The Communication objectives about sounds and fluency are worth reading carefully, because they describe a realistic target.","ar":"Speaking has three sub-strands: Communication (Sc), Express opinion (So) and Organisation (Sor). The Communication objectives about sounds and fluency are worth reading carefully, because they describe a realistic target."}},{"t":"table","head":{"en":["Focus","Stage 7","Stage 8","Stage 9"],"ar":["Focus","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Pronunciation","7Sc.03: pronounce most words and phrases clearly; generally use intonation and stress appropriately","8Sc.03: pronounce words and phrases clearly; generally appropriate intonation and stress","9Sc.03: pronounce clearly; use intonation and stress appropriately"],"ar":["Pronunciation","7Sc.03: pronounce most words and phrases clearly; generally use intonation and stress appropriately","8Sc.03: pronounce words and phrases clearly; generally appropriate intonation and stress","9Sc.03: pronounce clearly; use intonation and stress appropriately"]},{"en":["Fluency","7Sc.04: produce and maintain stretches of language comprehensibly, allowing for occasional hesitation and reformulation","8Sc.04: with relative ease, allowing for occasional hesitation","9Sc.04: begin to produce stretches with a degree of fluency and spontaneity"],"ar":["Fluency","7Sc.04: produce and maintain stretches of language comprehensibly, allowing for occasional hesitation and reformulation","8Sc.04: with relative ease, allowing for occasional hesitation","9Sc.04: begin to produce stretches with a degree of fluency and spontaneity"]},{"en":["Accuracy","7Sc.05: mostly accurate, allowing for occasional mistakes","8Sc.05: occasional mistakes; begin to correct own errors","9Sc.05: no mistakes that cause misunderstanding; frequently correct own errors"],"ar":["Accuracy","7Sc.05: mostly accurate, allowing for occasional mistakes","8Sc.05: occasional mistakes; begin to correct own errors","9Sc.05: no mistakes that cause misunderstanding; frequently correct own errors"]},{"en":["Opinions","7So.01: with support, begin to develop arguments","8So.01: with little or no support, justify points of view","9So.01: also evaluate the opinions of others"],"ar":["Opinions","7So.01: with support, begin to develop arguments","8So.01: with little or no support, justify points of view","9So.01: also evaluate the opinions of others"]}]},{"t":"p","c":{"en":"The framework accepts hesitation and reformulation (\"allowing for occasional hesitation and reformulation\"). This is a helpful message for learners who are afraid of making mistakes: speaking in a second language is not a performance of perfect sentences. It is a process of finding words, trying again and getting the message across.","ar":"The framework accepts hesitation and reformulation (\"allowing for occasional hesitation and reformulation\"). This is a helpful message for learners who are afraid of making mistakes: speaking in a second language is not a performance of perfect sentences. It is a process of finding words, trying again and getting the message across."}},{"t":"h","c":{"en":"Talk routines for large classes (good practice)","ar":"Talk routines for large classes (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Think, pair, share.\u003c/strong> Individual thinking time (one minute), then pair talk, then a few pairs share. All learners speak, not only the confident ones.","\u003cstrong>Information-gap tasks.\u003c/strong> Partner A and B hold different information (a timetable, a picture) and must ask questions (7Sc.02, 8Sc.02, 9Sc.02: ask questions to find detailed information).","\u003cstrong>Roles in group discussion.\u003c/strong> Give each learner a role: speaker, questioner, summariser, time-keeper. The summariser practises 7Sor.02, 8Sor.02 and 9Sor.02.","\u003cstrong>Stand-up mingle.\u003c/strong> Learners move around with a question card and speak to five different people. Ten minutes gives each learner more speaking time than a whole lesson of teacher-led questions.","\u003cstrong>Recorded talk.\u003c/strong> Learners record a one-minute talk on a phone or tablet, listen to it and choose one thing to improve. This supports reflection and the \"begin to correct their own errors\" idea in 8Sc.05."],"ar":["\u003cstrong>Think, pair, share.\u003c/strong> Individual thinking time (one minute), then pair talk, then a few pairs share. All learners speak, not only the confident ones.","\u003cstrong>Information-gap tasks.\u003c/strong> Partner A and B hold different information (a timetable, a picture) and must ask questions (7Sc.02, 8Sc.02, 9Sc.02: ask questions to find detailed information).","\u003cstrong>Roles in group discussion.\u003c/strong> Give each learner a role: speaker, questioner, summariser, time-keeper. The summariser practises 7Sor.02, 8Sor.02 and 9Sor.02.","\u003cstrong>Stand-up mingle.\u003c/strong> Learners move around with a question card and speak to five different people. Ten minutes gives each learner more speaking time than a whole lesson of teacher-led questions.","\u003cstrong>Recorded talk.\u003c/strong> Learners record a one-minute talk on a phone or tablet, listen to it and choose one thing to improve. This supports reflection and the \"begin to correct their own errors\" idea in 8Sc.05."]}},{"t":"h","c":{"en":"Pronunciation (good practice)","ar":"Pronunciation (good practice)"}},{"t":"p","c":{"en":"The framework refers to word, phrase and sentence level: \u003cem>word stress\u003c/em> (\u003cem>PHOtograph\u003c/em> and \u003cem>phoTOgraphy\u003c/em>), \u003cem>sentence stress\u003c/em> (the important words in a sentence are said more strongly) and \u003cem>intonation\u003c/em> (the voice going up or down). Teach one feature at a time, in short slots of three to five minutes, and link it to the lesson's language. For example, in a lesson on past modal forms, practise the weak pronunciation of \u003cem>have\u003c/em> in \"must have\" (\u003cem>mustuv\u003c/em>). Focus on sounds that affect understanding for your learners rather than trying to remove an accent.","ar":"The framework refers to word, phrase and sentence level: \u003cem>word stress\u003c/em> (\u003cem>PHOtograph\u003c/em> and \u003cem>phoTOgraphy\u003c/em>), \u003cem>sentence stress\u003c/em> (the important words in a sentence are said more strongly) and \u003cem>intonation\u003c/em> (the voice going up or down). Teach one feature at a time, in short slots of three to five minutes, and link it to the lesson's language. For example, in a lesson on past modal forms, practise the weak pronunciation of \u003cem>have\u003c/em> in \"must have\" (\u003cem>mustuv\u003c/em>). Focus on sounds that affect understanding for your learners rather than trying to remove an accent."}},{"t":"h","c":{"en":"Use of English in context","ar":"Use of English in context"}},{"t":"p","c":{"en":"The Use of English strand has three sub-strands: Grammatical forms (Ug), Vocabulary (Uv) and Sentence structure (Us). Note the framework's own labels: connectives, relative clauses and infinitive/gerund forms are in Sentence structure (Us); prepositions, noun phrases and compound nouns are in Vocabulary (Uv). The framework says Use of English provides \"the linguistic features they need\" for the four skills, so it should be taught \u003cem>in context\u003c/em>, not as a list of rules.","ar":"The Use of English strand has three sub-strands: Grammatical forms (Ug), Vocabulary (Uv) and Sentence structure (Us). Note the framework's own labels: connectives, relative clauses and infinitive/gerund forms are in Sentence structure (Us); prepositions, noun phrases and compound nouns are in Vocabulary (Uv). The framework says Use of English provides \"the linguistic features they need\" for the four skills, so it should be taught \u003cem>in context\u003c/em>, not as a list of rules."}},{"t":"table","head":{"en":["Routine (good practice)","How it works","Example"],"ar":["Routine (good practice)","How it works","Example"]},"rows":[{"en":["Notice and name","Learners find a structure in a text or recording, then work out the pattern.","Find four sentences with \u003cem>wish\u003c/em> in a short text (8Ug.10) and decide what they have in common."],"ar":["Notice and name","Learners find a structure in a text or recording, then work out the pattern.","Find four sentences with \u003cem>wish\u003c/em> in a short text (8Ug.10) and decide what they have in common."]},{"en":["Controlled to free practice","Move from gap-fill to guided speaking to free speaking or writing.","Gap-fill on passive forms, then describe how a school canteen works, then write a short report (7Ug.02)."],"ar":["Controlled to free practice","Move from gap-fill to guided speaking to free speaking or writing.","Gap-fill on passive forms, then describe how a school canteen works, then write a short report (7Ug.02)."]},{"en":["Vocabulary notebook with review","Learners record the word, an example sentence, the partner words (collocations) and a translation if needed, and review at set intervals.","\u003cem>depend on, interested in, good at\u003c/em> for dependent prepositions (7Uv.01)."],"ar":["Vocabulary notebook with review","Learners record the word, an example sentence, the partner words (collocations) and a translation if needed, and review at set intervals.","\u003cem>depend on, interested in, good at\u003c/em> for dependent prepositions (7Uv.01)."]},{"en":["Word families and chunks","Teach words in groups: \u003cem>decide, decision, decisive\u003c/em>; or in chunks such as \u003cem>in my opinion, on the other hand\u003c/em>.","Chunks used in the discussion task in Module 3."],"ar":["Word families and chunks","Teach words in groups: \u003cem>decide, decision, decisive\u003c/em>; or in chunks such as \u003cem>in my opinion, on the other hand\u003c/em>.","Chunks used in the discussion task in Module 3."]},{"en":["Error correction game","Learners correct sentences that contain common class errors.","\u003cem>She suggested me to go\u003c/em> becomes \u003cem>She suggested that I go\u003c/em> or \u003cem>She suggested going\u003c/em>."],"ar":["Error correction game","Learners correct sentences that contain common class errors.","\u003cem>She suggested me to go\u003c/em> becomes \u003cem>She suggested that I go\u003c/em> or \u003cem>She suggested going\u003c/em>."]}]},{"t":"h","c":{"en":"Managing mixed-level classes","ar":"Managing mixed-level classes"}},{"t":"p","c":{"en":"A Year 8 class may include a learner who reads comfortably at a higher level and a learner who is still working at Stage 7 language. Differentiation does not mean three different lessons. A practical approach (good practice) is to keep one theme, one text or recording and one aim, and vary the support or the outcome.","ar":"A Year 8 class may include a learner who reads comfortably at a higher level and a learner who is still working at Stage 7 language. Differentiation does not mean three different lessons. A practical approach (good practice) is to keep one theme, one text or recording and one aim, and vary the support or the outcome."}},{"t":"table","head":{"en":["Strategy","What the teacher changes","Example"],"ar":["Strategy","What the teacher changes","Example"]},"rows":[{"en":["Different support","The task is the same; the help differs.","All read the same article. Some have a glossary and sentence starters; others have none."],"ar":["Different support","The task is the same; the help differs.","All read the same article. Some have a glossary and sentence starters; others have none."]},{"en":["Different tasks","The same text with questions at different levels.","Level A: find three facts. Level B: explain the writer's opinion. Level C: find an inconsistency (a Stage 8 or 9 skill)."],"ar":["Different tasks","The same text with questions at different levels.","Level A: find three facts. Level B: explain the writer's opinion. Level C: find an inconsistency (a Stage 8 or 9 skill)."]},{"en":["Different outcome","The same task; learners write or say more or less.","All give an opinion; some add a reason, some add an example and a contrast."],"ar":["Different outcome","The same task; learners write or say more or less.","All give an opinion; some add a reason, some add an example and a contrast."]},{"en":["Flexible groups","Learners work with different partners for different tasks.","Mixed pairs for discussion; same-level groups for a grammar task."],"ar":["Flexible groups","Learners work with different partners for different tasks.","Mixed pairs for discussion; same-level groups for a grammar task."]}]},{"t":"p","c":{"en":"The framework's own wording helps: the phrases \"with support\", \"with little or no support\" and no support at all are a built-in ladder. A learner who is not yet ready for an objective without support can work on the \"with support\" version; a stronger learner can try a task from the next stage's wording.","ar":"The framework's own wording helps: the phrases \"with support\", \"with little or no support\" and no support at all are a built-in ladder. A learner who is not yet ready for an objective without support can work on the \"with support\" version; a stronger learner can try a task from the next stage's wording."}},{"t":"scenario","title":{"en":"Scenario: one task, three levels","ar":"Scenario: one task, three levels"},"c":{"en":"A Year 9 teacher uses a recording of a debate about school uniforms. She wants all learners to practise 9Lo.02 (fact and opinion). She gives all learners the same recording and a table with two columns: Fact and Opinion. Support: some learners have a list of sentences taken from the recording to sort; the middle group listens and writes the sentences themselves; the strongest group also decides whether any speaker shows bias and what words show it. All learners meet the same text and the same objective, and each works at a challenge level that suits them.","ar":"A Year 9 teacher uses a recording of a debate about school uniforms. She wants all learners to practise 9Lo.02 (fact and opinion). She gives all learners the same recording and a table with two columns: Fact and Opinion. Support: some learners have a list of sentences taken from the recording to sort; the middle group listens and writes the sentences themselves; the strongest group also decides whether any speaker shows bias and what words show it. All learners meet the same text and the same objective, and each works at a challenge level that suits them."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Teach listening in stages and give learners many chances to speak. The framework accepts occasional hesitation, reformulation and mistakes. Teach Use of English in context, with notice-and-name, practice and review routines. In mixed classes, keep one theme and vary the support, task or outcome. The framework's \"with support\" wording is a ready-made ladder.","ar":"Teach listening in stages and give learners many chances to speak. The framework accepts occasional hesitation, reformulation and mistakes. Teach Use of English in context, with notice-and-name, practice and review routines. In mixed classes, keep one theme and vary the support, task or outcome. The framework's \"with support\" wording is a ready-made ladder."}}],"checks":[{"id":"m5q1","q":{"en":"What does 7Sc.04 accept in learners' speaking at Stage 7?","ar":"What does 7Sc.04 accept in learners' speaking at Stage 7?"},"opts":[{"en":"Stretches of language that are comprehensible, with occasional hesitation and reformulation","ar":"Stretches of language that are comprehensible, with occasional hesitation and reformulation"},{"en":"Fully fluent speech with no hesitation, because pauses are not allowed in the objective","ar":"Fully fluent speech with no hesitation, because pauses are not allowed in the objective"},{"en":"Short answers only, because extended speaking begins at Stage 9","ar":"Short answers only, because extended speaking begins at Stage 9"},{"en":"Speech that is accurate in every sentence, because accuracy is the main aim at Stage 7","ar":"Speech that is accurate in every sentence, because accuracy is the main aim at Stage 7"}],"correct":0,"expl":{"en":"7Sc.04 asks learners to produce and maintain stretches of language comprehensibly, allowing for occasional hesitation and reformulation.","ar":"7Sc.04 asks learners to produce and maintain stretches of language comprehensibly, allowing for occasional hesitation and reformulation."}},{"id":"m5q2","q":{"en":"A teacher wants to teach 9Lo.02 in a mixed-level class. Which plan fits the good practice in Module 5?","ar":"A teacher wants to teach 9Lo.02 in a mixed-level class. Which plan fits the good practice in Module 5?"},"opts":[{"en":"Use a different recording and a different topic for each ability group","ar":"Use a different recording and a different topic for each ability group"},{"en":"Use one recording and vary the support, the task or the expected outcome","ar":"Use one recording and vary the support, the task or the expected outcome"},{"en":"Teach the lowest group from Stage 7 and leave stronger learners to work alone","ar":"Teach the lowest group from Stage 7 and leave stronger learners to work alone"},{"en":"Give the whole class the hardest task and mark only the correct answers","ar":"Give the whole class the hardest task and mark only the correct answers"}],"correct":1,"expl":{"en":"Mixed-level teaching keeps one theme and one text, and changes support, task or outcome.","ar":"Mixed-level teaching keeps one theme and one text, and changes support, task or outcome."}},{"id":"m5q3","q":{"en":"In the framework's code system, which sub-strand contains connectives, such as 8Us.02?","ar":"In the framework's code system, which sub-strand contains connectives, such as 8Us.02?"},"opts":[{"en":"Vocabulary, with the reporting code Uv","ar":"Vocabulary, with the reporting code Uv"},{"en":"Grammatical forms, with the reporting code Ug, as in 7Ug.01","ar":"Grammatical forms, with the reporting code Ug, as in 7Ug.01"},{"en":"Sentence structure, with the reporting code Us","ar":"Sentence structure, with the reporting code Us"},{"en":"Organisation, with the reporting code Sor","ar":"Organisation, with the reporting code Sor"}],"correct":2,"expl":{"en":"The framework table gives Us for Sentence structure, Uv for Vocabulary and Ug for Grammatical forms. 8Us.02 is on connectives.","ar":"The framework table gives Us for Sentence structure, Uv for Vocabulary and Ug for Grammatical forms. 8Us.02 is on connectives."}}]},{"id":"m6","title":{"en":"Assessment: AfL, Can-Do Statements, CEFR and Cambridge Assessments","ar":"Assessment: AfL, Can-Do Statements, CEFR and Cambridge Assessments"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment is more than a test at the end of a unit. It is the full picture of what learners can do, built from many small pieces of evidence. This module separates what the framework says about assessment from what is good practice, and explains how classroom evidence and external checks fit together. We stay within what the framework states, and we label school context as PEPS context.","ar":"Assessment is more than a test at the end of a unit. It is the full picture of what learners can do, built from many small pieces of evidence. This module separates what the framework says about assessment from what is good practice, and explains how classroom evidence and external checks fit together. We stay within what the framework states, and we label school context as PEPS context."}},{"t":"h","c":{"en":"What the framework says","ar":"What the framework says"}},{"t":"list","c":{"en":["\u003cstrong>Objectives are a reference for checking.\u003c/strong> The framework describes its learning objectives as \"a reference against which learners' attainment and skills development can be checked\".","\u003cstrong>Objectives are can-do statements.\u003c/strong> Learning outcomes are \"defined in terms of what learners should be able to do in English\". The framework says that this framing encourages \"learning-centred, activity-based approaches\".","\u003cstrong>The CEFR scale.\u003c/strong> The objectives are based on the Council of Europe's Common European Framework of Reference for Languages. The CEFR describes ability on a six-point scale from A1 (beginners) to C2 (mastery). In the framework's diagram, the B1 arrow sits across the Lower Secondary stages and the B2 arrow sits at Cambridge IGCSE. Check the diagram on page 3 of the framework for the exact picture.","\u003cstrong>Cambridge assessments.\u003c/strong> The framework names Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests as Cambridge Lower Secondary assessments. It says assessments are provided \"to complement this curriculum framework for Stages 7 to 9\", and refers you to the support site for more information. The cover notes say Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","\u003cstrong>What the ESL tests cover.\u003c/strong> The framework lists the ESL papers as Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. Speaking is not listed as a test paper (see below).","\u003cstrong>Reporting codes.\u003c/strong> The reporting code in each objective \"appears in the feedback reports for tests\" and reflects the sub-strand titles."],"ar":["\u003cstrong>Objectives are a reference for checking.\u003c/strong> The framework describes its learning objectives as \"a reference against which learners' attainment and skills development can be checked\".","\u003cstrong>Objectives are can-do statements.\u003c/strong> Learning outcomes are \"defined in terms of what learners should be able to do in English\". The framework says that this framing encourages \"learning-centred, activity-based approaches\".","\u003cstrong>The CEFR scale.\u003c/strong> The objectives are based on the Council of Europe's Common European Framework of Reference for Languages. The CEFR describes ability on a six-point scale from A1 (beginners) to C2 (mastery). In the framework's diagram, the B1 arrow sits across the Lower Secondary stages and the B2 arrow sits at Cambridge IGCSE. Check the diagram on page 3 of the framework for the exact picture.","\u003cstrong>Cambridge assessments.\u003c/strong> The framework names Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests as Cambridge Lower Secondary assessments. It says assessments are provided \"to complement this curriculum framework for Stages 7 to 9\", and refers you to the support site for more information. The cover notes say Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","\u003cstrong>What the ESL tests cover.\u003c/strong> The framework lists the ESL papers as Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. Speaking is not listed as a test paper (see below).","\u003cstrong>Reporting codes.\u003c/strong> The reporting code in each objective \"appears in the feedback reports for tests\" and reflects the sub-strand titles."]}},{"t":"callout","k":"warn","title":{"en":"Stay within what the framework says","ar":"Stay within what the framework says"},"c":{"en":"The framework does not describe test marks, grade boundaries, how often to test or how results are reported to parents. It also does not say that every school must use every assessment. Do not claim these details; check Cambridge's support site and your school's assessment calendar.","ar":"The framework does not describe test marks, grade boundaries, how often to test or how results are reported to parents. It also does not say that every school must use every assessment. Do not claim these details; check Cambridge's support site and your school's assessment calendar."}},{"t":"h","c":{"en":"Assessment for learning (AfL): good practice","ar":"Assessment for learning (AfL): good practice"}},{"t":"p","c":{"en":"AfL means gathering evidence \u003cem>during\u003c/em> teaching so that you can adjust your teaching and so that learners know how to improve. It is not named in the framework, but it fits the can-do structure well. Here are techniques for each skill.","ar":"AfL means gathering evidence \u003cem>during\u003c/em> teaching so that you can adjust your teaching and so that learners know how to improve. It is not named in the framework, but it fits the can-do structure well. Here are techniques for each skill."}},{"t":"table","head":{"en":["Technique","How it works","Skill and example objective"],"ar":["Technique","How it works","Skill and example objective"]},"rows":[{"en":["Mini-whiteboards","All learners show an answer at the same time.","Use of English: write the correct past modal form (9Ug.14)."],"ar":["Mini-whiteboards","All learners show an answer at the same time.","Use of English: write the correct past modal form (9Ug.14)."]},{"en":["Exit tickets","One question on a slip as learners leave.","Reading: \"Which sentence shows the writer's opinion?\" (8Ro.01)."],"ar":["Exit tickets","One question on a slip as learners leave.","Reading: \"Which sentence shows the writer's opinion?\" (8Ro.01)."]},{"en":["Listening for evidence","The teacher walks round with a short checklist while pairs talk.","Speaking: tick if the learner asks a follow-up question (8Sc.02)."],"ar":["Listening for evidence","The teacher walks round with a short checklist while pairs talk.","Speaking: tick if the learner asks a follow-up question (8Sc.02)."]},{"en":["Traffic-light self-assessment","Learners mark \"I can\" statements red, amber or green.","Writing: \"I can plan, write and proofread an extended text\" (8Wca.02)."],"ar":["Traffic-light self-assessment","Learners mark \"I can\" statements red, amber or green.","Writing: \"I can plan, write and proofread an extended text\" (8Wca.02)."]},{"en":["Peer feedback with a checklist","A partner checks two features and gives one suggestion.","Writing: connectives of contrast present? (8Us.02)."],"ar":["Peer feedback with a checklist","A partner checks two features and gives one suggestion.","Writing: connectives of contrast present? (8Us.02)."]},{"en":["Questioning","Open questions and wait time.","Listening: \"Which words showed the speaker's feeling?\" (9Lo.01)."],"ar":["Questioning","Open questions and wait time.","Listening: \"Which words showed the speaker's feeling?\" (9Lo.01)."]}]},{"t":"h","c":{"en":"Can-do checklists (good practice)","ar":"Can-do checklists (good practice)"}},{"t":"p","c":{"en":"Because every objective is a can-do statement, a checklist is easy to build. Take the objectives in a unit, rewrite each in learner language and add three columns: \"Not yet\", \"Nearly\" and \"Yes\". Learners and teachers can both use it. The framework's own wording gives you the stages of independence: for example, 7Wca.02 says \"with support\", 8Wca.02 says \"with little or no support\" and 9Wca.02 says \"independently\".","ar":"Because every objective is a can-do statement, a checklist is easy to build. Take the objectives in a unit, rewrite each in learner language and add three columns: \"Not yet\", \"Nearly\" and \"Yes\". Learners and teachers can both use it. The framework's own wording gives you the stages of independence: for example, 7Wca.02 says \"with support\", 8Wca.02 says \"with little or no support\" and 9Wca.02 says \"independently\"."}},{"t":"table","head":{"en":["Objective","Learner-friendly \"I can\" statement (good practice wording)"],"ar":["Objective","Learner-friendly \"I can\" statement (good practice wording)"]},"rows":[{"en":["7Wca.02","I can plan, write and check a longer text with help from my teacher or a checklist."],"ar":["7Wca.02","I can plan, write and check a longer text with help from my teacher or a checklist."]},{"en":["8Wca.02","I can plan, write and check a longer text mostly by myself."],"ar":["8Wca.02","I can plan, write and check a longer text mostly by myself."]},{"en":["9Wca.02","I can plan, write, edit and proofread a longer text by myself."],"ar":["9Wca.02","I can plan, write, edit and proofread a longer text by myself."]},{"en":["8So.01","I can say what I think and give a reason without much help."],"ar":["8So.01","I can say what I think and give a reason without much help."]}]},{"t":"p","c":{"en":"\u003cstrong>CEFR levels and classroom language.\u003c/strong> You will often be asked, \"What CEFR level is this learner?\" Be careful. The framework says that its objectives align to CEFR levels, but a classroom checklist is not a CEFR test. Treat levels as a way to understand progression and talk to parents, and use Cambridge's own assessments for formal evidence.","ar":"\u003cstrong>CEFR levels and classroom language.\u003c/strong> You will often be asked, \"What CEFR level is this learner?\" Be careful. The framework says that its objectives align to CEFR levels, but a classroom checklist is not a CEFR test. Treat levels as a way to understand progression and talk to parents, and use Cambridge's own assessments for formal evidence."}},{"t":"h","c":{"en":"Cambridge Lower Secondary assessments and PEPS external checks","ar":"Cambridge Lower Secondary assessments and PEPS external checks"}},{"t":"table","head":{"en":["Assessment","What the framework says","PEPS context (label)"],"ar":["Assessment","What the framework says","PEPS context (label)"]},"rows":[{"en":["Cambridge Lower Secondary Progression Tests","Named as a Cambridge Lower Secondary assessment; available from 2022 (cover note).","Use as your school decides; check the school's assessment calendar."],"ar":["Cambridge Lower Secondary Progression Tests","Named as a Cambridge Lower Secondary assessment; available from 2022 (cover note).","Use as your school decides; check the school's assessment calendar."]},{"en":["Cambridge Lower Secondary Checkpoint","Named as a Cambridge Lower Secondary assessment; ESL papers listed as Reading and Usage, Writing and Listening; available from 2023 (cover note).","Year 9 sits Checkpoint in ESL, Maths and Science."],"ar":["Cambridge Lower Secondary Checkpoint","Named as a Cambridge Lower Secondary assessment; ESL papers listed as Reading and Usage, Writing and Listening; available from 2023 (cover note).","Year 9 sits Checkpoint in ESL, Maths and Science."]},{"en":["CEM Baseline Tests","Named in the list of Cambridge Lower Secondary assessments.","Not described in the framework; ask your Cambridge coordinator how the school uses it."],"ar":["CEM Baseline Tests","Named in the list of Cambridge Lower Secondary assessments.","Not described in the framework; ask your Cambridge coordinator how the school uses it."]},{"en":["GL Progress Tests (English)","Not named in the framework. They are not a Cambridge assessment.","GL Progress Tests run in Years 4, 6, 8 and 10, so Year 8 is a GL year. Treat the result as an external check alongside Cambridge-based evidence."],"ar":["GL Progress Tests (English)","Not named in the framework. They are not a Cambridge assessment.","GL Progress Tests run in Years 4, 6, 8 and 10, so Year 8 is a GL year. Treat the result as an external check alongside Cambridge-based evidence."]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: keep the checks separate","ar":"Good practice: keep the checks separate"},"c":{"en":"Checkpoint is based on the Cambridge framework. A GL test is a different test with its own design and scale. A learner may do well in one and less well in the other. Do not say \"the GL result shows Checkpoint attainment\". Use each result for what it is, and compare skills, not scores.","ar":"Checkpoint is based on the Cambridge framework. A GL test is a different test with its own design and scale. A learner may do well in one and less well in the other. Do not say \"the GL result shows Checkpoint attainment\". Use each result for what it is, and compare skills, not scores."}},{"t":"p","c":{"en":"\u003cstrong>Where is Speaking assessed?\u003c/strong> The framework's list of ESL papers does not include a Speaking paper. Speaking objectives are still part of the curriculum (5 strands run through each stage), so speaking evidence must come from your classroom assessment. This is our inference from the framework's list, not a framework statement. Plan one or two speaking assessments per term using simple criteria, such as the can-do statements for 8Sc.01 to 8Sc.05.","ar":"\u003cstrong>Where is Speaking assessed?\u003c/strong> The framework's list of ESL papers does not include a Speaking paper. Speaking objectives are still part of the curriculum (5 strands run through each stage), so speaking evidence must come from your classroom assessment. This is our inference from the framework's list, not a framework statement. Plan one or two speaking assessments per term using simple criteria, such as the can-do statements for 8Sc.01 to 8Sc.05."}},{"t":"h","c":{"en":"Reporting codes: reading a feedback report","ar":"Reporting codes: reading a feedback report"}},{"t":"p","c":{"en":"The framework says the reporting code \"appears in the feedback reports for tests\". Learn the codes, so that when a report refers to \"Rd\" or \"Us\" you know exactly what to teach next.","ar":"The framework says the reporting code \"appears in the feedback reports for tests\". Learn the codes, so that when a report refers to \"Rd\" or \"Us\" you know exactly what to teach next."}},{"t":"table","head":{"en":["Strand","Sub-strand","Reporting code"],"ar":["Strand","Sub-strand","Reporting code"]},"rows":[{"en":["Listening","Global meaning / Detail / Opinion","Lm / Ld / Lo"],"ar":["Listening","Global meaning / Detail / Opinion","Lm / Ld / Lo"]},{"en":["Speaking","Communication / Express opinion / Organisation","Sc / So / Sor"],"ar":["Speaking","Communication / Express opinion / Organisation","Sc / So / Sor"]},{"en":["Writing","Communicative achievement / Organisation / Content","Wca / Wor / Wc"],"ar":["Writing","Communicative achievement / Organisation / Content","Wca / Wor / Wc"]},{"en":["Reading","Global meaning / Detail / Opinion","Rm / Rd / Ro"],"ar":["Reading","Global meaning / Detail / Opinion","Rm / Rd / Ro"]},{"en":["Use of English","Grammatical forms / Vocabulary / Sentence structure","Ug / Uv / Us"],"ar":["Use of English","Grammatical forms / Vocabulary / Sentence structure","Ug / Uv / Us"]}]},{"t":"scenario","title":{"en":"Scenario: a report that says \"Ro\"","ar":"Scenario: a report that says \"Ro\""},"c":{"en":"A feedback report shows that many learners in your Year 9 class scored lower in \"Ro\" items than in \"Rd\" items. What does this mean for teaching? Ro is Reading for opinion: recognising the writer's opinion and, at Stage 9, drawing conclusions and separating fact from opinion (9Ro.01, 9Ro.02). Rd is Reading for detail. A sensible next step is to look at the Stage 9 objectives, teach explicit lessons on opinion words and bias with short texts, and check again with a short task. Be careful not to conclude too much from a single test; combine it with classroom evidence (Module 7).","ar":"A feedback report shows that many learners in your Year 9 class scored lower in \"Ro\" items than in \"Rd\" items. What does this mean for teaching? Ro is Reading for opinion: recognising the writer's opinion and, at Stage 9, drawing conclusions and separating fact from opinion (9Ro.01, 9Ro.02). Rd is Reading for detail. A sensible next step is to look at the Stage 9 objectives, teach explicit lessons on opinion words and bias with short texts, and check again with a short task. Be careful not to conclude too much from a single test; combine it with classroom evidence (Module 7)."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"The framework treats the objectives as a reference for checking attainment and describes assessments (Progression Tests, Checkpoint, CEM Baseline Tests) as complementary to the framework for Stages 7 to 9. Use AfL and can-do checklists as good practice, treat CEFR levels carefully, and keep Checkpoint and GL results separate. Learn the reporting codes so that feedback reports lead to action.","ar":"The framework treats the objectives as a reference for checking attainment and describes assessments (Progression Tests, Checkpoint, CEM Baseline Tests) as complementary to the framework for Stages 7 to 9. Use AfL and can-do checklists as good practice, treat CEFR levels carefully, and keep Checkpoint and GL results separate. Learn the reporting codes so that feedback reports lead to action."}}],"checks":[{"id":"m6q1","q":{"en":"Which three ESL test papers does the framework list for the Checkpoint and Progression Tests?","ar":"Which three ESL test papers does the framework list for the Checkpoint and Progression Tests?"},"opts":[{"en":"Paper 1 Reading and Writing, Paper 2 Speaking and Paper 3 Listening","ar":"Paper 1 Reading and Writing, Paper 2 Speaking and Paper 3 Listening"},{"en":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking and Use of English","ar":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking and Use of English"},{"en":"Paper 1 Use of English, Paper 2 Writing and Paper 3 Speaking","ar":"Paper 1 Use of English, Paper 2 Writing and Paper 3 Speaking"},{"en":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening","ar":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening"}],"correct":3,"expl":{"en":"The framework's English and ESL comparison table lists these three ESL papers.","ar":"The framework's English and ESL comparison table lists these three ESL papers."}},{"id":"m6q2","q":{"en":"What does the reporting code in a learning objective, such as Rd in 7Rd.01, tell a teacher?","ar":"What does the reporting code in a learning objective, such as Rd in 7Rd.01, tell a teacher?"},"opts":[{"en":"The sub-strand, which appears in the feedback reports for tests","ar":"The sub-strand, which appears in the feedback reports for tests"},{"en":"The difficulty level of the objective on the CEFR scale","ar":"The difficulty level of the objective on the CEFR scale"},{"en":"The number of marks that the objective carries in the Checkpoint papers","ar":"The number of marks that the objective carries in the Checkpoint papers"},{"en":"The term in which the objective should be taught","ar":"The term in which the objective should be taught"}],"correct":0,"expl":{"en":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles.","ar":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles."}},{"id":"m6q3","q":{"en":"A teacher says a Year 8 GL Progress Test result proves Checkpoint attainment. What is the best response?","ar":"A teacher says a Year 8 GL Progress Test result proves Checkpoint attainment. What is the best response?"},"opts":[{"en":"They are the same test with different names, so the result can be copied across","ar":"They are the same test with different names, so the result can be copied across"},{"en":"They are different tests, so use each for what it shows and combine with classroom evidence","ar":"They are different tests, so use each for what it shows and combine with classroom evidence"},{"en":"GL results are more reliable than classroom evidence, so Cambridge objectives can be ignored","ar":"GL results are more reliable than classroom evidence, so Cambridge objectives can be ignored"},{"en":"Checkpoint results should be used only for Year 8, because GL is for Year 9","ar":"Checkpoint results should be used only for Year 8, because GL is for Year 9"}],"correct":1,"expl":{"en":"GL is not named in the framework and is a separate test. Compare skills and use several sources of evidence.","ar":"GL is not named in the framework and is a separate test. Compare skills and use several sources of evidence."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Evidence is only useful if it changes what you do on Monday. Many teachers collect marks, record them and then move on to the next unit. This module shows a simple cycle for using evidence in ESL: look by skill and strand, find the pattern in errors, decide on an intervention, and track progress. All examples are invented for practice and are \u003cstrong>not PEPS data\u003c/strong>. Methods are good practice; the only framework content is the structure of strands, codes and objectives.","ar":"Evidence is only useful if it changes what you do on Monday. Many teachers collect marks, record them and then move on to the next unit. This module shows a simple cycle for using evidence in ESL: look by skill and strand, find the pattern in errors, decide on an intervention, and track progress. All examples are invented for practice and are \u003cstrong>not PEPS data\u003c/strong>. Methods are good practice; the only framework content is the structure of strands, codes and objectives."}},{"t":"h","c":{"en":"The evidence cycle","ar":"The evidence cycle"}},{"t":"steps","c":{"en":["\u003cstrong>Collect\u003c/strong> evidence from several sources: classroom tasks, a short writing sample, a speaking observation, a Cambridge or external test report.","\u003cstrong>Analyse by skill and strand\u003c/strong> using the reporting codes (Module 6): where is the class stronger, and where weaker?","\u003cstrong>Find the cause\u003c/strong> through error analysis: what exactly are learners doing wrong, and why?","\u003cstrong>Act\u003c/strong> with a short, targeted intervention: reteach, practise, change the task or regroup learners.","\u003cstrong>Check again\u003c/strong> after two to three weeks with a similar task, and record the change."],"ar":["\u003cstrong>Collect\u003c/strong> evidence from several sources: classroom tasks, a short writing sample, a speaking observation, a Cambridge or external test report.","\u003cstrong>Analyse by skill and strand\u003c/strong> using the reporting codes (Module 6): where is the class stronger, and where weaker?","\u003cstrong>Find the cause\u003c/strong> through error analysis: what exactly are learners doing wrong, and why?","\u003cstrong>Act\u003c/strong> with a short, targeted intervention: reteach, practise, change the task or regroup learners.","\u003cstrong>Check again\u003c/strong> after two to three weeks with a similar task, and record the change."]}},{"t":"h","c":{"en":"Analysing results by skill and strand","ar":"Analysing results by skill and strand"}},{"t":"p","c":{"en":"Because every objective has a reporting code, you can group any evidence by sub-strand. Take a short class assessment with items marked by code. The table below is an \u003cstrong>invented illustration\u003c/strong> for a class of 28 learners: it shows the number of learners who answered most items correctly in each area.","ar":"Because every objective has a reporting code, you can group any evidence by sub-strand. Take a short class assessment with items marked by code. The table below is an \u003cstrong>invented illustration\u003c/strong> for a class of 28 learners: it shows the number of learners who answered most items correctly in each area."}},{"t":"table","head":{"en":["Area (code)","Learners who answered most items correctly (invented)","First reading of the pattern"],"ar":["Area (code)","Learners who answered most items correctly (invented)","First reading of the pattern"]},"rows":[{"en":["Reading for detail (Rd)","24 of 28","A strength; keep practising with harder texts."],"ar":["Reading for detail (Rd)","24 of 28","A strength; keep practising with harder texts."]},{"en":["Reading for opinion (Ro)","14 of 28","A weaker area; opinion and bias need explicit teaching."],"ar":["Reading for opinion (Ro)","14 of 28","A weaker area; opinion and bias need explicit teaching."]},{"en":["Listening for detail (Ld)","17 of 28","Middle; check whether the problem is speed, accent or vocabulary."],"ar":["Listening for detail (Ld)","17 of 28","Middle; check whether the problem is speed, accent or vocabulary."]},{"en":["Grammatical forms (Ug)","20 of 28","Acceptable overall; check which forms were wrong."],"ar":["Grammatical forms (Ug)","20 of 28","Acceptable overall; check which forms were wrong."]},{"en":["Sentence structure (Us)","12 of 28","A weaker area; connectives and relative clauses need review."],"ar":["Sentence structure (Us)","12 of 28","A weaker area; connectives and relative clauses need review."]}]},{"t":"p","c":{"en":"Notice what the table cannot tell you: why the learners got the items wrong, which learners are in the group, or whether the test items were good. It is a \u003cem>starting point\u003c/em> for questions, not an answer. Always ask: how many items were there? A \"weak area\" based on two items is not reliable. Look for the same pattern in two or more pieces of evidence before you act on it.","ar":"Notice what the table cannot tell you: why the learners got the items wrong, which learners are in the group, or whether the test items were good. It is a \u003cem>starting point\u003c/em> for questions, not an answer. Always ask: how many items were there? A \"weak area\" based on two items is not reliable. Look for the same pattern in two or more pieces of evidence before you act on it."}},{"t":"callout","k":"warn","title":{"en":"Do not invent or over-read data","ar":"Do not invent or over-read data"},"c":{"en":"Do not record guessed levels, do not assume the same learners are weak in every strand, and do not compare unlike scores (for example a cla
