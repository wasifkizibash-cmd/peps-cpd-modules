ssroom quiz out of 10 with a Checkpoint report or a GL result). When you report to your HOD, say clearly what the evidence is, how many learners and items it covers, and what you do not yet know.","ar":"Do not record guessed levels, do not assume the same learners are weak in every strand, and do not compare unlike scores (for example a classroom quiz out of 10 with a Checkpoint report or a GL result). When you report to your HOD, say clearly what the evidence is, how many learners and items it covers, and what you do not yet know."}},{"t":"h","c":{"en":"Error analysis","ar":"Error analysis"}},{"t":"p","c":{"en":"Error analysis means collecting learners' mistakes and asking what kind they are. A useful categorisation is the following (good practice).","ar":"Error analysis means collecting learners' mistakes and asking what kind they are. A useful categorisation is the following (good practice)."}},{"t":"table","head":{"en":["Type of error","Example from a Stage 8 learner","Likely teaching response"],"ar":["Type of error","Example from a Stage 8 learner","Likely teaching response"]},"rows":[{"en":["Form (the structure is wrong)","\u003cem>Yesterday we have visited the museum.\u003c/em>","Contrast past simple and present perfect with time expressions (8Ug.03 and 8Ug.06)."],"ar":["Form (the structure is wrong)","\u003cem>Yesterday we have visited the museum.\u003c/em>","Contrast past simple and present perfect with time expressions (8Ug.03 and 8Ug.06)."]},{"en":["Word choice or word class","\u003cem>I am interesting in science.\u003c/em>","Teach participle adjectives and dependent prepositions (8Ug.14, 8Uv.01)."],"ar":["Word choice or word class","\u003cem>I am interesting in science.\u003c/em>","Teach participle adjectives and dependent prepositions (8Ug.14, 8Uv.01)."]},{"en":["Missing or wrong linking","\u003cem>I like football but I play every day, however I am tired.\u003c/em>","Compare \u003cem>but, although, however\u003c/em> and where they go (8Us.02)."],"ar":["Missing or wrong linking","\u003cem>I like football but I play every day, however I am tired.\u003c/em>","Compare \u003cem>but, although, however\u003c/em> and where they go (8Us.02)."]},{"en":["Spelling and punctuation","\u003cem>freind, recieve\u003c/em>; no capital letters","Target a few words and a punctuation rule (8Wca.01, 8Wor.01)."],"ar":["Spelling and punctuation","\u003cem>freind, recieve\u003c/em>; no capital letters","Target a few words and a punctuation rule (8Wca.01, 8Wor.01)."]},{"en":["Meaning-blocking error","\u003cem>He said me to come.\u003c/em> (meaning is unclear)","Priority: reported speech with \u003cem>tell\u003c/em> and \u003cem>say\u003c/em> (8Ug.12)."],"ar":["Meaning-blocking error","\u003cem>He said me to come.\u003c/em> (meaning is unclear)","Priority: reported speech with \u003cem>tell\u003c/em> and \u003cem>say\u003c/em> (8Ug.12)."]}]},{"t":"p","c":{"en":"Consider also the influence of the home language. A learner whose first language has no articles may leave out \u003cem>a\u003c/em> and \u003cem>the\u003c/em> consistently. This is not carelessness; it is a pattern. A teacher who knows the learners' home languages (or asks them) can predict which patterns to expect. The framework supports this view when it says learners \"make connections (to their own language) to build on what they already know\".","ar":"Consider also the influence of the home language. A learner whose first language has no articles may leave out \u003cem>a\u003c/em> and \u003cem>the\u003c/em> consistently. This is not carelessness; it is a pattern. A teacher who knows the learners' home languages (or asks them) can predict which patterns to expect. The framework supports this view when it says learners \"make connections (to their own language) to build on what they already know\"."}},{"t":"p","c":{"en":"The framework also tells you how to set priorities. Stage 7 and Stage 8 objectives allow \"occasional mistakes\", while Stage 9 objectives (9Sc.05 and 9Wca.04) ask for no mistakes that cause misunderstanding. So you can ask: does this error affect meaning? Does it appear often? Is it linked to a structure from this stage's objectives? Errors that are meaning-blocking, frequent and stage-appropriate come first.","ar":"The framework also tells you how to set priorities. Stage 7 and Stage 8 objectives allow \"occasional mistakes\", while Stage 9 objectives (9Sc.05 and 9Wca.04) ask for no mistakes that cause misunderstanding. So you can ask: does this error affect meaning? Does it appear often? Is it linked to a structure from this stage's objectives? Errors that are meaning-blocking, frequent and stage-appropriate come first."}},{"t":"h","c":{"en":"Intervention: small, targeted and time-limited","ar":"Intervention: small, targeted and time-limited"}},{"t":"list","c":{"en":["\u003cstrong>Whole-class reteach.\u003c/strong> When more than a third of the class share an error, reteach it in a new way within the next lesson.","\u003cstrong>Small-group clinic.\u003c/strong> A 10-minute focused group while others complete independent work. Choose the same learners only if the evidence shows the same needs.","\u003cstrong>Spaced practice.\u003c/strong> Bring the target language back in starters across the next three weeks, for example in three-minute \"past or present perfect?\" quizzes.","\u003cstrong>Change the task, not only the teaching.\u003c/strong> If learners cannot do a listening task, try a shorter extract, a pre-listening vocabulary stage or a different question type.","\u003cstrong>Involve the learner.\u003c/strong> Share the can-do statement and ask the learner to choose one action. This supports the framework's reflective learner."],"ar":["\u003cstrong>Whole-class reteach.\u003c/strong> When more than a third of the class share an error, reteach it in a new way within the next lesson.","\u003cstrong>Small-group clinic.\u003c/strong> A 10-minute focused group while others complete independent work. Choose the same learners only if the evidence shows the same needs.","\u003cstrong>Spaced practice.\u003c/strong> Bring the target language back in starters across the next three weeks, for example in three-minute \"past or present perfect?\" quizzes.","\u003cstrong>Change the task, not only the teaching.\u003c/strong> If learners cannot do a listening task, try a shorter extract, a pre-listening vocabulary stage or a different question type.","\u003cstrong>Involve the learner.\u003c/strong> Share the can-do statement and ask the learner to choose one action. This supports the framework's reflective learner."]}},{"t":"scenario","title":{"en":"Scenario: weak listening in Year 8","ar":"Scenario: weak listening in Year 8"},"c":{"en":"A teacher's Year 8 class completes the school's GL Progress Test in English. The teacher notices that the class report is lower for listening than for reading. What should the teacher do next? First, check what the report says and how many learners are affected, without comparing the score with Checkpoint. Second, collect classroom evidence: do a short listening task using 8Ld.02 (specific information) and note whether learners struggle with speed, accents, vocabulary or following the question. Third, plan a three-week intervention: short daily extracts with a three-stage routine (Module 5), pair talk after listening and a re-check task. Fourth, share the results with the HOD. The teacher does not state that the class is \"weak in listening\" until two sources agree.","ar":"A teacher's Year 8 class completes the school's GL Progress Test in English. The teacher notices that the class report is lower for listening than for reading. What should the teacher do next? First, check what the report says and how many learners are affected, without comparing the score with Checkpoint. Second, collect classroom evidence: do a short listening task using 8Ld.02 (specific information) and note whether learners struggle with speed, accents, vocabulary or following the question. Third, plan a three-week intervention: short daily extracts with a three-stage routine (Module 5), pair talk after listening and a re-check task. Fourth, share the results with the HOD. The teacher does not state that the class is \"weak in listening\" until two sources agree."}},{"t":"h","c":{"en":"Tracking progress without inventing data","ar":"Tracking progress without inventing data"}},{"t":"p","c":{"en":"A tracker should be simple enough to use. A good-practice model for a Year 7 to 9 teacher is one row per learner and one column per priority objective or sub-strand, with a three-point scale such as \u003cem>Not yet, Developing, Secure\u003c/em>, and a date. Fill it only from evidence you have seen. The school may have its own tracker; if so, use it, and do not create a second one that conflicts.","ar":"A tracker should be simple enough to use. A good-practice model for a Year 7 to 9 teacher is one row per learner and one column per priority objective or sub-strand, with a three-point scale such as \u003cem>Not yet, Developing, Secure\u003c/em>, and a date. Fill it only from evidence you have seen. The school may have its own tracker; if so, use it, and do not create a second one that conflicts."}},{"t":"table","head":{"en":["Good tracking habit","Why it helps"],"ar":["Good tracking habit","Why it helps"]},"rows":[{"en":["Record the evidence type beside the judgement","Another teacher can see whether the judgement came from a test, a task or an observation."],"ar":["Record the evidence type beside the judgement","Another teacher can see whether the judgement came from a test, a task or an observation."]},{"en":["Use the objective code","The code is the shared language of the framework and Cambridge feedback reports."],"ar":["Use the objective code","The code is the shared language of the framework and Cambridge feedback reports."]},{"en":["Update after teaching, not only after tests","It reveals progress between formal assessments."],"ar":["Update after teaching, not only after tests","It reveals progress between formal assessments."]},{"en":["Review learners who do not move","A learner who stays \"Not yet\" for six weeks needs a different approach."],"ar":["Review learners who do not move","A learner who stays \"Not yet\" for six weeks needs a different approach."]},{"en":["Do not average different kinds of evidence","A mix of a test score, a rating and a CEFR guess has no clear meaning."],"ar":["Do not average different kinds of evidence","A mix of a test score, a rating and a CEFR guess has no clear meaning."]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: one change at a time","ar":"Good practice: one change at a time"},"c":{"en":"After analysing evidence you may find five problems. Choose one or two to act on, for example \"connectives of contrast in writing\" and \"listening for detail\". Change one thing, check again and then move on. A teacher who tries to fix everything at once cannot tell what worked.","ar":"After analysing evidence you may find five problems. Choose one or two to act on, for example \"connectives of contrast in writing\" and \"listening for detail\". Change one thing, check again and then move on. A teacher who tries to fix everything at once cannot tell what worked."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Group evidence by skill and strand using the reporting codes. Treat a pattern as real only if it appears in more than one source. Do error analysis to find the cause and set priorities (meaning first). Plan short, targeted interventions and re-check. Track progress with the objective code and the type of evidence, and never invent or mix up data.","ar":"Group evidence by skill and strand using the reporting codes. Treat a pattern as real only if it appears in more than one source. Do error analysis to find the cause and set priorities (meaning first). Plan short, targeted interventions and re-check. Track progress with the objective code and the type of evidence, and never invent or mix up data."}}],"checks":[{"id":"m7q1","q":{"en":"A class report shows lower results in \"Us\" than in \"Ug\". What does this tell the teacher?","ar":"A class report shows lower results in \"Us\" than in \"Ug\". What does this tell the teacher?"},"opts":[{"en":"Vocabulary items, such as prepositions and noun phrases, are weaker than grammar items","ar":"Vocabulary items, such as prepositions and noun phrases, are weaker than grammar items"},{"en":"Speaking items for organisation are weaker than speaking items for communication","ar":"Speaking items for organisation are weaker than speaking items for communication"},{"en":"Sentence structure items, such as connectives and relative clauses, are weaker than grammatical forms","ar":"Sentence structure items, such as connectives and relative clauses, are weaker than grammatical forms"},{"en":"Writing items for content are weaker than writing items for organisation and layout","ar":"Writing items for content are weaker than writing items for organisation and layout"}],"correct":2,"expl":{"en":"Us is the reporting code for Sentence structure and Ug for Grammatical forms in the Use of English strand.","ar":"Us is the reporting code for Sentence structure and Ug for Grammatical forms in the Use of English strand."}},{"id":"m7q2","q":{"en":"Which action best fits the evidence cycle after a weak result in one area?","ar":"Which action best fits the evidence cycle after a weak result in one area?"},"opts":[{"en":"Reteach the whole unit again, using the same activities, in the following week","ar":"Reteach the whole unit again, using the same activities, in the following week"},{"en":"Record the learners as \"low level\" and move to the next unit to keep to the plan","ar":"Record the learners as \"low level\" and move to the next unit to keep to the plan"},{"en":"Replace the test in future years, because the result shows the test was unfair","ar":"Replace the test in future years, because the result shows the test was unfair"},{"en":"Check with classroom evidence, find the error pattern, then plan a short targeted intervention","ar":"Check with classroom evidence, find the error pattern, then plan a short targeted intervention"}],"correct":3,"expl":{"en":"The cycle is collect, analyse, find the cause, act and check again.","ar":"The cycle is collect, analyse, find the cause, act and check again."}},{"id":"m7q3","q":{"en":"A learner writes \"He said me to come.\" Which priority is best according to Module 7?","ar":"A learner writes \"He said me to come.\" Which priority is best according to Module 7?"},"opts":[{"en":"Teach reported speech with tell and say, because the error affects meaning","ar":"Teach reported speech with tell and say, because the error affects meaning"},{"en":"Ignore it, because Stage 8 allows any mistake in written language","ar":"Ignore it, because Stage 8 allows any mistake in written language"},{"en":"Correct only the spelling in the sentence, because it is the simplest feature","ar":"Correct only the spelling in the sentence, because it is the simplest feature"},{"en":"Wait until Stage 9, because reported speech is not in Stage 8 objectives","ar":"Wait until Stage 9, because reported speech is not in Stage 8 objectives"}],"correct":0,"expl":{"en":"Meaning-blocking errors linked to objectives come first; 8Ug.12 covers reported speech forms.","ar":"Meaning-blocking errors linked to objectives come first; 8Ug.12 covers reported speech forms."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A framework describes what learners should be able to do. It does not tell you how to include every learner. This module covers three linked responsibilities: making the curriculum accessible to all students, challenging those who are ready for more, and helping learners to move between stages. The framework gives us some principles; the school's inclusion policy and the learner's individual plan (such as an IEP) give the detailed arrangements. We label good practice and PEPS context as such.","ar":"A framework describes what learners should be able to do. It does not tell you how to include every learner. This module covers three linked responsibilities: making the curriculum accessible to all students, challenging those who are ready for more, and helping learners to move between stages. The framework gives us some principles; the school's inclusion policy and the learner's individual plan (such as an IEP) give the detailed arrangements. We label good practice and PEPS context as such."}},{"t":"h","c":{"en":"What the framework says that supports inclusion","ar":"What the framework says that supports inclusion"}},{"t":"list","c":{"en":["\u003cstrong>Learners who speak another language at home.\u003c/strong> ESL is \"designed for learners who speak a language other than English at home\", with an expectation of primary ESL study. At PEPS, all students learn English as a second language.","\u003cstrong>Successful language learners.\u003c/strong> One aim is that learners \"see themselves as successful language learners\". This should shape the way we talk about progress, not only marks.","\u003cstrong>Take risks and learn from mistakes.\u003c/strong> The \"confident\" attribute describes learners who feel empowered to take risks and learn from their mistakes.","\u003cstrong>Flexible age range.\u003c/strong> The framework is \"typically for learners aged 11 to 14, but it may be appropriate to use it for slightly different ages to suit your context\".","\u003cstrong>Support wording.\u003c/strong> Many objectives say \"with support\" or \"with little or no support\". These phrases are part of the curriculum."],"ar":["\u003cstrong>Learners who speak another language at home.\u003c/strong> ESL is \"designed for learners who speak a language other than English at home\", with an expectation of primary ESL study. At PEPS, all students learn English as a second language.","\u003cstrong>Successful language learners.\u003c/strong> One aim is that learners \"see themselves as successful language learners\". This should shape the way we talk about progress, not only marks.","\u003cstrong>Take risks and learn from mistakes.\u003c/strong> The \"confident\" attribute describes learners who feel empowered to take risks and learn from their mistakes.","\u003cstrong>Flexible age range.\u003c/strong> The framework is \"typically for learners aged 11 to 14, but it may be appropriate to use it for slightly different ages to suit your context\".","\u003cstrong>Support wording.\u003c/strong> Many objectives say \"with support\" or \"with little or no support\". These phrases are part of the curriculum."]}},{"t":"p","c":{"en":"The framework does not give detailed guidance for learners with special educational needs or disabilities, or for gifted learners. Anything below on those groups is good practice or school context, not a Cambridge statement.","ar":"The framework does not give detailed guidance for learners with special educational needs or disabilities, or for gifted learners. Anything below on those groups is good practice or school context, not a Cambridge statement."}},{"t":"h","c":{"en":"Students of determination and learners with SEND (good practice and PEPS context)","ar":"Students of determination and learners with SEND (good practice and PEPS context)"}},{"t":"p","c":{"en":"In the UAE, learners with special educational needs and disabilities are often called \"students of determination\". The school's inclusion policy and each learner's plan tell you what is agreed, for example access arrangements, a modified task or additional adult support. Your role is to teach the same curriculum objectives, adapted so that the learner can take part. Here are practical ideas.","ar":"In the UAE, learners with special educational needs and disabilities are often called \"students of determination\". The school's inclusion policy and each learner's plan tell you what is agreed, for example access arrangements, a modified task or additional adult support. Your role is to teach the same curriculum objectives, adapted so that the learner can take part. Here are practical ideas."}},{"t":"table","head":{"en":["Barrier","Possible adaptation (good practice)","Example"],"ar":["Barrier","Possible adaptation (good practice)","Example"]},"rows":[{"en":["Slow reading speed or decoding difficulty","Shorter text, larger print, text read aloud, key words highlighted.","7Rd.01: same questions on a shorter version of the text."],"ar":["Slow reading speed or decoding difficulty","Shorter text, larger print, text read aloud, key words highlighted.","7Rd.01: same questions on a shorter version of the text."]},{"en":["Difficulty with listening","Transcript available, shorter extracts, replay, visual cue cards.","8Ld.02: pause after each part and let the learner confirm with a partner."],"ar":["Difficulty with listening","Transcript available, shorter extracts, replay, visual cue cards.","8Ld.02: pause after each part and let the learner confirm with a partner."]},{"en":["Difficulty organising writing","Planning frame, sentence starters, a word bank, extra time.","8Wc.02: a table with opinion, reason, example, contrast."],"ar":["Difficulty organising writing","Planning frame, sentence starters, a word bank, extra time.","8Wc.02: a table with opinion, reason, example, contrast."]},{"en":["Anxiety about speaking","Rehearse in pairs first; record privately; start with short answers.","8Sc.04: a one-minute recording shared only with the teacher."],"ar":["Anxiety about speaking","Rehearse in pairs first; record privately; start with short answers.","8Sc.04: a one-minute recording shared only with the teacher."]},{"en":["Slow processing","Fewer questions, clear steps, extra thinking time.","Give questions in advance so that learners can prepare."],"ar":["Slow processing","Fewer questions, clear steps, extra thinking time.","Give questions in advance so that learners can prepare."]}]},{"t":"callout","k":"warn","title":{"en":"Adapt the access, not the aim","ar":"Adapt the access, not the aim"},"c":{"en":"A good adaptation keeps the learning objective and changes the way the learner reaches it. If you reduce the task so far that the learner no longer practises the objective, the adaptation is too large. Discuss with the SEN coordinator and keep to what the learner's plan states.","ar":"A good adaptation keeps the learning objective and changes the way the learner reaches it. If you reduce the task so far that the learner no longer practises the objective, the adaptation is too large. Discuss with the SEN coordinator and keep to what the learner's plan states."}},{"t":"h","c":{"en":"Gifted and talented learners (good practice)","ar":"Gifted and talented learners (good practice)"}},{"t":"p","c":{"en":"Challenge means deeper, not simply more. A learner who completes a Stage 8 task quickly does not need ten more questions of the same kind. The framework's progression gives you a ready source of challenge: look at how the next stage's objective is worded and use it as a challenge task.","ar":"Challenge means deeper, not simply more. A learner who completes a Stage 8 task quickly does not need ten more questions of the same kind. The framework's progression gives you a ready source of challenge: look at how the next stage's objective is worded and use it as a challenge task."}},{"t":"table","head":{"en":["Stage 8 focus","Challenge idea drawn from Stage 9 wording"],"ar":["Stage 8 focus","Challenge idea drawn from Stage 9 wording"]},"rows":[{"en":["8Ro.01: recognise the writer's opinion","Use 9Ro.02: separate fact from opinion and find examples of bias in two articles on the same event."],"ar":["8Ro.01: recognise the writer's opinion","Use 9Ro.02: separate fact from opinion and find examples of bias in two articles on the same event."]},{"en":["8So.01: justify points of view","Use 9So.01: also evaluate another speaker's opinion and respond."],"ar":["8So.01: justify points of view","Use 9So.01: also evaluate another speaker's opinion and respond."]},{"en":["8Ug.10: second conditional and wish","Use 9Ug.10 carefully: begin to use third conditional in a short reflection on a past choice."],"ar":["8Ug.10: second conditional and wish","Use 9Ug.10 carefully: begin to use third conditional in a short reflection on a past choice."]},{"en":["8Wc.02: coherent arguments","Write an argument and a counter-argument, with a clear conclusion."],"ar":["8Wc.02: coherent arguments","Write an argument and a counter-argument, with a clear conclusion."]}]},{"t":"p","c":{"en":"Other ideas include extended reading from the school library, leading a discussion as chair, writing for a real audience (a school newsletter), or acting as a language mentor for peers. Identify learners using the school's gifted and talented process, not only test scores; a quiet learner with strong reading may not show talent in speaking tasks.","ar":"Other ideas include extended reading from the school library, leading a discussion as chair, writing for a real audience (a school newsletter), or acting as a language mentor for peers. Identify learners using the school's gifted and talented process, not only test scores; a quiet learner with strong reading may not show talent in speaking tasks."}},{"t":"h","c":{"en":"Transition: Primary Stage 6 into Stage 7","ar":"Transition: Primary Stage 6 into Stage 7"}},{"t":"p","c":{"en":"The framework says ESL learners are expected to have studied ESL at primary school, and the progression of learning objectives is on the support site. The Primary and Lower Secondary programmes share a design: the same five strands and the same code structure, and the framework says the integrated approach starts in Primary and continues through Lower Secondary. In the framework's diagram, Primary stages are shown reaching A1 and A2 and Lower Secondary reaching B1.","ar":"The framework says ESL learners are expected to have studied ESL at primary school, and the progression of learning objectives is on the support site. The Primary and Lower Secondary programmes share a design: the same five strands and the same code structure, and the framework says the integrated approach starts in Primary and continues through Lower Secondary. In the framework's diagram, Primary stages are shown reaching A1 and A2 and Lower Secondary reaching B1."}},{"t":"p","c":{"en":"Compare a few objectives to see the step in expectation (Primary wording from the Cambridge Primary ESL 0057 framework; check both documents):","ar":"Compare a few objectives to see the step in expectation (Primary wording from the Cambridge Primary ESL 0057 framework; check both documents):"}},{"t":"table","head":{"en":["Focus","Primary Stage 6","Lower Secondary Stage 7"],"ar":["Focus","Primary Stage 6","Lower Secondary Stage 7"]},"rows":[{"en":["Main points of a text","6Rm.01: understand, with support, most of the main points","7Rm.01: with little or no support"],"ar":["Main points of a text","6Rm.01: understand, with support, most of the main points","7Rm.01: with little or no support"]},{"en":["Extended reading","6Rm.02: a range of short, simple texts independently","7Rm.02: a limited range of extended fiction and non-fiction texts"],"ar":["Extended reading","6Rm.02: a range of short, simple texts independently","7Rm.02: a limited range of extended fiction and non-fiction texts"]},{"en":["Writing a description","6Wc.02: with support, short texts that describe","7Wc.01: short texts that describe, with little or no support"],"ar":["Writing a description","6Wc.02: with support, short texts that describe","7Wc.01: short texts that describe, with little or no support"]},{"en":["Writing opinions","6Wc.03: express opinions and feelings","7Wc.02: express opinions with support and begin to develop arguments"],"ar":["Writing opinions","6Wc.03: express opinions and feelings","7Wc.02: express opinions with support and begin to develop arguments"]}]},{"t":"p","c":{"en":"The main change is less support and longer texts. In the first weeks of Year 7 (PEPS context), good practice is to review what learners know, use a short diagnostic task for each skill, talk to the Year 6 teachers and keep support strong at first, then reduce it deliberately.","ar":"The main change is less support and longer texts. In the first weeks of Year 7 (PEPS context), good practice is to review what learners know, use a short diagnostic task for each skill, talk to the Year 6 teachers and keep support strong at first, then reduce it deliberately."}},{"t":"h","c":{"en":"Stage 9 and the move towards IGCSE","ar":"Stage 9 and the move towards IGCSE"}},{"t":"p","c":{"en":"The framework says the Primary and Lower Secondary programmes \"provide a solid foundation for the further study of English as a Second Language, and for further study through the medium of English at Cambridge IGCSE or O Level and beyond.\" Its diagram shows B2 at Cambridge IGCSE. The framework does not describe IGCSE content or assessments, so this CPD does not either; check the current IGCSE syllabus for that. PEPS context: Cambridge IGCSE begins in Year 10, after Year 9 and Checkpoint.","ar":"The framework says the Primary and Lower Secondary programmes \"provide a solid foundation for the further study of English as a Second Language, and for further study through the medium of English at Cambridge IGCSE or O Level and beyond.\" Its diagram shows B2 at Cambridge IGCSE. The framework does not describe IGCSE content or assessments, so this CPD does not either; check the current IGCSE syllabus for that. PEPS context: Cambridge IGCSE begins in Year 10, after Year 9 and Checkpoint."}},{"t":"p","c":{"en":"What does this mean for Year 9 teaching? Stage 9 is the last stage in the framework, so the Stage 9 objectives are where independence is highest: 9Wca.02 (plan, write, edit and proofread independently), 9Sc.05 (frequently correct own errors) and 9Ro.02 (fact and opinion, including bias). Good practice is to build habits that will help later study: planning and checking writing, taking notes from listening, and reading longer texts.","ar":"What does this mean for Year 9 teaching? Stage 9 is the last stage in the framework, so the Stage 9 objectives are where independence is highest: 9Wca.02 (plan, write, edit and proofread independently), 9Sc.05 (frequently correct own errors) and 9Ro.02 (fact and opinion, including bias). Good practice is to build habits that will help later study: planning and checking writing, taking notes from listening, and reading longer texts."}},{"t":"h","c":{"en":"Language across the curriculum","ar":"Language across the curriculum"}},{"t":"p","c":{"en":"The framework's aims include \"knowledge, understanding and skills that can be applied in and across subjects\" and a foundation for \"study through the medium of English\". At PEPS, Maths 0862 and Science 0893 are also taught in English, so your learners meet academic English every day. Good practice for ESL teachers: ask Maths and Science teachers for the key terms of the next unit and teach word families and instructions (\u003cem>calculate, compare, investigate, explain\u003c/em>); use science or maths texts in reading lessons; and practise explanation language (\"because\", \"therefore\", \"as a result\") that learners need in those subjects (7Us.03 and 8Us.02 give a base). Subject teachers can use the same sentence frames to build consistency.","ar":"The framework's aims include \"knowledge, understanding and skills that can be applied in and across subjects\" and a foundation for \"study through the medium of English\". At PEPS, Maths 0862 and Science 0893 are also taught in English, so your learners meet academic English every day. Good practice for ESL teachers: ask Maths and Science teachers for the key terms of the next unit and teach word families and instructions (\u003cem>calculate, compare, investigate, explain\u003c/em>); use science or maths texts in reading lessons; and practise explanation language (\"because\", \"therefore\", \"as a result\") that learners need in those subjects (7Us.03 and 8Us.02 give a base). Subject teachers can use the same sentence frames to build consistency."}},{"t":"scenario","title":{"en":"Scenario: the quiet, able learner","ar":"Scenario: the quiet, able learner"},"c":{"en":"A Year 8 learner finishes reading tasks quickly but rarely speaks. The teacher worries that giving more reading will not help. What is a good response? Keep the learner challenged in reading with a task from 9Ro.02 (fact, opinion and bias), but link it to speaking: ask the learner to prepare a one-minute talk to evaluate the writer's opinion (the idea behind 9So.01), first with a partner and then with a small group. Praise attempts rather than perfection. Challenge and support are used together, and the speaking practice meets 8So.01.","ar":"A Year 8 learner finishes reading tasks quickly but rarely speaks. The teacher worries that giving more reading will not help. What is a good response? Keep the learner challenged in reading with a task from 9Ro.02 (fact, opinion and bias), but link it to speaking: ask the learner to prepare a one-minute talk to evaluate the writer's opinion (the idea behind 9So.01), first with a partner and then with a small group. Praise attempts rather than perfection. Challenge and support are used together, and the speaking practice meets 8So.01."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"The framework does not give detailed inclusion guidance, so use the school's inclusion policy and learner plans, adapt the access and not the aim, and challenge gifted learners with deeper tasks, using the next stage's wording. Support transition from Primary Stage 6 to Stage 7 with diagnostic tasks and gradual reduction of support, and prepare Stage 9 learners for IGCSE with habits of independence. Teach language that learners need across the curriculum.","ar":"The framework does not give detailed inclusion guidance, so use the school's inclusion policy and learner plans, adapt the access and not the aim, and challenge gifted learners with deeper tasks, using the next stage's wording. Support transition from Primary Stage 6 to Stage 7 with diagnostic tasks and gradual reduction of support, and prepare Stage 9 learners for IGCSE with habits of independence. Teach language that learners need across the curriculum."}}],"checks":[{"id":"m8q1","q":{"en":"What does the framework say about the age range of the Lower Secondary framework?","ar":"What does the framework say about the age range of the Lower Secondary framework?"},"opts":[{"en":"It is only for learners aged 12 to 14, and no other ages are appropriate","ar":"It is only for learners aged 12 to 14, and no other ages are appropriate"},{"en":"It is typically for learners aged 11 to 14, but may suit slightly different ages in some contexts","ar":"It is typically for learners aged 11 to 14, but may suit slightly different ages in some contexts"},{"en":"It is typically for learners aged 10 to 13, and the age is set by Cambridge","ar":"It is typically for learners aged 10 to 13, and the age is set by Cambridge"},{"en":"It is for learners aged 11 to 16 and includes the first two IGCSE years","ar":"It is for learners aged 11 to 16 and includes the first two IGCSE years"}],"correct":1,"expl":{"en":"The framework says it is typically for learners aged 11 to 14, but it may be appropriate for slightly different ages.","ar":"The framework says it is typically for learners aged 11 to 14, but it may be appropriate for slightly different ages."}},{"id":"m8q2","q":{"en":"A teacher wants to challenge a strong Year 8 learner working on 8Ro.01. What is the best idea in Module 8?","ar":"A teacher wants to challenge a strong Year 8 learner working on 8Ro.01. What is the best idea in Module 8?"},"opts":[{"en":"Give the learner ten extra questions of exactly the same kind to complete quickly","ar":"Give the learner ten extra questions of exactly the same kind to complete quickly"},{"en":"Move the learner to Stage 7 texts so that he or she can read faster and win praise","ar":"Move the learner to Stage 7 texts so that he or she can read faster and win praise"},{"en":"Give a task based on the Stage 9 wording of 9Ro.02, on fact, opinion and bias","ar":"Give a task based on the Stage 9 wording of 9Ro.02, on fact, opinion and bias"},{"en":"Ask the learner to proofread other learners' work instead of reading new texts","ar":"Ask the learner to proofread other learners' work instead of reading new texts"}],"correct":2,"expl":{"en":"Challenge should be deeper, and the next stage's wording is a ready source of deeper tasks.","ar":"Challenge should be deeper, and the next stage's wording is a ready source of deeper tasks."}},{"id":"m8q3","q":{"en":"What does the framework say about IGCSE content?","ar":"What does the framework say about IGCSE content?"},"opts":[{"en":"It lists the IGCSE ESL papers and the topics that learners study in Year 10","ar":"It lists the IGCSE ESL papers and the topics that learners study in Year 10"},{"en":"It says Stage 9 objectives are the same as the IGCSE syllabus objectives","ar":"It says Stage 9 objectives are the same as the IGCSE syllabus objectives"},{"en":"It says learners must pass Checkpoint in every subject before they can enter IGCSE courses","ar":"It says learners must pass Checkpoint in every subject before they can enter IGCSE courses"},{"en":"It names IGCSE as further study and shows B2 in its diagram, but gives no IGCSE content","ar":"It names IGCSE as further study and shows B2 in its diagram, but gives no IGCSE content"}],"correct":3,"expl":{"en":"The framework refers to further study at IGCSE and shows B2, but gives no IGCSE content.","ar":"The framework refers to further study at IGCSE and shows B2, but gives no IGCSE content."}}]},{"id":"m9","title":{"en":"Quality and Review: Checklist, Common Mistakes and Action Plan","ar":"Quality and Review: Checklist, Common Mistakes and Action Plan"},"minutes":17,"blocks":[{"t":"p","c":{"en":"In this final module we bring Part B together. You will use a checklist to judge a lesson, learn the common mistakes that teachers and departments make with the framework, write a personal action plan and revisit the five main ideas. The checklist is good practice built from the framework; it is not a Cambridge document and not a school form. Use it for self-review or for professional conversations with your HOD, and follow your school's own observation and planning expectations.","ar":"In this final module we bring Part B together. You will use a checklist to judge a lesson, learn the common mistakes that teachers and departments make with the framework, write a personal action plan and revisit the five main ideas. The checklist is good practice built from the framework; it is not a Cambridge document and not a school form. Use it for self-review or for professional conversations with your HOD, and follow your school's own observation and planning expectations."}},{"t":"h","c":{"en":"A checklist for a curriculum-aligned ESL lesson","ar":"A checklist for a curriculum-aligned ESL lesson"}},{"t":"table","head":{"en":["Area","Question to ask","Link to the framework"],"ar":["Area","Question to ask","Link to the framework"]},"rows":[{"en":["Objectives","Is there one or two clear focus objectives, with codes, at the right stage? Do learners know them as an \"I can\" statement?","Learning objectives are the standard; codes are unique per stage."],"ar":["Objectives","Is there one or two clear focus objectives, with codes, at the right stage? Do learners know them as an \"I can\" statement?","Learning objectives are the standard; codes are unique per stage."]},{"en":["Integration","Does the lesson give practice in more than one skill, and is there a Use of English focus?","Integrated approach; lessons include objectives from more than one strand."],"ar":["Integration","Does the lesson give practice in more than one skill, and is there a Use of English focus?","Integrated approach; lessons include objectives from more than one strand."]},{"en":["Theme and text","Is the topic relevant to learners and is the text or recording suitable and, where possible, authentic?","Themes relevant to learners; authentic language."],"ar":["Theme and text","Is the topic relevant to learners and is the text or recording suitable and, where possible, authentic?","Themes relevant to learners; authentic language."]},{"en":["Active learning","Do learners notice, discuss, sort, correct or decide rather than only listen?","Active learning; explore and identify."],"ar":["Active learning","Do learners notice, discuss, sort, correct or decide rather than only listen?","Active learning; explore and identify."]},{"en":["Support","Is the support suited to the objective's wording (\"with support\" or \"with little or no support\") and planned to reduce?","Support wording in the objectives."],"ar":["Support","Is the support suited to the objective's wording (\"with support\" or \"with little or no support\") and planned to reduce?","Support wording in the objectives."]},{"en":["Talk","Do all learners speak, in pairs or small groups, for a real purpose?","Speaking strand; interact naturally."],"ar":["Talk","Do all learners speak, in pairs or small groups, for a real purpose?","Speaking strand; interact naturally."]},{"en":["Accuracy and feedback","Is feedback selective, linked to the objective, with time to respond?","Mostly accurate language; correcting own errors from Stage 8."],"ar":["Accuracy and feedback","Is feedback selective, linked to the objective, with time to respond?","Mostly accurate language; correcting own errors from Stage 8."]},{"en":["Differentiation","Is there a plan for learners needing more support and for those needing more challenge?","Support wording; next stage's wording as challenge (good practice)."],"ar":["Differentiation","Is there a plan for learners needing more support and for those needing more challenge?","Support wording; next stage's wording as challenge (good practice)."]},{"en":["Check","Is there a planned way to see who has learned what by the end, and is it recorded?","Objectives as a reference for checking."],"ar":["Check","Is there a planned way to see who has learned what by the end, and is it recorded?","Objectives as a reference for checking."]},{"en":["Language across the curriculum","Does the lesson link to the English needed in other subjects where it fits?","Aim: study through the medium of English."],"ar":["Language across the curriculum","Does the lesson link to the English needed in other subjects where it fits?","Aim: study through the medium of English."]}]},{"t":"h","c":{"en":"Common mistakes","ar":"Common mistakes"}},{"t":"table","head":{"en":["Mistake","Why it is a problem","Better practice"],"ar":["Mistake","Why it is a problem","Better practice"]},"rows":[{"en":["Treating the scheme of work as compulsory","The framework says teachers do not need to use its ideas; it also does not fill all the teaching time.","Use it as support; make sure every objective is covered."],"ar":["Treating the scheme of work as compulsory","The framework says teachers do not need to use its ideas; it also does not fill all the teaching time.","Use it as support; make sure every objective is covered."]},{"en":["Teaching skills in separate blocks","The framework expects an integrated approach.","Build units around a theme that uses all four skills and Use of English."],"ar":["Teaching skills in separate blocks","The framework expects an integrated approach.","Build units around a theme that uses all four skills and Use of English."]},{"en":["Teaching grammar as rules only","Learners know the rule but do not use it in speech or writing.","Notice, practise and use in speaking and writing."],"ar":["Teaching grammar as rules only","Learners know the rule but do not use it in speech or writing.","Notice, practise and use in speaking and writing."]},{"en":["Too many objectives in one lesson","It cannot be taught or checked well.","One or two focus objectives, plus supporting skills."],"ar":["Too many objectives in one lesson","It cannot be taught or checked well.","One or two focus objectives, plus supporting skills."]},{"en":["Expecting perfection","Objectives allow occasional mistakes; fear of mistakes stops speaking.","Target meaning-blocking and frequent errors."],"ar":["Expecting perfection","Objectives allow occasional mistakes; fear of mistakes stops speaking.","Target meaning-blocking and frequent errors."]},{"en":["Testing instead of teaching listening","Learners practise only the test format.","Teach with repeated, purposeful listening; test as a check."],"ar":["Testing instead of teaching listening","Learners practise only the test format.","Teach with repeated, purposeful listening; test as a check."]},{"en":["Ignoring speaking evidence","No Speaking paper is listed in the framework's ESL test papers, so speaking may go unrecorded.","Plan classroom speaking assessments and record them."],"ar":["Ignoring speaking evidence","No Speaking paper is listed in the framework's ESL test papers, so speaking may go unrecorded.","Plan classroom speaking assessments and record them."]},{"en":["Mixing test results","GL, Checkpoint and class tasks are different measures.","Use each for its purpose; compare by skill; use several sources."],"ar":["Mixing test results","GL, Checkpoint and class tasks are different measures.","Use each for its purpose; compare by skill; use several sources."]},{"en":["Using the wrong stage's wording","Learners can be over- or under-challenged.","Check the code stage; use another stage deliberately for support or challenge."],"ar":["Using the wrong stage's wording","Learners can be over- or under-challenged.","Check the code stage; use another stage deliberately for support or challenge."]},{"en":["Mixing up Uv and Us","Vocabulary (Uv) and Sentence structure (Us) are separate sub-strands in the framework's codes.","Check the code table before reading a report."],"ar":["Mixing up Uv and Us","Vocabulary (Uv) and Sentence structure (Us) are separate sub-strands in the framework's codes.","Check the code table before reading a report."]}]},{"t":"scenario","title":{"en":"Scenario: using the checklist on a real lesson","ar":"Scenario: using the checklist on a real lesson"},"c":{"en":"A Year 9 teacher reviews her lesson on 9Ro.02 (fact and opinion). She finds: the objective is clear (yes); one skill only, reading (no); the text is a real newspaper article (yes); learners work silently (no); support is the same for all (no); there is no end check (no). Three improvements are enough for the next lesson: add a short discussion in which pairs justify which sentences are opinions (speaking and 9So.01); give a sentence-sort version to learners who need support and a bias task to those who are ready; and end with an exit ticket in which each learner writes one fact and one opinion from the text. She does not need to change everything at once.","ar":"A Year 9 teacher reviews her lesson on 9Ro.02 (fact and opinion). She finds: the objective is clear (yes); one skill only, reading (no); the text is a real newspaper article (yes); learners work silently (no); support is the same for all (no); there is no end check (no). Three improvements are enough for the next lesson: add a short discussion in which pairs justify which sentences are opinions (speaking and 9So.01); give a sentence-sort version to learners who need support and a bias task to those who are ready; and end with an exit ticket in which each learner writes one fact and one opinion from the text. She does not need to change everything at once."}},{"t":"h","c":{"en":"Writing an action plan","ar":"Writing an action plan"}},{"t":"p","c":{"en":"An action plan should be small, specific and checkable. Use the following frame (good practice).","ar":"An action plan should be small, specific and checkable. Use the following frame (good practice)."}},{"t":"steps","c":{"en":["\u003cstrong>Choose one area\u003c/strong> from the checklist or your own evidence, for example \"all learners speak in each lesson\".","\u003cstrong>Write one action\u003c/strong> you can start next week, for example \"use think-pair-share in every Year 8 lesson for three weeks\".","\u003cstrong>Decide the evidence\u003c/strong> that will show it worked, for example \"observation notes of five pairs and a short learner survey\".","\u003cstrong>Choose a review date\u003c/strong> and a person to talk to, such as your HOD or a colleague who will observe.","\u003cstrong>Decide what you will do next\u003c/strong>, whether the action works or not."],"ar":["\u003cstrong>Choose one area\u003c/strong> from the checklist or your own evidence, for example \"all learners speak in each lesson\".","\u003cstrong>Write one action\u003c/strong> you can start next week, for example \"use think-pair-share in every Year 8 lesson for three weeks\".","\u003cstrong>Decide the evidence\u003c/strong> that will show it worked, for example \"observation notes of five pairs and a short learner survey\".","\u003cstrong>Choose a review date\u003c/strong> and a person to talk to, such as your HOD or a colleague who will observe.","\u003cstrong>Decide what you will do next\u003c/strong>, whether the action works or not."]}},{"t":"table","head":{"en":["Weak action plan","Stronger action plan"],"ar":["Weak action plan","Stronger action plan"]},"rows":[{"en":["\"Improve speaking in Year 9.\"","\"In weeks 1 to 3, give each Year 9 class a five-minute information-gap task twice a week (9Sc.02). Evidence: observation notes of four pairs per lesson. Review with HOD in week 4.\""],"ar":["\"Improve speaking in Year 9.\"","\"In weeks 1 to 3, give each Year 9 class a five-minute information-gap task twice a week (9Sc.02). Evidence: observation notes of four pairs per lesson. Review with HOD in week 4.\""]},{"en":["\"Use more authentic texts.\"","\"For the next Year 8 unit, add one real short article, with a glossary and two reading passes (8Rm.02). Evidence: learners' summary sentences. Review on [date].\""],"ar":["\"Use more authentic texts.\"","\"For the next Year 8 unit, add one real short article, with a glossary and two reading passes (8Rm.02). Evidence: learners' summary sentences. Review on [date].\""]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: share, do not hide","ar":"Good practice: share, do not hide"},"c":{"en":"Share your action plan with a colleague. Professional conversations are the best way to improve consistency across sections A to D in a year group. Departments can also agree simple common routines, for example a shared can-do checklist for each unit.","ar":"Share your action plan with a colleague. Professional conversations are the best way to improve consistency across sections A to D in a year group. Departments can also agree simple common routines, for example a shared can-do checklist for each unit."}},{"t":"h","c":{"en":"Where to look next","ar":"Where to look next"}},{"t":"p","c":{"en":"Return to the framework for the full wording of the objectives in your stage. Use the Cambridge Lower Secondary support site for the teacher guide, schemes of work, the progression of learning objectives across Stages 7 to 9 and information on assessments. Ask the Cambridge coordinator or exams officer in your school if you need a log-in. Check with your HOD for the school's planning, assessment and inclusion expectations. If anything in this CPD seems different from the current Cambridge documents, the Cambridge documents are right.","ar":"Return to the framework for the full wording of the objectives in your stage. Use the Cambridge Lower Secondary support site for the teacher guide, schemes of work, the progression of learning objectives across Stages 7 to 9 and information on assessments. Ask the Cambridge coordinator or exams officer in your school if you need a log-in. Check with your HOD for the school's planning, assessment and inclusion expectations. If anything in this CPD seems different from the current Cambridge documents, the Cambridge documents are right."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> The learning objectives are the standard; schemes of work and the teacher guide are optional support, and the teaching-time figure of 4 to 5 hours a week (about 120 to 150 hours a stage) is guidance that may vary.\u003cbr>\u003cstrong>2.\u003c/strong> Plan integrated lessons: all four skills, a Use of English focus, a relevant theme and a planned check.\u003cbr>\u003cstrong>3.\u003c/strong> Teach each skill, do not only test it: model and scaffold writing, read and listen more than once, give every learner time to speak, and teach grammar and vocabulary in context.\u003cbr>\u003cstrong>4.\u003c/strong> Use several kinds of evidence, read results by reporting code, keep Checkpoint and GL results separate, and act on patterns with short, targeted interventions.\u003cbr>\u003cstrong>5.\u003c/strong> Include and challenge every learner, support transitions at Stage 7 and Stage 9, and review your own lessons with a checklist and a small action plan.\u003cbr>\u003cbr>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.","ar":"\u003cstrong>1.\u003c/strong> The learning objectives are the standard; schemes of work and the teacher guide are optional support, and the teaching-time figure of 4 to 5 hours a week (about 120 to 150 hours a stage) is guidance that may vary.\u003cbr>\u003cstrong>2.\u003c/strong> Plan integrated lessons: all four skills, a Use of English focus, a relevant theme and a planned check.\u003cbr>\u003cstrong>3.\u003c/strong> Teach each skill, do not only test it: model and scaffold writing, read and listen more than once, give every learner time to speak, and teach grammar and vocabulary in context.\u003cbr>\u003cstrong>4.\u003c/strong> Use several kinds of evidence, read results by reporting code, keep Checkpoint and GL results separate, and act on patterns with short, targeted interventions.\u003cbr>\u003cstrong>5.\u003c/strong> Include and challenge every learner, support transitions at Stage 7 and Stage 9, and review your own lessons with a checklist and a small action plan.\u003cbr>\u003cbr>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance."}}],"checks":[{"id":"m9q1","q":{"en":"A lesson plan lists eight objectives from five strands and no end check. Which checklist areas does it fail?","ar":"A lesson plan lists eight objectives from five strands and no end check. Which checklist areas does it fail?"},"opts":[{"en":"Too many objectives and no planned way to check what each learner has learned","ar":"Too many objectives and no planned way to check what each learner has learned"},{"en":"The theme and text area only, because the text is not authentic","ar":"The theme and text area only, because the text is not authentic"},{"en":"The speaking area only, because there are no group tasks listed","ar":"The speaking area only, because there are no group tasks listed"},{"en":"The access area only, because the lesson has no plan for learners with SEND","ar":"The access area only, because the lesson has no plan for learners with SEND"}],"correct":0,"expl":{"en":"The checklist asks for one or two focus objectives and a planned check.","ar":"The checklist asks for one or two focus objectives and a planned check."}},{"id":"m9q2","q":{"en":"Which action plan is strongest according to Module 9?","ar":"Which action plan is strongest according to Module 9?"},"opts":[{"en":"Improve the speaking skills of all learners in the year group by /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;
if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
