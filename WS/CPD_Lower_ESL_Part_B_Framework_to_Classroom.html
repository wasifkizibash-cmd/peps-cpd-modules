#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-esl-framework-b","code":"LEB","passMark":80,"hours":"2.5 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary English as a Second Language 0876 · Part B","ar":"Staff CPD · Cambridge Lower Secondary English as a Second Language 0876 · Part B"},"title":{"en":"Understanding the Cambridge Lower Secondary ESL Curriculum: Part B, From Framework to Classroom","ar":"Understanding the Cambridge Lower Secondary ESL Curriculum: Part B, From Framework to Classroom"},"subtitle":{"en":"A self-paced guide for Year 7 to 9 teachers, coordinators and new staff. Part A explained how the framework is built. Part B shows how to turn it into planning, teaching, assessment and follow-up for Stages 7 to 9: integrated lessons, reading and writing, listening and speaking, using evidence, inclusion, transition and review.","ar":"A self-paced guide for Year 7 to 9 teachers, coordinators and new staff. Part A explained how the framework is built. Part B shows how to turn it into planning, teaching, assessment and follow-up for Stages 7 to 9: integrated lessons, reading and writing, listening and speaking, using evidence, inclusion, transition and review."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework (v2.0)","ar":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework (v2.0)"},"source":{"en":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework, version 2.0 (latest version published August 2021). Check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary English as a Second Language 0876 Curriculum Framework, version 2.0 (latest version published August 2021). Check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"From Objectives to Lessons: Planning with the Framework","ar":"From Objectives to Lessons: Planning with the Framework"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explained how the Cambridge Lower Secondary English as a Second Language (ESL) 0876 framework is built: its five strands, its link to the CEFR, its codes and the content of Stages 7, 8 and 9. Part B starts from a different question: \u003cstrong>what do I do on Monday morning?\u003c/strong> By the end of Part B you will be able to: plan at long, medium and short term; build a unit around integrated skills; teach reading, writing, listening, speaking and Use of English well in Years 7 to 9; use assessment and results to adjust your teaching; support all learners, including at transition points; and check the quality of your own lessons. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explained how the Cambridge Lower Secondary English as a Second Language (ESL) 0876 framework is built: its five strands, its link to the CEFR, its codes and the content of Stages 7, 8 and 9. Part B starts from a different question: \u003cstrong>what do I do on Monday morning?\u003c/strong> By the end of Part B you will be able to: plan at long, medium and short term; build a unit around integrated skills; teach reading, writing, listening, speaking and Use of English well in Years 7 to 9; use assessment and results to adjust your teaching; support all learners, including at transition points; and check the quality of your own lessons. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"A curriculum framework is not a timetable and it is not a textbook. It tells you \u003cem>what learners should be able to do\u003c/em> at each stage. It does not tell you which text to read on a Tuesday or which game to play on a Thursday. That is your professional job. The framework says so clearly: it is \"not accompanied by a prescriptive list of topics\", and teachers are expected to select topics and resources that suit their learners' context.","ar":"A curriculum framework is not a timetable and it is not a textbook. It tells you \u003cem>what learners should be able to do\u003c/em> at each stage. It does not tell you which text to read on a Tuesday or which game to play on a Thursday. That is your professional job. The framework says so clearly: it is \"not accompanied by a prescriptive list of topics\", and teachers are expected to select topics and resources that suit their learners' context."}},{"t":"p","c":{"en":"In PEPS, every student learns English as a second language, and Years 7, 8 and 9 follow Cambridge Lower Secondary ESL 0876 (Stages 7, 8 and 9). Your classes are likely to be mixed in ability, with 25 to 30 learners, and with learners who arrived from Cambridge Primary ESL in Years 1 to 6. The planning ideas below are built for that reality.","ar":"In PEPS, every student learns English as a second language, and Years 7, 8 and 9 follow Cambridge Lower Secondary ESL 0876 (Stages 7, 8 and 9). Your classes are likely to be mixed in ability, with 25 to 30 learners, and with learners who arrived from Cambridge Primary ESL in Years 1 to 6. The planning ideas below are built for that reality."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The framework's glossary describes a scheme of work as containing \"a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\". These three levels are a useful way to think about all planning, whether you use Cambridge's schemes of work or your own.","ar":"The framework's glossary describes a scheme of work as containing \"a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\". These three levels are a useful way to think about all planning, whether you use Cambridge's schemes of work or your own."}},{"t":"table","head":{"en":["Level","What it answers","What it can look like in Years 7 to 9","Who decides"],"ar":["Level","What it answers","What it can look like in Years 7 to 9","Who decides"]},"rows":[{"en":["Long term (the stage, or the year)","Which learning objectives will be taught in this stage, and in what order?","A map of units across the year. Every objective of your stage appears at least once, and language is revisited later at a deeper level.","You, your HOD and the school's planning expectations"],"ar":["Long term (the stage, or the year)","Which learning objectives will be taught in this stage, and in what order?","A map of units across the year. Every objective of your stage appears at least once, and language is revisited later at a deeper level.","You, your HOD and the school's planning expectations"]},{"en":["Medium term (a unit, often a few weeks)","Which objectives are grouped around one theme, and which activities build them?","A theme such as \"Technology and daily life\" with objectives from Reading, Writing, Listening, Speaking and Use of English, plus planned review and a short check.","You, usually with year-group colleagues"],"ar":["Medium term (a unit, often a few weeks)","Which objectives are grouped around one theme, and which activities build them?","A theme such as \"Technology and daily life\" with objectives from Reading, Writing, Listening, Speaking and Use of English, plus planned review and a short check.","You, usually with year-group colleagues"]},{"en":["Short term (the lesson)","What exactly will learners read, hear, say and write today, and how will I know it worked?","One or two focus objectives, a clear \"I can\" success statement, a sequence of tasks and a planned check at the end.","You"],"ar":["Short term (the lesson)","What exactly will learners read, hear, say and write today, and how will I know it worked?","One or two focus objectives, a clear \"I can\" success statement, a sequence of tasks and a planned check at the end.","You"]}]},{"t":"h","c":{"en":"What the teacher guide and schemes of work are","ar":"What the teacher guide and schemes of work are"}},{"t":"p","c":{"en":"The framework tells us about the support that Cambridge provides on the Cambridge Lower Secondary support site. The \u003cstrong>teacher guide\u003c/strong> is described as the document that supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains three things:","ar":"The framework tells us about the support that Cambridge provides on the Cambridge Lower Secondary support site. The \u003cstrong>teacher guide\u003c/strong> is described as the document that supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains three things:"}},{"t":"list","c":{"en":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","sample lesson plans."],"ar":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","sample lesson plans."]}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework states: \"You do not need to use the ideas in the schemes of work.\" They show the \u003cem>types\u003c/em> of activity you might use and the \u003cem>intended depth and breadth\u003c/em> of each objective. They are not designed to fill all the teaching time in a stage, so you should add other activities with a similar level of difficulty, for example from endorsed resources. The \u003cstrong>learning objectives\u003c/strong> are the standard. The suggested activities are help. Do not confuse the two.","ar":"The framework states: \"You do not need to use the ideas in the schemes of work.\" They show the \u003cem>types\u003c/em> of activity you might use and the \u003cem>intended depth and breadth\u003c/em> of each objective. They are not designed to fill all the teaching time in a stage, so you should add other activities with a similar level of difficulty, for example from endorsed resources. The \u003cstrong>learning objectives\u003c/strong> are the standard. The suggested activities are help. Do not confuse the two."}},{"t":"p","c":{"en":"A related point is about textbooks. The framework says there is no requirement for endorsed textbooks to follow the teaching order suggested in the schemes of work, and that if a resource is endorsed, you can be confident that all the learning objectives are covered. So the unit order in your coursebook may differ from a scheme of work, and that is acceptable. Your own check should still be: \u003cem>can I find every objective of my stage somewhere in the year's teaching?\u003c/em> The framework also says that the progression of learning objectives across Stages 7 to 9 is available on the support site, and that you need to know it so that you can build on prior learning in every stage. If you do not have a log-in, the framework says to ask the Cambridge coordinator or exams officer in your school.","ar":"A related point is about textbooks. The framework says there is no requirement for endorsed textbooks to follow the teaching order suggested in the schemes of work, and that if a resource is endorsed, you can be confident that all the learning objectives are covered. So the unit order in your coursebook may differ from a scheme of work, and that is acceptable. Your own check should still be: \u003cem>can I find every objective of my stage somewhere in the year's teaching?\u003c/em> The framework also says that the progression of learning objectives across Stages 7 to 9 is available on the support site, and that you need to know it so that you can build on prior learning in every stage. If you do not have a log-in, the framework says to ask the Cambridge coordinator or exams officer in your school."}},{"t":"h","c":{"en":"Unit planning around integrated skills","ar":"Unit planning around integrated skills"}},{"t":"p","c":{"en":"The most important planning idea in the framework is the integrated approach. It says \"each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more learning objectives from the Use of English strand.\" The four skills are reading, writing, listening and speaking. Use of English (vocabulary, grammatical forms and sentence structure) supplies the language that learners need for all four. Module 2 explores this approach in more detail.","ar":"The most important planning idea in the framework is the integrated approach. It says \"each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more learning objectives from the Use of English strand.\" The four skills are reading, writing, listening and speaking. Use of English (vocabulary, grammatical forms and sentence structure) supplies the language that learners need for all four. Module 2 explores this approach in more detail."}},{"t":"p","c":{"en":"The framework adds that \"you should try to plan lessons that include learning objectives from more than one strand.\" So a good unit does not teach \"two weeks of grammar, then two weeks of reading\". It chooses a theme that is relevant to learners and moves around the skills, returning to the same language several times.","ar":"The framework adds that \"you should try to plan lessons that include learning objectives from more than one strand.\" So a good unit does not teach \"two weeks of grammar, then two weeks of reading\". It chooses a theme that is relevant to learners and moves around the skills, returning to the same language several times."}},{"t":"scenario","title":{"en":"Unit planning example: Stage 8, \"A trip we remember\"","ar":"Unit planning example: Stage 8, \"A trip we remember\""},"c":{"en":"A Stage 8 teacher plans a unit of about two weeks on school trips and memorable events. She selects these objectives (paraphrased; check the framework for the full wording): \u003cstrong>8Rd.01\u003c/strong> understand specific information and detail in texts; \u003cstrong>8Ld.02\u003c/strong> understand specific information in talk; \u003cstrong>8Sc.01\u003c/strong> begin to develop a clear account or narrative with details and examples; \u003cstrong>8Wc.01\u003c/strong> write, with support, extended texts about past events; \u003cstrong>8Ug.03\u003c/strong> past simple forms; \u003cstrong>8Us.02\u003c/strong> connectives of contrast such as \u003cem>although\u003c/em> and \u003cem>however\u003c/em>. Over the unit, learners read a blog post about a school trip and find details, listen to two students describing the same trip, tell a partner their own story, and write a 150-word account. The same language (past simple and contrast connectives) returns in every task. Notice that she did not need a scheme of work. She used the framework's objectives and her knowledge of her learners.","ar":"A Stage 8 teacher plans a unit of about two weeks on school trips and memorable events. She selects these objectives (paraphrased; check the framework for the full wording): \u003cstrong>8Rd.01\u003c/strong> understand specific information and detail in texts; \u003cstrong>8Ld.02\u003c/strong> understand specific information in talk; \u003cstrong>8Sc.01\u003c/strong> begin to develop a clear account or narrative with details and examples; \u003cstrong>8Wc.01\u003c/strong> write, with support, extended texts about past events; \u003cstrong>8Ug.03\u003c/strong> past simple forms; \u003cstrong>8Us.02\u003c/strong> connectives of contrast such as \u003cem>although\u003c/em> and \u003cem>however\u003c/em>. Over the unit, learners read a blog post about a school trip and find details, listen to two students describing the same trip, tell a partner their own story, and write a 150-word account. The same language (past simple and contrast connectives) returns in every task. Notice that she did not need a scheme of work. She used the framework's objectives and her knowledge of her learners."}},{"t":"h","c":{"en":"Reading a code: a worked mini-example","ar":"Reading a code: a worked mini-example"}},{"t":"p","c":{"en":"Part A explained how codes work, so here is only a planning example. A colleague writes \"9Ug.14, 9Ld.01, 9Sor.02\" in a Stage 9 unit plan. Without opening the framework you can say: all three are Stage 9; \u003cstrong>Ug\u003c/strong> is Use of English, grammatical forms (9Ug.14 is about past modal forms such as \u003cem>must have\u003c/em> and \u003cem>can't have\u003c/em> for speculation and deduction about the past); \u003cstrong>Ld\u003c/strong> is Listening for detail (9Ld.01 is about deducing meaning and understanding some implied meaning); \u003cstrong>Sor\u003c/strong> is Speaking, Organisation (9Sor.02 is about summarising and making links in response to others). Together they make a sensible mini-unit: listen to a short mystery, discuss \"who must have done it?\", and reach a shared conclusion.","ar":"Part A explained how codes work, so here is only a planning example. A colleague writes \"9Ug.14, 9Ld.01, 9Sor.02\" in a Stage 9 unit plan. Without opening the framework you can say: all three are Stage 9; \u003cstrong>Ug\u003c/strong> is Use of English, grammatical forms (9Ug.14 is about past modal forms such as \u003cem>must have\u003c/em> and \u003cem>can't have\u003c/em> for speculation and deduction about the past); \u003cstrong>Ld\u003c/strong> is Listening for detail (9Ld.01 is about deducing meaning and understanding some implied meaning); \u003cstrong>Sor\u003c/strong> is Speaking, Organisation (9Sor.02 is about summarising and making links in response to others). Together they make a sensible mini-unit: listen to a short mystery, discuss \"who must have done it?\", and reach a shared conclusion."}},{"t":"callout","k":"tip","title":{"en":"Good practice: write the objective once, then as \"I can\"","ar":"Good practice: write the objective once, then as \"I can\""},"c":{"en":"The framework frames objectives as \"can-do\" statements about what learners should be able to do in English. In your plan, copy the code and then turn it into a pupil-friendly sentence, for example 8Sc.01 becomes \"I can tell a story and add details and examples.\" This is good practice, not a Cambridge requirement, but it keeps lessons focused and makes checking easy.","ar":"The framework frames objectives as \"can-do\" statements about what learners should be able to do in English. In your plan, copy the code and then turn it into a pupil-friendly sentence, for example 8Sc.01 becomes \"I can tell a story and add details and examples.\" This is good practice, not a Cambridge requirement, but it keeps lessons focused and makes checking easy."}},{"t":"h","c":{"en":"Teaching-time guidance","ar":"Teaching-time guidance"}},{"t":"p","c":{"en":"The framework says: \"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cem>for guidance\u003c/em> and \u003cem>may vary\u003c/em>. It is not a rule. A quick calculation shows where the figures come from (this arithmetic is ours, not the framework's): 4 hours a week over about 30 teaching weeks is 120 hours, and 5 hours a week over 30 weeks is 150 hours.","ar":"The framework says: \"For guidance, this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the words \u003cem>for guidance\u003c/em> and \u003cem>may vary\u003c/em>. It is not a rule. A quick calculation shows where the figures come from (this arithmetic is ours, not the framework's): 4 hours a week over about 30 teaching weeks is 120 hours, and 5 hours a week over 30 weeks is 150 hours."}},{"t":"p","c":{"en":"Compare your own timetable with this guidance. PEPS runs a four-day school week, Monday to Thursday, so the number of ESL lessons per week is a question for your HOD and timetable, not for this CPD. If the time is lower than the guidance, you cannot teach fewer objectives without a decision: you will need to plan carefully, combine objectives in integrated tasks and talk to your HOD about priorities.","ar":"Compare your own timetable with this guidance. PEPS runs a four-day school week, Monday to Thursday, so the number of ESL lessons per week is a question for your HOD and timetable, not for this CPD. If the time is lower than the guidance, you cannot teach fewer objectives without a decision: you will need to plan carefully, combine objectives in integrated tasks and talk to your HOD about priorities."}},{"t":"scenario","title":{"en":"Scenario: the folder arrives","ar":"Scenario: the folder arrives"},"c":{"en":"A new Year 7 teacher is given the Stage 7 scheme of work and says, \"I must follow every activity exactly, in order, or the school will be out of line with Cambridge.\" What would you advise? The best response: the framework says the scheme of work is optional support. The teacher is responsible for teaching and checking \u003cem>all the Stage 7 learning objectives\u003c/em>. She may use the suggested activities, adapt them or replace them with activities of similar difficulty, and she should add more activities because the scheme is not designed to fill all the teaching time. A useful first step is to list the Stage 7 objective codes and tick where each one is taught.","ar":"A new Year 7 teacher is given the Stage 7 scheme of work and says, \"I must follow every activity exactly, in order, or the school will be out of line with Cambridge.\" What would you advise? The best response: the framework says the scheme of work is optional support. The teacher is responsible for teaching and checking \u003cem>all the Stage 7 learning objectives\u003c/em>. She may use the suggested activities, adapt them or replace them with activities of similar difficulty, and she should add more activities because the scheme is not designed to fill all the teaching time. A useful first step is to list the Stage 7 objective codes and tick where each one is taught."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Plan at long, medium and short term. The objectives are the standard; the schemes of work and teacher guide are support. Every unit and lesson should give practice in all four skills and focus on at least one Use of English objective. Teaching-time guidance is 4 to 5 hours per week, about 120 to 150 hours per stage, and may vary with your context.","ar":"Plan at long, medium and short term. The objectives are the standard; the schemes of work and teacher guide are support. Every unit and lesson should give practice in all four skills and focus on at least one Use of English objective. Teaching-time guidance is 4 to 5 hours per week, about 120 to 150 hours per stage, and may vary with your context."}}],"checks":[{"id":"m1q1","q":{"en":"According to the framework, what does the scheme of work for each stage contain?","ar":"According to the framework, what does the scheme of work for each stage contain?"},"opts":[{"en":"Suggested units, at least one suggested activity for each objective, and sample lesson plans","ar":"Suggested units, at least one suggested activity for each objective, and sample lesson plans"},{"en":"A compulsory weekly timetable, a list of required textbooks, and one end-of-unit test for every unit","ar":"A compulsory weekly timetable, a list of required textbooks, and one end-of-unit test for every unit"},{"en":"A fixed list of topics, a compulsory activity for each objective and a set of marking grids","ar":"A fixed list of topics, a compulsory activity for each objective and a set of marking grids"},{"en":"The full wording of every objective, the Checkpoint papers and an answer key for each stage","ar":"The full wording of every objective, the Checkpoint papers and an answer key for each stage"}],"correct":0,"expl":{"en":"The framework's overview of teaching approaches lists three contents: suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans.","ar":"The framework's overview of teaching approaches lists three contents: suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans."}},{"id":"m1q2","q":{"en":"A Year 8 teacher says the Stage 8 scheme of work must be followed exactly. What does the framework say?","ar":"A Year 8 teacher says the Stage 8 scheme of work must be followed exactly. What does the framework say?"},"opts":[{"en":"The scheme of work replaces the learning objectives and must be taught in full each year","ar":"The scheme of work replaces the learning objectives and must be taught in full each year"},{"en":"Teachers do not need to use the ideas in the schemes of work to teach the curriculum","ar":"Teachers do not need to use the ideas in the schemes of work to teach the curriculum"},{"en":"Schemes of work are compulsory in schools that enter learners for the Checkpoint tests","ar":"Schemes of work are compulsory in schools that enter learners for the Checkpoint tests"},{"en":"Only the sample lesson plans are optional, and the suggested units must be followed","ar":"Only the sample lesson plans are optional, and the suggested units must be followed"}],"correct":1,"expl":{"en":"The framework states that you do not need to use the ideas in the schemes of work. They indicate types of activity and the intended depth and breadth of each objective.","ar":"The framework states that you do not need to use the ideas in the schemes of work. They indicate types of activity and the intended depth and breadth of each objective."}},{"id":"m1q3","q":{"en":"What does the framework say about the teaching time on which the curriculum is based?","ar":"What does the framework say about the teaching time on which the curriculum is based?"},"opts":[{"en":"3 to 4 hours per week, or about 90 to 120 hours per stage, and it must not vary","ar":"3 to 4 hours per week, or about 90 to 120 hours per stage, and it must not vary"},{"en":"5 to 6 hours per week, or about 150 to 180 hours per stage, with no variation","ar":"5 to 6 hours per week, or about 150 to 180 hours per stage, with no variation"},{"en":"4 to 5 hours per week, or about 120 to 150 hours per stage, and it may vary by context","ar":"4 to 5 hours per week, or about 120 to 150 hours per stage, and it may vary by context"},{"en":"4 to 5 hours per week, or about 200 to 250 hours per stage, depending on the school and its timetable","ar":"4 to 5 hours per week, or about 200 to 250 hours per stage, depending on the school and its timetable"}],"correct":2,"expl":{"en":"The framework gives this as guidance and says actual teaching hours may vary according to context.","ar":"The framework gives this as guidance and says actual teaching hours may vary according to context."}}]},{"id":"m2","title":{"en":"Teaching Approaches in the Framework","ar":"Teaching Approaches in the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework has a short section called \"Overview of teaching approaches\". It is only about a page long, but it contains the main ideas that should shape your classroom. In this module we read it closely, add the relevant ideas from other parts of the framework and its glossary, and turn them into practical teaching habits. Where we add ideas that are not in the framework, we label them as good practice.","ar":"The framework has a short section called \"Overview of teaching approaches\". It is only about a page long, but it contains the main ideas that should shape your classroom. In this module we read it closely, add the relevant ideas from other parts of the framework and its glossary, and turn them into practical teaching habits. Where we add ideas that are not in the framework, we label them as good practice."}},{"t":"h","c":{"en":"The integrated approach","ar":"The integrated approach"}},{"t":"p","c":{"en":"The framework says: \"It is expected that teachers will adopt an integrated approach to planning and teaching English as a Second Language.\" This means that each lesson and unit should give practice in reading, writing, listening and speaking, with a focus on one or more Use of English objectives. The Use of English strand provides the linguistic features that learners need to engage with language \u003cem>receptively\u003c/em> (Reading and Listening) and \u003cem>productively\u003c/em> (Writing and Speaking).","ar":"The framework says: \"It is expected that teachers will adopt an integrated approach to planning and teaching English as a Second Language.\" This means that each lesson and unit should give practice in reading, writing, listening and speaking, with a focus on one or more Use of English objectives. The Use of English strand provides the linguistic features that learners need to engage with language \u003cem>receptively\u003c/em> (Reading and Listening) and \u003cem>productively\u003c/em> (Writing and Speaking)."}},{"t":"p","c":{"en":"The framework lists six benefits of integrating Use of English and the four skills. The table shows each benefit with what it can look like in a Year 7 to 9 classroom. The right-hand column is our interpretation, not framework text.","ar":"The framework lists six benefits of integrating Use of English and the four skills. The table shows each benefit with what it can look like in a Year 7 to 9 classroom. The right-hand column is our interpretation, not framework text."}},{"t":"table","head":{"en":["Framework benefit (paraphrased)","What it can look like in Years 7 to 9"],"ar":["Framework benefit (paraphrased)","What it can look like in Years 7 to 9"]},"rows":[{"en":["Enhances all-round development of communicative competence","Learners do not only complete grammar gap-fills. They also read, listen, talk and write using the same language in one lesson."],"ar":["Enhances all-round development of communicative competence","Learners do not only complete grammar gap-fills. They also read, listen, talk and write using the same language in one lesson."]},{"en":["Lets teachers build a lesson around a theme or topic relevant to learners","A Year 9 unit on \"social media and privacy\" supplies a reading text, a listening clip, a discussion and a short argument essay."],"ar":["Lets teachers build a lesson around a theme or topic relevant to learners","A Year 9 unit on \"social media and privacy\" supplies a reading text, a listening clip, a discussion and a short argument essay."]},{"en":["Motivates learners by building more variety into the lesson","A 50-minute lesson moves between whole-class input, pair talk, individual reading and a short writing task, rather than one long exercise."],"ar":["Motivates learners by building more variety into the lesson","A 50-minute lesson moves between whole-class input, pair talk, individual reading and a short writing task, rather than one long exercise."]},{"en":["Works at the level of realistic communication, where tasks involve more than one skill","Learners listen to a phone message and write a reply; or read an email, discuss it with a partner and then respond."],"ar":["Works at the level of realistic communication, where tasks involve more than one skill","Learners listen to a phone message and write a reply; or read an email, discuss it with a partner and then respond."]},{"en":["Exposes learners to authentic language","Learners meet a real short article, a speech extract or a recorded interview, with support, not only graded textbook texts."],"ar":["Exposes learners to authentic language","Learners meet a real short article, a speech extract or a recorded interview, with support, not only graded textbook texts."]},{"en":["Challenges learners to interact naturally","Pair and group tasks have a real reason to talk: an information gap, a decision to reach or a problem to solve."],"ar":["Challenges learners to interact naturally","Pair and group tasks have a real reason to talk: an information gap, a decision to reach or a problem to solve."]}]},{"t":"h","c":{"en":"A framework example: one objective, many skills","ar":"A framework example: one objective, many skills"}},{"t":"p","c":{"en":"The framework gives its own example. At Stage 7, the objective \u003cstrong>7Sor.02\u003c/strong> asks learners to summarise and make some links in their response to what others say, with support, in an increasing range of exchanges to achieve a shared outcome. The framework says this objective \"draws on listening and speaking skills and on different language features\", including reported speech forms for statements and questions and connectives to express reasons and give explanations.","ar":"The framework gives its own example. At Stage 7, the objective \u003cstrong>7Sor.02\u003c/strong> asks learners to summarise and make some links in their response to what others say, with support, in an increasing range of exchanges to achieve a shared outcome. The framework says this objective \"draws on listening and speaking skills and on different language features\", including reported speech forms for statements and questions and connectives to express reasons and give explanations."}},{"t":"p","c":{"en":"Think what this means in a lesson. Two learners plan a class poster. Partner A says, \"I think we should use photos because they attract attention.\" Partner B listens, then says, \"So you said we should use photos because they attract attention, but I'd like to add a short title.\" Listening (to understand A), speaking (to respond), reported speech (\"you said we should...\") and connectives of reason (\"because\") are all used in one natural exchange. This one small task serves 7Sor.02, 7Ug.10 (reported speech) and 7Us.03 (connectives to explain reasons).","ar":"Think what this means in a lesson. Two learners plan a class poster. Partner A says, \"I think we should use photos because they attract attention.\" Partner B listens, then says, \"So you said we should use photos because they attract attention, but I'd like to add a short title.\" Listening (to understand A), speaking (to respond), reported speech (\"you said we should...\") and connectives of reason (\"because\") are all used in one natural exchange. This one small task serves 7Sor.02, 7Ug.10 (reported speech) and 7Us.03 (connectives to explain reasons)."}},{"t":"h","c":{"en":"Active learning and \"thinking hard\"","ar":"Active learning and \"thinking hard\""}},{"t":"p","c":{"en":"The glossary defines active learning as \"a classroom approach in which learners are encouraged to 'think hard', rather than passively receive information.\" The framework also says the can-do form of the objectives \"encourages teachers to use learning-centred, activity-based approaches.\"","ar":"The glossary defines active learning as \"a classroom approach in which learners are encouraged to 'think hard', rather than passively receive information.\" The framework also says the can-do form of the objectives \"encourages teachers to use learning-centred, activity-based approaches.\""}},{"t":"p","c":{"en":"In a language class, thinking hard is not silence or long explanation. It means learners do something with language: sort words, guess a meaning from context, decide which sentence is true, correct a wrong sentence, or choose the best question to ask. The glossary uses the word \u003cem>explore\u003c/em> in the same way: \"to investigate, look for patterns and discuss examples\". Objective 7Rd.04 uses it directly (\"Explore idiomatic phrases and their meanings\"), so the framework itself expects investigation, not only memorising.","ar":"In a language class, thinking hard is not silence or long explanation. It means learners do something with language: sort words, guess a meaning from context, decide which sentence is true, correct a wrong sentence, or choose the best question to ask. The glossary uses the word \u003cem>explore\u003c/em> in the same way: \"to investigate, look for patterns and discuss examples\". Objective 7Rd.04 uses it directly (\"Explore idiomatic phrases and their meanings\"), so the framework itself expects investigation, not only memorising."}},{"t":"callout","k":"tip","title":{"en":"Good practice: the \"notice, then name\" sequence","ar":"Good practice: the \"notice, then name\" sequence"},"c":{"en":"Give learners six example sentences containing the target structure, for example past modal forms in Stage 9. Ask pairs to underline the structure and say what the pattern is. Only then name the rule. This is good practice that fits the glossary's meaning of \u003cem>explore\u003c/em> and \u003cem>identify\u003c/em> (to locate features in a text). It is not a Cambridge requirement.","ar":"Give learners six example sentences containing the target structure, for example past modal forms in Stage 9. Ask pairs to underline the structure and say what the pattern is. Only then name the rule. This is good practice that fits the glossary's meaning of \u003cem>explore\u003c/em> and \u003cem>identify\u003c/em> (to locate features in a text). It is not a Cambridge requirement."}},{"t":"h","c":{"en":"Authentic language","ar":"Authentic language"}},{"t":"p","c":{"en":"The glossary defines authentic language as \"written or spoken language used in real situations\", and says it \"may be contrasted with graded teaching material\". The framework says the integrated approach \"exposes learners to authentic language\". This does not mean that learners must struggle alone with difficult texts. Good practice is to choose or adapt a real text, pre-teach a few key words, set a clear purpose for reading or listening and let learners meet the text more than once.","ar":"The glossary defines authentic language as \"written or spoken language used in real situations\", and says it \"may be contrasted with graded teaching material\". The framework says the integrated approach \"exposes learners to authentic language\". This does not mean that learners must struggle alone with difficult texts. Good practice is to choose or adapt a real text, pre-teach a few key words, set a clear purpose for reading or listening and let learners meet the text more than once."}},{"t":"callout","k":"warn","title":{"en":"A common misunderstanding: authentic means no help","ar":"A common misunderstanding: authentic means no help"},"c":{"en":"Some teachers think \"authentic\" means \"no support\". But the learning objectives themselves say when support is expected. For example 7Rd.02 says \"with support\" for understanding the detail of an argument, while 9Rd.02 has no support wording. Authentic texts and careful support work together, and support is reduced across the stages, not removed on day one.","ar":"Some teachers think \"authentic\" means \"no support\". But the learning objectives themselves say when support is expected. For example 7Rd.02 says \"with support\" for understanding the detail of an argument, while 9Rd.02 has no support wording. Authentic texts and careful support work together, and support is reduced across the stages, not removed on day one."}},{"t":"h","c":{"en":"The Cambridge learner attributes in an ESL classroom","ar":"The Cambridge learner attributes in an ESL classroom"}},{"t":"p","c":{"en":"The framework says Cambridge Lower Secondary ESL supports learners to become responsible, innovative, confident, engaged and reflective. The descriptions are written for language learning, so they also work as teaching approaches.","ar":"The framework says Cambridge Lower Secondary ESL supports learners to become responsible, innovative, confident, engaged and reflective. The descriptions are written for language learning, so they also work as teaching approaches."}},{"t":"table","head":{"en":["Attribute","Framework description (short)","Teaching habit this suggests (good practice)"],"ar":["Attribute","Framework description (short)","Teaching habit this suggests (good practice)"]},"rows":[{"en":["Responsible","Learners take responsibility, ask questions and look for chances to use their language","Give learners a \"language challenge\" outside the lesson, such as using three new phrases with a friend or in another subject."],"ar":["Responsible","Learners take responsibility, ask questions and look for chances to use their language","Give learners a \"language challenge\" outside the lesson, such as using three new phrases with a friend or in another subject."]},{"en":["Innovative","Learners explore and experiment with new language, making connections to their own language","Invite learners to compare a structure in English with their home language, and to try new phrases in a safe task."],"ar":["Innovative","Learners explore and experiment with new language, making connections to their own language","Invite learners to compare a structure in English with their home language, and to try new phrases in a safe task."]},{"en":["Confident","Learners feel empowered to take risks, try new language and learn from mistakes","Praise attempts. Correct selectively, and keep a \"useful mistakes\" board that does not name learners."],"ar":["Confident","Learners feel empowered to take risks, try new language and learn from mistakes","Praise attempts. Correct selectively, and keep a \"useful mistakes\" board that does not name learners."]},{"en":["Engaged","Learners are curious about other languages, cultures and perspectives","Choose topics with different cultural views and let learners bring their own experience."],"ar":["Engaged","Learners are curious about other languages, cultures and perspectives","Choose topics with different cultural views and let learners bring their own experience."]},{"en":["Reflective","Learners plan, monitor and evaluate their learning and think about strategies used before","End lessons with \"What helped me today?\" and let learners choose a strategy for the next task."],"ar":["Reflective","Learners plan, monitor and evaluate their learning and think about strategies used before","End lessons with \"What helped me today?\" and let learners choose a strategy for the next task."]}]},{"t":"h","c":{"en":"Revisiting language at deeper levels","ar":"Revisiting language at deeper levels"}},{"t":"p","c":{"en":"The framework says that \"throughout the curriculum, learners revisit and engage with language at deeper levels and in different contexts.\" You can see this in the objectives. Past simple appears at all three stages, but the wording grows: 7Ug.03 asks for \"a range of past simple active forms and an increasing range of passive forms\", 8Ug.03 for \"a wide range\" of active forms and \"a range of passive forms\", and 9Ug.02 for \"a wide range\" of both. A Stage 9 teacher should therefore not treat the past simple as finished. A quick starter that uses the past simple in passive sentences (\"The window was broken by...\") brings it back at a deeper level before the lesson's new structure.","ar":"The framework says that \"throughout the curriculum, learners revisit and engage with language at deeper levels and in different contexts.\" You can see this in the objectives. Past simple appears at all three stages, but the wording grows: 7Ug.03 asks for \"a range of past simple active forms and an increasing range of passive forms\", 8Ug.03 for \"a wide range\" of active forms and \"a range of passive forms\", and 9Ug.02 for \"a wide range\" of both. A Stage 9 teacher should therefore not treat the past simple as finished. A quick starter that uses the past simple in passive sentences (\"The window was broken by...\") brings it back at a deeper level before the lesson's new structure."}},{"t":"scenario","title":{"en":"Scenario: the grammar week","ar":"Scenario: the grammar week"},"c":{"en":"A Year 8 teacher organises her term like this: Week 1, present perfect worksheets; Week 2, a reading comprehension; Week 3, a writing task; Week 4, listening practice. Learners cope but the teacher notices they do not use the present perfect when they speak or write freely. What approach does the framework suggest instead? An integrated unit: choose a theme such as \"Things I have done\", read a short text that contains present perfect forms (8Ug.06), listen to a short interview, ask and answer in pairs, and write a short paragraph, so that the same language is met and used in all four skills within a few days. She can still do a focused grammar practice, but inside the sequence, not instead of it.","ar":"A Year 8 teacher organises her term like this: Week 1, present perfect worksheets; Week 2, a reading comprehension; Week 3, a writing task; Week 4, listening practice. Learners cope but the teacher notices they do not use the present perfect when they speak or write freely. What approach does the framework suggest instead? An integrated unit: choose a theme such as \"Things I have done\", read a short text that contains present perfect forms (8Ug.06), listen to a short interview, ask and answer in pairs, and write a short paragraph, so that the same language is met and used in all four skills within a few days. She can still do a focused grammar practice, but inside the sequence, not instead of it."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"The framework expects an integrated approach: all four skills in each lesson and unit, with at least one Use of English focus. It values active, activity-based learning, authentic language with appropriate support, and the revisiting of language at deeper levels. The ideas in the learner-attribute and \"good practice\" boxes are suggestions that fit these principles; they are not Cambridge requirements.","ar":"The framework expects an integrated approach: all four skills in each lesson and unit, with at least one Use of English focus. It values active, activity-based learning, authentic language with appropriate support, and the revisiting of language at deeper levels. The ideas in the learner-attribute and \"good practice\" boxes are suggestions that fit these principles; they are not Cambridge requirements."}}],"checks":[{"id":"m2q1","q":{"en":"Which sentence best summarises the integrated approach in the framework?","ar":"Which sentence best summarises the integrated approach in the framework?"},"opts":[{"en":"Each week is divided into one skills day for each skill and one grammar day for Use of English","ar":"Each week is divided into one skills day for each skill and one grammar day for Use of English"},{"en":"Each lesson teaches one skill only, and Use of English is taught in a separate annual unit","ar":"Each lesson teaches one skill only, and Use of English is taught in a separate annual unit"},{"en":"Each unit uses the four skills but Use of English is taught only in Stage 7 and Stage 8","ar":"Each unit uses the four skills but Use of English is taught only in Stage 7 and Stage 8"},{"en":"Each lesson and unit gives practice in the four skills and focuses on Use of English objectives","ar":"Each lesson and unit gives practice in the four skills and focuses on Use of English objectives"}],"correct":3,"expl":{"en":"The framework says each lesson and unit should provide opportunities to practise all four skills and focus on one or more Use of English objectives.","ar":"The framework says each lesson and unit should provide opportunities to practise all four skills and focus on one or more Use of English objectives."}},{"id":"m2q2","q":{"en":"The framework uses 7Sor.02 as an example. What does it show?","ar":"The framework uses 7Sor.02 as an example. What does it show?"},"opts":[{"en":"One objective can draw on listening, speaking and several language features such as reported speech","ar":"One objective can draw on listening, speaking and several language features such as reported speech"},{"en":"A speaking objective should be taught and assessed without any link to listening or grammar","ar":"A speaking objective should be taught and assessed without any link to listening or grammar"},{"en":"Reported speech belongs only in the Writing strand and should not be used in talk","ar":"Reported speech belongs only in the Writing strand and should not be used in talk"},{"en":"Connectives of reason should be taught in Stage 9 only, after reported speech","ar":"Connectives of reason should be taught in Stage 9 only, after reported speech"}],"correct":0,"expl":{"en":"The framework says 7Sor.02 draws on listening and speaking skills and on language features, including reported speech and connectives of reason.","ar":"The framework says 7Sor.02 draws on listening and speaking skills and on language features, including reported speech and connectives of reason."}},{"id":"m2q3","q":{"en":"In the glossary, what does \"active learning\" mean?","ar":"In the glossary, what does \"active learning\" mean?"},"opts":[{"en":"A classroom approach in which learners move around the room and avoid reading or writing tasks","ar":"A classroom approach in which learners move around the room and avoid reading or writing tasks"},{"en":"A classroom approach in which learners are encouraged to think hard, not passively receive information","ar":"A classroom approach in which learners are encouraged to think hard, not passively receive information"},{"en":"A classroom approach in which the teacher explains each rule fully before learners practise it","ar":"A classroom approach in which the teacher explains each rule fully before learners practise it"},{"en":"A classroom approach in which learners complete only the activities from the scheme of work","ar":"A classroom approach in which learners complete only the activities from the scheme of work"}],"correct":1,"expl":{"en":"The glossary defines active learning as encouraging learners to 'think hard' rather than passively receive information.","ar":"The glossary defines active learning as encouraging learners to 'think hard' rather than passively receive information."}}]},{"id":"m3","title":{"en":"Planning an Integrated Lesson: Worked Examples for Stages 7 to 9","ar":"Planning an Integrated Lesson: Worked Examples for Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This module shows how to turn a handful of objectives into a coherent lesson. We give one worked example for each stage. All objective codes and wording are from the framework (paraphrased; check the framework for full wording). The lesson shapes, timings and tasks are \u003cstrong>good practice suggestions\u003c/strong>, not Cambridge requirements. We assume a lesson of about 50 minutes and a class of 25 to 30 learners; adjust to your own timetable.","ar":"This module shows how to turn a handful of objectives into a coherent lesson. We give one worked example for each stage. All objective codes and wording are from the framework (paraphrased; check the framework for full wording). The lesson shapes, timings and tasks are \u003cstrong>good practice suggestions\u003c/strong>, not Cambridge requirements. We assume a lesson of about 50 minutes and a class of 25 to 30 learners; adjust to your own timetable."}},{"t":"h","c":{"en":"A five-step planning routine (good practice)","ar":"A five-step planning routine (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Choose a theme\u003c/strong> that is relevant to your learners and gives you a real text to read or hear.","\u003cstrong>Select one or two focus objectives\u003c/strong>, including at least one from Use of English, and no more. The others in the lesson are \"supporting\" skills practised along the way.","\u003cstrong>Write the success statement\u003c/strong> in \"I can\" form, so that you and the learners know what to look for.","\u003cstrong>Sequence the tasks from receptive to productive\u003c/strong>: input (read or listen), notice the language, controlled practice, speaking, then writing.","\u003cstrong>Plan the check\u003c/strong>: decide in advance what you will listen for or collect, for example three sentences from every learner or one exit question."],"ar":["\u003cstrong>Choose a theme\u003c/strong> that is relevant to your learners and gives you a real text to read or hear.","\u003cstrong>Select one or two focus objectives\u003c/strong>, including at least one from Use of English, and no more. The others in the lesson are \"supporting\" skills practised along the way.","\u003cstrong>Write the success statement\u003c/strong> in \"I can\" form, so that you and the learners know what to look for.","\u003cstrong>Sequence the tasks from receptive to productive\u003c/strong>: input (read or listen), notice the language, controlled practice, speaking, then writing.","\u003cstrong>Plan the check\u003c/strong>: decide in advance what you will listen for or collect, for example three sentences from every learner or one exit question."]}},{"t":"callout","k":"warn","title":{"en":"Too many objectives","ar":"Too many objectives"},"c":{"en":"A lesson with six or eight objectives cannot be taught or checked well. The framework says you should include objectives from more than one strand, not as many as possible. In a 50-minute lesson, one or two focus objectives, plus a few supporting ones, is realistic.","ar":"A lesson with six or eight objectives cannot be taught or checked well. The framework says you should include objectives from more than one strand, not as many as possible. In a 50-minute lesson, one or two focus objectives, plus a few supporting ones, is realistic."}},{"t":"h","c":{"en":"Worked example 1: Stage 7, \"Describing a person who inspires me\"","ar":"Worked example 1: Stage 7, \"Describing a person who inspires me\""}},{"t":"table","head":{"en":["Objective code","What it asks (paraphrased)","Role in the lesson"],"ar":["Objective code","What it asks (paraphrased)","Role in the lesson"]},"rows":[{"en":["7Rm.01","Understand most of the main points of short and extended texts, with little or no support","Supporting: learners read a short profile of a young athlete and decide the main idea."],"ar":["7Rm.01","Understand most of the main points of short and extended texts, with little or no support","Supporting: learners read a short profile of a young athlete and decide the main idea."]},{"en":["7Ld.02","Understand most specific information and detail of talk, with little or no support","Supporting: learners listen to a student describe a relative and note three details."],"ar":["7Ld.02","Understand most specific information and detail of talk, with little or no support","Supporting: learners listen to a student describe a relative and note three details."]},{"en":["7Sc.01","Describe people, places and objects, and past and present actions","Focus: learners describe a person who inspires them to a partner."],"ar":["7Sc.01","Describe people, places and objects, and past and present actions","Focus: learners describe a person who inspires them to a partner."]},{"en":["7Wc.01","Write, with little or no support, short texts that describe people","Focus: learners write a short description of 80 to 100 words."],"ar":["7Wc.01","Write, with little or no support, short texts that describe people","Focus: learners write a short description of 80 to 100 words."]},{"en":["7Ug.12","Use participle adjectives, compound adjectives and comparative structures","Focus: Use of English, e.g. \u003cem>inspiring, well-known, not as tall as\u003c/em>."],"ar":["7Ug.12","Use participle adjectives, compound adjectives and comparative structures","Focus: Use of English, e.g. \u003cem>inspiring, well-known, not as tall as\u003c/em>."]}]},{"t":"p","c":{"en":"\u003cstrong>Success statement:\u003c/strong> \"I can describe a person using interesting adjectives and give two reasons why I admire them.\"","ar":"\u003cstrong>Success statement:\u003c/strong> \"I can describe a person using interesting adjectives and give two reasons why I admire them.\""}},{"t":"table","head":{"en":["Time","Activity","Skill"],"ar":["Time","Activity","Skill"]},"rows":[{"en":["0 to 8 min","Starter: show three photos of well-known people. Learners guess who they are from the teacher's description, then say which adjectives helped.","Listening and speaking"],"ar":["0 to 8 min","Starter: show three photos of well-known people. Learners guess who they are from the teacher's description, then say which adjectives helped.","Listening and speaking"]},{"en":["8 to 18 min","Read a short profile. Learners find the main idea, then underline adjectives. Pairs sort them: \u003cem>-ing\u003c/em> adjectives (\u003cem>inspiring\u003c/em>), \u003cem>-ed\u003c/em> adjectives (\u003cem>amazed\u003c/em>) and compound adjectives (\u003cem>well-known\u003c/em>).","Reading and Use of English"],"ar":["8 to 18 min","Read a short profile. Learners find the main idea, then underline adjectives. Pairs sort them: \u003cem>-ing\u003c/em> adjectives (\u003cem>inspiring\u003c/em>), \u003cem>-ed\u003c/em> adjectives (\u003cem>amazed\u003c/em>) and compound adjectives (\u003cem>well-known\u003c/em>).","Reading and Use of English"]},{"en":["18 to 28 min","Controlled practice: complete a short gap-fill with participle adjectives, then correct three wrong sentences (\u003cem>I am boring\u003c/em> vs \u003cem>I am bored\u003c/em>).","Use of English"],"ar":["18 to 28 min","Controlled practice: complete a short gap-fill with participle adjectives, then correct three wrong sentences (\u003cem>I am boring\u003c/em> vs \u003cem>I am bored\u003c/em>).","Use of English"]},{"en":["28 to 38 min","Speaking: describe your person to a partner. Partner asks two questions and reports back to the class in one sentence.","Speaking and listening"],"ar":["28 to 38 min","Speaking: describe your person to a partner. Partner asks two questions and reports back to the class in one sentence.","Speaking and listening"]},{"en":["38 to 48 min","Writing: write 80 to 100 words using a model paragraph and at least three target adjectives.","Writing"],"ar":["38 to 48 min","Writing: write 80 to 100 words using a model paragraph and at least three target adjectives.","Writing"]},{"en":["48 to 50 min","Check: each learner reads one sentence aloud or hands in the best sentence.","All"],"ar":["48 to 50 min","Check: each learner reads one sentence aloud or hands in the best sentence.","All"]}]},{"t":"h","c":{"en":"Worked example 2: Stage 8, \"Should phones be allowed in class?\"","ar":"Worked example 2: Stage 8, \"Should phones be allowed in class?\""}},{"t":"table","head":{"en":["Objective code","What it asks (paraphrased)","Role in the lesson"],"ar":["Objective code","What it asks (paraphrased)","Role in the lesson"]},"rows":[{"en":["8Ro.01","Recognise the opinions of the writer(s) in texts","Supporting: learners identify opinions in two short letters to a school newspaper."],"ar":["8Ro.01","Recognise the opinions of the writer(s) in texts","Supporting: learners identify opinions in two short letters to a school newspaper."]},{"en":["8Lo.01","Recognise the opinions of the speaker(s) in talk","Supporting: learners listen to two students and note each opinion."],"ar":["8Lo.01","Recognise the opinions of the speaker(s) in talk","Supporting: learners listen to two students and note each opinion."]},{"en":["8So.01","Express opinions and justify points of view, with little or no support","Focus: group discussion."],"ar":["8So.01","Express opinions and justify points of view, with little or no support","Focus: group discussion."]},{"en":["8Wc.02","Express opinions and develop coherent arguments with reasons, examples and evidence","Focus: a short argument paragraph."],"ar":["8Wc.02","Express opinions and develop coherent arguments with reasons, examples and evidence","Focus: a short argument paragraph."]},{"en":["8Us.02","Use connectives to indicate purpose and to contrast (\u003cem>although, while, however\u003c/em>)","Focus: Use of English for the argument."],"ar":["8Us.02","Use connectives to indicate purpose and to contrast (\u003cem>although, while, however\u003c/em>)","Focus: Use of English for the argument."]}]},{"t":"p","c":{"en":"\u003cstrong>Success statement:\u003c/strong> \"I can give my opinion, give a reason and an example, and show a different view using \u003cem>although\u003c/em> or \u003cem>however\u003c/em>.\"","ar":"\u003cstrong>Success statement:\u003c/strong> \"I can give my opinion, give a reason and an example, and show a different view using \u003cem>although\u003c/em> or \u003cem>however\u003c/em>.\""}},{"t":"p","c":{"en":"\u003cstrong>Sequence in brief:\u003c/strong> read two letters and underline opinion words (\u003cem>I believe, in my view\u003c/em>); listen to two students and match opinions to speakers; give learners sentence starters with \u003cem>although\u003c/em> and \u003cem>however\u003c/em>; hold a four-person discussion in which one learner is the \"summariser\"; then each learner writes a paragraph with an opinion, a reason, an example and one contrast. The summariser role also touches 8Sor.02 (summarise and make links in response to others), a good example of an objective that is practised without being the main focus.","ar":"\u003cstrong>Sequence in brief:\u003c/strong> read two letters and underline opinion words (\u003cem>I believe, in my view\u003c/em>); listen to two students and match opinions to speakers; give learners sentence starters with \u003cem>although\u003c/em> and \u003cem>however\u003c/em>; hold a four-person discussion in which one learner is the \"summariser\"; then each learner writes a paragraph with an opinion, a reason, an example and one contrast. The summariser role also touches 8Sor.02 (summarise and make links in response to others), a good example of an objective that is practised without being the main focus."}},{"t":"h","c":{"en":"Worked example 3: Stage 9, \"Who must have done it?\"","ar":"Worked example 3: Stage 9, \"Who must have done it?\""}},{"t":"table","head":{"en":["Objective code","What it asks (paraphrased)","Role in the lesson"],"ar":["Objective code","What it asks (paraphrased)","Role in the lesson"]},"rows":[{"en":["9Ld.01","Deduce meaning from context and understand some implied meaning, with little or no support","Supporting: learners listen to a short mystery and infer what is not said directly."],"ar":["9Ld.01","Deduce meaning from context and understand some implied meaning, with little or no support","Supporting: learners listen to a short mystery and infer what is not said directly."]},{"en":["9Ug.14","Use an increasing range of past modal forms for speculation and deduction about the past","Focus: Use of English, \u003cem>must have, can't have, might have\u003c/em>."],"ar":["9Ug.14","Use an increasing range of past modal forms for speculation and deduction about the past","Focus: Use of English, \u003cem>must have, can't have, might have\u003c/em>."]},{"en":["9Sor.02","Summarise and make links in response to what others say, with little or no support, to achieve a shared outcome","Focus: groups agree on one explanation."],"ar":["9Sor.02","Summarise and make links in response to what others say, with little or no support, to achieve a shared outcome","Focus: groups agree on one explanation."]},{"en":["9Sc.04","Begin to produce stretches of language with some fluency and spontaneity","Supporting: discussion without notes."],"ar":["9Sc.04","Begin to produce stretches of language with some fluency and spontaneity","Supporting: discussion without notes."]},{"en":["9Wc.01","Write extended texts which describe actions and events in detail","Focus: a short written report of the group's conclusion."],"ar":["9Wc.01","Write extended texts which describe actions and events in detail","Focus: a short written report of the group's conclusion."]}]},{"t":"p","c":{"en":"\u003cstrong>Success statement:\u003c/strong> \"I can use \u003cem>must have\u003c/em>, \u003cem>can't have\u003c/em> and \u003cem>might have\u003c/em> to explain what probably happened, and agree one conclusion with my group.\"","ar":"\u003cstrong>Success statement:\u003c/strong> \"I can use \u003cem>must have\u003c/em>, \u003cem>can't have\u003c/em> and \u003cem>might have\u003c/em> to explain what probably happened, and agree one conclusion with my group.\""}},{"t":"p","c":{"en":"\u003cstrong>Sequence in brief:\u003c/strong> play a two-minute recording of a short mystery (a missing trophy) twice; learners note clues; the teacher writes three sentences on the board using the three modal forms and learners decide which clue goes with each; groups of four use a clue card set to decide \"who must have taken it?\" using the forms; they then write a five-sentence police report. Learners at different levels can receive different clue cards (see Module 5).","ar":"\u003cstrong>Sequence in brief:\u003c/strong> play a two-minute recording of a short mystery (a missing trophy) twice; learners note clues; the teacher writes three sentences on the board using the three modal forms and learners decide which clue goes with each; groups of four use a clue card set to decide \"who must have taken it?\" using the forms; they then write a five-sentence police report. Learners at different levels can receive different clue cards (see Module 5)."}},{"t":"callout","k":"tip","title":{"en":"Good practice: the same pattern, three stages","ar":"Good practice: the same pattern, three stages"},"c":{"en":"Look at the three examples together. All have a real or realistic input, a visible language focus, a speaking task with a purpose and a written product. What changes across the stages is the difficulty of the language and the amount of support (compare 7Wc.01 with 9Wc.01), not the shape of a good lesson.","ar":"Look at the three examples together. All have a real or realistic input, a visible language focus, a speaking task with a purpose and a written product. What changes across the stages is the difficulty of the language and the amount of support (compare 7Wc.01 with 9Wc.01), not the shape of a good lesson."}},{"t":"scenario","title":{"en":"Scenario: improving a planned lesson","ar":"Scenario: improving a planned lesson"},"c":{"en":"A Stage 7 teacher plans a lesson on \"My weekend\". Her plan: (1) 20 minutes explaining the past simple with a table on the board; (2) 20 minutes of gap-fill exercises; (3) 10 minutes homework instructions. She says the lesson \"covers 7Ug.03\". What would you suggest? Keep the objective but change the shape: begin with a short text or audio about someone's weekend so learners meet the past simple in use; let pairs find and sort the verbs; do a shorter practice; then add a speaking task (\"Find someone who...\") and a short writing task using the same language. The learners would then practise listening, reading, speaking and writing in one lesson, which is what the integrated approach expects.","ar":"A Stage 7 teacher plans a lesson on \"My weekend\". Her plan: (1) 20 minutes explaining the past simple with a table on the board; (2) 20 minutes of gap-fill exercises; (3) 10 minutes homework instructions. She says the lesson \"covers 7Ug.03\". What would you suggest? Keep the objective but change the shape: begin with a short text or audio about someone's weekend so learners meet the past simple in use; let pairs find and sort the verbs; do a shorter practice; then add a speaking task (\"Find someone who...\") and a short writing task using the same language. The learners would then practise listening, reading, speaking and writing in one lesson, which is what the integrated approach expects."}},{"t":"h","c":{"en":"Reading a plan against the framework: a quick check","ar":"Reading a plan against the framework: a quick check"}},{"t":"p","c":{"en":"Before you finish a plan, ask: Are all four skills present? Is there at least one Use of English objective, and does it appear in more than one skill? Is each focus objective at the right stage (a Stage 7 class should not be taught from 9-codes unless you are deliberately stretching able learners)? Is there a way to see who has learned what by the end? If all four answers are yes, the plan is probably sound.","ar":"Before you finish a plan, ask: Are all four skills present? Is there at least one Use of English objective, and does it appear in more than one skill? Is each focus objective at the right stage (a Stage 7 class should not be taught from 9-codes unless you are deliberately stretching able learners)? Is there a way to see who has learned what by the end? If all four answers are yes, the plan is probably sound."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Choose a theme, pick one or two focus objectives (including Use of English), write an \"I can\" statement, sequence tasks from receptive to productive and plan the check. Stages 7, 8 and 9 use the same lesson shape; the framework's wording about support and range changes what learners can do.","ar":"Choose a theme, pick one or two focus objectives (including Use of English), write an \"I can\" statement, sequence tasks from receptive to productive and plan the check. Stages 7, 8 and 9 use the same lesson shape; the framework's wording about support and range changes what learners can do."}}],"checks":[{"id":"m3q1","q":{"en":"A teacher plans a Stage 8 lesson with 8R
