#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-maths-framework-a","code":"LMA","passMark":80,"hours":"2.5 hours","accent":"#1F6FB2","accentSoft":"#E3EEF9","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary Mathematics 0862 · Part A","ar":"Staff CPD · Cambridge Lower Secondary Mathematics 0862 · Part A"},"title":{"en":"Understanding the Cambridge Lower Secondary Mathematics Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Lower Secondary Mathematics Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for Lower Secondary mathematics teachers, HODs and new staff: why the framework exists, what it aims for, how it is organised, how to read a learning-objective code, what Thinking and Working Mathematically means, and how Number, Algebra, Geometry and Measure, and Statistics and Probability develop from Stage 7 to Stage 9.","ar":"A self-paced guide for Lower Secondary mathematics teachers, HODs and new staff: why the framework exists, what it aims for, how it is organised, how to read a learning-objective code, what Thinking and Working Mathematically means, and how Number, Algebra, Geometry and Measure, and Statistics and Probability develop from Stage 7 to Stage 9."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework (v3.0)","ar":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Please check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0 (first published September 2020 for first teaching in September 2021; latest version published August 2021). Please check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway and Support","ar":"Why This Framework? Purpose, Pathway and Support"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD helps you use the Cambridge Lower Secondary Mathematics 0862 Curriculum Framework as a working tool, not just a list of topics. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe its aims and the Cambridge learner attributes; read a learning-objective code such as 7Nf.01; use the eight Thinking and Working Mathematically characteristics; and trace how each strand of mathematics develops from Stage 7 to Stage 9. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> It is Part A of a two-part series; see Part B for the rest of the series.","ar":"This CPD helps you use the Cambridge Lower Secondary Mathematics 0862 Curriculum Framework as a working tool, not just a list of topics. By the end you will be able to: explain why the framework exists and what support Cambridge offers around it; describe its aims and the Cambridge learner attributes; read a learning-objective code such as 7Nf.01; use the eight Thinking and Working Mathematically characteristics; and trace how each strand of mathematics develops from Stage 7 to Stage 9. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> It is Part A of a two-part series; see Part B for the rest of the series."}},{"t":"p","c":{"en":"At PEPS, Years 7, 8 and 9 follow Cambridge Lower Secondary Mathematics 0862. Year 7 is Stage 7, Year 8 is Stage 8 and Year 9 is Stage 9. The official description of the programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It states what learners should know, understand and be able to do in mathematics at each stage. It is not a lesson plan, and it does not say which textbook to use. It sets the target. You and your colleagues plan the route.","ar":"At PEPS, Years 7, 8 and 9 follow Cambridge Lower Secondary Mathematics 0862. Year 7 is Stage 7, Year 8 is Stage 8 and Year 9 is Stage 9. The official description of the programme is the \u003cstrong>Curriculum Framework\u003c/strong>. It states what learners should know, understand and be able to do in mathematics at each stage. It is not a lesson plan, and it does not say which textbook to use. It sets the target. You and your colleagues plan the route."}},{"t":"p","c":{"en":"Many teachers meet the framework only through a textbook or a scheme of work. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why do we teach simultaneous equations in Year 9 and not in Year 8? Where does Pythagoras' theorem first appear? What should a Year 8 pupil already be able to do with indices? This module gives you the foundation for answering them.","ar":"Many teachers meet the framework only through a textbook or a scheme of work. That is useful, but it can hide the bigger picture. If you know the framework itself, you can answer questions such as: Why do we teach simultaneous equations in Year 9 and not in Year 8? Where does Pythagoras' theorem first appear? What should a Year 8 pupil already be able to do with indices? This module gives you the foundation for answering them."}},{"t":"h","c":{"en":"What the framework says about its purpose","ar":"What the framework says about its purpose"}},{"t":"p","c":{"en":"The framework describes Cambridge Lower Secondary Mathematics as a programme that encourages lifelong enthusiasm for analytical and rational thinking. Learners develop a holistic understanding of the subject, with a focus on principles, patterns, systems, functions and relationships. The aim is that they become mathematically competent and fluent in computation, and that they can apply this in everyday situations.","ar":"The framework describes Cambridge Lower Secondary Mathematics as a programme that encourages lifelong enthusiasm for analytical and rational thinking. Learners develop a holistic understanding of the subject, with a focus on principles, patterns, systems, functions and relationships. The aim is that they become mathematically competent and fluent in computation, and that they can apply this in everyday situations."}},{"t":"p","c":{"en":"The framework lists several key benefits. In plain English, the main ones are:","ar":"The framework lists several key benefits. In plain English, the main ones are:"}},{"t":"list","c":{"en":["\u003cstrong>Thinking and Working Mathematically.\u003c/strong> The framework calls this \"a unique feature\". Learners talk with others, challenge ideas and give evidence for their conjectures and solutions. You will study it in Modules 3 and 4.","\u003cstrong>Clear progression.\u003c/strong> The structure is designed to support progression of knowledge and skills within and across the lower secondary stages. Learners recognise how mathematical ideas are connected.","\u003cstrong>Four strands.\u003c/strong> Learners develop skills in Number, Algebra, Geometry and Measure, and Statistics and Probability.","\u003cstrong>Number as the foundation.\u003c/strong> The framework calls Number \"the foundation of the mathematics curriculum\". Skills learnt there are applied in the other strands.","\u003cstrong>Algebra that builds on the primary stages.\u003c/strong> The framework says the Algebra strand builds on pre-algebra concepts in the primary stages, to strengthen reasoning and the ability to find and generalise patterns and rules.","\u003cstrong>Technology and statistics in context.\u003c/strong> Geometry and Measure uses mathematical instruments and digital technology. Statistics and Probability stresses the statistical enquiry cycle, so that learners can recognise misleading data in the media or in advertisements."],"ar":["\u003cstrong>Thinking and Working Mathematically.\u003c/strong> The framework calls this \"a unique feature\". Learners talk with others, challenge ideas and give evidence for their conjectures and solutions. You will study it in Modules 3 and 4.","\u003cstrong>Clear progression.\u003c/strong> The structure is designed to support progression of knowledge and skills within and across the lower secondary stages. Learners recognise how mathematical ideas are connected.","\u003cstrong>Four strands.\u003c/strong> Learners develop skills in Number, Algebra, Geometry and Measure, and Statistics and Probability.","\u003cstrong>Number as the foundation.\u003c/strong> The framework calls Number \"the foundation of the mathematics curriculum\". Skills learnt there are applied in the other strands.","\u003cstrong>Algebra that builds on the primary stages.\u003c/strong> The framework says the Algebra strand builds on pre-algebra concepts in the primary stages, to strengthen reasoning and the ability to find and generalise patterns and rules.","\u003cstrong>Technology and statistics in context.\u003c/strong> Geometry and Measure uses mathematical instruments and digital technology. Statistics and Probability stresses the statistical enquiry cycle, so that learners can recognise misleading data in the media or in advertisements."]}},{"t":"h","c":{"en":"Supporting teachers: what Cambridge provides","ar":"Supporting teachers: what Cambridge provides"}},{"t":"p","c":{"en":"The framework says Cambridge provides practical resources, detailed guidance, training and professional development. Most resources are on the Cambridge Lower Secondary support site. The framework says to ask the Cambridge coordinator or exams officer in your school if you do not yet have a log-in. At PEPS, your HOD is also a good first contact.","ar":"The framework says Cambridge provides practical resources, detailed guidance, training and professional development. Most resources are on the Cambridge Lower Secondary support site. The framework says to ask the Cambridge coordinator or exams officer in your school if you do not yet have a log-in. At PEPS, your HOD is also a good first contact."}},{"t":"table","head":{"en":["Group in the framework","What it lists","How you might use it"],"ar":["Group in the framework","What it lists","How you might use it"]},"rows":[{"en":["Teaching resources","The curriculum framework, the teacher guide and schemes of work","Framework to see the target. Teacher guide to plan and deliver lessons. Schemes of work for suggested units and activities"],"ar":["Teaching resources","The curriculum framework, the teacher guide and schemes of work","Framework to see the target. Teacher guide to plan and deliver lessons. Schemes of work for suggested units and activities"]},{"en":["Cambridge Lower Secondary assessments","Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests","Ask your HOD which are used at PEPS and in which year. The framework says only that these assessments exist"],"ar":["Cambridge Lower Secondary assessments","Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests","Ask your HOD which are used at PEPS and in which year. The framework says only that these assessments exist"]},{"en":["Training","Face-to-face workshops, online training and Cambridge Professional Development Qualifications","Ask your HOD or the school leadership what is available to you"],"ar":["Training","Face-to-face workshops, online training and Cambridge Professional Development Qualifications","Ask your HOD or the school leadership what is available to you"]},{"en":["Cambridge Lower Secondary Community","Social media channels and community forums for sharing ideas with other teachers","Good practice: read what other teachers share, then check it against the framework"],"ar":["Cambridge Lower Secondary Community","Social media channels and community forums for sharing ideas with other teachers","Good practice: read what other teachers share, then check it against the framework"]}]},{"t":"callout","k":"tip","title":{"en":"Schemes of work are optional","ar":"Schemes of work are optional"},"c":{"en":"The framework says clearly that you do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Mathematics. They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all your teaching time. The learning objectives in the framework are the target. Everything else is support.","ar":"The framework says clearly that you do not need to use the ideas in the schemes of work to teach Cambridge Lower Secondary Mathematics. They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all your teaching time. The learning objectives in the framework are the target. Everything else is support."}},{"t":"h","c":{"en":"Progression through the Cambridge Pathway and ages","ar":"Progression through the Cambridge Pathway and ages"}},{"t":"p","c":{"en":"The framework says the lower secondary programme is part of the Cambridge Pathway, which \"leads seamlessly from primary to secondary and pre-university years\". Each step builds on the learners' development from the previous one. The framework is typically for learners aged 11 to 14, but it may be appropriate for slightly different ages to suit your context.","ar":"The framework says the lower secondary programme is part of the Cambridge Pathway, which \"leads seamlessly from primary to secondary and pre-university years\". Each step builds on the learners' development from the previous one. The framework is typically for learners aged 11 to 14, but it may be appropriate for slightly different ages to suit your context."}},{"t":"table","head":{"en":["Step","What it is","Where PEPS fits (PEPS context)"],"ar":["Step","What it is","Where PEPS fits (PEPS context)"]},"rows":[{"en":["Before","Cambridge Primary Mathematics, Stages 1 to 6","PEPS Years 1 to 6. Pupils arrive in Year 7 from this programme"],"ar":["Before","Cambridge Primary Mathematics, Stages 1 to 6","PEPS Years 1 to 6. Pupils arrive in Year 7 from this programme"]},{"en":["This CPD","Cambridge Lower Secondary Mathematics 0862, Stages 7, 8 and 9","PEPS Years 7, 8 and 9 = Stages 7, 8 and 9. Year 9 sits the Cambridge Lower Secondary Checkpoint"],"ar":["This CPD","Cambridge Lower Secondary Mathematics 0862, Stages 7, 8 and 9","PEPS Years 7, 8 and 9 = Stages 7, 8 and 9. Year 9 sits the Cambridge Lower Secondary Checkpoint"]},{"en":["After","Cambridge IGCSE and the pre-university years","PEPS Years 10 and 11 follow Cambridge IGCSE Mathematics 0580 (Extended tier by default). Years 12 and 13 follow Pearson Edexcel International AS and A level Mathematics"],"ar":["After","Cambridge IGCSE and the pre-university years","PEPS Years 10 and 11 follow Cambridge IGCSE Mathematics 0580 (Extended tier by default). Years 12 and 13 follow Pearson Edexcel International AS and A level Mathematics"]}]},{"t":"p","c":{"en":"The framework adds that the progression of learning objectives across Stages 7 to 9 is available on the Lower Secondary support site. You will practise reading progression yourself in Module 9.","ar":"The framework adds that the progression of learning objectives across Stages 7 to 9 is available on the Lower Secondary support site. You will practise reading progression yourself in Module 9."}},{"t":"h","c":{"en":"Teaching time: what the framework actually says","ar":"Teaching time: what the framework actually says"}},{"t":"p","c":{"en":"The framework gives this guidance: it \"is based on learners having 4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\". It adds that your actual number of teaching hours may vary according to your context. This is guidance, not a rule. It tells you how much teaching the objectives were designed for. It does not say a school is wrong if its timetable differs.","ar":"The framework gives this guidance: it \"is based on learners having 4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\". It adds that your actual number of teaching hours may vary according to your context. This is guidance, not a rule. It tells you how much teaching the objectives were designed for. It does not say a school is wrong if its timetable differs."}},{"t":"scenario","title":{"en":"A shorter timetable","ar":"A shorter timetable"},"c":{"en":"A new teacher at PEPS says: \"Our school week is four days, Monday to Thursday, so I think we cannot cover the whole framework.\" A good reply: the 4 to 5 hours per week is guidance and the framework says hours vary by context. The right next step is to look at the full list of objectives for the stage with your HOD, then agree how the school's timetable and long-term plan cover them. Do not drop whole strands because the timetable looks short.","ar":"A new teacher at PEPS says: \"Our school week is four days, Monday to Thursday, so I think we cannot cover the whole framework.\" A good reply: the 4 to 5 hours per week is guidance and the framework says hours vary by context. The right next step is to look at the full list of objectives for the stage with your HOD, then agree how the school's timetable and long-term plan cover them. Do not drop whole strands because the timetable looks short."}},{"t":"h","c":{"en":"Assessment and version: reading the front pages carefully","ar":"Assessment and version: reading the front pages carefully"}},{"t":"p","c":{"en":"The framework says Cambridge provides assessments \"designed to complement this curriculum framework for Stages 7 to 9\". The front cover also says Cambridge Lower Secondary Progression Tests were to be available from 2022 and Checkpoint tests from 2023. It does not say more than this about how the tests are built, so check the support site for details.","ar":"The framework says Cambridge provides assessments \"designed to complement this curriculum framework for Stages 7 to 9\". The front cover also says Cambridge Lower Secondary Progression Tests were to be available from 2022 and Checkpoint tests from 2023. It does not say more than this about how the tests are built, so check the support site for details."}},{"t":"p","c":{"en":"On version: the framework was published in September 2020 for first teaching in September 2021. \u003cstrong>The latest version is version 3.0, published August 2021.\u003c/strong> The changes section says version 3.0 made the document digitally accessible (for example larger font size and spacing, and alternative text for images and tables). Version 2.0, published January 2021, made small changes to three objectives, which you will meet in Modules 7 and 8.","ar":"On version: the framework was published in September 2020 for first teaching in September 2021. \u003cstrong>The latest version is version 3.0, published August 2021.\u003c/strong> The changes section says version 3.0 made the document digitally accessible (for example larger font size and spacing, and alternative text for images and tables). Version 2.0, published January 2021, made small changes to three objectives, which you will meet in Modules 7 and 8."}},{"t":"callout","k":"warn","title":{"en":"Always quote the right version","ar":"Always quote the right version"},"c":{"en":"When you write a policy, a scheme of work or a report, name the framework as \"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0\". Older copies of the document may still be in circulation, and they differ slightly (for example in the lists of data representations in 8Ss.03 and 9Ss.03). Check the Cambridge support site for the current version.","ar":"When you write a policy, a scheme of work or a report, name the framework as \"Cambridge Lower Secondary Mathematics 0862 Curriculum Framework, version 3.0\". Older copies of the document may still be in circulation, and they differ slightly (for example in the lists of data representations in 8Ss.03 and 9Ss.03). Check the Cambridge support site for the current version."}}],"checks":[{"id":"m1q1","q":{"en":"Which statement about teaching time matches the framework?","ar":"Which statement about teaching time matches the framework?"},"opts":[{"en":"It is based on 4 to 5 hours of Mathematics per week, or about 120 to 150 hours per stage; hours may vary","ar":"It is based on 4 to 5 hours of Mathematics per week, or about 120 to 150 hours per stage; hours may vary"},{"en":"It requires exactly 5 hours of Mathematics every week in each stage, so schools cannot adjust the hours at all","ar":"It requires exactly 5 hours of Mathematics every week in each stage, so schools cannot adjust the hours at all"},{"en":"It is based on 3 to 4 hours a week, or about 90 to 120 hours per stage, for all schools","ar":"It is based on 3 to 4 hours a week, or about 90 to 120 hours per stage, for all schools"},{"en":"It gives no guidance on teaching time and leaves the whole matter to the national curriculum","ar":"It gives no guidance on teaching time and leaves the whole matter to the national curriculum"}],"correct":0,"expl":{"en":"The framework gives 4 to 5 hours per week (about 120 to 150 hours per stage) as guidance and says actual hours may vary according to your context.","ar":"The framework gives 4 to 5 hours per week (about 120 to 150 hours per stage) as guidance and says actual hours may vary according to your context."}},{"id":"m1q2","q":{"en":"Which resources does the framework list under Cambridge Lower Secondary assessments?","ar":"Which resources does the framework list under Cambridge Lower Secondary assessments?"},"opts":[{"en":"Cambridge Lower Secondary Progression Tests, schemes of work and the teacher guide for every stage","ar":"Cambridge Lower Secondary Progression Tests, schemes of work and the teacher guide for every stage"},{"en":"Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests","ar":"Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests"},{"en":"Cambridge Lower Secondary Checkpoint, endorsed textbooks and Cambridge Professional Development Qualifications","ar":"Cambridge Lower Secondary Checkpoint, endorsed textbooks and Cambridge Professional Development Qualifications"},{"en":"CEM Baseline Tests, the glossary and the learning objectives for Stages 7, 8 and 9","ar":"CEM Baseline Tests, the glossary and the learning objectives for Stages 7, 8 and 9"}],"correct":1,"expl":{"en":"The framework lists Progression Tests, Checkpoint and CEM Baseline Tests as assessments. Schemes of work and the teacher guide are teaching resources.","ar":"The framework lists Progression Tests, Checkpoint and CEM Baseline Tests as assessments. Schemes of work and the teacher guide are teaching resources."}},{"id":"m1q3","q":{"en":"What does the framework say about the latest version of the document?","ar":"What does the framework say about the latest version of the document?"},"opts":[{"en":"The latest version is 2.0, published January 2021, and it removed the Statistics and Probability strand","ar":"The latest version is 2.0, published January 2021, and it removed the Statistics and Probability strand"},{"en":"The latest version is 3.0, published September 2021, and it rewrote all the Stage 9 learning objectives","ar":"The latest version is 3.0, published September 2021, and it rewrote all the Stage 9 learning objectives"},{"en":"The latest version is 3.0, published August 2021, and it made the document digitally accessible","ar":"The latest version is 3.0, published August 2021, and it made the document digitally accessible"},{"en":"The latest version is 1.0, published September 2020, and no later changes have been made to it","ar":"The latest version is 1.0, published September 2020, and no later changes have been made to it"}],"correct":2,"expl":{"en":"Section 5 says the latest version is 3.0, published August 2021, with changes that make the document digitally accessible. Version 2.0 (January 2021) changed three objectives.","ar":"Section 5 says the latest version is 3.0, published August 2021, with changes that make the document digitally accessible. Version 2.0 (January 2021) changed three objectives."}}]},{"id":"m2","title":{"en":"Aims and Learner Attributes in Lower Secondary Mathematics","ar":"Aims and Learner Attributes in Lower Secondary Mathematics"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before you look at any objective, it helps to know what the whole programme is for. The framework gives two sets of aims. The first set belongs to the whole Cambridge Lower Secondary programme. The second set is specific to mathematics. The framework then describes five learner attributes, which show what a successful mathematics learner looks like. In this module you will read all three and turn them into classroom actions.","ar":"Before you look at any objective, it helps to know what the whole programme is for. The framework gives two sets of aims. The first set belongs to the whole Cambridge Lower Secondary programme. The second set is specific to mathematics. The framework then describes five learner attributes, which show what a successful mathematics learner looks like. In this module you will read all three and turn them into classroom actions."}},{"t":"h","c":{"en":"The aims of the Cambridge Lower Secondary programme","ar":"The aims of the Cambridge Lower Secondary programme"}},{"t":"p","c":{"en":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning. It lists four examples:","ar":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning. It lists four examples:"}},{"t":"list","c":{"en":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as having global awareness."],"ar":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as having global awareness."]}},{"t":"p","c":{"en":"For PEPS teachers, the third aim is important. Every PEPS pupil is learning English as a second language, and the framework itself says communication skills, including in English, are a goal of the programme. A mathematics lesson is therefore also a place where pupils practise English. This does not mean you must teach grammar. It means you plan time for pupils to talk, explain and write about mathematics.","ar":"For PEPS teachers, the third aim is important. Every PEPS pupil is learning English as a second language, and the framework itself says communication skills, including in English, are a goal of the programme. A mathematics lesson is therefore also a place where pupils practise English. This does not mean you must teach grammar. It means you plan time for pupils to talk, explain and write about mathematics."}},{"t":"h","c":{"en":"The aims of Cambridge Lower Secondary Mathematics","ar":"The aims of Cambridge Lower Secondary Mathematics"}},{"t":"p","c":{"en":"The framework says that in Cambridge Lower Secondary Mathematics, learners:","ar":"The framework says that in Cambridge Lower Secondary Mathematics, learners:"}},{"t":"table","head":{"en":["Aim in the framework (paraphrased)","What it can look like in a PEPS classroom (good practice)"],"ar":["Aim in the framework (paraphrased)","What it can look like in a PEPS classroom (good practice)"]},"rows":[{"en":["Engage in creative mathematical thinking to generate elegant solutions","Pupils compare two methods for the same problem and say which is shorter or clearer, and why"],"ar":["Engage in creative mathematical thinking to generate elegant solutions","Pupils compare two methods for the same problem and say which is shorter or clearer, and why"]},{"en":["Improve numerical fluency and knowledge of key concepts to make sense of numbers, patterns, shapes, measurements and data","Regular short fluency practice (mental and written), linked to meaning, for example estimating before calculating"],"ar":["Improve numerical fluency and knowledge of key concepts to make sense of numbers, patterns, shapes, measurements and data","Regular short fluency practice (mental and written), linked to meaning, for example estimating before calculating"]},{"en":["Develop skills, strategies and a way of thinking to describe the world and play an active role in modern society","Problems from pupils' own world: prices, distances, sports data, travel times, survey results"],"ar":["Develop skills, strategies and a way of thinking to describe the world and play an active role in modern society","Problems from pupils' own world: prices, distances, sports data, travel times, survey results"]},{"en":["Communicate solutions and ideas logically in spoken and written language, using symbols, diagrams and representations","Sentence starters for explanations, such as \"I know that ... because ...\", and a diagram or table beside each written answer"],"ar":["Communicate solutions and ideas logically in spoken and written language, using symbols, diagrams and representations","Sentence starters for explanations, such as \"I know that ... because ...\", and a diagram or table beside each written answer"]},{"en":["Understand that technology is a powerful way of communicating mathematics","Using digital tools to draw graphs, construct shapes or present data, then explaining what the picture shows"],"ar":["Understand that technology is a powerful way of communicating mathematics","Using digital tools to draw graphs, construct shapes or present data, then explaining what the picture shows"]}]},{"t":"callout","k":"tip","title":{"en":"Fluency and thinking go together","ar":"Fluency and thinking go together"},"c":{"en":"The aims say learners improve numerical fluency and develop creative thinking. They are not two separate jobs. The framework describes learners who are \"competent and fluent in computation\" and who think and work mathematically. A lesson that has only procedures misses the second half. A lesson that has only open investigation, with no fluency practice, misses the first half.","ar":"The aims say learners improve numerical fluency and develop creative thinking. They are not two separate jobs. The framework describes learners who are \"competent and fluent in computation\" and who think and work mathematically. A lesson that has only procedures misses the second half. A lesson that has only open investigation, with no fluency practice, misses the first half."}},{"t":"h","c":{"en":"The five Cambridge learner attributes in mathematics","ar":"The five Cambridge learner attributes in mathematics"}},{"t":"p","c":{"en":"The framework says the Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. It then describes what each attribute means in mathematics. Read the descriptions below. They are paraphrased, so check the framework page for the exact wording.","ar":"The framework says the Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. It then describes what each attribute means in mathematics. Read the descriptions below. They are paraphrased, so check the framework page for the exact wording."}},{"t":"table","head":{"en":["Attribute","What the framework says (paraphrased)","A sign you might see in class (good practice)"],"ar":["Attribute","What the framework says (paraphrased)","A sign you might see in class (good practice)"]},"rows":[{"en":["Responsible","Understand how principles of mathematics can be applied to real-life problems in a responsible way","Pupils check whether a percentage change in a news item is reasonable before sharing it"],"ar":["Responsible","Understand how principles of mathematics can be applied to real-life problems in a responsible way","Pupils check whether a percentage change in a news item is reasonable before sharing it"]},{"en":["Innovative","Solve new and unfamiliar problems; choose their own preferred strategies; suggest alternative routes to efficient solutions","A pupil says \"I did it a different way\" and the class compares the routes"],"ar":["Innovative","Solve new and unfamiliar problems; choose their own preferred strategies; suggest alternative routes to efficient solutions","A pupil says \"I did it a different way\" and the class compares the routes"]},{"en":["Confident","Use techniques without hesitation, uncertainty or fear; ask questions in a structured and critical way; present and defend strategies; critique and improve the solutions of others","Pupils present a solution at the board and answer \"How do you know?\" from classmates"],"ar":["Confident","Use techniques without hesitation, uncertainty or fear; ask questions in a structured and critical way; present and defend strategies; critique and improve the solutions of others","Pupils present a solution at the board and answer \"How do you know?\" from classmates"]},{"en":["Engaged","Curious; engage intellectually to deepen understanding; use mathematics to take part in society and the economy by making informed choices","Pupils compare mobile phone plans and decide which is best for a given use"],"ar":["Engaged","Curious; engage intellectually to deepen understanding; use mathematics to take part in society and the economy by making informed choices","Pupils compare mobile phone plans and decide which is best for a given use"]},{"en":["Reflective","Reflect on the process of thinking and working mathematically as well as mastering concepts; make conjectures by asking sophisticated questions","A short end-of-lesson reflection: \"What did I notice? What would I ask next?\""],"ar":["Reflective","Reflect on the process of thinking and working mathematically as well as mastering concepts; make conjectures by asking sophisticated questions","A short end-of-lesson reflection: \"What did I notice? What would I ask next?\""]}]},{"t":"p","c":{"en":"Notice that Confident and Reflective both refer to the process of working, not only to getting answers. This links directly to Thinking and Working Mathematically (Modules 3 and 4). The attributes also explain why the framework talks about conjectures, evidence and critique. They are part of the definition of a good mathematics learner, not extras.","ar":"Notice that Confident and Reflective both refer to the process of working, not only to getting answers. This links directly to Thinking and Working Mathematically (Modules 3 and 4). The attributes also explain why the framework talks about conjectures, evidence and critique. They are part of the definition of a good mathematics learner, not extras."}},{"t":"scenario","title":{"en":"The quiet pupil and the confident attribute","ar":"The quiet pupil and the confident attribute"},"c":{"en":"In a Year 7 class of 28, an ESL pupil who is very good at calculation never speaks in discussion. The framework describes a Confident learner as one who can present findings and defend strategies, and critique and improve the solutions of others. A good response is to build up to this gently: first a pair talk with a sentence starter, then a short written explanation with a diagram, then a one-minute presentation to a small group. Confidence is a skill that grows with practice. It is not a personality trait that some pupils lack.","ar":"In a Year 7 class of 28, an ESL pupil who is very good at calculation never speaks in discussion. The framework describes a Confident learner as one who can present findings and defend strategies, and critique and improve the solutions of others. A good response is to build up to this gently: first a pair talk with a sentence starter, then a short written explanation with a diagram, then a one-minute presentation to a small group. Confidence is a skill that grows with practice. It is not a personality trait that some pupils lack."}},{"t":"h","c":{"en":"Turning attributes into planning questions","ar":"Turning attributes into planning questions"}},{"t":"p","c":{"en":"A practical way to use the attributes is to ask five questions when you plan a unit. These questions are good practice, not Cambridge requirements.","ar":"A practical way to use the attributes is to ask five questions when you plan a unit. These questions are good practice, not Cambridge requirements."}},{"t":"steps","c":{"en":["\u003cstrong>Responsible:\u003c/strong> Is there a real-life context where pupils must judge whether an answer or claim is reasonable?","\u003cstrong>Innovative:\u003c/strong> Is there a problem where more than one route is possible, so that pupils can choose and compare?","\u003cstrong>Confident:\u003c/strong> Do pupils have a chance to explain, defend and critique, not only to calculate?","\u003cstrong>Engaged:\u003c/strong> Does the task connect to something pupils find interesting or useful outside school?","\u003cstrong>Reflective:\u003c/strong> Is there a moment when pupils think about how they worked, not only what they got?"],"ar":["\u003cstrong>Responsible:\u003c/strong> Is there a real-life context where pupils must judge whether an answer or claim is reasonable?","\u003cstrong>Innovative:\u003c/strong> Is there a problem where more than one route is possible, so that pupils can choose and compare?","\u003cstrong>Confident:\u003c/strong> Do pupils have a chance to explain, defend and critique, not only to calculate?","\u003cstrong>Engaged:\u003c/strong> Does the task connect to something pupils find interesting or useful outside school?","\u003cstrong>Reflective:\u003c/strong> Is there a moment when pupils think about how they worked, not only what they got?"]}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"The aims and attributes are part of the framework. They tell you the purpose behind the learning objectives. When a lesson covers an objective correctly but pupils only copy a method, it has met the content but missed some of the aims.","ar":"The aims and attributes are part of the framework. They tell you the purpose behind the learning objectives. When a lesson covers an objective correctly but pupils only copy a method, it has met the content but missed some of the aims."}},{"t":"scenario","title":{"en":"Checking a lesson against the aims","ar":"Checking a lesson against the aims"},"c":{"en":"A Year 8 teacher plans a lesson on 8Nf.05 (percentage increase and decrease). The lesson has ten practice questions and nothing else. The HOD suggests adding a task: \"A shop says: 20% off, then a further 20% off, so 40% off. Is this right?\" Which aims does this task support? It supports communication of solutions and ideas, the Confident attribute (defending a view), and the Responsible attribute (judging a real-life claim). It also leads into compound percentages, which the framework places in Stage 9 (9Nf.05), so pupils should not be expected to complete the full calculation fluently yet. The task starts the thinking without changing the stage of the content.","ar":"A Year 8 teacher plans a lesson on 8Nf.05 (percentage increase and decrease). The lesson has ten practice questions and nothing else. The HOD suggests adding a task: \"A shop says: 20% off, then a further 20% off, so 40% off. Is this right?\" Which aims does this task support? It supports communication of solutions and ideas, the Confident attribute (defending a view), and the Responsible attribute (judging a real-life claim). It also leads into compound percentages, which the framework places in Stage 9 (9Nf.05), so pupils should not be expected to complete the full calculation fluently yet. The task starts the thinking without changing the stage of the content."}}],"checks":[{"id":"m2q1","q":{"en":"A Year 8 class explains why a \"20% off then 20% off\" offer is not 40% off. Which framework attribute does the task support most directly?","ar":"A Year 8 class explains why a \"20% off then 20% off\" offer is not 40% off. Which framework attribute does the task support most directly?"},"opts":[{"en":"Responsible, because the task is only about sharing a quantity fairly between two people","ar":"Responsible, because the task is only about sharing a quantity fairly between two people"},{"en":"Engaged, because learners must first study the economy as a separate subject in school","ar":"Engaged, because learners must first study the economy as a separate subject in school"},{"en":"Innovative, because the offer has only one correct route that pupils must discover","ar":"Innovative, because the offer has only one correct route that pupils must discover"},{"en":"Confident, because learners present findings and defend their strategies and solutions","ar":"Confident, because learners present findings and defend their strategies and solutions"}],"correct":3,"expl":{"en":"Confident learners present their findings and defend their strategies. The task also touches Responsible, but defending a line of reasoning is the closest match.","ar":"Confident learners present their findings and defend their strategies. The task also touches Responsible, but defending a line of reasoning is the closest match."}},{"id":"m2q2","q":{"en":"According to the framework, which aim is shared by the whole Cambridge Lower Secondary programme?","ar":"According to the framework, which aim is shared by the whole Cambridge Lower Secondary programme?"},"opts":[{"en":"Effective and confident communication skills, including in English","ar":"Effective and confident communication skills, including in English"},{"en":"Fluency in computation, so that learners calculate without ever needing to explain","ar":"Fluency in computation, so that learners calculate without ever needing to explain"},{"en":"Use of the same textbook in every school in the Cambridge Pathway, for each stage","ar":"Use of the same textbook in every school in the Cambridge Pathway, for each stage"},{"en":"Preparation for only one subject, which is chosen by each school for Stage 7","ar":"Preparation for only one subject, which is chosen by each school for Stage 7"}],"correct":0,"expl":{"en":"The four programme aims include curiosity, applying knowledge across subjects, communication skills including in English, and personal, local and global awareness.","ar":"The four programme aims include curiosity, applying knowledge across subjects, communication skills including in English, and personal, local and global awareness."}},{"id":"m2q3","q":{"en":"Which description matches the Reflective attribute in the framework?","ar":"Which description matches the Reflective attribute in the framework?"},"opts":[{"en":"Learners recall each method exactly as the teacher showed it, so the process is always the same in class","ar":"Learners recall each method exactly as the teacher showed it, so the process is always the same in class"},{"en":"Learners reflect on the process of thinking and working mathematically as well as mastering concepts","ar":"Learners reflect on the process of thinking and working mathematically as well as mastering concepts"},{"en":"Learners use mathematics only for tasks in the economy and avoid ones from daily life","ar":"Learners use mathematics only for tasks in the economy and avoid ones from daily life"},{"en":"Learners solve new problems and suggest alternative routes to efficient solutions in each case","ar":"Learners solve new problems and suggest alternative routes to efficient solutions in each case"}],"correct":1,"expl":{"en":"Reflective learners reflect on the process and make conjectures by asking sophisticated questions. Suggesting alternative routes belongs to the Innovative attribute.","ar":"Reflective learners reflect on the process and make conjectures by asking sophisticated questions. Suggesting alternative routes belongs to the Innovative attribute."}}]},{"id":"m3","title":{"en":"How the Framework Is Organised: Strands, Sub-strands and Codes","ar":"How the Framework Is Organised: Strands, Sub-strands and Codes"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A framework with 56 to 63 learning objectives per stage can look long. It becomes easy to use once you know its structure. In this module you learn the four layers: \u003cstrong>strands\u003c/strong>, \u003cstrong>sub-strands\u003c/strong>, \u003cstrong>learning objectives\u003c/strong> and \u003cstrong>codes\u003c/strong>. You also meet the place of Thinking and Working Mathematically in that structure. This is the module to keep open when you plan.","ar":"A framework with 56 to 63 learning objectives per stage can look long. It becomes easy to use once you know its structure. In this module you learn the four layers: \u003cstrong>strands\u003c/strong>, \u003cstrong>sub-strands\u003c/strong>, \u003cstrong>learning objectives\u003c/strong> and \u003cstrong>codes\u003c/strong>. You also meet the place of Thinking and Working Mathematically in that structure. This is the module to keep open when you plan."}},{"t":"h","c":{"en":"Strands and sub-strands","ar":"Strands and sub-strands"}},{"t":"p","c":{"en":"The framework divides the learning objectives into four main areas called strands. They run through every lower secondary stage: Number, Algebra, Geometry and Measure, and Statistics and Probability. The glossary defines a strand as \"a collection of learning objectives in the curriculum framework that forms an area of learning\". Each strand is divided into sub-strands, nine in total. The framework adds that although each strand is presented separately, it is intimately connected to the others, and the strands should be taught in conjunction with each other.","ar":"The framework divides the learning objectives into four main areas called strands. They run through every lower secondary stage: Number, Algebra, Geometry and Measure, and Statistics and Probability. The glossary defines a strand as \"a collection of learning objectives in the curriculum framework that forms an area of learning\". Each strand is divided into sub-strands, nine in total. The framework adds that although each strand is presented separately, it is intimately connected to the others, and the strands should be taught in conjunction with each other."}},{"t":"table","head":{"en":["Strand","Sub-strand (title in the framework)","Reporting code"],"ar":["Strand","Sub-strand (title in the framework)","Reporting code"]},"rows":[{"en":["Number","Fractions, decimals, percentages, ratio and proportion","Nf"],"ar":["Number","Fractions, decimals, percentages, ratio and proportion","Nf"]},{"en":["Number","Integers, powers and roots","Ni"],"ar":["Number","Integers, powers and roots","Ni"]},{"en":["Number","Place value, ordering and rounding","Np"],"ar":["Number","Place value, ordering and rounding","Np"]},{"en":["Algebra","Expressions, equations and formulae","Ae"],"ar":["Algebra","Expressions, equations and formulae","Ae"]},{"en":["Algebra","Sequences, functions and graphs","As"],"ar":["Algebra","Sequences, functions and graphs","As"]},{"en":["Geometry and Measure","Position and transformation","Gp"],"ar":["Geometry and Measure","Position and transformation","Gp"]},{"en":["Geometry and Measure","Geometrical reasoning, shapes and measurements","Gg"],"ar":["Geometry and Measure","Geometrical reasoning, shapes and measurements","Gg"]},{"en":["Statistics and Probability","Probability","Sp"],"ar":["Statistics and Probability","Probability","Sp"]},{"en":["Statistics and Probability","Statistics","Ss"],"ar":["Statistics and Probability","Statistics","Ss"]}]},{"t":"p","c":{"en":"Look at how the reporting codes are built. The reporting code is the strand letter plus a lower-case letter that reflects the sub-strand title: N + f (fractions), N + i (integers), N + p (place value), A + e (expressions), A + s (sequences), G + p (position), G + g (geometrical reasoning), S + p (probability) and S + s (statistics). Note that \"Sp\" is Probability and \"Ss\" is Statistics. Be careful not to swap them.","ar":"Look at how the reporting codes are built. The reporting code is the strand letter plus a lower-case letter that reflects the sub-strand title: N + f (fractions), N + i (integers), N + p (place value), A + e (expressions), A + s (sequences), G + p (position), G + g (geometrical reasoning), S + p (probability) and S + s (statistics). Note that \"Sp\" is Probability and \"Ss\" is Statistics. Be careful not to swap them."}},{"t":"h","c":{"en":"How to read a learning-objective code","ar":"How to read a learning-objective code"}},{"t":"p","c":{"en":"The framework says every learning objective has a unique code, for example 7Nf.05. The codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Each code has three parts:","ar":"The framework says every learning objective has a unique code, for example 7Nf.05. The codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Each code has three parts:"}},{"t":"list","c":{"en":["\u003cstrong>the stage number\u003c/strong>, for example 7","\u003cstrong>a reporting code\u003c/strong> that appears in the feedback reports for tests and reflects the sub-strand titles, for example Nf","\u003cstrong>a number\u003c/strong> showing the order of the learning objective in the sub-strand for that stage, for example 05 is the fifth objective."],"ar":["\u003cstrong>the stage number\u003c/strong>, for example 7","\u003cstrong>a reporting code\u003c/strong> that appears in the feedback reports for tests and reflects the sub-strand titles, for example Nf","\u003cstrong>a number\u003c/strong> showing the order of the learning objective in the sub-strand for that stage, for example 05 is the fifth objective."]}},{"t":"table","head":{"en":["Code","Stage","Sub-strand","Objective number","What the objective says (short paraphrase)"],"ar":["Code","Stage","Sub-strand","Objective number","What the objective says (short paraphrase)"]},"rows":[{"en":["7Nf.01","7","Fractions, decimals, percentages, ratio and proportion","1st","Fractions, terminating decimals and percentages can have equivalent values"],"ar":["7Nf.01","7","Fractions, decimals, percentages, ratio and proportion","1st","Fractions, terminating decimals and percentages can have equivalent values"]},{"en":["8Ae.06","8","Expressions, equations and formulae","6th","Move between words and equations, and solve them (integer or fractional coefficients, unknown on either or both sides)"],"ar":["8Ae.06","8","Expressions, equations and formulae","6th","Move between words and equations, and solve them (integer or fractional coefficients, unknown on either or both sides)"]},{"en":["9Gg.10","9","Geometrical reasoning, shapes and measurements","10th","Know and use Pythagoras' theorem"],"ar":["9Gg.10","9","Geometrical reasoning, shapes and measurements","10th","Know and use Pythagoras' theorem"]},{"en":["7Ss.04","7","Statistics","4th","Use mode, median, mean and range to describe and summarise large data sets"],"ar":["7Ss.04","7","Statistics","4th","Use mode, median, mean and range to describe and summarise large data sets"]},{"en":["9Sp.01","9","Probability","1st","Probability of multiple mutually exclusive events by summation; total probability of 1"],"ar":["9Sp.01","9","Probability","1st","Probability of multiple mutually exclusive events by summation; total probability of 1"]}]},{"t":"callout","k":"warn","title":{"en":"Common misreading: the number is not a difficulty level","ar":"Common misreading: the number is not a difficulty level"},"c":{"en":"The last number only shows the order of the objective inside one sub-strand for one stage. 7Nf.05 and 8Nf.05 are different objectives (7Nf.05 is about percentages of shapes and whole numbers, including less than 1 and more than 100; 8Nf.05 is about percentage increase and decrease and absolute change). The same number in different stages does not mean the same idea. Also, a higher number does not mean a harder objective.","ar":"The last number only shows the order of the objective inside one sub-strand for one stage. 7Nf.05 and 8Nf.05 are different objectives (7Nf.05 is about percentages of shapes and whole numbers, including less than 1 and more than 100; 8Nf.05 is about percentage increase and decrease and absolute change). The same number in different stages does not mean the same idea. Also, a higher number does not mean a harder objective."}},{"t":"p","c":{"en":"Thinking and Working Mathematically objectives are coded differently. They are written TWM.01 to TWM.08, with no stage number, because the framework says the characteristics \"apply to all of the lower secondary stages\". You will meet them properly in Module 4.","ar":"Thinking and Working Mathematically objectives are coded differently. They are written TWM.01 to TWM.08, with no stage number, because the framework says the characteristics \"apply to all of the lower secondary stages\". You will meet them properly in Module 4."}},{"t":"h","c":{"en":"Why reporting codes matter","ar":"Why reporting codes matter"}},{"t":"p","c":{"en":"The framework says the reporting code \"appears in the feedback reports for tests\". This is a practical link between the framework and assessment. If a test report shows a weak result in, for example, Sp, you know to look at the Probability objectives for the stage and for earlier stages. The framework does not describe the reports in more detail, so check the Cambridge support site and ask your HOD how reports are used at PEPS.","ar":"The framework says the reporting code \"appears in the feedback reports for tests\". This is a practical link between the framework and assessment. If a test report shows a weak result in, for example, Sp, you know to look at the Probability objectives for the stage and for earlier stages. The framework does not describe the reports in more detail, so check the Cambridge support site and ask your HOD how reports are used at PEPS."}},{"t":"scenario","title":{"en":"Reading a scheme of work line","ar":"Reading a scheme of work line"},"c":{"en":"An imagined scheme-of-work line for Year 9 reads: \"9Ae.06 Simultaneous linear equations: solve by elimination and graphically.\" Your colleague says, \"This is the sixth Algebra topic of the year, so we teach it in term 2.\" Is that correct? No. The \"06\" is the order of the objective in the sub-strand list, not a teaching order. The framework says schemes of work show \"suggested units\" showing how objectives can be grouped and ordered. The order of teaching is a school decision. The code tells you that this is Stage 9, the Expressions, equations and formulae sub-strand, and the sixth objective in that list.","ar":"An imagined scheme-of-work line for Year 9 reads: \"9Ae.06 Simultaneous linear equations: solve by elimination and graphically.\" Your colleague says, \"This is the sixth Algebra topic of the year, so we teach it in term 2.\" Is that correct? No. The \"06\" is the order of the objective in the sub-strand list, not a teaching order. The framework says schemes of work show \"suggested units\" showing how objectives can be grouped and ordered. The order of teaching is a school decision. The code tells you that this is Stage 9, the Expressions, equations and formulae sub-strand, and the sixth objective in that list."}},{"t":"h","c":{"en":"The size of each stage","ar":"The size of each stage"}},{"t":"p","c":{"en":"It helps to know how much content each stage holds. The table counts the learning objectives in the framework by strand. It does not include the eight Thinking and Working Mathematically objectives, which repeat in every stage. These counts are good practice for planning. They are not part of the framework text, so check them yourself against the document.","ar":"It helps to know how much content each stage holds. The table counts the learning objectives in the framework by strand. It does not include the eight Thinking and Working Mathematically objectives, which repeat in every stage. These counts are good practice for planning. They are not part of the framework text, so check them yourself against the document."}},{"t":"table","head":{"en":["Strand","Stage 7","Stage 8","Stage 9"],"ar":["Strand","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Number","19","20","14"],"ar":["Number","19","20","14"]},{"en":["Algebra","14","14","14"],"ar":["Algebra","14","14","14"]},{"en":["Geometry and Measure","20","19","18"],"ar":["Geometry and Measure","20","19","18"]},{"en":["Statistics and Probability","10","10","10"],"ar":["Statistics and Probability","10","10","10"]},{"en":["Total (without TWM)","63","63","56"],"ar":["Total (without TWM)","63","63","56"]}]},{"t":"p","c":{"en":"Two cautions. First, the number of objectives is not the same as teaching time. An objective such as 9Gg.10 (Pythagoras' theorem) may need more time than three smaller ones. Second, fewer Number objectives in Stage 9 does not mean Number matters less. Many Stage 9 Number objectives, such as indices and standard form, are used again in Algebra and in Geometry and Measure.","ar":"Two cautions. First, the number of objectives is not the same as teaching time. An objective such as 9Gg.10 (Pythagoras' theorem) may need more time than three smaller ones. Second, fewer Number objectives in Stage 9 does not mean Number matters less. Many Stage 9 Number objectives, such as indices and standard form, are used again in Algebra and in Geometry and Measure."}},{"t":"h","c":{"en":"Thinking and Working Mathematically in the structure","ar":"Thinking and Working Mathematically in the structure"}},{"t":"p","c":{"en":"The framework diagram places Thinking and Working Mathematically (TWM) in the centre of the four strands, joined to each one by arrows. The text says TWM \"is not an independent strand, instead it is embedded within and across the other curriculum strands\". Two ideas follow. First, you do not teach a \"TWM unit\". Second, when you plan a lesson on any objective, you can ask which characteristics it could use. The framework says: \"the Thinking and Working Mathematically characteristics should be integrated into the teaching of the other strands\".","ar":"The framework diagram places Thinking and Working Mathematically (TWM) in the centre of the four strands, joined to each one by arrows. The text says TWM \"is not an independent strand, instead it is embedded within and across the other curriculum strands\". Two ideas follow. First, you do not teach a \"TWM unit\". Second, when you plan a lesson on any objective, you can ask which characteristics it could use. The framework says: \"the Thinking and Working Mathematically characteristics should be integrated into the teaching of the other strands\"."}},{"t":"p","c":{"en":"The framework describes TWM as eight characteristics in four pairs. You will study each one in the next module. Their names are already in the framework's list of objectives for every stage: TWM.01 Specialising, TWM.02 Generalising, TWM.03 Conjecturing, TWM.04 Convincing, TWM.05 Characterising, TWM.06 Classifying, TWM.07 Critiquing and TWM.08 Improving.","ar":"The framework describes TWM as eight characteristics in four pairs. You will study each one in the next module. Their names are already in the framework's list of objectives for every stage: TWM.01 Specialising, TWM.02 Generalising, TWM.03 Conjecturing, TWM.04 Convincing, TWM.05 Characterising, TWM.06 Classifying, TWM.07 Critiquing and TWM.08 Improving."}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"Four strands, nine sub-strands, and one set of TWM characteristics running through all of them. Every objective has a unique code: stage number, reporting code, then order number. The codes link the framework, the schemes of work and the test feedback reports.","ar":"Four strands, nine sub-strands, and one set of TWM characteristics running through all of them. Every objective has a unique code: stage number, reporting code, then order number. The codes link the framework, the schemes of work and the test feedback reports."}}],"checks":[{"id":"m3q1","q":{"en":"What does the code 8Gp.04 tell you?","ar":"What does the code 8Gp.04 tell you?"},"opts":[{"en":"Stage 8, the Geometrical reasoning, shapes and measurements sub-strand, and the fourth objective there","ar":"Stage 8, the Geometrical reasoning, shapes and measurements sub-strand, and the fourth objective there"},{"en":"Year 4 work in Geometry and Measure, and the eighth objective in the Position sub-strand","ar":"Year 4 work in Geometry and Measure, and the eighth objective in the Position sub-strand"},{"en":"Stage 8, the Position and transformation sub-strand, and the fourth objective in that sub-strand","ar":"Stage 8, the Position and transformation sub-strand, and the fourth objective in that sub-strand"},{"en":"Stage 8, the Probability sub-strand, and an objective that is the fourth hardest in the stage","ar":"Stage 8, the Probability sub-strand, and an objective that is the fourth hardest in the stage"}],"correct":2,"expl":{"en":"The first number is the stage (8). Gp is the reporting code for Position and transformation, and 04 is the order number within that sub-strand for Stage 8. Gg is the other Geometry and Measure sub-strand.","ar":"The first number is the stage (8). Gp is the reporting code for Position and transformation, and 04 is the order number within that sub-strand for Stage 8. Gg is the other Geometry and Measure sub-strand."}},{"id":"m3q2","q":{"en":"Two teachers disagree about 7Nf.05 and 8Nf.05. Which explanation is correct?","ar":"Two teachers disagree about 7Nf.05 and 8Nf.05. Which explanation is correct?"},"opts":[{"en":"They are the same objective at two levels, because the last number links an idea across stages","ar":"They are the same objective at two levels, because the last number links an idea across stages"},{"en":"They are the same objective, repeated so that pupils revise it again one year later in school","ar":"They are the same objective, repeated so that pupils revise it again one year later in school"},{"en":"They are different only in difficulty, because 05 always means a medium-level objective in the framework","ar":"They are different only in difficulty, because 05 always means a medium-level objective in the framework"},{"en":"They are different objectives, because the last number shows order within one stage and sub-strand only","ar":"They are different objectives, because the last number shows order within one stage and sub-strand only"}],"correct":3,"expl":{"en":"The framework says the number reflects the order of objectives in the sub-strand for the stage. 7Nf.05 and 8Nf.05 are separate objectives.","ar":"The framework says the number reflects the order of objectives in the sub-strand for the stage. 7Nf.05 and 8Nf.05 are separate objectives."}},{"id":"m3q3","q":{"en":"How does the framework describe the place of Thinking and Working Mathematically?","ar":"How does the framework describe the place of Thinking and Working Mathematically?"},"opts":[{"en":"It is not an independent strand but is embedded within and across the other strands","ar":"It is not an independent strand but is embedded within and across the other strands"},{"en":"It is the fifth strand of the framework and has its own separate units in each stage","ar":"It is the fifth strand of the framework and has its own separate units in each stage"},{"en":"It is only taught in Stage 9, after Number, Algebra and Geometry have been completed","ar":"It is only taught in Stage 9, after Number, Algebra and Geometry have been completed"},{"en":"It is a test type that is used in Checkpoint, and so it is not part of the framework","ar":"It is a test type that is used in Checkpoint, and so it is not part of the framework"}],"correct":0,"expl":{"en":"The overview says TWM is embedded within and across the strands, and that its characteristics should be integrated into the teaching of the other strands.","ar":"The overview says TWM is embedded within and across the strands, and that its characteristics should be integrated into the teaching of the other strands."}}]},{"id":"m4","title":{"en":"Thinking and Working Mathematically","ar":"Thinking and Working Mathematically"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework calls Thinking and Working Mathematically \"a unique feature\" of Cambridge Lower Secondary Mathematics. It is also the part of the framework teachers most often find hard to picture, because it is not a list of topics. It is a set of mathematical actions. This module explains the eight characteristics, shows how they appear in the framework, and gives you examples from Stages 7, 8 and 9 that you can adapt.","ar":"The framework calls Thinking and Working Mathematically \"a unique feature\" of Cambridge Lower Secondary Mathematics. It is also the part of the framework teachers most often find hard to picture, because it is not a list of topics. It is a set of mathematical actions. This module explains the eight characteristics, shows how they appear in the framework, and gives you examples from Stages 7, 8 and 9 that you can adapt."}},{"t":"h","c":{"en":"What the framework says it is","ar":"What the framework says it is"}},{"t":"p","c":{"en":"The framework says that when learners think and work mathematically, they actively engage with mathematics. They try to make sense of ideas and build connections between different facts, procedures and concepts. Learners who do not do this \"can carry out processes that their teacher has shown them, but they may not understand why the processes work or what the results mean\". Noticing inconsistencies, patterns and particular representations encourages learners to think and work mathematically. The framework says that practice, reflection and questioning will help them improve.","ar":"The framework says that when learners think and work mathematically, they actively engage with mathematics. They try to make sense of ideas and build connections between different facts, procedures and concepts. Learners who do not do this \"can carry out processes that their teacher has shown them, but they may not understand why the processes work or what the results mean\". Noticing inconsistencies, patterns and particular representations encourages learners to think and work mathematically. The framework says that practice, reflection and questioning will help them improve."}},{"t":"p","c":{"en":"The framework also states that TWM should not be taught as a separate special activity. It should be embedded throughout the curriculum. The characteristics are intertwined and interdependent, and a high-quality mathematics task may draw on one or more of them. The framework says these eight characteristics give learners and teachers \"the language\" to make decisions about which knowledge, procedures and strategies to use. In other words, they give you words for talking about mathematical thinking.","ar":"The framework also states that TWM should not be taught as a separate special activity. It should be embedded throughout the curriculum. The characteristics are intertwined and interdependent, and a high-quality mathematics task may draw on one or more of them. The framework says these eight characteristics give learners and teachers \"the language\" to make decisions about which knowledge, procedures and strategies to use. In other words, they give you words for talking about mathematical thinking."}},{"t":"h","c":{"en":"The eight characteristics in four pairs","ar":"The eight characteristics in four pairs"}},{"t":"p","c":{"en":"The framework presents the eight characteristics as four pairs, shown in the Thinking and Working Mathematically Star: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. The definitions below stay close to the framework's wording. The examples in the right-hand column are good practice, not Cambridge requirements.","ar":"The framework presents the eight characteristics as four pairs, shown in the Thinking and Working Mathematically Star: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. The definitions below stay close to the framework's wording. The examples in the right-hand column are good practice, not Cambridge requirements."}},{"t":"table","head":{"en":["Characteristic","Definition (close to the framework)","Example prompt for the classroom (good practice)"],"ar":["Characteristic","Definition (close to the framework)","Example prompt for the classroom (good practice)"]},"rows":[{"en":["TWM.01 Specialising","Choosing an example and checking whether it satisfies, or does not satisfy, specific mathematical criteria","\"Choose a number. Is it a multiple of 3? Is the sum of its digits a multiple of 3?\""],"ar":["TWM.01 Specialising","Choosing an example and checking whether it satisfies, or does not satisfy, specific mathematical criteria","\"Choose a number. Is it a multiple of 3? Is the sum of its digits a multiple of 3?\""]},{"en":["TWM.02 Generalising","Recognising an underlying pattern by identifying many examples that satisfy the same criteria","\"After ten examples, what do you notice? Can you des
