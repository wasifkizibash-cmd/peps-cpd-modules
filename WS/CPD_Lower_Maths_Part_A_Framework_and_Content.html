cribe the pattern for any number?\""],"ar":["TWM.02 Generalising","Recognising an underlying pattern by identifying many examples that satisfy the same criteria","\"After ten examples, what do you notice? Can you describe the pattern for any number?\""]},{"en":["TWM.03 Conjecturing","Forming mathematical questions or ideas","\"What do you think will happen if we double every side? Write your idea as a sentence.\""],"ar":["TWM.03 Conjecturing","Forming mathematical questions or ideas","\"What do you think will happen if we double every side? Write your idea as a sentence.\""]},{"en":["TWM.04 Convincing","Presenting evidence to justify or challenge a mathematical idea or solution","\"Convince a partner that your answer is right. Can you convince a sceptic?\""],"ar":["TWM.04 Convincing","Presenting evidence to justify or challenge a mathematical idea or solution","\"Convince a partner that your answer is right. Can you convince a sceptic?\""]},{"en":["TWM.05 Characterising","Identifying and describing the mathematical properties of an object","\"List everything you know about this shape: sides, angles, symmetry.\""],"ar":["TWM.05 Characterising","Identifying and describing the mathematical properties of an object","\"List everything you know about this shape: sides, angles, symmetry.\""]},{"en":["TWM.06 Classifying","Organising objects into groups according to their mathematical properties","\"Sort these twelve shapes into groups. What rule did you use? Find another rule.\""],"ar":["TWM.06 Classifying","Organising objects into groups according to their mathematical properties","\"Sort these twelve shapes into groups. What rule did you use? Find another rule.\""]},{"en":["TWM.07 Critiquing","Comparing and evaluating mathematical ideas, representations or solutions to identify advantages and disadvantages","\"Here are two ways to show the data. What does each do well? What does each hide?\""],"ar":["TWM.07 Critiquing","Comparing and evaluating mathematical ideas, representations or solutions to identify advantages and disadvantages","\"Here are two ways to show the data. What does each do well? What does each hide?\""]},{"en":["TWM.08 Improving","Refining mathematical ideas or representations to develop a more effective approach or solution","\"How could you make this solution shorter, clearer or more accurate?\""],"ar":["TWM.08 Improving","Refining mathematical ideas or representations to develop a more effective approach or solution","\"How could you make this solution shorter, clearer or more accurate?\""]}]},{"t":"p","c":{"en":"The framework adds that all of the characteristics are based on extensive research by Professor John Mason. It also says mental strategies are important and at the core of developing understanding, but the curriculum does not require learners to follow or practise specific strategies. Learners should have ownership over the mental strategies they choose to develop. In practice, this means you should not insist that every pupil uses one named mental method.","ar":"The framework adds that all of the characteristics are based on extensive research by Professor John Mason. It also says mental strategies are important and at the core of developing understanding, but the curriculum does not require learners to follow or practise specific strategies. Learners should have ownership over the mental strategies they choose to develop. In practice, this means you should not insist that every pupil uses one named mental method."}},{"t":"h","c":{"en":"How the objectives use TWM","ar":"How the objectives use TWM"}},{"t":"p","c":{"en":"In the framework's lists for Stage 7, Stage 8 and Stage 9, the TWM section comes first. It lists TWM.01 to TWM.08 with only the names of the characteristics, and the same eight appear at every stage. The framework gives no separate wording for each stage. This tells you something important: TWM does not get \"harder\" by changing the list. It grows because the mathematics that pupils specialise, generalise, convince and improve becomes more advanced.","ar":"In the framework's lists for Stage 7, Stage 8 and Stage 9, the TWM section comes first. It lists TWM.01 to TWM.08 with only the names of the characteristics, and the same eight appear at every stage. The framework gives no separate wording for each stage. This tells you something important: TWM does not get \"harder\" by changing the list. It grows because the mathematics that pupils specialise, generalise, convince and improve becomes more advanced."}},{"t":"p","c":{"en":"You can see the connection to the content objectives in their verbs. Some objective wording matches the TWM language directly. For example, 7Ni.01 asks pupils to estimate, add and subtract integers \"recognising generalisations\" (Generalising). 7Gp.04 and 7Gp.05 ask pupils to recognise that the image is congruent to the object after a reflection or a rotation (Convincing and Generalising). 8Gg.01 asks pupils to identify and describe the hierarchy of quadrilaterals (Characterising and Classifying). 7Ss.04 asks pupils to choose and explain which of mode, median, mean and range is most appropriate (Critiquing). 9Gp.05 asks pupils to recognise and explain that images are congruent after any combination of transformations (Convincing). The mapping is your professional judgement. The framework does not label each objective with a TWM number.","ar":"You can see the connection to the content objectives in their verbs. Some objective wording matches the TWM language directly. For example, 7Ni.01 asks pupils to estimate, add and subtract integers \"recognising generalisations\" (Generalising). 7Gp.04 and 7Gp.05 ask pupils to recognise that the image is congruent to the object after a reflection or a rotation (Convincing and Generalising). 8Gg.01 asks pupils to identify and describe the hierarchy of quadrilaterals (Characterising and Classifying). 7Ss.04 asks pupils to choose and explain which of mode, median, mean and range is most appropriate (Critiquing). 9Gp.05 asks pupils to recognise and explain that images are congruent after any combination of transformations (Convincing). The mapping is your professional judgement. The framework does not label each objective with a TWM number."}},{"t":"callout","k":"tip","title":{"en":"Plan TWM into the task, not onto the end of it","ar":"Plan TWM into the task, not onto the end of it"},"c":{"en":"Do not add one \"TWM question\" at the end of an exercise. Choose a task where the thinking is the work. For example, ask \"Which of these four fractions is equal to a terminating decimal? How can you tell without dividing?\" This one question uses specialising, conjecturing and convincing, and it fits 9Nf.01.","ar":"Do not add one \"TWM question\" at the end of an exercise. Choose a task where the thinking is the work. For example, ask \"Which of these four fractions is equal to a terminating decimal? How can you tell without dividing?\" This one question uses specialising, conjecturing and convincing, and it fits 9Nf.01."}},{"t":"h","c":{"en":"Examples across Stages 7, 8 and 9","ar":"Examples across Stages 7, 8 and 9"}},{"t":"p","c":{"en":"The table gives one example task for each stage. Each is linked to a real objective from the framework. The tasks are good practice. You can adapt them for pupils who are learning in a second language by supplying sentence starters and a word bank.","ar":"The table gives one example task for each stage. Each is linked to a real objective from the framework. The tasks are good practice. You can adapt them for pupils who are learning in a second language by supplying sentence starters and a word bank."}},{"t":"table","head":{"en":["Stage and objective","Main TWM characteristics","Example task (good practice)","Language support for ESL pupils"],"ar":["Stage and objective","Main TWM characteristics","Example task (good practice)","Language support for ESL pupils"]},"rows":[{"en":["Stage 7: 7Ni.03, multiply and divide integers including where one is negative","Specialising, Generalising, Convincing","Pupils work out ten products of a positive and a negative integer, then write a rule and test it with new examples","\"The product of a positive and a negative number is ... because ...\""],"ar":["Stage 7: 7Ni.03, multiply and divide integers including where one is negative","Specialising, Generalising, Convincing","Pupils work out ten products of a positive and a negative integer, then write a rule and test it with new examples","\"The product of a positive and a negative number is ... because ...\""]},{"en":["Stage 8: 8Gg.01, the hierarchy of quadrilaterals","Characterising, Classifying, Convincing","Pupils sort a set of quadrilaterals, then decide whether \"every square is a rectangle\" is true and justify it","\"A square is a rectangle because it has ...\""],"ar":["Stage 8: 8Gg.01, the hierarchy of quadrilaterals","Characterising, Classifying, Convincing","Pupils sort a set of quadrilaterals, then decide whether \"every square is a rectangle\" is true and justify it","\"A square is a rectangle because it has ...\""]},{"en":["Stage 9: 9Ae.06, simultaneous linear equations","Critiquing, Improving, Convincing","Pupils solve one pair by elimination and by graph, compare the two methods and say which suits which pair","\"The graph method is ... but elimination is ... when ...\""],"ar":["Stage 9: 9Ae.06, simultaneous linear equations","Critiquing, Improving, Convincing","Pupils solve one pair by elimination and by graph, compare the two methods and say which suits which pair","\"The graph method is ... but elimination is ... when ...\""]}]},{"t":"scenario","title":{"en":"Mini-case: a conjecture in Year 8","ar":"Mini-case: a conjecture in Year 8"},"c":{"en":"While studying 8Ni.07 (positive and negative cube numbers and their cube roots), a pupil says: \"A negative number cubed is always negative.\" This is a conjecture (TWM.03). The teacher asks the class to test it with four examples, including one where the number is a fraction (specialising). Then the class writes a sentence that covers all negative numbers (generalising) and one pupil gives a reason using the sign rules for multiplication (convincing). The teacher has not added any new content. The same objective now involves four TWM characteristics.","ar":"While studying 8Ni.07 (positive and negative cube numbers and their cube roots), a pupil says: \"A negative number cubed is always negative.\" This is a conjecture (TWM.03). The teacher asks the class to test it with four examples, including one where the number is a fraction (specialising). Then the class writes a sentence that covers all negative numbers (generalising) and one pupil gives a reason using the sign rules for multiplication (convincing). The teacher has not added any new content. The same objective now involves four TWM characteristics."}},{"t":"scenario","title":{"en":"A pupil challenges a classmate","ar":"A pupil challenges a classmate"},"c":{"en":"In Year 9, a pupil writes \"x/2 + x/3 = x/5\" as a step, because \"you add the tops and add the bottoms.\" A partner says: \"Try x = 6.\" The pupils check: 3 + 2 = 5 on the left, but 6/5 on the right. This is specialising (choosing an example) and convincing (using evidence to challenge a solution). The first pupil then improves the method. The teacher did not need a special lesson. A well-timed question did the work. If you want a rule of thumb for planning, ask: \"Where in this lesson will pupils have to give a reason, not only an answer?\"","ar":"In Year 9, a pupil writes \"x/2 + x/3 = x/5\" as a step, because \"you add the tops and add the bottoms.\" A partner says: \"Try x = 6.\" The pupils check: 3 + 2 = 5 on the left, but 6/5 on the right. This is specialising (choosing an example) and convincing (using evidence to challenge a solution). The first pupil then improves the method. The teacher did not need a special lesson. A well-timed question did the work. If you want a rule of thumb for planning, ask: \"Where in this lesson will pupils have to give a reason, not only an answer?\""}},{"t":"callout","k":"warn","title":{"en":"Common mistake: TWM as a worksheet","ar":"Common mistake: TWM as a worksheet"},"c":{"en":"Teachers sometimes make a separate \"problem-solving Friday\" and call it TWM. The framework says TWM should not be taught as a separate special activity. A weekly investigation is fine as good practice, but TWM must also appear inside normal lessons on Number, Algebra, Geometry and Measure, and Statistics and Probability.","ar":"Teachers sometimes make a separate \"problem-solving Friday\" and call it TWM. The framework says TWM should not be taught as a separate special activity. A weekly investigation is fine as good practice, but TWM must also appear inside normal lessons on Number, Algebra, Geometry and Measure, and Statistics and Probability."}}],"checks":[{"id":"m4q1","q":{"en":"Which definition matches Conjecturing in the framework?","ar":"Which definition matches Conjecturing in the framework?"},"opts":[{"en":"Presenting evidence to justify or challenge a mathematical idea","ar":"Presenting evidence to justify or challenge a mathematical idea"},{"en":"Forming mathematical questions or ideas","ar":"Forming mathematical questions or ideas"},{"en":"Organising objects into groups according to their mathematical properties","ar":"Organising objects into groups according to their mathematical properties"},{"en":"Refining ideas to develop a more effective approach or solution","ar":"Refining ideas to develop a more effective approach or solution"}],"correct":1,"expl":{"en":"The framework defines Conjecturing as forming mathematical questions or ideas. Convincing is about evidence, Classifying is about groups and Improving is about refining.","ar":"The framework defines Conjecturing as forming mathematical questions or ideas. Convincing is about evidence, Classifying is about groups and Improving is about refining."}},{"id":"m4q2","q":{"en":"How does the framework say Thinking and Working Mathematically should be taught?","ar":"How does the framework say Thinking and Working Mathematically should be taught?"},"opts":[{"en":"It should be taught in a separate weekly lesson, after the main strands are finished in each stage","ar":"It should be taught in a separate weekly lesson, after the main strands are finished in each stage"},{"en":"It should be taught only to the highest-attaining pupils, as an extension to the objectives","ar":"It should be taught only to the highest-attaining pupils, as an extension to the objectives"},{"en":"It should be embedded throughout the curriculum and not taught as a separate special activity","ar":"It should be embedded throughout the curriculum and not taught as a separate special activity"},{"en":"It should be taught in Stage 9 only, to prepare pupils for the Checkpoint papers","ar":"It should be taught in Stage 9 only, to prepare pupils for the Checkpoint papers"}],"correct":2,"expl":{"en":"The framework says TWM should not be taught as a separate special activity but embedded throughout the curriculum, and that its characteristics should be integrated into the other strands.","ar":"The framework says TWM should not be taught as a separate special activity but embedded throughout the curriculum, and that its characteristics should be integrated into the other strands."}},{"id":"m4q3","q":{"en":"A pupil tests several examples, notices a pattern and states a rule for all cases. Which pair of characteristics is mainly being used?","ar":"A pupil tests several examples, notices a pattern and states a rule for all cases. Which pair of characteristics is mainly being used?"},"opts":[{"en":"Characterising and Classifying","ar":"Characterising and Classifying"},{"en":"Critiquing and Improving","ar":"Critiquing and Improving"},{"en":"Conjecturing and Classifying","ar":"Conjecturing and Classifying"},{"en":"Specialising and Generalising","ar":"Specialising and Generalising"}],"correct":3,"expl":{"en":"Specialising means choosing examples and checking them. Generalising means recognising a pattern from many examples that meet the same criteria. They form one of the four pairs.","ar":"Specialising means choosing examples and checking them. Generalising means recognising a pattern from many examples that meet the same criteria. They form one of the four pairs."}}]},{"id":"m5","title":{"en":"Number Across Stages 7, 8 and 9","ar":"Number Across Stages 7, 8 and 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework calls Number \"the foundation of the mathematics curriculum\". Learners explore the number system, build calculation skills for increasingly complex calculations, and then apply those skills in the other strands. This module follows the three Number sub-strands across Stages 7 to 9: Integers, powers and roots (Ni); Place value, ordering and rounding (Np); and Fractions, decimals, percentages, ratio and proportion (Nf). It uses short paraphrases. For the full wording of any objective, read the framework itself.","ar":"The framework calls Number \"the foundation of the mathematics curriculum\". Learners explore the number system, build calculation skills for increasingly complex calculations, and then apply those skills in the other strands. This module follows the three Number sub-strands across Stages 7 to 9: Integers, powers and roots (Ni); Place value, ordering and rounding (Np); and Fractions, decimals, percentages, ratio and proportion (Nf). It uses short paraphrases. For the full wording of any objective, read the framework itself."}},{"t":"h","c":{"en":"What the framework says about the Number strand","ar":"What the framework says about the Number strand"}},{"t":"p","c":{"en":"The strand description says that learners discover the differences between rational and irrational numbers. They learn concepts such as lowest common multiple and highest common factor, direct and inverse proportion, and indices. They round to a given number of decimal places or significant figures, and use rounding to find upper and lower limits. They explore terminating and recurring decimals and their link to fractions and percentages. They use the laws of arithmetic, order of operations, inverse operations and equivalence to simplify calculations. The framework adds that learners \"are encouraged to use mental strategies to estimate before formally calculating answers.\"","ar":"The strand description says that learners discover the differences between rational and irrational numbers. They learn concepts such as lowest common multiple and highest common factor, direct and inverse proportion, and indices. They round to a given number of decimal places or significant figures, and use rounding to find upper and lower limits. They explore terminating and recurring decimals and their link to fractions and percentages. They use the laws of arithmetic, order of operations, inverse operations and equivalence to simplify calculations. The framework adds that learners \"are encouraged to use mental strategies to estimate before formally calculating answers.\""}},{"t":"p","c":{"en":"The word \u003cem>estimate\u003c/em> is worth noticing. It appears in many Number objectives, for example 7Ni.01, 7Nf.02, 8Nf.07 and 9Nf.02. The framework wants pupils to judge whether an answer is sensible, not only to produce one.","ar":"The word \u003cem>estimate\u003c/em> is worth noticing. It appears in many Number objectives, for example 7Ni.01, 7Nf.02, 8Nf.07 and 9Nf.02. The framework wants pupils to judge whether an answer is sensible, not only to produce one."}},{"t":"h","c":{"en":"Integers, powers and roots (Ni)","ar":"Integers, powers and roots (Ni)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Operations with integers","7Ni.01 estimate, add and subtract integers, recognising generalisations; 7Ni.03 multiply and divide, including one negative integer","8Ni.02 estimate, multiply and divide integers, recognising generalisations","Not listed again as a separate integer objective in the Stage 9 Ni list"],"ar":["Operations with integers","7Ni.01 estimate, add and subtract integers, recognising generalisations; 7Ni.03 multiply and divide, including one negative integer","8Ni.02 estimate, multiply and divide integers, recognising generalisations","Not listed again as a separate integer objective in the Stage 9 Ni list"]},{"en":["Order of operations","7Ni.02 brackets, positive indices and operations follow an order","8Ni.01 brackets, indices (square and cube roots) and operations follow an order","Order of operations appears in other objectives, such as 9Nf.04 and 9Ae.01"],"ar":["Order of operations","7Ni.02 brackets, positive indices and operations follow an order","8Ni.01 brackets, indices (square and cube roots) and operations follow an order","Order of operations appears in other objectives, such as 9Nf.04 and 9Ae.01"]},{"en":["Factors and multiples","7Ni.04 LCM and HCF (numbers less than 100); 7Ni.05 tests of divisibility for numbers greater than 100","8Ni.03 factors, multiples, prime factors, HCF and LCM","No separate Ni objective; used in algebraic and fraction work"],"ar":["Factors and multiples","7Ni.04 LCM and HCF (numbers less than 100); 7Ni.05 tests of divisibility for numbers greater than 100","8Ni.03 factors, multiples, prime factors, HCF and LCM","No separate Ni objective; used in algebraic and fraction work"]},{"en":["Squares, cubes and roots","7Ni.06 relationship between squares and square roots, cubes and cube roots","8Ni.06 squares of negative and positive numbers; 8Ni.07 positive and negative cube numbers and roots","9Ni.04 use square and cube roots to estimate surds"],"ar":["Squares, cubes and roots","7Ni.06 relationship between squares and square roots, cubes and cube roots","8Ni.06 squares of negative and positive numbers; 8Ni.07 positive and negative cube numbers and roots","9Ni.04 use square and cube roots to estimate surds"]},{"en":["Types of number","Not a separate Stage 7 objective","8Ni.04 hierarchy of natural numbers, integers and rational numbers","9Ni.01 difference between rational and irrational numbers"],"ar":["Types of number","Not a separate Stage 7 objective","8Ni.04 hierarchy of natural numbers, integers and rational numbers","9Ni.01 difference between rational and irrational numbers"]},{"en":["Indices","7Ni.02 includes positive indices in order of operations","8Ni.05 positive and zero indices; index laws for multiplication and division","9Ni.02 positive, negative and zero indices and the index laws; 9Ni.03 standard form"],"ar":["Indices","7Ni.02 includes positive indices in order of operations","8Ni.05 positive and zero indices; index laws for multiplication and division","9Ni.02 positive, negative and zero indices and the index laws; 9Ni.03 standard form"]}]},{"t":"p","c":{"en":"Read across a row to see progression. Look at \"Types of number\". Stage 8 builds a hierarchy (natural numbers, integers, rational numbers). Stage 9 then adds the difference between rational and irrational numbers, and uses square and cube roots to estimate surds. The glossary says a surd is an irrational number whose value cannot be precisely determined, for example an infinite recurring decimal such as √2. Without the Stage 8 hierarchy, the Stage 9 idea has nothing to attach to.","ar":"Read across a row to see progression. Look at \"Types of number\". Stage 8 builds a hierarchy (natural numbers, integers, rational numbers). Stage 9 then adds the difference between rational and irrational numbers, and uses square and cube roots to estimate surds. The glossary says a surd is an irrational number whose value cannot be precisely determined, for example an infinite recurring decimal such as √2. Without the Stage 8 hierarchy, the Stage 9 idea has nothing to attach to."}},{"t":"h","c":{"en":"Place value, ordering and rounding (Np)","ar":"Place value, ordering and rounding (Np)"}},{"t":"p","c":{"en":"This sub-strand is small, with two objectives in each stage, but it is used in nearly every other part of the framework.","ar":"This sub-strand is small, with two objectives in each stage, but it is used in nearly every other part of the framework."}},{"t":"table","head":{"en":["Stage","Place value (first objective)","Rounding (second objective)"],"ar":["Stage","Place value (first objective)","Rounding (second objective)"]},"rows":[{"en":["Stage 7","7Np.01 multiply and divide whole numbers and decimals by any positive power of 10","7Np.02 round numbers to a given number of decimal places"],"ar":["Stage 7","7Np.01 multiply and divide whole numbers and decimals by any positive power of 10","7Np.02 round numbers to a given number of decimal places"]},{"en":["Stage 8","8Np.01 multiply and divide integers and decimals by 0.1 and 0.01","8Np.02 round numbers to a given number of significant figures"],"ar":["Stage 8","8Np.01 multiply and divide integers and decimals by 0.1 and 0.01","8Np.02 round numbers to a given number of significant figures"]},{"en":["Stage 9","9Np.01 multiply and divide integers and decimals by 10 to the power of any positive or negative number","9Np.02 when a number is rounded, there are upper and lower limits for the original number"],"ar":["Stage 9","9Np.01 multiply and divide integers and decimals by 10 to the power of any positive or negative number","9Np.02 when a number is rounded, there are upper and lower limits for the original number"]}]},{"t":"callout","k":"tip","title":{"en":"Notice the pattern of growth","ar":"Notice the pattern of growth"},"c":{"en":"Each Np objective widens the same idea: from powers of 10 (Stage 7), to 0.1 and 0.01 (Stage 8), to negative powers of 10 (Stage 9). Rounding moves from decimal places, to significant figures, to the limits of rounded numbers. Naming this pattern for your class helps pupils see that \"new\" content is often the old idea extended.","ar":"Each Np objective widens the same idea: from powers of 10 (Stage 7), to 0.1 and 0.01 (Stage 8), to negative powers of 10 (Stage 9). Rounding moves from decimal places, to significant figures, to the limits of rounded numbers. Naming this pattern for your class helps pupils see that \"new\" content is often the old idea extended."}},{"t":"h","c":{"en":"Fractions, decimals, percentages, ratio and proportion (Nf)","ar":"Fractions, decimals, percentages, ratio and proportion (Nf)"}},{"t":"p","c":{"en":"This is the largest Number sub-strand: eleven objectives in Stages 7 and 8, and eight in Stage 9. The table groups the objectives by topic, not by number.","ar":"This is the largest Number sub-strand: eleven objectives in Stages 7 and 8, and eight in Stage 9. The table groups the objectives by topic, not by number."}},{"t":"table","head":{"en":["Topic","Stage 7","Stage 8","Stage 9"],"ar":["Topic","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Equivalence of fractions, decimals and percentages","7Nf.01 equivalent values of fractions, terminating decimals and percentages","8Nf.01 fractions equivalent to recurring decimals","9Nf.01 deduce whether a fraction has a recurring or terminating decimal"],"ar":["Equivalence of fractions, decimals and percentages","7Nf.01 equivalent values of fractions, terminating decimals and percentages","8Nf.01 fractions equivalent to recurring decimals","9Nf.01 deduce whether a fraction has a recurring or terminating decimal"]},{"en":["Fraction calculation","7Nf.02 estimate and add mixed numbers; 7Nf.03 multiply and divide proper fractions","8Nf.02 subtract mixed numbers; 8Nf.03 multiply an integer by a mixed number and divide an integer by a proper fraction","9Nf.02 add and subtract proper and improper fractions and mixed numbers; 9Nf.03 multiply and divide fractions, cancel common factors"],"ar":["Fraction calculation","7Nf.02 estimate and add mixed numbers; 7Nf.03 multiply and divide proper fractions","8Nf.02 subtract mixed numbers; 8Nf.03 multiply an integer by a mixed number and divide an integer by a proper fraction","9Nf.02 add and subtract proper and improper fractions and mixed numbers; 9Nf.03 multiply and divide fractions, cancel common factors"]},{"en":["Decimal calculation","7Nf.07 add and subtract positive and negative numbers with decimals; 7Nf.08 multiply and divide decimals by whole numbers","8Nf.07 multiply decimals by integers and decimals; 8Nf.08 divide decimals by numbers with one decimal place","9Nf.06 multiply and divide decimals by integers and decimals"],"ar":["Decimal calculation","7Nf.07 add and subtract positive and negative numbers with decimals; 7Nf.08 multiply and divide decimals by whole numbers","8Nf.07 multiply decimals by integers and decimals; 8Nf.08 divide decimals by numbers with one decimal place","9Nf.06 multiply and divide decimals by integers and decimals"]},{"en":["Percentages","7Nf.05 percentages of shapes and whole numbers, including less than 1 or more than 100","8Nf.05 percentage increase and decrease, and absolute change","9Nf.05 compound percentages"],"ar":["Percentages","7Nf.05 percentages of shapes and whole numbers, including less than 1 or more than 100","8Nf.05 percentage increase and decrease, and absolute change","9Nf.05 compound percentages"]},{"en":["Ratio and proportion","7Nf.09 unitary method, ratio and direct proportion; 7Nf.10 simplify and compare ratios (same units); 7Nf.11 divide an amount in a two-part ratio","8Nf.09 relationship between ratio and direct proportion; 8Nf.10 ratios with different units; 8Nf.11 divide an amount in a ratio with two or more parts","9Nf.07 direct and inverse proportion; 9Nf.08 ratios and equivalence in a range of contexts"],"ar":["Ratio and proportion","7Nf.09 unitary method, ratio and direct proportion; 7Nf.10 simplify and compare ratios (same units); 7Nf.11 divide an amount in a two-part ratio","8Nf.09 relationship between ratio and direct proportion; 8Nf.10 ratios with different units; 8Nf.11 divide an amount in a ratio with two or more parts","9Nf.07 direct and inverse proportion; 9Nf.08 ratios and equivalence in a range of contexts"]},{"en":["Simplifying and comparing","7Nf.04 and 7Nf.06 (common factors, laws of arithmetic; compare and order using =, ≠, > and \u003c)","8Nf.04 and 8Nf.06 (brackets; positive and negative, adds ≤ and ≥)","9Nf.04 (inverse operations, equivalence, brackets and indices)"],"ar":["Simplifying and comparing","7Nf.04 and 7Nf.06 (common factors, laws of arithmetic; compare and order using =, ≠, > and \u003c)","8Nf.04 and 8Nf.06 (brackets; positive and negative, adds ≤ and ≥)","9Nf.04 (inverse operations, equivalence, brackets and indices)"]}]},{"t":"p","c":{"en":"Two details show how carefully the framework builds. First, the symbols in comparison objectives grow: =, ≠, > and \u003c at Stage 7; ≤ and ≥ are added at Stage 8 (8Nf.06). Second, the ratio objectives move from the same units (7Nf.10) to different units (8Nf.10), and from two-part ratios (7Nf.11) to two or more parts (8Nf.11).","ar":"Two details show how carefully the framework builds. First, the symbols in comparison objectives grow: =, ≠, > and \u003c at Stage 7; ≤ and ≥ are added at Stage 8 (8Nf.06). Second, the ratio objectives move from the same units (7Nf.10) to different units (8Nf.10), and from two-part ratios (7Nf.11) to two or more parts (8Nf.11)."}},{"t":"scenario","title":{"en":"A Year 9 pupil makes a Stage 7 mistake","ar":"A Year 9 pupil makes a Stage 7 mistake"},"c":{"en":"A Year 9 pupil is asked to find 15% of 80 and says \"15 divided by 80\". The teacher suspects a gap in the Stage 7 idea of percentages (7Nf.01, 7Nf.05). Instead of re-teaching the full Stage 9 topic of compound percentages (9Nf.05), the teacher spends ten minutes on equivalence: 15% = 15/100 = 0.15, so 15% of 80 is 0.15 × 80. The framework says all objectives provide clear progression from the previous stage, so a quick look back is part of normal teaching. It does not mean the pupil has \"failed\" Stage 9.","ar":"A Year 9 pupil is asked to find 15% of 80 and says \"15 divided by 80\". The teacher suspects a gap in the Stage 7 idea of percentages (7Nf.01, 7Nf.05). Instead of re-teaching the full Stage 9 topic of compound percentages (9Nf.05), the teacher spends ten minutes on equivalence: 15% = 15/100 = 0.15, so 15% of 80 is 0.15 × 80. The framework says all objectives provide clear progression from the previous stage, so a quick look back is part of normal teaching. It does not mean the pupil has \"failed\" Stage 9."}},{"t":"scenario","title":{"en":"ESL vocabulary in Number","ar":"ESL vocabulary in Number"},"c":{"en":"Words such as \"of\", \"per\", \"to\" and \"more than\" cause confusion in ratio and percentage problems. A teacher of a Year 8 class of 27 ESL pupils creates a small word bank with a picture or example for each: \"ratio 2 to 3\", \"40% of 50\", \"percentage decrease\". Pupils add their own language notes. This is good practice for 8Nf.05 and 8Nf.11. It adds no new content, but it removes a language barrier that could be mistaken for a maths gap.","ar":"Words such as \"of\", \"per\", \"to\" and \"more than\" cause confusion in ratio and percentage problems. A teacher of a Year 8 class of 27 ESL pupils creates a small word bank with a picture or example for each: \"ratio 2 to 3\", \"40% of 50\", \"percentage decrease\". Pupils add their own language notes. This is good practice for 8Nf.05 and 8Nf.11. It adds no new content, but it removes a language barrier that could be mistaken for a maths gap."}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"Number moves from calculation with whole numbers, decimals and simple fractions (Stage 7), to a wider set of numbers and operations (Stage 8: rational numbers, indices, significant figures, percentage change), to structure and limits (Stage 9: irrational numbers, standard form, compound percentages, inverse proportion). Estimation runs through all three stages.","ar":"Number moves from calculation with whole numbers, decimals and simple fractions (Stage 7), to a wider set of numbers and operations (Stage 8: rational numbers, indices, significant figures, percentage change), to structure and limits (Stage 9: irrational numbers, standard form, compound percentages, inverse proportion). Estimation runs through all three stages."}}],"checks":[{"id":"m5q1","q":{"en":"In which stage does the framework first list the difference between rational and irrational numbers?","ar":"In which stage does the framework first list the difference between rational and irrational numbers?"},"opts":[{"en":"Stage 9, in 9Ni.01, after the hierarchy of natural numbers, integers and rational numbers in Stage 8","ar":"Stage 9, in 9Ni.01, after the hierarchy of natural numbers, integers and rational numbers in Stage 8"},{"en":"Stage 7, in 7Ni.01, together with estimating and adding integers in the same objective of the stage","ar":"Stage 7, in 7Ni.01, together with estimating and adding integers in the same objective of the stage"},{"en":"Stage 8, in 8Ni.04, where irrational numbers are placed in the hierarchy as well","ar":"Stage 8, in 8Ni.04, where irrational numbers are placed in the hierarchy as well"},{"en":"Stage 9, in 9Np.02, where limits of rounded numbers are used to find irrational values","ar":"Stage 9, in 9Np.02, where limits of rounded numbers are used to find irrational values"}],"correct":0,"expl":{"en":"9Ni.01 covers the difference between rational and irrational numbers. 8Ni.04 covers the hierarchy of natural numbers, integers and rational numbers.","ar":"9Ni.01 covers the difference between rational and irrational numbers. 8Ni.04 covers the hierarchy of natural numbers, integers and rational numbers."}},{"id":"m5q2","q":{"en":"A Year 8 teacher plans rounding to significant figures. Which code should appear in the plan?","ar":"A Year 8 teacher plans rounding to significant figures. Which code should appear in the plan?"},"opts":[{"en":"7Np.02","ar":"7Np.02"},{"en":"8Np.02","ar":"8Np.02"},{"en":"9Np.02","ar":"9Np.02"},{"en":"8Ni.02","ar":"8Ni.02"}],"correct":1,"expl":{"en":"8Np.02 is rounding to a given number of significant figures. 7Np.02 is decimal places and 9Np.02 is upper and lower limits. 8Ni.02 is about multiplying and dividing integers.","ar":"8Np.02 is rounding to a given number of significant figures. 7Np.02 is decimal places and 9Np.02 is upper and lower limits. 8Ni.02 is about multiplying and dividing integers."}},{"id":"m5q3","q":{"en":"Which sequence shows how percentage objectives develop across the stages?","ar":"Which sequence shows how percentage objectives develop across the stages?"},"opts":[{"en":"Stage 7: compound percentages; Stage 8: percentages of shapes; Stage 9: increase and decrease","ar":"Stage 7: compound percentages; Stage 8: percentages of shapes; Stage 9: increase and decrease"},{"en":"Stage 7: increase and decrease; Stage 8: compound percentages; Stage 9: percentages of shapes","ar":"Stage 7: increase and decrease; Stage 8: compound percentages; Stage 9: percentages of shapes"},{"en":"Stage 7: percentages of shapes and numbers; Stage 8: increase, decrease and absolute change; Stage 9: compound percentages","ar":"Stage 7: percentages of shapes and numbers; Stage 8: increase, decrease and absolute change; Stage 9: compound percentages"},{"en":"Stage 7: no percentages; Stage 8: percentages of shapes; Stage 9: increase and decrease","ar":"Stage 7: no percentages; Stage 8: percentages of shapes; Stage 9: increase and decrease"}],"correct":2,"expl":{"en":"The framework lists 7Nf.05 (percentages of shapes and whole numbers), 8Nf.05 (percentage increase, decrease and absolute change) and 9Nf.05 (compound percentages).","ar":"The framework lists 7Nf.05 (percentages of shapes and whole numbers), 8Nf.05 (percentage increase, decrease and absolute change) and 9Nf.05 (compound percentages)."}}]},{"id":"m6","title":{"en":"Algebra Across Stages 7, 8 and 9","ar":"Algebra Across Stages 7, 8 and 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"In Cambridge Lower Secondary Mathematics 0862, Algebra is one of the four strands. It has two sub-strands: Expressions, equations and formulae (Ae), and Sequences, functions and graphs (As). Each stage has seven objectives in each sub-strand, so 14 Algebra objectives per stage. This regular shape makes Algebra easy to compare across Stages 7, 8 and 9. In this module you will see what the framework says about the strand, read the sub-strands side by side, and meet common misconceptions.","ar":"In Cambridge Lower Secondary Mathematics 0862, Algebra is one of the four strands. It has two sub-strands: Expressions, equations and formulae (Ae), and Sequences, functions and graphs (As). Each stage has seven objectives in each sub-strand, so 14 Algebra objectives per stage. This regular shape makes Algebra easy to compare across Stages 7, 8 and 9. In this module you will see what the framework says about the strand, read the sub-strands side by side, and meet common misconceptions."}},{"t":"h","c":{"en":"What the framework says about the Algebra strand","ar":"What the framework says about the Algebra strand"}},{"t":"p","c":{"en":"The framework says the Algebra strand \"builds on pre-algebra concepts in the primary stages to strengthen learners' reasoning and their ability to find and generalise patterns and rules\". Learners use algebra and graphical techniques to describe and model mathematical relationships and to solve real-life problems. The strand description says learners use mathematical language to discuss the differences between expressions, formulae and equations. They explore term-to-term and nth term rules of numerical and spatial patterns, and linear and quadratic sequences. They are introduced to linear and simple quadratic functions, and graph functions on the Cartesian plane. They also use algebra and graphs to find solutions to simultaneous equations and inequalities.","ar":"The framework says the Algebra strand \"builds on pre-algebra concepts in the primary stages to strengthen learners' reasoning and their ability to find and generalise patterns and rules\". Learners use algebra and graphical techniques to describe and model mathematical relationships and to solve real-life problems. The strand description says learners use mathematical language to discuss the differences between expressions, formulae and equations. They explore term-to-term and nth term rules of numerical and spatial patterns, and linear and quadratic sequences. They are introduced to linear and simple quadratic functions, and graph functions on the Cartesian plane. They also use algebra and graphs to find solutions to simultaneous equations and inequalities."}},{"t":"p","c":{"en":"Notice how many of these sentences use the word \u003cem>represent\u003c/em> or \u003cem>move between\u003c/em>. Many objectives in the Ae sub-strand use the same sentence frame: \"Understand that a situation can be represented either in words or as ...\" (an algebraic expression, a formula, an equation or an inequality). This is the heart of the strand: pupils translate between words and symbols.","ar":"Notice how many of these sentences use the word \u003cem>represent\u003c/em> or \u003cem>move between\u003c/em>. Many objectives in the Ae sub-strand use the same sentence frame: \"Understand that a situation can be represented either in words or as ...\" (an algebraic expression, a formula, an equation or an inequality). This is the heart of the strand: pupils translate between words and symbols."}},{"t":"h","c":{"en":"Expressions, equations and formulae (Ae)","ar":"Expressions, equations and formulae (Ae)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Meaning of letters","7Ae.01 letters represent unknown numbers, variables or constants","8Ae.01 letters have different meanings in expressions, formulae and equations","Built on in 9Ae.03 to 9Ae.07"],"ar":["Meaning of letters","7Ae.01 letters represent unknown numbers, variables or constants","8Ae.01 letters have different meanings in expressions, formulae and equations","Built on in 9Ae.03 to 9Ae.07"]},{"en":["Laws of arithmetic and order of operations","7Ae.02 apply to algebraic terms (four operations)","8Ae.02 also squares and cubes","9Ae.01 also integer powers"],"ar":["Laws of arithmetic and order of operations","7Ae.02 apply to algebraic terms (four operations)","8Ae.02 also squares and cubes","9Ae.01 also integer powers"]},{"en":["Manipulating expressions","7Ae.03 collect like terms; distributive law with a constant","8Ae.03 distributive law with a single term (squares and cubes); factorise using the highest common factor","9Ae.02 expand the product of two expressions; laws of indices; simplify algebraic fractions"],"ar":["Manipulating expressions","7Ae.03 collect like terms; distributive law with a constant","8Ae.03 distributive law with a single term (squares and cubes); factorise using the highest common factor","9Ae.02 expand the product of two expressions; laws of indices; simplify algebraic fractions"]},{"en":["Words to expression","7Ae.04 linear, integer coefficients","8Ae.04 linear, integer or fractional coefficients","9Ae.03 including squares, cubes and roots"],"ar":["Words to expression","7Ae.04 linear, integer coefficients","8Ae.04 linear, integer or fractional coefficients","9Ae.03 including squares, cubes and roots"]},{"en":["Words to formula","7Ae.05 single operation","8Ae.05 mixed operations; change the subject of a formula","9Ae.04 including squares and cubes; change the subject"],"ar":["Words to formula","7Ae.05 single operation","8Ae.05 mixed operations; change the subject of a formula","9Ae.04 including squares and cubes; change the subject"]},{"en":["Words to equation","7Ae.06 solve with integer coefficients, unknown on one side","8Ae.06 integer or fractional coefficients, unknown on either or both sides","9Ae.05 including an unknown in the denominator"],"ar":["Words to equation","7Ae.06 solve with integer coefficients, unknown on one side","8Ae.06 integer or fractional coefficients, unknown on either or both sides","9Ae.05 including an unknown in the denominator"]},{"en":["New in the stage","7Ae.07 letters can represent an open interval (one term)","8Ae.07 open and closed intervals (two terms)","9Ae.06 simultaneous linear equations; 9Ae.07 solve linear inequalities"],"ar":["New in the stage","7Ae.07 letters can represent an open interval (one term)","8Ae.07 open and closed intervals (two terms)","9Ae.06 simultaneous linear equations; 9Ae.07 solve linear inequalities"]}]},{"t":"callout","k":"tip","title":{"en":"Spot the repeating frame","ar":"Spot the repeating frame"},"c":{"en":"The \"words to expression, formula, equation\" objectives repeat in every stage, with extra detail in brackets. The brackets are the progression. For example, 7Ae.06 says \"unknown on one side\", 8Ae.06 says \"unknown on either or both sides\", and 9Ae.05 adds \"an unknown in the denominator\". When you plan, read the brackets first.","ar":"The \"words to expression, formula, equation\" objectives repeat in every stage, with extra detail in brackets. The brackets are the progression. For example, 7Ae.06 says \"unknown on one side\", 8Ae.06 says \"unknown on either or both sides\", and 9Ae.05 adds \"an unknown in the denominator\". When you plan, read the brackets first."}},{"t":"h","c":{"en":"Sequences, functions and graphs (As)","ar":"Sequences, functions and graphs (As)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Generating sequences","7As.01 term-to-term rules from numerical and spatial patterns (linear, integers)","8As.01 includes fractions","9As.01 linear and quadratic sequences, from numbers or a given rule (any indices)"],"ar":["Generating sequences","7As.01 term-to-term rules from numerical and spatial patterns (linear, integers)","8As.01 includes fractions","9As.01 linear and quadratic sequences, from numbers or a given rule (any indices)"]},{"en":["nth term rules","7As.02 forms n ± a and a × n","8As.02 forms an ± b with integer or fractional a and b","9As.02 an ± b, and also forms such as n/a, n² and n² ± a"],"ar":["nth term rules","7As.02 forms n ± a and a × n","8As.02 forms an ± b with integer or fractional a and b","9As.02 an ± b, and also forms such as n/a, n² and n² ± a"]},{"en":["Functions","7As.03 a function gives each input a single output; use inverse operations (linear, integers)","8As.03 including fractions","9As.03 including indices"],"ar":["Functions","7As.03 a function gives each input a single output; use inverse operations (linear, integers)","8As.03 including fractions","9As.03 including indices"]},{"en":["Linear functions in words","7As.04 y = x + c or y = mx","8As.04 y = mx + c","9As.04 y = mx + c or ax + by = c"],"ar":["Linear functions in words","7As.04 y = x + c or y = mx","8As.04 y = mx + c","9As.04 y = mx + c or ax + by = c"]},{"en":["Plotting graphs","7As.05 tables of values and graphs of y = x + c or y = mx","8As.05 y = mx + c","9As.05 includes ax + by = c and quadratics y = x² ± a"],"ar":["Plotting graphs","7As.05 tables of values and graphs of y = x + c or y = mx","8As.05 y = mx + c","9As.05 includes ax + by = c and quadratics y = x² ± a"]},{"en":["Gradient and equations of lines","7As.06 recognise lines parallel to the x- or y-axis","8As.06 y = mx + c, m is the gradient and c the y-intercept (integer m)","9As.06 find the equation of a line (fractional, positive and negative gradients)"],"ar":["Gradient and equations of lines","7As.06 recognise lines parallel to the x- or y-axis","8As.06 y = mx + c, m is the gradient and c the y-intercept (integer m)","9As.06 find the equation of a line (fractional, positive and negative gradients)"]},{"en":["Interpreting graphs","7As.07 graphs of rates of change; explain their shape","8As.07 graphs with more than one component; significance of intersections","9As.07 read, draw and interpret graphs; compound measures to compare graphs"],"ar":["Interpreting graphs","7As.07 graphs of rates of change; explain their shape","8As.07 graphs with more than one component; significance of intersections","9As.07 read, draw and interpret graphs; compound measures to compare graphs"]}]},{"t":"p","c":{"en":"Look at the \"functions\" row. The definition, \"a function is a relationship where each input has a single output\", is the same word for word in 7As.03, 8As.03 and 9As.03. Only the numbers that pupils work with change: integers, then fractions, then indices. A good teacher says this aloud: \"This is the same idea. Today the numbers are different.\"","ar":"Look at the \"functions\" row. The definition, \"a function is a relationship where each input has a single output\", is the same word for word in 7As.03, 8As.03 and 9As.03. Only the numbers that pupils work with change: integers, then fractions, then indices. A good teacher says this aloud: \"This is the same idea. Today the numbers are different.\""}},{"t":"h","c":{"en":"Where Algebra meets other strands","ar":"Where Algebra meets other strands"}},{"t":"p","c":{"en":"The framework says strands are interrelated. Algebra shows this clearly. 9Ae.06 asks pupils to find solutions to simultaneous equations both algebraically and graphically, joining the Ae and As sub-strands. 7As.05 uses coordinate pairs, which links to 7Gp.02. Formulae link to Geometry and Measure, where pupils derive and use formulae for area and volume (for example 7Gg.05 for the area of a triangle). 7Sp.02 uses fractions, decimals and percentages for probabilities, which links Number to Probability.","ar":"The framework says strands are interrelated. Algebra shows this clearly. 9Ae.06 asks pupils to find solutions to simultaneous equations both algebraically and graphically, joining the Ae and As sub-strands. 7As.05 uses coordinate pairs, which links to 7Gp.02. Formulae link to Geometry and Measure, where pupils derive and use formulae for area and volume (for example 7Gg.05 for the area of a triangle). 7Sp.02 uses fractions, decimals and percentages for probabilities, which links Number to Probability."}},{"t":"scenario","title":{"en":"Same objective, different stage","ar":"Same objective, different stage"},"c":{"en":"Two teachers meet to plan equations. The Year 7 teacher uses x + 5 = 12 and 3x = 18. The Year 8 teacher uses 3x + 5 = 2x + 9 and (x + 1)/2 = 4. A new colleague asks why Year 8 repeats \"equations\". The answer is in the brackets of the objective. 7Ae.06 limits equations to integer coefficients with the unknown on one side. 8Ae.06 widens this to integer or fractional coefficients with the unknown on either or both sides. It is one idea, developed step by step. The new colleague also notices that Year 9 (9Ae.05) goes on to include an unknown in the denominator.","ar":"Two teachers meet to plan equations. The Year 7 teacher uses x + 5 = 12 and 3x = 18. The Year 8 teacher uses 3x + 5 = 2x + 9 and (x + 1)/2 = 4. A new colleague asks why Year 8 repeats \"equations\". The answer is in the brackets of the objective. 7Ae.06 limits equations to integer coefficients with the unknown on one side. 8Ae.06 widens this to integer or fractional coefficients with the unknown on either or both sides. It is one idea, developed step by step. The new colleague also notices that Year 9 (9Ae.05) goes on to include an unknown in the denominator."}},{"t":"scenario","title":{"en":"A misconception about letters","ar":"A misconception about letters"},"c":{"en":"A Year 7 pupil says \"a = 1, b = 2, so ab = 12\". The pupil reads letters as digits placed side by side. 7Ae.01 says letters can represent unknown numbers, variables or constants. The teacher asks the pupil to try a = 3 and b = 4, and to explain what the expression ab means in a rectangle with sides a and b. The pupil notices that ab means \"a times b\". This is good practice: let the pupil test the idea (specialising) and then say what it means.","ar":"A Year 7 pupil says \"a = 1, b = 2, so ab = 12\". The pupil reads letters as digits placed side by side. 7Ae.01 says letters can represent unknown numbers, variables or constants. The teacher asks the pupil to try a = 3 and b = 4, and to explain what the expression ab means in a rectangle with sides a and b. The pupil notices that ab means \"a times b\". This is good practice: let the pupil test the idea (specialising) and then say what it means."}},{"t":"callout","k":"warn","title":{"en":"The glossary helps with letters","ar":"The glossary helps with letters"},"c":{"en":"The glossary gives careful examples. In 3x, the 3 is a constant (it has a fixed value) and x is a variable (it stands for an unspecified number that can have various values). If 3x = 12, then x is an unknown number, whose value can be found: 4. Use these examples when you teach 7Ae.01 and 8Ae.01. Pupils often think a letter always means \"the unknown\".","ar":"The glossary gives careful examples. In 3x, the 3 is a constant (it has a fixed value) and x is a variable (it stands for an unspecified number that can have various values). If 3x = 12, then x is an unknown number, whose value can be found: 4. Use these examples when you teach 7Ae.01 and 8Ae.01. Pupils often think a letter always means \"the unknown\"."}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"Algebra has two sub-strands and 14 objectives per stage. The progression is mostly in the details in brackets: types of number (integers, fractions, indices), the number of terms, and the kinds of function (linear, quadratic). Stage 9 adds simultaneous equations (9Ae.06), solving linear inequalities (9Ae.07), expanding the product of two expressions (9Ae.02) and quadratic sequences and graphs (9As.01, 9As.05).","ar":"Algebra has two sub-strands and 14 objectives per stage. The progression is mostly in the details in brackets: types of number (integers, fractions, indices), the number of terms, and the kinds of function (linear, quadratic). Stage 9 adds simultaneous equations (9Ae.06), solving linear inequalities (9Ae.07), expanding the product of two expressions (9Ae.02) and quadratic sequences and graphs (9As.01, 9As.05)."}}],"checks":[{"id":"m6q1","q":{"en":"Is Algebra a strand in the Cambridge Lower Secondary Mathematics 0862 framework, and which sub-strands does it have?","ar":"Is Algebra a strand in the Cambridge Lower Secondary Mathematics 0862 framework, and which sub-strands does it have?"},"opts":[{"en":"Yes: Expressions and formulae (Ae), and Quadratic functions and graphs (Ag), starting at Stage 8","ar":"Yes: Expressions and formulae (Ae), and Quadratic functions and graphs (Ag), starting at Stage 8"},{"en":"No: Algebra is part of the Number strand, in the Integers, powers and roots sub-strand","ar":"No: Algebra is part of the Number strand, in the Integers, powers and roots sub-strand"},{"en":"Yes: Patterns (Ap) and Equations (Aq), with simultaneous equations first met in Stage 7","ar":"Yes: Patterns (Ap) and Equations (Aq), with simultaneous equations first met in Stage 7"},{"en":"Yes: Expressions, equations and formulae (Ae), and Sequences, functions and graphs (As)","ar":"Yes: Expressions, equations and formulae (Ae), and Sequences, functions and graphs (As)"}],"correct":3,"expl":{"en":"The framework lists Algebra as one of four strands, with two sub-strands, Ae and As.","ar":"The framework lists Algebra as one of four strands, with two sub-strands, Ae and As."}},{"id":"m6q2","q":{"en":"Which Stage 9 objective makes the first mention of simultaneous linear equations in the framework?","ar":"Which Stage 9 objective makes the first mention of simultaneous linear equations in the framework?"},"opts":[{"en":"9Ae.06, which includes solving algebraically by eliminating a variable and graphically by a point of intersection","ar":"9Ae.06, which includes solving algebraically by eliminating a variable and graphically by a point of intersection"},{"en":"8Ae.06, which includes solving equations with the unknown on either or both sides at Stage 8","ar":"8Ae.06, which includes solving equations with the unknown on either or both sides at Stage 8"},{"en":"9As.05, which includes plotting graphs of linear functions given implicitly in terms of x","ar":"9As.05, which includes plotting graphs of linear functions given implicitly in terms of x"},{"en":"9Ae.05, which includes solving equations with an unknown in the denominator at Stage 9","ar":"9Ae.05, which includes solving equations with an unknown in the denominator at Stage 9"}],"correct":0,"expl":{"en":"9Ae.06 covers simultaneous linear equations: the pair of values that satisfy both, found by elimination or by the point of intersection of graphs.","ar":"9Ae.06 covers simultaneous linear equations: the pair of values that satisfy both, found by elimination or by the point of intersection of graphs."}},{"id":"m6q3","q":{"en":"How does the framework develop the objective on moving between words and equations from Stage 7 to Stage 9?","ar":"How does the framework develop the objective on moving between words and equations from Stage 7 to Stage 9?"},"opts":[{"en":"Equations move from fractional coefficients at Stage 7 to integer coefficients only by Stage 9","ar":"Equations move from fractional coefficients at Stage 7 to integer coefficients only by Stage 9"},{"en":"Equations widen from one-sided integer-coefficient forms to either side, fractional coefficients and an unknown in the denominator","ar":"Equations widen from one-sided integer-coefficient forms to either side, fractional coefficients and an unknown in the denominator"},{"en":"Equations are removed after Stage 7 and replaced by simultaneous equations from Stage 8","ar":"Equations are removed after Stage 7 and replaced by simultaneous equations from Stage 8"},{"en":"Equations stay exactly the same in all three stages, so only the context of the task changes","ar":"Equations stay exactly the same in all three stages, so only the context of the task changes"}],"correct":1,"expl":{"en":"7Ae.06 has integer coefficients and the unknown on one side. 8Ae.06 widens this, and 9Ae.05 adds an unknown in the denominator.","ar":"7Ae.06 has integer coefficients and the unknown on one side. 8Ae.06 widens this, and 9Ae.05 adds an unknown in the denominator."}}]},{"id":"m7","title":{"en":"Geometry and Measure Across Stages 7, 8 and 9","ar":"Geometry and Measure Across Stages 7, 8 and 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Geometry and Measure is the largest strand by number of objectives: 20 in Stage 7, 19 in Stage 8 and 18 in Stage 9. It has two sub-strands: Geometrical reasoning, shapes and measurements (Gg) and Position and transformation (Gp). In this module you will read the strand description, compare the two sub-strands across the three stages, and plan for common difficulties. Remember that diagrams are central to this strand, so the best teaching involves drawing, sketching and constructing, not only calculating.","ar":"Geometry and Measure is the largest strand by number of objectives: 20 in Stage 7, 19 in Stage 8 and 18 in Stage 9. It has two sub-strands: Geometrical reasoning, shapes and measurements (Gg) and Position and transformation (Gp). In this module you will read the strand description, compare the two sub-strands across the three stages, and plan for common difficulties. Remember that diagrams are central to this strand, so the best teaching involves drawing, sketching and constructing, not only calculating."}},{"t":"h","c":{"en":"What the framework says about the strand","ar":"What the framework says about the strand"}},{"t":"p","c":{"en":"The framework says that in Geometry and Measure learners develop spatial awareness and explore contexts in which they must apply number skills. They learn to visualise real-life problems and use mathematical instruments and digital technology to produce accurate geometric representations. The strand description adds that learners explore regular and irregular polygons and circles, and use rectangles, squares, triangles and circles to investigate area of 2D shapes and surface area and volume of 3D shapes. They investigate angles in polygons, on parallel lines and on intersecting lines. They use a ruler and compass, or digital technology, to construct triangles, regular polygons and line and angle bisectors. They use scale and bearings to interpret positions on maps and plans. They describe transformations of points and 2D shapes. \u003cstrong>From Stage 9, learners know and use Pythagoras' theorem.\u003c/strong>","ar":"The framework says that in Geometry and Measure learners develop spatial awareness and explore contexts in which they must apply number skills. They learn to visualise real-life problems and use mathematical instruments and digital technology to produce accurate geometric representations. The strand description adds that learners explore regular and irregular polygons and circles, and use rectangles, squares, triangles and circles to investigate area of 2D shapes and surface area and volume of 3D shapes. They investigate angles in polygons, on parallel lines and on intersecting lines. They use a ruler and compass, or digital technology, to construct triangles, regular polygons and line and angle bisectors. They use scale and bearings to interpret positions on maps and plans. They describe transformations of points and 2D shapes. \u003cstrong>From Stage 9, learners know and use Pythagoras' theorem.\u003c/strong>"}},{"t":"callout","k":"tip","title":{"en":"Draw and sketch are different words","ar":"Draw and sketch are different words"},"c":{"en":"The glossary separates these. To \u003cem>draw\u003c/em> is to use instruments such as a ruler, a pair of compasses and a protractor to represent lines and shapes accurately. To \u003cem>sketch\u003c/em> is to illustrate lines and shapes without instruments, so that the picture is representative only and may not be precise. The framework uses both. For example 7Gg.01 says \"sketch\" regular polygons, and 7Gg.14 says \"draw\" parallel and perpendicular lines. Mark pupils against the correct word.","ar":"The glossary separates these. To \u003cem>draw\u003c/em> is to use instruments such as a ruler, a pair of compasses and a protractor to represent lines and shapes accurately. To \u003cem>sketch\u003c/em> is to illustrate lines and shapes without instruments, so that the picture is representative only and may not be precise. The framework uses both. For example 7Gg.01 says \"sketch\" regular polygons, and 7Gg.14 says \"draw\" parallel and perpendicular lines. Mark pupils against the correct word."}},{"t":"h","c":{"en":"Geometrical reasoning, shapes and measurements (Gg)","ar":"Geometrical reasoning, shapes and measurements (Gg)"}},{"t":"p","c":{"en":"The table groups the objectives by topic. The numbers of objectives are 14 (Stage 7), 13 (Stage 8) and 11 (Stage 9).","ar":"The table groups the objectives by topic. The numbers of objectives are 14 (Stage 7), 13 (Stage 8) and 11 (Stage 9)."}},{"t":"table","head":{"en":["Topic","Stage 7","Stage 8","Stage 9"],"ar":["Topic","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Polygons and quadrilaterals","7Gg.01 regular polygons, sides, angles and symmetry; 7Gg.02 congruent shapes","8Gg.01 hierarchy of quadrilaterals; 8Gg.09 sides of a regular polygon equal its lines of symmetry and order of rotation","Used in 9Gg.07 and 9Gg.08, angle sums of polygons"],"ar":["Polygons and quadrilaterals","7Gg.01 regular polygons, sides, angles and symmetry; 7Gg.02 congruent shapes","8Gg.01 hierarchy of quadrilaterals; 8Gg.09 sides of a regular polygon equal its lines of symmetry and order of rotation","Used in 9Gg.07 and 9Gg.08, angle sums of polygons"]},{"en":["Circles","7Gg.03 parts of a circle (centre, radius, diameter, circumference, chord, tangent)","8Gg.02 π as the ratio of circumference to diameter; circumference formula","9Gg.01 formulae for the area and circumference of a circle"],"ar":["Circles","7Gg.03 parts of a circle (centre, radius, diameter, circumference, chord, tangent)","8Gg.02 π as the ratio of circumference to diameter; circumference formula","9Gg.01 formulae for the area and circumference of a circle"]},{"en":["Area of 2D shapes","7Gg.04 convert metric units of area; 7Gg.05 derive area of a triangle; compound shapes","8Gg.04 derive area of parallelograms and trapezia","9Gg.03 estimate and calculate areas of compound shapes with rectangles, triangles and circles"],"ar":["Area of 2D shapes","7Gg.04 convert metric units of area; 7Gg.05 derive area of a triangle; compound shapes","8Gg.04 derive area of parallelograms and trapezia","9Gg.03 estimate and calculate areas of compound shapes with rectangles, triangles and circles"]},{"en":["3D shapes: volume and surface area","7Gg.06 properties of a 3D shape; 7Gg.07 volume of a cube or cuboid; 7Gg.09 surface area of cubes and cuboids","8Gg.05 Euler's formula; 8Gg.06 volume of a triangular prism; 8Gg.08 surface area including prisms and pyramids","9Gg.04 volume of prisms and cylinders; 9Gg.05 surface area including cylinders; 9Gg.06 reflective symmetry in 3D shapes"],"ar":["3D shapes: volume and surface area","7Gg.06 properties of a 3D shape; 7Gg.07 volume of a cube or cuboid; 7Gg.09 surface area of cubes and cuboids","8Gg.05 Euler's formula; 8Gg.06 volume of a triangular prism; 8Gg.08 surface area including prisms and pyramids","9Gg.04 volume of prisms and cylinders; 9Gg.05 surface area including cylinders; 9Gg.06 reflective symmetry in 3D shapes"]},{"en":["Views and symmetry","7Gg.08 front, side and top view; 7Gg.10 reflective symmetry and rotational order of 2D shapes","8Gg.07 front, side and top view to scale","No views objective at Stage 9; 9Gg.06 extends symmetry to 3D shapes"],"ar":["Views and symmetry","7Gg.08 front, side and top view; 7Gg.10 reflective symmetry and rotational order of 2D shapes","8Gg.07 front, side and top view to scale","No views objective at Stage 9; 9Gg.06 extends symmetry to 3D shapes"]},{"en":["Angles","7Gg.11 quadrilateral angles sum to 360°; 7Gg.12 angles around a point; 7Gg.13 angles on parallel, perpendicular and intersecting lines","8Gg.10 exterior angle of a triangle; 8Gg.11 alternate, corresponding and vertically opposite angles","9Gg.07 interior angle sum of any polygon; 9Gg.08 exterior angles of any polygon sum to 360°; 9Gg.09 missing angles"],"ar":["Angles","7Gg.11 quadrilateral angles sum to 360°; 7Gg.12 angles around a point; 7Gg.13 angles on parallel, perpendicular and intersecting lines","8Gg.10 exterior angle of a triangle; 8Gg.11 alternate, corresponding and vertically opposite angles","9Gg.07 interior angle sum of any polygon; 9Gg.08 exterior angles of any polygon sum to 360°; 9Gg.09 missing angles"]},{"en":["Measures, constructions and theorem","7Gg.14 draw parallel and perpendicular lines, and quadrilaterals","8Gg.03 miles and kilometres; 8Gg.12 construct triangles, midpoint, perpendicular bisector and angle bisector","9Gg.02 very small or very large units; 9Gg.10 Pythagoras' theorem; 9Gg.11 construct 60°, 45° and 30° angles and regular polygons"],"ar":["Measures, constructions and theorem","7Gg.14 draw parallel and perpendicular lines, and quadrilaterals","8Gg.03 miles and kilometres; 8Gg.12 construct triangles, midpoint, perpendicular bisector and angle bisector","9Gg.02 very small or very large units; 9Gg.10 Pythagoras' theorem; 9Gg.11 construct 60°, 45° and 30° angles and regular polygons"]}]},{"t":"p","c":{"en":"Two points about this table. First, 7Gg.05 and 7Gg.07 both use the word \u003cem>derive\u003c/em>. The framework asks pupils to derive formulae (area of a triangle, volume of a cuboid, area of parallelograms and trapezia, volume of prisms and cylinders), not only to memorise them. This is Generalising and Convincing in action. Second, the glossary defines a trapezium as a quadrilateral with one pair of parallel sides, and the framework uses the plural \"trapezia\" in 8Gg.04.","ar":"Two points about this table. First, 7Gg.05 and 7Gg.07 both use the word \u003cem>derive\u003c/em>. The framework asks pupils to derive formulae (area of a triangle, volume of a cuboid, area of parallelograms and trapezia, volume of prisms and cylinders), not only to memorise them. This is Generalising and Convincing in action. Second, the glossary defines a trapezium as a quadrilateral with one pair of parallel sides, and the framework uses the plural \"trapezia\" in 8Gg.04."}},{"t":"h","c":{"en":"Position and transformation (Gp)","ar":"Position and transformation (Gp)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Scale, bearings and maps","7Gp.01 scaling to interpret maps and plans","8Gp.01 understand and use bearings","9Gp.01 bearings and scaling to interpret position on maps and plans"],"ar":["Scale, bearings and maps","7Gp.01 scaling to interpret maps and plans","8Gp.01 understand and use bearings","9Gp.01 bearings and scaling to interpret position on maps and plans"]},{"en":["Coordinates","7Gp.02 distance between coordinates with the same x or y coordinate, without a grid","8Gp.02 midpoint of a line segment","9Gp.02 find points on a line segment"],"ar":["Coordinates","7Gp.02 distance between coordinates with the same x or y coordinate, without a grid","8Gp.02 midpoint of a line segment","9Gp.02 find points on a line segment"]},{"en":["Translation","7Gp.03 identify corresponding points, without a grid","8Gp.03 translate using vectors","9Gp.03 combinations of reflections, translations and rotations"],"ar":["Translation","7Gp.03 identify corresponding points, without a grid","8Gp.03 translate using vectors","9Gp.03 combinations of reflections, translations and rotations"]},{"en":["Reflection","7Gp.04 mirror line is the x- or y-axis","8Gp.04 mirror line on or parallel to an axis, or y = ± x; identify a reflection and its mirror line","9Gp.04 identify and describe a transformation or a combination, given object and image"],"ar":["Reflection","7Gp.04 mirror line is the x- or y-axis","8Gp.04 mirror line on or parallel to an axis, or y = ± x; identify a reflection and its mirror line","9Gp.04 identify and describe a transformation or a combination, given object and image"]},{"en":["Rotation","7Gp.05 rotate 90° and 180° about a centre","8Gp.05 centre, direction and angle are needed","9Gp.05 image is congruent to the object after any combination"],"ar":["Rotation","7Gp.05 rotate 90° and 180° about a centre","8Gp.05 centre, direction and angle are needed","9Gp.05 image is congruent to the object after any combination"]},{"en":["Enlargement","7Gp.06 positive integer scale factors; image is similar","8Gp.06 centre of enlargement outside or on the shape; identify scale factor","9Gp.06 centre outside, on or inside; 9Gp.07 changes in perimeter and area when sides are enlarged"],"ar":["Enlargement","7Gp.06 positive integer scale factors; image is similar","8Gp.06 centre of enlargement outside or on the shape; identify scale factor","9Gp.06 centre outside, on or inside; 9Gp.07 changes in perimeter and area when sides are enlarged"]}]},{"t":"p","c":{"en":"The progression is clear. Pupils first perform transformations (Stage 7), then describe what is needed to define them (Stage 8), then combine and identify them (Stage 9). The framework also names a thread through all three stages: after a reflection, rotation or translation the image is \u003cem>congruent\u003c/em> to the object (7Gp.04, 7Gp.05, 8Gp.03, 9Gp.05). After enlargement, the image is \u003cem>similar\u003c/em> (7Gp.06).","ar":"The progression is clear. Pupils first perform transformations (Stage 7), then describe what is needed to define them (Stage 8), then combine and identify them (Stage 9). The framework also names a thread through all three stages: after a reflection, rotation or translation the image is \u003cem>congruent\u003c/em> to the object (7Gp.04, 7Gp.05, 8Gp.03, 9Gp.05). After enlargement, the image is \u003cem>similar\u003c/em> (7Gp.06)."}},{"t":"h","c":{"en":"A note on version changes in this strand","ar":"A note on version changes in this strand"}},{"t":"p","c":{"en":"The changes section says that in version 2.0 (January 2021) the word \"Strands\" was removed from 8Gg.02. In the current text, 8Gg.02 reads as an objective on π as the ratio of circumference to diameter and the circumference formula. An older copy may still contain that word. Use the current version 3.0.","ar":"The changes section says that in version 2.0 (January 2021) the word \"Strands\" was removed from 8Gg.02. In the current text, 8Gg.02 reads as an objective on π as the ratio of circumference to diameter and the circumference formula. An older copy may still contain that word. Use the current version 3.0."}},{"t":"scenario","title":{"en":"Pythagoras too early?","ar":"Pythagoras too early?"},"c":{"en":"A Year 8 teacher wants to start Pythagoras' theorem because her class finished area early. The HOD points to the framework: the strand description says \"From Stage 9, learners know and use Pythagoras' theorem\", and the objective is 9Gg.10. The HOD does not forbid extension work, but suggests Year 8 pupils spend the time on deeper work within Stage 8, for example deriving the area of a trapezium in two ways (8Gg.04), constructing bisectors (8Gg.12), or investigating Euler's formula (8Gg.05). This keeps Stage 9 fresh and uses Thinking and Working Mathematically. The framework does not forbid extension work. Sequencing is a school decision, so agree it with your HOD.","ar":"A Year 8 teacher wants to start Pythagoras' theorem because her class finished area early. The HOD points to the framework: the strand description says \"From Stage 9, learners know and use Pythagoras' theorem\", and the objective is 9Gg.10. The HOD does not forbid extension work, but suggests Year 8 pupils spend the time on deeper work within Stage 8, for example deriving the area of a trapezium in two ways (8Gg.04), constructing bisectors (8Gg.12), or investigating Euler's formula (8Gg.05). This keeps Stage 9 fresh and uses Thinking and Working Mathematically. The framework does not forbid extension work. Sequencing is a school decision, so agree it with your HOD."}},{"t":"scenario","title":{"en":"Mixing up units","ar":"Mixing up units"},"c":{"en":"A Year 7 pupil calculates the area of a rectangle 3 m by 40 cm as 120. The teacher asks the pupil to draw the rectangle and write both lengths in the same unit. This links 7Gg.04 (metric units of area, including m², cm² and mm²) with the area of rectangles from earlier stages. Pupils should see that 1 m² is 10 000 cm², not 100 cm². A diagram with a 1 m square cut into 100 cm strips helps ESL pupils see the reason without long explanations.","ar":"A Year 7 pupil calculates the area of a rectangle 3 m by 40 cm as 120. The teacher asks the pupil to draw the rectangle and write both lengths in the same unit. This links 7Gg.04 (metric units of area, including m², cm² and mm²) with the area of rectangles from earlier stages. Pupils should see that 1 m² is 10 000 cm², not 100 cm². A diagram with a 1 m square cut into 100 cm strips helps ESL pupils see the reason without long explanations."}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"Geometry and Measure moves from naming and measuring (Stage 7), through deriving and connecting formulae (Stage 8), to combining and proving results (Stage 9: Pythagoras' theorem, polygon angle sums, combined transformations). The strand is hands-on, so use rulers, compasses, protractors and digital tools as the framework describes.","ar":"Geometry and Measure moves from naming and measuring (Stage 7), through deriving and connecting formulae (Stage 8), to combining and proving results (Stage 9: Pythagoras' theorem, polygon angle sums, combined transformations). The strand is hands-on, so use rulers, compasses, protractors and digital tools as the framework describes."}}],"checks":[{"id":"m7q1","q":{"en":"In which stage does the framework first introduce Pythagoras' theorem?","ar":"In which stage does the framework first introduce Pythagoras' theorem?"},"opts":[{"en":"Stage 7, in 7Gg.12, as an extension of angles around a point in the same stage of the framework","ar":"Stage 7, in 7Gg.12, as an extension of angles around a point in the same stage of the framework"},{"en":"Stage 8, in 8Gg.10, together with the exterior angle of a triangle in the same stage of the framework","ar":"Stage 8, in 8Gg.10, together with the exterior angle of a triangle in the same stage of the framework"},{"en":"Stage 9, in 9Gg.10; the strand description says \"From Stage 9\" learners know and use it","ar":"Stage 9, in 9Gg.10; the strand description says \"From Stage 9\" learners know and use it"},{"en":"Stage 9, in 9Gp.07, together with changes in perimeter and area after enlargement","ar":"Stage 9, in 9Gp.07, together with changes in perimeter and area after enlargement"}],"correct":2,"expl":{"en":"The strand description says \"From Stage 9\" and 9Gg.10 states \"Know and use Pythagoras' theorem\".","ar":"The strand description says \"From Stage 9\" and 9Gg.10 states \"Know and use Pythagoras' theorem\"."}},{"id":"m7q2","q":{"en":"What is the difference between \"draw\" and \"sketch\" in the framework glossary?","ar":"What is the difference between \"draw\" and \"sketch\" in the framework glossary?"},"opts":[{"en":"Draw is used for 3D shapes only, while sketch is used for 2D shapes in every stage","ar":"Draw is used for 3D shapes only, while sketch is used for 2D shapes in every stage"},{"en":"Draw means to copy a shape from the board, while sketch means to design a new shape","ar":"Draw means to copy a shape from the board, while sketch means to design a new shape"},{"en":"Draw needs a computer or digital tool, while sketch is done only on paper with a pencil","ar":"Draw needs a computer or digital tool, while sketch is done only on paper with a pencil"},{"en":"Draw uses instruments to represent lines and shapes accurately; sketch does not use instruments and may not be precise","ar":"Draw uses instruments to represent lines and shapes accurately; sketch does not use instruments and may not be precise"}],"correct":3,"expl":{"en":"The glossary says draw uses mathematical instruments such as rulers, compasses and protractors. Sketch is without instruments, so it is representative only.","ar":"The glossary says draw uses mathematical instruments such as rulers, compasses and protractors. Sketch is without instruments, so it is representative only."}},{"id":"m7q3","q":{"en":"Which description best fits how transformations progress from Stage 7 to Stage 9?","ar":"Which description best fits how transformations progress from Stage 7 to Stage 9?"},"opts":[{"en":"Pupils perform them first, then identify what defines them, then combine and describe them from an object and its image","ar":"Pupils perform them first, then identify what defines them, then combine and describe them from an object and its image"},{"en":"Pupils begin with combinations of transformations at Stage 7, then study single reflections only at Stage 9","ar":"Pupils begin with combinations of transformations at Stage 7, then study single reflections only at Stage 9"},{"en":"Pupils study only reflections at every stage, with enlargement not mentioned until after Stage 9","ar":"Pupils study only reflections at every stage, with enlargement not mentioned until after Stage 9"},{"en":"Pupils start with vectors at Stage 7, then move to translation without a grid in Stage 9","ar":"Pupils start with vectors at Stage 7, then move to translation without a grid in Stage 9"}],"correct":0,"expl":{"en":"7Gp.03 to 7Gp.06 perform transformations, 8Gp.03 to 8Gp.06 add vectors, mirror lines and centre details, and 9Gp.03 to 9Gp.05 combine and describe them.","ar":"7Gp.03 to 7Gp.06 perform transformations, 8Gp.03 to 8Gp.06 add
