vectors, mirror lines and centre details, and 9Gp.03 to 9Gp.05 combine and describe them."}}]},{"id":"m8","title":{"en":"Statistics and Probability Across Stages 7, 8 and 9","ar":"Statistics and Probability Across Stages 7, 8 and 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The Statistics and Probability strand has two sub-strands, Statistics (Ss) and Probability (Sp). Statistics has five objectives in each stage. Probability has five objectives at Stage 7 and four at Stages 8 and 9. In this module you will see how the framework uses the statistical enquiry cycle, how the two sub-strands develop, and what changed in version 2.0. The strand is short, but it is important in daily life, because the framework says learners need to understand data in unfamiliar presentations and recognise where data is misleading, for example in the media or advertisements.","ar":"The Statistics and Probability strand has two sub-strands, Statistics (Ss) and Probability (Sp). Statistics has five objectives in each stage. Probability has five objectives at Stage 7 and four at Stages 8 and 9. In this module you will see how the framework uses the statistical enquiry cycle, how the two sub-strands develop, and what changed in version 2.0. The strand is short, but it is important in daily life, because the framework says learners need to understand data in unfamiliar presentations and recognise where data is misleading, for example in the media or advertisements."}},{"t":"h","c":{"en":"The statistical enquiry cycle","ar":"The statistical enquiry cycle"}},{"t":"p","c":{"en":"The framework says that learners conduct simple statistics investigations as part of a \u003cstrong>four-part statistical enquiry cycle\u003c/strong>. The framework shows the four parts in a diagram:","ar":"The framework says that learners conduct simple statistics investigations as part of a \u003cstrong>four-part statistical enquiry cycle\u003c/strong>. The framework shows the four parts in a diagram:"}},{"t":"steps","c":{"en":["\u003cstrong>Specify the problem and plan.\u003c/strong> Decide what question to ask and how to collect data.","\u003cstrong>Record, organise and represent data.\u003c/strong> Collect the data and show it in tables, charts or graphs.","\u003cstrong>Interpret data.\u003c/strong> Look for patterns, trends and relationships within and between data sets.","\u003cstrong>Discuss data and check predictions.\u003c/strong> Discuss conclusions, make inferences and generalisations, and check what pupils predicted at the start."],"ar":["\u003cstrong>Specify the problem and plan.\u003c/strong> Decide what question to ask and how to collect data.","\u003cstrong>Record, organise and represent data.\u003c/strong> Collect the data and show it in tables, charts or graphs.","\u003cstrong>Interpret data.\u003c/strong> Look for patterns, trends and relationships within and between data sets.","\u003cstrong>Discuss data and check predictions.\u003c/strong> Discuss conclusions, make inferences and generalisations, and check what pupils predicted at the start."]}},{"t":"p","c":{"en":"The strand description adds that learners use a variety of data collection methods and decide whether to collect categorical, discrete or continuous data. They review advantages and disadvantages of different sampling methods. The glossary defines a \u003cem>statistical question\u003c/em> as \"a question that will have variable answers\", for example \"Which fruits do people in this class like?\". It also defines \u003cem>sources of variation\u003c/em> as reasons for differences in data, such as sampling variability.","ar":"The strand description adds that learners use a variety of data collection methods and decide whether to collect categorical, discrete or continuous data. They review advantages and disadvantages of different sampling methods. The glossary defines a \u003cem>statistical question\u003c/em> as \"a question that will have variable answers\", for example \"Which fruits do people in this class like?\". It also defines \u003cem>sources of variation\u003c/em> as reasons for differences in data, such as sampling variability."}},{"t":"callout","k":"tip","title":{"en":"A cycle, not a list","ar":"A cycle, not a list"},"c":{"en":"Teachers sometimes teach the four parts as four separate lessons, with a worksheet on drawing charts and another on the mean. The framework presents an enquiry cycle. A good unit takes pupils round the whole cycle at least once, with a question they care about, for example \"Do Year 9 pupils sleep more than Year 7 pupils?\" Then pupils return to part 1 with a new question.","ar":"Teachers sometimes teach the four parts as four separate lessons, with a worksheet on drawing charts and another on the mean. The framework presents an enquiry cycle. A good unit takes pupils round the whole cycle at least once, with a question they care about, for example \"Do Year 9 pupils sleep more than Year 7 pupils?\" Then pupils return to part 1 with a new question."}},{"t":"h","c":{"en":"Statistics (Ss)","ar":"Statistics (Ss)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Collecting data and sampling","7Ss.01 select and trial methods to investigate predictions; consider categorical, discrete and continuous data","8Ss.01 select, trial and justify methods","9Ss.01 also considers qualitative or quantitative as well as categorical, discrete or continuous"],"ar":["Collecting data and sampling","7Ss.01 select and trial methods to investigate predictions; consider categorical, discrete and continuous data","8Ss.01 select, trial and justify methods","9Ss.01 also considers qualitative or quantitative as well as categorical, discrete or continuous"]},{"en":["Sampling issues","7Ss.02 effect of sample size on data collection and analysis","8Ss.02 advantages and disadvantages of different sampling methods","9Ss.02 explain potential issues and sources of bias; identify further questions"],"ar":["Sampling issues","7Ss.02 effect of sample size on data collection and analysis","8Ss.02 advantages and disadvantages of different sampling methods","9Ss.02 explain potential issues and sources of bias; identify further questions"]},{"en":["Representing data","7Ss.03 Venn and Carroll diagrams, tally charts, tables, bar charts, pie charts, frequency diagrams, line graphs, scatter graphs, infographics, and more","8Ss.03 adds time series graphs and stem-and-leaf diagrams","9Ss.03 adds frequency polygons and back-to-back stem-and-leaf diagrams"],"ar":["Representing data","7Ss.03 Venn and Carroll diagrams, tally charts, tables, bar charts, pie charts, frequency diagrams, line graphs, scatter graphs, infographics, and more","8Ss.03 adds time series graphs and stem-and-leaf diagrams","9Ss.03 adds frequency polygons and back-to-back stem-and-leaf diagrams"]},{"en":["Averages and spread","7Ss.04 mode, median, mean and range to describe and summarise large data sets; choose the most appropriate","8Ss.04 compare two distributions, thinking about centrality and spread","9Ss.04 compare two distributions, including grouped data"],"ar":["Averages and spread","7Ss.04 mode, median, mean and range to describe and summarise large data sets; choose the most appropriate","8Ss.04 compare two distributions, thinking about centrality and spread","9Ss.04 compare two distributions, including grouped data"]},{"en":["Interpreting and concluding","7Ss.05 identify patterns; discuss conclusions, sources of variation including sampling, and check predictions","8Ss.05 also trends and relationships","9Ss.05 informal inferences and generalisations; identify wrong or misleading information"],"ar":["Interpreting and concluding","7Ss.05 identify patterns; discuss conclusions, sources of variation including sampling, and check predictions","8Ss.05 also trends and relationships","9Ss.05 informal inferences and generalisations; identify wrong or misleading information"]}]},{"t":"p","c":{"en":"The 7Ss.03, 8Ss.03 and 9Ss.03 objectives list the types of representation that pupils choose between. They are long lists, so check the framework for the exact list in each stage. The framework asks pupils to \"choose and explain which representation to use in a given situation\". The key verb is choose and explain. It is not enough to be able to draw every chart.","ar":"The 7Ss.03, 8Ss.03 and 9Ss.03 objectives list the types of representation that pupils choose between. They are long lists, so check the framework for the exact list in each stage. The framework asks pupils to \"choose and explain which representation to use in a given situation\". The key verb is choose and explain. It is not enough to be able to draw every chart."}},{"t":"callout","k":"warn","title":{"en":"Version 2.0 changed the chart lists","ar":"Version 2.0 changed the chart lists"},"c":{"en":"The changes section says that in version 2.0 (January 2021): 8Ss.03 removed \"waffle diagrams\" and added \"time series graphs\" and \"stem-and-leaf diagrams\"; 9Ss.03 removed \"waffle diagrams\" and \"frequency diagrams for continuous data\", and added \"time series graphs and frequency polygons\" and \"stem-and-leaf and back-to-back stem-and-leaf diagrams\". Stage 7 (7Ss.03) still lists waffle diagrams and pie charts, and frequency diagrams for continuous data. If a scheme or textbook was written for an earlier version, check the lists.","ar":"The changes section says that in version 2.0 (January 2021): 8Ss.03 removed \"waffle diagrams\" and added \"time series graphs\" and \"stem-and-leaf diagrams\"; 9Ss.03 removed \"waffle diagrams\" and \"frequency diagrams for continuous data\", and added \"time series graphs and frequency polygons\" and \"stem-and-leaf and back-to-back stem-and-leaf diagrams\". Stage 7 (7Ss.03) still lists waffle diagrams and pie charts, and frequency diagrams for continuous data. If a scheme or textbook was written for an earlier version, check the lists."}},{"t":"h","c":{"en":"Probability (Sp)","ar":"Probability (Sp)"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Language and scale of probability","7Sp.01 language of probability and proportion to describe and order likelihood; 7Sp.02 probabilities range from 0 to 1, as fractions, decimals and percentages","8Sp.01 complementary events have a total probability of 1","9Sp.01 probability of multiple mutually exclusive events by summation; they total 1"],"ar":["Language and scale of probability","7Sp.01 language of probability and proportion to describe and order likelihood; 7Sp.02 probabilities range from 0 to 1, as fractions, decimals and percentages","8Sp.01 complementary events have a total probability of 1","9Sp.01 probability of multiple mutually exclusive events by summation; they total 1"]},{"en":["Outcomes and theory","7Sp.03 all mutually exclusive outcomes of a single event; equally likely; 7Sp.04 theoretical probability of equally likely outcomes","8Sp.02 tables, diagrams and lists for combined events (independent only); 8Sp.03 theoretical probability of equally likely combined events","9Sp.02 when events are independent and when not; 9Sp.03 theoretical probability of combined events"],"ar":["Outcomes and theory","7Sp.03 all mutually exclusive outcomes of a single event; equally likely; 7Sp.04 theoretical probability of equally likely outcomes","8Sp.02 tables, diagrams and lists for combined events (independent only); 8Sp.03 theoretical probability of equally likely combined events","9Sp.02 when events are independent and when not; 9Sp.03 theoretical probability of combined events"]},{"en":["Experiments and simulation","7Sp.05 chance experiments; analyse frequency to calculate experimental probabilities","8Sp.04 compare experimental probabilities with theoretical outcomes","9Sp.04 calculate expected frequency and compare with observed outcomes"],"ar":["Experiments and simulation","7Sp.05 chance experiments; analyse frequency to calculate experimental probabilities","8Sp.04 compare experimental probabilities with theoretical outcomes","9Sp.04 calculate expected frequency and compare with observed outcomes"]}]},{"t":"p","c":{"en":"The strand description says learners \"recognise the difference between experimental and theoretical probabilities and compare expected frequencies with observed outcomes.\" The three stages show this: calculate experimental probabilities (Stage 7), compare experimental with theoretical (Stage 8), calculate expected frequency and compare with observed outcomes (Stage 9). In all three, the experiment objective says \"small and large numbers of trials\". Pupils should see that more trials usually bring results closer to the theory. This is a good link to 7Ss.02 on sample size.","ar":"The strand description says learners \"recognise the difference between experimental and theoretical probabilities and compare expected frequencies with observed outcomes.\" The three stages show this: calculate experimental probabilities (Stage 7), compare experimental with theoretical (Stage 8), calculate expected frequency and compare with observed outcomes (Stage 9). In all three, the experiment objective says \"small and large numbers of trials\". Pupils should see that more trials usually bring results closer to the theory. This is a good link to 7Ss.02 on sample size."}},{"t":"scenario","title":{"en":"Planning a full cycle in Year 8","ar":"Planning a full cycle in Year 8"},"c":{"en":"A Year 8 teacher plans 8Ss.01 to 8Ss.05 as one unit. Part 1: pupils choose the question \"Does reaction time depend on hand?\" and plan how to collect data. Part 2: they collect times for left and right hands, and make a table and a scatter or bar chart. Part 3: they interpret the patterns, comparing the two sets by mean and range (8Ss.04). Part 4: they discuss whether the sample (their class) is enough to predict for the whole school, and what could vary (8Ss.05, sources of variation). At each part, pupils talk first in pairs. This unit uses five objectives and several TWM characteristics.","ar":"A Year 8 teacher plans 8Ss.01 to 8Ss.05 as one unit. Part 1: pupils choose the question \"Does reaction time depend on hand?\" and plan how to collect data. Part 2: they collect times for left and right hands, and make a table and a scatter or bar chart. Part 3: they interpret the patterns, comparing the two sets by mean and range (8Ss.04). Part 4: they discuss whether the sample (their class) is enough to predict for the whole school, and what could vary (8Ss.05, sources of variation). At each part, pupils talk first in pairs. This unit uses five objectives and several TWM characteristics."}},{"t":"scenario","title":{"en":"A pupil and the dice","ar":"A pupil and the dice"},"c":{"en":"A Year 7 pupil rolls a die 12 times and gets six 3s. She says: \"The die is not fair.\" The teacher links this to 7Sp.05 and 7Ss.02. The class pools their data from all pairs (large number of trials), then compares with the theoretical probability (7Sp.04, one in six). The pupil sees that small samples can vary a lot. The class discusses the language (7Sp.01): \"likely\", \"unlikely\", \"equally likely\". For ESL pupils, a probability word line from \"impossible\" to \"certain\" on the wall is a helpful support.","ar":"A Year 7 pupil rolls a die 12 times and gets six 3s. She says: \"The die is not fair.\" The teacher links this to 7Sp.05 and 7Ss.02. The class pools their data from all pairs (large number of trials), then compares with the theoretical probability (7Sp.04, one in six). The pupil sees that small samples can vary a lot. The class discusses the language (7Sp.01): \"likely\", \"unlikely\", \"equally likely\". For ESL pupils, a probability word line from \"impossible\" to \"certain\" on the wall is a helpful support."}},{"t":"callout","k":"key","title":{"en":"Key point","ar":"Key point"},"c":{"en":"The statistics and probability strand is organised around the enquiry cycle. Statistics deepens from selecting and trialling methods (Stage 7) to justifying them (Stage 8) and spotting bias and misleading data (Stage 9). Probability moves from single events and the 0 to 1 scale (Stage 7), to complementary and combined events (Stage 8), to independence and mutually exclusive events (Stage 9).","ar":"The statistics and probability strand is organised around the enquiry cycle. Statistics deepens from selecting and trialling methods (Stage 7) to justifying them (Stage 8) and spotting bias and misleading data (Stage 9). Probability moves from single events and the 0 to 1 scale (Stage 7), to complementary and combined events (Stage 8), to independence and mutually exclusive events (Stage 9)."}}],"checks":[{"id":"m8q1","q":{"en":"Which list shows the four parts of the statistical enquiry cycle in the framework?","ar":"Which list shows the four parts of the statistical enquiry cycle in the framework?"},"opts":[{"en":"Collect data; draw a chart; calculate the mean; write the conclusion in the statistics report","ar":"Collect data; draw a chart; calculate the mean; write the conclusion in the statistics report"},{"en":"Specify the problem and plan; record, organise and represent data; interpret data; discuss data and check predictions","ar":"Specify the problem and plan; record, organise and represent data; interpret data; discuss data and check predictions"},{"en":"Specify the problem; record data; discuss predictions; interpret the chart and finish the cycle","ar":"Specify the problem; record data; discuss predictions; interpret the chart and finish the cycle"},{"en":"Plan the survey; interpret data; record and organise data; discuss the data and check the sample","ar":"Plan the survey; interpret data; record and organise data; discuss the data and check the sample"}],"correct":1,"expl":{"en":"The framework diagram shows four numbered parts: specify the problem and plan, record, organise and represent data, interpret data, then discuss data and check predictions.","ar":"The framework diagram shows four numbered parts: specify the problem and plan, record, organise and represent data, interpret data, then discuss data and check predictions."}},{"id":"m8q2","q":{"en":"Which statement about version 2.0 and 9Ss.03 is correct?","ar":"Which statement about version 2.0 and 9Ss.03 is correct?"},"opts":[{"en":"Waffle diagrams were added, and time series graphs and frequency polygons were removed from the list","ar":"Waffle diagrams were added, and time series graphs and frequency polygons were removed from the list"},{"en":"Pie charts and scatter graphs were removed, and waffle diagrams were added in their place","ar":"Pie charts and scatter graphs were removed, and waffle diagrams were added in their place"},{"en":"Waffle diagrams and frequency diagrams for continuous data were removed, and time series graphs and frequency polygons were added","ar":"Waffle diagrams and frequency diagrams for continuous data were removed, and time series graphs and frequency polygons were added"},{"en":"No changes were made to 9Ss.03, and only 7Ss.03 was changed when the version was updated","ar":"No changes were made to 9Ss.03, and only 7Ss.03 was changed when the version was updated"}],"correct":2,"expl":{"en":"The changes section lists the removals and additions for 9Ss.03 in version 2.0, including stem-and-leaf and back-to-back stem-and-leaf diagrams.","ar":"The changes section lists the removals and additions for 9Ss.03 in version 2.0, including stem-and-leaf and back-to-back stem-and-leaf diagrams."}},{"id":"m8q3","q":{"en":"Which sequence matches how the framework develops experiments and simulations in Probability?","ar":"Which sequence matches how the framework develops experiments and simulations in Probability?"},"opts":[{"en":"Calculate expected frequency (Stage 7), calculate experimental probabilities (Stage 8), compare with theory (Stage 9)","ar":"Calculate expected frequency (Stage 7), calculate experimental probabilities (Stage 8), compare with theory (Stage 9)"},{"en":"Compare with theory (Stage 7), calculate expected frequency (Stage 8), calculate experimental probabilities (Stage 9)","ar":"Compare with theory (Stage 7), calculate expected frequency (Stage 8), calculate experimental probabilities (Stage 9)"},{"en":"Calculate experimental probabilities in Stage 7, then stop experiments until Stage 9","ar":"Calculate experimental probabilities in Stage 7, then stop experiments until Stage 9"},{"en":"Calculate experimental probabilities (Stage 7), compare with theory (Stage 8), calculate expected frequency (Stage 9)","ar":"Calculate experimental probabilities (Stage 7), compare with theory (Stage 8), calculate expected frequency (Stage 9)"}],"correct":3,"expl":{"en":"7Sp.05, 8Sp.04 and 9Sp.04 show this progression.","ar":"7Sp.05, 8Sp.04 and 9Sp.04 show this progression."}}]},{"id":"m9","title":{"en":"Reading Progression Across Stages 7, 8 and 9","ar":"Reading Progression Across Stages 7, 8 and 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that to enable effective progression in teaching, you need to be familiar with the progression of skills across stages, so that you can \"build on prior learning in every stage\". It also says all learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\". This final module shows you how to read that progression for yourself: how to trace one idea from Stage 7 to Stage 9, how to link back to primary and forward to IGCSE, how to find prerequisites and gaps, and how this supports the Year 9 Checkpoint. It ends with a short glossary and five take-aways.","ar":"The framework says that to enable effective progression in teaching, you need to be familiar with the progression of skills across stages, so that you can \"build on prior learning in every stage\". It also says all learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\". This final module shows you how to read that progression for yourself: how to trace one idea from Stage 7 to Stage 9, how to link back to primary and forward to IGCSE, how to find prerequisites and gaps, and how this supports the Year 9 Checkpoint. It ends with a short glossary and five take-aways."}},{"t":"h","c":{"en":"Technique: tracing one idea through the stages","ar":"Technique: tracing one idea through the stages"}},{"t":"p","c":{"en":"Follow four steps. First, choose an idea, for example percentages. Second, search each stage list for objectives that use the idea, in any strand. Third, write the codes in a row, Stage 7, Stage 8, Stage 9. Fourth, read what is added in each stage: the type of number, the type of problem, the number of steps or the degree of justification.","ar":"Follow four steps. First, choose an idea, for example percentages. Second, search each stage list for objectives that use the idea, in any strand. Third, write the codes in a row, Stage 7, Stage 8, Stage 9. Fourth, read what is added in each stage: the type of number, the type of problem, the number of steps or the degree of justification."}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9","What grows"],"ar":["Idea","Stage 7","Stage 8","Stage 9","What grows"]},"rows":[{"en":["Percentages","7Nf.01 equivalent fractions, decimals, percentages; 7Nf.05 percentages of shapes and whole numbers","8Nf.05 percentage increase and decrease, and absolute change","9Nf.05 compound percentages","From finding a percentage, to change, to repeated change"],"ar":["Percentages","7Nf.01 equivalent fractions, decimals, percentages; 7Nf.05 percentages of shapes and whole numbers","8Nf.05 percentage increase and decrease, and absolute change","9Nf.05 compound percentages","From finding a percentage, to change, to repeated change"]},{"en":["Indices","7Ni.02 positive indices in order of operations","8Ni.05 positive and zero indices; index laws for multiplication and division","9Ni.02 positive, negative and zero indices; 9Ni.03 standard form; 9Ae.02 laws of indices in algebra","From using powers, to laws, to negative indices, standard form and algebra"],"ar":["Indices","7Ni.02 positive indices in order of operations","8Ni.05 positive and zero indices; index laws for multiplication and division","9Ni.02 positive, negative and zero indices; 9Ni.03 standard form; 9Ae.02 laws of indices in algebra","From using powers, to laws, to negative indices, standard form and algebra"]},{"en":["Volume","7Gg.07 cube or cuboid (derive and use formula)","8Gg.06 triangular prism","9Gg.04 prisms and cylinders","From one shape, to a prism built on a triangle, to any prism and a cylinder"],"ar":["Volume","7Gg.07 cube or cuboid (derive and use formula)","8Gg.06 triangular prism","9Gg.04 prisms and cylinders","From one shape, to a prism built on a triangle, to any prism and a cylinder"]},{"en":["Straight-line graphs","7As.05 plot y = x + c or y = mx; 7As.06 lines parallel to the axes","8As.05 plot y = mx + c; 8As.06 gradient and y-intercept (integer m)","9As.05 includes ax + by = c; 9As.06 find the equation (fractional, positive, negative gradients)","From plotting, to meaning of m and c, to finding equations"],"ar":["Straight-line graphs","7As.05 plot y = x + c or y = mx; 7As.06 lines parallel to the axes","8As.05 plot y = mx + c; 8As.06 gradient and y-intercept (integer m)","9As.05 includes ax + by = c; 9As.06 find the equation (fractional, positive, negative gradients)","From plotting, to meaning of m and c, to finding equations"]},{"en":["Data analysis","7Ss.04 mean, median, mode, range for large data sets","8Ss.04 compare two distributions","9Ss.04 compare, including grouped data","From describing one set, to comparing two, to grouped data"],"ar":["Data analysis","7Ss.04 mean, median, mode, range for large data sets","8Ss.04 compare two distributions","9Ss.04 compare, including grouped data","From describing one set, to comparing two, to grouped data"]}]},{"t":"callout","k":"tip","title":{"en":"Use the progression on the support site too","ar":"Use the progression on the support site too"},"c":{"en":"The framework says the progression of learning objectives across Stages 7 to 9 is available on the Cambridge Lower Secondary support site. Use it to check your own tracing. Your tracing is useful because you decide which ideas matter for your class this term.","ar":"The framework says the progression of learning objectives across Stages 7 to 9 is available on the Cambridge Lower Secondary support site. Use it to check your own tracing. Your tracing is useful because you decide which ideas matter for your class this term."}},{"t":"h","c":{"en":"Links back to primary and forward to IGCSE","ar":"Links back to primary and forward to IGCSE"}},{"t":"p","c":{"en":"The framework is clear about the Pathway: \"Each step of the pathway builds on the learners' development from the previous one\". About Algebra, it says specifically that the strand \"builds on pre-algebra concepts in the primary stages\". The framework text for Stages 7 to 9 does not list the Primary Stage 6 objectives, and it does not give a stage-by-stage link to the primary framework. To see exactly what pupils have met by the end of Primary Stage 6, open the Cambridge Primary Mathematics 0096 framework (see the Primary Part A CPD) and compare the Stage 6 list with your Stage 7 objectives, using the same four steps as above.","ar":"The framework is clear about the Pathway: \"Each step of the pathway builds on the learners' development from the previous one\". About Algebra, it says specifically that the strand \"builds on pre-algebra concepts in the primary stages\". The framework text for Stages 7 to 9 does not list the Primary Stage 6 objectives, and it does not give a stage-by-stage link to the primary framework. To see exactly what pupils have met by the end of Primary Stage 6, open the Cambridge Primary Mathematics 0096 framework (see the Primary Part A CPD) and compare the Stage 6 list with your Stage 7 objectives, using the same four steps as above."}},{"t":"p","c":{"en":"Looking forward, PEPS Years 10 and 11 follow Cambridge IGCSE Mathematics 0580 (PEPS context). This CPD does not describe IGCSE content, because the 0862 framework does not. The useful habit is to know what your Stage 9 pupils will be asked to build on: standard form, simultaneous equations, solving linear inequalities, Pythagoras' theorem and combinations of transformations are first listed in Stage 9, so they are likely to be used again in later study.","ar":"Looking forward, PEPS Years 10 and 11 follow Cambridge IGCSE Mathematics 0580 (PEPS context). This CPD does not describe IGCSE content, because the 0862 framework does not. The useful habit is to know what your Stage 9 pupils will be asked to build on: standard form, simultaneous equations, solving linear inequalities, Pythagoras' theorem and combinations of transformations are first listed in Stage 9, so they are likely to be used again in later study."}},{"t":"h","c":{"en":"Spotting prerequisites and gaps","ar":"Spotting prerequisites and gaps"}},{"t":"p","c":{"en":"A prerequisite is an earlier idea that a new idea depends on. The table shows examples. The links are good practice, based on reading the objectives. They are not listed as such in the framework.","ar":"A prerequisite is an earlier idea that a new idea depends on. The table shows examples. The links are good practice, based on reading the objectives. They are not listed as such in the framework."}},{"t":"table","head":{"en":["New objective","Earlier objectives it relies on","Quick check before teaching"],"ar":["New objective","Earlier objectives it relies on","Quick check before teaching"]},"rows":[{"en":["9Ae.06 simultaneous equations (algebraic and graphical)","8Ae.06 solving equations; 8As.05 and 8As.06 straight-line graphs","Can pupils solve 3x + 2 = 2x + 7, and plot y = 2x + 1?"],"ar":["9Ae.06 simultaneous equations (algebraic and graphical)","8Ae.06 solving equations; 8As.05 and 8As.06 straight-line graphs","Can pupils solve 3x + 2 = 2x + 7, and plot y = 2x + 1?"]},{"en":["9Gg.10 Pythagoras' theorem","7Ni.06 and 8Ni.06 squares and square roots","Can pupils calculate 7² and √64, and say why a right angle matters?"],"ar":["9Gg.10 Pythagoras' theorem","7Ni.06 and 8Ni.06 squares and square roots","Can pupils calculate 7² and √64, and say why a right angle matters?"]},{"en":["9Gp.03 combined transformations","8Gp.03 to 8Gp.05 translation, reflection and rotation","Can pupils describe a rotation with centre, direction and angle?"],"ar":["9Gp.03 combined transformations","8Gp.03 to 8Gp.05 translation, reflection and rotation","Can pupils describe a rotation with centre, direction and angle?"]},{"en":["9Ae.04 change the subject of a formula","8Ae.05 inverse operations in formulae","Can pupils undo two operations in the right order?"],"ar":["9Ae.04 change the subject of a formula","8Ae.05 inverse operations in formulae","Can pupils undo two operations in the right order?"]},{"en":["9Ss.05 identify misleading information","8Ss.05 and 7Ss.02 patterns, sample size and sources of variation","Can pupils say why a small sample may mislead?"],"ar":["9Ss.05 identify misleading information","8Ss.05 and 7Ss.02 patterns, sample size and sources of variation","Can pupils say why a small sample may mislead?"]}]},{"t":"scenario","title":{"en":"Planning a gap check in Year 9","ar":"Planning a gap check in Year 9"},"c":{"en":"A Year 9 teacher finds that several pupils struggle with 9Ni.02 (negative indices). She traces back. 8Ni.05 asks for positive and zero indices and the index laws for multiplication and division. 7Ni.02 uses positive indices in order of operations. She runs a ten-minute check on 8Ni.05: \"Write 2⁴ × 2³ as one power. Explain why 5⁰ = 1.\" Half the class can do the laws but cannot explain the zero index. She decides to teach zero indices again using a pattern (specialising and generalising: 2³, 2², 2¹, 2⁰), then move to 2⁻¹. The gap was at Stage 8, but the lesson was still a Stage 9 lesson.","ar":"A Year 9 teacher finds that several pupils struggle with 9Ni.02 (negative indices). She traces back. 8Ni.05 asks for positive and zero indices and the index laws for multiplication and division. 7Ni.02 uses positive indices in order of operations. She runs a ten-minute check on 8Ni.05: \"Write 2⁴ × 2³ as one power. Explain why 5⁰ = 1.\" Half the class can do the laws but cannot explain the zero index. She decides to teach zero indices again using a pattern (specialising and generalising: 2³, 2², 2¹, 2⁰), then move to 2⁻¹. The gap was at Stage 8, but the lesson was still a Stage 9 lesson."}},{"t":"scenario","title":{"en":"Do not teach Stage 9 content without the prerequisite","ar":"Do not teach Stage 9 content without the prerequisite"},"c":{"en":"A teacher is behind schedule and wants to start 9Ae.06 straight away. The progression table shows that pupils must be able to solve single equations (8Ae.06) and understand straight-line graphs (8As.05, 8As.06). If they are not, elimination becomes a list of memorised steps with no meaning. The teacher agrees with the HOD to spend one lesson on each prerequisite, using a short diagnostic quiz first. This is better than a faster start followed by weeks of re-teaching.","ar":"A teacher is behind schedule and wants to start 9Ae.06 straight away. The progression table shows that pupils must be able to solve single equations (8Ae.06) and understand straight-line graphs (8As.05, 8As.06). If they are not, elimination becomes a list of memorised steps with no meaning. The teacher agrees with the HOD to spend one lesson on each prerequisite, using a short diagnostic quiz first. This is better than a faster start followed by weeks of re-teaching."}},{"t":"h","c":{"en":"The Year 9 Checkpoint and reporting codes","ar":"The Year 9 Checkpoint and reporting codes"}},{"t":"p","c":{"en":"At PEPS, Year 9 pupils sit the Cambridge Lower Secondary Checkpoint in Mathematics, and Year 8 is also a GL Progress Test year (PEPS context). The framework says only that Cambridge provides assessments designed to complement the framework for Stages 7 to 9, and that Checkpoint tests were to be available from 2023. It does not describe the structure of the tests. It does say reporting codes appear in test feedback reports. This gives you a practical routine:","ar":"At PEPS, Year 9 pupils sit the Cambridge Lower Secondary Checkpoint in Mathematics, and Year 8 is also a GL Progress Test year (PEPS context). The framework says only that Cambridge provides assessments designed to complement the framework for Stages 7 to 9, and that Checkpoint tests were to be available from 2023. It does not describe the structure of the tests. It does say reporting codes appear in test feedback reports. This gives you a practical routine:"}},{"t":"steps","c":{"en":["\u003cstrong>Read the feedback by sub-strand.\u003c/strong> Note which reporting codes (Nf, Ni, Np, Ae, As, Gp, Gg, Sp, Ss) show weaker results.","\u003cstrong>List the objectives.\u003c/strong> For each weak code, list the objectives in Stages 7, 8 and 9, because the weakness may start earlier.","\u003cstrong>Trace back and plan.\u003c/strong> Use the prerequisite method above to decide what to teach again, and which TWM characteristics to include.","\u003cstrong>Check the Cambridge documents.\u003c/strong> Ask your HOD for the school's own guidance and check the support site for what the assessments cover."],"ar":["\u003cstrong>Read the feedback by sub-strand.\u003c/strong> Note which reporting codes (Nf, Ni, Np, Ae, As, Gp, Gg, Sp, Ss) show weaker results.","\u003cstrong>List the objectives.\u003c/strong> For each weak code, list the objectives in Stages 7, 8 and 9, because the weakness may start earlier.","\u003cstrong>Trace back and plan.\u003c/strong> Use the prerequisite method above to decide what to teach again, and which TWM characteristics function renderBlock(b){

}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
