#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"primary-science-framework-a","code":"PSA","passMark":80,"hours":"2.5 hours","accent":"#1F7A5A","accentSoft":"#E3F4EC","eyebrow":{"en":"Staff CPD · Cambridge Primary Science 0097 · Part A","ar":"Staff CPD · Cambridge Primary Science 0097 · Part A"},"title":{"en":"Understanding the Cambridge Primary Science Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Primary Science Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for primary science teachers, HODs, coordinators and new staff: why the framework exists, how it is organised, how to read a learning-objective code, and what Biology, Chemistry, Physics and Earth and Space cover from Stage 1 to Stage 6.","ar":"A self-paced guide for primary science teachers, HODs, coordinators and new staff: why the framework exists, how it is organised, how to read a learning-objective code, and what Biology, Chemistry, Physics and Earth and Space cover from Stage 1 to Stage 6."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Primary Science 0097 Curriculum Framework (v4.0)","ar":"Cambridge Primary Science 0097 Curriculum Framework (v4.0)"},"source":{"en":"Cambridge Primary Science 0097 Curriculum Framework, version 4.0 (published February 2026). Check the current Cambridge documents on the School Support Hub; this CPD supports, and does not replace, them.","ar":"Cambridge Primary Science 0097 Curriculum Framework, version 4.0 (published February 2026). Check the current Cambridge documents on the School Support Hub; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway, Time and Version 4.0","ar":"Why This Framework? Purpose, Pathway, Time and Version 4.0"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD (Part A) helps you read and use the \u003cstrong>Cambridge Primary Science 0097 Curriculum Framework\u003c/strong> with confidence. By the end you will be able to: explain what the framework is for; read any learning-objective code such as \u003cstrong>5Bs.01\u003c/strong>; describe the six strands and how they work together; summarise what the four content strands teach from Stage 1 to Stage 6; and trace one idea across the stages to find the knowledge pupils need before it. Part B covers how to plan, teach and assess with the framework. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"This CPD (Part A) helps you read and use the \u003cstrong>Cambridge Primary Science 0097 Curriculum Framework\u003c/strong> with confidence. By the end you will be able to: explain what the framework is for; read any learning-objective code such as \u003cstrong>5Bs.01\u003c/strong>; describe the six strands and how they work together; summarise what the four content strands teach from Stage 1 to Stage 6; and trace one idea across the stages to find the knowledge pupils need before it. Part B covers how to plan, teach and assess with the framework. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"Many teachers meet the science framework only as a list of topics for their own year. That is a small part of its value. The framework is a \u003cem>map of the whole primary journey\u003c/em>. When you know where a Stage 4 idea comes from and where it goes next, you can teach it with more confidence, spot gaps early, and explain to colleagues and parents why a topic matters.","ar":"Many teachers meet the science framework only as a list of topics for their own year. That is a small part of its value. The framework is a \u003cem>map of the whole primary journey\u003c/em>. When you know where a Stage 4 idea comes from and where it goes next, you can teach it with more confidence, spot gaps early, and explain to colleagues and parents why a topic matters."}},{"t":"h","c":{"en":"What the framework says it is for","ar":"What the framework says it is for"}},{"t":"p","c":{"en":"The framework describes itself as a set of learning objectives for Cambridge Primary Science. It gives \"a structure for teaching and learning and a reference against which learners' attainment and skills development can be checked\". In plain words: it tells you \u003cem>what pupils should know, understand and be able to do\u003c/em> at each stage. It does not tell you which lessons, units or textbooks to use. Those choices belong to the school and the teacher.","ar":"The framework describes itself as a set of learning objectives for Cambridge Primary Science. It gives \"a structure for teaching and learning and a reference against which learners' attainment and skills development can be checked\". In plain words: it tells you \u003cem>what pupils should know, understand and be able to do\u003c/em> at each stage. It does not tell you which lessons, units or textbooks to use. Those choices belong to the school and the teacher."}},{"t":"h","c":{"en":"Key benefits named in the framework","ar":"Key benefits named in the framework"}},{"t":"list","c":{"en":["\u003cstrong>Curiosity.\u003c/strong> It supports learners in developing life-long curiosity about the natural world and in seeking scientific explanations for phenomena.","\u003cstrong>A holistic approach.\u003c/strong> Scientific thinking and practical skills are developed alongside knowledge and understanding.","\u003cstrong>Clear sequencing.\u003c/strong> Strands of skills and knowledge are sequenced so that learners can describe, explain and investigate the world at an age-appropriate level.","\u003cstrong>Preparation for later study.\u003c/strong> The approach gives learners the knowledge and skills they need to access and excel at science in later phases of education.","\u003cstrong>Informed choices.\u003c/strong> Learners are prepared to make informed choices, including about sustainability and the challenges facing our environment."],"ar":["\u003cstrong>Curiosity.\u003c/strong> It supports learners in developing life-long curiosity about the natural world and in seeking scientific explanations for phenomena.","\u003cstrong>A holistic approach.\u003c/strong> Scientific thinking and practical skills are developed alongside knowledge and understanding.","\u003cstrong>Clear sequencing.\u003c/strong> Strands of skills and knowledge are sequenced so that learners can describe, explain and investigate the world at an age-appropriate level.","\u003cstrong>Preparation for later study.\u003c/strong> The approach gives learners the knowledge and skills they need to access and excel at science in later phases of education.","\u003cstrong>Informed choices.\u003c/strong> Learners are prepared to make informed choices, including about sustainability and the challenges facing our environment."]}},{"t":"h","c":{"en":"Science in Context: the \"unique feature\"","ar":"Science in Context: the \"unique feature\""}},{"t":"p","c":{"en":"The framework calls the \u003cstrong>Science in Context\u003c/strong> strand \"a unique feature\" of Cambridge Primary Science. Its purpose is to show learners that science is relevant to them. The framework says that improving awareness of science in the world around them develops the sense that \u003cem>\"science is for me\"\u003c/em>. You will meet this strand again in Module 4. For now, remember one point: Science in Context is not a separate topic to be taught on a Friday afternoon. It is a set of statements that help pupils study the other strands in a context that matters to them.","ar":"The framework calls the \u003cstrong>Science in Context\u003c/strong> strand \"a unique feature\" of Cambridge Primary Science. Its purpose is to show learners that science is relevant to them. The framework says that improving awareness of science in the world around them develops the sense that \u003cem>\"science is for me\"\u003c/em>. You will meet this strand again in Module 4. For now, remember one point: Science in Context is not a separate topic to be taught on a Friday afternoon. It is a set of statements that help pupils study the other strands in a context that matters to them."}},{"t":"callout","k":"tip","title":{"en":"Good practice: say the purpose to your pupils","ar":"Good practice: say the purpose to your pupils"},"c":{"en":"The framework's purpose is curiosity and the feeling that \"science is for me\". In a class of ESL learners, this matters even more. A pupil who cannot yet explain an idea in English can still observe, sort, draw and measure. Make sure pupils see themselves as scientists from the first lesson, whatever their English level.","ar":"The framework's purpose is curiosity and the feeling that \"science is for me\". In a class of ESL learners, this matters even more. A pupil who cannot yet explain an idea in English can still observe, sort, draw and measure. Make sure pupils see themselves as scientists from the first lesson, whatever their English level."}},{"t":"h","c":{"en":"The Cambridge Pathway, ages and PEPS stages","ar":"The Cambridge Pathway, ages and PEPS stages"}},{"t":"p","c":{"en":"The framework explains that the primary programme is part of the Cambridge Pathway. This pathway \"leads seamlessly from early years, to primary, to secondary and to pre-university years\". Each step builds on the learners' development from the previous one or from other educational systems. The framework is \"typically for learners aged 5 to 11\", but it may be used for slightly different ages to suit the school's context.","ar":"The framework explains that the primary programme is part of the Cambridge Pathway. This pathway \"leads seamlessly from early years, to primary, to secondary and to pre-university years\". Each step builds on the learners' development from the previous one or from other educational systems. The framework is \"typically for learners aged 5 to 11\", but it may be used for slightly different ages to suit the school's context."}},{"t":"table","head":{"en":["Where","What the framework or school context says","What it means for you"],"ar":["Where","What the framework or school context says","What it means for you"]},"rows":[{"en":["Before Year 1","The Cambridge Pathway starts in the early years. At PEPS, FS2 comes before Year 1.","Pupils arrive in Year 1 with early experiences of the world. Stage 1 objectives start with simple observation, naming and talking."],"ar":["Before Year 1","The Cambridge Pathway starts in the early years. At PEPS, FS2 comes before Year 1.","Pupils arrive in Year 1 with early experiences of the world. Stage 1 objectives start with simple observation, naming and talking."]},{"en":["Years 1 to 6","Cambridge Primary Science has learning objectives for Stages 1 to 6. At PEPS, Year 1 to Year 6 follow Stage 1 to Stage 6.","Each year group has its own set of objectives. This CPD uses \"Stage\" for framework wording and \"Year\" for PEPS year groups."],"ar":["Years 1 to 6","Cambridge Primary Science has learning objectives for Stages 1 to 6. At PEPS, Year 1 to Year 6 follow Stage 1 to Stage 6.","Each year group has its own set of objectives. This CPD uses \"Stage\" for framework wording and \"Year\" for PEPS year groups."]},{"en":["Year 6 outcome","Cambridge Primary Checkpoint and Stage 6 Progression Tests are mentioned in the framework. PEPS Year 6 sits Cambridge Primary Checkpoint.","Stage 6 is the end of the primary journey. Earlier stages prepare for it (see Module 9)."],"ar":["Year 6 outcome","Cambridge Primary Checkpoint and Stage 6 Progression Tests are mentioned in the framework. PEPS Year 6 sits Cambridge Primary Checkpoint.","Stage 6 is the end of the primary journey. Earlier stages prepare for it (see Module 9)."]},{"en":["After Year 6","The pathway continues into secondary. PEPS Years 7 to 9 follow Cambridge Lower Secondary.","Check your school's Lower Secondary Science programme to see how it builds on Stage 6. This CPD does not describe that programme."],"ar":["After Year 6","The pathway continues into secondary. PEPS Years 7 to 9 follow Cambridge Lower Secondary.","Check your school's Lower Secondary Science programme to see how it builds on Stage 6. This CPD does not describe that programme."]}]},{"t":"h","c":{"en":"Teaching time: what the framework suggests","ar":"Teaching time: what the framework suggests"}},{"t":"p","c":{"en":"The framework says that \"for guidance\" it is based on learners having the numbers of hours shown below. It adds that \"your actual number of teaching hours may vary according to your context\". These are not rules. They are a planning guide.","ar":"The framework says that \"for guidance\" it is based on learners having the numbers of hours shown below. It adds that \"your actual number of teaching hours may vary according to your context\". These are not rules. They are a planning guide."}},{"t":"table","head":{"en":["Stages","Suggested total hours per stage","Suggested hours of science per week"],"ar":["Stages","Suggested total hours per stage","Suggested hours of science per week"]},"rows":[{"en":["1 and 2","45","1.5"],"ar":["1 and 2","45","1.5"]},{"en":["3 and 4","60","2"],"ar":["3 and 4","60","2"]},{"en":["5 and 6","75","2.5"],"ar":["5 and 6","75","2.5"]}]},{"t":"p","c":{"en":"\u003cstrong>Worked example.\u003c/strong> Look at each row of the table: 45 hours at 1.5 hours a week, 60 hours at 2 hours a week and 75 hours at 2.5 hours a week all work out at about 30 weeks of science. So the guidance assumes a year of about 30 weeks. When you check your own timetable, count the real science minutes in a real school year. If you have fewer hours than the guidance, you must plan carefully, because the number of objectives rises as pupils move up (see Module 3). Talk to your HOD about how the school handles this.","ar":"\u003cstrong>Worked example.\u003c/strong> Look at each row of the table: 45 hours at 1.5 hours a week, 60 hours at 2 hours a week and 75 hours at 2.5 hours a week all work out at about 30 weeks of science. So the guidance assumes a year of about 30 weeks. When you check your own timetable, count the real science minutes in a real school year. If you have fewer hours than the guidance, you must plan carefully, because the number of objectives rises as pupils move up (see Module 3). Talk to your HOD about how the school handles this."}},{"t":"h","c":{"en":"Supporting resources named in the framework","ar":"Supporting resources named in the framework"}},{"t":"p","c":{"en":"The framework says that most resources are on the \u003cstrong>School Support Hub\u003c/strong>, and that you should ask the Cambridge coordinator or exams officer in your school if you do not have a log-in. It names these groups of support:","ar":"The framework says that most resources are on the \u003cstrong>School Support Hub\u003c/strong>, and that you should ask the Cambridge coordinator or exams officer in your school if you do not have a log-in. It names these groups of support:"}},{"t":"list","c":{"en":["\u003cstrong>Teaching resources:\u003c/strong> the curriculum framework, the teacher guide and schemes of work.","\u003cstrong>Cambridge Primary assessments:\u003c/strong> Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments.","\u003cstrong>Training:\u003c/strong> face-to-face workshops around the world, online training and Cambridge Professional Development Qualifications.","\u003cstrong>Community:\u003c/strong> social media channels and community forums on the School Support Hub, where teachers share ideas."],"ar":["\u003cstrong>Teaching resources:\u003c/strong> the curriculum framework, the teacher guide and schemes of work.","\u003cstrong>Cambridge Primary assessments:\u003c/strong> Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments.","\u003cstrong>Training:\u003c/strong> face-to-face workshops around the world, online training and Cambridge Professional Development Qualifications.","\u003cstrong>Community:\u003c/strong> social media channels and community forums on the School Support Hub, where teachers share ideas."]}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework states: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Science.\" A scheme of work contains suggested units, at least one suggested activity for each learning objective, subject-specific language, common misconceptions and sample lesson plans. It shows the \u003cem>type\u003c/em> of activity and the intended depth and breadth of each objective. It is not designed to fill all the teaching time, so you need other activities of similar difficulty.","ar":"The framework states: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Science.\" A scheme of work contains suggested units, at least one suggested activity for each learning objective, subject-specific language, common misconceptions and sample lesson plans. It shows the \u003cem>type\u003c/em> of activity and the intended depth and breadth of each objective. It is not designed to fill all the teaching time, so you need other activities of similar difficulty."}},{"t":"p","c":{"en":"On assessment, the framework says Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\". It also says that the Science in Context strand \"will not be directly assessed\" by Cambridge International Education. Read both statements carefully: they do not mean Stages 1 and 2 or Science in Context are less important. They describe what Cambridge assesses.","ar":"On assessment, the framework says Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\". It also says that the Science in Context strand \"will not be directly assessed\" by Cambridge International Education. Read both statements carefully: they do not mean Stages 1 and 2 or Science in Context are less important. They describe what Cambridge assesses."}},{"t":"h","c":{"en":"Version 4.0 and the changes section","ar":"Version 4.0 and the changes section"}},{"t":"p","c":{"en":"The framework you hold must be the latest. The text says \"the latest curriculum framework is version 4.0, published February 2026\". The first publication was in September 2020 for first teaching in September 2021. Section 6 of the framework lists changes in each version, and it tells readers: \"You must read the whole curriculum before planning your teaching programme.\"","ar":"The framework you hold must be the latest. The text says \"the latest curriculum framework is version 4.0, published February 2026\". The first publication was in September 2020 for first teaching in September 2021. Section 6 of the framework lists changes in each version, and it tells readers: \"You must read the whole curriculum before planning your teaching programme.\""}},{"t":"table","head":{"en":["Version","Published","Examples of changes listed"],"ar":["Version","Published","Examples of changes listed"]},"rows":[{"en":["2.0","August 2021","5Cm.02 made clear that learners should know and use the term water vapour; glossary improved; document made more accessible."],"ar":["2.0","August 2021","5Cm.02 made clear that learners should know and use the term water vapour; glossary improved; document made more accessible."]},{"en":["3.0","February 2023","Guidance on teaching human reproduction updated with how it will be assessed in Checkpoint and Stage 6 Progression Tests."],"ar":["3.0","February 2023","Guidance on teaching human reproduction updated with how it will be assessed in Checkpoint and Stage 6 Progression Tests."]},{"en":["4.0","February 2026","Guidance on how 6Bp.01 is assessed updated, and many learning objectives made clearer (for example 3Pf.01 now names the newton; 6Pe.01 now names series and parallel circuits)."],"ar":["4.0","February 2026","Guidance on how 6Bp.01 is assessed updated, and many learning objectives made clearer (for example 3Pf.01 now names the newton; 6Pe.01 now names series and parallel circuits)."]}]},{"t":"p","c":{"en":"If your scheme of work, textbook or old planning file was written before February 2026, check it against version 4.0. Small wording changes can change what pupils need to be able to do.","ar":"If your scheme of work, textbook or old planning file was written before February 2026, check it against version 4.0. Small wording changes can change what pupils need to be able to do."}},{"t":"scenario","title":{"en":"A new colleague asks \"Do we have to follow the scheme of work?\"","ar":"A new colleague asks \"Do we have to follow the scheme of work?\""},"c":{"en":"A new Year 3 teacher joins in October. She has been given the Stage 3 scheme of work and asks if she must teach every suggested activity in the order shown. \u003cstrong>How would you answer?\u003c/strong> A good answer: the framework says you do not need to use the scheme of work ideas, but the learning objectives are the reference. She should plan so that every Stage 3 objective is taught and checked, can use the scheme of work for activity ideas and common misconceptions, and should follow her HOD's and the school's planning expectations. She should also check that her copy refers to version 4.0 objectives.","ar":"A new Year 3 teacher joins in October. She has been given the Stage 3 scheme of work and asks if she must teach every suggested activity in the order shown. \u003cstrong>How would you answer?\u003c/strong> A good answer: the framework says you do not need to use the scheme of work ideas, but the learning objectives are the reference. She should plan so that every Stage 3 objective is taught and checked, can use the scheme of work for activity ideas and common misconceptions, and should follow her HOD's and the school's planning expectations. She should also check that her copy refers to version 4.0 objectives."}}],"checks":[{"id":"m1q1","q":{"en":"According to the framework, which statement about the suggested teaching hours is correct?","ar":"According to the framework, which statement about the suggested teaching hours is correct?"},"opts":[{"en":"They are guidance only, and actual teaching hours may vary according to the school's context","ar":"They are guidance only, and actual teaching hours may vary according to the school's context"},{"en":"They are the minimum hours of science that a school must provide to be recognised as a Cambridge school","ar":"They are the minimum hours of science that a school must provide to be recognised as a Cambridge school"},{"en":"They apply to Stages 1 to 6 equally, at 2 hours of science every week","ar":"They apply to Stages 1 to 6 equally, at 2 hours of science every week"},{"en":"They are set by Cambridge for each country and cannot be changed by schools","ar":"They are set by Cambridge for each country and cannot be changed by schools"}],"correct":0,"expl":{"en":"The framework says it is based on these hours \"for guidance\" and that your actual number of hours \"may vary according to your context\". The hours differ by stage: 1.5, 2 and 2.5 per week.","ar":"The framework says it is based on these hours \"for guidance\" and that your actual number of hours \"may vary according to your context\". The hours differ by stage: 1.5, 2 and 2.5 per week."}},{"id":"m1q2","q":{"en":"A teacher says that Cambridge will assess Science in Context at Stage 6, so it is the most important strand. What does the framework say?","ar":"A teacher says that Cambridge will assess Science in Context at Stage 6, so it is the most important strand. What does the framework say?"},"opts":[{"en":"Science in Context is assessed only in Stages 3 and 4 by Progression Tests","ar":"Science in Context is assessed only in Stages 3 and 4 by Progression Tests"},{"en":"Science in Context will not be directly assessed by Cambridge International Education","ar":"Science in Context will not be directly assessed by Cambridge International Education"},{"en":"Science in Context is assessed directly, but only through a practical task in the Checkpoint tests","ar":"Science in Context is assessed directly, but only through a practical task in the Checkpoint tests"},{"en":"Science in Context is assessed by the school, and Cambridge sets the marks","ar":"Science in Context is assessed by the school, and Cambridge sets the marks"}],"correct":1,"expl":{"en":"The framework states that the strand \"will not be directly assessed\". This does not make it optional: it is part of the curriculum and supports learning in all other strands.","ar":"The framework states that the strand \"will not be directly assessed\". This does not make it optional: it is part of the curriculum and supports learning in all other strands."}},{"id":"m1q3","q":{"en":"Which description best fits a Cambridge Primary Science scheme of work, as the framework describes it?","ar":"Which description best fits a Cambridge Primary Science scheme of work, as the framework describes it?"},"opts":[{"en":"A compulsory lesson-by-lesson programme that fills all of the teaching time in every single stage","ar":"A compulsory lesson-by-lesson programme that fills all of the teaching time in every single stage"},{"en":"A set of Checkpoint past papers with mark schemes for Stage 6 only","ar":"A set of Checkpoint past papers with mark schemes for Stage 6 only"},{"en":"Suggested units, at least one activity per objective, key language, misconceptions and sample plans","ar":"Suggested units, at least one activity per objective, key language, misconceptions and sample plans"},{"en":"A list of PEPS policies for practical work and safety in the laboratory","ar":"A list of PEPS policies for practical work and safety in the laboratory"}],"correct":2,"expl":{"en":"The framework lists these contents and adds that schemes of work are not compulsory and are not designed to fill all the teaching time.","ar":"The framework lists these contents and adds that schemes of work are not compulsory and are not designed to fill all the teaching time."}}]},{"id":"m2","title":{"en":"Aims and the Cambridge Learner Attributes in Science","ar":"Aims and the Cambridge Learner Attributes in Science"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Every curriculum has aims. They explain \u003cem>why\u003c/em> pupils learn the content, not only \u003cem>what\u003c/em> they learn. The Cambridge Primary Science framework gives two sets of aims and a list of five learner attributes. This module explains each one in plain language and shows how to see them in an ordinary science lesson.","ar":"Every curriculum has aims. They explain \u003cem>why\u003c/em> pupils learn the content, not only \u003cem>what\u003c/em> they learn. The Cambridge Primary Science framework gives two sets of aims and a list of five learner attributes. This module explains each one in plain language and shows how to see them in an ordinary science lesson."}},{"t":"h","c":{"en":"The aims of the Cambridge Primary programme","ar":"The aims of the Cambridge Primary programme"}},{"t":"p","c":{"en":"The framework says that following the Cambridge Primary programme helps learners \"lay the foundations for lifelong learning\", including four things:","ar":"The framework says that following the Cambridge Primary programme helps learners \"lay the foundations for lifelong learning\", including four things:"}},{"t":"list","c":{"en":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as global awareness."],"ar":["curiosity about the world around them and enthusiasm for learning","knowledge, understanding and skills that can be applied in and across subjects","effective and confident communication skills, including in English","understanding of their personal and local context, as well as global awareness."]}},{"t":"p","c":{"en":"The third aim is important at PEPS. Because all PEPS pupils learn English as a second language, science lessons are one of the places where they practise \"effective and confident communication\". This does not mean science lessons become English lessons. It means that talking, writing and explaining are part of doing science, and that you plan for them.","ar":"The third aim is important at PEPS. Because all PEPS pupils learn English as a second language, science lessons are one of the places where they practise \"effective and confident communication\". This does not mean science lessons become English lessons. It means that talking, writing and explaining are part of doing science, and that you plan for them."}},{"t":"h","c":{"en":"The aims of Cambridge Primary Science","ar":"The aims of Cambridge Primary Science"}},{"t":"p","c":{"en":"In Cambridge Primary Science, the framework says that learners:","ar":"In Cambridge Primary Science, the framework says that learners:"}},{"t":"list","c":{"en":["build curiosity and fascination about the world to stimulate their interest in science","first meet foundational scientific concepts, which then develop through the Cambridge Pathway","develop their scientific skills so they can become increasingly independent when questioning and investigating phenomena","begin to understand that scientific models are used to understand and explain phenomena","recognise that scientific understanding changes over time","link science to real-world contexts that are personal, local, national and global, identifying the relevance of science to the modern world."],"ar":["build curiosity and fascination about the world to stimulate their interest in science","first meet foundational scientific concepts, which then develop through the Cambridge Pathway","develop their scientific skills so they can become increasingly independent when questioning and investigating phenomena","begin to understand that scientific models are used to understand and explain phenomena","recognise that scientific understanding changes over time","link science to real-world contexts that are personal, local, national and global, identifying the relevance of science to the modern world."]}},{"t":"p","c":{"en":"Notice the words \"first meet\" and \"increasingly independent\". Primary science is the \u003cem>start\u003c/em> of a long journey. Pupils are not expected to master every idea. They meet the idea, use it in simple ways and build on it in the next stage. That is why a Stage 4 teacher needs to know what was taught in Stage 3, and what Stage 5 will add.","ar":"Notice the words \"first meet\" and \"increasingly independent\". Primary science is the \u003cem>start\u003c/em> of a long journey. Pupils are not expected to master every idea. They meet the idea, use it in simple ways and build on it in the next stage. That is why a Stage 4 teacher needs to know what was taught in Stage 3, and what Stage 5 will add."}},{"t":"table","head":{"en":["Science aim (paraphrased)","Where you can see it in the strands","Example objective code"],"ar":["Science aim (paraphrased)","Where you can see it in the strands","Example objective code"]},"rows":[{"en":["Build curiosity","Asking questions and making predictions starts in Stage 1","1TWSp.01 (ask questions and talk about how to find answers)"],"ar":["Build curiosity","Asking questions and making predictions starts in Stage 1","1TWSp.01 (ask questions and talk about how to find answers)"]},{"en":["Meet foundational concepts","Big ideas such as the particle model first appear in Stage 4 and develop in Stages 5 and 6","4Cm.01 (describe the particle model for solids and liquids)"],"ar":["Meet foundational concepts","Big ideas such as the particle model first appear in Stage 4 and develop in Stages 5 and 6","4Cm.01 (describe the particle model for solids and liquids)"]},{"en":["Increasing independence","Pupils move from using given equipment to choosing and planning","1TWSc.02 (use given equipment) then 5TWSc.03 (choose equipment)"],"ar":["Increasing independence","Pupils move from using given equipment to choosing and planning","1TWSc.02 (use given equipment) then 5TWSc.03 (choose equipment)"]},{"en":["Models explain phenomena","A Models and representations sub-strand runs from Stage 2","2TWSm.01 (know that a model represents an object or idea)"],"ar":["Models explain phenomena","A Models and representations sub-strand runs from Stage 2","2TWSm.01 (know that a model represents an object or idea)"]},{"en":["Understanding changes over time","Science in Context statements about the past and about evidence","1SIC.01 then 4SIC.01"],"ar":["Understanding changes over time","Science in Context statements about the past and about evidence","1SIC.01 then 4SIC.01"]},{"en":["Real-world contexts","Science in Context moves from pupils' experiences to the local area","2SIC.02 then 4SIC.02"],"ar":["Real-world contexts","Science in Context moves from pupils' experiences to the local area","2SIC.02 then 4SIC.02"]}]},{"t":"h","c":{"en":"The five Cambridge learner attributes in science","ar":"The five Cambridge learner attributes in science"}},{"t":"p","c":{"en":"The framework says that the Cambridge approach encourages learners to be \u003cstrong>confident, responsible, reflective, innovative and engaged\u003c/strong>. It then describes what each attribute means in science. The table gives the meaning in short form. Read the framework for the full wording.","ar":"The framework says that the Cambridge approach encourages learners to be \u003cstrong>confident, responsible, reflective, innovative and engaged\u003c/strong>. It then describes what each attribute means in science. The table gives the meaning in short form. Read the framework for the full wording."}},{"t":"table","head":{"en":["Attribute","What the framework says (summary)","What it can look like in a lesson (good practice)"],"ar":["Attribute","What the framework says (summary)","What it can look like in a lesson (good practice)"]},"rows":[{"en":["Confident","Secure in scientific understanding; able to present findings and defend conclusions, and to respect the conclusions of others.","Pupils explain their result to another group and answer a question with \"because\". They listen when a group disagrees."],"ar":["Confident","Secure in scientific understanding; able to present findings and defend conclusions, and to respect the conclusions of others.","Pupils explain their result to another group and answer a question with \"because\". They listen when a group disagrees."]},{"en":["Responsible","Responsible for themselves and for working with others; understand that science can have impacts on others and on the environment.","Pupils share equipment fairly, follow safety rules and discuss litter or water waste in the school."],"ar":["Responsible","Responsible for themselves and for working with others; understand that science can have impacts on others and on the environment.","Pupils share equipment fairly, follow safety rules and discuss litter or water waste in the school."]},{"en":["Reflective","Review their understanding; concerned with the \u003cem>process\u003c/em> of science as well as the products; investigate independently.","At the end of an investigation, pupils say what they would change next time and why."],"ar":["Reflective","Review their understanding; concerned with the \u003cem>process\u003c/em> of science as well as the products; investigate independently.","At the end of an investigation, pupils say what they would change next time and why."]},{"en":["Innovative","Use scientific skills and understanding in new, unfamiliar and future challenges; flexible and critical thinkers.","Pupils use what they learned about material properties to solve a new problem, such as keeping an ice cube from melting."],"ar":["Innovative","Use scientific skills and understanding in new, unfamiliar and future challenges; flexible and critical thinkers.","Pupils use what they learned about material properties to solve a new problem, such as keeping an ice cube from melting."]},{"en":["Engaged","Curious; keen to deepen understanding; open to new ideas; able to use science to make informed choices at personal, local, national and global levels.","Pupils bring questions from home, and ask \"what if?\" without being told to."],"ar":["Engaged","Curious; keen to deepen understanding; open to new ideas; able to use science to make informed choices at personal, local, national and global levels.","Pupils bring questions from home, and ask \"what if?\" without being told to."]}]},{"t":"callout","k":"key","title":{"en":"Process and product","ar":"Process and product"},"c":{"en":"The Reflective attribute says that learners are concerned with the \u003cstrong>process\u003c/strong> of science as well as the \u003cstrong>products\u003c/strong>. A product is a fact, such as \"plants need light and water\". A process is how we find out: asking, predicting, testing, recording, concluding. Good science teaching gives time to both. If lessons only deliver facts, the Thinking and Working Scientifically strand is not being taught.","ar":"The Reflective attribute says that learners are concerned with the \u003cstrong>process\u003c/strong> of science as well as the \u003cstrong>products\u003c/strong>. A product is a fact, such as \"plants need light and water\". A process is how we find out: asking, predicting, testing, recording, concluding. Good science teaching gives time to both. If lessons only deliver facts, the Thinking and Working Scientifically strand is not being taught."}},{"t":"h","c":{"en":"Seeing the attributes at different stages","ar":"Seeing the attributes at different stages"}},{"t":"p","c":{"en":"The attributes are the same from Stage 1 to Stage 6, but the pupils' behaviour is different. A Stage 1 pupil is \u003cem>confident\u003c/em> when she says \"I think the ball will go far\" and then tells the class what happened (1TWSp.02 and 1TWSa.01). A Stage 6 pupil is \u003cem>confident\u003c/em> when he plans a fair test and defends his conclusion using scientific understanding (6TWSp.04 and 6TWSa.03). The attribute grows with the pupil, as the objectives grow.","ar":"The attributes are the same from Stage 1 to Stage 6, but the pupils' behaviour is different. A Stage 1 pupil is \u003cem>confident\u003c/em> when she says \"I think the ball will go far\" and then tells the class what happened (1TWSp.02 and 1TWSa.01). A Stage 6 pupil is \u003cem>confident\u003c/em> when he plans a fair test and defends his conclusion using scientific understanding (6TWSp.04 and 6TWSa.03). The attribute grows with the pupil, as the objectives grow."}},{"t":"callout","k":"tip","title":{"en":"Good practice: an \"aims check\" for a lesson plan","ar":"Good practice: an \"aims check\" for a lesson plan"},"c":{"en":"After you write a lesson plan, ask four short questions. (1) Which learning objective code am I teaching? (2) Where do pupils \u003cem>do\u003c/em> science, not only hear about it? (3) Where do pupils talk or write, in full sentences with the support they need? (4) Which attribute can I notice and praise today? This is a planning habit, not a Cambridge requirement.","ar":"After you write a lesson plan, ask four short questions. (1) Which learning objective code am I teaching? (2) Where do pupils \u003cem>do\u003c/em> science, not only hear about it? (3) Where do pupils talk or write, in full sentences with the support they need? (4) Which attribute can I notice and praise today? This is a planning habit, not a Cambridge requirement."}},{"t":"scenario","title":{"en":"The pupil who does not accept the conclusion","ar":"The pupil who does not accept the conclusion"},"c":{"en":"In a Year 4 lesson, groups test which surface makes a toy car travel the furthest. One group's result does not match the prediction of a strong pupil, Karim. He says the test is \"wrong\" and wants to repeat it until the car goes further on the surface he chose. \u003cstrong>What do you do?\u003c/strong> A good response links to the attributes: tell Karim that scientists use evidence even when it surprises them (Confident, Reflective). Ask him to say what the evidence shows and why the result may have happened. Allow repeated measurements, because 4TWSc.04 says repeated measurements can give more reliable data, but not to force the answer he wants. Let the class compare results and respect each group's conclusion (Confident: respect the conclusions of others).","ar":"In a Year 4 lesson, groups test which surface makes a toy car travel the furthest. One group's result does not match the prediction of a strong pupil, Karim. He says the test is \"wrong\" and wants to repeat it until the car goes further on the surface he chose. \u003cstrong>What do you do?\u003c/strong> A good response links to the attributes: tell Karim that scientists use evidence even when it surprises them (Confident, Reflective). Ask him to say what the evidence shows and why the result may have happened. Allow repeated measurements, because 4TWSc.04 says repeated measurements can give more reliable data, but not to force the answer he wants. Let the class compare results and respect each group's conclusion (Confident: respect the conclusions of others)."}}],"checks":[{"id":"m2q1","q":{"en":"Which aim in the Cambridge Primary programme links most directly to the PEPS context, where all pupils are learning English as a second language?","ar":"Which aim in the Cambridge Primary programme links most directly to the PEPS context, where all pupils are learning English as a second language?"},"opts":[{"en":"Understanding of the history of the Cambridge Pathway from age 3 to 19","ar":"Understanding of the history of the Cambridge Pathway from age 3 to 19"},{"en":"Knowledge and skills that can be applied only within the science lessons","ar":"Knowledge and skills that can be applied only within the science lessons"},{"en":"Curiosity that is limited to the pupils' personal experiences at home","ar":"Curiosity that is limited to the pupils' personal experiences at home"},{"en":"Effective and confident communication skills, including in English","ar":"Effective and confident communication skills, including in English"}],"correct":3,"expl":{"en":"The programme aims list \"effective and confident communication skills, including in English\". In science, talking, writing and explaining are part of doing science, so you plan for them.","ar":"The programme aims list \"effective and confident communication skills, including in English\". In science, talking, writing and explaining are part of doing science, so you plan for them."}},{"id":"m2q2","q":{"en":"In the framework, which attribute is described as being concerned with the process of science as well as the products of science?","ar":"In the framework, which attribute is described as being concerned with the process of science as well as the products of science?"},"opts":[{"en":"Reflective","ar":"Reflective"},{"en":"Confident","ar":"Confident"},{"en":"Responsible","ar":"Responsible"},{"en":"Innovative","ar":"Innovative"}],"correct":0,"expl":{"en":"The Reflective description says learners are \"concerned with the process of science as well as the products of science\" and can review their understanding of the world.","ar":"The Reflective description says learners are \"concerned with the process of science as well as the products of science\" and can review their understanding of the world."}},{"id":"m2q3","q":{"en":"A Stage 3 pupil uses what she learned about the properties of materials to suggest a new way to keep a drink cold in an unfamiliar situation. Which attribute does this best show?","ar":"A Stage 3 pupil uses what she learned about the properties of materials to suggest a new way to keep a drink cold in an unfamiliar situation. Which attribute does this best show?"},"opts":[{"en":"Responsible, because she is looking after the environment around her","ar":"Responsible, because she is looking after the environment around her"},{"en":"Innovative, because she adapts her skills and understanding to a new challenge","ar":"Innovative, because she adapts her skills and understanding to a new challenge"},{"en":"Engaged, because she is making a choice about the use of science in society","ar":"Engaged, because she is making a choice about the use of science in society"},{"en":"Confident, because she is presenting her findings and defending them to the whole class","ar":"Confident, because she is presenting her findings and defending them to the whole class"}],"correct":1,"expl":{"en":"The Innovative attribute is about using scientific skills and understanding to adapt to new, unfamiliar and future challenges. The other attributes involve different behaviours, such as safety or presenting.","ar":"The Innovative attribute is about using scientific skills and understanding to adapt to new, unfamiliar and future challenges. The other attributes involve different behaviours, such as safety or presenting."}}]},{"id":"m3","title":{"en":"How the Framework Is Organised: Strands, Codes and Progression","ar":"How the Framework Is Organised: Strands, Codes and Progression"},"minutes":17,"blocks":[{"t":"p","c":{"en":"If you can read the structure of the framework, you can find any objective in seconds. This module explains the three categories of strand, the sub-strands, the code that names each objective, and the patterns of progression across Stages 1 to 6.","ar":"If you can read the structure of the framework, you can find any objective in seconds. This module explains the three categories of strand, the sub-strands, the code that names each objective, and the patterns of progression across Stages 1 to 6."}},{"t":"h","c":{"en":"Three categories of strand, six strands","ar":"Three categories of strand, six strands"}},{"t":"p","c":{"en":"The framework divides its learning objectives into main areas called \u003cstrong>strands\u003c/strong>. The strands \"run through every primary stage\". Each strand is divided into \u003cstrong>sub-strands\u003c/strong>, based on the key concepts of the strand. Sub-strands help to show progression and are \"useful when designing long-term plans, medium-term plans and other teaching resources\". There are three categories of strand:","ar":"The framework divides its learning objectives into main areas called \u003cstrong>strands\u003c/strong>. The strands \"run through every primary stage\". Each strand is divided into \u003cstrong>sub-strands\u003c/strong>, based on the key concepts of the strand. Sub-strands help to show progression and are \"useful when designing long-term plans, medium-term plans and other teaching resources\". There are three categories of strand:"}},{"t":"table","head":{"en":["Category","Strand","What it is for"],"ar":["Category","Strand","What it is for"]},"rows":[{"en":["Skills strand","Thinking and Working Scientifically","Scientific skills: models and representations, scientific enquiry and practical work"],"ar":["Skills strand","Thinking and Working Scientifically","Scientific skills: models and representations, scientific enquiry and practical work"]},{"en":["Content strands","Biology; Chemistry; Physics; Earth and Space","The knowledge and understanding of the natural world"],"ar":["Content strands","Biology; Chemistry; Physics; Earth and Space","The knowledge and understanding of the natural world"]},{"en":["Context strand","Science in Context","Linking science to real life, to scientists and their work, and to ideas and events relevant to pupils"],"ar":["Context strand","Science in Context","Linking science to real life, to scientists and their work, and to ideas and events relevant to pupils"]}]},{"t":"p","c":{"en":"The framework says the three types of strand \"are designed to support each other in every stage of learning\". For example, pupils develop skills from Thinking and Working Scientifically while learning the content of a content strand, and the content can be taught through contexts supported by Science in Context.","ar":"The framework says the three types of strand \"are designed to support each other in every stage of learning\". For example, pupils develop skills from Thinking and Working Scientifically while learning the content of a content strand, and the content can be taught through contexts supported by Science in Context."}},{"t":"h","c":{"en":"The sub-strands","ar":"The sub-strands"}},{"t":"table","head":{"en":["Strand","Sub-strands in the framework","Reporting code"],"ar":["Strand","Sub-strands in the framework","Reporting code"]},"rows":[{"en":["Thinking and Working Scientifically","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions","TWSm; TWSp; TWSc; TWSa"],"ar":["Thinking and Working Scientifically","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions","TWSm; TWSp; TWSc; TWSa"]},{"en":["Biology","Structure and function; Life processes; Ecosystems","Bs; Bp; Be"],"ar":["Biology","Structure and function; Life processes; Ecosystems","Bs; Bp; Be"]},{"en":["Chemistry","Materials and their structure; Properties of materials; Changes to materials","Cm; Cp; Cc"],"ar":["Chemistry","Materials and their structure; Properties of materials; Changes to materials","Cm; Cp; Cc"]},{"en":["Physics","Forces and energy; Light and sound; Electricity and magnetism","Pf; Ps; Pe"],"ar":["Physics","Forces and energy; Light and sound; Electricity and magnetism","Pf; Ps; Pe"]},{"en":["Earth and Space","Planet Earth; Cycles on Earth; Earth in space","ESp; ESc; ESs"],"ar":["Earth and Space","Planet Earth; Cycles on Earth; Earth in space","ESp; ESc; ESs"]},{"en":["Science in Context","No sub-strands are listed in the stage pages","SIC"],"ar":["Science in Context","No sub-strands are listed in the stage pages","SIC"]}]},{"t":"p","c":{"en":"The reporting codes are read from the stage listings: for example, the objectives under \"Structure and function\" in Biology carry the letters \u003cstrong>Bs\u003c/strong>. The framework explains that the reporting code \"appears in the feedback reports for tests and reflects the sub-strand titles\". Not every sub-strand appears in every stage (see below).","ar":"The reporting codes are read from the stage listings: for example, the objectives under \"Structure and function\" in Biology carry the letters \u003cstrong>Bs\u003c/strong>. The framework explains that the reporting code \"appears in the feedback reports for tests and reflects the sub-strand titles\". Not every sub-strand appears in every stage (see below)."}},{"t":"h","c":{"en":"How to read a learning-objective code","ar":"How to read a learning-objective code"}},{"t":"p","c":{"en":"The framework says that each learning objective has a unique code, for example \u003cstrong>5Bs.01\u003c/strong>. A code includes three parts: the \u003cstrong>stage number\u003c/strong>; a \u003cstrong>reporting code\u003c/strong> that reflects the sub-strand; and a \u003cstrong>number\u003c/strong> showing the order of the objective in the sub-strand for that stage (01 is the first). The codes appear in schemes of work, the teacher guide and other Cambridge Primary resources.","ar":"The framework says that each learning objective has a unique code, for example \u003cstrong>5Bs.01\u003c/strong>. A code includes three parts: the \u003cstrong>stage number\u003c/strong>; a \u003cstrong>reporting code\u003c/strong> that reflects the sub-strand; and a \u003cstrong>number\u003c/strong> showing the order of the objective in the sub-strand for that stage (01 is the first). The codes appear in schemes of work, the teacher guide and other Cambridge Primary resources."}},{"t":"steps","c":{"en":["\u003cstrong>Look at the first digit.\u003c/strong> It is the stage. In 5Bs.01 it is 5, so this is a Stage 5 objective.","\u003cstrong>Read the letters.\u003c/strong> B is Biology and s is the sub-strand letter, which in the listings is Structure and function. So 5Bs.01 is Stage 5, Biology, Structure and function.","\u003cstrong>Read the number.\u003c/strong> 01 means the first objective in that sub-strand for that stage. (The framework says only that it reflects the order; it does not say that 01 is easier or more important.)","\u003cstrong>Find the full wording.\u003c/strong> Go to the Stage 5 page of the framework and find 5Bs.01: \"Know that not all plants produce flowers.\""],"ar":["\u003cstrong>Look at the first digit.\u003c/strong> It is the stage. In 5Bs.01 it is 5, so this is a Stage 5 objective.","\u003cstrong>Read the letters.\u003c/strong> B is Biology and s is the sub-strand letter, which in the listings is Structure and function. So 5Bs.01 is Stage 5, Biology, Structure and function.","\u003cstrong>Read the number.\u003c/strong> 01 means the first objective in that sub-strand for that stage. (The framework says only that it reflects the order; it does not say that 01 is easier or more important.)","\u003cstrong>Find the full wording.\u003c/strong> Go to the Stage 5 page of the framework and find 5Bs.01: \"Know that not all plants produce flowers.\""]}},{"t":"table","head":{"en":["Code","How to read it","Objective in brief"],"ar":["Code","How to read it","Objective in brief"]},"rows":[{"en":["1Pf.02","Stage 1, Physics, Forces and energy, objective 02","Describe pushes and pulls as forces"],"ar":["1Pf.02","Stage 1, Physics, Forces and energy, objective 02","Describe pushes and pulls as forces"]},{"en":["3TWSp.02","Stage 3, Thinking and Working Scientifically, purpose and planning, objective 02","Know the five main types of scientific enquiry"],"ar":["3TWSp.02","Stage 3, Thinking and Working Scientifically, purpose and planning, objective 02","Know the five main types of scientific enquiry"]},{"en":["4ESs.01","Stage 4, Earth and Space, Earth in space, objective 01","Explain how the Earth's spin leads to day and night"],"ar":["4ESs.01","Stage 4, Earth and Space, Earth in space, objective 01","Explain how the Earth's spin leads to day and night"]},{"en":["6Cc.04","Stage 6, Chemistry, Changes to materials, objective 04","Understand reactants and products in chemical reactions"],"ar":["6Cc.04","Stage 6, Chemistry, Changes to materials, objective 04","Understand reactants and products in chemical reactions"]},{"en":["6SIC.05","Stage 6, Science in Context, objective 05","Discuss positive and negative environmental effects of science and technology locally"],"ar":["6SIC.05","Stage 6, Science in Context, objective 05","Discuss positive and negative environmental effects of science and technology locally"]}]},{"t":"callout","k":"warn","title":{"en":"Quote the code, then check the wording","ar":"Quote the code, then check the wording"},"c":{"en":"When you write a plan, a report or a message to a colleague, give the exact code and then read the objective in the framework. Do not rely on memory of \"what we always teach\". The wording includes limits, such as \"limited to roots, leaves, stems and flowers\" (1Bs.01). These limits tell you how far to go.","ar":"When you write a plan, a report or a message to a colleague, give the exact code and then read the objective in the framework. Do not rely on memory of \"what we always teach\". The wording includes limits, such as \"limited to roots, leaves, stems and flowers\" (1Bs.01). These limits tell you how far to go."}},{"t":"h","c":{"en":"How much is there? Objectives per stage","ar":"How much is there? Objectives per stage"}},{"t":"p","c":{"en":"The table below shows a count of the objectives listed for each stage in version 4.0 (counted from the stage pages for this CPD; check the framework if exact numbers matter).","ar":"The table below shows a count of the objectives listed for each stage in version 4.0 (counted from the stage pages for this CPD; check the framework if exact numbers matter)."}},{"t":"table","head":{"en":["Stage","TWS","Biology","Chemistry","Physics","Earth and Space","Science in Context","Total"],"ar":["Stage","TWS","Biology","Chemistry","Physics","Earth and Space","Science in Context","Total"]},"rows":[{"en":["1","8","7","5","7","4","4","35"],"ar":["1","8","7","5","7","4","4","35"]},{"en":["2","14","9","5","8","4","4","44"],"ar":["2","14","9","5","8","4","4","44"]},{"en":["3","17","8","7","10","5","4","51"],"ar":["3","17","8","7","10","5","4","51"]},{"en":["4","20","12","8","11","7","5","63"],"ar":["4","20","12","8","11","7","5","63"]},{"en":["5","20","11","7","9","7","5","59"],"ar":["5","20","11","7","9","7","5","59"]},{"en":["6","20","12","8","9","7","5","61"],"ar":["6","20","12","8","9","7","5","61"]}]},{"t":"p","c":{"en":"The pattern is clear. The number of objectives grows from 35 in Stage 1 to 63 in Stage 4 and stays at about 60 in Stages 5 and 6. The suggested teaching time also grows (45, 60 and 75 hours), but not as quickly. This helps you see why Stage 4 to 6 teaching needs careful pacing, and why practical work and talk need to be planned, not left to chance.","ar":"The pattern is clear. The number of objectives grows from 35 in Stage 1 to 63 in Stage 4 and stays at about 60 in Stages 5 and 6. The suggested teaching time also grows (45, 60 and 75 hours), but not as quickly. This helps you see why Stage 4 to 6 teaching needs careful pacing, and why practical work and talk need to be planned, not left to chance."}},{"t":"h","c":{"en":"Patterns of progression","ar":"Patterns of progression"}},{"t":"list","c":{"en":["\u003cstrong>Models and representations begin in Stage 2.\u003c/strong> There is no Models sub-strand in the Stage 1 Thinking and Working Scientifically listing.","\u003cstrong>Ecosystems begin in Stage 2.\u003c/strong> Stage 1 Biology has Structure and function and Life processes only.","\u003cstrong>Cycles on Earth appear only in Stages 5 and 6\u003c/strong> (the water cycle and the rock cycle).","\u003cstrong>Stage 6 Chemistry has no \"Materials and their structure\" sub-strand.\u003c/strong> Its objectives are about properties of materials and changes to materials.","\u003cstrong>Wording repeats in Thinking and Working Scientifically.\u003c/strong> For example, 5TWSp.04 and 6TWSp.04 are the same, and 3TWSp.01 to 3TWSp.03 are the same as 4TWSp.01 to 4TWSp.03. The scheme of work and teacher guide help with the intended depth, and your HOD and the progression document on the School Support Hub help you plan how pupils grow."],"ar":["\u003cstrong>Models and representations begin in Stage 2.\u003c/strong> There is no Models sub-strand in the Stage 1 Thinking and Working Scientifically listing.","\u003cstrong>Ecosystems begin in Stage 2.\u003c/strong> Stage 1 Biology has Structure and function and Life processes only.","\u003cstrong>Cycles on Earth appear only in Stages 5 and 6\u003c/strong> (the water cycle and the rock cycle).","\u003cstrong>Stage 6 Chemistry has no \"Materials and their structure\" sub-strand.\u003c/strong> Its objectives are about properties of materials and changes to materials.","\u003cstrong>Wording repeats in Thinking and Working Scientifically.\u003c/strong> For example, 5TWSp.04 and 6TWSp.04 are the same, and 3TWSp.01 to 3TWSp.03 are the same as 4TWSp.01 to 4TWSp.03. The scheme of work and teacher guide help with the intended depth, and your HOD and the progression document on the School Support Hub help you plan how pupils grow."]}},{"t":"h","c":{"en":"Reading the verbs","ar":"Reading the verbs"}},{"t":"p","c":{"en":"Objectives start with a verb. Look at the verbs in the Physics objectives for forces: \u003cem>explore\u003c/em> (1Pf.03), \u003cem>know\u003c/em> (2Pf.01), \u003cem>describe\u003c/em> (1Pf.02), \u003cem>use force diagrams\u003c/em> (5Pf.03). Good practice is to treat the verb as a clue to the depth. \"Explore\" asks pupils to try, talk about and describe. \"Know\" asks them to recall an idea. \"Explain\" (for example 4ESs.01) asks for reasons. Words such as \"limited to\" and \"e.g.\" also tell you the boundary of an objective.","ar":"Objectives start with a verb. Look at the verbs in the Physics objectives for forces: \u003cem>explore\u003c/em> (1Pf.03), \u003cem>know\u003c/em> (2Pf.01), \u003cem>describe\u003c/em> (1Pf.02), \u003cem>use force diagrams\u003c/em> (5Pf.03). Good practice is to treat the verb as a clue to the depth. \"Explore\" asks pupils to try, talk about and describe. \"Know\" asks them to recall an idea. \"Explain\" (for example 4ESs.01) asks for reasons. Words such as \"limited to\" and \"e.g.\" also tell you the boundary of an objective."}},{"t":"scenario","title":{"en":"Planning from a code","ar":"Planning from a code"},"c":{"en":"Your HOD sends you a message: \"Please check that 3Cp.03 is covered in unit 2.\" \u003cstrong>What do you do?\u003c/strong> Read the code: Stage 3, Chemistry, Properties of materials, objective 03. Open the Stage 3 page and read the wording: describe how to separate solid/solid mixtures based on the physical properties of the solids, with processes involving dissolving not required. Check your unit plan for an activity such as separating a mixture of sand and paper clips, and tell your HOD where in the plan it appears.","ar":"Your HOD sends you a message: \"Please check that 3Cp.03 is covered in unit 2.\" \u003cstrong>What do you do?\u003c/strong> Read the code: Stage 3, Chemistry, Properties of materials, objective 03. Open the Stage 3 page and read the wording: describe how to separate solid/solid mixtures based on the physical properties of the solids, with processes involving dissolving not required. Check your unit plan for an activity such as separating a mixture of sand and paper clips, and tell your HOD where in the plan it appears."}}],"checks":[{"id":"m3q1","q":{"en":"What does the code 6TWSa.03 tell you?","ar":"What does the code 6TWSa.03 tell you?"},"opts":[{"en":"It is the sixth objective in the Stage 3 analysis sub-strand of Thinking and Working Scientifically","ar":"It is the sixth objective in the Stage 3 analysis sub-strand of Thinking and Working Scientifically"},{"en":"It is a Stage 6 objective in the Science in Context strand, number 03 in the strand","ar":"It is a Stage 6 objective in the Science in Context strand, number 03 in the strand"},{"en":"Stage 6, Thinking and Working Scientifically, analysis, evaluation and conclusions, objective 03","ar":"Stage 6, Thinking and Working Scientifically, analysis, evaluation and conclusions, objective 03"},{"en":"It is the third Stage 6 objective about working scientifically in any sub-strand","ar":"It is the third Stage 6 objective about working scientifically in any sub-strand"}],"correct":2,"expl":{"en":"The first digit is the stage (6). TWS is the strand, a is the sub-strand letter (analysis, evaluation and conclusions), and 03 is the order number of the objective in that sub-strand for that stage.","ar":"The first digit is the stage (6). TWS is the strand, a is the sub-strand letter (analysis, evaluation and conclusions), and 03 is the order number of the objective in that sub-strand for that stage."}},{"id":"m3q2","q":{"en":"According to the framework, what do the three parts of a learning objective code show?","ar":"According to the framework, what do the three parts of a learning objective code show?"},"opts":[{"en":"The year group, the strand name in full, and the date of the last Cambridge update","ar":"The year group, the strand name in full, and the date of the last Cambridge update"},{"en":"The stage number, the assessment paper where it appears, and the number of marks","ar":"The stage number, the assessment paper where it appears, and the number of marks"},{"en":"The strand letter, the difficulty level of the objective, and the suggested hours","ar":"The strand letter, the difficulty level of the objective, and the suggested hours"},{"en":"The stage number, a reporting code for the sub-strand, and the order number","ar":"The stage number, a reporting code for the sub-strand, and the order number"}],"correct":3,"expl":{"en":"The framework lists exactly three parts: the stage number, a reporting code that appears in test feedback reports and reflects sub-strand titles, and a number for the order within the sub-strand for that stage.","ar":"The framework lists exactly three parts: the stage number, a reporting code that appears in test feedback reports and reflects sub-strand titles, and a number for the order within the sub-strand for that stage."}},{"id":"m3q3","q":{"en":"Which sentence about progression across Stages 1 to 6 is supported by the stage pages of the framework?","ar":"Which sentence about progression across Stages 1 to 6 is supported by the stage pages of the framework?"},"opts":[{"en":"Models and representations start in Stage 2, and Cycles on Earth appears in Stages 5 and 6","ar":"Models and representations start in Stage 2, and Cycles on Earth appears in Stages 5 and 6"},{"en":"Models and representations objectives start in Stage 1, and Cycles on Earth objectives appear in Stage 3","ar":"Models and representations objectives start in Stage 1, and Cycles on Earth objectives appear in Stage 3"},{"en":"Ecosystems objectives start in Stage 1, and Cycles on Earth objectives appear in Stage 4","ar":"Ecosystems objectives start in Stage 1, and Cycles on Earth objectives appear in Stage 4"},{"en":"Stage 6 has the largest number of objectives, and every sub-strand appears in every stage","ar":"Stage 6 has the largest number of objectives, and every sub-strand appears in every stage"}],"correct":0,"expl":{"en":"Stage 1 has no Models and representations listing and no Ecosystems listing. Cycles on Earth (water cycle, rock cycle) appears only at Stages 5 and 6. Stage 4 has the most objectives, and not every sub-strand appears in every stage.","ar":"Stage 1 has no Models and representations listing and no Ecosystems listing. Cycles on Earth (water cycle, rock cycle) appears only at Stages 5 and 6. Stage 4 has the most objectives, and not every sub-strand appears in every stage."}}]},{"id":"m4","title":{"en":"Thinking and Working Scientifically and Science in Context","ar":"Thinking and Working Scientifically and Science in Context"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Two strands do not belong to one topic. \u003cstrong>Thinking and Working Scientifically (TWS)\u003c/strong> is the skills strand. \u003cstrong>Science in Context (SIC)\u003c/strong> is the context strand. They are used with every content strand, in every stage. This module explains what each one covers, how its objectives are written, and how to build them into everyday lessons.","ar":"Two strands do not belong to one topic. \u003cstrong>Thinking and Working Scientifically (TWS)\u003c/strong> is the skills strand. \u003cstrong>Science in Context (SIC)\u003c/strong> is the context strand. They are used with every content strand, in every stage. This module explains what each one covers, how its objectives are written, and how to build them into everyday lessons."}},{"t":"h","c":{"en":"Thinking and Working Scientifically: three core approaches","ar":"Thinking and Working Scientifically: three core approaches"}},{"t":"p","c":{"en":"The framework says that TWS \"relates to the development of scientific skills and covers three core scientific approaches\":","ar":"The framework says that TWS \"relates to the development of scientific skills and covers three core scientific approaches\":"}},{"t":"list","c":{"en":["\u003cstrong>Models and representations.\u003c/strong> Scientists use models and representations for objects, systems and processes. They help explain ideas that are not visible or are abstract, and they can be used to make predictions or explain observations. The framework says these objectives are \"central to learners' understanding of science\".","\u003cstrong>Scientific enquiry.\u003c/strong> Skills around the purpose and planning of experiments and investigations, evidence collection, analysis, evaluations and conclusions.","\u003cstrong>Practical work.\u003c/strong> Skills of observation, measurement and equipment handling, so that learners collect accurate and reliable data."],"ar":["\u003cstrong>Models and representations.\u003c/strong> Scientists use models and representations for objects, systems and processes. They help explain ideas that are not visible or are abstract, and they can be used to make predictions or explain observations. The framework says these objectives are \"central to learners' understanding of science\".","\u003cstrong>Scientific enquiry.\u003c/strong> Skills around the purpose and planning of experiments and investigations, evidence collection, analysis, evaluations and conclusions.","\u003cstrong>Practical work.\u003c/strong> Skills of observation, measurement and equipment handling, so that learners collect accurate and reliable data."]}},{"t":"p","c":{"en":"In the stage pages these approaches are split into four sub-strands: \u003cstrong>Models and representations (m)\u003c/strong>, \u003cstrong>Scientific enquiry: purpose and planning (p)\u003c/strong>, \u003cstrong>Carrying out scientific enquiry (c)\u003c/strong> and \u003cstrong>Scientific enquiry: analysis, evaluation and conclusions (a)\u003c/strong>. A complete investigation passes through p, then c, then a. That is why the codes make a useful \"enquiry cycle\" for planning.","ar":"In the stage pages these approaches are split into four sub-strands: \u003cstrong>Models and representations (m)\u003c/s
