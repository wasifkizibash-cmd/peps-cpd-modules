trong>, \u003cstrong>Scientific enquiry: purpose and planning (p)\u003c/strong>, \u003cstrong>Carrying out scientific enquiry (c)\u003c/strong> and \u003cstrong>Scientific enquiry: analysis, evaluation and conclusions (a)\u003c/strong>. A complete investigation passes through p, then c, then a. That is why the codes make a useful \"enquiry cycle\" for planning."}},{"t":"h","c":{"en":"The five main types of scientific enquiry","ar":"The five main types of scientific enquiry"}},{"t":"p","c":{"en":"From Stage 3, the framework names five main types of scientific enquiry. 3TWSp.02 says pupils should know there are five types: \u003cstrong>research, fair testing, observing over time, identifying and classifying, and pattern seeking\u003c/strong>. 5TWSp.02 and 6TWSp.02 ask pupils to know the \u003cem>features\u003c/em> of each type, and 5TWSp.01 and 6TWSp.01 ask them to \u003cem>select\u003c/em> an appropriate type. Version 4.0 added the list of five types to 5TWSp.02 and 6TWSp.02.","ar":"From Stage 3, the framework names five main types of scientific enquiry. 3TWSp.02 says pupils should know there are five types: \u003cstrong>research, fair testing, observing over time, identifying and classifying, and pattern seeking\u003c/strong>. 5TWSp.02 and 6TWSp.02 ask pupils to know the \u003cem>features\u003c/em> of each type, and 5TWSp.01 and 6TWSp.01 ask them to \u003cem>select\u003c/em> an appropriate type. Version 4.0 added the list of five types to 5TWSp.02 and 6TWSp.02."}},{"t":"table","head":{"en":["Type of enquiry","Idea for a class investigation (good practice, not from the framework)","Linked content objective"],"ar":["Type of enquiry","Idea for a class investigation (good practice, not from the framework)","Linked content objective"]},"rows":[{"en":["Research","Pupils use books or a website to find out how a fossil forms, and report their answer","6ESp.02"],"ar":["Research","Pupils use books or a website to find out how a fossil forms, and report their answer","6ESp.02"]},{"en":["Fair testing","Pupils change one thing (the surface) and measure how far a toy car travels, keeping other factors the same","3Pf.04"],"ar":["Fair testing","Pupils change one thing (the surface) and measure how far a toy car travels, keeping other factors the same","3Pf.04"]},{"en":["Observing over time","Pupils soak seeds, check each day and record when the seeds germinate","5Bp.04"],"ar":["Observing over time","Pupils soak seeds, check each day and record when the seeds germinate","5Bp.04"]},{"en":["Identifying and classifying","Pupils sort animals into groups using their features, or use a key","3Bs.02, 4TWSc.02"],"ar":["Identifying and classifying","Pupils sort animals into groups using their features, or use a key","3Bs.02, 4TWSc.02"]},{"en":["Pattern seeking","Pupils move a torch closer to an object and look for a pattern in the size of the shadow","3Ps.03"],"ar":["Pattern seeking","Pupils move a torch closer to an object and look for a pattern in the size of the shadow","3Ps.03"]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: not every enquiry is a fair test","ar":"Good practice: not every enquiry is a fair test"},"c":{"en":"Many teachers use \"fair test\" for every practical. The framework names five types of enquiry. A lesson on classifying leaves, or on the shadow pattern, is also real science. Vary the type across the year so that pupils meet all five before the end of Stage 6.","ar":"Many teachers use \"fair test\" for every practical. The framework names five types of enquiry. A lesson on classifying leaves, or on the shadow pattern, is also real science. Vary the type across the year so that pupils meet all five before the end of Stage 6."}},{"t":"h","c":{"en":"How TWS objectives progress","ar":"How TWS objectives progress"}},{"t":"p","c":{"en":"Study the table. It shows what each sub-strand asks for in three bands of stages. The wording is summarised, so use the exact codes to find the framework text.","ar":"Study the table. It shows what each sub-strand asks for in three bands of stages. The wording is summarised, so use the exact codes to find the framework text."}},{"t":"table","head":{"en":["Sub-strand","Stages 1 and 2","Stages 3 and 4","Stages 5 and 6"],"ar":["Sub-strand","Stages 1 and 2","Stages 3 and 4","Stages 5 and 6"]},"rows":[{"en":["Models and representations (m)","Not listed in Stage 1. Stage 2: know a model represents something; make and use a physical model; diagram versus picture (2TWSm.01 to .03)","Types of models, including diagrams and physical models (3TWSm.01); models are not fully representative (4TWSm.01); use models to show relationships, quantities or scale (4TWSm.02)","A model shows some important features (5TWSm.01); use models, including diagrams, to represent and describe phenomena (5TWSm.02, 6TWSm.02); describe how a model helps us understand (6TWSm.01)"],"ar":["Models and representations (m)","Not listed in Stage 1. Stage 2: know a model represents something; make and use a physical model; diagram versus picture (2TWSm.01 to .03)","Types of models, including diagrams and physical models (3TWSm.01); models are not fully representative (4TWSm.01); use models to show relationships, quantities or scale (4TWSm.02)","A model shows some important features (5TWSm.01); use models, including diagrams, to represent and describe phenomena (5TWSm.02, 6TWSm.02); describe how a model helps us understand (6TWSm.01)"]},{"en":["Purpose and planning (p)","Ask questions and talk about how to find answers; make predictions (1TWSp.01, .02)","Ask scientific questions that can be investigated; know five types of enquiry; predict possible outcomes; identify risks (3TWSp.01 to .04); identify variables to change, keep the same and measure (4TWSp.04)","Select appropriate enquiries; plan fair tests with independent, dependent and control variables (5TWSp.04); describe risks and consider how to minimise them (5TWSp.05)"],"ar":["Purpose and planning (p)","Ask questions and talk about how to find answers; make predictions (1TWSp.01, .02)","Ask scientific questions that can be investigated; know five types of enquiry; predict possible outcomes; identify risks (3TWSp.01 to .04); identify variables to change, keep the same and measure (4TWSp.04)","Select appropriate enquiries; plan fair tests with independent, dependent and control variables (5TWSp.04); describe risks and consider how to minimise them (5TWSp.05)"]},{"en":["Carrying out (c)","Use given equipment; non-standard units; follow instructions safely; record in annotated images and simple tables; Stage 2 adds using a given secondary source (2TWSc.05)","Choose equipment from a selection; standard units; carry out practical work safely; research with secondary sources; record in tables and diagrams; Stage 4 adds keys (4TWSc.02) and knowing that repeated measurements give more reliable data (4TWSc.04)","Choose equipment for an investigation; decide when to repeat measurements; take appropriately accurate measurements; use a range of secondary sources; complete a key"],"ar":["Carrying out (c)","Use given equipment; non-standard units; follow instructions safely; record in annotated images and simple tables; Stage 2 adds using a given secondary source (2TWSc.05)","Choose equipment from a selection; standard units; carry out practical work safely; research with secondary sources; record in tables and diagrams; Stage 4 adds keys (4TWSc.02) and knowing that repeated measurements give more reliable data (4TWSc.04)","Choose equipment for an investigation; decide when to repeat measurements; take appropriately accurate measurements; use a range of secondary sources; complete a key"]},{"en":["Analysis, evaluation and conclusions (a)","Describe what happened and whether it matched the prediction; Stage 2 adds simple patterns and block graphs (2TWSa.02, .03)","Identify whether results support a prediction; describe simple patterns; make a conclusion related to the question; present results in tables and bar charts (Stage 4 adds dot plots)","Describe the accuracy of predictions; describe patterns, including anomalous results; conclude using scientific understanding; suggest improvements; add line graphs (Stage 5) and scatter graphs (Stage 6)"],"ar":["Analysis, evaluation and conclusions (a)","Describe what happened and whether it matched the prediction; Stage 2 adds simple patterns and block graphs (2TWSa.02, .03)","Identify whether results support a prediction; describe simple patterns; make a conclusion related to the question; present results in tables and bar charts (Stage 4 adds dot plots)","Describe the accuracy of predictions; describe patterns, including anomalous results; conclude using scientific understanding; suggest improvements; add line graphs (Stage 5) and scatter graphs (Stage 6)"]}]},{"t":"h","c":{"en":"Reading the progression","ar":"Reading the progression"}},{"t":"list","c":{"en":["\u003cstrong>Independence grows.\u003c/strong> Pupils move from \"use given equipment\" (Stage 1) to \"choose equipment from a provided selection\" (Stage 3) to \"choose equipment to carry out an investigation\" (Stage 5).","\u003cstrong>Words become more precise.\u003c/strong> Stage 1 uses non-standard units (1TWSc.03). From Stage 3, pupils use standard units and describe their advantage (3TWSc.03). In Stage 5 they use \"independent, dependent and control variables\" (5TWSp.04).","\u003cstrong>Evidence is questioned.\u003c/strong> From Stage 5, pupils identify anomalous results (5TWSa.02), judge accuracy (5TWSa.01) and say how the investigation could be improved (5TWSa.04).","\u003cstrong>Wording repeats across stages.\u003c/strong> For example, the Stage 5 and Stage 6 objectives for purpose and planning are the same. The Cambridge teacher guide and schemes of work give examples of the intended depth; your own stage's work should show a higher level of independence and accuracy."],"ar":["\u003cstrong>Independence grows.\u003c/strong> Pupils move from \"use given equipment\" (Stage 1) to \"choose equipment from a provided selection\" (Stage 3) to \"choose equipment to carry out an investigation\" (Stage 5).","\u003cstrong>Words become more precise.\u003c/strong> Stage 1 uses non-standard units (1TWSc.03). From Stage 3, pupils use standard units and describe their advantage (3TWSc.03). In Stage 5 they use \"independent, dependent and control variables\" (5TWSp.04).","\u003cstrong>Evidence is questioned.\u003c/strong> From Stage 5, pupils identify anomalous results (5TWSa.02), judge accuracy (5TWSa.01) and say how the investigation could be improved (5TWSa.04).","\u003cstrong>Wording repeats across stages.\u003c/strong> For example, the Stage 5 and Stage 6 objectives for purpose and planning are the same. The Cambridge teacher guide and schemes of work give examples of the intended depth; your own stage's work should show a higher level of independence and accuracy."]}},{"t":"callout","k":"warn","title":{"en":"Safety is part of the objectives","ar":"Safety is part of the objectives"},"c":{"en":"Safety appears in TWS in every stage: \"follow instructions safely\" (1TWSc.04), \"identify risks and explain how to stay safe\" (3TWSp.04), and \"describe risks when planning practical work and consider how to minimise them\" (5TWSp.05). The framework also states that the teacher in charge must follow national, regional and school safety regulations and make a risk assessment for any experiment. Part B covers planning and safety in more detail.","ar":"Safety appears in TWS in every stage: \"follow instructions safely\" (1TWSc.04), \"identify risks and explain how to stay safe\" (3TWSp.04), and \"describe risks when planning practical work and consider how to minimise them\" (5TWSp.05). The framework also states that the teacher in charge must follow national, regional and school safety regulations and make a risk assessment for any experiment. Part B covers planning and safety in more detail."}},{"t":"h","c":{"en":"Science in Context: what it covers","ar":"Science in Context: what it covers"}},{"t":"p","c":{"en":"The framework describes SIC as \"a framework of statements to help learners study and understand the learning objectives within the other five science strands in a context relevant to them\". Learners link concepts and processes from the classroom to scientists and their work, science phenomena, and ideas and events relevant to their age and experience. The framework adds that Stages 1 to 3 should focus on \"learners' experiences and surroundings\", and Stages 4 to 6 should \"draw on broader local contexts or elsewhere in the country and region\".","ar":"The framework describes SIC as \"a framework of statements to help learners study and understand the learning objectives within the other five science strands in a context relevant to them\". Learners link concepts and processes from the classroom to scientists and their work, science phenomena, and ideas and events relevant to their age and experience. The framework adds that Stages 1 to 3 should focus on \"learners' experiences and surroundings\", and Stages 4 to 6 should \"draw on broader local contexts or elsewhere in the country and region\"."}},{"t":"table","head":{"en":["Stages","Number of SIC objectives","Focus of the objectives (summary)"],"ar":["Stages","Number of SIC objectives","Focus of the objectives (summary)"]},"rows":[{"en":["1 to 3","4 per stage (the same four statements in each stage)","How scientific knowledge was different in the past (.01); how science explains how objects work (.02); everyone uses science, and people use science professionally (.03); how science helps us understand our effect on the world (.04)"],"ar":["1 to 3","4 per stage (the same four statements in each stage)","How scientific knowledge was different in the past (.01); how science explains how objects work (.02); everyone uses science, and people use science professionally (.03); how science helps us understand our effect on the world (.04)"]},{"en":["4 to 6","5 per stage (the same five statements in each stage)","How knowledge changes over time through evidence (.01); how science is used locally (.02); using science to support points in discussions (.03); people who use science in their area (.04); positive and negative environmental effects of science and technology locally (.05)"],"ar":["4 to 6","5 per stage (the same five statements in each stage)","How knowledge changes over time through evidence (.01); how science is used locally (.02); using science to support points in discussions (.03); people who use science in their area (.04); positive and negative environmental effects of science and technology locally (.05)"]}]},{"t":"p","c":{"en":"Because the wording repeats across three stages, the \u003cem>depth\u003c/em> comes from the context you choose and the talk you expect. In Stage 1, \"Talk about how science explains how objects they use, or know about, work\" (1SIC.02) might use a torch or a toy. In Stage 3, the same objective can use a more complex object that pupils investigate in a practical lesson. This is good practice; check the teacher guide and schemes of work for Cambridge examples.","ar":"Because the wording repeats across three stages, the \u003cem>depth\u003c/em> comes from the context you choose and the talk you expect. In Stage 1, \"Talk about how science explains how objects they use, or know about, work\" (1SIC.02) might use a torch or a toy. In Stage 3, the same objective can use a more complex object that pupils investigate in a practical lesson. This is good practice; check the teacher guide and schemes of work for Cambridge examples."}},{"t":"h","c":{"en":"Embedding TWS and SIC in a unit","ar":"Embedding TWS and SIC in a unit"}},{"t":"steps","c":{"en":["\u003cstrong>Start with the content objective.\u003c/strong> For example, 4Cc.01: describe freezing and melting using the particle model.","\u003cstrong>Choose the TWS skills the lesson will practise.\u003c/strong> For example, 4TWSp.04 (identify what to change, keep the same and measure) and 4TWSc.05 (take measurements in standard units).","\u003cstrong>Choose a SIC context.\u003c/strong> For example, 4SIC.02 (how science is used in the local area): why do people store ice or cold water in hot weather?","\u003cstrong>Plan the talk and the writing.\u003c/strong> Decide what pupils will say or write: a prediction sentence, a table of results, a conclusion with \"because\".","\u003cstrong>Record the codes.\u003c/strong> Put the content, TWS and SIC codes on the plan, so that you can check coverage later."],"ar":["\u003cstrong>Start with the content objective.\u003c/strong> For example, 4Cc.01: describe freezing and melting using the particle model.","\u003cstrong>Choose the TWS skills the lesson will practise.\u003c/strong> For example, 4TWSp.04 (identify what to change, keep the same and measure) and 4TWSc.05 (take measurements in standard units).","\u003cstrong>Choose a SIC context.\u003c/strong> For example, 4SIC.02 (how science is used in the local area): why do people store ice or cold water in hot weather?","\u003cstrong>Plan the talk and the writing.\u003c/strong> Decide what pupils will say or write: a prediction sentence, a table of results, a conclusion with \"because\".","\u003cstrong>Record the codes.\u003c/strong> Put the content, TWS and SIC codes on the plan, so that you can check coverage later."]}},{"t":"callout","k":"tip","title":{"en":"Good practice for ESL pupils","ar":"Good practice for ESL pupils"},"c":{"en":"Give pupils sentence frames, such as \"I predict that ... because ...\", \"The results show that ...\", \"This is not a fair test because ...\". Use diagrams and tables first, then short sentences. These frames help pupils do the scientific thinking even when their English vocabulary is still growing.","ar":"Give pupils sentence frames, such as \"I predict that ... because ...\", \"The results show that ...\", \"This is not a fair test because ...\". Use diagrams and tables first, then short sentences. These frames help pupils do the scientific thinking even when their English vocabulary is still growing."}},{"t":"scenario","title":{"en":"The Stage 5 \"fair test\" that is not fair","ar":"The Stage 5 \"fair test\" that is not fair"},"c":{"en":"Year 5 pupils test which of three paper towels absorbs the most water. Group B uses a small cup of water for one towel and a large cup for another, and decides that towel 2 \"is best\". Another pupil says the test is not fair. \u003cstrong>How do you use the TWS objectives?\u003c/strong> Link to 5TWSp.04: the group must identify the independent variable (type of towel), the dependent variable (amount of water absorbed) and control variables (the amount of water, the size of the towel, the time). Ask them to improve the plan, repeat the test (5TWSc.04) and write a conclusion linked to evidence (5TWSa.03). Finally, ask what could still affect accuracy (5TWSa.04).","ar":"Year 5 pupils test which of three paper towels absorbs the most water. Group B uses a small cup of water for one towel and a large cup for another, and decides that towel 2 \"is best\". Another pupil says the test is not fair. \u003cstrong>How do you use the TWS objectives?\u003c/strong> Link to 5TWSp.04: the group must identify the independent variable (type of towel), the dependent variable (amount of water absorbed) and control variables (the amount of water, the size of the towel, the time). Ask them to improve the plan, repeat the test (5TWSc.04) and write a conclusion linked to evidence (5TWSa.03). Finally, ask what could still affect accuracy (5TWSa.04)."}}],"checks":[{"id":"m4q1","q":{"en":"Which list correctly names the five main types of scientific enquiry given in 3TWSp.02?","ar":"Which list correctly names the five main types of scientific enquiry given in 3TWSp.02?"},"opts":[{"en":"Research, fair testing, modelling, measuring and classifying, and pattern seeking","ar":"Research, fair testing, modelling, measuring and classifying, and pattern seeking"},{"en":"Research, fair testing, observing over time, identifying and classifying, and pattern seeking","ar":"Research, fair testing, observing over time, identifying and classifying, and pattern seeking"},{"en":"Experiment, fair testing, observing over time, sorting and grouping, and surveying","ar":"Experiment, fair testing, observing over time, sorting and grouping, and surveying"},{"en":"Research, comparative testing, observing over time, identifying and ranking, and investigating","ar":"Research, comparative testing, observing over time, identifying and ranking, and investigating"}],"correct":1,"expl":{"en":"3TWSp.02 names these five types. They repeat in 4TWSp.02, 5TWSp.02 and 6TWSp.02. The other options mix in words that are not in the framework list.","ar":"3TWSp.02 names these five types. They repeat in 4TWSp.02, 5TWSp.02 and 6TWSp.02. The other options mix in words that are not in the framework list."}},{"id":"m4q2","q":{"en":"A Year 2 teacher wants her pupils to learn that a model can represent an object or idea. Which objective code should she plan for?","ar":"A Year 2 teacher wants her pupils to learn that a model can represent an object or idea. Which objective code should she plan for?"},"opts":[{"en":"1TWSm.01, because Models and representations objectives start in Stage 1","ar":"1TWSm.01, because Models and representations objectives start in Stage 1"},{"en":"2TWSp.01, because models belong to the purpose and planning sub-strand","ar":"2TWSp.01, because models belong to the purpose and planning sub-strand"},{"en":"2TWSm.01, because Models and representations objectives start in Stage 2","ar":"2TWSm.01, because Models and representations objectives start in Stage 2"},{"en":"2SIC.02, because models are part of the context strand in Stage 2","ar":"2SIC.02, because models are part of the context strand in Stage 2"}],"correct":2,"expl":{"en":"2TWSm.01 says: know that a model represents an object or idea in a clear way. Stage 1 has no Models sub-strand listing, and models are in the m sub-strand, not p or SIC.","ar":"2TWSm.01 says: know that a model represents an object or idea in a clear way. Stage 1 has no Models sub-strand listing, and models are in the m sub-strand, not p or SIC."}},{"id":"m4q3","q":{"en":"According to the framework, what should the science activities in Stages 4 to 6 draw on in Science in Context?","ar":"According to the framework, what should the science activities in Stages 4 to 6 draw on in Science in Context?"},"opts":[{"en":"Only the pupils' own experiences and the surroundings of the classroom","ar":"Only the pupils' own experiences and the surroundings of the classroom"},{"en":"Global scientific research that is not linked to the pupils' own area","ar":"Global scientific research that is not linked to the pupils' own area"},{"en":"Only the contexts used in Cambridge assessments for Stage 6","ar":"Only the contexts used in Cambridge assessments for Stage 6"},{"en":"Broader local contexts or elsewhere in the country and region","ar":"Broader local contexts or elsewhere in the country and region"}],"correct":3,"expl":{"en":"The framework says that in Stages 1 to 3 science activities should focus on learners' experiences and surroundings, and in Stages 4 to 6 they should draw on broader local contexts or elsewhere in the country and region.","ar":"The framework says that in Stages 1 to 3 science activities should focus on learners' experiences and surroundings, and in Stages 4 to 6 they should draw on broader local contexts or elsewhere in the country and region."}}]},{"id":"m5","title":{"en":"Biology Across Stages 1 to 6","ar":"Biology Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Biology as \"the study of living things and how they interact with each other\". Learners develop understanding about life processes, \"including how the structure and development of living things allows them to maintain these processes\". This module follows the Biology strand from Stage 1 to Stage 6, shows how its ideas build, and points out links to other strands.","ar":"The framework describes Biology as \"the study of living things and how they interact with each other\". Learners develop understanding about life processes, \"including how the structure and development of living things allows them to maintain these processes\". This module follows the Biology strand from Stage 1 to Stage 6, shows how its ideas build, and points out links to other strands."}},{"t":"h","c":{"en":"Three sub-strands","ar":"Three sub-strands"}},{"t":"list","c":{"en":["\u003cstrong>Structure and function (Bs):\u003c/strong> the parts of plants, animals and the human body, and what they do. It appears in every stage.","\u003cstrong>Life processes (Bp):\u003c/strong> what living things need, how they grow, reproduce and stay healthy. It appears in every stage.","\u003cstrong>Ecosystems (Be):\u003c/strong> habitats, food chains and adaptation. It begins in Stage 2."],"ar":["\u003cstrong>Structure and function (Bs):\u003c/strong> the parts of plants, animals and the human body, and what they do. It appears in every stage.","\u003cstrong>Life processes (Bp):\u003c/strong> what living things need, how they grow, reproduce and stay healthy. It appears in every stage.","\u003cstrong>Ecosystems (Be):\u003c/strong> habitats, food chains and adaptation. It begins in Stage 2."]}},{"t":"h","c":{"en":"Key ideas, stage by stage","ar":"Key ideas, stage by stage"}},{"t":"p","c":{"en":"The tables give a short summary of the objectives in each stage. They are not a replacement for the framework wording, which includes important limits such as \"limited to ...\".","ar":"The tables give a short summary of the objectives in each stage. They are not a replacement for the framework wording, which includes important limits such as \"limited to ...\"."}},{"t":"table","head":{"en":["Stage","Structure and function (Bs)","Life processes (Bp)","Ecosystems (Be)"],"ar":["Stage","Structure and function (Bs)","Life processes (Bp)","Ecosystems (Be)"]},"rows":[{"en":["1","Major parts of flowering plants (roots, leaves, stems, flowers); the five senses; external parts of the human body (1Bs.01 to .03)","Living things and things never alive; animals (including humans) need air, water, food; plants need light and water; how humans are similar and different (1Bp.01 to .04)","Not listed"],"ar":["1","Major parts of flowering plants (roots, leaves, stems, flowers); the five senses; external parts of the human body (1Bs.01 to .03)","Living things and things never alive; animals (including humans) need air, water, food; plants need light and water; how humans are similar and different (1Bp.01 to .04)","Not listed"]},{"en":["2","Compare external body parts and skin covering of animals; types of human teeth and how to care for them (2Bs.01, .02)","Diet, hygiene and movement for health; illness and its signs; how offspring change as they grow; offspring have a combination of features from parents (2Bp.01 to .04)","Habitat; different habitats have different plants and animals; compare local environments (2Be.01 to .03)"],"ar":["2","Compare external body parts and skin covering of animals; types of human teeth and how to care for them (2Bs.01, .02)","Diet, hygiene and movement for health; illness and its signs; how offspring change as they grow; offspring have a combination of features from parents (2Bp.01 to .04)","Habitat; different habitats have different plants and animals; compare local environments (2Be.01 to .03)"]},{"en":["3","Functions of plant parts; groups of animals (fish, reptiles, mammals, birds, amphibians, insects); important organs and their functions (3Bs.01 to .03)","Living, once alive and never lived; life processes (nutrition, growth, movement, reproduction); conditions plants need; how offspring grow into adults (3Bp.01 to .04)","Simple food chains: plants as producers, animals as consumers (3Be.01)"],"ar":["3","Functions of plant parts; groups of animals (fish, reptiles, mammals, birds, amphibians, insects); important organs and their functions (3Bs.01 to .03)","Living, once alive and never lived; life processes (nutrition, growth, movement, reproduction); conditions plants need; how offspring grow into adults (3Bp.01 to .04)","Simple food chains: plants as producers, animals as consumers (3Be.01)"]},{"en":["4","Important bones; muscles in pairs move bones; functions of skeletons; exoskeleton; vertebrates and invertebrates (4Bs.01 to .05)","Medicines and safe use; infectious diseases and vaccinations; energy for plants (from light) and animals (from food); movement and health (4Bp.01 to .04)","Animals suited to habitats; survive outside their habitat; food chains with herbivores, omnivores, carnivores, predators and prey (4Be.01 to .03)"],"ar":["4","Important bones; muscles in pairs move bones; functions of skeletons; exoskeleton; vertebrates and invertebrates (4Bs.01 to .05)","Medicines and safe use; infectious diseases and vaccinations; energy for plants (from light) and animals (from food); movement and health (4Bp.01 to .04)","Animals suited to habitats; survive outside their habitat; food chains with herbivores, omnivores, carnivores, predators and prey (4Be.01 to .03)"]},{"en":["5","Not all plants produce flowers; parts of a flower and their functions; the human digestive system (5Bs.01 to .04)","Balanced diet; life cycle of a flowering plant; pollination, fruit and seed production, seed dispersal; germination (5Bp.01 to .04)","Adaptations to hot, cold, wet and dry environments; flowers adapted for pollinators and seed dispersal; predator and prey adaptations (5Be.01 to .03)"],"ar":["5","Not all plants produce flowers; parts of a flower and their functions; the human digestive system (5Bs.01 to .04)","Balanced diet; life cycle of a flowering plant; pollination, fruit and seed production, seed dispersal; germination (5Bp.01 to .04)","Adaptations to hot, cold, wet and dry environments; flowers adapted for pollinators and seed dispersal; predator and prey adaptations (5Be.01 to .03)"]},{"en":["6","Circulatory system; respiratory system; names of parts of the human reproductive system (6Bs.01 to .03)","Physical changes in puberty; infection by viruses, bacteria, parasites or fungi; hygiene and controlling infectious disease; body defences (6Bp.01 to .04)","Interpret food webs; toxic substances moving through a food chain or web; energy source and transfer in a food chain or web (6Be.01 to .03)"],"ar":["6","Circulatory system; respiratory system; names of parts of the human reproductive system (6Bs.01 to .03)","Physical changes in puberty; infection by viruses, bacteria, parasites or fungi; hygiene and controlling infectious disease; body defences (6Bp.01 to .04)","Interpret food webs; toxic substances moving through a food chain or web; energy source and transfer in a food chain or web (6Be.01 to .03)"]}]},{"t":"h","c":{"en":"How the ideas build","ar":"How the ideas build"}},{"t":"p","c":{"en":"Follow four \"threads\" through the stages. Each thread starts with something pupils can see and moves to something they can explain.","ar":"Follow four \"threads\" through the stages. Each thread starts with something pupils can see and moves to something they can explain."}},{"t":"table","head":{"en":["Thread","Stage path (exact codes)","What changes"],"ar":["Thread","Stage path (exact codes)","What changes"]},"rows":[{"en":["Plants","1Bs.01 names parts, then 3Bs.01 gives their functions, then 5Bs.02 and 5Bs.03 look inside the flower, then 5Bp.02 to 5Bp.04 follow the life cycle","From naming, to function, to structure of a flower, to reproduction"],"ar":["Plants","1Bs.01 names parts, then 3Bs.01 gives their functions, then 5Bs.02 and 5Bs.03 look inside the flower, then 5Bp.02 to 5Bp.04 follow the life cycle","From naming, to function, to structure of a flower, to reproduction"]},{"en":["The human body","1Bs.03 external parts, 3Bs.03 organs, 4Bs.01 to 4Bs.03 skeleton and muscles, 5Bs.04 digestive system, 6Bs.01 and 6Bs.02 circulatory and respiratory","From outside the body to organs, then to systems that work together"],"ar":["The human body","1Bs.03 external parts, 3Bs.03 organs, 4Bs.01 to 4Bs.03 skeleton and muscles, 5Bs.04 digestive system, 6Bs.01 and 6Bs.02 circulatory and respiratory","From outside the body to organs, then to systems that work together"]},{"en":["Food and energy","1Bp.02 what animals need, 3Be.01 food chains, 4Bp.03 energy from light or from eating, 4Be.03 consumer types, 6Be.03 energy transfer","From \"needs food\" to energy moving through a food chain or web"],"ar":["Food and energy","1Bp.02 what animals need, 3Be.01 food chains, 4Bp.03 energy from light or from eating, 4Be.03 consumer types, 6Be.03 energy transfer","From \"needs food\" to energy moving through a food chain or web"]},{"en":["Health and disease","2Bp.01 and 2Bp.02 health and illness, 4Bp.01 and 4Bp.02 medicines and infectious disease, 5Bp.01 balanced diet, 6Bp.02 to 6Bp.04 causes, hygiene and defences","From personal habits to the science of infection"],"ar":["Health and disease","2Bp.01 and 2Bp.02 health and illness, 4Bp.01 and 4Bp.02 medicines and infectious disease, 5Bp.01 balanced diet, 6Bp.02 to 6Bp.04 causes, hygiene and defences","From personal habits to the science of infection"]}]},{"t":"callout","k":"key","title":{"en":"Living things and the word \"animals\"","ar":"Living things and the word \"animals\""},"c":{"en":"Several objectives say \"animals, including humans\" (for example 1Bp.02, 2Bs.01 and 2Bp.03). The framework treats humans as animals. Make sure pupils say \"animals and humans\" only when they want to talk about humans separately, not because they think humans are different kinds of living things.","ar":"Several objectives say \"animals, including humans\" (for example 1Bp.02, 2Bs.01 and 2Bp.03). The framework treats humans as animals. Make sure pupils say \"animals and humans\" only when they want to talk about humans separately, not because they think humans are different kinds of living things."}},{"t":"h","c":{"en":"Links to other strands","ar":"Links to other strands"}},{"t":"list","c":{"en":["\u003cstrong>Chemistry:\u003c/strong> the digestive system (5Bs.04) and respiratory system (6Bs.02) involve substances moving and changing; the particle model begins in Stage 4 (4Cm.01).","\u003cstrong>Physics:\u003c/strong> 4Bs.02 (pairs of muscles) uses ideas of forces and movement; 4Bp.03 uses the idea that energy is needed for movement (4Pf.03).","\u003cstrong>Earth and Space:\u003c/strong> 4Bp.03 says plants get energy from light, and 1ESs.02 introduces the Sun as a source of heat and light. 5ESp.03 (pollution) links to the effects on living things in 6Be.02 (toxic substances).","\u003cstrong>TWS:\u003c/strong> sorting and grouping living things (1TWSc.01, 3TWSc.01), keys (4TWSc.02, 5TWSc.02) and observing over time (for example seed germination) all use Biology content.","\u003cstrong>Science in Context:\u003c/strong> 2Bp.01 (healthy habits) and 4Bp.01 (medicines) are easy to link to local health information and people who use science professionally (4SIC.04)."],"ar":["\u003cstrong>Chemistry:\u003c/strong> the digestive system (5Bs.04) and respiratory system (6Bs.02) involve substances moving and changing; the particle model begins in Stage 4 (4Cm.01).","\u003cstrong>Physics:\u003c/strong> 4Bs.02 (pairs of muscles) uses ideas of forces and movement; 4Bp.03 uses the idea that energy is needed for movement (4Pf.03).","\u003cstrong>Earth and Space:\u003c/strong> 4Bp.03 says plants get energy from light, and 1ESs.02 introduces the Sun as a source of heat and light. 5ESp.03 (pollution) links to the effects on living things in 6Be.02 (toxic substances).","\u003cstrong>TWS:\u003c/strong> sorting and grouping living things (1TWSc.01, 3TWSc.01), keys (4TWSc.02, 5TWSc.02) and observing over time (for example seed germination) all use Biology content.","\u003cstrong>Science in Context:\u003c/strong> 2Bp.01 (healthy habits) and 4Bp.01 (medicines) are easy to link to local health information and people who use science professionally (4SIC.04)."]}},{"t":"h","c":{"en":"Common ideas to watch (good practice)","ar":"Common ideas to watch (good practice)"}},{"t":"p","c":{"en":"The framework does not list misconceptions; the schemes of work do. These are ideas teachers often report, and are useful to check for in a Biology unit. Ask pupils to draw or explain before the lesson and again after it.","ar":"The framework does not list misconceptions; the schemes of work do. These are ideas teachers often report, and are useful to check for in a Biology unit. Ask pupils to draw or explain before the lesson and again after it."}},{"t":"list","c":{"en":["\"Plants get their food from the soil.\" Compare 1Bp.03 (plants need light and water) and 4Bp.03 (plants get energy from light).","\"Something that is not alive was never alive.\" 3Bp.01 uses three groups: living, once alive and never lived.","\"All plants have flowers.\" 5Bs.01 says not all plants produce flowers.","\"Food chain arrows show who eats whom.\" Pupils also need to learn that energy is transferred (6Be.03).","\"Invertebrates are small.\" 4Bs.05 defines vertebrates by a backbone, not by size."],"ar":["\"Plants get their food from the soil.\" Compare 1Bp.03 (plants need light and water) and 4Bp.03 (plants get energy from light).","\"Something that is not alive was never alive.\" 3Bp.01 uses three groups: living, once alive and never lived.","\"All plants have flowers.\" 5Bs.01 says not all plants produce flowers.","\"Food chain arrows show who eats whom.\" Pupils also need to learn that energy is transferred (6Be.03).","\"Invertebrates are small.\" 4Bs.05 defines vertebrates by a backbone, not by size."]}},{"t":"h","c":{"en":"Two sensitive areas in the framework","ar":"Two sensitive areas in the framework"}},{"t":"callout","k":"warn","title":{"en":"Human reproduction and puberty (Stage 6)","ar":"Human reproduction and puberty (Stage 6)"},"c":{"en":"The framework expects schools to have their own sex education policy within the national legislative framework, drawn up in consultation with parents. It says the Cambridge Primary Science curriculum is \u003cstrong>factual\u003c/strong>: it covers changes to the human body during puberty and the structure of the human reproductive organs. It does not address attitudes and values. In Cambridge Primary Checkpoint and Stage 6 Progression Tests, 6Bs.03 (name the parts of the human reproductive system) will not be assessed, and 6Bp.01 (physical changes in puberty) will be assessed, with credit for all physical changes of puberty. Follow the school's policy and speak to your HOD before teaching these objectives.","ar":"The framework expects schools to have their own sex education policy within the national legislative framework, drawn up in consultation with parents. It says the Cambridge Primary Science curriculum is \u003cstrong>factual\u003c/strong>: it covers changes to the human body during puberty and the structure of the human reproductive organs. It does not address attitudes and values. In Cambridge Primary Checkpoint and Stage 6 Progression Tests, 6Bs.03 (name the parts of the human reproductive system) will not be assessed, and 6Bp.01 (physical changes in puberty) will be assessed, with credit for all physical changes of puberty. Follow the school's policy and speak to your HOD before teaching these objectives."}},{"t":"callout","k":"warn","title":{"en":"Animals in science","ar":"Animals in science"},"c":{"en":"The framework says learners should have opportunities to observe animals in their natural environment, done responsibly and without distress or harm to the animals or damage to the environment. If living animals are brought into school, the teacher must follow national, regional and school regulations and make sure the animals have a suitable environment, a suitable diet, the opportunity for normal behaviour and protection from pain, injury, suffering and disease. There is no requirement for dissection in Cambridge Primary.","ar":"The framework says learners should have opportunities to observe animals in their natural environment, done responsibly and without distress or harm to the animals or damage to the environment. If living animals are brought into school, the teacher must follow national, regional and school regulations and make sure the animals have a suitable environment, a suitable diet, the opportunity for normal behaviour and protection from pain, injury, suffering and disease. There is no requirement for dissection in Cambridge Primary."}},{"t":"scenario","title":{"en":"A \"dead\" pupil debate","ar":"A \"dead\" pupil debate"},"c":{"en":"In a Year 3 lesson on 3Bp.01, a pupil says a wooden table is \"dead\" and a stone is \"not dead\". Another says both are \"just things\". The class cannot agree. \u003cstrong>What do you do?\u003c/strong> Return to the objective: describe differences between things that are living, that were once alive and that have never lived. Give three sorting rings. Ask pupils to place wood from a tree, a leaf on the playground, a stone, a plastic cup and a pet fish, and to give a reason using life processes (3Bp.02). Accept that \"wood was once alive\" is the scientific idea, and add the word \"once\" to the word wall.","ar":"In a Year 3 lesson on 3Bp.01, a pupil says a wooden table is \"dead\" and a stone is \"not dead\". Another says both are \"just things\". The class cannot agree. \u003cstrong>What do you do?\u003c/strong> Return to the objective: describe differences between things that are living, that were once alive and that have never lived. Give three sorting rings. Ask pupils to place wood from a tree, a leaf on the playground, a stone, a plastic cup and a pet fish, and to give a reason using life processes (3Bp.02). Accept that \"wood was once alive\" is the scientific idea, and add the word \"once\" to the word wall."}}],"checks":[{"id":"m5q1","q":{"en":"In which stage does the Ecosystems sub-strand of Biology first appear?","ar":"In which stage does the Ecosystems sub-strand of Biology first appear?"},"opts":[{"en":"Stage 2, where pupils meet habitats and local environments","ar":"Stage 2, where pupils meet habitats and local environments"},{"en":"Stage 1, where pupils learn about plant parts and the senses","ar":"Stage 1, where pupils learn about plant parts and the senses"},{"en":"Stage 3, where pupils first meet simple food chains","ar":"Stage 3, where pupils first meet simple food chains"},{"en":"Stage 4, where pupils classify consumers in a food chain","ar":"Stage 4, where pupils classify consumers in a food chain"}],"correct":0,"expl":{"en":"Stage 1 Biology lists only Structure and function and Life processes. Ecosystems start in Stage 2 with 2Be.01 to 2Be.03.","ar":"Stage 1 Biology lists only Structure and function and Life processes. Ecosystems start in Stage 2 with 2Be.01 to 2Be.03."}},{"id":"m5q2","q":{"en":"A Stage 6 teacher asks what the framework says about assessing human reproduction in Checkpoint and Stage 6 Progression Tests. What is the correct answer?","ar":"A Stage 6 teacher asks what the framework says about assessing human reproduction in Checkpoint and Stage 6 Progression Tests. What is the correct answer?"},"opts":[{"en":"6Bs.03 and 6Bp.01 will both be assessed, and pupils must name all the reproductive organs","ar":"6Bs.03 and 6Bp.01 will both be assessed, and pupils must name all the reproductive organs"},{"en":"6Bs.03 will not be assessed, but 6Bp.01 will be, with credit for all the physical changes","ar":"6Bs.03 will not be assessed, but 6Bp.01 will be, with credit for all the physical changes"},{"en":"6Bs.03 will be assessed and 6Bp.01 will not be assessed, because puberty is covered by the school policy","ar":"6Bs.03 will be assessed and 6Bp.01 will not be assessed, because puberty is covered by the school policy"},{"en":"Neither objective will be assessed, because human reproduction is covered only by the school's own policy","ar":"Neither objective will be assessed, because human reproduction is covered only by the school's own policy"}],"correct":1,"expl":{"en":"The framework states that 6Bs.03 will not be assessed, and that 6Bp.01 will be assessed, with credit for all physical changes in puberty, including those not related to the reproductive organs.","ar":"The framework states that 6Bs.03 will not be assessed, and that 6Bp.01 will be assessed, with credit for all physical changes in puberty, including those not related to the reproductive organs."}},{"id":"m5q3","q":{"en":"A teacher plans a Stage 4 lesson in which pupils explain how plants and animals get their energy. Which objective is the best match?","ar":"A teacher plans a Stage 4 lesson in which pupils explain how plants and animals get their energy. Which objective is the best match?"},"opts":[{"en":"4Bp.01, which says that medicines can be used to treat some illnesses","ar":"4Bp.01, which says that medicines can be used to treat some illnesses"},{"en":"4Be.01, which says that different animals are found in, and suited to, different habitats","ar":"4Be.01, which says that different animals are found in, and suited to, different habitats"},{"en":"4Bp.03, which says plants get energy from light and animals get energy from food","ar":"4Bp.03, which says plants get energy from light and animals get energy from food"},{"en":"4Bs.05, which says that vertebrates are animals with a backbone","ar":"4Bs.05, which says that vertebrates are animals with a backbone"}],"correct":2,"expl":{"en":"4Bp.03 is the Stage 4 Life processes objective about energy for growth, life and health. The others cover medicines, habitats and vertebrates.","ar":"4Bp.03 is the Stage 4 Life processes objective about energy for growth, life and health. The others cover medicines, habitats and vertebrates."}}]},{"id":"m6","title":{"en":"Chemistry Across Stages 1 to 6","ar":"Chemistry Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Chemistry as \"the study of matter\". Matter \"takes the form of materials that are made up of substances\". Learners develop understanding of materials and substances, their properties and their physical and chemical changes. This module follows Chemistry from the first sorting of everyday materials in Stage 1 to the idea of reactants and products in Stage 6.","ar":"The framework describes Chemistry as \"the study of matter\". Matter \"takes the form of materials that are made up of substances\". Learners develop understanding of materials and substances, their properties and their physical and chemical changes. This module follows Chemistry from the first sorting of everyday materials in Stage 1 to the idea of reactants and products in Stage 6."}},{"t":"h","c":{"en":"Three sub-strands","ar":"Three sub-strands"}},{"t":"list","c":{"en":["\u003cstrong>Materials and their structure (Cm):\u003c/strong> what materials are, and from Stage 4 the particle model. It appears in Stages 1 to 5, and not in Stage 6.","\u003cstrong>Properties of materials (Cp):\u003c/strong> the characteristics of materials, and how they are tested and used. It appears in every stage.","\u003cstrong>Changes to materials (Cc):\u003c/strong> physical changes, mixtures, dissolving, changes of state and chemical reactions. It appears in every stage."],"ar":["\u003cstrong>Materials and their structure (Cm):\u003c/strong> what materials are, and from Stage 4 the particle model. It appears in Stages 1 to 5, and not in Stage 6.","\u003cstrong>Properties of materials (Cp):\u003c/strong> the characteristics of materials, and how they are tested and used. It appears in every stage.","\u003cstrong>Changes to materials (Cc):\u003c/strong> physical changes, mixtures, dissolving, changes of state and chemical reactions. It appears in every stage."]}},{"t":"h","c":{"en":"Key ideas, stage by stage","ar":"Key ideas, stage by stage"}},{"t":"table","head":{"en":["Stage","Materials and their structure (Cm)","Properties of materials (Cp)","Changes to materials (Cc)"],"ar":["Stage","Materials and their structure (Cm)","Properties of materials (Cp)","Changes to materials (Cc)"]},"rows":[{"en":["1","Identify, name, describe, sort common materials (wood, plastic, metal, glass, rock, paper, fabric); difference between an object and a material (1Cm.01, .02)","Materials have a variety of properties; describe materials by their properties (1Cp.01, .02)","Materials can be changed by physical action: stretching, compressing, bending, twisting (1Cc.01)"],"ar":["1","Identify, name, describe, sort common materials (wood, plastic, metal, glass, rock, paper, fabric); difference between an object and a material (1Cm.01, .02)","Materials have a variety of properties; describe materials by their properties (1Cp.01, .02)","Materials can be changed by physical action: stretching, compressing, bending, twisting (1Cc.01)"]},{"en":["2","Some materials are natural and others are manufactured (2Cm.01)","A property is a characteristic; materials chosen for purposes because of properties; materials can be tested (2Cp.01 to .03)","Some changes turn a material into a different material (2Cc.01)"],"ar":["2","Some materials are natural and others are manufactured (2Cm.01)","A property is a characteristic; materials chosen for purposes because of properties; materials can be tested (2Cp.01 to .03)","Some changes turn a material into a different material (2Cc.01)"]},{"en":["3","Solids, liquids and gases; a mixture has two or more materials that can be physically separated (3Cm.01, .02)","Solids and liquids compared; materials generally keep their properties in a mixture; separating solid/solid mixtures and an insoluble solid from a liquid (3Cp.01 to .04)","When a solid dissolves, it is still present and a mixture is made (3Cc.01)"],"ar":["3","Solids, liquids and gases; a mixture has two or more materials that can be physically separated (3Cm.01, .02)","Solids and liquids compared; materials generally keep their properties in a mixture; separating solid/solid mixtures and an insoluble solid from a liquid (3Cp.01 to .04)","When a solid dissolves, it is still present and a mixture is made (3Cc.01)"]},{"en":["4","The particle model for solids and liquids; materials, substances and particles; particles are always moving (4Cm.01 to .03)","Use the particle model to explain properties of solids and liquids, and powders that behave like liquids (4Cp.01, .02)","Freezing and melting using the particle model; change of state is a physical process; chemical reaction produces new substances (4Cc.01 to .03)"],"ar":["4","The particle model for solids and liquids; materials, substances and particles; particles are always moving (4Cm.01 to .03)","Use the particle model to explain properties of solids and liquids, and powders that behave like liquids (4Cp.01, .02)","Freezing and melting using the particle model; change of state is a physical process; chemical reaction produces new substances (4Cc.01 to .03)"]},{"en":["5","Particle model for solids, liquids (including solutions) and gases; common gases at room temperature, including water vapour (5Cm.01, .02)","Solubility and solvent ability are properties; main properties of water (5Cp.01, .02)","Evaporation and condensation; dissolving is reversible and solvent and solute can be separated; terms solute, solvent, solution (5Cc.01 to .03)"],"ar":["5","Particle model for solids, liquids (including solutions) and gases; common gases at room temperature, including water vapour (5Cm.01, .02)","Solubility and solvent ability are properties; main properties of water (5Cp.01, .02)","Evaporation and condensation; dissolving is reversible and solvent and solute can be separated; terms solute, solvent, solution (5Cc.01 to .03)"]},{"en":["6","Not listed","Temperature of change of state is a property; gases have mass; electrical and thermal conductivity are properties (6Cp.01 to .03)","Reversible physical changes; temperature and dissolving; boiling versus evaporation; reactants and products; evidence of a chemical reaction (6Cc.01 to .05)"],"ar":["6","Not listed","Temperature of change of state is a property; gases have mass; electrical and thermal conductivity are properties (6Cp.01 to .03)","Reversible physical changes; temperature and dissolving; boiling versus evaporation; reactants and products; evidence of a chemical reaction (6Cc.01 to .05)"]}]},{"t":"h","c":{"en":"Words that need care: object, material, substance, mixture","ar":"Words that need care: object, material, substance, mixture"}},{"t":"p","c":{"en":"The framework's glossary defines several words that pupils (and teachers) often use loosely. Use these definitions in your planning and in your classroom language.","ar":"The framework's glossary defines several words that pupils (and teachers) often use loosely. Use these definitions in your planning and in your classroom language."}},{"t":"table","head":{"en":["Term","Glossary meaning (summary)","Example from the glossary"],"ar":["Term","Glossary meaning (summary)","Example from the glossary"]},"rows":[{"en":["Object","A visible and tangible item composed of one or more materials and/or substances","A chair, a spoon"],"ar":["Object","A visible and tangible item composed of one or more materials and/or substances","A chair, a spoon"]},{"en":["Material","What substance or matter an object may be made from","Aluminium, gold, wood, glass, metal, ceramic"],"ar":["Material","What substance or matter an object may be made from","Aluminium, gold, wood, glass, metal, ceramic"]},{"en":["Substance","Matter composed of a single thing","Oxygen is a substance, but air is a mixture; iron is a substance, but steel is a material, because it is iron mixed with other substances"],"ar":["Substance","Matter composed of a single thing","Oxygen is a substance, but air is a mixture; iron is a substance, but steel is a material, because it is iron mixed with other substances"]},{"en":["Mixture","A sample that contains more than one substance or material","Air; sand and paper clips"],"ar":["Mixture","A sample that contains more than one substance or material","Air; sand and paper clips"]}]},{"t":"p","c":{"en":"This is why 1Cm.02 asks pupils to understand the difference between an object and a material (a spoon is the object; metal is the material), and 4Cm.02 asks for the difference between materials, substances and particles.","ar":"This is why 1Cm.02 asks pupils to understand the difference between an object and a material (a spoon is the object; metal is the material), and 4Cm.02 asks for the difference between materials, substances and particles."}},{"t":"h","c":{"en":"How the ideas build","ar":"How the ideas build"}},{"t":"table","head":{"en":["Thread","Stage path (exact codes)","What changes"],"ar":["Thread","Stage path (exact codes)","What changes"]},"rows":[{"en":["Materials and properties","1Cm.01 and 1Cp.02 describe materials, 2Cp.02 and 2Cp.03 choose and test them, 6Cp.03 names electrical and thermal conductivity as properties","From noticing, to choosing for a purpose, to testing, to named properties"],"ar":["Materials and properties","1Cm.01 and 1Cp.02 describe materials, 2Cp.02 and 2Cp.03 choose and test them, 6Cp.03 names electrical and thermal conductivity as properties","From noticing, to choosing for a purpose, to testing, to named properties"]},{"en":["Mixtures and dissolving","3Cm.02 mixtures, 3Cc.01 dissolving makes a mixture, 5Cc.02 and 5Cc.03 reversible process and the words solute, solvent, solution, 6Cc.02 temperature and dissolving","From \"it has gone\" to \"it is still there\", to the particle explanation"],"ar":["Mixtures and dissolving","3Cm.02 mixtures, 3Cc.01 dissolving makes a mixture, 5Cc.02 and 5Cc.03 reversible process and the words solute, solvent, solution, 6Cc.02 temperature and dissolving","From \"it has gone\" to \"it is still there\", to the particle explanation"]},{"en":["Particles and states of matter","3Cm.01 solids, liquids, gases, 4Cm.01 particle model, 4Cc.01 melting and freezing, 5Cm.01 gases, 5Cc.01 evaporation and condensation, 6Cc.03 boiling and evaporation","From describing states to explaining changes of state with particles"],"ar":["Particles and states of matter","3Cm.01 solids, liquids, gases, 4Cm.01 particle model, 4Cc.01 melting and freezing, 5Cm.01 gases, 5Cc.01 evaporation and condensation, 6Cc.03 boiling and evaporation","From describing states to explaining changes of state with particles"]},{"en":["Chemical change","1Cc.01 physical action, 2Cc.01 a change to a different material, 4Cc.03 chemical reaction, 6Cc.04 and 6Cc.05 reactants, products and evidence","From a change that makes something different to the vocabulary of reactions"],"ar":["Chemical change","1Cc.01 physical action, 2Cc.01 a change to a different material, 4Cc.03 chemical reaction, 6Cc.04 and 6Cc.05 reactants, products and evidence","From a change that makes something different to the vocabulary of reactions"]}]},{"t":"callout","k":"key","title":{"en":"The particle model is the engine of Chemistry","ar":"The particle model is the engine of Chemistry"},"c":{"en":"The particle model first appears in Stage 4 (4Cm.01) and is then used to explain properties (4Cp.01), melting and freezing (4Cc.01), gases and solutions (5Cm.01), evaporation and condensation (5Cc.01) and dissolving at different temperatures (6Cc.02). If pupils do not secure the Stage 4 particle ideas, the Stage 5 and 6 objectives become lists of facts to memorise. Consider asking pupils to draw particles in solids, liquids and gases at the start of each later unit.","ar":"The particle model first appears in Stage 4 (4Cm.01) and is then used to explain properties (4Cp.01), melting and freezing (4Cc.01), gases and solutions (5Cm.01), evaporation and condensation (5Cc.01) and dissolving at different temperatures (6Cc.02). If pupils do not secure the Stage 4 particle ideas, the Stage 5 and 6 objectives become lists of facts to memorise. Consider asking pupils to draw particles in solids, liquids and gases at the start of each later unit."}},{"t":"h","c":{"en":"Links to other strands","ar":"Links to other strands"}},{"t":"list","c":{"en":["\u003cstrong>Earth and Space:\u003c/strong> evaporation and condensation (5Cc.01) are used in the water cycle (5ESc.01). The rock cycle (6ESc.01) uses ideas such as solidification and melting. 5ESp.02 (water with dissolved substances) uses the ideas of dissolving from 5Cc.03.","\u003cstrong>Physics:\u003c/strong> 6Cp.03 (electrical and thermal conductivity) links to 4Pe.04 (conductors and insulators). 4Pf.04 (some energy transferred to the surroundings as temperature increase) is a useful partner for state-change work.","\u003cstrong>Biology:\u003c/strong> the digestive system (5Bs.04) and respiratory system (6Bs.02) both involve dissolved or transported substances; 5Cm.02 names oxygen and carbon dioxide as common gases.","\u003cstrong>TWS and Maths:\u003c/strong> measuring temperature and volume uses the units in the framework appendix (for example °C and ml). The framework asks that units are taught in mathematics before science uses them."],"ar":["\u003cstrong>Earth and Space:\u003c/strong> evaporation and condensation (5Cc.01) are used in the water cycle (5ESc.01). The rock cycle (6ESc.01) uses ideas such as solidification and melting. 5ESp.02 (water with dissolved substances) uses the ideas of dissolving from 5Cc.03.","\u003cstrong>Physics:\u003c/strong> 6Cp.03 (electrical and thermal conductivity) links to 4Pe.04 (conductors and insulators). 4Pf.04 (some energy transferred to the surroundings as temperature increase) is a useful partner for state-change work.","\u003cstrong>Biology:\u003c/strong> the digestive system (5Bs.04) and respiratory system (6Bs.02) both involve dissolved or transported substances; 5Cm.02 names oxygen and carbon dioxide as common gases.","\u003cstrong>TWS and Maths:\u003c/strong> measuring temperature and volume uses the units in the framework appendix (for example °C and ml). The framework asks that units are taught in mathematics before science uses them."]}},{"t":"h","c":{"en":"Common ideas to watch (good practice)","ar":"Common ideas to watch (good practice)"}},{"t":"p","c":{"en":"These are ideas often reported by teachers. They are not from the framework, but each links to an objective you can use to correct it.","ar":"These are ideas often reported by teachers. They are not from the framework, but each links to an objective you can use to correct it."}},{"t":"list","c":{"en":["\"Sugar disappears when it dissolves.\" 3Cc.01 says that the solid is still present. Let pupils see the salt come back by evaporating a small amount of the solution in a teacher-led demonstration, following the school's safety rules.","\"Melting and dissolving are the same.\" 4Cc.01 (melting) and 3Cc.01 or 5Cc.03 (dissolving) are different processes. Use sorting cards.","\"Particles in a solid do not move.\" 4Cm.03 says that particles are in constant motion, even in a solid.","\"Gases have no mass.\" 6Cp.02 says that gases have properties, including mass.","\"Boiling and evaporation are the same.\" 6Cc.03 asks pupils to describe the difference."],"ar":["\"Sugar disappears when it dissolves.\" 3Cc.01 says that the solid is still present. Let pupils see the salt come back by evaporating a small amount of the solution in a teacher-led demonstration, following the school's safety rules.","\"Melting and dissolving are the same.\" 4Cc.01 (melting) and 3Cc.01 or 5Cc.03 (dissolving) are different processes. Use sorting cards.","\"Particles in a solid do not move.\" 4Cm.03 says that particles are in constant motion, even in a solid.","\"Gases have no mass.\" 6Cp.02 says that gases have properties, including mass.","\"Boiling and evaporation are the same.\" 6Cc.03 asks pupils to describe the difference."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: respect the \"limited to\" lists","ar":"Good practice: respect the \"limited to\" lists"},"c":{"en":"Many Chemistry objectives name exactly which gases or properties pupils should know. 5Cm.02 limits common gases to oxygen, carbon dioxide, water vapour, nitrogen and hydrogen. 5Cp.02 limits the properties of water to boiling point, melting point, expansion when it solidifies and the ability to dissolve a range of substances. 6Cc.05 limits the evidence of a chemical reaction to a gas being produced, colour change and change in temperature. Teach these well before adding extra detail.","ar":"Many Chemistry objectives name exactly which gases or properties pupils should know. 5Cm.02 limits common gases to oxygen, carbon dioxide, water vapour, nitrogen and hydrogen. 5Cp.02 limits the properties of water to boiling point, melting point, expansion when it solidifies and the ability to dissolve a range of substances. 6Cc.05 limits the evidence of a chemical reaction to a gas being produced, colour change and change in temperature. Teach these well before adding extra detail."}},{"t":"scenario","title":{"en":"The Year 5 dissolving lesson","ar":"The Year 5 dissolving lesson"},"c":{"en":"You teach 5Cc.03: investigate and describe dissolving using the terms solute, solvent and solution. A pupil, Maryam, says that when salt dissolves \"the salt melts\". Another pupil says it \"goes into the water and the water gets heavier\". \u003cstrong>How do you respond?\u003c/strong> Use both comments. Ask Maryam what melting means (4Cc.01, a change of state caused by temperature), and compare it with salt in water. Weigh the water and salt before and after dissolving (using standard units, 3TWSc.03) to test the second pupil's idea. Ask pupils to use \"solute\", \"solvent\" and \"solution\" in a sentence frame, and ask how the salt could be separated from the solution (5Cc.02).","ar":"You teach 5Cc.03: investigate and describe dissolving using the terms solute, solvent and solution. A pupil, Maryam, says that when salt dissolves \"the salt melts\". Another pupil says it \"goes into the water and the water gets heavier\". \u003cstrong>How do you respond?\u003c/strong> Use both comments. Ask Maryam what melting means (4Cc.01, a change of state caused by temperature), and compare it with salt in water. Weigh the water and salt before and after dissolving (using standard units, 3TWSc.03) to test the second pupil's idea. Ask pupils to use \"solute\", \"solvent\" and \"solution\" in a sentence frame, and ask how the salt could be separated from the solution (5Cc.02)."}}],"checks":[{"id":"m6q1","q":{"en":"In the framework glossary, which example is used to show the difference between a substance and a material?","ar":"In the framework glossary, which example is used to show the difference between a substance and a material?"},"opts":[{"en":"Water is a substance, but ice is a material because it is a solid form of water","ar":"Water is a substance, but ice is a material because it is a solid form of water"},{"en":"Wood is a substance, but a table is a material because it is made from wood","ar":"Wood is a substance, but a table is a material because it is made from wood"},{"en":"Oxygen is a material, but air is a substance because it surrounds the Earth","ar":"Oxygen is a material, but air is a substance because it surrounds the Earth"},{"en":"Iron is a substance, but steel is a material, being iron mixed with other substances","ar":"Iron is a substance, but steel is a material, being iron mixed with other substances"}],"correct":3,"expl":{"en":"The glossary says oxygen is a substance but air is a mixture, and iron is a substance but steel is a material and not a single substance.","ar":"The glossary says oxygen is a substance but air is a mixture, and iron is a substance but steel is a material and not a single substance."}},{"id":"m6q2","q":{"en":"A teacher wants pupils to use the particle model to explain why powders can pour like liquids. Which objective should she use, and in which stage?","ar":"A teacher wants pupils to use the particle model to explain why powders can pour like liquids. Which objective should she use, and in which stage?"},"opts":[{"en":"4Cp.02 in Stage 4, which asks pupils to explain how some solids behave like liquids","ar":"4Cp.02 in Stage 4, which asks pupils to explain how some solids behave like liquids"},{"en":"3Cp.01 in Stage 3, which asks pupils to describe differences in properties of solids and liquids","ar":"3Cp.01 in Stage 3, which asks pupils to describe differences in properties of solids and liquids"},{"en":"5Cm.01 in Stage 5, which asks pupils to use the particle model for solids, liquids and gases","ar":"5Cm.01 in Stage 5, which asks pupils to use the particle model for solids, liquids and gases"},{"en":"6Cp.01 in Stage 6, which says the temperature at which a substance changes state is a property","ar":"6Cp.01 in Stage 6, which says the temperature at which a substance changes state is a property"}],"correct":0,"expl":{"en":"4Cp.02 says: describe and explain how some solids can behave like liquids (e.g. powders), referring to the particle model. Stage 3 does not use the particle model, and the other objectives cover different ideas.","ar":"4Cp.02 says: describe and explain how some solids can behave like liquids (e.g. powders), referring to the particle model. Stage 3 does not use the particle model, and the other objectives cover different ideas."}},{"id":"m6q3","q":{"en":"Which statement about the Chemistry strand is supported by the stage pages?","ar":"Which statement about the Chemistry strand is supported by the stage pages?"},"opts":[{"en":"Stage 6 has three Materials and their structure objectives and no Changes to materials objectives","ar":"Stage 6 has three Materials and their structure objectives and no Changes to materials objectives"},{"en":"Stage 6 has no Materials and their structure objectives but five Changes to materials objectives","ar":"Stage 6 has no Materials and their structure objectives but five Changes to materials objectives"},{"en":"Stage 1 has the particle model objectives, and Stage 4 has the first chemical reaction objective","ar":"Stage 1 has the particle model objectives, and Stage 4 has the first chemical reaction objective"},{"en":"Stage 3 has the first chemical reaction objective, and Stage 5 has the first changes of state objective","ar":"Stage 3 has the first chemical reaction objective, and Stage 5 has the first changes of state objective"}],"correct":1,"expl":{"en":"Stage 6 lists Properties of materials (6Cp.01 to .03) and Changes to materials (6Cc.01 to .05). The particle model begins in Stage 4, and chemical reaction (4Cc.03) is also in Stage 4.","ar":"Stage 6 lists Properties of materials (6Cp.01 to .03) and Changes to materials (6Cc.01 to .05). The particle model begins in Stage 4, and chemical reaction (4Cc.03) is also in Stage 4."}}]},{"id":"m7","title":{"en":"Physics Across Stages 1 to 6","ar":"Physics Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Physics as \"the study of the interaction of matter and energy\". Learners develop understanding about \"how heat and electrical current is transferred through matter, how light and sound behave, how magnets interact and how forces affect objects\". This module follows the three Physics sub-strands from Stage 1 to Stage 6.","ar":"The framework describes Physics as \"the study of the interaction of matter and energy\". Learners develop understanding about \"how heat and electrical current is transferred through matter, how light and sound behave, how magnets interact and how forces affect objects\". This module follows the three Physics sub-strands from Stage 1 to Stage 6."}},{"t":"h","c":{"en":"Three sub-strands","ar":"Three sub-strands"}},{"t":"list","c":{"en":["\u003cstrong>Forces and energy (Pf):\u003c/strong> pushes, pulls, gravity, friction, mass and weight, and from Stage 4 energy and its transfer. It appears in every stage.","\u003cstrong>Light and sound (Ps):\u003c/strong> sources, shadows, reflection and refraction for light; sources, pitch and volume for sound. It appears in every stage.","\u003cstrong>Electricity and magnetism (Pe):\u003c/strong> circuits and magnets. It appears in every stage."],"ar":["\u003cstrong>Forces and energy (Pf):\u003c/strong> pushes, pulls, gravity, friction, mass and weight, and from Stage 4 energy and its transfer. It appears in every stage.","\u003cstrong>Light and sound (Ps):\u003c/strong> sources, shadows, reflection and refraction for light; sources, pitch and volume for sound. It appears in every stage.","\u003cstrong>Electricity and magnetism (Pe):\u003c/strong> circuits and magnets. It appears in every stage."]}},{"t":"h","c":{"en":"Key ideas, stage by stage","ar":"Key ideas, stage by stage"}},{"t":"table","head":{"en":["Stage","Forces and energy (Pf)","Light and sound (Ps)","Electricity and magnetism (Pe)"],"ar":["Stage","Forces and energy (Pf)","Light and sound (Ps)","Electricity and magnetism (Pe)"]},"rows":[{"en":["1","Movement of familiar objects; pushes and pulls as forces; some objects float and some sink (1Pf.01 to .03)","Sources of sound; sound becomes quieter as it travels from the source (1Ps.01, .02)","Things that need electricity; what happens when magnets approach and touch different materials (1Pe.01, .02)"],"ar":["1","Movement of familiar objects; pushes and pulls as forces; some objects float and some sink (1Pf.01 to .03)","Sources of sound; sound becomes quieter as it travels from the source (1Ps.01, .02)","Things that need electricity; what happens when magnets approach and touch different materials (1Pe.01, .02)"]},{"en":["2","Forces can change movement and shape; things speed up, slow down or change direction only when something else causes it (2Pf.01 to .03)","Many light sources, including the Sun; darkness is the absence of light (2Ps.01, .02)","How we use electricity and how to be safe; components of simple circuits (cells, wires, lamps); build simple series circuits (2Pe.01 to .03)"],"ar":["2","Forces can change movement and shape; things speed up, slow down or change direction only when something else causes it (2Pf.01 to .03)","Many light sources, including the Sun; darkness is the absence of light (2Ps.01, .02)","How we use electricity and how to be safe; components of simple circuits (cells, wires, lamps); build simple series circuits (2Pe.01 to .03)"]},{"en":["3","Forcemeter and the newton; gravity; friction; smooth and rough surfaces (3Pf.01 to .04)","Transparent, translucent and opaque; shadows; how shadow size changes (3Ps.01 to .03)","Magnets have north and south poles; attract and repel; some materials are magnetic (3Pe.01 to .03)"],"ar":["3","Forcemeter and the newton; gravity; friction; smooth and rough surfaces (3Pf.01 to .04)","Transparent, translucent and opaque; shadows; how shadow size changes (3Ps.01 to .03)","Magnets have north and south poles; attract and repel; some materials are magnetic (3Pe.01 to .03)"]},{"en":["4","Energy is in all matter and in sound, light and heat; energy is transferred, not lost; energy is needed for movement; some energy goes to the surroundings (4Pf.01 to .04)","Light travels in straight lines (ray diagrams); light reflects; how objects that are not light sources are seen (4Ps.01 to .03)","A break in a circuit stops a device; switches; changing components changes brightness; conductors and insulators (4Pe.01 to .04)"],"ar":["4","Energy is in all matter and in sound, light and heat; energy is transferred, not lost; energy is needed for movement; some energy goes to the surroundings (4Pf.01 to .04)","Light travels in straight lines (ray diagrams); light reflects; how objects that are not light sources are seen (4Ps.01 to .03)","A break in a circuit stops a device; switches; changing components changes brightness; conductors and insulators (4Pe.01 to .04)"]},{"en":["5","A range of forces; more than one force on an object, even at rest; force diagrams with names and directions (5Pf.01 to .03)","Sounds are made by vibrating sources; pitch and volume; changing pitch and volume (5Ps.01 to .03)","Magnet versus magnetic material; forces act over a distance; magnets can have different strengths (5Pe.01 to .03)"],"ar":["5","A range of forces; more than one force on an object, even at rest; force diagrams with names and directions (5Pf.01 to .03)","Sounds are made by vibrating sources; pitch and volume; changing pitch and volume (5Ps.01 to .03)","Magnet versus magnetic material; forces act over a distance; magnets can have different strengths (5Pe.01 to .03)"]},{"en":["6","Mass (kg) versus weight (N); effect of gravity; force diagrams with size as well as name and direction; forces on objects at rest and in motion; floating and sinking (6Pf.01 to .05)","Reflection from a plane mirror; refraction as light travels through different mediums (6Ps.01, .02)","Series and parallel circuit diagrams with conventional symbols; compare lamp brightness in series and parallel circuits (6Pe.01, .02)"],"ar":["6","Mass (kg) versus weight (N); effect of gravity; force diagrams with size as well as name and direction; forces on objects at rest and in motion; floating and sinking (6Pf.01 to .05)","Reflection from a plane mirror; refraction as light travels through different mediums (6Ps.01, .02)","Series and parallel circuit diagrams with conventional symbols; compare lamp brightness in series and parallel circuits (6Pe.01, .02)"]}]},{"t":"h","c":{"en":"A pattern in the stages","ar":"A pattern in the stages"}},{"t":"p","c":{"en":"Look carefully at the Physics table and you will see a pattern. \u003cstrong>Magnets\u003c/strong> appear in Stages 1, 3 and 5. \u003cstrong>Circuits\u003c/strong> appear in Stages 2, 4 and 6 (Stage 1 has only 1Pe.01, \"identify things that require electricity to work\"). \u003cstrong>Sound\u003c/strong> appears in Stages 1 and 5 only. \u003cstrong>Light\u003c/strong> appears in Stages 2, 3, 4 and 6. \u003cstrong>Energy\u003c/strong> begins in Stage 4. This means a topic may leave the curriculum for a year, and then return at a higher level. If you teach Stage 5 magnets, check what Stage 3 included, and remember that two years have passed since pupils last studied them.","ar":"Look carefully at the Physics table and you will see a pattern. \u003cstrong>Magnets\u003c/strong> appear in Stages 1, 3 and 5. \u003cstrong>Circuits\u003c/strong> appear in Stages 2, 4 and 6 (Stage 1 has only 1Pe.01, \"identify things that require electricity to work\"). \u003cstrong>Sound\u003c/strong> appears in Stages 1 and 5 only. \u003cstrong>Light\u003c/strong> appears in Stages 2, 3, 4 and 6. \u003cstrong>Energy\u003c/strong> begins in Stage 4. This means a topic may leave the curriculum for a year, and then return at a higher level. If you teach Stage 5 magnets, check what Stage 3 included, and remember that two years have passed since pupils last studied them."}},{"t":"table","head":{"en":["Idea","Stages where it appears","Exact codes"],"ar":["Idea","Stages where it appears","Exact codes"]},"rows":[{"en":["Magnets","1, 3, 5","1Pe.02; 3Pe.01 to .03; 5Pe.01 to .03"],"ar":["Magnets","1, 3, 5","1Pe.02; 3Pe.01 to .03; 5Pe.01 to .03"]},{"en":["Circuits","2, 4, 6","2Pe.02, .03; 4Pe.01 to .04; 6Pe.01, .02"],"ar":["Circuits","2, 4, 6","2Pe.02, .03; 4Pe.01 to .04; 6Pe.01, .02"]},{"en":["Sound","1, 5","1Ps.01, .02; 5Ps.01 to .03"],"ar":["Sound","1, 5","1Ps.01, .02; 5Ps.01 to .03"]},{"en":["Light","2, 3, 4, 6 (and the Sun as a source in Stage 1)","2Ps.01, .02; 3Ps.01 to .03; 4Ps.01 to .03; 6Ps.01, .02; 1ESs.02"],"ar":["Light","2, 3, 4, 6 (and the Sun as a source in Stage 1)","2Ps.01, .02; 3Ps.01 to .03; 4Ps.01 to .03; 6Ps.01, .02; 1ESs.02"]},{"en":["Forces","1 to 6","1Pf.01 to 6Pf.05"],"ar":["Forces","1 to 6","1Pf.01 to 6Pf.05"]},{"en":["Energy","4 (forces and energy sub-strand); links to Biology and Earth and Space later","4Pf.01 to .04; 4Bp.03; 6Be.03"],"ar":["Energy","4 (forces and energy sub-strand); links to Biology and Earth and Space later","4Pf.01 to .04; 4Bp.03; 6Be.03"]}]},{"t":"h","c":{"en":"How the ideas build","ar":"How the ideas build"}},{"t":"table","head":{"en":["Thread","Stage path (exact codes)","What changes"],"ar":["Thread","Stage path (exact codes)","What changes"]},"rows":[{"en":["Forces","1Pf.02 pushes and pulls, 2Pf.01 forces change movement and shape, 3Pf.01 to 3Pf.04 measure and name forces, 5Pf.01 to 5Pf.03 many forces and diagrams, 6Pf.01 to 6Pf.04 mass, weight and size of forces","From \"push and pull\", to measurement, to force diagrams, to mass versus weight"],"ar":["Forces","1Pf.02 pushes and pulls, 2Pf.01 forces change movement and shape, 3Pf.01 to 3Pf.04 measure and name forces, 5Pf.01 to 5Pf.03 many forces and diagrams, 6Pf.01 to 6Pf.04 mass, weight and size of forces","From \"push and pull\", to measurement, to force diagrams, to mass versus weight"]},{"en":["Light","2Ps.01 light sources, 3Ps.01 to 3Ps.03 materials and shadows, 4Ps.01 to 4Ps.03 rays, reflection and seeing, 6Ps.01 and 6Ps.02 mirrors and refraction","From sources and shadows, to a model of light as rays, to how rays change direction"],"ar":["Light","2Ps.01 light sources, 3Ps.01 to 3Ps.03 materials and shadows, 4Ps.01 to 4Ps.03 rays, reflection and seeing, 6Ps.01 and 6Ps.02 mirrors and refraction","From sources and shadows, to a model of light as rays, to how rays change direction"]},{"en":["Circuits","1Pe.01 things that need electricity, 2Pe.02 and 2Pe.03 simple series circuits, 4Pe.01 to 4Pe.04 switches and conductors, 6Pe.01 and 6Pe.02 series and parallel diagrams","From using electricity, to building, to drawing with symbols and comparing"],"ar":["Circuits","1Pe.01 things that need electricity, 2Pe.02 and 2Pe.03 simple series circuits, 4Pe.01 to 4Pe.04 switches and conductors, 6Pe.01 and 6Pe.02 series and parallel diagrams","From using electricity, to building, to drawing with symbols and comparing
