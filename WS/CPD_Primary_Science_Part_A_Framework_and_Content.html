"]},{"en":["Energy","4Pf.01 to 4Pf.04 energy in matter, energy transfer; 4Bp.03 energy in living things; 6Be.03 energy in food chains","Energy is a big idea that links Physics, Biology and Earth and Space"],"ar":["Energy","4Pf.01 to 4Pf.04 energy in matter, energy transfer; 4Bp.03 energy in living things; 6Be.03 energy in food chains","Energy is a big idea that links Physics, Biology and Earth and Space"]}]},{"t":"callout","k":"key","title":{"en":"The appendix: symbols and units","ar":"The appendix: symbols and units"},"c":{"en":"The framework's appendix says learners are expected to be able to recall and use the standard electrical symbols: battery of cells, buzzer, cell, closed switch, junction of conductors, lamp, open switch and wire. It also lists units. By the end of Stage 6, learners should know the multiples m (milli), c (centi) and k (kilo), and give the units for length (mm, cm, m, km), area (cm², m²), volume (ml, l, cm³, m³), weight (N), mass (g, kg), time (s, min, h), force (N), gravity (N/kg) and temperature (°C). The appendix asks you to make sure the units have been taught in mathematics before they are used in science, and to give time to introduce science-specific units, such as newtons, when they are first taught.","ar":"The framework's appendix says learners are expected to be able to recall and use the standard electrical symbols: battery of cells, buzzer, cell, closed switch, junction of conductors, lamp, open switch and wire. It also lists units. By the end of Stage 6, learners should know the multiples m (milli), c (centi) and k (kilo), and give the units for length (mm, cm, m, km), area (cm², m²), volume (ml, l, cm³, m³), weight (N), mass (g, kg), time (s, min, h), force (N), gravity (N/kg) and temperature (°C). The appendix asks you to make sure the units have been taught in mathematics before they are used in science, and to give time to introduce science-specific units, such as newtons, when they are first taught."}},{"t":"h","c":{"en":"Links to other strands","ar":"Links to other strands"}},{"t":"list","c":{"en":["\u003cstrong>Chemistry:\u003c/strong> thermal and electrical conductivity (6Cp.03) link to circuits (4Pe.04); floating and sinking (1Pf.03, 6Pf.05) link to materials and their properties.","\u003cstrong>Earth and Space:\u003c/strong> gravity (3Pf.02, 6Pf.02) links to the Earth, Moon and Sun; the Sun as a source of light and heat (1ESs.02, 2Ps.01); shadows (3Ps.03, 4ESs.01) link to the apparent movement of the Sun.","\u003cstrong>Biology:\u003c/strong> muscles and bones involve forces (4Bs.02); the senses link to light and sound (1Bs.02, 4Ps.03).","\u003cstrong>TWS:\u003c/strong> Physics is a strong place to practise fair tests and measurement (3Pf.01 forcemeter, 3Pf.04 friction) and drawing with conventions (5Pf.03, 6Pe.01)."],"ar":["\u003cstrong>Chemistry:\u003c/strong> thermal and electrical conductivity (6Cp.03) link to circuits (4Pe.04); floating and sinking (1Pf.03, 6Pf.05) link to materials and their properties.","\u003cstrong>Earth and Space:\u003c/strong> gravity (3Pf.02, 6Pf.02) links to the Earth, Moon and Sun; the Sun as a source of light and heat (1ESs.02, 2Ps.01); shadows (3Ps.03, 4ESs.01) link to the apparent movement of the Sun.","\u003cstrong>Biology:\u003c/strong> muscles and bones involve forces (4Bs.02); the senses link to light and sound (1Bs.02, 4Ps.03).","\u003cstrong>TWS:\u003c/strong> Physics is a strong place to practise fair tests and measurement (3Pf.01 forcemeter, 3Pf.04 friction) and drawing with conventions (5Pf.03, 6Pe.01)."]}},{"t":"h","c":{"en":"Common ideas to watch (good practice)","ar":"Common ideas to watch (good practice)"}},{"t":"list","c":{"en":["\"Energy is used up.\" 4Pf.02 says energy cannot be made, lost, used up or destroyed, but can be transferred.","\"An object at rest has no forces on it.\" 5Pf.02 says an object may have multiple forces acting on it, even when at rest.","\"Mass and weight are the same.\" 6Pf.01 separates mass in kilograms from weight in newtons, and 6Pf.02 says weight changes when gravity changes but mass does not.","\"We see because light comes from our eyes.\" 4Ps.03 asks how objects that are not light sources are seen.","\"Magnets attract all metals.\" 3Pe.03 says some materials are magnetic but many are not, and 5Pe.01 separates a magnet from a magnetic material."],"ar":["\"Energy is used up.\" 4Pf.02 says energy cannot be made, lost, used up or destroyed, but can be transferred.","\"An object at rest has no forces on it.\" 5Pf.02 says an object may have multiple forces acting on it, even when at rest.","\"Mass and weight are the same.\" 6Pf.01 separates mass in kilograms from weight in newtons, and 6Pf.02 says weight changes when gravity changes but mass does not.","\"We see because light comes from our eyes.\" 4Ps.03 asks how objects that are not light sources are seen.","\"Magnets attract all metals.\" 3Pe.03 says some materials are magnetic but many are not, and 5Pe.01 separates a magnet from a magnetic material."]}},{"t":"callout","k":"warn","title":{"en":"Check the version 4.0 wording","ar":"Check the version 4.0 wording"},"c":{"en":"Version 4.0 changed three Physics objectives. 3Pf.01 now includes the newton as the standard unit of force. 3Ps.01 and 3Ps.03 now include \u003cem>describing\u003c/em> the behaviour of light and shadows as well as investigating them. 6Pe.01 now names both series and parallel circuits. Older plans may not show these changes.","ar":"Version 4.0 changed three Physics objectives. 3Pf.01 now includes the newton as the standard unit of force. 3Ps.01 and 3Ps.03 now include \u003cem>describing\u003c/em> the behaviour of light and shadows as well as investigating them. 6Pe.01 now names both series and parallel circuits. Older plans may not show these changes."}},{"t":"scenario","title":{"en":"The Stage 6 circuit lesson","ar":"The Stage 6 circuit lesson"},"c":{"en":"Year 6 pupils build circuits with cells, switches, lamps and buzzers and draw them. Several draw pictures of the batteries and wires instead of using symbols. A pupil says the lamps in the parallel circuit are \"dimmer because the electricity is shared\". \u003cstrong>How do you proceed?\u003c/strong> Link to 6Pe.01 (diagrams and conventional symbols) and 6Pe.02 (compare brightness in series and parallel circuits). Give pupils the symbols from the appendix, and ask them to redraw. Let them test and record lamp brightness using a simple table (6TWSc.08), then compare with the pupil's idea and decide what the evidence supports (6TWSa.03). Check earlier foundations: 4Pe.03 (changing components changes brightness).","ar":"Year 6 pupils build circuits with cells, switches, lamps and buzzers and draw them. Several draw pictures of the batteries and wires instead of using symbols. A pupil says the lamps in the parallel circuit are \"dimmer because the electricity is shared\". \u003cstrong>How do you proceed?\u003c/strong> Link to 6Pe.01 (diagrams and conventional symbols) and 6Pe.02 (compare brightness in series and parallel circuits). Give pupils the symbols from the appendix, and ask them to redraw. Let them test and record lamp brightness using a simple table (6TWSc.08), then compare with the pupil's idea and decide what the evidence supports (6TWSa.03). Check earlier foundations: 4Pe.03 (changing components changes brightness)."}}],"checks":[{"id":"m7q1","q":{"en":"Which statement about the stages in which magnets and circuits appear is correct?","ar":"Which statement about the stages in which magnets and circuits appear is correct?"},"opts":[{"en":"Magnets appear in Stages 2, 4 and 6, and circuits appear in Stages 1, 3 and 5","ar":"Magnets appear in Stages 2, 4 and 6, and circuits appear in Stages 1, 3 and 5"},{"en":"Magnets and circuits both appear in every stage from Stage 1 to Stage 6","ar":"Magnets and circuits both appear in every stage from Stage 1 to Stage 6"},{"en":"Magnets appear in Stages 1, 3 and 5, and circuits appear in Stages 2, 4 and 6","ar":"Magnets appear in Stages 1, 3 and 5, and circuits appear in Stages 2, 4 and 6"},{"en":"Magnets appear in Stages 3 to 6, and circuits appear in Stages 1 to 3","ar":"Magnets appear in Stages 3 to 6, and circuits appear in Stages 1 to 3"}],"correct":2,"expl":{"en":"The stage pages list magnet objectives in Stages 1, 3 and 5 and circuit objectives in Stages 2, 4 and 6. Stage 1 also has 1Pe.01 about things that need electricity.","ar":"The stage pages list magnet objectives in Stages 1, 3 and 5 and circuit objectives in Stages 2, 4 and 6. Stage 1 also has 1Pe.01 about things that need electricity."}},{"id":"m7q2","q":{"en":"Pupils tell their Stage 4 teacher that \"energy gets used up when the toy car stops\". Which objective helps the teacher respond?","ar":"Pupils tell their Stage 4 teacher that \"energy gets used up when the toy car stops\". Which objective helps the teacher respond?"},"opts":[{"en":"4Pf.03, which says energy is required for any movement or action to happen","ar":"4Pf.03, which says energy is required for any movement or action to happen"},{"en":"3Pf.03, which says friction is a force between surfaces that makes movement harder","ar":"3Pf.03, which says friction is a force between surfaces that makes movement harder"},{"en":"4Ps.01, which says light travels in straight lines and can be shown with ray diagrams","ar":"4Ps.01, which says light travels in straight lines and can be shown with ray diagrams"},{"en":"4Pf.02, which says energy cannot be used up or destroyed, but can be transferred","ar":"4Pf.02, which says energy cannot be used up or destroyed, but can be transferred"}],"correct":3,"expl":{"en":"4Pf.02 directly challenges the idea that energy is used up. 4Pf.04 also helps, because some energy is transferred to the surroundings as sound, light or a rise in temperature.","ar":"4Pf.02 directly challenges the idea that energy is used up. 4Pf.04 also helps, because some energy is transferred to the surroundings as sound, light or a rise in temperature."}},{"id":"m7q3","q":{"en":"According to the appendix, what should a school do before science lessons use a unit such as cm³ or ml?","ar":"According to the appendix, what should a school do before science lessons use a unit such as cm³ or ml?"},"opts":[{"en":"Check that it has been taught in mathematics, and make time to introduce science units such as newtons","ar":"Check that it has been taught in mathematics, and make time to introduce science units such as newtons"},{"en":"Wait until Stage 6, when all the units are introduced together in one single science unit at the end of the year","ar":"Wait until Stage 6, when all the units are introduced together in one single science unit at the end of the year"},{"en":"Use only the units that appear in the Cambridge Primary Checkpoint tests for Stage 6 science","ar":"Use only the units that appear in the Cambridge Primary Checkpoint tests for Stage 6 science"},{"en":"Teach all units first in science and then ask the mathematics teacher to use them","ar":"Teach all units first in science and then ask the mathematics teacher to use them"}],"correct":0,"expl":{"en":"The appendix says to ensure that units have been taught in mathematics before application in science, by cross-referencing the Primary Mathematics curriculum or the school's own mathematics curriculum, and to give time to introduce science-specific units.","ar":"The appendix says to ensure that units have been taught in mathematics before application in science, by cross-referencing the Primary Mathematics curriculum or the school's own mathematics curriculum, and to give time to introduce science-specific units."}}]},{"id":"m8","title":{"en":"Earth and Space Across Stages 1 to 6","ar":"Earth and Space Across Stages 1 to 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that Earth and Space \"covers the study of the planet Earth, the wider Solar System and beyond\". Learners develop understanding about the connections between \"the land, oceans, atmosphere and life of our planet\", investigate how the key cycles that shape the Earth are linked with the Solar System, and explore the Earth's formation, geology and climate. This module follows the strand from Stage 1 to Stage 6.","ar":"The framework says that Earth and Space \"covers the study of the planet Earth, the wider Solar System and beyond\". Learners develop understanding about the connections between \"the land, oceans, atmosphere and life of our planet\", investigate how the key cycles that shape the Earth are linked with the Solar System, and explore the Earth's formation, geology and climate. This module follows the strand from Stage 1 to Stage 6."}},{"t":"h","c":{"en":"Three sub-strands","ar":"Three sub-strands"}},{"t":"list","c":{"en":["\u003cstrong>Planet Earth (ESp):\u003c/strong> water, rocks, soil, the structure of the Earth, the atmosphere and human effects on the environment. It appears in every stage.","\u003cstrong>Cycles on Earth (ESc):\u003c/strong> the water cycle in Stage 5 and the rock cycle in Stage 6. It appears only in Stages 5 and 6.","\u003cstrong>Earth in space (ESs):\u003c/strong> the Sun, Moon, Earth and the Solar System. It appears in every stage."],"ar":["\u003cstrong>Planet Earth (ESp):\u003c/strong> water, rocks, soil, the structure of the Earth, the atmosphere and human effects on the environment. It appears in every stage.","\u003cstrong>Cycles on Earth (ESc):\u003c/strong> the water cycle in Stage 5 and the rock cycle in Stage 6. It appears only in Stages 5 and 6.","\u003cstrong>Earth in space (ESs):\u003c/strong> the Sun, Moon, Earth and the Solar System. It appears in every stage."]}},{"t":"h","c":{"en":"Key ideas, stage by stage","ar":"Key ideas, stage by stage"}},{"t":"table","head":{"en":["Stage","Planet Earth (ESp)","Cycles on Earth (ESc)","Earth in space (ESs)"],"ar":["Stage","Planet Earth (ESp)","Cycles on Earth (ESc)","Earth in space (ESs)"]},"rows":[{"en":["1","Earth is mostly covered in water; land is made of rock and soil (1ESp.01, .02)","Not listed","Earth is the planet we live on; the Sun is a source of heat and light, and one of many stars (1ESs.01, .02)"],"ar":["1","Earth is mostly covered in water; land is made of rock and soil (1ESp.01, .02)","Not listed","Earth is the planet we live on; the Sun is a source of heat and light, and one of many stars (1ESs.01, .02)"]},{"en":["2","Describe and compare rocks; rocks are extracted from quarries, mines and riverbeds; human activity can affect the environment (2ESp.01 to .03)","Not listed","The apparent movement of the Sun during the day (2ESs.01)"],"ar":["2","Describe and compare rocks; rocks are extracted from quarries, mines and riverbeds; human activity can affect the environment (2ESp.01 to .03)","Not listed","The apparent movement of the Sun during the day (2ESs.01)"]},{"en":["3","Earth is the source of all materials we use, including oil, natural gas and metals from rocks; fossils are impressions or remains of things once alive (3ESp.01, .02)","Not listed","Regular change in the position and appearance of the Moon; relative movement of Earth and Moon; Earth, Sun and Moon are approximately spherical (3ESs.01 to .03)"],"ar":["3","Earth is the source of all materials we use, including oil, natural gas and metals from rocks; fossils are impressions or remains of things once alive (3ESp.01, .02)","Not listed","Regular change in the position and appearance of the Moon; relative movement of Earth and Moon; Earth, Sun and Moon are approximately spherical (3ESs.01 to .03)"]},{"en":["4","A model of the structure of the Earth (core, mantle, crust); volcanoes; the Earth's crust moves and sudden movement is an earthquake (4ESp.01 to .03)","Not listed","Explain how the Earth's spin leads to the apparent movement of the Sun, day and night and changing shadows; name the planets; the Sun is at the centre of the Solar System; stars, planets, asteroids and comets (4ESs.01 to .04)"],"ar":["4","A model of the structure of the Earth (core, mantle, crust); volcanoes; the Earth's crust moves and sudden movement is an earthquake (4ESp.01 to .03)","Not listed","Explain how the Earth's spin leads to the apparent movement of the Sun, day and night and changing shadows; name the planets; the Sun is at the centre of the Solar System; stars, planets, asteroids and comets (4ESs.01 to .04)"]},{"en":["5","The atmosphere is a mixture of gases; most water on Earth is not pure; pollution (5ESp.01 to .03)","The water cycle: evaporation, condensation and precipitation (5ESc.01)","The orbit of the Earth around the Sun; how the tilt of the Earth can create different seasons; satellites and moons (5ESs.01 to .03)"],"ar":["5","The atmosphere is a mixture of gases; most water on Earth is not pure; pollution (5ESp.01 to .03)","The water cycle: evaporation, condensation and precipitation (5ESc.01)","The orbit of the Earth around the Sun; how the tilt of the Earth can create different seasons; satellites and moons (5ESs.01 to .03)"]},{"en":["6","Rock types: metamorphic, igneous and sedimentary; how fossils form in sedimentary rocks; types of soil; soil composition and plant growth (6ESp.01 to .04)","The rock cycle (6ESc.01)","Relative position and movement of the planets, Moon and Sun; the Moon's appearance over its monthly cycle (6ESs.01, .02)"],"ar":["6","Rock types: metamorphic, igneous and sedimentary; how fossils form in sedimentary rocks; types of soil; soil composition and plant growth (6ESp.01 to .04)","The rock cycle (6ESc.01)","Relative position and movement of the planets, Moon and Sun; the Moon's appearance over its monthly cycle (6ESs.01, .02)"]}]},{"t":"h","c":{"en":"How the ideas build","ar":"How the ideas build"}},{"t":"table","head":{"en":["Thread","Stage path (exact codes)","What changes"],"ar":["Thread","Stage path (exact codes)","What changes"]},"rows":[{"en":["Rocks and fossils","1ESp.02 land is rock and soil, 2ESp.01 and 2ESp.02 compare and extract rocks, 3ESp.01 and 3ESp.02 materials and fossils, 6ESp.01 and 6ESp.02 rock types and fossil formation, 6ESc.01 rock cycle","From observing rocks, to uses of rocks, to how rocks form and change"],"ar":["Rocks and fossils","1ESp.02 land is rock and soil, 2ESp.01 and 2ESp.02 compare and extract rocks, 3ESp.01 and 3ESp.02 materials and fossils, 6ESp.01 and 6ESp.02 rock types and fossil formation, 6ESc.01 rock cycle","From observing rocks, to uses of rocks, to how rocks form and change"]},{"en":["Water","1ESp.01 Earth is mostly water, 5Cp.02 properties of water, 5ESp.02 dissolved substances, 5ESc.01 water cycle","From a fact, to properties, to a cycle"],"ar":["Water","1ESp.01 Earth is mostly water, 5Cp.02 properties of water, 5ESp.02 dissolved substances, 5ESc.01 water cycle","From a fact, to properties, to a cycle"]},{"en":["The Sun, Earth and Moon","2ESs.01 apparent movement of the Sun, 3ESs.01 to 3ESs.03 the Moon and shapes, 4ESs.01 day and night, 5ESs.01 and 5ESs.02 orbit and seasons, 6ESs.01 and 6ESs.02 Solar System positions and Moon cycle","From \"what we see\", to a model that explains what we see"],"ar":["The Sun, Earth and Moon","2ESs.01 apparent movement of the Sun, 3ESs.01 to 3ESs.03 the Moon and shapes, 4ESs.01 day and night, 5ESs.01 and 5ESs.02 orbit and seasons, 6ESs.01 and 6ESs.02 Solar System positions and Moon cycle","From \"what we see\", to a model that explains what we see"]},{"en":["People and the environment","2ESp.03 human activity can affect the environment, 5ESp.03 pollution, 6Be.02 toxic substances in food chains, 4SIC.05 and 5SIC.05 and 6SIC.05 positive and negative environmental effects","From simple awareness, to examples of pollution, to discussion of effects"],"ar":["People and the environment","2ESp.03 human activity can affect the environment, 5ESp.03 pollution, 6Be.02 toxic substances in food chains, 4SIC.05 and 5SIC.05 and 6SIC.05 positive and negative environmental effects","From simple awareness, to examples of pollution, to discussion of effects"]}]},{"t":"callout","k":"key","title":{"en":"Seeing versus explaining","ar":"Seeing versus explaining"},"c":{"en":"Pay attention to the word \u003cstrong>apparent\u003c/strong> in 2ESs.01: \"describe the apparent movement of the Sun during the day\". In Stage 2, pupils describe what they see. In Stage 4 (4ESs.01) they \u003cem>explain\u003c/em> why: the Earth spins on its axis. This is a clear example of a progression from description to explanation. Pupils who only memorise \"the Earth spins\" without first observing the Sun and shadows often keep the idea that the Sun moves around us.","ar":"Pay attention to the word \u003cstrong>apparent\u003c/strong> in 2ESs.01: \"describe the apparent movement of the Sun during the day\". In Stage 2, pupils describe what they see. In Stage 4 (4ESs.01) they \u003cem>explain\u003c/em> why: the Earth spins on its axis. This is a clear example of a progression from description to explanation. Pupils who only memorise \"the Earth spins\" without first observing the Sun and shadows often keep the idea that the Sun moves around us."}},{"t":"h","c":{"en":"Using models in Earth and Space","ar":"Using models in Earth and Space"}},{"t":"p","c":{"en":"Earth and Space is the strand where Thinking and Working Scientifically models are most obvious, because pupils cannot see the inside of the Earth or the whole Solar System. 4ESp.01 asks pupils to describe \"the model of the structure of the Earth\". The framework's models objectives remind us that models are not fully representative (4TWSm.01), and show some important features (5TWSm.01). Good practice is to ask, every time you use a globe, a torch and ball or a layered diagram: \"What does this model show well? What does it not show?\"","ar":"Earth and Space is the strand where Thinking and Working Scientifically models are most obvious, because pupils cannot see the inside of the Earth or the whole Solar System. 4ESp.01 asks pupils to describe \"the model of the structure of the Earth\". The framework's models objectives remind us that models are not fully representative (4TWSm.01), and show some important features (5TWSm.01). Good practice is to ask, every time you use a globe, a torch and ball or a layered diagram: \"What does this model show well? What does it not show?\""}},{"t":"table","head":{"en":["Model","Linked objectives","Question to ask pupils (good practice)"],"ar":["Model","Linked objectives","Question to ask pupils (good practice)"]},"rows":[{"en":["Torch, globe and ball","3ESs.01, 3ESs.02, 4ESs.01, 5ESs.02, 6ESs.02","What do the torch, the globe and the ball represent? Where does the model go wrong?"],"ar":["Torch, globe and ball","3ESs.01, 3ESs.02, 4ESs.01, 5ESs.02, 6ESs.02","What do the torch, the globe and the ball represent? Where does the model go wrong?"]},{"en":["Layered diagram or clay model of the Earth","4ESp.01, 4TWSm.01","Which layers can we not see? How do scientists know about them?"],"ar":["Layered diagram or clay model of the Earth","4ESp.01, 4TWSm.01","Which layers can we not see? How do scientists know about them?"]},{"en":["Water cycle diagram","5ESc.01, 5Cc.01","Which arrow shows evaporation? What is happening to the particles?"],"ar":["Water cycle diagram","5ESc.01, 5Cc.01","Which arrow shows evaporation? What is happening to the particles?"]},{"en":["Rock cycle diagram","6ESc.01, 6TWSm.02","Where does each rock type begin? Which processes link them?"],"ar":["Rock cycle diagram","6ESc.01, 6TWSm.02","Where does each rock type begin? Which processes link them?"]}]},{"t":"h","c":{"en":"Links to other strands","ar":"Links to other strands"}},{"t":"list","c":{"en":["\u003cstrong>Chemistry:\u003c/strong> evaporation and condensation (5Cc.01) are the science of the water cycle; dissolved substances (5ESp.02) link to 5Cc.03; melting and solidification are used in the rock cycle (6ESc.01).","\u003cstrong>Physics:\u003c/strong> gravity (3Pf.02, 6Pf.02), light and shadows (3Ps.02, 3Ps.03), the Sun as a light source (2Ps.01).","\u003cstrong>Biology:\u003c/strong> soil and plant growth (6ESp.04) link to plant needs (1Bp.03, 3Bp.03); habitats and adaptation to hot, cold, wet and dry environments (2Be.01, 5Be.01) use ideas about climate and place.","\u003cstrong>Science in Context:\u003c/strong> this strand is easy to link to local life: quarries, mines and rock extraction (2ESp.02), pollution (5ESp.03) and local environmental effects (4SIC.05)."],"ar":["\u003cstrong>Chemistry:\u003c/strong> evaporation and condensation (5Cc.01) are the science of the water cycle; dissolved substances (5ESp.02) link to 5Cc.03; melting and solidification are used in the rock cycle (6ESc.01).","\u003cstrong>Physics:\u003c/strong> gravity (3Pf.02, 6Pf.02), light and shadows (3Ps.02, 3Ps.03), the Sun as a light source (2Ps.01).","\u003cstrong>Biology:\u003c/strong> soil and plant growth (6ESp.04) link to plant needs (1Bp.03, 3Bp.03); habitats and adaptation to hot, cold, wet and dry environments (2Be.01, 5Be.01) use ideas about climate and place.","\u003cstrong>Science in Context:\u003c/strong> this strand is easy to link to local life: quarries, mines and rock extraction (2ESp.02), pollution (5ESp.03) and local environmental effects (4SIC.05)."]}},{"t":"h","c":{"en":"Common ideas to watch (good practice)","ar":"Common ideas to watch (good practice)"}},{"t":"list","c":{"en":["\"The Sun moves around the Earth.\" Use 2ESs.01 (apparent movement) and 4ESs.01 (the Earth's spin explains it).","\"Summer happens because the Earth is closer to the Sun.\" 5ESs.02 says the tilt of the Earth can create different seasons in different places. Notice that 5ESs.01 only asks about the orbit, \"limited to slight ellipse, anticlockwise direction and the duration\".","\"The Moon makes its own light.\" 1ESs.02 says the Sun is a source of light, and 4Ps.03 asks how objects that are not light sources are seen. 6ESs.02 asks pupils to observe the Moon's appearance over its cycle.","\"Fossils are just bones.\" 3ESp.02 says fossils are impressions or remains of things that were once alive.","\"Rocks are rocks and never change.\" 6ESc.01 describes the rock cycle with processes such as erosion, burial and melting."],"ar":["\"The Sun moves around the Earth.\" Use 2ESs.01 (apparent movement) and 4ESs.01 (the Earth's spin explains it).","\"Summer happens because the Earth is closer to the Sun.\" 5ESs.02 says the tilt of the Earth can create different seasons in different places. Notice that 5ESs.01 only asks about the orbit, \"limited to slight ellipse, anticlockwise direction and the duration\".","\"The Moon makes its own light.\" 1ESs.02 says the Sun is a source of light, and 4Ps.03 asks how objects that are not light sources are seen. 6ESs.02 asks pupils to observe the Moon's appearance over its cycle.","\"Fossils are just bones.\" 3ESp.02 says fossils are impressions or remains of things that were once alive.","\"Rocks are rocks and never change.\" 6ESc.01 describes the rock cycle with processes such as erosion, burial and melting."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: observation over time needs a long runway","ar":"Good practice: observation over time needs a long runway"},"c":{"en":"Several Earth and Space objectives need observations over days or weeks: shadows and the Sun (2ESs.01, 4ESs.01), the Moon (3ESs.01, 6ESs.02) and seasons (5ESs.02). Plan them early in the term, so there is time to record, and make the record part of the Thinking and Working Scientifically work (for example 6TWSc.08, recording in tables and diagrams). The Moon's monthly cycle in 6ESs.02 cannot be observed in one lesson.","ar":"Several Earth and Space objectives need observations over days or weeks: shadows and the Sun (2ESs.01, 4ESs.01), the Moon (3ESs.01, 6ESs.02) and seasons (5ESs.02). Plan them early in the term, so there is time to record, and make the record part of the Thinking and Working Scientifically work (for example 6TWSc.08, recording in tables and diagrams). The Moon's monthly cycle in 6ESs.02 cannot be observed in one lesson."}},{"t":"scenario","title":{"en":"Day and night in Year 4","ar":"Day and night in Year 4"},"c":{"en":"A Year 4 pupil says: \"At night the Sun goes to the other side of the world, so it moves.\" You are teaching 4ESs.01. \u003cstrong>What do you do?\u003c/strong> Agree that the Sun looks as if it moves (2ESs.01: apparent movement). Then use a torch and a globe with a small sticker for your school's place. Turn the globe on its axis, and ask pupils to predict when the sticker is in light and in shadow. Let them record shadow length at different times with a stick outside (4TWSc.05, 4TWSc.08). Finish by asking which parts of the model are not accurate (4TWSm.01).","ar":"A Year 4 pupil says: \"At night the Sun goes to the other side of the world, so it moves.\" You are teaching 4ESs.01. \u003cstrong>What do you do?\u003c/strong> Agree that the Sun looks as if it moves (2ESs.01: apparent movement). Then use a torch and a globe with a small sticker for your school's place. Turn the globe on its axis, and ask pupils to predict when the sticker is in light and in shadow. Let them record shadow length at different times with a stick outside (4TWSc.05, 4TWSc.08). Finish by asking which parts of the model are not accurate (4TWSm.01)."}}],"checks":[{"id":"m8q1","q":{"en":"In which stages does the Cycles on Earth sub-strand appear, and what does each stage name?","ar":"In which stages does the Cycles on Earth sub-strand appear, and what does each stage name?"},"opts":[{"en":"Stages 3 and 4: the water cycle in Stage 3 and the rock cycle in Stage 4","ar":"Stages 3 and 4: the water cycle in Stage 3 and the rock cycle in Stage 4"},{"en":"Stages 5 and 6: the water cycle in Stage 5 and the rock cycle in Stage 6","ar":"Stages 5 and 6: the water cycle in Stage 5 and the rock cycle in Stage 6"},{"en":"Stages 4 to 6: the water cycle in Stage 4 and the rock cycle in Stage 6","ar":"Stages 4 to 6: the water cycle in Stage 4 and the rock cycle in Stage 6"},{"en":"Stages 5 and 6: the rock cycle in Stage 5 and the water cycle in Stage 6","ar":"Stages 5 and 6: the rock cycle in Stage 5 and the water cycle in Stage 6"}],"correct":1,"expl":{"en":"5ESc.01 describes the water cycle (limited to evaporation, condensation and precipitation) and 6ESc.01 describes the rock cycle. No earlier stage lists a cycle on Earth.","ar":"5ESc.01 describes the water cycle (limited to evaporation, condensation and precipitation) and 6ESc.01 describes the rock cycle. No earlier stage lists a cycle on Earth."}},{"id":"m8q2","q":{"en":"What is the difference between 2ESs.01 and 4ESs.01?","ar":"What is the difference between 2ESs.01 and 4ESs.01?"},"opts":[{"en":"2ESs.01 asks pupils to explain seasons, and 4ESs.01 asks them to describe the phases of the Moon","ar":"2ESs.01 asks pupils to explain seasons, and 4ESs.01 asks them to describe the phases of the Moon"},{"en":"2ESs.01 asks pupils to name the planets, and 4ESs.01 asks them to describe the orbit of the Earth","ar":"2ESs.01 asks pupils to name the planets, and 4ESs.01 asks them to describe the orbit of the Earth"},{"en":"2ESs.01 asks pupils to describe the apparent movement of the Sun; 4ESs.01 asks them to explain it","ar":"2ESs.01 asks pupils to describe the apparent movement of the Sun; 4ESs.01 asks them to explain it"},{"en":"2ESs.01 asks pupils to explain day and night, and 4ESs.01 asks them to describe the apparent movement of the Sun","ar":"2ESs.01 asks pupils to explain day and night, and 4ESs.01 asks them to describe the apparent movement of the Sun"}],"correct":2,"expl":{"en":"2ESs.01 is about describing the apparent movement of the Sun during the day. 4ESs.01 asks pupils to explain why the spinning of the Earth on its axis leads to apparent movement, night and day, and changes in shadows.","ar":"2ESs.01 is about describing the apparent movement of the Sun during the day. 4ESs.01 asks pupils to explain why the spinning of the Earth on its axis leads to apparent movement, night and day, and changes in shadows."}},{"id":"m8q3","q":{"en":"A teacher wants Year 5 pupils to explain why places can have different seasons. Which objective should she use?","ar":"A teacher wants Year 5 pupils to explain why places can have different seasons. Which objective should she use?"},"opts":[{"en":"5ESs.01, which says the Earth orbits the Sun in a slight ellipse in an anticlockwise direction","ar":"5ESs.01, which says the Earth orbits the Sun in a slight ellipse in an anticlockwise direction"},{"en":"5ESs.03, which says that a satellite orbits a larger object and a moon is a natural satellite","ar":"5ESs.03, which says that a satellite orbits a larger object and a moon is a natural satellite"},{"en":"5ESc.01, which describes the water cycle in terms of evaporation, condensation and precipitation","ar":"5ESc.01, which describes the water cycle in terms of evaporation, condensation and precipitation"},{"en":"5ESs.02, which says that the tilt of the Earth can create different seasons in different places","ar":"5ESs.02, which says that the tilt of the Earth can create different seasons in different places"}],"correct":3,"expl":{"en":"5ESs.02 is the seasons objective. 5ESs.01 covers the orbit, 5ESs.03 covers satellites, and 5ESc.01 covers the water cycle.","ar":"5ESs.02 is the seasons objective. 5ESs.01 covers the orbit, 5ESs.03 covers satellites, and 5ESc.01 covers the water cycle."}}]},{"id":"m9","title":{"en":"Reading Progression Across Stages: Tracing Ideas from Stage 1 to Stage 6","ar":"Reading Progression Across Stages: Tracing Ideas from Stage 1 to Stage 6"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework says that \"all the learning objectives in each stage provide clear progression from the previous stage and to the subsequent stage\". It also says that, to enable effective progression, \"you need to be familiar with the progression of skills across stages\", so that you can build on prior learning in every stage. The progression of learning objectives across Stages 1 to 6 is available on the School Support Hub. This module shows how to do that reading yourself, with the framework in your hand.","ar":"The framework says that \"all the learning objectives in each stage provide clear progression from the previous stage and to the subsequent stage\". It also says that, to enable effective progression, \"you need to be familiar with the progression of skills across stages\", so that you can build on prior learning in every stage. The progression of learning objectives across Stages 1 to 6 is available on the School Support Hub. This module shows how to do that reading yourself, with the framework in your hand."}},{"t":"h","c":{"en":"A method for tracing one idea","ar":"A method for tracing one idea"}},{"t":"steps","c":{"en":["\u003cstrong>Pick the objective.\u003c/strong> For example, 6Pf.01 (mass and weight).","\u003cstrong>Find its strand and sub-strand.\u003c/strong> Here: Physics, Forces and energy. Read the same sub-strand in each earlier stage.","\u003cstrong>List every related earlier code.\u003c/strong> Look for the same topic in other strands too. Mass and weight link to 3Pf.01 (newtons) and 3Pf.02 (gravity).","\u003cstrong>Compare the verbs.\u003c/strong> Did the verb change from explore, to know, to describe, to explain or use? A change in verb is a change in demand.","\u003cstrong>Check the skills.\u003c/strong> Which TWS objectives and appendix units does the idea need? Here: 3TWSc.03 (standard units) and the appendix units for mass (g, kg) and weight (N).","\u003cstrong>Decide what to check on day one.\u003c/strong> Choose one or two short questions that show whether the earlier idea is secure."],"ar":["\u003cstrong>Pick the objective.\u003c/strong> For example, 6Pf.01 (mass and weight).","\u003cstrong>Find its strand and sub-strand.\u003c/strong> Here: Physics, Forces and energy. Read the same sub-strand in each earlier stage.","\u003cstrong>List every related earlier code.\u003c/strong> Look for the same topic in other strands too. Mass and weight link to 3Pf.01 (newtons) and 3Pf.02 (gravity).","\u003cstrong>Compare the verbs.\u003c/strong> Did the verb change from explore, to know, to describe, to explain or use? A change in verb is a change in demand.","\u003cstrong>Check the skills.\u003c/strong> Which TWS objectives and appendix units does the idea need? Here: 3TWSc.03 (standard units) and the appendix units for mass (g, kg) and weight (N).","\u003cstrong>Decide what to check on day one.\u003c/strong> Choose one or two short questions that show whether the earlier idea is secure."]}},{"t":"h","c":{"en":"Worked trace 1: measuring and recording data (a skill)","ar":"Worked trace 1: measuring and recording data (a skill)"}},{"t":"table","head":{"en":["Stage","Objective code and idea","What pupils can do"],"ar":["Stage","Objective code and idea","What pupils can do"]},"rows":[{"en":["1","1TWSc.03 non-standard units; 1TWSc.05 annotate images and simple tables","Measure with hands, cubes or steps; record in a simple table"],"ar":["1","1TWSc.03 non-standard units; 1TWSc.05 annotate images and simple tables","Measure with hands, cubes or steps; record in a simple table"]},{"en":["3","3TWSc.03 standard units and their advantage; 3TWSc.06 tables and diagrams; 3TWSa.04 bar charts","Use rulers and forcemeters; explain why standard units are better; draw bar charts"],"ar":["3","3TWSc.03 standard units and their advantage; 3TWSc.06 tables and diagrams; 3TWSa.04 bar charts","Use rulers and forcemeters; explain why standard units are better; draw bar charts"]},{"en":["4","4TWSc.04 know that repeated measurements can give more reliable data; 4TWSa.04 adds dot plots","Repeat a measurement and say why"],"ar":["4","4TWSc.04 know that repeated measurements can give more reliable data; 4TWSa.04 adds dot plots","Repeat a measurement and say why"]},{"en":["5","5TWSc.04 decide when to repeat; 5TWSc.05 appropriately accurate measurements; 5TWSa.02 anomalous results; 5TWSa.05 line graphs","Decide when to repeat, spot an odd result and draw a line graph"],"ar":["5","5TWSc.04 decide when to repeat; 5TWSc.05 appropriately accurate measurements; 5TWSa.02 anomalous results; 5TWSa.05 line graphs","Decide when to repeat, spot an odd result and draw a line graph"]},{"en":["6","6TWSa.05 adds scatter graphs; 6TWSa.04 suggest how to improve the investigation","Choose the right graph and suggest improvements"],"ar":["6","6TWSa.05 adds scatter graphs; 6TWSa.04 suggest how to improve the investigation","Choose the right graph and suggest improvements"]}]},{"t":"h","c":{"en":"Worked trace 2: what plants need (a content idea)","ar":"Worked trace 2: what plants need (a content idea)"}},{"t":"table","head":{"en":["Stage","Objective code and idea","What pupils can do"],"ar":["Stage","Objective code and idea","What pupils can do"]},"rows":[{"en":["1","1Bp.03 plants need light and water to survive; 1Bs.01 name the parts","Name roots, leaves, stems and flowers; say what plants need"],"ar":["1","1Bp.03 plants need light and water to survive; 1Bs.01 name the parts","Name roots, leaves, stems and flowers; say what plants need"]},{"en":["3","3Bs.01 functions of the plant parts; 3Bp.03 appropriate conditions including temperature, light and water","Say what roots, leaves and stems do; test a plant in different conditions"],"ar":["3","3Bs.01 functions of the plant parts; 3Bp.03 appropriate conditions including temperature, light and water","Say what roots, leaves and stems do; test a plant in different conditions"]},{"en":["4","4Bp.03 plants get energy from light and animals get energy from eating","Link plants to food chains and to energy"],"ar":["4","4Bp.03 plants get energy from light and animals get energy from eating","Link plants to food chains and to energy"]},{"en":["5","5Bp.04 germination needs water and an appropriate temperature; 5Bs.03 flower functions; 5Bp.03 pollination, fruit, seeds, dispersal","Explain how plants reproduce and how seeds germinate"],"ar":["5","5Bp.04 germination needs water and an appropriate temperature; 5Bs.03 flower functions; 5Bp.03 pollination, fruit, seeds, dispersal","Explain how plants reproduce and how seeds germinate"]},{"en":["6","6ESp.04 soil composition can support, or hinder, plant growth","Link soil types to plant growth"],"ar":["6","6ESp.04 soil composition can support, or hinder, plant growth","Link soil types to plant growth"]}]},{"t":"p","c":{"en":"In both traces the wording is a little different at each stage, but the idea is continuous. A teacher who starts a Stage 5 germination investigation knowing about 3Bp.03 (conditions for plants) can ask better starter questions than one who sees only the Stage 5 page.","ar":"In both traces the wording is a little different at each stage, but the idea is continuous. A teacher who starts a Stage 5 germination investigation knowing about 3Bp.03 (conditions for plants) can ask better starter questions than one who sees only the Stage 5 page."}},{"t":"h","c":{"en":"Spotting prerequisites and gaps","ar":"Spotting prerequisites and gaps"}},{"t":"p","c":{"en":"A \u003cstrong>prerequisite\u003c/strong> is an earlier idea that a later objective depends on. A \u003cstrong>gap\u003c/strong> is a prerequisite that pupils do not yet have, for example because they joined the school recently, missed a unit or learned a different curriculum. The table gives examples of prerequisites you can read straight from the framework (the \"quick check\" column is good practice).","ar":"A \u003cstrong>prerequisite\u003c/strong> is an earlier idea that a later objective depends on. A \u003cstrong>gap\u003c/strong> is a prerequisite that pupils do not yet have, for example because they joined the school recently, missed a unit or learned a different curriculum. The table gives examples of prerequisites you can read straight from the framework (the \"quick check\" column is good practice)."}},{"t":"table","head":{"en":["Later objective","Earlier objectives it builds on","Quick check on day one (good practice)"],"ar":["Later objective","Earlier objectives it builds on","Quick check on day one (good practice)"]},"rows":[{"en":["6Cc.02 temperature and dissolving, with the particle model","3Cc.01, 5Cc.03, 4Cm.01","Draw salt in water as particles and say if the salt is still there"],"ar":["6Cc.02 temperature and dissolving, with the particle model","3Cc.01, 5Cc.03, 4Cm.01","Draw salt in water as particles and say if the salt is still there"]},{"en":["6Pf.01 mass in kg and weight in N","3Pf.01 newton, 3Pf.02 gravity, appendix units","What is the unit of force, and what does gravity do?"],"ar":["6Pf.01 mass in kg and weight in N","3Pf.01 newton, 3Pf.02 gravity, appendix units","What is the unit of force, and what does gravity do?"]},{"en":["6Pe.01 series and parallel circuit diagrams","2Pe.02, 2Pe.03, 4Pe.02, 4Pe.03, appendix symbols","Draw a simple circuit with a cell, switch and lamp using symbols"],"ar":["6Pe.01 series and parallel circuit diagrams","2Pe.02, 2Pe.03, 4Pe.02, 4Pe.03, appendix symbols","Draw a simple circuit with a cell, switch and lamp using symbols"]},{"en":["6Be.03 energy transfer in a food chain or web","3Be.01, 4Be.03, 4Bp.03, 4Pf.02","Where does a plant get its energy? Where does energy go next?"],"ar":["6Be.03 energy transfer in a food chain or web","3Be.01, 4Be.03, 4Bp.03, 4Pf.02","Where does a plant get its energy? Where does energy go next?"]},{"en":["5Bp.03 pollination, fruit and seeds","3Bs.01, 5Bs.02, 5Bs.03","Name the flower parts and say what the anther and stigma do"],"ar":["5Bp.03 pollination, fruit and seeds","3Bs.01, 5Bs.02, 5Bs.03","Name the flower parts and say what the anther and stigma do"]},{"en":["6ESp.02 fossil formation in sedimentary rock","3ESp.02, 6ESp.01","What is a fossil? Name the three rock types"],"ar":["6ESp.02 fossil formation in sedimentary rock","3ESp.02, 6ESp.01","What is a fossil? Name the three rock types"]}]},{"t":"callout","k":"warn","title":{"en":"A gap is information, not blame","ar":"A gap is information, not blame"},"c":{"en":"If pupils lack a prerequisite, do not assume that a colleague failed. Pupils may have been absent, may have come from another curriculum, or may have learned the idea in a way that did not stay in their memory. Record the gap, teach the missing idea briefly and in context, and tell your HOD if many pupils share the same gap.","ar":"If pupils lack a prerequisite, do not assume that a colleague failed. Pupils may have been absent, may have come from another curriculum, or may have learned the idea in a way that did not stay in their memory. Record the gap, teach the missing idea briefly and in context, and tell your HOD if many pupils share the same gap."}},{"t":"h","c":{"en":"The Checkpoint year and what comes next","ar":"The Checkpoint year and what comes next"}},{"t":"p","c":{"en":"PEPS Year 6 follows Stage 6 and sits Cambridge Primary Checkpoint. The framework says that Cambridge provides assessments designed to complement the framework for Stages 3 to 6, and names Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments. It does not describe their format in this document, so use the School Support Hub and your school's own guidance for that. Two points are stated clearly in the framework: 6Bs.03 will not be assessed in Checkpoint and Stage 6 Progression Tests, and 6Bp.01 will be assessed.","ar":"PEPS Year 6 follows Stage 6 and sits Cambridge Primary Checkpoint. The framework says that Cambridge provides assessments designed to complement the framework for Stages 3 to 6, and names Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments. It does not describe their format in this document, so use the School Support Hub and your school's own guidance for that. Two points are stated clearly in the framework: 6Bs.03 will not be assessed in Checkpoint and Stage 6 Progression Tests, and 6Bp.01 will be assessed."}},{"t":"list","c":{"en":["\u003cstrong>All Stage 6 objectives build on earlier ones.\u003c/strong> Because each stage provides progression to the next, ideas from Stages 3 to 5 (such as the particle model, force diagrams and circuits) are the foundation for Stage 6. Do not treat Year 6 as a stand-alone year of revision.","\u003cstrong>Science in Context is not directly assessed\u003c/strong> by Cambridge, but it is part of the framework and supports learning in all strands.","\u003cstrong>After Year 6,\u003c/strong> PEPS pupils move to Years 7 to 9 and Cambridge Lower Secondary. The Cambridge Pathway \"builds on the learners' development from the previous one\". Check with your HOD how the secondary science team uses the Stage 6 objectives and the Checkpoint information when planning Year 7."],"ar":["\u003cstrong>All Stage 6 objectives build on earlier ones.\u003c/strong> Because each stage provides progression to the next, ideas from Stages 3 to 5 (such as the particle model, force diagrams and circuits) are the foundation for Stage 6. Do not treat Year 6 as a stand-alone year of revision.","\u003cstrong>Science in Context is not directly assessed\u003c/strong> by Cambridge, but it is part of the framework and supports learning in all strands.","\u003cstrong>After Year 6,\u003c/strong> PEPS pupils move to Years 7 to 9 and Cambridge Lower Secondary. The Cambridge Pathway \"builds on the learners' development from the previous one\". Check with your HOD how the secondary science team uses the Stage 6 objectives and the Checkpoint information when planning Year 7."]}},{"t":"h","c":{"en":"Using the glossary and the appendix","ar":"Using the glossary and the appendix"}},{"t":"p","c":{"en":"The glossary gives definitions \"to guide an informed reader\", including \u003cem>diagram, experiment, investigation, learning objective, material, mixture, model, object, representation, scheme of work, scientific model, strand, substance\u003c/em> and \u003cem>teacher guide\u003c/em>. Two useful distinctions for teachers:","ar":"The glossary gives definitions \"to guide an informed reader\", including \u003cem>diagram, experiment, investigation, learning objective, material, mixture, model, object, representation, scheme of work, scientific model, strand, substance\u003c/em> and \u003cem>teacher guide\u003c/em>. Two useful distinctions for teachers:"}},{"t":"list","c":{"en":["\u003cstrong>Experiment and investigation.\u003c/strong> The glossary says an experiment is a specific procedure carried out to support, disprove or validate a scientific prediction. An investigation is a method of acquiring knowledge based on a starting question, which often involves experiments but not always, for example when it uses secondary sources. So a research task (3TWSp.02) is an investigation.","\u003cstrong>Model and representation.\u003c/strong> A scientific model is a representation of objects, systems or processes that helps scientists explain and think about ideas that are abstract or not visible. A representation can also be a diagram or an equation."],"ar":["\u003cstrong>Experiment and investigation.\u003c/strong> The glossary says an experiment is a specific procedure carried out to support, disprove or validate a scientific prediction. An investigation is a method of acquiring knowledge based on a starting question, which often involves experiments but not always, for example when it uses secondary sources. So a research task (3TWSp.02) is an investigation.","\u003cstrong>Model and representation.\u003c/strong> A scientific model is a representation of objects, systems or processes that helps scientists explain and think about ideas that are abstract or not visible. A representation can also be a diagram or an equation."]}},{"t":"p","c":{"en":"The appendix gives the electrical symbols and the units for physical quantities that pupils should know by the end of Stage 6. Use it as a checklist when you plan Physics and measuring work, and when you talk to the mathematics team (the appendix asks you to cross-reference the Primary Mathematics curriculum or the school's own mathematics curriculum).","ar":"The appendix gives the electrical symbols and the units for physical quantities that pupils should know by the end of Stage 6. Use it as a checklist when you plan Physics and measuring work, and when you talk to the mathematics team (the appendix asks you to cross-reference the Primary Mathematics curriculum or the school's own mathematics curriculum)."}},{"t":"scenario","title":{"en":"A new pupil in Year 6","ar":"A new pupil in Year 6"},"c":{"en":"In September, a pupil joins Year 6 from another country. In the first lesson on 6Pe.01 she cannot draw a circuit with symbols, and she calls the battery \"the electric\". Her teacher worries that she must teach two years of electricity. \u003cstrong>What is a sensible plan?\u003c/strong> Use the tracing method. Identify the prerequisites: 2Pe.02 (components), 2Pe.03 (series circuits), 4Pe.02 and 4Pe.03 (switches and changing components) and the appendix symbols. Give a short practical lesson with real components, a symbol card and a labelled drawing, then check with a simple question. Pair her with a confident partner for talk. Tell your HOD, because other new pupils may have similar gaps.","ar":"In September, a pupil joins Year 6 from another country. In the first lesson on 6Pe.01 she cannot draw a circuit with symbols, and she calls the battery \"the electric\". Her teacher worries that she must teach two years of electricity. \u003cstrong>What is a sensible plan?\u003c/strong> Use the tracing method. Identify the prerequisites: 2Pe.02 (components), 2Pe.03 (series circuits), 4Pe.02 and 4Pe.03 (switches and changing components) and the appendix symbols. Give a short practical lesson with real components, a symbol card and a labelled drawing, then check with a simple question. Pair her with a confident partner for talk. Tell your HOD, because other new pupils may have similar gaps."}},{"t":"scenario","title":{"en":"A planning meeting","ar":"A planning meeting"},"c":{"en":"Your HOD asks Stage 3 and Stage 4 teachers to compare their unit plans for \"Materials and mixtures\". Stage 3 includes 3Cm.02, 3Cp.03 and 3Cc.01. Stage 4 will use the particle model (4Cm.01). \u003cstrong>What should each teacher check?\u003c/strong> The Stage 3 teacher should be sure pupils understand that a mixture contains materials that can be physically separated and that a dissolved solid is still present. The Stage 4 teacher should check this before introducing particles, and should not assume that pupils will accept the particle explanation without evidence. Both teachers should use the exact codes and the version 4.0 wording.","ar":"Your HOD asks Stage 3 and Stage 4 teachers to compare their unit plans for \"Materials and mixtures\". Stage 3 includes 3Cm.02, 3Cp.03 and 3Cc.01. Stage 4 will use the particle model (4Cm.01). \u003cstrong>What should each teacher check?\u003c/strong> The Stage 3 teacher should be sure pupils understand that a mixture contains materials that can be physically separated and that a dissolved solid is still present. The Stage 4 teacher should check this before introducing particles, and should not assume that pupils will accept the particle explanation without evidence. Both teachers should use the exact codes and the version 4.0 wording."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"1. The framework is a \u003cstrong>map of Stages 1 to 6\u003c/strong>. Read your stage together with the one before and the one after.\u003cbr>2. Every objective has a code: \u003cstrong>stage + reporting code + number\u003c/strong> (for example 5Bs.01). Quote the code and read the full wording.\u003cbr>3. The framework has \u003cstrong>three categories of strand\u003c/strong>: skills (TWS), content (Biology, Chemistry, Physics, Earth and Space) and context (Science in Context). They are meant to be taught together.\u003cbr>4. \u003cstrong>Ideas build.\u003c/strong> The particle model, forces, circuits, plants and the Sun and Moon all start simply and return at a higher level. Trace them, and check prerequisites on day one.\u003cbr>5. Use the \u003cstrong>latest version (4.0, February 2026)\u003c/strong>, the schemes of work as help rather than a rule, and your school's guidance, HOD and the School Support Hub for the rest.\u003cbr>\u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"1. The framework is a \u003cstrong>map of Stages 1 to 6\u003c/strong>. Read your stage together with the one before and the one after.\u003cbr>2. Every objective has a code: \u003cstrong>stage + reporting code + number\u003c/strong> (for example 5Bs.01). Quote the code and read the full wording.\u003cbr>3. The framework has \u003cstrong>three categories of strand\u003c/strong>: skills (TWS), content (Biology, Chemistry, Physics, Earth and Space) and context (Science in Context). They are meant to be taught together.\u003cbr>4. \u003cstrong>Ideas build.\u003c/strong> The particle model, forces, circuits, plants and the Sun and Moon all start simply and return at a higher level. Trace them, and check prerequisites on day one.\u003cbr>5. Use the \u003cstrong>latest version (4.0, February 2026)\u003c/strong>, the schemes of work as help rather than a rule, and your school's guidance, HOD and the School Support Hub for the rest.\u003cbr>\u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"A Year 6 teacher wants to find out what her pupils should already know before she teaches 6Pe.01. Which codes are the best starting points?","ar":"A Year 6 teacher wants to find out what her pupils should already know before she teaches 6Pe.01. Which codes are the best starting points?"},"opts":[{"en":"2Pe.02, 2Pe.03, 4Pe.02 and 4Pe.03, plus the appendix symbols","ar":"2Pe.02, 2Pe.03, 4Pe.02 and 4Pe.03, plus the appendix symbols"},{"en":"3Pe.01, 3Pe.02, 5Pe.01 and 5Pe.02, plus the units in the appendix","ar":"3Pe.01, 3Pe.02, 5Pe.01 and 5Pe.02, plus the units in the appendix"},{"en":"1Pe.01, 3Pf.01, 5Pf.03 and 6Pf.01, plus the glossary definition of model","ar":"1Pe.01, 3Pf.01, 5Pf.03 and 6Pf.01, plus the glossary definition of model"},{"en":"4Pe.04, 5Ps.01, 5Ps.02 and 6Ps.01, plus the Science in Context statements","ar":"4Pe.04, 5Ps.01, 5Ps.02 and 6Ps.01, plus the Science in Context statements"}],"correct":0,"expl":{"en":"6Pe.01 asks pupils to use diagrams and symbols to represent, make and compare series and parallel circuits. The earlier circuit objectives are in Stages 2 and 4 (circuit components, series circuits, switches, and changing components). The magnet objectives in Stages 3 and 5 and the sound objectives are not about circuits.","ar":"6Pe.01 asks pupils to use diagrams and symbols to represent, make and compare series and parallel circuits. The earlier circuit objectives are in Stages 2 and 4 (circuit components, series circuits, switches, and changing components). The magnet objectives in Stages 3 and 5 and the sound objectives are not about circuits."}},{"id":"m9q2","q":{"en":"Which statement about Checkpoint-year assessment is stated in the framework?","ar":"Which statement about Checkpoint-year assessment is stated in the framework?"},"opts":[{"en":"Science in Context will be assessed directly in Checkpoint through a practical task","ar":"Science in Context will be assessed directly in Checkpoint through a practical task"},{"en":"6Bs.03 will not be assessed, but 6Bp.01 will be assessed in Stage 6 tests","ar":"6Bs.03 will not be assessed, but 6Bp.01 will be assessed in Stage 6 tests"},{"en":"Assessments are designed to complement the framework for Stages 1 to 6","ar":"Assessments are designed to complement the framework for Stages 1 to 6"},{"en":"Every Stage 6 objective will be assessed in Checkpoint, including 6Bs.03","ar":"Every Stage 6 objective will be assessed in Checkpoint, including 6Bs.03"}],"correct":1,"expl":{"en":"The framework states that 6Bs.03 will not be assessed and 6Bp.01 will be assessed. It says assessments complement the framework for Stages 3 to 6, and that Science in Context will not be directly assessed.","ar":"The framework states that 6Bs.03 will not be assessed and 6Bp.01 will be assessed. It says assessments complement the framework for Stages 3 to 6, and that Science in Context will not be directly assessed."}},{"id":"m9q3","q":{"en":"How does the framework glossary distinguish an investigation from an experiment?","ar":"How does the framework glossary distinguish an investigation from an experiment?"},"opts":[{"en":"An investigation is any practical task done in groups, and an experiment is done by the teacher","ar":"An investigation is any practical task done in groups, and an experiment is done by the teacher"},{"en":"An investigation is only a fair test, and an experiment is any observation over time","ar":"An investigation is only a fair test, and an experiment is any observation over time"},{"en":"An investigation starts from a question and often, but not always, involves experiments","ar":"An investigation starts from a question and often, but not always, involves experiments"},{"en":"An investigation must always use one experiment, and an experiment must always have a prediction","ar":"An investigation must always use one experiment, and an experiment must always have a prediction"}],"correct":2,"expl":{"en":"The glossary says that an experiment is a specific procedure to support, disprove or validate a prediction, and an investigation is a method of acquiring knowledge based on a starting question, often involving experiments but not always.","ar":"The glossary says that an experiment is a specific procedure to support, disprove or validate a prediction, and an investigation is a method of acquiring knowledge based on a starting question, often involving experiments but not always."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A new teacher asks how many hours of science a Stage 4 class should have each week. What is the best reply?","ar":"A new teacher asks how many hours of science a Stage 4 class should have each week. What is the best reply?"},"opts":[{"en":"The framework requires 2.5 hours a week for every stage, and schools may not change it","ar":"The framework requires 2.5 hours a week for every stage, and schools may not change it"},{"en":"The framework suggests 1.5 hours a week for Stages 3 and 4, and schools must follow it","ar":"The framework suggests 1.5 hours a week for Stages 3 and 4, and schools must follow it"},{"en":"The framework does not mention teaching time, so the school decides without any guidance","ar":"The framework does not mention teaching time, so the school decides without any guidance"},{"en":"It suggests 2 hours a week (60 hours a stage) as guidance, but actual hours may vary","ar":"It suggests 2 hours a week (60 hours a stage) as guidance, but actual hours may vary"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A parent asks why the school teaches science from Year 1 using a \"Cambridge framework\". Which reply is most accurate?","ar":"A parent asks why the school teaches science from Year 1 using a \"Cambridge framework\". Which reply is most accurate?"},"opts":[{"en":"It sets objectives for Stages 1 to 6, in strands that build curiosity, skills and knowledge","ar":"It sets objectives for Stages 1 to 6, in strands that build curiosity, skills and knowledge"},{"en":"It is a set of Checkpoint papers that Year 1 pupils practise in every science lesson all year","ar":"It is a set of Checkpoint papers that Year 1 pupils practise in every science lesson all year"},{"en":"It is a textbook series that every Cambridge school must use in the same fixed order","ar":"It is a textbook series that every Cambridge school must use in the same fixed order"},{"en":"It is the school's own policy for science practical work, safety and risk assessment","ar":"It is the school's own policy for science practical work, safety and risk assessment"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A colleague uses a scheme of work from 2021 and says it matches the framework perfectly. What should you suggest?","ar":"A colleague uses a scheme of work from 2021 and says it matches the framework perfectly. What should you suggest?"},"opts":[{"en":"Keep using it, because schemes of work are always updated automatically by the teacher guide","ar":"Keep using it, because schemes of work are always updated automatically by the teacher guide"},{"en":"Check it against version 4.0, because several objectives were reworded in later versions","ar":"Check it against version 4.0, because several objectives were reworded in later versions"},{"en":"Replace it with a textbook, because schemes of work are no longer allowed in Cambridge schools","ar":"Replace it with a textbook, because schemes of work are no longer allowed in Cambridge schools"},{"en":"Ignore version 4.0, because the changes section says that only the Checkpoint papers changed","ar":"Ignore version 4.0, because the changes section says that only the Checkpoint papers changed"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"In a Year 5 lesson, a group presents its results and then listens while another group disagrees and explains why. Which attribute is most clearly shown?","ar":"In a Year 5 lesson, a group presents its results and then listens while another group disagrees and explains why. Which attribute is most clearly shown?"},"opts":[{"en":"Responsible, because learners are sharing equipment fairly and clearing up safely after practical work","ar":"Responsible, because learners are sharing equipment fairly and clearing up safely after practical work"},{"en":"Innovative, because learners are adapting their skills to an unfamiliar challenge","ar":"Innovative, because learners are adapting their skills to an unfamiliar challenge"},{"en":"Confident, because learners present findings and defend conclusions while respecting others","ar":"Confident, because learners present findings and defend conclusions while respecting others"},{"en":"Engaged, because learners are making informed choices about the use of science in society","ar":"Engaged, because learners are making informed choices about the use of science in society"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"A teacher says, \"Science lessons are not for English practice; that is for the ESL teacher.\" Which framework aim does this ignore?","ar":"A teacher says, \"Science lessons are not for English practice; that is for the ESL teacher.\" Which framework aim does this ignore?"},"opts":[{"en":"The science aim that learners recognise that scientific understanding changes over time","ar":"The science aim that learners recognise that scientific understanding changes over time"},{"en":"The programme aim of understanding personal and local context and global awareness","ar":"The programme aim of understanding personal and local context and global awareness"},{"en":"The science aim that learners begin to understand that models are used to explain phenomena","ar":"The science aim that learners begin to understand that models are used to explain phenomena"},{"en":"The programme aim of effective and confident communication skills, including in English","ar":"The programme aim of effective and confident communication skills, including in English"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"At the end of an investigation, a Stage 6 teacher asks pupils: \"What would you change next time, and why?\" Which aim or attribute does this support best?","ar":"At the end of an investigation, a Stage 6 teacher asks pupils: \"What would you change next time, and why?\" Which aim or attribute does this support best?"},"opts":[{"en":"The Reflective attribute, which values the process of science as well as the products","ar":"The Reflective attribute, which values the process of science as well as the products"},{"en":"The Responsible attribute, which values the impact of science on others and the environment","ar":"The Responsible attribute, which values the impact of science on others and the environment"},{"en":"The aim that learners link science to real-world contexts that are personal, local and global","ar":"The aim that learners link science to real-world contexts that are personal, local and global"},{"en":"The aim that learners first meet foundational concepts that develop through the Pathway","ar":"The aim that learners first meet foundational concepts that develop through the Pathway"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"A colleague writes \"4ESs.02\" in a plan. What does it refer to?","ar":"A colleague writes \"4ESs.02\" in a plan. What does it refer to?"},"opts":[{"en":"The second Stage 4 objective in the Planet Earth sub-strand of Earth and Space (volcanoes)","ar":"The second Stage 4 objective in the Planet Earth sub-strand of Earth and Space (volcanoes)"},{"en":"Stage 4, Earth in space, objective 02: name the planets in the Solar System","ar":"Stage 4, Earth in space, objective 02: name the planets in the Solar System"},{"en":"The second Stage 2 objective in the Earth in space sub-strand, taught in Year 4","ar":"The second Stage 2 objective in the Earth in space sub-strand, taught in Year 4"},{"en":"The fourth objective in the Stage 2 Earth and Space strand about the Solar System","ar":"The fourth objective in the Stage 2 Earth and Space strand about the Solar System"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"Which of these codes is not a valid pattern in the framework?","ar":"Which of these codes is not a valid pattern in the framework?"},"opts":[{"en":"5ESc.01, which is the first Stage 5 objective in Cycles on Earth","ar":"5ESc.01, which is the first Stage 5 objective in Cycles on Earth"},{"en":"3SIC.04, which is the fourth Stage 3 Science in Context objective","ar":"3SIC.04, which is the fourth Stage 3 Science in Context objective"},{"en":"5ES.01B, because the sub-strand letter is missing and the order is wrong","ar":"5ES.01B, because the sub-strand letter is missing and the order is wrong"},{"en":"2TWSm.03, which is the third Stage 2 objective in Models and representations","ar":"2TWSm.03, which is the third Stage 2 objective in Models and representations"}],"correct":2},{"id":"e9","mod":3,"q":{"en":"A teacher says, \"Chemistry in Stage 6 should start with the particle model, as in every other stage.\" What does the stage page show?","ar":"A teacher says, \"Chemistry in Stage 6 should start with the particle model, as in every other stage.\" What does the stage page show?"},"opts":[{"en":"Stage 6 Chemistry begins with 6Cm.01 on the particle model, as it does in every other stage of the curriculum","ar":"Stage 6 Chemistry begins with 6Cm.01 on the particle model, as it does in every other stage of the curriculum"},{"en":"Stage 6 Chemistry has the particle model in 6Cc.01, and Stage 4 has no particle objectives at all in any sub-strand","ar":"Stage 6 Chemistry has the particle model in 6Cc.01, and Stage 4 has no particle objectives at all in any sub-strand"},{"en":"Stage 6 Chemistry has only Changes to materials objectives, and Stage 5 has none","ar":"Stage 6 Chemistry has only Changes to materials objectives, and Stage 5 has none"},{"en":"Stage 6 has no Materials and their structure objectives; the particle model is in Stages 4 and 5","ar":"Stage 6 has no Materials and their structure objectives; the particle model is in Stages 4 and 5"}],"correct":3},{"id":"e10","mod":4,"q":{"en":"A Year 3 teacher plans an investigation in which pupils sort a set of leaves into groups using their features. Which type of enquiry is this, according to 3TWSp.02?","ar":"A Year 3 teacher plans an investigation in which pupils sort a set of leaves into groups using their features. Which type of enquiry is this, according to 3TWSp.02?"},"opts":[{"en":"Identifying and classifying","ar":"Identifying and classifying"},{"en":"Fair testing using variables","ar":"Fair testing using variables"},{"en":"Pattern seeking in the results","ar":"Pattern seeking in the results"},{"en":"Observing the leaves over time","ar":"Observing the leaves over time"}],"correct":0},{"id":"e11","mod":4,"q":{"en":"Year 5 pupils plan a fair test of how the temperature of water affects how fast sugar dissolves. What must their plan show, according to 5TWSp.04?","ar":"Year 5 pupils plan a fair test of how the temperature of water affects how fast sugar dissolves. What must their plan show, according to 5TWSp.04?"},"opts":[{"en":"The five types of scientific enquiry and a reason for choosing one","ar":"The five types of scientific enquiry and a reason for choosing one"},{"en":"The independent, dependent and control variables","ar":"The independent, dependent and control variables"},{"en":"The standard units and the advantages of non-standard units","ar":"The standard units and the advantages of non-standard units"},{"en":"A scatter graph and a list of anomalous results","ar":"A scatter graph and a list of anomalous results"}],"correct":1},{"id":"e12","mod":4,"q":{"en":"A Stage 2 teacher links a lesson about the Sun in the sky to Science in Context. Which approach follows the framework?","ar":"A Stage 2 teacher links a lesson about the Sun in the sky to Science in Context. Which approach follows the framework?"},"opts":[{"en":"Use only national and regional news stories about the space programmes of other countries","ar":"Use only national and regional news stories about the space programmes of other countries"},{"en":"Use only broader contexts from other places in the country and region, not local ones","ar":"Use only broader contexts from other places in the country and region, not local ones"},{"en":"Use pupils' own experiences and surroundings, such as shadows on the playground","ar":"Use pupils' own experiences and surroundin     case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>
