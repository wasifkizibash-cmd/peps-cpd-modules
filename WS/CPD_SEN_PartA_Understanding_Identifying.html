<style>

  .prereq{display:inline-flex; align-items:center; gap:8px; background:var(--sen-soft); color:var(--sen); border:1px solid #d0c5e6; border-radius:20px; padding:7px 14px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;}
  .disclaimer{margin-top:14px; font-size:12.3px; color:var(--ink-soft); max-width:700px; border-left:3px solid var(--gold); padding:8px 12px; background:var(--gold-soft); border-radius:0 6px 6px 0;}

  nav.sidebar{position:sticky; top:20px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  .sb-head{padding:14px 16px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--line);}
  .sb-item{display:flex; align-items:flex-start; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer;}
  .sb-item:last-child{border-bottom:none;}
  .sb-item:hover{background:#F7F7F2;}
  .sb-mark{width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px; display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; border:1.5px solid var(--line); color:var(--ink-soft); background:#fff;}
  .sb-mark.passed{background:var(--teal); border-color:var(--teal); color:#fff;}
  .sb-mark.done{background:var(--sen); border-color:var(--sen); color:#fff;}
  .sb-item-title{font-weight:600; font-size:13.3px; color:var(--ink);}
  .sb-item-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  main.content{min-height:400px;}

  .module-head{background:var(--sen); color:#fff; border-radius:12px; padding:26px 28px; margin-bottom:24px; position:relative; overflow:hidden;}
  .module-head::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border:1px solid rgba(255,255,255,.14); border-radius:50%;}
  .module-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#dcd3ef; letter-spacing:.08em;}

  .indicator-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#cdd6ea; letter-spacing:.06em;}
  .indicator-head h3{font-family:'Source Serif 4',serif; font-size:20px; margin:4px 0 0; font-weight:700;}

  .concept{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px 26px; margin-bottom:20px; box-shadow:var(--shadow);}
  .concept-num{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--sen); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .concept h3{font-family:'Source Serif 4',serif; font-size:21px; margin:0 0 12px; color:var(--ink);}
  .concept p{color:#33405c; margin:0 0 10px; font-size:14.8px;}

  .check-block{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);}
  .check-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:8px;}
  .question{margin-bottom:16px;}
  .question:last-child{margin-bottom:0;}
  .q-text{font-weight:600; font-size:14.5px; margin-bottom:9px; color:var(--ink);}
  .opt{display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; margin-bottom:7px; cursor:pointer; font-size:14px; color:#33405c;}
  .opt:hover{border-color:#b8b6a4;}
  .opt.selected{border-color:var(--ink); background:#F7F7F2; box-shadow:inset 0 0 0 1px var(--ink);}
  .opt.correct{border-color:var(--teal); background:var(--teal-soft); color:var(--teal); font-weight:600;}
  .opt.incorrect{border-color:var(--red); background:var(--red-soft); color:var(--red); font-weight:600;}
  .opt.disabled{cursor:default;}
  .opt-bullet{width:16px;height:16px;border-radius:50%;border:1.5px solid #b8b6a4;flex:none;margin-top:1px;}
  .opt.selected .opt-bullet{border-color:var(--ink); background:var(--ink); box-shadow:inset 0 0 0 3px #fff;}
  .opt.correct .opt-bullet{border-color:var(--teal); background:var(--teal);}
  .opt.incorrect .opt-bullet{border-color:var(--red); background:var(--red);}

  .feedback.wrong{border-left-color:var(--red); color:#6e2a2a;}

  .evidence-box{background:var(--sen-soft); border:1px solid #d0c5e6; border-radius:10px; padding:20px 24px; margin:6px 0 22px;}
  .evidence-box h4{font-family:'Source Serif 4',serif; font-size:17px; margin:0 0 4px; color:var(--sen); display:flex; align-items:center; gap:8px;}
  .evidence-box p.sub{font-size:12.8px; color:#443a5c; margin:0 0 12px;}
  .evidence-box ul{margin:0; padding-left:20px;}
  .evidence-box li{font-size:13.6px; color:#372e4a; margin-bottom:6px;}

  .exam-cta{background:var(--gold-soft); border:1px solid #e6cf9e; border-radius:10px; padding:22px 26px; text-align:center; margin-top:8px;}
  .exam-cta.locked{background:#F1F1EA; border-color:var(--line);}
  .exam-cta h4{font-family:'Source Serif 4',serif; font-size:19px; margin:0 0 6px; color:var(--ink);}
  .exam-cta p{color:var(--ink-soft); font-size:13.8px; margin:0 0 14px;}
  button.btn{font-family:'Inter',sans-serif; font-weight:600; font-size:14px; background:var(--sen); color:#fff; border:none; border-radius:7px; padding:11px 22px; cursor:pointer;}
  button.btn:hover{background:#4a3d72;}
  button.btn:disabled{background:#c7c6bb; cursor:not-allowed;}
  button.btn.ghost{background:transparent; color:var(--sen); border:1.5px solid var(--sen);}
  button.btn.ghost:hover{background:#fff;}

  .exam-head{margin-bottom:16px;}
  .exam-head .eyebrow2{font-family:'IBM Plex Mono',monospace; color:var(--red); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;}
  .exam-head h2{font-family:'Source Serif 4',serif; font-size:24px; margin:6px 0 4px;}
  .exam-head p{color:var(--ink-soft); font-size:13.8px; margin:0;}
  .exam-progress{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin:10px 0 18px;}
  .submit-row{display:flex; justify-content:flex-end; margin-top:8px;}

  .results{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:34px 30px; text-align:center; box-shadow:var(--shadow);}
  .stamp{display:inline-block; border:3px double var(--teal); color:var(--teal); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:20px; padding:14px 26px; border-radius:10px; transform:rotate(-4deg); letter-spacing:.06em; margin-bottom:16px; animation:stampIn .35s ease-out;}
  .stamp.fail{border:2px solid var(--red); color:var(--red); border-style:solid;}
  @keyframes stampIn{ from{transform:rotate(-4deg) scale(1.6); opacity:0;} to{transform:rotate(-4deg) scale(1); opacity:1;} }
  .score-line{font-family:'Source Serif 4',serif; font-size:22px; margin:6px 0 4px;}
  .score-sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
  .review-list{text-align:left; max-width:660px; margin:0 auto 22px; border-top:1px solid var(--line); padding-top:16px;}
  .review-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.8px;}
  .review-item:last-child{border-bottom:none;}
  .review-tag{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--sen); flex:none; width:56px;}
  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  footer.foot{margin-top:36px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:#8b8f7f; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  a.reset-link{color:#8b8f7f; text-decoration:underline; cursor:pointer;}

  .final-banner{background:linear-gradient(135deg,#5B4B8A,#7A69AC); color:#fff; border-radius:12px; padding:30px 28px; text-align:center; margin-top:24px;}
  .final-banner h2{font-family:'Source Serif 4',serif; font-size:26px; margin:0 0 8px;}
  .final-banner p{color:#e9e3f4; font-size:14.5px; max-width:560px; margin:0 auto;}

  .name-gate{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:40px 34px; text-align:center; max-width:480px; margin:40px auto; box-shadow:var(--shadow); }
  .name-gate h4{ font-family:'Source Serif 4',serif; font-size:20px; margin:0 0 8px; color:var(--ink); }
  .name-gate p{ color:var(--ink-soft); font-size:13.8px; margin:0 0 18px; }
  .name-gate input{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:7px; font-family:'Inter',sans-serif; font-size:14.5px; margin-bottom:14px; box-sizing:border-box; }
  .name-gate input:focus{ outline:none; border-color:var(--sen); }
  .cert-wrap{ max-width:760px; margin:20px auto; }
  .cert-back{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); cursor:pointer; margin-bottom:16px; display:inline-block; text-decoration:underline; }
  .certificate{ background:#fff; border:2px solid var(--sen); border-radius:6px; padding:6px; }
  .certificate-inner{ border:1px solid var(--sen); padding:48px 50px; text-align:center; position:relative; }
  .cert-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--sen); margin-bottom:18px; }
  .cert-logo{ width:64px; height:64px; border-radius:50%; object-fit:cover; margin:0 auto 16px; display:block; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .cert-title{ font-family:'Source Serif 4',serif; font-weight:700; font-size:28px; color:var(--ink); margin:0 0 26px; }
  .cert-presented{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.04em; }
  .cert-name{ font-family:'Source Serif 4',serif; font-style:italic; font-size:32px; color:var(--sen); margin:6px 0 22px; border-bottom:1px solid var(--line); display:inline-block; padding:0 20px 10px; }
  .cert-body{ font-size:14.5px; color:#33405c; max-width:540px; margin:0 auto 26px; line-height:1.6; text-align:justify; }
  .cert-body b{ color:var(--ink); }
  .cert-meta-row{ display:flex; justify-content:center; gap:40px; margin:26px 0 30px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .cert-meta-row div strong{ display:block; color:var(--ink); font-size:13px; font-family:'Inter',sans-serif; margin-top:3px; }
  .cert-seal{ width:78px; height:78px; border-radius:50%; border:2px double var(--sen); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--sen); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:10.5px; text-align:center; line-height:1.3; }
  .cert-actions{ margin-top:26px; display:flex; gap:10px; justify-content:center; }

  @media print{
    body{ background:#fff; }
    .app > header.topbar, .layout > nav.sidebar, .cert-back, .cert-actions, footer.foot { display:none !important; }
    .app{ padding:0; max-width:none; }
    .layout{ display:block; }
    .certificate{ box-shadow:none; }
    .cert-wrap{ margin:0; max-width:none; }
  }
</style>

/* ---- Persistent storage polyfill: backs window.storage with real localStorage ----
   window.storage is a Claude-artifact-only API; this shim makes the same interface
   work on any real web host (Google Sites, Drive, etc.) using standard localStorage. */
if (!window.storage) {
  window.storage = {
    get: async function(key){
      try { var v = localStorage.getItem(key); return v === null ? null : { key: key, value: v }; }
      catch(e){ return null; }
    },
    set: async function(key, value){
      try { localStorage.setItem(key, value); return { key: key, value: value }; }
      catch(e){ return null; }
    },
    delete: async function(key){
      try { localStorage.removeItem(key); return { key: key, deleted: true }; }
      catch(e){ return null; }
    }
  };
}

   Audience: Teachers & Teaching Assistants / Learning Support

   Policy) and the UAE School Inspection Framework's standards on curriculum
   adaptation, differentiated teaching, and inclusion of Students of
   Determination (SoD).
   ========================================================================= */
const MODULE_TITLE = "Handling SEN Part A: Understanding & Identifying Students of Determination";
const EST_DURATION = "Fully self-paced \u2014 no fixed limit (typically about 3 hours to work through thoroughly)";

const GROUPS = [
  {
    code: "1", title: "UAE Inclusive Education: Context & Terminology",
    intro: "Before looking at specific needs, it helps to understand the framework this school works within, and the language the UAE uses to talk about additional educational needs. Getting the terminology and the school's duty right is the foundation everything else in this module builds on.",
    concepts: [
      {
        title: "What 'Students of Determination' Means \u2014 and Why the Term Matters",
        body: [
          "The UAE uses the term \u2018Students of Determination\u2019 (SoD) rather than labels like \u2018special needs\u2019 or \u2018disabled\u2019. It reflects a national policy choice \u2014 under the leadership of the UAE\u2019s Higher Committee on the Rights of People of Determination \u2014 to describe a person\u2019s strength and perseverance rather than a deficit.",
          "A Student of Determination is any student who needs additional or different educational provision because they experience significantly greater difficulty in learning than most students their age, or because a disability or recognised disorder affects their access to the standard curriculum or facilities.",
          "The term is deliberately broad. It includes students with a formal diagnosis and students who show clear, sustained difficulty without (yet) having one \u2014 both groups are entitled to the school noticing, recording, and acting on their needs."
        ],
        checks: [
          { q: "A student shows sustained, significant difficulty accessing lessons, but has no formal diagnosis yet. Are they a Student of Determination under UAE policy?", options: ["No \u2014 only students with a confirmed diagnosis count", "Yes \u2014 significant, sustained difficulty is enough on its own to warrant identification and support", "Only if a parent requests it", "Only if the difficulty affects behaviour, not learning"], correct: 1, explain: "UAE policy defines a Student of Determination by the level of difficulty they experience, not by whether a diagnosis exists yet. Formal diagnosis can follow identification \u2014 it isn't a precondition for support." },
          { q: "Why does the UAE use the term 'Students of Determination' rather than 'special needs'?", options: ["It is simply a translation convention with no policy significance", "It reflects a deliberate national policy choice to frame the person by strength and perseverance rather than deficit", "It only applies to students with physical disabilities", "It is used interchangeably and has no defined meaning"], correct: 1, explain: "The terminology is a deliberate framing choice tied to the UAE\u2019s National Policy for Empowering People of Determination \u2014 it carries real policy weight, not just style." }
        ]
      },
      {
        title: "The School's Duty Under UAE Inclusive Education Policy",
        body: [
          "Ministerial Resolution No. 647 of 2020 on the Policy of Inclusive Education directs schools to adapt themselves to the needs of Students of Determination, rather than expecting the student to fit an unchanged system. Inclusion is framed as a gradual shift in school culture and everyday practice, not a one-off project.",
          "In practice this means every teacher and teaching assistant has a role \u2014 not just the SEN/Inclusion team. Identification, reasonable classroom adjustments, and day-to-day support are shared responsibilities across the staff a student meets.",
          "School inspections (aligned to the UAE School Inspection Framework) look specifically at how well a school identifies, provides for, and includes Students of Determination \u2014 it is one of the most closely scrutinised areas of provision, not a peripheral add-on."
        ],
        checks: [
          { q: "Under UAE inclusive education policy, whose responsibility is it to identify and support a Student of Determination in a mainstream classroom?", options: ["Only the SEN/Inclusion team", "Only the class teacher", "Every teacher and teaching assistant who works with the student, alongside the SEN/Inclusion team", "Only the parents, since they know their child best"], correct: 2, explain: "Inclusion is framed as a shared, whole-staff responsibility. The SEN/Inclusion team coordinates and advises, but day-to-day identification and support sit with every adult working with the student." },
          { q: "What does Ministerial Resolution No. 647 of 2020 primarily direct schools to do?", options: ["Refer all Students of Determination to specialist schools", "Adapt the school itself to meet the needs of Students of Determination, rather than expecting students to fit an unchanged system", "Limit inclusive education to a designated resource room", "Focus inclusion efforts solely on physical accessibility"], correct: 1, explain: "The policy\u2019s central principle is that schools adapt to students, embedding inclusion into everyday culture and practice \u2014 not a narrow or purely physical accommodation." }
        ]
      }
    ],
    evidence: [
      "School's Inclusive Education Policy document, referencing Ministerial Resolution 647/2020",
      "Whole-staff induction/training records on Students of Determination terminology and duties",
      "SEN/Inclusion team structure chart showing roles and escalation routes"
    ]
  },
  {
    code: "2", title: "The Range of Special Educational Needs",
    intro: "ADHD, Dyslexia and Autism are the three needs most present in your student population right now \u2014 but they sit within a much wider picture. Understanding that wider picture helps you recognise a need you haven't been specifically trained to spot, and understand why two students with the same diagnosis can look very different in your classroom.",
    concepts: [
      {
        title: "Four Broad Areas of Need",
        body: [
          "Schools commonly group special educational needs into four broad areas: Communication & Interaction (e.g. autism, speech and language needs); Cognition & Learning (e.g. dyslexia, dyscalculia, general learning difficulties); Social, Emotional & Mental Health (e.g. anxiety, ADHD-related self-regulation difficulties); and Sensory & Physical (e.g. hearing or visual impairment, physical disabilities).",
          "These categories are a practical starting point, not rigid boxes. A single student's profile often draws on more than one area at once \u2014 a student with autism may also have sensory needs and anxiety, for example.",
          "Knowing these four areas helps you ask the right question when something doesn't add up: not 'what's wrong with this student', but 'which area of need might explain what I'm seeing, and who should I talk to about it'."
        ],
        checks: [
          { q: "What is the main practical value of the four broad areas of need (Communication & Interaction, Cognition & Learning, Social/Emotional/Mental Health, Sensory & Physical)?", options: ["They are strict categories \u2014 every student fits exactly one", "They give a starting framework to help identify which area of need might explain a difficulty you're observing", "They replace the need for a formal diagnosis", "They only apply to primary-age students"], correct: 1, explain: "The four areas are a practical thinking tool for staff, not a rigid classification system \u2014 many students' needs span more than one area." },
          { q: "A student with autism also shows strong anxiety and sensitivity to loud noises. What does this illustrate?", options: ["The student has been misdiagnosed", "A student's needs can span more than one broad area at once", "Anxiety and sensory sensitivity are unrelated to autism", "This is unusual and should be treated as a separate, additional diagnosis every time"], correct: 1, explain: "Overlapping needs across categories are common and expected \u2014 it's a reason to look at the whole student, not a sign something is wrong with the categorisation." }
        ]

    concepts: [
      {
        title: "What ADHD Is (and Isn't)",
        body: [

  { tag: "ASD", q: "A highly verbal, academically strong student is diagnosed with autism. Is this consistent with what autism actually is?", options: ["No, this must be a misdiagnosis", "Yes \u2014 autism affects social communication style and sensory processing, not general intelligence or vocabulary", "Only if the student also has a separate learning difficulty", "Autism can never be diagnosed in verbally strong students"], correct: 1, explain: "Verbal ability and academic strength are fully compatible with autism \u2014 this myth is a common reason autistic students are missed." },
  { tag: "6", q: "What is the most useful way for a teacher to document a possible SEN concern?", options: ["A diagnostic statement like 'this student has ADHD'", "A specific, dated, factual and comparative observation of what was seen, how often, and in what context", "A general comment that the student is 'difficult'", "No documentation is needed if the concern feels obvious"], correct: 1, explain: "Specific, factual, comparative records are what the identification process actually needs \u2014 not a diagnosis or a vague complaint." },
  { tag: "6", q: "Does a formal external diagnosis have to exist before a school can provide support?", options: ["Yes, always", "No \u2014 schools can and often do provide school-based support, recorded on a Provision Map or IEP, before or without formal diagnosis", "Only for sensory/physical needs", "Only if the family requests it in writing"], correct: 1, explain: "Waiting for diagnosis before acting would leave many students unsupported for a long time \u2014 school-based provision can start as soon as need is evident." },
  { tag: "6", q: "What is the primary purpose of a Provision Map or IEP?", options: ["A static record used only for inspection", "A working document, known to and used by relevant staff, that sets out a student's targets, adjustments and review date", "A confidential document only the SEN Coordinator may access", "A document that never needs to be reviewed once written"], correct: 1, explain: "An effective IEP/Provision Map is a living tool that actively informs day-to-day teaching, not a filed-away formality." },
  { tag: "6", q: "What is the most effective way to open a conversation with a family about a possible SEN concern?", options: ["Lead with a suspected diagnosis and insist on immediate assessment", "A genuine, respectful, factual partnership focused on how the school can help the child access learning", "Avoid the conversation and hope the family raises it first", "A formal letter only, with no direct conversation"], correct: 1, explain: "A collaborative, solution-focused approach builds trust; leading with a diagnosis or avoiding the topic both tend to produce worse outcomes." }
];

const PASS_THRESHOLD = 0.8;

/* =========================================================================
   STATE
   ========================================================================= */
let progress = null;
let currentView = "concepts"; // 'concepts' | 'exam' | 'results' | 'certificate'
let examAnswers = {};
let lastResult = null;
let storageReady = false;
let wrongAttempts = {}; // transient, per-question: last incorrect pick, NOT persisted -- lets a student retry until correct
const STORAGE_KEY = "cpd-sen-parta-progress";

function defaultProgress(){
  return { checks:{}, examAttempts:0, examBest:0, examPassed:false, certName:"" };
}

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    progress = (res && res.value) ? Object.assign(defaultProgress(), JSON.parse(res.value)) : defaultProgress();
  }catch(e){
    progress = defaultProgress();
  }
  storageReady = true;
  render();
}
async function saveProgress(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function checksTotal(){
  let n = 0;
  GROUPS.forEach(g => g.concepts.forEach(c => n += c.checks.length));
  return n;
}
function checksAnswered(){
  let n = 0;
  GROUPS.forEach((g, gi) => g.concepts.forEach((c, ci) => c.checks.forEach((chk, qi) => {
    if(progress.checks[gi+"_"+ci+"_"+qi] !== undefined) n++;
  })));
  return n;
}
function allChecksDone(){ return checksAnswered() === checksTotal(); }

/* =========================================================================
   ACTIONS
   ========================================================================= */
function answerCheck(gi, ci, qi, optIdx){
  const key = gi+"_"+ci+"_"+qi;
  if(progress.checks[key] !== undefined) return; // already answered correctly and locked in
  const chk = GROUPS[gi].concepts[ci].checks[qi];
  if(optIdx === chk.correct){
    progress.checks[key] = optIdx;
    delete wrongAttempts[key];
    saveProgress();
  } else {
    wrongAttempts[key] = optIdx; // remember the wrong pick just long enough to show feedback; question stays open for retry
  }
  render();
}
function startExam(){
  examAnswers = {};
  currentView = "exam";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function selectExamAnswer(qi, optIdx){
  examAnswers[qi] = optIdx;
  render();
}
function submitExam(){
  const total = EXAM.length;
  let correct = 0;
  const review = [];
  EXAM.forEach((q, qi) => {
    const chosen = examAnswers[qi];
    const isRight = chosen === q.correct;
    if(isRight) correct++;
    else review.push({tag:q.tag, q:q.q, explain:q.explain, correctText:q.options[q.correct]});
  });
  const pct = Math.round((correct/total)*100);
  const passed = (correct/total) >= PASS_THRESHOLD;
  progress.examAttempts += 1;
  progress.examBest = Math.max(progress.examBest, pct);
  if(passed) progress.examPassed = true;
  saveProgress();
  lastResult = {correct, total, pct, passed, review};
  currentView = "results";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function retakeExam(){ startExam(); }
function backToConcepts(){ currentView = "concepts"; render(); window.scrollTo({top:0, behavior:"smooth"}); }
async function resetProgress(){
  if(!confirm("Reset your progress on this module? This cannot be undone.")) return;
  progress = defaultProgress();
  currentView = "concepts";
  try{ await window.storage.delete(STORAGE_KEY); }catch(e){}
  saveProgress();
  render();
}
function scrollToConcept(gi, ci){
  currentView = "concepts";
  render();
  setTimeout(() => {
    const el = document.getElementById("concept-"+gi+"-"+ci);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 30);
}
function openCertificate(){
  currentView = "certificate";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function submitCertName(){
  const input = document.getElementById("cert-name-input");
  const val = input ? input.value.trim() : "";
  if(!val) return;
  progress.certName = val;
  saveProgress();
  render();
}
function editCertName(){
  progress.certName = "";
  render();
}
function backFromCertificate(){
  currentView = "concepts";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function printCertificate(){
  window.print();
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const app = document.getElementById("app");
  if(!storageReady){
    app.innerHTML = '<div style="padding:80px 0; text-align:center; color:#8b8f7f; font-family:IBM Plex Mono, monospace;">Loading your progress\u2026</div>';
    return;
  }
  if(currentView === "certificate"){
    app.innerHTML = renderCertificateFlow();
    return;
  }
  app.innerHTML = renderHeader() + '<div class="layout"><nav class="sidebar">'+renderSidebar()+'</nav><main class="content">'+renderMain()+'</main></div>' + renderFooter();
}

function renderHeader(){
  return '<header class="topbar">'+
    '<div class="eyebrow">Teaching & Learning Support CPD \u00b7 Handling SEN \u00b7 Part A</div>'+
    '<h1 class="programme-title">'+MODULE_TITLE+'</h1>'+
    '<p class="programme-sub">A self-paced professional development module for teachers and teaching assistants/learning support staff, covering how to understand, recognise, and correctly identify Students of Determination \u2014 with a deep focus on ADHD, Dyslexia and Autism, the three needs most present in our current student population. Part B builds on this with practical teaching and classroom support strategies.</p>'+
    '<div class="prereq">Covers: SEN overview \u00b7 ADHD \u00b7 Dyslexia \u00b7 Autism \u00b7 Identification & referral &nbsp;|&nbsp; '+EST_DURATION+'</div>'+
    '<div class="disclaimer">Content is aligned to the UAE Ministry of Education Inclusive Education Policy (Ministerial Resolution No. 647 of 2020) and the UAE School Inspection Framework\u2019s standards on curriculum adaptation, differentiated teaching, and the inclusion of Students of Determination. This module supports understanding and identification only \u2014 it does not replace a professional diagnostic assessment. Always follow your school\u2019s current SEN/Inclusion policy and refer any concern through the official pathway.</div>'+
    '</header>';
}

function renderSidebar(){
  let html = '<div class="sb-head">This Module</div>';
  GROUPS.forEach((g, gi) => {
    g.concepts.forEach((c, ci) => {
      const done = c.checks.every((chk, qi) => progress.checks[gi+"_"+ci+"_"+qi] !== undefined);
      html += '<div class="sb-item" onclick="scrollToConcept('+gi+','+ci+')">'+
        '<div class="sb-mark'+(done?" done":"")+'">'+(done?"\u2713":(ci+1))+'</div>'+
        '<div><div class="sb-item-title">'+c.title+'</div><div class="sb-item-meta">'+g.code+'</div></div>'+
        '</div>';
    });
  });
  const examDone = progress.examPassed;
  html += '<div class="sb-item" onclick="'+(allChecksDone()?"startExam()":"")+'">'+
    '<div class="sb-mark'+(examDone?" passed":"")+'">'+(examDone?"\u2713":"E")+'</div>'+
    '<div><div class="sb-item-title">Module Exam</div><div class="sb-item-meta">'+(examDone?"Passed \u00b7 "+progress.examBest+"%":(allChecksDone()?"Ready":"Locked"))+'</div></div>'+
    '</div>';
  return html;
}

function renderMain(){
  if(currentView === "exam") return renderExam();
  if(currentView === "results") return renderResults();
  return renderConcepts();
}

function renderModuleHead(){
  return '<div class="module-head"><div class="code">SELF-PACED CPD \u00b7 '+EST_DURATION+'</div><h2>'+MODULE_TITLE+'</h2><p>Work through all six sections below, then pass the module exam (80%+) to complete Part A and generate your certificate. Part B builds on this with practical teaching and support strategies.</p></div>';
}

function renderConcepts(){
  let html = renderModuleHead();
  GROUPS.forEach((g, gi) => {
    html += '<div class="indicator-head"><div class="code">Section '+g.code+'</div><h3>'+g.title+'</h3></div>';
    html += '<p style="color:#4a5670; font-size:14.3px; max-width:760px; margin:0 0 16px;">'+g.intro+'</p>';
    g.concepts.forEach((c, ci) => {
      html += '<div class="concept" id="concept-'+gi+'-'+ci+'">';
      html += '<div class="concept-num">'+g.code+' \u00b7 Topic '+(ci+1)+' of '+g.concepts.length+'</div>';
      html += '<h3>'+c.title+'</h3>';
      c.body.forEach(p => html += '<p>'+p+'</p>');
      html += '<div class="check-block"><div class="check-label">Check your understanding</div>';
      c.checks.forEach((chk, qi) => html += renderCheckQuestion(gi, ci, qi, chk));
      html += '</div></div>';
    });
    html += '<div class="evidence-box"><h4>\ud83d\udcc1 Evidence to Prepare for Inspection \u2014 '+g.code+'</h4>'+
      '<p class="sub">Documents and records you should be able to produce, up to date, if asked during an inspection visit.</p>'+
      '<ul>'+g.evidence.map(e=>'<li>'+e+'</li>').join("")+'</ul></div>';
  });

  const ready = allChecksDone();
  html += '<div class="exam-cta'+(ready?"":" locked")+'">';
  if(progress.examPassed){
    html += '<h4>Module exam passed \u2014 '+progress.examBest+'%</h4><p>You can retake it any time to improve your score.</p>';
    html += '<div class="btn-row"><button class="btn ghost" onclick="startExam()">Retake exam</button><button class="btn" onclick="openCertificate()">Get Certificate</button></div>';
  } else if(ready){
    html += '<h4>Ready for the Module Exam</h4><p>You\u2019ve worked through all '+GROUPS.reduce((a,g)=>a+g.concepts.length,0)+' topics. Score 80% or higher to complete this module.'+(progress.examAttempts>0?' Previous best: '+progress.examBest+'%.':'')+'</p>';
    html += '<button class="btn" onclick="startExam()">'+(progress.examAttempts>0?"Retake Exam":"Start Module Exam")+'</button>';
  } else {
    html += '<h4>Module Exam locked</h4><p>Answer every check-your-understanding question above ('+checksAnswered()+' of '+checksTotal()+' done) to unlock the exam.</p>';
  }
  html += '</div>';

  if(progress.examPassed){
    html += '<div class="final-banner"><h2>Part A complete</h2><p>You\u2019ve built a solid foundation in recognising and identifying Students of Determination, with a deep focus on ADHD, Dyslexia and Autism. Part B will take you into practical teaching and classroom support strategies.</p></div>';
  }
  return html;
}

function renderCheckQuestion(gi, ci, qi, chk){
  const key = gi+"_"+ci+"_"+qi;
  const locked = progress.checks[key];
  const wrongPick = wrongAttempts[key];
  let html = '<div class="question"><div class="q-text">'+chk.q+'</div>';
  chk.options.forEach((opt, oi) => {
    let cls = "opt";
    let onclick;
    if(locked !== undefined){
      cls += " disabled";
      if(oi === chk.correct) cls += " correct";
      onclick = "";
    } else {
      onclick = "answerCheck("+gi+","+ci+","+qi+","+oi+")";
      if(wrongPick === oi) cls += " incorrect";
    }
    html += '<div class="'+cls+'" onclick="'+onclick+'"><div class="opt-bullet"></div><div>'+opt+'</div></div>';
  });
  if(locked !== undefined){
    html += '<div class="feedback right">Correct. '+chk.explain+'</div>';
  } else if(wrongPick !== undefined){
    html += '<div class="feedback wrong">Not quite. Choose another option to try again.</div>';
  }
  html += '</div>';
  return html;
}

function renderExam(){
  let html = '<div class="exam-head"><div class="eyebrow2">Module Exam</div><h2>'+MODULE_TITLE+'</h2><p>Answer all '+EXAM.length+' questions, then submit. You need '+Math.round(PASS_THRESHOLD*100)+'%+ to pass. Retake as many times as you need.</p></div>';
  const answeredCount = Object.keys(examAnswers).length;
  html += '<div class="exam-progress">'+answeredCount+' of '+EXAM.length+' answered</div>';
  html += '<div class="concept">';
  EXAM.forEach((q, qi) => {
    html += '<div class="question"><div class="q-text">'+(qi+1)+'. '+q.q+' <span style="color:#5B4B8A;font-family:IBM Plex Mono,monospace;font-size:11px;">['+q.tag+']</span></div>';
    q.options.forEach((opt, oi) => {
      const sel = examAnswers[qi] === oi;
      html += '<div class="opt'+(sel?" selected":"")+'" onclick="selectExamAnswer('+qi+','+oi+')"><div class="opt-bullet"></div><div>'+opt+'</div></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  const allAnswered = answeredCount === EXAM.length;
  html += '<div class="submit-row"><button class="btn" '+(allAnswered?'':'disabled')+' onclick="submitExam()">Submit Exam</button></div>';
  return html;
}

function renderResults(){
  const r = lastResult;
  let html = '<div class="results">';
  html += '<div class="stamp'+(r.passed?"":" fail")+'">'+(r.passed?"COMPLETED \u2713":"NOT YET \u2014 RETRY")+'</div>';
  html += '<div class="score-line">'+r.correct+' / '+r.total+' correct ('+r.pct+'%)</div>';
  html += '<div class="score-sub">'+(r.passed?"You\u2019ve passed the "+MODULE_TITLE+" exam.":"You need "+Math.round(PASS_THRESHOLD*100)+"%+ to pass. Review the explanations below, then retake when ready.")+'</div>';
  if(r.review.length){
    html += '<div class="review-list">';
    r.review.forEach(item => {
      html += '<div class="review-item"><div class="review-tag">'+item.tag+'</div><div><strong>'+item.q+'</strong><br>Correct answer: '+item.correctText+'. '+item.explain+'</div></div>';
    });
    html += '</div>';
  }
  html += '<div class="btn-row">';
  html += '<button class="btn ghost" onclick="backToConcepts()">Back to module</button>';
  if(!r.passed){
    html += '<button class="btn" onclick="retakeExam()">Retake Exam</button>';
  } else {
    html += '<button class="btn" onclick="openCertificate()">Get Certificate</button>';
  }
  html += '</div></div>';
  return html;
}

function renderCertificateFlow(){
  if(!progress.certName){
    return '<div class="name-gate">'+
      '<h4>One quick step</h4>'+
      '<p>Enter the name to print on the certificate.</p>'+
      '<input id="cert-name-input" type="text" placeholder="Full name" autofocus>'+
      '<div class="btn-row"><button class="btn ghost" onclick="backFromCertificate()">Cancel</button><button class="btn" onclick="submitCertName()">Continue</button></div>'+
      '</div>';
  }
  return renderCertificate();
}

function renderCertificate(){
  const dateStr = new Date().toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
  return '<div class="cert-wrap">'+
    '<a class="cert-back" onclick="backFromCertificate()">\u2190 Back to module</a>'+
    '<div class="certificate"><div class="certificate-inner">'+
      '<img class="cert-logo" src="https://wasifkizibash-cmd.github.io/peps-cpd-modules/EX/RoundLogo.png" alt="Providence English School logo">'+
      '<div class="cert-eyebrow">Teaching & Learning Support CPD \u00b7 Handling SEN \u00b7 Part A</div>'+
      '<div class="cert-seal">COMPLETED<br>\u2713</div>'+
      '<div class="cert-title">Certificate of Completion</div>'+
      '<div class="cert-presented">This certifies that</div>'+
      '<div class="cert-name">'+escapeHtml(progress.certName)+'</div>'+
      '<div class="cert-body">has successfully completed <b>Handling SEN Part A: Understanding & Identifying Students of Determination</b>, covering the UAE inclusive education framework, the range of special educational needs, and the understanding and identification of ADHD, Dyslexia and Autism, in alignment with the UAE Ministry of Education-referenced school inspection framework.</div>'+
      '<div class="cert-meta-row">'+
        '<div>Score<strong>'+progress.examBest+'%</strong></div>'+
        '<div>Date<strong>'+dateStr+'</strong></div>'+
      '</div>'+
    '</div></div>'+
    '<div class="cert-actions"><button class="btn" onclick="printCertificate()">Print / Save as PDF</button></div>'+
    '</div>';
}

function renderFooter(){
  return '<footer class="foot"><span>Progress saves automatically as you go.</span><a class="reset-link" onclick="resetProgress()">Reset my progress</a></footer>';
}

loadProgress();
</script>
</body>
</html>
