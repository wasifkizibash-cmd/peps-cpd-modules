volved, and what would you check?\u003c/strong> A good answer: 9Pe.04 (diagrams and symbols, including resistors and voltmeters) and 9Pe.02 (measure current and voltage). The learner must use the standard symbols from the Appendix. A learner who finds this hard may need to revisit 7Pe.05, which uses cells, switches, lamps, buzzers and ammeters, before moving to resistors and voltmeters."}}],"checks":[{"id":"m7q1","q":{"en":"In which stage do the Light and sound objectives cover reflection, refraction and the colours of light?","ar":"In which stage do the Light and sound objectives cover reflection, refraction and the colours of light?"},"opts":[{"en":"Stage 7, where light and sound are introduced together in the same objectives, before Stage 8 extends them","ar":"Stage 7, where light and sound are introduced together in the same objectives, before Stage 8 extends them"},{"en":"Stage 9, where light is extended to waveforms and the cancellation of waves","ar":"Stage 9, where light is extended to waveforms and the cancellation of waves"},{"en":"Stage 8, where all four Light and sound objectives are about light","ar":"Stage 8, where all four Light and sound objectives are about light"},{"en":"Stage 7 and Stage 9, because light is not covered in Stage 8 at all","ar":"Stage 7 and Stage 9, because light is not covered in Stage 8 at all"}],"correct":2,"expl":{"en":"Stage 8 Light and sound (8Ps.01 to 8Ps.04) is about reflection, refraction, the spectrum and colours of light. Stages 7 and 9 cover sound.","ar":"Stage 8 Light and sound (8Ps.01 to 8Ps.04) is about reflection, refraction, the spectrum and colours of light. Stages 7 and 9 cover sound."}},{"id":"m7q2","q":{"en":"What is the meaning of \"qualitative only\" in 8Pf.06?","ar":"What is the meaning of \"qualitative only\" in 8Pf.06?"},"opts":[{"en":"Learners calculate pressure in gases and liquids using the formula p = F / A","ar":"Learners calculate pressure in gases and liquids using the formula p = F / A"},{"en":"Learners measure the pressure in gases and liquids with a pressure gauge during practical work","ar":"Learners measure the pressure in gases and liquids with a pressure gauge during practical work"},{"en":"Learners compare pressure in gases and liquids only with solids that do not flow","ar":"Learners compare pressure in gases and liquids only with solids that do not flow"},{"en":"Learners explain pressure in gases and liquids using particle theory, without calculations","ar":"Learners explain pressure in gases and liquids using particle theory, without calculations"}],"correct":3,"expl":{"en":"Qualitative means explanation without calculation. 8Pf.05 is the objective with pressure = force / area.","ar":"Qualitative means explanation without calculation. 8Pf.05 is the objective with pressure = force / area."}},{"id":"m7q3","q":{"en":"Which objective would you plan for a lesson on calculating resistance from voltage and current?","ar":"Which objective would you plan for a lesson on calculating resistance from voltage and current?"},"opts":[{"en":"9Pe.03, in Stage 9, which gives resistance = voltage / current","ar":"9Pe.03, in Stage 9, which gives resistance = voltage / current"},{"en":"8Pf.01, in Stage 8, which gives speed = distance / time","ar":"8Pf.01, in Stage 8, which gives speed = distance / time"},{"en":"7Pe.03, in Stage 7, which covers measuring current in series circuits","ar":"7Pe.03, in Stage 7, which covers measuring current in series circuits"},{"en":"8Pe.03, in Stage 8, which covers the strength of an electromagnet","ar":"8Pe.03, in Stage 8, which covers the strength of an electromagnet"}],"correct":0,"expl":{"en":"9Pe.03 says calculate resistance (resistance = voltage / current) and describe how resistance affects current.","ar":"9Pe.03 says calculate resistance (resistance = voltage / current) and describe how resistance affects current."}}]},{"id":"m8","title":{"en":"Earth and Space across Stages 7 to 9","ar":"Earth and Space across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Earth and Space is the fourth content strand. The framework says it \"covers the study of the planet Earth, the wider Solar System and beyond\". Learners develop understanding about how the Earth's structure is linked to natural phenomena, including how the atmosphere and climate are linked, and they study the universe outside the Earth. The three sub-strands are \u003cstrong>Planet Earth (ESp)\u003c/strong>, \u003cstrong>Cycles on Earth (ESc)\u003c/strong> and \u003cstrong>Earth in space (ESs)\u003c/strong>.","ar":"Earth and Space is the fourth content strand. The framework says it \"covers the study of the planet Earth, the wider Solar System and beyond\". Learners develop understanding about how the Earth's structure is linked to natural phenomena, including how the atmosphere and climate are linked, and they study the universe outside the Earth. The three sub-strands are \u003cstrong>Planet Earth (ESp)\u003c/strong>, \u003cstrong>Cycles on Earth (ESc)\u003c/strong> and \u003cstrong>Earth in space (ESs)\u003c/strong>."}},{"t":"table","head":{"en":["Sub-strand","Stage 7 (8 objectives in all)","Stage 8 (7)","Stage 9 (7)"],"ar":["Sub-strand","Stage 7 (8 objectives in all)","Stage 8 (7)","Stage 9 (7)"]},"rows":[{"en":["Planet Earth (ESp)","Plate tectonics; earthquakes, volcanoes and fold mountains; composition of clean, dry air (3)","Earth's magnetic field; renewable and non-renewable resources (2)","Convection currents and tectonic plates; evidence for tectonic plates (2)"],"ar":["Planet Earth (ESp)","Plate tectonics; earthquakes, volcanoes and fold mountains; composition of clean, dry air (3)","Earth's magnetic field; renewable and non-renewable resources (2)","Convection currents and tectonic plates; evidence for tectonic plates (2)"]},{"en":["Cycles on Earth (ESc)","The water cycle (1)","Climate cycles and ice ages; atmospheric change; climate and weather (3)","The carbon cycle; impacts of climate change (2)"],"ar":["Cycles on Earth (ESc)","The water cycle (1)","Climate cycles and ice ages; atmospheric change; climate and weather (3)","The carbon cycle; impacts of climate change (2)"]},{"en":["Earth in space (ESs)","Planet formation; gravity in the Solar System; tidal forces; eclipses (4)","Galaxies; asteroids (2)","Asteroid collisions; the collision theory for the Moon; nebulae and stellar nurseries (3)"],"ar":["Earth in space (ESs)","Planet formation; gravity in the Solar System; tidal forces; eclipses (4)","Galaxies; asteroids (2)","Asteroid collisions; the collision theory for the Moon; nebulae and stellar nurseries (3)"]}]},{"t":"h","c":{"en":"Stage 7: structure of the Earth, air, water and the Solar System","ar":"Stage 7: structure of the Earth, air, water and the Solar System"}},{"t":"p","c":{"en":"\u003cstrong>7ESp.01\u003c/strong> describes the model of plate tectonics, in which a solid outer layer, made of the crust and uppermost mantle, moves because of flow lower in the mantle. \u003cstrong>7ESp.02\u003c/strong> describes how earthquakes, volcanoes and fold mountains occur near plate boundaries. \u003cstrong>7ESp.03\u003c/strong> says clean, dry air contains 78% nitrogen, 21% oxygen and small amounts of carbon dioxide and other gases, and that this can change because of pollution and natural emissions. \u003cstrong>7ESc.01\u003c/strong> describes the water cycle, limited to evaporation, condensation, precipitation, water run-off, open water and groundwater. In Earth in space, learners describe how planets form from dust and gas pulled together by gravity (7ESs.01), know that gravity holds the Solar System in orbit around the Sun (7ESs.02), describe tidal forces (7ESs.03) and explain solar and lunar eclipses (7ESs.04).","ar":"\u003cstrong>7ESp.01\u003c/strong> describes the model of plate tectonics, in which a solid outer layer, made of the crust and uppermost mantle, moves because of flow lower in the mantle. \u003cstrong>7ESp.02\u003c/strong> describes how earthquakes, volcanoes and fold mountains occur near plate boundaries. \u003cstrong>7ESp.03\u003c/strong> says clean, dry air contains 78% nitrogen, 21% oxygen and small amounts of carbon dioxide and other gases, and that this can change because of pollution and natural emissions. \u003cstrong>7ESc.01\u003c/strong> describes the water cycle, limited to evaporation, condensation, precipitation, water run-off, open water and groundwater. In Earth in space, learners describe how planets form from dust and gas pulled together by gravity (7ESs.01), know that gravity holds the Solar System in orbit around the Sun (7ESs.02), describe tidal forces (7ESs.03) and explain solar and lunar eclipses (7ESs.04)."}},{"t":"p","c":{"en":"Notice the word \u003cem>model\u003c/em> in 7ESp.01. Plate tectonics is introduced as a model, which links directly to the TWS objective 7TWSm.01, describing the strengths and limitations of a model. This is a good example of one lesson covering a content objective and a skills objective.","ar":"Notice the word \u003cem>model\u003c/em> in 7ESp.01. Plate tectonics is introduced as a model, which links directly to the TWS objective 7TWSm.01, describing the strengths and limitations of a model. This is a good example of one lesson covering a content objective and a skills objective."}},{"t":"h","c":{"en":"Stage 8: magnetism, resources, climate and galaxies","ar":"Stage 8: magnetism, resources, climate and galaxies"}},{"t":"p","c":{"en":"\u003cstrong>8ESp.01\u003c/strong> says the Earth has a magnetic field because the core acts as a magnet. This connects to 8Pe.01 on magnetic fields. \u003cstrong>8ESp.02\u003c/strong> asks learners to identify renewable resources (including wind, tidal and solar power, and bioplastics) and non-renewable resources (including fossil fuels), and, since version 3.0, to \u003cem>discuss the importance\u003c/em> of using renewable resources rather than only describe their use. In Cycles on Earth there are three objectives: evidence that the climate cycles between warm periods and ice ages over long time periods (8ESc.01), that climate can change due to atmospheric change (8ESc.02), and the difference between climate and weather (8ESc.03). In Earth in space, learners describe a galaxy (8ESs.01) and asteroids (8ESs.02), including that most asteroids are found in the asteroid belt between Mars and Jupiter.","ar":"\u003cstrong>8ESp.01\u003c/strong> says the Earth has a magnetic field because the core acts as a magnet. This connects to 8Pe.01 on magnetic fields. \u003cstrong>8ESp.02\u003c/strong> asks learners to identify renewable resources (including wind, tidal and solar power, and bioplastics) and non-renewable resources (including fossil fuels), and, since version 3.0, to \u003cem>discuss the importance\u003c/em> of using renewable resources rather than only describe their use. In Cycles on Earth there are three objectives: evidence that the climate cycles between warm periods and ice ages over long time periods (8ESc.01), that climate can change due to atmospheric change (8ESc.02), and the difference between climate and weather (8ESc.03). In Earth in space, learners describe a galaxy (8ESs.01) and asteroids (8ESs.02), including that most asteroids are found in the asteroid belt between Mars and Jupiter."}},{"t":"table","head":{"en":["Word","Glossary definition (shortened)","Common confusion"],"ar":["Word","Glossary definition (shortened)","Common confusion"]},"rows":[{"en":["Weather","The conditions in the air above the Earth, such as wind, rain or temperature, over a particular area at a particular time","Learners say \"the weather in the desert is hot\" when they mean the climate"],"ar":["Weather","The conditions in the air above the Earth, such as wind, rain or temperature, over a particular area at a particular time","Learners say \"the weather in the desert is hot\" when they mean the climate"]},{"en":["Climate","The general weather conditions in an area over a long period of time","Learners say a cold week shows climate change is not happening"],"ar":["Climate","The general weather conditions in an area over a long period of time","Learners say a cold week shows climate change is not happening"]}]},{"t":"scenario","title":{"en":"A cold week and climate change","ar":"A cold week and climate change"},"c":{"en":"A Year 8 learner says: \"It was very hot yesterday and cold today, so the climate is changing.\" \u003cstrong>How do you respond?\u003c/strong> A good response uses 8ESc.03 and the glossary: yesterday and today describe weather, over a particular time. Climate is the general weather conditions over a long period. Ask the learner what data they would need, and for how long, to say something about climate. This links to 8TWSa.02 (describing trends and patterns in results).","ar":"A Year 8 learner says: \"It was very hot yesterday and cold today, so the climate is changing.\" \u003cstrong>How do you respond?\u003c/strong> A good response uses 8ESc.03 and the glossary: yesterday and today describe weather, over a particular time. Climate is the general weather conditions over a long period. Ask the learner what data they would need, and for how long, to say something about climate. This links to 8TWSa.02 (describing trends and patterns in results)."}},{"t":"h","c":{"en":"Stage 9: evidence, the carbon cycle and the history of the Moon","ar":"Stage 9: evidence, the carbon cycle and the history of the Moon"}},{"t":"p","c":{"en":"\u003cstrong>9ESp.01\u003c/strong> explains the movement of tectonic plates in terms of convection currents. \u003cstrong>9ESp.02\u003c/strong> asks learners to explain why four kinds of evidence support tectonic plates: the jigsaw appearance of continental coasts, the location of volcanoes and earthquakes, the fossil record and the alignment of magnetic materials in the Earth's crust. \u003cstrong>9ESc.01\u003c/strong> describes the carbon cycle, limited to photosynthesis, respiration, feeding, decomposition and combustion. \u003cstrong>9ESc.02\u003c/strong> describes the historical and predicted future impacts of climate change, including sea level change due to melting polar ice and glaciers, flooding, drought and extreme weather. \u003cstrong>9ESs.01\u003c/strong> describes the consequences of an asteroid collision with the Earth, including climate change and mass extinctions, \u003cstrong>9ESs.02\u003c/strong> the evidence for the collision theory of the formation of the Moon, and \u003cstrong>9ESs.03\u003c/strong> nebulae as clouds of dust and gas that can act as stellar nurseries.","ar":"\u003cstrong>9ESp.01\u003c/strong> explains the movement of tectonic plates in terms of convection currents. \u003cstrong>9ESp.02\u003c/strong> asks learners to explain why four kinds of evidence support tectonic plates: the jigsaw appearance of continental coasts, the location of volcanoes and earthquakes, the fossil record and the alignment of magnetic materials in the Earth's crust. \u003cstrong>9ESc.01\u003c/strong> describes the carbon cycle, limited to photosynthesis, respiration, feeding, decomposition and combustion. \u003cstrong>9ESc.02\u003c/strong> describes the historical and predicted future impacts of climate change, including sea level change due to melting polar ice and glaciers, flooding, drought and extreme weather. \u003cstrong>9ESs.01\u003c/strong> describes the consequences of an asteroid collision with the Earth, including climate change and mass extinctions, \u003cstrong>9ESs.02\u003c/strong> the evidence for the collision theory of the formation of the Moon, and \u003cstrong>9ESs.03\u003c/strong> nebulae as clouds of dust and gas that can act as stellar nurseries."}},{"t":"p","c":{"en":"Stage 9 uses the word \u003cem>evidence\u003c/em> several times (9ESp.02, 9ESs.02). This makes Earth and Space a good place to practise the Stage 9 TWS objective 9TWSa.01, evaluating the strength of the evidence and how it supports or refutes a prediction or theory.","ar":"Stage 9 uses the word \u003cem>evidence\u003c/em> several times (9ESp.02, 9ESs.02). This makes Earth and Space a good place to practise the Stage 9 TWS objective 9TWSa.01, evaluating the strength of the evidence and how it supports or refutes a prediction or theory."}},{"t":"callout","k":"tip","title":{"en":"Link Biology and Earth and Space","ar":"Link Biology and Earth and Space"},"c":{"en":"The carbon cycle (9ESc.01) is limited to photosynthesis, respiration, feeding, decomposition and combustion. Three of those five processes are already in Biology: respiration (8Bp.04), photosynthesis (9Bp.06) and decomposers (7Be.01). A good Stage 9 plan lets learners build the carbon cycle from what they already know and adds feeding and combustion.","ar":"The carbon cycle (9ESc.01) is limited to photosynthesis, respiration, feeding, decomposition and combustion. Three of those five processes are already in Biology: respiration (8Bp.04), photosynthesis (9Bp.06) and decomposers (7Be.01). A good Stage 9 plan lets learners build the carbon cycle from what they already know and adds feeding and combustion."}},{"t":"h","c":{"en":"Earth and Space across the stages","ar":"Earth and Space across the stages"}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Tectonic plates","7ESp.01 and 7ESp.02: the model and where earthquakes and volcanoes occur","8ESp.01: the Earth's core acts as a magnet (Earth's structure)","9ESp.01 and 9ESp.02: convection currents and evidence for plates"],"ar":["Tectonic plates","7ESp.01 and 7ESp.02: the model and where earthquakes and volcanoes occur","8ESp.01: the Earth's core acts as a magnet (Earth's structure)","9ESp.01 and 9ESp.02: convection currents and evidence for plates"]},{"en":["Air and climate","7ESp.03: composition of air; pollution changes it","8ESc.01 to 8ESc.03: climate cycles, atmospheric change, climate and weather","9ESc.02: impacts of climate change, including sea level change"],"ar":["Air and climate","7ESp.03: composition of air; pollution changes it","8ESc.01 to 8ESc.03: climate cycles, atmospheric change, climate and weather","9ESc.02: impacts of climate change, including sea level change"]},{"en":["Gravity and the Solar System","7ESs.01 to 7ESs.04: planet formation, orbits, tides, eclipses","8ESs.01 and 8ESs.02: galaxies and asteroids","9ESs.01 to 9ESs.03: asteroid collision, the Moon, nebulae and stars"],"ar":["Gravity and the Solar System","7ESs.01 to 7ESs.04: planet formation, orbits, tides, eclipses","8ESs.01 and 8ESs.02: galaxies and asteroids","9ESs.01 to 9ESs.03: asteroid collision, the Moon, nebulae and stars"]}]},{"t":"scenario","title":{"en":"A Stage 7 eclipse lesson","ar":"A Stage 7 eclipse lesson"},"c":{"en":"You will teach 7ESs.04 (explain how solar and lunar eclipses happen). \u003cstrong>Which earlier ideas should you check first?\u003c/strong> A good answer: check what learners remember from Primary Stage 6 (6ESs.01), the relative position and movement of the planets, the Moon and the Sun, and link to 7ESs.02 on gravity holding the Solar System in orbit. Use a simple model, such as a torch and two balls, and ask learners to say what the model shows well and where it fails (7TWSm.01). For ESL learners, give a labelled diagram with the words \"shadow\", \"orbit\", \"solar\" and \"lunar\".","ar":"You will teach 7ESs.04 (explain how solar and lunar eclipses happen). \u003cstrong>Which earlier ideas should you check first?\u003c/strong> A good answer: check what learners remember from Primary Stage 6 (6ESs.01), the relative position and movement of the planets, the Moon and the Sun, and link to 7ESs.02 on gravity holding the Solar System in orbit. Use a simple model, such as a torch and two balls, and ask learners to say what the model shows well and where it fails (7TWSm.01). For ESL learners, give a labelled diagram with the words \"shadow\", \"orbit\", \"solar\" and \"lunar\"."}},{"t":"p","c":{"en":"\u003cstrong>A note on the strand name in codes.\u003c/strong> Earth and Space uses two letters, ES, followed by the sub-strand letter: 8ESc.01 is Stage 8, Earth and Space, Cycles on Earth. Do not confuse ESc (Cycles on Earth) with Cc (Chemistry, Changes to materials), or ESp (Planet Earth) with Pf, Ps and Pe (Physics). Reading the first letters carefully avoids mistakes when someone sends you a code in a message.","ar":"\u003cstrong>A note on the strand name in codes.\u003c/strong> Earth and Space uses two letters, ES, followed by the sub-strand letter: 8ESc.01 is Stage 8, Earth and Space, Cycles on Earth. Do not confuse ESc (Cycles on Earth) with Cc (Chemistry, Changes to materials), or ESp (Planet Earth) with Pf, Ps and Pe (Physics). Reading the first letters carefully avoids mistakes when someone sends you a code in a message."}}],"checks":[{"id":"m8q1","q":{"en":"Which Stage 8 objective separates the ideas of climate and weather?","ar":"Which Stage 8 objective separates the ideas of climate and weather?"},"opts":[{"en":"8ESc.01, which describes evidence of climate cycles between warm periods and ice ages","ar":"8ESc.01, which describes evidence of climate cycles between warm periods and ice ages"},{"en":"8ESc.03, which describes the difference between climate and weather","ar":"8ESc.03, which describes the difference between climate and weather"},{"en":"8ESc.02, which says climate can change because of atmospheric change","ar":"8ESc.02, which says climate can change because of atmospheric change"},{"en":"7ESc.01, which describes the water cycle and its main processes in detail","ar":"7ESc.01, which describes the water cycle and its main processes in detail"}],"correct":1,"expl":{"en":"8ESc.03 says to describe the difference between climate and weather; the glossary defines both words.","ar":"8ESc.03 says to describe the difference between climate and weather; the glossary defines both words."}},{"id":"m8q2","q":{"en":"What does 9ESc.01 limit the carbon cycle to?","ar":"What does 9ESc.01 limit the carbon cycle to?"},"opts":[{"en":"Photosynthesis and respiration, because the carbon cycle is a simple loop in Stage 9","ar":"Photosynthesis and respiration, because the carbon cycle is a simple loop in Stage 9"},{"en":"Respiration, decomposition, volcanoes, ocean absorption and the burning of coal and oil","ar":"Respiration, decomposition, volcanoes, ocean absorption and the burning of coal and oil"},{"en":"Photosynthesis, respiration, feeding, decomposition and combustion","ar":"Photosynthesis, respiration, feeding, decomposition and combustion"},{"en":"Feeding, decomposition and combustion, since photosynthesis belongs to the Stage 9 Biology strand","ar":"Feeding, decomposition and combustion, since photosynthesis belongs to the Stage 9 Biology strand"}],"correct":2,"expl":{"en":"9ESc.01 says \"limited to photosynthesis, respiration, feeding, decomposition and combustion\".","ar":"9ESc.01 says \"limited to photosynthesis, respiration, feeding, decomposition and combustion\"."}},{"id":"m8q3","q":{"en":"Which stage first asks learners to explain tectonic plate movement using convection currents?","ar":"Which stage first asks learners to explain tectonic plate movement using convection currents?"},"opts":[{"en":"Stage 7, in 7ESp.01, together with the first description of plate tectonics","ar":"Stage 7, in 7ESp.01, together with the first description of plate tectonics"},{"en":"Stage 8, in 8ESp.01, together with the idea of the Earth's magnetic field","ar":"Stage 8, in 8ESp.01, together with the idea of the Earth's magnetic field"},{"en":"Stage 8, in 8ESc.02, together with the study of atmospheric change over time","ar":"Stage 8, in 8ESc.02, together with the study of atmospheric change over time"},{"en":"Stage 9, in 9ESp.01, after Stage 7 introduced the plate tectonics model","ar":"Stage 9, in 9ESp.01, after Stage 7 introduced the plate tectonics model"}],"correct":3,"expl":{"en":"7ESp.01 describes the model, with flow lower in the mantle. 9ESp.01 explains plate movement in terms of convection currents.","ar":"7ESp.01 describes the model, with flow lower in the mantle. 9ESp.01 explains plate movement in terms of convection currents."}}]},{"id":"m9","title":{"en":"Reading Progression across Stages 7 to 9: Tracing an Idea","ar":"Reading Progression across Stages 7 to 9: Tracing an Idea"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This last module brings the earlier ones together. The framework says to teach effectively you need to be familiar with the progression of skills and ideas across stages, \"to build on prior learning in every stage\". Here you practise a method: \u003cstrong>pick one idea, find it in each stage, and ask what is new\u003c/strong>.","ar":"This last module brings the earlier ones together. The framework says to teach effectively you need to be familiar with the progression of skills and ideas across stages, \"to build on prior learning in every stage\". Here you practise a method: \u003cstrong>pick one idea, find it in each stage, and ask what is new\u003c/strong>."}},{"t":"h","c":{"en":"A method: tracing an idea","ar":"A method: tracing an idea"}},{"t":"steps","c":{"en":["Choose one idea or word, for example \"particles\", \"energy\" or \"model\".","Search the Stage 7, 8 and 9 lists for objectives that use it, in every strand, not only the strand where you teach.","Write the codes in a table, one column per stage.","For each pair of stages, circle the new verb or new limit, such as describe, explain, calculate or discuss.","Ask: what must learners already know before each new objective, and where could the gap be?"],"ar":["Choose one idea or word, for example \"particles\", \"energy\" or \"model\".","Search the Stage 7, 8 and 9 lists for objectives that use it, in every strand, not only the strand where you teach.","Write the codes in a table, one column per stage.","For each pair of stages, circle the new verb or new limit, such as describe, explain, calculate or discuss.","Ask: what must learners already know before each new objective, and where could the gap be?"]}},{"t":"h","c":{"en":"Example 1: the particle model","ar":"Example 1: the particle model"}},{"t":"table","head":{"en":["Stage","Where the idea appears","What learners do"],"ar":["Stage","Where the idea appears","What learners do"]},"rows":[{"en":["7","7Cm.06 and 7Cm.07 (states and elements, compounds, mixtures, alloys); 7Cp.07 (alloy hardness); 7Cc.03 (reactions); 7Ps.01 (sound in particles)","Describe and represent"],"ar":["7","7Cm.06 and 7Cm.07 (states and elements, compounds, mixtures, alloys); 7Cp.07 (alloy hardness); 7Cc.03 (reactions); 7Ps.01 (sound in particles)","Describe and represent"]},{"en":["8","8Pf.06 (pressure in gases and liquids, qualitative only); 8Pf.07 (diffusion); 8Cp.01 (concentration and particles of solute)","Use particles to explain"],"ar":["8","8Pf.06 (pressure in gases and liquids, qualitative only); 8Pf.07 (diffusion); 8Cp.01 (concentration and particles of solute)","Use particles to explain"]},{"en":["9","9Cc.04 (rates of reaction); 9Cm.01 to 9Cm.05 (atoms, bonds, ions)","Explain rate, build bonding ideas"],"ar":["9","9Cc.04 (rates of reaction); 9Cm.01 to 9Cm.05 (atoms, bonds, ions)","Explain rate, build bonding ideas"]}]},{"t":"p","c":{"en":"The verbs move from \u003cem>describe and represent\u003c/em> (Stage 7) to \u003cem>explain\u003c/em> (Stages 8 and 9). A learner who can draw particles in a gas but cannot yet use the picture to explain pressure needs more practice with the Stage 7 idea before Stage 8 pressure.","ar":"The verbs move from \u003cem>describe and represent\u003c/em> (Stage 7) to \u003cem>explain\u003c/em> (Stages 8 and 9). A learner who can draw particles in a gas but cannot yet use the picture to explain pressure needs more practice with the Stage 7 idea before Stage 8 pressure."}},{"t":"h","c":{"en":"Example 2: energy","ar":"Example 2: energy"}},{"t":"table","head":{"en":["Stage","Objectives","What is new"],"ar":["Stage","Objectives","What is new"]},"rows":[{"en":["7","7Pf.01 energy changes; 7Pf.02 energy tends to dissipate and becomes less useful","Energy changes and dissipation, described"],"ar":["7","7Pf.01 energy changes; 7Pf.02 energy tends to dissipate and becomes less useful","Energy changes and dissipation, described"]},{"en":["8","8Bp.02 energy stores in carbohydrates and fats; 8Bp.04 aerobic respiration gives a controlled release of energy; 8Cc.02 endothermic and exothermic","Energy in living things and in reactions"],"ar":["8","8Bp.02 energy stores in carbohydrates and fats; 8Bp.04 aerobic respiration gives a controlled release of energy; 8Cc.02 endothermic and exothermic","Energy in living things and in reactions"]},{"en":["9","9Pf.03 energy is conserved; 9Pf.04 heat dissipation; 9Pf.05 conduction, convection, radiation; 9Cc.05 mass and energy conserved","Conservation, and transfer from hot to cold"],"ar":["9","9Pf.03 energy is conserved; 9Pf.04 heat dissipation; 9Pf.05 conduction, convection, radiation; 9Cc.05 mass and energy conserved","Conservation, and transfer from hot to cold"]}]},{"t":"scenario","title":{"en":"Spotting a gap","ar":"Spotting a gap"},"c":{"en":"A Year 9 teacher finds that many learners cannot explain heat dissipation (9Pf.04). \u003cstrong>What would you do?\u003c/strong> A good answer: trace the idea back. 7Pf.02 introduced \"energy tends to dissipate and in doing so it becomes less useful\" in Stage 7. Check whether learners remember it, using a short question such as \"Where does the energy of a moving car go when it brakes?\". Re-teach the Stage 7 idea in a short starter, then link to 9Pf.04 and 9Pf.03. Good practice: tell learners explicitly that they have met this idea before.","ar":"A Year 9 teacher finds that many learners cannot explain heat dissipation (9Pf.04). \u003cstrong>What would you do?\u003c/strong> A good answer: trace the idea back. 7Pf.02 introduced \"energy tends to dissipate and in doing so it becomes less useful\" in Stage 7. Check whether learners remember it, using a short question such as \"Where does the energy of a moving car go when it brakes?\". Re-teach the Stage 7 idea in a short starter, then link to 9Pf.04 and 9Pf.03. Good practice: tell learners explicitly that they have met this idea before."}},{"t":"h","c":{"en":"Links back to Primary and forward","ar":"Links back to Primary and forward"}},{"t":"p","c":{"en":"The framework says each step of the Cambridge Pathway \"builds on the learners' development from the previous one\". PEPS learners arrive from Cambridge Primary Science, Stages 1 to 6. The Primary framework (0097) uses the same set of six strands and mostly the same sub-strands, so the codes look familiar, for example 6Pf.03 in Primary and 8Pf.03 here. Some examples of links, using the Stage 6 objectives of the Primary framework:","ar":"The framework says each step of the Cambridge Pathway \"builds on the learners' development from the previous one\". PEPS learners arrive from Cambridge Primary Science, Stages 1 to 6. The Primary framework (0097) uses the same set of six strands and mostly the same sub-strands, so the codes look familiar, for example 6Pf.03 in Primary and 8Pf.03 here. Some examples of links, using the Stage 6 objectives of the Primary framework:"}},{"t":"table","head":{"en":["Stage 6 Primary objective","Stage 7 or later objective here","What the link suggests"],"ar":["Stage 6 Primary objective","Stage 7 or later objective here","What the link suggests"]},"rows":[{"en":["6Cc.04 and 6Cc.05: chemical reactions involve reactants and products; evidence of a reaction","7Cc.01: identify whether a reaction has taken place","Learners meet the idea before; Stage 7 adds precipitate and more detail"],"ar":["6Cc.04 and 6Cc.05: chemical reactions involve reactants and products; evidence of a reaction","7Cc.01: identify whether a reaction has taken place","Learners meet the idea before; Stage 7 adds precipitate and more detail"]},{"en":["6Pf.03 and 6Pf.04: force diagrams; effects of forces","8Pf.03: effects of balanced and unbalanced forces on motion","Stage 6 is a base for Stage 8"],"ar":["6Pf.03 and 6Pf.04: force diagrams; effects of forces","8Pf.03: effects of balanced and unbalanced forces on motion","Stage 6 is a base for Stage 8"]},{"en":["6Ps.01 and 6Ps.02: reflection from a plane mirror; refraction","8Ps.01 and 8Ps.02: the law of reflection; refraction in terms of change of speed","Light is not in Stage 7; learners may need a reminder in Stage 8"],"ar":["6Ps.01 and 6Ps.02: reflection from a plane mirror; refraction","8Ps.01 and 8Ps.02: the law of reflection; refraction in terms of change of speed","Light is not in Stage 7; learners may need a reminder in Stage 8"]},{"en":["6Pe.01: circuits, with series and parallel","7Pe.05: circuit symbols (series circuits); 9Pe.01: parallel circuits","Parallel circuits are in Primary, then return in Stage 9"],"ar":["6Pe.01: circuits, with series and parallel","7Pe.05: circuit symbols (series circuits); 9Pe.01: parallel circuits","Parallel circuits are in Primary, then return in Stage 9"]},{"en":["6ESp.01 and 6ESc.01: rocks and the rock cycle","No rock objective in Stages 7 to 9","Stages 7 to 9 move to plate tectonics, atmosphere and climate"],"ar":["6ESp.01 and 6ESc.01: rocks and the rock cycle","No rock objective in Stages 7 to 9","Stages 7 to 9 move to plate tectonics, atmosphere and climate"]}]},{"t":"p","c":{"en":"The first and fourth links are a useful reminder that the Stage 7 teacher should not assume learners know nothing. The framework says learners \"first meet foundational scientific concepts, that then develop through the Cambridge Pathway\". Also, the Primary Stage 6 Chemistry list has Properties of materials and Changes to materials only, with no Materials and their structure objectives, so atoms and elements (7Cm.01) are new at Stage 7.","ar":"The first and fourth links are a useful reminder that the Stage 7 teacher should not assume learners know nothing. The framework says learners \"first meet foundational scientific concepts, that then develop through the Cambridge Pathway\". Also, the Primary Stage 6 Chemistry list has Properties of materials and Changes to materials only, with no Materials and their structure objectives, so atoms and elements (7Cm.01) are new at Stage 7."}},{"t":"p","c":{"en":"\u003cstrong>Forward.\u003c/strong> At PEPS, learners go on to Cambridge IGCSE in Years 10 and 11. The framework does not describe IGCSE content. It says only that the approach gives learners the knowledge and skills to access and excel at science in later phases, and in version 3.0 it notes that the speed and pressure formulae are now formatted in the same style as for Cambridge IGCSE and O Level qualifications. For the content of the IGCSE courses, read the IGCSE syllabuses.","ar":"\u003cstrong>Forward.\u003c/strong> At PEPS, learners go on to Cambridge IGCSE in Years 10 and 11. The framework does not describe IGCSE content. It says only that the approach gives learners the knowledge and skills to access and excel at science in later phases, and in version 3.0 it notes that the speed and pressure formulae are now formatted in the same style as for Cambridge IGCSE and O Level qualifications. For the content of the IGCSE courses, read the IGCSE syllabuses."}},{"t":"h","c":{"en":"Gaps and prerequisites within Stages 7 to 9","ar":"Gaps and prerequisites within Stages 7 to 9"}},{"t":"list","c":{"en":["\u003cstrong>Light.\u003c/strong> Stage 7 Light and sound covers sound only, Stage 8 covers light only, and Stage 9 returns to sound waveforms. Learners meet light in Stage 8 after a gap.","\u003cstrong>Ecosystems.\u003c/strong> Stage 9 has one Ecosystems objective (9Be.01), and Stage 8 has three. A strong ecosystems thread needs the Stage 7 decomposer ideas and the Stage 9 carbon cycle (9ESc.01).","\u003cstrong>Genetics.\u003c/strong> Genes, inheritance and natural selection are all in Stage 9 (9Bs.03, 9Bp.01 to 9Bp.04), so Stage 9 teachers cannot assume earlier lessons on them.","\u003cstrong>Maths in science.\u003c/strong> Speed, moment, pressure, density and resistance each need a formula. The formulae are listed in the Appendix, and learners should have the arithmetic skills before the lesson."],"ar":["\u003cstrong>Light.\u003c/strong> Stage 7 Light and sound covers sound only, Stage 8 covers light only, and Stage 9 returns to sound waveforms. Learners meet light in Stage 8 after a gap.","\u003cstrong>Ecosystems.\u003c/strong> Stage 9 has one Ecosystems objective (9Be.01), and Stage 8 has three. A strong ecosystems thread needs the Stage 7 decomposer ideas and the Stage 9 carbon cycle (9ESc.01).","\u003cstrong>Genetics.\u003c/strong> Genes, inheritance and natural selection are all in Stage 9 (9Bs.03, 9Bp.01 to 9Bp.04), so Stage 9 teachers cannot assume earlier lessons on them.","\u003cstrong>Maths in science.\u003c/strong> Speed, moment, pressure, density and resistance each need a formula. The formulae are listed in the Appendix, and learners should have the arithmetic skills before the lesson."]}},{"t":"h","c":{"en":"Year 9 Checkpoint, assessments and the Appendix","ar":"Year 9 Checkpoint, assessments and the Appendix"}},{"t":"p","c":{"en":"The framework names Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments, and says assessments are designed to complement the framework for Stages 7 to 9. PEPS Year 9 sits Cambridge Lower Secondary Checkpoint. The framework says more information on assessing Cambridge Lower Secondary Science is on the School Support Hub, so check there for the assessment details, and remember that Science in Context is not directly assessed by Cambridge. Because the feedback reports use the reporting codes (for example Bs or Cc), knowing the codes helps you read a Checkpoint report against the framework. In Year 8, the school's GL Progress Tests are a separate external benchmark from the Cambridge framework, so do not assume a GL result maps to Cambridge objective codes.","ar":"The framework names Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments, and says assessments are designed to complement the framework for Stages 7 to 9. PEPS Year 9 sits Cambridge Lower Secondary Checkpoint. The framework says more information on assessing Cambridge Lower Secondary Science is on the School Support Hub, so check there for the assessment details, and remember that Science in Context is not directly assessed by Cambridge. Because the feedback reports use the reporting codes (for example Bs or Cc), knowing the codes helps you read a Checkpoint report against the framework. In Year 8, the school's GL Progress Tests are a separate external benchmark from the Cambridge framework, so do not assume a GL result maps to Cambridge objective codes."}},{"t":"p","c":{"en":"\u003cstrong>Use the Glossary and Appendix in your planning.\u003c/strong> The glossary defines words such as analogy, breathing, climate, hypothesis, investigation, mixture, model, respiration, scientific model, substance and weather. The Appendix gives electrical symbols, hazard symbols, symbols and units for physical quantities, and the table of formulae. Print the Appendix pages for your lab, and teach the symbols and units, not only the facts.","ar":"\u003cstrong>Use the Glossary and Appendix in your planning.\u003c/strong> The glossary defines words such as analogy, breathing, climate, hypothesis, investigation, mixture, model, respiration, scientific model, substance and weather. The Appendix gives electrical symbols, hazard symbols, symbols and units for physical quantities, and the table of formulae. Print the Appendix pages for your lab, and teach the symbols and units, not only the facts."}},{"t":"scenario","title":{"en":"A new HOD asks you to prepare a stage map","ar":"A new HOD asks you to prepare a stage map"},"c":{"en":"The HOD wants a one-page map of Stage 8 Science for new teachers. \u003cstrong>What would you include?\u003c/strong> A good answer: the six strands with the number of objectives (Stage 8 has 70); the sub-strands; two or three Stage 8 objectives to look for in each strand, with exact codes; the limits that matter, such as the nine metals in 8Cc.03; the formulae from the Appendix (speed, moment, pressure); a list of ideas that arrive from Stage 7 or Primary Stage 6; and a reminder to check the full wording in the framework and the school's own planning guidance.","ar":"The HOD wants a one-page map of Stage 8 Science for new teachers. \u003cstrong>What would you include?\u003c/strong> A good answer: the six strands with the number of objectives (Stage 8 has 70); the sub-strands; two or three Stage 8 objectives to look for in each strand, with exact codes; the limits that matter, such as the nine metals in 8Cc.03; the formulae from the Appendix (speed, moment, pressure); a list of ideas that arrive from Stage 7 or Primary Stage 6; and a reminder to check the full wording in the framework and the school's own planning guidance."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> The framework is a three-year map: read an objective together with the same sub-strand in the stages before and after it. \u003cstrong>2.\u003c/strong> Every code tells you the stage, the sub-strand and the order, so use codes in planning and in conversations with colleagues. \u003cstrong>3.\u003c/strong> Six strands work together: Thinking and Working Scientifically, Biology, Chemistry, Physics, Earth and Space, and Science in Context, and the limits in the wording (\"limited to\", \"qualitative only\") show the depth expected. \u003cstrong>4.\u003c/strong> Trace key ideas such as particles, energy and models from Stage 7 to Stage 9, and from Primary Stage 6, to find gaps early. \u003cstrong>5.\u003c/strong> Check the full wording and the current version (3.0, February 2026) of the framework, and use the Glossary and Appendix. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"\u003cstrong>1.\u003c/strong> The framework is a three-year map: read an objective together with the same sub-strand in the stages before and after it. \u003cstrong>2.\u003c/strong> Every code tells you the stage, the sub-strand and the order, so use codes in planning and in conversations with colleagues. \u003cstrong>3.\u003c/strong> Six strands work together: Thinking and Working Scientifically, Biology, Chemistry, Physics, Earth and Space, and Science in Context, and the limits in the wording (\"limited to\", \"qualitative only\") show the depth expected. \u003cstrong>4.\u003c/strong> Trace key ideas such as particles, energy and models from Stage 7 to Stage 9, and from Primary Stage 6, to find gaps early. \u003cstrong>5.\u003c/strong> Check the full wording and the current version (3.0, February 2026) of the framework, and use the Glossary and Appendix. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}}],"checks":[{"id":"m9q1","q":{"en":"A teacher wants to know whether Year 8 learners have met the idea of reflection of light before. Where should the teacher look first?","ar":"A teacher wants to know whether Year 8 learners have met the idea of reflection of light before. Where should the teacher look first?"},"opts":[{"en":"Primary Stage 6 objective 6Ps.01, because Stage 7 Light and sound objectives are about sound","ar":"Primary Stage 6 objective 6Ps.01, because Stage 7 Light and sound objectives are about sound"},{"en":"Stage 7 Light and sound objectives, because Stage 7 introduces reflection of light","ar":"Stage 7 Light and sound objectives, because Stage 7 introduces reflection of light"},{"en":"Stage 9 Light and sound objectives, because waveforms of light are first introduced after Stage 8","ar":"Stage 9 Light and sound objectives, because waveforms of light are first introduced after Stage 8"},{"en":"Stage 7 Thinking and Working Scientifically, because reflection is a model","ar":"Stage 7 Thinking and Working Scientifically, because reflection is a model"}],"correct":0,"expl":{"en":"Primary Stage 6 includes 6Ps.01, a ray of light reflected from a plane mirror. Stage 7 Ps objectives are sound only (7Ps.01, 7Ps.02), and 8Ps.01 covers reflection and the law of reflection.","ar":"Primary Stage 6 includes 6Ps.01, a ray of light reflected from a plane mirror. Stage 7 Ps objectives are sound only (7Ps.01, 7Ps.02), and 8Ps.01 covers reflection and the law of reflection."}},{"id":"m9q2","q":{"en":"Which method best fits \"tracing an idea\" across the stages?","ar":"Which method best fits \"tracing an idea\" across the stages?"},"opts":[{"en":"Read the Stage 9 objectives first, then assume Stage 7 and Stage 8 are simply easier versions of the same ideas","ar":"Read the Stage 9 objectives first, then assume Stage 7 and Stage 8 are simply easier versions of the same ideas"},{"en":"Choose one idea, list objectives that use it in each stage and strand, and note each new verb or limit","ar":"Choose one idea, list objectives that use it in each stage and strand, and note each new verb or limit"},{"en":"Count the objectives in each strand for each stage and then give lessons in the same proportions","ar":"Count the objectives in each strand for each stage and then give lessons in the same proportions"},{"en":"Copy the Stage 8 objectives into the Stage 9 plan and add one harder practical to every unit of work","ar":"Copy the Stage 8 objectives into the Stage 9 plan and add one harder practical to every unit of work"}],"correct":1,"expl":{"en":"Tracing an idea means looking across the stages and strands for the same idea, and comparing the verbs and limits to see what changes.","ar":"Tracing an idea means looking across the stages and strands for the same idea, and /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;
if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
