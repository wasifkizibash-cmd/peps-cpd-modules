#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"lower-science-framework-a","code":"LSA","passMark":80,"hours":"2.5 hours","accent":"#1F7A5A","accentSoft":"#E3F4EC","eyebrow":{"en":"Staff CPD · Cambridge Lower Secondary Science 0893 · Part A","ar":"Staff CPD · Cambridge Lower Secondary Science 0893 · Part A"},"title":{"en":"Understanding the Cambridge Lower Secondary Science Curriculum: Part A, The Framework and Its Content","ar":"Understanding the Cambridge Lower Secondary Science Curriculum: Part A, The Framework and Its Content"},"subtitle":{"en":"A self-paced guide for Years 7 to 9 science teachers, HODs, coordinators and new staff: why the framework exists, how it is organised, how to read a learning-objective code, and what Thinking and Working Scientifically, Biology, Chemistry, Physics, Earth and Space and Science in Context cover from Stage 7 to Stage 9.","ar":"A self-paced guide for Years 7 to 9 science teachers, HODs, coordinators and new staff: why the framework exists, how it is organised, how to read a learning-objective code, and what Thinking and Working Scientifically, Biology, Chemistry, Physics, Earth and Space and Science in Context cover from Stage 7 to Stage 9."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Lower Secondary Science 0893 Curriculum Framework (v3.0)","ar":"Cambridge Lower Secondary Science 0893 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Lower Secondary Science 0893 Curriculum Framework, version 3.0 (latest version published February 2026). Check the current Cambridge documents on the School Support Hub; this CPD supports, and does not replace, them.","ar":"Cambridge Lower Secondary Science 0893 Curriculum Framework, version 3.0 (latest version published February 2026). Check the current Cambridge documents on the School Support Hub; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"Why This Framework? Purpose, Pathway, Time and Version 3.0","ar":"Why This Framework? Purpose, Pathway, Time and Version 3.0"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD (Part A) helps you read and use the \u003cstrong>Cambridge Lower Secondary Science 0893 Curriculum Framework\u003c/strong> with confidence. By the end you will be able to: explain what the framework is for; read any learning-objective code such as \u003cstrong>9Bs.01\u003c/strong>; describe the three kinds of strand and how they work together; summarise what Biology, Chemistry, Physics and Earth and Space cover from Stage 7 to Stage 9; follow one idea across the three stages; and say how Stage 7 links back to Primary and forward to the later years. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> Always check the framework for the full wording of any objective.","ar":"This CPD (Part A) helps you read and use the \u003cstrong>Cambridge Lower Secondary Science 0893 Curriculum Framework\u003c/strong> with confidence. By the end you will be able to: explain what the framework is for; read any learning-objective code such as \u003cstrong>9Bs.01\u003c/strong>; describe the three kinds of strand and how they work together; summarise what Biology, Chemistry, Physics and Earth and Space cover from Stage 7 to Stage 9; follow one idea across the three stages; and say how Stage 7 links back to Primary and forward to the later years. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong> Always check the framework for the full wording of any objective."}},{"t":"p","c":{"en":"Many teachers meet the science framework only as a list of topics for their own year group. That is a small part of its value. The framework is a \u003cem>map of three years of learning\u003c/em>. When you know where a Stage 8 idea comes from and where it goes next, you can teach it with more confidence, spot gaps early, and explain to colleagues and parents why a topic matters.","ar":"Many teachers meet the science framework only as a list of topics for their own year group. That is a small part of its value. The framework is a \u003cem>map of three years of learning\u003c/em>. When you know where a Stage 8 idea comes from and where it goes next, you can teach it with more confidence, spot gaps early, and explain to colleagues and parents why a topic matters."}},{"t":"h","c":{"en":"What the framework says it is for","ar":"What the framework says it is for"}},{"t":"p","c":{"en":"The framework describes itself as a comprehensive set of learning objectives for Cambridge Lower Secondary Science. These objectives \"give a structure for teaching and learning and a reference against which learners' attainment and skills development can be checked\". In plain words: the framework tells you \u003cem>what learners should know, understand and be able to do\u003c/em> at each stage. It does not tell you which lessons, units or textbook to use. Those are your school's choices.","ar":"The framework describes itself as a comprehensive set of learning objectives for Cambridge Lower Secondary Science. These objectives \"give a structure for teaching and learning and a reference against which learners' attainment and skills development can be checked\". In plain words: the framework tells you \u003cem>what learners should know, understand and be able to do\u003c/em> at each stage. It does not tell you which lessons, units or textbook to use. Those are your school's choices."}},{"t":"h","c":{"en":"Key benefits named in the framework","ar":"Key benefits named in the framework"}},{"t":"list","c":{"en":["\u003cstrong>Curiosity.\u003c/strong> The curriculum supports learners in developing life-long curiosity about the natural world and in seeking scientific explanations for the phenomena around them.","\u003cstrong>A holistic approach.\u003c/strong> Scientific thinking and practical skills are developed alongside knowledge and understanding.","\u003cstrong>Preparation for later study.\u003c/strong> The approach gives learners the knowledge and skills they need to access and excel at science in later phases of education.","\u003cstrong>Clear sequencing.\u003c/strong> Strands of science skills and knowledge are sequenced so that learners can describe, explain and investigate the world at an age-appropriate level.","\u003cstrong>Informed choices.\u003c/strong> Learners are prepared to make informed choices, including about sustainability issues and the challenges facing our environment."],"ar":["\u003cstrong>Curiosity.\u003c/strong> The curriculum supports learners in developing life-long curiosity about the natural world and in seeking scientific explanations for the phenomena around them.","\u003cstrong>A holistic approach.\u003c/strong> Scientific thinking and practical skills are developed alongside knowledge and understanding.","\u003cstrong>Preparation for later study.\u003c/strong> The approach gives learners the knowledge and skills they need to access and excel at science in later phases of education.","\u003cstrong>Clear sequencing.\u003c/strong> Strands of science skills and knowledge are sequenced so that learners can describe, explain and investigate the world at an age-appropriate level.","\u003cstrong>Informed choices.\u003c/strong> Learners are prepared to make informed choices, including about sustainability issues and the challenges facing our environment."]}},{"t":"h","c":{"en":"Science in Context: the \"unique feature\"","ar":"Science in Context: the \"unique feature\""}},{"t":"p","c":{"en":"The framework calls \u003cstrong>Science in Context\u003c/strong> \"a unique feature\" of the programme. It helps you show learners that science is relevant to them. The framework says that improving learners' awareness of science in the world around them develops their sense that \u003cem>\"science is for me\"\u003c/em>. You will meet this strand again in Module 4.","ar":"The framework calls \u003cstrong>Science in Context\u003c/strong> \"a unique feature\" of the programme. It helps you show learners that science is relevant to them. The framework says that improving learners' awareness of science in the world around them develops their sense that \u003cem>\"science is for me\"\u003c/em>. You will meet this strand again in Module 4."}},{"t":"callout","k":"tip","title":{"en":"Good practice: say the purpose to your learners","ar":"Good practice: say the purpose to your learners"},"c":{"en":"The framework's purpose is curiosity and the feeling that \"science is for me\". In a class of ESL learners this matters even more. A learner who cannot yet explain an idea fluently in English can still observe, measure, sort and draw. Make sure every learner sees themselves as a scientist, whatever their English level.","ar":"The framework's purpose is curiosity and the feeling that \"science is for me\". In a class of ESL learners this matters even more. A learner who cannot yet explain an idea fluently in English can still observe, measure, sort and draw. Make sure every learner sees themselves as a scientist, whatever their English level."}},{"t":"h","c":{"en":"The Cambridge Pathway, ages and PEPS year groups","ar":"The Cambridge Pathway, ages and PEPS year groups"}},{"t":"p","c":{"en":"The framework explains that the lower secondary programme is part of the Cambridge Pathway. This pathway \"leads seamlessly from early years, to primary, to secondary and to pre-university years\", and each step builds on the learners' development from the previous one or from other educational systems. The framework is \"typically for learners aged 11 to 14\", but it may be used for slightly different ages to suit your context.","ar":"The framework explains that the lower secondary programme is part of the Cambridge Pathway. This pathway \"leads seamlessly from early years, to primary, to secondary and to pre-university years\", and each step builds on the learners' development from the previous one or from other educational systems. The framework is \"typically for learners aged 11 to 14\", but it may be used for slightly different ages to suit your context."}},{"t":"table","head":{"en":["Where","What the framework or school context says","What it means for you"],"ar":["Where","What the framework or school context says","What it means for you"]},"rows":[{"en":["Before Year 7","Cambridge Primary has Stages 1 to 6. At PEPS, Years 1 to 6 follow Primary Stages 1 to 6, and learners arrive in Year 7 from there.","Learners arrive with Primary science ideas. Stage 7 builds on them (see Module 9)."],"ar":["Before Year 7","Cambridge Primary has Stages 1 to 6. At PEPS, Years 1 to 6 follow Primary Stages 1 to 6, and learners arrive in Year 7 from there.","Learners arrive with Primary science ideas. Stage 7 builds on them (see Module 9)."]},{"en":["Years 7 to 9","This framework has learning objectives for Stages 7, 8 and 9. At PEPS, Year 7, Year 8 and Year 9 follow Stage 7, Stage 8 and Stage 9.","Each year group has its own set of objectives. This CPD uses \"Stage\" for framework wording and \"Year\" for PEPS year groups."],"ar":["Years 7 to 9","This framework has learning objectives for Stages 7, 8 and 9. At PEPS, Year 7, Year 8 and Year 9 follow Stage 7, Stage 8 and Stage 9.","Each year group has its own set of objectives. This CPD uses \"Stage\" for framework wording and \"Year\" for PEPS year groups."]},{"en":["End of Year 9","The framework names Cambridge Lower Secondary Checkpoint as a Cambridge assessment. PEPS Year 9 sits Cambridge Lower Secondary Checkpoint.","Stage 9 is the last stage of this programme. Stages 7 and 8 prepare for it."],"ar":["End of Year 9","The framework names Cambridge Lower Secondary Checkpoint as a Cambridge assessment. PEPS Year 9 sits Cambridge Lower Secondary Checkpoint.","Stage 9 is the last stage of this programme. Stages 7 and 8 prepare for it."]},{"en":["After Year 9","The pathway continues to the pre-university years. At PEPS, Years 10 and 11 follow Cambridge IGCSE.","Check your school's IGCSE programme for what it expects. This CPD does not describe IGCSE content."],"ar":["After Year 9","The pathway continues to the pre-university years. At PEPS, Years 10 and 11 follow Cambridge IGCSE.","Check your school's IGCSE programme for what it expects. This CPD does not describe IGCSE content."]}]},{"t":"h","c":{"en":"Teaching time: what the framework suggests","ar":"Teaching time: what the framework suggests"}},{"t":"p","c":{"en":"The framework says: \"For guidance, this curriculum framework is based on learners having 3 hours of Science per week (or about 90 hours per stage). Your actual number of teaching hours may vary according to your context.\" This is not a rule. It is a planning guide.","ar":"The framework says: \"For guidance, this curriculum framework is based on learners having 3 hours of Science per week (or about 90 hours per stage). Your actual number of teaching hours may vary according to your context.\" This is not a rule. It is a planning guide."}},{"t":"p","c":{"en":"\u003cstrong>Worked example.\u003c/strong> 3 hours a week for about 30 weeks gives about 90 hours. So the guidance assumes a school year of about 30 weeks of science. Count the real science minutes in your real school year. If you have fewer hours than the guidance, speak to your HOD early, because you will need to plan which activities to shorten, not which objectives to drop.","ar":"\u003cstrong>Worked example.\u003c/strong> 3 hours a week for about 30 weeks gives about 90 hours. So the guidance assumes a school year of about 30 weeks of science. Count the real science minutes in your real school year. If you have fewer hours than the guidance, speak to your HOD early, because you will need to plan which activities to shorten, not which objectives to drop."}},{"t":"h","c":{"en":"Supporting resources named in the framework","ar":"Supporting resources named in the framework"}},{"t":"p","c":{"en":"The framework says most resources are on the \u003cstrong>School Support Hub\u003c/strong>, and that you should ask the Cambridge coordinator or exams officer in your school if you do not have a log-in. It names these groups of support:","ar":"The framework says most resources are on the \u003cstrong>School Support Hub\u003c/strong>, and that you should ask the Cambridge coordinator or exams officer in your school if you do not have a log-in. It names these groups of support:"}},{"t":"list","c":{"en":["\u003cstrong>Teaching resources:\u003c/strong> the curriculum framework, the teacher guide and schemes of work.","\u003cstrong>Cambridge Lower Secondary assessments:\u003c/strong> Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments.","\u003cstrong>Training:\u003c/strong> face-to-face workshops around the world, online training and Cambridge Professional Development Qualifications.","\u003cstrong>Community:\u003c/strong> social media channels and community forums on the School Support Hub, where teachers share ideas and experiences."],"ar":["\u003cstrong>Teaching resources:\u003c/strong> the curriculum framework, the teacher guide and schemes of work.","\u003cstrong>Cambridge Lower Secondary assessments:\u003c/strong> Cambridge Lower Secondary Progression Tests, Cambridge Lower Secondary Checkpoint and Cambridge Insight assessments.","\u003cstrong>Training:\u003c/strong> face-to-face workshops around the world, online training and Cambridge Professional Development Qualifications.","\u003cstrong>Community:\u003c/strong> social media channels and community forums on the School Support Hub, where teachers share ideas and experiences."]}},{"t":"p","c":{"en":"The framework adds that the scheme of work for each stage has suggested units, at least one suggested activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans. It also says clearly: \u003cstrong>\"You do not need to use the ideas in the schemes of work\"\u003c/strong>. They show the types of activities, and the depth and breadth of each objective. They are not designed to fill all the teaching time, so you should add other activities of similar difficulty.","ar":"The framework adds that the scheme of work for each stage has suggested units, at least one suggested activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans. It also says clearly: \u003cstrong>\"You do not need to use the ideas in the schemes of work\"\u003c/strong>. They show the types of activities, and the depth and breadth of each objective. They are not designed to fill all the teaching time, so you should add other activities of similar difficulty."}},{"t":"h","c":{"en":"Version 3.0 and the \"Changes\" section","ar":"Version 3.0 and the \"Changes\" section"}},{"t":"p","c":{"en":"The front of the framework says it was first published in September 2020 for first teaching in September 2021. It states that Progression Tests would be available from 2022 and Checkpoint tests from 2023. The latest framework is \u003cstrong>version 3.0, published February 2026\u003c/strong>. The \"Changes to this curriculum framework\" section lists earlier changes too: version 2.0 (August 2021) made the document digitally accessible, corrected the code for 7TWSa.05 and improved some glossary definitions.","ar":"The front of the framework says it was first published in September 2020 for first teaching in September 2021. It states that Progression Tests would be available from 2022 and Checkpoint tests from 2023. The latest framework is \u003cstrong>version 3.0, published February 2026\u003c/strong>. The \"Changes to this curriculum framework\" section lists earlier changes too: version 2.0 (August 2021) made the document digitally accessible, corrected the code for 7TWSa.05 and improved some glossary definitions."}},{"t":"p","c":{"en":"Version 3.0 made a set of clarifications. For example: 7Cm.07 now says alloys are included, and brass and steel are named in 7Cp.06; 8Pe.02 now includes electric bells and sorting and moving scrap metal; 9Cm.03 and 9Cm.04 now include dot-and-cross diagrams; and 9Cc.03 now includes naming salts from hydrochloric, sulfuric and nitric acids. You will see these again in Modules 5 to 8. The framework says there may be other minor changes that do not affect teaching and learning.","ar":"Version 3.0 made a set of clarifications. For example: 7Cm.07 now says alloys are included, and brass and steel are named in 7Cp.06; 8Pe.02 now includes electric bells and sorting and moving scrap metal; 9Cm.03 and 9Cm.04 now include dot-and-cross diagrams; and 9Cc.03 now includes naming salts from hydrochloric, sulfuric and nitric acids. You will see these again in Modules 5 to 8. The framework says there may be other minor changes that do not affect teaching and learning."}},{"t":"callout","k":"warn","title":{"en":"Check which version your plans use","ar":"Check which version your plans use"},"c":{"en":"If a unit plan, textbook or worksheet was written before February 2026, check it against the version 3.0 wording of the objectives listed above. The framework also says \"You must read the whole curriculum before planning your teaching programme.\"","ar":"If a unit plan, textbook or worksheet was written before February 2026, check it against the version 3.0 wording of the objectives listed above. The framework also says \"You must read the whole curriculum before planning your teaching programme.\""}},{"t":"scenario","title":{"en":"A new colleague asks \"Do we have to follow the scheme of work?\"","ar":"A new colleague asks \"Do we have to follow the scheme of work?\""},"c":{"en":"A new Year 8 teacher joins in October. She has been given the Stage 8 scheme of work and asks if she must teach every suggested activity in the order shown. \u003cstrong>How would you answer?\u003c/strong> A good answer: the framework says you do not need to use the scheme of work ideas, but the learning objectives are the reference. She should plan so that every Stage 8 objective is taught and checked, can use the scheme of work for activity ideas and common misconceptions, and should follow her HOD's and the school's planning expectations.","ar":"A new Year 8 teacher joins in October. She has been given the Stage 8 scheme of work and asks if she must teach every suggested activity in the order shown. \u003cstrong>How would you answer?\u003c/strong> A good answer: the framework says you do not need to use the scheme of work ideas, but the learning objectives are the reference. She should plan so that every Stage 8 objective is taught and checked, can use the scheme of work for activity ideas and common misconceptions, and should follow her HOD's and the school's planning expectations."}},{"t":"table","head":{"en":["Question","Where the framework answers it"],"ar":["Question","Where the framework answers it"]},"rows":[{"en":["What are the learners expected to know and do at each stage?","Section 3, Learning objectives by stage (Stages 7, 8 and 9)"],"ar":["What are the learners expected to know and do at each stage?","Section 3, Learning objectives by stage (Stages 7, 8 and 9)"]},{"en":["How much time is the framework based on?","Section 1, Teaching time: about 3 hours a week, about 90 hours per stage"],"ar":["How much time is the framework based on?","Section 1, Teaching time: about 3 hours a week, about 90 hours per stage"]},{"en":["What do the technical words mean?","Section 4, Glossary"],"ar":["What do the technical words mean?","Section 4, Glossary"]},{"en":["Which symbols, units and formulae should learners know?","Section 5, Appendix"],"ar":["Which symbols, units and formulae should learners know?","Section 5, Appendix"]},{"en":["What changed in the latest version?","Section 6, Changes to this curriculum framework"],"ar":["What changed in the latest version?","Section 6, Changes to this curriculum framework"]}]}],"checks":[{"id":"m1q1","q":{"en":"What does the framework say about the teaching time it is based on?","ar":"What does the framework say about the teaching time it is based on?"},"opts":[{"en":"About 3 hours of Science per week, or about 90 hours per stage, with actual hours varying by context","ar":"About 3 hours of Science per week, or about 90 hours per stage, with actual hours varying by context"},{"en":"Exactly 3 hours of Science per week, which every school must provide in every stage","ar":"Exactly 3 hours of Science per week, which every school must provide in every stage"},{"en":"About 2 hours of Science per week, or about 60 hours per stage, so that all three stages have equal time","ar":"About 2 hours of Science per week, or about 60 hours per stage, so that all three stages have equal time"},{"en":"About 90 hours over the whole of Stages 7 to 9, shared across the three years","ar":"About 90 hours over the whole of Stages 7 to 9, shared across the three years"}],"correct":0,"expl":{"en":"The framework gives 3 hours per week (about 90 hours per stage) \"for guidance\" and says your actual hours may vary according to your context.","ar":"The framework gives 3 hours per week (about 90 hours per stage) \"for guidance\" and says your actual hours may vary according to your context."}},{"id":"m1q2","q":{"en":"A colleague says all the activities in the Stage 9 scheme of work must be taught. What does the framework say?","ar":"A colleague says all the activities in the Stage 9 scheme of work must be taught. What does the framework say?"},"opts":[{"en":"The schemes of work are compulsory, but the order of the units can be changed to suit the class","ar":"The schemes of work are compulsory, but the order of the units can be changed to suit the class"},{"en":"You do not need to use the scheme of work ideas; they show the types of activity and the depth of each objective","ar":"You do not need to use the scheme of work ideas; they show the types of activity and the depth of each objective"},{"en":"Only activities marked as practical are optional, and all the other activities must be taught in the order shown","ar":"Only activities marked as practical are optional, and all the other activities must be taught in the order shown"},{"en":"They are required for Checkpoint classes and are optional for other year groups only","ar":"They are required for Checkpoint classes and are optional for other year groups only"}],"correct":1,"expl":{"en":"The framework says \"You do not need to use the ideas in the schemes of work\". They indicate activity types and intended depth and breadth, and do not fill all teaching time.","ar":"The framework says \"You do not need to use the ideas in the schemes of work\". They indicate activity types and intended depth and breadth, and do not fill all teaching time."}},{"id":"m1q3","q":{"en":"Which statement about version 3.0 of the framework is correct?","ar":"Which statement about version 3.0 of the framework is correct?"},"opts":[{"en":"It was published in September 2020 and is the first version that set learning objectives","ar":"It was published in September 2020 and is the first version that set learning objectives"},{"en":"It replaced Stages 7 to 9 with new strands, and it removed the glossary and the appendix from the document","ar":"It replaced Stages 7 to 9 with new strands, and it removed the glossary and the appendix from the document"},{"en":"It is the latest version, published February 2026, and it clarified a number of learning objectives","ar":"It is the latest version, published February 2026, and it clarified a number of learning objectives"},{"en":"It was published in August 2021 and only made the document more digitally accessible","ar":"It was published in August 2021 and only made the document more digitally accessible"}],"correct":2,"expl":{"en":"The front page and the Changes section say version 3.0 was published February 2026 and updated objectives to make them clearer. August 2021 was version 2.0.","ar":"The front page and the Changes section say version 3.0 was published February 2026 and updated objectives to make them clearer. August 2021 was version 2.0."}}]},{"id":"m2","title":{"en":"Aims and Learner Attributes in Lower Secondary Science","ar":"Aims and Learner Attributes in Lower Secondary Science"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Before you read a single objective, it helps to know what the whole programme is trying to achieve. The aims of the framework are the \"why\" behind the \"what\". They are also a useful check on your own teaching: if a series of lessons is all facts and no questions, it may be missing some of the aims.","ar":"Before you read a single objective, it helps to know what the whole programme is trying to achieve. The aims of the framework are the \"why\" behind the \"what\". They are also a useful check on your own teaching: if a series of lessons is all facts and no questions, it may be missing some of the aims."}},{"t":"h","c":{"en":"The general aims of Cambridge Lower Secondary","ar":"The general aims of Cambridge Lower Secondary"}},{"t":"p","c":{"en":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning, including:","ar":"The framework says that following the Cambridge Lower Secondary programme helps learners to lay the foundations for lifelong learning, including:"}},{"t":"list","c":{"en":["curiosity about the world around them and enthusiasm for learning;","knowledge, understanding and skills that can be applied in and across subjects;","effective and confident communication skills, including in English;","understanding of their personal and local context, as well as having global awareness."],"ar":["curiosity about the world around them and enthusiasm for learning;","knowledge, understanding and skills that can be applied in and across subjects;","effective and confident communication skills, including in English;","understanding of their personal and local context, as well as having global awareness."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: the third aim matters for PEPS","ar":"Good practice: the third aim matters for PEPS"},"c":{"en":"The aim \"effective and confident communication skills, including in English\" fits every PEPS science lesson, because every learner is learning English as a second language. Science gives a real reason to use English: describing what happened, giving a reason, comparing two results. Plan these speaking and writing moments on purpose.","ar":"The aim \"effective and confident communication skills, including in English\" fits every PEPS science lesson, because every learner is learning English as a second language. Science gives a real reason to use English: describing what happened, giving a reason, comparing two results. Plan these speaking and writing moments on purpose."}},{"t":"h","c":{"en":"The aims of Cambridge Lower Secondary Science","ar":"The aims of Cambridge Lower Secondary Science"}},{"t":"p","c":{"en":"In Science, the framework says learners:","ar":"In Science, the framework says learners:"}},{"t":"list","c":{"en":["\u003cstrong>build curiosity and fascination\u003c/strong> about the world to stimulate their interest in science;","\u003cstrong>first meet foundational scientific concepts\u003c/strong> that then develop through the Cambridge Pathway;","\u003cstrong>develop their scientific skills\u003c/strong> so they can become increasingly independent when questioning and investigating phenomena;","\u003cstrong>begin to understand that scientific models\u003c/strong> are used to understand and explain phenomena;","\u003cstrong>recognise that scientific understanding changes over time\u003c/strong>;","\u003cstrong>link science to real world contexts\u003c/strong> that are personal, local, national and global, identifying the relevance of science to the modern world."],"ar":["\u003cstrong>build curiosity and fascination\u003c/strong> about the world to stimulate their interest in science;","\u003cstrong>first meet foundational scientific concepts\u003c/strong> that then develop through the Cambridge Pathway;","\u003cstrong>develop their scientific skills\u003c/strong> so they can become increasingly independent when questioning and investigating phenomena;","\u003cstrong>begin to understand that scientific models\u003c/strong> are used to understand and explain phenomena;","\u003cstrong>recognise that scientific understanding changes over time\u003c/strong>;","\u003cstrong>link science to real world contexts\u003c/strong> that are personal, local, national and global, identifying the relevance of science to the modern world."]}},{"t":"p","c":{"en":"Notice the words \"increasingly independent\". Across Stages 7 to 9 you should see learners doing more of the thinking: first following a plan, then choosing equipment, then deciding when to repeat and what to improve. Module 4 shows how the objectives build this independence.","ar":"Notice the words \"increasingly independent\". Across Stages 7 to 9 you should see learners doing more of the thinking: first following a plan, then choosing equipment, then deciding when to repeat and what to improve. Module 4 shows how the objectives build this independence."}},{"t":"h","c":{"en":"The five learner attributes","ar":"The five learner attributes"}},{"t":"p","c":{"en":"The Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. The framework describes each one for science. The table gives the key idea in plain words, with a PEPS-style classroom example. The examples are \u003cem>good practice\u003c/em>, not framework requirements.","ar":"The Cambridge approach encourages learners to be confident, responsible, reflective, innovative and engaged. The framework describes each one for science. The table gives the key idea in plain words, with a PEPS-style classroom example. The examples are \u003cem>good practice\u003c/em>, not framework requirements."}},{"t":"table","head":{"en":["Attribute","In the framework (shortened)","What you might see in class"],"ar":["Attribute","In the framework (shortened)","What you might see in class"]},"rows":[{"en":["Confident","Secure in scientific understanding; ready to challenge their own thinking; able to present findings, defend conclusions and respect those of others","A pair explains to another pair why their cooling curve differs, using the data, and listens when the other pair disagrees"],"ar":["Confident","Secure in scientific understanding; ready to challenge their own thinking; able to present findings, defend conclusions and respect those of others","A pair explains to another pair why their cooling curve differs, using the data, and listens when the other pair disagrees"]},{"en":["Responsible","Responsible for themselves and for working collaboratively; understand that applying science can have impacts on others and the environment","A group agrees roles for a practical, follows the risk assessment and returns the equipment clean"],"ar":["Responsible","Responsible for themselves and for working collaboratively; understand that applying science can have impacts on others and the environment","A group agrees roles for a practical, follows the risk assessment and returns the equipment clean"]},{"en":["Reflective","Review their understanding; concerned with the process of science as well as the products","Learners write one sentence on what they would change in their method, and why"],"ar":["Reflective","Review their understanding; concerned with the process of science as well as the products","Learners write one sentence on what they would change in their method, and why"]},{"en":["Innovative","Use scientific skills and understanding to adapt to new, unfamiliar and future challenges; flexible and critical thinkers","Learners are given an unfamiliar problem, such as keeping a drink cold for one hour, and design their own test"],"ar":["Innovative","Use scientific skills and understanding to adapt to new, unfamiliar and future challenges; flexible and critical thinkers","Learners are given an unfamiliar problem, such as keeping a drink cold for one hour, and design their own test"]},{"en":["Engaged","Curious; keen to develop their ability to do science; use science to make informed choices at personal, local, national and global levels","A learner brings a news item about a local environmental issue and asks what science could help"],"ar":["Engaged","Curious; keen to develop their ability to do science; use science to make informed choices at personal, local, national and global levels","A learner brings a news item about a local environmental issue and asks what science could help"]}]},{"t":"p","c":{"en":"\u003cstrong>Worked example: reading an attribute.\u003c/strong> The framework's description of \"Confident\" includes the phrase \"present their findings and defend their conclusions as well as respect those of others\". Break it into three actions: \u003cem>present\u003c/em>, \u003cem>defend\u003c/em>, \u003cem>respect\u003c/em>. A lesson plan that only lets learners present, and never asks them to give a reason for a conclusion or to listen to a different one, covers only one of the three.","ar":"\u003cstrong>Worked example: reading an attribute.\u003c/strong> The framework's description of \"Confident\" includes the phrase \"present their findings and defend their conclusions as well as respect those of others\". Break it into three actions: \u003cem>present\u003c/em>, \u003cem>defend\u003c/em>, \u003cem>respect\u003c/em>. A lesson plan that only lets learners present, and never asks them to give a reason for a conclusion or to listen to a different one, covers only one of the three."}},{"t":"scenario","title":{"en":"The pupil who does not accept the conclusion","ar":"The pupil who does not accept the conclusion"},"c":{"en":"In a Year 8 lesson, groups test which of three materials is the best thermal insulator. One group's result does not match the prediction of a strong learner, Karim. He says the test is \"wrong\" and wants to repeat it until his chosen material wins. \u003cstrong>What do you do?\u003c/strong> A good response links to the attributes: scientists use evidence even when it surprises them (Confident, Reflective). Ask him what the evidence shows and why the result may have happened. Allow repeat measurements, because 8TWSc.03 is about repeating enough to be reliable, but not to force the answer he wants. Let the class compare results and respect each group's conclusion.","ar":"In a Year 8 lesson, groups test which of three materials is the best thermal insulator. One group's result does not match the prediction of a strong learner, Karim. He says the test is \"wrong\" and wants to repeat it until his chosen material wins. \u003cstrong>What do you do?\u003c/strong> A good response links to the attributes: scientists use evidence even when it surprises them (Confident, Reflective). Ask him what the evidence shows and why the result may have happened. Allow repeat measurements, because 8TWSc.03 is about repeating enough to be reliable, but not to force the answer he wants. Let the class compare results and respect each group's conclusion."}},{"t":"h","c":{"en":"Responsible science teaching: what the framework says","ar":"Responsible science teaching: what the framework says"}},{"t":"p","c":{"en":"The framework includes three statements about how science must be taught. They are not decoration. Read them once carefully and keep them in your department handbook.","ar":"The framework includes three statements about how science must be taught. They are not decoration. Read them once carefully and keep them in your department handbook."}},{"t":"table","head":{"en":["Topic","What the framework says (shortened)","Your responsibility"],"ar":["Topic","What the framework says (shortened)","Your responsibility"]},"rows":[{"en":["Health and safety","Science is a practical subject. Experiments must be conducted with the utmost respect for safety. The teacher in charge must follow national, regional and school regulations and make a risk assessment for the class or individual.","Check the school's rules before any practical. Cambridge does not manage the safety of published experiments; responsibility remains with the school."],"ar":["Health and safety","Science is a practical subject. Experiments must be conducted with the utmost respect for safety. The teacher in charge must follow national, regional and school regulations and make a risk assessment for the class or individual.","Check the school's rules before any practical. Cambridge does not manage the safety of published experiments; responsibility remains with the school."]},{"en":["Animal welfare","Good animal welfare and good science work together. Observe animals responsibly, without distress or harm. Animals brought into school need a suitable environment, diet, normal behaviour and protection from pain, injury, suffering and disease.","There is no requirement for learners to take part in or observe animal dissection; models and diagrams are alternatives to consider."],"ar":["Animal welfare","Good animal welfare and good science work together. Observe animals responsibly, without distress or harm. Animals brought into school need a suitable environment, diet, normal behaviour and protection from pain, injury, suffering and disease.","There is no requirement for learners to take part in or observe animal dissection; models and diagrams are alternatives to consider."]},{"en":["Human reproduction","Schools are expected to have their own sex education policy. The framework is factual and covers genetics, inheritance, fusion of gametes and fetal development. It does not address attitudes and values.","Follow your school's policy and your HOD's guidance, and teach the factual objectives only as the framework words them."],"ar":["Human reproduction","Schools are expected to have their own sex education policy. The framework is factual and covers genetics, inheritance, fusion of gametes and fetal development. It does not address attitudes and values.","Follow your school's policy and your HOD's guidance, and teach the factual objectives only as the framework words them."]}]},{"t":"callout","k":"warn","title":{"en":"If you decide to include dissection","ar":"If you decide to include dissection"},"c":{"en":"The framework says animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier, and that neither you nor learners should kill animals for dissection. It gives storage rules: fresh material at 5 °C or below, frozen material defrosted slowly at 5 °C without direct heat, and all fresh or defrosted material used within 2 days. Preserved material needs gloves and a well-ventilated room. Check with your HOD and the school before planning any dissection.","ar":"The framework says animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier, and that neither you nor learners should kill animals for dissection. It gives storage rules: fresh material at 5 °C or below, frozen material defrosted slowly at 5 °C without direct heat, and all fresh or defrosted material used within 2 days. Preserved material needs gloves and a well-ventilated room. Check with your HOD and the school before planning any dissection."}},{"t":"h","c":{"en":"Three strand categories, one holistic course","ar":"Three strand categories, one holistic course"}},{"t":"p","c":{"en":"The framework's teaching-approaches section says the three kinds of strand are \"designed to support each other in every stage of learning\". Learners can develop skills from Thinking and Working Scientifically while they learn content from the four content strands, and the content can be taught through contexts supported by Science in Context. For example, a lesson on respiration (content) can include planning a fair investigation (skill) set in the context of an athlete's training (context). Module 3 shows how the strands are organised.","ar":"The framework's teaching-approaches section says the three kinds of strand are \"designed to support each other in every stage of learning\". Learners can develop skills from Thinking and Working Scientifically while they learn content from the four content strands, and the content can be taught through contexts supported by Science in Context. For example, a lesson on respiration (content) can include planning a fair investigation (skill) set in the context of an athlete's training (context). Module 3 shows how the strands are organised."}},{"t":"scenario","title":{"en":"A lesson that is all content","ar":"A lesson that is all content"},"c":{"en":"A colleague has planned a Year 9 unit on rates of reaction. It has five lessons of notes and one practical, and no discussion of why scientists trust or doubt a result. \u003cstrong>What could you suggest?\u003c/strong> A good answer links to the aims: add a short investigation where learners plan how to test one factor and decide how many repeats are needed (skills, increasingly independent), and add one lesson on a real use, such as why food keeps longer when cold (context). Keep every content objective the unit already covers.","ar":"A colleague has planned a Year 9 unit on rates of reaction. It has five lessons of notes and one practical, and no discussion of why scientists trust or doubt a result. \u003cstrong>What could you suggest?\u003c/strong> A good answer links to the aims: add a short investigation where learners plan how to test one factor and decide how many repeats are needed (skills, increasingly independent), and add one lesson on a real use, such as why food keeps longer when cold (context). Keep every content objective the unit already covers."}}],"checks":[{"id":"m2q1","q":{"en":"Which of these is named in the general aims of Cambridge Lower Secondary?","ar":"Which of these is named in the general aims of Cambridge Lower Secondary?"},"opts":[{"en":"Fluency in scientific terms before learners begin any practical work","ar":"Fluency in scientific terms before learners begin any practical work"},{"en":"Early preparation for external examinations in every subject at Stage 7","ar":"Early preparation for external examinations in every subject at Stage 7"},{"en":"Knowledge that stays within one subject and is not applied across subjects","ar":"Knowledge that stays within one subject and is not applied across subjects"},{"en":"Effective and confident communication skills, including in English","ar":"Effective and confident communication skills, including in English"}],"correct":3,"expl":{"en":"The framework's general aims include \"effective and confident communication skills, including in English\".","ar":"The framework's general aims include \"effective and confident communication skills, including in English\"."}},{"id":"m2q2","q":{"en":"A learner defends a conclusion with data and then listens carefully to a group that disagrees. Which attribute does the framework link to this?","ar":"A learner defends a conclusion with data and then listens carefully to a group that disagrees. Which attribute does the framework link to this?"},"opts":[{"en":"Confident, because learners present findings, defend conclusions and respect those of others","ar":"Confident, because learners present findings, defend conclusions and respect those of others"},{"en":"Innovative, because learners adapt to unfamiliar and future challenges by using their science skills","ar":"Innovative, because learners adapt to unfamiliar and future challenges by using their science skills"},{"en":"Responsible, because learners work collaboratively with others when they investigate science, and keep safe","ar":"Responsible, because learners work collaboratively with others when they investigate science, and keep safe"},{"en":"Engaged, because learners are curious and want to deepen their understanding","ar":"Engaged, because learners are curious and want to deepen their understanding"}],"correct":0,"expl":{"en":"The Confident description includes presenting findings, defending conclusions and respecting the conclusions of others.","ar":"The Confident description includes presenting findings, defending conclusions and respecting the conclusions of others."}},{"id":"m2q3","q":{"en":"What does the framework say about animal dissection in Cambridge Lower Secondary Science?","ar":"What does the framework say about animal dissection in Cambridge Lower Secondary Science?"},"opts":[{"en":"It is required in Stage 8 so that learners can study the human respiratory system","ar":"It is required in Stage 8 so that learners can study the human respiratory system"},{"en":"There is no requirement for learners to take part in or observe it, and models are an alternative","ar":"There is no requirement for learners to take part in or observe it, and models are an alternative"},{"en":"It is recommended in Stage 7 and Stage 9 for all learners, but may be replaced by diagrams in Stage 8 only","ar":"It is recommended in Stage 7 and Stage 9 for all learners, but may be replaced by diagrams in Stage 8 only"},{"en":"It is allowed only when learners kill the animal themselves under close supervision","ar":"It is allowed only when learners kill the animal themselves under close supervision"}],"correct":1,"expl":{"en":"The framework says there is no requirement for dissection, lists alternatives such as models and diagrams, and says neither teachers nor learners should kill animals for dissection.","ar":"The framework says there is no requirement for dissection, lists alternatives such as models and diagrams, and says neither teachers nor learners should kill animals for dissection."}}]},{"id":"m3","title":{"en":"How the Framework Is Organised: Strands, Codes and Progression","ar":"How the Framework Is Organised: Strands, Codes and Progression"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A framework is only useful if you can find your way around it quickly. This module shows the structure: three kinds of strand, sub-strands within each strand, and a code for every learning objective. After this module you should be able to open the framework at any page and say exactly what you are looking at.","ar":"A framework is only useful if you can find your way around it quickly. This module shows the structure: three kinds of strand, sub-strands within each strand, and a code for every learning objective. After this module you should be able to open the framework at any page and say exactly what you are looking at."}},{"t":"h","c":{"en":"Three categories of strand","ar":"Three categories of strand"}},{"t":"p","c":{"en":"The framework divides its learning objectives into main areas called \u003cstrong>strands\u003c/strong>, which \"run through every lower secondary stage\". Each strand is divided into \u003cstrong>sub-strands\u003c/strong>, which are \"based around the key concepts of each strand\", help to show progression and are useful when designing long-term plans, medium-term plans and other teaching resources. There are three categories of strand:","ar":"The framework divides its learning objectives into main areas called \u003cstrong>strands\u003c/strong>, which \"run through every lower secondary stage\". Each strand is divided into \u003cstrong>sub-strands\u003c/strong>, which are \"based around the key concepts of each strand\", help to show progression and are useful when designing long-term plans, medium-term plans and other teaching resources. There are three categories of strand:"}},{"t":"table","head":{"en":["Category","Strand","What it is about (framework wording shortened)"],"ar":["Category","Strand","What it is about (framework wording shortened)"]},"rows":[{"en":["Skills strand","Thinking and Working Scientifically","Scientific skills: models and representations, scientific enquiry, and practical work"],"ar":["Skills strand","Thinking and Working Scientifically","Scientific skills: models and representations, scientific enquiry, and practical work"]},{"en":["Content strands","Biology","The study of living things and how they interact: life processes, cells and systems, ecosystems"],"ar":["Content strands","Biology","The study of living things and how they interact: life processes, cells and systems, ecosystems"]},{"en":["Content strands","Chemistry","The study of matter: atoms, elements and compounds, how substances interact and their properties"],"ar":["Content strands","Chemistry","The study of matter: atoms, elements and compounds, how substances interact and their properties"]},{"en":["Content strands","Physics","The study of the interaction of matter and energy: energy and forces, light and sound, magnets and electromagnets"],"ar":["Content strands","Physics","The study of the interaction of matter and energy: energy and forces, light and sound, magnets and electromagnets"]},{"en":["Content strands","Earth and Space","The planet Earth, the wider Solar System and beyond: Earth's structure, atmosphere and climate, the universe"],"ar":["Content strands","Earth and Space","The planet Earth, the wider Solar System and beyond: Earth's structure, atmosphere and climate, the universe"]},{"en":["Context strand","Science in Context","Statements to help learners study the other five strands in a context relevant to them"],"ar":["Context strand","Science in Context","Statements to help learners study the other five strands in a context relevant to them"]}]},{"t":"p","c":{"en":"So there are six strands in all. This framework has an Earth and Space content strand alongside Biology, Chemistry and Physics, so a Stage 7 to 9 course covers four content areas, not three.","ar":"So there are six strands in all. This framework has an Earth and Space content strand alongside Biology, Chemistry and Physics, so a Stage 7 to 9 course covers four content areas, not three."}},{"t":"h","c":{"en":"The sub-strands","ar":"The sub-strands"}},{"t":"p","c":{"en":"Every stage uses the same sub-strands. This is what makes progression easy to follow: you can read down one sub-strand from Stage 7 to Stage 9.","ar":"Every stage uses the same sub-strands. This is what makes progression easy to follow: you can read down one sub-strand from Stage 7 to Stage 9."}},{"t":"table","head":{"en":["Strand","Sub-strands","Code letters"],"ar":["Strand","Sub-strands","Code letters"]},"rows":[{"en":["Thinking and Working Scientifically","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions","TWSm, TWSp, TWSc, TWSa"],"ar":["Thinking and Working Scientifically","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions","TWSm, TWSp, TWSc, TWSa"]},{"en":["Biology","Structure and function; Life processes; Ecosystems","Bs, Bp, Be"],"ar":["Biology","Structure and function; Life processes; Ecosystems","Bs, Bp, Be"]},{"en":["Chemistry","Materials and their structure; Properties of materials; Changes to materials","Cm, Cp, Cc"],"ar":["Chemistry","Materials and their structure; Properties of materials; Changes to materials","Cm, Cp, Cc"]},{"en":["Physics","Forces and energy; Light and sound; Electricity and magnetism","Pf, Ps, Pe"],"ar":["Physics","Forces and energy; Light and sound; Electricity and magnetism","Pf, Ps, Pe"]},{"en":["Earth and Space","Planet Earth; Cycles on Earth; Earth in space","ESp, ESc, ESs"],"ar":["Earth and Space","Planet Earth; Cycles on Earth; Earth in space","ESp, ESc, ESs"]},{"en":["Science in Context","No separate sub-strands: one list of five statements per stage","SIC"],"ar":["Science in Context","No separate sub-strands: one list of five statements per stage","SIC"]}]},{"t":"h","c":{"en":"How to read a learning-objective code","ar":"How to read a learning-objective code"}},{"t":"p","c":{"en":"The framework says each learning objective has a unique code, for example \u003cstrong>9Bs.01\u003c/strong>. These codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Each code includes three parts:","ar":"The framework says each learning objective has a unique code, for example \u003cstrong>9Bs.01\u003c/strong>. These codes appear in the schemes of work, the teacher guide and other Cambridge Lower Secondary resources. Each code includes three parts:"}},{"t":"list","c":{"en":["\u003cstrong>the stage number\u003c/strong>, for example 9;","\u003cstrong>a reporting code\u003c/strong> that appears in the feedback reports for tests and reflects the sub-strand titles, for example Bs;","\u003cstrong>a number\u003c/strong> reflecting the order of the objectives in the sub-strand for that stage, for example 01 is the first objective."],"ar":["\u003cstrong>the stage number\u003c/strong>, for example 9;","\u003cstrong>a reporting code\u003c/strong> that appears in the feedback reports for tests and reflects the sub-strand titles, for example Bs;","\u003cstrong>a number\u003c/strong> reflecting the order of the objectives in the sub-strand for that stage, for example 01 is the first objective."]}},{"t":"table","head":{"en":["Code","Stage","Strand and sub-strand","Number","What it says (shortened)"],"ar":["Code","Stage","Strand and sub-strand","Number","What it says (shortened)"]},"rows":[{"en":["9Bs.01","9","Biology, Structure and function","01","Describe the pathway of water and mineral salts from roots to leaves in flowering plants"],"ar":["9Bs.01","9","Biology, Structure and function","01","Describe the pathway of water and mineral salts from roots to leaves in flowering plants"]},{"en":["7Cp.03","7","Chemistry, Properties of materials","03","Use indicators such as Universal Indicator and litmus to tell acidic, alkaline and neutral solutions apart"],"ar":["7Cp.03","7","Chemistry, Properties of materials","03","Use indicators such as Universal Indicator and litmus to tell acidic, alkaline and neutral solutions apart"]},{"en":["8Pf.01","8","Physics, Forces and energy","01","Calculate speed"],"ar":["8Pf.01","8","Physics, Forces and energy","01","Calculate speed"]},{"en":["7ESs.04","7","Earth and Space, Earth in space","04","Explain how solar and lunar eclipses happen"],"ar":["7ESs.04","7","Earth and Space, Earth in space","04","Explain how solar and lunar eclipses happen"]},{"en":["8TWSp.05","8","Thinking and Working Scientifically, purpose and planning","05","Make risk assessments for practical work to identify and control risks"],"ar":["8TWSp.05","8","Thinking and Working Scientifically, purpose and planning","05","Make risk assessments for practical work to identify and control risks"]}]},{"t":"callout","k":"tip","title":{"en":"Note: the number is an order, not a level of difficulty","ar":"Note: the number is an order, not a level of difficulty"},"c":{"en":"The final number only says the order of objectives in that sub-strand for that stage. 9Bp.08 is not \"harder\" than 9Bp.01 because of its number. Also note that a code such as 7Cp.03 can only be found in Stage 7. The same idea at another stage has a different first digit.","ar":"The final number only says the order of objectives in that sub-strand for that stage. 9Bp.08 is not \"harder\" than 9Bp.01 because of its number. Also note that a code such as 7Cp.03 can only be found in Stage 7. The same idea at another stage has a different first digit."}},{"t":"p","c":{"en":"\u003cstrong>Worked example.\u003c/strong> Your HOD writes: \"Please make sure 8Cc.03 is in the spring unit.\" Read the code: Stage 8, Chemistry, Changes to materials, objective 03. Open the Stage 8 page. It says: describe the reactivity of metals (limited to sodium, potassium, calcium, magnesium, zinc, iron, copper, gold and silver) with oxygen, water and dilute acids. Now you can check whether your unit plan has an activity, such as testing metals in dilute acid, and tell your HOD where it is.","ar":"\u003cstrong>Worked example.\u003c/strong> Your HOD writes: \"Please make sure 8Cc.03 is in the spring unit.\" Read the code: Stage 8, Chemistry, Changes to materials, objective 03. Open the Stage 8 page. It says: describe the reactivity of metals (limited to sodium, potassium, calcium, magnesium, zinc, iron, copper, gold and silver) with oxygen, water and dilute acids. Now you can check whether your unit plan has an activity, such as testing metals in dilute acid, and tell your HOD where it is."}},{"t":"callout","k":"warn","title":{"en":"A printing detail to be aware of","ar":"A printing detail to be aware of"},"c":{"en":"In the copy of the framework used for this CPD, one objective in the Stage 8 list is printed as 8TSWa.05, with the letters S and W swapped. It sits in the sub-strand \"Scientific enquiry: analysis, evaluation and conclusions\" and follows 8TWSa.04, so it is the fifth objective there, 8TWSa.05. Version 2.0 had already corrected the code for 7TWSa.05, so check your own copy and use the pattern TWSa.","ar":"In the copy of the framework used for this CPD, one objective in the Stage 8 list is printed as 8TSWa.05, with the letters S and W swapped. It sits in the sub-strand \"Scientific enquiry: analysis, evaluation and conclusions\" and follows 8TWSa.04, so it is the fifth objective there, 8TWSa.05. Version 2.0 had already corrected the code for 7TWSa.05, so check your own copy and use the pattern TWSa."}},{"t":"h","c":{"en":"Progression across Stages 7 to 9","ar":"Progression across Stages 7 to 9"}},{"t":"p","c":{"en":"The framework says that all the learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\". It adds that to teach effectively you need to be familiar with the progression of skills across stages, and that the progression of learning objectives across Stages 7 to 9 is available on the School Support Hub.","ar":"The framework says that all the learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\". It adds that to teach effectively you need to be familiar with the progression of skills across stages, and that the progression of learning objectives across Stages 7 to 9 is available on the School Support Hub."}},{"t":"table","head":{"en":["Strand","Stage 7 objectives","Stage 8 objectives","Stage 9 objectives"],"ar":["Strand","Stage 7 objectives","Stage 8 objectives","Stage 9 objectives"]},"rows":[{"en":["Thinking and Working Scientifically","19","20","20"],"ar":["Thinking and Working Scientifically","19","20","20"]},{"en":["Biology","11","12","12"],"ar":["Biology","11","12","12"]},{"en":["Chemistry","18","12","14"],"ar":["Chemistry","18","12","14"]},{"en":["Physics","11","14","12"],"ar":["Physics","11","14","12"]},{"en":["Earth and Space","8","7","7"],"ar":["Earth and Space","8","7","7"]},{"en":["Science in Context","5","5","5"],"ar":["Science in Context","5","5","5"]},{"en":["Total","72","70","70"],"ar":["Total","72","70","70"]}]},{"t":"p","c":{"en":"The numbers are counts from the framework text, so they are useful for a feel of balance, not for judging how long a topic takes. For example, Stage 7 has many Chemistry objectives (18), mostly about atoms, matter and properties. Stage 8 has more Physics (14), many of them about forces and light. Stage 9 has the most Biology objectives in Life processes (8), including genetics and photosynthesis. Do not use counts to decide how many lessons each strand gets; use the objectives, the teaching time (about 90 hours per stage) and your HOD's long-term plan.","ar":"The numbers are counts from the framework text, so they are useful for a feel of balance, not for judging how long a topic takes. For example, Stage 7 has many Chemistry objectives (18), mostly about atoms, matter and properties. Stage 8 has more Physics (14), many of them about forces and light. Stage 9 has the most Biology objectives in Life processes (8), including genetics and photosynthesis. Do not use counts to decide how many lessons each strand gets; use the objectives, the teaching time (about 90 hours per stage) and your HOD's long-term plan."}},{"t":"h","c":{"en":"Reading across: same words, different stage","ar":"Reading across: same words, different stage"}},{"t":"p","c":{"en":"Some TWS objectives repeat almost word for word in Stages 7, 8 and 9, for example \"Make predictions of likely outcomes for a scientific enquiry based on scientific knowledge and understanding\" (7TWSp.03, 8TWSp.03 and 9TWSp.03). The skill is expected again each year, in new content. Others change in wording to show a step up: 7TWSp.05 is about knowing the meaning of hazard symbols, and 8TWSp.05 and 9TWSp.05 are about making risk assessments. When you plan, compare the wording of the same sub-strand number across the three stages and ask: what is new?","ar":"Some TWS objectives repeat almost word for word in Stages 7, 8 and 9, for example \"Make predictions of likely outcomes for a scientific enquiry based on scientific knowledge and understanding\" (7TWSp.03, 8TWSp.03 and 9TWSp.03). The skill is expected again each year, in new content. Others change in wording to show a step up: 7TWSp.05 is about knowing the meaning of hazard symbols, and 8TWSp.05 and 9TWSp.05 are about making risk assessments. When you plan, compare the wording of the same sub-strand number across the three stages and ask: what is new?"}},{"t":"scenario","title":{"en":"Planning from a code","ar":"Planning from a code"},"c":{"en":"A new teacher says \"I have 7Be.02 in my plan. Is that a Biology topic about cells?\" \u003cstrong>How would you answer?\u003c/strong> A good answer: read the code. Stage 7, Biology, sub-strand Be (Ecosystems), objective 02. It is about constructing and interpreting food chains and webs that include microorganisms as decomposers. It is not about cells; cells are in the sub-strand Bs (Structure and function). The letters after the stage number tell you the sub-strand.","ar":"A new teacher says \"I have 7Be.02 in my plan. Is that a Biology topic about cells?\" \u003cstrong>How would you answer?\u003c/strong> A good answer: read the code. Stage 7, Biology, sub-strand Be (Ecosystems), objective 02. It is about constructing and interpreting food chains and webs that include microorganisms as decomposers. It is not about cells; cells are in the sub-strand Bs (Structure and function). The letters after the stage number tell you the sub-strand."}}],"checks":[{"id":"m3q1","q":{"en":"What do the letters \"Pe\" in the code 8Pe.02 stand for?","ar":"What do the letters \"Pe\" in the code 8Pe.02 stand for?"},"opts":[{"en":"The Planet Earth sub-strand within Earth and Space, which has the code ESp","ar":"The Planet Earth sub-strand within Earth and Space, which has the code ESp"},{"en":"The Properties of materials sub-strand within Chemistry, which has the code Cp","ar":"The Properties of materials sub-strand within Chemistry, which has the code Cp"},{"en":"The Electricity and magnetism sub-strand within Physics","ar":"The Electricity and magnetism sub-strand within Physics"},{"en":"The Practical enquiry sub-strand within Thinking and Working Scientifically","ar":"The Practical enquiry sub-strand within Thinking and Working Scientifically"}],"correct":2,"expl":{"en":"Pf, Ps and Pe are the Physics sub-strand codes: Forces and energy, Light and sound, and Electricity and magnetism.","ar":"Pf, Ps and Pe are the Physics sub-strand codes: Forces and energy, Light and sound, and Electricity and magnetism."}},{"id":"m3q2","q":{"en":"Which of these is a correct reading of the code 9Cc.04?","ar":"Which of these is a correct reading of the code 9Cc.04?"},"opts":[{"en":"Stage 9, Chemistry, Properties of materials, the fourth objective in that sub-strand","ar":"Stage 9, Chemistry, Properties of materials, the fourth objective in that sub-strand"},{"en":"Stage 9, Chemistry, Changes to materials, the fourth most difficult objective","ar":"Stage 9, Chemistry, Changes to materials, the fourth most difficult objective"},{"en":"Stage 9, Biology, Cells and chemistry, the fourth objective in the stage","ar":"Stage 9, Biology, Cells and chemistry, the fourth objective in the stage"},{"en":"Stage 9, Chemistry, Changes to materials, the fourth objective","ar":"Stage 9, Chemistry, Changes to materials, the fourth objective"}],"correct":3,"expl":{"en":"The first digit is the stage, Cc is the reporting code for Chemistry: Changes to materials, and 04 is the order of the objective in that sub-strand for the stage.","ar":"The first digit is the stage, Cc is the reporting code for Chemistry: Changes to materials, and 04 is the order of the objective in that sub-strand for the stage."}},{"id":"m3q3","q":{"en":"Which strand category is Science in Context?","ar":"Which strand category is Science in Context?"},"opts":[{"en":"The context strand, which helps learners study the other five strands in a relevant context","ar":"The context strand, which helps learners study the other five strands in a relevant context"},{"en":"A content strand, which covers the study of the planet Earth, the Solar System and the universe beyond it","ar":"A content strand, which covers the study of the planet Earth, the Solar System and the universe beyond it"},{"en":"The skills strand, which covers models, enquiry and practical work","ar":"The skills strand, which covers models, enquiry and practical work"},{"en":"A reporting strand, which is used only in Checkpoint feedback and in reports","ar":"A reporting strand, which is used only in Checkpoint feedback and in reports"}],"correct":0,"expl":{"en":"The framework names three categories: a skills strand, content strands, and a context strand, Science in Context.","ar":"The framework names three categories: a skills strand, content strands, and a context strand, Science in Context."}}]},{"id":"m4","title":{"en":"Thinking and Working Scientifically, and Science in Context","ar":"Thinking and Working Scientifically, and Science in Context"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Two strands are different from the four content strands. \u003cstrong>Thinking and Working Scientifically (TWS)\u003c/strong> is the skills strand, and \u003cstrong>Science in Context (SIC)\u003c/strong> is the context strand. Neither is a \"topic\" that you teach in a block and then finish. The framework says the strands support each other in every stage, so these two strands are taught \u003cem>through\u003c/em> Biology, Chemistry, Physics and Earth and Space.","ar":"Two strands are different from the four content strands. \u003cstrong>Thinking and Working Scientifically (TWS)\u003c/strong> is the skills strand, and \u003cstrong>Science in Context (SIC)\u003c/strong> is the context strand. Neither is a \"topic\" that you teach in a block and then finish. The framework says the strands support each other in every stage, so these two strands are taught \u003cem>through\u003c/em> Biology, Chemistry, Physics and Earth and Space."}},{"t":"h","c":{"en":"The three core approaches in TWS","ar":"The three core approaches in TWS"}},{"t":"table","head":{"en":["Approach","What the framework says (shortened)","Sub-strand codes"],"ar":["Approach","What the framework says (shortened)","Sub-strand codes"]},"rows":[{"en":["Models and representations","Scientists use models and representations to show objects, systems and processes, especially ideas that are not visible or are abstract, and use them to make predictions or explain observations","TWSm"],"ar":["Models and representations","Scientists use models and representations to show objects, s
