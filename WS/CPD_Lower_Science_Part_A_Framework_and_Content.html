ystems and processes, especially ideas that are not visible or are abstract, and use them to make predictions or explain observations","TWSm"]},{"en":["Scientific enquiry","Skills around the purpose and planning of experiments and investigations, evidence collection, analysis, evaluations and conclusions","TWSp, TWSc, TWSa"],"ar":["Scientific enquiry","Skills around the purpose and planning of experiments and investigations, evidence collection, analysis, evaluations and conclusions","TWSp, TWSc, TWSa"]},{"en":["Practical work","Skills of observation, measurement and equipment handling, to collect accurate and reliable data","Mostly TWSc"],"ar":["Practical work","Skills of observation, measurement and equipment handling, to collect accurate and reliable data","Mostly TWSc"]}]},{"t":"p","c":{"en":"Notice that \"scientific enquiry\" is split into three sub-strands: \u003cstrong>purpose and planning\u003c/strong> (TWSp), \u003cstrong>carrying out\u003c/strong> (TWSc) and \u003cstrong>analysis, evaluation and conclusions\u003c/strong> (TWSa). Together they follow the life of an investigation: plan it, do it, make sense of it.","ar":"Notice that \"scientific enquiry\" is split into three sub-strands: \u003cstrong>purpose and planning\u003c/strong> (TWSp), \u003cstrong>carrying out\u003c/strong> (TWSc) and \u003cstrong>analysis, evaluation and conclusions\u003c/strong> (TWSa). Together they follow the life of an investigation: plan it, do it, make sense of it."}},{"t":"h","c":{"en":"Models and representations across Stages 7 to 9","ar":"Models and representations across Stages 7 to 9"}},{"t":"table","head":{"en":["Stage","Objectives (shortened)","What changes"],"ar":["Stage","Objectives (shortened)","What changes"]},"rows":[{"en":["7","7TWSm.01 describe the strengths and limitations of a model; 7TWSm.02 use symbols and formulae to represent scientific ideas","Learners judge a model and begin to use symbols and formulae"],"ar":["7","7TWSm.01 describe the strengths and limitations of a model; 7TWSm.02 use symbols and formulae to represent scientific ideas","Learners judge a model and begin to use symbols and formulae"]},{"en":["8","8TWSm.01 describe what an analogy is and how it can be used as a model; 8TWSm.02 use an existing analogy for a purpose; 8TWSm.03 use symbols and formulae","Analogies are introduced as a kind of model"],"ar":["8","8TWSm.01 describe what an analogy is and how it can be used as a model; 8TWSm.02 use an existing analogy for a purpose; 8TWSm.03 use symbols and formulae","Analogies are introduced as a kind of model"]},{"en":["9","9TWSm.01 understand that models and analogies reflect current evidence and can change; 9TWSm.02 describe some important models and discuss strengths and limitations; 9TWSm.03 symbols and formulae, including dot-and-cross diagrams","Models are linked to evidence and change over time; dot-and-cross diagrams are added"],"ar":["9","9TWSm.01 understand that models and analogies reflect current evidence and can change; 9TWSm.02 describe some important models and discuss strengths and limitations; 9TWSm.03 symbols and formulae, including dot-and-cross diagrams","Models are linked to evidence and change over time; dot-and-cross diagrams are added"]}]},{"t":"p","c":{"en":"\u003cstrong>Worked example (Stage 7, 7TWSm.01).\u003c/strong> Learners use coloured balls to model particles in a solid, a liquid and a gas. Ask: \"What does this model show well? What does it get wrong?\" A good learner answer: it shows that particles are closer in a solid, but the balls are big and the real particles are not coloured. That is a strength and a limitation. The same activity at Stage 9 can lead to 9TWSm.01: the model we use now reflects current evidence and may change.","ar":"\u003cstrong>Worked example (Stage 7, 7TWSm.01).\u003c/strong> Learners use coloured balls to model particles in a solid, a liquid and a gas. Ask: \"What does this model show well? What does it get wrong?\" A good learner answer: it shows that particles are closer in a solid, but the balls are big and the real particles are not coloured. That is a strength and a limitation. The same activity at Stage 9 can lead to 9TWSm.01: the model we use now reflects current evidence and may change."}},{"t":"h","c":{"en":"Scientific enquiry across Stages 7 to 9","ar":"Scientific enquiry across Stages 7 to 9"}},{"t":"table","head":{"en":["Sub-strand","Stage 7","Stage 8","Stage 9"],"ar":["Sub-strand","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Purpose and planning","5 objectives: identify whether a hypothesis is testable; plan a range of investigations and recognise not all are fair tests; know the meaning of hazard symbols (7TWSp.05)","Same first four ideas; 8TWSp.05 is now about making risk assessments for practical work","9TWSp.01 suggest a testable hypothesis; 9TWSp.02 unexpected results leading to improved understanding; 9TWSp.05 risk assessments"],"ar":["Purpose and planning","5 objectives: identify whether a hypothesis is testable; plan a range of investigations and recognise not all are fair tests; know the meaning of hazard symbols (7TWSp.05)","Same first four ideas; 8TWSp.05 is now about making risk assessments for practical work","9TWSp.01 suggest a testable hypothesis; 9TWSp.02 unexpected results leading to improved understanding; 9TWSp.05 risk assessments"]},{"en":["Carrying out","7 objectives, for example 7TWSc.03 evaluate whether measurements have been repeated sufficiently to be reliable","Same ideas; 8TWSc.05 practical work is safe, supported by risk assessments where appropriate","9TWSc.03 decide when to increase the range and the repetition; 9TWSc.06 make an informed decision whether to use first-hand or secondary evidence"],"ar":["Carrying out","7 objectives, for example 7TWSc.03 evaluate whether measurements have been repeated sufficiently to be reliable","Same ideas; 8TWSc.05 practical work is safe, supported by risk assessments where appropriate","9TWSc.03 decide when to increase the range and the repetition; 9TWSc.06 make an informed decision whether to use first-hand or secondary evidence"]},{"en":["Analysis, evaluation and conclusions","7TWSa.02 describe trends and patterns, including anomalous results; 7TWSa.03 make conclusions and explain their limitations","Same wording as Stage 7 for objectives 01 to 04","9TWSa.01 evaluate the strength of the evidence; 9TWSa.02 suggest why results are anomalous; 9TWSa.05 predict results between data points"],"ar":["Analysis, evaluation and conclusions","7TWSa.02 describe trends and patterns, including anomalous results; 7TWSa.03 make conclusions and explain their limitations","Same wording as Stage 7 for objectives 01 to 04","9TWSa.01 evaluate the strength of the evidence; 9TWSa.02 suggest why results are anomalous; 9TWSa.05 predict results between data points"]}]},{"t":"p","c":{"en":"Look at the pattern. Stage 7 and Stage 8 repeat many TWS objectives, so these skills are \u003cem>practised again\u003c/em> in new content. Stage 9 moves from describing to \u003cem>judging\u003c/em>: learners evaluate the strength of evidence (9TWSa.01), suggest \u003cem>why\u003c/em> a result is anomalous (9TWSa.02) and decide \u003cem>when\u003c/em> to repeat more (9TWSc.03).","ar":"Look at the pattern. Stage 7 and Stage 8 repeat many TWS objectives, so these skills are \u003cem>practised again\u003c/em> in new content. Stage 9 moves from describing to \u003cem>judging\u003c/em>: learners evaluate the strength of evidence (9TWSa.01), suggest \u003cem>why\u003c/em> a result is anomalous (9TWSa.02) and decide \u003cem>when\u003c/em> to repeat more (9TWSc.03)."}},{"t":"callout","k":"tip","title":{"en":"Good practice: one skill focus per practical","ar":"Good practice: one skill focus per practical"},"c":{"en":"With 25 to 30 learners and a short lesson, choose one TWS objective as the focus of each practical and tell learners what it is. For example: \"Today we are practising 8TWSc.04, accurate and precise measurements: you must be able to say why accuracy matters.\" Marking and feedback can then target that one skill.","ar":"With 25 to 30 learners and a short lesson, choose one TWS objective as the focus of each practical and tell learners what it is. For example: \"Today we are practising 8TWSc.04, accurate and precise measurements: you must be able to say why accuracy matters.\" Marking and feedback can then target that one skill."}},{"t":"scenario","title":{"en":"Anomalous results","ar":"Anomalous results"},"c":{"en":"In a Year 9 practical on the rate of reaction, one group has a result that does not fit the pattern. A learner wants to delete it. \u003cstrong>What do you do?\u003c/strong> A good response: do not delete it. 9TWSa.02 asks learners to identify an anomalous result \u003cem>and suggest why\u003c/em> it is anomalous, such as a measuring error or a different surface area. Link to 9TWSc.03: could the group repeat that measurement? Then record both the anomaly and the explanation in the report.","ar":"In a Year 9 practical on the rate of reaction, one group has a result that does not fit the pattern. A learner wants to delete it. \u003cstrong>What do you do?\u003c/strong> A good response: do not delete it. 9TWSa.02 asks learners to identify an anomalous result \u003cem>and suggest why\u003c/em> it is anomalous, such as a measuring error or a different surface area. Link to 9TWSc.03: could the group repeat that measurement? Then record both the anomaly and the explanation in the report."}},{"t":"h","c":{"en":"Science in Context (SIC)","ar":"Science in Context (SIC)"}},{"t":"p","c":{"en":"The framework describes this strand as \"a framework of statements\" that helps learners study the objectives of the other five strands in a context relevant to them. Learners link ideas from the classroom to scientists and their work, science phenomena, and ideas and events relevant to their age and experience. In lower secondary, learners \"should start to consider the wider role and impact of science at a regional, national, international and global level\".","ar":"The framework describes this strand as \"a framework of statements\" that helps learners study the objectives of the other five strands in a context relevant to them. Learners link ideas from the classroom to scientists and their work, science phenomena, and ideas and events relevant to their age and experience. In lower secondary, learners \"should start to consider the wider role and impact of science at a regional, national, international and global level\"."}},{"t":"p","c":{"en":"There are five SIC objectives at each stage, and they are written in almost the same words in Stage 7, 8 and 9:","ar":"There are five SIC objectives at each stage, and they are written in almost the same words in Stage 7, 8 and 9:"}},{"t":"table","head":{"en":["Code pattern","What it says (shortened)"],"ar":["Code pattern","What it says (shortened)"]},"rows":[{"en":["7SIC.01 / 8SIC.01 / 9SIC.01","Discuss how scientific knowledge is developed through collective understanding and scrutiny over time"],"ar":["7SIC.01 / 8SIC.01 / 9SIC.01","Discuss how scientific knowledge is developed through collective understanding and scrutiny over time"]},{"en":[".02","Describe how science is applied across societies and industries, and in research"],"ar":[".02","Describe how science is applied across societies and industries, and in research"]},{"en":[".03","Evaluate issues which involve and/or require scientific understanding"],"ar":[".03","Evaluate issues which involve and/or require scientific understanding"]},{"en":[".04","Describe how people develop and use scientific understanding, as individuals and through collaboration, for example peer-review"],"ar":[".04","Describe how people develop and use scientific understanding, as individuals and through collaboration, for example peer-review"]},{"en":[".05","Discuss how the uses of science can have a global environmental impact"],"ar":[".05","Discuss how the uses of science can have a global environmental impact"]}]},{"t":"p","c":{"en":"Because the wording is the same in all three stages, the \u003cstrong>depth\u003c/strong> grows through the content and the contexts you choose, not through new objective words. A Stage 7 discussion of 7SIC.05 might use air pollution and the composition of air (7ESp.03); a Stage 9 discussion might use climate change (9ESc.02) with more evidence and more complex arguments.","ar":"Because the wording is the same in all three stages, the \u003cstrong>depth\u003c/strong> grows through the content and the contexts you choose, not through new objective words. A Stage 7 discussion of 7SIC.05 might use air pollution and the composition of air (7ESp.03); a Stage 9 discussion might use climate change (9ESc.02) with more evidence and more complex arguments."}},{"t":"callout","k":"key","title":{"en":"Important: SIC is not directly assessed by Cambridge","ar":"Important: SIC is not directly assessed by Cambridge"},"c":{"en":"The framework says: \"The Science in Context strand will not be directly assessed by Cambridge International Education.\" That does not make it optional. The framework presents it as a key feature that develops the sense that \"science is for me\". It is a way of teaching the content, so plan it into your units and your school's own assessment as you judge appropriate.","ar":"The framework says: \"The Science in Context strand will not be directly assessed by Cambridge International Education.\" That does not make it optional. The framework presents it as a key feature that develops the sense that \"science is for me\". It is a way of teaching the content, so plan it into your units and your school's own assessment as you judge appropriate."}},{"t":"scenario","title":{"en":"Planning a context for a Stage 8 unit","ar":"Planning a context for a Stage 8 unit"},"c":{"en":"You are teaching 8ESp.02 (renewable and non-renewable resources, and discussing the importance of renewable resources). \u003cstrong>How could you bring in Science in Context?\u003c/strong> A good answer: use 8SIC.02 and 8SIC.05. Ask learners to find where solar power is used in their own region, and to discuss whether using more solar power has an environmental impact. Learners practise evaluating information sources (8TWSc.06) and present a short evidence-based view.","ar":"You are teaching 8ESp.02 (renewable and non-renewable resources, and discussing the importance of renewable resources). \u003cstrong>How could you bring in Science in Context?\u003c/strong> A good answer: use 8SIC.02 and 8SIC.05. Ask learners to find where solar power is used in their own region, and to discuss whether using more solar power has an environmental impact. Learners practise evaluating information sources (8TWSc.06) and present a short evidence-based view."}},{"t":"h","c":{"en":"The Appendix: symbols, units, formulae and hazard symbols","ar":"The Appendix: symbols, units, formulae and hazard symbols"}},{"t":"p","c":{"en":"The Appendix supports TWS. It states that learners are expected to recall and use standard electrical symbols (ammeter, battery of cells, buzzer, cell, closed switch, fixed resistor, junction of conductors, lamp, open switch, variable resistor, voltmeter and wire) and to recall and recognise the hazard symbols: acutely toxic, corrosive, flammable, hazardous to the environment, moderate hazard and health hazard. It also lists symbols and units for physical quantities (for example speed, with symbols u and v, and units cm/s, m/s and km/h) and a table of formulae to recall and use. Check the Appendix for the complete lists; Module 9 returns to it.","ar":"The Appendix supports TWS. It states that learners are expected to recall and use standard electrical symbols (ammeter, battery of cells, buzzer, cell, closed switch, fixed resistor, junction of conductors, lamp, open switch, variable resistor, voltmeter and wire) and to recall and recognise the hazard symbols: acutely toxic, corrosive, flammable, hazardous to the environment, moderate hazard and health hazard. It also lists symbols and units for physical quantities (for example speed, with symbols u and v, and units cm/s, m/s and km/h) and a table of formulae to recall and use. Check the Appendix for the complete lists; Module 9 returns to it."}}],"checks":[{"id":"m4q1","q":{"en":"Which sub-strand of Thinking and Working Scientifically does the code 9TWSa.02 belong to?","ar":"Which sub-strand of Thinking and Working Scientifically does the code 9TWSa.02 belong to?"},"opts":[{"en":"Scientific enquiry: purpose and planning, because it names what a result means","ar":"Scientific enquiry: purpose and planning, because it names what a result means"},{"en":"Scientific enquiry: analysis, evaluation and conclusions","ar":"Scientific enquiry: analysis, evaluation and conclusions"},{"en":"Carrying out scientific enquiry, because learners collect the measurements","ar":"Carrying out scientific enquiry, because learners collect the measurements"},{"en":"Models and representations, because learners draw graphs of the results","ar":"Models and representations, because learners draw graphs of the results"}],"correct":1,"expl":{"en":"The letter \"a\" in TWSa stands for analysis, evaluation and conclusions. 9TWSa.02 is about trends, patterns and anomalous results.","ar":"The letter \"a\" in TWSa stands for analysis, evaluation and conclusions. 9TWSa.02 is about trends, patterns and anomalous results."}},{"id":"m4q2","q":{"en":"What is the main step up from Stage 7 to Stage 9 in the Models and representations sub-strand?","ar":"What is the main step up from Stage 7 to Stage 9 in the Models and representations sub-strand?"},"opts":[{"en":"From using diagrams only in Stage 7 to using computer simulations for every scientific idea in Stage 9","ar":"From using diagrams only in Stage 7 to using computer simulations for every scientific idea in Stage 9"},{"en":"From learning one model for each strand to learning one model for all strands","ar":"From learning one model for each strand to learning one model for all strands"},{"en":"From judging a model's strengths and limits to seeing that models reflect evidence and can change","ar":"From judging a model's strengths and limits to seeing that models reflect evidence and can change"},{"en":"From describing models in Stage 7 to memorising the names of all the scientists who made them in Stage 9","ar":"From describing models in Stage 7 to memorising the names of all the scientists who made them in Stage 9"}],"correct":2,"expl":{"en":"7TWSm.01 is about strengths and limitations of a model; 9TWSm.01 says models and analogies reflect current scientific evidence and understanding and can change.","ar":"7TWSm.01 is about strengths and limitations of a model; 9TWSm.01 says models and analogies reflect current scientific evidence and understanding and can change."}},{"id":"m4q3","q":{"en":"What does the framework say about the assessment of Science in Context?","ar":"What does the framework say about the assessment of Science in Context?"},"opts":[{"en":"It is assessed only in Stage 9 through a separate Checkpoint paper on context","ar":"It is assessed only in Stage 9 through a separate Checkpoint paper on context"},{"en":"It is assessed in the Progression Tests at each stage and reported by sub-strand","ar":"It is assessed in the Progression Tests at each stage and reported by sub-strand"},{"en":"It is assessed by the school only and Cambridge does not mention it at all","ar":"It is assessed by the school only and Cambridge does not mention it at all"},{"en":"It is not directly assessed by Cambridge, but it stays in the curriculum","ar":"It is not directly assessed by Cambridge, but it stays in the curriculum"}],"correct":3,"expl":{"en":"The Assessment section says the strand will not be directly assessed by Cambridge, yet it is one of the six strands of the curriculum.","ar":"The Assessment section says the strand will not be directly assessed by Cambridge, yet it is one of the six strands of the curriculum."}}]},{"id":"m5","title":{"en":"Biology across Stages 7 to 9","ar":"Biology across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Biology as \"the study of living things and how they interact with each other\". Learners develop understanding about life processes, including how the structure and development of cells and systems allows them to maintain these processes, and ecosystems. The Biology strand has three sub-strands: \u003cstrong>Structure and function (Bs)\u003c/strong>, \u003cstrong>Life processes (Bp)\u003c/strong> and \u003cstrong>Ecosystems (Be)\u003c/strong>.","ar":"The framework describes Biology as \"the study of living things and how they interact with each other\". Learners develop understanding about life processes, including how the structure and development of cells and systems allows them to maintain these processes, and ecosystems. The Biology strand has three sub-strands: \u003cstrong>Structure and function (Bs)\u003c/strong>, \u003cstrong>Life processes (Bp)\u003c/strong> and \u003cstrong>Ecosystems (Be)\u003c/strong>."}},{"t":"table","head":{"en":["Sub-strand","Stage 7 (11 objectives in all)","Stage 8 (12)","Stage 9 (12)"],"ar":["Sub-strand","Stage 7 (11 objectives in all)","Stage 8 (12)","Stage 9 (12)"]},"rows":[{"en":["Structure and function (Bs)","Cells: all organisms are made of cells; cell structures and functions; specialised cells; plant and animal cells; tissues, organs and organ systems (5)","Joints and antagonistic muscles; components of blood; the respiratory system and gas exchange; diffusion in the lungs (4)","Water pathway in plants (xylem, transpiration, stomata); the excretory system; chromosomes, genes and DNA (3)"],"ar":["Structure and function (Bs)","Cells: all organisms are made of cells; cell structures and functions; specialised cells; plant and animal cells; tissues, organs and organ systems (5)","Joints and antagonistic muscles; components of blood; the respiratory system and gas exchange; diffusion in the lungs (4)","Water pathway in plants (xylem, transpiration, stomata); the excretory system; chromosomes, genes and DNA (3)"]},{"en":["Life processes (Bp)","Seven characteristics of living organisms; viruses; species; dichotomous keys (4)","Balanced diet; energy stores; lifestyle and health; aerobic respiration and its word equation (5)","Gametes and fertilisation; inheritance of sex; variation; natural selection; plant minerals; photosynthesis and its word equation; fetal development (8)"],"ar":["Life processes (Bp)","Seven characteristics of living organisms; viruses; species; dichotomous keys (4)","Balanced diet; energy stores; lifestyle and health; aerobic respiration and its word equation (5)","Gametes and fertilisation; inheritance of sex; variation; natural selection; plant minerals; photosynthesis and its word equation; fetal development (8)"]},{"en":["Ecosystems (Be)","Decomposers; food chains and webs with microorganisms (2)","Ecosystems and habitats; bioaccumulation; new and invasive species (3)","Population change, including extinction, when the environment changes (1)"],"ar":["Ecosystems (Be)","Decomposers; food chains and webs with microorganisms (2)","Ecosystems and habitats; bioaccumulation; new and invasive species (3)","Population change, including extinction, when the environment changes (1)"]}]},{"t":"h","c":{"en":"Stage 7: cells, characteristics and classification","ar":"Stage 7: cells, characteristics and classification"}},{"t":"p","c":{"en":"Stage 7 builds the basic vocabulary of Biology. \u003cstrong>7Bs.01\u003c/strong> says all organisms are made of cells and microorganisms are typically single celled. \u003cstrong>7Bs.02\u003c/strong> limits cell structures to seven: cell membrane, cytoplasm, nucleus, cell wall, chloroplast, mitochondria and sap vacuole. \u003cstrong>7Bs.03\u003c/strong> names five specialised cells: red blood cells, neurones, ciliated cells, root hair cells and palisade cells. \u003cstrong>7Bs.05\u003c/strong> says cells group into tissues, organs and organ systems. In Life processes, learners describe the seven characteristics of living organisms (7Bp.01), discuss whether viruses are living or non-living (7Bp.02), describe a species (7Bp.03) and use and construct dichotomous keys (7Bp.04). In Ecosystems, 7Be.01 and 7Be.02 give microorganisms a role as decomposers in food chains and webs.","ar":"Stage 7 builds the basic vocabulary of Biology. \u003cstrong>7Bs.01\u003c/strong> says all organisms are made of cells and microorganisms are typically single celled. \u003cstrong>7Bs.02\u003c/strong> limits cell structures to seven: cell membrane, cytoplasm, nucleus, cell wall, chloroplast, mitochondria and sap vacuole. \u003cstrong>7Bs.03\u003c/strong> names five specialised cells: red blood cells, neurones, ciliated cells, root hair cells and palisade cells. \u003cstrong>7Bs.05\u003c/strong> says cells group into tissues, organs and organ systems. In Life processes, learners describe the seven characteristics of living organisms (7Bp.01), discuss whether viruses are living or non-living (7Bp.02), describe a species (7Bp.03) and use and construct dichotomous keys (7Bp.04). In Ecosystems, 7Be.01 and 7Be.02 give microorganisms a role as decomposers in food chains and webs."}},{"t":"p","c":{"en":"\u003cstrong>Worked example (7Bp.02).\u003c/strong> The objective uses the verb \"discuss\". That tells you the learner does not need to memorise a final answer. A good lesson gives learners a list of the seven characteristics and asks, \"Which does a virus show, and which does it not?\" Learners then argue both sides. The assessment of understanding is the quality of the reasoning.","ar":"\u003cstrong>Worked example (7Bp.02).\u003c/strong> The objective uses the verb \"discuss\". That tells you the learner does not need to memorise a final answer. A good lesson gives learners a list of the seven characteristics and asks, \"Which does a virus show, and which does it not?\" Learners then argue both sides. The assessment of understanding is the quality of the reasoning."}},{"t":"h","c":{"en":"Stage 8: body systems, nutrition and respiration","ar":"Stage 8: body systems, nutrition and respiration"}},{"t":"p","c":{"en":"Stage 8 moves from the cell to systems in the human body and to energy. \u003cstrong>8Bs.01\u003c/strong> covers ball-and-socket and hinge joints and antagonistic muscles. \u003cstrong>8Bs.02\u003c/strong> covers blood, limited to red blood cells carrying oxygen attached to haemoglobin, white blood cells protecting against pathogens and plasma transporting blood cells, nutrients and carbon dioxide. \u003cstrong>8Bs.03\u003c/strong> and \u003cstrong>8Bs.04\u003c/strong> cover gas exchange, with alveoli (also called air sacs), the diaphragm and intercostal muscles, and diffusion of oxygen and carbon dioxide. Importantly, 8Bs.03 asks learners to understand the difference between \u003cem>breathing\u003c/em> and \u003cem>respiration\u003c/em>. In Life processes, learners study a balanced diet (8Bp.01, with minerals limited to calcium and iron and vitamins limited to A, C and D), lifestyle and health (8Bp.03), and \u003cstrong>aerobic respiration\u003c/strong> in the mitochondria (8Bp.04) with the word equation glucose + oxygen to carbon dioxide + water (8Bp.05). Ecosystems add bioaccumulation (8Be.02) and invasive species (8Be.03).","ar":"Stage 8 moves from the cell to systems in the human body and to energy. \u003cstrong>8Bs.01\u003c/strong> covers ball-and-socket and hinge joints and antagonistic muscles. \u003cstrong>8Bs.02\u003c/strong> covers blood, limited to red blood cells carrying oxygen attached to haemoglobin, white blood cells protecting against pathogens and plasma transporting blood cells, nutrients and carbon dioxide. \u003cstrong>8Bs.03\u003c/strong> and \u003cstrong>8Bs.04\u003c/strong> cover gas exchange, with alveoli (also called air sacs), the diaphragm and intercostal muscles, and diffusion of oxygen and carbon dioxide. Importantly, 8Bs.03 asks learners to understand the difference between \u003cem>breathing\u003c/em> and \u003cem>respiration\u003c/em>. In Life processes, learners study a balanced diet (8Bp.01, with minerals limited to calcium and iron and vitamins limited to A, C and D), lifestyle and health (8Bp.03), and \u003cstrong>aerobic respiration\u003c/strong> in the mitochondria (8Bp.04) with the word equation glucose + oxygen to carbon dioxide + water (8Bp.05). Ecosystems add bioaccumulation (8Be.02) and invasive species (8Be.03)."}},{"t":"scenario","title":{"en":"Breathing or respiration?","ar":"Breathing or respiration?"},"c":{"en":"A Year 8 learner writes \"Respiration is breathing in and out.\" \u003cstrong>How do you respond?\u003c/strong> A good response uses the glossary and 8Bs.03. The glossary defines breathing as air moving into and out of the lungs due to the contraction and relaxation of the diaphragm and intercostal muscles, and respiration as a biochemical process releasing energy through the reaction of oxygen with complex organic substances such as carbohydrates. Ask the learner to say which one happens in the mitochondria (8Bp.04) and which one needs the diaphragm.","ar":"A Year 8 learner writes \"Respiration is breathing in and out.\" \u003cstrong>How do you respond?\u003c/strong> A good response uses the glossary and 8Bs.03. The glossary defines breathing as air moving into and out of the lungs due to the contraction and relaxation of the diaphragm and intercostal muscles, and respiration as a biochemical process releasing energy through the reaction of oxygen with complex organic substances such as carbohydrates. Ask the learner to say which one happens in the mitochondria (8Bp.04) and which one needs the diaphragm."}},{"t":"h","c":{"en":"Stage 9: plants, inheritance and change over time","ar":"Stage 9: plants, inheritance and change over time"}},{"t":"p","c":{"en":"Stage 9 takes Biology to the level of genes and the whole organism. \u003cstrong>9Bs.01\u003c/strong> describes the pathway of water and mineral salts from the roots to the leaves in flowering plants, including absorption in root hair cells, transport through xylem and transpiration through stomata. \u003cstrong>9Bs.02\u003c/strong> covers the excretory system, limited to kidneys filtering blood to remove urea. \u003cstrong>9Bs.03\u003c/strong> says chromosomes contain genes, made of DNA. Life processes include fusion of gametes (9Bp.01), inheritance of sex as XX and XY (9Bp.02), variation (9Bp.03), the scientific theory of natural selection (9Bp.04), plant minerals limited to magnesium and nitrates (9Bp.05), photosynthesis in chloroplasts (9Bp.06) with its word equation (9Bp.07), and fetal development (9Bp.08). In Ecosystems, 9Be.01 asks learners to describe what could happen to the population of a species, including extinction, when the environment changes.","ar":"Stage 9 takes Biology to the level of genes and the whole organism. \u003cstrong>9Bs.01\u003c/strong> describes the pathway of water and mineral salts from the roots to the leaves in flowering plants, including absorption in root hair cells, transport through xylem and transpiration through stomata. \u003cstrong>9Bs.02\u003c/strong> covers the excretory system, limited to kidneys filtering blood to remove urea. \u003cstrong>9Bs.03\u003c/strong> says chromosomes contain genes, made of DNA. Life processes include fusion of gametes (9Bp.01), inheritance of sex as XX and XY (9Bp.02), variation (9Bp.03), the scientific theory of natural selection (9Bp.04), plant minerals limited to magnesium and nitrates (9Bp.05), photosynthesis in chloroplasts (9Bp.06) with its word equation (9Bp.07), and fetal development (9Bp.08). In Ecosystems, 9Be.01 asks learners to describe what could happen to the population of a species, including extinction, when the environment changes."}},{"t":"callout","k":"warn","title":{"en":"Teaching 9Bp.01, 9Bp.02 and 9Bp.08","ar":"Teaching 9Bp.01, 9Bp.02 and 9Bp.08"},"c":{"en":"These objectives are about human reproduction. The framework says the focus is factual and covers genetics, inheritance, fusion of gametes and fetal development, and that it does not address attitudes and values. Schools are expected to have their own policy. Follow your school's policy and your HOD's guidance before you plan these lessons.","ar":"These objectives are about human reproduction. The framework says the focus is factual and covers genetics, inheritance, fusion of gametes and fetal development, and that it does not address attitudes and values. Schools are expected to have their own policy. Follow your school's policy and your HOD's guidance before you plan these lessons."}},{"t":"h","c":{"en":"Watch the limits: \"limited to\"","ar":"Watch the limits: \"limited to\""}},{"t":"p","c":{"en":"Many Biology objectives include a phrase such as \"limited to\". It tells you the depth. For example, 7Bs.02 lists seven cell structures, 8Bp.01 limits minerals to calcium and iron, and 9Bp.05 limits plant minerals to magnesium (to make chlorophyll) and nitrates (to make protein). Teaching extra material is not a problem if time allows, but do not assess or expect more than the limit, and do not skip an item that is on the list.","ar":"Many Biology objectives include a phrase such as \"limited to\". It tells you the depth. For example, 7Bs.02 lists seven cell structures, 8Bp.01 limits minerals to calcium and iron, and 9Bp.05 limits plant minerals to magnesium (to make chlorophyll) and nitrates (to make protein). Teaching extra material is not a problem if time allows, but do not assess or expect more than the limit, and do not skip an item that is on the list."}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Cells and energy","7Bs.02 mitochondria and chloroplast named as cell structures","8Bp.04 aerobic respiration occurs in the mitochondria","9Bp.06 photosynthesis occurs in chloroplasts"],"ar":["Cells and energy","7Bs.02 mitochondria and chloroplast named as cell structures","8Bp.04 aerobic respiration occurs in the mitochondria","9Bp.06 photosynthesis occurs in chloroplasts"]},{"en":["Living things interacting","7Be.02 food chains and webs with decomposers","8Be.02 bioaccumulation in an ecosystem; 8Be.03 invasive species","9Be.01 population change, including extinction"],"ar":["Living things interacting","7Be.02 food chains and webs with decomposers","8Be.02 bioaccumulation in an ecosystem; 8Be.03 invasive species","9Be.01 population change, including extinction"]},{"en":["Health and the body","7Bs.05 organ systems","8Bs.03 respiratory system; 8Bp.03 lifestyle","9Bs.02 excretory system; 9Bp.08 fetal development and the mother's health"],"ar":["Health and the body","7Bs.05 organ systems","8Bs.03 respiratory system; 8Bp.03 lifestyle","9Bs.02 excretory system; 9Bp.08 fetal development and the mother's health"]}]},{"t":"scenario","title":{"en":"Planning a Year 7 practical for 7Bp.04","ar":"Planning a Year 7 practical for 7Bp.04"},"c":{"en":"You want learners to practise using and constructing a dichotomous key. \u003cstrong>What activity would work in a class of 28 ESL learners?\u003c/strong> A good answer: give pairs 8 to 10 leaves, shells or pictures of local organisms. First they use a ready-made key with yes/no questions. Then they build their own key for a different set. Provide sentence starters (\"Does it have...?\", \"It has... / It does not have...\") to support the language, and link to 7TWSc.01 (sort, group and classify, including making and using keys).","ar":"You want learners to practise using and constructing a dichotomous key. \u003cstrong>What activity would work in a class of 28 ESL learners?\u003c/strong> A good answer: give pairs 8 to 10 leaves, shells or pictures of local organisms. First they use a ready-made key with yes/no questions. Then they build their own key for a different set. Provide sentence starters (\"Does it have...?\", \"It has... / It does not have...\") to support the language, and link to 7TWSc.01 (sort, group and classify, including making and using keys)."}}],"checks":[{"id":"m5q1","q":{"en":"Which sub-strand has the code Bp, and what is one thing it covers at Stage 8?","ar":"Which sub-strand has the code Bp, and what is one thing it covers at Stage 8?"},"opts":[{"en":"Life processes, which at Stage 8 includes a balanced diet and aerobic respiration","ar":"Life processes, which at Stage 8 includes a balanced diet and aerobic respiration"},{"en":"Structure and function, which at Stage 8 includes diffusion in the lungs and the components of blood","ar":"Structure and function, which at Stage 8 includes diffusion in the lungs and the components of blood"},{"en":"Ecosystems, which at Stage 8 includes bioaccumulation and invasive species","ar":"Ecosystems, which at Stage 8 includes bioaccumulation and invasive species"},{"en":"Life processes, which at Stage 8 includes natural selection and the inheritance of sex","ar":"Life processes, which at Stage 8 includes natural selection and the inheritance of sex"}],"correct":0,"expl":{"en":"Bp is Life processes. At Stage 8 it covers balanced diet (8Bp.01), energy stores, lifestyle and health, and aerobic respiration (8Bp.04 and 8Bp.05). Natural selection is 9Bp.04.","ar":"Bp is Life processes. At Stage 8 it covers balanced diet (8Bp.01), energy stores, lifestyle and health, and aerobic respiration (8Bp.04 and 8Bp.05). Natural selection is 9Bp.04."}},{"id":"m5q2","q":{"en":"A teacher plans to teach the structure of the kidney and the pathway of water through xylem in Year 7. Which is the best advice?","ar":"A teacher plans to teach the structure of the kidney and the pathway of water through xylem in Year 7. Which is the best advice?"},"opts":[{"en":"Teach both, because the Biology strand is not divided by stage in the framework","ar":"Teach both, because the Biology strand is not divided by stage in the framework"},{"en":"Check the codes: both are Stage 9 objectives (9Bs.01, 9Bs.02), so they belong in Year 9","ar":"Check the codes: both are Stage 9 objectives (9Bs.01, 9Bs.02), so they belong in Year 9"},{"en":"Teach the kidney only, because the excretory system is a Stage 7 objective in Structure and function","ar":"Teach the kidney only, because the excretory system is a Stage 7 objective in Structure and function"},{"en":"Teach the xylem only, because transport in plants is a Stage 7 objective in Life processes","ar":"Teach the xylem only, because transport in plants is a Stage 7 objective in Life processes"}],"correct":1,"expl":{"en":"Both are in the Stage 9 list: 9Bs.01 is the water pathway in plants and 9Bs.02 is the excretory system. Stage 7 Structure and function is about cells and organisation.","ar":"Both are in the Stage 9 list: 9Bs.01 is the water pathway in plants and 9Bs.02 is the excretory system. Stage 7 Structure and function is about cells and organisation."}},{"id":"m5q3","q":{"en":"What does the phrase \"limited to\" tell a teacher about 9Bp.05?","ar":"What does the phrase \"limited to\" tell a teacher about 9Bp.05?"},"opts":[{"en":"Plant minerals may only be taught in the final lesson of the Stage 9 Biology unit","ar":"Plant minerals may only be taught in the final lesson of the Stage 9 Biology unit"},{"en":"Only the root hair cells and the xylem are to be studied when teaching about plant minerals","ar":"Only the root hair cells and the xylem are to be studied when teaching about plant minerals"},{"en":"The minerals are magnesium, for making chlorophyll, and nitrates, for making protein","ar":"The minerals are magnesium, for making chlorophyll, and nitrates, for making protein"},{"en":"Learners may discuss plant minerals but are not allowed to write about them","ar":"Learners may discuss plant minerals but are not allowed to write about them"}],"correct":2,"expl":{"en":"\"Limited to\" gives the depth of the objective. 9Bp.05 names magnesium to make chlorophyll and nitrates to make protein.","ar":"\"Limited to\" gives the depth of the objective. 9Bp.05 names magnesium to make chlorophyll and nitrates to make protein."}}]},{"id":"m6","title":{"en":"Chemistry across Stages 7 to 9","ar":"Chemistry across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Chemistry as \"the study of matter\". Matter takes the form of materials that are made up of substances. Learners develop understanding of atoms, elements and compounds, including how substances interact and the properties of different substances. The three sub-strands are \u003cstrong>Materials and their structure (Cm)\u003c/strong>, \u003cstrong>Properties of materials (Cp)\u003c/strong> and \u003cstrong>Changes to materials (Cc)\u003c/strong>.","ar":"The framework describes Chemistry as \"the study of matter\". Matter takes the form of materials that are made up of substances. Learners develop understanding of atoms, elements and compounds, including how substances interact and the properties of different substances. The three sub-strands are \u003cstrong>Materials and their structure (Cm)\u003c/strong>, \u003cstrong>Properties of materials (Cp)\u003c/strong> and \u003cstrong>Changes to materials (Cc)\u003c/strong>."}},{"t":"table","head":{"en":["Sub-strand","Stage 7 (18 objectives in all)","Stage 8 (12)","Stage 9 (14)"],"ar":["Sub-strand","Stage 7 (18 objectives in all)","Stage 8 (12)","Stage 9 (14)"]},"rows":[{"en":["Materials and their structure (Cm)","Atoms and elements; the Periodic Table; metals and non-metals; elements, compounds, mixtures and alloys; vacuum; states of matter; particle model (7)","Rutherford model of the atom; charges of electrons, protons and neutrons; electrostatic attraction in atoms; purity (4)","Periodic Table and atomic structure; molecules and covalent bonds; ions; ionic bonds (5)"],"ar":["Materials and their structure (Cm)","Atoms and elements; the Periodic Table; metals and non-metals; elements, compounds, mixtures and alloys; vacuum; states of matter; particle model (7)","Rutherford model of the atom; charges of electrons, protons and neutrons; electrostatic attraction in atoms; purity (4)","Periodic Table and atomic structure; molecules and covalent bonds; ions; ionic bonds (5)"]},{"en":["Properties of materials (Cp)","Chemical and physical properties; acidity, pH and indicators; gas tests; metals and non-metals; alloys and particle model (7)","Concentration of a solution; paper chromatography (2)","Group 1 trends; density; calculating density; simple and giant structures (4)"],"ar":["Properties of materials (Cp)","Chemical and physical properties; acidity, pH and indicators; gas tests; metals and non-metals; alloys and particle model (7)","Concentration of a solution; paper chromatography (2)","Group 1 trends; density; calculating density; simple and giant structures (4)"]},{"en":["Changes to materials (Cc)","Signs of a chemical reaction; precipitates; the particle model for reactions; neutralisation (4)","Word equations; endothermic and exothermic; reactivity of metals; impure products; solubility and temperature; inert substances (6)","Word and symbol equations; displacement reactions; preparing salts; rate of reaction; conservation of mass and energy (5)"],"ar":["Changes to materials (Cc)","Signs of a chemical reaction; precipitates; the particle model for reactions; neutralisation (4)","Word equations; endothermic and exothermic; reactivity of metals; impure products; solubility and temperature; inert substances (6)","Word and symbol equations; displacement reactions; preparing salts; rate of reaction; conservation of mass and energy (5)"]}]},{"t":"h","c":{"en":"Stage 7: matter, particles and first reactions","ar":"Stage 7: matter, particles and first reactions"}},{"t":"p","c":{"en":"Stage 7 is the base for the whole Chemistry strand. \u003cstrong>7Cm.01\u003c/strong> says all matter is made of atoms, with each different type of atom being a different element. \u003cstrong>7Cm.04\u003c/strong> covers the differences between elements, compounds and mixtures, with alloys as an example of a mixture. \u003cstrong>7Cm.05\u003c/strong> describes a vacuum as a space devoid of matter. \u003cstrong>7Cm.06\u003c/strong> and \u003cstrong>7Cm.07\u003c/strong> use the particle model for the three states and for elements, compounds, mixtures and alloys. In properties, learners use indicators including Universal Indicator and litmus (7Cp.03), use tests to identify hydrogen, carbon dioxide and oxygen (7Cp.04), and learn that alloys such as brass and steel have different properties from their constituent substances (7Cp.06) and that the particle model explains why alloys are harder than pure metals (7Cp.07). In changes, learners identify a chemical reaction from observations (7Cc.01), explain how a precipitate forms (7Cc.02) and describe neutralisation in terms of change of pH (7Cc.04).","ar":"Stage 7 is the base for the whole Chemistry strand. \u003cstrong>7Cm.01\u003c/strong> says all matter is made of atoms, with each different type of atom being a different element. \u003cstrong>7Cm.04\u003c/strong> covers the differences between elements, compounds and mixtures, with alloys as an example of a mixture. \u003cstrong>7Cm.05\u003c/strong> describes a vacuum as a space devoid of matter. \u003cstrong>7Cm.06\u003c/strong> and \u003cstrong>7Cm.07\u003c/strong> use the particle model for the three states and for elements, compounds, mixtures and alloys. In properties, learners use indicators including Universal Indicator and litmus (7Cp.03), use tests to identify hydrogen, carbon dioxide and oxygen (7Cp.04), and learn that alloys such as brass and steel have different properties from their constituent substances (7Cp.06) and that the particle model explains why alloys are harder than pure metals (7Cp.07). In changes, learners identify a chemical reaction from observations (7Cc.01), explain how a precipitate forms (7Cc.02) and describe neutralisation in terms of change of pH (7Cc.04)."}},{"t":"callout","k":"tip","title":{"en":"Use the glossary to fix vocabulary early","ar":"Use the glossary to fix vocabulary early"},"c":{"en":"The glossary separates words that learners often mix up. A \u003cem>substance\u003c/em> is matter composed of a single thing: oxygen is a substance, but air is a mixture. Steel is a \u003cem>material\u003c/em> and not a single substance, because it is made of iron mixed with other substances. A \u003cem>mixture\u003c/em> is a sample containing more than one substance or material. Display these three definitions in your lab.","ar":"The glossary separates words that learners often mix up. A \u003cem>substance\u003c/em> is matter composed of a single thing: oxygen is a substance, but air is a mixture. Steel is a \u003cem>material\u003c/em> and not a single substance, because it is made of iron mixed with other substances. A \u003cem>mixture\u003c/em> is a sample containing more than one substance or material. Display these three definitions in your lab."}},{"t":"h","c":{"en":"Stage 8: inside the atom, purity, reactivity and chromatography","ar":"Stage 8: inside the atom, purity, reactivity and chromatography"}},{"t":"p","c":{"en":"Stage 8 goes inside the atom and begins to quantify. \u003cstrong>8Cm.01\u003c/strong> describes the Rutherford model of the structure of an atom. \u003cstrong>8Cm.02\u003c/strong> and \u003cstrong>8Cm.03\u003c/strong> cover charges and the electrostatic attraction that holds atoms together. \u003cstrong>8Cm.04\u003c/strong> defines purity as how much of a specific chemical is in a mixture. In properties, \u003cstrong>8Cp.01\u003c/strong> links concentration to how many solute particles are in a volume of solvent and \u003cstrong>8Cp.02\u003c/strong> covers paper chromatography. In changes, learners use word equations (8Cc.01), identify endothermic and exothermic changes by temperature change (8Cc.02), and describe the reactivity of metals with oxygen, water and dilute acids, limited to nine named metals: sodium, potassium, calcium, magnesium, zinc, iron, copper, gold and silver (8Cc.03). They also learn that reactions do not always give a single pure product (8Cc.04), that solubility of salts varies with temperature (8Cc.05) and that some substances are inert (8Cc.06).","ar":"Stage 8 goes inside the atom and begins to quantify. \u003cstrong>8Cm.01\u003c/strong> describes the Rutherford model of the structure of an atom. \u003cstrong>8Cm.02\u003c/strong> and \u003cstrong>8Cm.03\u003c/strong> cover charges and the electrostatic attraction that holds atoms together. \u003cstrong>8Cm.04\u003c/strong> defines purity as how much of a specific chemical is in a mixture. In properties, \u003cstrong>8Cp.01\u003c/strong> links concentration to how many solute particles are in a volume of solvent and \u003cstrong>8Cp.02\u003c/strong> covers paper chromatography. In changes, learners use word equations (8Cc.01), identify endothermic and exothermic changes by temperature change (8Cc.02), and describe the reactivity of metals with oxygen, water and dilute acids, limited to nine named metals: sodium, potassium, calcium, magnesium, zinc, iron, copper, gold and silver (8Cc.03). They also learn that reactions do not always give a single pure product (8Cc.04), that solubility of salts varies with temperature (8Cc.05) and that some substances are inert (8Cc.06)."}},{"t":"scenario","title":{"en":"A reactivity practical","ar":"A reactivity practical"},"c":{"en":"For 8Cc.03 you plan to put metals into dilute acid. A colleague says \"Let us include all nine metals so that learners see everything.\" \u003cstrong>What do you say?\u003c/strong> A good response: the objective names nine metals, but it covers reactions with oxygen, water and dilute acids, not every metal with every reagent in a practical. Plan the practical with your HOD, use a risk assessment (8TWSp.05), and decide which metals are safe to use as a demonstration and which are shown by video or secondary information (8TWSc.06). Learners can complete the full reactivity picture using data, not only practicals.","ar":"For 8Cc.03 you plan to put metals into dilute acid. A colleague says \"Let us include all nine metals so that learners see everything.\" \u003cstrong>What do you say?\u003c/strong> A good response: the objective names nine metals, but it covers reactions with oxygen, water and dilute acids, not every metal with every reagent in a practical. Plan the practical with your HOD, use a risk assessment (8TWSp.05), and decide which metals are safe to use as a demonstration and which are shown by video or secondary information (8TWSc.06). Learners can complete the full reactivity picture using data, not only practicals."}},{"t":"h","c":{"en":"Stage 9: structure of the Periodic Table, bonding, rates and salts","ar":"Stage 9: structure of the Periodic Table, bonding, rates and salts"}},{"t":"p","c":{"en":"Stage 9 connects atomic structure to the Periodic Table and bonding. \u003cstrong>9Cm.01\u003c/strong> relates the structure of the Periodic Table to atomic structure, including protons and neutrons in a central nucleus and electronic structure, with predicting electronic structure limited to proton numbers 1 to 20. \u003cstrong>9Cm.02\u003c/strong> and \u003cstrong>9Cm.03\u003c/strong> cover molecules and the covalent bond (limited to single bonds), and \u003cstrong>9Cm.04\u003c/strong> and \u003cstrong>9Cm.05\u003c/strong> cover ions and ionic bonds. Dot-and-cross diagrams are named in 9Cm.03 and 9Cm.04. In properties, learners use Group 1 as an example of group trends (9Cp.01), describe and calculate density (9Cp.02 and 9Cp.03) and know that structures, simple or giant, influence physical properties (9Cp.04). In changes, learners use word and symbol equations, with a note that balancing symbol equations is not required (9Cc.01), identify displacement reactions (9Cc.02), prepare common salts and name those from hydrochloric, sulfuric and nitric acids (9Cc.03), describe the effects of concentration, surface area and temperature on rate with the particle model (9Cc.04), and understand that mass and energy are conserved (9Cc.05).","ar":"Stage 9 connects atomic structure to the Periodic Table and bonding. \u003cstrong>9Cm.01\u003c/strong> relates the structure of the Periodic Table to atomic structure, including protons and neutrons in a central nucleus and electronic structure, with predicting electronic structure limited to proton numbers 1 to 20. \u003cstrong>9Cm.02\u003c/strong> and \u003cstrong>9Cm.03\u003c/strong> cover molecules and the covalent bond (limited to single bonds), and \u003cstrong>9Cm.04\u003c/strong> and \u003cstrong>9Cm.05\u003c/strong> cover ions and ionic bonds. Dot-and-cross diagrams are named in 9Cm.03 and 9Cm.04. In properties, learners use Group 1 as an example of group trends (9Cp.01), describe and calculate density (9Cp.02 and 9Cp.03) and know that structures, simple or giant, influence physical properties (9Cp.04). In changes, learners use word and symbol equations, with a note that balancing symbol equations is not required (9Cc.01), identify displacement reactions (9Cc.02), prepare common salts and name those from hydrochloric, sulfuric and nitric acids (9Cc.03), describe the effects of concentration, surface area and temperature on rate with the particle model (9Cc.04), and understand that mass and energy are conserved (9Cc.05)."}},{"t":"callout","k":"warn","title":{"en":"Read the limits carefully at Stage 9","ar":"Read the limits carefully at Stage 9"},"c":{"en":"Two limits are easy to miss. 9Cc.01 says balancing symbol equations is not required. 9Cm.03 limits covalent bonding to single bonds. Check these before you set a homework or a test question. Teaching beyond the limit is your decision; expecting it of every learner is not what the framework asks.","ar":"Two limits are easy to miss. 9Cc.01 says balancing symbol equations is not required. 9Cm.03 limits covalent bonding to single bonds. Check these before you set a homework or a test question. Teaching beyond the limit is your decision; expecting it of every learner is not what the framework asks."}},{"t":"h","c":{"en":"How the particle model returns across the strand","ar":"How the particle model returns across the strand"}},{"t":"table","head":{"en":["Stage","Objective using particle ideas","Use"],"ar":["Stage","Objective using particle ideas","Use"]},"rows":[{"en":["7","7Cm.06, 7Cm.07, 7Cp.07, 7Cc.03","Describe states, represent elements, compounds, mixtures and alloys, explain alloy hardness, describe reactions"],"ar":["7","7Cm.06, 7Cm.07, 7Cp.07, 7Cc.03","Describe states, represent elements, compounds, mixtures and alloys, explain alloy hardness, describe reactions"]},{"en":["8","8Cp.01, and 8Pf.06 in Physics","Concentration in terms of particles; explain pressure in gases and liquids (qualitative only)"],"ar":["8","8Cp.01, and 8Pf.06 in Physics","Concentration in terms of particles; explain pressure in gases and liquids (qualitative only)"]},{"en":["9","9Cc.04","Explain the effects of concentration, surface area and temperature on rate of reaction"],"ar":["9","9Cc.04","Explain the effects of concentration, surface area and temperature on rate of reaction"]}]},{"t":"p","c":{"en":"\u003cstrong>Worked example: comparing two objectives.\u003c/strong> Compare \u003cstrong>7Cc.01\u003c/strong> (identify whether a reaction has taken place through observations, such as a gas, a precipitate or a colour change) with \u003cstrong>9Cc.04\u003c/strong> (describe and explain the effects of concentration, surface area and temperature on rate). At Stage 7 the question is \"did a reaction happen?\". At Stage 9 the question is \"how fast, and why?\", answered with the particle model. The practical equipment may look similar, such as an acid and a metal carbonate, but the thinking is at a different level.","ar":"\u003cstrong>Worked example: comparing two objectives.\u003c/strong> Compare \u003cstrong>7Cc.01\u003c/strong> (identify whether a reaction has taken place through observations, such as a gas, a precipitate or a colour change) with \u003cstrong>9Cc.04\u003c/strong> (describe and explain the effects of concentration, surface area and temperature on rate). At Stage 7 the question is \"did a reaction happen?\". At Stage 9 the question is \"how fast, and why?\", answered with the particle model. The practical equipment may look similar, such as an acid and a metal carbonate, but the thinking is at a different level."}},{"t":"scenario","title":{"en":"Mixed classes and the Periodic Table","ar":"Mixed classes and the Periodic Table"},"c":{"en":"A Year 9 class has several learners who joined from another school and did not study Stage 8 atoms. Your plan for 9Cm.01 starts with electronic structure. \u003cstrong>What would you check?\u003c/strong> A good answer: 9Cm.01 builds on ideas from 8Cm.01 to 8Cm.03 (atom model and charges) and 7Cm.02 (the Periodic Table presents elements in an order). Do a short diagnostic of protons, neutrons, electrons and charge, and give a catch-up task with a labelled diagram before starting. Check the Stage 8 and Stage 7 objectives, not only the Stage 9 page.","ar":"A Year 9 class has several learners who joined from another school and did not study Stage 8 atoms. Your plan for 9Cm.01 starts with electronic structure. \u003cstrong>What would you check?\u003c/strong> A good answer: 9Cm.01 builds on ideas from 8Cm.01 to 8Cm.03 (atom model and charges) and 7Cm.02 (the Periodic Table presents elements in an order). Do a short diagnostic of protons, neutrons, electrons and charge, and give a catch-up task with a labelled diagram before starting. Check the Stage 8 and Stage 7 objectives, not only the Stage 9 page."}}],"checks":[{"id":"m6q1","q":{"en":"Which objective introduces the idea that alloys are mixtures, and in which stage?","ar":"Which objective introduces the idea that alloys are mixtures, and in which stage?"},"opts":[{"en":"8Cm.04 in Stage 8, which describes purity as how much of a chemical is in a mixture","ar":"8Cm.04 in Stage 8, which describes purity as how much of a chemical is in a mixture"},{"en":"9Cp.04 in Stage 9, which describes giant structures and their physical properties","ar":"9Cp.04 in Stage 9, which describes giant structures and their physical properties"},{"en":"7Cc.01 in Stage 7, which describes the signs that a chemical reaction has taken place","ar":"7Cc.01 in Stage 7, which describes the signs that a chemical reaction has taken place"},{"en":"7Cm.04 in Stage 7, which describes alloys as an example of a mixture","ar":"7Cm.04 in Stage 7, which describes alloys as an example of a mixture"}],"correct":3,"expl":{"en":"7Cm.04 describes the differences between elements, compounds and mixtures, including alloys as an example of a mixture.","ar":"7Cm.04 describes the differences between elements, compounds and mixtures, including alloys as an example of a mixture."}},{"id":"m6q2","q":{"en":"A teacher wants learners to explain why increasing temperature speeds up a reaction using the particle model. Which objective and stage?","ar":"A teacher wants learners to explain why increasing temperature speeds up a reaction using the particle model. Which objective and stage?"},"opts":[{"en":"9Cc.04 in Stage 9, which covers concentration, surface area and temperature and the particle model","ar":"9Cc.04 in Stage 9, which covers concentration, surface area and temperature and the particle model"},{"en":"7Cc.03 in Stage 7, which covers using the particle model to describe chemical reactions","ar":"7Cc.03 in Stage 7, which covers using the particle model to describe chemical reactions"},{"en":"8Cc.02 in Stage 8, which covers endothermic and exothermic changes identified by temperature changes in a reaction","ar":"8Cc.02 in Stage 8, which covers endothermic and exothermic changes identified by temperature changes in a reaction"},{"en":"9Cc.05 in Stage 9, which covers the conservation of mass and of energy in chemical reactions","ar":"9Cc.05 in Stage 9, which covers the conservation of mass and of energy in chemical reactions"}],"correct":0,"expl":{"en":"9Cc.04 describes the effects of concentration, surface area and temperature on the rate of reaction and explains them using the particle model.","ar":"9Cc.04 describes the effects of concentration, surface area and temperature on the rate of reaction and explains them using the particle model."}},{"id":"m6q3","q":{"en":"What does 9Cc.01 say about symbol equations?","ar":"What does 9Cc.01 say about symbol equations?"},"opts":[{"en":"Learners must balance every symbol equation they meet in Stage 9 Chemistry","ar":"Learners must balance every symbol equation they meet in Stage 9 Chemistry"},{"en":"Learners use word and symbol equations, and balancing symbol equations is not required","ar":"Learners use word and symbol equations, and balancing symbol equations is not required"},{"en":"Learners use symbol equations only, because word equations stop at Stage 8","ar":"Learners use symbol equations only, because word equations stop at Stage 8"},{"en":"Learners write symbol equations only for acid reactions, and not for displacement reactions or rate","ar":"Learners write symbol equations only for acid reactions, and not for displacement reactions or rate"}],"correct":1,"expl":{"en":"The wording of 9Cc.01 includes \"(balancing symbol equations is not required)\". Word equations also continue from 8Cc.01.","ar":"The wording of 9Cc.01 includes \"(balancing symbol equations is not required)\". Word equations also continue from 8Cc.01."}}]},{"id":"m7","title":{"en":"Physics across Stages 7 to 9","ar":"Physics across Stages 7 to 9"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework describes Physics as \"the study of the interaction of matter and energy\". Learners develop understanding about energy and forces, how light and sound behave, and how magnets, including electromagnets, interact. The three sub-strands are \u003cstrong>Forces and energy (Pf)\u003c/strong>, \u003cstrong>Light and sound (Ps)\u003c/strong> and \u003cstrong>Electricity and magnetism (Pe)\u003c/strong>.","ar":"The framework describes Physics as \"the study of the interaction of matter and energy\". Learners develop understanding about energy and forces, how light and sound behave, and how magnets, including electromagnets, interact. The three sub-strands are \u003cstrong>Forces and energy (Pf)\u003c/strong>, \u003cstrong>Light and sound (Ps)\u003c/strong> and \u003cstrong>Electricity and magnetism (Pe)\u003c/strong>."}},{"t":"table","head":{"en":["Sub-strand","Stage 7 (11 objectives in all)","Stage 8 (14)","Stage 9 (12)"],"ar":["Sub-strand","Stage 7 (11 objectives in all)","Stage 8 (14)","Stage 9 (12)"]},"rows":[{"en":["Forces and energy (Pf)","Energy changes; energy dissipates; gravity between any two objects; no air resistance in a vacuum (4)","Speed and distance/time graphs; balanced and unbalanced forces; moments; pressure; particle theory for pressure; diffusion (7)","Density, floating and sinking; heat and temperature; conservation of energy; heat dissipation; conduction, convection, radiation; cooling by evaporation (6)"],"ar":["Forces and energy (Pf)","Energy changes; energy dissipates; gravity between any two objects; no air resistance in a vacuum (4)","Speed and distance/time graphs; balanced and unbalanced forces; moments; pressure; particle theory for pressure; diffusion (7)","Density, floating and sinking; heat and temperature; conservation of energy; heat dissipation; conduction, convection, radiation; cooling by evaporation (6)"]},{"en":["Light and sound (Ps)","Sound only: vibration of particles and no sound in a vacuum; echoes (2)","Light only: reflection; refraction; white light and spectrum; colours of light (4)","Waveforms for sound: loudness and amplitude, pitch and frequency; reinforcement and cancellation (2)"],"ar":["Light and sound (Ps)","Sound only: vibration of particles and no sound in a vacuum; echoes (2)","Light only: reflection; refraction; white light and spectrum; colours of light (4)","Waveforms for sound: loudness and amplitude, pitch and frequency; reinforcement and cancellation (2)"]},{"en":["Electricity and magnetism (Pe)","Electrons in a circuit; conductors and insulators; current in series circuits; circuit symbols (5)","Magnetic fields; making an electromagnet; factors that change its strength (3)","Current in parallel circuits; current and voltage; resistance; circuit symbols with resistors and voltmeters (4)"],"ar":["Electricity and magnetism (Pe)","Electrons in a circuit; conductors and insulators; current in series circuits; circuit symbols (5)","Magnetic fields; making an electromagnet; factors that change its strength (3)","Current in parallel circuits; current and voltage; resistance; circuit symbols with resistors and voltmeters (4)"]}]},{"t":"h","c":{"en":"Stage 7: energy, gravity, sound and the first circuits","ar":"Stage 7: energy, gravity, sound and the first circuits"}},{"t":"p","c":{"en":"Stage 7 Physics begins with ideas about energy. \u003cstrong>7Pf.01\u003c/strong> asks learners to describe changes in energy that result from an event or process, and \u003cstrong>7Pf.02\u003c/strong> says energy tends to dissipate and in doing so it becomes less useful. \u003cstrong>7Pf.03\u003c/strong> describes gravity as a force of attraction between any two objects, with the size of the force related to the masses. \u003cstrong>7Pf.04\u003c/strong> says there is no air resistance in a vacuum. The two Light and sound objectives are both about sound: \u003cstrong>7Ps.01\u003c/strong> describes the vibration of particles in a sound wave and explains why sound does not travel in a vacuum, and \u003cstrong>7Ps.02\u003c/strong> explains echoes as reflection of sound waves. In electricity, \u003cstrong>7Pe.01\u003c/strong> uses a simple model of electricity as a flow of electrons around a circuit, \u003cstrong>7Pe.03\u003c/strong> and \u003cstrong>7Pe.04\u003c/strong> cover current in series circuits, and \u003cstrong>7Pe.05\u003c/strong> uses diagrams and conventional symbols for circuits with cells, switches, lamps, buzzers and ammeters.","ar":"Stage 7 Physics begins with ideas about energy. \u003cstrong>7Pf.01\u003c/strong> asks learners to describe changes in energy that result from an event or process, and \u003cstrong>7Pf.02\u003c/strong> says energy tends to dissipate and in doing so it becomes less useful. \u003cstrong>7Pf.03\u003c/strong> describes gravity as a force of attraction between any two objects, with the size of the force related to the masses. \u003cstrong>7Pf.04\u003c/strong> says there is no air resistance in a vacuum. The two Light and sound objectives are both about sound: \u003cstrong>7Ps.01\u003c/strong> describes the vibration of particles in a sound wave and explains why sound does not travel in a vacuum, and \u003cstrong>7Ps.02\u003c/strong> explains echoes as reflection of sound waves. In electricity, \u003cstrong>7Pe.01\u003c/strong> uses a simple model of electricity as a flow of electrons around a circuit, \u003cstrong>7Pe.03\u003c/strong> and \u003cstrong>7Pe.04\u003c/strong> cover current in series circuits, and \u003cstrong>7Pe.05\u003c/strong> uses diagrams and conventional symbols for circuits with cells, switches, lamps, buzzers and ammeters."}},{"t":"callout","k":"tip","title":{"en":"Look for the link to Chemistry","ar":"Look for the link to Chemistry"},"c":{"en":"7Pf.04 and 7Ps.01 both use the idea of a vacuum, which is defined in Chemistry at 7Cm.05 as a space devoid of matter. The particle model (7Cm.06) explains why sound needs particles to vibrate. Planning these three objectives close together helps learners see that science ideas connect across strands.","ar":"7Pf.04 and 7Ps.01 both use the idea of a vacuum, which is defined in Chemistry at 7Cm.05 as a space devoid of matter. The particle model (7Cm.06) explains why sound needs particles to vibrate. Planning these three objectives close together helps learners see that science ideas connect across strands."}},{"t":"h","c":{"en":"Stage 8: forces, pressure, light and electromagnets","ar":"Stage 8: forces, pressure, light and electromagnets"}},{"t":"p","c":{"en":"Stage 8 has the most Physics objectives of the three stages, and it introduces calculation. \u003cstrong>8Pf.01\u003c/strong> calculates speed (speed = distance / time), \u003cstrong>8Pf.02\u003c/strong> interprets and draws simple distance/time graphs, \u003cstrong>8Pf.03\u003c/strong> covers balanced and unbalanced forces, \u003cstrong>8Pf.04\u003c/strong> turning forces (moment = force x distance) and \u003cstrong>8Pf.05\u003c/strong> pressure (pressure = force / area). \u003cstrong>8Pf.06\u003c/strong> uses particle theory to explain pressure in gases and liquids (qualitative only), and \u003cstrong>8Pf.07\u003c/strong> describes diffusion of gases and liquids. In Light and sound, all four objectives are about light: reflection and the law of reflection (8Ps.01), refraction in terms of change of speed (8Ps.02), white light and the spectrum with a prism (8Ps.03), and adding, subtracting, absorbing and reflecting colours (8Ps.04). In electricity and magnetism, learners describe magnetic fields (8Pe.01), make an electromagnet and learn some uses, including electric bells and sorting and moving scrap metal (8Pe.02), and investigate factors that change its strength (8Pe.03).","ar":"Stage 8 has the most Physics objectives of the three stages, and it introduces calculation. \u003cstrong>8Pf.01\u003c/strong> calculates speed (speed = distance / time), \u003cstrong>8Pf.02\u003c/strong> interprets and draws simple distance/time graphs, \u003cstrong>8Pf.03\u003c/strong> covers balanced and unbalanced forces, \u003cstrong>8Pf.04\u003c/strong> turning forces (moment = force x distance) and \u003cstrong>8Pf.05\u003c/strong> pressure (pressure = force / area). \u003cstrong>8Pf.06\u003c/strong> uses particle theory to explain pressure in gases and liquids (qualitative only), and \u003cstrong>8Pf.07\u003c/strong> describes diffusion of gases and liquids. In Light and sound, all four objectives are about light: reflection and the law of reflection (8Ps.01), refraction in terms of change of speed (8Ps.02), white light and the spectrum with a prism (8Ps.03), and adding, subtracting, absorbing and reflecting colours (8Ps.04). In electricity and magnetism, learners describe magnetic fields (8Pe.01), make an electromagnet and learn some uses, including electric bells and sorting and moving scrap metal (8Pe.02), and investigate factors that change its strength (8Pe.03)."}},{"t":"scenario","title":{"en":"Qualitative only","ar":"Qualitative only"},"c":{"en":"A colleague asks learners in Year 8 to calculate the pressure of a gas using the particle model, and learners find it very difficult. \u003cstrong>What would you say?\u003c/strong> A good answer: read 8Pf.06 again. It says \"use particle theory to explain pressures in gases and liquids (qualitative only)\". Qualitative means explanation in words and diagrams, not calculation. Calculation of pressure is in 8Pf.05, which uses force and area, with the formula p = F / A in the Appendix. Separate the two tasks.","ar":"A colleague asks learners in Year 8 to calculate the pressure of a gas using the particle model, and learners find it very difficult. \u003cstrong>What would you say?\u003c/strong> A good answer: read 8Pf.06 again. It says \"use particle theory to explain pressures in gases and liquids (qualitative only)\". Qualitative means explanation in words and diagrams, not calculation. Calculation of pressure is in 8Pf.05, which uses force and area, with the formula p = F / A in the Appendix. Separate the two tasks."}},{"t":"h","c":{"en":"Stage 9: energy transfer, sound waves and circuits","ar":"Stage 9: energy transfer, sound waves and circuits"}},{"t":"p","c":{"en":"Stage 9 returns to energy with more precise ideas. \u003cstrong>9Pf.01\u003c/strong> uses density to explain why objects float or sink in water, linking to density in Chemistry (9Cp.02 and 9Cp.03). \u003cstrong>9Pf.02\u003c/strong> describes the difference between heat and temperature, \u003cstrong>9Pf.03\u003c/strong> says energy is conserved, \u003cstrong>9Pf.04\u003c/strong> says thermal energy always transfers from hotter to colder, known as heat dissipation, \u003cstrong>9Pf.05\u003c/strong> covers conduction, convection and radiation, and \u003cstrong>9Pf.06\u003c/strong> explains cooling by evaporation. In Light and sound, learners draw and interpret waveforms, linking loudness to amplitude and pitch to frequency (9Ps.01), and use waveforms to show reinforcement and cancellation (9Ps.02). In electricity, learners describe how current divides in parallel circuits (9Pe.01), measure current and voltage in series and parallel circuits (9Pe.02), calculate resistance, resistance = voltage / current (9Pe.03), and use diagrams and symbols, now including resistors (fixed and variable) and voltmeters (9Pe.04).","ar":"Stage 9 returns to energy with more precise ideas. \u003cstrong>9Pf.01\u003c/strong> uses density to explain why objects float or sink in water, linking to density in Chemistry (9Cp.02 and 9Cp.03). \u003cstrong>9Pf.02\u003c/strong> describes the difference between heat and temperature, \u003cstrong>9Pf.03\u003c/strong> says energy is conserved, \u003cstrong>9Pf.04\u003c/strong> says thermal energy always transfers from hotter to colder, known as heat dissipation, \u003cstrong>9Pf.05\u003c/strong> covers conduction, convection and radiation, and \u003cstrong>9Pf.06\u003c/strong> explains cooling by evaporation. In Light and sound, learners draw and interpret waveforms, linking loudness to amplitude and pitch to frequency (9Ps.01), and use waveforms to show reinforcement and cancellation (9Ps.02). In electricity, learners describe how current divides in parallel circuits (9Pe.01), measure current and voltage in series and parallel circuits (9Pe.02), calculate resistance, resistance = voltage / current (9Pe.03), and use diagrams and symbols, now including resistors (fixed and variable) and voltmeters (9Pe.04)."}},{"t":"h","c":{"en":"The calculations in Physics","ar":"The calculations in Physics"}},{"t":"p","c":{"en":"The Appendix lists formulae learners should be able to recall and use. Four of them appear in Physics objectives:","ar":"The Appendix lists formulae learners should be able to recall and use. Four of them appear in Physics objectives:"}},{"t":"table","head":{"en":["Formula","Word form","Symbol form","Objective","Stage"],"ar":["Formula","Word form","Symbol form","Objective","Stage"]},"rows":[{"en":["Speed","speed = distance / time","v = s / t or v = d / t","8Pf.01","8"],"ar":["Speed","speed = distance / time","v = s / t or v = d / t","8Pf.01","8"]},{"en":["Moment","moment = force x distance","M = Fs or M = Fd","8Pf.04","8"],"ar":["Moment","moment = force x distance","M = Fs or M = Fd","8Pf.04","8"]},{"en":["Pressure","pressure = force / area","p = F / A","8Pf.05","8"],"ar":["Pressure","pressure = force / area","p = F / A","8Pf.05","8"]},{"en":["Resistance","resistance = voltage / current","R = V / I","9Pe.03","9"],"ar":["Resistance","resistance = voltage / current","R = V / I","9Pe.03","9"]}]},{"t":"p","c":{"en":"Density (ρ = m / V) is also in the table of formulae and is part of 9Cp.03 in Chemistry and 9Pf.01 in Physics. The Version 3.0 change note says that the speed and pressure formulae in 8Pf.01 and 8Pf.05 are now written in the same style as for Cambridge IGCSE and O Level qualifications. Check the Appendix for the symbols and units, for example current I in A and mA, and voltage V in V and mV.","ar":"Density (ρ = m / V) is also in the table of formulae and is part of 9Cp.03 in Chemistry and 9Pf.01 in Physics. The Version 3.0 change note says that the speed and pressure formulae in 8Pf.01 and 8Pf.05 are now written in the same style as for Cambridge IGCSE and O Level qualifications. Check the Appendix for the symbols and units, for example current I in A and mA, and voltage V in V and mV."}},{"t":"p","c":{"en":"\u003cstrong>Worked example.\u003c/strong> A learner runs 100 m in 20 s. 8Pf.01: speed = distance / time = 100 / 20 = 5 m/s. The same learner's data on a distance/time graph (8Pf.02) gives a straight line with a gradient of 5 m/s. The two objectives teach the same idea in two ways: calculate it, and read it from a graph.","ar":"\u003cstrong>Worked example.\u003c/strong> A learner runs 100 m in 20 s. 8Pf.01: speed = distance / time = 100 / 20 = 5 m/s. The same learner's data on a distance/time graph (8Pf.02) gives a straight line with a gradient of 5 m/s. The two objectives teach the same idea in two ways: calculate it, and read it from a graph."}},{"t":"callout","k":"tip","title":{"en":"Good practice for ESL learners: say the formula in words","ar":"Good practice for ESL learners: say the formula in words"},"c":{"en":"Ask learners to say the formula as a sentence: \"Speed is distance divided by time.\" Then substitute numbers. Many ESL learners can do the arithmetic, but they lose marks when they cannot explain the relationship in English. Always give the unit, using the units in the Appendix.","ar":"Ask learners to say the formula as a sentence: \"Speed is distance divided by time.\" Then substitute numbers. Many ESL learners can do the arithmetic, but they lose marks when they cannot explain the relationship in English. Always give the unit, using the units in the Appendix."}},{"t":"table","head":{"en":["Idea","Stage 7","Stage 8","Stage 9"],"ar":["Idea","Stage 7","Stage 8","Stage 9"]},"rows":[{"en":["Energy","7Pf.01 energy changes; 7Pf.02 energy tends to dissipate","8Bp.02 energy stored in carbohydrates and fats (Biology link)","9Pf.03 energy is conserved; 9Pf.04 heat dissipation"],"ar":["Energy","7Pf.01 energy changes; 7Pf.02 energy tends to dissipate","8Bp.02 energy stored in carbohydrates and fats (Biology link)","9Pf.03 energy is conserved; 9Pf.04 heat dissipation"]},{"en":["Forces","7Pf.03 gravity as a force between any two objects","8Pf.03 balanced and unbalanced forces; 8Pf.04 moments; 8Pf.05 pressure","9Pf.01 density to explain floating and sinking"],"ar":["Forces","7Pf.03 gravity as a force between any two objects","8Pf.03 balanced and unbalanced forces; 8Pf.04 moments; 8Pf.05 pressure","9Pf.01 density to explain floating and sinking"]},{"en":["Waves","7Ps.01 sound as vibration of particles; 7Ps.02 echoes","8Ps.01 to 8Ps.04 reflection, refraction and colour of light","9Ps.01 and 9Ps.02 waveforms of sound"],"ar":["Waves","7Ps.01 sound as vibration of particles; 7Ps.02 echoes","8Ps.01 to 8Ps.04 reflection, refraction and colour of light","9Ps.01 and 9Ps.02 waveforms of sound"]},{"en":["Electricity","7Pe.01 to 7Pe.05 series circuits","8Pe.01 to 8Pe.03 magnetic fields and electromagnets","9Pe.01 to 9Pe.04 parallel circuits, voltage and resistance"],"ar":["Electricity","7Pe.01 to 7Pe.05 series circuits","8Pe.01 to 8Pe.03 magnetic fields and electromagnets","9Pe.01 to 9Pe.04 parallel circuits, voltage and resistance"]}]},{"t":"scenario","title":{"en":"A circuit task across two stages","ar":"A circuit task across two stages"},"c":{"en":"A Year 9 learner draws a circuit with a battery of cells, a variable resistor, a lamp and a voltmeter. \u003cstrong>Which objectives are involved, and what would you check?\u003c/strong> A good answer: 9Pe.04 (diagrams and symbols, including resistors and voltmeters) and 9Pe.02 (measure current and voltage). The learner must use the standard symbols from the Appendix. A learner who finds this hard may need to revisit 7Pe.05, which uses cells, switches, lamps, buzzers and ammeters, before moving to resistors and voltmeters.","ar":"A Year 9 learner draws a circuit with a battery of cells, a variable resistor, a lamp and a voltmeter. \u003cstrong>Which objectives are in
