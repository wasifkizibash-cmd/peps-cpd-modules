by 10 and 100","14","50%"]},{"en":["Q4","4Np.05 (Np)","Round numbers","17","61%"],"ar":["Q4","4Np.05 (Np)","Round numbers","17","61%"]},{"en":["Q5","4Nf.04 (Nf)","Equivalent proper fractions","12","43%"],"ar":["Q5","4Nf.04 (Nf)","Equivalent proper fractions","12","43%"]},{"en":["Q6","4Nf.07 (Nf)","Compare and order proper fractions","10","36%"],"ar":["Q6","4Nf.07 (Nf)","Compare and order proper fractions","10","36%"]},{"en":["Q7","4Nf.05 (Nf)","Add and subtract, same denominator","20","71%"],"ar":["Q7","4Nf.05 (Nf)","Add and subtract, same denominator","20","71%"]},{"en":["Q8","4Gg.03 (Gg)","Area and perimeter formulae","15","54%"],"ar":["Q8","4Gg.03 (Gg)","Area and perimeter formulae","15","54%"]},{"en":["Q9","4Ss.02 (Ss)","Choose and explain a representation","22","79%"],"ar":["Q9","4Ss.02 (Ss)","Choose and explain a representation","22","79%"]},{"en":["Q10","4Gt.02 (Gt)","Read time, 12- and 24-hour","23","82%"],"ar":["Q10","4Gt.02 (Gt)","Read time, 12- and 24-hour","23","82%"]}]},{"t":"p","c":{"en":"Read the table in three passes. \u003cstrong>Strong:\u003c/strong> Q1, Q9, Q10 (over 75%), so there is no need for whole-class reteaching. \u003cstrong>Middle:\u003c/strong> Q2, Q3, Q4, Q7, Q8 (50% to 71%), so these need practice and possibly a short revisit. \u003cstrong>Weak:\u003c/strong> Q5 and Q6 (under 50%), so these need teaching again, but not by repeating the same explanation. Then look at the reporting codes. The Nf questions (Q5, Q6, Q7) average about 50%, and the two weakest questions are in Nf and are about equivalence and comparing. That is a pattern: the problem is not \"fractions in general\" but \u003cstrong>equivalence and comparing fractions\u003c/strong>, the skills that depend on the idea in 4Nf.01 that more parts mean smaller parts.","ar":"Read the table in three passes. \u003cstrong>Strong:\u003c/strong> Q1, Q9, Q10 (over 75%), so there is no need for whole-class reteaching. \u003cstrong>Middle:\u003c/strong> Q2, Q3, Q4, Q7, Q8 (50% to 71%), so these need practice and possibly a short revisit. \u003cstrong>Weak:\u003c/strong> Q5 and Q6 (under 50%), so these need teaching again, but not by repeating the same explanation. Then look at the reporting codes. The Nf questions (Q5, Q6, Q7) average about 50%, and the two weakest questions are in Nf and are about equivalence and comparing. That is a pattern: the problem is not \"fractions in general\" but \u003cstrong>equivalence and comparing fractions\u003c/strong>, the skills that depend on the idea in 4Nf.01 that more parts mean smaller parts."}},{"t":"callout","k":"tip","title":{"en":"Check the question before you judge the class","ar":"Check the question before you judge the class"},"c":{"en":"A very low score may mean a poor question. Before you decide the learners did not understand, look at the question itself. Was the language difficult for ESL learners? Was the diagram unclear? Did it test two ideas at once? Good practice is to look at a sample of wrong answers (for example five learners' papers) and sort the \u003cem>errors\u003c/em>, not just count the marks.","ar":"A very low score may mean a poor question. Before you decide the learners did not understand, look at the question itself. Was the language difficult for ESL learners? Was the diagram unclear? Did it test two ideas at once? Good practice is to look at a sample of wrong answers (for example five learners' papers) and sort the \u003cem>errors\u003c/em>, not just count the marks."}},{"t":"h","c":{"en":"Step 3: look at the errors","ar":"Step 3: look at the errors"}},{"t":"p","c":{"en":"A mark tells you that an answer was wrong. The wrong answer often tells you why. For Q6 (compare 3/4 and 3/8), sorting five wrong papers might show: three learners chose 3/8 because \"8 is bigger\" (the misconception from Module 4); one learner did not understand the symbol \"&lt;\"; and one left it blank. These are three different problems, and each needs a different response. This step takes ten minutes and is worth more than any total score.","ar":"A mark tells you that an answer was wrong. The wrong answer often tells you why. For Q6 (compare 3/4 and 3/8), sorting five wrong papers might show: three learners chose 3/8 because \"8 is bigger\" (the misconception from Module 4); one learner did not understand the symbol \"&lt;\"; and one left it blank. These are three different problems, and each needs a different response. This step takes ten minutes and is worth more than any total score."}},{"t":"h","c":{"en":"Step 4: plan groupings and intervention","ar":"Step 4: plan groupings and intervention"}},{"t":"p","c":{"en":"Groupings should be \u003cstrong>flexible\u003c/strong>: based on a specific objective and changed when the evidence changes. They should not be fixed labels such as \"the low group\". Using the invented class, the teacher puts learners into three temporary groups for the next fractions lessons, based on Q5, Q6 and Q7:","ar":"Groupings should be \u003cstrong>flexible\u003c/strong>: based on a specific objective and changed when the evidence changes. They should not be fixed labels such as \"the low group\". Using the invented class, the teacher puts learners into three temporary groups for the next fractions lessons, based on Q5, Q6 and Q7:"}},{"t":"table","head":{"en":["Group (invented numbers)","Evidence","What the teacher does (good practice)","Check"],"ar":["Group (invented numbers)","Evidence","What the teacher does (good practice)","Check"]},"rows":[{"en":["A: secure (9 learners)","Correct on Q5, Q6 and Q7","Extend with a TWM task: \"Is a bigger bottom number ever a bigger fraction? Convince me\" or a problem using 4Nf.07 in a context","Short problem with reasoning"],"ar":["A: secure (9 learners)","Correct on Q5, Q6 and Q7","Extend with a TWM task: \"Is a bigger bottom number ever a bigger fraction? Convince me\" or a problem using 4Nf.07 in a context","Short problem with reasoning"]},{"en":["B: nearly there (12 learners)","Correct on Q7 but wrong on one of Q5 or Q6","Teacher-led small group for 15 minutes with fraction strips, then draw and compare","Exit ticket on 4Nf.04"],"ar":["B: nearly there (12 learners)","Correct on Q7 but wrong on one of Q5 or Q6","Teacher-led small group for 15 minutes with fraction strips, then draw and compare","Exit ticket on 4Nf.04"]},{"en":["C: not yet secure (7 learners)","Wrong on Q5 and Q6, and often Q7","Return to concrete work on 4Nf.01 (more parts, smaller parts), with pre-taught words: numerator, denominator, equal, compare","Oral check with objects, then a short written check"],"ar":["C: not yet secure (7 learners)","Wrong on Q5 and Q6, and often Q7","Return to concrete work on 4Nf.01 (more parts, smaller parts), with pre-taught words: numerator, denominator, equal, compare","Oral check with objects, then a short written check"]}]},{"t":"p","c":{"en":"The numbers 9, 12 and 7 add to 28. Notice three features. The groups are linked to objectives. The teacher knows what she will do with each group. And each group has a check, so that groups can be changed. Whole-class reteaching is better when most of the class has the same difficulty. Small-group work is better when the difficulty is limited to a few learners. As a rough rule of good practice, if more than about half the class got an objective wrong, plan to reteach it to everyone in a new way.","ar":"The numbers 9, 12 and 7 add to 28. Notice three features. The groups are linked to objectives. The teacher knows what she will do with each group. And each group has a check, so that groups can be changed. Whole-class reteaching is better when most of the class has the same difficulty. Small-group work is better when the difficulty is limited to a few learners. As a rough rule of good practice, if more than about half the class got an objective wrong, plan to reteach it to everyone in a new way."}},{"t":"h","c":{"en":"Intervention: some principles (good practice)","ar":"Intervention: some principles (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Quick:\u003c/strong> give support soon after the evidence appears, ideally within days, while the topic is still being taught.","\u003cstrong>Targeted:\u003c/strong> work on the specific objective, not on \"fractions\" in general.","\u003cstrong>Different:\u003c/strong> change the representation or the teaching, as in CRA, rather than repeating the first lesson.","\u003cstrong>Language-aware:\u003c/strong> check whether the learner needs words as well as ideas (Module 5).","\u003cstrong>Re-checked:\u003c/strong> use a new question for the same objective after the intervention, so that you know whether it worked."],"ar":["\u003cstrong>Quick:\u003c/strong> give support soon after the evidence appears, ideally within days, while the topic is still being taught.","\u003cstrong>Targeted:\u003c/strong> work on the specific objective, not on \"fractions\" in general.","\u003cstrong>Different:\u003c/strong> change the representation or the teaching, as in CRA, rather than repeating the first lesson.","\u003cstrong>Language-aware:\u003c/strong> check whether the learner needs words as well as ideas (Module 5).","\u003cstrong>Re-checked:\u003c/strong> use a new question for the same objective after the intervention, so that you know whether it worked."]}},{"t":"h","c":{"en":"Step 5: track progress over time","ar":"Step 5: track progress over time"}},{"t":"p","c":{"en":"A simple tracker records, for each learner and each objective code, a status such as \u003cem>not yet\u003c/em>, \u003cem>developing\u003c/em> or \u003cem>secure\u003c/em>, and the date. Use your school's tracker or the template your HOD provides; do not create a different version for your class alone. When you update it, record \u003cstrong>what the evidence was\u003c/strong> (for example \"unit test, Q6\" or \"exit ticket, 12 March\"), so that another teacher can understand your judgement. A few cautions:","ar":"A simple tracker records, for each learner and each objective code, a status such as \u003cem>not yet\u003c/em>, \u003cem>developing\u003c/em> or \u003cem>secure\u003c/em>, and the date. Use your school's tracker or the template your HOD provides; do not create a different version for your class alone. When you update it, record \u003cstrong>what the evidence was\u003c/strong> (for example \"unit test, Q6\" or \"exit ticket, 12 March\"), so that another teacher can understand your judgement. A few cautions:"}},{"t":"list","c":{"en":["One test is one snapshot. \"Secure\" should be based on more than one occasion.","Small numbers can mislead. In a group of seven learners, one learner is 14%.","Do not compare different tests as if they were the same scale. A 70% on an easy test and a 70% on a hard test are different things.","Compare like with like: this term's Nf results with last term's Nf results, in the same class, at similar difficulty.","When you review external results, such as Checkpoint or GL Progress Tests, use them to ask questions about teaching, not to label learners."],"ar":["One test is one snapshot. \"Secure\" should be based on more than one occasion.","Small numbers can mislead. In a group of seven learners, one learner is 14%.","Do not compare different tests as if they were the same scale. A 70% on an easy test and a 70% on a hard test are different things.","Compare like with like: this term's Nf results with last term's Nf results, in the same class, at similar difficulty.","When you review external results, such as Checkpoint or GL Progress Tests, use them to ask questions about teaching, not to label learners."]}},{"t":"scenario","title":{"en":"Scenario: a tidy spreadsheet, no action","ar":"Scenario: a tidy spreadsheet, no action"},"c":{"en":"A teacher records marks for each unit test in a spreadsheet with a total for each learner and a class average. At the end of the year she can say that the class average was 64%. She cannot say which objectives were weak or what she did about them. \u003cstrong>How can she improve her use of evidence?\u003c/strong> She can add the objective code to each question, record the results by code (as in the invented table), and write for each weak code one action and one re-check. At the next review, she can then say, \"In term 1, 4Nf.07 was 36%. I reteached using strips and re-checked in week 5, and 21 of 28 learners were correct.\" That sentence is evidence that her teaching responded to learning.","ar":"A teacher records marks for each unit test in a spreadsheet with a total for each learner and a class average. At the end of the year she can say that the class average was 64%. She cannot say which objectives were weak or what she did about them. \u003cstrong>How can she improve her use of evidence?\u003c/strong> She can add the objective code to each question, record the results by code (as in the invented table), and write for each weak code one action and one re-check. At the next review, she can then say, \"In term 1, 4Nf.07 was 36%. I reteached using strips and re-checked in week 5, and 21 of 28 learners were correct.\" That sentence is evidence that her teaching responded to learning."}}],"checks":[{"id":"m7q1","q":{"en":"In the invented Stage 4 mark sheet, which pattern is the best summary of the weakest area?","ar":"In the invented Stage 4 mark sheet, which pattern is the best summary of the weakest area?"},"opts":[{"en":"Fractions are weak in general, so the whole fractions unit should be taught again from the start with every group","ar":"Fractions are weak in general, so the whole fractions unit should be taught again from the start with every group"},{"en":"Place value is the weakest sub-strand, because both Q3 and Q4 were below 65% in the test, so teach it first","ar":"Place value is the weakest sub-strand, because both Q3 and Q4 were below 65% in the test, so teach it first"},{"en":"Equivalence and comparing fractions (Q5 and Q6, both below 50%) are weak; adding fractions is stronger","ar":"Equivalence and comparing fractions (Q5 and Q6, both below 50%) are weak; adding fractions is stronger"},{"en":"The class is weak in Geometry and Measure, because Q8 on area and perimeter was only 54% in the test paper","ar":"The class is weak in Geometry and Measure, because Q8 on area and perimeter was only 54% in the test paper"}],"correct":2,"expl":{"en":"Q5 (43%) and Q6 (36%) are the two lowest and both are fractions, but Q7 on adding fractions was 71%. Looking at the code level gives a more precise target than saying \"fractions\".","ar":"Q5 (43%) and Q6 (36%) are the two lowest and both are fractions, but Q7 on adding fractions was 71%. Looking at the code level gives a more precise target than saying \"fractions\"."}},{"id":"m7q2","q":{"en":"Why is it useful to sort the wrong answers by error type and not only to count the marks?","ar":"Why is it useful to sort the wrong answers by error type and not only to count the marks?"},"opts":[{"en":"It lets the teacher give every learner an exact class rank for the year report","ar":"It lets the teacher give every learner an exact class rank for the year report"},{"en":"It shows which learners should be moved to a lower stage for the rest of the year","ar":"It shows which learners should be moved to a lower stage for the rest of the year"},{"en":"It is the only way to decide whether a test was set at the right difficulty","ar":"It is the only way to decide whether a test was set at the right difficulty"},{"en":"Different errors have different causes and need different teaching responses","ar":"Different errors have different causes and need different teaching responses"}],"correct":3,"expl":{"en":"A wrong answer may come from a misconception, a language problem, a careless slip or a missing skill. Each needs a different response, and a mark alone does not show which one it is.","ar":"A wrong answer may come from a misconception, a language problem, a careless slip or a missing skill. Each needs a different response, and a mark alone does not show which one it is."}},{"id":"m7q3","q":{"en":"Which feature makes a grouping \"flexible\" in the sense used in this module?","ar":"Which feature makes a grouping \"flexible\" in the sense used in this module?"},"opts":[{"en":"It is based on evidence about one objective and is changed when the next check shows progress","ar":"It is based on evidence about one objective and is changed when the next check shows progress"},{"en":"It is based on last year's end-of-year grade and stays the same until the end of this year","ar":"It is based on last year's end-of-year grade and stays the same until the end of this year"},{"en":"It is based on learners' friendships so that every group works together happily","ar":"It is based on learners' friendships so that every group works together happily"},{"en":"It is decided at the start of term and displayed on the wall so that learners know their place","ar":"It is decided at the start of term and displayed on the wall so that learners know their place"}],"correct":0,"expl":{"en":"Flexible groups are linked to a specific objective and a check. When the evidence changes, learners move. Fixed ability labels can lower expectations and hide progress.","ar":"Flexible groups are linked to a specific objective and a check. When the evidence changes, learners move. Fixed ability labels can lower expectations and hide progress."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A class of 28 learners is never one group. In a typical PEPS class there will be learners who grasp new ideas in minutes, learners who need several different representations, learners with identified special educational needs and disabilities (students of determination), learners who read English slowly but think mathematically at a high level, and learners who joined the school at different times. This module looks at how to plan for them all, using the framework as your guide, and at the two main transition points for Mathematics in primary school: from FS2 into Stage 1, and from Stage 6 into Lower Secondary.","ar":"A class of 28 learners is never one group. In a typical PEPS class there will be learners who grasp new ideas in minutes, learners who need several different representations, learners with identified special educational needs and disabilities (students of determination), learners who read English slowly but think mathematically at a high level, and learners who joined the school at different times. This module looks at how to plan for them all, using the framework as your guide, and at the two main transition points for Mathematics in primary school: from FS2 into Stage 1, and from Stage 6 into Lower Secondary."}},{"t":"h","c":{"en":"What the framework says that supports inclusion","ar":"What the framework says that supports inclusion"}},{"t":"p","c":{"en":"The framework does not have a separate section on special needs. But it contains several statements that you can use:","ar":"The framework does not have a separate section on special needs. But it contains several statements that you can use:"}},{"t":"list","c":{"en":["Cambridge advocates an \u003cstrong>active learning approach\u003c/strong> where teaching and learning is student-centred so that it matches \"the experiences and needs of individuals\", with learners encouraged to work \"both individually and collaboratively\".","The CRA approach (objects, then pictures, then symbols) is developed in \u003cstrong>all primary stages\u003c/strong>, which gives many entry points to the same idea.","Learners \"can select their own preferred mathematical strategies and can suggest alternative routes\". Flexible strategies make room for different ways of thinking.","The learning objectives show \u003cstrong>clear progression\u003c/strong> \"from the previous stage and to the subsequent stage\". The framework says you need to be familiar with the progression of skills across stages \"to build on prior learning in every stage\", and that the progression of objectives across Stages 1 to 6 is available on the School Support Hub.","The framework says it is \"typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context\", and that it may be appropriate to introduce it \"at slightly different ages\"."],"ar":["Cambridge advocates an \u003cstrong>active learning approach\u003c/strong> where teaching and learning is student-centred so that it matches \"the experiences and needs of individuals\", with learners encouraged to work \"both individually and collaboratively\".","The CRA approach (objects, then pictures, then symbols) is developed in \u003cstrong>all primary stages\u003c/strong>, which gives many entry points to the same idea.","Learners \"can select their own preferred mathematical strategies and can suggest alternative routes\". Flexible strategies make room for different ways of thinking.","The learning objectives show \u003cstrong>clear progression\u003c/strong> \"from the previous stage and to the subsequent stage\". The framework says you need to be familiar with the progression of skills across stages \"to build on prior learning in every stage\", and that the progression of objectives across Stages 1 to 6 is available on the School Support Hub.","The framework says it is \"typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context\", and that it may be appropriate to introduce it \"at slightly different ages\"."]}},{"t":"p","c":{"en":"In practice, the way you include learners is by using the \u003cstrong>same learning objective\u003c/strong> with different \u003cem>routes\u003c/em> to reach it, and, where a learner needs it, by planning from an objective in an earlier stage.","ar":"In practice, the way you include learners is by using the \u003cstrong>same learning objective\u003c/strong> with different \u003cem>routes\u003c/em> to reach it, and, where a learner needs it, by planning from an objective in an earlier stage."}},{"t":"h","c":{"en":"Differentiation by task, by support and by outcome","ar":"Differentiation by task, by support and by outcome"}},{"t":"p","c":{"en":"Differentiation is often thought of as \"three worksheets\". Good practice is more flexible. Think of three levers you can change. The examples use objective \u003cstrong>3Gg.04\u003c/strong> (draw rectangles and squares; estimate, measure and calculate perimeter, and area on a square grid). The approaches below are good practice, not framework text.","ar":"Differentiation is often thought of as \"three worksheets\". Good practice is more flexible. Think of three levers you can change. The examples use objective \u003cstrong>3Gg.04\u003c/strong> (draw rectangles and squares; estimate, measure and calculate perimeter, and area on a square grid). The approaches below are good practice, not framework text."}},{"t":"table","head":{"en":["Lever","What you change","Example for 3Gg.04","Watch out for"],"ar":["Lever","What you change","Example for 3Gg.04","Watch out for"]},"rows":[{"en":["By task","The task itself differs, but all tasks serve the same objective","Group 1 finds the perimeter of given rectangles on a grid. Group 2 finds all the rectangles with a perimeter of 12 units. Group 3 predicts which of those rectangles has the greatest area and tests it.","Do not make the \"easy\" task so easy that learners never meet the thinking part of the objective"],"ar":["By task","The task itself differs, but all tasks serve the same objective","Group 1 finds the perimeter of given rectangles on a grid. Group 2 finds all the rectangles with a perimeter of 12 units. Group 3 predicts which of those rectangles has the greatest area and tests it.","Do not make the \"easy\" task so easy that learners never meet the thinking part of the objective"]},{"en":["By support","Everyone has the same task, but with different help","All learners find the area and perimeter of a classroom rectangle. Some have square tiles and a word bank, some work with a partner and a sentence frame, some have an adult to ask.","Support should be withdrawn over time, so that the learner does not become dependent"],"ar":["By support","Everyone has the same task, but with different help","All learners find the area and perimeter of a classroom rectangle. Some have square tiles and a word bank, some work with a partner and a sentence frame, some have an adult to ask.","Support should be withdrawn over time, so that the learner does not become dependent"]},{"en":["By outcome","Everyone has the same open task, and different responses are expected","\"Design a garden bed with a perimeter of 20 units.\" Some learners draw one correct design. Others find several. Others notice that the area changes while the perimeter stays the same.","Make the success criteria clear so that learners know what a good response looks like"],"ar":["By outcome","Everyone has the same open task, and different responses are expected","\"Design a garden bed with a perimeter of 20 units.\" Some learners draw one correct design. Others find several. Others notice that the area changes while the perimeter stays the same.","Make the success criteria clear so that learners know what a good response looks like"]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: keep the ceiling high and the floor low","ar":"Good practice: keep the ceiling high and the floor low"},"c":{"en":"A good inclusive task is one that everyone can start (low floor) and that no one finishes too soon (high ceiling). The perimeter 20 task above is a good example. This is more efficient than preparing a different task for every learner and it is consistent with the framework's view that a high-quality task can draw on Thinking and Working Mathematically.","ar":"A good inclusive task is one that everyone can start (low floor) and that no one finishes too soon (high ceiling). The perimeter 20 task above is a good example. This is more efficient than preparing a different task for every learner and it is consistent with the framework's view that a high-quality task can draw on Thinking and Working Mathematically."}},{"t":"h","c":{"en":"Students of determination and SEND","ar":"Students of determination and SEND"}},{"t":"p","c":{"en":"PEPS uses the term \u003cem>students of determination\u003c/em> for learners with identified special educational needs and disabilities. Your school's inclusion team, and any individual education plan (IEP) for a learner, will tell you what adjustments are needed. These ideas are good practice and they do not replace the school's guidance:","ar":"PEPS uses the term \u003cem>students of determination\u003c/em> for learners with identified special educational needs and disabilities. Your school's inclusion team, and any individual education plan (IEP) for a learner, will tell you what adjustments are needed. These ideas are good practice and they do not replace the school's guidance:"}},{"t":"list","c":{"en":["\u003cstrong>Link adjustments to objective codes.\u003c/strong> If a Stage 4 learner is working on 3Ni.07 (times tables) while the class is on 4Ni.05, record that clearly, and use the codes in the IEP and in your tracker. The progression across stages on the School Support Hub helps you find the right earlier objective.","\u003cstrong>Use the concrete and representational steps for longer.\u003c/strong> A learner who needs more time with objects is not \"behind\" in understanding. Offer that time before moving to symbols.","\u003cstrong>Reduce unnecessary load.\u003c/strong> Chunk instructions into steps, give one task at a time, use squared paper or place-value mats, and provide number lines or multiplication grids when the objective is not about recall.","\u003cstrong>Keep the thinking.\u003c/strong> Include these learners in the Thinking and Working Mathematically questions, using objects, drawings or talk, rather than only practice exercises."],"ar":["\u003cstrong>Link adjustments to objective codes.\u003c/strong> If a Stage 4 learner is working on 3Ni.07 (times tables) while the class is on 4Ni.05, record that clearly, and use the codes in the IEP and in your tracker. The progression across stages on the School Support Hub helps you find the right earlier objective.","\u003cstrong>Use the concrete and representational steps for longer.\u003c/strong> A learner who needs more time with objects is not \"behind\" in understanding. Offer that time before moving to symbols.","\u003cstrong>Reduce unnecessary load.\u003c/strong> Chunk instructions into steps, give one task at a time, use squared paper or place-value mats, and provide number lines or multiplication grids when the objective is not about recall.","\u003cstrong>Keep the thinking.\u003c/strong> Include these learners in the Thinking and Working Mathematically questions, using objects, drawings or talk, rather than only practice exercises."]}},{"t":"h","c":{"en":"Gifted and talented learners","ar":"Gifted and talented learners"}},{"t":"p","c":{"en":"For learners who grasp ideas quickly, the main risk is repetition: more of the same, or a worksheet from the next year's book. Good practice is to prefer \u003cstrong>depth\u003c/strong> over speed. The framework's aims support this: learners should \"engage in creative mathematical thinking to generate elegant solutions\", and Thinking and Working Mathematically describes Specialising, Generalising, Conjecturing, Convincing, Critiquing and Improving, which are all ways to go deeper. Ideas: ask for a generalisation, a second method and a comparison, or ask learners to pose their own problems. The framework says the schemes of work link to NRICH activities, which can help. Use objectives from later stages only with care and with your HOD's agreement, because the aim is secure and deep learning, not racing through the stages.","ar":"For learners who grasp ideas quickly, the main risk is repetition: more of the same, or a worksheet from the next year's book. Good practice is to prefer \u003cstrong>depth\u003c/strong> over speed. The framework's aims support this: learners should \"engage in creative mathematical thinking to generate elegant solutions\", and Thinking and Working Mathematically describes Specialising, Generalising, Conjecturing, Convincing, Critiquing and Improving, which are all ways to go deeper. Ideas: ask for a generalisation, a second method and a comparison, or ask learners to pose their own problems. The framework says the schemes of work link to NRICH activities, which can help. Use objectives from later stages only with care and with your HOD's agreement, because the aim is secure and deep learning, not racing through the stages."}},{"t":"h","c":{"en":"Adapting objectives for slightly different ages","ar":"Adapting objectives for slightly different ages"}},{"t":"p","c":{"en":"The framework says it may be appropriate to use it, or to introduce it, at slightly different ages to suit your context. In practice, you may meet a new Year 3 arrival who has never studied fractions, or a Year 5 learner who is clearly working at Stage 6 level. The framework does not tell you how to decide. Good practice is to: (1) check the learner's evidence against the objective codes of the stage below and above; (2) agree with your HOD which stage's objectives will be the main focus for that learner; (3) record it by code; and (4) review at regular intervals.","ar":"The framework says it may be appropriate to use it, or to introduce it, at slightly different ages to suit your context. In practice, you may meet a new Year 3 arrival who has never studied fractions, or a Year 5 learner who is clearly working at Stage 6 level. The framework does not tell you how to decide. Good practice is to: (1) check the learner's evidence against the objective codes of the stage below and above; (2) agree with your HOD which stage's objectives will be the main focus for that learner; (3) record it by code; and (4) review at regular intervals."}},{"t":"h","c":{"en":"Transition 1: FS2 into Stage 1","ar":"Transition 1: FS2 into Stage 1"}},{"t":"p","c":{"en":"The framework includes a section called \u003cstrong>Prior experience for Stage 1\u003c/strong>. It states what is expected of all learners before they start Stage 1. It also says that if learners attended kindergarten, they \"may achieve some of the Stage 1 learning objectives before starting Stage 1\" and that you \"should adapt your Stage 1 teaching appropriately\". For Thinking and Working Mathematically, it expects early years learners to explore ideas \"using language and strategies that are personal to them\". The table links the prior experience to Stage 1 objectives that build on it. The pairing is the author's, based on the framework's wording. Check the framework for full wording.","ar":"The framework includes a section called \u003cstrong>Prior experience for Stage 1\u003c/strong>. It states what is expected of all learners before they start Stage 1. It also says that if learners attended kindergarten, they \"may achieve some of the Stage 1 learning objectives before starting Stage 1\" and that you \"should adapt your Stage 1 teaching appropriately\". For Thinking and Working Mathematically, it expects early years learners to explore ideas \"using language and strategies that are personal to them\". The table links the prior experience to Stage 1 objectives that build on it. The pairing is the author's, based on the framework's wording. Check the framework for full wording."}},{"t":"table","head":{"en":["Prior experience (framework)","Builds towards Stage 1 objective","What to look for in September (good practice)"],"ar":["Prior experience (framework)","Builds towards Stage 1 objective","What to look for in September (good practice)"]},"rows":[{"en":["Counting from 1; saying which number comes next or before; chanting forwards and backwards","1Nc.04 count on and back from any number 0 to 20","Can learners start from a number other than 1?"],"ar":["Counting from 1; saying which number comes next or before; chanting forwards and backwards","1Nc.04 count on and back from any number 0 to 20","Can learners start from a number other than 1?"]},{"en":["Recognising numbers 1 to 10; touch-counting; one-to-one correspondence","1Nc.01 count objects 0 to 20, recognising conservation of number and one-to-one correspondence","Do learners count by touching, and does the count change if objects are spread out?"],"ar":["Recognising numbers 1 to 10; touch-counting; one-to-one correspondence","1Nc.01 count objects 0 to 20, recognising conservation of number and one-to-one correspondence","Do learners count by touching, and does the count change if objects are spread out?"]},{"en":["Mark-making to record numbers; attempts at symbols","1Ni.01 recite, read and write number names and whole numbers 0 to 20","How do learners write numbers? Are any reversed?"],"ar":["Mark-making to record numbers; attempts at symbols","1Ni.01 recite, read and write number names and whole numbers 0 to 20","How do learners write numbers? Are any reversed?"]},{"en":["Comparing lengths and mass with words such as longer, heavier","1Gg.02 and 1Gg.04 familiar language to describe length and mass","Do learners use comparing words correctly?"],"ar":["Comparing lengths and mass with words such as longer, heavier","1Gg.02 and 1Gg.04 familiar language to describe length and mass","Do learners use comparing words correctly?"]},{"en":["Representing and interpreting data with pictures or concrete materials","1Ss.02 record, organise and represent categorical data","Can learners sort objects and show the groups?"],"ar":["Representing and interpreting data with pictures or concrete materials","1Ss.02 record, organise and represent categorical data","Can learners sort objects and show the groups?"]}]},{"t":"p","c":{"en":"The message for Year 1 teachers: \u003cstrong>do not start from zero\u003c/strong>. Use the first weeks to find out what each learner can already do, using the prior-experience list as your checklist, and adapt your plan. Keep the same practical, language-rich approach that learners had in FS2, and bring in recording and symbols gradually.","ar":"The message for Year 1 teachers: \u003cstrong>do not start from zero\u003c/strong>. Use the first weeks to find out what each learner can already do, using the prior-experience list as your checklist, and adapt your plan. Keep the same practical, language-rich approach that learners had in FS2, and bring in recording and symbols gradually."}},{"t":"h","c":{"en":"Transition 2: Stage 6 into Lower Secondary","ar":"Transition 2: Stage 6 into Lower Secondary"}},{"t":"p","c":{"en":"The framework says that the Cambridge Pathway \"leads seamlessly from primary to secondary and pre-university years\" and that each step \"builds on the learners' development from the previous one\". At PEPS, learners follow Cambridge Lower Secondary Mathematics in Years 7 to 9. This CPD does not describe the Lower Secondary framework, so your first step is to read its first-stage objectives and the Stage 6 objectives together with your Year 7 colleagues. Good practice for a smooth transition:","ar":"The framework says that the Cambridge Pathway \"leads seamlessly from primary to secondary and pre-university years\" and that each step \"builds on the learners' development from the previous one\". At PEPS, learners follow Cambridge Lower Secondary Mathematics in Years 7 to 9. This CPD does not describe the Lower Secondary framework, so your first step is to read its first-stage objectives and the Stage 6 objectives together with your Year 7 colleagues. Good practice for a smooth transition:"}},{"t":"list","c":{"en":["\u003cstrong>Share evidence by objective code.\u003c/strong> A handover list saying \"weakest on 6Nf.05 and 6Nf.13\" is more helpful than \"weak at fractions\".","\u003cstrong>Secure the ideas that later work depends on.\u003c/strong> Examples from Stage 6: equivalence of fractions, decimals and percentages (6Nf.04), direct proportion and equivalent ratios (6Nf.12, 6Nf.13), the use of letters for varying quantities (6Nc.02), the position-to-term rule (6Nc.03), and coordinates in all four quadrants (6Gp.01).","\u003cstrong>Keep Thinking and Working Mathematically alive.\u003c/strong> Learners who have been used to explaining and justifying should carry that habit into Year 7."],"ar":["\u003cstrong>Share evidence by objective code.\u003c/strong> A handover list saying \"weakest on 6Nf.05 and 6Nf.13\" is more helpful than \"weak at fractions\".","\u003cstrong>Secure the ideas that later work depends on.\u003c/strong> Examples from Stage 6: equivalence of fractions, decimals and percentages (6Nf.04), direct proportion and equivalent ratios (6Nf.12, 6Nf.13), the use of letters for varying quantities (6Nc.02), the position-to-term rule (6Nc.03), and coordinates in all four quadrants (6Gp.01).","\u003cstrong>Keep Thinking and Working Mathematically alive.\u003c/strong> Learners who have been used to explaining and justifying should carry that habit into Year 7."]}},{"t":"scenario","title":{"en":"Scenario: the fast finisher","ar":"Scenario: the fast finisher"},"c":{"en":"Amna, in Stage 3, finishes every task early and says she is bored. Her teacher gives her pages from a Stage 5 workbook. Amna completes them with some errors and is still not engaged. \u003cstrong>What would be a better approach?\u003c/strong> Instead of moving Amna to different content, the teacher can keep the same objective and increase depth: \"Find the rectangles with perimeter 24 units. Which has the biggest area? What do you notice? Is it always true?\" This uses 3Gg.04 and develops Specialising, Generalising and Convincing. The teacher can also ask Amna to design a problem for the class and to explain her method to a partner. If her evidence shows a wider need, the teacher talks to her HOD about planning from some later-stage objectives, recorded by code.","ar":"Amna, in Stage 3, finishes every task early and says she is bored. Her teacher gives her pages from a Stage 5 workbook. Amna completes them with some errors and is still not engaged. \u003cstrong>What would be a better approach?\u003c/strong> Instead of moving Amna to different content, the teacher can keep the same objective and increase depth: \"Find the rectangles with perimeter 24 units. Which has the biggest area? What do you notice? Is it always true?\" This uses 3Gg.04 and develops Specialising, Generalising and Convincing. The teacher can also ask Amna to design a problem for the class and to explain her method to a partner. If her evidence shows a wider need, the teacher talks to her HOD about planning from some later-stage objectives, recorded by code."}}],"checks":[{"id":"m8q1","q":{"en":"What does the framework's \"Prior experience for Stage 1\" section ask Year 1 teachers to do if learners attended kindergarten?","ar":"What does the framework's \"Prior experience for Stage 1\" section ask Year 1 teachers to do if learners attended kindergarten?"},"opts":[{"en":"Start every learner at the first Stage 1 objective, so that the whole class begins together","ar":"Start every learner at the first Stage 1 objective, so that the whole class begins together"},{"en":"Adapt Stage 1 teaching, because some learners may already have met some Stage 1 objectives","ar":"Adapt Stage 1 teaching, because some learners may already have met some Stage 1 objectives"},{"en":"Move every learner who attended kindergarten directly on to the Stage 2 objectives for the year","ar":"Move every learner who attended kindergarten directly on to the Stage 2 objectives for the year"},{"en":"Repeat the kindergarten programme in full for several weeks before beginning Stage 1 teaching","ar":"Repeat the kindergarten programme in full for several weeks before beginning Stage 1 teaching"}],"correct":1,"expl":{"en":"The framework says kindergarten learners may achieve some Stage 1 objectives before starting Stage 1, and in this case you should adapt your Stage 1 teaching appropriately.","ar":"The framework says kindergarten learners may achieve some Stage 1 objectives before starting Stage 1, and in this case you should adapt your Stage 1 teaching appropriately."}},{"id":"m8q2","q":{"en":"A teacher gives all learners the task \"Design a garden bed with a perimeter of 20 units\" and expects different levels of response. Which type of differentiation is this?","ar":"A teacher gives all learners the task \"Design a garden bed with a perimeter of 20 units\" and expects different levels of response. Which type of differentiation is this?"},"opts":[{"en":"Differentiation by task, because every learner has a completely different task to complete","ar":"Differentiation by task, because every learner has a completely different task to complete"},{"en":"Differentiation by support, because every learner is given an adult to help them all lesson","ar":"Differentiation by support, because every learner is given an adult to help them all lesson"},{"en":"Differentiation by outcome: everyone has the same open task, and the responses differ","ar":"Differentiation by outcome: everyone has the same open task, and the responses differ"},{"en":"No differentiation, because the same task is given to every learner in the class","ar":"No differentiation, because the same task is given to every learner in the class"}],"correct":2,"expl":{"en":"Differentiation by outcome means that one open task allows responses of different depth. Learners find one design, several designs, or a general pattern.","ar":"Differentiation by outcome means that one open task allows responses of different depth. Learners find one design, several designs, or a general pattern."}},{"id":"m8q3","q":{"en":"What does the framework say about the age range for which the curriculum framework is used?","ar":"What does the framework say about the age range for which the curriculum framework is used?"},"opts":[{"en":"It is strictly for learners aged 5 to 11, and no other age is allowed in any circumstance","ar":"It is strictly for learners aged 5 to 11, and no other age is allowed in any circumstance"},{"en":"It is typically for learners aged 6 to 12, but it may be used for any other ages","ar":"It is typically for learners aged 6 to 12, but it may be used for any other ages"},{"en":"It is for learners aged 5 to 11, and older learners must move to Lower Secondary","ar":"It is for learners aged 5 to 11, and older learners must move to Lower Secondary"},{"en":"It is typically for ages 5 to 11, but it may suit slightly different ages in your context","ar":"It is typically for ages 5 to 11, but it may suit slightly different ages in your context"}],"correct":3,"expl":{"en":"The framework says it is typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context.","ar":"The framework says it is typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context."}}]},{"id":"m9","title":{"en":"Quality, Review and Your Action Plan","ar":"Quality, Review and Your Action Plan"},"minutes":17,"blocks":[{"t":"p","c":{"en":"You have now seen the whole journey from the framework to the classroom: planning, CRA, Thinking and Working Mathematically, number fluency, language, assessment, evidence and inclusion. This last module brings them together. It gives you a practical checklist for a curriculum-aligned Mathematics lesson, the most common mistakes, a way to build a personal action plan and five take-aways. The checklist is \u003cstrong>good practice built from the framework\u003c/strong>. It is not an official Cambridge document, and your school's own lesson-planning and observation expectations come first.","ar":"You have now seen the whole journey from the framework to the classroom: planning, CRA, Thinking and Working Mathematically, number fluency, language, assessment, evidence and inclusion. This last module brings them together. It gives you a practical checklist for a curriculum-aligned Mathematics lesson, the most common mistakes, a way to build a personal action plan and five take-aways. The checklist is \u003cstrong>good practice built from the framework\u003c/strong>. It is not an official Cambridge document, and your school's own lesson-planning and observation expectations come first."}},{"t":"h","c":{"en":"A checklist for a curriculum-aligned Mathematics lesson","ar":"A checklist for a curriculum-aligned Mathematics lesson"}},{"t":"p","c":{"en":"Use the checklist when you plan a lesson, when you review a lesson you taught, or when a colleague observes you. Each row links back to a module in this CPD. You will not see every row in every lesson, and a single lesson cannot do everything. Look for the pattern across a week.","ar":"Use the checklist when you plan a lesson, when you review a lesson you taught, or when a colleague observes you. Each row links back to a module in this CPD. You will not see every row in every lesson, and a single lesson cannot do everything. Look for the pattern across a week."}},{"t":"table","head":{"en":["Area","What you would see or plan","Module"],"ar":["Area","What you would see or plan","Module"]},"rows":[{"en":["Objective","The lesson is linked to one or two learning objective codes (for example 4Nf.07), and the lesson objective is written in learner-friendly words with success criteria","1"],"ar":["Objective","The lesson is linked to one or two learning objective codes (for example 4Nf.07), and the lesson objective is written in learner-friendly words with success criteria","1"]},{"en":["Sequence","The lesson follows earlier learning (prerequisites checked) and fits the unit plan; time is used well","1"],"ar":["Sequence","The lesson follows earlier learning (prerequisites checked) and fits the unit plan; time is used well","1"]},{"en":["CRA","New ideas begin with objects or pictures; learners are shown how pictures link to symbols; the steps are connected","2"],"ar":["CRA","New ideas begin with objects or pictures; learners are shown how pictures link to symbols; the steps are connected","2"]},{"en":["Thinking and Working Mathematically","At least one task or question asks learners to specialise, generalise, conjecture, convince, characterise, classify, critique or improve; learners give reasons","3"],"ar":["Thinking and Working Mathematically","At least one task or question asks learners to specialise, generalise, conjecture, convince, characterise, classify, critique or improve; learners give reasons","3"]},{"en":["Fluency and problem solving","Estimation comes first; more than one method is welcomed; the calculator is used to check; a problem-solving routine is used","4"],"ar":["Fluency and problem solving","Estimation comes first; more than one method is welcomed; the calculator is used to check; a problem-solving routine is used","4"]},{"en":["Misconceptions","The teacher has thought about likely errors and plans a question or task to expose them","4"],"ar":["Misconceptions","The teacher has thought about likely errors and plans a question or task to expose them","4"]},{"en":["Language","Key words are taught with pictures or objects; sentence frames and talk partners support speaking; word problems are made accessible without lowering the maths","5"],"ar":["Language","Key words are taught with pictures or objects; sentence frames and talk partners support speaking; word problems are made accessible without lowering the maths","5"]},{"en":["Assessment","The teacher checks understanding during the lesson (questions, whiteboards, exit ticket) and gives feedback linked to the objective","6"],"ar":["Assessment","The teacher checks understanding during the lesson (questions, whiteboards, exit ticket) and gives feedback linked to the objective","6"]},{"en":["Use of evidence","The next lesson is adjusted from what the check showed; groups are flexible","7"],"ar":["Use of evidence","The next lesson is adjusted from what the check showed; groups are flexible","7"]},{"en":["Inclusion and challenge","The task has a low floor and high ceiling; support and challenge are planned for named learners; learners of determination can take part","8"],"ar":["Inclusion and challenge","The task has a low floor and high ceiling; support and challenge are planned for named learners; learners of determination can take part","8"]}]},{"t":"callout","k":"tip","title":{"en":"Good practice: use the checklist as a conversation, not a tick-list","ar":"Good practice: use the checklist as a conversation, not a tick-list"},"c":{"en":"A good use of this checklist is in a short planning conversation with your HOD or a colleague: \"Which rows are my strengths? Which row will I work on this month?\" It should not be used to judge a single lesson on a single day. If you use a school observation form, follow the school form and use this checklist to prepare.","ar":"A good use of this checklist is in a short planning conversation with your HOD or a colleague: \"Which rows are my strengths? Which row will I work on this month?\" It should not be used to judge a single lesson on a single day. If you use a school observation form, follow the school form and use this checklist to prepare."}},{"t":"h","c":{"en":"Common mistakes to avoid","ar":"Common mistakes to avoid"}},{"t":"list","c":{"en":["\u003cstrong>Planning activities, not learning.\u003c/strong> The plan lists what learners will do but not what they will learn or how you will know.","\u003cstrong>Treating the scheme of work as compulsory.\u003c/strong> It is a support. The framework says you do not need to use its ideas, and that the activities do not fill all the teaching time.","\u003cstrong>Following one textbook page by page\u003c/strong> without checking that all the learning objectives are taught, or that the order suits your learners.","\u003cstrong>Rushing to the abstract step.\u003c/strong> Written methods before understanding lead to rules that learners forget or confuse.","\u003cstrong>Teaching TWM as a separate lesson\u003c/strong> and not in everyday content.","\u003cstrong>Insisting on one method for every learner,\u003c/strong> against the framework's position that learners may choose their own mental strategies.","\u003cstrong>Confusing a language gap with a mathematics gap\u003c/strong> for learners who are learning in English as a second language.","\u003cstrong>Collecting marks without using them.\u003c/strong> Data that does not lead to an action is wasted time.","\u003cstrong>Raising the stage instead of the depth\u003c/strong> for fast learners, or lowering the thinking for learners who need support.","\u003cstrong>Quoting what Cambridge assessments contain without checking.\u003c/strong> Use the School Support Hub or your Cambridge coordinator or exams officer."],"ar":["\u003cstrong>Planning activities, not learning.\u003c/strong> The plan lists what learners will do but not what they will learn or how you will know.","\u003cstrong>Treating the scheme of work as compulsory.\u003c/strong> It is a support. The framework says you do not need to use its ideas, and that the activities do not fill all the teaching time.","\u003cstrong>Following one textbook page by page\u003c/strong> without checking that all the learning objectives are taught, or that the order suits your learners.","\u003cstrong>Rushing to the abstract step.\u003c/strong> Written methods before understanding lead to rules that learners forget or confuse.","\u003cstrong>Teaching TWM as a separate lesson\u003c/strong> and not in everyday content.","\u003cstrong>Insisting on one method for every learner,\u003c/strong> against the framework's position that learners may choose their own mental strategies.","\u003cstrong>Confusing a language gap with a mathematics gap\u003c/strong> for learners who are learning in English as a second language.","\u003cstrong>Collecting marks without using them.\u003c/strong> Data that does not lead to an action is wasted time.","\u003cstrong>Raising the stage instead of the depth\u003c/strong> for fast learners, or lowering the thinking for learners who need support.","\u003cstrong>Quoting what Cambridge assessments contain without checking.\u003c/strong> Use the School Support Hub or your Cambridge coordinator or exams officer."]}},{"t":"h","c":{"en":"Build your personal action plan","ar":"Build your personal action plan"}},{"t":"p","c":{"en":"A good action plan is small. Choose \u003cstrong>one or two\u003c/strong> changes, not ten. Follow these steps (this method is good practice):","ar":"A good action plan is small. Choose \u003cstrong>one or two\u003c/strong> changes, not ten. Follow these steps (this method is good practice):"}},{"t":"steps","c":{"en":["\u003cstrong>Reflect.\u003c/strong> Using the checklist, choose one row where you want to improve. Use evidence such as your last unit plan, a set of learners' books or a recent test analysis.","\u003cstrong>Choose one action that you can do in four weeks.\u003c/strong> \"Improve my teaching\" is too wide. \"Plan all three CRA steps for the fractions unit in Stage 3\" is clear.","\u003cstrong>Decide how you will know it worked.\u003c/strong> For example, \"Learners explain their method in at least two lessons each week\", or \"I will tag all unit test questions with objective codes.\"","\u003cstrong>Ask for support.\u003c/strong> Is there a colleague to plan with, a lesson to observe, a resource on the School Support Hub, or time to discuss with your HOD?","\u003cstrong>Set a review date\u003c/strong> and write down what you will look at on that day."],"ar":["\u003cstrong>Reflect.\u003c/strong> Using the checklist, choose one row where you want to improve. Use evidence such as your last unit plan, a set of learners' books or a recent test analysis.","\u003cstrong>Choose one action that you can do in four weeks.\u003c/strong> \"Improve my teaching\" is too wide. \"Plan all three CRA steps for the fractions unit in Stage 3\" is clear.","\u003cstrong>Decide how you will know it worked.\u003c/strong> For example, \"Learners explain their method in at least two lessons each week\", or \"I will tag all unit test questions with objective codes.\"","\u003cstrong>Ask for support.\u003c/strong> Is there a colleague to plan with, a lesson to observe, a resource on the School Support Hub, or time to discuss with your HOD?","\u003cstrong>Set a review date\u003c/strong> and write down what you will look at on that day."]}},{"t":"scenario","title":{"en":"Example action plan: a Stage 5 teacher","ar":"Example action plan: a Stage 5 teacher"},"c":{"en":"\u003cstrong>Focus area:\u003c/strong> misconceptions and evidence (Modules 4 and 7). \u003cstrong>Action (4 weeks):\u003c/strong> Before the Stage 5 decimals unit (5Np.01 to 5Np.05 and 5Nf.08), identify three likely misconceptions (for example \"longer decimal is bigger\"), prepare one agree/disagree statement for each, and tag every question in the end-of-unit test with an objective code. \u003cstrong>Evidence of success:\u003c/strong> after the test, a mark sheet by code, three actions for the weakest codes, and a re-check of the weakest code two weeks later. \u003cstrong>Support:\u003c/strong> share the mark sheet with the HOD and ask a colleague to observe one lesson using the statements. \u003cstrong>Review date:\u003c/strong> week 5, to compare the first and second checks.","ar":"\u003cstrong>Focus area:\u003c/strong> misconceptions and evidence (Modules 4 and 7). \u003cstrong>Action (4 weeks):\u003c/strong> Before the Stage 5 decimals unit (5Np.01 to 5Np.05 and 5Nf.08), identify three likely misconceptions (for example \"longer decimal is bigger\"), prepare one agree/disagree statement for each, and tag every question in the end-of-unit test with an objective code. \u003cstrong>Evidence of success:\u003c/strong> after the test, a mark sheet by code, three actions for the weakest codes, and a re-check of the weakest code two weeks later. \u003cstrong>Support:\u003c/strong> share the mark sheet with the HOD and ask a colleague to observe one lesson using the statements. \u003cstrong>Review date:\u003c/strong> week 5, to compare the first and second checks."}},{"t":"h","c":{"en":"Questions to ask yourself every term","ar":"Questions to ask yourself every term"}},{"t":"list","c":{"en":["Can I say which objectives I am teaching this half term, by code?","For each, do I know what learners should have learned before, and what they will meet next stage?","Where did learners use objects, pictures and symbols this week?","Which question made learners explain, convince or improve?","Whose language, not mathematics, is holding them back?","What did my last assessment tell me, and what did I change?","Who needed more support, and who needed more challenge?"],"ar":["Can I say which objectives I am teaching this half term, by code?","For each, do I know what learners should have learned before, and what they will meet next stage?","Where did learners use objects, pictures and symbols this week?","Which question made learners explain, convince or improve?","Whose language, not mathematics, is holding them back?","What did my last assessment tell me, and what did I change?","Who needed more support, and who needed more challenge?"]}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1. Plan from the objectives.\u003c/strong> Learning objectives, with their codes, are the reference for planning and for checking. Schemes of work are helpful but not compulsory. Time is guided by 4 to 5 hours a week, and your own timetable decides the actual hours.\u003cbr>\u003cstrong>2. Use CRA in every stage.\u003c/strong> Objects, then pictures, then symbols, with the links shown, builds understanding.\u003cbr>\u003cstrong>3. Embed Thinking and Working Mathematically and flexible number strategies.\u003c/strong> Ask learners to explain, convince, compare and improve. Estimate first, and let learners choose strategies.\u003cbr>\u003cstrong>4. Support language and use evidence.\u003c/strong> Teach the language of Mathematics explicitly for ESL learners, and use objective codes and several sources of evidence to adjust teaching.\u003cbr>\u003cstrong>5. Include and challenge every learner.\u003c/strong> Use the same objective with different routes, plan the transitions into Stage 1 and out of Stage 6, and keep reviewing your practice.\u003cbr>\u003cbr>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.","ar":"\u003cstrong>1. Plan from the objectives.\u003c/strong> Learning objectives, with their codes, are the reference for planning and for checking. Schemes of work are helpful but not compulsory. Time is guided by 4 to 5 hours a week, and your own timetable decides the actual hours.\u003cbr>\u003cstrong>2. Use CRA in every stage.\u003c/strong> Objects, then pictures, then symbols, with the links shown, builds understanding.\u003cbr>\u003cstrong>3. Embed Thinking and Working Mathematically and flexible number strategies.\u003c/strong> Ask learners to explain, convince, compare and improve. Estimate first, and let learners choose strategies.\u003cbr>\u003cstrong>4. Support language and use evidence.\u003c/strong> Teach the language of Mathematics explicitly for ESL learners, and use objective codes and several sources of evidence to adjust teaching.\u003cbr>\u003cstrong>5. Include and challenge every learner.\u003c/strong> Use the same objective with different routes, plan the transitions into Stage 1 and out of Stage 6, and keep reviewing your practice.\u003cbr>\u003cbr>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance."}}],"checks":[{"id":"m9q1","q":{"en":"Which action is the strongest personal action plan item?","ar":"Which action is the strongest personal action plan item?"},"opts":[{"en":"Plan all three CRA steps for the Stage 3 fractions unit and check learners' explanations in four weeks","ar":"Plan all three CRA steps for the Stage 3 fractions unit and check learners' explanations in four weeks"},{"en":"Improve my teaching of Mathematics so that learners achieve better results by the end of the year","ar":"Improve my teaching of Mathematics so that learners achieve better results by the end of the year"},{"en":"Read the whole curriculum framework again from the beginning during the holidays so that every objective is remembered","ar":"Read the whole curriculum framework again from the beginning during the holidays so that every objective is remembered"},{"en":"Use more practical equipment in lessons whenever the budget makes this possible for the school","ar":"Use more practical equipment in lessons whenever the budget makes this possible for the school"}],"correct":0,"expl":{"en":"A strong action is specific, limited to a short time, and has a way of knowing that it worked. The other options are too broad, have no review point or have no measure of success.","ar":"A strong action is specific, limited to a short time, and has a way of knowing that it worked. The other options are too broad, have no review point or have no measure of success."}},{"id":"m9q2","q":{"en":"Which situation is a \"common mistake\" described in this module?","ar":"Which situation is a \"common mistake\" described in this module?"},"opts":[{"en":"Using objects before pictures when a new idea is introduced to a Stage 4 class","ar":"Using objects before pictures when a new idea is introduced to a Stage 4 class"},{"en":"Teaching Thinking and Working Mathematically only in a separate weekly lesson","ar":"Teaching Thinking and Working Mathematically only in a separate weekly lesson"},{"en":"Writing the learning objective code next to each question in an end-of-unit test","ar":"Writing the learning objective code next to each question in an end-of-unit test"},{"en":"Welcoming several correct mental strategies for the same calculation in a lesson","ar":"Welcoming several correct mental strategies for the same calculation in a lesson"}],"correct":1,"expl":{"en":"The framework says Thinking and Working Mathematically should not be taught as a separate special activity but be embedded throughout the curriculum. The other options are recommended practices.","ar":"The framework says Thinking and Working Mathematically should not be taught as a separate special activity but be embedded throughout the curriculum. The other options are recommended practices."}},{"id":"m9q3","q":{"en":"How should the lesson checklist in this module be used?","ar":"How should the lesson checklist in this module be used?"},"opts":[{"en":"As the official Cambridge inspection form, which must be completed for every lesson that is observed","ar":"As the official Cambridge inspection form, which must be completed for every lesson that is observed"},{"en":"As a scoring sheet that gives each teacher a number out of 10 after a single observation","ar":"As a scoring sheet that gives each teacher a number out of 10 after a single observation"},{"en":"As good practice for planning and reflection, alongside the school's own expectations","ar":"As good practice for planning and reflection, alongside the school's own expectations"},{"en":"As a replacement for the school's lesson-planning policy and observation procedure in the department","ar":"As a replacement for the school's lesson-planning policy and observation procedure in the department"}],"correct":2,"expl":{"en":"The checklist is built from the framework and from good practice. It is not a Cambridge document, and the school's own guidance comes first.","ar":"The checklist is built from the framework and from good practice. It is not a Cambridge document, and the school's own guidance comes first."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A teacher sees the code 3Nf.02 in the framework. What does the final number \"02\" tell her?","ar":"A teacher sees the code 3Nf.02 in the framework. What does the final number \"02\" tell her?"},"opts":[{"en":"It means the objective is normally taught in the second term of Stage 3","ar":"It means the objective is normally taught in the second term of Stage 3"},{"en":"It means the objective builds on a matching code, 2Nf.02, in Stage 2","ar":"It means the objective builds on a matching code, 2Nf.02, in Stage 2"},{"en":"It means the objective carries two marks in the Stage 3 Cambridge test","ar":"It means the objective carries two marks in the Stage 3 Cambridge test"},{"en":"It is the second learning objective in the fractions sub-strand for Stage 3","ar":"It is the second learning objective in the fractions sub-strand for Stage 3"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A lesson plan reads: \"Learning objective: use fraction strips.\" What is the best improvement?","ar":"A lesson plan reads: \"Learning objective: use fraction strips.\" What is the best improvement?"},"opts":[{"en":"Write the objective as what learners will learn, and treat the strips as the activity","ar":"Write the objective as what learners will learn, and treat the strips as the activity"},{"en":"Add a second activity, such as a worksheet, so that the lesson is full for the whole hour","ar":"Add a second activity, such as a worksheet, so that the lesson is full for the whole hour"},{"en":"Replace the strips with the activity from the scheme of work, because it is official","ar":"Replace the strips with the activity from the scheme of work, because it is official"},{"en":"Keep the wording, because the objective and the activity can be the same sentence","ar":"Keep the wording, because the objective and the activity can be the same sentence"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A department plans a Stage 3 fractions unit. Which order of ideas earners can spell numerator and denominator correctly before they begin"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"In a Stage 2 lesson on arrays, a learner draws a correct 3 by 4 array but cannot write a matching number sentence. What should the teacher do next?","ar":"In a Stage 2 lesson on arrays, a learner draws a correct 3 by 4 array but cannot write a matching number sentence. What should the teacher do next?"},"opts":[{"en":"Give the learner the multiplication table and ask for only the answer to 3 × 4 = 12","ar":"Give the learner the multiplication table and ask for only the answer to 3 × 4 = 12"},{"en":"Remove the drawing and ask the learner to copy the number sentence from the board","ar":"Remove the drawing and ask the learner to copy the number sentence from the board"},{"en":"Ask the learner to draw a larger array with more rows and then try again alone","ar":"Ask the learner to draw a larger array with more rows and then try again alone"},{"en":"Point to rows in the drawing and ask learners where each number in 4 + 4 + 4 appears","ar":"Point to rows in the drawing and ask learners where each number in 4 + 4 + 4 appears"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"A Stage 6 teacher wants a concrete start for 6Gg.10, the angles in a triangle. Which is the best choice?","ar":"A Stage 6 teacher wants a concrete start for 6Gg.10, the angles in a triangle. Which is the best choice?"},"opts":[{"en":"Learners tear off the corners of a paper triangle and fit them together along a straight line","ar":"Learners tear off the corners of a paper triangle and fit them together along a straight line"},{"en":"Learners measure three triangles with a protractor and then write the rule in their books","ar":"Learners measure three triangles with a protractor and then write the rule in their books"},{"en":"Learners copy the rule that the angles add up to 180° and then do ten missing-angle questions","ar":"Learners copy the rule that the angles add up to 180° and then do  mental strategies are less important than a single agreed written method","ar":"It fits, because mental strategies are less important than a single agreed written method"},{"en":"It does not fit, because the framework bans partitioning and allows only number lines","ar":"It does not fit, because the framework bans partitioning and allows only number lines"}],"correct":0},{"id":"e11","mod":4,"q":{"en":"A Stage 5 class works on 18 × 32. According to the framework's calculation sequence, what should learners do first?","ar":"A Stage 5 class works on 18 × 32. According to the framework's calculation sequence, what should learners do first?"},"opts":[{"en":"Enter the numbers into a calculator and then explain the answer","ar":"Enter the numbers into a calculator and then explain the answer"},{"en":"Estimate the answer, for example 20 × 30 = 600, before calculating","ar":"Estimate the answer, for example 20 × 30 = 600, before calculating"},{"en":"Write the full column method and then round the answer at the end","ar":"Write the full column method and then round the answer at the end"},{"en":"Choose the written layout that the teacher showed on the previous day","ar":"Choose the written layout that the teacher showed on the previous day"}],"correct":1},{"id":"e12","mod":4,"q":{"en":"A learner says 0.45 is bigger than 0.5 \"because 45 is bigger than 5\". Which response best addresses the misconception?","ar":"A learner says 0.45 is bigger than 0.5 \"because 45 is bigger than 5\". Which response best addresses the misconception?"},"opts":[{"en":"Explain that the rule is to look at the digit after the decimal point and ignore the rest","ar":"Explain that the rule is to look at the digit after the decimal point and ignore the rest"},{"en":"Ask the learner to write 0.45 and 0.5 as many times as possible for practice","ar":"Ask the learner to write 0.45 and 0.5 as many times as possible for practice"},{"en":"Shade 0.45 and 0.5 on a 100-square or place them on a number line from 0 to 1 and compare","ar":"Shade 0.45 and 0.5 on a 100-square or place them on a number line from 0 to 1 and compare"},{"en":"Tell the learner that decimals are different and should be learned in Stage 6","ar":"Tell the learner that decimals are different and should be learned in Stage 6"}],"correct":2},{"id":"e13","mod":5,"q":{"en":"A Stage 1 teacher introduces the word \"face\" in 1Gg.03 while teaching 3D shapes. Which approach is best for ESL learners?","ar":"A Stage 1 teacher introduces the word \"face\" in 1Gg.03 while teaching 3D shapes. Which approach is best for ESL learners?"},"opts":[{"en":"Write the word on the board and ask learners to copy its spelling carefully five times","ar":"Write the word on the board and ask learners to copy its spelling carefully five times"},{"en":"Explain the meaning in a long spoken definition and then ask for questions","ar":"Explain the meaning in a long spoken definition and then ask for questions"},{"en":"Avoid the word and use \"side\" for all shapes so that the language stays simple for everyone","ar":"Avoid the word and use \"side\" for all shapes so that the language stays simple for everyone"},{"en":"Hold a cuboid, point to a flat face, say the word, and compare it with a person's face","ar":"Hold a cuboid, point to a flat face, say the word, and compare it with a person's face"}],"correct":3},{"id":"e14","mod":5,"q":{"en":"A display says \"I know that ... because ...\". Which Thinking and Working Mathematically pair does this frame mainly support?","ar":"A display says \"I know that ... because ...\". Which Thinking and Working Mathematically pair does this frame mainly support?"},"opts":[{"en":"Conjecturing and Convincing, because learners give a reason or evidence for an idea","ar":"Conjecturing and Convincing, because learners give a reason or evidence for an idea"},{"en":"Specialising and Generalising, because learners list many examples of a single number","ar":"Specialising and Generalising, because learners list many examples of a single number"},{"en":"Characterising and Classifying, because learners describe the parts of a shape","ar":"Characterising and Classifying, because learners describe the parts of a shape"},{"en":"Critiquing and Improving, because learners rewrite a method until it is shorter","ar":"Critiquing and Improving, because learners rewrite a method until it is shorter"}],"correct":0},{"id":"e15","mod":5,"q":{"en":"A Stage 4 learner finds it easier to discuss a problem in Arabic. What is the best use of this?","ar":"A Stage 4 learner finds it easier to discuss a problem in Arabic. What is the best use of this?"},"opts":[{"en":"Ask the learner to stop using Arabic in lessons, so that English develops faster","ar":"Ask the learner to stop using Arabic in lessons, so that English develops faster"},{"en":"Let the learner discuss first with a partner in Arabic, then explain in English","ar":"Let the learner discuss first with a partner in Arabic, then explain in English"},{"en":"Give the learner an Arabic worksheet and mark only the final answers","ar":"Give the learner an Arabic worksheet and mark only the final answers"},{"en":"Wait until the learner can explain in English before giving harder problems","ar":"Wait until the learner can explain in English before giving harder problems"}],"correct":1},{"id":"e16","mod":5,"q":{"en":"A word problem on 4Ni.05 uses long English sentences. Which adjustment keeps the Stage 4 mathematics at the right level?","ar":"A word problem on 4Ni.05 uses long English sentences. Which adjustment keeps the Stage 4 mathematics at the right level?"},"opts":[{"en":"Replace the numbers with smaller numbers so that the problem is shorter to solve","ar":"Replace the numbers with smaller numbers so that the problem is shorter to solve"},{"en":"Remove the word problem and give the class only calculations in this unit","ar":"Remove the word problem and give the class only calculations in this unit"},{"en":"Read it aloud twice, underli function renderBlock(b){

    case 'h': return `<h3>${b.c[L_]}</h3>`;

}
