. The rest of the week they work through textbook exercises quietly. \u003cstrong>Is this what the framework intends?\u003c/strong> No. The framework says TWM should not be taught as a separate special activity. The teacher can keep a Friday puzzle if it is useful, but should also add one or two thinking questions to every lesson. For example, in Monday's lesson on 4Np.02 (multiply and divide by 10 and 100) she could ask, \"Is it true that multiplying by 10 just adds a zero? Try 3.5 × 10.\" That is Conjecturing and Convincing inside the normal content.","ar":"A teacher plans a TWM challenge every Friday and teaches normal lessons from Monday to Thursday. In the Friday challenge, learners solve a puzzle. The rest of the week they work through textbook exercises quietly. \u003cstrong>Is this what the framework intends?\u003c/strong> No. The framework says TWM should not be taught as a separate special activity. The teacher can keep a Friday puzzle if it is useful, but should also add one or two thinking questions to every lesson. For example, in Monday's lesson on 4Np.02 (multiply and divide by 10 and 100) she could ask, \"Is it true that multiplying by 10 just adds a zero? Try 3.5 × 10.\" That is Conjecturing and Convincing inside the normal content."}},{"t":"callout","k":"warn","title":{"en":"Common mistakes","ar":"Common mistakes"},"c":{"en":"Treating the eight characteristics as a checklist to tick on every task (the framework says a task may draw on one or more); labelling a task \"Convincing\" when the answer is checked only by the teacher; asking \"Why?\" but accepting \"Because\" as an answer; and allowing the same two confident learners to give all the reasons while the rest stay silent.","ar":"Treating the eight characteristics as a checklist to tick on every task (the framework says a task may draw on one or more); labelling a task \"Convincing\" when the answer is checked only by the teacher; asking \"Why?\" but accepting \"Because\" as an answer; and allowing the same two confident learners to give all the reasons while the rest stay silent."}}],"checks":[{"id":"m3q1","q":{"en":"What does the framework say about how Thinking and Working Mathematically should be taught?","ar":"What does the framework say about how Thinking and Working Mathematically should be taught?"},"opts":[{"en":"It should be taught in a dedicated weekly lesson in every stage, using puzzles and games","ar":"It should be taught in a dedicated weekly lesson in every stage, using puzzles and games"},{"en":"It should be taught only in Stages 5 and 6, once learners know the main number facts","ar":"It should be taught only in Stages 5 and 6, once learners know the main number facts"},{"en":"It should be embedded throughout the curriculum and not taught as a separate special activity","ar":"It should be embedded throughout the curriculum and not taught as a separate special activity"},{"en":"It should be taught as its own strand, with separate assessment in every term of the school year","ar":"It should be taught as its own strand, with separate assessment in every term of the school year"}],"correct":2,"expl":{"en":"The framework says TWM is not an independent strand. It is embedded within and across the other strands and should not be taught as a separate special activity.","ar":"The framework says TWM is not an independent strand. It is embedded within and across the other strands and should not be taught as a separate special activity."}},{"id":"m3q2","q":{"en":"A teacher says, \"A square is always a rectangle. Prove it or find an example that does not work.\" Which pair of characteristics does this task mainly use?","ar":"A teacher says, \"A square is always a rectangle. Prove it or find an example that does not work.\" Which pair of characteristics does this task mainly use?"},"opts":[{"en":"Specialising and Generalising, because learners must record many number examples in a table","ar":"Specialising and Generalising, because learners must record many number examples in a table"},{"en":"Characterising and Classifying, because learners must sort shapes into groups of the same size","ar":"Characterising and Classifying, because learners must sort shapes into groups of the same size"},{"en":"Critiquing and Improving, because learners must choose a faster calculation method and then explain it","ar":"Critiquing and Improving, because learners must choose a faster calculation method and then explain it"},{"en":"Conjecturing and Convincing, because learners must form an idea and present evidence for or against it","ar":"Conjecturing and Convincing, because learners must form an idea and present evidence for or against it"}],"correct":3,"expl":{"en":"Deciding whether a statement is always true involves forming and testing an idea (Conjecturing) and giving evidence (Convincing). Many tasks also touch other pairs, which the framework says is normal.","ar":"Deciding whether a statement is always true involves forming and testing an idea (Conjecturing) and giving evidence (Convincing). Many tasks also touch other pairs, which the framework says is normal."}},{"id":"m3q3","q":{"en":"Which change turns \"Calculate 124 × 3\" into a task that develops Critiquing and Improving?","ar":"Which change turns \"Calculate 124 × 3\" into a task that develops Critiquing and Improving?"},"opts":[{"en":"Show three methods for the same calculation and ask learners to compare them and improve one","ar":"Show three methods for the same calculation and ask learners to compare them and improve one"},{"en":"Give learners ten more multiplication questions of the same type and ask them to work faster","ar":"Give learners ten more multiplication questions of the same type and ask them to work faster"},{"en":"Ask learners to check the answer with a calculator and write \"correct\" or \"wrong\" next to each one","ar":"Ask learners to check the answer with a calculator and write \"correct\" or \"wrong\" next to each one"},{"en":"Ask learners to copy the method from the board and then repeat it with new numbers","ar":"Ask learners to copy the method from the board and then repeat it with new numbers"}],"correct":0,"expl":{"en":"The framework defines Critiquing as comparing and evaluating ideas or solutions to identify advantages and disadvantages, and Improving as refining them. Comparing and improving methods does both.","ar":"The framework defines Critiquing as comparing and evaluating ideas or solutions to identify advantages and disadvantages, and Improving as refining them. Comparing and improving methods does both."}}]},{"id":"m4","title":{"en":"Number Fluency, Problem Solving and Common Misconceptions","ar":"Number Fluency, Problem Solving and Common Misconceptions"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Number is called the foundation of the primary curriculum. The framework says that in this strand learners \"explore the five principles of counting and develop number fluency, demonstrating \u003cstrong>flexibility, efficiency and accuracy\u003c/strong> in the computational strategies that they choose\". Notice the word \u003cem>choose\u003c/em>. This module looks at what that means for your teaching of calculation, how to teach problem solving, and how to deal with the misconceptions that are most common in place value and fractions.","ar":"Number is called the foundation of the primary curriculum. The framework says that in this strand learners \"explore the five principles of counting and develop number fluency, demonstrating \u003cstrong>flexibility, efficiency and accuracy\u003c/strong> in the computational strategies that they choose\". Notice the word \u003cem>choose\u003c/em>. This module looks at what that means for your teaching of calculation, how to teach problem solving, and how to deal with the misconceptions that are most common in place value and fractions."}},{"t":"h","c":{"en":"The framework's position on mental strategies","ar":"The framework's position on mental strategies"}},{"t":"p","c":{"en":"The framework says that mental strategies \"are important skills of mathematics and are at the core of developing learners' mathematical understanding\". It then adds a very important point: \u003cstrong>\"this curriculum does not require learners to follow or practise specific strategies.\"\u003c/strong> The reason it gives is that greater flexibility means learners can see mental strategies as \"a more personal and a less formal choice\" and have greater ownership over which mental strategies they develop.","ar":"The framework says that mental strategies \"are important skills of mathematics and are at the core of developing learners' mathematical understanding\". It then adds a very important point: \u003cstrong>\"this curriculum does not require learners to follow or practise specific strategies.\"\u003c/strong> The reason it gives is that greater flexibility means learners can see mental strategies as \"a more personal and a less formal choice\" and have greater ownership over which mental strategies they develop."}},{"t":"p","c":{"en":"What does this mean in the classroom? It does \u003cem>not\u003c/em> mean that you stop teaching strategies. It means you teach a range of strategies, you value several correct methods, and you do not insist that every learner uses the same one. A learner who finds 48 + 37 by doing 50 + 37 - 2, and a learner who does 40 + 30 and 8 + 7, are both calculating well. The teacher's job is to ask which method is efficient and accurate for these numbers, and why.","ar":"What does this mean in the classroom? It does \u003cem>not\u003c/em> mean that you stop teaching strategies. It means you teach a range of strategies, you value several correct methods, and you do not insist that every learner uses the same one. A learner who finds 48 + 37 by doing 50 + 37 - 2, and a learner who does 40 + 30 and 8 + 7, are both calculating well. The teacher's job is to ask which method is efficient and accurate for these numbers, and why."}},{"t":"callout","k":"key","title":{"en":"The calculation sequence in the framework","ar":"The calculation sequence in the framework"},"c":{"en":"The framework says learners develop confidence in calculating \"by learning to \u003cstrong>estimate first, calculate mentally and use written strategies before using a calculator to check\u003c/strong> their solutions.\" Four steps: (1) estimate, (2) calculate mentally, (3) use written strategies, (4) check with a calculator. The calculator is for \u003cem>checking\u003c/em>, not for replacing the thinking. Many Number objectives begin with the word \"Estimate\", for example 4Ni.02, 5Ni.04 and 6Ni.04.","ar":"The framework says learners develop confidence in calculating \"by learning to \u003cstrong>estimate first, calculate mentally and use written strategies before using a calculator to check\u003c/strong> their solutions.\" Four steps: (1) estimate, (2) calculate mentally, (3) use written strategies, (4) check with a calculator. The calculator is for \u003cem>checking\u003c/em>, not for replacing the thinking. Many Number objectives begin with the word \"Estimate\", for example 4Ni.02, 5Ni.04 and 6Ni.04."}},{"t":"h","c":{"en":"Worked example: estimate first, then choose","ar":"Worked example: estimate first, then choose"}},{"t":"p","c":{"en":"Objective \u003cstrong>5Ni.04\u003c/strong> (estimate and multiply whole numbers up to 1,000 by 1-digit or 2-digit whole numbers). The question is 18 × 32.","ar":"Objective \u003cstrong>5Ni.04\u003c/strong> (estimate and multiply whole numbers up to 1,000 by 1-digit or 2-digit whole numbers). The question is 18 × 32."}},{"t":"steps","c":{"en":["\u003cstrong>Estimate.\u003c/strong> Round to numbers that are easy: 18 is close to 20, and 32 is close to 30. 20 × 30 = 600. So the answer should be near 600. A learner who writes 5,760 or 57.6 can see at once that something is wrong.","\u003cstrong>Calculate mentally (where sensible).\u003c/strong> One learner may think, \"18 × 32 is 18 × 30 + 18 × 2 = 540 + 36.\" Another may think, \"32 × 18 is 32 × 20 - 32 × 2 = 640 - 64.\" Both are mental strategies. Let both be shared and compared.","\u003cstrong>Use a written strategy.\u003c/strong> For harder numbers, use a written layout that the school uses (grid or column). Write each step so that the thinking can be checked.","\u003cstrong>Check.\u003c/strong> Use a calculator (576), then compare with the estimate (600). If they are far apart, find the error."],"ar":["\u003cstrong>Estimate.\u003c/strong> Round to numbers that are easy: 18 is close to 20, and 32 is close to 30. 20 × 30 = 600. So the answer should be near 600. A learner who writes 5,760 or 57.6 can see at once that something is wrong.","\u003cstrong>Calculate mentally (where sensible).\u003c/strong> One learner may think, \"18 × 32 is 18 × 30 + 18 × 2 = 540 + 36.\" Another may think, \"32 × 18 is 32 × 20 - 32 × 2 = 640 - 64.\" Both are mental strategies. Let both be shared and compared.","\u003cstrong>Use a written strategy.\u003c/strong> For harder numbers, use a written layout that the school uses (grid or column). Write each step so that the thinking can be checked.","\u003cstrong>Check.\u003c/strong> Use a calculator (576), then compare with the estimate (600). If they are far apart, find the error."]}},{"t":"p","c":{"en":"The class discussion is the best part: \"Which method would you use for 18 × 32? For 18 × 99? Why?\" This is flexibility, efficiency and accuracy in action, and it is also Critiquing in the TWM sense.","ar":"The class discussion is the best part: \"Which method would you use for 18 × 32? For 18 × 99? Why?\" This is flexibility, efficiency and accuracy in action, and it is also Critiquing in the TWM sense."}},{"t":"h","c":{"en":"Fluency is more than speed","ar":"Fluency is more than speed"}},{"t":"p","c":{"en":"Good practice is to separate three things that are often mixed together. \u003cstrong>Fluency\u003c/strong> means accurate, flexible and reasonably quick use of facts and methods, for example knowing all times tables from 1 to 10 by Stage 4 (4Ni.04). \u003cstrong>Understanding\u003c/strong> means knowing why a method works. \u003cstrong>Problem solving\u003c/strong> means using both in a new situation. A learner who can recall 7 × 8 but cannot say what 7 × 8 means is fluent but may not understand. A learner who understands but is very slow may need more practice. Plan for all three.","ar":"Good practice is to separate three things that are often mixed together. \u003cstrong>Fluency\u003c/strong> means accurate, flexible and reasonably quick use of facts and methods, for example knowing all times tables from 1 to 10 by Stage 4 (4Ni.04). \u003cstrong>Understanding\u003c/strong> means knowing why a method works. \u003cstrong>Problem solving\u003c/strong> means using both in a new situation. A learner who can recall 7 × 8 but cannot say what 7 × 8 means is fluent but may not understand. A learner who understands but is very slow may need more practice. Plan for all three."}},{"t":"list","c":{"en":["\u003cstrong>Short, regular practice:\u003c/strong> five minutes of mental work at the start of most lessons is more effective than one long session each week.","\u003cstrong>Use known facts to find unknown facts:\u003c/strong> if 6 × 8 = 48, then 7 × 8 = 48 + 8. This uses the distributive property (3Ni.06) and gives learners a strategy when memory fails.","\u003cstrong>Talk about the strategy:\u003c/strong> \"How did you work it out?\" is worth asking even after a correct answer.","\u003cstrong>Say when a calculator helps:\u003c/strong> it is for checking and for large or decimal numbers, after estimation."],"ar":["\u003cstrong>Short, regular practice:\u003c/strong> five minutes of mental work at the start of most lessons is more effective than one long session each week.","\u003cstrong>Use known facts to find unknown facts:\u003c/strong> if 6 × 8 = 48, then 7 × 8 = 48 + 8. This uses the distributive property (3Ni.06) and gives learners a strategy when memory fails.","\u003cstrong>Talk about the strategy:\u003c/strong> \"How did you work it out?\" is worth asking even after a correct answer.","\u003cstrong>Say when a calculator helps:\u003c/strong> it is for checking and for large or decimal numbers, after estimation."]}},{"t":"h","c":{"en":"Teaching problem solving (good practice)","ar":"Teaching problem solving (good practice)"}},{"t":"p","c":{"en":"The framework does not prescribe a problem-solving method, but it clearly values learners who \"solve new and unfamiliar problems\" and \"suggest alternative routes\". A simple, repeatable routine helps all learners, especially those reading word problems in English as a second language. A common routine has four steps: \u003cstrong>Understand\u003c/strong> (what is being asked?), \u003cstrong>Plan\u003c/strong> (which picture or operation?), \u003cstrong>Do\u003c/strong> (carry it out), \u003cstrong>Check\u003c/strong> (does the answer make sense, and was the estimate close?). Teach the routine explicitly, and let learners draw a bar model or a quick sketch at the Plan stage.","ar":"The framework does not prescribe a problem-solving method, but it clearly values learners who \"solve new and unfamiliar problems\" and \"suggest alternative routes\". A simple, repeatable routine helps all learners, especially those reading word problems in English as a second language. A common routine has four steps: \u003cstrong>Understand\u003c/strong> (what is being asked?), \u003cstrong>Plan\u003c/strong> (which picture or operation?), \u003cstrong>Do\u003c/strong> (carry it out), \u003cstrong>Check\u003c/strong> (does the answer make sense, and was the estimate close?). Teach the routine explicitly, and let learners draw a bar model or a quick sketch at the Plan stage."}},{"t":"scenario","title":{"en":"Worked example: a Stage 4 word problem","ar":"Worked example: a Stage 4 word problem"},"c":{"en":"\"A school buys 6 boxes of pencils. Each box has 24 pencils. 15 pencils are broken. How many good pencils are there?\" \u003cstrong>Understand:\u003c/strong> We need the good pencils, not the total. \u003cstrong>Plan:\u003c/strong> First find the total (6 × 24). Then take away the broken ones. \u003cstrong>Do:\u003c/strong> 6 × 24 = 144 (6 × 20 + 6 × 4 = 120 + 24); 144 - 15 = 129. \u003cstrong>Check:\u003c/strong> Estimate 6 × 25 = 150, and 150 - 15 = 135. Is 129 close to 135? Yes, and it is a little lower because 24 is a little less than 25. The answer is sensible. This one problem uses 4Ni.05 and 4Ni.02. The objectives work together, which is why the framework says strands should be taught in conjunction with each other.","ar":"\"A school buys 6 boxes of pencils. Each box has 24 pencils. 15 pencils are broken. How many good pencils are there?\" \u003cstrong>Understand:\u003c/strong> We need the good pencils, not the total. \u003cstrong>Plan:\u003c/strong> First find the total (6 × 24). Then take away the broken ones. \u003cstrong>Do:\u003c/strong> 6 × 24 = 144 (6 × 20 + 6 × 4 = 120 + 24); 144 - 15 = 129. \u003cstrong>Check:\u003c/strong> Estimate 6 × 25 = 150, and 150 - 15 = 135. Is 129 close to 135? Yes, and it is a little lower because 24 is a little less than 25. The answer is sensible. This one problem uses 4Ni.05 and 4Ni.02. The objectives work together, which is why the framework says strands should be taught in conjunction with each other."}},{"t":"h","c":{"en":"Common misconceptions: place value and fractions (good practice)","ar":"Common misconceptions: place value and fractions (good practice)"}},{"t":"p","c":{"en":"The Cambridge schemes of work include a list of common misconceptions for each stage. The table below lists some that appear in many classrooms. It is \u003cstrong>good practice\u003c/strong>, not framework text, and it is not a complete list. The objective codes show where the idea is taught.","ar":"The Cambridge schemes of work include a list of common misconceptions for each stage. The table below lists some that appear in many classrooms. It is \u003cstrong>good practice\u003c/strong>, not framework text, and it is not a complete list. The objective codes show where the idea is taught."}},{"t":"table","head":{"en":["Misconception","What the learner says or does","Related objective","A possible response"],"ar":["Misconception","What the learner says or does","Related objective","A possible response"]},"rows":[{"en":["Longer decimal is bigger","\"0.45 is bigger than 0.5 because 45 is bigger than 5.\"","5Np.01 value of digits in decimals; 5Nf.08 compare and order decimals","Place both on a number line from 0 to 1, or use a 100-square; compare tenths first"],"ar":["Longer decimal is bigger","\"0.45 is bigger than 0.5 because 45 is bigger than 5.\"","5Np.01 value of digits in decimals; 5Nf.08 compare and order decimals","Place both on a number line from 0 to 1, or use a 100-square; compare tenths first"]},{"en":["Multiplying by 10 adds a zero","\"3.5 × 10 = 3.50\"","4Np.02; 5Np.03 multiply and divide decimals by 10 and 100","Use a place-value chart: every digit moves one place to the left; the zero is a placeholder, not a rule"],"ar":["Multiplying by 10 adds a zero","\"3.5 × 10 = 3.50\"","4Np.02; 5Np.03 multiply and divide decimals by 10 and 100","Use a place-value chart: every digit moves one place to the left; the zero is a placeholder, not a rule"]},{"en":["Zero means nothing","Writes 304 as 3004, or ignores zero in 2-digit numbers","1Np.01 zero as none; 2Np.01 zero as a placeholder","Build 304 with 3 hundreds, 0 tens and 4 ones; ask \"What would happen if we left the zero out?\""],"ar":["Zero means nothing","Writes 304 as 3004, or ignores zero in 2-digit numbers","1Np.01 zero as none; 2Np.01 zero as a placeholder","Build 304 with 3 hundreds, 0 tens and 4 ones; ask \"What would happen if we left the zero out?\""]},{"en":["Bigger bottom number means bigger fraction","\"1/8 is bigger than 1/4 because 8 is bigger.\"","4Nf.01 the more parts, the smaller the parts","Fold two identical strips: one into 4, one into 8; compare the pieces by holding them"],"ar":["Bigger bottom number means bigger fraction","\"1/8 is bigger than 1/4 because 8 is bigger.\"","4Nf.01 the more parts, the smaller the parts","Fold two identical strips: one into 4, one into 8; compare the pieces by holding them"]},{"en":["Add the tops and the bottoms","\"1/4 + 1/4 = 2/8\"","3Nf.07 add fractions with the same denominator","Use a bar split in quarters: \"What are we counting? Quarters. So 1 quarter and 1 quarter make 2 quarters.\""],"ar":["Add the tops and the bottoms","\"1/4 + 1/4 = 2/8\"","3Nf.07 add fractions with the same denominator","Use a bar split in quarters: \"What are we counting? Quarters. So 1 quarter and 1 quarter make 2 quarters.\""]},{"en":["Parts must look the same","\"This is not a half because the pieces are different shapes.\"","1Nf.01; 3Nf.02 relationship of whole and parts regardless of shape","Show two different halves of a square with equal area; ask learners to prove that they are equal"],"ar":["Parts must look the same","\"This is not a half because the pieces are different shapes.\"","1Nf.01; 3Nf.02 relationship of whole and parts regardless of shape","Show two different halves of a square with equal area; ask learners to prove that they are equal"]},{"en":["Always subtract smaller from larger","Works out 52 - 28 as 24 by taking 2 from 8 in the ones column","3Ni.04 regroup ones or tens","Use base-ten rods; trade one ten for ten ones; then record the trade"],"ar":["Always subtract smaller from larger","Works out 52 - 28 as 24 by taking 2 from 8 in the ones column","3Ni.04 regroup ones or tens","Use base-ten rods; trade one ten for ten ones; then record the trade"]}]},{"t":"callout","k":"tip","title":{"en":"How to use a misconception in your lesson","ar":"How to use a misconception in your lesson"},"c":{"en":"Do not only tell learners what is wrong. Put the misconception on the board as a statement, for example \"0.45 is bigger than 0.5\", and ask learners to agree or disagree and give evidence. This is Conjecturing and Convincing. It is safer, because the idea belongs to an imaginary pupil, and it is more memorable than a correction.","ar":"Do not only tell learners what is wrong. Put the misconception on the board as a statement, for example \"0.45 is bigger than 0.5\", and ask learners to agree or disagree and give evidence. This is Conjecturing and Convincing. It is safer, because the idea belongs to an imaginary pupil, and it is more memorable than a correction."}},{"t":"scenario","title":{"en":"Scenario: the same mistake in the whole class","ar":"Scenario: the same mistake in the whole class"},"c":{"en":"After a Stage 5 lesson on comparing decimals, 11 of 28 learners write 0.35 &gt; 0.4. The teacher's first thought is to repeat the explanation faster. \u003cstrong>What is a better response?\u003c/strong> The error pattern shows a shared misconception, so the class needs a different representation, not the same one again. The teacher returns to the concrete and representational steps (a 100-square and a number line), asks learners to shade 0.35 and 0.4, and asks, \"Which has more shaded?\" Then she moves back to the symbols and asks learners to explain the rule in their own words. Finally she plans a short check the next day.","ar":"After a Stage 5 lesson on comparing decimals, 11 of 28 learners write 0.35 &gt; 0.4. The teacher's first thought is to repeat the explanation faster. \u003cstrong>What is a better response?\u003c/strong> The error pattern shows a shared misconception, so the class needs a different representation, not the same one again. The teacher returns to the concrete and representational steps (a 100-square and a number line), asks learners to shade 0.35 and 0.4, and asks, \"Which has more shaded?\" Then she moves back to the symbols and asks learners to explain the rule in their own words. Finally she plans a short check the next day."}}],"checks":[{"id":"m4q1","q":{"en":"Which statement matches the framework's position on mental strategies?","ar":"Which statement matches the framework's position on mental strategies?"},"opts":[{"en":"Every learner must learn the same set of named strategies for addition and subtraction by Stage 3","ar":"Every learner must learn the same set of named strategies for addition and subtraction by Stage 3"},{"en":"It does not require learners to follow or practise specific strategies, so they have ownership","ar":"It does not require learners to follow or practise specific strategies, so they have ownership"},{"en":"Mental strategies are optional extras, and written methods are at the core of understanding","ar":"Mental strategies are optional extras, and written methods are at the core of understanding"},{"en":"Learners should practise one mental strategy only, so that they do not become confused","ar":"Learners should practise one mental strategy only, so that they do not become confused"}],"correct":1,"expl":{"en":"The framework says mental strategies are important and at the core of understanding, but the curriculum does not require learners to follow or practise specific strategies, because flexibility gives learners ownership.","ar":"The framework says mental strategies are important and at the core of understanding, but the curriculum does not require learners to follow or practise specific strategies, because flexibility gives learners ownership."}},{"id":"m4q2","q":{"en":"In which order does the framework describe the calculation process?","ar":"In which order does the framework describe the calculation process?"},"opts":[{"en":"Use a calculator first, then estimate, then calculate mentally, then write the method","ar":"Use a calculator first, then estimate, then calculate mentally, then write the method"},{"en":"Calculate mentally, write the method down, estimate the answer, then use a calculator to check","ar":"Calculate mentally, write the method down, estimate the answer, then use a calculator to check"},{"en":"Estimate first, calculate mentally, use written strategies, then use a calculator to check","ar":"Estimate first, calculate mentally, use written strategies, then use a calculator to check"},{"en":"Use written strategies first, then estimate, then calculate mentally, then check by estimating","ar":"Use written strategies first, then estimate, then calculate mentally, then check by estimating"}],"correct":2,"expl":{"en":"The framework says learners develop confidence by learning to estimate first, calculate mentally and use written strategies before using a calculator to check their solutions.","ar":"The framework says learners develop confidence by learning to estimate first, calculate mentally and use written strategies before using a calculator to check their solutions."}},{"id":"m4q3","q":{"en":"A learner says, \"1/8 is bigger than 1/4 because 8 is bigger than 4.\" Which response best fits objective 4Nf.01?","ar":"A learner says, \"1/8 is bigger than 1/4 because 8 is bigger than 4.\" Which response best fits objective 4Nf.01?"},"opts":[{"en":"Tell the learner that the rule is the opposite and ask him to write it five times","ar":"Tell the learner that the rule is the opposite and ask him to write it five times"},{"en":"Ask the learner to add 1/8 and 1/4 and compare the answer with a calculator","ar":"Ask the learner to add 1/8 and 1/4 and compare the answer with a calculator"},{"en":"Give the learner a worksheet of fractions to order and mark every answer as right or wrong","ar":"Give the learner a worksheet of fractions to order and mark every answer as right or wrong"},{"en":"Fold two equal strips into 4 and 8 parts, and ask which parts are smaller and why","ar":"Fold two equal strips into 4 and 8 parts, and ask which parts are smaller and why"}],"correct":3,"expl":{"en":"4Nf.01 is about understanding that the more parts a whole is divided into, the smaller the parts become. Folding equal strips makes this visible and lets the learner discover the rule.","ar":"4Nf.01 is about understanding that the more parts a whole is divided into, the smaller the parts become. Folding equal strips makes this visible and lets the learner discover the rule."}}]},{"id":"m5","title":{"en":"Mathematical Language for ESL Learners","ar":"Mathematical Language for ESL Learners"},"minutes":17,"blocks":[{"t":"p","c":{"en":"At PEPS, every learner is learning English as a second language, and every Mathematics lesson in Years 1 to 6 is taught in English. This is a strength, because learners meet English in a purposeful context. It is also a challenge, because a learner can understand a mathematical idea and still fail to show it if the question or the teacher's explanation is too difficult in English. This module looks at how to support the language of Mathematics without making the Mathematics easier.","ar":"At PEPS, every learner is learning English as a second language, and every Mathematics lesson in Years 1 to 6 is taught in English. This is a strength, because learners meet English in a purposeful context. It is also a challenge, because a learner can understand a mathematical idea and still fail to show it if the question or the teacher's explanation is too difficult in English. This module looks at how to support the language of Mathematics without making the Mathematics easier."}},{"t":"h","c":{"en":"What the framework says about language","ar":"What the framework says about language"}},{"t":"p","c":{"en":"The framework treats language as part of mathematics, not an extra. Among the Cambridge Primary aims it lists \"effective and confident communication skills, including in English\". Among the aims for Mathematics it lists that learners \"communicate solutions and ideas logically in spoken and written language using appropriate mathematical symbols, diagrams and representations\". It also says that the scheme of work for each stage contains \u003cstrong>\"a list of subject-specific language that will be useful for your learners\"\u003c/strong>, and many objectives name the words learners should use: for example \"familiar language to describe length, including long, longer, longest\" (1Gg.02), \"geometric vocabulary including acute, right and obtuse\" (4Gg.08) and \"the language of probability\" (4Sp.02).","ar":"The framework treats language as part of mathematics, not an extra. Among the Cambridge Primary aims it lists \"effective and confident communication skills, including in English\". Among the aims for Mathematics it lists that learners \"communicate solutions and ideas logically in spoken and written language using appropriate mathematical symbols, diagrams and representations\". It also says that the scheme of work for each stage contains \u003cstrong>\"a list of subject-specific language that will be useful for your learners\"\u003c/strong>, and many objectives name the words learners should use: for example \"familiar language to describe length, including long, longer, longest\" (1Gg.02), \"geometric vocabulary including acute, right and obtuse\" (4Gg.08) and \"the language of probability\" (4Sp.02)."}},{"t":"p","c":{"en":"The rest of this module is good practice: practical ideas that help ESL learners. They are not framework requirements.","ar":"The rest of this module is good practice: practical ideas that help ESL learners. They are not framework requirements."}},{"t":"h","c":{"en":"Three kinds of mathematical language","ar":"Three kinds of mathematical language"}},{"t":"table","head":{"en":["Kind of language","Examples from the framework","Why it is hard for ESL learners","What helps"],"ar":["Kind of language","Examples from the framework","Why it is hard for ESL learners","What helps"]},"rows":[{"en":["Technical words used only in Mathematics","numerator, denominator, perimeter, vertex, quadrilateral, mode, median","New words with no everyday link; long and hard to say","Teach a few at a time; use pictures and objects; say, chant, write and use them in a sentence"],"ar":["Technical words used only in Mathematics","numerator, denominator, perimeter, vertex, quadrilateral, mode, median","New words with no everyday link; long and hard to say","Teach a few at a time; use pictures and objects; say, chant, write and use them in a sentence"]},{"en":["Everyday words with a special mathematical meaning","difference (1Ni.03), face and edge (1Gg.03), round (2Np.05), table (times tables), square, order, regular (2Sp.01), mean (6Ss.03)","Learners already know another meaning and can be confused","Ask \"What does it mean in everyday life? What does it mean in Mathematics?\" and show both"],"ar":["Everyday words with a special mathematical meaning","difference (1Ni.03), face and edge (1Gg.03), round (2Np.05), table (times tables), square, order, regular (2Sp.01), mean (6Ss.03)","Learners already know another meaning and can be confused","Ask \"What does it mean in everyday life? What does it mean in Mathematics?\" and show both"]},{"en":["Language of reasoning and instructions","compare, estimate, explain, justify, because, if, then, more than, less than, how many more","Small words carry big meaning; sentence structure is complex","Use sentence frames, model full sentences, and let learners practise orally before writing"],"ar":["Language of reasoning and instructions","compare, estimate, explain, justify, because, if, then, more than, less than, how many more","Small words carry big meaning; sentence structure is complex","Use sentence frames, model full sentences, and let learners practise orally before writing"]}]},{"t":"p","c":{"en":"The second row is often forgotten. The framework itself uses two different words for making a picture: \u003cstrong>draw\u003c/strong> (accurately, with instruments such as rulers) and \u003cstrong>sketch\u003c/strong> (representative only, not precise). Learners who do not know this difference may waste time measuring when asked to sketch, or draw carelessly when asked to draw. A short, clear teaching of the two words, with an example of each, can remove the confusion.","ar":"The second row is often forgotten. The framework itself uses two different words for making a picture: \u003cstrong>draw\u003c/strong> (accurately, with instruments such as rulers) and \u003cstrong>sketch\u003c/strong> (representative only, not precise). Learners who do not know this difference may waste time measuring when asked to sketch, or draw carelessly when asked to draw. A short, clear teaching of the two words, with an example of each, can remove the confusion."}},{"t":"h","c":{"en":"Teaching vocabulary well","ar":"Teaching vocabulary well"}},{"t":"steps","c":{"en":["\u003cstrong>Choose the key words.\u003c/strong> From your lesson objective, choose 4 to 6 words that learners must understand and use. Use the scheme of work's subject-specific language list as a starting point, and add words from your own plan.","\u003cstrong>Show before you say.\u003c/strong> Hold up the object, show the picture or draw the diagram. Then say the word. Then ask learners to say it.","\u003cstrong>Say it, see it, write it.\u003c/strong> Learners say the word with a partner, see it on the word wall, and write it with a picture in their books.","\u003cstrong>Use it in a sentence.\u003c/strong> Give a frame (see below) and ask learners to complete it with a partner.","\u003cstrong>Come back to it.\u003c/strong> Use the same words in the starter next lesson and in the plenary. A word met once is soon forgotten."],"ar":["\u003cstrong>Choose the key words.\u003c/strong> From your lesson objective, choose 4 to 6 words that learners must understand and use. Use the scheme of work's subject-specific language list as a starting point, and add words from your own plan.","\u003cstrong>Show before you say.\u003c/strong> Hold up the object, show the picture or draw the diagram. Then say the word. Then ask learners to say it.","\u003cstrong>Say it, see it, write it.\u003c/strong> Learners say the word with a partner, see it on the word wall, and write it with a picture in their books.","\u003cstrong>Use it in a sentence.\u003c/strong> Give a frame (see below) and ask learners to complete it with a partner.","\u003cstrong>Come back to it.\u003c/strong> Use the same words in the starter next lesson and in the plenary. A word met once is soon forgotten."]}},{"t":"h","c":{"en":"Sentence frames linked to TWM","ar":"Sentence frames linked to TWM"}},{"t":"p","c":{"en":"A sentence frame is the start of a sentence that learners complete. Frames help ESL learners join in with reasoning, and they link directly to the Thinking and Working Mathematically pairs from Module 3. Display them on the wall and add new ones as the year goes on.","ar":"A sentence frame is the start of a sentence that learners complete. Frames help ESL learners join in with reasoning, and they link directly to the Thinking and Working Mathematically pairs from Module 3. Display them on the wall and add new ones as the year goes on."}},{"t":"table","head":{"en":["Purpose","Starter frames (good practice)","Example for Stage 3, 3Nf.07"],"ar":["Purpose","Starter frames (good practice)","Example for Stage 3, 3Nf.07"]},"rows":[{"en":["Explain a method","First I ... Then I ... Finally I ...","First I looked at the bottom numbers. Then I added the top numbers. Finally I wrote the answer."],"ar":["Explain a method","First I ... Then I ... Finally I ...","First I looked at the bottom numbers. Then I added the top numbers. Finally I wrote the answer."]},{"en":["Give a reason (Convincing)","I know that ... because ...","I know that 2/5 + 1/5 = 3/5 because the parts are the same size."],"ar":["Give a reason (Convincing)","I know that ... because ...","I know that 2/5 + 1/5 = 3/5 because the parts are the same size."]},{"en":["Make a prediction (Conjecturing)","I think ... will happen because ...","I think the bottom number will stay the same because we are counting fifths."],"ar":["Make a prediction (Conjecturing)","I think ... will happen because ...","I think the bottom number will stay the same because we are counting fifths."]},{"en":["Compare (Critiquing)","Method A is ... than Method B because ...","Drawing is slower than adding the top numbers, but it shows why it works."],"ar":["Compare (Critiquing)","Method A is ... than Method B because ...","Drawing is slower than adding the top numbers, but it shows why it works."]},{"en":["Describe a property (Characterising)","It has ... It does not have ...","It has equal parts. It does not have different-sized parts."],"ar":["Describe a property (Characterising)","It has ... It does not have ...","It has equal parts. It does not have different-sized parts."]},{"en":["Disagree politely","I disagree because ... Can you show me ...?","I disagree because the bottom number should not change. Can you show me with strips?"],"ar":["Disagree politely","I disagree because ... Can you show me ...?","I disagree because the bottom number should not change. Can you show me with strips?"]}]},{"t":"h","c":{"en":"Visuals, objects and gestures","ar":"Visuals, objects and gestures"}},{"t":"p","c":{"en":"Objects, pictures and gestures reduce the amount of English learners need in order to understand. This is another reason why CRA (Module 2) is so important for ESL learners: a learner who has just met \"regroup\" can hold the base-ten blocks, watch the teacher trade a ten for ten ones, and understand the meaning before they can say the word. Good practice includes: a word wall with a picture beside each word; labelled diagrams (for example a labelled circle with centre, radius, diameter and circumference for 6Gg.02); number lines and ten-frames on the wall; bar models for word problems; and gestures for words such as \"parallel\", \"half turn\" or \"more\".","ar":"Objects, pictures and gestures reduce the amount of English learners need in order to understand. This is another reason why CRA (Module 2) is so important for ESL learners: a learner who has just met \"regroup\" can hold the base-ten blocks, watch the teacher trade a ten for ten ones, and understand the meaning before they can say the word. Good practice includes: a word wall with a picture beside each word; labelled diagrams (for example a labelled circle with centre, radius, diameter and circumference for 6Gg.02); number lines and ten-frames on the wall; bar models for word problems; and gestures for words such as \"parallel\", \"half turn\" or \"more\"."}},{"t":"h","c":{"en":"Using learners' home languages","ar":"Using learners' home languages"}},{"t":"p","c":{"en":"Learners at PEPS bring home languages to the classroom, and for many of them this includes Arabic. Good practice is to treat these languages as a resource and not a problem. Ideas: let learners discuss a problem in their stronger language first and then explain in English; add key words in the home language to the word wall where staff or learners can supply them correctly; ask learners to teach the class how they say a number or a shape in their language; and allow a short answer in the home language in the early stages when the aim is to check the mathematics. Be aware that some languages say numbers in a different order from English (for example units before tens), so a learner may say \"four and twenty\" or reverse digits in a number such as 24. Ask learners how they say it and then show the English form calmly. Check with your HOD for the school's own approach to bilingual support.","ar":"Learners at PEPS bring home languages to the classroom, and for many of them this includes Arabic. Good practice is to treat these languages as a resource and not a problem. Ideas: let learners discuss a problem in their stronger language first and then explain in English; add key words in the home language to the word wall where staff or learners can supply them correctly; ask learners to teach the class how they say a number or a shape in their language; and allow a short answer in the home language in the early stages when the aim is to check the mathematics. Be aware that some languages say numbers in a different order from English (for example units before tens), so a learner may say \"four and twenty\" or reverse digits in a number such as 24. Ask learners how they say it and then show the English form calmly. Check with your HOD for the school's own approach to bilingual support."}},{"t":"h","c":{"en":"Talk partners and structured talk","ar":"Talk partners and structured talk"}},{"t":"p","c":{"en":"Speaking is how learners practise the language of Mathematics. A talk partner is a fixed partner, changed from time to time, with whom a learner shares ideas before speaking to the class. Good practice for ESL classes: give \u003cstrong>thinking time\u003c/strong> before talk; ask learners to use a \u003cstrong>frame\u003c/strong>; ask the partner to \u003cstrong>repeat or add\u003c/strong> (\"Tell me what your partner said\"); pair a more confident English speaker with a less confident one when the task allows, but do not let the stronger speaker do all of the talking; and then ask one pair to share with the class. Accept short answers at first and build them into sentences over time.","ar":"Speaking is how learners practise the language of Mathematics. A talk partner is a fixed partner, changed from time to time, with whom a learner shares ideas before speaking to the class. Good practice for ESL classes: give \u003cstrong>thinking time\u003c/strong> before talk; ask learners to use a \u003cstrong>frame\u003c/strong>; ask the partner to \u003cstrong>repeat or add\u003c/strong> (\"Tell me what your partner said\"); pair a more confident English speaker with a less confident one when the task allows, but do not let the stronger speaker do all of the talking; and then ask one pair to share with the class. Accept short answers at first and build them into sentences over time."}},{"t":"h","c":{"en":"Word problems: reduce the reading load, not the maths","ar":"Word problems: reduce the reading load, not the maths"}},{"t":"list","c":{"en":["\u003cstrong>Read together.\u003c/strong> Read the problem aloud twice. Ask \"What is it about?\" before \"What is the question?\"","\u003cstrong>Underline and draw.\u003c/strong> Learners underline the numbers and the question, and draw a quick picture or bar model.","\u003cstrong>Act it out.\u003c/strong> Use objects or learners to show the story.","\u003cstrong>Use familiar contexts and short sentences.\u003c/strong> Keep the mathematics at the stage level, but write the problem in plain English with the same name and context across a unit.","\u003cstrong>Let learners write their own.\u003c/strong> Asking learners to make up a problem for an objective is a strong test of understanding, and it builds language."],"ar":["\u003cstrong>Read together.\u003c/strong> Read the problem aloud twice. Ask \"What is it about?\" before \"What is the question?\"","\u003cstrong>Underline and draw.\u003c/strong> Learners underline the numbers and the question, and draw a quick picture or bar model.","\u003cstrong>Act it out.\u003c/strong> Use objects or learners to show the story.","\u003cstrong>Use familiar contexts and short sentences.\u003c/strong> Keep the mathematics at the stage level, but write the problem in plain English with the same name and context across a unit.","\u003cstrong>Let learners write their own.\u003c/strong> Asking learners to make up a problem for an objective is a strong test of understanding, and it builds language."]}},{"t":"scenario","title":{"en":"Scenario: the learner who is silent in the test","ar":"Scenario: the learner who is silent in the test"},"c":{"en":"Hamda, in Stage 4, answers questions confidently when working with counters and in pairs. In a written test she leaves the word problems blank and gets the calculations right. Her teacher worries about her mathematics. \u003cstrong>What is the likely issue, and what should the teacher do?\u003c/strong> The gap may be language, not mathematics. The teacher can read one or two problems aloud to Hamda or allow her to explain her method orally, to see whether she can solve them. If she can, the next step is to support the reading (key word lists, drawing the problem, a sentence frame), not to reteach the calculation. This kind of check also protects the quality of your assessment evidence (see Module 6).","ar":"Hamda, in Stage 4, answers questions confidently when working with counters and in pairs. In a written test she leaves the word problems blank and gets the calculations right. Her teacher worries about her mathematics. \u003cstrong>What is the likely issue, and what should the teacher do?\u003c/strong> The gap may be language, not mathematics. The teacher can read one or two problems aloud to Hamda or allow her to explain her method orally, to see whether she can solve them. If she can, the next step is to support the reading (key word lists, drawing the problem, a sentence frame), not to reteach the calculation. This kind of check also protects the quality of your assessment evidence (see Module 6)."}},{"t":"callout","k":"warn","title":{"en":"Common mistakes","ar":"Common mistakes"},"c":{"en":"Simplifying the mathematics instead of the language; teaching a long list of words once and never using them again; correcting grammar in a way that stops a learner speaking; and assuming that a learner who cannot read the problem cannot do the mathematics.","ar":"Simplifying the mathematics instead of the language; teaching a long list of words once and never using them again; correcting grammar in a way that stops a learner speaking; and assuming that a learner who cannot read the problem cannot do the mathematics."}}],"checks":[{"id":"m5q1","q":{"en":"The scheme of work for each stage contains a list of subject-specific language. What does the framework say this list is for?","ar":"The scheme of work for each stage contains a list of subject-specific language. What does the framework say this list is for?"},"opts":[{"en":"It is language that will be useful for your learners","ar":"It is language that will be useful for your learners"},{"en":"It is a list that learners must be able to spell in every written Cambridge test","ar":"It is a list that learners must be able to spell in every written Cambridge test"},{"en":"It is a set of definitions that must be copied into every lesson plan","ar":"It is a set of definitions that must be copied into every lesson plan"},{"en":"It is the full vocabulary that Cambridge examiners are allowed to use in tests","ar":"It is the full vocabulary that Cambridge examiners are allowed to use in tests"}],"correct":0,"expl":{"en":"The framework lists, among the contents of each scheme of work, \"a list of subject-specific language that will be useful for your learners\". It is support for teachers, not a spelling test or a rule.","ar":"The framework lists, among the contents of each scheme of work, \"a list of subject-specific language that will be useful for your learners\". It is support for teachers, not a spelling test or a rule."}},{"id":"m5q2","q":{"en":"Which pair of words does the framework distinguish, and why does this matter for learners learning in English?","ar":"Which pair of words does the framework distinguish, and why does this matter for learners learning in English?"},"opts":[{"en":"Number and numeral, because one is a word and the other is a symbol in every language","ar":"Number and numeral, because one is a word and the other is a symbol in every language"},{"en":"Draw and sketch, because one needs instruments and accuracy and the other does not","ar":"Draw and sketch, because one needs instruments and accuracy and the other does not"},{"en":"Mean and median, because both are used for the same type of data in every case","ar":"Mean and median, because both are used for the same type of data in every case"},{"en":"Table and graph, because tables are used in Stage 1 and graphs only in Stage 6","ar":"Table and graph, because tables are used in Stage 1 and graphs only in Stage 6"}],"correct":1,"expl":{"en":"The framework's glossary defines \"draw\" as using mathematical instruments to represent lines and shapes accurately, and \"sketch\" as illustrating without instruments so that the result is representative only.","ar":"The framework's glossary defines \"draw\" as using mathematical instruments to represent lines and shapes accurately, and \"sketch\" as illustrating without instruments so that the result is representative only."}},{"id":"m5q3","q":{"en":"A Stage 4 learner is confident with counters but blank on written word problems. What is the best first step for the teacher?","ar":"A Stage 4 learner is confident with counters but blank on written word problems. What is the best first step for the teacher?"},"opts":[{"en":"Move the learner back to Stage 3 word problems until his written English has improved","ar":"Move the learner back to Stage 3 word problems until his written English has improved"},{"en":"Remove word problems from his work and give him only calculations from now on in class","ar":"Remove word problems from his work and give him only calculations from now on in class"},{"en":"Ask for an oral explanation first, to see whether the barrier is language or maths","ar":"Ask for an oral explanation first, to see whether the barrier is language or maths"},{"en":"Ask a more confident learner to complete the written problems for him during the test","ar":"Ask a more confident learner to complete the written problems for him during the test"}],"correct":2,"expl":{"en":"Learners learning in a second language may know the mathematics but be unable to read the problem. Checking orally separates the language barrier from the mathematical one before deciding how to support.","ar":"Learners learning in a second language may know the mathematics but be unable to read the problem. Checking orally separates the language barrier from the mathematical one before deciding how to support."}}]},{"id":"m6","title":{"en":"Assessment in Primary Mathematics","ar":"Assessment in Primary Mathematics"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment answers one question: \u003cem>what have learners learned, and what should I do next?\u003c/em> The framework says its learning objectives are \"a reference against which learners' attainment and skills development can be checked\". That is the starting point for all assessment in Cambridge Primary Mathematics: you check learners against the objectives, using their codes. This module covers assessment in the classroom, the Cambridge assessments that the framework names, the external checks used at PEPS, and how to use the reporting codes in your feedback.","ar":"Assessment answers one question: \u003cem>what have learners learned, and what should I do next?\u003c/em> The framework says its learning objectives are \"a reference against which learners' attainment and skills development can be checked\". That is the starting point for all assessment in Cambridge Primary Mathematics: you check learners against the objectives, using their codes. This module covers assessment in the classroom, the Cambridge assessments that the framework names, the external checks used at PEPS, and how to use the reporting codes in your feedback."}},{"t":"h","c":{"en":"Assessment for learning in the classroom (good practice)","ar":"Assessment for learning in the classroom (good practice)"}},{"t":"p","c":{"en":"Most assessment takes place in lessons, every day, and is done by the teacher and the learners together. This is often called \u003cstrong>assessment for learning\u003c/strong>. The framework does not prescribe methods, but these are widely used good practice for Mathematics:","ar":"Most assessment takes place in lessons, every day, and is done by the teacher and the learners together. This is often called \u003cstrong>assessment for learning\u003c/strong>. The framework does not prescribe methods, but these are widely used good practice for Mathematics:"}},{"t":"table","head":{"en":["Method","What it looks like","What it tells you"],"ar":["Method","What it looks like","What it tells you"]},"rows":[{"en":["Questioning","Open questions linked to TWM: \"How do you know?\" \"Is it always true?\"","Whether learners understand why, not only how"],"ar":["Questioning","Open questions linked to TWM: \"How do you know?\" \"Is it always true?\"","Whether learners understand why, not only how"]},{"en":["Mini-whiteboards","Every learner writes an answer and holds it up on a signal","Who has the idea and who does not, in seconds, from every learner"],"ar":["Mini-whiteboards","Every learner writes an answer and holds it up on a signal","Who has the idea and who does not, in seconds, from every learner"]},{"en":["Hinge question","One multiple-choice question where each wrong answer shows a different misconception","Whether to move on, reteach or regroup, in the middle of the lesson"],"ar":["Hinge question","One multiple-choice question where each wrong answer shows a different misconception","Whether to move on, reteach or regroup, in the middle of the lesson"]},{"en":["Observing and listening","Watching learners use objects, and listening to partner talk","Whether learners can move between concrete, picture and symbol"],"ar":["Observing and listening","Watching learners use objects, and listening to partner talk","Whether learners can move between concrete, picture and symbol"]},{"en":["Exit ticket","Two questions at the end of the lesson on the lesson objective","Who needs support tomorrow and who needs challenge"],"ar":["Exit ticket","Two questions at the end of the lesson on the lesson objective","Who needs support tomorrow and who needs challenge"]},{"en":["Self- and peer-assessment","Learners use the success criteria (\"I can ...\") to check their own or a partner's work","How well learners understand the standard they are aiming for"],"ar":["Self- and peer-assessment","Learners use the success criteria (\"I can ...\") to check their own or a partner's work","How well learners understand the standard they are aiming for"]}]},{"t":"callout","k":"tip","title":{"en":"The \"hinge\" idea in one example","ar":"The \"hinge\" idea in one example"},"c":{"en":"Stage 4, 4Nf.01. Question: \"Which fraction is the smallest? A) 1/2  B) 1/3  C) 1/4  D) 1/8.\" Learners who choose A or B may think a bigger bottom number means a bigger fraction in some way; learners who choose D understand. Each wrong answer tells you something different, and a 20-second check shows the whole class.","ar":"Stage 4, 4Nf.01. Question: \"Which fraction is the smallest? A) 1/2  B) 1/3  C) 1/4  D) 1/8.\" Learners who choose A or B may think a bigger bottom number means a bigger fraction in some way; learners who choose D understand. Each wrong answer tells you something different, and a 20-second check shows the whole class."}},{"t":"h","c":{"en":"The Cambridge assessments named in the framework","ar":"The Cambridge assessments named in the framework"}},{"t":"p","c":{"en":"The framework names three Cambridge Primary assessments under \"Supporting teachers\": \u003cstrong>Cambridge Primary Progression Tests\u003c/strong>, \u003cstrong>Cambridge Primary Checkpoint\u003c/strong> and \u003cstrong>CEM Baseline Tests\u003c/strong>. Under \"Assessment\" it says: \"We provide assessments designed to complement this curriculum framework for \u003cstrong>Stages 3 to 6\u003c/strong>. You can find more information on assessing Cambridge Primary Mathematics on the School Support Hub.\" On the front cover it adds that the Progression Tests were to be available from 2022 and the Checkpoint tests from 2023.","ar":"The framework names three Cambridge Primary assessments under \"Supporting teachers\": \u003cstrong>Cambridge Primary Progression Tests\u003c/strong>, \u003cstrong>Cambridge Primary Checkpoint\u003c/strong> and \u003cstrong>CEM Baseline Tests\u003c/strong>. Under \"Assessment\" it says: \"We provide assessments designed to complement this curriculum framework for \u003cstrong>Stages 3 to 6\u003c/strong>. You can find more information on assessing Cambridge Primary Mathematics on the School Support Hub.\" On the front cover it adds that the Progression Tests were to be available from 2022 and the Checkpoint tests from 2023."}},{"t":"callout","k":"warn","title":{"en":"Stay within what the framework says","ar":"Stay within what the framework says"},"c":{"en":"The framework names these assessments and says where to find more. It does not describe the structure, length, marking or score reports of any test. Do not tell colleagues or parents how a test is built or what a result means unless you have checked the information on the School Support Hub or with your Cambridge coordinator or exams officer. Note also the stage range: the framework's statement on assessments covers Stages 3 to 6. For Stages 1 and 2, teacher assessment against the learning objectives (good practice) is the main source of evidence.","ar":"The framework names these assessments and says where to find more. It does not describe the structure, length, marking or score reports of any test. Do not tell colleagues or parents how a test is built or what a result means unless you have checked the information on the School Support Hub or with your Cambridge coordinator or exams officer. Note also the stage range: the framework's statement on assessments covers Stages 3 to 6. For Stages 1 and 2, teacher assessment against the learning objectives (good practice) is the main source of evidence."}},{"t":"h","c":{"en":"Assessments used at PEPS as external checks","ar":"Assessments used at PEPS as external checks"}},{"t":"p","c":{"en":"At PEPS, Year 6 learners sit Cambridge Primary Checkpoint, and GL Progress Tests are taken in Years 4 and 6. These are \u003cem>external\u003c/em> checks: they compare your learners against a standard outside the school. They sit alongside the internal assessment you do each term. The table shows how the sources fit together. The comparisons are good practice, and this CPD does not use or invent any PEPS results.","ar":"At PEPS, Year 6 learners sit Cambridge Primary Checkpoint, and GL Progress Tests are taken in Years 4 and 6. These are \u003cem>external\u003c/em> checks: they compare your learners against a standard outside the school. They sit alongside the internal assessment you do each term. The table shows how the sources fit together. The comparisons are good practice, and this CPD does not use or invent any PEPS results."}},{"t":"table","head":{"en":["Source of evidence","Who sets it","Stages at PEPS","Best used for","Limits"],"ar":["Source of evidence","Who sets it","Stages at PEPS","Best used for","Limits"]},"rows":[{"en":["Daily assessment for learning","Teacher and learners","Years 1 to 6","Adjusting the next lesson, giving fast feedback","Informal; hard to compare between classes"],"ar":["Daily assessment for learning","Teacher and learners","Years 1 to 6","Adjusting the next lesson, giving fast feedback","Informal; hard to compare between classes"]},{"en":["End-of-unit and end-of-term tests","Teacher or department","Years 1 to 6","Checking coverage of the unit's objectives by code","Quality depends on the questions; compare only if tests are common across classes"],"ar":["End-of-unit and end-of-term tests","Teacher or department","Years 1 to 6","Checking coverage of the unit's objectives by code","Quality depends on the questions; compare only if tests are common across classes"]},{"en":["Cambridge Primary Progression Tests","Cambridge (named in the framework)","Stages 3 to 6 are the range the framework mentions","A check linked to the framework's objectives; reporting codes in feedback","Check the School Support Hub for what is available and how it is reported"],"ar":["Cambridge Primary Progression Tests","Cambridge (named in the framework)","Stages 3 to 6 are the range the framework mentions","A check linked to the framework's objectives; reporting codes in feedback","Check the School Support Hub for what is available and how it is reported"]},{"en":["Cambridge Primary Checkpoint","Cambridge (named in the framework)","Year 6","An external check at the end of the primary stage","One occasion only; read the feedback by reporting code, not only the total"],"ar":["Cambridge Primary Checkpoint","Cambridge (named in the framework)","Year 6","An external check at the end of the primary stage","One occasion only; read the feedback by reporting code, not only the total"]},{"en":["GL Progress Tests","GL Assessment","Years 4 and 6 (primary)","An external comparison across the school and between internal and external results","A different test from Cambridge, with its own scales; do not mix the scores with Cambridge feedback"],"ar":["GL Progress Tests","GL Assessment","Years 4 and 6 (primary)","An external comparison across the school and between internal and external results","A different test from Cambridge, with its own scales; do not mix the scores with Cambridge feedback"]}]},{"t":"p","c":{"en":"Two rules of good practice follow. First, \u003cstrong>never rely on one source\u003c/strong>. If a class is strong in the unit tests and weaker in an external test, the difference is a question to investigate, not a conclusion. Second, \u003cstrong>use each source for what it can tell you\u003c/strong>. An external test cannot tell you what Aisha misunderstood in Tuesday's lesson, and an exit ticket cannot tell you how the class compares with an external standard.","ar":"Two rules of good practice follow. First, \u003cstrong>never rely on one source\u003c/strong>. If a class is strong in the unit tests and weaker in an external test, the difference is a question to investigate, not a conclusion. Second, \u003cstrong>use each source for what it can tell you\u003c/strong>. An external test cannot tell you what Aisha misunderstood in Tuesday's lesson, and an exit ticket cannot tell you how the class compares with an external standard."}},{"t":"h","c":{"en":"Using reporting codes in feedback","ar":"Using reporting codes in feedback"}},{"t":"p","c":{"en":"Remember that each learning objective code contains a \u003cstrong>reporting code\u003c/strong> that \"appears in the feedback reports for tests and reflects the sub-strand titles\". The ten reporting codes are:","ar":"Remember that each learning objective code contains a \u003cstrong>reporting code\u003c/strong> that \"appears in the feedback reports for tests and reflects the sub-strand titles\". The ten reporting codes are:"}},{"t":"table","head":{"en":["Strand","Reporting code","Sub-strand"],"ar":["Strand","Reporting code","Sub-strand"]},"rows":[{"en":["Number","Nc","Counting and sequences"],"ar":["Number","Nc","Counting and sequences"]},{"en":["Number","Nf","Fractions, decimals, percentages, ratio and proportion"],"ar":["Number","Nf","Fractions, decimals, percentages, ratio and proportion"]},{"en":["Number","Ni","Integers and powers"],"ar":["Number","Ni","Integers and powers"]},{"en":["Number","Nm","Money"],"ar":["Number","Nm","Money"]},{"en":["Number","Np","Place value, ordering and rounding"],"ar":["Number","Np","Place value, ordering and rounding"]},{"en":["Geometry and Measure","Gp","Position and transformation"],"ar":["Geometry and Measure","Gp","Position and transformation"]},{"en":["Geometry and Measure","Gg","Geometrical reasoning, shapes and measurements"],"ar":["Geometry and Measure","Gg","Geometrical reasoning, shapes and measurements"]},{"en":["Geometry and Measure","Gt","Time"],"ar":["Geometry and Measure","Gt","Time"]},{"en":["Statistics and Probability","Sp","Probability"],"ar":["Statistics and Probability","Sp","Probability"]},{"en":["Statistics and Probability","Ss","Statistics"],"ar":["Statistics and Probability","Ss","Statistics"]}]},{"t":"p","c":{"en":"If you use the same codes in your own marking and tracking, your internal results and any test feedback that uses the reporting codes can be read side by side. A simple habit: when you set an end-of-unit test, write the objective code beside each question. Then you can say, \"This class is secure in Ni and Gt but weaker in Nf\", and compare that with the reporting-code feedback from an external test (if the report you receive gives it).","ar":"If you use the same codes in your own marking and tracking, your internal results and any test feedback that uses the reporting codes can be read side by side. A simple habit: when you set an end-of-unit test, write the objective code beside each question. Then you can say, \"This class is secure in Ni and Gt but weaker in Nf\", and compare that with the reporting-code feedback from an external test (if the report you receive gives it)."}},{"t":"scenario","title":{"en":"Worked example: feedback that uses the code","ar":"Worked example: feedback that uses the code"},"c":{"en":"Instead of writing \"Good work, 7/10\" on a Stage 4 test, a teacher writes two comments linked to the learner's objectives. \u003cstrong>Glow (strength):\u003c/strong> \"4Ni.05: your estimate and your multiplication method are accurate. Well done.\" \u003cstrong>Grow (next step):\u003c/strong> \"4Nf.07: when you compare fractions, draw two bars the same length first. Try questions 3 and 4 again with a drawing.\" The code tells the learner (and any colleague, parent or later teacher) exactly which learning is being discussed. Learner-friendly versions might read: \"I can compare fractions using a drawing (4Nf.07).\" The comment is specific, short and points to an action.","ar":"Instead of writing \"Good work, 7/10\" on a Stage 4 test, a teacher writes two comments linked to the learner's objectives. \u003cstrong>Glow (strength):\u003c/strong> \"4Ni.05: your estimate and your multiplication method are accurate. Well done.\" \u003cstrong>Grow (next step):\u003c/strong> \"4Nf.07: when you compare fractions, draw two bars the same length first. Try questions 3 and 4 again with a drawing.\" The code tells the learner (and any colleague, parent or later teacher) exactly which learning is being discussed. Learner-friendly versions might read: \"I can compare fractions using a drawing (4Nf.07).\" The comment is specific, short and points to an action."}},{"t":"scenario","title":{"en":"Scenario: two sets of results that disagree","ar":"Scenario: two sets of results that disagree"},"c":{"en":"A Year 6 teacher finds that 80% of her class scored well in school unit tests on fractions, but the external Checkpoint feedback shows fractions as the weakest area. \u003cstrong>What should she do?\u003c/strong> She should not decide that one result is wrong. She should compare the questions: Were the school tests testing the same objectives (for example 6Nf.05, adding fractions with different denominators), at the same depth? Were learners supported with objects or notes in class that were not available in the test? Did language in the questions affect results? Then she should discuss the findings with her HOD and plan teaching for the specific objectives that were weak. This is Module 7's work.","ar":"A Year 6 teacher finds that 80% of her class scored well in school unit tests on fractions, but the external Checkpoint feedback shows fractions as the weakest area. \u003cstrong>What should she do?\u003c/strong> She should not decide that one result is wrong. She should compare the questions: Were the school tests testing the same objectives (for example 6Nf.05, adding fractions with different denominators), at the same depth? Were learners supported with objects or notes in class that were not available in the test? Did language in the questions affect results? Then she should discuss the findings with her HOD and plan teaching for the specific objectives that were weak. This is Module 7's work."}}],"checks":[{"id":"m6q1","q":{"en":"Which three Cambridge Primary assessments does the framework name?","ar":"Which three Cambridge Primary assessments does the framework name?"},"opts":[{"en":"Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments","ar":"Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and Cambridge Insight assessments"},{"en":"Cambridge Primary Checkpoint, CEM Baseline Tests and GL Progress Tests","ar":"Cambridge Primary Checkpoint, CEM Baseline Tests and GL Progress Tests"},{"en":"Cambridge Primary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests","ar":"Cambridge Primary Progression Tests, Cambridge Lower Secondary Checkpoint and CEM Baseline Tests"},{"en":"Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and CEM Baseline Tests","ar":"Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and CEM Baseline Tests"}],"correct":3,"expl":{"en":"The framework lists these three under Cambridge Primary assessments. Cambridge Insight assessments are named in the Science framework, and GL Progress Tests are not Cambridge assessments.","ar":"The framework lists these three under Cambridge Primary assessments. Cambridge Insight assessments are named in the Science framework, and GL Progress Tests are not Cambridge assessments."}},{"id":"m6q2","q":{"en":"What does the reporting code in a learning objective code, such as Nf in 3Nf.07, appear in, according to the framework?","ar":"What does the reporting code in a learning objective code, such as Nf in 3Nf.07, appear in, according to the framework?"},"opts":[{"en":"The feedback reports for tests, where it reflects the sub-strand title","ar":"The feedback reports for tests, where it reflects the sub-strand title"},{"en":"The scheme of work only, where it shows the unit in which the objective is taught","ar":"The scheme of work only, where it shows the unit in which the objective is taught"},{"en":"The teacher guide only, where it shows the lesson in which the objective is taught","ar":"The teacher guide only, where it shows the lesson in which the objective is taught"},{"en":"The learner's report card, where it shows the level that the learner has reached","ar":"The learner's report card, where it shows the level that the learner has reached"}],"correct":0,"expl":{"en":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. The code is also used in the schemes of work and other resources.","ar":"The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. The code is also used in the schemes of work and other resources."}},{"id":"m6q3","q":{"en":"At PEPS, a Year 6 teacher compares unit-test results with external Checkpoint feedback and sees a difference in fractions. What is the best next step?","ar":"At PEPS, a Year 6 teacher compares unit-test results with external Checkpoint feedback and sees a difference in fractions. What is the best next step?"},"opts":[{"en":"Accept the external result as correct and ignore the school test results from now on","ar":"Accept the external result as correct and ignore the school test results from now on"},{"en":"Compare the objectives and question types in both sources before deciding what to teach next","ar":"Compare the objectives and question types in both sources before deciding what to teach next"},{"en":"Accept the school test as correct, because the teacher knows the class best and has marked it","ar":"Accept the school test as correct, because the teacher knows the class best and has marked it"},{"en":"Wait until next year's Checkpoint results before deciding whether to change teaching","ar":"Wait until next year's Checkpoint results before deciding whether to change teaching"}],"correct":1,"expl":{"en":"Different tests measure different things. Comparing the objectives, depth and conditions shows whether the difference is a real gap, a language barrier or a difference in the tests.","ar":"Different tests measure different things. Comparing the objectives, depth and conditions shows whether the difference is a real gap, a language barrier or a difference in the tests."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment is only useful if it changes what happens next. A mark sheet that is filed and forgotten has not improved any learning. This module shows a simple method for turning a class mark sheet or test feedback into decisions: what to reteach, who to group together, what intervention to plan and how to track progress. It uses the learning objective codes from the framework, so that your evidence points to specific objectives and not to a general feeling that \"the class is weak\".","ar":"Assessment is only useful if it changes what happens next. A mark sheet that is filed and forgotten has not improved any learning. This module shows a simple method for turning a class mark sheet or test feedback into decisions: what to reteach, who to group together, what intervention to plan and how to track progress. It uses the learning objective codes from the framework, so that your evidence points to specific objectives and not to a general feeling that \"the class is weak\"."}},{"t":"callout","k":"warn","title":{"en":"All data in this module is invented","ar":"All data in this module is invented"},"c":{"en":"The mark sheet below is an \u003cstrong>invented training example\u003c/strong>. It is not PEPS data and does not describe any real class. Use your own class evidence when you apply the method.","ar":"The mark sheet below is an \u003cstrong>invented training example\u003c/strong>. It is not PEPS data and does not describe any real class. Use your own class evidence when you apply the method."}},{"t":"h","c":{"en":"Step 1: tag every question with a learning objective code","ar":"Step 1: tag every question with a learning objective code"}},{"t":"p","c":{"en":"Before you analyse anything, make sure each question in the test is linked to one objective code. If you wrote the test, write the code beside each question when you set it. If you use a published test, match each question to an objective by reading the objective's words. Questions that test more than one objective should be split or recorded against the main one. This is the step that lets you say \"Nf\" or \"4Nf.07\" instead of \"question 6\".","ar":"Before you analyse anything, make sure each question in the test is linked to one objective code. If you wrote the test, write the code beside each question when you set it. If you use a published test, match each question to an objective by reading the objective's words. Questions that test more than one objective should be split or recorded against the main one. This is the step that lets you say \"Nf\" or \"4Nf.07\" instead of \"question 6\"."}},{"t":"h","c":{"en":"Step 2: see the pattern by objective","ar":"Step 2: see the pattern by objective"}},{"t":"p","c":{"en":"Here is an invented Stage 4 end-of-unit test, taken by 28 learners. Each question was worth one mark. The last column is the percentage of the class who got the question right.","ar":"Here is an invented Stage 4 end-of-unit test, taken by 28 learners. Each question was worth one mark. The last column is the percentage of the class who got the question right."}},{"t":"table","head":{"en":["Question","Objective code (reporting code)","Skill in short","Correct out of 28","Percentage correct"],"ar":["Question","Objective code (reporting code)","Skill in short","Correct out of 28","Percentage correct"]},"rows":[{"en":["Q1","4Ni.04 (Ni)","Times tables 1 to 10","25","89%"],"ar":["Q1","4Ni.04 (Ni)","Times tables 1 to 10","25","89%"]},{"en":["Q2","4Ni.05 (Ni)","Multiply up to 1000 by 1 digit","19","68%"],"ar":["Q2","4Ni.05 (Ni)","Multiply up to 1000 by 1 digit","19","68%"]},{"en":["Q3","4Np.02 (Np)","Multiply and divide by 10 and 100","14","50%"],"ar":["Q3","4Np.02 (Np)","Multiply and divide
