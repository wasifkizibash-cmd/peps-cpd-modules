#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

<script>
const CPD = {"meta":{"id":"primary-maths-framework-b","code":"PMB","passMark":80,"hours":"2.5 hours","accent":"#1F6FB2","accentSoft":"#E3EEF9","eyebrow":{"en":"Staff CPD · Cambridge Primary Mathematics 0096 · Part B","ar":"Staff CPD · Cambridge Primary Mathematics 0096 · Part B"},"title":{"en":"Understanding the Cambridge Primary Mathematics Curriculum: Part B, From Framework to Classroom","ar":"Understanding the Cambridge Primary Mathematics Curriculum: Part B, From Framework to Classroom"},"subtitle":{"en":"A self-paced guide for primary Mathematics teachers, HODs and coordinators: how to turn the Cambridge Primary Mathematics learning objectives into planned lessons, use the concrete, representational, abstract (CRA) approach, build Thinking and Working Mathematically into tasks, support number fluency and ESL learners, assess and respond to evidence, and include and challenge every learner.","ar":"A self-paced guide for primary Mathematics teachers, HODs and coordinators: how to turn the Cambridge Primary Mathematics learning objectives into planned lessons, use the concrete, representational, abstract (CRA) approach, build Thinking and Working Mathematically into tasks, support number fluency and ESL learners, assess and respond to evidence, and include and challenge every learner."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Primary Mathematics 0096 Curriculum Framework (v2.1)","ar":"Cambridge Primary Mathematics 0096 Curriculum Framework (v2.1)"},"source":{"en":"Cambridge Primary Mathematics 0096 Curriculum Framework, version 2.1 (first published September 2020; latest version June 2025). Where this CPD describes good practice that is not in the framework, it says so. Check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Primary Mathematics 0096 Curriculum Framework, version 2.1 (first published September 2020; latest version June 2025). Where this CPD describes good practice that is not in the framework, it says so. Check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"From Objectives to Lessons","ar":"From Objectives to Lessons"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explained how the Cambridge Primary Mathematics 0096 framework is organised. Part B is about \u003cstrong>using it in your classroom\u003c/strong>. By the end of Part B you will be able to: turn a learning objective into a lesson; use the concrete, representational, abstract (CRA) approach; design tasks that develop Thinking and Working Mathematically; teach number fluency and mathematical language to learners who are learning in a second language; use assessment evidence to adjust your teaching; and include and challenge every learner. In this first module you will learn how learning objectives become long-term, medium-term and short-term plans. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explained how the Cambridge Primary Mathematics 0096 framework is organised. Part B is about \u003cstrong>using it in your classroom\u003c/strong>. By the end of Part B you will be able to: turn a learning objective into a lesson; use the concrete, representational, abstract (CRA) approach; design tasks that develop Thinking and Working Mathematically; teach number fluency and mathematical language to learners who are learning in a second language; use assessment evidence to adjust your teaching; and include and challenge every learner. In this first module you will learn how learning objectives become long-term, medium-term and short-term plans. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"A curriculum framework is a map, not a timetable. It tells you \u003cem>what\u003c/em> learners should learn at each stage, but not which lesson to teach on Monday. That decision is yours, working with your HOD and your school's planning expectations.","ar":"A curriculum framework is a map, not a timetable. It tells you \u003cem>what\u003c/em> learners should learn at each stage, but not which lesson to teach on Monday. That decision is yours, working with your HOD and your school's planning expectations."}},{"t":"p","c":{"en":"In this CPD, Stage 1 to Stage 6 are the Cambridge stages that PEPS teaches as Year 1 to Year 6. Where a code such as 3Nf.07 appears, the first number is the stage.","ar":"In this CPD, Stage 1 to Stage 6 are the Cambridge stages that PEPS teaches as Year 1 to Year 6. Where a code such as 3Nf.07 appears, the first number is the stage."}},{"t":"h","c":{"en":"What the framework says a learning objective is","ar":"What the framework says a learning objective is"}},{"t":"p","c":{"en":"The framework describes learning objectives as statements of the expectations of knowledge, understanding and skills that learners will develop. It says they give \u003cstrong>a structure for teaching and learning\u003c/strong> and \u003cstrong>a reference against which learners' attainment and skills development can be checked\u003c/strong>. So a learning objective does two jobs for you. It tells you what to teach, and it tells you what to check afterwards.","ar":"The framework describes learning objectives as statements of the expectations of knowledge, understanding and skills that learners will develop. It says they give \u003cstrong>a structure for teaching and learning\u003c/strong> and \u003cstrong>a reference against which learners' attainment and skills development can be checked\u003c/strong>. So a learning objective does two jobs for you. It tells you what to teach, and it tells you what to check afterwards."}},{"t":"p","c":{"en":"Every objective has a unique code. The framework explains that a code such as 1Nc.05 contains the stage number, a reporting code (here Nc) that appears in the feedback reports for tests, and a number showing the order of the objective in that sub-strand for that stage. Part A covered the codes in detail. Here we use them as a working tool for planning.","ar":"Every objective has a unique code. The framework explains that a code such as 1Nc.05 contains the stage number, a reporting code (here Nc) that appears in the feedback reports for tests, and a number showing the order of the objective in that sub-strand for that stage. Part A covered the codes in detail. Here we use them as a working tool for planning."}},{"t":"scenario","title":{"en":"Worked example: reading a code and planning from it","ar":"Worked example: reading a code and planning from it"},"c":{"en":"Take the objective \u003cstrong>3Nf.07\u003c/strong>: \u003cem>Estimate, add and subtract fractions with the same denominator (within one whole).\u003c/em> Reading the code: \u003cstrong>3\u003c/strong> = Stage 3; \u003cstrong>Nf\u003c/strong> = the Number sub-strand \"Fractions, decimals, percentages, ratio and proportion\"; \u003cstrong>07\u003c/strong> = the seventh objective in that sub-strand for Stage 3. Reading the words: three skills (estimate, add, subtract), one condition (same denominator) and one limit (within one whole). So 2/5 + 1/5 is in scope. 3/5 + 4/5 is not, because the answer is more than one whole. Stage 4 extends the idea: 4Nf.05 removes the \"within one whole\" limit. Before you plan a lesson, always check the same sub-strand in the stage \u003cem>before\u003c/em> and the stage \u003cem>after\u003c/em>.","ar":"Take the objective \u003cstrong>3Nf.07\u003c/strong>: \u003cem>Estimate, add and subtract fractions with the same denominator (within one whole).\u003c/em> Reading the code: \u003cstrong>3\u003c/strong> = Stage 3; \u003cstrong>Nf\u003c/strong> = the Number sub-strand \"Fractions, decimals, percentages, ratio and proportion\"; \u003cstrong>07\u003c/strong> = the seventh objective in that sub-strand for Stage 3. Reading the words: three skills (estimate, add, subtract), one condition (same denominator) and one limit (within one whole). So 2/5 + 1/5 is in scope. 3/5 + 4/5 is not, because the answer is more than one whole. Stage 4 extends the idea: 4Nf.05 removes the \"within one whole\" limit. Before you plan a lesson, always check the same sub-strand in the stage \u003cem>before\u003c/em> and the stage \u003cem>after\u003c/em>."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The framework's glossary describes each Cambridge scheme of work as containing \u003cstrong>a suggested long-term plan, a medium-term plan with suggested teaching and learning activities, and sample short-term (lesson) plans\u003c/strong>. These three levels are a useful way to organise any planning, whether you use the Cambridge scheme of work or your own. The table below shows what each level answers. The examples and time ranges in the last two columns are good practice, not framework requirements.","ar":"The framework's glossary describes each Cambridge scheme of work as containing \u003cstrong>a suggested long-term plan, a medium-term plan with suggested teaching and learning activities, and sample short-term (lesson) plans\u003c/strong>. These three levels are a useful way to organise any planning, whether you use the Cambridge scheme of work or your own. The table below shows what each level answers. The examples and time ranges in the last two columns are good practice, not framework requirements."}},{"t":"table","head":{"en":["Level","The question it answers","What it usually looks like (good practice)","Example for Stage 3"],"ar":["Level","The question it answers","What it usually looks like (good practice)","Example for Stage 3"]},"rows":[{"en":["Long-term","What will this class learn across the year, and in what order?","All objectives of the stage grouped into units and placed on the school calendar, with assessment points","A year plan with a fractions unit placed after the multiplication and division units"],"ar":["Long-term","What will this class learn across the year, and in what order?","All objectives of the stage grouped into units and placed on the school calendar, with assessment points","A year plan with a fractions unit placed after the multiplication and division units"]},{"en":["Medium-term","What will we teach in this unit, and which activities will build it?","A unit of a few weeks: the objectives, key vocabulary, activities, resources and checks","A three-week fractions unit covering 3Nf.01 to 3Nf.08"],"ar":["Medium-term","What will we teach in this unit, and which activities will build it?","A unit of a few weeks: the objectives, key vocabulary, activities, resources and checks","A three-week fractions unit covering 3Nf.01 to 3Nf.08"]},{"en":["Short-term","What will happen in this lesson, with these 28 learners?","A single lesson: one or two objectives, success criteria, the CRA stage, questions, tasks and a check","Lesson 5: add fractions with the same denominator, using fraction strips (3Nf.07)"],"ar":["Short-term","What will happen in this lesson, with these 28 learners?","A single lesson: one or two objectives, success criteria, the CRA stage, questions, tasks and a check","Lesson 5: add fractions with the same denominator, using fraction strips (3Nf.07)"]}]},{"t":"h","c":{"en":"From objective to lesson: a simple routine","ar":"From objective to lesson: a simple routine"}},{"t":"p","c":{"en":"Good practice is to keep three things separate when you write a lesson plan: the \u003cstrong>learning objective\u003c/strong> (what learners will learn), the \u003cstrong>success criteria\u003c/strong> (how you and they will know they have learned it) and the \u003cstrong>activity\u003c/strong> (what they do). Many weak plans confuse the last two. \"Use fraction strips\" is an activity, not an objective.","ar":"Good practice is to keep three things separate when you write a lesson plan: the \u003cstrong>learning objective\u003c/strong> (what learners will learn), the \u003cstrong>success criteria\u003c/strong> (how you and they will know they have learned it) and the \u003cstrong>activity\u003c/strong> (what they do). Many weak plans confuse the last two. \"Use fraction strips\" is an activity, not an objective."}},{"t":"steps","c":{"en":["\u003cstrong>Find the objective.\u003c/strong> Write the code and the framework wording. Example: 3Nf.07.","\u003cstrong>Check what came before.\u003c/strong> Look at the previous stage and earlier objectives in the same stage. Learners need 3Nf.01 (fractions are several equal parts, and all the parts together make one whole) before they can add fractions.","\u003cstrong>Write a lesson objective in learner language.\u003c/strong> \"We are learning to add fractions that have the same bottom number.\"","\u003cstrong>Write success criteria.\u003c/strong> \"I can estimate first. I can add the top numbers and keep the bottom number the same. I can show it with a drawing.\"","\u003cstrong>Choose the CRA stage and the task.\u003c/strong> Strips first, then a bar drawing, then the written sum. (Module 2 explains CRA.)","\u003cstrong>Plan the check.\u003c/strong> Two or three questions you will ask during the lesson, and one task at the end, so you know who needs more support tomorrow."],"ar":["\u003cstrong>Find the objective.\u003c/strong> Write the code and the framework wording. Example: 3Nf.07.","\u003cstrong>Check what came before.\u003c/strong> Look at the previous stage and earlier objectives in the same stage. Learners need 3Nf.01 (fractions are several equal parts, and all the parts together make one whole) before they can add fractions.","\u003cstrong>Write a lesson objective in learner language.\u003c/strong> \"We are learning to add fractions that have the same bottom number.\"","\u003cstrong>Write success criteria.\u003c/strong> \"I can estimate first. I can add the top numbers and keep the bottom number the same. I can show it with a drawing.\"","\u003cstrong>Choose the CRA stage and the task.\u003c/strong> Strips first, then a bar drawing, then the written sum. (Module 2 explains CRA.)","\u003cstrong>Plan the check.\u003c/strong> Two or three questions you will ask during the lesson, and one task at the end, so you know who needs more support tomorrow."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: one lesson, one main idea","ar":"Good practice: one lesson, one main idea"},"c":{"en":"A lesson that tries to cover four objectives usually teaches none of them well. As a guide, choose one main objective for most lessons. Some objectives, such as 3Gg.04 (draw shapes, then measure perimeter and area), are large and need several lessons. Split them into small steps and plan the steps.","ar":"A lesson that tries to cover four objectives usually teaches none of them well. As a guide, choose one main objective for most lessons. Some objectives, such as 3Gg.04 (draw shapes, then measure perimeter and area), are large and need several lessons. Split them into small steps and plan the steps."}},{"t":"h","c":{"en":"What the schemes of work and the teacher guide contain","ar":"What the schemes of work and the teacher guide contain"}},{"t":"p","c":{"en":"The framework describes two support documents that you can find on the School Support Hub. The \u003cstrong>teacher guide\u003c/strong> supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains:","ar":"The framework describes two support documents that you can find on the School Support Hub. The \u003cstrong>teacher guide\u003c/strong> supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains:"}},{"t":"list","c":{"en":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","a list of subject-specific language that will be useful for your learners;","common misconceptions;","sample lesson plans;","links to relevant NRICH activities to enrich learners' mathematical experiences."],"ar":["suggested units showing how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","a list of subject-specific language that will be useful for your learners;","common misconceptions;","sample lesson plans;","links to relevant NRICH activities to enrich learners' mathematical experiences."]}},{"t":"callout","k":"key","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework is clear: \u003cstrong>\"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Mathematics.\"\u003c/strong> They show the types of activities you might use and the intended depth and breadth of each objective. The activities are also \u003cstrong>not designed to fill all the teaching time\u003c/strong> for a stage, so you should use other activities of a similar level of difficulty, for example from endorsed resources. What is required is that the learning objectives of the framework are taught. How you group, order and teach them is your professional decision, within the school's expectations.","ar":"The framework is clear: \u003cstrong>\"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Mathematics.\"\u003c/strong> They show the types of activities you might use and the intended depth and breadth of each objective. The activities are also \u003cstrong>not designed to fill all the teaching time\u003c/strong> for a stage, so you should use other activities of a similar level of difficulty, for example from endorsed resources. What is required is that the learning objectives of the framework are taught. How you group, order and teach them is your professional decision, within the school's expectations."}},{"t":"h","c":{"en":"Sequencing units","ar":"Sequencing units"}},{"t":"p","c":{"en":"The scheme of work gives \u003cem>suggested\u003c/em> units. The framework also says there is no requirement for endorsed textbooks to follow the teaching order in the schemes of work, and that if a resource is endorsed you can be confident that all the learning objectives are covered. So more than one order is acceptable. These are good-practice questions to ask when you decide an order (they are not Cambridge rules):","ar":"The scheme of work gives \u003cem>suggested\u003c/em> units. The framework also says there is no requirement for endorsed textbooks to follow the teaching order in the schemes of work, and that if a resource is endorsed you can be confident that all the learning objectives are covered. So more than one order is acceptable. These are good-practice questions to ask when you decide an order (they are not Cambridge rules):"}},{"t":"list","c":{"en":["\u003cstrong>Prerequisites:\u003c/strong> does this unit need something taught earlier? Place value (Np) usually comes before written calculation (Ni). Equal parts (3Nf.01) come before adding fractions (3Nf.07).","\u003cstrong>Connections:\u003c/strong> the framework says strands are interrelated and should be taught in conjunction with each other. Could a measuring unit (Gg) give a real context for decimals (Nf) or for a data investigation (Ss)?","\u003cstrong>Thinking and Working Mathematically (TWM):\u003c/strong> the framework says TWM should be embedded throughout the curriculum, not taught as a separate activity. So it belongs in every unit plan, not in a separate unit."],"ar":["\u003cstrong>Prerequisites:\u003c/strong> does this unit need something taught earlier? Place value (Np) usually comes before written calculation (Ni). Equal parts (3Nf.01) come before adding fractions (3Nf.07).","\u003cstrong>Connections:\u003c/strong> the framework says strands are interrelated and should be taught in conjunction with each other. Could a measuring unit (Gg) give a real context for decimals (Nf) or for a data investigation (Ss)?","\u003cstrong>Thinking and Working Mathematically (TWM):\u003c/strong> the framework says TWM should be embedded throughout the curriculum, not taught as a separate activity. So it belongs in every unit plan, not in a separate unit."]}},{"t":"h","c":{"en":"How much time do we have?","ar":"How much time do we have?"}},{"t":"p","c":{"en":"The framework gives guidance on time. Its words are: \"For guidance, this curriculum framework is based on learners having \u003cstrong>4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\u003c/strong>. Your actual number of teaching hours may vary according to your context.\" Notice three points. It is guidance, not a rule. It is the basis on which the framework was designed. And it says that actual hours vary. Your timetable and your school calendar decide your real time, so plan from your own timetable and confirm it with your HOD.","ar":"The framework gives guidance on time. Its words are: \"For guidance, this curriculum framework is based on learners having \u003cstrong>4 to 5 hours of Mathematics per week (or about 120 to 150 hours per stage)\u003c/strong>. Your actual number of teaching hours may vary according to your context.\" Notice three points. It is guidance, not a rule. It is the basis on which the framework was designed. And it says that actual hours vary. Your timetable and your school calendar decide your real time, so plan from your own timetable and confirm it with your HOD."}},{"t":"table","head":{"en":["Stage","Number of learning objectives (excluding TWM)","Hours if 120 to 150 hours per stage","Rough average per objective"],"ar":["Stage","Number of learning objectives (excluding TWM)","Hours if 120 to 150 hours per stage","Rough average per objective"]},"rows":[{"en":["Stage 1","36","120 to 150","about 3.3 to 4.2 hours"],"ar":["Stage 1","36","120 to 150","about 3.3 to 4.2 hours"]},{"en":["Stage 3","53","120 to 150","about 2.3 to 2.8 hours"],"ar":["Stage 3","53","120 to 150","about 2.3 to 2.8 hours"]},{"en":["Stage 4","46","120 to 150","about 2.6 to 3.3 hours"],"ar":["Stage 4","46","120 to 150","about 2.6 to 3.3 hours"]},{"en":["Stage 6","54","120 to 150","about 2.2 to 2.8 hours"],"ar":["Stage 6","54","120 to 150","about 2.2 to 2.8 hours"]}]},{"t":"p","c":{"en":"The numbers in the second column are counted from the framework's objective lists (they do not include the eight TWM statements, which apply to every stage). The last column is only simple division. It is not a recommended time per objective, because some objectives, such as 6Nf.05 (add and subtract fractions with different denominators), need much more time than others, such as 5Gt.01 (time intervals less than one second). The point of the table is to show that time is limited, so units must be planned with care and no hours should be wasted on repeated or low-value activities.","ar":"The numbers in the second column are counted from the framework's objective lists (they do not include the eight TWM statements, which apply to every stage). The last column is only simple division. It is not a recommended time per objective, because some objectives, such as 6Nf.05 (add and subtract fractions with different denominators), need much more time than others, such as 5Gt.01 (time intervals less than one second). The point of the table is to show that time is limited, so units must be planned with care and no hours should be wasted on repeated or low-value activities."}},{"t":"scenario","title":{"en":"Scenario: two sets of materials in one department","ar":"Scenario: two sets of materials in one department"},"c":{"en":"Two Stage 4 teachers in the same year group plan the fractions unit. Teacher A follows the order in the Cambridge scheme of work. Teacher B follows the order of the school textbook, which puts percentages (4Nf.06) before equivalent fractions (4Nf.04). Both say they are \"following Cambridge\". \u003cstrong>What should the HOD say?\u003c/strong> Both orders can be acceptable, because the framework says there is no requirement to follow the scheme of work's order. But the department should agree one order, or agree why they differ, so that learners in different classes prepare for the same assessments and so that prerequisites are respected. The HOD should also check that every Stage 4 objective is covered somewhere in the year plan.","ar":"Two Stage 4 teachers in the same year group plan the fractions unit. Teacher A follows the order in the Cambridge scheme of work. Teacher B follows the order of the school textbook, which puts percentages (4Nf.06) before equivalent fractions (4Nf.04). Both say they are \"following Cambridge\". \u003cstrong>What should the HOD say?\u003c/strong> Both orders can be acceptable, because the framework says there is no requirement to follow the scheme of work's order. But the department should agree one order, or agree why they differ, so that learners in different classes prepare for the same assessments and so that prerequisites are respected. The HOD should also check that every Stage 4 objective is covered somewhere in the year plan."}}],"checks":[{"id":"m1q1","q":{"en":"A teacher reads the code 4Nf.05. What does the \"Nf\" part tell her?","ar":"A teacher reads the code 4Nf.05. What does the \"Nf\" part tell her?"},"opts":[{"en":"It is the reporting code for the sub-strand Fractions, decimals, percentages, ratio and proportion","ar":"It is the reporting code for the sub-strand Fractions, decimals, percentages, ratio and proportion"},{"en":"It is the number of the learning objective inside the sub-strand for that stage, in teaching order","ar":"It is the number of the learning objective inside the sub-strand for that stage, in teaching order"},{"en":"It shows that the objective is normally taught in the second half of the school year, not earlier","ar":"It shows that the objective is normally taught in the second half of the school year, not earlier"},{"en":"It is the reporting code for the sub-strand Number facts and place value in Stage 4","ar":"It is the reporting code for the sub-strand Number facts and place value in Stage 4"}],"correct":0,"expl":{"en":"The framework says each code has the stage number, a reporting code that reflects the sub-strand title (here Nf, Fractions, decimals, percentages, ratio and proportion) and a number showing the order of the objective.","ar":"The framework says each code has the stage number, a reporting code that reflects the sub-strand title (here Nf, Fractions, decimals, percentages, ratio and proportion) and a number showing the order of the objective."}},{"id":"m1q2","q":{"en":"What does the framework say about using the ideas in the Cambridge schemes of work?","ar":"What does the framework say about using the ideas in the Cambridge schemes of work?"},"opts":[{"en":"You must use them in the suggested order so that learners are ready for the Cambridge tests","ar":"You must use them in the suggested order so that learners are ready for the Cambridge tests"},{"en":"You do not need to use them to teach, and they are not designed to fill all the teaching time","ar":"You do not need to use them to teach, and they are not designed to fill all the teaching time"},{"en":"They are compulsory in Stages 1 and 2, but become optional in the later primary stages of the programme","ar":"They are compulsory in Stages 1 and 2, but become optional in the later primary stages of the programme"},{"en":"You may use them only if the school buys the matching Cambridge textbooks for each stage","ar":"You may use them only if the school buys the matching Cambridge textbooks for each stage"}],"correct":1,"expl":{"en":"The framework says you do not need to use the ideas in the schemes of work. It adds that they indicate the types of activities and the intended depth and breadth, and that other activities of similar difficulty should fill the rest of the time.","ar":"The framework says you do not need to use the ideas in the schemes of work. It adds that they indicate the types of activities and the intended depth and breadth, and that other activities of similar difficulty should fill the rest of the time."}},{"id":"m1q3","q":{"en":"Which sentence best matches the framework's guidance on teaching time?","ar":"Which sentence best matches the framework's guidance on teaching time?"},"opts":[{"en":"Every Stage 1 to 6 class must be given exactly 5 hours of Mathematics each week for the full year","ar":"Every Stage 1 to 6 class must be given exactly 5 hours of Mathematics each week for the full year"},{"en":"The framework is based on 4 to 5 hours per week, and schools with fewer hours must remove objectives","ar":"The framework is based on 4 to 5 hours per week, and schools with fewer hours must remove objectives"},{"en":"It assumes 4 to 5 hours per week (about 120 to 150 hours per stage), and real hours may vary","ar":"It assumes 4 to 5 hours per week (about 120 to 150 hours per stage), and real hours may vary"},{"en":"The framework is based on 2 to 3 hours per week, about 60 to 90 hours per stage in total","ar":"The framework is based on 2 to 3 hours per week, about 60 to 90 hours per stage in total"}],"correct":2,"expl":{"en":"The framework says it is based on learners having 4 to 5 hours of Mathematics per week (about 120 to 150 hours per stage) and that your actual number of teaching hours may vary according to your context.","ar":"The framework says it is based on learners having 4 to 5 hours of Mathematics per week (about 120 to 150 hours per stage) and that your actual number of teaching hours may vary according to your context."}}]},{"id":"m2","title":{"en":"The CRA Approach: Concrete, Representational, Abstract","ar":"The CRA Approach: Concrete, Representational, Abstract"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Many learners can follow a method on the board but cannot say why it works. The framework describes this difference when it talks about Thinking and Working Mathematically: learners who \"simply follow instructions and carry out processes that they have been shown how to do, without appreciating why they work or what the results mean.\" The concrete, representational, abstract approach, called \u003cstrong>CRA\u003c/strong>, is one of the main ways the framework asks teachers to avoid that problem.","ar":"Many learners can follow a method on the board but cannot say why it works. The framework describes this difference when it talks about Thinking and Working Mathematically: learners who \"simply follow instructions and carry out processes that they have been shown how to do, without appreciating why they work or what the results mean.\" The concrete, representational, abstract approach, called \u003cstrong>CRA\u003c/strong>, is one of the main ways the framework asks teachers to avoid that problem."}},{"t":"h","c":{"en":"What the framework says","ar":"What the framework says"}},{"t":"p","c":{"en":"In its overview of teaching approaches, the framework says that the three-step teaching approach, concrete, representational, abstract, \u003cstrong>\"is developed in all primary stages of learning\"\u003c/strong>. It describes the steps in this order:","ar":"In its overview of teaching approaches, the framework says that the three-step teaching approach, concrete, representational, abstract, \u003cstrong>\"is developed in all primary stages of learning\"\u003c/strong>. It describes the steps in this order:"}},{"t":"steps","c":{"en":["\u003cstrong>Concrete:\u003c/strong> learners first use objects to help them understand a new concept.","\u003cstrong>Representational:\u003c/strong> learners transform the concrete model into a pictorial representation of the same concept.","\u003cstrong>Abstract:\u003c/strong> learners are shown how the pictorial representations relate to conventional mathematical symbols and notation."],"ar":["\u003cstrong>Concrete:\u003c/strong> learners first use objects to help them understand a new concept.","\u003cstrong>Representational:\u003c/strong> learners transform the concrete model into a pictorial representation of the same concept.","\u003cstrong>Abstract:\u003c/strong> learners are shown how the pictorial representations relate to conventional mathematical symbols and notation."]}},{"t":"p","c":{"en":"Three details are worth noticing. First, the approach is for \u003cem>all\u003c/em> primary stages, not only for Stage 1. Second, the picture is a transformation of the same model, so the drawing must clearly match the objects. Third, the symbols come last, and the framework says learners are \u003cem>shown how the pictures relate to\u003c/em> the symbols. The link between the steps is part of the teaching.","ar":"Three details are worth noticing. First, the approach is for \u003cem>all\u003c/em> primary stages, not only for Stage 1. Second, the picture is a transformation of the same model, so the drawing must clearly match the objects. Third, the symbols come last, and the framework says learners are \u003cem>shown how the pictures relate to\u003c/em> the symbols. The link between the steps is part of the teaching."}},{"t":"callout","k":"tip","title":{"en":"In plain words","ar":"In plain words"},"c":{"en":"Concrete = \"I can hold it and move it.\" Representational = \"I can draw it.\" Abstract = \"I can write it with numbers and symbols.\" A learner who can do all three, and move between them, understands the idea.","ar":"Concrete = \"I can hold it and move it.\" Representational = \"I can draw it.\" Abstract = \"I can write it with numbers and symbols.\" A learner who can do all three, and move between them, understands the idea."}},{"t":"h","c":{"en":"CRA across Stages 1 to 6: worked examples","ar":"CRA across Stages 1 to 6: worked examples"}},{"t":"p","c":{"en":"The table gives one example for each stage. The objectives are quoted briefly and you should check the full wording in the framework. The materials and drawings are good practice and are only examples.","ar":"The table gives one example for each stage. The objectives are quoted briefly and you should check the full wording in the framework. The materials and drawings are good practice and are only examples."}},{"t":"table","head":{"en":["Stage and objective","Concrete","Representational","Abstract"],"ar":["Stage and objective","Concrete","Representational","Abstract"]},"rows":[{"en":["Stage 1, 1Ni.04: recognise complements of 10","Ten counters in two colours on a double ten-frame; learners turn counters over to find pairs","A drawn ten-frame with dots, six filled and four empty","6 + 4 = 10, then 10 - 6 = 4"],"ar":["Stage 1, 1Ni.04: recognise complements of 10","Ten counters in two colours on a double ten-frame; learners turn counters over to find pairs","A drawn ten-frame with dots, six filled and four empty","6 + 4 = 10, then 10 - 6 = 4"]},{"en":["Stage 2, 2Np.02: compose, decompose and regroup 2-digit numbers using tens and ones","Base-ten rods (tens) and cubes (ones) to make 34, then swap one ten for ten ones","Quick drawings: a line for each ten, a dot for each one","34 = 30 + 4 and 34 = 20 + 14"],"ar":["Stage 2, 2Np.02: compose, decompose and regroup 2-digit numbers using tens and ones","Base-ten rods (tens) and cubes (ones) to make 34, then swap one ten for ten ones","Quick drawings: a line for each ten, a dot for each one","34 = 30 + 4 and 34 = 20 + 14"]},{"en":["Stage 3, 3Nf.07: add fractions with the same denominator","Fraction strips or folded paper: put 2 fifths next to 1 fifth","A bar drawn and split into five parts, three shaded","2/5 + 1/5 = 3/5"],"ar":["Stage 3, 3Nf.07: add fractions with the same denominator","Fraction strips or folded paper: put 2 fifths next to 1 fifth","A bar drawn and split into five parts, three shaded","2/5 + 1/5 = 3/5"]},{"en":["Stage 4, 4Gg.03: derive and use formulae for area and perimeter of rectangles","Square tiles to cover a rectangle; string around the edge","A rectangle on squared paper with the rows and columns counted, then labelled with length and width","Area = length × width; perimeter = 2 × (length + width)"],"ar":["Stage 4, 4Gg.03: derive and use formulae for area and perimeter of rectangles","Square tiles to cover a rectangle; string around the edge","A rectangle on squared paper with the rows and columns counted, then labelled with length and width","Area = length × width; perimeter = 2 × (length + width)"]},{"en":["Stage 5, 5Nf.04: proper fractions, decimals and percentages with equivalent values","A 100-square, with coloured squares for a fraction of the whole","A bar or number line marked 0 to 1 with fraction, decimal and percentage labels","3/10 = 0.3 = 30%"],"ar":["Stage 5, 5Nf.04: proper fractions, decimals and percentages with equivalent values","A 100-square, with coloured squares for a fraction of the whole","A bar or number line marked 0 to 1 with fraction, decimal and percentage labels","3/10 = 0.3 = 30%"]},{"en":["Stage 6, 6Gg.10: the angles in a triangle add up to 180°","Tear the three corners off a paper triangle and fit them together on a straight line","A triangle with the angles labelled and a straight line drawn beside it","Missing angle = 180° - 80° - 45° = 55°"],"ar":["Stage 6, 6Gg.10: the angles in a triangle add up to 180°","Tear the three corners off a paper triangle and fit them together on a straight line","A triangle with the angles labelled and a straight line drawn beside it","Missing angle = 180° - 80° - 45° = 55°"]}]},{"t":"p","c":{"en":"Look at the Stage 6 row. Even in the oldest primary stage, the concrete step helps. Learners \"see\" that three corners make a straight line before they use the rule. That is why the framework says CRA is developed in \u003cem>all\u003c/em> stages.","ar":"Look at the Stage 6 row. Even in the oldest primary stage, the concrete step helps. Learners \"see\" that three corners make a straight line before they use the rule. That is why the framework says CRA is developed in \u003cem>all\u003c/em> stages."}},{"t":"h","c":{"en":"A full worked example: Stage 2 multiplication","ar":"A full worked example: Stage 2 multiplication"}},{"t":"p","c":{"en":"Objective \u003cstrong>2Ni.05\u003c/strong>: understand multiplication as repeated addition and as an array. A Stage 2 class of 28 learners, all learning in English as a second language, might meet the idea like this over one or two lessons (timings are good practice):","ar":"Objective \u003cstrong>2Ni.05\u003c/strong>: understand multiplication as repeated addition and as an array. A Stage 2 class of 28 learners, all learning in English as a second language, might meet the idea like this over one or two lessons (timings are good practice):"}},{"t":"steps","c":{"en":["\u003cstrong>Concrete (15 minutes).\u003c/strong> In pairs, learners put 3 cups on the table, with 4 counters in each cup. The teacher models the language: \"There are three groups of four.\" Learners find the total by touching and counting. They then arrange the same counters in 3 rows of 4 to make an array.","\u003cstrong>Representational (15 minutes).\u003c/strong> Learners draw 3 circles with 4 dots in each, then draw a 3 by 4 array of dots. The teacher asks, \"Where are the cups in your array? Where are the counters?\" so that the picture is clearly linked to the objects.","\u003cstrong>Abstract (10 minutes).\u003c/strong> The teacher writes 4 + 4 + 4 = 12 beside the picture and says, \"Three groups of four.\" Later, the symbol 3 × 4 = 12 is introduced as another way to record the same idea.","\u003cstrong>Move between the steps (10 minutes).\u003c/strong> Show a number sentence and ask learners to build or draw it. Show a drawing and ask learners to write the sentence. Show an array and ask, \"Can you write two different sentences for it?\" (4 + 4 + 4 and 3 + 3 + 3 + 3.)"],"ar":["\u003cstrong>Concrete (15 minutes).\u003c/strong> In pairs, learners put 3 cups on the table, with 4 counters in each cup. The teacher models the language: \"There are three groups of four.\" Learners find the total by touching and counting. They then arrange the same counters in 3 rows of 4 to make an array.","\u003cstrong>Representational (15 minutes).\u003c/strong> Learners draw 3 circles with 4 dots in each, then draw a 3 by 4 array of dots. The teacher asks, \"Where are the cups in your array? Where are the counters?\" so that the picture is clearly linked to the objects.","\u003cstrong>Abstract (10 minutes).\u003c/strong> The teacher writes 4 + 4 + 4 = 12 beside the picture and says, \"Three groups of four.\" Later, the symbol 3 × 4 = 12 is introduced as another way to record the same idea.","\u003cstrong>Move between the steps (10 minutes).\u003c/strong> Show a number sentence and ask learners to build or draw it. Show a drawing and ask learners to write the sentence. Show an array and ask, \"Can you write two different sentences for it?\" (4 + 4 + 4 and 3 + 3 + 3 + 3.)"]}},{"t":"p","c":{"en":"Notice what the teacher does \u003cem>not\u003c/em> do. She does not begin with the times-table chart, and she does not teach \"multiply means times\" as a rule. The meaning comes first, and the symbols come last. This also helps ESL learners, because the objects and drawings carry meaning while English vocabulary is still developing.","ar":"Notice what the teacher does \u003cem>not\u003c/em> do. She does not begin with the times-table chart, and she does not teach \"multiply means times\" as a rule. The meaning comes first, and the symbols come last. This also helps ESL learners, because the objects and drawings carry meaning while English vocabulary is still developing."}},{"t":"h","c":{"en":"Common errors in applying CRA (good practice)","ar":"Common errors in applying CRA (good practice)"}},{"t":"p","c":{"en":"The framework describes the approach, but not the errors teachers make. These are common in practice. You can use them as a self-check.","ar":"The framework describes the approach, but not the errors teachers make. These are common in practice. You can use them as a self-check."}},{"t":"list","c":{"en":["\u003cstrong>Skipping the middle step.\u003c/strong> Going straight from objects to symbols leaves learners with nothing to picture. The drawing is the bridge.","\u003cstrong>Seeing the abstract step as the only \"real\" mathematics.\u003c/strong> Concrete work is not a game for the early part of the lesson. It is where understanding is built.","\u003cstrong>Using CRA only with younger or lower-attaining learners.\u003c/strong> The framework says it applies in all stages. Older learners may move through the steps faster, but a new idea such as 5Nf.03 (improper fractions and mixed numbers) is new for everyone.","\u003cstrong>Showing objects but not linking them.\u003c/strong> If learners never see which part of the picture matches which part of the number sentence, the three steps stay separate. Use the question \"Where can you see the 3 in your drawing?\"","\u003cstrong>Drawings that are too detailed.\u003c/strong> Learners spend ten minutes drawing apples. Use simple dots, bars or sticks.","\u003cstrong>Moving to symbols too early.\u003c/strong> If many learners make the same error in the abstract step, go back one step. This is not failure. It is how CRA is meant to work.","\u003cstrong>Using materials that confuse.\u003c/strong> Different coloured cubes for no reason, or place-value counters before learners understand place value, add a new thing to learn. Keep materials simple and consistent across the school if possible.","\u003cstrong>Treating CRA as a fixed lesson order.\u003c/strong> You might move through all three steps in one lesson or across a week. What matters is that every learner meets all three and can connect them."],"ar":["\u003cstrong>Skipping the middle step.\u003c/strong> Going straight from objects to symbols leaves learners with nothing to picture. The drawing is the bridge.","\u003cstrong>Seeing the abstract step as the only \"real\" mathematics.\u003c/strong> Concrete work is not a game for the early part of the lesson. It is where understanding is built.","\u003cstrong>Using CRA only with younger or lower-attaining learners.\u003c/strong> The framework says it applies in all stages. Older learners may move through the steps faster, but a new idea such as 5Nf.03 (improper fractions and mixed numbers) is new for everyone.","\u003cstrong>Showing objects but not linking them.\u003c/strong> If learners never see which part of the picture matches which part of the number sentence, the three steps stay separate. Use the question \"Where can you see the 3 in your drawing?\"","\u003cstrong>Drawings that are too detailed.\u003c/strong> Learners spend ten minutes drawing apples. Use simple dots, bars or sticks.","\u003cstrong>Moving to symbols too early.\u003c/strong> If many learners make the same error in the abstract step, go back one step. This is not failure. It is how CRA is meant to work.","\u003cstrong>Using materials that confuse.\u003c/strong> Different coloured cubes for no reason, or place-value counters before learners understand place value, add a new thing to learn. Keep materials simple and consistent across the school if possible.","\u003cstrong>Treating CRA as a fixed lesson order.\u003c/strong> You might move through all three steps in one lesson or across a week. What matters is that every learner meets all three and can connect them."]}},{"t":"scenario","title":{"en":"Scenario: the learner who \"knows\" the rule","ar":"Scenario: the learner who \"knows\" the rule"},"c":{"en":"In a Stage 5 lesson on 5Nf.03, a learner writes 7/4 = 1 3/4 correctly and says, \"You divide the top by the bottom and the remainder goes on top.\" The teacher asks, \"Can you show me with something you can hold or draw?\" The learner draws 7 quarter-pieces but cannot make wholes from them. \u003cstrong>What does this show, and what next?\u003c/strong> The learner has a rule in the abstract step but has not built the meaning in the concrete and representational steps. The teacher gives the learner paper circles cut into quarters and asks him to make as many whole circles as possible. Then she asks him to draw what he did and to link the \"1\" and the \"3/4\" to parts of the picture. The rule now has a meaning.","ar":"In a Stage 5 lesson on 5Nf.03, a learner writes 7/4 = 1 3/4 correctly and says, \"You divide the top by the bottom and the remainder goes on top.\" The teacher asks, \"Can you show me with something you can hold or draw?\" The learner draws 7 quarter-pieces but cannot make wholes from them. \u003cstrong>What does this show, and what next?\u003c/strong> The learner has a rule in the abstract step but has not built the meaning in the concrete and representational steps. The teacher gives the learner paper circles cut into quarters and asks him to make as many whole circles as possible. Then she asks him to draw what he did and to link the \"1\" and the \"3/4\" to parts of the picture. The rule now has a meaning."}},{"t":"callout","k":"warn","title":{"en":"Check your own habit","ar":"Check your own habit"},"c":{"en":"Look at your last three Mathematics lessons. In how many did learners use objects or drawings \u003cem>before\u003c/em> the written method? If the answer is none, choose one upcoming objective and plan all three CRA steps for it.","ar":"Look at your last three Mathematics lessons. In how many did learners use objects or drawings \u003cem>before\u003c/em> the written method? If the answer is none, choose one upcoming objective and plan all three CRA steps for it."}}],"checks":[{"id":"m2q1","q":{"en":"According to the framework, what happens in the \"representational\" step of CRA?","ar":"According to the framework, what happens in the \"representational\" step of CRA?"},"opts":[{"en":"Learners learn the conventional symbols and write number sentences for the first time","ar":"Learners learn the conventional symbols and write number sentences for the first time"},{"en":"Learners use objects only to check an answer that they have already calculated mentally","ar":"Learners use objects only to check an answer that they have already calculated mentally"},{"en":"Learners describe the concept in words to a partner without objects or pictures, before any recording","ar":"Learners describe the concept in words to a partner without objects or pictures, before any recording"},{"en":"Learners transform the concrete model into a pictorial representation of the same concept","ar":"Learners transform the concrete model into a pictorial representation of the same concept"}],"correct":3,"expl":{"en":"The framework says that in the next step after using objects, learners transform the concrete model into a pictorial representation of the same concept.","ar":"The framework says that in the next step after using objects, learners transform the concrete model into a pictorial representation of the same concept."}},{"id":"m2q2","q":{"en":"A Stage 6 teacher says, \"CRA is only for Stage 1.\" Which reply is correct?","ar":"A Stage 6 teacher says, \"CRA is only for Stage 1.\" Which reply is correct?"},"opts":[{"en":"The framework says the CRA approach is developed in all primary stages of learning","ar":"The framework says the CRA approach is developed in all primary stages of learning"},{"en":"CRA is for Stages 1 and 2 only, because older learners already have the abstract skills","ar":"CRA is for Stages 1 and 2 only, because older learners already have the abstract skills"},{"en":"CRA is for Stages 1 to 3 only, and Stages 4 to 6 use only written methods","ar":"CRA is for Stages 1 to 3 only, and Stages 4 to 6 use only written methods"},{"en":"CRA is for any stage, but only for learners who failed the previous test","ar":"CRA is for any stage, but only for learners who failed the previous test"}],"correct":0,"expl":{"en":"The framework says the three-step approach is developed in all primary stages. Older learners may move more quickly, but new ideas still benefit from objects and drawings.","ar":"The framework says the three-step approach is developed in all primary stages. Older learners may move more quickly, but new ideas still benefit from objects and drawings."}},{"id":"m2q3","q":{"en":"In the Stage 2 lesson on 2Ni.05, which action best links the representational and abstract steps?","ar":"In the Stage 2 lesson on 2Ni.05, which action best links the representational and abstract steps?"},"opts":[{"en":"Giving out a times-table chart and asking learners to learn the 3 times table as homework","ar":"Giving out a times-table chart and asking learners to learn the 3 times table as homework"},{"en":"Writing 4 + 4 + 4 = 12 beside the drawing and asking learners where each 4 is in the picture","ar":"Writing 4 + 4 + 4 = 12 beside the drawing and asking learners where each 4 is in the picture"},{"en":"Asking learners to draw 12 dots and then colour them in as neatly and carefully as they possibly can","ar":"Asking learners to draw 12 dots and then colour them in as neatly and carefully as they possibly can"},{"en":"Showing 3 × 4 = 12 on the board first and then asking learners to copy it into books","ar":"Showing 3 × 4 = 12 on the board first and then asking learners to copy it into books"}],"correct":1,"expl":{"en":"The abstract step is where learners are shown how the pictures relate to the symbols. Matching each part of the number sentence to part of the drawing makes that link visible.","ar":"The abstract step is where learners are shown how the pictures relate to the symbols. Matching each part of the number sentence to part of the drawing makes that link visible."}}]},{"id":"m3","title":{"en":"Embedding Thinking and Working Mathematically in Lessons","ar":"Embedding Thinking and Working Mathematically in Lessons"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Part A introduced the eight Thinking and Working Mathematically (TWM) characteristics. This module is about what to \u003cem>do\u003c/em> with them on a Tuesday morning. The framework gives two clear instructions. First, TWM is \u003cstrong>not an independent strand\u003c/strong>; it is embedded within and across the other strands. Second, it \u003cstrong>\"should not be taught as a separate special activity but instead it should be embedded throughout the curriculum.\"\u003c/strong> So the question for a teacher is not \"When do we do TWM?\" but \"How does this task make learners think and work mathematically?\"","ar":"Part A introduced the eight Thinking and Working Mathematically (TWM) characteristics. This module is about what to \u003cem>do\u003c/em> with them on a Tuesday morning. The framework gives two clear instructions. First, TWM is \u003cstrong>not an independent strand\u003c/strong>; it is embedded within and across the other strands. Second, it \u003cstrong>\"should not be taught as a separate special activity but instead it should be embedded throughout the curriculum.\"\u003c/strong> So the question for a teacher is not \"When do we do TWM?\" but \"How does this task make learners think and work mathematically?\""}},{"t":"h","c":{"en":"The four pairs, as questions you can ask","ar":"The four pairs, as questions you can ask"}},{"t":"p","c":{"en":"The framework presents the eight characteristics in four pairs: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. It also says they are intertwined and interdependent, and that a high-quality task may draw on one or more of them. The table turns each pair into questions and tasks. The question stems and tasks are good practice, not framework text. The definitions in the second column are short paraphrases of the framework.","ar":"The framework presents the eight characteristics in four pairs: Specialising and Generalising; Conjecturing and Convincing; Characterising and Classifying; Critiquing and Improving. It also says they are intertwined and interdependent, and that a high-quality task may draw on one or more of them. The table turns each pair into questions and tasks. The question stems and tasks are good practice, not framework text. The definitions in the second column are short paraphrases of the framework."}},{"t":"table","head":{"en":["Pair","What the learner does (framework idea)","Questions that prompt it (good practice)","Task example and objective"],"ar":["Pair","What the learner does (framework idea)","Questions that prompt it (good practice)","Task example and objective"]},"rows":[{"en":["Specialising and Generalising","Choose examples and test them; notice a pattern across many examples","\"Can you give me an example?\" \"Try another one. What stays the same?\" \"Does it always work?\"","Stage 3: find many pairs of numbers that make 100, then describe what you notice (3Ni.03)"],"ar":["Specialising and Generalising","Choose examples and test them; notice a pattern across many examples","\"Can you give me an example?\" \"Try another one. What stays the same?\" \"Does it always work?\"","Stage 3: find many pairs of numbers that make 100, then describe what you notice (3Ni.03)"]},{"en":["Conjecturing and Convincing","Form a mathematical idea or question; present evidence to justify or challenge it","\"What do you think will happen? Why?\" \"How could you prove it to a friend?\" \"Can you find an example that does not work?\"","Stage 4: \"An odd number plus an even number is always odd.\" True or false? (4Nc.02)"],"ar":["Conjecturing and Convincing","Form a mathematical idea or question; present evidence to justify or challenge it","\"What do you think will happen? Why?\" \"How could you prove it to a friend?\" \"Can you find an example that does not work?\"","Stage 4: \"An odd number plus an even number is always odd.\" True or false? (4Nc.02)"]},{"en":["Characterising and Classifying","Describe the properties of an object; sort objects into groups by those properties","\"What is the same? What is different?\" \"How could you sort these?\" \"Which one does not belong, and why?\"","Stage 2: sort 2D shapes by number of sides and vertices, then name your own groups (2Gg.01)"],"ar":["Characterising and Classifying","Describe the properties of an object; sort objects into groups by those properties","\"What is the same? What is different?\" \"How could you sort these?\" \"Which one does not belong, and why?\"","Stage 2: sort 2D shapes by number of sides and vertices, then name your own groups (2Gg.01)"]},{"en":["Critiquing and Improving","Compare and evaluate ideas, then refine them","\"Which method is quicker? Which is clearer?\" \"What mistake could someone make here?\" \"How could you make this answer better?\"","Stage 5: two learners both say they found the perimeter of a shape; compare the methods and fix the weaker one (5Gg.02)"],"ar":["Critiquing and Improving","Compare and evaluate ideas, then refine them","\"Which method is quicker? Which is clearer?\" \"What mistake could someone make here?\" \"How could you make this answer better?\"","Stage 5: two learners both say they found the perimeter of a shape; compare the methods and fix the weaker one (5Gg.02)"]}]},{"t":"h","c":{"en":"Where does TWM sit in the framework?","ar":"Where does TWM sit in the framework?"}},{"t":"p","c":{"en":"Every stage of the framework lists the same eight TWM statements, TWM.01 Specialising to TWM.08 Improving, before the Number, Geometry and Measure, and Statistics and Probability objectives. This means that the same characteristics apply from Stage 1 to Stage 6. What changes is the mathematics the learners are working on, and the independence and precision of their thinking. For learners before Stage 1, the framework says it expects early years learners to explore mathematical ideas \"using language and strategies that are personal to them\". At Stage 1 you should therefore welcome learners' own words and drawings, and slowly bring in the standard mathematical language.","ar":"Every stage of the framework lists the same eight TWM statements, TWM.01 Specialising to TWM.08 Improving, before the Number, Geometry and Measure, and Statistics and Probability objectives. This means that the same characteristics apply from Stage 1 to Stage 6. What changes is the mathematics the learners are working on, and the independence and precision of their thinking. For learners before Stage 1, the framework says it expects early years learners to explore mathematical ideas \"using language and strategies that are personal to them\". At Stage 1 you should therefore welcome learners' own words and drawings, and slowly bring in the standard mathematical language."}},{"t":"callout","k":"tip","title":{"en":"Good practice: TWM codes in your plan","ar":"Good practice: TWM codes in your plan"},"c":{"en":"When you write a lesson plan, list the content objective (for example 4Nc.02) \u003cem>and\u003c/em> the TWM statements the task is designed to draw on (for example TWM.03 Conjecturing and TWM.04 Convincing). This reminds you to plan the questions, not only the answers.","ar":"When you write a lesson plan, list the content objective (for example 4Nc.02) \u003cem>and\u003c/em> the TWM statements the task is designed to draw on (for example TWM.03 Conjecturing and TWM.04 Convincing). This reminds you to plan the questions, not only the answers."}},{"t":"h","c":{"en":"Designing tasks that invite thinking","ar":"Designing tasks that invite thinking"}},{"t":"p","c":{"en":"The framework says that TWM \"can be stimulated by inconsistencies, patterns or particular representations, and can be improved through practice, reflection and questioning\". That sentence is a design guide. Use it as follows (the steps are good practice):","ar":"The framework says that TWM \"can be stimulated by inconsistencies, patterns or particular representations, and can be improved through practice, reflection and questioning\". That sentence is a design guide. Use it as follows (the steps are good practice):"}},{"t":"steps","c":{"en":["\u003cstrong>Start from your content objective.\u003c/strong> For example 3Ni.02: use the commutative and associative properties of addition to simplify calculations.","\u003cstrong>Look for a closed task and open it.\u003c/strong> \"Work out 38 + 27 + 12\" has one answer and one obvious method. \"Which two numbers would you add first to make it easy? Why? Is there another way?\" invites learners to choose and justify.","\u003cstrong>Add a pattern or an inconsistency.\u003c/strong> \"Ali says 38 + 12 + 27 is the same as 38 + 27 + 12. Is he right? Always?\"","\u003cstrong>Choose a representation.\u003c/strong> A number line, a bar model or counters. Different representations can show different things, and comparing them is itself Critiquing.","\u003cstrong>Plan the questions.\u003c/strong> Write three questions you will ask, one to start, one to push and one to close.","\u003cstrong>Plan the talk.\u003c/strong> Decide when learners will discuss with a partner, and what you want them to say. (See Module 5 for sentence frames.)"],"ar":["\u003cstrong>Start from your content objective.\u003c/strong> For example 3Ni.02: use the commutative and associative properties of addition to simplify calculations.","\u003cstrong>Look for a closed task and open it.\u003c/strong> \"Work out 38 + 27 + 12\" has one answer and one obvious method. \"Which two numbers would you add first to make it easy? Why? Is there another way?\" invites learners to choose and justify.","\u003cstrong>Add a pattern or an inconsistency.\u003c/strong> \"Ali says 38 + 12 + 27 is the same as 38 + 27 + 12. Is he right? Always?\"","\u003cstrong>Choose a representation.\u003c/strong> A number line, a bar model or counters. Different representations can show different things, and comparing them is itself Critiquing.","\u003cstrong>Plan the questions.\u003c/strong> Write three questions you will ask, one to start, one to push and one to close.","\u003cstrong>Plan the talk.\u003c/strong> Decide when learners will discuss with a partner, and what you want them to say. (See Module 5 for sentence frames.)"]}},{"t":"scenario","title":{"en":"Worked example: from closed to open","ar":"Worked example: from closed to open"},"c":{"en":"\u003cstrong>Closed task (Stage 4, 4Ni.05):\u003c/strong> \"Calculate 124 × 3.\" Every learner does the same thing. \u003cstrong>Open task:\u003c/strong> \"Here are three ways to work out 124 × 3. Method A: 100 × 3 + 20 × 3 + 4 × 3. Method B: 124 + 124 + 124. Method C: 120 × 3 + 4 × 3. Which way would you choose? Why? Which is most useful if the number was 1,240? Can you improve Method B?\" The mathematics is the same. But now learners are Critiquing (comparing methods), Improving (refining Method B) and Convincing (justifying a choice). The task also respects the framework's position that learners should have flexibility in their strategies (see Module 4).","ar":"\u003cstrong>Closed task (Stage 4, 4Ni.05):\u003c/strong> \"Calculate 124 × 3.\" Every learner does the same thing. \u003cstrong>Open task:\u003c/strong> \"Here are three ways to work out 124 × 3. Method A: 100 × 3 + 20 × 3 + 4 × 3. Method B: 124 + 124 + 124. Method C: 120 × 3 + 4 × 3. Which way would you choose? Why? Which is most useful if the number was 1,240? Can you improve Method B?\" The mathematics is the same. But now learners are Critiquing (comparing methods), Improving (refining Method B) and Convincing (justifying a choice). The task also respects the framework's position that learners should have flexibility in their strategies (see Module 4)."}},{"t":"h","c":{"en":"Mathematical talk and reasoning","ar":"Mathematical talk and reasoning"}},{"t":"p","c":{"en":"The framework says that TWM \"encourages learners to talk with others, challenge ideas and to provide evidence that validates conjectures and solutions\", and it describes confident learners who \"present their findings and defend their strategies and solutions as well as critique and improve solutions of others\". These are descriptions of talk. Learners cannot do this if the teacher does all of the talking. These routines are good practice for building talk:","ar":"The framework says that TWM \"encourages learners to talk with others, challenge ideas and to provide evidence that validates conjectures and solutions\", and it describes confident learners who \"present their findings and defend their strategies and solutions as well as critique and improve solutions of others\". These are descriptions of talk. Learners cannot do this if the teacher does all of the talking. These routines are good practice for building talk:"}},{"t":"list","c":{"en":["\u003cstrong>Think, pair, share:\u003c/strong> learners think alone for 30 seconds, tell a partner, then the teacher chooses two pairs to share. The quiet thinking time helps ESL learners, who need time to prepare their words.","\u003cstrong>Convince me:\u003c/strong> after an answer, the teacher asks, \"How do you know?\" or \"Convince me.\" The answer must be more than \"because I did it\". It should use a picture, an example or a rule.","\u003cstrong>Always, sometimes, never:\u003c/strong> give a statement such as \"A square is a rectangle\" (Stage 6, 6Gg.01) and ask learners to decide and defend. This produces Conjecturing and Convincing, and often exposes misconceptions.","\u003cstrong>Odd one out:\u003c/strong> show three or four items (numbers, shapes, fractions) and ask which does not belong. There can be more than one correct answer if the reason is mathematical. This develops Characterising and Classifying.","\u003cstrong>Spot the mistake:\u003c/strong> present a worked example with an error, written by an imaginary pupil. Learners find it, explain it and improve it. This is a safe way to practise Critiquing, because no real learner is criticised.","\u003cstrong>Revoicing:\u003c/strong> the teacher repeats a learner's idea with the correct mathematical vocabulary: \"So you are saying the parts must be equal. Yes, equal parts.\" This models the language without correcting the learner publicly."],"ar":["\u003cstrong>Think, pair, share:\u003c/strong> learners think alone for 30 seconds, tell a partner, then the teacher chooses two pairs to share. The quiet thinking time helps ESL learners, who need time to prepare their words.","\u003cstrong>Convince me:\u003c/strong> after an answer, the teacher asks, \"How do you know?\" or \"Convince me.\" The answer must be more than \"because I did it\". It should use a picture, an example or a rule.","\u003cstrong>Always, sometimes, never:\u003c/strong> give a statement such as \"A square is a rectangle\" (Stage 6, 6Gg.01) and ask learners to decide and defend. This produces Conjecturing and Convincing, and often exposes misconceptions.","\u003cstrong>Odd one out:\u003c/strong> show three or four items (numbers, shapes, fractions) and ask which does not belong. There can be more than one correct answer if the reason is mathematical. This develops Characterising and Classifying.","\u003cstrong>Spot the mistake:\u003c/strong> present a worked example with an error, written by an imaginary pupil. Learners find it, explain it and improve it. This is a safe way to practise Critiquing, because no real learner is criticised.","\u003cstrong>Revoicing:\u003c/strong> the teacher repeats a learner's idea with the correct mathematical vocabulary: \"So you are saying the parts must be equal. Yes, equal parts.\" This models the language without correcting the learner publicly."]}},{"t":"h","c":{"en":"Reasoning in the answer, not only the answer","ar":"Reasoning in the answer, not only the answer"}},{"t":"p","c":{"en":"Learners' reasoning can be seen in their books and in their talk. A learner who writes \"12\" has given an answer. A learner who writes \"12, because 3 rows of 4 make 12\" has given an answer and a reason. Over time, expect more precision. At Stage 1, \"because I counted\" may be a good reason. At Stage 6, learners should use the properties named in the objectives, for example the parts of a circle in 6Gg.02 or the angle sum of a triangle in 6Gg.10.","ar":"Learners' reasoning can be seen in their books and in their talk. A learner who writes \"12\" has given an answer. A learner who writes \"12, because 3 rows of 4 make 12\" has given an answer and a reason. Over time, expect more precision. At Stage 1, \"because I counted\" may be a good reason. At Stage 6, learners should use the properties named in the objectives, for example the parts of a circle in 6Gg.02 or the angle sum of a triangle in 6Gg.10."}},{"t":"callout","k":"key","title":{"en":"Questions are more powerful than explanations","ar":"Questions are more powerful than explanations"},"c":{"en":"The framework says TWM can be improved through practice, reflection and questioning. If you notice that in a lesson you are explaining more than asking, try replacing one explanation with a question. Instead of \"The parts must be equal\", ask \"Is this a half? How do you know?\" and let the learners find the rule.","ar":"The framework says TWM can be improved through practice, reflection and questioning. If you notice that in a lesson you are explaining more than asking, try replacing one explanation with a question. Instead of \"The parts must be equal\", ask \"Is this a half? How do you know?\" and let the learners find the rule."}},{"t":"scenario","title":{"en":"Scenario: the quiet class and the \"separate TWM lesson\"","ar":"Scenario: the quiet class and the \"separate TWM lesson\""},"c":{"en":"A teacher plans a TWM challenge every Friday and teaches normal lessons from Monday to Thursday. In the Friday challenge, learners solve a puzzle
