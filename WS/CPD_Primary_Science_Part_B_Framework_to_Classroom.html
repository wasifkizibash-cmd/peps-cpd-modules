 serious responsibilities: Health and safety; Animal welfare and the use of animals in science; and Teaching human reproduction. They are short, so it is worth knowing exactly what they say. This module first sets out what the framework says, then shows how to apply it in a primary classroom. Where we add practical suggestions, such as how to write a risk assessment, we label them as good practice."}},{"t":"h","c":{"en":"Health and safety: what the framework says","ar":"Health and safety: what the framework says"}},{"t":"p","c":{"en":"The framework explains that scientific enquiry, including \"collecting primary data by experiment\", is an essential part of the curriculum. Experiments are engaging, but \"must, at all times, be conducted with the utmost respect for safety\". It then gives two specific responsibilities of the \u003cstrong>teacher in charge\u003c/strong>:","ar":"The framework explains that scientific enquiry, including \"collecting primary data by experiment\", is an essential part of the curriculum. Experiments are engaging, but \"must, at all times, be conducted with the utmost respect for safety\". It then gives two specific responsibilities of the \u003cstrong>teacher in charge\u003c/strong>:"}},{"t":"list","c":{"en":["to adhere and conform to any national, regional and school regulation in place for the safety of scientific experimentation;","to make a risk assessment of the hazards involved with any particular class or individual when doing a scientific experiment, in a way that conforms to those regulations."],"ar":["to adhere and conform to any national, regional and school regulation in place for the safety of scientific experimentation;","to make a risk assessment of the hazards involved with any particular class or individual when doing a scientific experiment, in a way that conforms to those regulations."]}},{"t":"callout","k":"warn","title":{"en":"Cambridge does not carry the safety responsibility","ar":"Cambridge does not carry the safety responsibility"},"c":{"en":"The framework states that Cambridge International Education takes no responsibility for managing safety for individual published experiments, or for practical work in any given location. It only endorses support material in relation to curriculum content and is not responsible for the safety of activities within it. \"The responsibility for the safety of all activities and experiments remains with the school.\" In practice: an activity in a scheme of work, a textbook or a website is not automatically safe for your class. You must check it.","ar":"The framework states that Cambridge International Education takes no responsibility for managing safety for individual published experiments, or for practical work in any given location. It only endorses support material in relation to curriculum content and is not responsible for the safety of activities within it. \"The responsibility for the safety of all activities and experiments remains with the school.\" In practice: an activity in a scheme of work, a textbook or a website is not automatically safe for your class. You must check it."}},{"t":"h","c":{"en":"Applying it: risk assessment as good practice","ar":"Applying it: risk assessment as good practice"}},{"t":"p","c":{"en":"The framework says a risk assessment must be made. It does not tell you what form to use, so follow your school's procedures and your HOD's guidance. The steps below are a common good-practice method.","ar":"The framework says a risk assessment must be made. It does not tell you what form to use, so follow your school's procedures and your HOD's guidance. The steps below are a common good-practice method."}},{"t":"steps","c":{"en":["\u003cstrong>Look\u003c/strong> at the activity and list the hazards: hot water, sharp objects, electricity, glass, small objects learners could swallow, allergens, slippery floors.","\u003cstrong>Think\u003c/strong> about who could be harmed. The framework says \"any particular class or individual\", so include learners with allergies, asthma, skin conditions, or movement or attention needs.","\u003cstrong>Decide\u003c/strong> how likely and how serious the harm is, and what controls will reduce it (less hot water, safety goggles if the school requires them, trays, adult-only steps, clear groups and roles).","\u003cstrong>Check\u003c/strong> the controls against national, regional and school rules, and ask your HOD or safety lead if you are unsure.","\u003cstrong>Record\u003c/strong> the assessment in the form your school uses, and keep it with the lesson plan.","\u003cstrong>Review\u003c/strong> after the lesson. If something nearly went wrong, change the plan for next time."],"ar":["\u003cstrong>Look\u003c/strong> at the activity and list the hazards: hot water, sharp objects, electricity, glass, small objects learners could swallow, allergens, slippery floors.","\u003cstrong>Think\u003c/strong> about who could be harmed. The framework says \"any particular class or individual\", so include learners with allergies, asthma, skin conditions, or movement or attention needs.","\u003cstrong>Decide\u003c/strong> how likely and how serious the harm is, and what controls will reduce it (less hot water, safety goggles if the school requires them, trays, adult-only steps, clear groups and roles).","\u003cstrong>Check\u003c/strong> the controls against national, regional and school rules, and ask your HOD or safety lead if you are unsure.","\u003cstrong>Record\u003c/strong> the assessment in the form your school uses, and keep it with the lesson plan.","\u003cstrong>Review\u003c/strong> after the lesson. If something nearly went wrong, change the plan for next time."]}},{"t":"p","c":{"en":"Safety is also a learning objective, so you can teach it as science. Learners follow instructions safely (1TWSc.04), identify risks and explain how to stay safe (3TWSp.04, 4TWSp.05), and later describe risks when planning and consider how to minimise them (5TWSp.05, 6TWSp.05). Other objectives link to safety too: 2Pe.01 asks Stage 2 learners to describe how to be safe with electricity and 4Bp.01 asks them to describe how to use medicines safely. A Stage 5 class can write its own risk assessment for a heating activity as part of planning, with your check before the practical begins.","ar":"Safety is also a learning objective, so you can teach it as science. Learners follow instructions safely (1TWSc.04), identify risks and explain how to stay safe (3TWSp.04, 4TWSp.05), and later describe risks when planning and consider how to minimise them (5TWSp.05, 6TWSp.05). Other objectives link to safety too: 2Pe.01 asks Stage 2 learners to describe how to be safe with electricity and 4Bp.01 asks them to describe how to use medicines safely. A Stage 5 class can write its own risk assessment for a heating activity as part of planning, with your check before the practical begins."}},{"t":"table","head":{"en":["Stage","How learners take part in safety (framework objectives)","Example of good practice in class"],"ar":["Stage","How learners take part in safety (framework objectives)","Example of good practice in class"]},"rows":[{"en":["1–2","Follow instructions safely (1TWSc.04, 2TWSc.04)","Learners learn three simple practical rules by heart and use a \"safe hands\" signal"],"ar":["1–2","Follow instructions safely (1TWSc.04, 2TWSc.04)","Learners learn three simple practical rules by heart and use a \"safe hands\" signal"]},{"en":["3–4","Identify risks and explain how to stay safe (3TWSp.04, 4TWSp.05)","Learners spot the hazard in a picture of a practical and say how to reduce it"],"ar":["3–4","Identify risks and explain how to stay safe (3TWSp.04, 4TWSp.05)","Learners spot the hazard in a picture of a practical and say how to reduce it"]},{"en":["5–6","Describe risks when planning and consider how to minimise them (5TWSp.05, 6TWSp.05)","Learners complete a simple risk table in their plan and the teacher checks it"],"ar":["5–6","Describe risks when planning and consider how to minimise them (5TWSp.05, 6TWSp.05)","Learners complete a simple risk table in their plan and the teacher checks it"]}]},{"t":"h","c":{"en":"Animal welfare and the use of animals: what the framework says","ar":"Animal welfare and the use of animals: what the framework says"}},{"t":"p","c":{"en":"The framework says Cambridge \"shares the approach that good animal welfare and good science work together\". Its main points are:","ar":"The framework says Cambridge \"shares the approach that good animal welfare and good science work together\". Its main points are:"}},{"t":"list","c":{"en":["Learners \"should have opportunities to observe animals in their natural environment\", responsibly and not in a way that could cause distress or harm to animals or damage to the environment.","If living animals are brought into school, the teacher must make sure national, regional and school regulations on animal welfare are followed. In all circumstances the teacher responsible must ensure the animals have a suitable environment, a suitable diet, the opportunity to exhibit normal behaviour patterns, and protection from pain, injury, suffering and disease.","There is no requirement for learners to take part in, or observe, animal dissections for Cambridge Primary. The framework says models and diagrams are alternatives to consider.","If you decide to include dissection, animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier. Neither you nor your learners should kill animals for dissection. Fresh material is kept at 5 °C or below until just before use; frozen material is defrosted slowly (at 5 °C) without direct heat; fresh or defrosted material is used within 2 days; preserved material is handled only with gloves in a well-ventilated room.","The responsibility for the welfare of all animals studied remains with the school."],"ar":["Learners \"should have opportunities to observe animals in their natural environment\", responsibly and not in a way that could cause distress or harm to animals or damage to the environment.","If living animals are brought into school, the teacher must make sure national, regional and school regulations on animal welfare are followed. In all circumstances the teacher responsible must ensure the animals have a suitable environment, a suitable diet, the opportunity to exhibit normal behaviour patterns, and protection from pain, injury, suffering and disease.","There is no requirement for learners to take part in, or observe, animal dissections for Cambridge Primary. The framework says models and diagrams are alternatives to consider.","If you decide to include dissection, animal material should come from premises licensed to sell it for human or pet consumption, or from a reputable biological supplier. Neither you nor your learners should kill animals for dissection. Fresh material is kept at 5 °C or below until just before use; frozen material is defrosted slowly (at 5 °C) without direct heat; fresh or defrosted material is used within 2 days; preserved material is handled only with gloves in a well-ventilated room.","The responsibility for the welfare of all animals studied remains with the school."]}},{"t":"p","c":{"en":"Applying it: In primary science, learners most often study animals through observation in the school grounds (for example, the habitats in 2Be.01 and 2Be.02) and through classification (3Bs.02). Good practice: observe small animals briefly, handle them gently or not at all, return them to where you found them, wash hands afterwards, and teach learners to leave habitats as they found them. If a class keeps living animals, check the regulations first and plan who will care for them at weekends and holidays. Because dissection is not required, most primary teachers will choose models, diagrams or videos.","ar":"Applying it: In primary science, learners most often study animals through observation in the school grounds (for example, the habitats in 2Be.01 and 2Be.02) and through classification (3Bs.02). Good practice: observe small animals briefly, handle them gently or not at all, return them to where you found them, wash hands afterwards, and teach learners to leave habitats as they found them. If a class keeps living animals, check the regulations first and plan who will care for them at weekends and holidays. Because dissection is not required, most primary teachers will choose models, diagrams or videos."}},{"t":"h","c":{"en":"Teaching human reproduction: what the framework says","ar":"Teaching human reproduction: what the framework says"}},{"t":"p","c":{"en":"The framework expects schools to have their own sex education policy, \"set within their national legislative framework and drawn up in consultation with parents\". It says these policies will differ because of the diversity of traditions and cultures. For that reason, the focus of Cambridge Primary Science is \u003cstrong>factual\u003c/strong>: changes to the human body, in both males and females, during puberty, and the structure of the human reproductive organs. It \"does not address attitudes and values or personal and social skills\"; each school decides how to deal with those in its wider curriculum.","ar":"The framework expects schools to have their own sex education policy, \"set within their national legislative framework and drawn up in consultation with parents\". It says these policies will differ because of the diversity of traditions and cultures. For that reason, the focus of Cambridge Primary Science is \u003cstrong>factual\u003c/strong>: changes to the human body, in both males and females, during puberty, and the structure of the human reproductive organs. It \"does not address attitudes and values or personal and social skills\"; each school decides how to deal with those in its wider curriculum."}},{"t":"p","c":{"en":"The framework also tells you how the two related objectives are assessed in Cambridge Primary Checkpoint and Stage 6 Progression Tests:","ar":"The framework also tells you how the two related objectives are assessed in Cambridge Primary Checkpoint and Stage 6 Progression Tests:"}},{"t":"table","head":{"en":["Objective","What the framework says about assessment","What this means for you"],"ar":["Objective","What the framework says about assessment","What this means for you"]},"rows":[{"en":["6Bs.03 Name the parts of the human reproductive system","Will not be assessed","Check how your school's policy wants this objective taught. It stays in the framework, but those tests will not assess it"],"ar":["6Bs.03 Name the parts of the human reproductive system","Will not be assessed","Check how your school's policy wants this objective taught. It stays in the framework, but those tests will not assess it"]},{"en":["6Bp.01 Describe the physical changes that take place during puberty in humans","Will be assessed; credit is given to all physical changes of puberty, including those not specifically about the reproductive organs (for example growth spurt, increased body hair, facial hair in men, widening hips in women)","Learners should know the full range of physical changes, not only those linked to the reproductive organs"],"ar":["6Bp.01 Describe the physical changes that take place during puberty in humans","Will be assessed; credit is given to all physical changes of puberty, including those not specifically about the reproductive organs (for example growth spurt, increased body hair, facial hair in men, widening hips in women)","Learners should know the full range of physical changes, not only those linked to the reproductive organs"]}]},{"t":"p","c":{"en":"Version 4.0 (February 2026) updated this guidance on 6Bp.01; version 3.0 (February 2023) first added the assessment information. Always read the current page in the framework.","ar":"Version 4.0 (February 2026) updated this guidance on 6Bp.01; version 3.0 (February 2023) first added the assessment information. Always read the current page in the framework."}},{"t":"callout","k":"tip","title":{"en":"Good practice for Stage 6 teachers","ar":"Good practice for Stage 6 teachers"},"c":{"en":"Before you teach this topic: (1) read the school's policy and ask your HOD or school leadership what is expected, including what parents have been told; (2) use the correct scientific words, in short factual sentences, and agree vocabulary with ESL colleagues; (3) keep to the factual focus that the framework describes, and send questions about values, attitudes or personal matters to the person the school names; (4) plan how learners may ask questions privately. These steps are good practice, not Cambridge requirements.","ar":"Before you teach this topic: (1) read the school's policy and ask your HOD or school leadership what is expected, including what parents have been told; (2) use the correct scientific words, in short factual sentences, and agree vocabulary with ESL colleagues; (3) keep to the factual focus that the framework describes, and send questions about values, attitudes or personal matters to the person the school names; (4) plan how learners may ask questions privately. These steps are good practice, not Cambridge requirements."}},{"t":"scenario","title":{"en":"Scenario: a question beyond the lesson","ar":"Scenario: a question beyond the lesson"},"c":{"en":"During a Stage 6 puberty lesson (6Bp.01), a learner asks a question about relationships and what is \"right\". \u003cstrong>What should the teacher do?\u003c/strong> The framework says its content is factual and does not cover attitudes and values or personal and social skills; each school decides how to address them. The teacher should thank the learner, say plainly that this is a question for another time and another person, and follow the school's policy on who that is (for example a counsellor or the leadership). The teacher should not improvise an answer on values, and should report the matter in line with the school's procedures if there is any concern for the learner.","ar":"During a Stage 6 puberty lesson (6Bp.01), a learner asks a question about relationships and what is \"right\". \u003cstrong>What should the teacher do?\u003c/strong> The framework says its content is factual and does not cover attitudes and values or personal and social skills; each school decides how to address them. The teacher should thank the learner, say plainly that this is a question for another time and another person, and follow the school's policy on who that is (for example a counsellor or the leadership). The teacher should not improvise an answer on values, and should report the matter in line with the school's procedures if there is any concern for the learner."}}],"checks":[{"id":"m4q1","q":{"en":"Whose responsibility does the framework say it is to make a risk assessment before a scientific experiment?","ar":"Whose responsibility does the framework say it is to make a risk assessment before a scientific experiment?"},"opts":[{"en":"Cambridge International Education, which checks every published experiment before it is used","ar":"Cambridge International Education, which checks every published experiment before it is used"},{"en":"The teacher in charge, who must consider the hazards for any particular class or individual","ar":"The teacher in charge, who must consider the hazards for any particular class or individual"},{"en":"The publisher of the endorsed textbook, which tests each activity in advance for safety","ar":"The publisher of the endorsed textbook, which tests each activity in advance for safety"},{"en":"The learners alone, once they have reached Stage 3 and can identify risks in practical work","ar":"The learners alone, once they have reached Stage 3 and can identify risks in practical work"}],"correct":1,"expl":{"en":"The framework makes the teacher in charge responsible for conforming to national, regional and school regulations and for making a risk assessment. It says responsibility for safety of activities remains with the school.","ar":"The framework makes the teacher in charge responsible for conforming to national, regional and school regulations and for making a risk assessment. It says responsibility for safety of activities remains with the school."}},{"id":"m4q2","q":{"en":"Which statement about animal dissection matches the framework?","ar":"Which statement about animal dissection matches the framework?"},"opts":[{"en":"Dissection is required in Stage 6 so that learners can name the parts of the digestive system","ar":"Dissection is required in Stage 6 so that learners can name the parts of the digestive system"},{"en":"Dissection is required only when a school has a laboratory with a licence to keep living animals","ar":"Dissection is required only when a school has a laboratory with a licence to keep living animals"},{"en":"There is no requirement for learners to take part in or observe dissection for Cambridge Primary","ar":"There is no requirement for learners to take part in or observe dissection for Cambridge Primary"},{"en":"Dissection is allowed only if learners kill the animals themselves under close supervision","ar":"Dissection is allowed only if learners kill the animals themselves under close supervision"}],"correct":2,"expl":{"en":"The framework says there is no requirement. It suggests alternatives such as models and diagrams, and says that, if used, material should come from licensed or reputable sources. Neither teachers nor learners should kill animals for dissection.","ar":"The framework says there is no requirement. It suggests alternatives such as models and diagrams, and says that, if used, material should come from licensed or reputable sources. Neither teachers nor learners should kill animals for dissection."}},{"id":"m4q3","q":{"en":"In Cambridge Primary Checkpoint and Stage 6 Progression Tests, what does the framework say about 6Bs.03 and 6Bp.01?","ar":"In Cambridge Primary Checkpoint and Stage 6 Progression Tests, what does the framework say about 6Bs.03 and 6Bp.01?"},"opts":[{"en":"Both will be assessed, but only the changes linked to the reproductive organs gain credit","ar":"Both will be assessed, but only the changes linked to the reproductive organs gain credit"},{"en":"Neither will be assessed, because each school decides whether to teach puberty at all","ar":"Neither will be assessed, because each school decides whether to teach puberty at all"},{"en":"6Bs.03 will be assessed in full; 6Bp.01 will not be assessed because it is a values topic","ar":"6Bs.03 will be assessed in full; 6Bp.01 will not be assessed because it is a values topic"},{"en":"6Bs.03 is not assessed; 6Bp.01 is assessed, with credit for all physical changes","ar":"6Bs.03 is not assessed; 6Bp.01 is assessed, with credit for all physical changes"}],"correct":3,"expl":{"en":"The framework gives this guidance on the human reproduction page. Version 4.0 updated the guidance on 6Bp.01 to include credit for physical changes of puberty that do not specifically relate to the reproductive organs.","ar":"The framework gives this guidance on the human reproduction page. Version 4.0 updated the guidance on 6Bp.01 to include credit for physical changes of puberty that do not specifically relate to the reproductive organs."}}]},{"id":"m5","title":{"en":"Scientific Language and Talk for ESL Learners","ar":"Scientific Language and Talk for ESL Learners"},"minutes":17,"blocks":[{"t":"p","c":{"en":"At PEPS every learner is learning English as a second language, so every science lesson is also a language lesson. The framework does not give a separate language programme for science, but it points to language in several places. The aims of Cambridge Primary include \"effective and confident communication skills, including in English\". The schemes of work include \"a list of subject-specific language that will be useful for your learners\". And many objectives are written as speaking tasks: \"Talk about how science explains how objects they use, or know about, work\" (1SIC.02). This module shows practical ways to build scientific language. The techniques are good practice, not Cambridge requirements.","ar":"At PEPS every learner is learning English as a second language, so every science lesson is also a language lesson. The framework does not give a separate language programme for science, but it points to language in several places. The aims of Cambridge Primary include \"effective and confident communication skills, including in English\". The schemes of work include \"a list of subject-specific language that will be useful for your learners\". And many objectives are written as speaking tasks: \"Talk about how science explains how objects they use, or know about, work\" (1SIC.02). This module shows practical ways to build scientific language. The techniques are good practice, not Cambridge requirements."}},{"t":"h","c":{"en":"Why science language is hard","ar":"Why science language is hard"}},{"t":"list","c":{"en":["\u003cstrong>Everyday words with a science meaning:\u003c/strong> force, power, energy, material, model, solid, cell, conductor. Learners may know the everyday meaning only.","\u003cstrong>Technical words that are new to everyone:\u003c/strong> translucent, vertebrate, solute, condensation, refraction.","\u003cstrong>Language of thinking:\u003c/strong> predict, compare, because, therefore, however, if ... then. These words are needed in almost every enquiry.","\u003cstrong>Similar-looking words:\u003c/strong> reflect and refract, solute and solvent, mass and weight, vertebrate and invertebrate."],"ar":["\u003cstrong>Everyday words with a science meaning:\u003c/strong> force, power, energy, material, model, solid, cell, conductor. Learners may know the everyday meaning only.","\u003cstrong>Technical words that are new to everyone:\u003c/strong> translucent, vertebrate, solute, condensation, refraction.","\u003cstrong>Language of thinking:\u003c/strong> predict, compare, because, therefore, however, if ... then. These words are needed in almost every enquiry.","\u003cstrong>Similar-looking words:\u003c/strong> reflect and refract, solute and solvent, mass and weight, vertebrate and invertebrate."]}},{"t":"p","c":{"en":"Some objectives name exact terms that learners must use. Examples: transparent, translucent and opaque (3Ps.01); repel and attract (3Pe.02); solute, solvent and solution (5Cc.03); water vapour (5Cm.02); reactants and products (6Cc.04). The framework also draws a difference between related words, such as \u003cem>material\u003c/em>, \u003cem>substance\u003c/em> and \u003cem>object\u003c/em>, in its glossary (for example, oxygen is a substance but air is a mixture). Teach these precisely, and use them consistently.","ar":"Some objectives name exact terms that learners must use. Examples: transparent, translucent and opaque (3Ps.01); repel and attract (3Pe.02); solute, solvent and solution (5Cc.03); water vapour (5Cm.02); reactants and products (6Cc.04). The framework also draws a difference between related words, such as \u003cem>material\u003c/em>, \u003cem>substance\u003c/em> and \u003cem>object\u003c/em>, in its glossary (for example, oxygen is a substance but air is a mixture). Teach these precisely, and use them consistently."}},{"t":"h","c":{"en":"A vocabulary routine for every lesson","ar":"A vocabulary routine for every lesson"}},{"t":"steps","c":{"en":["\u003cstrong>Choose\u003c/strong> four to six key words, from the scheme of work's language list or from your own plan. Keep new words to a small number.","\u003cstrong>Show\u003c/strong> the real thing, a picture or a short demonstration, before saying the word.","\u003cstrong>Say\u003c/strong> the word together, then in pairs. Clap the syllables of long words.","\u003cstrong>Use\u003c/strong> the word in a sentence frame, spoken first and written second.","\u003cstrong>Display\u003c/strong> the word, with a picture, on a word wall or in a glossary page in the learners' books.","\u003cstrong>Revisit\u003c/strong> the word later in the unit and in the next unit, to move it into long-term memory."],"ar":["\u003cstrong>Choose\u003c/strong> four to six key words, from the scheme of work's language list or from your own plan. Keep new words to a small number.","\u003cstrong>Show\u003c/strong> the real thing, a picture or a short demonstration, before saying the word.","\u003cstrong>Say\u003c/strong> the word together, then in pairs. Clap the syllables of long words.","\u003cstrong>Use\u003c/strong> the word in a sentence frame, spoken first and written second.","\u003cstrong>Display\u003c/strong> the word, with a picture, on a word wall or in a glossary page in the learners' books.","\u003cstrong>Revisit\u003c/strong> the word later in the unit and in the next unit, to move it into long-term memory."]}},{"t":"h","c":{"en":"Sentence frames for scientific thinking","ar":"Sentence frames for scientific thinking"}},{"t":"p","c":{"en":"Sentence frames give learners the grammar of a scientific idea while they focus on the content. The table links frames to objectives from the framework.","ar":"Sentence frames give learners the grammar of a scientific idea while they focus on the content. The table links frames to objectives from the framework."}},{"t":"table","head":{"en":["Language function","Sentence frame (good practice)","Linked objective"],"ar":["Language function","Sentence frame (good practice)","Linked objective"]},"rows":[{"en":["Predict","I think ___ will happen because ___.","1TWSp.02, 3TWSp.03, 5TWSp.03"],"ar":["Predict","I think ___ will happen because ___.","1TWSp.02, 3TWSp.03, 5TWSp.03"]},{"en":["Describe what happened","First ___. Then ___. At the end ___.","1TWSa.01, 2TWSa.01"],"ar":["Describe what happened","First ___. Then ___. At the end ___.","1TWSa.01, 2TWSa.01"]},{"en":["Compare","___ is ___ than ___, but ___ is the same.","1Bp.04, 2Bs.01"],"ar":["Compare","___ is ___ than ___, but ___ is the same.","1Bp.04, 2Bs.01"]},{"en":["Explain a pattern","The more ___, the ___ the ___.","2TWSa.02, 3TWSa.02"],"ar":["Explain a pattern","The more ___, the ___ the ___.","2TWSa.02, 3TWSa.02"]},{"en":["Conclude","My prediction was / was not correct. The results show that ___.","3TWSa.01, 3TWSa.03"],"ar":["Conclude","My prediction was / was not correct. The results show that ___.","3TWSa.01, 3TWSa.03"]},{"en":["Evaluate and improve","We could improve the test by ___ because ___.","5TWSa.04, 6TWSa.04"],"ar":["Evaluate and improve","We could improve the test by ___ because ___.","5TWSa.04, 6TWSa.04"]}]},{"t":"p","c":{"en":"Good practice: start with a full sentence frame in Stages 1 and 2, give a half-frame in Stages 3 and 4, and give only a sentence starter or a key-word list in Stages 5 and 6, so that the support fades as learners grow in confidence.","ar":"Good practice: start with a full sentence frame in Stages 1 and 2, give a half-frame in Stages 3 and 4, and give only a sentence starter or a key-word list in Stages 5 and 6, so that the support fades as learners grow in confidence."}},{"t":"h","c":{"en":"Diagrams, models and visuals","ar":"Diagrams, models and visuals"}},{"t":"p","c":{"en":"Visuals carry meaning without needing complex English. The framework values diagrams and models: learners should know the difference between a diagram and a picture (2TWSm.03), draw diagrams to represent real situations or scientific ideas (3TWSm.03, 4TWSm.03) and use conventional symbols for circuits (6Pe.01; the appendix lists the electrical symbols learners are expected to recall and use). For ESL learners:","ar":"Visuals carry meaning without needing complex English. The framework values diagrams and models: learners should know the difference between a diagram and a picture (2TWSm.03), draw diagrams to represent real situations or scientific ideas (3TWSm.03, 4TWSm.03) and use conventional symbols for circuits (6Pe.01; the appendix lists the electrical symbols learners are expected to recall and use). For ESL learners:"}},{"t":"list","c":{"en":["Give a \u003cstrong>labelled diagram with a word bank\u003c/strong> and ask learners to match words to parts before asking for sentences.","Use \u003cstrong>photos and real objects\u003c/strong> alongside diagrams, then ask \"What is the same? What is different?\"","Let learners \u003cstrong>draw first, then talk, then write\u003c/strong>. A drawing is evidence of science thinking, not a \"lower\" task.","Use \u003cstrong>tables with sentence starters\u003c/strong> as scaffolds for the first writing task in each unit."],"ar":["Give a \u003cstrong>labelled diagram with a word bank\u003c/strong> and ask learners to match words to parts before asking for sentences.","Use \u003cstrong>photos and real objects\u003c/strong> alongside diagrams, then ask \"What is the same? What is different?\"","Let learners \u003cstrong>draw first, then talk, then write\u003c/strong>. A drawing is evidence of science thinking, not a \"lower\" task.","Use \u003cstrong>tables with sentence starters\u003c/strong> as scaffolds for the first writing task in each unit."]}},{"t":"h","c":{"en":"Talk partners and structured talk","ar":"Talk partners and structured talk"}},{"t":"p","c":{"en":"Structured talk gives every learner many chances to practise speaking, with less pressure than speaking to the whole class. Good practice routines:","ar":"Structured talk gives every learner many chances to practise speaking, with less pressure than speaking to the whole class. Good practice routines:"}},{"t":"list","c":{"en":["\u003cstrong>Think, pair, share:\u003c/strong> one minute to think alone, two minutes to talk to a partner, then a few pairs share with the class.","\u003cstrong>Talk roles in group practical work:\u003c/strong> a materials manager, a recorder, a speaker and a safety checker. Rotate roles so that each learner speaks.","\u003cstrong>Say it before you write it:\u003c/strong> a prediction or conclusion is spoken to a partner first.","\u003cstrong>Learners' other languages:\u003c/strong> allow quick discussion in the first language to sort out an idea, then ask learners to say it in English. This protects the science thinking while English grows."],"ar":["\u003cstrong>Think, pair, share:\u003c/strong> one minute to think alone, two minutes to talk to a partner, then a few pairs share with the class.","\u003cstrong>Talk roles in group practical work:\u003c/strong> a materials manager, a recorder, a speaker and a safety checker. Rotate roles so that each learner speaks.","\u003cstrong>Say it before you write it:\u003c/strong> a prediction or conclusion is spoken to a partner first.","\u003cstrong>Learners' other languages:\u003c/strong> allow quick discussion in the first language to sort out an idea, then ask learners to say it in English. This protects the science thinking while English grows."]}},{"t":"callout","k":"tip","title":{"en":"Separate the science from the English","ar":"Separate the science from the English"},"c":{"en":"When you assess in class, ask yourself: \"Is this learner showing me the science idea, even if the English is not perfect?\" A correct drawing, a pointing gesture, an oral answer or a labelled diagram can all show understanding. Then also give feedback on the language, so that learners improve both. This is good practice; for formal tests, follow the test rules.","ar":"When you assess in class, ask yourself: \"Is this learner showing me the science idea, even if the English is not perfect?\" A correct drawing, a pointing gesture, an oral answer or a labelled diagram can all show understanding. Then also give feedback on the language, so that learners improve both. This is good practice; for formal tests, follow the test rules."}},{"t":"scenario","title":{"en":"Scenario: the right idea, the wrong word","ar":"Scenario: the right idea, the wrong word"},"c":{"en":"In a Stage 3 lesson on 3Ps.01, a learner holds a sheet of tracing paper to the window and says, \"Light comes, but I cannot see the tree clearly. It is half.\" The teacher is looking for the word \"translucent\". \u003cstrong>What should the teacher do?\u003c/strong> Recognise the science: the learner has described a material that lets light through but not a clear image. Then give the word: \"Yes, it lets some light through. We say it is \u003cem>translucent\u003c/em>.\" Write it on the word wall, ask the learner to say the sentence \"The tracing paper is translucent because ___\", and ask a partner to test another material. The idea came first, the word second.","ar":"In a Stage 3 lesson on 3Ps.01, a learner holds a sheet of tracing paper to the window and says, \"Light comes, but I cannot see the tree clearly. It is half.\" The teacher is looking for the word \"translucent\". \u003cstrong>What should the teacher do?\u003c/strong> Recognise the science: the learner has described a material that lets light through but not a clear image. Then give the word: \"Yes, it lets some light through. We say it is \u003cem>translucent\u003c/em>.\" Write it on the word wall, ask the learner to say the sentence \"The tracing paper is translucent because ___\", and ask a partner to test another material. The idea came first, the word second."}},{"t":"p","c":{"en":"Remember that the language of science also supports reading and writing in your English as a Second Language lessons. Talk to your ESL colleagues about shared word lists and routines, so learners meet the same approach in both subjects.","ar":"Remember that the language of science also supports reading and writing in your English as a Second Language lessons. Talk to your ESL colleagues about shared word lists and routines, so learners meet the same approach in both subjects."}}],"checks":[{"id":"m5q1","q":{"en":"Which of these is an example of a term that the framework requires learners to use, rather than a general vocabulary suggestion?","ar":"Which of these is an example of a term that the framework requires learners to use, rather than a general vocabulary suggestion?"},"opts":[{"en":"Solute, solvent and solution in 5Cc.03","ar":"Solute, solvent and solution in 5Cc.03"},{"en":"\"Think, pair, share\" as the name of a talk routine","ar":"\"Think, pair, share\" as the name of a talk routine"},{"en":"\"Sentence frame\" as the name of a writing scaffold","ar":"\"Sentence frame\" as the name of a writing scaffold"},{"en":"\"Word wall\" as the name of a classroom display","ar":"\"Word wall\" as the name of a classroom display"}],"correct":0,"expl":{"en":"5Cc.03 asks learners to use the terms solute, solvent and solution (version 4.0 added this). The other three are good-practice teaching routines, not framework terms.","ar":"5Cc.03 asks learners to use the terms solute, solvent and solution (version 4.0 added this). The other three are good-practice teaching routines, not framework terms."}},{"id":"m5q2","q":{"en":"A Stage 1 learner says, \"I think the ball go fast because it is big.\" Which response best supports both science and language?","ar":"A Stage 1 learner says, \"I think the ball go fast because it is big.\" Which response best supports both science and language?"},"opts":[{"en":"Tell the learner to say nothing until the sentence has no grammar errors at all","ar":"Tell the learner to say nothing until the sentence has no grammar errors at all"},{"en":"Accept the idea, then model: \"I think the ball will go fast because it is big.\"","ar":"Accept the idea, then model: \"I think the ball will go fast because it is big.\""},{"en":"Ask another learner to give the correct prediction and move on to the practical","ar":"Ask another learner to give the correct prediction and move on to the practical"},{"en":"Correct only the grammar and ask for the sentence again without discussing the idea","ar":"Correct only the grammar and ask for the sentence again without discussing the idea"}],"correct":1,"expl":{"en":"The prediction is the science objective (1TWSp.02). Good practice for ESL learners is to value the idea and recast the language in a full, correct sentence without stopping the thinking.","ar":"The prediction is the science objective (1TWSp.02). Good practice for ESL learners is to value the idea and recast the language in a full, correct sentence without stopping the thinking."}},{"id":"m5q3","q":{"en":"Why does the module suggest \"draw first, then talk, then write\" for ESL learners?","ar":"Why does the module suggest \"draw first, then talk, then write\" for ESL learners?"},"opts":[{"en":"Drawing is easier, so it should replace writing in every Stage 5 and Stage 6 lesson","ar":"Drawing is easier, so it should replace writing in every Stage 5 and Stage 6 lesson"},{"en":"The framework says learners must draw a diagram before they are allowed to speak","ar":"The framework says learners must draw a diagram before they are allowed to speak"},{"en":"Drawing shows ideas without complex English, and talk helps prepare the later writing task","ar":"Drawing shows ideas without complex English, and talk helps prepare the later writing task"},{"en":"Drawing takes more time, which keeps the class quiet while the teacher marks books","ar":"Drawing takes more time, which keeps the class quiet while the teacher marks books"}],"correct":2,"expl":{"en":"Visuals carry meaning, and speaking before writing gives learners the words they need. The routine is good practice, not a framework rule, and it does not replace the written work that later objectives require.","ar":"Visuals carry meaning, and speaking before writing gives learners the words they need. The routine is good practice, not a framework rule, and it does not replace the written work that later objectives require."}}]},{"id":"m6","title":{"en":"Assessment: In the Classroom and Beyond","ar":"Assessment: In the Classroom and Beyond"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment answers one question: what do learners know, understand and do now, compared with what the learning objectives expect? The framework says the learning objectives provide \"a reference against which learners' attainment and skills development can be checked\". This module separates what Cambridge says about assessment from what is good classroom practice, and shows how external checks at PEPS fit with your day-to-day teaching.","ar":"Assessment answers one question: what do learners know, understand and do now, compared with what the learning objectives expect? The framework says the learning objectives provide \"a reference against which learners' attainment and skills development can be checked\". This module separates what Cambridge says about assessment from what is good classroom practice, and shows how external checks at PEPS fit with your day-to-day teaching."}},{"t":"h","c":{"en":"What the framework says about assessment","ar":"What the framework says about assessment"}},{"t":"list","c":{"en":["The framework lists \"Cambridge Primary assessments\" under supporting teachers: \u003cstrong>Cambridge Primary Progression Tests\u003c/strong>, \u003cstrong>Cambridge Primary Checkpoint\u003c/strong> and \u003cstrong>Cambridge Insight assessments\u003c/strong>.","\"We provide assessments designed to complement this curriculum framework for Stages 3 to 6.\"","\"The Science in Context strand will not be directly assessed by Cambridge International Education.\"","More information on assessing Cambridge Primary Science is on the School Support Hub. The framework's cover says Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","Reporting: each learning objective code includes \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\" (for example Bs in 5Bs.01).","For Checkpoint and Stage 6 Progression Tests, the framework gives specific guidance on two puberty-related objectives (see Module 4)."],"ar":["The framework lists \"Cambridge Primary assessments\" under supporting teachers: \u003cstrong>Cambridge Primary Progression Tests\u003c/strong>, \u003cstrong>Cambridge Primary Checkpoint\u003c/strong> and \u003cstrong>Cambridge Insight assessments\u003c/strong>.","\"We provide assessments designed to complement this curriculum framework for Stages 3 to 6.\"","\"The Science in Context strand will not be directly assessed by Cambridge International Education.\"","More information on assessing Cambridge Primary Science is on the School Support Hub. The framework's cover says Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","Reporting: each learning objective code includes \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\" (for example Bs in 5Bs.01).","For Checkpoint and Stage 6 Progression Tests, the framework gives specific guidance on two puberty-related objectives (see Module 4)."]}},{"t":"p","c":{"en":"Notice what the framework does \u003cstrong>not\u003c/strong> say. It gives no details of what the Cambridge Insight assessments are or how they work. It does not name any Cambridge test for Stages 1 and 2. It does not say how your school should record, grade or report results. For these, use the School Support Hub and your school's own assessment calendar. Do not assume details that are not in the framework.","ar":"Notice what the framework does \u003cstrong>not\u003c/strong> say. It gives no details of what the Cambridge Insight assessments are or how they work. It does not name any Cambridge test for Stages 1 and 2. It does not say how your school should record, grade or report results. For these, use the School Support Hub and your school's own assessment calendar. Do not assume details that are not in the framework."}},{"t":"h","c":{"en":"The assessment picture at PEPS","ar":"The assessment picture at PEPS"}},{"t":"p","c":{"en":"At PEPS, Year 6 learners sit Cambridge Primary Checkpoint, and GL Progress Tests run in Years 4 and 6. Ask your HOD which GL Progress Test subjects and reports your school uses, and when they take place. The table shows how the different kinds of assessment work together.","ar":"At PEPS, Year 6 learners sit Cambridge Primary Checkpoint, and GL Progress Tests run in Years 4 and 6. Ask your HOD which GL Progress Test subjects and reports your school uses, and when they take place. The table shows how the different kinds of assessment work together."}},{"t":"table","head":{"en":["Kind of assessment","Main purpose","What to remember"],"ar":["Kind of assessment","Main purpose","What to remember"]},"rows":[{"en":["Assessment for learning in lessons (questions, mini-whiteboards, observation, practical checklists)","Find out during the lesson what learners understand, and adjust","Good practice. Frequent, low-stakes and used straight away"],"ar":["Assessment for learning in lessons (questions, mini-whiteboards, observation, practical checklists)","Find out during the lesson what learners understand, and adjust","Good practice. Frequent, low-stakes and used straight away"]},{"en":["End-of-unit checks set by the school","See whether learners secured the unit's objectives","Good practice. Match questions to objective codes and keep a record"],"ar":["End-of-unit checks set by the school","See whether learners secured the unit's objectives","Good practice. Match questions to objective codes and keep a record"]},{"en":["Cambridge Primary Progression Tests","Cambridge assessments named in the framework; designed to complement the framework for Stages 3 to 6","Check the Hub for how and when your school can use them"],"ar":["Cambridge Primary Progression Tests","Cambridge assessments named in the framework; designed to complement the framework for Stages 3 to 6","Check the Hub for how and when your school can use them"]},{"en":["Cambridge Primary Checkpoint","Named in the framework; PEPS Year 6 learners sit it","An external check; it is not a teaching programme, so keep teaching all the objectives"],"ar":["Cambridge Primary Checkpoint","Named in the framework; PEPS Year 6 learners sit it","An external check; it is not a teaching programme, so keep teaching all the objectives"]},{"en":["Cambridge Insight assessments","Named in the framework; no details given there","Check the Hub; do not assume content or purpose"],"ar":["Cambridge Insight assessments","Named in the framework; no details given there","Check the Hub; do not assume content or purpose"]},{"en":["GL Progress Tests (Years 4 and 6)","An external, school-chosen benchmark","Confirm with your school which subjects and reports apply. They are not Cambridge tests"],"ar":["GL Progress Tests (Years 4 and 6)","An external, school-chosen benchmark","Confirm with your school which subjects and reports apply. They are not Cambridge tests"]}]},{"t":"h","c":{"en":"Assessment for learning: practical ideas","ar":"Assessment for learning: practical ideas"}},{"t":"p","c":{"en":"Assessment for learning means using evidence about learners' understanding to decide what to do next. These methods are good practice; they are not in the framework.","ar":"Assessment for learning means using evidence about learners' understanding to decide what to do next. These methods are good practice; they are not in the framework."}},{"t":"list","c":{"en":["\u003cstrong>Start from the objective.\u003c/strong> Turn a code such as 4Cm.01 into a learner-friendly \"I can ...\": \"I can describe how particles are arranged in a solid and a liquid\".","\u003cstrong>Ask better questions.\u003c/strong> \"Why?\" and \"How do you know?\" show reasoning better than \"What is the answer?\". Give thinking time.","\u003cstrong>Use quick checks.\u003c/strong> Mini-whiteboards, thumbs, true/false cards and a one-question exit ticket show you the whole class in a minute.","\u003cstrong>Watch skills.\u003c/strong> Thinking and Working Scientifically skills are best assessed by observing learners at work. A small checklist (for example \"chooses equipment sensibly\", \"records in a table\") is enough.","\u003cstrong>Give feedback that moves learning on.\u003c/strong> One specific comment linked to the objective (\"Your table needs units\") is more useful than \"good work\".","\u003cstrong>Involve learners.\u003c/strong> Peer and self-assessment against success criteria build the reflective habit that the framework describes."],"ar":["\u003cstrong>Start from the objective.\u003c/strong> Turn a code such as 4Cm.01 into a learner-friendly \"I can ...\": \"I can describe how particles are arranged in a solid and a liquid\".","\u003cstrong>Ask better questions.\u003c/strong> \"Why?\" and \"How do you know?\" show reasoning better than \"What is the answer?\". Give thinking time.","\u003cstrong>Use quick checks.\u003c/strong> Mini-whiteboards, thumbs, true/false cards and a one-question exit ticket show you the whole class in a minute.","\u003cstrong>Watch skills.\u003c/strong> Thinking and Working Scientifically skills are best assessed by observing learners at work. A small checklist (for example \"chooses equipment sensibly\", \"records in a table\") is enough.","\u003cstrong>Give feedback that moves learning on.\u003c/strong> One specific comment linked to the objective (\"Your table needs units\") is more useful than \"good work\".","\u003cstrong>Involve learners.\u003c/strong> Peer and self-assessment against success criteria build the reflective habit that the framework describes."]}},{"t":"h","c":{"en":"Reading and using reporting codes","ar":"Reading and using reporting codes"}},{"t":"p","c":{"en":"Every learning objective code has three parts, such as 5Bs.01: the stage (5), the reporting code (Bs) and the number of the objective in the sub-strand for the stage (01). The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. So a test report may show learners' results by sub-strand, and you can match that to your objectives. Here is the key, built from the framework's own sub-strand titles and codes:","ar":"Every learning objective code has three parts, such as 5Bs.01: the stage (5), the reporting code (Bs) and the number of the objective in the sub-strand for the stage (01). The framework says the reporting code appears in the feedback reports for tests and reflects the sub-strand titles. So a test report may show learners' results by sub-strand, and you can match that to your objectives. Here is the key, built from the framework's own sub-strand titles and codes:"}},{"t":"table","head":{"en":["Strand","Reporting codes","Sub-strand titles, in the same order"],"ar":["Strand","Reporting codes","Sub-strand titles, in the same order"]},"rows":[{"en":["Thinking and Working Scientifically","TWSm, TWSp, TWSc, TWSa","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions"],"ar":["Thinking and Working Scientifically","TWSm, TWSp, TWSc, TWSa","Models and representations; Scientific enquiry: purpose and planning; Carrying out scientific enquiry; Scientific enquiry: analysis, evaluation and conclusions"]},{"en":["Biology","Bs, Bp, Be","Structure and function; Life processes; Ecosystems"],"ar":["Biology","Bs, Bp, Be","Structure and function; Life processes; Ecosystems"]},{"en":["Chemistry","Cm, Cp, Cc","Materials and their structure; Properties of materials; Changes to materials"],"ar":["Chemistry","Cm, Cp, Cc","Materials and their structure; Properties of materials; Changes to materials"]},{"en":["Physics","Pf, Ps, Pe","Forces and energy; Light and sound; Electricity and magnetism"],"ar":["Physics","Pf, Ps, Pe","Forces and energy; Light and sound; Electricity and magnetism"]},{"en":["Earth and Space","ESp, ESc, ESs","Planet Earth; Cycles on Earth; Earth in space"],"ar":["Earth and Space","ESp, ESc, ESs","Planet Earth; Cycles on Earth; Earth in space"]},{"en":["Science in Context","SIC","The framework lists no separate sub-strand titles for this strand"],"ar":["Science in Context","SIC","The framework lists no separate sub-strand titles for this strand"]}]},{"t":"p","c":{"en":"\u003cstrong>Worked example:\u003c/strong> a Stage 6 feedback report lists a low result for \u003cem>Pf\u003c/em>. This points you to the Stage 6 Forces and energy objectives, 6Pf.01 to 6Pf.05: mass and weight, gravity, force diagrams, forces on objects, and floating and sinking. The report cannot tell you which one is the problem. You then check class work and questions on those five objectives to find out. Do not report the code letters to parents without explanation; \"Pf\" means nothing to most families, whereas \"forces and energy\" does.","ar":"\u003cstrong>Worked example:\u003c/strong> a Stage 6 feedback report lists a low result for \u003cem>Pf\u003c/em>. This points you to the Stage 6 Forces and energy objectives, 6Pf.01 to 6Pf.05: mass and weight, gravity, force diagrams, forces on objects, and floating and sinking. The report cannot tell you which one is the problem. You then check class work and questions on those five objectives to find out. Do not report the code letters to parents without explanation; \"Pf\" means nothing to most families, whereas \"forces and energy\" does."}},{"t":"callout","k":"warn","title":{"en":"Do not teach to the test","ar":"Do not teach to the test"},"c":{"en":"External tests sample the curriculum; they do not replace it. If you teach only what you expect to be tested, you narrow the curriculum and miss the aim of building curiosity and skills. Teach all the objectives for the stage. Use test results to check, not to plan the whole year. Remember also that Science in Context objectives, and the practical skills that paper tests cannot easily show, still matter in your teaching even though Cambridge will not directly assess Science in Context.","ar":"External tests sample the curriculum; they do not replace it. If you teach only what you expect to be tested, you narrow the curriculum and miss the aim of building curiosity and skills. Teach all the objectives for the stage. Use test results to check, not to plan the whole year. Remember also that Science in Context objectives, and the practical skills that paper tests cannot easily show, still matter in your teaching even though Cambridge will not directly assess Science in Context."}},{"t":"scenario","title":{"en":"Scenario: the Checkpoint worry","ar":"Scenario: the Checkpoint worry"},"c":{"en":"A Year 6 teacher says, \"6Bs.03 will not be assessed in Checkpoint, so I will skip the reproductive system section. And 6Bp.01 only needs height and hair.\" \u003cstrong>Is this right?\u003c/strong> Not entirely. The framework says 6Bs.03 will not be assessed in Checkpoint and Stage 6 Progression Tests, and 6Bp.01 will be assessed with credit for \u003cem>all\u003c/em> physical changes of puberty, including those not related to the reproductive organs. But it is a school decision, within the school's sex education policy, how and whether 6Bs.03 is taught. The teacher should check the policy with leadership first and teach 6Bp.01 fully, using the full range of changes.","ar":"A Year 6 teacher says, \"6Bs.03 will not be assessed in Checkpoint, so I will skip the reproductive system section. And 6Bp.01 only needs height and hair.\" \u003cstrong>Is this right?\u003c/strong> Not entirely. The framework says 6Bs.03 will not be assessed in Checkpoint and Stage 6 Progression Tests, and 6Bp.01 will be assessed with credit for \u003cem>all\u003c/em> physical changes of puberty, including those not related to the reproductive organs. But it is a school decision, within the school's sex education policy, how and whether 6Bs.03 is taught. The teacher should check the policy with leadership first and teach 6Bp.01 fully, using the full range of changes."}}],"checks":[{"id":"m6q1","q":{"en":"The framework says Cambridge provides assessments designed to complement it for which stages?","ar":"The framework says Cambridge provides assessments designed to complement it for which stages?"},"opts":[{"en":"Stages 1 to 6","ar":"Stages 1 to 6"},{"en":"Stages 1 to 3","ar":"Stages 1 to 3"},{"en":"Stages 5 and 6 only","ar":"Stages 5 and 6 only"},{"en":"Stages 3 to 6","ar":"Stages 3 to 6"}],"correct":3,"expl":{"en":"The framework states: \"We provide assessments designed to complement this curriculum framework for Stages 3 to 6.\" It names no Cambridge test for Stages 1 and 2.","ar":"The framework states: \"We provide assessments designed to complement this curriculum framework for Stages 3 to 6.\" It names no Cambridge test for Stages 1 and 2."}},{"id":"m6q2","q":{"en":"A test report shows low results for the reporting code \"Cc\". What should the teacher do first?","ar":"A test report shows low results for the reporting code \"Cc\". What should the teacher do first?"},"opts":[{"en":"Check the Changes to materials objectives for that stage against the class work and questions","ar":"Check the Changes to materials objectives for that stage against the class work and questions"},{"en":"Reteach the whole Chemistry strand from the first objective of the stage onwards","ar":"Reteach the whole Chemistry strand from the first objective of the stage onwards"},{"en":"Tell parents that the whole class is weak in Chemistry and move on to the next unit","ar":"Tell parents that the whole class is weak in Chemistry and move on to the next unit"},{"en":"Ignore it, because reporting codes refer to the Science in Context strand in every stage","ar":"Ignore it, because reporting codes refer to the Science in Context strand in every stage"}],"correct":0,"expl":{"en":"Reporting codes reflect sub-strand titles; Cc is Changes to materials. The report points to an area, so the teacher then checks the relevant objectives and the learners' work to find the exact problem.","ar":"Reporting codes reflect sub-strand titles; Cc is Changes to materials. The report points to an area, so the teacher then checks the relevant objectives and the learners' work to find the exact problem."}},{"id":"m6q3","q":{"en":"According to the framework, which strand will not be directly assessed by Cambridge International Education?","ar":"According to the framework, which strand will not be directly assessed by Cambridge International Education?"},"opts":[{"en":"Thinking and Working Scientifically","ar":"Thinking and Working Scientifically"},{"en":"Science in Context","ar":"Science in Context"},{"en":"Earth and Space","ar":"Earth and Space"},{"en":"Models and representations","ar":"Models and representations"}],"correct":1,"expl":{"en":"The framework says the Science in Context strand will not be directly assessed by Cambridge. The objectives in that strand are still part of the framework and should still be planned.","ar":"The framework says the Science in Context strand will not be directly assessed by Cambridge. The objectives in that strand are still part of the framework and should still be planned."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Collecting assessment evidence is only useful if it changes what you do next. This module shows a simple cycle for turning evidence into action: \u003cstrong>collect, analyse, decide, act, recheck\u003c/strong>. It uses the learning objective codes and sub-strands from the framework so that your analysis is organised in the same way as the curriculum. All the techniques are good practice, not Cambridge requirements.","ar":"Collecting assessment evidence is only useful if it changes what you do next. This module shows a simple cycle for turning evidence into action: \u003cstrong>collect, analyse, decide, act, recheck\u003c/strong>. It uses the learning objective codes and sub-strands from the framework so that your analysis is organised in the same way as the curriculum. All the techniques are good practice, not Cambridge requirements."}},{"t":"h","c":{"en":"Step 1 and 2: collect and analyse by objective and strand","ar":"Step 1 and 2: collect and analyse by objective and strand"}},{"t":"p","c":{"en":"A single total mark hides the picture. Two classes can both score 60% while one is weak in Chemistry and the other in enquiry skills. To see the pattern, tag each question or task with an objective code (the code gives you the stage, the sub-strand and the objective), then group the results by sub-strand or strand.","ar":"A single total mark hides the picture. Two classes can both score 60% while one is weak in Chemistry and the other in enquiry skills. To see the pattern, tag each question or task with an objective code (the code gives you the stage, the sub-strand and the objective), then group the results by sub-strand or strand."}},{"t":"p","c":{"en":"Below is \u003cstrong>practice data, invented for this exercise only. It is not PEPS data.\u003c/strong> A teacher has marked an end-of-unit check for a class of 28 Stage 4 learners and recorded the percentage of marks gained by the class for each sub-strand covered.","ar":"Below is \u003cstrong>practice data, invented for this exercise only. It is not PEPS data.\u003c/strong> A teacher has marked an end-of-unit check for a class of 28 Stage 4 learners and recorded the percentage of marks gained by the class for each sub-strand covered."}},{"t":"table","head":{"en":["Sub-strand (code)","Class % of marks (invented)","First reading"],"ar":["Sub-strand (code)","Class % of marks (invented)","First reading"]},"rows":[{"en":["Structure and function (4Bs)","78%","Secure. Keep up with short retrieval"],"ar":["Structure and function (4Bs)","78%","Secure. Keep up with short retrieval"]},{"en":["Materials and their structure (4Cm)","41%","Weak. The particle model needs reteaching"],"ar":["Materials and their structure (4Cm)","41%","Weak. The particle model needs reteaching"]},{"en":["Changes to materials (4Cc)","52%","Partly secure. Probably linked to 4Cm"],"ar":["Changes to materials (4Cc)","52%","Partly secure. Probably linked to 4Cm"]},{"en":["Scientific enquiry: purpose and planning (4TWSp)","63%","Mixed. Check the variables question"],"ar":["Scientific enquiry: purpose and planning (4TWSp)","63%","Mixed. Check the variables question"]},{"en":["Carrying out scientific enquiry (4TWSc)","80%","Secure"],"ar":["Carrying out scientific enquiry (4TWSc)","80%","Secure"]}]},{"t":"p","c":{"en":"What would you do? Notice that 4Cm and 4Cc are connected: 4Cc.01 asks learners to use the particle model to describe melting and freezing, so weak results in 4Cm.01 may explain the lower 4Cc result. The best first step is therefore to reteach the particle model, not to repeat the melting lesson. Then look more closely at the individual questions on 4TWSp: is the problem identifying variables (4TWSp.04) or predicting (4TWSp.03)?","ar":"What would you do? Notice that 4Cm and 4Cc are connected: 4Cc.01 asks learners to use the particle model to describe melting and freezing, so weak results in 4Cm.01 may explain the lower 4Cc result. The best first step is therefore to reteach the particle model, not to repeat the melting lesson. Then look more closely at the individual questions on 4TWSp: is the problem identifying variables (4TWSp.04) or predicting (4TWSp.03)?"}},{"t":"h","c":{"en":"Step 3: decide who needs what","ar":"Step 3: decide who needs what"}},{"t":"table","head":{"en":["Pattern in the evidence","Likely action (good practice)","Example"],"ar":["Pattern in the evidence","Likely action (good practice)","Example"]},"rows":[{"en":["Most of the class is weak on one objective","Reteach to the whole class in a new way","Use a model with counters to show the particles in a solid, a liquid and a gas"],"ar":["Most of the class is weak on one objective","Reteach to the whole class in a new way","Use a model with counters to show the particles in a solid, a liquid and a gas"]},{"en":["A small group is weak on an objective","Short, focused small-group teaching while others practise","Ten minutes at the start of the lesson with a group, with a mini-whiteboard check"],"ar":["A small group is weak on an objective","Short, focused small-group teaching while others practise","Ten minutes at the start of the lesson with a group, with a mini-whiteboard check"]},{"en":["One learner is weak across many objectives","Look for a cause (language, attendance, a gap in earlier stages) and speak to your HOD or the learning support team","Check the previous stage's objectives to find where the gap began"],"ar":["One learner is weak across many objectives","Look for a cause (language, attendance, a gap in earlier stages) and speak to your HOD or the learning support team","Check the previous stage's objectives to find where the gap began"]},{"en":["A group is already secure","Extend with a deeper task (see Module 8), not simply more of the same","Ask them to critique a model: what does it not show? (4TWSm.01)"],"ar":["A group is already secure","Extend with a deeper task (see Module 8), not simply more of the same","Ask them to critique a model: what does it not show? (4TWSm.01)"]}]},{"t":"h","c":{"en":"Misconceptions","ar":"Misconceptions"}},{"t":"p","c":{"en":"A misconception is an idea that learners hold that does not match the scientific explanation. The framework says the schemes of work include \"common misconceptions\" and the teacher guide supports planning. The examples below are widely reported in science education and are given here as good practice. The learner's idea usually makes sense from everyday experience, so treat it with respect.","ar":"A misconception is an idea that learners hold that does not match the scientific explanation. The framework says the schemes of work include \"common misconceptions\" and the teacher guide supports planning. The examples below are widely reported in science education and are given here as good practice. The learner's idea usually makes sense from everyday experience, so treat it with respect."}},{"t":"table","head":{"en":["Objective","A typical misconception","A probe question","A response"],"ar":["Objective","A typical misconception","A probe question","A response"]},"rows":[{"en":["6Pf.01 mass and weight","Mass and weight are the same thing","An astronaut stands on the Moon. What happens to her mass and to her weight?","Show a forcemeter reading and a balance reading in a simulation or a discussion; use the words \"mass in kg\" and \"weight in N\""],"ar":["6Pf.01 mass and weight","Mass and weight are the same thing","An astronaut stands on the Moon. What happens to her mass and to her weight?","Show a forcemeter reading and a balance reading in a simulation or a discussion; use the words \"mass in kg\" and \"weight in N\""]},{"en":["5ESs.02 tilt and seasons","Summer happens when Earth is closer to the Sun","Why is it winter in one country when it is summer in another?","Use a torch and a tilted globe to show the angle of the light"],"ar":["5ESs.02 tilt and seasons","Summer happens when Earth is closer to the Sun","Why is it winter in one country when it is summer in another?","Use a torch and a tilted globe to show the angle of the light"]},{"en":["3Cc.01 dissolving","The sugar disappears when it dissolves","How could you show that the sugar is still in the water?","Weigh the water and sugar before and after; evaporate a small amount"],"ar":["3Cc.01 dissolving","The sugar disappears when it dissolves","How could you show that the sugar is still in the water?","Weigh the water and sugar before and after; evaporate a small amount"]},{"en":["4Bp.03 plant energy","Plants get their food from the soil","What does a plant need to grow? What does it make?","Revisit what plants get from light, and show that a plant in the dark struggles"],"ar":["4Bp.03 plant energy","Plants get their food from the soil","What does a plant need to grow? What does it make?","Revisit what plants get from light, and show that a plant in the dark struggles"]},{"en":["5Pe.01 magnets","All metals are magnetic","Will a magnet pick up an aluminium can? Test it","Test a range of metals and write a rule from the evidence"],"ar":["5Pe.01 magnets","All metals are magnetic","Will a magnet pick up an aluminium can? Test it","Test a range of metals and write a rule from the evidence"]}]},{"t":"p","c":{"en":"The best response is rarely \"that is wrong\". Ask learners to \u003cstrong>predict\u003c/strong>, \u003cstrong>test\u003c/strong> or \u003cstrong>discuss\u003c/strong> the idea, so the evidence changes their thinking. This also practises the enquiry skills in the framework.","ar":"The best response is rarely \"that is wrong\". Ask learners to \u003cstrong>predict\u003c/strong>, \u003cstrong>test\u003c/strong> or \u003cstrong>discuss\u003c/strong> the idea, so the evidence changes their thinking. This also practises the enquiry skills in the framework."}},{"t":"h","c":{"en":"Step 4: intervention","ar":"Step 4: intervention"}},{"t":"list","c":{"en":["\u003cstrong>Keep it short and specific.\u003c/strong> One objective, one misconception, 10 to 15 minutes.","\u003cstrong>Change the method.\u003c/strong> If the first explanation did not work, use a model, a diagram, a practical or a story, not the same slide again.","\u003cstrong>Check the language.\u003c/strong> A learner may understand the idea but not the question. Try the question with a diagram or a simpler sentence first.","\u003cstrong>Recheck soon.\u003c/strong> Ask a new question on the same objective within a week, and again after a few weeks, to see whether the learning has stuck."],"ar":["\u003cstrong>Keep it short and specific.\u003c/strong> One objective, one misconception, 10 to 15 minutes.","\u003cstrong>Change the method.\u003c/strong> If the first explanation did not work, use a model, a diagram, a practical or a story, not the same slide again.","\u003cstrong>Check the language.\u003c/strong> A learner may understand the idea but not the question. Try the question with a diagram or a simpler sentence first.","\u003cstrong>Recheck soon.\u003c/strong> Ask a new question on the same objective within a week, and again after a few weeks, to see whether the learning has stuck."]}},{"t":"h","c":{"en":"Step 5: track progress without inventing data","ar":"Step 5: track progress without inventing data"}},{"t":"p","c":{"en":"A tracker lists objectives (by code) against learners, with a simple judgement for each, such as \"not yet\", \"developing\" or \"secure\". Use your school's tracker, scale and definitions; do not make up your own if the school provides one. Keep these rules:","ar":"A tracker lists objectives (by code) against learners, with a simple judgement for each, such as \"not yet\", \"developing\" or \"secure\". Use your school's tracker, scale and definitions; do not make up your own if the school provides one. Keep these rules:"}},{"t":"list","c":{"en":["\u003cstrong>Base each judgement on evidence\u003c/strong> from more than one occasion: a quiz, a practical, a conversation.","\u003cstrong>Record only what you have evidence for.\u003c/strong> A blank cell is honest; a guessed entry is not.","\u003cstrong>Compare across sources.\u003c/strong> If a Checkpoint or GL Progress Test result disagrees with your classroom picture, look for the reason rather than deciding that one must be wrong.","\u003cstrong>Beware small numbers.\u003c/strong> A group of five learners is too small for a firm conclusion about a trend."],"ar":["\u003cstrong>Base each judgement on evidence\u003c/strong> from more than one occasion: a quiz, a practical, a conversation.","\u003cstrong>Record only what you have evidence for.\u003c/strong> A blank cell is honest; a guessed entry is not.","\u003cstrong>Compare across sources.\u003c/strong> If a Checkpoint or GL Progress Test result disagrees with your classroom picture, look for the reason rather than deciding that one must be wrong.","\u003cstrong>Beware small numbers.\u003c/strong> A group of five learners is too small for a firm conclusion about a trend."]}},{"t":"scenario","title":{"en":"Scenario: two sources disagree","ar":"Scenario: two sources disagree"},"c":{"en":"A Year 6 teacher records that most learners are \"secure\" on forces objectives. The Checkpoint-style practice paper, however, shows many learners losing marks on 6Pf.01 to 6Pf.05. \u003cstrong>What should the teacher do?\u003c/strong> Do not assume the paper is \"wrong\". Look at the questions: what exactly were learners asked? Compare them with the way the topic was taught. Perhaps learners can do the practical but cannot explain it in writing, or perhaps mass and weight were taught with the word \"weight\" used loosely. Reteach in a new way, check the language of the question, and recheck. Update the tracker only after new evidence.","ar":"A Year 6 teacher records that most learners are \"secure\" on forces objectives. The Checkpoint-style practice paper, however, shows many learners losing marks on 6Pf.01 to 6Pf.05. \u003cstrong>What should the teacher do?\u003c/strong> Do not assume the paper is \"wrong\". Look at the questions: what exactly were learners asked? Compare them with the way the topic was taught. Perhaps learners can do the practical but cannot explain it in writing, or perhaps mass and weight were taught with the word \"weight\" used loosely. Reteach in a new way, check the language of the question, and recheck. Update the tracker only after new evidence."}}],"checks":[{"id":"m7q1","q":{"en":"Why is it better to analyse class results by objective or sub-strand than to look only at the total mark?","ar":"Why is it better to analyse class results by objective or sub-strand than to look only at the total mark?"},"opts":[{"en":"Because Cambridge requires every school to report results by sub-strand each term","ar":"Because Cambridge requires every school to report results by sub-strand each term"},{"en":"Because the total mark is always wrong and individual marks are always right","ar":"Because the total mark is always wrong and individual marks are always right"},{"en":"Because a total can hide a weak area that needs reteaching","ar":"Because a total can hide a weak area that needs reteaching"},{"en":"Because sub-strands have the same number of objectives in every stage of the framework","ar":"Because sub-strands have the same number of objectives in every stage of the framework"}],"correct":2,"expl":{"en":"Two classes with the same total can have very different strengths and weaknesses. Grouping by objective code and sub-strand shows where to act. No Cambridge rule about reporting by term is given in the framework.","ar":"Two classes with the same total can have very different strengths and weaknesses. Grouping by objective code and sub-strand shows where to act. No Cambridge rule about reporting by term is given in the framework."}},{"id":"m7q2","q":{"en":"A learner says, \"The sugar disappeared, so it is gone.\" Which response fits the module's advice and 3Cc.01?","ar":"A learner says, \"The sugar disappeared, so it is gone.\" Which response fits the module's advice and 3Cc.01?"},"opts":[{"en":"Tell the learner that the idea is wrong and give the correct answer to write down in their books","ar":"Tell the learner that the idea is wrong and give the correct answer to write down in their books"},{"en":"Ignore the comment, because dissolving is not taught until Stage 5 in the framework","ar":"Ignore the comment, because dissolving is not taught until Stage 5 in the framework"},{"en":"Move straight on to melting, because it is the same idea as dissolving in the water","ar":"Move straight on to melting, because it is the same idea as dissolving in the water"},{"en":"Ask how the learner could show whether the sugar is still in the water, then test it","ar":"Ask how the learner could show whether the sugar is still in the water, then test it"}],"correct":3,"expl":{"en":"3Cc.01 says that when a solid dissolves in a liquid the solid is still present. Asking the learner to predict and test uses an enquiry approach to change the idea rather than just correcting it.","ar":"3Cc.01 says that when a solid dissolves in a liquid the solid is still present. Asking the learner to predict and test uses an enquiry approach to change the idea rather than just correcting it."}},{"id":"m7q3","q":{"en":"In the practice data, 4Cm (particle model) is weak and 4Cc (changes to materials) is partly secure. What is the best next step?","ar":"In the practice data, 4Cm (particle model) is weak and 4Cc (changes to materials) is partly secure. What is the best next step?"},"opts":[{"en":"Reteach the particle model, because 4Cc.01 depends on it, and then recheck 4Cc","ar":"Reteach the particle model, because 4Cc.01 depends on it, and then recheck 4Cc"},{"en":"Repeat the melting and freezing lessons exactly as before, with more written practice","ar":"Repeat the melting and freezing lessons exactly as before, with more written practice"},{"en":"Move on, since only the sub-strands below 40% need any action from the teacher","ar":"Move on, since only the sub-strands below 40% need any action from the teacher"},{"en":"Give the whole class a new test on 4TWSp, because enquiry skills explain all weak results","ar":"Give the whole class a new test on 4TWSp, because enquiry skills explain all weak results"}],"correct":0,"expl":{"en":"4Cc.01 asks learners to use the particle model to describe melting and freezing. If the model is not secure, repeating melting will not help. The data in this module are invented for practice and are not PEPS data.","ar":"4Cc.01 asks learners to use the particle model to describe melting and freezing. If the model is not secure, repeating melting will not help. The data in this module are invented for practice and are not PEPS data."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A class of 25 to 30 learners is
