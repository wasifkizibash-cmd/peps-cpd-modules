#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

Teaching Time","ar":"From Objectives to Lessons: Planning and Teaching Time"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explains how the Cambridge Primary Science framework is built: its strands, sub-strands and learning objective codes. Part B starts where Part A stops. It asks: how do I get from a list of learning objectives to a good science lesson, and how do I know the lesson worked? By the end of this module you will be able to: describe long-term, medium-term and short-term planning; say what the framework, the teacher guide and the schemes of work each provide (and what is \u003cstrong>not\u003c/strong> compulsory); use the teaching-time guidance sensibly; and sequence a unit so that skills and knowledge build in a logical order. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explains how the Cambridge Primary Science framework is built: its strands, sub-strands and learning objective codes. Part B starts where Part A stops. It asks: how do I get from a list of learning objectives to a good science lesson, and how do I know the lesson worked? By the end of this module you will be able to: describe long-term, medium-term and short-term planning; say what the framework, the teacher guide and the schemes of work each provide (and what is \u003cstrong>not\u003c/strong> compulsory); use the teaching-time guidance sensibly; and sequence a unit so that skills and knowledge build in a logical order. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"The framework is a list of what learners should know, understand and be able to do. It is not a timetable and it is not a set of lesson plans. Two teachers can follow the same learning objectives and teach very different, equally good lessons. Your job is to make the choices in between: what to teach first, which practical work to use, how long to spend, and how to check that learners have learned. Those choices are called planning.","ar":"The framework is a list of what learners should know, understand and be able to do. It is not a timetable and it is not a set of lesson plans. Two teachers can follow the same learning objectives and teach very different, equally good lessons. Your job is to make the choices in between: what to teach first, which practical work to use, how long to spend, and how to check that learners have learned. Those choices are called planning."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The framework says that sub-strands \"help to identify progression and are useful when designing long-term plans, medium-term plans and other teaching resources\". The glossary adds that a scheme of work contains a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. So the framework itself uses the three levels.","ar":"The framework says that sub-strands \"help to identify progression and are useful when designing long-term plans, medium-term plans and other teaching resources\". The glossary adds that a scheme of work contains a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. So the framework itself uses the three levels."}},{"t":"table","head":{"en":["Level","The question it answers","What it usually contains (good practice)","Example"],"ar":["Level","The question it answers","What it usually contains (good practice)","Example"]},"rows":[{"en":["Long-term plan","What will we cover in the whole year, and in what order?","The units for the stage, the order of units, and the approximate time for each","Stage 4: a list of units that together cover every Stage 4 objective across the year"],"ar":["Long-term plan","What will we cover in the whole year, and in what order?","The units for the stage, the order of units, and the approximate time for each","Stage 4: a list of units that together cover every Stage 4 objective across the year"]},{"en":["Medium-term plan","What will happen in this unit, week by week?","The learning objectives for the unit, the planned activities, key vocabulary, the practical work, and planned checks","A five-week unit that includes 4Cm.01, 4Cc.01 and 4Cc.02, plus the enquiry skills that go with them"],"ar":["Medium-term plan","What will happen in this unit, week by week?","The learning objectives for the unit, the planned activities, key vocabulary, the practical work, and planned checks","A five-week unit that includes 4Cm.01, 4Cc.01 and 4Cc.02, plus the enquiry skills that go with them"]},{"en":["Short-term plan (lesson plan)","What will happen in this lesson, minute by minute?","A clear lesson objective, starter, main activity, questions, resources, safety notes, plenary and assessment evidence","One 60-minute lesson on melting, with a risk assessment for the hot-water demonstration"],"ar":["Short-term plan (lesson plan)","What will happen in this lesson, minute by minute?","A clear lesson objective, starter, main activity, questions, resources, safety notes, plenary and assessment evidence","One 60-minute lesson on melting, with a risk assessment for the hot-water demonstration"]}]},{"t":"p","c":{"en":"The columns \"what it usually contains\" and \"example\" are good practice, not Cambridge requirements. Your school may ask for a particular format. Always follow your school's lesson-planning expectations and check with your HOD.","ar":"The columns \"what it usually contains\" and \"example\" are good practice, not Cambridge requirements. Your school may ask for a particular format. Always follow your school's lesson-planning expectations and check with your HOD."}},{"t":"h","c":{"en":"What each Cambridge document gives you","ar":"What each Cambridge document gives you"}},{"t":"list","c":{"en":["\u003cstrong>Curriculum framework:\u003c/strong> the aims, the strands, the learning objectives for each stage, the glossary, the appendix and the changes to each version. The framework says you must read the whole curriculum before planning your teaching programme.","\u003cstrong>Teacher guide:\u003c/strong> in the framework's glossary, \"the document providing support in using the curriculum framework to plan and deliver lessons using effective teaching and learning approaches\".","\u003cstrong>Schemes of work:\u003c/strong> support materials for each stage. According to the framework, each one contains suggested units, at least one suggested teaching activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans.","\u003cstrong>School Support Hub:\u003c/strong> where Cambridge says most resources can be found. Ask the Cambridge coordinator or exams officer in your school if you do not have a log-in."],"ar":["\u003cstrong>Curriculum framework:\u003c/strong> the aims, the strands, the learning objectives for each stage, the glossary, the appendix and the changes to each version. The framework says you must read the whole curriculum before planning your teaching programme.","\u003cstrong>Teacher guide:\u003c/strong> in the framework's glossary, \"the document providing support in using the curriculum framework to plan and deliver lessons using effective teaching and learning approaches\".","\u003cstrong>Schemes of work:\u003c/strong> support materials for each stage. According to the framework, each one contains suggested units, at least one suggested teaching activity for each learning objective, a list of subject-specific language, common misconceptions and sample lesson plans.","\u003cstrong>School Support Hub:\u003c/strong> where Cambridge says most resources can be found. Ask the Cambridge coordinator or exams officer in your school if you do not have a log-in."]}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Science.\" They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all the teaching time for a stage, so you should add other activities of similar difficulty, for example from endorsed resources. Endorsed textbooks are not required to follow the teaching order in the schemes of work. If a resource is endorsed, the framework says all the learning objectives are covered. The objectives themselves are the standard; the scheme is a suggestion.","ar":"The framework is clear: \"You do not need to use the ideas in the schemes of work to teach Cambridge Primary Science.\" They show the types of activities you might use and the intended depth and breadth of each objective. They are not designed to fill all the teaching time for a stage, so you should add other activities of similar difficulty, for example from endorsed resources. Endorsed textbooks are not required to follow the teaching order in the schemes of work. If a resource is endorsed, the framework says all the learning objectives are covered. The objectives themselves are the standard; the scheme is a suggestion."}},{"t":"h","c":{"en":"Teaching-time guidance","ar":"Teaching-time guidance"}},{"t":"p","c":{"en":"The framework gives teaching time \"for guidance\" and says your actual number of teaching hours may vary according to your context. Here is the table exactly as the framework gives it.","ar":"The framework gives teaching time \"for guidance\" and says your actual number of teaching hours may vary according to your context. Here is the table exactly as the framework gives it."}},{"t":"table","head":{"en":["Stages","Suggested total number of hours per stage","Suggested hours of science per week"],"ar":["Stages","Suggested total number of hours per stage","Suggested hours of science per week"]},"rows":[{"en":["1–2","45","1.5"],"ar":["1–2","45","1.5"]},{"en":["3–4","60","2"],"ar":["3–4","60","2"]},{"en":["5–6","75","2.5"],"ar":["5–6","75","2.5"]}]},{"t":"p","c":{"en":"Notice what the table does and does not say. It gives hours, not lessons, and it does not say how many hours each strand or unit should receive. As a worked example from the table's own figures, 45 hours at 1.5 hours a week is 30 weeks, and 60 hours at 2 a week and 75 hours at 2.5 a week also give 30 weeks. Check how many science hours your stage actually has in your timetable (your HOD can confirm), and plan from that real number, not from the suggested one. If your time is shorter, you must prioritise carefully and still cover the objectives; if it is longer, use the extra time for practical work and for returning to difficult ideas.","ar":"Notice what the table does and does not say. It gives hours, not lessons, and it does not say how many hours each strand or unit should receive. As a worked example from the table's own figures, 45 hours at 1.5 hours a week is 30 weeks, and 60 hours at 2 a week and 75 hours at 2.5 a week also give 30 weeks. Check how many science hours your stage actually has in your timetable (your HOD can confirm), and plan from that real number, not from the suggested one. If your time is shorter, you must prioritise carefully and still cover the objectives; if it is longer, use the extra time for practical work and for returning to difficult ideas."}},{"t":"h","c":{"en":"Sequencing units","ar":"Sequencing units"}},{"t":"p","c":{"en":"The framework says the learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\", and that the schemes of work group and order objectives into suggested units. Grouping and ordering are your decisions too. These are good-practice questions to ask when you sequence:","ar":"The framework says the learning objectives in each stage \"provide clear progression from the previous stage and to the subsequent stage\", and that the schemes of work group and order objectives into suggested units. Grouping and ordering are your decisions too. These are good-practice questions to ask when you sequence:"}},{"t":"list","c":{"en":["\u003cstrong>What must come first?\u003c/strong> In Stage 4, 4Cc.01 asks learners to describe freezing and melting \"using the particle model\", so the particle model in 4Cm.01 should be taught before it.","\u003cstrong>Which skills do learners need?\u003c/strong> 5TWSp.04 asks learners to plan fair tests with independent, dependent and control variables. A fair-test unit should come after learners have met the idea of \"changing one thing\" in earlier practical work.","\u003cstrong>Does maths come first?\u003c/strong> The appendix says units used in science should have been taught in mathematics before they are applied in science. Check with your Mathematics colleagues. For science-specific units such as the newton (3Pf.01), give time to introduce them when first taught.","\u003cstrong>Where do the long observations fit?\u003c/strong> Enquiries that take time, such as 5Bp.04 on seed germination or 3ESs.01 on the Moon's changes, need to start early so the results are ready when you need them."],"ar":["\u003cstrong>What must come first?\u003c/strong> In Stage 4, 4Cc.01 asks learners to describe freezing and melting \"using the particle model\", so the particle model in 4Cm.01 should be taught before it.","\u003cstrong>Which skills do learners need?\u003c/strong> 5TWSp.04 asks learners to plan fair tests with independent, dependent and control variables. A fair-test unit should come after learners have met the idea of \"changing one thing\" in earlier practical work.","\u003cstrong>Does maths come first?\u003c/strong> The appendix says units used in science should have been taught in mathematics before they are applied in science. Check with your Mathematics colleagues. For science-specific units such as the newton (3Pf.01), give time to introduce them when first taught.","\u003cstrong>Where do the long observations fit?\u003c/strong> Enquiries that take time, such as 5Bp.04 on seed germination or 3ESs.01 on the Moon's changes, need to start early so the results are ready when you need them."]}},{"t":"steps","c":{"en":["\u003cstrong>List\u003c/strong> all the objectives for the stage by sub-strand, using the framework.","\u003cstrong>Group\u003c/strong> content objectives into units that make sense together (for example Stage 3 light and shadows: 3Ps.01, 3Ps.02, 3Ps.03).","\u003cstrong>Attach\u003c/strong> Thinking and Working Scientifically objectives to units, so that every skill is practised more than once (for example 3TWSp.03 and 3TWSa.03 in the shadow unit).","\u003cstrong>Add\u003c/strong> Science in Context objectives where the content gives a natural link.","\u003cstrong>Estimate\u003c/strong> the hours for each unit and check the total against your real timetable.","\u003cstrong>Check\u003c/strong> the previous stage's objectives to find prior learning you can build on, and the next stage's to see where you are heading."],"ar":["\u003cstrong>List\u003c/strong> all the objectives for the stage by sub-strand, using the framework.","\u003cstrong>Group\u003c/strong> content objectives into units that make sense together (for example Stage 3 light and shadows: 3Ps.01, 3Ps.02, 3Ps.03).","\u003cstrong>Attach\u003c/strong> Thinking and Working Scientifically objectives to units, so that every skill is practised more than once (for example 3TWSp.03 and 3TWSa.03 in the shadow unit).","\u003cstrong>Add\u003c/strong> Science in Context objectives where the content gives a natural link.","\u003cstrong>Estimate\u003c/strong> the hours for each unit and check the total against your real timetable.","\u003cstrong>Check\u003c/strong> the previous stage's objectives to find prior learning you can build on, and the next stage's to see where you are heading."]}},{"t":"scenario","title":{"en":"Scenario: the scheme says 12 activities, the time says 6 lessons","ar":"Scenario: the scheme says 12 activities, the time says 6 lessons"},"c":{"en":"A Stage 3 teacher is planning the shadows unit (3Ps.01 to 3Ps.03). The scheme of work lists several activities for each objective, but the teacher has only six one-hour lessons in the timetable. A colleague says, \"You must do every activity in the scheme, in the order given.\" \u003cstrong>What should the teacher do?\u003c/strong> The teacher should keep the objectives as the fixed point and treat the activities as suggestions. Choose the activities that best help learners reach each objective, make sure the unit includes at least one real investigation of shadow size (3Ps.03) with a prediction and a conclusion, and drop or shorten the rest. The framework says the schemes of work need not be used and are not designed to fill all the teaching time, so using fewer activities, or different ones of similar difficulty, is allowed.","ar":"A Stage 3 teacher is planning the shadows unit (3Ps.01 to 3Ps.03). The scheme of work lists several activities for each objective, but the teacher has only six one-hour lessons in the timetable. A colleague says, \"You must do every activity in the scheme, in the order given.\" \u003cstrong>What should the teacher do?\u003c/strong> The teacher should keep the objectives as the fixed point and treat the activities as suggestions. Choose the activities that best help learners reach each objective, make sure the unit includes at least one real investigation of shadow size (3Ps.03) with a prediction and a conclusion, and drop or shorten the rest. The framework says the schemes of work need not be used and are not designed to fill all the teaching time, so using fewer activities, or different ones of similar difficulty, is allowed."}},{"t":"h","c":{"en":"A worked example: from objectives to one lesson","ar":"A worked example: from objectives to one lesson"}},{"t":"p","c":{"en":"Take 3Pf.04: \"Describe how smooth and rough surfaces can generate different amounts of friction.\" A lesson built on it could pair one content objective with skills objectives:","ar":"Take 3Pf.04: \"Describe how smooth and rough surfaces can generate different amounts of friction.\" A lesson built on it could pair one content objective with skills objectives:"}},{"t":"table","head":{"en":["Code","What it asks (paraphrased)","How it appears in the lesson"],"ar":["Code","What it asks (paraphrased)","How it appears in the lesson"]},"rows":[{"en":["3Pf.04","Describe how smooth and rough surfaces create different friction","The lesson objective: \"I can describe how rough and smooth surfaces change friction.\""],"ar":["3Pf.04","Describe how smooth and rough surfaces create different friction","The lesson objective: \"I can describe how rough and smooth surfaces change friction.\""]},{"en":["3TWSp.03","Predict some possible outcomes of an enquiry","Learners predict which surface will slow a toy car most"],"ar":["3TWSp.03","Predict some possible outcomes of an enquiry","Learners predict which surface will slow a toy car most"]},{"en":["3TWSc.03","Measure in standard units","Learners measure the distance the car travels in centimetres"],"ar":["3TWSc.03","Measure in standard units","Learners measure the distance the car travels in centimetres"]},{"en":["3TWSa.03","Make a conclusion linked to the question","Learners finish \"The rougher the surface, the ...\""],"ar":["3TWSa.03","Make a conclusion linked to the question","Learners finish \"The rougher the surface, the ...\""]}]},{"t":"p","c":{"en":"One lesson, four objectives, each with a clear job. Notice that the learners are not \"doing a practical\" for its own sake: every part of the activity connects to a code that you can later check.","ar":"One lesson, four objectives, each with a clear job. Notice that the learners are not \"doing a practical\" for its own sake: every part of the activity connects to a code that you can later check."}}],"checks":[{"id":"m1q1","q":{"en":"According to the framework's glossary, what does a scheme of work contain?","ar":"According to the framework's glossary, what does a scheme of work contain?"},"opts":[{"en":"A suggested long-term plan, a medium-term plan with suggested activities and sample lesson plans","ar":"A suggested long-term plan, a medium-term plan with suggested activities and sample lesson plans"},{"en":"A set of compulsory lessons that every Cambridge school must teach in the order given","ar":"A set of compulsory lessons that every Cambridge school must teach in the order given"},{"en":"The full list of learning objectives for each stage, with the reporting codes used in test feedback reports","ar":"The full list of learning objectives for each stage, with the reporting codes used in test feedback reports"},{"en":"A bank of Checkpoint questions that teachers use to check each learning objective","ar":"A bank of Checkpoint questions that teachers use to check each learning objective"}],"correct":0,"expl":{"en":"The glossary describes a scheme of work as support material with a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. The framework also says you do not need to use its ideas.","ar":"The glossary describes a scheme of work as support material with a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans. The framework also says you do not need to use its ideas."}},{"id":"m1q2","q":{"en":"The framework suggests 60 hours of science per stage for Stages 3–4. How many hours per week does it suggest, and how should you treat this?","ar":"The framework suggests 60 hours of science per stage for Stages 3–4. How many hours per week does it suggest, and how should you treat this?"},"opts":[{"en":"1.5 hours per week, as a fixed rule that every school must follow exactly","ar":"1.5 hours per week, as a fixed rule that every school must follow exactly"},{"en":"2 hours per week, as guidance that may vary according to your context","ar":"2 hours per week, as guidance that may vary according to your context"},{"en":"2.5 hours per week, as a minimum that schools must not go below at all","ar":"2.5 hours per week, as a minimum that schools must not go below at all"},{"en":"2 hours per week, as a requirement checked during every school visit","ar":"2 hours per week, as a requirement checked during every school visit"}],"correct":1,"expl":{"en":"The table gives 60 hours per stage and 2 hours per week for Stages 3–4. The framework says it is \"for guidance\" and that actual hours may vary according to your context.","ar":"The table gives 60 hours per stage and 2 hours per week for Stages 3–4. The framework says it is \"for guidance\" and that actual hours may vary according to your context."}},{"id":"m1q3","q":{"en":"A teacher plans a unit on melting. Which order follows the sequencing logic in this module?","ar":"A teacher plans a unit on melting. Which order follows the sequencing logic in this module?"},"opts":[{"en":"Teach melting and freezing (4Cc.01) first, then add the particle model at the very end of the year","ar":"Teach melting and freezing (4Cc.01) first, then add the particle model at the very end of the year"},{"en":"Teach only 4Cc.01 and leave 4Cm.01 to the next stage, because both cover the same idea","ar":"Teach only 4Cc.01 and leave 4Cm.01 to the next stage, because both cover the same idea"},{"en":"Teach the particle model (4Cm.01) first, then melting and freezing (4Cc.01) using that model","ar":"Teach the particle model (4Cm.01) first, then melting and freezing (4Cc.01) using that model"},{"en":"Teach the objectives in whatever order they appear in the textbook, whatever the content","ar":"Teach the objectives in whatever order they appear in the textbook, whatever the content"}],"correct":2,"expl":{"en":"4Cc.01 asks learners to use the particle model when describing melting and freezing, so 4Cm.01 should come first. The framework does not give a teaching order, so this is a planning decision based on how the objectives depend on each other.","ar":"4Cc.01 asks learners to use the particle model when describing melting and freezing, so 4Cm.01 should come first. The framework does not give a teaching order, so this is a planning decision based on how the objectives depend on each other."}}]},{"id":"m2","title":{"en":"Teaching Approaches in the Framework","ar":"Teaching Approaches in the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"The framework has a short section called \"Overview of teaching approaches\". It is not a method book, and it does not tell you to teach in one way. Its message is that science is made of three kinds of strand that support each other, that science is a practical subject, and that your school has real flexibility. This module reads that section closely and shows what it looks like in a lesson.","ar":"The framework has a short section called \"Overview of teaching approaches\". It is not a method book, and it does not tell you to teach in one way. Its message is that science is made of three kinds of strand that support each other, that science is a practical subject, and that your school has real flexibility. This module reads that section closely and shows what it looks like in a lesson."}},{"t":"h","c":{"en":"What the framework says","ar":"What the framework says"}},{"t":"list","c":{"en":["The curriculum \"offers great flexibility through its three strand categories approach\": a skills strand (Thinking and Working Scientifically), content strands (Biology, Chemistry, Physics, Earth and Space) and a context strand (Science in Context).","The three types of strand \"are designed to support each other in every stage of learning\". Learners develop the skills while they learn the content, and the content can be taught through contexts supported by Science in Context.","\"Science is a practical subject and teaching of science should include opportunities for learners to observe and carry out practical work.\"","The teacher guide and the schemes of work, on the School Support Hub, give more ideas for how the three categories of strand work together."],"ar":["The curriculum \"offers great flexibility through its three strand categories approach\": a skills strand (Thinking and Working Scientifically), content strands (Biology, Chemistry, Physics, Earth and Space) and a context strand (Science in Context).","The three types of strand \"are designed to support each other in every stage of learning\". Learners develop the skills while they learn the content, and the content can be taught through contexts supported by Science in Context.","\"Science is a practical subject and teaching of science should include opportunities for learners to observe and carry out practical work.\"","The teacher guide and the schemes of work, on the School Support Hub, give more ideas for how the three categories of strand work together."]}},{"t":"p","c":{"en":"Notice the word \"opportunities\". The framework does not say every lesson must be a practical lesson, and it does not say how many practicals a unit needs. It says learners must have real opportunities to observe and to do. Part A explains the strands; here we ask how they work together inside one lesson.","ar":"Notice the word \"opportunities\". The framework does not say every lesson must be a practical lesson, and it does not say how many practicals a unit needs. It says learners must have real opportunities to observe and to do. Part A explains the strands; here we ask how they work together inside one lesson."}},{"t":"h","c":{"en":"Three strands in one lesson","ar":"Three strands in one lesson"}},{"t":"p","c":{"en":"A common mistake is to teach content one week and \"skills\" another week. The framework's design makes that unnecessary. Here is a Stage 2 example, using objectives from the framework.","ar":"A common mistake is to teach content one week and \"skills\" another week. The framework's design makes that unnecessary. Here is a Stage 2 example, using objectives from the framework."}},{"t":"table","head":{"en":["Strand category","Objective used","What learners do in the lesson"],"ar":["Strand category","Objective used","What learners do in the lesson"]},"rows":[{"en":["Content (Chemistry)","2Cp.03: know that materials can be tested to determine their properties","Learners test paper, fabric, plastic and foil to see which keeps a cup of water off the table"],"ar":["Content (Chemistry)","2Cp.03: know that materials can be tested to determine their properties","Learners test paper, fabric, plastic and foil to see which keeps a cup of water off the table"]},{"en":["Skill (Thinking and Working Scientifically)","2TWSp.02: make predictions; 2TWSa.03: present and interpret results using tables and block graphs","Learners predict first, then record results in a simple table and make a block graph"],"ar":["Skill (Thinking and Working Scientifically)","2TWSp.02: make predictions; 2TWSa.03: present and interpret results using tables and block graphs","Learners predict first, then record results in a simple table and make a block graph"]},{"en":["Context (Science in Context)","2SIC.02: talk about how science explains how objects they use, or know about, work","Learners talk about why umbrellas, raincoats and tents are made from the materials they are"],"ar":["Context (Science in Context)","2SIC.02: talk about how science explains how objects they use, or know about, work","Learners talk about why umbrellas, raincoats and tents are made from the materials they are"]}]},{"t":"p","c":{"en":"One activity, three strand categories, all in about an hour. The learners are not doing three different things; they are doing one thing that serves three purposes.","ar":"One activity, three strand categories, all in about an hour. The learners are not doing three different things; they are doing one thing that serves three purposes."}},{"t":"h","c":{"en":"The three core scientific approaches in Thinking and Working Scientifically","ar":"The three core scientific approaches in Thinking and Working Scientifically"}},{"t":"p","c":{"en":"The framework says the skills strand \"covers three core scientific approaches\". The sub-strand titles for Models and representations, Scientific enquiry (purpose and planning; analysis, evaluation and conclusions) and Carrying out scientific enquiry follow them. The table compares how each approach grows from Stage 1 to Stage 6.","ar":"The framework says the skills strand \"covers three core scientific approaches\". The sub-strand titles for Models and representations, Scientific enquiry (purpose and planning; analysis, evaluation and conclusions) and Carrying out scientific enquiry follow them. The table compares how each approach grows from Stage 1 to Stage 6."}},{"t":"table","head":{"en":["Core approach (framework wording)","Early stages","Later stages"],"ar":["Core approach (framework wording)","Early stages","Later stages"]},"rows":[{"en":["Models and representations: help explain ideas that are not visible or are abstract","2TWSm.02: make and use a physical model of a familiar system or idea (Stage 2)","6TWSm.02: use models, including diagrams, to represent and describe scientific phenomena and ideas (Stage 6)"],"ar":["Models and representations: help explain ideas that are not visible or are abstract","2TWSm.02: make and use a physical model of a familiar system or idea (Stage 2)","6TWSm.02: use models, including diagrams, to represent and describe scientific phenomena and ideas (Stage 6)"]},{"en":["Scientific enquiry: purpose, planning, evidence, analysis, evaluation and conclusions","1TWSp.01: ask questions and talk about how to find answers (Stage 1)","6TWSp.01: ask scientific questions and select appropriate scientific enquiries to use (Stage 6)"],"ar":["Scientific enquiry: purpose, planning, evidence, analysis, evaluation and conclusions","1TWSp.01: ask questions and talk about how to find answers (Stage 1)","6TWSp.01: ask scientific questions and select appropriate scientific enquiries to use (Stage 6)"]},{"en":["Practical work: observation, measurement and equipment handling","1TWSc.02: use given equipment appropriately (Stage 1)","6TWSc.03: choose equipment to carry out an investigation and use it appropriately (Stage 6)"],"ar":["Practical work: observation, measurement and equipment handling","1TWSc.02: use given equipment appropriately (Stage 1)","6TWSc.03: choose equipment to carry out an investigation and use it appropriately (Stage 6)"]}]},{"t":"p","c":{"en":"The pattern is a move from support to independence. In Stage 1 learners are given equipment; in Stage 3 they choose from a provided selection (3TWSc.02); in Stages 5 and 6 they choose equipment for an investigation. This matches the framework's aim that learners \"become increasingly independent when questioning and investigating phenomena\". Good practice: when you plan, ask \"What choice can I hand to the learners this time?\"","ar":"The pattern is a move from support to independence. In Stage 1 learners are given equipment; in Stage 3 they choose from a provided selection (3TWSc.02); in Stages 5 and 6 they choose equipment for an investigation. This matches the framework's aim that learners \"become increasingly independent when questioning and investigating phenomena\". Good practice: when you plan, ask \"What choice can I hand to the learners this time?\""}},{"t":"h","c":{"en":"Practical work: more than \"doing an experiment\"","ar":"Practical work: more than \"doing an experiment\""}},{"t":"p","c":{"en":"The framework describes practical work as skills of observation, measurement and equipment handling that support the collection of accurate and reliable data. The glossary separates two terms that teachers often mix up: an \u003cstrong>experiment\u003c/strong> is a specific procedure carried out to support, disprove or validate a prediction, and an \u003cstrong>investigation\u003c/strong> is a method of acquiring knowledge based on a starting question. An investigation often involves experiments, \"but not always\", for example when learners use secondary sources of information to answer a question.","ar":"The framework describes practical work as skills of observation, measurement and equipment handling that support the collection of accurate and reliable data. The glossary separates two terms that teachers often mix up: an \u003cstrong>experiment\u003c/strong> is a specific procedure carried out to support, disprove or validate a prediction, and an \u003cstrong>investigation\u003c/strong> is a method of acquiring knowledge based on a starting question. An investigation often involves experiments, \"but not always\", for example when learners use secondary sources of information to answer a question."}},{"t":"list","c":{"en":["\u003cstrong>Observation:\u003c/strong> looking closely at living things, materials or the Sun's shadow, and recording what is seen.","\u003cstrong>Measurement:\u003c/strong> non-standard units in Stages 1 and 2 (1TWSc.03), standard units from Stage 3 (3TWSc.03).","\u003cstrong>Equipment handling:\u003c/strong> from \"given equipment\" to \"choose equipment\".","\u003cstrong>Secondary sources:\u003c/strong> using books, posters or websites to find an answer (2TWSc.05 onwards) is also a scientific skill, not a lesser one."],"ar":["\u003cstrong>Observation:\u003c/strong> looking closely at living things, materials or the Sun's shadow, and recording what is seen.","\u003cstrong>Measurement:\u003c/strong> non-standard units in Stages 1 and 2 (1TWSc.03), standard units from Stage 3 (3TWSc.03).","\u003cstrong>Equipment handling:\u003c/strong> from \"given equipment\" to \"choose equipment\".","\u003cstrong>Secondary sources:\u003c/strong> using books, posters or websites to find an answer (2TWSc.05 onwards) is also a scientific skill, not a lesser one."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: predict, observe, explain","ar":"Good practice: predict, observe, explain"},"c":{"en":"A well-known classroom routine is \"predict, observe, explain\". Learners write or say a prediction, watch or do the practical, and then explain any difference between what they expected and what happened. It fits objectives such as 1TWSa.01 (describe what happened and if it matched their predictions) very well. This routine is good practice, not a Cambridge requirement.","ar":"A well-known classroom routine is \"predict, observe, explain\". Learners write or say a prediction, watch or do the practical, and then explain any difference between what they expected and what happened. It fits objectives such as 1TWSa.01 (describe what happened and if it matched their predictions) very well. This routine is good practice, not a Cambridge requirement."}},{"t":"h","c":{"en":"Models and diagrams","ar":"Models and diagrams"}},{"t":"p","c":{"en":"Models are central in this framework. The glossary defines a scientific model as \"a representation of objects, systems or processes that helps scientists explain and think about ideas that are abstract or not visible\". Learners meet this early (2TWSm.01 says a model represents an object or idea in a clear way) and later learn that models are not fully representative of reality (4TWSm.01). In class, you can ask: \"What does this model show well? What does it not show?\" A ball-and-stick picture of particles, a paper circuit diagram or a Sun-Earth-Moon model with balls are all models. A diagram is not the same as a picture (2TWSm.03): a picture shows how something looks; a diagram shows the important parts and how they relate, usually with labels.","ar":"Models are central in this framework. The glossary defines a scientific model as \"a representation of objects, systems or processes that helps scientists explain and think about ideas that are abstract or not visible\". Learners meet this early (2TWSm.01 says a model represents an object or idea in a clear way) and later learn that models are not fully representative of reality (4TWSm.01). In class, you can ask: \"What does this model show well? What does it not show?\" A ball-and-stick picture of particles, a paper circuit diagram or a Sun-Earth-Moon model with balls are all models. A diagram is not the same as a picture (2TWSm.03): a picture shows how something looks; a diagram shows the important parts and how they relate, usually with labels."}},{"t":"h","c":{"en":"Science in Context in the classroom","ar":"Science in Context in the classroom"}},{"t":"p","c":{"en":"Science in Context is described as a strand that helps learners study the other strands \"in a context relevant to them\". The framework gives a clear instruction about the stages: in Stages 1 to 3, activities should focus on learners' experiences and surroundings; in Stages 4 to 6, they should draw on broader local contexts or elsewhere in the country and region. Compare two objectives:","ar":"Science in Context is described as a strand that helps learners study the other strands \"in a context relevant to them\". The framework gives a clear instruction about the stages: in Stages 1 to 3, activities should focus on learners' experiences and surroundings; in Stages 4 to 6, they should draw on broader local contexts or elsewhere in the country and region. Compare two objectives:"}},{"t":"table","head":{"en":["Stages","Objective example","What good practice might look like in Sharjah or the UAE"],"ar":["Stages","Objective example","What good practice might look like in Sharjah or the UAE"]},"rows":[{"en":["1–3","1SIC.03: know that everyone uses science and identify people who use science professionally","Learners identify the science used by a nurse, a cook, a builder or a driver they know"],"ar":["1–3","1SIC.03: know that everyone uses science and identify people who use science professionally","Learners identify the science used by a nurse, a cook, a builder or a driver they know"]},{"en":["4–6","5SIC.05: discuss positive and negative environmental effects of science and technology on their local area","Learners discuss one local example from their own area that has both a benefit and a harm, such as desalinated water or air conditioning, and give evidence for each"],"ar":["4–6","5SIC.05: discuss positive and negative environmental effects of science and technology on their local area","Learners discuss one local example from their own area that has both a benefit and a harm, such as desalinated water or air conditioning, and give evidence for each"]}]},{"t":"p","c":{"en":"The third column is a suggestion, not a Cambridge requirement. The framework also says Cambridge will not directly assess Science in Context. That does not make it optional: the strand has its own objectives and codes (for example 4SIC.02) in every stage, and the framework says it is designed to show the relevance of science to your learners and develop their sense that \"science is for me\". Plan for it.","ar":"The third column is a suggestion, not a Cambridge requirement. The framework also says Cambridge will not directly assess Science in Context. That does not make it optional: the strand has its own objectives and codes (for example 4SIC.02) in every stage, and the framework says it is designed to show the relevance of science to your learners and develop their sense that \"science is for me\". Plan for it."}},{"t":"scenario","title":{"en":"Scenario: the teacher who only demonstrates","ar":"Scenario: the teacher who only demonstrates"},"c":{"en":"A Year 5 teacher worries about mess and time, so every practical is a demonstration at the front. Learners watch, then copy the results into their books. The teacher says, \"We are doing practical work.\" \u003cstrong>Is this enough?\u003c/strong> Not quite. A demonstration has a place, for example when equipment is limited or an activity is unsafe for learners. But the framework says teaching should include opportunities for learners \"to observe and carry out practical work\", and objectives such as 5TWSc.03 and 5TWSc.05 need learners to choose equipment and take measurements themselves. A good compromise: keep demonstrations for rare, hazardous or very short steps, and give learners hands-on tasks in pairs, with simple routines for sharing, tidying up and safety.","ar":"A Year 5 teacher worries about mess and time, so every practical is a demonstration at the front. Learners watch, then copy the results into their books. The teacher says, \"We are doing practical work.\" \u003cstrong>Is this enough?\u003c/strong> Not quite. A demonstration has a place, for example when equipment is limited or an activity is unsafe for learners. But the framework says teaching should include opportunities for learners \"to observe and carry out practical work\", and objectives such as 5TWSc.03 and 5TWSc.05 need learners to choose equipment and take measurements themselves. A good compromise: keep demonstrations for rare, hazardous or very short steps, and give learners hands-on tasks in pairs, with simple routines for sharing, tidying up and safety."}}],"checks":[{"id":"m2q1","q":{"en":"Which sentence best describes how the framework says the three strand categories work together?","ar":"Which sentence best describes how the framework says the three strand categories work together?"},"opts":[{"en":"They are taught in separate blocks, with skills in term 1, content in term 2 and context in term 3","ar":"They are taught in separate blocks, with skills in term 1, content in term 2 and context in term 3"},{"en":"Only the content strands are assessed, so the skills and context strands can be taught if time remains","ar":"Only the content strands are assessed, so the skills and context strands can be taught if time remains"},{"en":"The context strand replaces the skills strand when the learners reach Stages 4 to 6 of the programme","ar":"The context strand replaces the skills strand when the learners reach Stages 4 to 6 of the programme"},{"en":"They support each other, so skills grow while content is learned through relevant contexts in each stage","ar":"They support each other, so skills grow while content is learned through relevant contexts in each stage"}],"correct":3,"expl":{"en":"The framework says the three types of strand \"are designed to support each other in every stage of learning\". For example, learners develop skills while they learn content, and content can be taught through contexts supported by Science in Context.","ar":"The framework says the three types of strand \"are designed to support each other in every stage of learning\". For example, learners develop skills while they learn content, and content can be taught through contexts supported by Science in Context."}},{"id":"m2q2","q":{"en":"In the framework, what is the difference between an experiment and an investigation?","ar":"In the framework, what is the difference between an experiment and an investigation?"},"opts":[{"en":"An experiment tests a prediction; an investigation starts from a question and may use secondary sources","ar":"An experiment tests a prediction; an investigation starts from a question and may use secondary sources"},{"en":"An experiment is done by learners in groups; an investigation is always carried out by the teacher alone","ar":"An experiment is done by learners in groups; an investigation is always carried out by the teacher alone"},{"en":"An experiment needs standard units of measurement; an investigation needs only non-standard units","ar":"An experiment needs standard units of measurement; an investigation needs only non-standard units"},{"en":"An experiment is a type of Stage 1 activity; an investigation is a type of Stage 6 activity only","ar":"An experiment is a type of Stage 1 activity; an investigation is a type of Stage 6 activity only"}],"correct":0,"expl":{"en":"The glossary defines an experiment as a specific procedure to support, disprove or validate a prediction, and an investigation as a method of acquiring knowledge based on a starting question. An investigation often involves experiments but not always.","ar":"The glossary defines an experiment as a specific procedure to support, disprove or validate a prediction, and an investigation as a method of acquiring knowledge based on a starting question. An investigation often involves experiments but not always."}},{"id":"m2q3","q":{"en":"For Stages 4 to 6, what does the framework say Science in Context activities should draw on?","ar":"For Stages 4 to 6, what does the framework say Science in Context activities should draw on?"},"opts":[{"en":"Only the learners' own homes, classroom and school surroundings","ar":"Only the learners' own homes, classroom and school surroundings"},{"en":"Broader local contexts or elsewhere in the country and region","ar":"Broader local contexts or elsewhere in the country and region"},{"en":"Global issues alone, with no links made to the local area","ar":"Global issues alone, with no links made to the local area"},{"en":"Historical discoveries made by scientists in other countries","ar":"Historical discoveries made by scientists in other countries"}],"correct":1,"expl":{"en":"The framework says that in Stages 1 to 3 activities should focus on learners' experiences and surroundings, and in Stages 4 to 6 they should draw on broader local contexts or elsewhere in the country and region.","ar":"The framework says that in Stages 1 to 3 activities should focus on learners' experiences and surroundings, and in Stages 4 to 6 they should draw on broader local contexts or elsewhere in the country and region."}}]},{"id":"m3","title":{"en":"Planning and Running Practical Enquiry","ar":"Planning and Running Practical Enquiry"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Practical enquiry is where the framework's skills become visible. The Thinking and Working Scientifically objectives tell you what learners should be able to do at each stage. This module follows the path of one enquiry: choosing the type, asking a question, predicting, planning variables, collecting data, recording and concluding. Where something is good practice and not in the framework, it is labelled.","ar":"Practical enquiry is where the framework's skills become visible. The Thinking and Working Scientifically objectives tell you what learners should be able to do at each stage. This module follows the path of one enquiry: choosing the type, asking a question, predicting, planning variables, collecting data, recording and concluding. Where something is good practice and not in the framework, it is labelled."}},{"t":"h","c":{"en":"The five main types of scientific enquiry","ar":"The five main types of scientific enquiry"}},{"t":"p","c":{"en":"From Stage 3, the framework names five main types of scientific enquiry: \u003cstrong>research, fair testing, observing over time, identifying and classifying, and pattern seeking\u003c/strong> (3TWSp.02 and 4TWSp.02 ask learners to know there are five types; 5TWSp.02 and 6TWSp.02 ask them to know the features of each, and version 4.0 added the list to those two objectives). Stage 5 and 6 learners are also asked to \"select appropriate scientific enquiries to use\" (5TWSp.01, 6TWSp.01). That means learners should see more than one type of enquiry across the year; fair testing is only one of five.","ar":"From Stage 3, the framework names five main types of scientific enquiry: \u003cstrong>research, fair testing, observing over time, identifying and classifying, and pattern seeking\u003c/strong> (3TWSp.02 and 4TWSp.02 ask learners to know there are five types; 5TWSp.02 and 6TWSp.02 ask them to know the features of each, and version 4.0 added the list to those two objectives). Stage 5 and 6 learners are also asked to \"select appropriate scientific enquiries to use\" (5TWSp.01, 6TWSp.01). That means learners should see more than one type of enquiry across the year; fair testing is only one of five."}},{"t":"table","head":{"en":["Type of enquiry","What learners do (good practice description)","A topic where it could fit (good practice suggestion)"],"ar":["Type of enquiry","What learners do (good practice description)","A topic where it could fit (good practice suggestion)"]},"rows":[{"en":["Research","Use secondary sources to find an answer (3TWSc.05 and later)","Stage 4: how do volcanoes form? (4ESp.02)"],"ar":["Research","Use secondary sources to find an answer (3TWSc.05 and later)","Stage 4: how do volcanoes form? (4ESp.02)"]},{"en":["Fair testing","Change one variable, keep others the same, measure the effect","Stage 3: how does the position of the light source change a shadow? (3Ps.03)"],"ar":["Fair testing","Change one variable, keep others the same, measure the effect","Stage 3: how does the position of the light source change a shadow? (3Ps.03)"]},{"en":["Observing over time","Observe and record the same thing at regular intervals","Stage 5: seed germination (5Bp.04); Stage 3: the Moon (3ESs.01)"],"ar":["Observing over time","Observe and record the same thing at regular intervals","Stage 5: seed germination (5Bp.04); Stage 3: the Moon (3ESs.01)"]},{"en":["Identifying and classifying","Sort or name things using features, or use keys (4TWSc.02)","Stage 3: groups of animals (3Bs.02)"],"ar":["Identifying and classifying","Sort or name things using features, or use keys (4TWSc.02)","Stage 3: groups of animals (3Bs.02)"]},{"en":["Pattern seeking","Look for a relationship in data without controlling every variable","Stage 2: do bigger shoes mean a longer jump? or Stage 5: changing the pitch of a sound (5Ps.03)"],"ar":["Pattern seeking","Look for a relationship in data without controlling every variable","Stage 2: do bigger shoes mean a longer jump? or Stage 5: changing the pitch of a sound (5Ps.03)"]}]},{"t":"p","c":{"en":"The framework does not link particular topics to particular enquiry types. The third column is a suggestion to help you plan. Many topics can be studied in more than one way, so choose the type that fits the question.","ar":"The framework does not link particular topics to particular enquiry types. The third column is a suggestion to help you plan. Many topics can be studied in more than one way, so choose the type that fits the question."}},{"t":"h","c":{"en":"Asking a question and making a prediction","ar":"Asking a question and making a prediction"}},{"t":"p","c":{"en":"In Stages 1 and 2, learners \"ask questions about the world around us and talk about how to find answers\" (1TWSp.01, 2TWSp.01). From Stage 3 the question must be one that can be investigated (3TWSp.01). Compare:","ar":"In Stages 1 and 2, learners \"ask questions about the world around us and talk about how to find answers\" (1TWSp.01, 2TWSp.01). From Stage 3 the question must be one that can be investigated (3TWSp.01). Compare:"}},{"t":"table","head":{"en":["A question that is hard to investigate","A question that can be investigated"],"ar":["A question that is hard to investigate","A question that can be investigated"]},"rows":[{"en":["Why do shadows exist?","How does the distance between the torch and the object change the size of the shadow?"],"ar":["Why do shadows exist?","How does the distance between the torch and the object change the size of the shadow?"]},{"en":["Which material is best?","Which of these four materials lets the least heat through in ten minutes?"],"ar":["Which material is best?","Which of these four materials lets the least heat through in ten minutes?"]},{"en":["Do plants like light?","Does a bean seedling grow taller in the light or in a cupboard over seven days?"],"ar":["Do plants like light?","Does a bean seedling grow taller in the light or in a cupboard over seven days?"]}]},{"t":"p","c":{"en":"Predictions also grow. Stage 1 learners \"make predictions about what they think will happen\" (1TWSp.02). Stage 3 learners describe some possible outcomes (3TWSp.03). By Stages 5 and 6 predictions refer to relevant scientific knowledge and understanding (5TWSp.03, 6TWSp.03). Good practice for ESL learners: use the frame \"I think ... will ... because ...\", even in Stage 1, with the \"because\" part optional at first.","ar":"Predictions also grow. Stage 1 learners \"make predictions about what they think will happen\" (1TWSp.02). Stage 3 learners describe some possible outcomes (3TWSp.03). By Stages 5 and 6 predictions refer to relevant scientific knowledge and understanding (5TWSp.03, 6TWSp.03). Good practice for ESL learners: use the frame \"I think ... will ... because ...\", even in Stage 1, with the \"because\" part optional at first."}},{"t":"h","c":{"en":"Variables at primary level","ar":"Variables at primary level"}},{"t":"p","c":{"en":"Variables are things that can change in an investigation. The framework introduces them gradually:","ar":"Variables are things that can change in an investigation. The framework introduces them gradually:"}},{"t":"table","head":{"en":["Stage","What the objective asks","Language the learners need"],"ar":["Stage","What the objective asks","Language the learners need"]},"rows":[{"en":["4 (4TWSp.04)","Identify variables for a fair test and say what needs to be changed, kept the same and measured","\"change\", \"keep the same\", \"measure\""],"ar":["4 (4TWSp.04)","Identify variables for a fair test and say what needs to be changed, kept the same and measured","\"change\", \"keep the same\", \"measure\""]},{"en":["5 and 6 (5TWSp.04, 6TWSp.04)","Plan fair tests, identifying the independent, dependent and control variables","\"independent variable\", \"dependent variable\", \"control variable\""],"ar":["5 and 6 (5TWSp.04, 6TWSp.04)","Plan fair tests, identifying the independent, dependent and control variables","\"independent variable\", \"dependent variable\", \"control variable\""]}]},{"t":"p","c":{"en":"Worked example for Stage 6, using 6Cc.02 (how temperature affects solids dissolving in liquids): \u003cstrong>Question:\u003c/strong> Does the temperature of the water change how fast sugar dissolves? \u003cstrong>Independent variable\u003c/strong> (what we change): water temperature. \u003cstrong>Dependent variable\u003c/strong> (what we measure): time for the sugar to dissolve. \u003cstrong>Control variables\u003c/strong> (what we keep the same): mass of sugar, volume of water, size of the container and the amount of stirring. Note that 6TWSp.05 asks learners to describe risks and how to minimise them: hot water needs a risk assessment (see Module 4).","ar":"Worked example for Stage 6, using 6Cc.02 (how temperature affects solids dissolving in liquids): \u003cstrong>Question:\u003c/strong> Does the temperature of the water change how fast sugar dissolves? \u003cstrong>Independent variable\u003c/strong> (what we change): water temperature. \u003cstrong>Dependent variable\u003c/strong> (what we measure): time for the sugar to dissolve. \u003cstrong>Control variables\u003c/strong> (what we keep the same): mass of sugar, volume of water, size of the container and the amount of stirring. Note that 6TWSp.05 asks learners to describe risks and how to minimise them: hot water needs a risk assessment (see Module 4)."}},{"t":"callout","k":"tip","title":{"en":"Good practice: a variable table","ar":"Good practice: a variable table"},"c":{"en":"A simple three-column table headed \"We change\", \"We measure\" and \"We keep the same\" works well from Stage 4. At Stages 5 and 6, add the formal names above the plain English words so the vocabulary builds on understanding. This is a teaching idea, not a Cambridge requirement.","ar":"A simple three-column table headed \"We change\", \"We measure\" and \"We keep the same\" works well from Stage 4. At Stages 5 and 6, add the formal names above the plain English words so the vocabulary builds on understanding. This is a teaching idea, not a Cambridge requirement."}},{"t":"h","c":{"en":"Measuring, repeating and anomalous results","ar":"Measuring, repeating and anomalous results"}},{"t":"list","c":{"en":["\u003cstrong>Non-standard units\u003c/strong> in Stages 1 and 2 (1TWSc.03, 2TWSc.03), for example hand spans or cubes; then \u003cstrong>standard units\u003c/strong> in Stage 3, with learners describing their advantage (3TWSc.03).","\u003cstrong>Repeating:\u003c/strong> in Stage 4 learners \"know that repeated measurements and/or observations can give more reliable data\" (4TWSc.04; version 4.0 simplified it to \"know that\"). By Stage 5 they decide when repeats are needed (5TWSc.04).","\u003cstrong>Anomalous results:\u003c/strong> from Stage 5, learners describe patterns \"including identifying any anomalous results\" (5TWSa.02). An anomalous result is one that does not fit the pattern. Good practice: do not erase it; mark it, discuss why it may have happened, and repeat if possible."],"ar":["\u003cstrong>Non-standard units\u003c/strong> in Stages 1 and 2 (1TWSc.03, 2TWSc.03), for example hand spans or cubes; then \u003cstrong>standard units\u003c/strong> in Stage 3, with learners describing their advantage (3TWSc.03).","\u003cstrong>Repeating:\u003c/strong> in Stage 4 learners \"know that repeated measurements and/or observations can give more reliable data\" (4TWSc.04; version 4.0 simplified it to \"know that\"). By Stage 5 they decide when repeats are needed (5TWSc.04).","\u003cstrong>Anomalous results:\u003c/strong> from Stage 5, learners describe patterns \"including identifying any anomalous results\" (5TWSa.02). An anomalous result is one that does not fit the pattern. Good practice: do not erase it; mark it, discuss why it may have happened, and repeat if possible."]}},{"t":"h","c":{"en":"Recording and conclusions","ar":"Recording and conclusions"}},{"t":"p","c":{"en":"Recording and presenting results grow steadily across the stages. This table is taken from the objectives listed in the framework.","ar":"Recording and presenting results grow steadily across the stages. This table is taken from the objectives listed in the framework."}},{"t":"table","head":{"en":["Stage","Recording (Carrying out enquiry)","Presenting and interpreting (analysis)"],"ar":["Stage","Recording (Carrying out enquiry)","Presenting and interpreting (analysis)"]},"rows":[{"en":["1","Annotate images and complete simple tables (1TWSc.05)","Describe what happened and whether it matched predictions (1TWSa.01)"],"ar":["1","Annotate images and complete simple tables (1TWSc.05)","Describe what happened and whether it matched predictions (1TWSa.01)"]},{"en":["2","Annotate images and complete simple tables (2TWSc.06)","Tables and block graphs (2TWSa.03); simple patterns (2TWSa.02)"],"ar":["2","Annotate images and complete simple tables (2TWSc.06)","Tables and block graphs (2TWSa.03); simple patterns (2TWSa.02)"]},{"en":["3","Tables and diagrams (3TWSc.06)","Tables and bar charts (3TWSa.04); conclusion linked to the question (3TWSa.03)"],"ar":["3","Tables and diagrams (3TWSc.06)","Tables and bar charts (3TWSa.04); conclusion linked to the question (3TWSa.03)"]},{"en":["4","Tables and diagrams (4TWSc.08)","Tables, bar charts and dot plots (4TWSa.04)"],"ar":["4","Tables and diagrams (4TWSc.08)","Tables, bar charts and dot plots (4TWSa.04)"]},{"en":["5","Tables and diagrams appropriate to the type of enquiry (5TWSc.08)","Adds line graphs (5TWSa.05); conclusion informed by scientific understanding (5TWSa.03); suggest improvements (5TWSa.04)"],"ar":["5","Tables and diagrams appropriate to the type of enquiry (5TWSc.08)","Adds line graphs (5TWSa.05); conclusion informed by scientific understanding (5TWSa.03); suggest improvements (5TWSa.04)"]},{"en":["6","Same as Stage 5 (6TWSc.08)","Adds scatter graphs (6TWSa.05)"],"ar":["6","Same as Stage 5 (6TWSc.08)","Adds scatter graphs (6TWSa.05)"]}]},{"t":"p","c":{"en":"A good conclusion answers the original question and uses the evidence. Stage 3 learners relate the conclusion to the scientific question; Stage 5 and 6 learners use scientific understanding to explain it. Compare: \"The car went far on the smooth floor\" (a result) and \"The smooth floor gave less friction than the carpet, so the car travelled further; this supports our prediction\" (a conclusion).","ar":"A good conclusion answers the original question and uses the evidence. Stage 3 learners relate the conclusion to the scientific question; Stage 5 and 6 learners use scientific understanding to explain it. Compare: \"The car went far on the smooth floor\" (a result) and \"The smooth floor gave less friction than the carpet, so the car travelled further; this supports our prediction\" (a conclusion)."}},{"t":"steps","c":{"en":["\u003cstrong>Plan:\u003c/strong> choose the enquiry type and write a question that can be investigated.","\u003cstrong>Predict:\u003c/strong> every learner records a prediction before starting.","\u003cstrong>Prepare:\u003c/strong> check the risk assessment, equipment and groups; model the safety rules.","\u003cstrong>Do:\u003c/strong> learners carry out the enquiry; you circulate and ask questions.","\u003cstrong>Record:\u003c/strong> learners use the table or diagram format you have taught.","\u003cstrong>Conclude:\u003c/strong> learners answer the question, using their evidence and their prediction.","\u003cstrong>Review:\u003c/strong> ask what went well, what was unreliable and what could be improved."],"ar":["\u003cstrong>Plan:\u003c/strong> choose the enquiry type and write a question that can be investigated.","\u003cstrong>Predict:\u003c/strong> every learner records a prediction before starting.","\u003cstrong>Prepare:\u003c/strong> check the risk assessment, equipment and groups; model the safety rules.","\u003cstrong>Do:\u003c/strong> learners carry out the enquiry; you circulate and ask questions.","\u003cstrong>Record:\u003c/strong> learners use the table or diagram format you have taught.","\u003cstrong>Conclude:\u003c/strong> learners answer the question, using their evidence and their prediction.","\u003cstrong>Review:\u003c/strong> ask what went well, what was unreliable and what could be improved."]}},{"t":"scenario","title":{"en":"Scenario: one group's result is different","ar":"Scenario: one group's result is different"},"c":{"en":"In a Stage 5 investigation on how temperature affects the number of cress seeds that germinate in five days (5Bp.04), four of five groups show the same pattern. Group 3's result does not fit. A learner says, \"Group 3 did it wrong, so we should delete it.\" \u003cstrong>What is a better response?\u003c/strong> Use it. 5TWSa.02 asks learners to describe patterns including any anomalous results, and 5TWSa.04 asks them to suggest improvements. Ask what could have caused the difference (old seeds, a counting error, a different amount of water), whether the test was truly fair, and whether the group can repeat it. The discussion is the science, and it does not make Group 3 \"wrong\".","ar":"In a Stage 5 investigation on how temperature affects the number of cress seeds that germinate in five days (5Bp.04), four of five groups show the same pattern. Group 3's result does not fit. A learner says, \"Group 3 did it wrong, so we should delete it.\" \u003cstrong>What is a better response?\u003c/strong> Use it. 5TWSa.02 asks learners to describe patterns including any anomalous results, and 5TWSa.04 asks them to suggest improvements. Ask what could have caused the difference (old seeds, a counting error, a different amount of water), whether the test was truly fair, and whether the group can repeat it. The discussion is the science, and it does not make Group 3 \"wrong\"."}}],"checks":[{"id":"m3q1","q":{"en":"Which list gives the five main types of scientific enquiry named in the framework?","ar":"Which list gives the five main types of scientific enquiry named in the framework?"},"opts":[{"en":"Research, fair testing, modelling over time, identifying and classifying, and data handling skills in practice","ar":"Research, fair testing, modelling over time, identifying and classifying, and data handling skills in practice"},{"en":"Observation, measurement, fair testing, secondary research and equipment handling","ar":"Observation, measurement, fair testing, secondary research and equipment handling"},{"en":"Research, fair testing, observing over time, identifying and classifying, and pattern seeking","ar":"Research, fair testing, observing over time, identifying and classifying, and pattern seeking"},{"en":"Fair testing, pattern seeking, experimenting, classifying objects and writing conclusions","ar":"Fair testing, pattern seeking, experimenting, classifying objects and writing conclusions"}],"correct":2,"expl":{"en":"3TWSp.02, 4TWSp.02, 5TWSp.02 and 6TWSp.02 name these five types. Version 4.0 added the full list to the Stage 5 and 6 objectives.","ar":"3TWSp.02, 4TWSp.02, 5TWSp.02 and 6TWSp.02 name these five types. Version 4.0 added the full list to the Stage 5 and 6 objectives."}},{"id":"m3q2","q":{"en":"A Stage 6 class plans a fair test on how water temperature affects dissolving. Which of these is the dependent variable?","ar":"A Stage 6 class plans a fair test on how water temperature affects dissolving. Which of these is the dependent variable?"},"opts":[{"en":"The temperature of the water that the teacher gives each group","ar":"The temperature of the water that the teacher gives each group"},{"en":"The mass of sugar added to every container in every test","ar":"The mass of sugar added to every container in every test"},{"en":"The amount of stirring, which each group keeps the same","ar":"The amount of stirring, which each group keeps the same"},{"en":"The time it takes for the sugar to dissolve","ar":"The time it takes for the sugar to dissolve"}],"correct":3,"expl":{"en":"The dependent variable is what is measured. Here the water temperature is changed (independent variable); the mass of sugar and the stirring are controlled. 6TWSp.04 asks Stage 6 learners to identify all three kinds of variable.","ar":"The dependent variable is what is measured. Here the water temperature is changed (independent variable); the mass of sugar and the stirring are controlled. 6TWSp.04 asks Stage 6 learners to identify all three kinds of variable."}},{"id":"m3q3","q":{"en":"At which stage does the framework first ask learners to \"identify variables that need to be taken into account\" in a fair test?","ar":"At which stage does the framework first ask learners to \"identify variables that need to be taken into account\" in a fair test?"},"opts":[{"en":"Stage 4, in 4TWSp.04","ar":"Stage 4, in 4TWSp.04"},{"en":"Stage 2, in 2TWSp.02","ar":"Stage 2, in 2TWSp.02"},{"en":"Stage 3, in 3TWSp.03","ar":"Stage 3, in 3TWSp.03"},{"en":"Stage 6, in 6TWSp.04","ar":"Stage 6, in 6TWSp.04"}],"correct":0,"expl":{"en":"4TWSp.04 asks learners to identify variables and what needs to be changed, kept the same and measured. Stages 5 and 6 then add the terms independent, dependent and control variables.","ar":"4TWSp.04 asks learners to identify variables and what needs to be changed, kept the same and measured. Stages 5 and 6 then add the terms independent, dependent and control variables."}}]},{"id":"m4","title":{"en":"Health and Safety, Animal Welfare and Human Reproduction","ar":"Health and Safety, Animal Welfare and Human Reproduction"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Three short sections of the framework carry serious responsibilities: Health and safety; Animal welfare and the use of animals in science; and Teaching human reproduction. They are short, so it is worth knowing exactly what they say. This module first sets out what the framework says, then shows how to apply it in a primary classroom. Where we add practical suggestions, such as how to write a risk assessment, we label them as good practice.","ar":"Three short sections of the framework carry
