never one level. Some learners need extra support, some need more challenge, and some arrive with different experiences. The framework does not give a separate list of objectives for these groups. It gives one set of objectives for each stage, a clear progression between stages, and a statement that it is typically for learners aged 5 to 11 but \"may be appropriate to use it for slightly different ages to suit your context\". This module looks at how to keep high expectations for everyone, and how to help learners move between phases. The teaching techniques are good practice, not Cambridge requirements.","ar":"A class of 25 to 30 learners is never one level. Some learners need extra support, some need more challenge, and some arrive with different experiences. The framework does not give a separate list of objectives for these groups. It gives one set of objectives for each stage, a clear progression between stages, and a statement that it is typically for learners aged 5 to 11 but \"may be appropriate to use it for slightly different ages to suit your context\". This module looks at how to keep high expectations for everyone, and how to help learners move between phases. The teaching techniques are good practice, not Cambridge requirements."}},{"t":"h","c":{"en":"Students of determination (SEND)","ar":"Students of determination (SEND)"}},{"t":"p","c":{"en":"Your school will have its own procedures for identifying and supporting students of determination, such as support plans or individual education plans, and specialist colleagues. Work with them. In science, the aim is the same objective for the learner, reached by a route that removes barriers. The framework's own safety wording helps here: the risk assessment is for \"any particular class or individual\", so it should include individual needs.","ar":"Your school will have its own procedures for identifying and supporting students of determination, such as support plans or individual education plans, and specialist colleagues. Work with them. In science, the aim is the same objective for the learner, reached by a route that removes barriers. The framework's own safety wording helps here: the risk assessment is for \"any particular class or individual\", so it should include individual needs."}},{"t":"table","head":{"en":["Barrier","Possible adaptation (good practice)","Objective still reached"],"ar":["Barrier","Possible adaptation (good practice)","Objective still reached"]},"rows":[{"en":["Difficulty with fine motor control","Larger or easy-grip equipment; a partner holds the equipment while the learner reads the measurement","3TWSc.03 (measure in standard units)"],"ar":["Difficulty with fine motor control","Larger or easy-grip equipment; a partner holds the equipment while the learner reads the measurement","3TWSc.03 (measure in standard units)"]},{"en":["Difficulty processing long instructions","Picture-and-word step cards; one instruction at a time; check each step before the next","1TWSc.04 (follow instructions safely)"],"ar":["Difficulty processing long instructions","Picture-and-word step cards; one instruction at a time; check each step before the next","1TWSc.04 (follow instructions safely)"]},{"en":["Difficulty with writing","Annotated photographs, pre-printed tables, voice recording, or a scribe","1TWSc.05 and 3TWSc.06 (record in tables and diagrams)"],"ar":["Difficulty with writing","Annotated photographs, pre-printed tables, voice recording, or a scribe","1TWSc.05 and 3TWSc.06 (record in tables and diagrams)"]},{"en":["Anxiety about noise or mess","Quiet roles (recorder, safety checker), a warning before loud sounds, and a clear routine","5Ps.01 (investigate how sounds are made)"],"ar":["Anxiety about noise or mess","Quiet roles (recorder, safety checker), a warning before loud sounds, and a clear routine","5Ps.01 (investigate how sounds are made)"]}]},{"t":"p","c":{"en":"Good practice: never reduce the expectation of understanding without discussion with the specialist colleagues who know the learner. Change the access, not the idea.","ar":"Good practice: never reduce the expectation of understanding without discussion with the specialist colleagues who know the learner. Change the access, not the idea."}},{"t":"h","c":{"en":"Gifted and talented learners","ar":"Gifted and talented learners"}},{"t":"p","c":{"en":"Challenge means deeper thinking, not simply more work or going ahead to the next stage's content. The framework gives you rich ways to deepen within a stage:","ar":"Challenge means deeper thinking, not simply more work or going ahead to the next stage's content. The framework gives you rich ways to deepen within a stage:"}},{"t":"list","c":{"en":["\u003cstrong>Move along the enquiry skills.\u003c/strong> A Stage 4 learner who has secured 4TWSp.04 might be asked to name the independent, dependent and control variables (the Stage 5 and 6 vocabulary).","\u003cstrong>Question models.\u003c/strong> \"What does this model not show?\" links to 4TWSm.01, which says models are not fully representative.","\u003cstrong>Plan the investigation.\u003c/strong> Let the learner choose the equipment and the method, then compare with a peer (5TWSc.03).","\u003cstrong>Connect to context.\u003c/strong> Ask a Stage 5 learner to use science to support a point in a discussion about a local issue (5SIC.03).","\u003cstrong>Evaluate and improve.\u003c/strong> Ask how reliable the results are and what could be changed (5TWSa.04)."],"ar":["\u003cstrong>Move along the enquiry skills.\u003c/strong> A Stage 4 learner who has secured 4TWSp.04 might be asked to name the independent, dependent and control variables (the Stage 5 and 6 vocabulary).","\u003cstrong>Question models.\u003c/strong> \"What does this model not show?\" links to 4TWSm.01, which says models are not fully representative.","\u003cstrong>Plan the investigation.\u003c/strong> Let the learner choose the equipment and the method, then compare with a peer (5TWSc.03).","\u003cstrong>Connect to context.\u003c/strong> Ask a Stage 5 learner to use science to support a point in a discussion about a local issue (5SIC.03).","\u003cstrong>Evaluate and improve.\u003c/strong> Ask how reliable the results are and what could be changed (5TWSa.04)."]}},{"t":"table","head":{"en":["Level","Task on 3Ps.03 (size of a shadow, position of object and light source)"],"ar":["Level","Task on 3Ps.03 (size of a shadow, position of object and light source)"]},"rows":[{"en":["Support","Move the torch and measure the shadow with a ruler; use a table with the distances already written in; complete a sentence frame \"When the torch is closer, the shadow is ___\""],"ar":["Support","Move the torch and measure the shadow with a ruler; use a table with the distances already written in; complete a sentence frame \"When the torch is closer, the shadow is ___\""]},{"en":["Core","Choose three torch distances, predict, measure the shadow height, complete a table and draw a conclusion in a full sentence"],"ar":["Core","Choose three torch distances, predict, measure the shadow height, complete a table and draw a conclusion in a full sentence"]},{"en":["Challenge","Plan the test with a variable table, explain why the test is fair, predict what a graph might show, and suggest one improvement"],"ar":["Challenge","Plan the test with a variable table, explain why the test is fair, predict what a graph might show, and suggest one improvement"]}]},{"t":"p","c":{"en":"The three tasks share one objective. Everyone has access to the same science, and the difference is in the scaffolding and the openness of the thinking.","ar":"The three tasks share one objective. Everyone has access to the same science, and the difference is in the scaffolding and the openness of the thinking."}},{"t":"h","c":{"en":"Learners at slightly different ages or levels","ar":"Learners at slightly different ages or levels"}},{"t":"p","c":{"en":"The framework says it is typically for learners aged 5 to 11 but may suit slightly different ages in your context. It also says the progression of learning objectives across Stages 1 to 6 is available on the School Support Hub, and that to teach effectively \"you need to be familiar with the progression of skills across stages\". Good practice for a mixed-ability class:","ar":"The framework says it is typically for learners aged 5 to 11 but may suit slightly different ages in your context. It also says the progression of learning objectives across Stages 1 to 6 is available on the School Support Hub, and that to teach effectively \"you need to be familiar with the progression of skills across stages\". Good practice for a mixed-ability class:"}},{"t":"list","c":{"en":["Look at the \u003cstrong>previous stage's objectives\u003c/strong> for learners who have gaps. For example, a Stage 3 learner who cannot yet \"describe what happened\" can practise 2TWSa.01.","Look at the \u003cstrong>next stage's objectives\u003c/strong> for ready learners to see where the learning is heading.","Keep the \u003cstrong>whole class in the same lesson\u003c/strong> where possible, with different supports, rather than separate programmes."],"ar":["Look at the \u003cstrong>previous stage's objectives\u003c/strong> for learners who have gaps. For example, a Stage 3 learner who cannot yet \"describe what happened\" can practise 2TWSa.01.","Look at the \u003cstrong>next stage's objectives\u003c/strong> for ready learners to see where the learning is heading.","Keep the \u003cstrong>whole class in the same lesson\u003c/strong> where possible, with different supports, rather than separate programmes."]}},{"t":"h","c":{"en":"Transition: FS2 to Stage 1","ar":"Transition: FS2 to Stage 1"}},{"t":"p","c":{"en":"The framework describes the Cambridge Pathway as leading \"seamlessly from early years, to primary, to secondary\" and says each step builds on the learners' development from the previous one. At PEPS, FS2 comes before Year 1. Stage 1 objectives focus on asking questions, predicting, sorting, using given equipment and recording with images and simple tables (1TWSp.01, 1TWSp.02, 1TWSc.01, 1TWSc.02, 1TWSc.05). Good practice: talk to the FS2 teachers, ask what exploration learners are used to, keep some play-based exploration in the first weeks of Year 1 (water, light and shadow, magnets), and build up the written recording slowly.","ar":"The framework describes the Cambridge Pathway as leading \"seamlessly from early years, to primary, to secondary\" and says each step builds on the learners' development from the previous one. At PEPS, FS2 comes before Year 1. Stage 1 objectives focus on asking questions, predicting, sorting, using given equipment and recording with images and simple tables (1TWSp.01, 1TWSp.02, 1TWSc.01, 1TWSc.02, 1TWSc.05). Good practice: talk to the FS2 teachers, ask what exploration learners are used to, keep some play-based exploration in the first weeks of Year 1 (water, light and shadow, magnets), and build up the written recording slowly."}},{"t":"h","c":{"en":"Transition: Stage 6 to Lower Secondary","ar":"Transition: Stage 6 to Lower Secondary"}},{"t":"p","c":{"en":"At PEPS, Years 7 to 9 follow Cambridge Lower Secondary after Stage 6 (Year 6). Stage 6 objectives such as 6TWSp.04 (plan fair tests with independent, dependent and control variables), 6TWSa.04 (suggest improvements) and 6TWSm.02 (use models, including diagrams) prepare learners for later science. The framework says the objectives are designed so that learners \"first meet foundational scientific concepts, that then develop through the Cambridge Pathway\". Good practice: share information with secondary science teachers about the enquiry skills and vocabulary learners already have, so that Year 7 builds on them and does not repeat them.","ar":"At PEPS, Years 7 to 9 follow Cambridge Lower Secondary after Stage 6 (Year 6). Stage 6 objectives such as 6TWSp.04 (plan fair tests with independent, dependent and control variables), 6TWSa.04 (suggest improvements) and 6TWSm.02 (use models, including diagrams) prepare learners for later science. The framework says the objectives are designed so that learners \"first meet foundational scientific concepts, that then develop through the Cambridge Pathway\". Good practice: share information with secondary science teachers about the enquiry skills and vocabulary learners already have, so that Year 7 builds on them and does not repeat them."}},{"t":"h","c":{"en":"Links with other areas","ar":"Links with other areas"}},{"t":"table","head":{"en":["Area","Link from the framework","Example"],"ar":["Area","Link from the framework","Example"]},"rows":[{"en":["Mathematics","The appendix says units used in science should be taught in mathematics before being applied, by cross-referencing with Cambridge Primary Mathematics or your own Mathematics curriculum. By Stage 6, learners should know the multiples milli, centi and kilo","Agree with the Maths teacher when learners will meet cm, m, ml and l, and when to teach graphs for 3TWSa.04 and 5TWSa.05"],"ar":["Mathematics","The appendix says units used in science should be taught in mathematics before being applied, by cross-referencing with Cambridge Primary Mathematics or your own Mathematics curriculum. By Stage 6, learners should know the multiples milli, centi and kilo","Agree with the Maths teacher when learners will meet cm, m, ml and l, and when to teach graphs for 3TWSa.04 and 5TWSa.05"]},{"en":["English as a Second Language","The aims include communication skills \"including in English\"","Shared word lists and sentence frames (Module 5)"],"ar":["English as a Second Language","The aims include communication skills \"including in English\"","Shared word lists and sentence frames (Module 5)"]},{"en":["Global citizenship and sustainability","The framework mentions sustainability issues and meeting the challenges facing our environment; Science in Context links science to personal, local, national and global contexts","5ESp.03 on pollution; 5SIC.05 on environmental effects of science and technology"],"ar":["Global citizenship and sustainability","The framework mentions sustainability issues and meeting the challenges facing our environment; Science in Context links science to personal, local, national and global contexts","5ESp.03 on pollution; 5SIC.05 on environmental effects of science and technology"]}]},{"t":"scenario","title":{"en":"Scenario: the learner who finishes early","ar":"Scenario: the learner who finishes early"},"c":{"en":"In a Stage 4 lesson on 4Pe.03 (changing components in a series circuit to make a lamp brighter or dimmer), one learner builds three different circuits in ten minutes and says, \"I am finished. What now?\" \u003cstrong>What would be the best response?\u003c/strong> Do not just give more of the same circuits, and do not jump to Stage 6 parallel circuits (6Pe.01) without checking readiness. Ask for a deeper task: \"Can you plan a fair test to compare lamp brightness with one cell, two cells and three cells? What will you change, measure and keep the same? How will you measure brightness?\" (4TWSp.04). Or ask the learner to draw a diagram of the circuit and explain to a partner what a model of the circuit does not show (4TWSm.01).","ar":"In a Stage 4 lesson on 4Pe.03 (changing components in a series circuit to make a lamp brighter or dimmer), one learner builds three different circuits in ten minutes and says, \"I am finished. What now?\" \u003cstrong>What would be the best response?\u003c/strong> Do not just give more of the same circuits, and do not jump to Stage 6 parallel circuits (6Pe.01) without checking readiness. Ask for a deeper task: \"Can you plan a fair test to compare lamp brightness with one cell, two cells and three cells? What will you change, measure and keep the same? How will you measure brightness?\" (4TWSp.04). Or ask the learner to draw a diagram of the circuit and explain to a partner what a model of the circuit does not show (4TWSm.01)."}}],"checks":[{"id":"m8q1","q":{"en":"The framework says the Cambridge Primary Science framework is typically for learners aged 5 to 11. What else does it say about age?","ar":"The framework says the Cambridge Primary Science framework is typically for learners aged 5 to 11. What else does it say about age?"},"opts":[{"en":"It must never be used for learners outside the age range of 5 to 11 years","ar":"It must never be used for learners outside the age range of 5 to 11 years"},{"en":"It may be appropriate to use it for slightly different ages to suit your context","ar":"It may be appropriate to use it for slightly different ages to suit your context"},{"en":"It should be used in full for learners of any age, with no changes in content","ar":"It should be used in full for learners of any age, with no changes in content"},{"en":"It changes its learning objectives automatically when the learner's age is different","ar":"It changes its learning objectives automatically when the learner's age is different"}],"correct":1,"expl":{"en":"The \"Progression through the Cambridge Pathway\" section says exactly this. Use the progression across stages to decide what is right for a particular learner.","ar":"The \"Progression through the Cambridge Pathway\" section says exactly this. Use the progression across stages to decide what is right for a particular learner."}},{"id":"m8q2","q":{"en":"Which adaptation best keeps the same science objective while removing a barrier for a learner who finds writing difficult?","ar":"Which adaptation best keeps the same science objective while removing a barrier for a learner who finds writing difficult?"},"opts":[{"en":"Remove the recording part of the practical for this learner so that the lesson is shorter","ar":"Remove the recording part of the practical for this learner so that the lesson is shorter"},{"en":"Ask the learner to copy a table from the board and take it home to finish later","ar":"Ask the learner to copy a table from the board and take it home to finish later"},{"en":"Let the learner record 1TWSc.05-type results with an annotated photograph and a pre-printed table","ar":"Let the learner record 1TWSc.05-type results with an annotated photograph and a pre-printed table"},{"en":"Give the learner a different objective from an earlier stage without talking to the specialist team","ar":"Give the learner a different objective from an earlier stage without talking to the specialist team"}],"correct":2,"expl":{"en":"1TWSc.05 asks learners to collect and record by annotating images and completing simple tables. The adaptation keeps the objective and changes only how the learner shows it. Always discuss changes with the learner's support team.","ar":"1TWSc.05 asks learners to collect and record by annotating images and completing simple tables. The adaptation keeps the objective and changes only how the learner shows it. Always discuss changes with the learner's support team."}},{"id":"m8q3","q":{"en":"What does the appendix say about units of measurement used in science?","ar":"What does the appendix say about units of measurement used in science?"},"opts":[{"en":"They should be taught for the first time in science so that learners link them to practical work","ar":"They should be taught for the first time in science so that learners link them to practical work"},{"en":"They should be avoided in Stages 1 to 3 because standard units are too difficult for young learners","ar":"They should be avoided in Stages 1 to 3 because standard units are too difficult for young learners"},{"en":"They should be chosen by each learner so that results do not look the same","ar":"They should be chosen by each learner so that results do not look the same"},{"en":"They should have been taught in mathematics before they are applied in science","ar":"They should have been taught in mathematics before they are applied in science"}],"correct":3,"expl":{"en":"The appendix says to cross-reference with Cambridge Primary Mathematics or your own Mathematics curriculum, and that science-specific units such as the newton need time when first taught.","ar":"The appendix says to cross-reference with Cambridge Primary Mathematics or your own Mathematics curriculum, and that science-specific units such as the newton need time when first taught."}}]},{"id":"m9","title":{"en":"Quality and Review: Checklist, Common Mistakes and Your Action Plan","ar":"Quality and Review: Checklist, Common Mistakes and Your Action Plan"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This final module brings the earlier ones together. You will use a checklist to review a lesson, learn the common mistakes that teachers and leaders make, check that you are working with the current framework, and write a short personal action plan. Everything in the checklist is good practice drawn from the framework's text; it is not an official Cambridge or school form. If your school has a lesson-observation or lesson-planning format, use that first.","ar":"This final module brings the earlier ones together. You will use a checklist to review a lesson, learn the common mistakes that teachers and leaders make, check that you are working with the current framework, and write a short personal action plan. Everything in the checklist is good practice drawn from the framework's text; it is not an official Cambridge or school form. If your school has a lesson-observation or lesson-planning format, use that first."}},{"t":"h","c":{"en":"A practical checklist for a curriculum-aligned science lesson","ar":"A practical checklist for a curriculum-aligned science lesson"}},{"t":"table","head":{"en":["Area","Questions to ask","Where it comes from"],"ar":["Area","Questions to ask","Where it comes from"]},"rows":[{"en":["Objectives","Is the lesson based on named objective codes for the right stage? Is the learners' objective clear and in simple language?","Learning objective codes (Part A) and Module 1"],"ar":["Objectives","Is the lesson based on named objective codes for the right stage? Is the learners' objective clear and in simple language?","Learning objective codes (Part A) and Module 1"]},{"en":["Strands together","Does the lesson link content with at least one Thinking and Working Scientifically skill? Is there a natural link to Science in Context?","Overview of teaching approaches (Module 2)"],"ar":["Strands together","Does the lesson link content with at least one Thinking and Working Scientifically skill? Is there a natural link to Science in Context?","Overview of teaching approaches (Module 2)"]},{"en":["Practical opportunity","Do learners observe or do something real, not only watch?","\"Science is a practical subject ...\" (Module 2)"],"ar":["Practical opportunity","Do learners observe or do something real, not only watch?","\"Science is a practical subject ...\" (Module 2)"]},{"en":["Enquiry quality","Is there a question to investigate, a prediction, a fair or suitable method, and a conclusion that links to the question?","Thinking and Working Scientifically (Module 3)"],"ar":["Enquiry quality","Is there a question to investigate, a prediction, a fair or suitable method, and a conclusion that links to the question?","Thinking and Working Scientifically (Module 3)"]},{"en":["Safety","Is there a risk assessment for this class and any individual needs? Are national, regional and school rules followed?","Health and safety section (Module 4)"],"ar":["Safety","Is there a risk assessment for this class and any individual needs? Are national, regional and school rules followed?","Health and safety section (Module 4)"]},{"en":["Language","Are key words and sentence frames planned? Do learners talk before they write?","Aims and schemes of work language lists (Module 5)"],"ar":["Language","Are key words and sentence frames planned? Do learners talk before they write?","Aims and schemes of work language lists (Module 5)"]},{"en":["Assessment","Will you see evidence of learning against the objective during the lesson? How will you use it?","Assessment (Modules 6 and 7)"],"ar":["Assessment","Will you see evidence of learning against the objective during the lesson? How will you use it?","Assessment (Modules 6 and 7)"]},{"en":["Inclusion and challenge","Do all learners have access? Is there a deeper task for those who need it?","Progression and slightly different ages (Module 8)"],"ar":["Inclusion and challenge","Do all learners have access? Is there a deeper task for those who need it?","Progression and slightly different ages (Module 8)"]},{"en":["Accuracy and time","Is the science correct? Does the lesson fit the real time you have, not the suggested time?","Teaching time guidance (Module 1)"],"ar":["Accuracy and time","Is the science correct? Does the lesson fit the real time you have, not the suggested time?","Teaching time guidance (Module 1)"]}]},{"t":"h","c":{"en":"Common mistakes and how to avoid them","ar":"Common mistakes and how to avoid them"}},{"t":"table","head":{"en":["Mistake","Why it is a problem","Better practice"],"ar":["Mistake","Why it is a problem","Better practice"]},"rows":[{"en":["Treating the scheme of work as compulsory","The framework says you do not need to use the scheme of work ideas, and the activities do not fill all the teaching time","Plan from the objectives and use the scheme as a source of ideas"],"ar":["Treating the scheme of work as compulsory","The framework says you do not need to use the scheme of work ideas, and the activities do not fill all the teaching time","Plan from the objectives and use the scheme as a source of ideas"]},{"en":["Only demonstrating practical work","Learners do not build observation, measurement or equipment skills","Give hands-on tasks with clear safety routines"],"ar":["Only demonstrating practical work","Learners do not build observation, measurement or equipment skills","Give hands-on tasks with clear safety routines"]},{"en":["Teaching \"fair testing\" as the only way to do science","The framework names five types of enquiry","Plan different types across the year"],"ar":["Teaching \"fair testing\" as the only way to do science","The framework names five types of enquiry","Plan different types across the year"]},{"en":["Assuming a published experiment is safe","The framework says responsibility for safety remains with the school","Complete your own risk assessment every time"],"ar":["Assuming a published experiment is safe","The framework says responsibility for safety remains with the school","Complete your own risk assessment every time"]},{"en":["Skipping Science in Context because it is not directly assessed","It has its own objectives and shows learners that \"science is for me\"","Link it to content from the first lesson of the unit"],"ar":["Skipping Science in Context because it is not directly assessed","It has its own objectives and shows learners that \"science is for me\"","Link it to content from the first lesson of the unit"]},{"en":["Teaching only what the tests assess","External tests sample the curriculum","Teach every objective for the stage"],"ar":["Teaching only what the tests assess","External tests sample the curriculum","Teach every objective for the stage"]},{"en":["Marking English errors as science errors","ESL learners may understand the science but lack the words","Assess the idea first and the language second"],"ar":["Marking English errors as science errors","ESL learners may understand the science but lack the words","Assess the idea first and the language second"]},{"en":["Using an old version of the framework","Objectives and assessment guidance change","Check the version number and the \"Changes\" section"],"ar":["Using an old version of the framework","Objectives and assessment guidance change","Check the version number and the \"Changes\" section"]}]},{"t":"h","c":{"en":"Check you are using the current version","ar":"Check you are using the current version"}},{"t":"p","c":{"en":"This CPD is based on version 4.0 of the framework (latest version published February 2026). The framework tells you to read the whole curriculum before planning your teaching programme and says that it reviews its frameworks regularly. Version 4.0 changed several objectives to make them clearer. Some of those that affect enquiry and practical work are:","ar":"This CPD is based on version 4.0 of the framework (latest version published February 2026). The framework tells you to read the whole curriculum before planning your teaching programme and says that it reviews its frameworks regularly. Version 4.0 changed several objectives to make them clearer. Some of those that affect enquiry and practical work are:"}},{"t":"table","head":{"en":["Objective or guidance","What the framework says changed in version 4.0"],"ar":["Objective or guidance","What the framework says changed in version 4.0"]},"rows":[{"en":["4TWSp.04","Now says learners identify which variables are changed, kept the same and measured"],"ar":["4TWSp.04","Now says learners identify which variables are changed, kept the same and measured"]},{"en":["4TWSc.04","Simplified: learners \"know that\" repeated measurements can give more reliable data"],"ar":["4TWSc.04","Simplified: learners \"know that\" repeated measurements can give more reliable data"]},{"en":["5TWSp.02 and 6TWSp.02","Now list the five main types of scientific enquiry"],"ar":["5TWSp.02 and 6TWSp.02","Now list the five main types of scientific enquiry"]},{"en":["3Pf.01","Now includes the newton (N) as the standard unit of force"],"ar":["3Pf.01","Now includes the newton (N) as the standard unit of force"]},{"en":["6Bp.01 assessment guidance","The guidance on how it is assessed in Checkpoint and Stage 6 Progression Tests was updated"],"ar":["6Bp.01 assessment guidance","The guidance on how it is assessed in Checkpoint and Stage 6 Progression Tests was updated"]}]},{"t":"p","c":{"en":"The framework also says there may be other minor changes that do not affect teaching and learning. When you plan a new unit, check the version of any resource, including old plans, against the current framework.","ar":"The framework also says there may be other minor changes that do not affect teaching and learning. When you plan a new unit, check the version of any resource, including old plans, against the current framework."}},{"t":"scenario","title":{"en":"Scenario: reviewing a lesson plan","ar":"Scenario: reviewing a lesson plan"},"c":{"en":"A colleague shows you a Stage 5 lesson plan. The objective is 5Cc.03 (investigate dissolving, using the terms solute, solvent and solution). The plan has a teacher demonstration, a worksheet copied from an old scheme of work, no prediction, no risk assessment for the hot water, and no planned vocabulary. \u003cstrong>What would you say?\u003c/strong> Use the checklist. Praise the clear objective. Then ask: where do learners observe or do something real? Where is the prediction (5TWSp.03)? Where is the variable table (5TWSp.04)? Has the risk assessment been done (5TWSp.05)? How will the three key terms be taught and practised? Is the old worksheet from the current version? The review is about the lesson, kindly and specifically, and ends with one or two next steps.","ar":"A colleague shows you a Stage 5 lesson plan. The objective is 5Cc.03 (investigate dissolving, using the terms solute, solvent and solution). The plan has a teacher demonstration, a worksheet copied from an old scheme of work, no prediction, no risk assessment for the hot water, and no planned vocabulary. \u003cstrong>What would you say?\u003c/strong> Use the checklist. Praise the clear objective. Then ask: where do learners observe or do something real? Where is the prediction (5TWSp.03)? Where is the variable table (5TWSp.04)? Has the risk assessment been done (5TWSp.05)? How will the three key terms be taught and practised? Is the old worksheet from the current version? The review is about the lesson, kindly and specifically, and ends with one or two next steps."}},{"t":"h","c":{"en":"Your personal action plan","ar":"Your personal action plan"}},{"t":"p","c":{"en":"Choose a small number of actions that you can do within one term. Use this simple structure.","ar":"Choose a small number of actions that you can do within one term. Use this simple structure."}},{"t":"steps","c":{"en":["\u003cstrong>Look back.\u003c/strong> Which module gave you the most new ideas? Which part of your practice is the strongest?","\u003cstrong>Choose one or two focus areas.\u003c/strong> For example: \"more hands-on practical work\", \"better sentence frames\", \"analysing results by sub-strand\".","\u003cstrong>Write an action.\u003c/strong> Make it specific: \"In my next Stage 4 unit, I will plan one fair test using a variable table and a risk assessment.\"","\u003cstrong>Choose evidence.\u003c/strong> What will show it worked? A learner's table, a recorded plan, a short observation by a colleague.","\u003cstrong>Set a date.\u003c/strong> A review date within the term.","\u003cstrong>Share.\u003c/strong> Tell your HOD or a colleague so that you can support each other."],"ar":["\u003cstrong>Look back.\u003c/strong> Which module gave you the most new ideas? Which part of your practice is the strongest?","\u003cstrong>Choose one or two focus areas.\u003c/strong> For example: \"more hands-on practical work\", \"better sentence frames\", \"analysing results by sub-strand\".","\u003cstrong>Write an action.\u003c/strong> Make it specific: \"In my next Stage 4 unit, I will plan one fair test using a variable table and a risk assessment.\"","\u003cstrong>Choose evidence.\u003c/strong> What will show it worked? A learner's table, a recorded plan, a short observation by a colleague.","\u003cstrong>Set a date.\u003c/strong> A review date within the term.","\u003cstrong>Share.\u003c/strong> Tell your HOD or a colleague so that you can support each other."]}},{"t":"p","c":{"en":"An example action plan: \u003cem>Focus: scientific language. Action: for each unit this term I will choose five key words, display them with pictures and use two sentence frames. Evidence: learners' written conclusions and a short talk-partner observation by a colleague. Review: end of term.\u003c/em>","ar":"An example action plan: \u003cem>Focus: scientific language. Action: for each unit this term I will choose five key words, display them with pictures and use two sentence frames. Evidence: learners' written conclusions and a short talk-partner observation by a colleague. Review: end of term.\u003c/em>"}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1. The objectives are the standard; the scheme of work is a suggestion.\u003c/strong> Plan from the learning objectives, and use the framework's teaching-time guidance as guidance only.\u003cbr>\u003cstrong>2. Science is practical, and skills, content and context work together.\u003c/strong> Give learners real chances to observe and do, and teach the five types of enquiry.\u003cbr>\u003cstrong>3. Safety and welfare stay with the school.\u003c/strong> Make a risk assessment for your class and your individual learners every time, and follow the framework's guidance on animals and on human reproduction.\u003cbr>\u003cstrong>4. Language and evidence guide your teaching.\u003c/strong> Build scientific language with ESL learners, use assessment and reporting codes to find what to reteach, and keep tracking honest.\u003cbr>\u003cstrong>5. Everyone belongs in the lesson.\u003c/strong> Adapt for the needs of each learner, challenge those who are ready, and plan the transitions between phases. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.","ar":"\u003cstrong>1. The objectives are the standard; the scheme of work is a suggestion.\u003c/strong> Plan from the learning objectives, and use the framework's teaching-time guidance as guidance only.\u003cbr>\u003cstrong>2. Science is practical, and skills, content and context work together.\u003c/strong> Give learners real chances to observe and do, and teach the five types of enquiry.\u003cbr>\u003cstrong>3. Safety and welfare stay with the school.\u003c/strong> Make a risk assessment for your class and your individual learners every time, and follow the framework's guidance on animals and on human reproduction.\u003cbr>\u003cstrong>4. Language and evidence guide your teaching.\u003c/strong> Build scientific language with ESL learners, use assessment and reporting codes to find what to reteach, and keep tracking honest.\u003cbr>\u003cstrong>5. Everyone belongs in the lesson.\u003c/strong> Adapt for the needs of each learner, challenge those who are ready, and plan the transitions between phases. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance."}}],"checks":[{"id":"m9q1","q":{"en":"A colleague says, \"I need not do a risk assessment because the activity comes from an endorsed textbook.\" What is the best reply?","ar":"A colleague says, \"I need not do a risk assessment because the activity comes from an endorsed textbook.\" What is the best reply?"},"opts":[{"en":"Safety responsibility stays with the school, so you must still assess your own class each time","ar":"Safety responsibility stays with the school, so you must still assess your own class each time"},{"en":"Endorsed resources are checked for safety by Cambridge, so no further assessment is needed","ar":"Endorsed resources are checked for safety by Cambridge, so no further assessment is needed"},{"en":"A risk assessment is needed only for Stage 6 activities that use heating or chemicals","ar":"A risk assessment is needed only for Stage 6 activities that use heating or chemicals"},{"en":"The textbook publisher takes the legal responsibility for any accident in the classroom","ar":"The textbook publisher takes the legal responsibility for any accident in the classroom"}],"correct":0,"expl":{"en":"The framework says Cambridge endorses support material only in relation to curriculum content, and that responsibility for the safety of all activities remains with the school.","ar":"The framework says Cambridge endorses support material only in relation to curriculum content, and that responsibility for the safety of all activities remains with the school."}},{"id":"m9q2","q":{"en":"Why is \"skip Science in Context because it is not directly assessed\" listed as a common mistake?","ar":"Why is \"skip Science in Context because it is not directly assessed\" listed as a common mistake?"},"opts":[{"en":"Cambridge assesses it directly in Checkpoint, so skipping it would lower the learners' scores","ar":"Cambridge assesses it directly in Checkpoint, so skipping it would lower the learners' scores"},{"en":"The strand has its own objectives and helps learners see science as relevant to them","ar":"The strand has its own objectives and helps learners see science as relevant to them"},{"en":"It is the only strand that includes practical work, so it cannot be left out of any plan","ar":"It is the only strand that includes practical work, so it cannot be left out of any plan"},{"en":"It appears in the schemes of work only, so it is not part of the framework itself","ar":"It appears in the schemes of work only, so it is not part of the framework itself"}],"correct":1,"expl":{"en":"The framework says Science in Context will not be directly assessed, but it has objectives (such as 4SIC.02) in every stage and is designed to show relevance and build the sense that \"science is for me\".","ar":"The framework says Science in Context will not be directly assessed, but it has objectives (such as 4SIC.02) in every stage and is designed to show relevance and build the sense that \"science is for me\"."}},{"id":"m9q3","q":{"en":"Which action in a personal action plan best follows the guidance in this module?","ar":"Which action in a personal action plan best follows the guidance in this module?"},"opts":[{"en":"\"I will try to improve my science teaching this year in every way that I can find\"","ar":"\"I will try to improve my science teaching this year in every way that I can find\""},{"en":"\"I will use more worksheets, because they give me the best evidence of practical skills\"","ar":"\"I will use more worksheets, because they give me the best evidence of practical skills\""},{"en":"\"I will plan one fair test next unit; evidence: learners' tables; review: end of term\"","ar":"\"I will plan one fair test next unit; evidence: learners' tables; review: end of term\""},{"en":"\"I will wait until the school asks me to change my practice before I choose a focus\"","ar":"\"I will wait until the school asks me to change my practice before I choose a focus\""}],"correct":2,"expl":{"en":"A good action is specific, has evidence of success and a review date, and links to a skill from the framework (here 4TWSp.04).","ar":"A good action is specific, has evidence of success and a review date, and links to a skill from the framework (here 4TWSp.04)."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A new teacher says, \"The scheme of work lists suggested activities, so I must teach every one of them in the given order.\" Which reply matches the framework?","ar":"A new teacher says, \"The scheme of work lists suggested activities, so I must teach every one of them in the given order.\" Which reply matches the framework?"},"opts":[{"en":"The scheme is compulsory, but you may change the order of the units if you tell your HOD","ar":"The scheme is compulsory, but you may change the order of the units if you tell your HOD"},{"en":"The scheme is compulsory for Stages 3 to 6 only and optional for Stages 1 and 2","ar":"The scheme is compulsory for Stages 3 to 6 only and optional for Stages 1 and 2"},{"en":"The scheme fills all the teaching time, so no other activities should be added at all","ar":"The scheme fills all the teaching time, so no other activities should be added at all"},{"en":"You need not use the scheme's ideas; the learning objectives are the standard to cover","ar":"You need not use the scheme's ideas; the learning objectives are the standard to cover"}],"correct":3},{"id":"e2","mod":1,"q":{"en":"A Stage 5 class has 2.5 hours of science per week in the timetable, but the unit plan was written for 2 hours. How should the teacher use the framework's teaching-time table?","ar":"A Stage 5 class has 2.5 hours of science per week in the timetable, but the unit plan was written for 2 hours. How should the teacher use the framework's teaching-time table?"},"opts":[{"en":"Treat it as guidance and plan from the real timetable","ar":"Treat it as guidance and plan from the real timetable"},{"en":"Cut the extra half hour, because the table fixes the maximum for every school","ar":"Cut the extra half hour, because the table fixes the maximum for every school"},{"en":"Add a new strand to fill the half hour, because the table lists strands by hours","ar":"Add a new strand to fill the half hour, because the table lists strands by hours"},{"en":"Ask Cambridge to approve the change before using any hours that are above the table","ar":"Ask Cambridge to approve the change before using any hours that are above the table"}],"correct":0},{"id":"e3","mod":1,"q":{"en":"A Stage 3 teacher plans a unit on 3Pf.01 (forcemeters and the newton) and 3Pf.04 (friction). Which planning step is the best use of the \"sequence\" ideas in Module 1?","ar":"A Stage 3 teacher plans a unit on 3Pf.01 (forcemeters and the newton) and 3Pf.04 (friction). Which planning step is the best use of the \"sequence\" ideas in Module 1?"},"opts":[{"en":"Teach friction on the first day so that the forcemeter work can be left until the end of term","ar":"Teach friction on the first day so that the forcemeter work can be left until the end of term"},{"en":"Check that learners met standard units in maths, and allow time to introduce the newton","ar":"Check that learners met standard units in maths, and allow time to introduce the newton"},{"en":"Skip the newton, because science units are taught in the maths lessons in every stage","ar":"Skip the newton, because science units are taught in the maths lessons in every stage"},{"en":"Use only non-standard units, since standard units are not part of the Stage 3 objectives","ar":"Use only non-standard units, since standard units are not part of the Stage 3 objectives"}],"correct":1},{"id":"e4","mod":2,"q":{"en":"A lesson has learners test four materials for waterproofing, predict first, record in a table and then talk about why umbrellas are made as they are. Which three strand categories does it use?","ar":"A lesson has learners test four materials for waterproofing, predict first, record in a table and then talk about why umbrellas are made as they are. Which three strand categories does it use?"},"opts":[{"en":"Content only, because predictions and talk are not strands of the framework","ar":"Content only, because predictions and talk are not strands of the framework"},{"en":"Skills and context only, because materials are a topic and not a content strand","ar":"Skills and context only, because materials are a topic and not a content strand"},{"en":"Content (2Cp.03), skills (Thinking and Working Scientifically) and context","ar":"Content (2Cp.03), skills (Thinking and Working Scientifically) and context"},{"en":"Models, practical work and Science in Context, which are the three content strands","ar":"Models, practical work and Science in Context, which are the three content strands"}],"correct":2},{"id":"e5","mod":2,"q":{"en":"A Stage 4 teacher asks learners to draw a model of a circuit and then says, \"What does this diagram not show?\" Which objective does the question support best?","ar":"A Stage 4 teacher asks learners to draw a model of a circuit and then says, \"What does this diagram not show?\" Which objective does the question support best?"},"opts":[{"en":"4TWSc.01: use observations and tests to sort, group and classify objects","ar":"4TWSc.01: use observations and tests to sort, group and classify objects"},{"en":"4TWSa.04: present and interpret results using tables, bar charts and dot plots","ar":"4TWSa.04: present and interpret results using tables, bar charts and dot plots"},{"en":"4TWSp.05: identify risks and explain how to stay safe during practical work","ar":"4TWSp.05: identify risks and explain how to stay safe during practical work"},{"en":"4TWSm.01: models are not fully representative of a real situation or idea","ar":"4TWSm.01: models are not fully representative of a real situation or idea"}],"correct":3},{"id":"e6","mod":2,"q":{"en":"A Stage 6 teacher plans a Science in Context discussion. Which context best follows the framework's guidance for Stages 4 to 6?","ar":"A Stage 6 teacher plans a Science in Context discussion. Which context best follows the framework's guidance for Stages 4 to 6?"},"opts":[{"en":"A local or national example, such as how science is used in their area","ar":"A local or national example, such as how science is used in their area"},{"en":"Only the learners' own homes, because contexts for older learners must be personal","ar":"Only the learners' own homes, because contexts for older learners must be personal"},{"en":"A distant historical event with no link to the learners' country or region","ar":"A distant historical event with no link to the learners' country or region"},{"en":"No context at all, because the strand cannot be taught in the upper stages","ar":"No context at all, because the strand cannot be taught in the upper stages"}],"correct":0},{"id":"e7","mod":3,"q":{"en":"Stage 5 learners ask, \"Does the surface of a ramp change how far a toy car travels?\" and change only the ramp surface. Which type of enquiry is this?","ar":"Stage 5 learners ask, \"Does the surface of a ramp change how far a toy car travels?\" and change only the ramp surface. Which type of enquiry is this?"},"opts":[{"en":"Observing over time, because the car is watched over several days","ar":"Observing over time, because the car is watched over several days"},{"en":"A fair test, because one variable is changed while the others are kept the same","ar":"A fair test, because one variable is changed while the others are kept the same"},{"en":"Research, because learners use only secondary sources to find the answer","ar":"Research, because learners use only secondary sources to find the answer"},{"en":"Identifying and classifying, because the ramp surfaces are sorted into groups","ar":"Identifying and classifying, because the ramp surfaces are sorted into groups"}],"correct":1},{"id":"e8","mod":3,"q":{"en":"In a fair test on plant growth, a group measures the height of a seedling in light and in a cupboard. A learner suggests using a different amount of water in each. What is the best response?","ar":"In a fair test on plant growth, a group measures the height of a seedling in light and in a cupboard. A learner suggests using a different amount of water in each. What is the best response?"},"opts":[{"en":"Use different amounts, because water is the independent variable in this test","ar":"Use different amounts, because water is the independent variable in this test"},{"en":"Ignore the water, since only the dependent variable needs to be controlled","ar":"Ignore the water, since only the dependent variable needs to be controlled"},{"en":"Keep the amount of water the same, because it is a control variable","ar":"Keep the amount of water the same, because it is a control variable"},{"en":"Change the water and the light together so that the results appear faster","ar":"Change the water and the light together so that the results appear faster"}],"correct":2},{"id":"e9","mod":3,"q":{"en":"One Stage 5 group's result does not match the others. According to 5TWSa.02 and 5TWSa.04, what should learners do?","ar":"One Stage 5 group's result does not match the others. According to 5TWSa.02 and 5TWSa.04, what should learners do?"},"opts":[{"en":"Remove it from the table and graph so that the pattern looks clear to everyone","ar":"Remove it from the table and graph so that the pattern looks clear to everyone"},{"en":"Average it with the other groups' results without saying that it was different","ar":"Average it with the other groups' results without saying that it was different"},{"en":"Repeat the whole investigation with a new question that has a different topic","ar":"Repeat the whole investigation with a new question that has a different topic"},{"en":"Identify it as anomalous, suggest reasons, and consider improvements","ar":"Identify it as anomalous, suggest reasons, and consider improvements"}],"correct":3},{"id":"e10","mod":4,"q":{"en":"A teacher finds a practical in a published scheme of work that uses hot water. What does the framework say about the safety of the activity?","ar":"A teacher finds a practical in a published scheme of work that uses hot water. What does the framework say about the safety of the activity?"},"opts":[{"en":"The school remains responsible, so the teacher must risk-assess it","ar":"The school remains responsible, so the teacher must risk-assess it"},{"en":"Cambridge has checked it, so the teacher can use it without any changes at all","ar":"Cambridge has checked it, so the teacher can use it without any changes at all"},{"en":"The risk assessment is only needed if a learner has been hurt in the past","ar":"The risk assessment is only needed if a learner has been hurt in the past"},{"en":"The textbook publisher decides the level of risk for every school that uses it","ar":"The textbook publisher decides the level of risk for every school that uses it"}],"correct":0},{"id":"e11","mod":4,"q":{"en":"A class wants to bring in snails to observe for a week. Which action best follows the framework's animal welfare guidance?","ar":"A class wants to bring in snails to observe for a week. Which action best follows the framework's animal welfare guidance?"},"opts":[{"en":"Keep the snails in a small sealed box so that every learner can see them closely","ar":"Keep the snails in a small sealed box so that every learner can see them closely"},{"en":"Follow the rules, and give a suitable environment, diet, behaviour and protection","ar":"Follow the rules, and give a suitable environment, diet, behaviour and protection"},{"en":"Bring them in only if learners dissect one, since observing alone is not enough","ar":"Bring them in only if learners dissect one, since observing alone is not enough"},{"en":"Return them to the school grounds without checking any regulations or how they will be cared for","ar":"Return them to the school grounds without checking any regulations or how they will be cared for"}],"correct":1},{"id":"e12","mod":4,"q":{"en":"Which statement about teaching human reproduction in Cambridge Primary Science is correct?","ar":"Which statement about teaching human reproduction in Cambridge Primary Science is correct?"},"opts":[{"en":"Cambridge sets the attitudes and values that must be taught in every school that uses the framework","ar":"Cambridge sets the attitudes and values that must be taught in every school that uses the framework"},{"en":"The topic is taught in the same way everywhere, so no school policy is needed","ar":"The topic is taught in the same way everywhere, so no school policy is needed"},{"en":"The focus is factual; each school decides how values and personal skills are addressed","ar":"The focus is factual; each school decides how values and personal skills are addressed"},{"en":"Only boys' changes in puberty are included, because girls' changes are a school matter","ar":"Only boys' changes in puberty are included, because girls' changes are a school matter"}],"correct":2},{"id":"e13","mod":5,"q":{"en":"A Stage 2 teacher wants learners to describe how materials are chosen for a purpose (2Cp.02). Which support is best for a class of ESL learners?","ar":"A Stage 2 teacher wants learners to describe how materials are chosen for a purpose (2Cp.02). Which support is best for a class of ESL learners?"},"opts":[{"en":"A long paragraph of text that learners read silently and then copy into their books","ar":"A long paragraph of text that learners read silently and then copy into their books"},{"en":"A list of all the new science words for the whole year, given on the first day","ar":"A list of all the new science words for the whole year, given on the first day"},{"en":"A rule that learners may speak only when they can use a perfect full sentence","ar":"A rule that learners may speak only when they can use a perfect full sentence"},{"en":"A word bank with pictures and the frame \"We use ___ because it is ___\"","ar":"A word bank with pictures and the frame \"We use ___ because it is ___\""}],"correct":3},{"id":"e14","mod":5,"q":{"en":"Two learners confuse \"reflect\" and \"refract\" (6Ps.01 and 6Ps.02). What is the best teaching response?","ar":"Two learners confuse \"reflect\" and \"refract\" (6Ps.01 and 6Ps.02). What is the best teaching response?"},"opts":[{"en":"Show both with objects or a diagram, say them together, and use sentence frames","ar":"Show both with objects or a diagram, say them together, and use sentence frames"},{"en":"Tell them the words are almost the same and that either can be used, so there is no need to practise","ar":"Tell them the words are almost the same and that either can be used, so there is no need to practise"},{"en":"Delete one of the words from the lesson, because only one will be tested","ar":"Delete one of the words from the lesson, because only one will be tested"},{"en":"Ask them to write each word ten times and learn them at home","ar":"Ask them to write each word ten times and learn them at home"}],"correct":0},{"id":"e15","mod":5,"q":{"en":"A learner draws a clear labelled diagram of a plant but writes only one short sentence. How should the teacher assess it in class?","ar":"A learner draws a function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);

const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

    <div><div class="c-title">Certificate of Completion</div><div class="c-sub">This is to certify that</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>
      <div class="c-mod">${META.title.en}</div>${META.englishOnly?'':`<div class="c-mod-ar">${META.title.ar}</div>`}</div>
    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
