#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
html[lang="ar"] .side h4{letter-spacing:0;text-transform:none;font-size:13px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:34px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}

}

<script>
const CPD = {"meta":{"id":"primary-esl-framework-b","code":"PEB","passMark":80,"hours":"2.5 hours","accent":"#6A3FA0","accentSoft":"#EFE7F8","eyebrow":{"en":"Staff CPD · Cambridge Primary English as a Second Language 0057 · Part B","ar":"Staff CPD · Cambridge Primary English as a Second Language 0057 · Part B"},"title":{"en":"Understanding the Cambridge Primary ESL Curriculum: Part B, From Framework to Classroom","ar":"Understanding the Cambridge Primary ESL Curriculum: Part B, From Framework to Classroom"},"subtitle":{"en":"A self-paced guide for primary teachers, coordinators and new staff. Part A explained how the framework is built. Part B shows how to turn it into planning, teaching, assessment and follow-up for Stages 1 to 6: integrated lessons, reading and writing, listening and speaking, using evidence, inclusion and review.","ar":"A self-paced guide for primary teachers, coordinators and new staff. Part A explained how the framework is built. Part B shows how to turn it into planning, teaching, assessment and follow-up for Stages 1 to 6: integrated lessons, reading and writing, listening and speaking, using evidence, inclusion and review."},"durationLabel":{"en":"About 2½ hours, fully self-paced","ar":"About 2½ hours, fully self-paced"},"standard":{"en":"Cambridge Primary English as a Second Language 0057 Curriculum Framework (v3.0)","ar":"Cambridge Primary English as a Second Language 0057 Curriculum Framework (v3.0)"},"source":{"en":"Cambridge Primary English as a Second Language 0057 Curriculum Framework, version 3.0 (published September 2025). Check the current Cambridge documents; this CPD supports, and does not replace, them.","ar":"Cambridge Primary English as a Second Language 0057 Curriculum Framework, version 3.0 (published September 2025). Check the current Cambridge documents; this CPD supports, and does not replace, them."},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"From Objectives to Lessons: Planning with the Framework","ar":"From Objectives to Lessons: Planning with the Framework"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"Part A of this CPD explained how the Cambridge Primary English as a Second Language (ESL) 0057 framework is built: its five strands, its CEFR link, its codes and the content of each stage. Part B starts from the next question: \u003cstrong>what do I do on Monday morning?\u003c/strong> By the end of Part B you will be able to: plan at three levels (long, medium and short term); explain what the framework says about schemes of work and the teacher guide; plan an integrated lesson; teach reading, writing, listening, speaking and Use of English with good practice; use assessment evidence to adjust teaching; support every learner; and check the quality of your own lessons. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>","ar":"Part A of this CPD explained how the Cambridge Primary English as a Second Language (ESL) 0057 framework is built: its five strands, its CEFR link, its codes and the content of each stage. Part B starts from the next question: \u003cstrong>what do I do on Monday morning?\u003c/strong> By the end of Part B you will be able to: plan at three levels (long, medium and short term); explain what the framework says about schemes of work and the teacher guide; plan an integrated lesson; teach reading, writing, listening, speaking and Use of English with good practice; use assessment evidence to adjust teaching; support every learner; and check the quality of your own lessons. \u003cstrong>This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.\u003c/strong>"}},{"t":"p","c":{"en":"A curriculum framework is not a timetable and it is not a textbook. It tells you \u003cem>what learners should be able to do\u003c/em> at each stage. It does not tell you what to teach on a particular day, which story to read or which game to play. That is your professional job. The framework says this clearly: it is \"not accompanied by a prescriptive list of topics\", and teachers are expected to plan lessons and choose topics and resources that suit their learners' context. In this module we look at how to move from the framework to a lesson in a way that is faithful to Cambridge and realistic for a class of 25 to 30 learners who all speak English as a second language.","ar":"A curriculum framework is not a timetable and it is not a textbook. It tells you \u003cem>what learners should be able to do\u003c/em> at each stage. It does not tell you what to teach on a particular day, which story to read or which game to play. That is your professional job. The framework says this clearly: it is \"not accompanied by a prescriptive list of topics\", and teachers are expected to plan lessons and choose topics and resources that suit their learners' context. In this module we look at how to move from the framework to a lesson in a way that is faithful to Cambridge and realistic for a class of 25 to 30 learners who all speak English as a second language."}},{"t":"h","c":{"en":"Three levels of planning","ar":"Three levels of planning"}},{"t":"p","c":{"en":"The glossary of the framework describes a scheme of work as containing \"a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\". These three levels are a useful way to think about all planning, whether you use Cambridge's schemes of work or your own.","ar":"The glossary of the framework describes a scheme of work as containing \"a suggested long-term plan, a medium-term plan with suggested activities and sample short-term (lesson) plans\". These three levels are a useful way to think about all planning, whether you use Cambridge's schemes of work or your own."}},{"t":"table","head":{"en":["Level","What it answers","What it looks like in ESL","Who decides"],"ar":["Level","What it answers","What it looks like in ESL","Who decides"]},"rows":[{"en":["Long term (the stage or the year)","Which learning objectives will be taught in this stage, and in what order?","A map of units across the year. Each learning objective of your stage appears at least once, and language is revisited later at a deeper level.","You, your HOD and the school's own planning expectations"],"ar":["Long term (the stage or the year)","Which learning objectives will be taught in this stage, and in what order?","A map of units across the year. Each learning objective of your stage appears at least once, and language is revisited later at a deeper level.","You, your HOD and the school's own planning expectations"]},{"en":["Medium term (a unit, often a few weeks)","Which objectives are grouped together around one theme, and what activities build them?","A theme such as \"Food and shopping\" with objectives from Listening, Speaking, Reading, Writing and Use of English, plus planned review and a short check.","You, usually with your year-group colleagues"],"ar":["Medium term (a unit, often a few weeks)","Which objectives are grouped together around one theme, and what activities build them?","A theme such as \"Food and shopping\" with objectives from Listening, Speaking, Reading, Writing and Use of English, plus planned review and a short check.","You, usually with your year-group colleagues"]},{"en":["Short term (the lesson)","What exactly will learners do, say, read and write today, and how will I know it worked?","One or two focus objectives, a clear can-do success statement, a sequence of tasks and a planned check at the end.","You"],"ar":["Short term (the lesson)","What exactly will learners do, say, read and write today, and how will I know it worked?","One or two focus objectives, a clear can-do success statement, a sequence of tasks and a planned check at the end.","You"]}]},{"t":"h","c":{"en":"What the schemes of work and the teacher guide are","ar":"What the schemes of work and the teacher guide are"}},{"t":"p","c":{"en":"The framework tells us about two kinds of Cambridge support, both available on the School Support Hub. The \u003cstrong>teacher guide\u003c/strong> is the document that supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains three things, according to the framework:","ar":"The framework tells us about two kinds of Cambridge support, both available on the School Support Hub. The \u003cstrong>teacher guide\u003c/strong> is the document that supports you \"to plan and deliver lessons using effective teaching and learning approaches\". The \u003cstrong>scheme of work\u003c/strong> for each stage contains three things, according to the framework:"}},{"t":"list","c":{"en":["suggested units that show how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","sample lesson plans."],"ar":["suggested units that show how the learning objectives can be grouped and ordered;","at least one suggested teaching activity for each learning objective;","sample lesson plans."]}},{"t":"callout","k":"warn","title":{"en":"Schemes of work are not compulsory","ar":"Schemes of work are not compulsory"},"c":{"en":"The framework states: \"You do not need to use the ideas in the schemes of work.\" They show the \u003cem>types\u003c/em> of activity you might use and the \u003cem>depth and breadth\u003c/em> intended for each objective. They are not designed to fill all the teaching time of a stage, so you should add other activities of a similar level of difficulty, for example from endorsed resources. The \u003cstrong>learning objectives\u003c/strong> are the standard. The suggested activities are help. Do not confuse the two.","ar":"The framework states: \"You do not need to use the ideas in the schemes of work.\" They show the \u003cem>types\u003c/em> of activity you might use and the \u003cem>depth and breadth\u003c/em> intended for each objective. They are not designed to fill all the teaching time of a stage, so you should add other activities of a similar level of difficulty, for example from endorsed resources. The \u003cstrong>learning objectives\u003c/strong> are the standard. The suggested activities are help. Do not confuse the two."}},{"t":"p","c":{"en":"A related point concerns textbooks. The framework says there is no requirement for endorsed textbooks to follow the teaching order of the schemes of work, and that if a resource is endorsed, you can be confident that all the learning objectives are covered. This means a unit order in your coursebook may differ from the scheme of work, and that is acceptable. Your own check should still be: \u003cem>over the year, are all the objectives of my stage taught, practised and checked?\u003c/em>","ar":"A related point concerns textbooks. The framework says there is no requirement for endorsed textbooks to follow the teaching order of the schemes of work, and that if a resource is endorsed, you can be confident that all the learning objectives are covered. This means a unit order in your coursebook may differ from the scheme of work, and that is acceptable. Your own check should still be: \u003cem>over the year, are all the objectives of my stage taught, practised and checked?\u003c/em>"}},{"t":"h","c":{"en":"Unit planning around integrated skills","ar":"Unit planning around integrated skills"}},{"t":"p","c":{"en":"The most important planning idea in the framework is the integrated approach. It says \"each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more learning objectives from the Use of English strand.\" The four skills are reading, writing, listening and speaking. The Use of English strand (vocabulary, grammatical forms and sentence structure) supplies the language that learners need to understand (Reading and Listening) and to produce (Writing and Speaking). The framework also advises planning lessons that include objectives from more than one strand.","ar":"The most important planning idea in the framework is the integrated approach. It says \"each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more learning objectives from the Use of English strand.\" The four skills are reading, writing, listening and speaking. The Use of English strand (vocabulary, grammatical forms and sentence structure) supplies the language that learners need to understand (Reading and Listening) and to produce (Writing and Speaking). The framework also advises planning lessons that include objectives from more than one strand."}},{"t":"p","c":{"en":"So a good unit does not teach \"a week of grammar, then a week of reading\". It chooses a theme that is relevant to the learners and moves around the skills, returning to the same language several times.","ar":"So a good unit does not teach \"a week of grammar, then a week of reading\". It chooses a theme that is relevant to the learners and moves around the skills, returning to the same language several times."}},{"t":"scenario","title":{"en":"Unit planning example: Stage 2, \"Classroom routines\"","ar":"Unit planning example: Stage 2, \"Classroom routines\""},"c":{"en":"A Stage 2 teacher plans a unit of about two weeks. She picks the theme \"Classroom routines\" and selects these objectives from the framework (paraphrased; check the framework for full wording): \u003cstrong>2Ld.01\u003c/strong> understand a short sequence of familiar instructions; \u003cstrong>2Rd.03\u003c/strong> read and follow, with support, short familiar instructions; \u003cstrong>2Sc.03\u003c/strong> ask questions to find out personal information and respond; \u003cstrong>2Wc.01\u003c/strong> write, with support, simple phrases giving personal and factual information; \u003cstrong>2Ug.02\u003c/strong> present simple forms; \u003cstrong>2Uv.05\u003c/strong> prepositions of time such as \"at\". Over the unit, learners listen to the teacher's instructions, read a picture timetable, ask \"What time do you...?\" in pairs, and write three phrases about their own day. Every skill is used, and the same language (present simple with \"at\") returns in each task. Notice that she did not need a scheme of work to do this. She used the framework's objectives and her own knowledge of her learners.","ar":"A Stage 2 teacher plans a unit of about two weeks. She picks the theme \"Classroom routines\" and selects these objectives from the framework (paraphrased; check the framework for full wording): \u003cstrong>2Ld.01\u003c/strong> understand a short sequence of familiar instructions; \u003cstrong>2Rd.03\u003c/strong> read and follow, with support, short familiar instructions; \u003cstrong>2Sc.03\u003c/strong> ask questions to find out personal information and respond; \u003cstrong>2Wc.01\u003c/strong> write, with support, simple phrases giving personal and factual information; \u003cstrong>2Ug.02\u003c/strong> present simple forms; \u003cstrong>2Uv.05\u003c/strong> prepositions of time such as \"at\". Over the unit, learners listen to the teacher's instructions, read a picture timetable, ask \"What time do you...?\" in pairs, and write three phrases about their own day. Every skill is used, and the same language (present simple with \"at\") returns in each task. Notice that she did not need a scheme of work to do this. She used the framework's objectives and her own knowledge of her learners."}},{"t":"h","c":{"en":"Reading a code: a worked mini-example","ar":"Reading a code: a worked mini-example"}},{"t":"p","c":{"en":"Every learning objective has a unique code. Part A explained how codes work, so here is only a quick reminder through an example you can use in planning. The framework's own example is \u003cstrong>5Rd.01\u003c/strong>: the \u003cstrong>5\u003c/strong> is the stage, \u003cstrong>Rd\u003c/strong> is the reporting code for Reading for detail, and \u003cstrong>01\u003c/strong> is the first objective in that sub-strand for Stage 5. Now try a planning example. A colleague writes \"3Ug.09, 3Sc.02, 3Wc.02\" in a unit plan. Without opening the framework, you can say: all three are Stage 3; one is a Use of English objective on grammatical forms (3Ug.09, comparative and superlative adjectives), one is a Speaking objective (3Sc.02, describing people, places and objects using sentences) and one is a Writing content objective (3Wc.02, writing short sentences that describe). Together they make a sensible mini-unit: \"describe and compare two animals\", first by speaking and then by writing.","ar":"Every learning objective has a unique code. Part A explained how codes work, so here is only a quick reminder through an example you can use in planning. The framework's own example is \u003cstrong>5Rd.01\u003c/strong>: the \u003cstrong>5\u003c/strong> is the stage, \u003cstrong>Rd\u003c/strong> is the reporting code for Reading for detail, and \u003cstrong>01\u003c/strong> is the first objective in that sub-strand for Stage 5. Now try a planning example. A colleague writes \"3Ug.09, 3Sc.02, 3Wc.02\" in a unit plan. Without opening the framework, you can say: all three are Stage 3; one is a Use of English objective on grammatical forms (3Ug.09, comparative and superlative adjectives), one is a Speaking objective (3Sc.02, describing people, places and objects using sentences) and one is a Writing content objective (3Wc.02, writing short sentences that describe). Together they make a sensible mini-unit: \"describe and compare two animals\", first by speaking and then by writing."}},{"t":"callout","k":"tip","title":{"en":"Good practice: write the objective once, then write it as \"I can\"","ar":"Good practice: write the objective once, then write it as \"I can\""},"c":{"en":"The framework frames objectives as \"can-do\" statements about what learners should be able to do in English. In your lesson plan, copy the code and then turn it into a pupil-friendly sentence, for example 3Sc.02 becomes \"I can tell my partner what an animal looks like using full sentences.\" This is good practice, not a Cambridge requirement, but it keeps lessons focused and makes checking easy.","ar":"The framework frames objectives as \"can-do\" statements about what learners should be able to do in English. In your lesson plan, copy the code and then turn it into a pupil-friendly sentence, for example 3Sc.02 becomes \"I can tell my partner what an animal looks like using full sentences.\" This is good practice, not a Cambridge requirement, but it keeps lessons focused and makes checking easy."}},{"t":"h","c":{"en":"Teaching-time guidance","ar":"Teaching-time guidance"}},{"t":"p","c":{"en":"The framework gives guidance on the time needed. It says: \"this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the word \u003cem>guidance\u003c/em>. It is not a rule and not an inspection standard.","ar":"The framework gives guidance on the time needed. It says: \"this curriculum framework is based on learners having 4 to 5 hours of English as a Second Language per week (or about 120 to 150 hours per stage). Your actual number of teaching hours may vary according to your context.\" Notice the word \u003cem>guidance\u003c/em>. It is not a rule and not an inspection standard."}},{"t":"p","c":{"en":"A quick calculation shows where the figures come from (this arithmetic is ours, not the framework's): 4 hours a week over about 30 teaching weeks is 120 hours, and 5 hours a week over 30 weeks is 150 hours. Teachers should compare their own timetable with this guidance and talk with their HOD if the real time is much lower, because the same objectives must then be taught with fewer hours. Time lost to events, assessments and holidays is also part of \"your context\".","ar":"A quick calculation shows where the figures come from (this arithmetic is ours, not the framework's): 4 hours a week over about 30 teaching weeks is 120 hours, and 5 hours a week over 30 weeks is 150 hours. Teachers should compare their own timetable with this guidance and talk with their HOD if the real time is much lower, because the same objectives must then be taught with fewer hours. Time lost to events, assessments and holidays is also part of \"your context\"."}},{"t":"scenario","title":{"en":"Scenario: the folder arrives","ar":"Scenario: the folder arrives"},"c":{"en":"A new teacher is given the Stage 4 scheme of work and says, \"I must follow every activity exactly, in order, or the school will be out of line with Cambridge.\" What would you advise? The best response: the framework says the scheme of work is optional support. The teacher is responsible for teaching and checking \u003cem>all the Stage 4 learning objectives\u003c/em>, using activities of similar difficulty. She can use the suggested units as a starting point, adapt the activities to the class, add other activities because the scheme does not fill all the teaching time, and ask the HOD about the school's own planning expectations.","ar":"A new teacher is given the Stage 4 scheme of work and says, \"I must follow every activity exactly, in order, or the school will be out of line with Cambridge.\" What would you advise? The best response: the framework says the scheme of work is optional support. The teacher is responsible for teaching and checking \u003cem>all the Stage 4 learning objectives\u003c/em>, using activities of similar difficulty. She can use the suggested units as a starting point, adapt the activities to the class, add other activities because the scheme does not fill all the teaching time, and ask the HOD about the school's own planning expectations."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Plan at long, medium and short term. The objectives are the standard; the schemes of work and teacher guide are support. Every unit and lesson should give practice in all four skills and focus on at least one Use of English objective. Teaching-time guidance is 4 to 5 hours per week, about 120 to 150 hours per stage, and may vary with your context.","ar":"Plan at long, medium and short term. The objectives are the standard; the schemes of work and teacher guide are support. Every unit and lesson should give practice in all four skills and focus on at least one Use of English objective. Teaching-time guidance is 4 to 5 hours per week, about 120 to 150 hours per stage, and may vary with your context."}}],"checks":[{"id":"m1q1","q":{"en":"According to the framework, what does the scheme of work for each stage contain?","ar":"According to the framework, what does the scheme of work for each stage contain?"},"opts":[{"en":"Suggested units, at least one suggested activity per objective, and sample lesson plans","ar":"Suggested units, at least one suggested activity per objective, and sample lesson plans"},{"en":"A compulsory weekly timetable, a set of required textbooks, and one test for each unit","ar":"A compulsory weekly timetable, a set of required textbooks, and one test for each unit"},{"en":"A fixed list of topics, a compulsory activity for each objective, and sample marking grids","ar":"A fixed list of topics, a compulsory activity for each objective, and sample marking grids"},{"en":"The full wording of every objective, a list of banned activities, and a final report format","ar":"The full wording of every objective, a list of banned activities, and a final report format"}],"correct":0,"expl":{"en":"The framework says each scheme of work contains suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans. It also states that teachers do not need to use these ideas.","ar":"The framework says each scheme of work contains suggested units, at least one suggested teaching activity for each learning objective, and sample lesson plans. It also states that teachers do not need to use these ideas."}},{"id":"m1q2","q":{"en":"A teacher says the Stage 3 scheme of work must be followed exactly. What does the framework say?","ar":"A teacher says the Stage 3 scheme of work must be followed exactly. What does the framework say?"},"opts":[{"en":"The scheme of work replaces the learning objectives and must be taught in full each year","ar":"The scheme of work replaces the learning objectives and must be taught in full each year"},{"en":"Teachers do not need to use the ideas in the schemes of work to teach the curriculum","ar":"Teachers do not need to use the ideas in the schemes of work to teach the curriculum"},{"en":"Schemes of work are compulsory in schools that offer Cambridge Primary Checkpoint tests","ar":"Schemes of work are compulsory in schools that offer Cambridge Primary Checkpoint tests"},{"en":"Only the sample lesson plans may be changed; the suggested units must stay unchanged","ar":"Only the sample lesson plans may be changed; the suggested units must stay unchanged"}],"correct":1,"expl":{"en":"The framework says clearly that you do not need to use the ideas in the schemes of work. They show types of activity and the intended depth and breadth. The learning objectives remain the standard.","ar":"The framework says clearly that you do not need to use the ideas in the schemes of work. They show types of activity and the intended depth and breadth. The learning objectives remain the standard."}},{"id":"m1q3","q":{"en":"What does the framework say about the teaching time on which the curriculum is based?","ar":"What does the framework say about the teaching time on which the curriculum is based?"},"opts":[{"en":"3 to 4 hours per week, or about 90 to 120 hours per stage, and it must not vary","ar":"3 to 4 hours per week, or about 90 to 120 hours per stage, and it must not vary"},{"en":"5 to 6 hours per week, or about 150 to 180 hours per stage, with no variation","ar":"5 to 6 hours per week, or about 150 to 180 hours per stage, with no variation"},{"en":"4 to 5 hours per week, or about 120 to 150 hours per stage, and it may vary by context","ar":"4 to 5 hours per week, or about 120 to 150 hours per stage, and it may vary by context"},{"en":"4 to 5 hours per week, or about 200 to 250 hours per stage, depending on the school","ar":"4 to 5 hours per week, or about 200 to 250 hours per stage, depending on the school"}],"correct":2,"expl":{"en":"The framework gives this as guidance: 4 to 5 hours of ESL per week, about 120 to 150 hours per stage, and says the actual number of hours may vary according to context.","ar":"The framework gives this as guidance: 4 to 5 hours of ESL per week, about 120 to 150 hours per stage, and says the actual number of hours may vary according to context."}}]},{"id":"m2","title":{"en":"Teaching Approaches in the Framework","ar":"Teaching Approaches in the Framework"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Many teachers ask: \"What method does Cambridge want me to use?\" The honest answer is that the framework does not prescribe one method or one lesson shape. It does, however, describe the kind of teaching it expects. This module collects what the framework says, in the section called \"Overview of teaching approaches\" and in other places, and then shows what these ideas can look like with a class of ESL learners.","ar":"Many teachers ask: \"What method does Cambridge want me to use?\" The honest answer is that the framework does not prescribe one method or one lesson shape. It does, however, describe the kind of teaching it expects. This module collects what the framework says, in the section called \"Overview of teaching approaches\" and in other places, and then shows what these ideas can look like with a class of ESL learners."}},{"t":"callout","k":"key","title":{"en":"What the framework section actually contains","ar":"What the framework section actually contains"},"c":{"en":"The section \"Overview of teaching approaches\" in the 0057 framework has three parts: \u003cstrong>Integrated approach\u003c/strong>, \u003cstrong>Phonics and handwriting\u003c/strong>, and \u003cstrong>Teacher support resources\u003c/strong>. The words \"active\", \"learning-centred\", \"activity-based\" and \"communicative\" are also used by the framework, but in other places: in the Key benefits section, in the glossary and in the aims. In this module we bring them together. Where we describe classroom activities that are not in the framework, we label them \u003cstrong>good practice\u003c/strong>.","ar":"The section \"Overview of teaching approaches\" in the 0057 framework has three parts: \u003cstrong>Integrated approach\u003c/strong>, \u003cstrong>Phonics and handwriting\u003c/strong>, and \u003cstrong>Teacher support resources\u003c/strong>. The words \"active\", \"learning-centred\", \"activity-based\" and \"communicative\" are also used by the framework, but in other places: in the Key benefits section, in the glossary and in the aims. In this module we bring them together. Where we describe classroom activities that are not in the framework, we label them \u003cstrong>good practice\u003c/strong>."}},{"t":"h","c":{"en":"Active learning","ar":"Active learning"}},{"t":"p","c":{"en":"The Key benefits section says the programme \"promotes active learning, develops thinking skills and encourages intellectual engagement\". The glossary defines active learning as \"a classroom approach in which learners are encouraged to 'think hard', rather than passively receive information.\"","ar":"The Key benefits section says the programme \"promotes active learning, develops thinking skills and encourages intellectual engagement\". The glossary defines active learning as \"a classroom approach in which learners are encouraged to 'think hard', rather than passively receive information.\""}},{"t":"p","c":{"en":"In a language class, \"thinking hard\" is not silence and long explanations. It means learners are doing something with the language: sorting words, guessing a meaning from context, deciding which sentence is true, correcting a wrong sentence, or choosing the best question to ask. A teacher who talks for 20 minutes about the past simple is giving information. A teacher who gives learners six sentences from a story and asks them to find and underline the past simple verbs, then discuss the pattern in pairs, is asking them to think hard. This is closer to how the glossary uses the word \"explore\": to investigate, look for patterns and discuss examples.","ar":"In a language class, \"thinking hard\" is not silence and long explanations. It means learners are doing something with the language: sorting words, guessing a meaning from context, deciding which sentence is true, correcting a wrong sentence, or choosing the best question to ask. A teacher who talks for 20 minutes about the past simple is giving information. A teacher who gives learners six sentences from a story and asks them to find and underline the past simple verbs, then discuss the pattern in pairs, is asking them to think hard. This is closer to how the glossary uses the word \"explore\": to investigate, look for patterns and discuss examples."}},{"t":"h","c":{"en":"Learning-centred and activity-based approaches","ar":"Learning-centred and activity-based approaches"}},{"t":"p","c":{"en":"The framework explains that its objectives are written as a progressive sequence of \"can-do\" statements, and that this \"encourages teachers to use learning-centred, activity-based approaches\". A can-do statement describes what a learner can \u003cem>do\u003c/em>, such as \"ask simple questions about classroom routines\" (1Sc.03). The natural way to teach a can-do statement is to let learners do it. The lesson is built around learner activity (tasks, talk, reading and writing for a purpose) rather than around the teacher's presentation.","ar":"The framework explains that its objectives are written as a progressive sequence of \"can-do\" statements, and that this \"encourages teachers to use learning-centred, activity-based approaches\". A can-do statement describes what a learner can \u003cem>do\u003c/em>, such as \"ask simple questions about classroom routines\" (1Sc.03). The natural way to teach a can-do statement is to let learners do it. The lesson is built around learner activity (tasks, talk, reading and writing for a purpose) rather than around the teacher's presentation."}},{"t":"p","c":{"en":"Learning-centred does not mean the teacher does less. The teacher plans carefully, models language, gives feedback and decides when to step back. The difference is who is doing most of the language work during the lesson. A simple check is to ask: \u003cem>in a 40-minute lesson, how many minutes did each learner actually speak, read, write or listen with a purpose?\u003c/em>","ar":"Learning-centred does not mean the teacher does less. The teacher plans carefully, models language, gives feedback and decides when to step back. The difference is who is doing most of the language work during the lesson. A simple check is to ask: \u003cem>in a 40-minute lesson, how many minutes did each learner actually speak, read, write or listen with a purpose?\u003c/em>"}},{"t":"h","c":{"en":"Communicative and integrated work","ar":"Communicative and integrated work"}},{"t":"p","c":{"en":"The framework wants learners to be \"able to communicate effectively through the skills of reading, writing, speaking and listening\" and describes effective use of English \"for the purposes of practical communication\". Its integrated approach lists benefits: it develops all-round communicative competence, allows lessons to be built around a relevant theme, motivates learners through variety, works \"at the level of realistic communication, where language tasks involve more than one skill\", exposes learners to authentic language and \"challenges learners to interact naturally\".","ar":"The framework wants learners to be \"able to communicate effectively through the skills of reading, writing, speaking and listening\" and describes effective use of English \"for the purposes of practical communication\". Its integrated approach lists benefits: it develops all-round communicative competence, allows lessons to be built around a relevant theme, motivates learners through variety, works \"at the level of realistic communication, where language tasks involve more than one skill\", exposes learners to authentic language and \"challenges learners to interact naturally\"."}},{"t":"p","c":{"en":"The glossary defines \u003cstrong>authentic language\u003c/strong> as \"written or spoken language used in real situations\", which may be contrasted with graded teaching material. For young ESL learners, this does not mean difficult newspaper articles. It can mean a real school notice, a short real recipe, a voice message from a teacher, a menu or a poster. Learners are not expected to understand every word. They are expected to find the information they need.","ar":"The glossary defines \u003cstrong>authentic language\u003c/strong> as \"written or spoken language used in real situations\", which may be contrasted with graded teaching material. For young ESL learners, this does not mean difficult newspaper articles. It can mean a real school notice, a short real recipe, a voice message from a teacher, a menu or a poster. Learners are not expected to understand every word. They are expected to find the information they need."}},{"t":"table","head":{"en":["Idea","Where it appears in the framework","What it can look like (good practice)"],"ar":["Idea","Where it appears in the framework","What it can look like (good practice)"]},"rows":[{"en":["Active learning","Key benefits; glossary definition","Learners sort, match, decide, predict and correct, not only listen. Pair work with a clear task."],"ar":["Active learning","Key benefits; glossary definition","Learners sort, match, decide, predict and correct, not only listen. Pair work with a clear task."]},{"en":["Learning-centred, activity-based","Key benefits (can-do statements)","Lessons built around a can-do outcome such as \"I can ask three questions about my partner's family\"."],"ar":["Learning-centred, activity-based","Key benefits (can-do statements)","Lessons built around a can-do outcome such as \"I can ask three questions about my partner's family\"."]},{"en":["Communicative competence","Integrated approach; aims","A real purpose: find out, tell, decide, write to someone. Language is used, not only repeated."],"ar":["Communicative competence","Integrated approach; aims","A real purpose: find out, tell, decide, write to someone. Language is used, not only repeated."]},{"en":["Integrated skills and Use of English","Integrated approach","A theme runs through listening, speaking, reading and writing; one Use of English focus is practised in all of them."],"ar":["Integrated skills and Use of English","Integrated approach","A theme runs through listening, speaking, reading and writing; one Use of English focus is practised in all of them."]},{"en":["Review and extension","Integrated approach","Language from earlier stages returns in new tasks, for example connectives, which grow from \"and\" at Stage 1 to a wider range at Stage 2."],"ar":["Review and extension","Integrated approach","Language from earlier stages returns in new tasks, for example connectives, which grow from \"and\" at Stage 1 to a wider range at Stage 2."]},{"en":["Learners as language learners","Aims; Responsible, Reflective, Confident","Learners reflect on how they learned a word, and feel safe to take risks and learn from mistakes."],"ar":["Learners as language learners","Aims; Responsible, Reflective, Confident","Learners reflect on how they learned a word, and feel safe to take risks and learn from mistakes."]}]},{"t":"h","c":{"en":"Review and extension: language comes back","ar":"Review and extension: language comes back"}},{"t":"p","c":{"en":"The framework says that \"as learners move through the stages, previously studied language should be reviewed, extended and integrated into different practice tasks\". Its own example concerns connectives: at Stage 1 learners meet the basic connective \"and\" (1Us.04), and at Stage 2 this is extended to a wider range such as \"but\", \"or\" and \"then\" (2Us.04), which learners begin to use in written practice. A Stage 2 teacher should therefore not treat \"and\" as finished. A good Stage 2 lesson includes a quick activity in which learners link two ideas with \"and\" before introducing \"but\".","ar":"The framework says that \"as learners move through the stages, previously studied language should be reviewed, extended and integrated into different practice tasks\". Its own example concerns connectives: at Stage 1 learners meet the basic connective \"and\" (1Us.04), and at Stage 2 this is extended to a wider range such as \"but\", \"or\" and \"then\" (2Us.04), which learners begin to use in written practice. A Stage 2 teacher should therefore not treat \"and\" as finished. A good Stage 2 lesson includes a quick activity in which learners link two ideas with \"and\" before introducing \"but\"."}},{"t":"h","c":{"en":"Phonics and handwriting","ar":"Phonics and handwriting"}},{"t":"p","c":{"en":"The framework's Changes section says information on phonics and handwriting was added in the amended framework (latest version 3.0, September 2025). It explains that phonics relates sounds (phonemes) to letters and groups of letters (graphemes), that it is \"a key skill for literacy in English\" and that research suggests it can be particularly helpful for children whose home language is not English. It also says that when teaching phonics you should build on children's oral language in their home language, for example by identifying English sounds that may be harder for them because those sounds are not in the home language.","ar":"The framework's Changes section says information on phonics and handwriting was added in the amended framework (latest version 3.0, September 2025). It explains that phonics relates sounds (phonemes) to letters and groups of letters (graphemes), that it is \"a key skill for literacy in English\" and that research suggests it can be particularly helpful for children whose home language is not English. It also says that when teaching phonics you should build on children's oral language in their home language, for example by identifying English sounds that may be harder for them because those sounds are not in the home language."}},{"t":"list","c":{"en":["\u003cstrong>Stage 1 phonics objectives:\u003c/strong> 1Rd.01 (recognise, identify, sound and name the letters of the alphabet) and 1Rd.02 (recognise, identify and blend sounds in individual words). The framework describes these as high-level objectives for a synthetic phonics approach.","\u003cstrong>Handwriting objectives:\u003c/strong> 3Wca.01, 4Wca.01, 5Wca.01 and 6Wca.01, which move from legible handwriting to legible handwriting with appropriate speed and fluency. At Stages 1 and 2 the related objectives are about letter formation (1Wca.02) and consistent size and spacing (2Wca.01).","\u003cstrong>Resource:\u003c/strong> the Cambridge Phonics and Handwriting Framework, which gives a recommended order for systematic teaching. The framework says phonics and handwriting need \"regular, dedicated teaching and learning opportunities\" and that connecting them helps learners remember letter-sound links."],"ar":["\u003cstrong>Stage 1 phonics objectives:\u003c/strong> 1Rd.01 (recognise, identify, sound and name the letters of the alphabet) and 1Rd.02 (recognise, identify and blend sounds in individual words). The framework describes these as high-level objectives for a synthetic phonics approach.","\u003cstrong>Handwriting objectives:\u003c/strong> 3Wca.01, 4Wca.01, 5Wca.01 and 6Wca.01, which move from legible handwriting to legible handwriting with appropriate speed and fluency. At Stages 1 and 2 the related objectives are about letter formation (1Wca.02) and consistent size and spacing (2Wca.01).","\u003cstrong>Resource:\u003c/strong> the Cambridge Phonics and Handwriting Framework, which gives a recommended order for systematic teaching. The framework says phonics and handwriting need \"regular, dedicated teaching and learning opportunities\" and that connecting them helps learners remember letter-sound links."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: a short, regular phonics routine","ar":"Good practice: a short, regular phonics routine"},"c":{"en":"The framework asks for regular, dedicated teaching, not occasional extras. A teacher of Stage 1 might use a five-minute routine at the start of most lessons: say the sound, write the letter shape in the air, blend three sounds into a word, then write the word. If your learners' home language is Arabic, you may notice that sounds such as /p/ and /v/ are often harder, so give them extra listening and speaking practice. Check your own learners rather than assuming.","ar":"The framework asks for regular, dedicated teaching, not occasional extras. A teacher of Stage 1 might use a five-minute routine at the start of most lessons: say the sound, write the letter shape in the air, blend three sounds into a word, then write the word. If your learners' home language is Arabic, you may notice that sounds such as /p/ and /v/ are often harder, so give them extra listening and speaking practice. Check your own learners rather than assuming."}},{"t":"scenario","title":{"en":"Scenario: the grammar lecture","ar":"Scenario: the grammar lecture"},"c":{"en":"A Stage 5 teacher spends the first 25 minutes of a lesson explaining present perfect with \"for\" and \"since\" (5Ug.07) on the board and then gives a worksheet. Learners are quiet and finish the sheet, but when asked \"How long have you lived in Sharjah?\" most give a one-word answer. What could she change, using the framework's ideas? She could keep a short explanation (about five minutes) and then use a task: learners complete a short text about a visitor, then interview two classmates (\"How long have you been at this school?\"), then write three sentences using \"for\" or \"since\". The same language is used for listening, speaking, reading and writing, which is exactly the integrated approach, and learners do most of the work.","ar":"A Stage 5 teacher spends the first 25 minutes of a lesson explaining present perfect with \"for\" and \"since\" (5Ug.07) on the board and then gives a worksheet. Learners are quiet and finish the sheet, but when asked \"How long have you lived in Sharjah?\" most give a one-word answer. What could she change, using the framework's ideas? She could keep a short explanation (about five minutes) and then use a task: learners complete a short text about a visitor, then interview two classmates (\"How long have you been at this school?\"), then write three sentences using \"for\" or \"since\". The same language is used for listening, speaking, reading and writing, which is exactly the integrated approach, and learners do most of the work."}},{"t":"h","c":{"en":"Learners as responsible, reflective language learners","ar":"Learners as responsible, reflective language learners"}},{"t":"p","c":{"en":"The framework's aims say that learners \"see themselves as successful language learners\". It describes Cambridge learners as responsible, innovative, confident, engaged and reflective, and says confident learners \"feel empowered to take risks, try new language, and reflect on and learn from their mistakes.\" This has a direct consequence for the classroom: a lesson where every mistake is corrected immediately, or where learners are afraid to speak, does not match the aims. Good practice is to make mistakes safe and useful: for example, a \"mistake of the day\" activity in which the teacher writes an anonymous, common mistake on the board and the class corrects it together.","ar":"The framework's aims say that learners \"see themselves as successful language learners\". It describes Cambridge learners as responsible, innovative, confident, engaged and reflective, and says confident learners \"feel empowered to take risks, try new language, and reflect on and learn from their mistakes.\" This has a direct consequence for the classroom: a lesson where every mistake is corrected immediately, or where learners are afraid to speak, does not match the aims. Good practice is to make mistakes safe and useful: for example, a \"mistake of the day\" activity in which the teacher writes an anonymous, common mistake on the board and the class corrects it together."}}],"checks":[{"id":"m2q1","q":{"en":"Which three parts make up the framework's \"Overview of teaching approaches\" section?","ar":"Which three parts make up the framework's \"Overview of teaching approaches\" section?"},"opts":[{"en":"Active learning, Communicative approach, and Assessment for learning","ar":"Active learning, Communicative approach, and Assessment for learning"},{"en":"Integrated approach, Phonics and handwriting, and Assessment resources","ar":"Integrated approach, Phonics and handwriting, and Assessment resources"},{"en":"Learning-centred approach, Teacher support resources, and Progression tests","ar":"Learning-centred approach, Teacher support resources, and Progression tests"},{"en":"Integrated approach, Phonics and handwriting, and Teacher support resources","ar":"Integrated approach, Phonics and handwriting, and Teacher support resources"}],"correct":3,"expl":{"en":"The framework's Overview of teaching approaches has these three parts. Active, learning-centred and activity-based ideas appear elsewhere, for example in Key benefits and the glossary.","ar":"The framework's Overview of teaching approaches has these three parts. Active, learning-centred and activity-based ideas appear elsewhere, for example in Key benefits and the glossary."}},{"id":"m2q2","q":{"en":"What does the framework's glossary say active learning is?","ar":"What does the framework's glossary say active learning is?"},"opts":[{"en":"A classroom approach in which learners are encouraged to think hard, not passively receive information","ar":"A classroom approach in which learners are encouraged to think hard, not passively receive information"},{"en":"A classroom approach in which learners move around the room and complete many different activities","ar":"A classroom approach in which learners move around the room and complete many different activities"},{"en":"A teaching approach in which learners copy information from the board and then check it","ar":"A teaching approach in which learners copy information from the board and then check it"},{"en":"A classroom approach in which the teacher explains each rule fully before any practice begins","ar":"A classroom approach in which the teacher explains each rule fully before any practice begins"}],"correct":0,"expl":{"en":"The glossary defines active learning as an approach in which learners are encouraged to 'think hard', rather than passively receive information.","ar":"The glossary defines active learning as an approach in which learners are encouraged to 'think hard', rather than passively receive information."}},{"id":"m2q3","q":{"en":"How does the framework say previously studied language should be treated as learners move through the stages?","ar":"How does the framework say previously studied language should be treated as learners move through the stages?"},"opts":[{"en":"It should be assessed once and then replaced by the new language of the stage","ar":"It should be assessed once and then replaced by the new language of the stage"},{"en":"It should be reviewed, extended and integrated into different practice tasks","ar":"It should be reviewed, extended and integrated into different practice tasks"},{"en":"It should be revised only in the final weeks before a Progression Test","ar":"It should be revised only in the final weeks before a Progression Test"},{"en":"It should be repeated in the same form so learners remember it exactly","ar":"It should be repeated in the same form so learners remember it exactly"}],"correct":1,"expl":{"en":"The framework gives the example of connectives: 'and' at Stage 1, extended at Stage 2 to a wider range and used in written practice.","ar":"The framework gives the example of connectives: 'and' at Stage 1, extended at Stage 2 to a wider range and used in written practice."}}]},{"id":"m3","title":{"en":"Planning a Lesson that Integrates All the Skills","ar":"Planning a Lesson that Integrates All the Skills"},"minutes":17,"blocks":[{"t":"p","c":{"en":"In Module 1 you planned a unit. Now we plan a single lesson. The framework asks that each lesson and unit give opportunities to practise all four skills (reading, writing, listening and speaking) and focus on one or more Use of English objectives. This does \u003cem>not\u003c/em> mean that every lesson must spend equal time on five strands, or that you must tick off ten objectives. It means a lesson should feel like real communication around one theme, where learners meet and use the same language in more than one way.","ar":"In Module 1 you planned a unit. Now we plan a single lesson. The framework asks that each lesson and unit give opportunities to practise all four skills (reading, writing, listening and speaking) and focus on one or more Use of English objectives. This does \u003cem>not\u003c/em> mean that every lesson must spend equal time on five strands, or that you must tick off ten objectives. It means a lesson should feel like real communication around one theme, where learners meet and use the same language in more than one way."}},{"t":"h","c":{"en":"A six-step planning routine (good practice)","ar":"A six-step planning routine (good practice)"}},{"t":"p","c":{"en":"The following routine is good practice, not a Cambridge requirement. It works for any stage. Notice that it begins with the language focus, because the framework describes Use of English as the strand that supplies the language for the other four.","ar":"The following routine is good practice, not a Cambridge requirement. It works for any stage. Notice that it begins with the language focus, because the framework describes Use of English as the strand that supplies the language for the other four."}},{"t":"steps","c":{"en":["\u003cstrong>Choose one or two Use of English objectives.\u003c/strong> For example 3Ug.09 (comparative and superlative adjectives) or 5Ug.07 (present perfect with for and since). Keep this small.","\u003cstrong>Choose a theme or context that is relevant to your learners.\u003c/strong> The framework has no list of topics, so you decide: pets, the school trip, a family meal, the weather in Sharjah.","\u003cstrong>Add objectives from other strands\u003c/strong> that fit the theme naturally: usually one receptive (Listening or Reading) and one productive (Speaking or Writing). Add the others if they come naturally, for example in a short review.","\u003cstrong>Order the tasks from receptive to productive.\u003c/strong> Learners meet the language in a listening or reading text first, then practise it in controlled tasks, then use it more freely in speaking or writing.","\u003cstrong>Plan the support.\u003c/strong> The wording of the objectives (\"with support\", \"with little or no support\") tells you how much help your stage expects. Decide what help you will give: a word bank, a picture, a model sentence, a partner.","\u003cstrong>Write a can-do success statement and a quick check.\u003c/strong> For example, \"I can describe two animals using comparative adjectives.\" Plan how you will see whether learners can do it: a short oral round, a written sentence, a thumbs-up check on three examples."],"ar":["\u003cstrong>Choose one or two Use of English objectives.\u003c/strong> For example 3Ug.09 (comparative and superlative adjectives) or 5Ug.07 (present perfect with for and since). Keep this small.","\u003cstrong>Choose a theme or context that is relevant to your learners.\u003c/strong> The framework has no list of topics, so you decide: pets, the school trip, a family meal, the weather in Sharjah.","\u003cstrong>Add objectives from other strands\u003c/strong> that fit the theme naturally: usually one receptive (Listening or Reading) and one productive (Speaking or Writing). Add the others if they come naturally, for example in a short review.","\u003cstrong>Order the tasks from receptive to productive.\u003c/strong> Learners meet the language in a listening or reading text first, then practise it in controlled tasks, then use it more freely in speaking or writing.","\u003cstrong>Plan the support.\u003c/strong> The wording of the objectives (\"with support\", \"with little or no support\") tells you how much help your stage expects. Decide what help you will give: a word bank, a picture, a model sentence, a partner.","\u003cstrong>Write a can-do success statement and a quick check.\u003c/strong> For example, \"I can describe two animals using comparative adjectives.\" Plan how you will see whether learners can do it: a short oral round, a written sentence, a thumbs-up check on three examples."]}},{"t":"h","c":{"en":"A lesson shape that works for many classes (good practice)","ar":"A lesson shape that works for many classes (good practice)"}},{"t":"table","head":{"en":["Phase","What happens","Skills used"],"ar":["Phase","What happens","Skills used"]},"rows":[{"en":["Lead-in (3 to 5 min)","A picture, object or question connects to the theme and wakes up known vocabulary.","Speaking, Listening"],"ar":["Lead-in (3 to 5 min)","A picture, object or question connects to the theme and wakes up known vocabulary.","Speaking, Listening"]},{"en":["Input (8 to 10 min)","Learners listen to or read a short text and complete a simple task, such as ticking true or false.","Listening or Reading"],"ar":["Input (8 to 10 min)","Learners listen to or read a short text and complete a simple task, such as ticking true or false.","Listening or Reading"]},{"en":["Language focus (8 to 10 min)","Notice the target language in the text, say it, and practise it in a controlled task such as gap fill or matching.","Use of English, Speaking"],"ar":["Language focus (8 to 10 min)","Notice the target language in the text, say it, and practise it in a controlled task such as gap fill or matching.","Use of English, Speaking"]},{"en":["Use it (10 to 12 min)","A freer task with a real purpose: interview a partner, describe a picture, write a short message.","Speaking and Writing"],"ar":["Use it (10 to 12 min)","A freer task with a real purpose: interview a partner, describe a picture, write a short message.","Speaking and Writing"]},{"en":["Review (3 to 5 min)","Learners share one sentence, or check their success statement. Teacher notes common errors for next time.","All skills, assessment"],"ar":["Review (3 to 5 min)","Learners share one sentence, or check their success statement. Teacher notes common errors for next time.","All skills, assessment"]}]},{"t":"p","c":{"en":"Times are examples for a lesson of roughly 40 minutes; adjust them to your own timetable. The shape is flexible: some lessons will start with writing, some will end with a story, and a phonics routine may be added at Stages 1 and 2.","ar":"Times are examples for a lesson of roughly 40 minutes; adjust them to your own timetable. The shape is flexible: some lessons will start with writing, some will end with a story, and a phonics routine may be added at Stages 1 and 2."}},{"t":"h","c":{"en":"Worked example 1: Stage 1, \"My classroom\"","ar":"Worked example 1: Stage 1, \"My classroom\""}},{"t":"p","c":{"en":"The framework itself offers an Integrated approach example from the start of Stage 1: asking and responding to simple questions about personal information and classroom routines draws on listening and speaking, and on possessive adjectives and words to describe people and objects. Here is that idea as a lesson plan.","ar":"The framework itself offers an Integrated approach example from the start of Stage 1: asking and responding to simple questions about personal information and classroom routines draws on listening and speaking, and on possessive adjectives and words to describe people and objects. Here is that idea as a lesson plan."}},{"t":"list","c":{"en":["\u003cstrong>Use of English focus:\u003c/strong> 1Ug.06 use possessive adjectives to describe objects (my, your); 1Uv.04 basic prepositions of location (in, on, next to).","\u003cstrong>Listening:\u003c/strong> 1Ld.02 understand, with support, short simple instructions (\"Put your pencil on the desk\").","\u003cstrong>Speaking:\u003c/strong> 1Sc.03 ask simple questions about classroom routines; reply (\"Where is your book?\" \"My book is in my bag\").","\u003cstrong>Reading:\u003c/strong> 1Rd.03 understand, with support, simple words and phrases in short illustrated texts (labels on a classroom picture).","\u003cstrong>Writing:\u003c/strong> 1Wc.01 write, with support, words and short phrases to give personal and factual information (\"my book\", \"my pencil\").","\u003cstrong>Sequence:\u003c/strong> Total Physical Response game (learners follow instructions), then label a classroom picture, then pair question-and-answer with real objects, then write two labelled phrases from a word bank."],"ar":["\u003cstrong>Use of English focus:\u003c/strong> 1Ug.06 use possessive adjectives to describe objects (my, your); 1Uv.04 basic prepositions of location (in, on, next to).","\u003cstrong>Listening:\u003c/strong> 1Ld.02 understand, with support, short simple instructions (\"Put your pencil on the desk\").","\u003cstrong>Speaking:\u003c/strong> 1Sc.03 ask simple questions about classroom routines; reply (\"Where is your book?\" \"My book is in my bag\").","\u003cstrong>Reading:\u003c/strong> 1Rd.03 understand, with support, simple words and phrases in short illustrated texts (labels on a classroom picture).","\u003cstrong>Writing:\u003c/strong> 1Wc.01 write, with support, words and short phrases to give personal and factual information (\"my book\", \"my pencil\").","\u003cstrong>Sequence:\u003c/strong> Total Physical Response game (learners follow instructions), then label a classroom picture, then pair question-and-answer with real objects, then write two labelled phrases from a word bank."]}},{"t":"h","c":{"en":"Worked example 2: Stage 3, \"Two animals\"","ar":"Worked example 2: Stage 3, \"Two animals\""}},{"t":"list","c":{"en":["\u003cstrong>Use of English focus:\u003c/strong> 3Ug.09 common, comparative and superlative adjectives (big, bigger, the biggest); 3Uv.03 prepositions of location.","\u003cstrong>Listening:\u003c/strong> 3Lm.01 understand, with support, some of the main points of short talk (the teacher or a recording describes two animals).","\u003cstrong>Reading:\u003c/strong> 3Rd.01 understand, with support, most specific information and detail in short simple texts (a fact card).","\u003cstrong>Speaking:\u003c/strong> 3Sc.02 describe people, places and objects using sentences (\"A cheetah is faster than a lion\").","\u003cstrong>Writing:\u003c/strong> 3Wc.02 write, with support, short sentences that describe people, places and objects.","\u003cstrong>Sequence:\u003c/strong> listen and tick the animal described; read two fact cards and find three differences; say sentences with a partner; write three sentences using a sentence frame."],"ar":["\u003cstrong>Use of English focus:\u003c/strong> 3Ug.09 common, comparative and superlative adjectives (big, bigger, the biggest); 3Uv.03 prepositions of location.","\u003cstrong>Listening:\u003c/strong> 3Lm.01 understand, with support, some of the main points of short talk (the teacher or a recording describes two animals).","\u003cstrong>Reading:\u003c/strong> 3Rd.01 understand, with support, most specific information and detail in short simple texts (a fact card).","\u003cstrong>Speaking:\u003c/strong> 3Sc.02 describe people, places and objects using sentences (\"A cheetah is faster than a lion\").","\u003cstrong>Writing:\u003c/strong> 3Wc.02 write, with support, short sentences that describe people, places and objects.","\u003cstrong>Sequence:\u003c/strong> listen and tick the animal described; read two fact cards and find three differences; say sentences with a partner; write three sentences using a sentence frame."]}},{"t":"h","c":{"en":"Worked example 3: Stage 5, \"My hobby\"","ar":"Worked example 3: Stage 5, \"My hobby\""}},{"t":"list","c":{"en":["\u003cstrong>Use of English focus:\u003c/strong> 5Ug.07 present perfect forms with for and since; 5Us.03 connectives (so, when) in short texts.","\u003cstrong>Listening:\u003c/strong> 5Lo.01 recognise the opinions of the speaker(s) in short talk (three short recordings of children talking about a hobby: who likes it and who does not?).","\u003cstrong>Reading:\u003c/strong> 5Ro.01 recognise the opinions of the writer(s) in short texts.","\u003cstrong>Speaking:\u003c/strong> 5So.01 express, with little or no support, opinions and feelings (\"I have played football since I was six, so I think it is great\").","\u003cstrong>Writing:\u003c/strong> 5Wc.03 express, with little or no support, opinions and feelings, in two or three sentences."],"ar":["\u003cstrong>Use of English focus:\u003c/strong> 5Ug.07 present perfect forms with for and since; 5Us.03 connectives (so, when) in short texts.","\u003cstrong>Listening:\u003c/strong> 5Lo.01 recognise the opinions of the speaker(s) in short talk (three short recordings of children talking about a hobby: who likes it and who does not?).","\u003cstrong>Reading:\u003c/strong> 5Ro.01 recognise the opinions of the writer(s) in short texts.","\u003cstrong>Speaking:\u003c/strong> 5So.01 express, with little or no support, opinions and feelings (\"I have played football since I was six, so I think it is great\").","\u003cstrong>Writing:\u003c/strong> 5Wc.03 express, with little or no support, opinions and feelings, in two or three sentences."]}},{"t":"h","c":{"en":"Worked example 4: Stage 6, \"School rules debate\"","ar":"Worked example 4: Stage 6, \"School rules debate\""}},{"t":"list","c":{"en":["\u003cstrong>Use of English focus:\u003c/strong> 6Ug.12 an increasing range of modal forms such as should and ought to for advice or obligation; 6Us.04 connectives such as while, until and as soon as.","\u003cstrong>Reading:\u003c/strong> 6Rd.03 understand, with support, most of the detail of an argument in short and extended texts (an email asking for a longer break).","\u003cstrong>Speaking:\u003c/strong> 6Sor.02 briefly summarise what others say, with support, in order to reach a shared outcome (group agrees three class rules).","\u003cstrong>Writing:\u003c/strong> 6Wor.02 link sentences using an increasing range of connectives to create a short text organised into paragraphs."],"ar":["\u003cstrong>Use of English focus:\u003c/strong> 6Ug.12 an increasing range of modal forms such as should and ought to for advice or obligation; 6Us.04 connectives such as while, until and as soon as.","\u003cstrong>Reading:\u003c/strong> 6Rd.03 understand, with support, most of the detail of an argument in short and extended texts (an email asking for a longer break).","\u003cstrong>Speaking:\u003c/strong> 6Sor.02 briefly summarise what others say, with support, in order to reach a shared outcome (group agrees three class rules).","\u003cstrong>Writing:\u003c/strong> 6Wor.02 link sentences using an increasing range of connectives to create a short text organised into paragraphs."]}},{"t":"table","head":{"en":["Stage","Main language focus","Typical amount of support shown by the objective wording","Typical output"],"ar":["Stage","Main language focus","Typical amount of support shown by the objective wording","Typical output"]},"rows":[{"en":["1","1Ug.06, 1Uv.04","\"with support\" appears in most listening and reading objectives","Words and short phrases"],"ar":["1","1Ug.06, 1Uv.04","\"with support\" appears in most listening and reading objectives","Words and short phrases"]},{"en":["3","3Ug.09","\"with support\" for most listening and reading detail; writing is \"with support\"","Short sentences"],"ar":["3","3Ug.09","\"with support\" for most listening and reading detail; writing is \"with support\"","Short sentences"]},{"en":["5","5Ug.07, 5Us.03","\"with little or no support\" for many reading, speaking and writing objectives","Short sequence of sentences, two or three"],"ar":["5","5Ug.07, 5Us.03","\"with little or no support\" for many reading, speaking and writing objectives","Short sequence of sentences, two or three"]},{"en":["6","6Ug.12, 6Us.04","\"with support\" returns for longer texts; more independent writing","Short text organised into paragraphs"],"ar":["6","6Ug.12, 6Us.04","\"with support\" returns for longer texts; more independent writing","Short text organised into paragraphs"]}]},{"t":"callout","k":"warn","title":{"en":"Common planning errors","ar":"Common planning errors"},"c":{"en":"\u003cstrong>Too many objectives:\u003c/strong> a lesson with eight objectives cannot be checked. Choose one or two, and let others be present naturally. \u003cstrong>All four skills but no real purpose:\u003c/strong> a listening, a reading, a speaking and a writing task on four unrelated topics is not integration. \u003cstrong>Grammar at the end only:\u003c/strong> the framework says Use of English should be a focus of each lesson, so do not leave language until the last five minutes.","ar":"\u003cstrong>Too many objectives:\u003c/strong> a lesson with eight objectives cannot be checked. Choose one or two, and let others be present naturally. \u003cstrong>All four skills but no real purpose:\u003c/strong> a listening, a reading, a speaking and a writing task on four unrelated topics is not integration. \u003cstrong>Grammar at the end only:\u003c/strong> the framework says Use of English should be a focus of each lesson, so do not leave language until the last five minutes."}},{"t":"scenario","title":{"en":"Scenario: planning for the Stage 4 class","ar":"Scenario: planning for the Stage 4 class"},"c":{"en":"A Stage 4 teacher wants a lesson on \"A trip to the zoo\". She lists 4Ug.08 (present perfect for indefinite time), 4Ug.09 (will and going to), 4Uv.03 (yet, ever, already), 4Sc.03, 4Rd.01, 4Ld.04 and 4Wc.02. She worries that it is too much. Advise her: choose 4Ug.08 and 4Uv.03 as the language focus (\"Have you ever seen a camel? Yes, I have already seen one\"), keep 4Sc.03 for a pair survey (ask questions to find out general information), use 4Rd.01 for a short text, and move 4Ug.09, 4Ld.04 and 4Wc.02 to another lesson in the unit. The unit as a whole will still cover them.","ar":"A Stage 4 teacher wants a lesson on \"A trip to the zoo\". She lists 4Ug.08 (present perfect for indefinite time), 4Ug.09 (will and going to), 4Uv.03 (yet, ever, already), 4Sc.03, 4Rd.01, 4Ld.04 and 4Wc.02. She worries that it is too much. Advise her: choose 4Ug.08 and 4Uv.03 as the language focus (\"Have you ever seen a camel? Yes, I have already seen one\"), keep 4Sc.03 for a pair survey (ask questions to find out general information), use 4Rd.01 for a short text, and move 4Ug.09, 4Ld.04 and 4Wc.02 to another lesson in the unit. The unit as a whole will still cover them."}}],"checks":[{"id":"m3q1","q":{"en":"What does the framework say about each lesson and unit in English as a Second Language?","ar":"What does the framework say about each lesson and unit in English as a Second Language?"},"opts":[{"en":"They should give equal time to all five strands and test each strand at the end of the lesson","ar":"They should give eq
