ual time to all five strands and test each strand at the end of the lesson"},{"en":"They should focus on one skill only, so that Use of English can be taught separately","ar":"They should focus on one skill only, so that Use of English can be taught separately"},{"en":"They should offer practice of all four skills and a focus on at least one Use of English objective","ar":"They should offer practice of all four skills and a focus on at least one Use of English objective"},{"en":"They should follow the scheme of work order and use only the activities in the scheme","ar":"They should follow the scheme of work order and use only the activities in the scheme"}],"correct":2,"expl":{"en":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English learning objectives.","ar":"The framework says each lesson and unit need to provide opportunities for practice of all four skills as well as a focus on one or more Use of English learning objectives."}},{"id":"m3q2","q":{"en":"In the Stage 1 'My classroom' lesson, which objective is mainly about asking and answering questions?","ar":"In the Stage 1 'My classroom' lesson, which objective is mainly about asking and answering questions?"},"opts":[{"en":"1Rd.03","ar":"1Rd.03"},{"en":"1Ug.06","ar":"1Ug.06"},{"en":"1Ld.02","ar":"1Ld.02"},{"en":"1Sc.03","ar":"1Sc.03"}],"correct":3,"expl":{"en":"1Sc.03 asks learners to ask simple questions about classroom routines and respond. 1Rd.03 is reading, 1Ug.06 is Use of English and 1Ld.02 is Listening.","ar":"1Sc.03 asks learners to ask simple questions about classroom routines and respond. 1Rd.03 is reading, 1Ug.06 is Use of English and 1Ld.02 is Listening."}},{"id":"m3q3","q":{"en":"Which sequence follows the good-practice lesson shape described in this module?","ar":"Which sequence follows the good-practice lesson shape described in this module?"},"opts":[{"en":"Lead-in, input, language focus, freer use, review","ar":"Lead-in, input, language focus, freer use, review"},{"en":"Review, language focus, freer use, input, lead-in","ar":"Review, language focus, freer use, input, lead-in"},{"en":"Language focus, test, lead-in, freer use, input","ar":"Language focus, test, lead-in, freer use, input"},{"en":"Input, freer use, review, lead-in, language focus","ar":"Input, freer use, review, lead-in, language focus"}],"correct":0,"expl":{"en":"The lesson shape moves from a lead-in to receptive input, then language focus, then freer use with a purpose, and ends with a review.","ar":"The lesson shape moves from a lead-in to receptive input, then language focus, then freer use with a purpose, and ends with a review."}}]},{"id":"m4","title":{"en":"Teaching Reading and Writing Well","ar":"Teaching Reading and Writing Well"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Reading and writing are the skills most often seen in learners' books, and in many schools they get the most lesson time. They are also the skills where the framework gives the clearest guide to progress, because the wording of the objectives changes in a pattern from stage to stage. This module shows how to read that pattern and use it to choose texts, give the right amount of support and give useful feedback. Items marked \u003cstrong>good practice\u003c/strong> are suggestions, not Cambridge requirements.","ar":"Reading and writing are the skills most often seen in learners' books, and in many schools they get the most lesson time. They are also the skills where the framework gives the clearest guide to progress, because the wording of the objectives changes in a pattern from stage to stage. This module shows how to read that pattern and use it to choose texts, give the right amount of support and give useful feedback. Items marked \u003cstrong>good practice\u003c/strong> are suggestions, not Cambridge requirements."}},{"t":"h","c":{"en":"Choosing texts: what the framework tells you","ar":"Choosing texts: what the framework tells you"}},{"t":"p","c":{"en":"The framework gives several signals about reading material:","ar":"The framework gives several signals about reading material:"}},{"t":"list","c":{"en":["\u003cstrong>Length and complexity.\u003c/strong> At Stages 1 to 5 the objectives refer to \"short\", \"simple\" texts, for example 3Rm.01 and 4Rd.01. Only at Stage 6 do they mention \"short and extended texts\" (6Rm.01 and 6Rd.01). So extended texts are first expected at Stage 6.","\u003cstrong>Illustrated texts early on.\u003c/strong> 1Rd.03 and 2Rd.02 mention short, simple, illustrated texts, and 1Rd.04 and 2Rd.04 link familiar words to pictures. Pictures are a support, not a distraction.","\u003cstrong>Fiction and non-fiction.\u003c/strong> From Stage 2, objectives mention reading \"short, simple fiction and non-fiction texts with confidence and enjoyment\" (2Rm.02, 3Rm.02, 4Rm.02, 5Rm.02, 6Rm.02). Enjoyment is part of the objective.","\u003cstrong>Authentic language.\u003c/strong> The integrated approach wants learners exposed to real language, defined in the glossary as language used in real situations.","\u003cstrong>Instructions.\u003c/strong> Every stage from 2 to 6 has an objective about reading and following instructions (2Rd.03, 3Rd.02, 4Rd.02, 5Rd.02, 6Rd.02). Recipes, game rules and safety notices are all useful texts."],"ar":["\u003cstrong>Length and complexity.\u003c/strong> At Stages 1 to 5 the objectives refer to \"short\", \"simple\" texts, for example 3Rm.01 and 4Rd.01. Only at Stage 6 do they mention \"short and extended texts\" (6Rm.01 and 6Rd.01). So extended texts are first expected at Stage 6.","\u003cstrong>Illustrated texts early on.\u003c/strong> 1Rd.03 and 2Rd.02 mention short, simple, illustrated texts, and 1Rd.04 and 2Rd.04 link familiar words to pictures. Pictures are a support, not a distraction.","\u003cstrong>Fiction and non-fiction.\u003c/strong> From Stage 2, objectives mention reading \"short, simple fiction and non-fiction texts with confidence and enjoyment\" (2Rm.02, 3Rm.02, 4Rm.02, 5Rm.02, 6Rm.02). Enjoyment is part of the objective.","\u003cstrong>Authentic language.\u003c/strong> The integrated approach wants learners exposed to real language, defined in the glossary as language used in real situations.","\u003cstrong>Instructions.\u003c/strong> Every stage from 2 to 6 has an objective about reading and following instructions (2Rd.03, 3Rd.02, 4Rd.02, 5Rd.02, 6Rd.02). Recipes, game rules and safety notices are all useful texts."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: a quick text-choice check","ar":"Good practice: a quick text-choice check"},"c":{"en":"Before using a text, ask four questions. (1) Is it short enough for the stage? (2) Does it include the target language naturally? (3) Will about 90 to 95 per cent of the words be understood with support from pictures, so that learners can focus on meaning? (4) Is the topic interesting for these learners, in this country? The 90 to 95 per cent figure is a common teaching rule of thumb and is not in the framework.","ar":"Before using a text, ask four questions. (1) Is it short enough for the stage? (2) Does it include the target language naturally? (3) Will about 90 to 95 per cent of the words be understood with support from pictures, so that learners can focus on meaning? (4) Is the topic interesting for these learners, in this country? The 90 to 95 per cent figure is a common teaching rule of thumb and is not in the framework."}},{"t":"h","c":{"en":"Reading the support pattern: a stage comparison","ar":"Reading the support pattern: a stage comparison"}},{"t":"p","c":{"en":"Look at how Reading for detail changes. The framework uses phrases such as \"with support\" and \"with little or no support\" to show how independent learners are expected to become.","ar":"Look at how Reading for detail changes. The framework uses phrases such as \"with support\" and \"with little or no support\" to show how independent learners are expected to become."}},{"t":"table","head":{"en":["Stage","Code and focus","How much support, and how much text"],"ar":["Stage","Code and focus","How much support, and how much text"]},"rows":[{"en":["2","2Rd.02 specific information in short, simple, illustrated texts","With support; \"some\" specific information"],"ar":["2","2Rd.02 specific information in short, simple, illustrated texts","With support; \"some\" specific information"]},{"en":["3","3Rd.01 specific information in short, simple texts","With support; \"most\" specific information"],"ar":["3","3Rd.01 specific information in short, simple texts","With support; \"most\" specific information"]},{"en":["4","4Rd.01 specific information in short, simple texts","With little or no support; \"most\" specific information"],"ar":["4","4Rd.01 specific information in short, simple texts","With little or no support; \"most\" specific information"]},{"en":["5","5Rd.01 specific information in short texts","No support phrase; \"most\" specific information; \"simple\" no longer stated"],"ar":["5","5Rd.01 specific information in short texts","No support phrase; \"most\" specific information; \"simple\" no longer stated"]},{"en":["6","6Rd.01 specific information in short and extended texts","With support again, because extended texts are harder"],"ar":["6","6Rd.01 specific information in short and extended texts","With support again, because extended texts are harder"]}]},{"t":"p","c":{"en":"This pattern teaches us something important. \"With support\" returns at Stage 6 because the texts get longer and harder. Support is not a sign of weakness; it is how the framework keeps a task achievable. A Stage 6 teacher who gives learners a glossary of five key words before an extended text is working with the framework, not against it.","ar":"This pattern teaches us something important. \"With support\" returns at Stage 6 because the texts get longer and harder. Support is not a sign of weakness; it is how the framework keeps a task achievable. A Stage 6 teacher who gives learners a glossary of five key words before an extended text is working with the framework, not against it."}},{"t":"h","c":{"en":"Scaffolding and modelling reading (good practice)","ar":"Scaffolding and modelling reading (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Before reading:\u003c/strong> look at the title and pictures, predict, and teach only the three or four words without which the text cannot be understood. Do not pre-teach every new word.","\u003cstrong>First reading for the main point:\u003c/strong> a global-meaning task such as \"What is this text about?\" (Reading for global meaning, for example 3Rm.01).","\u003cstrong>Second reading for detail:\u003c/strong> true/false, matching, or answering questions (Reading for detail).","\u003cstrong>Meaning from context:\u003c/strong> choose one word and show how to work out its meaning from the sentence (3Rd.03 and 4Rd.03 name this skill). Think aloud: \"I don't know 'enormous'. The text says 'the elephant is enormous, bigger than the car', so enormous means very big.\"","\u003cstrong>After reading:\u003c/strong> learners say or write something using what they read, linking to Speaking and Writing."],"ar":["\u003cstrong>Before reading:\u003c/strong> look at the title and pictures, predict, and teach only the three or four words without which the text cannot be understood. Do not pre-teach every new word.","\u003cstrong>First reading for the main point:\u003c/strong> a global-meaning task such as \"What is this text about?\" (Reading for global meaning, for example 3Rm.01).","\u003cstrong>Second reading for detail:\u003c/strong> true/false, matching, or answering questions (Reading for detail).","\u003cstrong>Meaning from context:\u003c/strong> choose one word and show how to work out its meaning from the sentence (3Rd.03 and 4Rd.03 name this skill). Think aloud: \"I don't know 'enormous'. The text says 'the elephant is enormous, bigger than the car', so enormous means very big.\"","\u003cstrong>After reading:\u003c/strong> learners say or write something using what they read, linking to Speaking and Writing."]}},{"t":"h","c":{"en":"Reading for opinion","ar":"Reading for opinion"}},{"t":"p","c":{"en":"Reading for opinion first appears in Stage 3 (3Ro.01, with support) and continues in Stages 4, 5 and 6. It is easy to miss because many reading lessons only ask factual questions. A simple good-practice activity: give learners two short reviews of the same film, one positive and one negative, and ask them to underline the words that show the writer's opinion (great, boring, I think, in my opinion). This also prepares them for the opinion objectives in Writing (3Wc.03 onwards).","ar":"Reading for opinion first appears in Stage 3 (3Ro.01, with support) and continues in Stages 4, 5 and 6. It is easy to miss because many reading lessons only ask factual questions. A simple good-practice activity: give learners two short reviews of the same film, one positive and one negative, and ask them to underline the words that show the writer's opinion (great, boring, I think, in my opinion). This also prepares them for the opinion objectives in Writing (3Wc.03 onwards)."}},{"t":"h","c":{"en":"Teaching writing: how the objectives grow","ar":"Teaching writing: how the objectives grow"}},{"t":"p","c":{"en":"The Writing strand has three sub-strands: Communicative achievement (letters, spelling, handwriting, planning, grammar), Organisation (punctuation, linking and layout) and Content (what is written for which purpose). Here is how a writing task grows from Stage 1 to Stage 6.","ar":"The Writing strand has three sub-strands: Communicative achievement (letters, spelling, handwriting, planning, grammar), Organisation (punctuation, linking and layout) and Content (what is written for which purpose). Here is how a writing task grows from Stage 1 to Stage 6."}},{"t":"table","head":{"en":["Stage","What learners write (Content)","What is added in Organisation","Process"],"ar":["Stage","What learners write (Content)","What is added in Organisation","Process"]},"rows":[{"en":["1","Words and short phrases to give personal information (1Wc.01)","No Organisation objectives yet; the focus is writing letters left to right and forming them (1Wca.01, 1Wca.02)","Guided writing"],"ar":["1","Words and short phrases to give personal information (1Wc.01)","No Organisation objectives yet; the focus is writing letters left to right and forming them (1Wca.01, 1Wca.02)","Guided writing"]},{"en":["2","Simple phrases, basic feelings (2Wc.01, 2Wc.02)","Basic punctuation, linking with connectives (2Wor.01, 2Wor.02)","Plan and write phrases and short sentences, with support (2Wca.04)"],"ar":["2","Simple phrases, basic feelings (2Wc.01, 2Wc.02)","Basic punctuation, linking with connectives (2Wor.01, 2Wor.02)","Plan and write phrases and short sentences, with support (2Wca.04)"]},{"en":["3","Short instructions, short sentences, basic opinions (3Wc.01 to 3Wc.03)","Exclamation mark, linking with little or no support (3Wor.01, 3Wor.02)","Plan, write and check sentences, with support (3Wca.04)"],"ar":["3","Short instructions, short sentences, basic opinions (3Wc.01 to 3Wc.03)","Exclamation mark, linking with little or no support (3Wor.01, 3Wor.02)","Plan, write and check sentences, with support (3Wca.04)"]},{"en":["4","A short sequence of instructions or sentences (4Wc.01, 4Wc.02)","Paragraph punctuation and layout for some genres, with support (4Wor.01 to 4Wor.03)","Plan, write, edit and proofread a paragraph, with support (4Wca.03)"],"ar":["4","A short sequence of instructions or sentences (4Wc.01, 4Wc.02)","Paragraph punctuation and layout for some genres, with support (4Wor.01 to 4Wor.03)","Plan, write, edit and proofread a paragraph, with support (4Wca.03)"]},{"en":["5","Short sequences with little or no support (5Wc.01 to 5Wc.03)","A short text organised into paragraphs (5Wor.02)","Plan, write, edit and proofread short texts, with support (5Wca.03)"],"ar":["5","Short sequences with little or no support (5Wc.01 to 5Wc.03)","A short text organised into paragraphs (5Wor.02)","Plan, write, edit and proofread short texts, with support (5Wca.03)"]},{"en":["6","A sequence of instructions; short descriptive texts; opinions (6Wc.01 to 6Wc.03)","Short text organised into paragraphs, layout for a limited range of genres (6Wor.02, 6Wor.03)","Plan, write, edit and proofread, with little or no support (6Wca.03)"],"ar":["6","A sequence of instructions; short descriptive texts; opinions (6Wc.01 to 6Wc.03)","Short text organised into paragraphs, layout for a limited range of genres (6Wor.02, 6Wor.03)","Plan, write, edit and proofread, with little or no support (6Wca.03)"]}]},{"t":"p","c":{"en":"Notice that planning, editing and proofreading appear as skills in their own right from Stages 2 to 6. A writing lesson that only asks learners to produce a final piece, without planning or checking, is missing part of the objective.","ar":"Notice that planning, editing and proofreading appear as skills in their own right from Stages 2 to 6. A writing lesson that only asks learners to produce a final piece, without planning or checking, is missing part of the objective."}},{"t":"h","c":{"en":"Teaching writing: modelling and scaffolding (good practice)","ar":"Teaching writing: modelling and scaffolding (good practice)"}},{"t":"steps","c":{"en":["\u003cstrong>Model:\u003c/strong> write a short example in front of the class, thinking aloud about the choice of words and connectives.","\u003cstrong>Share:\u003c/strong> write a second example together, with learners suggesting the words.","\u003cstrong>Support:\u003c/strong> give a frame (\"My favourite animal is ___ because it ___\"), a word bank, or a planning grid, matching the \"with support\" wording of the objective.","\u003cstrong>Write:\u003c/strong> learners write alone or in pairs; the teacher moves around and notes common errors.","\u003cstrong>Check:\u003c/strong> learners use a short checklist (capital letter, full stop, connective, spelling of three key words) before handing in."],"ar":["\u003cstrong>Model:\u003c/strong> write a short example in front of the class, thinking aloud about the choice of words and connectives.","\u003cstrong>Share:\u003c/strong> write a second example together, with learners suggesting the words.","\u003cstrong>Support:\u003c/strong> give a frame (\"My favourite animal is ___ because it ___\"), a word bank, or a planning grid, matching the \"with support\" wording of the objective.","\u003cstrong>Write:\u003c/strong> learners write alone or in pairs; the teacher moves around and notes common errors.","\u003cstrong>Check:\u003c/strong> learners use a short checklist (capital letter, full stop, connective, spelling of three key words) before handing in."]}},{"t":"h","c":{"en":"Feedback: how many mistakes should we expect?","ar":"Feedback: how many mistakes should we expect?"}},{"t":"p","c":{"en":"The framework's wording about accuracy is a very useful guide for feedback. It does not expect perfect accuracy. It expects accuracy to improve across stages.","ar":"The framework's wording about accuracy is a very useful guide for feedback. It does not expect perfect accuracy. It expects accuracy to improve across stages."}},{"t":"table","head":{"en":["Stage","Code","What the objective says about mistakes"],"ar":["Stage","Code","What the objective says about mistakes"]},"rows":[{"en":["1","1Wca.05","Begin to use a limited range of simple grammatical structures, allowing for frequent, basic mistakes"],"ar":["1","1Wca.05","Begin to use a limited range of simple grammatical structures, allowing for frequent, basic mistakes"]},{"en":["3","3Wca.05","Use some simple structures and sentence patterns correctly, allowing for frequent, basic mistakes"],"ar":["3","3Wca.05","Use some simple structures and sentence patterns correctly, allowing for frequent, basic mistakes"]},{"en":["4","4Wca.04","Use some simple structures and patterns correctly, allowing for some mistakes"],"ar":["4","4Wca.04","Use some simple structures and patterns correctly, allowing for some mistakes"]},{"en":["5","5Wca.04","Use simple structures and patterns correctly, allowing for occasional mistakes"],"ar":["5","5Wca.04","Use simple structures and patterns correctly, allowing for occasional mistakes"]},{"en":["6","6Wca.04","Use grammatical structures correctly, allowing for occasional mistakes"],"ar":["6","6Wca.04","Use grammatical structures correctly, allowing for occasional mistakes"]}]},{"t":"callout","k":"tip","title":{"en":"Good practice for feedback","ar":"Good practice for feedback"},"c":{"en":"Use the framework's expectations to decide what to correct. A Stage 3 learner who writes \"She have a dog\" is making a frequent basic mistake that the framework allows for; praise the meaning and highlight only the one or two errors linked to the lesson's target language. A Stage 6 learner is expected to make only occasional mistakes, so you can ask for more self-correction. Give feedback on \u003cem>one or two\u003c/em> priorities, ask learners to find and fix the errors themselves, and then check that they have done so. Red ink over a whole page rarely helps an ESL learner.","ar":"Use the framework's expectations to decide what to correct. A Stage 3 learner who writes \"She have a dog\" is making a frequent basic mistake that the framework allows for; praise the meaning and highlight only the one or two errors linked to the lesson's target language. A Stage 6 learner is expected to make only occasional mistakes, so you can ask for more self-correction. Give feedback on \u003cem>one or two\u003c/em> priorities, ask learners to find and fix the errors themselves, and then check that they have done so. Red ink over a whole page rarely helps an ESL learner."}},{"t":"scenario","title":{"en":"Scenario: the polished paragraph","ar":"Scenario: the polished paragraph"},"c":{"en":"A Stage 4 teacher notices that one pupil copied a perfect paragraph from a book. The pupil can read it aloud but cannot answer simple questions about it. What should the teacher do? The objective 4Wca.03 asks learners to plan, write, edit and proofread a short sequence of sentences, with support. The teacher can ask the learner to plan first using a planning grid, then write three sentences in his own words with a frame, and finally edit them together. Copying is not evidence of the objective, and the support should be matched to what the learner can do independently.","ar":"A Stage 4 teacher notices that one pupil copied a perfect paragraph from a book. The pupil can read it aloud but cannot answer simple questions about it. What should the teacher do? The objective 4Wca.03 asks learners to plan, write, edit and proofread a short sequence of sentences, with support. The teacher can ask the learner to plan first using a planning grid, then write three sentences in his own words with a frame, and finally edit them together. Copying is not evidence of the objective, and the support should be matched to what the learner can do independently."}}],"checks":[{"id":"m4q1","q":{"en":"At which stage do the reading objectives first mention \"short and extended\" texts?","ar":"At which stage do the reading objectives first mention \"short and extended\" texts?"},"opts":[{"en":"Stage 3","ar":"Stage 3"},{"en":"Stage 6","ar":"Stage 6"},{"en":"Stage 4","ar":"Stage 4"},{"en":"Stage 5","ar":"Stage 5"}],"correct":1,"expl":{"en":"Stages 1 to 5 refer to short texts. 'Short and extended texts' appears in the Stage 6 reading objectives, for example 6Rm.01 and 6Rd.01.","ar":"Stages 1 to 5 refer to short texts. 'Short and extended texts' appears in the Stage 6 reading objectives, for example 6Rm.01 and 6Rd.01."}},{"id":"m4q2","q":{"en":"What does objective 4Wca.03 ask Stage 4 learners to do?","ar":"What does objective 4Wca.03 ask Stage 4 learners to do?"},"opts":[{"en":"Write a full story of several paragraphs with little or no support from the teacher","ar":"Write a full story of several paragraphs with little or no support from the teacher"},{"en":"Copy a model paragraph accurately and add a title and a picture of their own","ar":"Copy a model paragraph accurately and add a title and a picture of their own"},{"en":"Plan, write, edit and proofread a short sequence of sentences in a paragraph, with support","ar":"Plan, write, edit and proofread a short sequence of sentences in a paragraph, with support"},{"en":"Write and check single sentences using a dictionary and a word bank independently","ar":"Write and check single sentences using a dictionary and a word bank independently"}],"correct":2,"expl":{"en":"4Wca.03 is a Writing, Communicative achievement objective about planning, writing, editing and proofreading a short sequence of sentences in a paragraph, with support.","ar":"4Wca.03 is a Writing, Communicative achievement objective about planning, writing, editing and proofreading a short sequence of sentences in a paragraph, with support."}},{"id":"m4q3","q":{"en":"A Stage 3 pupil writes \"She have a dog\". Using the framework's wording about mistakes, what is the best response?","ar":"A Stage 3 pupil writes \"She have a dog\". Using the framework's wording about mistakes, what is the best response?"},"opts":[{"en":"Correct every error on the page, because Stage 3 writing should be fully accurate","ar":"Correct every error on the page, because Stage 3 writing should be fully accurate"},{"en":"Ignore the sentence, because mistakes are not part of the Stage 3 objectives","ar":"Ignore the sentence, because mistakes are not part of the Stage 3 objectives"},{"en":"Ask the pupil to rewrite the whole page until it has no mistakes at all","ar":"Ask the pupil to rewrite the whole page until it has no mistakes at all"},{"en":"Accept that frequent basic mistakes are expected, and focus on one or two target errors","ar":"Accept that frequent basic mistakes are expected, and focus on one or two target errors"}],"correct":3,"expl":{"en":"3Wca.05 allows for frequent, basic mistakes at Stage 3, so feedback should be selective and focus on the target language.","ar":"3Wca.05 allows for frequent, basic mistakes at Stage 3, so feedback should be selective and focus on the target language."}}]},{"id":"m5","title":{"en":"Teaching Listening, Speaking and Use of English","ar":"Teaching Listening, Speaking and Use of English"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Listening and speaking are the skills most learners need first and use most in real life, yet they leave no paper trail and are easy to under-plan. Use of English is the strand that carries the grammar and vocabulary. This module looks at how the framework describes each of these and offers good practice for teaching them, then turns to two practical challenges: classes with mixed levels, and the use of learners' first language.","ar":"Listening and speaking are the skills most learners need first and use most in real life, yet they leave no paper trail and are easy to under-plan. Use of English is the strand that carries the grammar and vocabulary. This module looks at how the framework describes each of these and offers good practice for teaching them, then turns to two practical challenges: classes with mixed levels, and the use of learners' first language."}},{"t":"h","c":{"en":"Teaching listening","ar":"Teaching listening"}},{"t":"p","c":{"en":"Listening has three sub-strands: Listening for global meaning, Listening for detail and Listening for opinion. The framework says their names deliberately match the Reading sub-strands \"to help you to identify links between Reading and Listening skills\". A reading lesson and a listening lesson can therefore ask very similar questions: What is it about? What is the specific information? What does the speaker think?","ar":"Listening has three sub-strands: Listening for global meaning, Listening for detail and Listening for opinion. The framework says their names deliberately match the Reading sub-strands \"to help you to identify links between Reading and Listening skills\". A reading lesson and a listening lesson can therefore ask very similar questions: What is it about? What is the specific information? What does the speaker think?"}},{"t":"list","c":{"en":["\u003cstrong>Talk is short until Stage 6.\u003c/strong> Objectives from Stage 1 to Stage 5 refer to \"short talk\". \"Short and extended talk\" appears at Stage 6 (6Lm.01, 6Ld.04, 6Lo.01).","\u003cstrong>Support reduces gradually.\u003c/strong> Compare 3Ld.04 (understand, with support, most specific information of short talk) with 4Ld.04 (with little or no support). By Stage 5, 5Ld.04 gives no support phrase.","\u003cstrong>It starts very small.\u003c/strong> 1Ld.01 asks learners to recognise a limited range of simple words that are spelled out slowly and clearly. 1Ld.02 and 1Ld.03 cover short simple instructions and questions.","\u003cstrong>Arguments at Stage 6.\u003c/strong> 6Ld.05 asks learners to understand, with support, most of the detail of an argument in short and extended talk."],"ar":["\u003cstrong>Talk is short until Stage 6.\u003c/strong> Objectives from Stage 1 to Stage 5 refer to \"short talk\". \"Short and extended talk\" appears at Stage 6 (6Lm.01, 6Ld.04, 6Lo.01).","\u003cstrong>Support reduces gradually.\u003c/strong> Compare 3Ld.04 (understand, with support, most specific information of short talk) with 4Ld.04 (with little or no support). By Stage 5, 5Ld.04 gives no support phrase.","\u003cstrong>It starts very small.\u003c/strong> 1Ld.01 asks learners to recognise a limited range of simple words that are spelled out slowly and clearly. 1Ld.02 and 1Ld.03 cover short simple instructions and questions.","\u003cstrong>Arguments at Stage 6.\u003c/strong> 6Ld.05 asks learners to understand, with support, most of the detail of an argument in short and extended talk."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: a three-listening routine","ar":"Good practice: a three-listening routine"},"c":{"en":"First listening: \"What is it about?\" (global meaning). Second listening: a detail task, such as filling a table. Third listening: check answers and notice a language point, for example the past simple verbs. Always set the task \u003cem>before\u003c/em> learners listen. Use your own voice often, but also use recordings, so that learners hear different voices and speeds.","ar":"First listening: \"What is it about?\" (global meaning). Second listening: a detail task, such as filling a table. Third listening: check answers and notice a language point, for example the past simple verbs. Always set the task \u003cem>before\u003c/em> learners listen. Use your own voice often, but also use recordings, so that learners hear different voices and speeds."}},{"t":"h","c":{"en":"Teaching speaking","ar":"Teaching speaking"}},{"t":"p","c":{"en":"Speaking has three sub-strands: Communication, Organisation and Express opinion. The Communication objectives (Sc) include pronunciation, grammar accuracy and asking questions as well as giving information. This is a lot for one sub-strand, so plan separate activities for them.","ar":"Speaking has three sub-strands: Communication, Organisation and Express opinion. The Communication objectives (Sc) include pronunciation, grammar accuracy and asking questions as well as giving information. This is a lot for one sub-strand, so plan separate activities for them."}},{"t":"p","c":{"en":"The framework's wording on \u003cstrong>pronunciation\u003c/strong> shows a gradual path, which tells you what to expect.","ar":"The framework's wording on \u003cstrong>pronunciation\u003c/strong> shows a gradual path, which tells you what to expect."}},{"t":"table","head":{"en":["Stage","Code","What the objective says (paraphrased)"],"ar":["Stage","Code","What the objective says (paraphrased)"]},"rows":[{"en":["1","1Sc.04","Reproduce correctly a limited range of sounds in simple, familiar words and phrases"],"ar":["1","1Sc.04","Reproduce correctly a limited range of sounds in simple, familiar words and phrases"]},{"en":["2","2Sc.04","Pronounce familiar words and phrases so that others can understand them with some effort"],"ar":["2","2Sc.04","Pronounce familiar words and phrases so that others can understand them with some effort"]},{"en":["3","3Sc.05","Pronounce familiar words and phrases so that they can generally be understood"],"ar":["3","3Sc.05","Pronounce familiar words and phrases so that they can generally be understood"]},{"en":["4","4Sc.05","Pronounce some familiar words clearly; others may need to ask for repetition"],"ar":["4","4Sc.05","Pronounce some familiar words clearly; others may need to ask for repetition"]},{"en":["5","5Sc.05","Pronounce familiar words and phrases clearly; others may sometimes ask for repetition"],"ar":["5","5Sc.05","Pronounce familiar words and phrases clearly; others may sometimes ask for repetition"]},{"en":["6","6Sc.05","Pronounce clearly; begin to use intonation and place stress at word, phrase and sentence level"],"ar":["6","6Sc.05","Pronounce clearly; begin to use intonation and place stress at word, phrase and sentence level"]}]},{"t":"p","c":{"en":"So at Stage 2 the aim is understandable pronunciation, \"with some effort\" from the listener. It is not native-like pronunciation. Stress and intonation are a new focus only at Stage 6. Many Stage 3 teachers over-correct individual sounds, when the objective is only that speech is \"generally understood\".","ar":"So at Stage 2 the aim is understandable pronunciation, \"with some effort\" from the listener. It is not native-like pronunciation. Stress and intonation are a new focus only at Stage 6. Many Stage 3 teachers over-correct individual sounds, when the objective is only that speech is \"generally understood\"."}},{"t":"p","c":{"en":"\u003cstrong>Turn-taking and interaction\u003c/strong> are in Organisation. They grow from taking turns in short, basic exchanges (1Sor.02, 2Sor.02) to initiating and maintaining (3Sor.02), then initiating, maintaining and concluding (4Sor.02, 5Sor.02), and finally summarising what others say to achieve a shared outcome (6Sor.02). \u003cstrong>Fluency\u003c/strong> is also described honestly: 3Sc.06 allows \"noticeable hesitation and false starts\", 4Sc.06 and 5Sc.06 allow \"some hesitation, false starts and reformulation\", and 6Sc.06 says learners \"begin to produce and maintain stretches of language comprehensibly\".","ar":"\u003cstrong>Turn-taking and interaction\u003c/strong> are in Organisation. They grow from taking turns in short, basic exchanges (1Sor.02, 2Sor.02) to initiating and maintaining (3Sor.02), then initiating, maintaining and concluding (4Sor.02, 5Sor.02), and finally summarising what others say to achieve a shared outcome (6Sor.02). \u003cstrong>Fluency\u003c/strong> is also described honestly: 3Sc.06 allows \"noticeable hesitation and false starts\", 4Sc.06 and 5Sc.06 allow \"some hesitation, false starts and reformulation\", and 6Sc.06 says learners \"begin to produce and maintain stretches of language comprehensibly\"."}},{"t":"callout","k":"tip","title":{"en":"Good practice: speaking activities that work in a class of 28","ar":"Good practice: speaking activities that work in a class of 28"},"c":{"en":"(1) \u003cstrong>Think-pair-share:\u003c/strong> every learner talks in pairs before anyone speaks to the class. (2) \u003cstrong>Information gap:\u003c/strong> partner A has half the information and partner B has the other half; they must ask questions (1Sc.03 to 6Sc.03). (3) \u003cstrong>Rehearse then perform:\u003c/strong> 1Sc.05 refers to \"short, isolated, rehearsed phrases\", so rehearsal is acceptable at Stage 1. (4) \u003cstrong>Record and replay\u003c/strong> on a school device so learners hear their own pronunciation. Give each learner a role so that no one dominates.","ar":"(1) \u003cstrong>Think-pair-share:\u003c/strong> every learner talks in pairs before anyone speaks to the class. (2) \u003cstrong>Information gap:\u003c/strong> partner A has half the information and partner B has the other half; they must ask questions (1Sc.03 to 6Sc.03). (3) \u003cstrong>Rehearse then perform:\u003c/strong> 1Sc.05 refers to \"short, isolated, rehearsed phrases\", so rehearsal is acceptable at Stage 1. (4) \u003cstrong>Record and replay\u003c/strong> on a school device so learners hear their own pronunciation. Give each learner a role so that no one dominates."}},{"t":"h","c":{"en":"Teaching Use of English: grammar in context","ar":"Teaching Use of English: grammar in context"}},{"t":"p","c":{"en":"The Use of English strand has three sub-strands: Vocabulary (word classes, such as numbers, prepositions, adverbs and nouns), Grammatical forms (verb forms, modals, question forms, adjectives) and Sentence structure (pronouns, quantifiers, connectives, clauses). The framework says its purpose is to supply the linguistic features learners need for the other four skills. Therefore, in the classroom, Use of English should rarely be taught in isolation. A good-practice approach is \u003cstrong>present, notice, practise, use\u003c/strong>:","ar":"The Use of English strand has three sub-strands: Vocabulary (word classes, such as numbers, prepositions, adverbs and nouns), Grammatical forms (verb forms, modals, question forms, adjectives) and Sentence structure (pronouns, quantifiers, connectives, clauses). The framework says its purpose is to supply the linguistic features learners need for the other four skills. Therefore, in the classroom, Use of English should rarely be taught in isolation. A good-practice approach is \u003cstrong>present, notice, practise, use\u003c/strong>:"}},{"t":"steps","c":{"en":["\u003cstrong>Present\u003c/strong> the language in a short text or situation, for example a dialogue with \"yet\" and \"already\" (4Uv.03).","\u003cstrong>Notice\u003c/strong>: learners find and underline the pattern and say what it means. This follows the glossary's \"explore\": investigate, look for patterns and discuss examples.","\u003cstrong>Practise\u003c/strong> in a controlled task: gap fill, matching, sentence building.","\u003cstrong>Use\u003c/strong> in a freer, meaningful task: an interview, a short message, a role play. Return to the same language in the next lesson."],"ar":["\u003cstrong>Present\u003c/strong> the language in a short text or situation, for example a dialogue with \"yet\" and \"already\" (4Uv.03).","\u003cstrong>Notice\u003c/strong>: learners find and underline the pattern and say what it means. This follows the glossary's \"explore\": investigate, look for patterns and discuss examples.","\u003cstrong>Practise\u003c/strong> in a controlled task: gap fill, matching, sentence building.","\u003cstrong>Use\u003c/strong> in a freer, meaningful task: an interview, a short message, a role play. Return to the same language in the next lesson."]}},{"t":"h","c":{"en":"Vocabulary routines (good practice)","ar":"Vocabulary routines (good practice)"}},{"t":"list","c":{"en":["\u003cstrong>Few words, many times.\u003c/strong> Teach five to eight words per lesson and recycle them within 24 hours and again within a week.","\u003cstrong>Know more than the meaning.\u003c/strong> For each word, learners say it, spell it, use it in a sentence and name a partner word (for example \"make a mistake\").","\u003cstrong>Word families and roots.\u003c/strong> The framework includes exploring words with common roots and derivations, \"including links to words in their first language\" (4Rd.04), and identifying and comparing words with common roots (5Rd.04). At Stage 6, learners explore common idiomatic phrases (6Rd.05).","\u003cstrong>Vocabulary book or wall.\u003c/strong> Learners keep words by topic with a picture or translation, and review them for two minutes at the start of the lesson."],"ar":["\u003cstrong>Few words, many times.\u003c/strong> Teach five to eight words per lesson and recycle them within 24 hours and again within a week.","\u003cstrong>Know more than the meaning.\u003c/strong> For each word, learners say it, spell it, use it in a sentence and name a partner word (for example \"make a mistake\").","\u003cstrong>Word families and roots.\u003c/strong> The framework includes exploring words with common roots and derivations, \"including links to words in their first language\" (4Rd.04), and identifying and comparing words with common roots (5Rd.04). At Stage 6, learners explore common idiomatic phrases (6Rd.05).","\u003cstrong>Vocabulary book or wall.\u003c/strong> Learners keep words by topic with a picture or translation, and review them for two minutes at the start of the lesson."]}},{"t":"h","c":{"en":"Managing mixed-level classes","ar":"Managing mixed-level classes"}},{"t":"p","c":{"en":"In a class of 25 to 30 learners who all learn English as a second language, levels will vary widely: some learners may use English at home, others may hear it only at school. The framework helps in two ways. First, objectives for each stage are unique to that stage, so you know what the stage expects. Second, the phrase \"with support\" shows that the same objective can be met at different levels of independence. Practical good-practice ideas:","ar":"In a class of 25 to 30 learners who all learn English as a second language, levels will vary widely: some learners may use English at home, others may hear it only at school. The framework helps in two ways. First, objectives for each stage are unique to that stage, so you know what the stage expects. Second, the phrase \"with support\" shows that the same objective can be met at different levels of independence. Practical good-practice ideas:"}},{"t":"list","c":{"en":["\u003cstrong>Same task, different support.\u003c/strong> Everyone writes about their weekend. Group A has a sentence frame and word bank, Group B has only a word bank, Group C writes freely and adds two connectives.","\u003cstrong>Tiered questions.\u003c/strong> Use closed questions first (Is it big?), then open ones (What does it look like?), then opinion (Why do you like it?).","\u003cstrong>Mixed pairs.\u003c/strong> Pair a stronger speaker with a less confident one for information-gap tasks, and change the pairs often so that no one is always \"the helper\".","\u003cstrong>Fast finishers.\u003c/strong> Offer a meaningful extension (write a second paragraph, ask the partner three more questions), not just more of the same."],"ar":["\u003cstrong>Same task, different support.\u003c/strong> Everyone writes about their weekend. Group A has a sentence frame and word bank, Group B has only a word bank, Group C writes freely and adds two connectives.","\u003cstrong>Tiered questions.\u003c/strong> Use closed questions first (Is it big?), then open ones (What does it look like?), then opinion (Why do you like it?).","\u003cstrong>Mixed pairs.\u003c/strong> Pair a stronger speaker with a less confident one for information-gap tasks, and change the pairs often so that no one is always \"the helper\".","\u003cstrong>Fast finishers.\u003c/strong> Offer a meaningful extension (write a second paragraph, ask the partner three more questions), not just more of the same."]}},{"t":"h","c":{"en":"First-language use: what the framework says and good practice","ar":"First-language use: what the framework says and good practice"}},{"t":"p","c":{"en":"The framework does not tell teachers to ban or to encourage the home language in class, but it does value the learner's other language in specific places. Phonics teaching should \"build on children's oral language in their home language\", identifying English sounds that may be harder. Learners are described as \"making connections (to their own language) to build on what they already know\". Stage 4 includes exploring words with common roots \"including links to words in their first language\" (4Rd.04). The aims of the subject also include developing \"a curiosity about other languages and cultures\".","ar":"The framework does not tell teachers to ban or to encourage the home language in class, but it does value the learner's other language in specific places. Phonics teaching should \"build on children's oral language in their home language\", identifying English sounds that may be harder. Learners are described as \"making connections (to their own language) to build on what they already know\". Stage 4 includes exploring words with common roots \"including links to words in their first language\" (4Rd.04). The aims of the subject also include developing \"a curiosity about other languages and cultures\"."}},{"t":"p","c":{"en":"The main aim, however, is effective use of English. So a sensible good-practice position is: \u003cstrong>English is the language of the lesson; the first language is a short, planned tool.\u003c/strong> Use it for checking a hard instruction at Stage 1, for comparing a grammar pattern (\"In Arabic we say it differently\"), for finding cognates, or to let a new learner feel safe. Do not use it for whole-lesson translation, which removes the learner's chance to listen to and use English.","ar":"The main aim, however, is effective use of English. So a sensible good-practice position is: \u003cstrong>English is the language of the lesson; the first language is a short, planned tool.\u003c/strong> Use it for checking a hard instruction at Stage 1, for comparing a grammar pattern (\"In Arabic we say it differently\"), for finding cognates, or to let a new learner feel safe. Do not use it for whole-lesson translation, which removes the learner's chance to listen to and use English."}},{"t":"scenario","title":{"en":"Scenario: the learner answers in Arabic","ar":"Scenario: the learner answers in Arabic"},"c":{"en":"In a Stage 2 lesson, a girl answers \"Where is the cat?\" in Arabic. She clearly understands. What is a good response? Accept the understanding (\"Yes, good, the cat is under the table\"), model the English answer, and have her repeat it. Then repeat the question to the class and let learners answer with \"It is under the table\". The learner is encouraged, the English is modelled, and the lesson stays in English. Support with a picture card and a sentence frame next time.","ar":"In a Stage 2 lesson, a girl answers \"Where is the cat?\" in Arabic. She clearly understands. What is a good response? Accept the understanding (\"Yes, good, the cat is under the table\"), model the English answer, and have her repeat it. Then repeat the question to the class and let learners answer with \"It is under the table\". The learner is encouraged, the English is modelled, and the lesson stays in English. Support with a picture card and a sentence frame next time."}}],"checks":[{"id":"m5q1","q":{"en":"Why do the names of the Reading and Listening sub-strands match each other?","ar":"Why do the names of the Reading and Listening sub-strands match each other?"},"opts":[{"en":"To help teachers see links between Reading and Listening skills and use them in teaching","ar":"To help teachers see links between Reading and Listening skills and use them in teaching"},{"en":"Because the two strands are assessed together in one Checkpoint paper at every stage","ar":"Because the two strands are assessed together in one Checkpoint paper at every stage"},{"en":"Because listening objectives are copied from the reading objectives at each stage","ar":"Because listening objectives are copied from the reading objectives at each stage"},{"en":"Because the framework treats reading and listening as one combined strand","ar":"Because the framework treats reading and listening as one combined strand"}],"correct":0,"expl":{"en":"The framework says the sub-strand names are similar to help you identify links between Reading and Listening skills, and to reflect these links in your teaching.","ar":"The framework says the sub-strand names are similar to help you identify links between Reading and Listening skills, and to reflect these links in your teaching."}},{"id":"m5q2","q":{"en":"What does objective 3Sc.05 expect of learners' pronunciation?","ar":"What does objective 3Sc.05 expect of learners' pronunciation?"},"opts":[{"en":"Familiar words and phrases are pronounced exactly like a native speaker's speech","ar":"Familiar words and phrases are pronounced exactly like a native speaker's speech"},{"en":"Familiar words and phrases can generally be understood by others","ar":"Familiar words and phrases can generally be understood by others"},{"en":"Intonation and stress are used appropriately at word and sentence level","ar":"Intonation and stress are used appropriately at word and sentence level"},{"en":"Simple sounds are reproduced correctly in a limited range of familiar words","ar":"Simple sounds are reproduced correctly in a limited range of familiar words"}],"correct":1,"expl":{"en":"3Sc.05 asks learners to pronounce familiar words and phrases so they can generally be understood. Intonation and stress appear at Stage 6 (6Sc.05), and 1Sc.04 is the Stage 1 sound objective.","ar":"3Sc.05 asks learners to pronounce familiar words and phrases so they can generally be understood. Intonation and stress appear at Stage 6 (6Sc.05), and 1Sc.04 is the Stage 1 sound objective."}},{"id":"m5q3","q":{"en":"In the framework, how is the learners' home language mentioned in relation to phonics?","ar":"In the framework, how is the learners' home language mentioned in relation to phonics?"},"opts":[{"en":"Phonics should be taught only in the home language until learners can read in English","ar":"Phonics should be taught only in the home language until learners can read in English"},{"en":"Phonics lessons should avoid the home language so that learners hear only English","ar":"Phonics lessons should avoid the home language so that learners hear only English"},{"en":"Phonics should build on oral home language and note sounds that may be harder","ar":"Phonics should build on oral home language and note sounds that may be harder"},{"en":"Phonics is not suitable for learners whose home language is not English","ar":"Phonics is not suitable for learners whose home language is not English"}],"correct":2,"expl":{"en":"The framework says phonics can be particularly helpful for learners whose home language is not English, and that teaching should build on their oral language, including sounds not present in it.","ar":"The framework says phonics can be particularly helpful for learners whose home language is not English, and that teaching should build on their oral language, including sounds not present in it."}}]},{"id":"m6","title":{"en":"Assessment: Checking What Learners Can Do","ar":"Assessment: Checking What Learners Can Do"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Assessment answers one question: \u003cem>can learners do what the objectives say?\u003c/em> The framework describes its learning objectives as \"a reference against which learners' attainment and skills development can be checked\". In ESL this means checking what learners can \u003cem>do\u003c/em> with English, not only what they know about it. This module describes what the framework says about assessment, shows how to use can-do statements and CEFR language in everyday assessment, explains the reporting codes, and then explains where PEPS external checks fit. We stay within what the framework says, and we clearly label anything that is good practice.","ar":"Assessment answers one question: \u003cem>can learners do what the objectives say?\u003c/em> The framework describes its learning objectives as \"a reference against which learners' attainment and skills development can be checked\". In ESL this means checking what learners can \u003cem>do\u003c/em> with English, not only what they know about it. This module describes what the framework says about assessment, shows how to use can-do statements and CEFR language in everyday assessment, explains the reporting codes, and then explains where PEPS external checks fit. We stay within what the framework says, and we clearly label anything that is good practice."}},{"t":"h","c":{"en":"What the framework says about assessment","ar":"What the framework says about assessment"}},{"t":"list","c":{"en":["\u003cstrong>Can-do statements.\u003c/strong> Learning outcomes in each strand for each stage are defined in terms of what learners should be able to do in English. This helps the school and parents understand levels.","\u003cstrong>CEFR.\u003c/strong> Progression in each strand is mapped to the Common European Framework of Reference for Languages, which uses a six-point scale from A1 (beginner) to C2 (mastery). Part A of this CPD explains the alignment.","\u003cstrong>Cambridge assessments.\u003c/strong> The framework says that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\", and lists Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and CEM Baseline Tests among the Cambridge Primary assessments. It says information on assessing ESL is on the School Support Hub. The cover page notes that Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","\u003cstrong>The papers.\u003c/strong> The framework's comparison table says that for ESL, the Checkpoint and Progression Tests assess \u003cstrong>Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening\u003c/strong>.","\u003cstrong>Reporting codes.\u003c/strong> Each learning objective code includes \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\"."],"ar":["\u003cstrong>Can-do statements.\u003c/strong> Learning outcomes in each strand for each stage are defined in terms of what learners should be able to do in English. This helps the school and parents understand levels.","\u003cstrong>CEFR.\u003c/strong> Progression in each strand is mapped to the Common European Framework of Reference for Languages, which uses a six-point scale from A1 (beginner) to C2 (mastery). Part A of this CPD explains the alignment.","\u003cstrong>Cambridge assessments.\u003c/strong> The framework says that Cambridge provides assessments \"designed to complement this curriculum framework for Stages 3 to 6\", and lists Cambridge Primary Progression Tests, Cambridge Primary Checkpoint and CEM Baseline Tests among the Cambridge Primary assessments. It says information on assessing ESL is on the School Support Hub. The cover page notes that Progression Tests were to be available from 2022 and Checkpoint tests from 2023.","\u003cstrong>The papers.\u003c/strong> The framework's comparison table says that for ESL, the Checkpoint and Progression Tests assess \u003cstrong>Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening\u003c/strong>.","\u003cstrong>Reporting codes.\u003c/strong> Each learning objective code includes \"a reporting code that appears in the feedback reports for tests and reflects the sub-strand titles\"."]}},{"t":"callout","k":"warn","title":{"en":"Stay within the text","ar":"Stay within the text"},"c":{"en":"The framework does not describe how marks are converted to a level, how often the tests are taken, or what the reports look like beyond the reporting codes. Do not tell colleagues or parents anything about these details unless you have read it in official Cambridge documents or on the School Support Hub. Notice also that the three papers named do not include a speaking paper. This does not mean Speaking is unimportant: it is one of the five strands, so evidence for Speaking has to come from classroom assessment.","ar":"The framework does not describe how marks are converted to a level, how often the tests are taken, or what the reports look like beyond the reporting codes. Do not tell colleagues or parents anything about these details unless you have read it in official Cambridge documents or on the School Support Hub. Notice also that the three papers named do not include a speaking paper. This does not mean Speaking is unimportant: it is one of the five strands, so evidence for Speaking has to come from classroom assessment."}},{"t":"h","c":{"en":"Assessment for learning in the classroom (good practice)","ar":"Assessment for learning in the classroom (good practice)"}},{"t":"p","c":{"en":"Assessment for learning means gathering evidence \u003cem>while\u003c/em> learners are still learning, so that you can change the lesson. Most of it is informal. For ESL, useful methods include:","ar":"Assessment for learning means gathering evidence \u003cem>while\u003c/em> learners are still learning, so that you can change the lesson. Most of it is informal. For ESL, useful methods include:"}},{"t":"table","head":{"en":["Method","What it checks","Example"],"ar":["Method","What it checks","Example"]},"rows":[{"en":["Observation with a short checklist","Speaking, interaction, pronunciation","While pairs talk, tick on a class list whether each learner can ask and answer 2Sc.03-type questions, and note one example."],"ar":["Observation with a short checklist","Speaking, interaction, pronunciation","While pairs talk, tick on a class list whether each learner can ask and answer 2Sc.03-type questions, and note one example."]},{"en":["Mini whiteboards or hand signals","Use of English, vocabulary","\"Show me the correct sentence: A, B or C\" after a grammar presentation."],"ar":["Mini whiteboards or hand signals","Use of English, vocabulary","\"Show me the correct sentence: A, B or C\" after a grammar presentation."]},{"en":["Exit ticket","Writing, understanding","Before leaving, learners write one sentence using the target structure."],"ar":["Exit ticket","Writing, understanding","Before leaving, learners write one sentence using the target structure."]},{"en":["Listening or reading check","Global meaning, detail, opinion","Five true/false items on a short text, matching the sub-strand taught."],"ar":["Listening or reading check","Global meaning, detail, opinion","Five true/false items on a short text, matching the sub-strand taught."]},{"en":["Self-assessment","Reflection, confidence","Learners colour three faces next to \"I can ...\" statements, in line with the aim that learners are reflective."],"ar":["Self-assessment","Reflection, confidence","Learners colour three faces next to \"I can ...\" statements, in line with the aim that learners are reflective."]},{"en":["Portfolio sample","Writing progress","A dated paragraph each half term, kept to show change over time."],"ar":["Portfolio sample","Writing progress","A dated paragraph each half term, kept to show change over time."]}]},{"t":"h","c":{"en":"Using can-do checklists","ar":"Using can-do checklists"}},{"t":"p","c":{"en":"The framework's objectives already read like can-do statements, so you can turn them straight into a checklist. A good checklist uses the exact objective code so that your evidence can later be linked to the framework. Here is an example for Stage 3 Speaking, drawn from three objectives (paraphrased):","ar":"The framework's objectives already read like can-do statements, so you can turn them straight into a checklist. A good checklist uses the exact objective code so that your evidence can later be linked to the framework. Here is an example for Stage 3 Speaking, drawn from three objectives (paraphrased):"}},{"t":"table","head":{"en":["Code","Can-do statement","Evidence","Secure? (Yes, partly, not yet)"],"ar":["Code","Can-do statement","Evidence","Secure? (Yes, partly, not yet)"]},"rows":[{"en":["3Sc.01","I can give basic information about myself in sentences.","Oral interview, 3 questions","________"],"ar":["3Sc.01","I can give basic information about myself in sentences.","Oral interview, 3 questions","________"]},{"en":["3Sc.02","I can describe a person, place or object in sentences.","Picture description","________"],"ar":["3Sc.02","I can describe a person, place or object in sentences.","Picture description","________"]},{"en":["3Sc.05","Other people can generally understand how I say familiar words.","Teacher observation during pair work","________"],"ar":["3Sc.05","Other people can generally understand how I say familiar words.","Teacher observation during pair work","________"]}]},{"t":"p","c":{"en":"Because the objectives include words such as \"with support\" and \"allowing for frequent, basic mistakes\", you should judge learners against those words, not against perfect English. A Stage 3 learner who describes a picture in sentences with some mistakes and needs a prompt word has met the objective as the framework describes it.","ar":"Because the objectives include words such as \"with support\" and \"allowing for frequent, basic mistakes\", you should judge learners against those words, not against perfect English. A Stage 3 learner who describes a picture in sentences with some mistakes and needs a prompt word has met the objective as the framework describes it."}},{"t":"h","c":{"en":"Reporting codes: what the two or three letters tell you","ar":"Reporting codes: what the two or three letters tell you"}},{"t":"p","c":{"en":"The code letters after the stage number match the sub-strand. If a test report gives results by these codes (the framework says a reporting code appears in the feedback reports), then you can quickly see which sub-strand needs attention. Here are all fifteen codes in the framework:","ar":"The code letters after the stage number match the sub-strand. If a test report gives results by these codes (the framework says a reporting code appears in the feedback reports), then you can quickly see which sub-strand needs attention. Here are all fifteen codes in the framework:"}},{"t":"table","head":{"en":["Strand","Sub-strand","Code letters"],"ar":["Strand","Sub-strand","Code letters"]},"rows":[{"en":["Listening","Global meaning / Detail / Opinion","Lm / Ld / Lo"],"ar":["Listening","Global meaning / Detail / Opinion","Lm / Ld / Lo"]},{"en":["Speaking","Communication / Express opinion / Organisation","Sc / So / Sor"],"ar":["Speaking","Communication / Express opinion / Organisation","Sc / So / Sor"]},{"en":["Writing","Communicative achievement / Organisation / Content","Wca / Wor / Wc"],"ar":["Writing","Communicative achievement / Organisation / Content","Wca / Wor / Wc"]},{"en":["Reading","Global meaning / Detail / Opinion","Rm / Rd / Ro"],"ar":["Reading","Global meaning / Detail / Opinion","Rm / Rd / Ro"]},{"en":["Use of English","Grammatical forms / Vocabulary / Sentence structure","Ug / Uv / Us"],"ar":["Use of English","Grammatical forms / Vocabulary / Sentence structure","Ug / Uv / Us"]}]},{"t":"p","c":{"en":"Quick practice: a Stage 4 learner's feedback shows weakness in \"Ld\" and \"Ug\". Which sub-strands are those? Ld is Listening for detail and Ug is Use of English, Grammatical forms. So your next unit should include more detail-listening tasks and more practice of verb forms, for example the past continuous (4Ug.07). Do not guess more than the code allows: it tells you the sub-strand, not the exact reason for the weakness.","ar":"Quick practice: a Stage 4 learner's feedback shows weakness in \"Ld\" and \"Ug\". Which sub-strands are those? Ld is Listening for detail and Ug is Use of English, Grammatical forms. So your next unit should include more detail-listening tasks and more practice of verb forms, for example the past continuous (4Ug.07). Do not guess more than the code allows: it tells you the sub-strand, not the exact reason for the weakness."}},{"t":"h","c":{"en":"External checks at PEPS","ar":"External checks at PEPS"}},{"t":"p","c":{"en":"At PEPS, learners in Year 6 sit the Cambridge Primary Checkpoint (including ESL), and GL Progress Tests in English are used in Years 4 and 6. Year 6 corresponds to Stage 6. These are \u003cstrong>external checks\u003c/strong>: they compare your learners with a wider group, so they help you ask whether your own judgements are reasonable. A useful habit is to compare, for each learner, the teacher's classroom judgement with the external result. If they differ a lot, find out why. Perhaps the classroom tasks were too easy, or the learner is nervous in tests, or the learner is strong in speaking, which the external papers do not measure.","ar":"At PEPS, learners in Year 6 sit the Cambridge Primary Checkpoint (including ESL), and GL Progress Tests in English are used in Years 4 and 6. Year 6 corresponds to Stage 6. These are \u003cstrong>external checks\u003c/strong>: they compare your learners with a wider group, so they help you ask whether your own judgements are reasonable. A useful habit is to compare, for each learner, the teacher's classroom judgement with the external result. If they differ a lot, find out why. Perhaps the classroom tasks were too easy, or the learner is nervous in tests, or the learner is strong in speaking, which the external papers do not measure."}},{"t":"p","c":{"en":"Remember that the two kinds of check are different. The framework's own assessments are linked to its objectives and use its reporting codes. The GL Progress Tests are a separate school benchmark; follow the school's assessment guidance for how they are used and reported. Never present a result from one as if it were from the other.","ar":"Remember that the two kinds of check are different. The framework's own assessments are linked to its objectives and use its reporting codes. The GL Progress Tests are a separate school benchmark; follow the school's assessment guidance for how they are used and reported. Never present a result from one as if it were from the other."}},{"t":"scenario","title":{"en":"Scenario: strong speaker, weak test","ar":"Scenario: strong speaker, weak test"},"c":{"en":"A Year 6 learner talks fluently in class and always answers orally, but his external English result is lower than the teacher expected. What should the teacher do? Do not decide that the test is wrong. Look at the result by skill or strand if it is available. Perhaps his Writing or Reading for detail is much weaker than his Speaking. Check his classroom evidence (writing samples, reading checks) against Stage 6 objectives such as 6Rd.01 and 6Wca.03. Then plan targeted support, for example reading with a detail task each week, and re-check in a few weeks.","ar":"A Year 6 learner talks fluently in class and always answers orally, but his external English result is lower than the teacher expected. What should the teacher do? Do not decide that the test is wrong. Look at the result by skill or strand if it is available. Perhaps his Writing or Reading for detail is much weaker than his Speaking. Check his classroom evidence (writing samples, reading checks) against Stage 6 objectives such as 6Rd.01 and 6Wca.03. Then plan targeted support, for example reading with a detail task each week, and re-check in a few weeks."}},{"t":"callout","k":"key","title":{"en":"Key points","ar":"Key points"},"c":{"en":"Learning objectives are the reference for assessment. Cambridge provides assessments for Stages 3 to 6, and the framework lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. Speaking evidence comes mainly from classroom assessment. Use the reporting codes to link results to sub-strands, and use external checks such as the Year 6 Checkpoint and GL Progress Tests as a comparison, not as the whole picture.","ar":"Learning objectives are the reference for assessment. Cambridge provides assessments for Stages 3 to 6, and the framework lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening. Speaking evidence comes mainly from classroom assessment. Use the reporting codes to link results to sub-strands, and use external checks such as the Year 6 Checkpoint and GL Progress Tests as a comparison, not as the whole picture."}}],"checks":[{"id":"m6q1","q":{"en":"According to the framework, which three papers are named for ESL in the Checkpoint and Progression Tests table?","ar":"According to the framework, which three papers are named for ESL in the Checkpoint and Progression Tests table?"},"opts":[{"en":"Paper 1 Reading and Writing, Paper 2 Speaking and Paper 3 Listening","ar":"Paper 1 Reading and Writing, Paper 2 Speaking and Paper 3 Listening"},{"en":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking and Listening","ar":"Paper 1 Reading, Paper 2 Writing and Paper 3 Speaking and Listening"},{"en":"Paper 1 Use of English, Paper 2 Reading and Writing and Paper 3 Speaking","ar":"Paper 1 Use of English, Paper 2 Reading and Writing and Paper 3 Speaking"},{"en":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening","ar":"Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening"}],"correct":3,"expl":{"en":"The framework's table lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening for ESL. A speaking paper is not listed.","ar":"The framework's table lists Paper 1 Reading and Usage, Paper 2 Writing and Paper 3 Listening for ESL. A speaking paper is not listed."}},{"id":"m6q2","q":{"en":"What does a reporting code, such as Rd in 5Rd.01, tell you?","ar":"What does a reporting code, such as Rd in 5Rd.01, tell you?"},"opts":[{"en":"It reflects a sub-strand title and appears in the feedback reports for tests","ar":"It reflects a sub-strand title and appears in the feedback reports for tests"},{"en":"It shows the difficulty level of the objective on the CEFR scale for that stage","ar":"It shows the difficulty level of the objective on the CEFR scale for that stage"},{"en":"It tells you how many marks the objective carries in the Checkpoint papers","ar":"It tells you how many marks the objective carries in the Checkpoint papers"},{"en":"It shows the order in which teachers must teach the objectives in each stage","ar":"It shows the order in which teachers must teach the objectives in each stage"}],"correct":0,"expl":{"en":"The framework says each code includes a reporting code that appears in test feedback reports and reflects the sub-strand titles. Rd is Reading for detail.","ar":"The framework says each code includes a reporting code that appears in test feedback reports and reflects the sub-strand titles. Rd is Reading for detail."}},{"id":"m6q3","q":{"en":"A report shows a Stage 5 class is weak in \"Ro\". What should you conclude?","ar":"A report shows a Stage 5 class is weak in \"Ro\". What should you conclude?"},"opts":[{"en":"Writing organisation needs a complete change of scheme of work","ar":"Writing organisation needs a complete change of scheme of work"},{"en":"Reading for opinion needs more teaching and checking","ar":"Reading for opinion needs more teaching and checking"},{"en":"Reading for global meaning is missing from the class timetable","ar":"Reading for global meaning is missing from the class timetable"},{"en":"Speaking opinions should be left until the next stage","ar":"Speaking opinions should be left until the next stage"}],"correct":1,"expl":{"en":"Ro is the reporting code for Reading for opinion (for example 5Ro.01). It points to the sub-strand but not to the reasons, so you check classroom evidence next.","ar":"Ro is the reporting code for Reading for opinion (for example 5Ro.01). It points to the sub-strand but not to the reasons, so you check classroom evidence next."}}]},{"id":"m7","title":{"en":"Using Evidence to Adjust Teaching","ar":"Using Evidence to Adjust Teaching"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Collecting results is not the end of assessment. The question that matters is: \u003cem>what will I do differently on Monday?\u003c/em> This module shows a simple cycle for using evidence, how to analyse class results by skill and strand, how to study errors in speaking and writing, how to plan an intervention and how to track progress honestly. Everything here is good practice, linked to the framework's codes and wording. The numbers used in examples are invented for training, and they are not PEPS data.","ar":"Collecting results is not the end of assessment. The question that matters is: \u003cem>what will I do differently on Monday?\u003c/em> This module shows a simple cycle for using evidence, how to analyse class results by skill and strand, how to study errors in speaking and writing, how to plan an intervention and how to track progress honestly. Everything here is good practice, linked to the framework's codes and wording. The numbers used in examples are invented for training, and they are not PEPS data."}},{"t":"h","c":{"en":"The evidence cycle","ar":"The evidence cycle"}},{"t":"steps","c":{"en":["\u003cstrong>Collect\u003c/strong> evidence: classroom tasks, checklists, short tests, writing samples, and external results where your school has them.","\u003cstrong>Group\u003c/strong> it by strand and sub-strand, using the reporting codes (Lm, Ld, Lo, Sc, So, Sor, Wca, Wor, Wc, Rm, Rd, Ro, Ug, Uv, Us).","\u003cstrong>Look for patterns:\u003c/strong> which sub-strands are weakest for the whole class, which for a small group, which for one learner?","\u003cstrong>Decide\u003c/strong> what to change: reteach, add practice, change the support, or set up a group intervention.","\u003cstrong>Act and re-check\u003c/strong> after a short, fixed time, for example three weeks, to see if the change worked."],"ar":["\u003cstrong>Collect\u003c/strong> evidence: classroom tasks, checklists, short tests, writing samples, and external results where your school has them.","\u003cstrong>Group\u003c/strong> it by strand and sub-strand, using the reporting codes (Lm, Ld, Lo, Sc, So, Sor, Wca, Wor, Wc, Rm, Rd, Ro, Ug, Uv, Us).","\u003cstrong>Look for patterns:\u003c/strong> which sub-strands are weakest for the whole class, which for a small group, which for one learner?","\u003cstrong>Decide\u003c/strong> what to change: reteach, add practice, change the support, or set up a group intervention.","\u003cstrong>Act and re-check\u003c/strong> after a short, fixed time, for example three weeks, to see if the change worked."]}},{"t":"h","c":{"en":"Analysing class results by skill and strand","ar":"Analysing class results by skill and strand"}},{"t":"p","c":{"en":"Imagine a Stage 4 class of 24 learners takes a short end-of-unit check, with two or three questions for each sub-strand. A teacher records how many learners answer correctly. \u003cstrong>This table is an invented illustration, not real data.\u003c/strong>","ar":"Imagine a Stage 4 class of 24 learners takes a short end-of-unit check, with two or three questions for each sub-strand. A teacher records how many learners answer correctly. \u003cstrong>This table is an invented illustration, not real data.\u003c/strong>"}},{"t":"table","head":{"en":["Sub-strand (code)","Learners secure (out of 24)","What the teacher notices"],"ar":["Sub-strand (code)","Learners secure (out of 24)","What the teacher notices"]},"rows":[{"en":["Listening for detail (Ld)","12","Half the class missed numbers and times in the recording."],"ar":["Listening for detail (Ld)","12","Half the class missed numbers and times in the recording."]},{"en":["Reading for detail (Rd)","19","Most can find specific information in a short text."],"ar":["Reading for detail (Rd)","19","Most can find specific information in a short text."]},{"en":["Grammatical forms (Ug)","10","Many mix up past simple and present perfect."],"ar":["Grammatical forms (Ug)","10","Many mix up past simple and present perfect."]},{"en":["Writing, Content (Wc)","17","Most can describe in short sentences."],"ar":["Writing, Content (Wc)","17","Most can describe in short sentences."]},{"en":["Writing, Organisation (Wor)","9","Few use connectives or punctuate a sequence of sentences."],"ar":["Writing, Organisation (Wor)","9","Few use connectives or punctuate a sequence of sentences."]},{"en":["Speaking, Communication (Sc)","20","Pairs talk with confidence on familiar topics."],"ar":["Speaking, Communication (Sc)","20","Pairs talk with confidence on familiar topics."]}]},{"t":"p","c":{"en":"What would you decide? Three clear priorities stand out: Ug (10 out of 24), Wor (9 out of 24) and Ld (12 out of 24). Reading and speaking are strong, so they do not need reteaching and can be used as \u003cem>routes\u003c/em>: for example, learners could first say sentences with \"when\" and \"after\" (4Us.03) and then write them. A good decision is not \"do more of everything\" but \"next unit, give ten minutes each lesson to connectives and punctuation, and add a numbers-and-times listening task.\"","ar":"What would you decide? Three clear priorities stand out: Ug (10 out of 24), Wor (9 out of 24) and Ld (12 out of 24). Reading and speaking are strong, so they do not need reteaching and can be used as \u003cem>routes\u003c/em>: for example, learners could first say sentences with \"when\" and \"after\" (4Us.03) and then write them. A good decision is not \"do more of everything\" but \"next unit, give ten minutes each lesson to connectives and punctuation, and add a numbers-and-times listening task.\""}},{"t":"callout","k":"warn","title":{"en":"Be careful with small numbers","ar":"Be careful with small numbers"},"c":{"en":"A group of 24 learners, or one test with three questions per sub-strand, gives only a rough signal. Use more than one piece of evidence before you make a big decision, and never judge a learner from a single test result. This is a point of good practice, not a Cambridge rule.","ar":"A group of 24 learners, or one test with three questions per sub-strand, gives only a rough signal. Use more than one piece of evidence before you make a big decision, and never judge a learner from a single test result. This is a point of good practice, not a Cambridge rule."}},{"t":"h","c":{"en":"Error analysis in speaking and writing","ar":"Error analysis in speaking and writing"}},{"t":"p","c":{"en":"Mistakes are information. The framework itself expects mistakes: \"frequent, basic mistakes\" at Stages 1 to 3, \"some\" at Stage 4 and \"occasional\" at Stages 5 and 6. So the goal of error analysis is not to count mistakes; it is to find \u003cem>patterns\u003c/em> and decide which ones matter most. A simple method:","ar":"Mistakes are information. The framework itself expects mistakes: \"frequent, basic mistakes\" at Stages 1 to 3, \"some\" at Stage 4 and \"occasional\" at Stages 5 and 6. So the goal of error analysis is not to count mistakes; it is to find \u003cem>patterns\u003c/em> and decide which ones matter most. A simple method:"}},{"t":"table","head":{"en":["Step","Question","Example from a Stage 4 learner"],"ar":["Step","Question","Example from a Stage 4 learner"]},"rows":[{"en":["1. Collect","Record 5 to 10 real sentences, spoken or written.","\"Yesterday I go to the park.\" \"She have two brother.\" \"I have seen him yesterday.\""],"ar":["1. Collect","Record 5 to 10 real sentences, spoken or written.","\"Yesterday I go to the park.\" \"She have two brother.\" \"I have seen him yesterday.\""]},{"en":["2. Sort","Is it a slip (she knows it) or a systematic error (she does not know it yet)?","\"go\" for \"went\" appears in several places: systematic. One missed \"s\" in one sentence: probably a slip."],"ar":["2. Sort","Is it a slip (she knows it) or a systematic error (she does not know it yet)?","\"go\" for \"went\" appears in several places: systematic. One missed \"s\" in one sentence: probably a slip."]},{"en":["3. Find the pattern","Which Use of English objective is involved?","Past simple regular and irregular forms (3Ug.04, 4Ug.05). Present perfect for indefinite time, 4Ug.08."],"ar":["3. Find the pattern","Which Use of English objective is involved?","Past simple regular and irregular forms (3Ug.04, 4Ug.05). Present perfect for indefinite time, 4Ug.08."]},{"en":["4. Rank","Does it block meaning, or is it a small error?","\"I have seen him yesterday\" is understandable, but the tense pattern is important at Stage 4. \"Brother\" for \"brothers\" does not block meaning."],"ar":["4. Rank","Does it block meaning, or is it a small error?","\"I have
