 seen him yesterday\" is understandable, but the tense pattern is important at Stage 4. \"Brother\" for \"brothers\" does not block meaning."]},{"en":["5. Teach","What will I do next?","A mini-lesson with a past-time line and 6 sentences to sort into past simple and present perfect, then oral practice."],"ar":["5. Teach","What will I do next?","A mini-lesson with a past-time line and 6 sentences to sort into past simple and present perfect, then oral practice."]}]},{"t":"p","c":{"en":"In \u003cstrong>speaking\u003c/strong>, record errors on a small notebook or class list while pairs talk, but do not interrupt fluency. After the activity, write three anonymous sentences on the board and ask the class to correct them. In \u003cstrong>writing\u003c/strong>, use a code system with the learners (\"sp\" for spelling, \"T\" for tense, \"^\" for missing word) so that they correct their own work. Over time, patterns will show: many Arabic-speaking learners, for instance, may find articles (a, the, 1Us.01) or the present simple third-person \"s\" difficult. Check this with your own learners and do not assume.","ar":"In \u003cstrong>speaking\u003c/strong>, record errors on a small notebook or class list while pairs talk, but do not interrupt fluency. After the activity, write three anonymous sentences on the board and ask the class to correct them. In \u003cstrong>writing\u003c/strong>, use a code system with the learners (\"sp\" for spelling, \"T\" for tense, \"^\" for missing word) so that they correct their own work. Over time, patterns will show: many Arabic-speaking learners, for instance, may find articles (a, the, 1Us.01) or the present simple third-person \"s\" difficult. Check this with your own learners and do not assume."}},{"t":"scenario","title":{"en":"Scenario: one error, many learners","ar":"Scenario: one error, many learners"},"c":{"en":"A Stage 3 teacher marks 25 writing books and finds that 18 learners write \"He like football\" or \"She have a dog.\" She is tempted to correct all 18 books separately. What is a better use of time? She could write the two sentences on the board in the next lesson, ask learners to decide what is wrong (they are working with 3Ug.03, present simple to describe routines, habits and states), explore the rule together, and then ask learners to check their own books and correct the same pattern. The teacher spends her time on the pattern, and every learner works on his or her own examples.","ar":"A Stage 3 teacher marks 25 writing books and finds that 18 learners write \"He like football\" or \"She have a dog.\" She is tempted to correct all 18 books separately. What is a better use of time? She could write the two sentences on the board in the next lesson, ask learners to decide what is wrong (they are working with 3Ug.03, present simple to describe routines, habits and states), explore the rule together, and then ask learners to check their own books and correct the same pattern. The teacher spends her time on the pattern, and every learner works on his or her own examples."}},{"t":"h","c":{"en":"Intervention: what to do for learners who are behind","ar":"Intervention: what to do for learners who are behind"}},{"t":"p","c":{"en":"An intervention is extra, targeted help for a small group of learners who need more practice in a specific area. Good practice includes:","ar":"An intervention is extra, targeted help for a small group of learners who need more practice in a specific area. Good practice includes:"}},{"t":"list","c":{"en":["\u003cstrong>Be specific.\u003c/strong> The target should be an objective code, not \"improve English\". Example: \"Learners can use because to give a reason in speaking and writing (3Us.04).\"","\u003cstrong>Keep it short and regular.\u003c/strong> For example, 15 minutes, three times a week, for three weeks, with the same group.","\u003cstrong>Change the method, not only the amount.\u003c/strong> If learners did not understand from reading a rule, try a game, a picture, a short song or a physical activity.","\u003cstrong>Use the class lesson too.\u003c/strong> Give the same learners a role in the main lesson, so that they are not removed from the interesting activity.","\u003cstrong>Re-check and stop.\u003c/strong> After the cycle, use the same kind of check as before. If the group is secure, stop. If not, change the plan."],"ar":["\u003cstrong>Be specific.\u003c/strong> The target should be an objective code, not \"improve English\". Example: \"Learners can use because to give a reason in speaking and writing (3Us.04).\"","\u003cstrong>Keep it short and regular.\u003c/strong> For example, 15 minutes, three times a week, for three weeks, with the same group.","\u003cstrong>Change the method, not only the amount.\u003c/strong> If learners did not understand from reading a rule, try a game, a picture, a short song or a physical activity.","\u003cstrong>Use the class lesson too.\u003c/strong> Give the same learners a role in the main lesson, so that they are not removed from the interesting activity.","\u003cstrong>Re-check and stop.\u003c/strong> After the cycle, use the same kind of check as before. If the group is secure, stop. If not, change the plan."]}},{"t":"h","c":{"en":"Tracking progress without inventing data","ar":"Tracking progress without inventing data"}},{"t":"p","c":{"en":"A tracker is a simple record that shows, for each learner, which objectives are secure. It can be a table in a spreadsheet or on paper with the codes of the stage across the top and learners down the side. You can use three marks: secure, partly secure or not yet. Use your school's tracker and its categories if there is one. If you create your own, keep it small and use only what you really observed.","ar":"A tracker is a simple record that shows, for each learner, which objectives are secure. It can be a table in a spreadsheet or on paper with the codes of the stage across the top and learners down the side. You can use three marks: secure, partly secure or not yet. Use your school's tracker and its categories if there is one. If you create your own, keep it small and use only what you really observed."}},{"t":"list","c":{"en":["\u003cstrong>Use real evidence.\u003c/strong> Each entry should link to something you saw or collected: a writing sample, a checklist, a short test.","\u003cstrong>Use the framework's codes.\u003c/strong> This keeps records consistent between teachers and years, and makes handover to the next teacher easy.","\u003cstrong>Look at change, not just level.\u003c/strong> A learner who moves from \"not yet\" to \"partly secure\" in 3Sc.02 in six weeks is making progress even if she is not yet secure.","\u003cstrong>Do not fill in a tracker from memory at the end of term.\u003c/strong> A record that is guessed is worse than no record.","\u003cstrong>Keep personal data safe\u003c/strong> and follow your school's rules about who can see it."],"ar":["\u003cstrong>Use real evidence.\u003c/strong> Each entry should link to something you saw or collected: a writing sample, a checklist, a short test.","\u003cstrong>Use the framework's codes.\u003c/strong> This keeps records consistent between teachers and years, and makes handover to the next teacher easy.","\u003cstrong>Look at change, not just level.\u003c/strong> A learner who moves from \"not yet\" to \"partly secure\" in 3Sc.02 in six weeks is making progress even if she is not yet secure.","\u003cstrong>Do not fill in a tracker from memory at the end of term.\u003c/strong> A record that is guessed is worse than no record.","\u003cstrong>Keep personal data safe\u003c/strong> and follow your school's rules about who can see it."]}},{"t":"callout","k":"tip","title":{"en":"Good practice: link evidence to the next lesson","ar":"Good practice: link evidence to the next lesson"},"c":{"en":"After each unit, write one sentence in your plan: \"Because 9 of 24 learners were not yet secure in Wor, the next unit starts with a ten-minute connectives routine.\" A sentence like this proves to yourself, to your HOD and to inspectors that your teaching responds to evidence.","ar":"After each unit, write one sentence in your plan: \"Because 9 of 24 learners were not yet secure in Wor, the next unit starts with a ten-minute connectives routine.\" A sentence like this proves to yourself, to your HOD and to inspectors that your teaching responds to evidence."}}],"checks":[{"id":"m7q1","q":{"en":"In the invented class results table, which sub-strand should the teacher prioritise first?","ar":"In the invented class results table, which sub-strand should the teacher prioritise first?"},"opts":[{"en":"Speaking, Communication, because 20 of 24 learners were secure","ar":"Speaking, Communication, because 20 of 24 learners were secure"},{"en":"Reading for detail, because 19 of 24 learners were secure","ar":"Reading for detail, because 19 of 24 learners were secure"},{"en":"Writing, Organisation, because only 9 of 24 learners were secure","ar":"Writing, Organisation, because only 9 of 24 learners were secure"},{"en":"Writing, Content, because 17 of 24 learners were secure","ar":"Writing, Content, because 17 of 24 learners were secure"}],"correct":2,"expl":{"en":"The lowest result was in Organisation (9 of 24), with Grammatical forms and Listening for detail also needing attention. Speaking and Reading for detail were strong.","ar":"The lowest result was in Organisation (9 of 24), with Grammatical forms and Listening for detail also needing attention. Speaking and Reading for detail were strong."}},{"id":"m7q2","q":{"en":"What is the main purpose of error analysis in speaking and writing?","ar":"What is the main purpose of error analysis in speaking and writing?"},"opts":[{"en":"To count every mistake and give each learner a mark for accuracy","ar":"To count every mistake and give each learner a mark for accuracy"},{"en":"To prove that learners have not met the objectives of their stage","ar":"To prove that learners have not met the objectives of their stage"},{"en":"To correct each learner's work privately until no mistakes remain","ar":"To correct each learner's work privately until no mistakes remain"},{"en":"To find patterns of error and decide which ones to teach next","ar":"To find patterns of error and decide which ones to teach next"}],"correct":3,"expl":{"en":"Mistakes are information. The framework expects mistakes at every stage, so analysis aims at patterns and priorities, not at counting errors.","ar":"Mistakes are information. The framework expects mistakes at every stage, so analysis aims at patterns and priorities, not at counting errors."}},{"id":"m7q3","q":{"en":"Which of these is a good target for a short intervention group?","ar":"Which of these is a good target for a short intervention group?"},"opts":[{"en":"Learners use 'because' to give reasons in speaking and writing (3Us.04)","ar":"Learners use 'because' to give reasons in speaking and writing (3Us.04)"},{"en":"Learners improve their English in all five strands by the end of term","ar":"Learners improve their English in all five strands by the end of term"},{"en":"Learners complete all the Stage 3 objectives in the weeks before the test","ar":"Learners complete all the Stage 3 objectives in the weeks before the test"},{"en":"Learners practise English more often in lessons and at home on their own","ar":"Learners practise English more often in lessons and at home on their own"}],"correct":0,"expl":{"en":"A good intervention target is specific and linked to an objective code, short and regular, and checked afterwards.","ar":"A good intervention target is specific and linked to an objective code, short and regular, and checked afterwards."}}]},{"id":"m8","title":{"en":"Inclusion, Challenge and Transition","ar":"Inclusion, Challenge and Transition"},"minutes":17,"blocks":[{"t":"p","c":{"en":"A framework describes the same objectives for all learners, but the learners in your room are not the same. Some have special educational needs or disabilities. Some are very advanced in English. Some are older or younger than the typical age for the stage. Some are joining from a different school or moving to a new phase. This module looks at how to keep the framework's objectives for everyone while changing the route, the support and the challenge. The framework itself gives only a few direct statements on these topics, so most of this module is good practice and is labelled as such.","ar":"A framework describes the same objectives for all learners, but the learners in your room are not the same. Some have special educational needs or disabilities. Some are very advanced in English. Some are older or younger than the typical age for the stage. Some are joining from a different school or moving to a new phase. This module looks at how to keep the framework's objectives for everyone while changing the route, the support and the challenge. The framework itself gives only a few direct statements on these topics, so most of this module is good practice and is labelled as such."}},{"t":"h","c":{"en":"What the framework says that helps","ar":"What the framework says that helps"}},{"t":"list","c":{"en":["\u003cstrong>The curriculum is for learners at different starting points.\u003c/strong> It says there is \"no expectation that learners will have prior experience of English before starting Stage 1\".","\u003cstrong>The objectives are can-do statements\u003c/strong> with built-in levels of support (\"with support\", \"with little or no support\"), so the same objective can be met in different ways.","\u003cstrong>Age is flexible.\u003c/strong> The framework is \"typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context\".","\u003cstrong>Aims for all learners.\u003c/strong> Learners should \"see themselves as successful language learners\" and should feel able to \"take risks, try new language, and reflect on and learn from their mistakes\".","\u003cstrong>Phonics for all.\u003c/strong> The Phonics and Handwriting Framework is described as suitable for teaching children \"with any experience of English and any home language\"."],"ar":["\u003cstrong>The curriculum is for learners at different starting points.\u003c/strong> It says there is \"no expectation that learners will have prior experience of English before starting Stage 1\".","\u003cstrong>The objectives are can-do statements\u003c/strong> with built-in levels of support (\"with support\", \"with little or no support\"), so the same objective can be met in different ways.","\u003cstrong>Age is flexible.\u003c/strong> The framework is \"typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context\".","\u003cstrong>Aims for all learners.\u003c/strong> Learners should \"see themselves as successful language learners\" and should feel able to \"take risks, try new language, and reflect on and learn from their mistakes\".","\u003cstrong>Phonics for all.\u003c/strong> The Phonics and Handwriting Framework is described as suitable for teaching children \"with any experience of English and any home language\"."]}},{"t":"h","c":{"en":"Students of determination (SEND): good practice","ar":"Students of determination (SEND): good practice"}},{"t":"p","c":{"en":"In the UAE, learners with special educational needs and disabilities are often called students of determination. The school will have its own SEN procedures, such as identification, an inclusion team and individual education plans; follow them and speak to your SEN coordinator. The framework does not give separate objectives for these learners, so the aim is to help each one work toward the same objectives, with adjusted access. Good-practice adjustments for ESL lessons include:","ar":"In the UAE, learners with special educational needs and disabilities are often called students of determination. The school will have its own SEN procedures, such as identification, an inclusion team and individual education plans; follow them and speak to your SEN coordinator. The framework does not give separate objectives for these learners, so the aim is to help each one work toward the same objectives, with adjusted access. Good-practice adjustments for ESL lessons include:"}},{"t":"list","c":{"en":["\u003cstrong>Reduce the language load, not the thinking.\u003c/strong> Use shorter texts, larger print, pictures and key words highlighted. Keep the same objective, for example 3Rd.01 (specific information in a short, simple text).","\u003cstrong>Give more time and more steps.\u003c/strong> Break a writing task into planning, a sentence frame and a check, which matches the \"with support\" wording in the objectives.","\u003cstrong>Use multi-sensory phonics.\u003c/strong> Say, see, trace and write sounds, which also supports 1Rd.01 and 1Rd.02.","\u003cstrong>Offer alternative ways to show learning.\u003c/strong> Pointing, matching, drawing or recording an answer instead of writing it, when the objective is about listening or reading.","\u003cstrong>Plan with the SEN team.\u003c/strong> Share the objective code and the adjustment you are making, so that the individual plan and the lesson match."],"ar":["\u003cstrong>Reduce the language load, not the thinking.\u003c/strong> Use shorter texts, larger print, pictures and key words highlighted. Keep the same objective, for example 3Rd.01 (specific information in a short, simple text).","\u003cstrong>Give more time and more steps.\u003c/strong> Break a writing task into planning, a sentence frame and a check, which matches the \"with support\" wording in the objectives.","\u003cstrong>Use multi-sensory phonics.\u003c/strong> Say, see, trace and write sounds, which also supports 1Rd.01 and 1Rd.02.","\u003cstrong>Offer alternative ways to show learning.\u003c/strong> Pointing, matching, drawing or recording an answer instead of writing it, when the objective is about listening or reading.","\u003cstrong>Plan with the SEN team.\u003c/strong> Share the objective code and the adjustment you are making, so that the individual plan and the lesson match."]}},{"t":"callout","k":"warn","title":{"en":"Language difficulty is not always a learning need","ar":"Language difficulty is not always a learning need"},"c":{"en":"All PEPS learners are learning English as a second language. A learner who is slow to speak may simply be at an early stage of English, or may have a hearing, language or learning difficulty. Do not label too quickly, and do not delay a referral for too long. Record what you observe and speak with your SEN coordinator.","ar":"All PEPS learners are learning English as a second language. A learner who is slow to speak may simply be at an early stage of English, or may have a hearing, language or learning difficulty. Do not label too quickly, and do not delay a referral for too long. Record what you observe and speak with your SEN coordinator."}},{"t":"h","c":{"en":"Gifted and talented learners: good practice","ar":"Gifted and talented learners: good practice"}},{"t":"p","c":{"en":"A learner who finishes early is not always a learner who is challenged. For learners who are advanced in English, the aim is to deepen and extend, not just to give more of the same. Because the stages are unique, one possibility is to use the objectives of the next stage as a guide for a challenge, while keeping the main lesson at the current stage. Consider these examples:","ar":"A learner who finishes early is not always a learner who is challenged. For learners who are advanced in English, the aim is to deepen and extend, not just to give more of the same. Because the stages are unique, one possibility is to use the objectives of the next stage as a guide for a challenge, while keeping the main lesson at the current stage. Consider these examples:"}},{"t":"table","head":{"en":["Class task (stage)","Extension that deepens","Link in the framework"],"ar":["Class task (stage)","Extension that deepens","Link in the framework"]},"rows":[{"en":["Describe an animal in 3 sentences (Stage 3)","Write a second paragraph comparing two animals and explaining why with \"because\"","3Wc.02, 3Ug.09, 3Us.04"],"ar":["Describe an animal in 3 sentences (Stage 3)","Write a second paragraph comparing two animals and explaining why with \"because\"","3Wc.02, 3Ug.09, 3Us.04"]},{"en":["Ask a partner five questions (Stage 4)","Add tag questions and summarise what the partner said to a third person","4Sc.03, 4Ug.01, then 6Sor.02 as a challenge"],"ar":["Ask a partner five questions (Stage 4)","Add tag questions and summarise what the partner said to a third person","4Sc.03, 4Ug.01, then 6Sor.02 as a challenge"]},{"en":["Read a short story (Stage 5)","Say what the writer thinks, find two examples, and write a different ending","5Ro.01, 5Wc.03"],"ar":["Read a short story (Stage 5)","Say what the writer thinks, find two examples, and write a different ending","5Ro.01, 5Wc.03"]},{"en":["Write a short text (Stage 6)","Plan and edit independently, then write a reply from a different point of view","6Wca.03, 6Wor.02"],"ar":["Write a short text (Stage 6)","Plan and edit independently, then write a reply from a different point of view","6Wca.03, 6Wor.02"]}]},{"t":"p","c":{"en":"Challenge should also develop learner independence and thinking, which the framework values: active learning, thinking skills and reflection. Gifted and talented learners may also act as reading buddies or project leaders, but good practice is to make sure the role does not stop them from learning.","ar":"Challenge should also develop learner independence and thinking, which the framework values: active learning, thinking skills and reflection. Gifted and talented learners may also act as reading buddies or project leaders, but good practice is to make sure the role does not stop them from learning."}},{"t":"h","c":{"en":"Adapting for slightly different ages","ar":"Adapting for slightly different ages"}},{"t":"p","c":{"en":"The framework says it may be used for learners of slightly different ages. In a PEPS class, you may have a new learner who is older than the typical age for the stage and has little English, or a younger learner who is very advanced. A practical approach: first, check the learner's real level using the objectives of the previous or next stage as a guide. Second, keep the topic age-appropriate (older learners do not want a babyish topic even if the language level is Stage 1). Third, set can-do goals from the stage that matches their language, and review them every term.","ar":"The framework says it may be used for learners of slightly different ages. In a PEPS class, you may have a new learner who is older than the typical age for the stage and has little English, or a younger learner who is very advanced. A practical approach: first, check the learner's real level using the objectives of the previous or next stage as a guide. Second, keep the topic age-appropriate (older learners do not want a babyish topic even if the language level is Stage 1). Third, set can-do goals from the stage that matches their language, and review them every term."}},{"t":"h","c":{"en":"Transition 1: FS2 to Stage 1","ar":"Transition 1: FS2 to Stage 1"}},{"t":"p","c":{"en":"The framework states that there is no expectation of prior English before Stage 1. So some learners arrive with a lot of English from FS2 and others with very little. Stage 1 begins at a basic level: letters of the alphabet (1Rd.01), blending sounds (1Rd.02), simple words and phrases in illustrated texts (1Rd.03), a limited range of spoken English with support (1Sc.01 to 1Sc.06) and early writing (1Wca.01 to 1Wca.03). Good practice for a smooth start:","ar":"The framework states that there is no expectation of prior English before Stage 1. So some learners arrive with a lot of English from FS2 and others with very little. Stage 1 begins at a basic level: letters of the alphabet (1Rd.01), blending sounds (1Rd.02), simple words and phrases in illustrated texts (1Rd.03), a limited range of spoken English with support (1Sc.01 to 1Sc.06) and early writing (1Wca.01 to 1Wca.03). Good practice for a smooth start:"}},{"t":"list","c":{"en":["Speak with the FS2 team about songs, routines and rhymes children already know, and use them in Stage 1 in the first weeks.","Keep play-based, hands-on tasks, while gradually adding short writing.","Use a simple baseline in the first weeks, such as naming letters, saying a few simple phrases and following two instructions, to see where each child starts. The aim is to teach, not to label.","Share what you learn with parents in a simple, positive way."],"ar":["Speak with the FS2 team about songs, routines and rhymes children already know, and use them in Stage 1 in the first weeks.","Keep play-based, hands-on tasks, while gradually adding short writing.","Use a simple baseline in the first weeks, such as naming letters, saying a few simple phrases and following two instructions, to see where each child starts. The aim is to teach, not to label.","Share what you learn with parents in a simple, positive way."]}},{"t":"h","c":{"en":"Transition 2: Stage 6 to Lower Secondary ESL","ar":"Transition 2: Stage 6 to Lower Secondary ESL"}},{"t":"p","c":{"en":"The framework shows that Cambridge Primary ESL (Stages 1 to 6) is followed by Cambridge Lower Secondary ESL (Stages 7 to 9) and then Cambridge IGCSE, and that this is part of the Cambridge Pathway. A learner at the end of Stage 6 should be ready for longer texts and talk: Stage 6 is the first stage that mentions \"short and extended\" texts and talk, arguments (6Ld.05, 6Rd.03), intonation and stress (6Sc.05), paragraphs (6Wor.02) and reported speech and passives at a beginning level (6Ug.11, 6Ug.03). In the final term, good practice includes:","ar":"The framework shows that Cambridge Primary ESL (Stages 1 to 6) is followed by Cambridge Lower Secondary ESL (Stages 7 to 9) and then Cambridge IGCSE, and that this is part of the Cambridge Pathway. A learner at the end of Stage 6 should be ready for longer texts and talk: Stage 6 is the first stage that mentions \"short and extended\" texts and talk, arguments (6Ld.05, 6Rd.03), intonation and stress (6Sc.05), paragraphs (6Wor.02) and reported speech and passives at a beginning level (6Ug.11, 6Ug.03). In the final term, good practice includes:"}},{"t":"list","c":{"en":["Give learners a few longer reading and listening texts, with support, so that Year 7 is not a surprise.","Teach study skills: using a dictionary, planning a paragraph, proofreading with a checklist.","Pass on clear records by objective code, so that the Year 7 teacher knows which Stage 6 objectives are secure and which are not.","Talk with learners about the change: they will work with more subjects in English and with different teachers."],"ar":["Give learners a few longer reading and listening texts, with support, so that Year 7 is not a surprise.","Teach study skills: using a dictionary, planning a paragraph, proofreading with a checklist.","Pass on clear records by objective code, so that the Year 7 teacher knows which Stage 6 objectives are secure and which are not.","Talk with learners about the change: they will work with more subjects in English and with different teachers."]}},{"t":"h","c":{"en":"Language across the curriculum: supporting ESL learners in Maths and Science","ar":"Language across the curriculum: supporting ESL learners in Maths and Science"}},{"t":"p","c":{"en":"The framework's aims speak of \"knowledge, understanding and skills that can be applied in and across subjects\" and of laying a foundation for \"study through the medium of English\". At PEPS, learners study Mathematics and Science in English, so the ESL teacher and the subject teachers share responsibility. Language objectives can be linked to subject work, as in these examples:","ar":"The framework's aims speak of \"knowledge, understanding and skills that can be applied in and across subjects\" and of laying a foundation for \"study through the medium of English\". At PEPS, learners study Mathematics and Science in English, so the ESL teacher and the subject teachers share responsibility. Language objectives can be linked to subject work, as in these examples:"}},{"t":"table","head":{"en":["Subject need","ESL link","Practical idea (good practice)"],"ar":["Subject need","ESL link","Practical idea (good practice)"]},"rows":[{"en":["Understanding word problems in Maths","Reading and following instructions (2Rd.03 to 6Rd.02); question words (2Ug.01, 3Ug.01)","Teach key words such as \"altogether\", \"more than\", \"each\". Have learners underline the question before solving."],"ar":["Understanding word problems in Maths","Reading and following instructions (2Rd.03 to 6Rd.02); question words (2Ug.01, 3Ug.01)","Teach key words such as \"altogether\", \"more than\", \"each\". Have learners underline the question before solving."]},{"en":["Explaining a Science result","Connectives for reasons and sequence (3Us.04, 3Uv.07, 6Us.04); comparatives (3Ug.09)","Sentence frames: \"First we ... then we ... because ...\" and \"The metal is hotter than the plastic.\""],"ar":["Explaining a Science result","Connectives for reasons and sequence (3Us.04, 3Uv.07, 6Us.04); comparatives (3Ug.09)","Sentence frames: \"First we ... then we ... because ...\" and \"The metal is hotter than the plastic.\""]},{"en":["Writing instructions for an experiment","Writing a sequence of instructions (4Wc.01 to 6Wc.01); imperatives (3Ug.02, 4Ug.03)","Use the same imperative pattern in ESL and Science, and ask the Science teacher to confirm the vocabulary list."],"ar":["Writing instructions for an experiment","Writing a sequence of instructions (4Wc.01 to 6Wc.01); imperatives (3Ug.02, 4Ug.03)","Use the same imperative pattern in ESL and Science, and ask the Science teacher to confirm the vocabulary list."]},{"en":["Predicting and describing in Science","Future forms (4Ug.09), modals of possibility (4Ug.10)","\"I think it will float because ...\" in a prediction table."],"ar":["Predicting and describing in Science","Future forms (4Ug.09), modals of possibility (4Ug.10)","\"I think it will float because ...\" in a prediction table."]}]},{"t":"scenario","title":{"en":"Scenario: shared vocabulary","ar":"Scenario: shared vocabulary"},"c":{"en":"A Stage 4 Science teacher says, \"The learners cannot answer the questions because they do not understand 'compare' and 'predict'.\" What could the ESL and Science teachers do together? They could agree a short list of 10 command words used in Science and Maths questions, teach them in the ESL lesson with simple examples, display them on a classroom wall in both rooms, and ask learners to use them in a sentence frame. The ESL teacher links this to question forms and instructions in the framework, and the Science teacher keeps using the same words.","ar":"A Stage 4 Science teacher says, \"The learners cannot answer the questions because they do not understand 'compare' and 'predict'.\" What could the ESL and Science teachers do together? They could agree a short list of 10 command words used in Science and Maths questions, teach them in the ESL lesson with simple examples, display them on a classroom wall in both rooms, and ask learners to use them in a sentence frame. The ESL teacher links this to question forms and instructions in the framework, and the Science teacher keeps using the same words."}}],"checks":[{"id":"m8q1","q":{"en":"What does the framework say about prior English experience at the start of Stage 1?","ar":"What does the framework say about prior English experience at the start of Stage 1?"},"opts":[{"en":"Learners are expected to have completed a full year of English in the Early Years","ar":"Learners are expected to have completed a full year of English in the Early Years"},{"en":"There is no expectation that learners will have prior experience of English","ar":"There is no expectation that learners will have prior experience of English"},{"en":"Learners must pass a baseline test in English before they start Stage 1","ar":"Learners must pass a baseline test in English before they start Stage 1"},{"en":"Learners should know the letters of the alphabet and basic phrases already","ar":"Learners should know the letters of the alphabet and basic phrases already"}],"correct":1,"expl":{"en":"The framework states that for Cambridge Primary ESL there is no expectation that learners have prior English experience before Stage 1. Stage 1 objectives therefore start at a basic level.","ar":"The framework states that for Cambridge Primary ESL there is no expectation that learners have prior English experience before Stage 1. Stage 1 objectives therefore start at a basic level."}},{"id":"m8q2","q":{"en":"What does the framework say about using the curriculum framework with learners of different ages?","ar":"What does the framework say about using the curriculum framework with learners of different ages?"},"opts":[{"en":"It must be used only for learners who are exactly 5 to 11 years old, without exception","ar":"It must be used only for learners who are exactly 5 to 11 years old, without exception"},{"en":"It may be used for any age as long as the school changes the objectives and tells Cambridge","ar":"It may be used for any age as long as the school changes the objectives and tells Cambridge"},{"en":"Typically ages 5 to 11, but it may suit slightly different ages in your context","ar":"Typically ages 5 to 11, but it may suit slightly different ages in your context"},{"en":"It is for ages 6 to 12, and exceptions need approval from Cambridge","ar":"It is for ages 6 to 12, and exceptions need approval from Cambridge"}],"correct":2,"expl":{"en":"The framework says it is typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context.","ar":"The framework says it is typically for learners aged 5 to 11, but it may be appropriate to use it for slightly different ages to suit your context."}},{"id":"m8q3","q":{"en":"Which of these is the best way to challenge a gifted and talented Stage 5 learner?","ar":"Which of these is the best way to challenge a gifted and talented Stage 5 learner?"},"opts":[{"en":"Give the learner the same worksheet again with ten more questions to complete","ar":"Give the learner the same worksheet again with ten more questions to complete"},{"en":"Move the learner to the Stage 6 coursebook for all lessons without any support","ar":"Move the learner to the Stage 6 coursebook for all lessons without any support"},{"en":"Ask the learner to correct classmates' work during the main part of the lesson","ar":"Ask the learner to correct classmates' work during the main part of the lesson"},{"en":"Ask the learner to say what the writer thinks, find evidence and write a new ending","ar":"Ask the learner to say what the writer thinks, find evidence and write a new ending"}],"correct":3,"expl":{"en":"Challenge should deepen and extend learning, for example by linking reading for opinion (5Ro.01) with a writing task (5Wc.03), rather than giving more of the same.","ar":"Challenge should deepen and extend learning, for example by linking reading for opinion (5Ro.01) with a writing task (5Wc.03), rather than giving more of the same."}}]},{"id":"m9","title":{"en":"Quality and Review: Your Checklist and Action Plan","ar":"Quality and Review: Your Checklist and Action Plan"},"minutes":17,"blocks":[{"t":"p","c":{"en":"This final module brings Part B together. It gives you a practical checklist for a curriculum-aligned ESL lesson, a list of common mistakes and how to avoid them, and a personal action plan. It ends with five take-aways. Remember that the checklist is good practice drawn from the framework's wording; it is not a Cambridge document, and your school may have its own lesson-planning and observation expectations that you should follow as well.","ar":"This final module brings Part B together. It gives you a practical checklist for a curriculum-aligned ESL lesson, a list of common mistakes and how to avoid them, and a personal action plan. It ends with five take-aways. Remember that the checklist is good practice drawn from the framework's wording; it is not a Cambridge document, and your school may have its own lesson-planning and observation expectations that you should follow as well."}},{"t":"h","c":{"en":"A checklist for a curriculum-aligned ESL lesson","ar":"A checklist for a curriculum-aligned ESL lesson"}},{"t":"p","c":{"en":"Use this list when you plan a lesson and again after you teach it. You do not need to tick every box in every lesson, but over a unit all of them should be true.","ar":"Use this list when you plan a lesson and again after you teach it. You do not need to tick every box in every lesson, but over a unit all of them should be true."}},{"t":"table","head":{"en":["Area","Question to ask","Where this comes from"],"ar":["Area","Question to ask","Where this comes from"]},"rows":[{"en":["Objectives","Have I written the objective codes of my stage, and a can-do statement for the learners?","Learning objectives and codes; can-do statements"],"ar":["Objectives","Have I written the objective codes of my stage, and a can-do statement for the learners?","Learning objectives and codes; can-do statements"]},{"en":["Use of English","Is there a clear focus on at least one Use of English objective?","Integrated approach"],"ar":["Use of English","Is there a clear focus on at least one Use of English objective?","Integrated approach"]},{"en":["Skills","Over the lesson or unit, do learners listen, speak, read and write, around one theme?","Integrated approach; objectives from more than one strand"],"ar":["Skills","Over the lesson or unit, do learners listen, speak, read and write, around one theme?","Integrated approach; objectives from more than one strand"]},{"en":["Support","Does my support match the objective wording (\"with support\", \"little or no support\")?","Wording of the objectives"],"ar":["Support","Does my support match the objective wording (\"with support\", \"little or no support\")?","Wording of the objectives"]},{"en":["Texts and talk","Are texts short and suitable for the stage, interesting and, where possible, authentic?","Reading objectives; glossary (authentic language)"],"ar":["Texts and talk","Are texts short and suitable for the stage, interesting and, where possible, authentic?","Reading objectives; glossary (authentic language)"]},{"en":["Learner activity","Are learners speaking, reading, writing or thinking for most of the lesson?","Active learning; learning-centred, activity-based approaches"],"ar":["Learner activity","Are learners speaking, reading, writing or thinking for most of the lesson?","Active learning; learning-centred, activity-based approaches"]},{"en":["Accuracy expectations","Do my corrections match the stage's expectation (frequent, some or occasional mistakes)?","Grammar objectives, for example 3Wca.05, 5Wca.04"],"ar":["Accuracy expectations","Do my corrections match the stage's expectation (frequent, some or occasional mistakes)?","Grammar objectives, for example 3Wca.05, 5Wca.04"]},{"en":["Pronunciation and phonics","Have I planned time for sounds, stress or letter-sound work where it is needed?","Phonics and handwriting; Sc objectives"],"ar":["Pronunciation and phonics","Have I planned time for sounds, stress or letter-sound work where it is needed?","Phonics and handwriting; Sc objectives"]},{"en":["Inclusion","Have I planned support for learners who need it and challenge for those who are ready?","Good practice; support wording in objectives"],"ar":["Inclusion","Have I planned support for learners who need it and challenge for those who are ready?","Good practice; support wording in objectives"]},{"en":["Assessment","Do I have a quick way to check the can-do outcome before the end of the lesson?","Objectives as a reference for checking"],"ar":["Assessment","Do I have a quick way to check the can-do outcome before the end of the lesson?","Objectives as a reference for checking"]},{"en":["Next steps","Will I use what I saw in the lesson to plan the next one?","Good practice; reporting codes"],"ar":["Next steps","Will I use what I saw in the lesson to plan the next one?","Good practice; reporting codes"]}]},{"t":"h","c":{"en":"Common mistakes and how to avoid them","ar":"Common mistakes and how to avoid them"}},{"t":"table","head":{"en":["Common mistake","Why it is a problem","What to do instead"],"ar":["Common mistake","Why it is a problem","What to do instead"]},"rows":[{"en":["Treating the scheme of work as compulsory","The framework says teachers do not need to use the schemes of work, and they do not fill all the teaching time.","Use the objectives as the standard, and use the scheme and other resources as support."],"ar":["Treating the scheme of work as compulsory","The framework says teachers do not need to use the schemes of work, and they do not fill all the teaching time.","Use the objectives as the standard, and use the scheme and other resources as support."]},{"en":["Teaching grammar and skills separately","The framework expects an integrated approach in every lesson and unit.","Choose a theme, and let the language focus appear in listening, speaking, reading and writing."],"ar":["Teaching grammar and skills separately","The framework expects an integrated approach in every lesson and unit.","Choose a theme, and let the language focus appear in listening, speaking, reading and writing."]},{"en":["Too many objectives in one lesson","The lesson cannot be checked, and learners are lost.","Choose one or two main objectives and plan others across the unit."],"ar":["Too many objectives in one lesson","The lesson cannot be checked, and learners are lost.","Choose one or two main objectives and plan others across the unit."]},{"en":["Expecting perfect accuracy too early","The objectives allow frequent, some or occasional mistakes depending on the stage.","Focus feedback on one or two target errors and ask learners to self-correct."],"ar":["Expecting perfect accuracy too early","The objectives allow frequent, some or occasional mistakes depending on the stage.","Focus feedback on one or two target errors and ask learners to self-correct."]},{"en":["Forgetting Speaking and Listening because they are not on paper","They are two of the five strands, and Speaking has no paper in the named Cambridge assessments.","Plan speaking and listening tasks and keep a checklist of observations."],"ar":["Forgetting Speaking and Listening because they are not on paper","They are two of the five strands, and Speaking has no paper in the named Cambridge assessments.","Plan speaking and listening tasks and keep a checklist of observations."]},{"en":["Banning or overusing the first language","The framework values home language in phonics and word links, but English is the aim.","Use first language briefly and for a purpose, and keep the lesson in English."],"ar":["Banning or overusing the first language","The framework values home language in phonics and word links, but English is the aim.","Use first language briefly and for a purpose, and keep the lesson in English."]},{"en":["Collecting results but not using them","Data without action does not improve learning.","Group results by sub-strand and decide one change for the next unit."],"ar":["Collecting results but not using them","Data without action does not improve learning.","Group results by sub-strand and decide one change for the next unit."]},{"en":["Using a result from one test as if it came from another","The Cambridge assessments and the GL Progress Tests are different checks.","Name the source of each result, and follow your school's guidance on reporting."],"ar":["Using a result from one test as if it came from another","The Cambridge assessments and the GL Progress Tests are different checks.","Name the source of each result, and follow your school's guidance on reporting."]},{"en":["Ignoring transition points","Learners moving from FS2 to Stage 1 or from Stage 6 to Year 7 face new demands.","Share information by objective code and prepare learners for the next step."],"ar":["Ignoring transition points","Learners moving from FS2 to Stage 1 or from Stage 6 to Year 7 face new demands.","Share information by objective code and prepare learners for the next step."]}]},{"t":"scenario","title":{"en":"Scenario: reviewing a lesson plan","ar":"Scenario: reviewing a lesson plan"},"c":{"en":"A colleague shows you this plan for Stage 3: \"Topic: Animals. Objectives: 3Ug.09, 3Sc.02, 3Wc.02, 3Rd.01, 3Lm.01, 3Ld.04, 3Lo.01, 3Sor.01, 3Wor.02. Activities: Read the text in the coursebook. Complete exercises 1 to 6. Homework: write about your favourite animal.\" Using the checklist, what do you notice? The plan has too many objectives, and there is no sequence, no listening or speaking task, no support, no success statement and no check. A helpful response: reduce to two or three objectives (for example 3Ug.09, 3Sc.02 and 3Wc.02), add a listening or speaking activity, a sentence frame for support, a can-do statement and a final oral check. Be kind and specific; offer to plan together.","ar":"A colleague shows you this plan for Stage 3: \"Topic: Animals. Objectives: 3Ug.09, 3Sc.02, 3Wc.02, 3Rd.01, 3Lm.01, 3Ld.04, 3Lo.01, 3Sor.01, 3Wor.02. Activities: Read the text in the coursebook. Complete exercises 1 to 6. Homework: write about your favourite animal.\" Using the checklist, what do you notice? The plan has too many objectives, and there is no sequence, no listening or speaking task, no support, no success statement and no check. A helpful response: reduce to two or three objectives (for example 3Ug.09, 3Sc.02 and 3Wc.02), add a listening or speaking activity, a sentence frame for support, a can-do statement and a final oral check. Be kind and specific; offer to plan together."}},{"t":"h","c":{"en":"Your personal action plan","ar":"Your personal action plan"}},{"t":"p","c":{"en":"Professional development is only useful if something changes in your classroom. Complete the following steps on paper, then share them with your HOD or coordinator.","ar":"Professional development is only useful if something changes in your classroom. Complete the following steps on paper, then share them with your HOD or coordinator."}},{"t":"steps","c":{"en":["\u003cstrong>Choose one strength\u003c/strong> from this CPD that you already do well (for example, using pair work or modelling writing) and write one sentence about it.","\u003cstrong>Choose one priority.\u003c/strong> Pick one area from Part B to improve in the next half term, for example \"plan every lesson with a can-do statement and one Use of English objective\".","\u003cstrong>Write one specific action.\u003c/strong> Name the class, the objective code and the change, for example \"In Stage 4 Writing, teach 4Wor.02 (linking sentences with connectives) with a model, a frame and a self-check.\"","\u003cstrong>Decide how you will know it worked.\u003c/strong> Name the evidence: for example, a writing sample before and after, or a checklist with the numbers of learners who are secure.","\u003cstrong>Set a date and a partner.\u003c/strong> Choose a date to review and a colleague who will observe or discuss with you."],"ar":["\u003cstrong>Choose one strength\u003c/strong> from this CPD that you already do well (for example, using pair work or modelling writing) and write one sentence about it.","\u003cstrong>Choose one priority.\u003c/strong> Pick one area from Part B to improve in the next half term, for example \"plan every lesson with a can-do statement and one Use of English objective\".","\u003cstrong>Write one specific action.\u003c/strong> Name the class, the objective code and the change, for example \"In Stage 4 Writing, teach 4Wor.02 (linking sentences with connectives) with a model, a frame and a self-check.\"","\u003cstrong>Decide how you will know it worked.\u003c/strong> Name the evidence: for example, a writing sample before and after, or a checklist with the numbers of learners who are secure.","\u003cstrong>Set a date and a partner.\u003c/strong> Choose a date to review and a colleague who will observe or discuss with you."]}},{"t":"callout","k":"tip","title":{"en":"A sample action plan to copy","ar":"A sample action plan to copy"},"c":{"en":"\u003cem>Strength:\u003c/em> my learners enjoy pair speaking. \u003cem>Priority:\u003c/em> improve Stage 5 writing organisation. \u003cem>Action:\u003c/em> every writing lesson for three weeks, model one paragraph with connectives (5Wor.02) and give a three-point checklist. \u003cem>Evidence:\u003c/em> compare two writing samples per learner, week 1 and week 4. \u003cem>Review:\u003c/em> end of the month with my HOD.","ar":"\u003cem>Strength:\u003c/em> my learners enjoy pair speaking. \u003cem>Priority:\u003c/em> improve Stage 5 writing organisation. \u003cem>Action:\u003c/em> every writing lesson for three weeks, model one paragraph with connectives (5Wor.02) and give a three-point checklist. \u003cem>Evidence:\u003c/em> compare two writing samples per learner, week 1 and week 4. \u003cem>Review:\u003c/em> end of the month with my HOD."}},{"t":"h","c":{"en":"Part A and Part B together","ar":"Part A and Part B together"}},{"t":"p","c":{"en":"Part A of this CPD helped you understand how the framework is built: the strands, the CEFR link, the codes and the content of each stage. Part B has shown how to use it every day. A good habit is to keep the framework PDF for your stage open when you plan, because the exact wording of each objective, including its support words, is your best guide. Also check that you are using the current version. The framework studied here is version 3.0, published September 2025, and its changes section says that information on phonics and handwriting was added. Always check the current Cambridge documents on the School Support Hub or ask your coordinator.","ar":"Part A of this CPD helped you understand how the framework is built: the strands, the CEFR link, the codes and the content of each stage. Part B has shown how to use it every day. A good habit is to keep the framework PDF for your stage open when you plan, because the exact wording of each objective, including its support words, is your best guide. Also check that you are using the current version. The framework studied here is version 3.0, published September 2025, and its changes section says that information on phonics and handwriting was added. Always check the current Cambridge documents on the School Support Hub or ask your coordinator."}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> The learning objectives are the standard; schemes of work, textbooks and the teacher guide are support. \u003cstrong>2.\u003c/strong> Every lesson and unit should integrate reading, writing, listening and speaking, with a focus on Use of English. \u003cstrong>3.\u003c/strong> The words \"with support\" and \"allowing for frequent, some or occasional mistakes\" tell you what to expect and how to give feedback at each stage. \u003cstrong>4.\u003c/strong> Use can-do checklists, reporting codes, classroom evidence and external checks together, and use the evidence to change your next lesson. \u003cstrong>5.\u003c/strong> Plan for all learners, including students of determination, gifted and talented learners and learners at transition points. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance.","ar":"\u003cstrong>1.\u003c/strong> The learning objectives are the standard; schemes of work, textbooks and the teacher guide are support. \u003cstrong>2.\u003c/strong> Every lesson and unit should integrate reading, writing, listening and speaking, with a focus on Use of English. \u003cstrong>3.\u003c/strong> The words \"with support\" and \"allowing for frequent, some or occasional mistakes\" tell you what to expect and how to give feedback at each stage. \u003cstrong>4.\u003c/strong> Use can-do checklists, reporting codes, classroom evidence and external checks together, and use the evidence to change your next lesson. \u003cstrong>5.\u003c/strong> Plan for all learners, including students of determination, gifted and talented learners and learners at transition points. This CPD supports, and does not replace, the Cambridge curriculum framework and the school's own guidance."}}],"checks":[{"id":"m9q1","q":{"en":"Which of these is the most important reason for choosing only one or two main objectives in a lesson?","ar":"Which of these is the most important reason for choosing only one or two main objectives in a lesson?"},"opts":[{"en":"A lesson with many objectives cannot be checked and learners can be lost","ar":"A lesson with many objectives cannot be checked and learners can be lost"},{"en":"Cambridge allows only two objectives in each lesson plan for each stage","ar":"Cambridge allows only two objectives in each lesson plan for each stage"},{"en":"Other objectives are taught only in the scheme of work and never in class","ar":"Other objectives are taught only in the scheme of work and never in class"},{"en":"The teacher guide requires the same two objectives in every unit","ar":"The teacher guide requires the same two objectives in every unit"}],"correct":0,"expl":{"en":"Choosing one or two main objectives allows a clear success statement and a quick check, while other objectives are planned across the unit.","ar":"Choosing one or two main objectives allows a clear success statement and a quick check, while other objectives are planned across the unit."}},{"id":"m9q2","q":{"en":"A colleague uses the Stage 3 scheme of work but finds that its activities do not fill all the lessons. What is the /* ---------- state + storage ---------- */
const META = CPD.meta, PASS = META.passMark;
const KEY = 'peps_cpd_' + META.id + '_v1';
let memCopy = null;
function loadState(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} try{ if(memCopy) return JSON.parse(memCopy); }catch(e){} return null; }
function saveState(){ const s = JSON.stringify(S); memCopy = s; try{ localStorage.setItem(KEY, s); }catch(e){} }
const fresh = () => ({ lang:'en', view:'home', mod:0, ok:{}, wrong:{}, exam:{ order:null, answers:{}, result:null }, attempts:0, best:0, passed:false, cert:null, started:false });
let S = Object.assign(fresh(), loadState() || {});
if(!S.exam) S.exam = fresh().exam;
if(CPD.meta.englishOnly) S.lang = 'en';

const T = () => UI[S.lang];
const tx = o => o[S.lang];
const nM = CPD.modules.length;
const fill = s => s.replace('__PASS__', PASS).replace('__N__', CPD.exam.length);
const LET = S0 => (S.lang==='ar' ? ['أ','ب','ج','د'] : ['A','B','C','D']);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const checkKey = (m, q) => m.id + ':' + q.id;
const modDone = i => CPD.modules[i].checks.every(q => S.ok[checkKey(CPD.modules[i], q)]);
const allModsDone = () => CPD.modules.every((_, i) => modDone(i));
const unlocked = i => i === 0 || modDone(i - 1);
const doneCount = () => CPD.modules.filter((_, i) => modDone(i)).length;
const progressPct = () => Math.round(100 * (doneCount() + (S.passed ? 1 : 0)) / (nM + 1));
const totalMin = () => CPD.modules.reduce((a, m) => a + m.minutes, 0);

/* ---------- block renderer ---------- */
function renderBlock(b){
  const L_ = S.lang;
  switch(b.t){
    case 'p': return `<p>${b.c[L_]}</p>`;
    case 'h': return `<h3>${b.c[L_]}</h3>`;
    case 'list': return `<ul>${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps">${b.c[L_].map(x => `<li>${x}</li>`).join('')}</ol>`;
    case 'callout': return `<div class="callout ${b.k}"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'scenario': return `<div class="scenario"><span class="ct">${b.title[L_]}</span><p>${b.c[L_]}</p></div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head[L_].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r[L_].map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function sidebar(){
  const t = T();
  let h = `<aside class="side"><h4>${t.modules}</h4>`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</aside>`;
}

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">← ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} →</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = mods[mi].map(id => { const n = r.orderAtSubmit.indexOf(id)+1; return `${t.qLabel} ${n}`; }).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">→</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
