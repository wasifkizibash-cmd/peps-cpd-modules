 record strengths and show the department in a positive light","ar":"Mention only the strand of number, since the SEF should record strengths and show the department in a positive light"},{"en":"Plan a general mathematics CPD for all staff in the department without naming a topic or a measure of success","ar":"Plan a general mathematics CPD for all staff in the department without naming a topic or a measure of success"},{"en":"Name the weak strand in the SEF narrative and link a SMART step for improvement to it","ar":"Name the weak strand in the SEF narrative and link a SMART step for improvement to it"}],"correct":3,"expl":{"en":"Strand evidence makes the SEF specific. A named weakness leads to a targeted step with an owner, a timescale and a measure.","ar":"Strand evidence makes the SEF specific. A named weakness leads to a targeted step with an owner, a timescale and a measure."}}]},{"id":"m5","title":{"en":"Science Department: Evidence and Narratives by Phase","ar":"Science Department: Evidence and Narratives by Phase"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Science progress has two strands that must both appear in the SEF: progress in scientific knowledge and understanding (biology, chemistry, physics) and progress in working scientifically (planning an enquiry, handling equipment safely, collecting and interpreting data, and drawing conclusions). A department can show strong test scores in knowledge and still have weak progress in enquiry skills, because written tests often assess the second strand lightly.","ar":"Science progress has two strands that must both appear in the SEF: progress in scientific knowledge and understanding (biology, chemistry, physics) and progress in working scientifically (planning an enquiry, handling equipment safely, collecting and interpreting data, and drawing conclusions). A department can show strong test scores in knowledge and still have weak progress in enquiry skills, because written tests often assess the second strand lightly."}},{"t":"h","c":{"en":"Evidence and typical analyses for each phase","ar":"Evidence and typical analyses for each phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Baseline and ongoing observation of understanding of the world: curiosity, questions, exploring materials and living things","Proportion of children who moved from baseline to end-of-year stage in exploring, asking questions and describing observations; groups by language level","Listing activities as evidence; no baseline; no link to children's talk or recorded observations"],"ar":["Phase 1: FS2","Baseline and ongoing observation of understanding of the world: curiosity, questions, exploring materials and living things","Proportion of children who moved from baseline to end-of-year stage in exploring, asking questions and describing observations; groups by language level","Listing activities as evidence; no baseline; no link to children's talk or recorded observations"]},{"en":["Phase 2: Years 1 to 6","Unit tests; practical work records; GL Progress Test Science (Years 4 and 6); Cambridge Primary Checkpoint Science 0097 (Year 6); TIMSS-style items at Year 5","Year 4 to Year 6 GL movement; Checkpoint analysis report by topic; progress in working scientifically in books; groups","Only two GL points; Years 1 to 3 rely on internal assessment; practical work that is shown in photographs but not assessed"],"ar":["Phase 2: Years 1 to 6","Unit tests; practical work records; GL Progress Test Science (Years 4 and 6); Cambridge Primary Checkpoint Science 0097 (Year 6); TIMSS-style items at Year 5","Year 4 to Year 6 GL movement; Checkpoint analysis report by topic; progress in working scientifically in books; groups","Only two GL points; Years 1 to 3 rely on internal assessment; practical work that is shown in photographs but not assessed"]},{"en":["Phase 3: Years 7 to 9","GL Progress Test Science (Year 8); Cambridge Lower Secondary Checkpoint Science 0893 (Year 9); unit tests and practical assessments; TIMSS Grade 8 style items at Year 9","Year 6 to Year 8 GL movement; Year 6 to Year 9 Checkpoint comparison at cohort level, with cautions; biology, chemistry and physics strands; working scientifically","A single combined science score hiding a weak discipline; treating the Checkpoint comparison as an exact gain"],"ar":["Phase 3: Years 7 to 9","GL Progress Test Science (Year 8); Cambridge Lower Secondary Checkpoint Science 0893 (Year 9); unit tests and practical assessments; TIMSS Grade 8 style items at Year 9","Year 6 to Year 8 GL movement; Year 6 to Year 9 Checkpoint comparison at cohort level, with cautions; biology, chemistry and physics strands; working scientifically","A single combined science score hiding a weak discipline; treating the Checkpoint comparison as an exact gain"]},{"en":["Phase 4: Years 10 to 13","GL Progress Test Science (Year 10); IGCSE Biology 0610, Chemistry 0620, Physics 0625; AS and A level outcomes where relevant; mocks; practical or Alternative to Practical assessments; PISA-style items at Years 10 and 11","Year 8 to Year 10 GL movement; GL Year 10 against IGCSE outcomes by subject; progress in mocks; Paper 4 or practical skills compared with theory skills","Averaging across three sciences; small groups in Years 12 and 13; confusing a high grade with progress"],"ar":["Phase 4: Years 10 to 13","GL Progress Test Science (Year 10); IGCSE Biology 0610, Chemistry 0620, Physics 0625; AS and A level outcomes where relevant; mocks; practical or Alternative to Practical assessments; PISA-style items at Years 10 and 11","Year 8 to Year 10 GL movement; GL Year 10 against IGCSE outcomes by subject; progress in mocks; Paper 4 or practical skills compared with theory skills","Averaging across three sciences; small groups in Years 12 and 13; confusing a high grade with progress"]}]},{"t":"callout","k":"key","title":{"en":"For example: keep the Good evidence current","ar":"For example: keep the Good evidence current"},"c":{"en":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. The same principle applies to progress: a past rating is not evidence. Use this year's GL and Checkpoint analyses, this year's books and this year's lessons, and show what has been maintained and what has changed.","ar":"For example, the school's January 2025 inspection rated Science Phase 2 attainment as Good, so the SEF must evidence this again with current data. The same principle applies to progress: a past rating is not evidence. Use this year's GL and Checkpoint analyses, this year's books and this year's lessons, and show what has been maintained and what has changed."}},{"t":"h","c":{"en":"What to look at in books and lessons","ar":"What to look at in books and lessons"}},{"t":"list","c":{"en":["Working scientifically: whether students plan fair tests, control variables and evaluate their method with more independence over time.","Scientific language: whether students use precise terms (for example \"evaporation\", \"force\", \"respiration\") correctly in writing and in talk, and not only in the glossary.","Data: whether students draw, read and interpret graphs and tables with growing accuracy, and explain patterns.","Safety and practical competence: whether students handle equipment safely and follow procedures with less prompting, recorded in teacher notes.","Challenge: whether students who already understand the content receive extension tasks that require reasoning and explanation."],"ar":["Working scientifically: whether students plan fair tests, control variables and evaluate their method with more independence over time.","Scientific language: whether students use precise terms (for example \"evaporation\", \"force\", \"respiration\") correctly in writing and in talk, and not only in the glossary.","Data: whether students draw, read and interpret graphs and tables with growing accuracy, and explain patterns.","Safety and practical competence: whether students handle equipment safely and follow procedures with less prompting, recorded in teacher notes.","Challenge: whether students who already understand the content receive extension tasks that require reasoning and explanation."]}},{"t":"h","c":{"en":"Worked mini-example: Phase 2 Science","ar":"Worked mini-example: Phase 2 Science"}},{"t":"callout","k":"warn","title":{"en":"Illustrative figures (not PEPS data)","ar":"Illustrative figures (not PEPS data)"},"c":{"en":"All numbers below are made up to show the method. Replace them with your own data and do not copy the wording.","ar":"All numbers below are made up to show the method. Replace them with your own data and do not copy the wording."}},{"t":"p","c":{"en":"\u003cstrong>PHASE 2: JUDGEMENT (draft).\u003c/strong> \"In Years 1 to 6, most students in the Year 4 to Year 6 GL cohort (77%, 92 of 120) kept or raised their standardised Science score, compared with 72% for the previous cohort. A minority (18%) rose by more than 5 points. A minority (23%) fell. In the Year 6 Checkpoint Science analysis report, students were stronger in biology than in physics. In the Year 5 and Year 6 book scrutiny of 30 books, a majority (57%) showed independent planning of a fair test, while a large minority (43%) still needed teacher prompts. Emirati students and girls made progress in line with the cohort. Students of determination in the sample (10 students) made slower progress, but the group is small. Steps for improvement focus on physics, on independent planning of enquiry, and on the students whose scores fell.\"","ar":"\u003cstrong>PHASE 2: JUDGEMENT (draft).\u003c/strong> \"In Years 1 to 6, most students in the Year 4 to Year 6 GL cohort (77%, 92 of 120) kept or raised their standardised Science score, compared with 72% for the previous cohort. A minority (18%) rose by more than 5 points. A minority (23%) fell. In the Year 6 Checkpoint Science analysis report, students were stronger in biology than in physics. In the Year 5 and Year 6 book scrutiny of 30 books, a majority (57%) showed independent planning of a fair test, while a large minority (43%) still needed teacher prompts. Emirati students and girls made progress in line with the cohort. Students of determination in the sample (10 students) made slower progress, but the group is small. Steps for improvement focus on physics, on independent planning of enquiry, and on the students whose scores fell.\""}},{"t":"p","c":{"en":"The narrative is balanced: it states what is good, what is weaker and which groups are affected. It compares with a previous cohort and not only with a target. It does not claim that every student makes progress.","ar":"The narrative is balanced: it states what is good, what is weaker and which groups are affected. It compares with a previous cohort and not only with a target. It does not claim that every student makes progress."}},{"t":"scenario","title":{"en":"Scenario: strong tests, weak enquiry","ar":"Scenario: strong tests, weak enquiry"},"c":{"en":"A Phase 3 HOD writes that progress is very strong because Year 8 GL Science scores rose. The book scrutiny shows that practical work is mostly teacher-led, with the same method sheet used in all classes. \u003cstrong>How should the SEF handle this?\u003c/strong> It should report the GL improvement and then say that students' progress in independent enquiry is less secure, citing the scrutiny. The grade should reflect the full picture, and a step for improvement should address enquiry.","ar":"A Phase 3 HOD writes that progress is very strong because Year 8 GL Science scores rose. The book scrutiny shows that practical work is mostly teacher-led, with the same method sheet used in all classes. \u003cstrong>How should the SEF handle this?\u003c/strong> It should report the GL improvement and then say that students' progress in independent enquiry is less secure, citing the scrutiny. The grade should reflect the full picture, and a step for improvement should address enquiry."}},{"t":"callout","k":"warn","title":{"en":"Common Science department pitfalls","ar":"Common Science department pitfalls"},"c":{"en":"Merging biology, chemistry and physics into a single figure; counting practical lessons as evidence of progress without assessing practical skills; leaving out safety; using photographs of experiments as evidence of learning.","ar":"Merging biology, chemistry and physics into a single figure; counting practical lessons as evidence of progress without assessing practical skills; leaving out safety; using photographs of experiments as evidence of learning."}}],"checks":[{"id":"m5q1","q":{"en":"A HOD wants to evidence progress in \"working scientifically\" in Years 5 and 6. Which evidence is most useful?","ar":"A HOD wants to evidence progress in \"working scientifically\" in Years 5 and 6. Which evidence is most useful?"},"opts":[{"en":"A scrutiny of books comparing a student's early and later enquiry write-ups for independence and accuracy","ar":"A scrutiny of books comparing a student's early and later enquiry write-ups for independence and accuracy"},{"en":"Photographs of Year 5 and Year 6 students carrying out experiments, displayed on the department notice board","ar":"Photographs of Year 5 and Year 6 students carrying out experiments, displayed on the department notice board"},{"en":"A copy of the scheme of work showing the number of practical lessons planned in each Science unit","ar":"A copy of the scheme of work showing the number of practical lessons planned in each Science unit"},{"en":"A list of the equipment purchased for the laboratory during the year, with the cost of each item","ar":"A list of the equipment purchased for the laboratory during the year, with the cost of each item"}],"correct":0,"expl":{"en":"Progress needs a comparison over time in the quality of students' own work. Photographs, plans and equipment lists show activity and not learning.","ar":"Progress needs a comparison over time in the quality of students' own work. Photographs, plans and equipment lists show activity and not learning."}},{"id":"m5q2","q":{"en":"In Phase 4, a HOD calculates a single percentage for \"Science\" from IGCSE Biology, Chemistry and Physics together. What is the main risk?","ar":"In Phase 4, a HOD calculates a single percentage for \"Science\" from IGCSE Biology, Chemistry and Physics together. What is the main risk?"},"opts":[{"en":"The figure will always be too low, because the three syllabuses use different paper numbers and different exam dates","ar":"The figure will always be too low, because the three syllabuses use different paper numbers and different exam dates"},{"en":"A weaker subject or a smaller group can be hidden inside the combined figure, so the analysis should be by subject","ar":"A weaker subject or a smaller group can be hidden inside the combined figure, so the analysis should be by subject"},{"en":"The figure cannot be compared with GL data, because GL does not report Science scores for any students","ar":"The figure cannot be compared with GL data, because GL does not report Science scores for any students"},{"en":"There is no risk, because the three sciences share one syllabus code and the same grade boundaries each year","ar":"There is no risk, because the three sciences share one syllabus code and the same grade boundaries each year"}],"correct":1,"expl":{"en":"Combined figures can hide differences between disciplines and groups. Report each subject, then summarise.","ar":"Combined figures can hide differences between disciplines and groups. Report each subject, then summarise."}},{"id":"m5q3","q":{"en":"The January 2025 inspection rated Science Phase 2 attainment as Good. How should the current SEF use this?","ar":"The January 2025 inspection rated Science Phase 2 attainment as Good. How should the current SEF use this?"},"opts":[{"en":"Quote the earlier rating as sufficient evidence for the current progress judgement in Phase 2","ar":"Quote the earlier rating as sufficient evidence for the current progress judgement in Phase 2"},{"en":"Leave out current data because the inspection result already confirms the department's position","ar":"Leave out current data because the inspection result already confirms the department's position"},{"en":"Treat it as context only and evidence the current year with present data, books and lessons","ar":"Treat it as context only and evidence the current year with present data, books and lessons"},{"en":"Copy the last SEF narrative for Phase 2 and change only the dates and the names of the classes","ar":"Copy the last SEF narrative for Phase 2 and change only the dates and the names of the classes"}],"correct":2,"expl":{"en":"A past rating is background. A SEF must show current evidence and what has changed since.","ar":"A past rating is background. A SEF must show current evidence and what has changed since."}}]},{"id":"m6","title":{"en":"Writing the Judgement: Narratives, Proportion Language and Honest Grading","ar":"Writing the Judgement: Narratives, Proportion Language and Honest Grading"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Each phase has its own section headed \"PHASE X: JUDGEMENT\". The reader should be able to understand the grade from the narrative without opening another document. Good narratives are short, specific and honest. Write them in the order below.","ar":"Each phase has its own section headed \"PHASE X: JUDGEMENT\". The reader should be able to understand the grade from the narrative without opening another document. Good narratives are short, specific and honest. Write them in the order below."}},{"t":"h","c":{"en":"The structure of a PHASE X: JUDGEMENT narrative","ar":"The structure of a PHASE X: JUDGEMENT narrative"}},{"t":"steps","c":{"en":["Overall claim: one sentence stating the pattern, with the proportion term and figure.","Evidence: the comparison with starting points, the previous year and the benchmark, with the name of each source.","Strands and groups: where progress is stronger or weaker, and which groups are affected.","Progress in lessons and books: what the scrutiny and visits show, with sample size.","Impact: what this means for students (for example \"so these students are better prepared for the Year 9 Checkpoint\").","Limits: what the data does not show, and the direction of the steps for improvement."],"ar":["Overall claim: one sentence stating the pattern, with the proportion term and figure.","Evidence: the comparison with starting points, the previous year and the benchmark, with the name of each source.","Strands and groups: where progress is stronger or weaker, and which groups are affected.","Progress in lessons and books: what the scrutiny and visits show, with sample size.","Impact: what this means for students (for example \"so these students are better prepared for the Year 9 Checkpoint\").","Limits: what the data does not show, and the direction of the steps for improvement."]}},{"t":"h","c":{"en":"Claim, evidence, impact","ar":"Claim, evidence, impact"}},{"t":"table","head":{"en":["Weak sentence","Why it is weak","Stronger version"],"ar":["Weak sentence","Why it is weak","Stronger version"]},"rows":[{"en":["Students make good progress in mathematics.","No figure, no starting point, no source; \"good\" is a vague adjective","Most students (78%, 94 of 120) kept or raised their GL Mathematics score from Year 6 to Year 8 (GL reports, 2 years), so they are on course for the Year 9 Checkpoint."],"ar":["Students make good progress in mathematics.","No figure, no starting point, no source; \"good\" is a vague adjective","Most students (78%, 94 of 120) kept or raised their GL Mathematics score from Year 6 to Year 8 (GL reports, 2 years), so they are on course for the Year 9 Checkpoint."]},{"en":["Progress is strong across all groups.","\"All\" is unsupported; no group is named","Girls and Emirati students made progress in line with the cohort; boys' writing progress was lower, and a step for improvement targets this."],"ar":["Progress is strong across all groups.","\"All\" is unsupported; no group is named","Girls and Emirati students made progress in line with the cohort; boys' writing progress was lower, and a step for improvement targets this."]},{"en":["Teachers track progress carefully.","Describes a process, not an outcome","Termly tracking identified 14 students who fell behind; 11 had returned to expected progress by the next term (tracker, Terms 1 and 2)."],"ar":["Teachers track progress carefully.","Describes a process, not an outcome","Termly tracking identified 14 students who fell behind; 11 had returned to expected progress by the next term (tracker, Terms 1 and 2)."]},{"en":["Data shows improvement.","Which data, which students, how much?","The Year 6 Checkpoint Science score for the cohort rose compared with the previous Year 6 cohort (Cambridge analysis reports, current and previous year)."],"ar":["Data shows improvement.","Which data, which students, how much?","The Year 6 Checkpoint Science score for the cohort rose compared with the previous Year 6 cohort (Cambridge analysis reports, current and previous year)."]}]},{"t":"callout","k":"tip","title":{"en":"Impact is the \"so what\"","ar":"Impact is the \"so what\""},"c":{"en":"After each piece of evidence, ask what it means for students: are they better prepared for the next stage, do they have a gap that limits other subjects, or is a group at risk of falling further behind? A sentence that ends with impact is more persuasive than one that ends with a number.","ar":"After each piece of evidence, ask what it means for students: are they better prepared for the next stage, do they have a gap that limits other subjects, or is a group at risk of falling further behind? A sentence that ends with impact is more persuasive than one that ends with a number."}},{"t":"h","c":{"en":"Proportion language: practice","ar":"Proportion language: practice"}},{"t":"p","c":{"en":"Use the bands exactly: almost all (over 90%), most (75% to 90%), a large majority (61% to 74%), a majority (50% to 60%), a large minority (31% to 49%), a minority (16% to 30%), few (up to 15%). Never use \"many\", \"some\" or \"the vast majority\" in the place of a band. Put the figure beside the term. If the figure does not fit a band because of rounding, state your rule and apply it consistently.","ar":"Use the bands exactly: almost all (over 90%), most (75% to 90%), a large majority (61% to 74%), a majority (50% to 60%), a large minority (31% to 49%), a minority (16% to 30%), few (up to 15%). Never use \"many\", \"some\" or \"the vast majority\" in the place of a band. Put the figure beside the term. If the figure does not fit a band because of rounding, state your rule and apply it consistently."}},{"t":"h","c":{"en":"A full model paragraph","ar":"A full model paragraph"}},{"t":"callout","k":"warn","title":{"en":"Illustrative figures (not PEPS data)","ar":"Illustrative figures (not PEPS data)"},"c":{"en":"This is an invented model to show structure. Use your own data and your own words, and do not copy across phases.","ar":"This is an invented model to show structure. Use your own data and your own words, and do not copy across phases."}},{"t":"p","c":{"en":"\u003cstrong>PHASE 3: JUDGEMENT (model structure).\u003c/strong> \"Most students in Years 7 to 9 (80%, 77 of 96) made the progress expected in Science between Year 6 and Year 8, as measured by GL Progress Test standardised scores, compared with 74% in the previous cohort. A minority (19%) made more than expected progress. A minority (20%) made less than expected, mostly in physics according to the strand report. The Year 9 book scrutiny (30 books) shows a majority of students (60%) correcting errors after feedback; a large minority (40%) repeated the same error. Girls and boys made similar progress. Emirati students' progress is in line with the cohort. Students of determination (11 students) made less progress in written explanations, although they matched peers in practical work. As a result, a minority of students may reach the Year 9 Checkpoint with gaps in physics. The grade reflects secure progress for most students with identified weaknesses; the steps for improvement target physics, feedback and written explanation.\"","ar":"\u003cstrong>PHASE 3: JUDGEMENT (model structure).\u003c/strong> \"Most students in Years 7 to 9 (80%, 77 of 96) made the progress expected in Science between Year 6 and Year 8, as measured by GL Progress Test standardised scores, compared with 74% in the previous cohort. A minority (19%) made more than expected progress. A minority (20%) made less than expected, mostly in physics according to the strand report. The Year 9 book scrutiny (30 books) shows a majority of students (60%) correcting errors after feedback; a large minority (40%) repeated the same error. Girls and boys made similar progress. Emirati students' progress is in line with the cohort. Students of determination (11 students) made less progress in written explanations, although they matched peers in practical work. As a result, a minority of students may reach the Year 9 Checkpoint with gaps in physics. The grade reflects secure progress for most students with identified weaknesses; the steps for improvement target physics, feedback and written explanation.\""}},{"t":"h","c":{"en":"Grading the judgement honestly","ar":"Grading the judgement honestly"}},{"t":"p","c":{"en":"Use the grade scale and descriptors in the school's SEF template. Grades such as Good, Acceptable or Very good are examples only. To grade honestly, test each claim against its evidence.","ar":"Use the grade scale and descriptors in the school's SEF template. Grades such as Good, Acceptable or Very good are examples only. To grade honestly, test each claim against its evidence."}},{"t":"table","head":{"en":["Test","Question to ask","If the answer is no"],"ar":["Test","Question to ask","If the answer is no"]},"rows":[{"en":["Evidence or claim?","Can I point to a named document and a figure for this statement?","Remove the statement or find the evidence"],"ar":["Evidence or claim?","Can I point to a named document and a figure for this statement?","Remove the statement or find the evidence"]},{"en":["Same cohort?","Does the comparison follow the same students, or two different groups?","Re-describe it as a comparison between cohorts and not as progress"],"ar":["Same cohort?","Does the comparison follow the same students, or two different groups?","Re-describe it as a comparison between cohorts and not as progress"]},{"en":["Weakness included?","Have I stated at least one real area for improvement and the group affected?","Re-read the data; every phase has an area for development"],"ar":["Weakness included?","Have I stated at least one real area for improvement and the group affected?","Re-read the data; every phase has an area for development"]},{"en":["Consistent?","Does the grade fit the narrative and match the evidence in the other KPIs?","Adjust the grade or the narrative"],"ar":["Consistent?","Does the grade fit the narrative and match the evidence in the other KPIs?","Adjust the grade or the narrative"]},{"en":["Different by phase?","Is each phase written from its own evidence, not copied?","Rewrite using that phase's data"],"ar":["Different by phase?","Is each phase written from its own evidence, not copied?","Rewrite using that phase's data"]}]},{"t":"callout","k":"warn","title":{"en":"Common weaknesses in draft judgements","ar":"Common weaknesses in draft judgements"},"c":{"en":"Copying one paragraph across four phases; using \"good\" or \"strong\" with no figure; describing teaching activities in place of student outcomes; naming no group; presenting a cohort comparison as individual progress; omitting what the data does not show; a high grade with a narrative that lists several weaknesses.","ar":"Copying one paragraph across four phases; using \"good\" or \"strong\" with no figure; describing teaching activities in place of student outcomes; naming no group; presenting a cohort comparison as individual progress; omitting what the data does not show; a high grade with a narrative that lists several weaknesses."}}],"checks":[{"id":"m6q1","q":{"en":"In a cohort of 150, 108 students made the expected progress. Which phrase should the SEF use?","ar":"In a cohort of 150, 108 students made the expected progress. Which phrase should the SEF use?"},"opts":[{"en":"Most students (72%)","ar":"Most students (72%)"},{"en":"Almost all students (72%)","ar":"Almost all students (72%)"},{"en":"A majority of students (72%)","ar":"A majority of students (72%)"},{"en":"A large majority of students (72%)","ar":"A large majority of students (72%)"}],"correct":3,"expl":{"en":"108 divided by 150 is 72%. That falls in the 61% to 74% band, which is \"a large majority\". \"Most\" starts at 75%.","ar":"108 divided by 150 is 72%. That falls in the 61% to 74% band, which is \"a large majority\". \"Most\" starts at 75%."}},{"id":"m6q2","q":{"en":"A Phase 3 draft says: \"Progress is Very good because teachers plan carefully and students are happy.\" What should the HOD do?","ar":"A Phase 3 draft says: \"Progress is Very good because teachers plan carefully and students are happy.\" What should the HOD do?"},"opts":[{"en":"Replace the inputs with outcomes: movement from starting points, proportions, groups, and the sources","ar":"Replace the inputs with outcomes: movement from starting points, proportions, groups, and the sources"},{"en":"Keep the sentence and add a second sentence that describes the number of lessons observed by the leaders","ar":"Keep the sentence and add a second sentence that describes the number of lessons observed by the leaders"},{"en":"Keep the grade and ask the principal to confirm that the grade is consistent with last year's SEF","ar":"Keep the grade and ask the principal to confirm that the grade is consistent with last year's SEF"},{"en":"Remove the grade from the judgement table and keep the narrative as a general description of the department","ar":"Remove the grade from the judgement table and keep the narrative as a general description of the department"}],"correct":0,"expl":{"en":"Planning and happiness are inputs. A progress judgement needs outcomes shown by comparison with starting points.","ar":"Planning and happiness are inputs. A progress judgement needs outcomes shown by comparison with starting points."}},{"id":"m6q3","q":{"en":"A draft Phase 4 judgement lists three clear weaknesses in progress by group but gives the highest grade on the scale. What is the best action?","ar":"A draft Phase 4 judgement lists three clear weaknesses in progress by group but gives the highest grade on the scale. What is the best action?"},"opts":[{"en":"Leave the grade as it is, because the school's overall results are strong and the weaknesses affect only a few groups","ar":"Leave the grade as it is, because the school's overall results are strong and the weaknesses affect only a few groups"},{"en":"Re-check the narrative and the grade against the template descriptors, and change whichever one the evidence does not support","ar":"Re-check the narrative and the grade against the template descriptors, and change whichever one the evidence does not support"},{"en":"Delete the weaknesses so that the narrative matches the grade, then add a sentence about the department's strong ethos","ar":"Delete the weaknesses so that the narrative matches the grade, then add a sentence about the department's strong ethos"},{"en":"Keep both and add a note that the weaknesses will be addressed in the next academic year without any further detail","ar":"Keep both and add a note that the weaknesses will be addressed in the next academic year without any further detail"}],"correct":1,"expl":{"en":"Grade and narrative must agree. If they do not, one of them is wrong, and the evidence and descriptors decide which.","ar":"Grade and narrative must agree. If they do not, one of them is wrong, and the evidence and descriptors decide which."}}]},{"id":"m7","title":{"en":"Steps for Improvement, Evidence Sources and Final Quality Check","ar":"Steps for Improvement, Evidence Sources and Final Quality Check"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Steps for improvement are the bridge between what the SEF finds and what the department will do. They must come from the weaknesses and gaps identified in the narrative. If the narrative says physics is weaker, a step about \"improving teaching\" is too general. A good step is specific enough that, one year later, anyone can say whether it was done and whether it worked.","ar":"Steps for improvement are the bridge between what the SEF finds and what the department will do. They must come from the weaknesses and gaps identified in the narrative. If the narrative says physics is weaker, a step about \"improving teaching\" is too general. A good step is specific enough that, one year later, anyone can say whether it was done and whether it worked."}},{"t":"h","c":{"en":"Writing SMART steps","ar":"Writing SMART steps"}},{"t":"table","head":{"en":["Element","What to write","Example (illustrative, not PEPS data)"],"ar":["Element","What to write","Example (illustrative, not PEPS data)"]},"rows":[{"en":["Action","A specific thing that will be done","Introduce a weekly short diagnostic quiz in Year 8 physics and reteach the topics where fewer than 70% of students are secure"],"ar":["Action","A specific thing that will be done","Introduce a weekly short diagnostic quiz in Year 8 physics and reteach the topics where fewer than 70% of students are secure"]},{"en":["Owner","A named role, not \"the department\"","Head of Science with the Year 8 physics teachers"],"ar":["Owner","A named role, not \"the department\"","Head of Science with the Year 8 physics teachers"]},{"en":["Timescale","A start and review point","Start Term 2; review at the end of Term 3"],"ar":["Timescale","A start and review point","Start Term 2; review at the end of Term 3"]},{"en":["Measure","The result that will show success","Gap between physics and biology strand scores in the next GL report reduced; book scrutiny shows fewer repeated errors"],"ar":["Measure","The result that will show success","Gap between physics and biology strand scores in the next GL report reduced; book scrutiny shows fewer repeated errors"]},{"en":["Link to weakness","The finding in the narrative that the step addresses","Physics strand weaker than other strands in Years 7 to 9"],"ar":["Link to weakness","The finding in the narrative that the step addresses","Physics strand weaker than other strands in Years 7 to 9"]}]},{"t":"callout","k":"tip","title":{"en":"Test each step","ar":"Test each step"},"c":{"en":"Ask: does it match a weakness in the narrative? Can a named person be held to it? Is there a date? Will we know if it worked? A step such as \"continue to monitor progress\" does not pass the test, because nobody can tell whether it was done.","ar":"Ask: does it match a weakness in the narrative? Can a named person be held to it? Is there a date? Will we know if it worked? A step such as \"continue to monitor progress\" does not pass the test, because nobody can tell whether it was done."}},{"t":"h","c":{"en":"The evidence source column","ar":"The evidence source column"}},{"t":"p","c":{"en":"List the documents that support each statement. Use specific names and dates so that a reviewer can find them. Keep confidentiality in mind: documents may contain student names, so the SEF should refer to the document and not copy individual data into the narrative.","ar":"List the documents that support each statement. Use specific names and dates so that a reviewer can find them. Keep confidentiality in mind: documents may contain student names, so the SEF should refer to the document and not copy individual data into the narrative."}},{"t":"table","head":{"en":["Weak entry","Better entry"],"ar":["Weak entry","Better entry"]},"rows":[{"en":["Various data","GL Progress Test Mathematics reports, Year 6 and Year 8, current cohort; tracker spreadsheet, Term 3"],"ar":["Various data","GL Progress Test Mathematics reports, Year 6 and Year 8, current cohort; tracker spreadsheet, Term 3"]},{"en":["Lesson observations","Learning walk summary, Year 7 to 9 Science, Term 2; lesson observation records, Term 1 and Term 2"],"ar":["Lesson observations","Learning walk summary, Year 7 to 9 Science, Term 2; lesson observation records, Term 1 and Term 2"]},{"en":["Books","Work scrutiny record, Year 9 English: 30 books, sampled across language levels and gender"],"ar":["Books","Work scrutiny record, Year 9 English: 30 books, sampled across language levels and gender"]},{"en":["Checkpoint","Cambridge Lower Secondary Checkpoint analysis report, Mathematics 0862, current and previous year"],"ar":["Checkpoint","Cambridge Lower Secondary Checkpoint analysis report, Mathematics 0862, current and previous year"]}]},{"t":"h","c":{"en":"Quality check before submission","ar":"Quality check before submission"}},{"t":"list","c":{"en":["Every phase has its own evidence and its own narrative; nothing is copied across phases.","Every claim has a figure, a comparison (starting point, previous year or benchmark) and a source.","Proportion terms match the bands exactly and are shown with figures.","Groups are named: boys and girls, Emirati students, students of determination, gifted and talented, language-level groups. Small groups are flagged.","Cohort comparisons are labelled correctly: same-cohort progress is not mixed up with year-on-year cohort differences.","The narrative states what the data does not show, and the weaknesses link to the steps for improvement.","The grade is taken from the school's grade scale and descriptors, and matches the narrative.","No student names appear and the data is handled confidentially."],"ar":["Every phase has its own evidence and its own narrative; nothing is copied across phases.","Every claim has a figure, a comparison (starting point, previous year or benchmark) and a source.","Proportion terms match the bands exactly and are shown with figures.","Groups are named: boys and girls, Emirati students, students of determination, gifted and talented, language-level groups. Small groups are flagged.","Cohort comparisons are labelled correctly: same-cohort progress is not mixed up with year-on-year cohort differences.","The narrative states what the data does not show, and the weaknesses link to the steps for improvement.","The grade is taken from the school's grade scale and descriptors, and matches the narrative.","No student names appear and the data is handled confidentially."]}},{"t":"h","c":{"en":"Common mistakes","ar":"Common mistakes"}},{"t":"list","c":{"en":["Writing about attainment (where students are) when the KPI asks about progress (how far they moved).","Using a single data point and calling it a trend.","Reporting only positive groups and leaving out the groups that are behind.","Inventing or rounding figures to fit a proportion band.","Steps for improvement with no owner, no date or no measure.","Over-claiming: \"all\", \"every\" and \"always\" without evidence."],"ar":["Writing about attainment (where students are) when the KPI asks about progress (how far they moved).","Using a single data point and calling it a trend.","Reporting only positive groups and leaving out the groups that are behind.","Inventing or rounding figures to fit a proportion band.","Steps for improvement with no owner, no date or no measure.","Over-claiming: \"all\", \"every\" and \"always\" without evidence."]}},{"t":"scenario","title":{"en":"Scenario: choosing the better step","ar":"Scenario: choosing the better step"},"c":{"en":"The Phase 2 Mathematics narrative finds that a minority of Year 5 students (24%) did not improve their number scores, and that most of them are students at an early language level whose books show errors on word problems. \u003cstrong>Which step is better?\u003c/strong> \"Teachers will use more differentiated work\" is vague. A better step is: \"From Term 2, the Year 5 Mathematics teachers, with the ESL coordinator, will introduce vocabulary-supported word problems for the identified group; the HOD will review progress in the Term 3 test and book scrutiny, aiming for most of the group to move up in the number strand.\"","ar":"The Phase 2 Mathematics narrative finds that a minority of Year 5 students (24%) did not improve their number scores, and that most of them are students at an early language level whose books show errors on word problems. \u003cstrong>Which step is better?\u003c/strong> \"Teachers will use more differentiated work\" is vague. A better step is: \"From Term 2, the Year 5 Mathematics teachers, with the ESL coordinator, will introduce vocabulary-supported word problems for the identified group; the HOD will review progress in the Term 3 test and book scrutiny, aiming for most of the group to move up in the number strand.\""}},{"t":"callout","k":"key","title":{"en":"Five take-aways","ar":"Five take-aways"},"c":{"en":"\u003cstrong>1.\u003c/strong> Progress means movement from a starting point; it is not the same as attainment. \u003cstrong>2.\u003c/strong> Follow the same cohort, and use the right source for each phase: GL in Years 4, 6, 8 and 10, Checkpoint in Years 6 and 9, internal assessment and books for the other years. \u003cstrong>3.\u003c/strong> Write claim, evidence and impact for each phase with the school's proportion terms and figures, and state what the data does not show. \u003cstrong>4.\u003c/strong> Grade honestly using the school's template, and make sure the grade and narrative agree. \u003cstrong>5.\u003c/strong> Write SMART steps for improvement linked to the weaknesses, and name your evidence sources. This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance.","ar":"\u003cstrong>1.\u003c/strong> Progress means movement from a starting point; it is not the same as attainment. \u003cstrong>2.\u003c/strong> Follow the same cohort, and use the right source for each phase: GL in Years 4, 6, 8 and 10, Checkpoint in Years 6 and 9, internal assessment and books for the other years. \u003cstrong>3.\u003c/strong> Write claim, evidence and impact for each phase with the school's proportion terms and figures, and state what the data does not show. \u003cstrong>4.\u003c/strong> Grade honestly using the school's template, and make sure the grade and narrative agree. \u003cstrong>5.\u003c/strong> Write SMART steps for improvement linked to the weaknesses, and name your evidence sources. This CPD supports, and does not replace, the SEF template, the inspection framework and the school's own guidance."}}],"checks":[{"id":"m7q1","q":{"en":"Which step for improvement is the strongest?","ar":"Which step for improvement is the strongest?"},"opts":[{"en":"The English team will continue to focus on improving the quality of writing across all of Years 7 to 9 this year","ar":"The English team will continue to focus on improving the quality of writing across all of Years 7 to 9 this year"},{"en":"Teachers in Year 7 will try to give more feedback on writing whenever they are able to find the time","ar":"Teachers in Year 7 will try to give more feedback on writing whenever they are able to find the time"},{"en":"Head of English to introduce fortnightly paired writing edits for Year 7 boys from Term 2, reviewed in the Term 3 scrutiny","ar":"Head of English to introduce fortnightly paired writing edits for Year 7 boys from Term 2, reviewed in the Term 3 scrutiny"},{"en":"English staff will attend a writing training course and share what they have learned at a later date","ar":"English staff will attend a writing training course and share what they have learned at a later date"}],"correct":2,"expl":{"en":"A strong step has an action, an owner, a timescale and a measure, and links to a weakness. The other options lack at least two of these.","ar":"A strong step has an action, an owner, a timescale and a measure, and links to a weakness. The other options lack at least two of these."}},{"id":"m7q2","q":{"en":"Which evidence-source entry is best?","ar":"Which evidence-source entry is best?"},"opts":[{"en":"Science progress data held in the department files and discussed in the department meetings during the year by the HOD","ar":"Science progress data held in the department files and discussed in the department meetings during the year by the HOD"},{"en":"Assessment results, observations and scrutiny of books carried out by the HOD in different terms","ar":"Assessment results, observations and scrutiny of books carried out by the HOD in different terms"},{"en":"Information from various reports provided by the school's data manager and the senior leadership team","ar":"Information from various reports provided by the school's data manager and the senior leadership team"},{"en":"GL Progress Test Science reports for Year 8, current cohort, and Cambridge Checkpoint Science 0893 analysis report","ar":"GL Progress Test Science reports for Year 8, current cohort, and Cambridge Checkpoint Science 0893 analysis report"}],"correct":3,"expl":{"en":"A good entry names the document, the year group and the cohort so a reviewer can find and check it.","ar":"A good entry names the document, the year group and the cohort so a reviewer can find and check it."}},{"id":"m7q3","q":{"en":"Before submitting, a HOD finds that Phase 2 and Phase 3 narratives share the same paragraph with only the year groups changed. What should be done?","ar":"Before submitting, a HOD finds that Phase 2 and Phase 3 narratives share the same paragraph with only the year groups changed. What should be done?"},"opts":[{"en":"Rewrite each phase from its own data, sources, groups and weaknesses","ar":"Rewrite each phase from its own data, sources, groups and weaknesses"},{"en":"Keep the shared paragraph and add one sentence to each phase that mentions the correct year groups","ar":"Keep the shared paragraph and add one sentence to each phase that mentions the correct year groups"},{"en":"Delete the Phase 3 narrative and refer the reader to Phase 2 for a full explanation of the department's work","ar":"Delete the Phase 3 narrative and refer the reader to Phase 2 for a full explanation of the department's work"},{"en":"Keep the shared paragraph but change the proportion terms so that the two phases look different","ar":"Keep the shared paragraph but change the proportion terms so that the two phases look different"}],"correct":0,"expl":{"en":"Each phase has different students, data and weaknesses. Copying hides the real picture and weakens the judgement.","ar":"Each phase has different students, data and weaknesses. Copying hides the real picture and weakens the judgement."}}]}],"exam":[{"id":"e1","mod":1,"q":{"en":"A HOD writes: \"Year 10 students achieve very high IGCSE grades, so progress is outstanding.\" What is the main flaw?","ar":"A HOD writes: \"Year 10 students achieve very high IGCSE grades, so progress is outstanding.\" What is the main flaw?"},"opts":[{"en":"It uses a grade that is too high for a department that was last rated Good by the inspectors","ar":"It uses a grade that is too high for a department that was last rated Good by the inspectors"},{"en":"It describes attainment and gives no starting point, so progress has not been shown","ar":"It describes attainment and gives no starting point, so progress has not been shown"},{"en":"It does not list the names of the students who achieved the very highest grades in the group","ar":"It does not list the names of the students who achieved the very highest grades in the group"},{"en":"It refers to IGCSE grades, which cannot be used for a judgement on the Year 10 phase","ar":"It refers to IGCSE grades, which cannot be used for a judgement on the Year 10 phase"}],"correct":1},{"id":"e2","mod":1,"q":{"en":"Which pair of cohorts gives valid evidence of Year 6 to Year 8 progress in Science?","ar":"Which pair of cohorts gives valid evidence of Year 6 to Year 8 progress in Science?"},"opts":[{"en":"This year's Year 8 and last year's Year 8 GL scores","ar":"This year's Year 8 and last year's Year 8 GL scores"},{"en":"This year's Year 6 and this year's Year 8 GL scores","ar":"This year's Year 6 and this year's Year 8 GL scores"},{"en":"The same students' Year 6 and Year 8 GL scores","ar":"The same students' Year 6 and Year 8 GL scores"},{"en":"Last year's Year 6 and this year's Year 8 GL scores","ar":"Last year's Year 6 and this year's Year 8 GL scores"}],"correct":2},{"id":"e3","mod":1,"q":{"en":"Why must the judgement table and narrative agree?","ar":"Why must the judgement table and narrative agree?"},"opts":[{"en":"Reviewers read the table first and ignore the narrative if the grade seems to be high enough for the phase","ar":"Reviewers read the table first and ignore the narrative if the grade seems to be high enough for the phase"},{"en":"The template requires the same number of words in the table and in the narrative for each phase","ar":"The template requires the same number of words in the table and in the narrative for each phase"},{"en":"The narrative is written first and the grade is added later once the table has been completed","ar":"The narrative is written first and the grade is added later once the table has been completed"},{"en":"The grade is the conclusion of the evidence, so a reader should be able to understand it from the narrative","ar":"The grade is the conclusion of the evidence, so a reader should be able to understand it from the narrative"}],"correct":3},{"id":"e4","mod":2,"q":{"en":"A GL report shows a student's standardised score fell from 104 to 96 between Year 8 and Year 10. What is the best next step?","ar":"A GL report shows a student's standardised score fell from 104 to 96 between Year 8 and Year 10. What is the best next step?"},"opts":[{"en":"Look at the strand analysis and other evidence before drawing a conclusion about the student or the cohort","ar":"Look at the strand analysis and other evidence before drawing a conclusion about the student or the cohort"},{"en":"Report that the student made no progress and that the department's teaching in Year 9 was weak, without checking other data","ar":"Report that the student made no progress and that the department's teaching in Year 9 was weak, without checking other data"},{"en":"Ignore the fall because tests are never accurate enough to be used as evidence of progress","ar":"Ignore the fall because tests are never accurate enough to be used as evidence of progress"},{"en":"Compare the score with the national average quoted in the media and decide from that comparison","ar":"Compare the score with the national average quoted in the media and decide from that comparison"}],"correct":0},{"id":"e5","mod":2,"q":{"en":"A HOD says progress in Year 7 can be shown from GL Progress Tests. Why is this a problem?","ar":"A HOD says progress in Year 7 can be shown from GL Progress Tests. Why is this a problem?"},"opts":[{"en":"GL tests are sat only by students in Year 7 who have been identified as having special educational needs","ar":"GL tests are sat only by students in Year 7 who have been identified as having special educational needs"},{"en":"GL tests are sat in Years 4, 6, 8 and 10, so Year 7 progress needs internal assessment and other evidence","ar":"GL tests are sat in Years 4, 6, 8 and 10, so Year 7 progress needs internal assessment and other evidence"},{"en":"GL tests are sat every term, so Year 7 progress would be fully covered but has been double counted","ar":"GL tests are sat every term, so Year 7 progress would be fully covered but has been double counted"},{"en":"GL results cannot be used in a SEF because they do not belong to the school's assessment programme","ar":"GL results cannot be used in a SEF because they do not belong to the school's assessment programme"}],"correct":1},{"id":"e6","mod":2,"q":{"en":"Which statement about TIMSS, PISA or PIRLS evidence is the most accurate for a PEPS SEF?","ar":"Which statement about TIMSS, PISA or PIRLS evidence is the most accurate for a PEPS SEF?"},"opts":[{"en":"Treat it as the main proof of progress because international tests are more reliable than all other sources","ar":"Treat it as the main proof of progress because international tests are more reliable than all other sources"},{"en":"Use the results without a sample description since the names of the tests are widely understood","ar":"Use the results without a sample description since the names of the tests are widely understood"},{"en":"Treat it as one strand of evidence and report the sample, the year group and the limits honestly","ar":"Treat it as one strand of evidence and report the sample, the year group and the limits honestly"},{"en":"Convert the results into Checkpoint levels so that the evidence matches the school's usual reporting","ar":"Convert the results into Checkpoint levels so that the evidence matches the school's usual reporting"}],"correct":2},{"id":"e7","mod":3,"q":{"en":"An English HOD finds that the Year 4 to Year 6 GL cohort moved up in reading but not in writing. What should the Phase 2 narrative do?","ar":"An English HOD finds that the Year 4 to Year 6 GL cohort moved up in reading but not in writing. What should the Phase 2 narrative do?"},"opts":[{"en":"Report the reading result only, because the writing result is probably caused by a small group of students","ar":"Report the reading result only, because the writing result is probably caused by a small group of students"},{"en":"Report an overall figure for English so that the stronger reading score offsets the weaker writing","ar":"Report an overall figure for English so that the stronger reading score offsets the weaker writing"},{"en":"Describe the writing activities that were taught in Year 5 without including the comparison data","ar":"Describe the writing activities that were taught in Year 5 without including the comparison data"},{"en":"State the difference by strand, give figures, and link a step for improvement to writing","ar":"State the difference by strand, give figures, and link a step for improvement to writing"}],"correct":3},{"id":"e8","mod":3,"q":{"en":"In FS2, what does the strongest evidence of English progress look like?","ar":"In FS2, what does the strongest evidence of English progress look like?"},"opts":[{"en":"Dated observations at baseline and end of year showing how many children moved on in speaking and early reading","ar":"Dated observations at baseline and end of year showing how many children moved on in speaking and early reading"},{"en":"A display of children's mark-making and a photograph album showing role play in the English corner, displayed for parents","ar":"A display of children's mark-making and a photograph album showing role play in the English corner, displayed for parents"},{"en":"A timetable showing a daily phonics session and an outline of the stories read to the class","ar":"A timetable showing a daily phonics session and an outline of the stories read to the class"},{"en":"A list of resources purchased for the early reading area and the staff who are trained to use them","ar":"A list of resources purchased for the early reading area and the staff who are trained to use them"}],"correct":0},{"id":"e9","mod":3,"q":{"en":"A HOD wants to say that English-language level groups progress equally. What must be done?","ar":"A HOD wants to say that English-language level groups progress equally. What must be done?"},"opts":[{"en":"Compare the final attainment of each group, since the group with the highest score shows the best progress","ar":"Compare the final attainment of each group, since the group with the highest score shows the best progress"},{"en":"Compare movement for each language-level group from the same starting points, and report group sizes","ar":"Compare movement for each language-level group from the same starting points, and report group sizes"},{"en":"Compare the number of lessons attended by each group, since attendance proves progress in the subject","ar":"Compare the number of lessons attended by each group, since attendance proves progress in the subject"},{"en":"Compare the teachers' impressions of each group at the end of the year and report the typical view","ar":"Compare the teachers' impressions of each group at the end of the year and report the typical view"}],"correct":1},{"id":"e10","mod":3,"q":{"en":"A Phase 3 English HOD notes that several Year 9 students joined after Year 6. How should the Year 6 to Year 9 Checkpoint comparison treat them?","ar":"A Phase 3 English HOD notes that several Year 9 students joined after Year 6. How should the Year 6 to Year 9 Checkpoint comparison treat them?"},"opts":[{"en":"Include the late joiners in the comparison, using their Year 9 score for both points so the cohort total stays the same","ar":"Include the late joiners in the comparison, using their Year 9 score for both points so the cohort total stays the same"},{"en":"Remove the comparison from the SEF, because any cohort containing late joiners cannot be used as evidence","ar":"Remove the comparison from the SEF, because any cohort containing late joiners cannot be used as evidence"},{"en":"Report the comparison for students with both results, note how many joined later, and treat them separately","ar":"Report the comparison for students with both results, note how many joined later, and treat them separately"},{"en":"Give the late joiners the cohort average for Year 6 so that the total number of students is the same","ar":"Give the late joiners the cohort average for Year   return '';
}

let navOpen = false;
function sidebar(){
  const t = T();
  let h = `<aside class="side ${navOpen?'open':''}"><button class="side-toggle" onclick="toggleNav()"><span>${t.modules} · ${doneCount()}/${nM}${S.view==='mod'?' · '+t.module+' '+(S.mod+1):''}</span><span class="caret">${navOpen?'▴':'▾'}</span></button><div class="nav-body">`;
  CPD.modules.forEach((m, i) => {
    const cur = S.view === 'mod' && S.mod === i, done = modDone(i), lock = !unlocked(i);
    h += `<button class="nav-i ${cur?'cur':''} ${done?'done':''}" ${lock?'disabled title="'+esc(t.locked)+'"':''} onclick="goMod(${i})"><span class="nav-n">${done?'✓':(lock?'🔒':i+1)}</span><span class="nav-l">${tx(m.title)}<span class="nav-m">${m.minutes} ${t.min}</span></span></button>`;
  });
  h += `<div class="side-sep"></div>`;
  const exLock = !allModsDone();
  h += `<button class="nav-i ${S.view==='exam'?'cur':''} ${S.passed?'done':''}" ${exLock?'disabled':''} onclick="goExam()"><span class="nav-n">${S.passed?'✓':(exLock?'🔒':'★')}</span><span class="nav-l">${t.exam}</span></button>`;
  const cLock = !S.passed;
  h += `<button class="nav-i ${S.view==='cert'?'cur':''} ${S.cert?'done':''}" ${cLock?'disabled':''} onclick="goCert()"><span class="nav-n">${S.cert?'✓':(cLock?'🔒':'🎓')}</span><span class="nav-l">${t.cert}</span></button>`;
  return h + `</div></aside>`;
}
function toggleNav(){ navOpen = !navOpen; const a = document.querySelector('.side'); if(a) a.outerHTML = sidebar(); }

function viewHome(){
  const t = T();
  const resume = S.started || doneCount() > 0;
  return `<div class="card">
    <p class="eyebrow">${tx(META.eyebrow)}</p>
    <h1>${tx(META.title)}</h1>
    <p class="lead">${tx(META.subtitle)}</p>
    <div class="meta-row"><span class="chip">${t.duration}: ${tx(META.durationLabel)}</span><span class="chip">${t.standard}: ${tx(META.standard)}</span></div>
    <div class="meta-row"><span class="chip">${t.source}: ${tx(META.source)}</span></div>
  </div>
  <div class="card"><h2>${t.willCover}</h2>
    <ol class="steps">${CPD.modules.map(m => `<li><strong>${tx(m.title)}</strong> <span class="hint">· ${m.minutes} ${t.min}</span></li>`).join('')}
    <li><strong>${t.exam}</strong> <span class="hint">· ${CPD.exam.length} ${S.lang==='ar'?'سؤالًا':'questions'}</span></li></ol>
    <h2 style="margin-top:26px">${t.how}</h2>
    <ul><li>${fill(t.how1)}</li><li>${fill(t.how2)}</li><li>${fill(t.how3)}</li><li>${fill(t.how4)}</li>${CPD.meta.englishOnly?'':`<li>${fill(t.how5)}</li>`}</ul>
    <div class="foot-nav"><span></span><button class="btn" onclick="startOrResume()">${resume ? t.resume : t.start}</button></div>
  </div>`;
}

function viewModule(){
  const t = T(), i = S.mod, m = CPD.modules[i];
  const nOk = m.checks.filter(q => S.ok[checkKey(m, q)]).length;
  let h = `<div class="card"><p class="eyebrow">${t.module} ${i+1} ${t.of} ${nM} · ${m.minutes} ${t.min}</p><h2>${tx(m.title)}</h2>${m.blocks.map(renderBlock).join('')}</div>`;
  h += `<div class="card"><div class="checks-h"><h3>${t.knowledge}</h3></div><p class="hint" id="ck-count">${nOk} / ${m.checks.length} ${t.answered}</p>`;
  h += m.checks.map((q, qi) => checkHTML(m, q, qi)).join('');
  h += `<div class="foot-nav"><button class="btn ghost" onclick="${i===0?"goHome()":"goMod("+(i-1)+")"}">${ARR_P()} ${t.prev}</button><div id="nextwrap">${nextBtn()}</div></div></div>`;
  return h;
}
function nextBtn(){
  const t = T(), i = S.mod, ok = modDone(i);
  const label = i === nM - 1 ? t.toExam : t.next;
  const act = i === nM - 1 ? 'goExam()' : `goMod(${i+1})`;
  return `<button class="btn" ${ok?'':'disabled'} onclick="advance()">${label} ${ARR_N()}</button>${ok?'':`<div class="hint" style="margin-top:6px">${t.needAll}</div>`}`;
}
function checkHTML(m, q, qi){
  const t = T(), key = checkKey(m, q), solved = !!S.ok[key], tried = S.wrong[key] || [], L_ = LET();
  const opts = q.opts.map((o, oi) => {
    let cls = '', dis = '';
    if(solved){ dis = 'disabled'; if(oi === q.correct) cls = 'right'; }
    else if(tried.includes(oi)){ cls = 'wrong'; dis = 'disabled'; }
    return `<button class="opt ${cls}" ${dis} onclick="pick(${S.mod},${qi},${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`;
  }).join('');
  let fb = '';
  if(solved) fb = `<div class="fb good"><strong>${t.correct}</strong> ${tx(q.expl)}</div>`;
  else if(tried.length) fb = `<div class="fb bad">${t.tryAgain}</div>`;
  return `<div class="q ${solved?'ok':''}" id="q-${q.id}"><div class="q-t"><span class="q-n">${qi+1}.</span>${tx(q.q)}</div>${opts}${fb}</div>`;
}

function viewExam(){
  const t = T();
  if(!allModsDone()) return `<div class="card"><h2>${t.examH}</h2><p>${t.examLocked}</p></div>`;
  const ex = S.exam;
  if(ex.result) return viewResult();
  if(!ex.order) newAttempt(false);
  const L_ = LET();
  const answered = Object.keys(ex.answers).length, total = CPD.exam.length;
  let h = `<div class="card"><p class="eyebrow">${tx(META.eyebrow)}</p><h2>${t.examH}</h2><p>${fill(t.examIntro)}</p>
    <div class="exam-bar"><span>${t.examH}</span><span id="exam-count">${answered} / ${total} ${t.answeredOf}</span></div>`;
  S.exam.order.forEach((id, n) => {
    const q = CPD.exam.find(x => x.id === id);
    h += `<div class="q"><div class="q-t"><span class="q-n">${n+1}.</span>${tx(q.q)}</div>` + q.opts.map((o, oi) =>
      `<button class="opt ${ex.answers[id]===oi?'sel':''}" data-q="${id}" onclick="selExam('${id}',${oi})"><span class="l">${L_[oi]}</span><span>${tx(o)}</span></button>`).join('') + `</div>`;
  });
  h += `<div class="foot-nav"><span class="hint" id="exam-hint">${answered<total?t.submitHint:''}</span><button class="btn" id="exam-submit" ${answered<total?'disabled':''} onclick="submitExam()">${t.submit}</button></div></div>`;
  return h;
}
function viewResult(){
  const t = T(), r = S.exam.result, L_ = LET();
  let h = `<div class="card"><div class="result"><p class="eyebrow">${t.examH}</p><h2>${r.pass ? t.passed : t.failed}</h2>
    <div class="ring ${r.pass?'pass':'fail'}" style="--p:${r.pct}"><span>${r.pct}%</span></div>
    <p>${t.score}: <strong>${r.right} / ${r.total}</strong> · ${t.attempts}: ${S.attempts} · ${t.best}: ${S.best}%</p>`;
  if(r.pass){
    h += `<p class="hint" id="auto-note">${t.passedNote}</p><div class="actions"><button class="btn" onclick="goCert()">${t.toCert}</button><button class="btn ghost" onclick="retake()">${t.retake}</button></div>`;
  } else {
    const mods = {};
    r.missed.forEach(id => { const q = CPD.exam.find(x => x.id === id); (mods[q.mod] = mods[q.mod] || []).push(id); });
    h += `<div class="review"><h3>${t.reviewH}</h3><p>${t.reviewNote}</p><ul>` + Object.keys(mods).sort((a,b)=>a-b).map(mi => {
      const m = CPD.modules[mi-1];
      const qs = t.qLabel + ' ' + mods[mi].map(id => r.orderAtSubmit.indexOf(id)+1).sort((a,b)=>a-b).join(S.lang==='ar' ? '، ' : ', ');
      return `<li><strong>${t.module} ${mi}: ${tx(m.title)}</strong> <span class="hint">(${qs})</span> <a href="#" onclick="goMod(${mi-1});return false">${ARR_N()}</a></li>`;
    }).join('') + `</ul></div><div class="actions"><button class="btn" onclick="retake()">${t.retake}</button></div>`;
  }
  return h + `</div></div>`;
}

      <div class="c-name">${esc(c.name)}</div>
      <div class="c-sub">has successfully completed the self-paced professional development module</div>

    <div class="c-meta">Duration: ${hrs} · Final assessment score: ${c.score}% (pass mark ${PASS}%)<br>${META.standard.en}<br>Date of completion: ${certDate(c.date)} · Certificate ref: ${esc(c.ref)}</div>

}
let certDraft = '', certStage = 'name', certWarn = false;
function viewCert(){
  const t = T();
  if(!S.passed) return `<div class="card"><h2>${t.cert}</h2><p>${t.certLocked}</p></div>`;
  if(S.cert){
    return `<div class="card"><h2>${t.certH}</h2><div class="cert-wrap">${certHTML(S.cert)}</div>
      <div class="lockbar">🔒 ${t.locknote}</div>
      <div class="actions"><button class="btn" id="dl-btn" onclick="downloadPDF()">${t.dl}</button><button class="btn ghost" onclick="printCert()">${t.print}</button></div></div>`;
  }
  if(certStage === 'confirm'){
    return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><p class="lead" style="text-align:center">“${esc(certDraft)}”</p>
      <div class="callout warn"><span class="ct">${t.confirmQ}</span></div>
      <div class="actions"><button class="btn" onclick="confirmCert()">${t.confirmYes}</button><button class="btn ghost" onclick="editName()">${t.confirmNo}</button></div></div></div>`;
  }
  return `<div class="card"><h2>${t.certH}</h2><div class="name-form"><label for="nm"><strong>${t.nameLabel}</strong></label>
    <input id="nm" type="text" maxlength="70" placeholder="${esc(t.namePh)}" value="${esc(certDraft)}" oninput="certDraft=this.value" onkeydown="if(event.key==='Enter')toConfirm()" autocomplete="name">
    ${certWarn?`<div class="fb bad">${t.nameWarn}</div>`:''}
    <div class="actions"><button class="btn" onclick="toConfirm()">${t.gen}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(keepScroll){
  const y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  let body = '';
  if(S.view === 'home') body = viewHome();
  else if(S.view === 'mod') body = viewModule();
  else if(S.view === 'exam') body = viewExam();
  else if(S.view === 'cert') body = viewCert();
  document.getElementById('root').innerHTML = header() + `<div class="layout">${sidebar()}<main class="main">${body}</main></div><div class="foot">${T().footer}</div>`;
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------- actions ---------- */
function setView(v, mod){ navOpen = false; S.view = v; if(mod !== undefined) S.mod = mod; saveState(); render(); }
function goHome(){ setView('home'); }
function startOrResume(){ S.started = true; let i = 0; while(i < nM - 1 && modDone(i)) i++; if(allModsDone()){ setView(S.passed ? (S.cert ? 'cert' : 'cert') : 'exam'); return; } setView('mod', i); }
function goMod(i){ if(!unlocked(i)) return; setView('mod', i); }
function advance(){ const i = S.mod; if(!modDone(i)) return; if(i === nM - 1) goExam(); else goMod(i + 1); }
function goExam(){ if(!allModsDone()) return; setView('exam'); }
function goCert(){ if(!S.passed) return; setView('cert'); }
function toggleLang(){ S.lang = S.lang === 'en' ? 'ar' : 'en'; saveState(); render(true); }
function openFull(){ try{ window.open(location.href, '_blank'); }catch(e){} }

function pick(mi, qi, oi){
  const m = CPD.modules[mi], q = m.checks[qi], key = checkKey(m, q);
  if(S.ok[key]) return;
  if(oi === q.correct) S.ok[key] = true;
  else { S.wrong[key] = (S.wrong[key] || []).concat(oi); }
  saveState();
  const el = document.getElementById('q-' + q.id);
  if(el) el.outerHTML = checkHTML(m, q, qi);
  const nOk = m.checks.filter(x => S.ok[checkKey(m, x)]).length;
  const c = document.getElementById('ck-count'); if(c) c.textContent = `${nOk} / ${m.checks.length} ${T().answered}`;
  const w = document.getElementById('nextwrap'); if(w) w.innerHTML = nextBtn();
  const nav = document.querySelector('.side'); if(nav) nav.outerHTML = sidebar();
  const strip = document.querySelector('.progress-strip i'); if(strip) strip.style.width = progressPct() + '%';
}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newAttempt(doRender){ S.exam = { order: shuffle(CPD.exam.map(q => q.id)), answers: {}, result: null }; saveState(); if(doRender) render(); }
function selExam(id, oi){
  S.exam.answers[id] = oi; saveState();
  document.querySelectorAll(`button.opt[data-q="${id}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  const n = Object.keys(S.exam.answers).length, tot = CPD.exam.length;
  const c = document.getElementById('exam-count'); if(c) c.textContent = `${n} / ${tot} ${T().answeredOf}`;
  const b = document.getElementById('exam-submit'); if(b) b.disabled = n < tot;
  const h = document.getElementById('exam-hint'); if(h) h.textContent = n < tot ? T().submitHint : '';
}
function submitExam(){
  const ex = S.exam; if(Object.keys(ex.answers).length < CPD.exam.length) return;
  let right = 0; const missed = [];
  CPD.exam.forEach(q => { if(ex.answers[q.id] === q.correct) right++; else missed.push(q.id); });
  const total = CPD.exam.length, pct = Math.round(100 * right / total), pass = pct >= PASS;
  S.attempts++; S.best = Math.max(S.best, pct); if(pass) S.passed = true;
  ex.result = { right, total, pct, pass, missed, orderAtSubmit: ex.order.slice() };
  saveState(); render();
  if(pass){ setTimeout(() => { if(S.view === 'exam' && S.exam.result && S.exam.result.pass) goCert(); }, 1500); }
}
function retake(){ newAttempt(true); }

function toConfirm(){
  const v = (certDraft || '').trim().replace(/\s+/g, ' ');
  if(v.length < 3){ certWarn = true; render(true); return; }
  certDraft = v; certWarn = false; certStage = 'confirm'; render();
}
function editName(){ certStage = 'name'; render(true); }
function confirmCert(){
  if(S.cert) return;
  const ref = 'PEPS-' + META.code + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  S.cert = { name: certDraft, date: new Date().toISOString(), score: S.best, ref };
  saveState(); render();
}
function printCert(){ window.print(); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function downloadPDF(){
  const btn = document.getElementById('dl-btn'), t = T();
  if(btn){ btn.disabled = true; btn.textContent = t.dlBusy; }
  try{
    if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const el = document.getElementById('certificate');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FBF7EA', useCORS: true });
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w, h, undefined, 'FAST');
    pdf.save('PEPS_Certificate_' + META.code + '_' + S.cert.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');
  }catch(e){
    alert(t.dlFail);
  }
  if(btn){ btn.disabled = false; btn.textContent = t.dl; }
}

render();
</script>
