#root{position:relative;z-index:1}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* header */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:42px;height:auto;flex:none}
.brand-t{min-width:0}
.brand-t .eb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[lang="ar"] .brand-t .eb{font-family:inherit;letter-spacing:0;text-transform:none;font-size:12px}
.brand-t .tt{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .brand-t .tt{font-family:inherit}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn-s{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-block;line-height:1.5}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.progress-strip{height:4px;background:#e7e5da}
.progress-strip i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding:24px 20px 70px;display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:4px 8px;border:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:default;text-align:start}
html[lang="ar"] .side-toggle{letter-spacing:0;text-transform:none;font-size:13px}
.side-toggle .caret{display:none}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);line-height:1.4}
.nav-i:hover:not(:disabled){background:var(--accent-soft)}
.nav-i.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-i.cur{box-shadow:inset -3px 0 0 var(--accent)}
.nav-i:disabled{opacity:.5;cursor:not-allowed}
.nav-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:#fff}
.nav-i.done .nav-n{background:var(--good);border-color:var(--good);color:#fff}
.nav-i.cur .nav-n{border-color:var(--accent);color:var(--accent)}
.nav-i.done.cur .nav-n{color:#fff}
.nav-l{font-size:14px;font-weight:500}
.nav-m{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.side-sep{height:1px;background:var(--line);margin:8px 4px}

.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:20px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
html[lang="ar"] .eyebrow{font-family:inherit;letter-spacing:0;text-transform:none;font-size:13px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 12px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:inherit;line-height:1.6}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;margin-top:26px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-inline-start:24px} li{margin-bottom:7px}
.lead{font-size:18px;color:var(--ink-soft)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* blocks */
.callout{border-radius:12px;padding:16px 20px;margin:18px 0;border:1px solid;border-inline-start-width:5px}
.callout .ct{font-weight:700;margin-bottom:4px;display:block}
.callout p:last-child{margin-bottom:0}
.callout.key{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--bad-soft);border-color:var(--bad)}
.callout.tip{background:var(--gold-soft);border-color:var(--gold)}
.scenario{background:#FAF8F1;border:1px dashed #BDB79F;border-radius:12px;padding:16px 20px;margin:18px 0}
.scenario .ct{font-weight:700;color:var(--gold);display:block;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FBFAF6}
td:first-child{font-weight:600}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:44px;margin-bottom:12px;min-height:30px}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}

/* checks */
.checks-h{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.checks-h h3{margin:0;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;background:#fff}
.q.ok{border-color:var(--good);background:#FBFEFC}
.q-t{font-weight:600;margin-bottom:12px}
.q-n{color:var(--accent);font-weight:700;margin-inline-end:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:var(--ink);line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#EEEDE5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed;animation:shake .35s}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{border-radius:10px;padding:11px 14px;margin-top:6px;font-size:15px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.foot-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#B9B8AE;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.hint{color:var(--ink-soft);font-size:14px}

/* exam */
.exam-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 4px;font-weight:600}
.result{text-align:center;padding:10px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:700}
.ring.pass{background:conic-gradient(var(--good) calc(var(--p)*1%),#E5E3D8 0);color:var(--good)}
.ring.fail{background:conic-gradient(var(--bad) calc(var(--p)*1%),#E5E3D8 0);color:var(--bad)}
.ring span{background:#fff;width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.review{text-align:start;margin-top:18px}

/* certificate */
.cert-wrap{overflow-x:auto}
#certificate{direction:ltr;text-align:center;font-family:'Source Serif 4',Georgia,serif;width:100%;max-width:1000px;aspect-ratio:1.414/1;margin:0 auto;background:#FBF7EA;color:#1d2433;border:10px double #8a6a22;position:relative;padding:26px 60px 24px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
#certificate *{font-family:'Source Serif 4',Georgia,serif}

#certificate .c-top img{width:78px;height:auto}
#certificate .c-school{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#6b4f12;margin-top:4px;font-weight:600}
#certificate .c-title{font-size:40px;font-weight:700;color:#1d2433;margin:6px 0 2px;line-height:1.1}
#certificate .c-sub{font-size:16px;color:#3b4457;font-style:italic}
#certificate .c-name{font-size:36px;font-weight:700;color:#5a3a00;border-bottom:2px solid #8a6a22;display:inline-block;padding:2px 30px;margin:6px 0;max-width:100%;word-break:break-word;line-height:1.2}
#certificate .c-mod{font-size:24px;font-weight:700;color:#1d2433;line-height:1.25}
#certificate .c-mod-ar{font-size:20px;direction:rtl;font-family:'Noto Sans Arabic',sans-serif;color:#3b4457}
#certificate .c-meta{font-size:14px;color:#2b3345;line-height:1.6}
#certificate .c-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#3b4457;gap:20px}
#certificate .sig{border-top:1.5px solid #3b4457;padding-top:4px;min-width:220px;margin-top:28px;text-align:center}
#certificate .c-bot>div:last-child{text-align:right}
.name-form{max-width:520px;margin:10px auto}
.name-form input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;margin:8px 0 12px;font-family:inherit;color:var(--ink);background:#fff}
.name-form input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-soft);font-size:14px;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.foot{max-width:1200px;margin:0 auto;padding:0 20px 36px;color:var(--ink-soft);font-size:13px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 14px 60px}
  .side{position:static;padding:8px 10px}
  .topbar-in{flex-wrap:wrap;padding:8px 14px;gap:8px}
  .brand{flex:1 1 100%}
  .brand-t .eb{display:none}
  .brand-t .tt{white-space:normal;font-size:15px}
  .tools{flex:1 1 100%;justify-content:flex-start}
  .side-toggle{cursor:pointer;margin:0;padding:8px}
  .side-toggle .caret{display:inline}
  .side .nav-body{display:none;margin-top:6px}
  .side.open .nav-body{display:block}
  .card{padding:22px 18px}
  h1{font-size:26px} h2{font-size:22px}
  .brand-t .tt{font-size:15px}
  #certificate{padding:18px 22px;border-width:7px}
  #certificate .c-title{font-size:26px} #certificate .c-name{font-size:24px} #certificate .c-mod{font-size:16px}
  #certificate .c-mod-ar{font-size:14px} #certificate .c-meta{font-size:11px} #certificate .c-bot{font-size:10px}
  #certificate .c-top img{width:48px}
}
@media print{
  body *{visibility:hidden}
  #certificate,#certificate *{visibility:visible}
  #certificate{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;border-width:12px}
  .watermark{display:none}
  @page{size:A4 landscape;margin:0}
}

<script>
const CPD = {"meta":{"id":"hod-sef-progress","code":"SEP","passMark":80,"hours":"2 hours","accent":"#1F7A5A","accentSoft":"#E3F4EC","eyebrow":{"en":"Staff CPD · Heads of Department · SEF Writing","ar":"Staff CPD · Heads of Department · SEF Writing"},"title":{"en":"Writing the SEF for Progress (KPI 1.2)","ar":"Writing the SEF for Progress (KPI 1.2)"},"subtitle":{"en":"A self-paced guide for Heads of Department in English, Mathematics and Science: how to gather and analyse progress evidence, write a clear PHASE judgement for each of the four phases, grade it honestly, and set SMART steps for improvement.","ar":"A self-paced guide for Heads of Department in English, Mathematics and Science: how to gather and analyse progress evidence, write a clear PHASE judgement for each of the four phases, grade it honestly, and set SMART steps for improvement."},"durationLabel":{"en":"About 2 hours, fully self-paced","ar":"About 2 hours, fully self-paced"},"standard":{"en":"KPI 1.2 Progress · UAE School Inspection Framework (SPEA)","ar":"KPI 1.2 Progress · UAE School Inspection Framework (SPEA)"},"source":{"en":"The school's SEF template and guidance, the current UAE School Inspection Framework (SPEA) documents, and the current Cambridge and GL Assessment reporting guides (check the current document for each)","ar":"The school's SEF template and guidance, the current UAE School Inspection Framework (SPEA) documents, and the current Cambridge and GL Assessment reporting guides (check the current document for each)"},"englishOnly":true},"modules":[{"id":"m1","title":{"en":"What KPI 1.2 Asks and How a SEF Judgement Is Made","ar":"What KPI 1.2 Asks and How a SEF Judgement Is Made"},"minutes":18,"blocks":[{"t":"callout","k":"key","title":{"en":"Purpose and what you will be able to do","ar":"Purpose and what you will be able to do"},"c":{"en":"This CPD helps you write the department's SEF for KPI 1.2 Progress in the school's agreed format. By the end you will be able to: explain what progress means and how it differs from attainment; choose and analyse the right evidence for each phase; write a \"PHASE X: JUDGEMENT\" narrative that links claim, evidence and impact; use the school's proportion terms correctly; grade your judgement honestly; and write SMART steps for improvement with a named evidence-source column. \u003cstrong>Use the grade scale and descriptors in the school's SEF template; this CPD gives examples only.\u003c/strong>","ar":"This CPD helps you write the department's SEF for KPI 1.2 Progress in the school's agreed format. By the end you will be able to: explain what progress means and how it differs from attainment; choose and analyse the right evidence for each phase; write a \"PHASE X: JUDGEMENT\" narrative that links claim, evidence and impact; use the school's proportion terms correctly; grade your judgement honestly; and write SMART steps for improvement with a named evidence-source column. \u003cstrong>Use the grade scale and descriptors in the school's SEF template; this CPD gives examples only.\u003c/strong>"}},{"t":"p","c":{"en":"Progress is about movement. It asks how far students have moved from where they started, and whether that movement is as much as it should be. A department can have students who reach high marks and still make little progress, because they arrived already high and were not stretched. Another department can have students whose marks are still below the expected level but who have moved a long way, because they started far behind and were taught well. The SEF must make both situations visible, and must not confuse them with attainment (KPI 1.1).","ar":"Progress is about movement. It asks how far students have moved from where they started, and whether that movement is as much as it should be. A department can have students who reach high marks and still make little progress, because they arrived already high and were not stretched. Another department can have students whose marks are still below the expected level but who have moved a long way, because they started far behind and were taught well. The SEF must make both situations visible, and must not confuse them with attainment (KPI 1.1)."}},{"t":"h","c":{"en":"Attainment and progress: two different questions","ar":"Attainment and progress: two different questions"}},{"t":"table","head":{"en":["Question","KPI 1.1 Attainment asks","KPI 1.2 Progress asks"],"ar":["Question","KPI 1.1 Attainment asks","KPI 1.2 Progress asks"]},"rows":[{"en":["Core idea","Where are students now compared with the curriculum standard and with external benchmarks?","How far have students moved from their starting points, and is that movement as much as expected?"],"ar":["Core idea","Where are students now compared with the curriculum standard and with external benchmarks?","How far have students moved from their starting points, and is that movement as much as expected?"]},{"en":["Typical evidence","Current Checkpoint results, GL standardised scores, IGCSE and A level results, internal assessment","The same cohort at two or more points in time; baseline compared with now; work in books over time"],"ar":["Typical evidence","Current Checkpoint results, GL standardised scores, IGCSE and A level results, internal assessment","The same cohort at two or more points in time; baseline compared with now; work in books over time"]},{"en":["High but static","Strong attainment judgement is possible","Progress may be weak if students were already high and are no longer moving"],"ar":["High but static","Strong attainment judgement is possible","Progress may be weak if students were already high and are no longer moving"]},{"en":["Low but moving","Attainment may be weak","Progress may be strong if students have moved a long way from a low start"],"ar":["Low but moving","Attainment may be weak","Progress may be strong if students have moved a long way from a low start"]}]},{"t":"h","c":{"en":"What inspectors look for","ar":"What inspectors look for"}},{"t":"p","c":{"en":"Always check the current inspection framework and the school's SEF template for exact wording. In general terms, a progress judgement looks at several themes at the same time:","ar":"Always check the current inspection framework and the school's SEF template for exact wording. In general terms, a progress judgement looks at several themes at the same time:"}},{"t":"list","c":{"en":["Progress in knowledge, understanding and skills in the subject, compared with students' starting points and with the progress expected over the period.","Progress over time, across a term, a year and several years, and not only in a single test.","Progress in lessons and in students' books: whether work shows growing depth, accuracy and independence.","Progress of different groups: boys and girls, Emirati students, students of determination (SEND), gifted and talented students, and students at different English-language levels.","Whether the school's own information is accurate: do internal judgements agree with external measures such as Cambridge Checkpoint and GL Progress Tests?"],"ar":["Progress in knowledge, understanding and skills in the subject, compared with students' starting points and with the progress expected over the period.","Progress over time, across a term, a year and several years, and not only in a single test.","Progress in lessons and in students' books: whether work shows growing depth, accuracy and independence.","Progress of different groups: boys and girls, Emirati students, students of determination (SEND), gifted and talented students, and students at different English-language levels.","Whether the school's own information is accurate: do internal judgements agree with external measures such as Cambridge Checkpoint and GL Progress Tests?"]}},{"t":"h","c":{"en":"How a SEF judgement is made","ar":"How a SEF judgement is made"}},{"t":"p","c":{"en":"A judgement is a conclusion reached from evidence; it is not a description of what the department does. The sequence is simple and you should follow it every time.","ar":"A judgement is a conclusion reached from evidence; it is not a description of what the department does. The sequence is simple and you should follow it every time."}},{"t":"steps","c":{"en":["Collect the evidence for one phase: data, books, lessons, moderation, student voice.","Analyse it: compare with starting points, with the previous year, with the benchmark and between groups.","Decide the pattern: what proportion of students make the progress expected, and who does not.","Match the pattern to the grade scale and descriptors in the school's SEF template, and choose the grade that the evidence supports.","Write the narrative: claim, evidence, impact. Then write the steps for improvement and list the evidence sources."],"ar":["Collect the evidence for one phase: data, books, lessons, moderation, student voice.","Analyse it: compare with starting points, with the previous year, with the benchmark and between groups.","Decide the pattern: what proportion of students make the progress expected, and who does not.","Match the pattern to the grade scale and descriptors in the school's SEF template, and choose the grade that the evidence supports.","Write the narrative: claim, evidence, impact. Then write the steps for improvement and list the evidence sources."]}},{"t":"callout","k":"warn","title":{"en":"Evidence first, grade second","ar":"Evidence first, grade second"},"c":{"en":"A common error is to decide the grade first (\"we are Good\") and then collect evidence to match it. Start from the data. If the evidence is mixed, the judgement must say so. A SEF that over-claims loses credibility at the first question from a reviewer.","ar":"A common error is to decide the grade first (\"we are Good\") and then collect evidence to match it. Start from the data. If the evidence is mixed, the judgement must say so. A SEF that over-claims loses credibility at the first question from a reviewer."}},{"t":"h","c":{"en":"The PEPS SEF layout","ar":"The PEPS SEF layout"}},{"t":"p","c":{"en":"All Heads of Department write in the same format. SEFs cover KPI 1.1 Attainment, KPI 1.2 Progress, KPI 1.3 Learning Skills and KPI 3.1 Teaching for Effective Learning. Each is judged across four phases. This CPD covers KPI 1.2 only.","ar":"All Heads of Department write in the same format. SEFs cover KPI 1.1 Attainment, KPI 1.2 Progress, KPI 1.3 Learning Skills and KPI 3.1 Teaching for Effective Learning. Each is judged across four phases. This CPD covers KPI 1.2 only."}},{"t":"table","head":{"en":["SEF part","What it contains","Your task as HOD"],"ar":["SEF part","What it contains","Your task as HOD"]},"rows":[{"en":["Judgement table","One row per phase: Phase 1 (FS2), Phase 2 (Years 1 to 6), Phase 3 (Years 7 to 9), Phase 4 (Years 10 to 13), each with a grade","Enter the grade that your narrative evidence supports, using the school's grade scale"],"ar":["Judgement table","One row per phase: Phase 1 (FS2), Phase 2 (Years 1 to 6), Phase 3 (Years 7 to 9), Phase 4 (Years 10 to 13), each with a grade","Enter the grade that your narrative evidence supports, using the school's grade scale"]},{"en":["Narrative per phase","A section headed \"PHASE X: JUDGEMENT\" for each phase","Write claim, evidence and impact, with figures, comparisons and named groups"],"ar":["Narrative per phase","A section headed \"PHASE X: JUDGEMENT\" for each phase","Write claim, evidence and impact, with figures, comparisons and named groups"]},{"en":["Steps for improvement","Actions linked to the weaknesses in the narrative","Write SMART steps: action, owner, timescale, measure"],"ar":["Steps for improvement","Actions linked to the weaknesses in the narrative","Write SMART steps: action, owner, timescale, measure"]},{"en":["Evidence source column","The documents that support each statement","Name the actual documents, not \"various\" or \"data\""],"ar":["Evidence source column","The documents that support each statement","Name the actual documents, not \"various\" or \"data\""]}]},{"t":"scenario","title":{"en":"Scenario: attainment or progress?","ar":"Scenario: attainment or progress?"},"c":{"en":"A Head of Department writes: \"Year 9 results are strong, with most students above the Cambridge Lower Secondary Checkpoint average, so progress is Good.\" \u003cstrong>What is missing?\u003c/strong> The sentence describes where students are, not how far they moved. To judge progress you need the same cohort's earlier result (for example GL Progress Test scores in Year 8, or an earlier Checkpoint comparison) and an analysis of whether students started high, and stayed there, or moved up. The evidence supports an attainment statement; the progress statement still needs a starting point.","ar":"A Head of Department writes: \"Year 9 results are strong, with most students above the Cambridge Lower Secondary Checkpoint average, so progress is Good.\" \u003cstrong>What is missing?\u003c/strong> The sentence describes where students are, not how far they moved. To judge progress you need the same cohort's earlier result (for example GL Progress Test scores in Year 8, or an earlier Checkpoint comparison) and an analysis of whether students started high, and stayed there, or moved up. The evidence supports an attainment statement; the progress statement still needs a starting point."}}],"checks":[{"id":"m1q1","q":{"en":"A department reports that nearly all Year 11 students reach the top mark band, but the same students were already in that band in Year 10. What does this show about KPI 1.2?","ar":"A department reports that nearly all Year 11 students reach the top mark band, but the same students were already in that band in Year 10. What does this show about KPI 1.2?"},"opts":[{"en":"High attainment is shown, but progress is not shown yet; the SEF needs evidence of movement from starting points","ar":"High attainment is shown, but progress is not shown yet; the SEF needs evidence of movement from starting points"},{"en":"High progress is shown, because a result in the top band is the clearest sign of movement over time, whatever the earlier result was","ar":"High progress is shown, because a result in the top band is the clearest sign of movement over time, whatever the earlier result was"},{"en":"Progress cannot be judged at all, because a department may only describe attainment at a given point","ar":"Progress cannot be judged at all, because a department may only describe attainment at a given point"},{"en":"Progress is secure, because students who stay in the top band are by definition making expected progress","ar":"Progress is secure, because students who stay in the top band are by definition making expected progress"}],"correct":0,"expl":{"en":"Progress is movement from a starting point. Students who remain in the same band may be making little progress if they were not stretched, so more evidence is needed.","ar":"Progress is movement from a starting point. Students who remain in the same band may be making little progress if they were not stretched, so more evidence is needed."}},{"id":"m1q2","q":{"en":"Which sequence best describes how a SEF judgement should be reached?","ar":"Which sequence best describes how a SEF judgement should be reached?"},"opts":[{"en":"Decide the grade from last year's SEF, then gather evidence that supports it, then write the narrative","ar":"Decide the grade from last year's SEF, then gather evidence that supports it, then write the narrative"},{"en":"Gather and analyse evidence, decide the pattern, match it to the template's grade scale, then write the narrative","ar":"Gather and analyse evidence, decide the pattern, match it to the template's grade scale, then write the narrative"},{"en":"Write the narrative from memory, then add data to it, and finally choose the grade that fits the story the department wants","ar":"Write the narrative from memory, then add data to it, and finally choose the grade that fits the story the department wants"},{"en":"Gather the evidence, write the grade, and add the narrative only where the inspector asks for detail","ar":"Gather the evidence, write the grade, and add the narrative only where the inspector asks for detail"}],"correct":1,"expl":{"en":"The grade is the conclusion. It follows the evidence and the school's descriptors; it should not come first.","ar":"The grade is the conclusion. It follows the evidence and the school's descriptors; it should not come first."}},{"id":"m1q3","q":{"en":"Which of these belongs in the \"evidence source column\" of the PEPS SEF?","ar":"Which of these belongs in the \"evidence source column\" of the PEPS SEF?"},"opts":[{"en":"The words \"various assessment data\" and \"lesson observations\", which cover all documents held by the school","ar":"The words \"various assessment data\" and \"lesson observations\", which cover all documents held by the school"},{"en":"A general statement that teachers regularly use data to track student progress during the year","ar":"A general statement that teachers regularly use data to track student progress during the year"},{"en":"The Year 8 GL Progress Test report and the Year 6 Checkpoint analysis report, named with their dates","ar":"The Year 8 GL Progress Test report and the Year 6 Checkpoint analysis report, named with their dates"},{"en":"A list of the training sessions that the HOD has attended on the subject during the year","ar":"A list of the training sessions that the HOD has attended on the subject during the year"}],"correct":2,"expl":{"en":"The evidence source column lists the actual documents that support each statement, so a reader can find and check them.","ar":"The evidence source column lists the actual documents that support each statement, so a reader can find and check them."}}]},{"id":"m2","title":{"en":"The Evidence Base: PEPS Assessments and How to Analyse Them","ar":"The Evidence Base: PEPS Assessments and How to Analyse Them"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Progress evidence comes from several sources, and each one answers a different question. Your task is to know what each source can and cannot tell you, and to combine them. No single test gives a full picture of progress.","ar":"Progress evidence comes from several sources, and each one answers a different question. Your task is to know what each source can and cannot tell you, and to combine them. No single test gives a full picture of progress."}},{"t":"h","c":{"en":"The PEPS assessment landscape for progress","ar":"The PEPS assessment landscape for progress"}},{"t":"table","head":{"en":["Source","Where and when","What it can show for progress","Main caution"],"ar":["Source","Where and when","What it can show for progress","Main caution"]},"rows":[{"en":["GL Progress Tests (English, Mathematics, Science)","Years 4, 6, 8 and 10, every year","Age-standardised scores, stanines and comparison with a norm group; the same cohort can be followed Year 4 to 6 to 8 to 10","Two-year gaps between tests; check which norm group your report uses; other years need internal assessment"],"ar":["GL Progress Tests (English, Mathematics, Science)","Years 4, 6, 8 and 10, every year","Age-standardised scores, stanines and comparison with a norm group; the same cohort can be followed Year 4 to 6 to 8 to 10","Two-year gaps between tests; check which norm group your report uses; other years need internal assessment"]},{"en":["Cambridge Primary Checkpoint","End of Year 6: ESL 0057, Mathematics 0096, Science 0097","Scores on Cambridge's 0.0 to 6.0 scale and analysis reports by topic or skill; useful for cohort comparison with GL data from earlier years","Taken in Year 6 only; use the descriptions in the Cambridge report; do not convert scores to grades yourself"],"ar":["Cambridge Primary Checkpoint","End of Year 6: ESL 0057, Mathematics 0096, Science 0097","Scores on Cambridge's 0.0 to 6.0 scale and analysis reports by topic or skill; useful for cohort comparison with GL data from earlier years","Taken in Year 6 only; use the descriptions in the Cambridge report; do not convert scores to grades yourself"]},{"en":["Cambridge Lower Secondary Checkpoint","End of Year 9: ESL 0876, Mathematics 0862, Science 0893","Same 0.0 to 6.0 scale; Year 6 to Year 9 can be compared at cohort level","Different tests and different content: this is a cohort-level comparison with cautions, not a precise individual gain"],"ar":["Cambridge Lower Secondary Checkpoint","End of Year 9: ESL 0876, Mathematics 0862, Science 0893","Same 0.0 to 6.0 scale; Year 6 to Year 9 can be compared at cohort level","Different tests and different content: this is a cohort-level comparison with cautions, not a precise individual gain"]},{"en":["Internal assessment","End-of-term and unit tests, teacher assessment","Progress in the years without GL or Checkpoint tests; progress within a year","Check consistency by moderation and comparison with external data"],"ar":["Internal assessment","End-of-term and unit tests, teacher assessment","Progress in the years without GL or Checkpoint tests; progress within a year","Check consistency by moderation and comparison with external data"]},{"en":["Baseline data","CAT4 or other baseline where the school has it; FS2 baseline observations","A starting point from which to judge expected progress","A baseline estimates potential; it does not predict an individual result"],"ar":["Baseline data","CAT4 or other baseline where the school has it; FS2 baseline observations","A starting point from which to judge expected progress","A baseline estimates potential; it does not predict an individual result"]},{"en":["Cambridge IGCSE, AS and A level, Edexcel IAL","Years 10 to 13 as relevant (for example Mathematics 0580 Extended; sciences 0610, 0620, 0625)","Outcomes compared with starting points such as GL Year 10 or earlier scores","Small groups in Years 12 and 13 can swing results"],"ar":["Cambridge IGCSE, AS and A level, Edexcel IAL","Years 10 to 13 as relevant (for example Mathematics 0580 Extended; sciences 0610, 0620, 0625)","Outcomes compared with starting points such as GL Year 10 or earlier scores","Small groups in Years 12 and 13 can swing results"]},{"en":["Work scrutiny and lessons","Throughout the year","Progress in depth, accuracy and independence; whether feedback leads to improvement","Use a clear scrutiny protocol and sample across groups"],"ar":["Work scrutiny and lessons","Throughout the year","Progress in depth, accuracy and independence; whether feedback leads to improvement","Use a clear scrutiny protocol and sample across groups"]}]},{"t":"callout","k":"key","title":{"en":"The same-cohort rule","ar":"The same-cohort rule"},"c":{"en":"A progress claim needs the same group of students measured at two or more points. Comparing this year's Year 8 with last year's Year 8 tells you about the two cohorts and not about the progress of either. For a GL cohort, follow students from Year 4 to Year 6, Year 6 to Year 8, and Year 8 to Year 10, and note how many students joined or left in between.","ar":"A progress claim needs the same group of students measured at two or more points. Comparing this year's Year 8 with last year's Year 8 tells you about the two cohorts and not about the progress of either. For a GL cohort, follow students from Year 4 to Year 6, Year 6 to Year 8, and Year 8 to Year 10, and note how many students joined or left in between."}},{"t":"h","c":{"en":"Reading GL Progress Test reports","ar":"Reading GL Progress Test reports"}},{"t":"p","c":{"en":"GL reports give age-standardised scores. In GL's standard reporting the average is 100 with a standard deviation of 15, and stanines run from 1 to 9. The report also compares students with a norm group, and gives item or strand analysis. \u003cstrong>Check which norm group your report uses\u003c/strong> before you quote a comparison, because the same score can mean different things against different norm groups. If a standardised score stays at about the same level between two tests, the student has made typical progress relative to the norm group over that period. A rise suggests more than typical progress; a fall suggests less. That is a pointer for investigation and not a final verdict.","ar":"GL reports give age-standardised scores. In GL's standard reporting the average is 100 with a standard deviation of 15, and stanines run from 1 to 9. The report also compares students with a norm group, and gives item or strand analysis. \u003cstrong>Check which norm group your report uses\u003c/strong> before you quote a comparison, because the same score can mean different things against different norm groups. If a standardised score stays at about the same level between two tests, the student has made typical progress relative to the norm group over that period. A rise suggests more than typical progress; a fall suggests less. That is a pointer for investigation and not a final verdict."}},{"t":"h","c":{"en":"Using Checkpoint and international benchmarks","ar":"Using Checkpoint and international benchmarks"}},{"t":"p","c":{"en":"Checkpoint results on the 0.0 to 6.0 scale come with Cambridge analysis reports that show strengths and weaknesses by topic or skill. Use the descriptions in the Cambridge report, not your own conversion to levels or grades. International benchmark work (PISA for 15-year-olds in reading, mathematics and science; TIMSS at Grade 4 and Grade 8 in mathematics and science; PIRLS at Grade 4 reading) can add a check on international comparison. Rough PEPS mapping: TIMSS and PIRLS Grade 4 is usually Year 5, TIMSS Grade 8 is usually Year 9, and PISA age 15 is usually Year 10 or 11. Where you use released items, practice papers or sample participation, report the sample, the year group and the limits honestly, and treat them as one strand of evidence, not the only one.","ar":"Checkpoint results on the 0.0 to 6.0 scale come with Cambridge analysis reports that show strengths and weaknesses by topic or skill. Use the descriptions in the Cambridge report, not your own conversion to levels or grades. International benchmark work (PISA for 15-year-olds in reading, mathematics and science; TIMSS at Grade 4 and Grade 8 in mathematics and science; PIRLS at Grade 4 reading) can add a check on international comparison. Rough PEPS mapping: TIMSS and PIRLS Grade 4 is usually Year 5, TIMSS Grade 8 is usually Year 9, and PISA age 15 is usually Year 10 or 11. Where you use released items, practice papers or sample participation, report the sample, the year group and the limits honestly, and treat them as one strand of evidence, not the only one."}},{"t":"callout","k":"warn","title":{"en":"Do not over-read small changes","ar":"Do not over-read small changes"},"c":{"en":"Test scores move by chance. A change of a few points in a small group may be noise. Report the group size, say what you cannot conclude, and look for a pattern across more than one source or more than one year before making a strong claim. Never present a figure from memory or invent a comparison.","ar":"Test scores move by chance. A change of a few points in a small group may be noise. Report the group size, say what you cannot conclude, and look for a pattern across more than one source or more than one year before making a strong claim. Never present a figure from memory or invent a comparison."}},{"t":"h","c":{"en":"A five-step analysis routine","ar":"A five-step analysis routine"}},{"t":"steps","c":{"en":["Build the cohort list: students who have a result at both points, with notes on late joiners and absences.","Calculate the movement: score change or change in stanine, or movement from baseline band to current band.","Sort the cohort into groups: moved up, moved as expected, moved less than expected. Report the proportion in each using the school's proportion terms.","Break the result down by group: boys and girls, Emirati students, students of determination (SEND), gifted and talented students, English-language level groups, and by strand or topic.","Compare with the previous year or cohort and with the benchmark, then write down what the data does not show."],"ar":["Build the cohort list: students who have a result at both points, with notes on late joiners and absences.","Calculate the movement: score change or change in stanine, or movement from baseline band to current band.","Sort the cohort into groups: moved up, moved as expected, moved less than expected. Report the proportion in each using the school's proportion terms.","Break the result down by group: boys and girls, Emirati students, students of determination (SEND), gifted and talented students, English-language level groups, and by strand or topic.","Compare with the previous year or cohort and with the benchmark, then write down what the data does not show."]}},{"t":"table","head":{"en":["Proportion of students","Term to use in the SEF"],"ar":["Proportion of students","Term to use in the SEF"]},"rows":[{"en":["More than 90%","almost all"],"ar":["More than 90%","almost all"]},{"en":["75% to 90%","most"],"ar":["75% to 90%","most"]},{"en":["61% to 74%","a large majority"],"ar":["61% to 74%","a large majority"]},{"en":["50% to 60%","a majority"],"ar":["50% to 60%","a majority"]},{"en":["31% to 49%","a large minority"],"ar":["31% to 49%","a large minority"]},{"en":["16% to 30%","a minority"],"ar":["16% to 30%","a minority"]},{"en":["Up to 15%","few"],"ar":["Up to 15%","few"]}]},{"t":"p","c":{"en":"Use these bands exactly and give the figure beside the term, for example \"most students (78%)\". Where a percentage falls between bands because of rounding (for example 60.5%), decide a rule, apply it throughout the SEF and say so if it matters.","ar":"Use these bands exactly and give the figure beside the term, for example \"most students (78%)\". Where a percentage falls between bands because of rounding (for example 60.5%), decide a rule, apply it throughout the SEF and say so if it matters."}},{"t":"scenario","title":{"en":"Illustrative figures (not PEPS data): sorting a cohort","ar":"Illustrative figures (not PEPS data): sorting a cohort"},"c":{"en":"A Year 8 cohort of 80 students has GL scores in both Year 6 and Year 8. Movement: 20 students rose by more than 5 standardised points, 44 stayed within 5 points, and 16 fell by more than 5. \u003cstrong>Reading:\u003c/strong> 25% rose (a minority), 55% stayed about level (a majority), 20% fell (a minority). Staying about level on a standardised score means typical progress compared with the norm group, so the honest statement is that a majority made the progress expected, a minority made more, and a minority made less. The next question is who the 16 are. Replace these numbers with your own.","ar":"A Year 8 cohort of 80 students has GL scores in both Year 6 and Year 8. Movement: 20 students rose by more than 5 standardised points, 44 stayed within 5 points, and 16 fell by more than 5. \u003cstrong>Reading:\u003c/strong> 25% rose (a minority), 55% stayed about level (a majority), 20% fell (a minority). Staying about level on a standardised score means typical progress compared with the norm group, so the honest statement is that a majority made the progress expected, a minority made more, and a minority made less. The next question is who the 16 are. Replace these numbers with your own."}}],"checks":[{"id":"m2q1","q":{"en":"A HOD wants to show progress in Mathematics from Year 6 to Year 8 using GL Progress Tests. Which comparison is valid?","ar":"A HOD wants to show progress in Mathematics from Year 6 to Year 8 using GL Progress Tests. Which comparison is valid?"},"opts":[{"en":"This year's Year 8 average score compared with last year's Year 6 average score from the earlier cohort","ar":"This year's Year 8 average score compared with last year's Year 6 average score from the earlier cohort"},{"en":"This year's Year 8 average compared with the national average that was quoted in the school brochure","ar":"This year's Year 8 average compared with the national average that was quoted in the school brochure"},{"en":"The Year 8 term test marks compared with the Year 6 GL standardised scores for the same students","ar":"The Year 8 term test marks compared with the Year 6 GL standardised scores for the same students"},{"en":"The scores of the students who sat both the Year 6 and the Year 8 tests, treated as one cohort","ar":"The scores of the students who sat both the Year 6 and the Year 8 tests, treated as one cohort"}],"correct":3,"expl":{"en":"Progress needs the same students measured at two points on comparable measures. Different cohorts or different kinds of score do not answer the progress question.","ar":"Progress needs the same students measured at two points on comparable measures. Different cohorts or different kinds of score do not answer the progress question."}},{"id":"m2q2","q":{"en":"A Year 10 GL report shows a student's standardised score is about the same as in Year 8. What is the most accurate reading?","ar":"A Year 10 GL report shows a student's standardised score is about the same as in Year 8. What is the most accurate reading?"},"opts":[{"en":"Typical progress relative to the norm group over the period, which is a pointer to check against other evidence","ar":"Typical progress relative to the norm group over the period, which is a pointer to check against other evidence"},{"en":"No progress at all, because a score that does not rise shows the student has learned nothing new since Year 8 in the subject","ar":"No progress at all, because a score that does not rise shows the student has learned nothing new since Year 8 in the subject"},{"en":"Strong progress, because the student remained stable while the content became harder over the two years","ar":"Strong progress, because the student remained stable while the content became harder over the two years"},{"en":"A weak result, which should be reported as under-achievement in the department's SEF without more analysis","ar":"A weak result, which should be reported as under-achievement in the department's SEF without more analysis"}],"correct":0,"expl":{"en":"A steady standardised score means the student kept pace with the norm group, so learning has taken place. It is a prompt to look at other evidence, not a verdict.","ar":"A steady standardised score means the student kept pace with the norm group, so learning has taken place. It is a prompt to look at other evidence, not a verdict."}},{"id":"m2q3","q":{"en":"In a cohort of 120 students, 66 made the progress expected. Which sentence uses the school's proportion terms correctly?","ar":"In a cohort of 120 students, 66 made the progress expected. Which sentence uses the school's proportion terms correctly?"},"opts":[{"en":"A large majority of students (55%) made the progress expected","ar":"A large majority of students (55%) made the progress expected"},{"en":"A majority of students (55%) made the progress expected","ar":"A majority of students (55%) made the progress expected"},{"en":"Most students (55%) made the progress expected","ar":"Most students (55%) made the progress expected"},{"en":"A large minority of students (55%) made the progress expected","ar":"A large minority of students (55%) made the progress expected"}],"correct":1,"expl":{"en":"66 out of 120 is 55%, which falls in the 50% to 60% band: a majority.","ar":"66 out of 120 is 55%, which falls in the 50% to 60% band: a majority."}}]},{"id":"m3","title":{"en":"English (ESL) Department: Evidence and Narratives by Phase","ar":"English (ESL) Department: Evidence and Narratives by Phase"},"minutes":17,"blocks":[{"t":"p","c":{"en":"All PEPS students learn English as a second language, so the English department carries a special responsibility: progress in English affects progress in every other subject. English progress should be described in the strands your assessments report, such as reading, use of English (grammar and vocabulary), writing, and speaking and listening where you assess them. Check the current Cambridge and GL documents to see exactly which strands each report covers, and do not claim evidence for a strand that is not assessed.","ar":"All PEPS students learn English as a second language, so the English department carries a special responsibility: progress in English affects progress in every other subject. English progress should be described in the strands your assessments report, such as reading, use of English (grammar and vocabulary), writing, and speaking and listening where you assess them. Check the current Cambridge and GL documents to see exactly which strands each report covers, and do not claim evidence for a strand that is not assessed."}},{"t":"h","c":{"en":"Evidence and typical analyses for each phase","ar":"Evidence and typical analyses for each phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Baseline and ongoing teacher observation against the early-years curriculum; samples of talk, early reading and mark-making","Percentage of children who moved from the baseline stage to the end-of-year stage in listening, speaking, early reading and early writing; English-language level groups","Describing activities instead of movement; using one observation as proof; no baseline recorded"],"ar":["Phase 1: FS2","Baseline and ongoing teacher observation against the early-years curriculum; samples of talk, early reading and mark-making","Percentage of children who moved from the baseline stage to the end-of-year stage in listening, speaking, early reading and early writing; English-language level groups","Describing activities instead of movement; using one observation as proof; no baseline recorded"]},{"en":["Phase 2: Years 1 to 6","Unit and end-of-term assessments; reading levels; writing samples; GL Progress Test English (Years 4 and 6); Cambridge Primary Checkpoint ESL 0057 (Year 6); PIRLS-style work in Year 5","Year 4 to Year 6 GL cohort movement; Year 6 Checkpoint analysis report by skill; reading age or level change over the year; progress by language level","Only two GL points in the phase; Years 1 to 3 rely on internal assessment that needs moderation; mixing different tests"],"ar":["Phase 2: Years 1 to 6","Unit and end-of-term assessments; reading levels; writing samples; GL Progress Test English (Years 4 and 6); Cambridge Primary Checkpoint ESL 0057 (Year 6); PIRLS-style work in Year 5","Year 4 to Year 6 GL cohort movement; Year 6 Checkpoint analysis report by skill; reading age or level change over the year; progress by language level","Only two GL points in the phase; Years 1 to 3 rely on internal assessment that needs moderation; mixing different tests"]},{"en":["Phase 3: Years 7 to 9","GL Progress Test English (Year 8); Cambridge Lower Secondary Checkpoint ESL 0876 (Year 9); termly assessments; writing portfolios","Year 6 to Year 8 GL movement; Year 6 Checkpoint to Year 9 Checkpoint at cohort level, with cautions; strand comparison, for example reading compared with writing","Treating Checkpoint 6 to Checkpoint 9 as a precise gain; ignoring students who joined after Year 6"],"ar":["Phase 3: Years 7 to 9","GL Progress Test English (Year 8); Cambridge Lower Secondary Checkpoint ESL 0876 (Year 9); termly assessments; writing portfolios","Year 6 to Year 8 GL movement; Year 6 Checkpoint to Year 9 Checkpoint at cohort level, with cautions; strand comparison, for example reading compared with writing","Treating Checkpoint 6 to Checkpoint 9 as a precise gain; ignoring students who joined after Year 6"]},{"en":["Phase 4: Years 10 to 13","GL Progress Test English (Year 10); IGCSE English outcomes (check which syllabus the school enters); AS and A level outcomes where relevant; mock results; coursework and speaking assessments","Year 8 to Year 10 GL movement; GL Year 10 compared with final outcome; progress in mocks across the year; groups","Small groups in Years 12 and 13; confusing a high grade with progress; no starting point for late joiners"],"ar":["Phase 4: Years 10 to 13","GL Progress Test English (Year 10); IGCSE English outcomes (check which syllabus the school enters); AS and A level outcomes where relevant; mock results; coursework and speaking assessments","Year 8 to Year 10 GL movement; GL Year 10 compared with final outcome; progress in mocks across the year; groups","Small groups in Years 12 and 13; confusing a high grade with progress; no starting point for late joiners"]}]},{"t":"callout","k":"tip","title":{"en":"ESL-specific progress questions","ar":"ESL-specific progress questions"},"c":{"en":"Ask whether progress in vocabulary and reading is carrying into writing; whether newly arrived students are tracked separately from long-term students; and whether English-language level groups progress at the same rate. Students at an early language level may make fast progress from a low start, and the SEF should say so with figures, and also say whether they are catching up with their peers.","ar":"Ask whether progress in vocabulary and reading is carrying into writing; whether newly arrived students are tracked separately from long-term students; and whether English-language level groups progress at the same rate. Students at an early language level may make fast progress from a low start, and the SEF should say so with figures, and also say whether they are catching up with their peers."}},{"t":"h","c":{"en":"What to look at in books and lessons","ar":"What to look at in books and lessons"}},{"t":"list","c":{"en":["Writing over time: choose one student from each language-level group and compare a September piece with a recent piece for sentence control, vocabulary range, organisation and accuracy.","Reading: whether students move up reading levels at the expected rate, and whether their answers show inference and not just retrieval.","Feedback: whether students act on teacher feedback and whether the same errors continue in later pieces.","Talk: whether students speak in longer, more accurate sentences by the end of the term, and whether lessons give every student time to speak."],"ar":["Writing over time: choose one student from each language-level group and compare a September piece with a recent piece for sentence control, vocabulary range, organisation and accuracy.","Reading: whether students move up reading levels at the expected rate, and whether their answers show inference and not just retrieval.","Feedback: whether students act on teacher feedback and whether the same errors continue in later pieces.","Talk: whether students speak in longer, more accurate sentences by the end of the term, and whether lessons give every student time to speak."]}},{"t":"h","c":{"en":"Worked mini-example: Phase 3 English","ar":"Worked mini-example: Phase 3 English"}},{"t":"callout","k":"warn","title":{"en":"Illustrative figures (not PEPS data)","ar":"Illustrative figures (not PEPS data)"},"c":{"en":"The numbers below are made up to show the writing method. Replace them with your own data and do not copy the wording.","ar":"The numbers below are made up to show the writing method. Replace them with your own data and do not copy the wording."}},{"t":"p","c":{"en":"\u003cstrong>PHASE 3: JUDGEMENT (draft).\u003c/strong> \"In Years 7 to 9, most students (79%) in the Year 6 to Year 8 GL cohort of 96 students made the progress expected in English, with standardised scores staying within 5 points of their Year 6 result or rising. A minority (22%) rose by more than 5 points, mainly in reading. A minority (21%) fell by more than 5 points. Writing scores moved less than reading scores, and in the Year 8 work scrutiny only a large minority of the sampled books (40%) showed students correcting the same error across two pieces. Students of determination made progress similar to their peers, but the sample is small (12 students) and the result should be read with caution. Boys' writing progress was lower than girls' by 6 points on average. Next steps focus on writing, on boys' writing, and on students whose scores fell.\"","ar":"\u003cstrong>PHASE 3: JUDGEMENT (draft).\u003c/strong> \"In Years 7 to 9, most students (79%) in the Year 6 to Year 8 GL cohort of 96 students made the progress expected in English, with standardised scores staying within 5 points of their Year 6 result or rising. A minority (22%) rose by more than 5 points, mainly in reading. A minority (21%) fell by more than 5 points. Writing scores moved less than reading scores, and in the Year 8 work scrutiny only a large minority of the sampled books (40%) showed students correcting the same error across two pieces. Students of determination made progress similar to their peers, but the sample is small (12 students) and the result should be read with caution. Boys' writing progress was lower than girls' by 6 points on average. Next steps focus on writing, on boys' writing, and on students whose scores fell.\""}},{"t":"p","c":{"en":"Notice what the paragraph does: it gives the cohort size, uses a proportion term with a figure, names the strand where progress is weaker, names groups, states a limit of the data, and ends with a direction for improvement. Check the arithmetic too: here the 79% who made the progress expected (stayed level or rose) and the 21% who fell add up to 100%, and the 22% who rose by more than 5 points are a part of the 79%.","ar":"Notice what the paragraph does: it gives the cohort size, uses a proportion term with a figure, names the strand where progress is weaker, names groups, states a limit of the data, and ends with a direction for improvement. Check the arithmetic too: here the 79% who made the progress expected (stayed level or rose) and the 21% who fell add up to 100%, and the 22% who rose by more than 5 points are a part of the 79%."}},{"t":"scenario","title":{"en":"Scenario: a weak draft","ar":"Scenario: a weak draft"},"c":{"en":"A draft reads: \"Progress in English in Phase 2 is good because students enjoy reading and teachers use a range of strategies.\" \u003cstrong>What is wrong?\u003c/strong> The draft says nothing about movement, gives no proportion, no starting point, no group and no source. Enjoyment and strategies are inputs; they are not evidence of progress. A better start would be: \"Most Year 6 students (81%) improved their GL English standardised score or kept it within 5 points of Year 4, and the Checkpoint ESL analysis report shows reading stronger than writing.\"","ar":"A draft reads: \"Progress in English in Phase 2 is good because students enjoy reading and teachers use a range of strategies.\" \u003cstrong>What is wrong?\u003c/strong> The draft says nothing about movement, gives no proportion, no starting point, no group and no source. Enjoyment and strategies are inputs; they are not evidence of progress. A better start would be: \"Most Year 6 students (81%) improved their GL English standardised score or kept it within 5 points of Year 4, and the Checkpoint ESL analysis report shows reading stronger than writing.\""}},{"t":"callout","k":"warn","title":{"en":"Common English department pitfalls","ar":"Common English department pitfalls"},"c":{"en":"Using reading level alone as proof of progress in all English strands; leaving out students who joined late; saying \"progress is strong in speaking\" when speaking is only judged by informal teacher impression; writing identical statements for Phase 2 and Phase 3.","ar":"Using reading level alone as proof of progress in all English strands; leaving out students who joined late; saying \"progress is strong in speaking\" when speaking is only judged by informal teacher impression; writing identical statements for Phase 2 and Phase 3."}}],"checks":[{"id":"m3q1","q":{"en":"For Phase 1 (FS2) English, which statement is the strongest evidence of progress?","ar":"For Phase 1 (FS2) English, which statement is the strongest evidence of progress?"},"opts":[{"en":"Children took part in daily phonics sessions and the teachers used rich stories and songs throughout the year","ar":"Children took part in daily phonics sessions and the teachers used rich stories and songs throughout the year"},{"en":"The FS2 classrooms displayed a wide range of print and the children enjoyed the book corner every morning and at the end of the day","ar":"The FS2 classrooms displayed a wide range of print and the children enjoyed the book corner every morning and at the end of the day"},{"en":"The baseline and end-of-year observation records show how many children moved on in early reading and speaking","ar":"The baseline and end-of-year observation records show how many children moved on in early reading and speaking"},{"en":"The FS2 team attended training on early language and shared planning each week with the Year 1 teachers","ar":"The FS2 team attended training on early language and shared planning each week with the Year 1 teachers"}],"correct":2,"expl":{"en":"Only records that compare the starting stage with a later stage show movement. The other options describe activities or inputs.","ar":"Only records that compare the starting stage with a later stage show movement. The other options describe activities or inputs."}},{"id":"m3q2","q":{"en":"A Phase 3 HOD compares Year 6 Checkpoint ESL scores with Year 9 Checkpoint ESL scores for the same cohort. How should the result be presented?","ar":"A Phase 3 HOD compares Year 6 Checkpoint ESL scores with Year 9 Checkpoint ESL scores for the same cohort. How should the result be presented?"},"opts":[{"en":"As an exact measure of each student's gain, because both tests use the same 0.0 to 6.0 scale of scores","ar":"As an exact measure of each student's gain, because both tests use the same 0.0 to 6.0 scale of scores"},{"en":"As proof of the department's impact, because Checkpoint results are marked by an external body and are reliable","ar":"As proof of the department's impact, because Checkpoint results are marked by an external body and are reliable"},{"en":"As unusable evidence, because tests taken three years apart cannot be compared at all, even for a whole cohort","ar":"As unusable evidence, because tests taken three years apart cannot be compared at all, even for a whole cohort"},{"en":"As a cohort-level comparison with stated cautions, such as different tests, content and students who joined after Year 6","ar":"As a cohort-level comparison with stated cautions, such as different tests, content and students who joined after Year 6"}],"correct":3,"expl":{"en":"The tests share a scale but differ in content and level, so the comparison is a cautious cohort-level pointer and not an individual gain.","ar":"The tests share a scale but differ in content and level, so the comparison is a cautious cohort-level pointer and not an individual gain."}},{"id":"m3q3","q":{"en":"A HOD writes \"Progress is strong in speaking\" based on a general feeling from lessons. What is the best response?","ar":"A HOD writes \"Progress is strong in speaking\" based on a general feeling from lessons. What is the best response?"},"opts":[{"en":"Add a speaking assessment or recorded evidence with a baseline, or remove the claim until evidence is available","ar":"Add a speaking assessment or recorded evidence with a baseline, or remove the claim until evidence is available"},{"en":"Keep the sentence because the HOD is an experienced teacher and the lessons are visited regularly by other leaders","ar":"Keep the sentence because the HOD is an experienced teacher and the lessons are visited regularly by other leaders"},{"en":"Keep the sentence but replace \"strong\" with \"very strong\" to match the Phase 4 narrative","ar":"Keep the sentence but replace \"strong\" with \"very strong\" to match the Phase 4 narrative"},{"en":"Move the sentence to the steps for improvement section so that it no longer needs any evidence","ar":"Move the sentence to the steps for improvement section so that it no longer needs any evidence"}],"correct":0,"expl":{"en":"A claim needs evidence. Without a recorded baseline and later comparison, the claim should be supported properly or left out.","ar":"A claim needs evidence. Without a recorded baseline and later comparison, the claim should be supported properly or left out."}}]},{"id":"m4","title":{"en":"Mathematics Department: Evidence and Narratives by Phase","ar":"Mathematics Department: Evidence and Narratives by Phase"},"minutes":17,"blocks":[{"t":"p","c":{"en":"Mathematics progress is cumulative: a gap in fractions in Year 5 can limit algebra in Year 8. Strong SEF writing in mathematics therefore looks at strands (for example number, algebra, geometry and measure, statistics and probability) as well as overall scores, and asks whether students' fluency, reasoning and problem solving are all moving, not only recall of methods.","ar":"Mathematics progress is cumulative: a gap in fractions in Year 5 can limit algebra in Year 8. Strong SEF writing in mathematics therefore looks at strands (for example number, algebra, geometry and measure, statistics and probability) as well as overall scores, and asks whether students' fluency, reasoning and problem solving are all moving, not only recall of methods."}},{"t":"h","c":{"en":"Evidence and typical analyses for each phase","ar":"Evidence and typical analyses for each phase"}},{"t":"table","head":{"en":["Phase","Main data sources","Typical analyses","Common pitfalls"],"ar":["Phase","Main data sources","Typical analyses","Common pitfalls"]},"rows":[{"en":["Phase 1: FS2","Baseline and ongoing observation of early number, shape, measure and pattern against the early-years curriculum","Proportion of children who moved from baseline to end-of-year stage in counting, number sense and shape; groups by language level","Counting rote recitation as number understanding; no baseline; one observation as proof"],"ar":["Phase 1: FS2","Baseline and ongoing observation of early number, shape, measure and pattern against the early-years curriculum","Proportion of children who moved from baseline to end-of-year stage in counting, number sense and shape; groups by language level","Counting rote recitation as number understanding; no baseline; one observation as proof"]},{"en":["Phase 2: Years 1 to 6","Unit and termly tests; GL Progress Test Mathematics (Years 4 and 6); Cambridge Primary Checkpoint Mathematics 0096 (Year 6); TIMSS-style items at Year 5","Year 4 to Year 6 GL movement; Checkpoint analysis report by topic; strand analysis (number against geometry and measure); groups","Only two GL points; Years 1 to 3 depend on internal tests; comparing different test papers as if equal"],"ar":["Phase 2: Years 1 to 6","Unit and termly tests; GL Progress Test Mathematics (Years 4 and 6); Cambridge Primary Checkpoint Mathematics 0096 (Year 6); TIMSS-style items at Year 5","Year 4 to Year 6 GL movement; Checkpoint analysis report by topic; strand analysis (number against geometry and measure); groups","Only two GL points; Years 1 to 3 depend on internal tests; comparing different test papers as if equal"]},{"en":["Phase 3: Years 7 to 9","GL Progress Test Mathematics (Year 8); Cambridge Lower Secondary Checkpoint Mathematics 0862 (Year 9); unit tests; TIMSS Grade 8 style items at Year 9","Year 6 to Year 8 GL movement; Year 6 to Year 9 Checkpoint comparison at cohort level, with cautions; algebra and number strands; groups","Treating the Checkpoint comparison as an exact gain; strand weaknesses hidden by a total score"],"ar":["Phase 3: Years 7 to 9","GL Progress Test Mathematics (Year 8); Cambridge Lower Secondary Checkpoint Mathematics 0862 (Year 9); unit tests; TIMSS Grade 8 style items at Year 9","Year 6 to Year 8 GL movement; Year 6 to Year 9 Checkpoint comparison at cohort level, with cautions; algebra and number strands; groups","Treating the Checkpoint comparison as an exact gain; strand weaknesses hidden by a total score"]},{"en":["Phase 4: Years 10 to 13","GL Progress Test Mathematics (Year 10); IGCSE Mathematics 0580 (Extended tier by default); Pearson Edexcel International AS and A level Mathematics; mock exams; PISA-style items at Years 10 and 11","Year 8 GL to Year 10 GL movement; GL Year 10 against IGCSE outcomes; Year 12 and 13 outcomes against starting points; mocks across the year","Small AS and A level groups; ignoring tier decisions; treating a grade as progress without a starting point"],"ar":["Phase 4: Years 10 to 13","GL Progress Test Mathematics (Year 10); IGCSE Mathematics 0580 (Extended tier by default); Pearson Edexcel International AS and A level Mathematics; mock exams; PISA-style items at Years 10 and 11","Year 8 GL to Year 10 GL movement; GL Year 10 against IGCSE outcomes; Year 12 and 13 outcomes against starting points; mocks across the year","Small AS and A level groups; ignoring tier decisions; treating a grade as progress without a starting point"]}]},{"t":"callout","k":"tip","title":{"en":"Strand analysis shows where progress stalls","ar":"Strand analysis shows where progress stalls"},"c":{"en":"A total score can hide a pattern. If the GL strand report or the Checkpoint analysis report shows that number is secure but geometry or statistics lags in several year groups, your SEF narrative can name the strand and your steps for improvement can target it. This is far more useful than \"mathematics progress is good\".","ar":"A total score can hide a pattern. If the GL strand report or the Checkpoint analysis report shows that number is secure but geometry or statistics lags in several year groups, your SEF narrative can name the strand and your steps for improvement can target it. This is far more useful than \"mathematics progress is good\"."}},{"t":"h","c":{"en":"What to look at in books and lessons","ar":"What to look at in books and lessons"}},{"t":"list","c":{"en":["Fluency: whether students use efficient written methods with fewer errors than earlier in the year.","Reasoning and problem solving: whether students explain and justify, not only calculate, and whether they apply methods to unfamiliar contexts.","Misconceptions: whether common errors (for example place value or negative numbers) are corrected and do not return in later work.","Challenge: whether students who already understand a topic receive harder tasks, so that high attainers do not stand still."],"ar":["Fluency: whether students use efficient written methods with fewer errors than earlier in the year.","Reasoning and problem solving: whether students explain and justify, not only calculate, and whether they apply methods to unfamiliar contexts.","Misconceptions: whether common errors (for example place value or negative numbers) are corrected and do not return in later work.","Challenge: whether students who already understand a topic receive harder tasks, so that high attainers do not stand still."]}},{"t":"h","c":{"en":"Phase 4: tier and course decisions","ar":"Phase 4: tier and course decisions"}},{"t":"p","c":{"en":"In Years 10 and 11 the IGCSE Mathematics 0580 Extended tier is the default. If some students are entered for the Core tier, the SEF should say how many and why, and should compare their progress fairly. In Years 12 and 13 cohorts are small, so use words carefully: a few students can change a percentage a great deal. Give the number of students next to the percentage, and look at several years if you have them.","ar":"In Years 10 and 11 the IGCSE Mathematics 0580 Extended tier is the default. If some students are entered for the Core tier, the SEF should say how many and why, and should compare their progress fairly. In Years 12 and 13 cohorts are small, so use words carefully: a few students can change a percentage a great deal. Give the number of students next to the percentage, and look at several years if you have them."}},{"t":"h","c":{"en":"Worked mini-example: Phase 4 Mathematics","ar":"Worked mini-example: Phase 4 Mathematics"}},{"t":"callout","k":"warn","title":{"en":"Illustrative figures (not PEPS data)","ar":"Illustrative figures (not PEPS data)"},"c":{"en":"All numbers below are made up. Replace them with your own and do not copy the wording.","ar":"All numbers below are made up. Replace them with your own and do not copy the wording."}},{"t":"p","c":{"en":"\u003cstrong>PHASE 4: JUDGEMENT (draft).\u003c/strong> \"In Years 10 and 11, a large majority of the cohort (70%, 56 of 80 students) kept or raised their GL Mathematics standardised score between Year 8 and Year 10, which is typical or better progress against the norm group. A minority (22%) rose by more than 5 points. A minority (30%) fell, and the strand report shows these students were weakest in algebra. In the Year 11 mock, most students (78%) reached their target band, compared with 71% last year. Girls made slightly more progress than boys (average change plus 3 points compared with plus 1). Students of determination in the sample (8 students) made progress in line with their peers, but the group is small. Work scrutiny of a sample of 24 books showed a majority (58%) of students correcting errors after feedback.\"","ar":"\u003cstrong>PHASE 4: JUDGEMENT (draft).\u003c/strong> \"In Years 10 and 11, a large majority of the cohort (70%, 56 of 80 students) kept or raised their GL Mathematics standardised score between Year 8 and Year 10, which is typical or better progress against the norm group. A minority (22%) rose by more than 5 points. A minority (30%) fell, and the strand report shows these students were weakest in algebra. In the Year 11 mock, most students (78%) reached their target band, compared with 71% last year. Girls made slightly more progress than boys (average change plus 3 points compared with plus 1). Students of determination in the sample (8 students) made progress in line with their peers, but the group is small. Work scrutiny of a sample of 24 books showed a majority (58%) of students correcting errors after feedback.\""}},{"t":"p","c":{"en":"This paragraph names the cohort size, gives the proportion terms with figures, compares with last year, names the weak strand, names groups with a caution about group size, and links to work in books. Check that the percentages you quote for the same movement are consistent with each other before you submit.","ar":"This paragraph names the cohort size, gives the proportion terms with figures, compares with last year, names the weak strand, names groups with a caution about group size, and links to work in books. Check that the percentages you quote for the same movement are consistent with each other before you submit."}},{"t":"scenario","title":{"en":"Scenario: high marks, low movement","ar":"Scenario: high marks, low movement"},"c":{"en":"A Year 9 class has Checkpoint Mathematics results above the school's target. A scrutiny shows the students did the same style of exercise all year and the GL strand report shows almost no change from Year 8. \u003cstrong>Is progress strong?\u003c/strong> Not necessarily. The attainment is high, but the evidence of movement is thin and challenge is limited. A fair statement would be that attainment is high and progress is acceptable or not yet secure, and a step for improvement would address challenge and reasoning for high attainers.","ar":"A Year 9 class has Checkpoint Mathematics results above the school's target. A scrutiny shows the students did the same style of exercise all year and the GL strand report shows almost no change from Year 8. \u003cstrong>Is progress strong?\u003c/strong> Not necessarily. The attainment is high, but the evidence of movement is thin and challenge is limited. A fair statement would be that attainment is high and progress is acceptable or not yet secure, and a step for improvement would address challenge and reasoning for high attainers."}},{"t":"callout","k":"warn","title":{"en":"Common Mathematics department pitfalls","ar":"Common Mathematics department pitfalls"},"c":{"en":"Reporting only overall grades and not strands; confusing a good mock result with progress; leaving out students who changed tier; claiming progress in problem solving when tests mainly assess routine methods.","ar":"Reporting only overall grades and not strands; confusing a good mock result with progress; leaving out students who changed tier; claiming progress in problem solving when tests mainly assess routine methods."}}],"checks":[{"id":"m4q1","q":{"en":"A Phase 2 Mathematics narrative says: \"Progress is good because students complete many exercises.\" Which improvement makes it a SEF-style statement?","ar":"A Phase 2 Mathematics narrative says: \"Progress is good because students complete many exercises.\" Which improvement makes it a SEF-style statement?"},"opts":[{"en":"Add the number of exercises completed by each class each week and a comment on how neat the books are","ar":"Add the number of exercises completed by each class each week and a comment on how neat the books are"},{"en":"Add the Year 4 to Year 6 GL movement, the proportion of students in each movement group and a named strand","ar":"Add the Year 4 to Year 6 GL movement, the proportion of students in each movement group and a named strand"},{"en":"Add a sentence on the quality of the displays and the resources in the Year 5 and Year 6 classrooms","ar":"Add a sentence on the quality of the displays and the resources in the Year 5 and Year 6 classrooms"},{"en":"Add the list of topics covered in the Year 6 scheme of work, with the dates on which each unit was taught, which shows full coverage","ar":"Add the list of topics covered in the Year 6 scheme of work, with the dates on which each unit was taught, which shows full coverage"}],"correct":1,"expl":{"en":"Progress is shown by movement from a starting point, with a proportion and a strand. Coverage, display and neatness are inputs.","ar":"Progress is shown by movement from a starting point, with a proportion and a strand. Coverage, display and neatness are inputs."}},{"id":"m4q2","q":{"en":"In a Year 12 class of 9 students, 3 made less progress than expected. How should this be reported?","ar":"In a Year 12 class of 9 students, 3 made less progress than expected. How should this be reported?"},"opts":[{"en":"Say \"a large minority\" only, because a proportion term alone is enough and is easier for the reader to follow","ar":"Say \"a large minority\" only, because a proportion term alone is enough and is easier for the reader to follow"},{"en":"Leave it out of the SEF, since a group of 9 students is too small for the department to report","ar":"Leave it out of the SEF, since a group of 9 students is too small for the department to report"},{"en":"Give the numbers (3 of 9) alongside any proportion term, and note the small group size","ar":"Give the numbers (3 of 9) alongside any proportion term, and note the small group size"},{"en":"Say \"few students\", because the number of students is less than ten and so falls into the lowest band","ar":"Say \"few students\", because the number of students is less than ten and so falls into the lowest band"}],"correct":2,"expl":{"en":"With small groups, percentages can mislead. Showing numbers and stating the limit is honest and clear.","ar":"With small groups, percentages can mislead. Showing numbers and stating the limit is honest and clear."}},{"id":"m4q3","q":{"en":"The Checkpoint analysis report shows Year 9 students are secure in number but weak in statistics. What is the best use?","ar":"The Checkpoint analysis report shows Year 9 students are secure in number but weak in statistics. What is the best use?"},"opts":[{"en":"Leave it out of the SEF because the overall Checkpoint score is above the school's target and shows high attainment","ar":"Leave it out of the SEF because the overall Checkpoint score is above the school's target and shows high attainment"},{"en":"Mention only the strand of number, since the SEF should
